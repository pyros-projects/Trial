<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hydraulic Erosion Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1319'/%3E%3Cpath d='M3 25 L11 12 L16 18 L21 9 L29 25 Z' fill='%23f2a649'/%3E%3Cpath d='M3 25 Q12 21 16 23 T29 25' stroke='%2343c3d6' stroke-width='2.5' fill='none'/%3E%3C/svg%3E">
<meta name="description" content="Real-time 3D hydraulic erosion laboratory: shallow-water pipe model, sediment transport, thermal erosion and terrain editing in one self-contained file.">
<style>
:root {
  --bg: #0a0d11;
  --panel: rgba(14, 18, 24, 0.9);
  --panel-solid: #0f1319;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.16);
  --text: #d9dfe6;
  --muted: #8793a0;
  --faint: #5d6874;
  --accent: #f2a649;
  --accent-dim: rgba(242, 166, 73, 0.16);
  --water: #43c3d6;
  --good: #6fd08c;
  --warn: #f2c14e;
  --bad: #ff6b5b;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --panel-w: 318px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 var(--sans); overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
#app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr var(--panel-w); }
#stage { position: relative; min-width: 0; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: crosshair; }
#view.nav { cursor: grab; }
#view.dragging { cursor: grabbing; }

/* ---------- overlays ---------- */
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
#topbar { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 6px; padding: 4px; z-index: 3; max-width: calc(100% - 20px); }
#modes { display: flex; gap: 2px; }
#modes button { background: transparent; border: 0; border-radius: 7px; padding: 5px 9px; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: 12px; }
#modes button:hover { color: var(--text); background: rgba(255,255,255,0.05); }
#modes button[aria-pressed="true"] { background: var(--accent-dim); color: var(--accent); }
#modeSelect { display: none; background: var(--panel-solid); border: 1px solid var(--line-strong); border-radius: 7px; padding: 5px 8px; }
.kbd { font: 10px var(--mono); color: var(--faint); margin-left: 3px; }

#hud { position: absolute; top: 10px; left: 64px; z-index: 2; padding: 8px 10px; font: 11.5px/1.5 var(--mono); min-width: 232px; pointer-events: auto; }
#hud .hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 3px; }
#hud .title { font: 600 11px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
#hud .grid { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; }
#hud .k { color: var(--muted); }
#hud .v { text-align: right; font-variant-numeric: tabular-nums; }
#hud .chip { font: 600 10px var(--mono); padding: 1px 6px; border-radius: 99px; background: rgba(111,208,140,0.15); color: var(--good); }
#hud .chip.paused { background: rgba(242,193,78,0.15); color: var(--warn); }
#hud .chip.bad { background: rgba(255,107,91,0.18); color: var(--bad); }
#hud .stab.ok { color: var(--good); } #hud .stab.warn { color: var(--warn); } #hud .stab.bad { color: var(--bad); }
#hudToggle { display: none; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0 2px; }
#hud.collapsed .grid .x { display: none; }

#toolbar { position: absolute; left: 10px; top: 10px; z-index: 2; display: flex; flex-direction: column; gap: 2px; padding: 4px; }
#toolbar button { width: 38px; height: 38px; display: grid; place-items: center; background: transparent; border: 0; border-radius: 8px; color: var(--muted); cursor: pointer; position: relative; }
#toolbar button:hover { background: rgba(255,255,255,0.06); color: var(--text); }
#toolbar button[aria-pressed="true"] { background: var(--accent-dim); color: var(--accent); }
#toolbar svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#toolbar .sep { height: 1px; background: var(--line); margin: 3px 4px; }

#legend { position: absolute; left: 10px; bottom: 10px; z-index: 2; padding: 8px 10px; width: 240px; }
#legend .lt { font-weight: 600; font-size: 12px; margin-bottom: 5px; display: flex; justify-content: space-between; gap: 8px; }
#legend .lt span:last-child { color: var(--muted); font-weight: 400; font-size: 11px; }
#legendBar { height: 10px; border-radius: 3px; border: 1px solid var(--line); }
#legendWheel { display: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
#legend .lr { display: flex; justify-content: space-between; font: 10.5px var(--mono); color: var(--muted); margin-top: 3px; }
#legend .note { font-size: 11px; color: var(--muted); margin-top: 4px; }
#legend .flow { display: none; gap: 10px; align-items: center; }

#probe { position: absolute; right: 10px; bottom: 10px; z-index: 2; padding: 8px 10px; width: 250px; font: 11.5px/1.5 var(--mono); }
#probe .pt { font: 600 12px var(--sans); display: flex; justify-content: space-between; margin-bottom: 2px; }
#probe .pt span:last-child { font: 400 11px var(--sans); color: var(--muted); }
#probe .grid { display: grid; grid-template-columns: auto 1fr; column-gap: 10px; }
#probe .k { color: var(--muted); }
#probe .v { text-align: right; font-variant-numeric: tabular-nums; }
#probe .empty { color: var(--muted); font-family: var(--sans); }

#hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 1; font-size: 11px; color: var(--muted); padding: 4px 10px; white-space: nowrap; pointer-events: none; }
#toast { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); z-index: 5; padding: 7px 12px; font-size: 12.5px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: min(520px, calc(100% - 24px)); text-align: center; }
#toast.show { opacity: 1; }
#toast.err { border-color: rgba(255,107,91,0.5); color: #ffd2cc; }
#fatal { position: absolute; inset: 0; display: none; place-items: center; z-index: 10; padding: 24px; text-align: center; }
#fatal .box { max-width: 460px; padding: 18px; }

/* ---------- control panel ---------- */
#panel { background: var(--panel-solid); border-left: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; z-index: 4; }
#panel header { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel-solid); z-index: 1; }
#panel h1 { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; margin: 0 0 8px; font-weight: 700; }
#panel h1 small { color: var(--muted); font-weight: 400; letter-spacing: 0.02em; text-transform: none; margin-left: 6px; }
.transport { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1fr; gap: 5px; }
.btn { background: rgba(255,255,255,0.05); border: 1px solid var(--line-strong); border-radius: 7px; padding: 6px 8px; cursor: pointer; white-space: nowrap; font-size: 12px; }
.btn:hover { background: rgba(255,255,255,0.1); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: #1b1206; border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn:focus-visible, #modes button:focus-visible, #toolbar button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
details.sec { border-bottom: 1px solid var(--line); }
details.sec > summary { list-style: none; cursor: pointer; padding: 10px 14px; font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: "+"; color: var(--faint); }
details.sec[open] > summary::after { content: "–"; }
details.sec > summary:hover { color: var(--text); }
.body { padding: 0 14px 12px; }
.row { display: grid; grid-template-columns: 104px 1fr 64px; align-items: center; gap: 8px; min-height: 26px; }
.row label { color: var(--muted); font-size: 12px; cursor: default; user-select: none; }
.row output { font: 11.5px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.row select, .row input[type="number"] { width: 100%; background: #151b23; border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 6px; }
.row .span2 { grid-column: 2 / span 2; display: flex; gap: 6px; }
.row .span2 input { flex: 1; min-width: 0; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: #29313b; border-radius: 3px; }
input[type="range"]::-moz-range-track { height: 3px; background: #29313b; border-radius: 3px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--text); margin-top: -5px; border: 2px solid var(--panel-solid); box-shadow: 0 0 0 1px var(--line-strong); }
input[type="range"]::-moz-range-thumb { width: 11px; height: 11px; border-radius: 50%; background: var(--text); border: 2px solid var(--panel-solid); }
input[type="range"]:hover::-webkit-slider-thumb { background: var(--accent); }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 6px; }
.checks label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; cursor: pointer; }
.checks input { accent-color: var(--accent); }
.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.preset { text-align: left; background: rgba(255,255,255,0.035); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; cursor: pointer; }
.preset:hover { border-color: var(--line-strong); background: rgba(255,255,255,0.06); }
.preset[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-dim); }
.preset b { display: block; font-size: 12px; font-weight: 600; }
.preset span { font-size: 11px; color: var(--muted); }
.preset.wide { grid-column: span 2; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btnrow .btn { flex: 1; }
.help { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.help kbd { font: 10.5px var(--mono); background: #1a212a; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--text); }
.help p { margin: 6px 0; }
#sheetToggle { display: none; }

/* ---------- narrow screens: bottom sheet ---------- */
@media (max-width: 1100px) { #hint { display: none; } }
@media (max-width: 820px) {
  #app { grid-template-columns: 1fr; }
  #panel { position: fixed; left: 0; right: 0; bottom: 0; height: min(62vh, 560px); border-left: 0; border-top: 1px solid var(--line-strong); border-radius: 14px 14px 0 0; transform: translateY(100%); transition: transform .25s ease; box-shadow: 0 -12px 40px rgba(0,0,0,0.5); }
  #panel.open { transform: translateY(0); }
  #sheetToggle { display: block; position: fixed; right: 8px; bottom: 8px; z-index: 6; transition: bottom .25s ease; }
  #sheetToggle.open { bottom: calc(min(62vh, 560px) + 8px); }
  #topbar { top: 8px; left: auto; right: 8px; transform: none; }
  #modes { display: none; }
  #modeSelect { display: block; }
  #hud { top: 8px; left: 8px; min-width: 0; width: 212px; font-size: 10px; padding: 6px 8px; }
  #hud .grid { column-gap: 6px; }
  #hudToggle { display: inline; }
  #toolbar { top: auto; bottom: 92px; left: 8px; right: 8px; transform: none; flex-direction: row; justify-content: space-between; overflow-x: auto; }
  #toolbar button { width: 36px; height: 36px; flex: none; }
  #toolbar .sep { width: 1px; height: auto; margin: 4px 2px; }
  #legend { left: 8px; bottom: 8px; width: 210px; padding: 6px 8px; }
  #legend .lt span:last-child { display: none; }
  #legend .note { display: none; }
  #probe { right: 8px; top: 52px; bottom: auto; width: 152px; font-size: 10px; padding: 6px 8px; }
  #probe .pt span:last-child { display: none; }
  #probe .x { display: none; }
  #hint { display: none; }
}
@media (max-width: 820px) and (max-height: 500px) {
  #toolbar { bottom: 8px; left: 190px; right: 120px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="view" tabindex="0" aria-label="3D terrain view. Left drag uses the active tool, right drag orbits, middle drag pans, wheel zooms."></canvas>

    <div id="topbar" class="glass" role="group" aria-label="Visualization mode">
      <div id="modes"></div>
      <select id="modeSelect" aria-label="Visualization mode"></select>
    </div>

    <div id="hud" class="glass" aria-live="off">
      <div class="hd"><span class="title">Status</span><span id="hudState" class="chip">RUNNING</span><button id="hudToggle" aria-label="Toggle status details" aria-expanded="false">▾</button></div>
      <div class="grid" id="hudGrid"></div>
    </div>

    <div id="toolbar" class="glass" role="toolbar" aria-label="Terrain tools"></div>

    <div id="legend" class="glass" aria-label="Colour legend">
      <div class="lt"><span id="legendTitle">Shaded terrain</span><span id="legendUnit"></span></div>
      <div class="flow" id="legendFlow"><div id="legendWheel"></div><div class="note" id="legendFlowNote"></div></div>
      <div id="legendBar"></div>
      <div class="lr"><span id="legendMin"></span><span id="legendMid"></span><span id="legendMax"></span></div>
      <div class="note" id="legendNote"></div>
    </div>

    <div id="probe" class="glass" aria-live="off">
      <div class="pt"><span id="probeTitle">Probe</span><span id="probeSrc">hover terrain</span></div>
      <div class="grid" id="probeGrid"><span class="empty" style="grid-column: span 2">Hover the terrain or use the Inspect tool to pin a probe.</span></div>
    </div>

    <div id="hint" class="glass">LMB tool · RMB orbit · MMB pan · wheel zoom</div>
    <div id="toast" class="glass" role="status" aria-live="polite"></div>
    <button id="sheetToggle" class="btn primary" aria-controls="panel" aria-expanded="false">Controls</button>
    <div id="fatal"><div class="box glass"><h2>WebGL2 unavailable</h2><p id="fatalMsg"></p></div></div>
  </div>

  <aside id="panel" aria-label="Simulation controls">
    <header>
      <h1>Erosion Lab<small>hydraulic · thermal · 3D</small></h1>
      <div class="transport">
        <button class="btn primary" id="btnPause" title="Pause / resume (Space)">Pause</button>
        <button class="btn" id="btnStep" title="Advance one simulation step (N)">Step</button>
        <button class="btn" id="btnReset" title="Restore the initial terrain of this run (R)">Reset</button>
        <button class="btn" id="btnRegen" title="Generate terrain from seed + terrain parameters (G)">Regen</button>
      </div>
    </header>
    <div id="sections"></div>
  </aside>
</div>
<input type="file" id="importFile" accept=".json,application/json" hidden aria-label="Import simulation state JSON">
<script id="sim-core">
// ===== SIM CORE (pure JS, no DOM) =====
const LabCore = (() => {
  'use strict';
  const WORLD = 512;            // domain width in metres
  const G = 9.81;
  const BASE_DT = 0.05;         // seconds per step at speed 1
  const RAIN_UNIT = 2e-4;       // m/s of rain per slider unit
  const EVAP_UNIT = 2e-3;       // 1/s evaporation per slider unit
  const DCAP = 0.4;             // depth where carrying capacity saturates (m)
  const DMIN_V = 0.02;          // min depth used when converting flux to velocity (m)
  const DDRY = 1e-6;            // below this a cell counts as dry (m)
  const VMAX = 25;              // velocity clamp (m/s)
  const MIN_TILT = 0.05;        // min sin(slope) in capacity formula
  const CMAX = 0.4;             // max volumetric sediment concentration carried by the flow
  const FLUX_DAMP = 0.998;      // pipe-flux memory damping per step
  const FRICTION = 0.04;        // Chezy bed-friction coefficient
  const DMIN_F = 0.005;         // min depth in the friction term (m)
  const WET_DEPTH = 0.01, WET_GAIN = 0.5, WET_LOSS = 0.01;
  const RECENT_TAU = 8;
  const BED_DIFF = 0.4;         // 1/s, submerged bed diffusion         // s, decay time of the recent-change field
  const H_MIN = -300, H_MAX = 800, D_MAX = 200;
  const STRATA_N = 1024, STRATA_Z0 = -200, STRATA_DZ = 1.0, STRATA_INV = 1 / STRATA_DZ;
  const DEG = Math.PI / 180;

  // ---------- parameter tables (bounds are enforced everywhere, incl. JSON import) ----------
  const SIM_PARAMS = {
    speed:       { def: 1,    min: 0.1,  max: 4,    step: 0.05 },
    substeps:    { def: 3,    min: 1,    max: 24,   step: 1, int: true },
    rain:        { def: 2.5,  min: 0,    max: 10,   step: 0.05 },
    springs:     { def: 1,    min: 0,    max: 5,    step: 0.05 },
    evaporation: { def: 1,    min: 0,    max: 10,   step: 0.05 },
    erosion:     { def: 1.2,  min: 0,    max: 3,    step: 0.01 },
    deposition:  { def: 0.5,  min: 0,    max: 3,    step: 0.01 },
    capacity:    { def: 2.5,  min: 0,    max: 5,    step: 0.01 },
    flow:        { def: 1,    min: 0.1,  max: 4,    step: 0.05 },
    thermal:     { def: 0.2,  min: 0,    max: 3,    step: 0.01 },
    talus:       { def: 40,   min: 10,   max: 70,   step: 1 },
    hardness:    { def: 0.5,  min: 0,    max: 0.95, step: 0.01 },
    seaLevel:    { def: 10,   min: -50,  max: 200,  step: 0.5 },
  };
  const BOUNDARIES = ['drain', 'closed', 'sea'];
  const GEN_TYPES = ['mountains', 'canyon', 'island', 'valley', 'hills'];
  const GEN_PARAMS = {
    seed:      { def: 1337, min: 0,   max: 2147483647, step: 1, int: true },
    relief:    { def: 100,  min: 10,  max: 260,  step: 1 },
    scale:     { def: 2.0,  min: 0.5, max: 10,   step: 0.1 },
    octaves:   { def: 7,    min: 1,   max: 9,    step: 1, int: true },
    roughness: { def: 0.5,  min: 0.2, max: 0.8,  step: 0.01 },
    ridge:     { def: 0.6,  min: 0,   max: 1,    step: 0.01 },
    warp:      { def: 0.3,  min: 0,   max: 2,    step: 0.01 },
    falloff:   { def: 0.6,  min: 0,   max: 1,    step: 0.01 },
  };
  const RESOLUTIONS = [96, 128, 192, 256, 320, 384, 512];

  function clampParam(def, v) {
    v = Number(v);
    if (!Number.isFinite(v)) v = def.def;
    if (def.int) v = Math.round(v);
    return Math.min(def.max, Math.max(def.min, v));
  }
  function defaults(table) { const o = {}; for (const k in table) o[k] = table[k].def; return o; }
  function sanitizeSim(p) {
    const o = {};
    for (const k in SIM_PARAMS) o[k] = clampParam(SIM_PARAMS[k], p && p[k] !== undefined ? p[k] : SIM_PARAMS[k].def);
    o.boundary = p && BOUNDARIES.includes(p.boundary) ? p.boundary : 'drain';
    return o;
  }
  function sanitizeGen(g) {
    const o = {};
    for (const k in GEN_PARAMS) o[k] = clampParam(GEN_PARAMS[k], g && g[k] !== undefined ? g[k] : GEN_PARAMS[k].def);
    o.type = g && GEN_TYPES.includes(g.type) ? g.type : 'mountains';
    return o;
  }

  // ---------- seeded RNG + simplex noise ----------
  function mulberry32(a) {
    a = a >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const GX = [1, -1, 1, -1, 1, -1, 0, 0], GY = [1, 1, -1, -1, 0, 0, 1, -1];
  const F2 = 0.5 * (Math.sqrt(3) - 1), G2 = (3 - Math.sqrt(3)) / 6;
  function makeNoise(seed) {
    const rnd = mulberry32(seed ^ 0x9E3779B9);
    const p = new Uint8Array(256);
    for (let i = 0; i < 256; i++) p[i] = i;
    for (let i = 255; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
    const perm = new Uint8Array(512);
    for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
    return function (x, y) {
      const s = (x + y) * F2;
      const i = Math.floor(x + s), j = Math.floor(y + s);
      const t = (i + j) * G2;
      const x0 = x - (i - t), y0 = y - (j - t);
      const i1 = x0 > y0 ? 1 : 0, j1 = 1 - i1;
      const x1 = x0 - i1 + G2, y1 = y0 - j1 + G2, x2 = x0 - 1 + 2 * G2, y2 = y0 - 1 + 2 * G2;
      const ii = i & 255, jj = j & 255;
      let n = 0, tt, g;
      tt = 0.5 - x0 * x0 - y0 * y0;
      if (tt > 0) { g = perm[ii + perm[jj]] & 7; tt *= tt; n += tt * tt * (GX[g] * x0 + GY[g] * y0); }
      tt = 0.5 - x1 * x1 - y1 * y1;
      if (tt > 0) { g = perm[ii + i1 + perm[jj + j1]] & 7; tt *= tt; n += tt * tt * (GX[g] * x1 + GY[g] * y1); }
      tt = 0.5 - x2 * x2 - y2 * y2;
      if (tt > 0) { g = perm[ii + 1 + perm[jj + 1]] & 7; tt *= tt; n += tt * tt * (GX[g] * x2 + GY[g] * y2); }
      return 70 * n;
    };
  }
  const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // ---------- state ----------
  function createState(N) {
    const n = N * N;
    const f64 = () => new Float64Array(n), f32 = () => new Float32Array(n);

      N, dx: WORLD / N, time: 0, steps: 0, thermalAcc: 0,
      h: f64(), d: f64(), s: f64(), soil: f64(),
      h0: f64(), soil0: f64(), d0: f64(),
      fL: f64(), fR: f64(), fT: f64(), fB: f64(),
      u: f64(), v: f64(), wet: f32(), recent: f32(), strataOff: f32(),
      d2: f64(), s2: f64(), sc: f64(), tmp: f64(),

  // ---------- terrain generation ----------
  function scenarioFor(type, relief) {
    switch (type) {
      case 'canyon': return { boundary: 'drain', seaLevel: 0, sources: null /* placed on the plateau groove */ };
      case 'island': return { boundary: 'sea', seaLevel: Math.round(relief * 0.08), sources: [] };
      case 'valley': return { boundary: 'drain', seaLevel: 0, sources: null /* computed from valley path */ };
      default: return { boundary: 'drain', seaLevel: 0, sources: [] };

  function generate(genIn, N) {
    const gen = sanitizeGen(genIn);
    const S = createState(N);
    const seed = gen.seed >>> 0;
    const noise = makeNoise(seed), nWarp = makeNoise(seed + 7919), nLow = makeNoise(seed + 104729);
    const rnd = mulberry32(seed * 31 + 17);
    const ox = rnd() * 200 - 100, oy = rnd() * 200 - 100;
    const oct = gen.octaves, rough = gen.roughness, sc = gen.scale, ridge = gen.ridge, warp = gen.warp;
    const raw = new Float64Array(N * N);
    const fmax = 16; // finest feature frequency kept, fixed so every resolution sees the same landscape
    let mn = Infinity, mx = -Infinity;
    for (let j = 0; j < N; j++) {
      const v = j / (N - 1);
      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        let x = u * sc + ox, y = v * sc + oy;
        if (warp > 0) {
          let wx = 0, wy = 0, a = 0.5, f = 1;
          for (let o = 0; o < 3; o++) { wx += a * nWarp(x * f + 5.2, y * f + 1.3); wy += a * nWarp(x * f + 1.7, y * f + 9.2); a *= 0.5; f *= 2.1; }
          x += warp * wx; y += warp * wy;
        }
        // fBm; ridges come from folding a second large-scale fBm (sharp crests, smooth valleys)
        let fb = 0, fr = 0, frn = 0, a = 1, f = 1, norm = 0;
        for (let o = 0; o < oct; o++) {

          const fade = 1 - smoothstep(0.35, 1, sc * f / fmax);
          const nx = x * f + o * 17.13, ny = y * f - o * 9.71;

        const rf = 1 - Math.min(1, Math.abs(fr / frn) * 1.8);
        const val = fb * (1 - ridge) + ridge * (0.55 * rf * rf + 0.45 * fb);

      }
    }
    const R = gen.relief, fo = gen.falloff;
    const inv = 1 / Math.max(1e-9, mx - mn);
    const phase = rnd() * Math.PI * 2;
    const valleyX = (v) => 0.5 + 0.17 * Math.sin(v * Math.PI * 2.2 + phase) + 0.08 * nLow(v * 2.5 + 3.1, 7.7);
    const canyonY = (u) => 0.5 + 0.12 * Math.sin(u * Math.PI * 2.4 + phase) + 0.05 * nLow(u * 3.1 + 1.3, 5.3);
    const h = S.h;
    for (let j = 0; j < N; j++) {
      const v = j / (N - 1);
      for (let i = 0; i < N; i++) {
        const u = i / (N - 1);
        const k = j * N + i;
        const n = (raw[k] - mn) * inv;
        const cx = u - 0.5, cy = v - 0.5;
        const r = Math.sqrt(cx * cx + cy * cy) / 0.5;
        let z;
        switch (gen.type) {

            const e = u + 0.10 * (nLow(u * 2.2, v * 2.2));
            const dist = Math.abs(v - canyonY(u));
            const groove = (1 - smoothstep(0.0, 0.06, dist)) * R * 0.05 * (1 - smoothstep(0.7, 0.8, u));
            z = R * (0.72 - 0.16 * u + 0.05 * (n - 0.5)) - groove - R * 0.46 * smoothstep(0.64, 0.86, e) * (0.6 + 0.4 * fo);

          }
          case 'island': {
            const coast = 1 - smoothstep(0.3, 0.95, r + 0.45 * nLow(u * 2.4, v * 2.4) * (0.4 + 0.6 * fo));
            z = R * coast * (0.12 + 0.88 * Math.pow(n, 1.25)) - R * 0.1 * (1 - coast);
            break;
          }
          case 'valley': {
            const dist = Math.abs(u - valleyX(v));
            const wall = smoothstep(0.025, 0.34, dist);
            z = R * (0.30 * (1 - v) + 0.52 * Math.pow(wall, 0.85) * (0.45 + 0.55 * n) + 0.10 * n * (0.2 + 0.8 * wall));
            break;
          }
          case 'hills': {
            const bowl = 1 - fo * 0.6 * smoothstep(0.3, 1.3, r);
            z = R * 0.55 * n * bowl;
            break;
          }
          default: { // mountains
            const bowl = 1 - fo * smoothstep(0.15, 1.3, r);
            z = R * (0.03 + 0.97 * Math.pow(n, 1.3) * bowl);
          }
        }

        // folded/dipping strata offset (m)
        S.strataOff[k] = 7 * nLow(u * 1.7 + 11.1, v * 1.7 - 4.2) + R * 0.06 * (u - 0.5) + R * 0.03 * (v - 0.5);

    }

    const sr = mulberry32(seed * 7 + 3);
    let hard = sr() < 0.5;
    for (let k = 0; k < STRATA_N;) {
      const thick = Math.max(1, Math.round((hard ? 2 + sr() * 7 : 3 + sr() * 10) / STRATA_DZ));
      const val = hard ? 0.65 + 0.35 * sr() : 0.3 * sr();
      for (let t = 0; t < thick && k < STRATA_N; t++, k++) S.strata[k] = val;

    }
    // relax slopes steeper than ~42 deg so the first seconds are not dominated by slope collapse
    const settleP = { talus: 42, thermal: 1 };
    for (let k = 0; k < 40; k++) thermal(S, settleP, 0.5);
    S.soil.fill(0); S.recent.fill(0);
    const scen = scenarioFor(gen.type, R);
    S.sources = scen.sources ? scen.sources.map(s => ({ ...s }))
      : gen.type === 'canyon' ? [{ x: 0.1, y: canyonY(0.1), r: 0.035, rate: 50 }]
      : [{ x: valleyX(0.04), y: 0.04, r: 0.035, rate: 45 }];
    S.scenario = { boundary: scen.boundary, seaLevel: scen.seaLevel };
    S.gen = gen;
    return S;
  }

  // Flood cells connected to the domain edge that lie below sea level.
  function fillSea(S, sea) {
    const { N, h, d } = S;
    const seen = new Uint8Array(N * N), q = new Int32Array(N * N);
    let qh = 0, qt = 0;
    const push = (k) => { if (!seen[k] && h[k] < sea) { seen[k] = 1; q[qt++] = k; } };
    for (let i = 0; i < N; i++) { push(i); push((N - 1) * N + i); push(i * N); push(i * N + N - 1); }
    while (qh < qt) {
      const k = q[qh++], x = k % N, y = (k / N) | 0;
      d[k] = Math.max(d[k], sea - h[k]);

    }
  }

  // Store current terrain/water as the reset point and rebaseline mass accounting.
  function captureInitial(S) {
    S.h0.set(S.h); S.soil0.set(S.soil); S.d0.set(S.d);
    S.time = 0; S.steps = 0;

    S.h.set(S.h0); S.soil.set(S.soil0); S.d.set(S.d0); S.s.fill(0);

  // ---------- simulation step ----------
  function addDisc(S, arr, gx, gy, rc, volume) {
    const N = S.N, area = S.dx * S.dx;

    const y0 = Math.max(0, Math.floor(gy - rc)), y1 = Math.min(N - 1, Math.ceil(gy + rc));

      if (q < 1) wsum += (1 - q) * (1 - q);
    }

    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const q = ((x - gx) ** 2 + (y - gy) ** 2) / (rc * rc);
      if (q < 1) arr[y * N + x] += k * (1 - q) * (1 - q);

  }

  function step(S, P, dt) {
    const N = S.N, n = N * N, last = N - 1, dx = S.dx, area = dx * dx, invArea = 1 / area;
    const bal = S.bal;
    const { h, soil, fL, fR, fT, fB, u, v, wet, recent, sc } = S;
    let d = S.d, s = S.s;

    // 1. water input: rain + springs
    const rd = P.rain * RAIN_UNIT * dt;

    if (P.springs > 0) for (const src of S.sources) {

    }

    // 2. outflow flux (virtual pipes)
    // pipe cross-section = dx * depth (shallow-water form), plus Chezy bed friction
    const kg = dt * P.flow * G;
    const drain = P.boundary === 'drain';
    for (let y = 0; y < N; y++) {
      const row = y * N;
      for (let x = 0; x < N; x++) {
        const i = row + x;
        const di = d[i];
        if (di <= 0) { fL[i] = 0; fR[i] = 0; fT[i] = 0; fB[i] = 0; sc[i] = 0; continue; }
        const Hi = h[i] + di;
        const sp = Math.sqrt(u[i] * u[i] + v[i] * v[i]);

        const kf = kg * di;
        let l, r, t, b;

        if (x < last) { r = fR[i] * keep + kf * (Hi - h[i + 1] - d[i + 1]); if (r < 0) r = 0; }
        else r = drain ? Math.max(0, fR[i] * keep + kf * (di + Math.max(0, h[i - 1] - h[i]))) : 0;
        if (y > 0) { t = fT[i] * keep + kf * (Hi - h[i - N] - d[i - N]); if (t < 0) t = 0; }
        else t = drain ? Math.max(0, fT[i] * keep + kf * (di + Math.max(0, h[i + N] - h[i]))) : 0;
        if (y < last) { b = fB[i] * keep + kf * (Hi - h[i + N] - d[i + N]); if (b < 0) b = 0; }

        if (y > 0) { inT = fB[i - N]; fin += inT; sin += inT * sc[i - N]; } else if (ft > 0) { outW += ft; outS += ft * sc[i]; }
        if (y < last) { inB = fT[i + N]; fin += inB; sin += inB * sc[i + N]; } else if (fb > 0) { outW += fb; outS += fb * sc[i]; }
        const d0 = d[i];

        d2[i] = d1;

        s2[i] = s1;

        if (dm > DDRY) {

    }

    bal.drainS += outS * dt * area;

    const ks = Math.min(1, P.erosion * dt), kd = Math.min(1, P.deposition * dt), kc = P.capacity;

    const fixedRing = P.boundary !== 'closed'; // open/sea edges act as a fixed-bed outlet: sediment passes through
    for (let y = 0; y < N; y++) {
      const row = y * N;
      const edgeRow = y === 0 || y === last;
      for (let x = 0; x < N; x++) {
        const i = row + x;
        const di = d[i];
        let dh = 0;
        if (fixedRing && (edgeRow || x === 0 || x === last)) {

          const gy = y > 0 && y < last ? (h[i + N] - h[i - N]) * inv2dx : (y > 0 ? hc - h[i - N] : h[i + N] - hc) * invdx;
          const g2 = gx * gx + gy * gy;

            let mn = x > 0 ? h[i - 1] : hc;

            if (y > 0 && h[i - N] < mn) mn = h[i - N];
            if (y < last && h[i + N] < mn) mn = h[i + N];
            const lim = hc - mn + 0.02 * di;
            if (take > lim) { take = lim > 0 ? lim : 0; }
            if (take > so) { soil[i] = 0; } else soil[i] = so - take;
            h[i] = hc - take; s[i] = si + take; eroded += take; dh = -take;
          } else {
            const put = kd * (si - cap);
            h[i] = hc + put; soil[i] += put; s[i] = si - put; deposited += put; dh = put;
          }
          const dn = di * evapF;
          if (dn < DDRY) {
            const sr = s[i];
            if (sr > 0) { h[i] += sr; soil[i] += sr; deposited += sr; dh += sr; s[i] = 0; }

          } else { evap += di - dn; d[i] = dn; }

          wet[i] = di > WET_DEPTH ? (w + wetGain > 1 ? 1 : w + wetGain) : w * wetKeep;

          const sr = s[i];
          if (sr > 0) { h[i] += sr; soil[i] += sr; deposited += sr; dh = sr; s[i] = 0; }

    }
    bal.eroded += eroded * area; bal.deposited += deposited * area; bal.evap += evap * area;
    bal.drainS += outletS * area;

    // 5. thermal (talus) erosion, every second step with doubled dt
    S.thermalAcc += dt;
    if ((S.steps & 1) === 1) { thermal(S, P, S.thermalAcc); S.thermalAcc = 0; }

    // 6. sea-level boundary (fixed water surface on the outer ring)
    if (P.boundary === 'sea') {
      const sea = P.seaLevel;
      let dw = 0, ds = 0;
      const fix = (i) => { const tgt = h[i] < sea ? sea - h[i] : 0; dw += tgt - d[i]; ds += s[i]; d[i] = tgt; s[i] = 0; };
      for (let x = 0; x < N; x++) { fix(x); fix(last * N + x); }
      for (let y = 1; y < last; y++) { fix(y * N); fix(y * N + last); }
      bal.seaW += dw * area; bal.seaS += ds * area;
    }
    S.time += dt; S.steps++;
  }

  function thermal(S, P, dt) {
    const N = S.N, last = N - 1, dx = S.dx, h = S.h, soil = S.soil, tmp = S.tmp;
    const tanT = Math.tan(P.talus * DEG), dA = tanT * dx, dD = tanT * dx * Math.SQRT2;
    const kt = Math.min(0.5, P.thermal * dt);
    tmp.fill(0);
    if (kt > 0) for (let y = 1; y < last; y++) {
      for (let x = 1; x < last; x++) {
        const i = y * N + x, hi = h[i];
        let e0 = hi - h[i - 1] - dA, e1 = hi - h[i + 1] - dA, e2 = hi - h[i - N] - dA, e3 = hi - h[i + N] - dA;
        let e4 = hi - h[i - N - 1] - dD, e5 = hi - h[i - N + 1] - dD, e6 = hi - h[i + N - 1] - dD, e7 = hi - h[i + N + 1] - dD;
        let mx = 0, tot = 0;
        if (e0 > 0) { tot += e0; if (e0 > mx) mx = e0; } else e0 = 0;
        if (e1 > 0) { tot += e1; if (e1 > mx) mx = e1; } else e1 = 0;
        if (e2 > 0) { tot += e2; if (e2 > mx) mx = e2; } else e2 = 0;
        if (e3 > 0) { tot += e3; if (e3 > mx) mx = e3; } else e3 = 0;
        if (e4 > 0) { tot += e4; if (e4 > mx) mx = e4; } else e4 = 0;

    if (st.tool === 'inspect') { if (hit) app.probe = { gx: hit.gx, gy: hit.gy }; return; }
    if (!hit) return;
    const S = app.S;
    const rc = app.brush.radius / S.dx;
    const pressure = st.pointerType === 'pen' ? clamp(st.pressure * 2, 0.1, 2) : 1;
    const amt = app.brush.strength * pressure * Math.min(realDt, 0.05);
    const from = st.last || hit;
    const dist = Math.hypot(hit.gx - from.gx, hit.gy - from.gy);
    const n = Math.max(1, Math.min(64, Math.ceil(dist / Math.max(0.5, rc * 0.25))));
    for (let k = 1; k <= n; k++) {
      const t = k / n;
      C.applyBrush(S, st.tool, from.gx + (hit.gx - from.gx) * t, from.gy + (hit.gy - from.gy) * t, rc, amt / n, st.target);

      return [d(v, [0.13572138, 4.6153926, -42.66032258, 132.13108234]) + v2[0] * -152.94239396 + v2[1] * 59.28637943,
        d(v, [0.09140261, 2.19418839, 4.84296658, -14.18503333]) + v2[0] * 4.27729857 + v2[1] * 2.82956604,
        d(v, [0.1066733, 12.64194608, -60.58204836, 110.36276771]) + v2[0] * -89.90310912 + v2[1] * 27.34824973].map(c => clamp(c, 0, 1)); },
    poly(t, cs) { t = clamp(t, 0, 1); return [0, 1, 2].map(i => clamp(cs.reduceRight((acc, c) => c[i] + t * acc, 0), 0, 1)); },
    viridis(t) { return JSC.poly(t, [[0.2777, 0.0054, 0.3341], [0.1051, 1.4046, 1.3846], [-0.3309, 0.2148, 0.0951], [-4.6342, -5.7991, -19.3324], [6.2283, 14.1799, 56.6906], [4.7764, -13.7451, -65.3530], [-5.4355, 4.6459, 26.3124]]); },
    magma(t) { return JSC.poly(t, [[-0.0021, -0.0007, -0.0054], [0.2517, 0.6775, 2.4940], [8.3537, -3.5777, 0.3145], [-27.6687, 14.2647, -13.6492], [52.1761, -27.9436, 12.9442], [-50.7685, 29.0466, 4.2342], [18.6557, -11.4898, -5.6020]]); },
    lerp(a, b, t) { return a.map((x, i) => x + (b[i] - x) * t); },
    deep(t) { t = clamp(t, 0, 1); const a = [0.9, 0.95, 0.98], b = [0.5, 0.78, 0.92], c = [0.13, 0.46, 0.78], d = [0.04, 0.1, 0.36];
      return t < 0.33 ? JSC.lerp(a, b, t / 0.33) : t < 0.66 ? JSC.lerp(b, c, (t - 0.33) / 0.33) : JSC.lerp(c, d, (t - 0.66) / 0.34); },
    diverge(t) { t = clamp(t, -1, 1); const e2 = [0.62, 0.08, 0.05], e1 = [0.95, 0.52, 0.26], z = [0.93, 0.93, 0.9], p1 = [0.45, 0.7, 0.9], p2 = [0.06, 0.22, 0.58];
      return t < 0 ? (t < -0.5 ? JSC.lerp(e1, e2, (-t - 0.5) * 2) : JSC.lerp(z, e1, -t * 2)) : (t > 0.5 ? JSC.lerp(p1, p2, (t - 0.5) * 2) : JSC.lerp(z, p1, t * 2)); },
  };
  const css = (c) => `rgb(${c.map(x => Math.round(x * 255)).join(',')})`;
  function gradient(fn, a = 0, b = 1) { const s = []; for (let i = 0; i <= 12; i++) { const t = a + (b - a) * i / 12; s.push(`${css(fn(t))} ${(i / 12 * 100).toFixed(0)}%`); } return `linear-gradient(90deg, ${s.join(',')})`; }
  let legendMode = -1;
  function updateLegend(force) {
    const m = app.view.mode, st = app.stats, R = app.ranges;
    if (!st) return;
    const bar = $('#legendBar');
    const set = (title, unit, lo, mid, hi, note) => { $('#legendTitle').textContent = title; $('#legendUnit').textContent = unit; $('#legendMin').textContent = lo; $('#legendMid').textContent = mid; $('#legendMax').textContent = hi; $('#legendNote').textContent = note; };
    const isFlow = m === 6;
    $('#legendFlow').style.display = isFlow ? 'flex' : 'none';
    $('#legendWheel').style.display = isFlow ? 'block' : 'none';
    if (force || legendMode !== m) {
      legendMode = m;
      const bg = [
        'linear-gradient(90deg, #6d5a3a, #5d6b36 30%, #7a7466 60%, #e4e7ec)',
        gradient(JSC.turbo), gradient((t) => JSC.deep(Math.sqrt(t))), gradient((t) => JSC.magma(0.12 + 0.88 * Math.sqrt(t))),
        gradient((t) => JSC.diverge(Math.sign(t) * Math.sqrt(Math.abs(t))), -1, 1), gradient((t) => JSC.viridis(t)),
        'linear-gradient(90deg, #333, #eee)',
      ][m];
      bar.style.background = bg;
      $('#legendWheel').style.background = 'conic-gradient(from 90deg, hsl(180,80%,50%), hsl(90,80%,50%), hsl(0,80%,50%), hsl(270,80%,50%), hsl(180,80%,50%))';
    }
    switch (m) {
      case 0: set('Shaded terrain', 'wet darkens · sand = deposits', 'vegetation', 'rock', 'snow', app.view.highlight ? 'Tint: red = recently eroded, yellow = recently deposited. Muddy water = high sediment load.' : 'Muddy water = high sediment load.'); break;
      case 1: set('Elevation', 'm', st.minH.toFixed(0), ((st.minH + st.maxH) / 2).toFixed(0), st.maxH.toFixed(0), 'Turbo colour map over the current height range.'); break;
      case 2: set('Water depth', 'm (sqrt scale)', '0', (R.depth / 4).toFixed(2), R.depth.toFixed(2), 'Gray = dry (< 4 mm). Range auto-scales to the current maximum.'); break;
      case 3: set('Sediment concentration', '% of water volume', '0', (R.conc * 25).toFixed(1), (R.conc * 100).toFixed(1), 'Suspended load ÷ water depth; gray where dry.'); break;
      case 4: set('Erosion / deposition', 'Δh since t=0 (m)', '−' + R.delta.toFixed(2), '0', '+' + R.delta.toFixed(2), 'Red = eroded, blue = deposited (signed sqrt scale).'); break;
      case 5: set('Slope', 'degrees', '0°', '30°', '60°', 'Terrain slope angle (true, not exaggerated).'); break;
      case 6: set('Flow velocity', 'm/s', '0', (R.speed / 2).toFixed(2), R.speed.toFixed(2), ''); $('#legendFlowNote').textContent = 'Hue = direction, brightness = speed. Arrows show direction; length ∝ speed.'; break;
    }
  }
  function updateRanges() {
    const st = app.stats, R = app.ranges, k = 0.08;
    R.depth += (Math.max(0.25, st.maxDepth * 0.8) - R.depth) * k;
    R.conc += (clamp(st.maxConc * 0.8, 0.01, 1) - R.conc) * k;
    R.delta += (Math.max(0.25, st.maxDelta * 0.7) - R.delta) * k;
    R.speed += (Math.max(0.5, st.maxSpeed * 0.8) - R.speed) * k;
  }
  let probeLast = 0;
  function updateProbe() {
    const now = performance.now();
    if (now - probeLast < 120) return;
    probeLast = now;
    const S = app.S, N = S.N;
    const src = app.hover ? app.hover : app.probe;
    const title = $('#probeTitle'), srcEl = $('#probeSrc'), g = $('#probeGrid');
    if (!src) { if (!g.dataset.empty) { g.innerHTML = '<span class="empty" style="grid-column: span 2">Hover the terrain or use the Inspect tool (I) to pin a probe.</span>'; g.dataset.empty = '1'; srcEl.textContent = ''; } return; }
    delete g.dataset.empty;
    const i = clamp(Math.round(src.gx), 0, N - 1), j = clamp(Math.round(src.gy), 0, N - 1), k = j * N + i;
    const h = S.h[k], d = S.d[k], s = S.s[k], soil = S.soil[k], u = S.u[k], v = S.v[k];
    const sp = Math.hypot(u, v);
    const hx = (S.h[j * N + Math.min(N - 1, i + 1)] - S.h[j * N + Math.max(0, i - 1)]) / (2 * S.dx);
    const hy = (S.h[Math.min(N - 1, j + 1) * N + i] - S.h[Math.max(0, j - 1) * N + i]) / (2 * S.dx);
    const slope = Math.atan(Math.hypot(hx, hy)) / DEG;
    const sinA = Math.sin(slope * DEG);
    const cap = Math.min(C.CMAX * d, app.P.capacity * Math.max(sinA, 0.05) * sp * Math.min(1, d / 0.4));
    let sk = ((h - soil + S.strataOff[k]) - C.STRATA_Z0) / C.STRATA_DZ | 0; sk = clamp(sk, 0, C.STRATA_N - 1);
    const hard = soil > 1e-3 ? 0 : app.P.hardness * S.strata[sk];
    const dir = sp > 0.01 ? ((Math.atan2(u, -v) / DEG + 360) % 360).toFixed(0) + '°' : '—';
    title.textContent = app.hover ? 'Probe · hover' : 'Probe · pinned';
    srcEl.textContent = `cell ${i}, ${j}`;
    const rows = [
      ['Position', `${((i - (N - 1) / 2) * S.dx).toFixed(0)}, ${((j - (N - 1) / 2) * S.dx).toFixed(0)} m`, 1],
      ['Elevation', `${h.toFixed(2)} m`], ['Water depth', `${d < 1e-4 ? d.toExponential(1) : d.toFixed(3)} m`], ['Surface', `${(h + d).toFixed(2)} m`],
      ['Flow speed', `${sp.toFixed(2)} m/s ${dir}`], ['Sediment', `${(s * 1000).toFixed(1)} mm · ${d > 1e-3 ? (s / d * 100).toFixed(1) : '0.0'}%`],
      ['Capacity', `${(cap * 1000).toFixed(1)} mm`, 1], ['Slope', `${slope.toFixed(1)}°`], ['Loose soil', `${soil.toFixed(3)} m`, 1],
      ['Rock hardness', hard.toFixed(2), 1], ['Δh since t=0', `${(h - S.h0[k] >= 0 ? '+' : '')}${(h - S.h0[k]).toFixed(3)} m`],
      ['Recent Δh', `${(S.recent[k] >= 0 ? '+' : '')}${(S.recent[k] * 1000).toFixed(1)} mm`, 1], ['Wetness', S.wet[k].toFixed(2), 1],
    ];
    g.innerHTML = rows.map(([a, b, x]) => `<span class="k${x ? ' x' : ''}">${a}</span><span class="v${x ? ' x' : ''}">${b}</span>`).join('');
  }

  // ---------------------------------------------------------------- import / export
  function download(blob, name) {
    const url = URL.createObjectURL(blob);
    const a = el('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    app.lastDownload = { name, size: blob.size, type: blob.type, blob };
  }
  async function zlib(raw) {
    if (typeof CompressionStream === 'function') {
      try {
        const cs = new CompressionStream('deflate');
        const buf = await new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer();
        return new Uint8Array(buf);
      } catch (e) { /* fall through to stored blocks */ }
    }
    return C.zlibStored(raw);
  }
  function stamp() { return `seed${app.gen.seed}-${app.S.N}-t${Math.round(app.S.time)}s`; }
  async function buildHeightPNG() {
    const { raw, min, max } = C.heightPNGRaw(app.S);
    const z = await zlib(raw);
    const png = C.assemblePNG(app.S.N, z, { Software: 'Hydraulic Erosion Lab', Description: `16-bit heightfield, 0 = ${min.toFixed(3)} m, 65535 = ${max.toFixed(3)} m, cell ${app.S.dx.toFixed(4)} m`, 'height-min-m': min.toFixed(4), 'height-max-m': max.toFixed(4) });
    return { png, min, max };
  }
  async function exportPNG() {
    try {
      const { png, min, max } = await buildHeightPNG();
      download(new Blob([png], { type: 'image/png' }), `erosion-heightmap-${stamp()}.png`);
      toast(`Exported 16-bit grayscale heightmap (${app.S.N}², ${min.toFixed(1)}…${max.toFixed(1)} m)`);
    } catch (e) { toast('PNG export failed: ' + e.message, true); }
  }
  function stateObject() {
    return C.serialize(app.S, {
      savedAt: new Date().toISOString(), app: 'Hydraulic Erosion Lab',
      params: app.P, view: { ...app.view }, brush: { ...app.brush }, preset: app.presetId,
      camera: { yaw: cam.yaw, pitch: cam.pitch, dist: cam.dist, target: cam.target.slice() },
    });
  }
  function exportJSON() {
    try {
      const json = JSON.stringify(stateObject());
      download(new Blob([json], { type: 'application/json' }), `erosion-state-${stamp()}.json`);
      toast(`Exported full simulation state (${(json.length / 1e6).toFixed(1)} MB)`);
    } catch (e) { toast('State export failed: ' + e.message, true); }
  }
  function loadStateObject(obj) {
    const S = C.deserialize(obj);
    app.P = C.sanitizeSim(obj.params || {});
    app.gen = S.gen;
    if (obj.view && typeof obj.view === 'object') {
      for (const k in VIEW_DEFS) if (Number.isFinite(obj.view[k])) app.view[k] = clamp(obj.view[k], VIEW_DEFS[k].min, VIEW_DEFS[k].max);
      if (Number.isInteger(obj.view.mode)) app.view.mode = clamp(obj.view.mode, 0, MODES.length - 1);
      for (const k of ['contours', 'grid', 'highlight', 'arrows']) if (typeof obj.view[k] === 'boolean') app.view[k] = obj.view[k];
    }
    if (obj.brush && typeof obj.brush === 'object') {
      for (const k in BRUSH_DEFS) if (Number.isFinite(obj.brush[k])) app.brush[k] = clamp(obj.brush[k], BRUSH_DEFS[k].min, BRUSH_DEFS[k].max);
    }
    if (obj.camera && [obj.camera.yaw, obj.camera.pitch, obj.camera.dist].every(Number.isFinite)) {
      cam.yaw = obj.camera.yaw; cam.pitch = clamp(obj.camera.pitch, 0.06, 1.52); cam.dist = clamp(obj.camera.dist, 80, 2600);
      if (Array.isArray(obj.camera.target) && obj.camera.target.length === 3 && obj.camera.target.every(Number.isFinite)) cam.target = obj.camera.target.slice();
    }
    app.presetId = PRESETS.some(p => p.id === obj.preset) ? obj.preset : '';
    setWorld(S);
    return S;
  }
  function importJSON(file) {
    const reader = new FileReader();
    reader.onerror = () => toast('Could not read file', true);
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        const S = loadStateObject(obj);
        toast(`Imported state: ${S.N}², t = ${S.time.toFixed(1)} s${S.importFixes ? ` (${S.importFixes} invalid values repaired)` : ''}`);
      } catch (e) { toast('Import failed: ' + e.message, true); }
    };
    reader.readAsText(file);
  }
  app.api = { buildHeightPNG, stateObject, loadStateObject, applyPreset, setMode, setTool, pick, cam };

  // ---------------------------------------------------------------- main loop
  let lastT = performance.now(), fpsAcc = 0, fpsN = 0, fpsT = performance.now(), slowFrames = 0, fastFrames = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    const realDt = Math.min(0.1, (t - lastT) / 1000);
    const f0 = performance.now();
    lastT = t;
    if (input.overCanvas && (input.hoverDirty || input.stroke || !app.paused)) {
      const hit = pick(input.lastX, input.lastY);
      app.hover = hit; input.hoverDirty = false;
    }
    applyStroke(realDt);
    try { simulateFrame(t); } catch (e) { console.error(e); recover('exception: ' + e.message); }
    if (!app.stats) app.stats = C.computeStats(app.S, app.P);
    updateRanges();
    render(t);
    updateHud(false);
    updateProbe();
    // frame timing and adaptive render scale
    const work = performance.now() - f0;
    fpsAcc += realDt; fpsN++;
    app.frameMs = app.frameMs * 0.9 + work * 0.1;
    if (t - fpsT > 500) { app.fps = fpsN / Math.max(1e-3, fpsAcc); fpsAcc = 0; fpsN = 0; fpsT = t;
      if (app.fps < 28) { slowFrames++; fastFrames = 0; } else if (app.fps > 55) { fastFrames++; slowFrames = 0; } else { slowFrames = 0; fastFrames = 0; }
      if (slowFrames >= 3 && app.renderScale > 0.5) { app.renderScale = Math.max(0.5, app.renderScale * 0.85); slowFrames = 0; }
      if (fastFrames >= 4 && app.renderScale < 1) { app.renderScale = Math.min(1, app.renderScale * 1.12); fastFrames = 0; }
    }
  }

  buildUI();
  applyPreset('mountain');
  window.addEventListener('resize', () => { resize(); });
  requestAnimationFrame((t) => { lastT = t; frame(t); });
})();
</script>
