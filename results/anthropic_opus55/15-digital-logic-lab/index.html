<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Logic Lab — Digital Logic &amp; Tiny-CPU Laboratory</title>
<style>
:root{
  --bg:#0a0e13; --panel:#0f151c; --panel2:#141c25; --panel3:#1a2430; --line:#212e3c; --line2:#2c3d50;
  --text:#d4e0eb; --muted:#7d91a5; --faint:#4f6377; --accent:#48c9f2; --accent2:#ffb347; --danger:#ff5468; --ok:#37d98b; --warn:#ffc545;
  --canvas:#0b1016; --grid:#131c26; --grid2:#1b2733;
  --comp:#121b25; --comp2:#172230; --compStroke:#56708a; --compText:#c7d6e3; --pin:#8aa0b6;
  --hi:#3fe08f; --lo:#1f6a45; --bus:#ffb347; --x:#ff4f64; --z:#7b8ea2; --cont:#ff3fa4; --osc:#b58cff; --sel:#48c9f2; --werr:#ff7a2f;
  --shadow:0 10px 34px rgba(0,0,0,.5);
  --mono:ui-monospace,"SFMono-Regular","JetBrains Mono","Cascadia Code",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --palW:200px; --inspW:280px; --dockH:250px;
  color-scheme:dark;
}
[data-theme=light]{
  --bg:#eef2f6; --panel:#f8fafc; --panel2:#eef2f7; --panel3:#e3e9f0; --line:#d2dbe5; --line2:#bccad8;
  --text:#18242f; --muted:#5b6d7f; --faint:#98a8b8; --accent:#0a84c6; --accent2:#c86b00; --danger:#d61f3a; --ok:#0f9b58; --warn:#b98300;
  --canvas:#fbfcfd; --grid:#eef2f6; --grid2:#e0e7ee;
  --comp:#ffffff; --comp2:#f3f6f9; --compStroke:#3d5166; --compText:#1d2a36; --pin:#4c6076;
  --hi:#0aa653; --lo:#9cc7ae; --bus:#d07a00; --x:#e0213d; --z:#7a8a9a; --cont:#d4147a; --osc:#7a3fe0; --sel:#0a84c6; --werr:#e05a00;
  --shadow:0 10px 30px rgba(20,40,60,.18);
  color-scheme:light;
}
[data-theme=contrast]{
  --bg:#000; --panel:#000; --panel2:#0a0a0a; --panel3:#161616; --line:#fff; --line2:#fff;
  --text:#fff; --muted:#e6e6e6; --faint:#bdbdbd; --accent:#00e5ff; --accent2:#ffea00; --danger:#ff3b3b; --ok:#00ff66; --warn:#ffea00;
  --canvas:#000; --grid:#1a1a1a; --grid2:#2e2e2e;
  --comp:#000; --comp2:#111; --compStroke:#fff; --compText:#fff; --pin:#fff;
  --hi:#ffea00; --lo:#6d6d6d; --bus:#00e5ff; --x:#ff3b3b; --z:#b0b0b0; --cont:#ff00ff; --osc:#ff9dff; --sel:#00e5ff; --werr:#ff8c00;
}
[data-theme=cb]{ /* Okabe–Ito palette: distinguishable for common colour-vision deficiencies */
  --hi:#E69F00; --lo:#0a4f7a; --bus:#56B4E9; --x:#CC79A7; --z:#9a9a9a; --cont:#D55E00; --osc:#F0E442; --sel:#56B4E9; --werr:#D55E00;
  --accent:#56B4E9; --accent2:#E69F00; --ok:#009E73; --danger:#D55E00; --warn:#F0E442;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.35 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:grid;height:100vh;height:100dvh;grid-template-columns:var(--palW) minmax(0,1fr) var(--inspW);grid-template-rows:auto minmax(0,1fr) var(--dockH);grid-template-areas:"top top top" "pal stage insp" "dock dock dock"}
#app.dock-min{--dockH:34px}
/* ---------- top bar ---------- */
#top{grid-area:top;display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:7px;font:600 13px/1 var(--mono);letter-spacing:.14em;margin-right:4px;white-space:nowrap}
.brand svg{width:22px;height:22px}
.brand span{color:var(--accent)}
.grp{display:flex;align-items:center;gap:2px;padding:0 4px;border-left:1px solid var(--line)}
.grp:first-of-type{border-left:0}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:28px;min-width:28px;padding:0 7px;border:1px solid transparent;border-radius:6px;background:transparent;cursor:pointer;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--panel3);border-color:var(--line)}
.btn:active{transform:translateY(1px)}
.btn.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
.btn.primary{background:color-mix(in srgb,var(--ok) 16%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.btn.primary.running{background:color-mix(in srgb,var(--accent2) 16%,transparent);border-color:color-mix(in srgb,var(--accent2) 45%,transparent);color:var(--accent2)}
.btn[disabled]{opacity:.4;cursor:default}
.btn svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn.icon{padding:0 6px}
.btn.sm{height:24px;padding:0 7px;font-size:12px}
.speed{display:flex;align-items:center;gap:6px;padding:0 6px}
.speed input{width:84px;accent-color:var(--accent)}
.speed output{font:12px var(--mono);min-width:62px;color:var(--accent2)}
#projName{width:118px;height:26px;border:1px solid transparent;background:transparent;border-radius:5px;padding:0 6px;font:12px var(--mono);color:var(--muted)}
#projName:hover,#projName:focus{border-color:var(--line2);background:var(--panel2);color:var(--text)}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--panel3);color:var(--text);border:1px solid var(--line2);padding:3px 7px;border-radius:5px;font:11px/1.3 var(--sans);white-space:nowrap;pointer-events:none;z-index:50;box-shadow:var(--shadow)}
/* ---------- palette ---------- */
#palette{grid-area:pal;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:6px 6px 16px;min-height:0}
#palette h3{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:12px 4px 6px}
#palette h3:first-child{margin-top:4px}
.pal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.pal-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px 4px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);cursor:grab;user-select:none;touch-action:none;font-size:11px;color:var(--muted)}
.pal-item:hover,.pal-item:focus-visible{border-color:var(--accent);color:var(--text)}
.pal-item canvas{width:64px;height:34px;pointer-events:none}
#palFilter{width:100%;height:28px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);padding:0 8px;font-size:12px}
/* ---------- stage ---------- */
#stage{grid-area:stage;position:relative;overflow:hidden;min-width:0;min-height:0;background:var(--canvas)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none}
#cv:focus-visible{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 60%,transparent)}
#hud{position:absolute;left:8px;top:8px;font:11px/1.45 var(--mono);color:var(--muted);background:color-mix(in srgb,var(--panel) 86%,transparent);border:1px solid var(--line);border-radius:7px;padding:5px 8px;pointer-events:none;white-space:pre;backdrop-filter:blur(4px);max-width:calc(100% - 16px);overflow:hidden}
#hud b{color:var(--text);font-weight:600}
#hud .w{color:var(--warn)} #hud .e{color:var(--danger)} #hud .ok{color:var(--ok)} #hud .a{color:var(--accent2)}
#mini{position:absolute;right:8px;bottom:8px;width:180px;height:116px;border:1px solid var(--line2);border-radius:7px;background:color-mix(in srgb,var(--panel) 90%,transparent);cursor:pointer;touch-action:none}
#zoomctl{position:absolute;right:8px;top:8px;display:flex;gap:2px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:7px;padding:2px}
#zoomctl output{font:11px var(--mono);min-width:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font:12px var(--sans);color:var(--muted);background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:7px;padding:4px 10px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 220px);overflow:hidden;text-overflow:ellipsis}
/* ---------- inspector ---------- */
#insp{grid-area:insp;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:10px 10px 30px;min-height:0}
#insp h2{font:600 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:2px 0 10px;display:flex;align-items:center;justify-content:space-between}
#insp h4{font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 8px;align-items:center}
.kv label{color:var(--muted);font-size:12px}
.kv input,.kv select,.kv textarea,.field{width:100%;min-width:0;height:28px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);padding:0 7px;font:12px var(--mono)}
.kv textarea{height:auto;min-height:74px;padding:5px 7px;resize:vertical}
.kv input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.kv .err{grid-column:2;color:var(--danger);font-size:11px;margin-top:-3px}
.invalid{border-color:var(--danger)!important;background:color-mix(in srgb,var(--danger) 10%,var(--panel2))!important}
.typebadge{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--mono);color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:11px}
.ports{width:100%;border-collapse:collapse;font:11px var(--mono)}
.ports td{padding:3px 4px;border-bottom:1px solid var(--line)}
.ports td.v{text-align:right;color:var(--accent2)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);border-radius:99px;padding:1px 8px;font:11px var(--mono);color:var(--muted)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.chip.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.help-list{margin:0;padding-left:16px;color:var(--muted);font-size:12px}
.help-list li{margin:3px 0}
kbd{font:11px var(--mono);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--panel2);color:var(--text)}
/* ---------- dock ---------- */
#dock{grid-area:dock;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);min-height:0;position:relative}
#dockResize{position:absolute;left:0;right:0;top:-4px;height:8px;cursor:ns-resize;z-index:3;touch-action:none}
.tabs{display:flex;align-items:center;gap:2px;padding:3px 6px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.tab{height:26px;padding:0 10px;border-radius:6px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--muted);font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tab[aria-selected=true]{color:var(--text);background:var(--panel3);border-color:var(--line)}
.tabpanel{flex:1;min-height:0;display:none;overflow:hidden}
.tabpanel.active{display:flex}
#app.dock-min .tabpanel{display:none}
/* analyzer */
#pAna{flex-direction:column}
.anabar{display:flex;align-items:center;gap:4px;padding:4px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.anabar .field{width:auto;height:24px}
.anabody{flex:1;display:flex;min-height:0}
#anaNames{width:190px;flex:none;border-right:1px solid var(--line);overflow:hidden;position:relative}
#anaWrap{flex:1;position:relative;min-width:0}
#anaCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.prow{position:absolute;left:0;right:0;display:flex;align-items:center;gap:4px;padding:0 6px;font:11px var(--mono);border-bottom:1px solid var(--line)}
.prow input{flex:1;min-width:0;border:1px solid transparent;background:transparent;height:20px;font:11px var(--mono);padding:0 3px;border-radius:4px}
.prow input:focus{border-color:var(--line2);background:var(--panel2)}
.prow .sw{width:8px;height:8px;border-radius:2px;flex:none}
.prow .pv{color:var(--accent2);min-width:44px;text-align:right}
.prow button{border:0;background:transparent;color:var(--faint);cursor:pointer;padding:0 2px;font-size:13px}
.prow button:hover{color:var(--danger)}
#anaEmpty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:10px;pointer-events:none}
#anaRead{font:11px var(--mono);color:var(--muted);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
/* truth table + diag */
#pTT,#pDiag{overflow:auto;padding:8px 10px;gap:16px;align-items:flex-start;flex-wrap:wrap}
.ttcol{min-width:220px;flex:1}
.ttcol h5,.dcol h5{font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}
.chk{display:flex;align-items:center;gap:6px;font:12px var(--mono);padding:2px 0}
.chk input{accent-color:var(--accent)}
table.tt{border-collapse:collapse;font:11px var(--mono)}
table.tt th,table.tt td{padding:2px 7px;border:1px solid var(--line);text-align:center}
table.tt th{background:var(--panel2);color:var(--muted);position:sticky;top:0}
table.tt td.o{color:var(--accent2)}
table.tt tr.osc td{background:color-mix(in srgb,var(--osc) 16%,transparent)}
table.tt td.sep{border-left:2px solid var(--line2)}
.ttscroll{max-height:100%;overflow:auto}
.expr{font:12px var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:4px 0 10px;word-break:break-word;user-select:text}
.kmap{border-collapse:collapse;font:11px var(--mono);margin:4px 0 12px}
.kmap td,.kmap th{border:1px solid var(--line2);width:30px;height:24px;text-align:center}
.kmap th{color:var(--muted);font-weight:400;background:var(--panel2)}
.kmap td.one{background:color-mix(in srgb,var(--hi) 22%,transparent)}
.dcol{min-width:240px;flex:1;max-width:520px}
.dlist{font:11px/1.5 var(--mono);color:var(--muted);max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:var(--panel2);white-space:pre}
.dlist .w{color:var(--warn)} .dlist .e{color:var(--danger)} .dlist .a{color:var(--accent2)} .dlist b{color:var(--text)}
/* ---------- popups ---------- */
.pop{position:fixed;z-index:60;min-width:190px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:4px;max-height:80vh;overflow:auto}
.pop button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:18px;border:0;background:transparent;padding:6px 9px;border-radius:5px;cursor:pointer;text-align:left;font-size:12.5px;color:var(--text)}
.pop button:hover,.pop button:focus{background:var(--panel3);outline:none}
.pop button[disabled]{opacity:.4}
.pop button kbd{opacity:.8}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.pop .ph{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:6px 9px 2px}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--panel3);border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font:11px/1.4 var(--mono);white-space:pre;box-shadow:var(--shadow);max-width:340px}
#toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:80;pointer-events:none}
.toast{background:var(--panel3);border:1px solid var(--line2);border-left:3px solid var(--accent);padding:7px 12px;border-radius:7px;box-shadow:var(--shadow);font-size:12.5px;max-width:min(560px,92vw);animation:tin .18s ease-out}
.toast.err{border-left-color:var(--danger)} .toast.warn{border-left-color:var(--warn)} .toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);padding:0;max-width:min(640px,94vw);width:100%}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.dlg-b{padding:12px 14px;max-height:70vh;overflow:auto}
.dlg-f{display:flex;gap:6px;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--line)}
.set-grid{display:grid;grid-template-columns:180px 1fr;gap:9px 12px;align-items:center}
.set-grid label{color:var(--muted);font-size:12.5px}
.set-grid .field{height:28px}
.ovl{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.projlist{display:flex;flex-direction:column;gap:4px}
.proj{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel2)}
.proj .nm{flex:1;font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
#inspToggle,#inspClose{display:none}
/* ---------- narrow layouts ---------- */
@media (max-width: 1400px){ .brand b,.brand span{display:none} .brand{margin-right:0} }
@media (max-width: 1240px){ .lbl{display:none} }
@media (max-width: 980px){ :root{--palW:170px;--inspW:240px} #mini{width:130px;height:84px} }
@media (max-width: 820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) var(--dockH);grid-template-areas:"top" "pal" "stage" "dock";--dockH:40vh}
  #app.dock-min{--dockH:34px}
  #top{gap:4px;padding:4px 6px}
  .grp{padding:0 2px}
  .brand b,.brand span{display:none}
  #projName{width:96px}
  .speed input{width:70px}
  .speed output{min-width:52px}
  #palette{border-right:0;border-bottom:1px solid var(--line);padding:4px 6px;overflow-x:auto;overflow-y:hidden;display:flex;gap:4px;align-items:center;white-space:nowrap}
  #palette h3{display:none}
  #palette .pal-grid{display:contents}
  #palette .palsearch{display:none}
  .pal-item{flex:none;width:66px;padding:3px 2px;touch-action:pan-x}
  .pal-item canvas{width:56px;height:28px}
  #insp{position:fixed;top:0;right:0;bottom:0;width:min(330px,90vw);z-index:40;transform:translateX(105%);transition:transform .2s ease;box-shadow:var(--shadow)}
  #insp.open{transform:none}
  #inspClose{display:inline-flex;position:absolute;top:6px;right:6px;z-index:2}
  #inspBody h2{padding-right:34px}
  #inspToggle{display:inline-flex}
  #mini{width:120px;height:78px}
  #anaNames{width:120px}
  #hint{display:none}
  .set-grid{grid-template-columns:1fr}
  .kv{grid-template-columns:84px 1fr}
}
@media (pointer:coarse){ .btn{min-height:34px;min-width:34px} .tab{height:32px} }
@media (prefers-reduced-motion: reduce){ .toast{animation:none} #insp{transition:none} }
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand" title="Logic Lab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="5" fill="none" stroke="var(--accent)" stroke-width="1.6"/><path d="M5 15h3V9h4v6h3V9h4" fill="none" stroke="var(--hi)" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <b>LOGIC</b><span>LAB</span>
    </div>
    <div class="grp">
      <button class="btn" id="mFile" aria-haspopup="menu" aria-expanded="false">File <span aria-hidden="true">▾</span></button>
      <button class="btn" id="mExamples" aria-haspopup="menu" aria-expanded="false">Examples <span aria-hidden="true">▾</span></button>
    </div>
    <div class="grp">

<script>
'use strict';
/* =====================================================================
   LOGIC LAB — single-file digital logic & tiny-CPU laboratory
   Sections: core values · component registry · simulator · rendering ·
             editor · panels · persistence · presets · boot
   ===================================================================== */

/* ---------------------------- core utils ---------------------------- */
const GRID = 10;
const MASK = w => (w >= 32 ? 0xFFFFFFFF : 2 ** w - 1);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const snapTo = (v, s) => Math.round(v / s) * s;
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
const nowMs = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());

// 4-state encoding per bit: (x=0,v) known value; (x=1,v=0) Z = high impedance; (x=1,v=1) X = unknown/conflict
function hexDigits(v, x, w) {
  let s = '';
  for (let i = Math.ceil(w / 4) - 1; i >= 0; i--) {
    const sh = i * 4, nm = (i * 4 + 4 > w) ? MASK(w - i * 4) : 15;
    const dx = (x >>> sh) & nm, dv = (v >>> sh) & nm;
    s += dx ? ((dx === nm && (dv & dx) === 0) ? 'z' : 'x') : dv.toString(16).toUpperCase();
  }
  return s;
}
function binDigits(v, x, w) {
  let s = '';
  for (let i = w - 1; i >= 0; i--) { const b = 2 ** i; const xb = Math.floor(x / b) % 2, vb = Math.floor(v / b) % 2; s += xb ? (vb ? 'x' : 'z') : String(vb); }
  return s;
}
function fmtVal(v, x, w, radix) {
  const M = MASK(w); v = (v & M) >>> 0; x = (x & M) >>> 0;
  if (w === 1) return x ? (v ? 'X' : 'Z') : String(v);
  if (x) {
    if (x === M) return v === 0 ? 'Z' : 'X';
    return radix === 'bin' ? '0b' + binDigits(v, x, w) : '0x' + hexDigits(v, x, w);
  }
  switch (radix) {
    case 'dec': return String(v);
    case 'sdec': return String(w >= 32 ? (v | 0) : (v >= 2 ** (w - 1) ? v - 2 ** w : v));
    case 'bin': return '0b' + v.toString(2).padStart(w, '0');

}
function parseNum(s) {
  s = String(s).trim().replace(/_/g, '').toLowerCase();
  if (!s) return NaN;
  let m;
  if ((m = /^0x([0-9a-f]+)$/.exec(s))) return parseInt(m[1], 16);
  if ((m = /^0b([01]+)$/.exec(s))) return parseInt(m[1], 2);
  if ((m = /^-?[0-9]+$/.exec(s))) return parseInt(s, 10);
  if ((m = /^\$?([0-9a-f]+)h?$/.exec(s)) && /[a-f]/.test(s)) return parseInt(m[1], 16);
  return NaN;
}
// Parse memory contents: whitespace/comma separated numbers (hex by default, 0b/0d prefixes allowed)
function parseMem(text, words, width) {
  const out = [], M = MASK(width);
  const toks = String(text || '').replace(/;[^\n]*/g, ' ').split(/[\s,]+/).filter(Boolean);
  if (toks.length > words) return { err: `Too many words: ${toks.length} > ${words}` };
  for (const t of toks) {
    let v;
    if (/^0d\d+$/i.test(t)) v = parseInt(t.slice(2), 10);
    else if (/^0b[01]+$/i.test(t)) v = parseInt(t.slice(2), 2);
    else if (/^(0x)?[0-9a-f]+$/i.test(t)) v = parseInt(t.replace(/^0x/i, ''), 16);
    else return { err: `Bad value "${t.slice(0, 12)}"` };
    if (!(v >= 0 && v <= M)) return { err: `Value ${t} exceeds ${width}-bit range` };
    out.push(v);
  }
  return { data: out };
}

/* ------------------------- component registry ------------------------ */
const T = Object.create(null);
const CATS = ['Inputs', 'Outputs', 'Gates', 'Plexers', 'Arithmetic', 'Memory', 'Wiring', 'Notes'];
function defComp(type, d) { d.type = type; d.props = d.props || []; T[type] = d; }
// dw: the global 'default bit width' setting applies only to generically 1-bit parts
const pWidth = (def = 1) => ({ k: 'width', label: 'Bit width', type: 'int', min: 1, max: 32, def, dw: def === 1 });
const pInputs = { k: 'inputs', label: 'Inputs', type: 'int', min: 2, max: 8, def: 2 };
const LED_COLORS = ['green', 'red', 'amber', 'blue', 'white'];

// Layout cache keyed by the (immutable-by-convention) props object
const _layoutCache = new WeakMap();
function layoutOf(cd) {
  let L = _layoutCache.get(cd.props);
  if (!L) { L = T[cd.type].layout(cd.props); L.io = L.io || []; _layoutCache.set(cd.props, L); }
  return L;
}
function defaultProps(type, overrides, defaultWidth) {
  const d = T[type], p = {};
  for (const s of d.props) p[s.k] = (s.dw && defaultWidth) ? clamp(defaultWidth, s.min, s.max) : (typeof s.def === 'function' ? s.def() : s.def);
  return Object.assign(p, overrides || {});
}
// Validate + sanitize a props object against the schema (used by import and inspector)
function sanitizeProps(type, raw, strict) {
  const d = T[type], p = {}, errs = [];
  raw = (raw && typeof raw === 'object') ? raw : {};
  for (const s of d.props) {
    let v = Object.prototype.hasOwnProperty.call(raw, s.k) ? raw[s.k] : undefined;
    if (v === undefined) { p[s.k] = typeof s.def === 'function' ? s.def() : s.def; continue; }
    if (s.type === 'int' || s.type === 'num') {
      if (typeof v === 'string') v = parseNum(v);
      if (typeof v !== 'number' || !Number.isFinite(v) || Math.floor(v) !== v) { errs.push(`${s.k}: not an integer`); v = s.def; }
      const max = s.type === 'num' ? MASK(p.width || 1) : s.max;
      if (v < (s.min || 0) || v > max) { errs.push(`${s.k}: ${v} out of range`); v = clamp(v, s.min || 0, max); }
    } else if (s.type === 'sel') {
      const ok = s.opts.some(o => o[0] === v);
      if (!ok) { errs.push(`${s.k}: invalid option`); v = s.def; }
    } else if (s.type === 'text' || s.type === 'mem' || s.type === 'area') {
      if (typeof v !== 'string') { errs.push(`${s.k}: not text`); v = s.def; }
      v = v.slice(0, s.max || 200);
    } else if (s.type === 'bool') v = !!v;
    p[s.k] = v;
  }
  if (d.validate) { const e = d.validate(p); if (e) errs.push(e); }
  return strict ? { props: p, errs } : p;
}

/* --- gate evaluation with X/Z semantics (bitwise over the bus width) --- */
function evalAnd(s, c, inv) {
  const M = c.M, n = c.nIn; let z0 = 0, all1 = M;
  for (let k = 0; k < n; k++) { const v = s.v(c, k), x = s.x(c, k); z0 |= ~x & ~v; all1 &= ~x & v; }
  const x = M & ~z0 & ~all1; let v = (all1 | x) & M;
  if (inv) v = (~v | x) & M;
  s.out(c, 0, v, x);
}
function evalOr(s, c, inv) {
  const M = c.M, n = c.nIn; let o1 = 0, all0 = M;
  for (let k = 0; k < n; k++) { const v = s.v(c, k), x = s.x(c, k); o1 |= ~x & v; all0 &= ~x & ~v; }
  const x = M & ~o1 & ~all0; let v = (o1 | x) & M;
  if (inv) v = (~v | x) & M;
  s.out(c, 0, v, x);
}
function evalXor(s, c, inv) {
  const M = c.M, n = c.nIn; let xx = 0, vv = 0;
  for (let k = 0; k < n; k++) { xx |= s.x(c, k); vv ^= s.v(c, k); }
  const x = xx & M; let v = ((vv & ~xx) | xx) & M;
  if (inv) v = (~v | x) & M;
  s.out(c, 0, v, x);
}
function gateLayout(p) {
  const n = p.inputs, h = n * 20, ins = [];
  for (let k = 0; k < n; k++) ins.push({ n: 'in' + k, w: p.width, y: 10 + k * 20 });
  return { w: 60, h, ins, outs: [{ n: 'out', w: p.width, y: h / 2 }] };
}
const gateProps = [pInputs, pWidth(1)];
defComp('and',  { name: 'AND',  cat: 'Gates', props: gateProps, layout: gateLayout, eval: (s, c) => evalAnd(s, c, 0), tdelay: 2, sym: 'and' });
defComp('or',   { name: 'OR',   cat: 'Gates', props: gateProps, layout: gateLayout, eval: (s, c) => evalOr(s, c, 0), tdelay: 2, sym: 'or' });
defComp('xor',  { name: 'XOR',  cat: 'Gates', props: gateProps, layout: gateLayout, eval: (s, c) => evalXor(s, c, 0), tdelay: 3, sym: 'xor' });
defComp('nand', { name: 'NAND', cat: 'Gates', props: gateProps, layout: gateLayout, eval: (s, c) => evalAnd(s, c, 1), tdelay: 1, sym: 'and', neg: 1 });
defComp('nor',  { name: 'NOR',  cat: 'Gates', props: gateProps, layout: gateLayout, eval: (s, c) => evalOr(s, c, 1), tdelay: 1, sym: 'or', neg: 1 });
defComp('xnor', { name: 'XNOR', cat: 'Gates', props: gateProps, layout: gateLayout, eval: (s, c) => evalXor(s, c, 1), tdelay: 3, sym: 'xor', neg: 1 });
const unaryLayout = p => ({ w: 40, h: 20, ins: [{ n: 'in', w: p.width, y: 10 }], outs: [{ n: 'out', w: p.width, y: 10 }] });
defComp('not', { name: 'NOT', cat: 'Gates', props: [pWidth(1)], layout: unaryLayout, tdelay: 1, sym: 'buf', neg: 1,
  eval(s, c) { const M = c.M, v = s.v(c, 0), x = s.x(c, 0) & M; s.out(c, 0, (~v | x) & M, x); } });
defComp('buf', { name: 'Buffer', cat: 'Gates', props: [pWidth(1)], layout: unaryLayout, tdelay: 1, sym: 'buf',
  eval(s, c) { const M = c.M, x = s.x(c, 0) & M; s.out(c, 0, (s.v(c, 0) | x) & M, x); } });
defComp('tristate', { name: 'Tri-state', cat: 'Gates', props: [pWidth(1), { k: 'active', label: 'Enable', type: 'sel', opts: [['high', 'active high'], ['low', 'active low']], def: 'high' }],
  tri: true, tdelay: 1, sym: 'tri',
  layout: p => ({ w: 40, h: 40, ins: [{ n: 'in', w: p.width, y: 10 }, { n: 'en', w: 1, y: 30, lbl: p.active === 'low' ? 'EN̅' : 'EN' }], outs: [{ n: 'out', w: p.width, y: 10 }] }),
  eval(s, c) {
    const M = c.M, ex = s.x(c, 1) & 1; let ev = s.v(c, 1) & 1;
    if (c.p.active === 'low') ev ^= 1;
    if (ex) { s.out(c, 0, M, M); return; }
    if (!ev) { s.out(c, 0, 0, M); return; }
    const x = s.x(c, 0) & M; s.out(c, 0, (s.v(c, 0) | x) & M, x);
  } });

/* ------------------------------- inputs ------------------------------- */
function switchLayout(p) {
  const w = p.width;
  if (w === 1) return { w: 40, h: 20, ins: [], outs: [{ n: 'out', w: 1, y: 10 }] };
  const cols = Math.min(w, 8), rows = Math.ceil(w / 8);
  const W = Math.max(60, Math.ceil((cols * 12 + 14) / 10) * 10), H = Math.ceil((22 + rows * 12) / 20) * 20;
  return { w: W, h: H, ins: [], outs: [{ n: 'out', w, y: H / 2 }], cols, rows };
}
defComp('switch', { name: 'Switch', cat: 'Inputs', props: [pWidth(1), { k: 'value', label: 'Value', type: 'num', min: 0, def: 0 }],
  layout: switchLayout, tdelay: 1, isInput: true,
  eval(s, c) { s.out(c, 0, c.p.value & c.M, 0); } });
defComp('button', { name: 'Button', cat: 'Inputs', props: [{ k: 'active', label: 'Output when pressed', type: 'sel', opts: [['1', '1 (active high)'], ['0', '0 (active low)']], def: '1' }],
  layout: () => ({ w: 40, h: 40, ins: [], outs: [{ n: 'out', w: 1, y: 20 }] }), tdelay: 1, isInput: true,
  init: () => ({ pressed: false }),

  render() {

    const scopeTxt = this.scope ? `selection (${this.scope.size} components)` : 'whole circuit';
    let html = `<div class="ttcol" style="max-width:300px;flex:0 0 260px">
      <h5>Scope</h5><div class="small muted" style="margin-bottom:6px">Analysing the <b>${scopeTxt}</b>. Select a subcircuit (incl. its switches and LEDs/displays), then refresh.</div>
      <div class="row" style="margin:0 0 8px"><button class="btn sm" id="ttRefresh">Use current selection</button><button class="btn sm on" id="ttGen">Generate table</button></div>
      <h5>Inputs (mark)</h5>${this.inputs.map((i, k) => `<label class="chk"><input type="checkbox" data-in="${k}"${i.on ? ' checked' : ''}> ${esc(i.name)} <span class="muted">${i.w}b</span></label>`).join('') || '<div class="small muted">No switches/buttons in scope</div>'}
      <h5 style="margin-top:10px">Outputs (mark)</h5>${this.outputs.map((o, k) => `<label class="chk"><input type="checkbox" data-out="${k}"${o.on ? ' checked' : ''}> ${esc(o.name)} <span class="muted">${o.w}b</span></label>`).join('') || '<div class="small muted">No LEDs/displays in scope</div>'}
      <div class="small ${bits > 12 ? '' : 'muted'}" style="margin-top:8px;${bits > 12 ? 'color:var(--danger)' : ''}">${bits} input bit${bits === 1 ? '' : 's'} → ${2 ** bits} rows${bits > 12 ? ' (max 12 bits)' : ''}</div>
      </div>`;
    const R = this.result;
    if (R) {
      if (R.error) html += `<div class="ttcol"><div class="chip bad">${esc(R.error)}</div></div>`;
      else {
        html += `<div class="ttcol" style="flex:1 1 360px;max-height:100%;overflow:auto"><h5>Truth table — ${R.rows.length} rows${R.osc ? ` · <span style="color:var(--osc)">${R.osc} non-settling</span>` : ''}${R.seq ? ' · <span style="color:var(--warn)">contains state elements (each row from reset)</span>' : ''}</h5>
          <table class="tt"><thead><tr>${R.inNames.map(n => `<th>${esc(n)}</th>`).join('')}${R.outs.map((o, i) => `<th class="${i === 0 ? 'sep' : ''}">${esc(o.name)}</th>`).join('')}</tr></thead><tbody>
          ${R.rows.slice(0, 1024).map(r => `<tr class="${r.osc ? 'osc' : ''}">${r.bits.map(b => `<td>${b}</td>`).join('')}${r.vals.map((v, i) => `<td class="o ${i === 0 ? 'sep' : ''}">${r.osc ? '⟳' : esc(v)}</td>`).join('')}</tr>`).join('')}
          </tbody></table>${R.rows.length > 1024 ? '<div class="small muted">(first 1024 rows shown)</div>' : ''}</div>`;
        html += `<div class="ttcol" style="flex:1 1 280px"><h5>Simplified (sum of products, Quine–McCluskey)</h5>${R.exprs.map(e => `<div class="small muted">${esc(e.name)} =</div><div class="expr">${esc(e.expr)}</div>`).join('') || '<div class="small muted">Expressions are derived for ≤ 10 input bits and 1-bit outputs (or output bits ≤ 8).</div>'}
          ${R.kmaps.map(k => `<div class="small muted">K-map: ${esc(k.name)}</div>${k.html}`).join('')}</div>`;

    el.innerHTML = html;
    $('ttRefresh').onclick = () => this.refreshIO(true);
    $('ttGen').onclick = () => this.generate();
    el.querySelectorAll('[data-in]').forEach(c => c.onchange = () => { this.inputs[+c.dataset.in].on = c.checked; this.render(); });
    el.querySelectorAll('[data-out]').forEach(c => c.onchange = () => { this.outputs[+c.dataset.out].on = c.checked; });
  },
  generate() {
    if (!this.inputs.length && !this.outputs.length) this.refreshIO(false);
    const ins = this.inputs.filter(i => i.on), outs = this.outputs.filter(o => o.on);
    const bits = ins.reduce((a, i) => a + i.w, 0);
    if (!ins.length || !outs.length) { this.result = { error: 'Mark at least one input and one output' }; this.render(); return; }
    if (bits > 12) { this.result = { error: `Too many input bits (${bits} > 12)` }; this.render(); return; }
    const ids = this.scope || new Set(App.doc.components.map(c => c.id));
    for (const i of ins) ids.add(i.id); for (const o of outs) ids.add(o.id);
    const sub = JSON.parse(JSON.stringify({ components: App.doc.components.filter(c => ids.has(c.id)), wires: App.doc.wires.filter(w => ids.has(w.a.c) && ids.has(w.b.c)), probes: [] }));

      const bitsArr = []; for (let b = bits - 1; b >= 0; b--) bitsArr.push(Math.floor(r / 2 ** b) % 2);

    }
    // expressions and K-maps
    const exprs = [], kmaps = [];
    if (bits <= 10) {
      outs.forEach((o, k) => {
        const nb = Math.min(o.w, 8);
        for (let b = 0; b < nb; b++) {
          const ones = [], dcs = [];
          rows.forEach((row, r) => { const [v, x] = row.raw[k]; const xb = Math.floor(x / 2 ** b) % 2, vb = Math.floor(v / 2 ** b) % 2; if (row.osc || xb) dcs.push(r); else if (vb) ones.push(r); });
          const name = o.w === 1 ? o.name : `${o.name}[${b}]`;
          exprs.push({ name, expr: sopString(qmMinimize(bits, ones, dcs), inNames) + (dcs.length ? `   (${dcs.length} don't-care row${dcs.length > 1 ? 's' : ''}: X/Z/⟳)` : '') });
          if (bits >= 2 && bits <= 4 && kmaps.length < 4) kmaps.push({ name, html: kmapHTML(bits, inNames, r => { const [v, x] = rows[r].raw[k]; return rows[r].osc ? '⟳' : (Math.floor(x / 2 ** b) % 2 ? 'X' : String(Math.floor(v / 2 ** b) % 2)); }) });
        }
      });
    }
    this.result = { rows, inNames, outs, exprs, kmaps, osc, seq };
    this.render();
    toast(`Truth table: ${rows.length} rows${osc ? `, ${osc} non-settling` : ''}`, osc ? 'warn' : 'ok');
  },
};
function kmapHTML(n, names, cell) {
  const gray = k => k ^ (k >> 1);
  const rb = n >> 1, cb = n - rb, R = 2 ** rb, Cc = 2 ** cb;
  const rn = names.slice(0, rb).join(''), cn = names.slice(rb).join('');
  let h = `<table class="kmap"><tr><th>${esc(rn)}\\${esc(cn)}</th>`;
  for (let c = 0; c < Cc; c++) h += `<th>${gray(c).toString(2).padStart(cb, '0')}</th>`;
  h += '</tr>';
  for (let r = 0; r < R; r++) {
    h += `<tr><th>${gray(r).toString(2).padStart(rb, '0')}</th>`;
    for (let c = 0; c < Cc; c++) { const idx = gray(r) * Cc + gray(c), v = cell(idx); h += `<td class="${v === '1' ? 'one' : ''}">${v}</td>`; }

}

function hideMenus() { for (const id of ['ctx', 'menuPop']) { const m = $(id); if (!m.hidden) { m.hidden = true; } } $('mFile').setAttribute('aria-expanded', 'false'); $('mExamples').setAttribute('aria-expanded', 'false'); }
function showMenu(el, x, y, items) {
  el.innerHTML = '';

    if (it === '-') { el.appendChild(document.createElement('hr')); continue; }
    if (it.head) { const h = document.createElement('div'); h.className = 'ph'; h.textContent = it.head; el.appendChild(h); continue; }

  }

  const w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = clamp(x, 4, innerWidth - w - 4) + 'px'; el.style.top = clamp(y, 4, innerHeight - h - 4) + 'px';
  const btns = [...el.querySelectorAll('button:not([disabled])')]; if (btns[0]) btns[0].focus();

  };
}

// Strict import validation: whitelisted structure only, props sanitised against each type's schema.

  const doc = newDoc(typeof src.name === 'string' && src.name.trim() ? src.name.trim().slice(0, 60) : 'Imported circuit');

    const b = Builder('Oscillating loop');
    b.note(40, -10, 'Ring oscillator: NAND + two inverters feed back on themselves.\nTurn EN on → the loop has no stable state. The engine detects the non-settling nets,\nforces them to X (purple, dashed) and keeps running.  Turn EN off to recover.', 12);
    const en = b.add('switch', 40, 80, {}, 'EN');
    const g = b.add('nand', 160, 80), n1 = b.add('not', 280, 90), n2 = b.add('not', 380, 90), l = b.add('led', 480, 90, { color: 'red' }, 'OUT');
    b.w(en, 'out', g, 'in0'); b.w(g, 'out', n1, 'in'); b.w(n1, 'out', n2, 'in'); b.w(n2, 'out', g, 'in1'); b.w(n2, 'out', l, 'in');
    b.note(40, 200, 'Also try: wire an output back into its own gate, or set Settings ▸ Step limit lower.', 11);
    b.probe('EN', en, 'out'); b.probe('LOOP', g, 'out'); b.probe('OUT', n2, 'out');
    return b.done();
  } },
  bus: { name: 'Tri-state bus & contention', build() {
    const b = Builder('Tri-state bus');
    b.note(40, -10, 'Two tri-state buffers share one 4-bit bus.  One enabled → the bus carries its value.\nNone → Z (floating, dashed grey).  Both with different values → contention (X, pink).', 12);
    const c1 = b.add('const', 60, 70, { width: 4, value: 3 }), c2 = b.add('const', 60, 190, { width: 4, value: 12 });
    const e1 = b.add('switch', 40, 110, { value: 1 }, 'EN1'), e2 = b.add('switch', 40, 230, {}, 'EN2');
    const t1 = b.add('tristate', 180, 70, { width: 4 }), t2 = b.add('tristate', 180, 190, { width: 4 });
    b.w(c1, 'out', t1, 'in'); b.w(e1, 'out', t1, 'en'); b.w(c2, 'out', t2, 'in'); b.w(e2, 'out', t2, 'en');
    const d = b.add('display', 340, 120, { width: 4 }, 'BUS');
    b.w(t1, 'out', d, 'in'); b.w(t2, 'out', d, 'in');
    b.probe('EN1', e1, 'out'); b.probe('EN2', e2, 'out'); b.probe('BUS', t1, 'out');
    return b.done();
  } },
  stress: { name: 'Stress test (~600 parts)', build() {
    const b = Builder('Stress test');
    b.note(0, -50, 'Performance test: 20 inverter chains × 25 gates driven by the clock, plus 20 counters with displays.\nEvery clock edge ripples ~1000 events through the event queue.', 12);
    const clk = b.add('clock', 0, 0, {}, 'CLK'); b.w(clk, 'clk', b.tout('CLK', 70, 10), 'io');
    for (let r = 0; r < 20; r++) {
      const y = 60 + r * 40; let prev = b.tin('CLK', 60, y), port = 'io';
      for (let k = 0; k < 25; k++) { const n = b.add(k % 5 === 4 ? 'buf' : 'not', 80 + k * 60, y); b.w(prev, port, n, 'in'); prev = n; port = 'out'; }
      b.w(prev, port, b.add('led', 80 + 25 * 60 + 20, y), 'in');
    }
    for (let i = 0; i < 20; i++) {
      const x = 1700 + (i % 4) * 190, y = 60 + Math.floor(i / 4) * 130;
      const c = b.add('counter', x, y, { width: 8 }); b.w(b.tin('CLK', x - 20, y), 'io', c, 'clk');
      b.w(c, 'q', b.add('display', x + 90, y, { width: 8 }), 'in');
    }
    return b.done();
  } },
};
const PRESET_ORDER = ['welcome', 'halfadder', 'fulladder', 'mux', 'srlatch', 'register', 'counter', 'alu', 'memtest', 'cpu', 'osc', 'bus', 'stress'];
function loadPreset(key) {
  const p = PRESETS[key]; if (!p) return;
  const doc = p.build();
  replaceDoc(doc, 'Load example', { running: true });
  if (p.hz && App.settings.hz < p.hz) { App.settings.hz = p.hz; saveSettings(); syncSpeed(); toast(`Clock set to ${p.hz} Hz for this example`); }
  toast(`Loaded example: ${p.name}`, 'ok');
}

/* -------------------------------- boot -------------------------------- */
function fileMenuItems() {
  return [
    { label: 'New circuit', act: () => { replaceDoc(newDoc(), 'New circuit', { running: true }); toast('New empty circuit (Ctrl+Z restores the previous one)'); } },
    { label: 'Projects…', act: openProjects },
    { label: App.project ? `Save "${App.project}"` : 'Save as project…', key: 'Ctrl+S', act: () => saveProject() },
    '-',
    { label: 'Import JSON…', act: () => $('fileIn').click() },
    { label: 'Export JSON', act: exportJSON },
    { label: 'Export SVG', act: () => exportImage('svg') },
    { label: 'Export PNG', act: () => exportImage('png') },
    '-',
    { label: 'Copy share link…', act: shareLink },
    { label: 'Open share link…', act: openShareCode },
  ];
}
function toggleMenu(btn, items) {
  const pop = $('menuPop');
  if (!pop.hidden && pop.dataset.owner === btn.id) { hideMenus(); return; }
  hideMenus(); const r = btn.getBoundingClientRect();
  pop.dataset.owner = btn.id; btn.setAttribute('aria-expanded', 'true');
  showMenu(pop, r.left, r.bottom + 4, items);
}
async function initialDoc() {
  const h = location.hash;
  if (/^#c=/.test(h)) {
    try {
      const json = await decodeShare(h);
      const { doc, warns } = validateDoc(JSON.parse(json));
      loadDoc(doc, { running: true }); toast(`Loaded shared circuit "${doc.name}"` + (warns.length ? ` (${warns.length} warnings)` : ''), warns.length ? 'warn' : 'ok');
      return;
    } catch (e) { toast('Shared link could not be loaded: ' + e.message, 'err'); }
  }
  const saved = store.get('logiclab.autosave', null);
  if (saved && saved.doc) {
    try { const { doc } = validateDoc(saved.doc); if (doc.components.length) { loadDoc(doc, { view: saved.view, project: saved.project && projects()[saved.project] ? saved.project : null, running: true }); hint('Restored your last session · Examples ▸ Welcome for the tour'); return; } }
    catch (e) { /* fall through to the default example */ }
  }
  loadDoc(PRESETS.welcome.build(), { running: true });
}
function boot() {
  cv = $('cv'); ctx = cv.getContext('2d'); mini = $('mini'); miniCtx = mini.getContext('2d');
  App.settings = loadSettings();
  document.documentElement.dataset.theme = App.settings.theme; loadColors();
  App.doc = newDoc(); reindex();
  buildPalette(); Ana.init(); Dock.init(); TT.render(); syncSpeed();
  // canvas input
  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);
  cv.addEventListener('pointerleave', () => { hideTip(); if (!App.gesture) { App.hoverPort = null; App.hoverWire = null; App.needRender = true; } });
  cv.addEventListener('wheel', onWheel, { passive: false });
  cv.addEventListener('contextmenu', e => { e.preventDefault(); const p = ptrPos(e); openContextMenu(e.clientX, e.clientY, p.sx, p.sy); });
  cv.addEventListener('dblclick', e => { const p = ptrPos(e), w = toWorld(p.sx, p.sy), cd = hitComp(w.x, w.y); if (cd && cd.type !== 'switch' && cd.type !== 'button') { openInspector(); const f = $('pf_label'); if (f) f.focus(); } });
  window.addEventListener('keydown', onKey);
  window.addEventListener('pointerdown', e => {
    if (!e.target.closest('.pop') && !e.target.closest('#mFile') && !e.target.closest('#mExamples')) hideMenus();
    if ($('insp').classList.contains('open') && !e.target.closest('#insp') && !e.target.closest('#inspToggle') && !e.target.closest('.pop') && !e.target.closest('dialog')) $('insp').classList.remove('open');
  }, true);
  // minimap
  let miniDrag = false;
  mini.addEventListener('pointerdown', e => { miniDrag = true; mini.setPointerCapture(e.pointerId); miniNav(e); });
  mini.addEventListener('pointermove', e => { if (miniDrag) miniNav(e); });
  mini.addEventListener('pointerup', () => { miniDrag = false; });
  // toolbar
  $('mFile').onclick = e => toggleMenu(e.currentTarget, fileMenuItems());
  $('mExamples').onclick = e => toggleMenu(e.currentTarget, [{ head: 'Curated examples' }, ...PRESET_ORDER.map(k => ({ label: PRESETS[k].name, act: () => loadPreset(k) }))]);
  $('bUndo').onclick = undo; $('bRedo').onclick = redo;
  document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
  $('bRun').onclick = () => setRunning(!App.running);
  $('bEvent').onclick = stepEvent; $('bEdge').onclick = stepEdge; $('bTick').onclick = stepTick; $('bSettle').onclick = settleNow; $('bReset').onclick = resetSim;
  $('speed').oninput = e => applySetting('hz', speedToHz(+e.target.value));
  $('zIn').onclick = () => zoomAt(App.W / 2, App.H / 2, 1.25); $('zOut').onclick = () => zoomAt(App.W / 2, App.H / 2, 0.8); $('zFit').onclick = () => fitView();
  $('bSettings').onclick = () => { renderSettings(); $('dlgSettings').showModal(); };
  $('setDefaults').onclick = () => { const th = App.settings.theme; App.settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS)); App.settings.theme = th; saveSettings(); renderSettings(); syncSpeed(); rebuild(); App.needRender = true; toast('Settings restored to defaults'); };
  $('bHelp').onclick = openHelp;
  $('bTheme').onclick = () => { const order = ['dark', 'light', 'contrast', 'cb'], i = order.indexOf(App.settings.theme); applySetting('theme', order[(i + 1) % order.length]); toast('Theme: ' + { dark: 'dark', light: 'light', contrast: 'high contrast', cb: 'colour-blind safe' }[App.settings.theme]); };
  $('inspToggle').onclick = () => $('insp').classList.toggle('open');
  $('inspClose').onclick = () => { $('insp').classList.remove('open'); $('inspToggle').focus(); };
  $('projName').onchange = e => { const v = e.target.value.trim().slice(0, 60) || 'Untitled circuit'; e.target.value = v; begin(); App.doc.name = v; commit('Rename circuit', false); };
  $('projName').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
  $('projSaveBtn').onclick = () => { const n = $('projSaveName').value.trim(); if (!n) { $('projSaveName').classList.add('invalid'); toast('Enter a project name', 'err'); return; } $('projSaveName').classList.remove('invalid'); saveProject(n); };
  $('projSaveName').onkeydown = e => { if (e.key === 'Enter') $('projSaveBtn').click(); };
  document.querySelectorAll('dialog [data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
  document.querySelectorAll('dialog').forEach(d => d.addEventListener('close', () => cv.focus({ preventScroll: true })));
  const importFile = async f => {
    if (!f) return; if (f.size > 5e6) { toast('File too large (max 5 MB)', 'err'); return; }
    let text; try { text = await f.text(); } catch (err) { toast(`Could not read "${f.name}": ${err.message || err}`, 'err'); return; }
    importText(text, f.name);
  };
  $('fileIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; importFile(f); };
  // drag & drop a .json file anywhere
  window.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', e => { const f = e.dataTransfer?.files?.[0]; if (!f) return; e.preventDefault(); importFile(f); });
  // layout changes
  new ResizeObserver(() => resizeCanvas()).observe($('stage'));
  new ResizeObserver(() => Ana.resize()).observe($('anaWrap'));
  window.addEventListener('resize', () => { if ((window.devicePixelRatio || 1) !== App.dpr) resizeCanvas(); });
  window.addEventListener('hashchange', () => { if (/^#c=/.test(location.hash)) initialDoc(); });
  if (innerWidth <= 820) Dock.setMin(true);
  resizeCanvas();
  initialDoc().then(() => { setTool('select'); refreshInspector(); });
  requestAnimationFrame(frame);
}
if (typeof window !== 'undefined') {
  window.LogicLab = { App, Sim, T, PRESETS, validateDoc, fmtVal, toWorld, portPos, layoutOf, get sim() { return App.sim; } };
  if (typeof document !== 'undefined' && document.getElementById('cv')) boot();
}
