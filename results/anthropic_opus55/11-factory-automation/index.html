<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluxworks — Factory Automation &amp; Logistics</title>
<style>
:root{
  --bg:#0c0f13; --bg2:#11151b; --panel:#151a21; --panel2:#1b2129; --panel3:#212833; --line:#28303b; --line2:#36404d;
  --text:#dde5ee; --dim:#8a96a5; --faint:#5b6674;
  --amber:#ffb238; --amber2:#ffcf7a; --teal:#3dd6c6; --red:#ff5d5d; --green:#6fdc6f; --blue:#5aa9ff; --violet:#b28dff; --orange:#ff8a3d;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, "Helvetica Neue", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.35 var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,select,input,textarea{font:inherit;color:var(--text)}
#app{display:grid;grid-template-columns:58px minmax(0,1fr) 336px;grid-template-rows:46px minmax(0,1fr);height:100vh;height:100dvh;width:100vw}
/* ---------- top bar ---------- */
#top{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:0 8px;background:linear-gradient(#171c24,#11151b);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;font-size:13px;color:var(--amber);margin-right:4px;flex:none}
.brand svg{flex:none}
.brand small{color:var(--dim);font-weight:500;letter-spacing:.04em;font-size:11px}
.sep{width:1px;height:24px;background:var(--line2);flex:none;margin:0 2px}
.grp{display:flex;align-items:center;gap:4px;flex:none}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;height:30px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;flex:none;transition:background .12s,border-color .12s,color .12s;user-select:none}
.btn:hover{border-color:#4d5968;background:#232b36}
.btn:active{transform:translateY(1px)}
.btn.on{background:#2d2512;border-color:var(--amber);color:var(--amber2)}
.btn.icon{width:30px;padding:0}
.btn.primary{background:#3a2a0c;border-color:#8a6420;color:var(--amber2)}
.btn.danger{border-color:#6a2d2d;color:#ffb0b0}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
select,input[type=text],input[type=number]{background:#0e1217;border:1px solid var(--line2);border-radius:7px;height:30px;padding:0 8px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--amber)}
textarea{background:#0e1217;border:1px solid var(--line2);border-radius:7px;padding:6px 8px;width:100%;resize:vertical;font-family:var(--mono);font-size:11px;outline:none}
label.chk{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 0}
input[type=range]{accent-color:var(--amber)}
input[type=checkbox]{accent-color:var(--amber);width:15px;height:15px}
/* ---------- toolbar ---------- */
#toolbar{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:3px;overflow-y:auto;scrollbar-width:thin}
.tool{position:relative;width:44px;height:37px;border-radius:8px;border:1px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.tool:hover{background:var(--panel2);border-color:var(--line2)}
.tool.on{background:#2d2512;border-color:var(--amber);box-shadow:0 0 0 1px rgba(255,178,56,.25) inset}
.tool canvas{width:27px;height:27px;pointer-events:none}
.tool .k{position:absolute;right:2px;bottom:1px;font:600 9px var(--mono);color:var(--faint)}
.tool.on .k{color:var(--amber)}
.tsep{width:32px;height:1px;background:var(--line2);margin:4px 0;flex:none}
/* ---------- stage ---------- */
#stage{position:relative;overflow:hidden;background:#0a0d10;touch-action:none}
#cv{position:absolute;inset:0;display:block;touch-action:none;outline:none}
.float{position:absolute;background:rgba(14,18,24,.86);border:1px solid var(--line2);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 22px rgba(0,0,0,.35)}
#hud{left:10px;top:10px;padding:6px 10px;font:11px/1.5 var(--mono);display:grid;grid-template-columns:auto auto auto auto;column-gap:8px;pointer-events:none;max-width:calc(100% - 20px)}
#hud b{color:var(--dim);font-weight:500}
#hud span{text-align:left;color:var(--text);white-space:nowrap;margin-right:6px}
#hud .warn{color:var(--orange)}#hud .bad{color:var(--red)}#hud .good{color:var(--green)}
#hud .hobj{grid-column:1/-1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#hud .hudtitle{grid-column:1/-1;color:var(--amber);font-weight:700;letter-spacing:.08em;font-size:10px;margin-bottom:2px;text-align:left}
#objective{left:10px;bottom:58px;padding:8px 12px;width:min(340px,calc(100% - 20px));display:none}
#objective .ot{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:12px}
#objective .ot span{color:var(--amber)}
#objective .od{color:var(--dim);font-size:11px;margin:2px 0 6px}
.bar{height:7px;background:#0a0d11;border:1px solid var(--line2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));width:0%;transition:width .3s}
#objective .om{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--dim);margin-top:5px;gap:8px}
#chips{right:10px;top:10px;padding:4px;display:flex;gap:3px;flex-wrap:wrap;max-width:420px;justify-content:flex-end}
.chip{height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;color:var(--dim)}
.chip.on{color:var(--text);border-color:var(--teal);background:#11302d}
.chip i{width:8px;height:8px;border-radius:2px;display:inline-block}
#toolopts{left:50%;bottom:10px;transform:translateX(-50%);padding:6px 8px;display:flex;align-items:center;gap:6px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none}
#toolopts::-webkit-scrollbar{display:none}
#toolopts .tname{font-weight:700;color:var(--amber2);padding:0 4px;white-space:nowrap}
#toolopts .tinfo{color:var(--dim);font:11px var(--mono);white-space:nowrap;padding:0 4px}
#toolopts select{height:26px}
#toolopts .btn{height:26px}
#tooltip{position:absolute;pointer-events:none;padding:6px 9px;font-size:11.5px;max-width:260px;display:none;z-index:5;line-height:1.45}
#tooltip .tt{font-weight:700}
#tooltip .ts{font-weight:600}
#tooltip .tm{color:var(--dim);font-family:var(--mono);font-size:10.5px}
#toasts{position:absolute;right:10px;bottom:58px;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none;z-index:6}
.toast{pointer-events:auto;background:rgba(18,22,29,.95);border:1px solid var(--line2);border-left:3px solid var(--teal);border-radius:8px;padding:7px 10px;font-size:12px;max-width:320px;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .18s ease-out}
.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:var(--orange)}.toast.ok{border-left-color:var(--green)}
.toast .btn{height:24px;margin-left:8px;font-size:11px}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#pausedTag{left:50%;top:50%;transform:translate(-50%,-50%);padding:8px 16px;font-weight:800;letter-spacing:.3em;color:var(--amber);display:none;pointer-events:none;font-size:14px}
/* ---------- panel ---------- */
#panel{background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
#tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;height:36px;cursor:pointer;color:var(--dim);font-size:12px;font-weight:600}
#tabs button.on{color:var(--amber2);border-bottom-color:var(--amber)}
#tabs .close{flex:none;width:40px;display:none}
.tabc{flex:1;overflow-y:auto;padding:10px 12px 18px;display:none;scrollbar-width:thin;min-height:0}
.tabc.on{display:block}
h3{margin:14px 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
h3:first-child{margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.row .l{color:var(--dim);flex:none}
.row select{min-width:0;max-width:68%;flex:0 1 auto}
.row .v{font-family:var(--mono);font-size:12px;text-align:right}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px}
.kv div:nth-child(odd){color:var(--dim)}
.kv div:nth-child(even){font-family:var(--mono);text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;border:1px solid}
.cards4{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 9px}
.stat .sl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.stat .sv{font:700 15px var(--mono);margin-top:2px}
.stat .ss{font:10.5px var(--mono);color:var(--dim)}
canvas.chart{width:100%;height:70px;display:block;background:#0c1015;border:1px solid var(--line);border-radius:7px}
table.rates{width:100%;border-collapse:collapse;font-size:11.5px}
table.rates td{padding:3px 2px;border-bottom:1px solid #1d232c}
table.rates td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
table.rates th{font-size:10px;color:var(--faint);text-align:right;font-weight:600;padding:2px}
table.rates th:first-child{text-align:left}
.ico{width:16px;height:16px;vertical-align:-3px;margin-right:5px}
.issue{display:flex;gap:8px;align-items:flex-start;padding:6px 7px;border-radius:7px;background:var(--panel);border:1px solid var(--line);margin-bottom:5px;cursor:pointer;font-size:11.5px}
.issue:hover{border-color:var(--line2);background:var(--panel2)}
.issue .sv{flex:none;width:8px;height:8px;border-radius:50%;margin-top:4px}
.issue b{display:block;font-size:12px}
.issue span{color:var(--dim)}
.ubar{display:flex;align-items:center;gap:6px;font-size:11.5px;margin:3px 0}
.ubar .nm{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubar .b{flex:1;height:8px;background:#0a0d11;border-radius:4px;overflow:hidden;border:1px solid #232a34}
.ubar .b i{display:block;height:100%}
.ubar .p{width:38px;text-align:right;font-family:var(--mono);font-size:11px}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btnrow .btn{height:28px;font-size:12px}
.hint{color:var(--dim);font-size:12px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px}
.keys kbd,kbd{font:600 10.5px var(--mono);background:#0e1217;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--amber2);white-space:nowrap}
.slot{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:5px}
.slot .sn{flex:1;min-width:0}
.slot .sn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sn span{color:var(--dim);font-size:11px;font-family:var(--mono)}
.slot .btn{height:26px;padding:0 8px;font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--dim);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.inshead{display:flex;gap:10px;align-items:center}
.inshead canvas{width:44px;height:44px;border-radius:8px;background:#0c1015;border:1px solid var(--line2);flex:none}
.inshead .nm{font-weight:800;font-size:14px}
.inshead .sub{color:var(--dim);font-size:11px;font-family:var(--mono)}
.buf{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.buf span{display:inline-flex;align-items:center;background:#0e1217;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font:11px var(--mono)}
.progress{height:6px;background:#0a0d11;border-radius:4px;overflow:hidden;border:1px solid #232a34;margin-top:4px}
.progress i{display:block;height:100%;background:var(--teal)}
/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(4,6,9,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;max-width:560px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal .mh{padding:14px 16px 6px;font-size:16px;font-weight:800;color:var(--amber2)}
#modal .mb{padding:4px 16px 12px;font-size:13px}
#modal .mf{padding:10px 16px 14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.score{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;margin:8px 0}
.score div:nth-child(even){font-family:var(--mono);text-align:right}
.stars{font-size:30px;letter-spacing:6px;color:var(--amber);text-align:center;margin:4px 0}
.stars .off{color:#3a3f47}
.mobile-only{display:none!important}
/* ---------- narrow ---------- */
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:44px minmax(0,1fr) 54px}
  #top{grid-column:1;padding:0 6px;gap:5px}
  .brand small,.wide-only{display:none!important}
  .mobile-only{display:inline-flex!important}
  #toolbar{grid-row:3;flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:4px 6px;gap:3px;justify-content:flex-start}
  .tsep{width:1px;height:30px;margin:0 3px}
  .tool{width:42px;height:44px}
  #panel{position:fixed;left:0;right:0;bottom:54px;height:min(62dvh,520px);z-index:20;border-left:0;border-top:1px solid var(--line2);border-radius:14px 14px 0 0;transform:translateY(calc(100% + 60px));transition:transform .22s ease;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
  #panel.open{transform:none}
  #tabs .close{display:block}
  #hud{font-size:10px;padding:4px 7px;column-gap:4px;top:6px;left:6px;grid-template-columns:auto auto auto auto;line-height:1.4}
  #hud .hx{display:none}
  #hud span{margin-right:2px}
  #objective{top:auto;bottom:52px;left:8px;width:calc(100% - 16px);padding:6px 9px}
  #chips{display:none}
  #toolopts{bottom:8px;padding:4px 6px}
  #toasts{bottom:auto;top:8px;right:8px;left:auto}
  .toast{max-width:240px}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand" title="Fluxworks">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 20V9l5 3V9l5 3V6l8 4v10z" fill="#ffb238"/><path d="M5 20v-3h3v3M11 20v-3h3v3M17 20v-3h3v3" fill="#0c0f13"/><circle cx="18" cy="4" r="2" fill="#3dd6c6"/></svg>
      FLUXWORKS <small>factory logistics</small>
    </div>
    <div class="grp">
      <select id="modeSel" title="Game mode" aria-label="Game mode"><option value="sandbox">Sandbox</option><option value="campaign">Campaign</option></select>
      <select id="presetSel" title="Preset / contract" aria-label="Preset or contract"></select>
      <button class="btn" id="btnReset" title="Reset preset / restart contract" aria-label="Reset"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg><span class="wide-only">Reset</span></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="btn icon" id="btnPlay" title="Pause / resume (Space)" aria-label="Pause"></button>
      <button class="btn icon" id="btnStep" title="Single step one tick (.)" aria-label="Step"><svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/></svg></button>
      <select id="speedSel" title="Simulation speed ([ and ])" aria-label="Simulation speed"></select>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="btn icon" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button class="btn icon" id="btnRedo" title="Redo (Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button class="btn" id="btnQuickSave" title="Quick save to slot 'quick' (Ctrl+S)" aria-label="Quick save"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg><span class="wide-only">Save</span></button>
      <button class="btn icon" id="btnPng" title="Export factory as PNG" aria-label="Export PNG"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg></button>
      <button class="btn icon" id="btnSound" title="Toggle sound" aria-label="Toggle sound"></button>
      <button class="btn icon" id="btnHelp" title="Controls &amp; help (?)" aria-label="Help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 1-1 1.7v.5"/><path d="M12 17h.01"/></svg></button>
      <button class="btn mobile-only" id="btnPanel" title="Open panel" aria-label="Open panel"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Panel</button>
    </div>
  </header>
  <nav id="toolbar" aria-label="Tools"></nav>
  <main id="stage">
    <canvas id="cv" tabindex="0" aria-label="Factory map"></canvas>
    <div id="hud" class="float" aria-live="off"></div>
    <div id="objective" class="float"></div>
    <div id="chips" class="float" aria-label="Overlays"></div>
    <div id="toolopts" class="float"></div>
    <div id="pausedTag" class="float">PAUSED</div>
    <div id="tooltip" class="float"></div>
    <div id="toasts"></div>
  </main>
  <aside id="panel">
    <div id="tabs">
      <button data-tab="inspect" class="on">Inspect</button>
      <button data-tab="stats">Analytics</button>
      <button data-tab="overlays">Overlays</button>
      <button data-tab="settings">Settings</button>
      <button data-tab="saves">Saves</button>
      <button class="close" id="btnPanelClose" aria-label="Close panel">✕</button>
    </div>
    <section class="tabc on" id="tab-inspect"></section>
    <section class="tabc" id="tab-stats"></section>
    <section class="tabc" id="tab-overlays"></section>
    <section class="tabc" id="tab-settings"></section>
    <section class="tabc" id="tab-saves"></section>
  </aside>
</div>
<div id="modal" role="dialog" aria-modal="true"><div class="box"><div class="mh"></div><div class="mb"></div><div class="mf"></div></div></div>
<input type="file" id="fileIn" accept=".json,application/json,text/plain" style="display:none">
<script>
'use strict';
/* =====================================================================
   FLUXWORKS — single-file factory automation & logistics game
   Sections: core defs · world · topology · simulation · stats · save/load ·
             presets/campaign · rendering · input/tools · UI · audio · loop
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const DX=[1,0,-1,0], DY=[0,1,0,-1];               // E S W N
const DIRN=['East','South','West','North'];
const opp=d=>(d+2)&3, leftOf=d=>(d+3)&3, rightOf=d=>(d+1)&3;
const TPS=60, DT=1/TPS;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash32(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const fmt=(v,d=1)=>{if(!isFinite(v))return '—';const a=Math.abs(v);if(a>=1e6)return (v/1e6).toFixed(1)+'M';if(a>=1e4)return (v/1e3).toFixed(1)+'k';return v.toFixed(d)};

/* seeded terrain: ore patches, rocks, lakes */
function genTerrain(seed,opts={}){
  const rng=mulberry32(seed>>>0);
  const {w,h}=W;
  const blob=(cx,cy,r,fn)=>{for(let y=Math.floor(cy-r-1);y<=cy+r+1;y++)for(let x=Math.floor(cx-r-1);x<=cx+r+1;x++){if(!inb(x,y))continue;const d=Math.hypot(x-cx,y-cy)+ (rng()-0.5)*1.2;if(d<=r)fn(x,y,d)}};
  const lakes=opts.lakes??1;
  for(let k=0;k<lakes;k++){const cx=4+rng()*(w-8),cy=4+rng()*(h-8),r=1.8+rng()*2.2;blob(cx,cy,r,(x,y)=>{W.terrain[cidx(x,y)]=2})}
  const pat=opts.patches??[1,2,3,4,1,2];
  for(const t of pat){
    let cx,cy,tries=0;
    do{cx=3+rng()*(w-6);cy=3+rng()*(h-6);tries++}while(tries<30&&W.terrain[cidx(Math.floor(cx),Math.floor(cy))]);
    const r=1.6+rng()*1.8;
    blob(cx,cy,r,(x,y,d)=>{const i=cidx(x,y);if(W.terrain[i])return;W.dep[i]=t;W.depAmt[i]=opts.infinite?-1:Math.round(350+500*(1-d/(r+1))+rng()*150)});
  }
  const rocks=Math.floor(w*h*(opts.rockDensity??0.018));
  for(let k=0;k<rocks;k++){const x=Math.floor(rng()*w),y=Math.floor(rng()*h),i=cidx(x,y);if(!W.dep[i]&&!W.terrain[i])W.terrain[i]=1}
}

}

}
function makeStruct(type,x,y,dir=0,tier=0,cfg=null,id=0){

function removeStruct(s){if(!s)return;W.structs.delete(s.id);if(W.grid[cidx(s.x,s.y)]===s.id)W.grid[cidx(s.x,s.y)]=0;topoDirty=true;if(typeof onStructRemoved==='function')onStructRemoved(s)}
function placeReason(type,x,y,ignoreIds){

/* ---------------- serialization of single structures ---------------- */
const nz=a=>{const o=[];for(let i=0;i<a.length;i++)if(a[i])o.push([i,a[i]]);return o};
function serStruct(s,withState=true){
  const o={id:s.id,t:s.type,x:s.x,y:s.y,d:s.dir};
  if(s.tier)o.k=s.tier;
  const c={};let any=false;for(const k in s.cfg){c[k]=s.cfg[k];any=true}
  if(any)o.c=c;
  if(!withState)return o;
  switch(s.type){
    case 'belt':if(s.items.length)o.i=s.items.map(it=>[it.t,it.p]);break;
    case 'splitter':o.h=s.hold;o.r=s.rr;break;
    case 'merger':o.h=s.holds.slice();o.r=s.rr;break;
    case 'inserter':o.h=s.hand;o.p=s.ph;break;
    case 'extractor':o.b=s.buf;o.p=s.prog;o.bo=s.bonus;break;
    case 'smelter':case 'assembler':o.in=nz(s.inp);o.ob=nz(s.outb);o.p=s.prog;o.cr=s.craft;o.bo=s.bonus;o.r=s.orr;break;
    case 'chest':o.inv=nz(s.inv);o.r=s.rr;break;
    case 'generator':o.f=s.fuel;o.e=s.energy;break;
    case 'battery':o.s=s.stored;break;
    case 'hub':o.rv=nz(s.recv);break;
    case 'pole':o.lo=s.low;o.tr=s.trip;break;
  }
  return o;
}
const num=(v,d=0)=>typeof v==='number'&&isFinite(v)?v:d;
const intIn=(v,a,b,d)=>{v=num(v,d);v=Math.round(v);return v<a||v>b?d:v};
function fillArr(dst,src,cap){if(!Array.isArray(src))return;for(const e of src){if(!Array.isArray(e))continue;const i=intIn(e[0],0,NI-1,-1);if(i<0)continue;dst[i]=clamp(Math.floor(num(e[1])),0,cap)}}
/* validated reconstruction — never throws on bad data, returns null instead */
function deserStruct(o,keepId,dx=0,dy=0,withState=true){
  if(!o||typeof o!=='object'||!TYPES[o.t])return null;
  const x=intIn(o.x,-1e6,1e6,NaN)+dx,y=intIn(o.y,-1e6,1e6,NaN)+dy;
  if(!Number.isFinite(x)||!Number.isFinite(y)||!inb(x,y))return null;
  const T=TYPES[o.t];
  const cfg={};const c=o.c&&typeof o.c==='object'?o.c:{};
  const def=defCfg(o.t);
  for(const k in def){
    if(k==='rec'){const r=intIn(c.rec,-1,RECIPES.length-1,def.rec);cfg.rec=(r>=0&&RECIPES[r].m!==o.t)?def.rec:r}
    else if(k==='mod')cfg.mod=intIn(c.mod,0,MODS.length-1,0);
    else if(k==='filter')cfg.filter=intIn(c.filter,-1,NI-1,-1);
    else if(k==='mode')cfg.mode=intIn(c.mode,0,1,0);
  }
  const id=keepId?intIn(o.id,1,1e9,0):0;
  const s=makeStruct(o.t,x,y,intIn(o.d,0,3,0),intIn(o.k,0,T.tiers-1,0),cfg,id);
  if(!withState)return s;
  const okItem=v=>intIn(v,-1,NI-1,-1);
  switch(s.type){
    case 'belt':if(Array.isArray(o.i)){for(const e of o.i){if(!Array.isArray(e))continue;const t=okItem(e[0]);if(t<0)continue;s.items.push({t,p:clamp(num(e[1]),0,1)})}s.items.sort((a,b)=>b.p-a.p);if(s.items.length>8)s.items.length=8}break;
    case 'splitter':s.hold=okItem(o.h);s.rr=intIn(o.r,0,1e9,0);break;
    case 'merger':if(Array.isArray(o.h))for(let k=0;k<3;k++)s.holds[k]=okItem(o.h[k]);s.rr=intIn(o.r,0,2,0);break;
    case 'inserter':s.hand=okItem(o.h);s.ph=clamp(num(o.p),0,1);break;
    case 'extractor':s.buf=intIn(o.b,0,64,0);s.prog=clamp(num(o.p),0,1);s.bonus=clamp(num(o.bo),0,1);break;
    case 'smelter':case 'assembler':fillArr(s.inp,o.in,64);fillArr(s.outb,o.ob,64);s.prog=clamp(num(o.p),0,1);s.craft=o.cr?1:0;s.bonus=clamp(num(o.bo),0,1);s.orr=intIn(o.r,0,NI-1,0);break;
    case 'chest':fillArr(s.inv,o.inv,CHEST_CAP[2]);s.total=s.inv.reduce((a,b)=>a+b,0);s.rr=intIn(o.r,0,NI-1,0);break;
    case 'generator':s.fuel=intIn(o.f,0,GEN_FUEL_CAP,0);s.energy=clamp(num(o.e),0,COAL_J);break;
    case 'battery':s.stored=clamp(num(o.s),0,BAT_CAP[s.tier]);break;
    case 'hub':fillArr(s.recv,o.rv,1e12);break;
    case 'pole':s.low=clamp(num(o.lo),0,10);s.trip=intIn(o.tr,0,1e6,0);break;
  }
  return s;
}

/* =====================================================================
   TOPOLOGY (belt shapes, update order, power networks, graph)
   ===================================================================== */
let topoDirty=true, topoVer=0;
const TOPO={belts:[],order:[],active:[],consumers:[],poles:[],nets:[],wires:[],graph:null,graphVer:-1};
function outputsDir(n,d){
  switch(n.type){
    case 'belt':case 'extractor':case 'smelter':case 'assembler':case 'merger':case 'inserter':return n.dir===d;
    case 'splitter':return d===n.dir||d===leftOf(n.dir)||d===rightOf(n.dir);
  }
  return false;
}
function feedsFrom(b,side){const n=structAt(b.x+DX[side],b.y+DY[side]);return !!n&&outputsDir(n,opp(side))}
function canEverAccept(t,side){
  switch(t.type){
    case 'belt':return side!==t.dir;
    case 'splitter':return side===opp(t.dir);
    case 'merger':return side!==t.dir;
    case 'smelter':case 'assembler':case 'chest':case 'hub':case 'generator':return true;
  }
  return false;
}
function rebuildTopo(){
  const T=TOPO;
  T.belts=[];T.active=[];T.consumers=[];T.poles=[];
  for(const s of W.structs.values()){
    s.fwd=structAt(s.x+DX[s.dir],s.y+DY[s.dir]);s.net=-1;
    if(s.type==='belt')T.belts.push(s);
    else if(s.type==='pole')T.poles.push(s);
    else if(s.type!=='chest'&&s.type!=='hub'&&s.type!=='solar'&&s.type!=='battery')T.active.push(s);
    if(TYPES[s.type].kw>0)T.consumers.push(s);
    // output connection state: 0 ok · 1 nothing there · 2 invalid target
    if(s.type==='splitter'){
      // a splitter only needs one usable output among front/left/right
      let any=false,bad=false;for(const d of [s.dir,leftOf(s.dir),rightOf(s.dir)]){const n=structAt(s.x+DX[d],s.y+DY[d]);if(n){if(canEverAccept(n,opp(d)))any=true;else bad=true}}
      s.oc=any?0:(bad?2:1);
    } else if(outputsDir(s,s.dir)){
      if(s.type==='inserter')s.oc=s.fwd?(canEverAccept(s.fwd,opp(s.dir))?0:2):1;
      else s.oc=s.fwd?(canEverAccept(s.fwd,opp(s.dir))?0:2):1;
    } else s.oc=0;
  }
  for(const b of T.belts){
    const back=opp(b.dir),L=leftOf(b.dir),R=rightOf(b.dir);
    let m=0;if(feedsFrom(b,back))m|=1;if(feedsFrom(b,L))m|=2;if(feedsFrom(b,R))m|=4;
    b.inm=m;b.cs=(m&1)?-1:((m&6)===2?L:(m&6)===4?R:-1);
  }
  // downstream-first belt order so items compress without gaps
  const mark=new Set();T.order=[];
  for(const b of T.belts){
    if(mark.has(b.id))continue;
    const path=[];let cur=b;
    while(cur&&cur.type==='belt'&&!mark.has(cur.id)){
      mark.add(cur.id);path.push(cur);
      const n=cur.fwd;cur=(n&&n.type==='belt'&&opp(cur.dir)!==n.dir)?n:null;
    }
    for(let i=path.length-1;i>=0;i--)T.order.push(path[i]);
  }
  for(const b of T.belts){const n=b.fwd;b.dnb=(n&&n.type==='belt'&&(opp(b.dir)===opp(n.dir)||opp(b.dir)===n.cs))?n:null}
  // power networks: poles within reach are wired (Kruskal spanning forest => wires drawn = real connectivity)
  const P=T.poles,n=P.length,par=new Int32Array(n);for(let i=0;i<n;i++)par[i]=i;
  const find=i=>{while(par[i]!==i){par[i]=par[par[i]];i=par[i]}return i};
  const pairs=[];const R2=POLE_REACH*POLE_REACH;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d2=dx*dx+dy*dy;if(d2<=R2)pairs.push([d2,i,j])}
  pairs.sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]);
  T.wires=[];

  for(let i=0;i<n;i++){const r=find(i);let k=netOf.get(r);if(k===undefined){k=T.nets.length;netOf.set(r,k);T.nets.push({id:k,root:P[i],poles:[],cons:[],gens:[],sols:[],bats:[],sat:1,D:0,S:0,G:0,load:0,dis:0,chg:0,cap:0})}P[i].net=k;T.nets[k].poles.push(P[i])}

    const net=T.nets[p.net];

      const s=structAt(p.x+dx,p.y+dy);
      if(!s||s.net>=0||s.type==='pole'||!hasPowerRole(s.type))continue;
      s.net=p.net;
      if(s.type==='generator')net.gens.push(s);else if(s.type==='solar')net.sols.push(s);else if(s.type==='battery')net.bats.push(s);else net.cons.push(s);

  const ord=new Map();let k=0;for(const s of W.structs.values())ord.set(s.id,k++);
  for(const net of T.nets){for(const key of ['cons','gens','sols','bats'])net[key].sort((a,b)=>ord.get(a.id)-ord.get(b.id))}

}
/* logical connection graph: producer -> (belt chain) -> consumer */
function getGraph(){
  if(TOPO.graphVer===topoVer&&TOPO.graph)return TOPO.graph;
  const edges=[];
  const follow=(s,dir)=>{
    let x=s.x+DX[dir],y=s.y+DY[dir],d=dir,steps=0;const pts=[[s.x+.5,s.y+.5]];
    while(steps++<600){
      const t=structAt(x,y);
      if(!t){pts.push([x+.5,y+.5]);return {pts,to:null,ok:false}}
      if(t.type==='belt'){if(t.dir===opp(d)){pts.push([x+.5,y+.5]);return {pts,to:t,ok:false}}if(t.dir!==d)pts.push([x+.5,y+.5]);d=t.dir;x+=DX[d];y+=DY[d];continue}
      pts.push([x+.5,y+.5]);return {pts,to:t,ok:canEverAccept(t,opp(d))};
    }
    return {pts,to:null,ok:false};
  };
  for(const s of W.structs.values()){
    if(s.type==='belt'||s.type==='pole')continue;
    if(s.type==='splitter'){for(const d of [s.dir,leftOf(s.dir),rightOf(s.dir)]){if(structAt(s.x+DX[d],s.y+DY[d]))edges.push(Object.assign({from:s},follow(s,d)))}continue}
    if(s.type==='inserter'){const src=structAt(s.x-DX[s.dir],s.y-DY[s.dir]);if(src&&src.type!=='belt')edges.push({from:src,to:s,pts:[[src.x+.5,src.y+.5],[s.x+.5,s.y+.5]],ok:true});if(s.fwd)edges.push(Object.assign({from:s},follow(s,s.dir)));continue}
    if(outputsDir(s,s.dir))edges.push(Object.assign({from:s},follow(s,s.dir)));
  }
  TOPO.graph=edges;TOPO.graphVer=topoVer;return edges;
}

/* =====================================================================
   SIMULATION (fixed 60 Hz ticks; speed = more ticks per frame, never bigger steps)
   ===================================================================== */
function canAccept(t,item,side){
  switch(t.type){
    case 'belt':{
      if(side===t.dir)return false;
      const its=t.items;if(its.length>=BELT_CAP)return false;
      if(side===opp(t.dir)||side===t.cs)return !its.length||its[its.length-1].p>=GAP-1e-9;
      for(let k=0;k<its.length;k++)if(Math.abs(its[k].p-0.5)<GAP-1e-9)return false;
      return true;
    }
    case 'splitter':return side===opp(t.dir)&&t.hold<0;
    case 'merger':{const k=mergerSlot(t,side);return k>=0&&t.holds[k]<0}
    case 'smelter':case 'assembler':{const r=recipeOf(t);return !!r&&r.need[item]>0&&t.inp[item]<inLimit(t,r,item)}
    case 'chest':return t.total<CHEST_CAP[t.tier];
    case 'hub':return true;
    case 'generator':return item===IT.coal&&t.fuel<GEN_FUEL_CAP;
  }
  return false;
}
function offer(t,item,side,ov){
  if(!canAccept(t,item,side))return false;
  switch(t.type){
    case 'belt':{
      const its=t.items;
      if(side===opp(t.dir)||side===t.cs){let p=ov>0?ov:0;if(its.length)p=Math.min(p,its[its.length-1].p-GAP);its.push({t:item,p:p<0?0:p})}
      else{let k=0;while(k<its.length&&its[k].p>0.5)k++;its.splice(k,0,{t:item,p:0.5})}
      return true;
    }
    case 'splitter':t.hold=item;return true;
    case 'merger':t.holds[mergerSlot(t,side)]=item;return true;
    case 'smelter':case 'assembler':t.inp[item]++;return true;
    case 'chest':t.inv[item]++;t.total++;return true;
    case 'hub':deliver(t,item);return true;
    case 'generator':t.fuel++;return true;
  }
  return false;
}
function mergerSlot(s,side){if(side===opp(s.dir))return 0;if(side===leftOf(s.dir))return 1;if(side===rightOf(s.dir))return 2;return -1}
function recipeOf(m){const r=RECIPES[m.cfg.rec];return r&&r.m===m.type?r:null}
function inLimit(m,r,it){return Math.ceil(Math.max(2,r.need[it]*2)*TIER.buf[m.tier])}
function outLimit(m,n){return Math.ceil(Math.max(3,n*3)*TIER.buf[m.tier])}
function extCap(s){return Math.round(4*TIER.buf[s.tier])}
function netTripped(s){const n=TOPO.nets[s.net];return !!n&&n.root.trip>0}
function basePower(s){return TYPES[s.type].kw*TIER.power[s.tier]*(s.cfg.mod?MODS[s.cfg.mod].pow:1)*PD().use}
function powerReq(s){
  const b=basePower(s);
  switch(s.type){
    case 'extractor':return (W.depAmt[cidx(s.x,s.y)]!==0&&s.buf<extCap(s))?b:b*0.1;
    case 'smelter':case 'assembler':return (s.craft&&s.st!==ST.BLOCKED)?b:b*0.1;
    case 'inserter':return (s.hand>=0||s.ph>0)?b:b*0.15;

}
function solarLight(t){const ph=(t%DAY_TICKS)/DAY_TICKS;return clamp(0.5+0.75*Math.sin(ph*Math.PI*2-0.3),0,1)}
function resolvePower(){
  const pd=PD(),light=solarLight(W.tick);
  for(const net of TOPO.nets){
    let D=0;for(const c of net.cons)D+=c.req;
    let S=0;for(const s of net.sols){s.out=SOLAR_KW*light*pd.gen;S+=s.out}
    let G=0;for(const g of net.gens){g.cap=(g.energy>0||g.fuel>0)?GEN_KW[g.tier]*pd.gen:0;G+=g.cap}
    let Bd=0,Bc=0;for(const b of net.bats){const r=BAT_RATE[b.tier];b.dcap=Math.min(r,b.stored/1000/DT);b.ccap=Math.min(r,(BAT_CAP[b.tier]-b.stored)/1000/DT);Bd+=b.dcap;Bc+=b.ccap}
    const root=net.root;let sat,load=0,dis=0,chg=0;
    if(root.trip>0){root.trip--;sat=0}
    else{
      const avail=S+G;
      if(avail>=D){sat=1;chg=Math.min(avail-D,Bc);load=D+chg}
      else{dis=Math.min(D-avail,Bd);sat=D>0?(avail+dis)/D:1;load=avail}
      if(pd.breaker&&D>0&&sat<0.6){root.low+=DT;if(root.low>=3){root.trip=5*TPS;root.low=0;W.trips++;sat=0;load=0;dis=0;chg=0}}
      else root.low=Math.max(0,root.low-DT*0.5);
    }
    const solarUsed=Math.min(load,S),fuelLoad=Math.max(0,load-S),f=G>0?Math.min(1,fuelLoad/G):0;
    for(const s of net.sols)s.use=S>0?s.out*(solarUsed/S):0;
    for(const g of net.gens){
      g.out=g.cap*f;
      if(g.out>0){g.energy-=g.out*1000*DT/GEN_EFF[g.tier];while(g.energy<=0&&g.fuel>0){g.fuel--;g.energy+=COAL_J;W.fuelUsed++;STATS.cons[IT.coal]++}if(g.energy<0)g.energy=0}
    }
    for(const b of net.bats){
      if(chg>0&&Bc>0){const x=b.ccap*(chg/Bc);b.stored=Math.min(BAT_CAP[b.tier],b.stored+x*1000*DT);b.flow=x}
      else if(dis>0&&Bd>0){const x=b.dcap*(dis/Bd);b.stored=Math.max(0,b.stored-x*1000*DT);b.flow=-x}
      else b.flow=0;
    }
    net.D=D;net.sat=sat;net.S=S;net.G=G;net.load=load;net.dis=dis;net.chg=chg;net.cap=S+G+Bd;
    for(const c of net.cons)c.sat=sat;

  }
}
function updateBelt(b){
  const its=b.items,n=its.length;
  if(!n){b.blk=0;return}
  const v=BELT_SPEED[b.tier]*SET.beltMult*DT;
  const f=its[0];
  let lim=1;
  const dn=b.dnb;
  if(dn&&dn.items.length){const l=dn.items[dn.items.length-1].p;lim=Math.min(1+l-GAP,1+1e-9)}
  let np=f.p+v;
  if(np>=1&&lim>=1-1e-9){
    const t=b.fwd;
    if(t&&offer(t,f.t,opp(b.dir),np-1)){
      its.shift();b.fl++;b.blk=0;
      for(let k=0;k<its.length;k++){const it=its[k];let q=it.p+v;const L=k===0?1:its[k-1].p-GAP;if(q>L)q=L;if(q>it.p)it.p=q}
      return;
    }
    f.p=1;b.blk=1;
  } else {
    if(np>lim)np=lim;if(np>1)np=1;
    if(np>f.p)f.p=np;
    b.blk=f.p>=1-1e-9?1:0;
  }
  for(let k=1;k<its.length;k++){const it=its[k];let q=it.p+v;const L=its[k-1].p-GAP;if(q>L)q=L;if(q>it.p)it.p=q}
}
function pushFirstOutput(m){
  if(!m.fwd)return;
  const side=opp(m.dir);
  for(let k=0;k<NI;k++){const it=(m.orr+k)%NI;if(m.outb[it]>0&&offer(m.fwd,it,side,0)){m.outb[it]--;m.fl++;m.orr=(it+1)%NI;return}}
}
function tryStart(m,r){
  if(!outRoom(m,r))return false;
  for(const [it,n] of r.i)if(m.inp[it]<n)return false;
  for(const [it,n] of r.i){m.inp[it]-=n;STATS.cons[it]+=n}
  m.craft=1;m.prog=0;return true;
}
function outRoom(m,r){for(const [it,n] of r.o)if(m.outb[it]+n>outLimit(m,n))return false;return true}
function updMachine(m){
  pushFirstOutput(m);
  const r=recipeOf(m);
  if(!r||r.tier>m.tier){m.st=ST.CONFIG;return}
  if(!m.craft)tryStart(m,r);
  if(!m.craft){m.st=outRoom(m,r)?ST.STARVED:ST.BLOCKED;return}
  if(m.sat<=0){m.st=netTripped(m)?ST.TRIP:ST.NOPOWER;return}
  const mod=MODS[m.cfg.mod|0];
  if(m.prog<1)m.prog+=SET.machMult*TIER.speed[m.tier]*mod.spd*m.sat*DT/r.t;
  if(m.prog>=1){
    if(!outRoom(m,r)){m.prog=1;m.st=ST.BLOCKED;return}
    let extra=0;m.bonus+=mod.prod;if(m.bonus>=1-1e-9){m.bonus-=1;extra=1}
    for(const [it,n] of r.o){m.outb[it]+=n*(1+extra);STATS.prod[it]+=n*(1+extra)}
    const left=m.prog-1;m.craft=0;m.prog=0;
    if(tryStart(m,r))m.prog=left;
  }
  m.st=m.sat<1?ST.LOWPOWER:ST.WORK;
}
function updExtractor(s){
  const i=cidx(s.x,s.y),it=DEP_ITEM[W.dep[i]];
  if(s.buf>0&&s.fwd&&it>=0&&offer(s.fwd,it,opp(s.dir),0)){s.buf--;s.fl++}
  const amt=W.depAmt[i];
  if(it<0||amt===0){s.st=ST.DEPLETED;return}
  if(s.buf>=extCap(s)){s.st=ST.BLOCKED;return}
  if(s.sat<=0){s.st=netTripped(s)?ST.TRIP:ST.NOPOWER;return}
  const mod=MODS[s.cfg.mod|0];
  s.prog+=EXTRACT_RATE*SET.machMult*TIER.speed[s.tier]*mod.spd*s.sat*DT;
  if(s.prog>=1){
    s.prog-=1;let n=1;s.bonus+=mod.prod;if(s.bonus>=1-1e-9){s.bonus-=1;n=2}
    s.buf+=n;if(amt>0)W.depAmt[i]=amt-1;STATS.prod[it]+=n;
  }
  s.st=s.sat<1?ST.LOWPOWER:ST.WORK;
}
function takeFrom(s,pred){
  switch(s.type){
    case 'belt':{let best=-1,bd=9;const its=s.items;for(let k=0;k<its.length;k++){const d=Math.abs(its[k].p-0.5);if(d<bd&&pred(its[k].t)){bd=d;best=k}}if(best<0)return -1;const t=its[best].t;its.splice(best,1);return t}
    case 'chest':for(let k=0;k<NI;k++){const i=(s.rr+k)%NI;if(s.inv[i]>0&&pred(i)){s.inv[i]--;s.total--;s.rr=(i+1)%NI;return i}}return -1;
    case 'smelter':case 'assembler':for(let i=0;i<NI;i++)if(s.outb[i]>0&&pred(i)){s.outb[i]--;s.fl++;return i}return -1;
    case 'extractor':{const it=DEP_ITEM[W.dep[cidx(s.x,s.y)]];if(s.buf>0&&it>=0&&pred(it)){s.buf--;s.fl++;return it}return -1}
  }
  return -1;
}
function updInserter(s){
  const d=s.dir,side=opp(d),dst=s.fwd;
  if(s.hand<0&&s.ph<=0){
    const src=structAt(s.x-DX[d],s.y-DY[d]);
    if(!src||!dst){s.st=ST.IDLE;return}
    if(s.sat<=0){s.st=netTripped(s)?ST.TRIP:ST.NOPOWER;return}
    const f=s.cfg.filter;
    const it=takeFrom(src,x=>(f<0||x===f)&&canAccept(dst,x,side));
    if(it<0){s.st=ST.IDLE;return}
    s.hand=it;s.st=ST.WORK;return;
  }
  if(s.sat<=0){s.st=netTripped(s)?ST.TRIP:ST.NOPOWER;return}
  const step=DT*SET.machMult*s.sat/INS_HALF[s.tier];
  if(s.hand>=0){
    if(s.ph<1){s.ph=Math.min(1,s.ph+step);s.st=ST.WORK;return}
    if(dst&&offer(dst,s.hand,side,0)){s.hand=-1;s.fl++;s.st=ST.WORK}else s.st=ST.BLOCKED;
  } else {s.ph=Math.max(0,s.ph-step);s.st=ST.WORK}
}
function updSplitter(s){
  if(s.hold<0){s.st=ST.IDLE;return}
  const d=s.dir,outs=[d,leftOf(d),rightOf(d)],f=s.cfg.filter,mode=s.cfg.mode|0;
  let order;
  if(f>=0)order=s.hold===f?[0]:(s.rr&1?[2,1]:[1,2]);
  else if(mode===1)order=s.rr&1?[0,2,1]:[0,1,2];
  else{const r=s.rr%3;order=[r,(r+1)%3,(r+2)%3]}
  for(const k of order){
    const o=outs[k],t=structAt(s.x+DX[o],s.y+DY[o]);
    if(t&&offer(t,s.hold,opp(o),0)){s.hold=-1;s.fl++;s.rr=(f<0&&mode===0)?(k+1)%3:s.rr+1;s.st=ST.WORK;return}
  }
  s.st=ST.BLOCKED;
}
function updMerger(s){
  for(let k=0;k<3;k++){
    const i=(s.rr+k)%3;
    if(s.holds[i]>=0){
      if(s.fwd&&offer(s.fwd,s.holds[i],opp(s.dir),0)){s.holds[i]=-1;s.rr=(i+1)%3;s.fl++;s.st=ST.WORK}else s.st=ST.BLOCKED;
      return;
    }
  }
  s.st=ST.IDLE;
}
function deliver(h,item){
  h.recv[item]++;h.fl++;W.delivered[item]++;STATS.deliv++;STATS.delivItem[item]++;h.flashT=performance.now();
  const c=W.camp;
  if(c&&!c.done&&item===c.item){c.got++;W.credits+=c.reward;if(c.got>=c.need){c.done=true;c.doneTick=W.tick}}
}
function updateStruct(s){
  switch(s.type){
    case 'extractor':updExtractor(s);break;
    case 'smelter':case 'assembler':updMachine(s);break;
    case 'inserter':updInserter(s);break;
    case 'splitter':updSplitter(s);break;
    case 'merger':updMerger(s);break;
    case 'generator':s.st=s.out>0?ST.WORK:((s.fuel>0||s.energy>0)?(s.net<0?ST.NOOUT:ST.IDLE):ST.NOFUEL);break;
  }

  }
}
function simTick(){
  if(topoDirty)rebuildTopo();

  resolvePower();

  W.tick++;
  if(W.camp&&!W.camp.done){const c=W.camp;let D=0,Sv=0;for(const n of T.nets){D+=n.D;Sv+=n.D*n.sat}if(D>0){c.satSum+=Sv/D;c.satN++}}
  if(W.tick%TPS===0)sampleSecond();

/* =====================================================================
   STATS, HISTORY & BOTTLENECK DETECTION (all derived from live sim state)

class Ring{
  constructor(n){this.a=new Float32Array(n);this.n=0;this.i=0}
  push(v){this.a[this.i]=v;this.i=(this.i+1)%this.a.length;if(this.n<this.a.length)this.n++}
  last(k=0){if(!this.n)return 0;const L=this.a.length;return this.a[((this.i-1-k)%L+L)%L]}
  get(k){const L=this.a.length;return this.a[((this.i-this.n+k)%L+L)%L]}
  avg(k){k=Math.min(k,this.n);if(!k)return 0;let s=0;for(let j=0;j<k;j++)s+=this.last(j);return s/k}
  max(){let m=0;for(let j=0;j<this.n;j++)m=Math.max(m,this.get(j));return m}
}
const HIST=120, SHIST=60;

    hDeliv:R(),hGen:R(),hDem:R(),hCap:R(),hItems:R(),hOp:R(),hStall:R(),hBlk:R(),hBattery:R(),
    issues:[],groups:[],beltsTotal:0,beltsBlocked:0,beltItems:0,machItems:0,storage:new Float64Array(NI),storeCap:0,storeUsed:0,
    op:0,stall:0,lastIssuesTick:-1});
}
function pushHist(s,v,v2){

function beltMax(b){return BELT_SPEED[b.tier]*SET.beltMult/GAP}
function sampleSecond(){

      case 'chest':for(let i=0;i<NI;i++)store[i]+=s.inv[i];scap+=CHEST_CAP[s.tier];sused+=s.total;pushHist(s,s.total);break;
      case 'generator':s.util=s.cap>0?s.out/s.cap:0;pushHist(s,s.out,s.fuel);break;
      case 'solar':pushHist(s,s.out);break;
      case 'battery':bst+=s.stored;bcap+=BAT_CAP[s.tier];pushHist(s,s.stored/BAT_CAP[s.tier]*100,s.flow);break;
      case 'hub':pushHist(s,s.fl);break;

function machLabel(s){
  if(s.type==='extractor')return 'Extractor ('+DEP_NAME[W.dep[cidx(s.x,s.y)]]+')';
  const r=recipeOf(s);return TYPES[s.type].name+' ('+(r?r.name:'no recipe')+')';
}
function traceOutput(s){
  // follow output through belts to find where the jam ends
  let x=s.x+DX[s.dir],y=s.y+DY[s.dir],d=s.dir,steps=0,last=null;
  while(steps++<800){
    const t=structAt(x,y);
    if(!t)return {text:last?'belt dead-ends at ('+last.x+','+last.y+')':'nothing in front of it',at:last||s};
    if(t.type==='belt'){if(t.dir===opp(d))return {text:'belt at ('+x+','+y+') faces back into it',at:t};last=t;d=t.dir;x+=DX[d];y+=DY[d];continue}
    if(!canEverAccept(t,opp(d)))return {text:TYPES[t.type].name+' at ('+x+','+y+') cannot accept items from that side',at:t};
    if(t.type==='merger'||t.type==='splitter'){const nd=t.type==='splitter'&&!structAt(x+DX[t.dir],y+DY[t.dir])?leftOf(t.dir):t.dir;last=t;d=nd;x+=DX[d];y+=DY[d];continue}
    if(t.type==='generator')return {text:'generators are fully fuelled (healthy backpressure)',at:t,benign:true};
    if(t.type==='hub')return {text:'belt to hub is saturated',at:last||t};
    if(t.type==='chest')return {text:'storage chest at ('+x+','+y+') is full',at:t};
    return {text:machLabel(t)+' at ('+x+','+y+') is not taking items',at:t};
  }
  return {text:'long belt loop',at:s};
}
function analyzeBottlenecks(){
  const issues=[];
  const add=(sev,kind,title,detail,s)=>issues.push({sev,kind,title,detail,id:s?s.id:0});
  for(const net of TOPO.nets){
    if(net.root.trip>0)add(100,'power','Breaker tripped — network #'+(net.id+1),'Sustained overload shut down '+net.cons.length+' consumers. Add generation or reduce load.',net.root);
    else if(net.D>0&&net.sat<0.985)add(62+38*(1-net.sat),'power','Brownout: power at '+Math.round(net.sat*100)+'%','Network #'+(net.id+1)+': demand '+fmtKW(net.D)+' exceeds available '+fmtKW(net.cap)+'. Every machine on it runs slower.',net.gens[0]||net.root);
    const nf=net.gens.filter(g=>g.st===ST.NOFUEL);
    if(nf.length)add(58,'power',nf.length+' generator(s) out of coal','Feed coal by belt or inserter.',nf[0]);
    if(net.D>0&&net.gens.length+net.sols.length+net.bats.length===0)add(66,'power','Network #'+(net.id+1)+' has no power source',net.cons.length+' consumers on poles without a generator.',net.root);
  }
  const unp=TOPO.consumers.filter(c=>c.net<0);
  if(unp.length)add(72,'power',unp.length+' structure(s) not on a power network','Place a power pole within 3 tiles of them.',unp[0]);
  const groups=new Map();
  for(const s of W.structs.values()){
    if(!isMachine(s.type))continue;
    const r=s.type==='extractor'?null:recipeOf(s);
    const key=s.type==='extractor'?'x'+W.dep[cidx(s.x,s.y)]:s.type+':'+(r?r.idx:-1);
    let g=groups.get(key);
    if(!g){g={key,name:machLabel(s),type:s.type,out:s.type==='extractor'?DEP_ITEM[W.dep[cidx(s.x,s.y)]]:(r?r.out:-1),r,list:[],util:0,fS:0,fB:0,fP:0};groups.set(key,g)}
    g.list.push(s);g.util+=s.util;g.fS+=s.fS;g.fB+=s.fB;g.fP+=s.fP;
  }
  const G=[...groups.values()];
  for(const g of G){const n=g.list.length;g.util/=n;g.fS/=n;g.fB/=n;g.fP/=n}
  STATS.groups=G.sort((a,b)=>b.util-a.util);
  const cfgBad=[...W.structs.values()].filter(s=>s.st===ST.CONFIG);
  if(cfgBad.length)add(64,'config',cfgBad.length+' machine(s) misconfigured','No recipe selected, or recipe needs a higher tier (Motor needs Assembler Mk2).',cfgBad[0]);
  const dep=[...W.structs.values()].filter(s=>s.st===ST.DEPLETED);
  if(dep.length)add(40,'resource',dep.length+' extractor(s) on depleted deposits','Move them to a fresh deposit.',dep[0]);
  for(const g of G){
    if(g.out<0)continue;
    // bottleneck stage: this group runs flat-out while the machines consuming its output starve
    if(g.util>0.85&&g.fP<0.2){
      const cons=G.filter(h=>h.r&&h.r.need[g.out]>0&&h.fS>0.25);
      if(cons.length){const worst=cons.sort((a,b)=>b.fS-a.fS)[0];
        add(78+20*worst.fS,'bottleneck','Bottleneck: '+g.name+' at '+Math.round(g.util*100)+'%',worst.name+' starved '+Math.round(worst.fS*100)+'% of the time waiting for '+itemName(g.out)+'. Add or upgrade '+TYPES[g.type].name+'s.',g.list[0])}
    }
    if(g.util>0.85&&g.fP<0.2&&g.r){
      const sup=G.filter(h=>h.out>=0&&g.r.need[h.out]>0&&h.fB>0.3);
      if(sup.length){const w=sup.sort((a,b)=>b.fB-a.fB)[0];add(76+20*w.fB,'bottleneck','Bottleneck: '+g.name+' at '+Math.round(g.util*100)+'%',w.list.length+'× '+w.name+' blocked '+Math.round(w.fB*100)+'% of the time — this stage cannot keep up. Add or upgrade '+TYPES[g.type].name+'s.',g.list[0])}
    }
    if(g.util>0.85&&g.fP<0.2&&g.type!=='extractor'){
      // input side backing up: feeding belts are packed while this stage runs flat-out
      let backed=0,feedJam=0;
      for(const m of g.list){let b=false;for(let d=0;d<4;d++){const n=structAt(m.x+DX[d],m.y+DY[d]);if(n&&n.type==='belt'&&n.fwd===m&&n.items.length>=Math.floor(1/GAP)){b=true;let c=n,k=0;while(c&&k<60){const up=structAt(c.x-DX[c.dir],c.y-DY[c.dir]);if(!up||up.type!=='belt'||up.fwd!==c||up.items.length<Math.floor(1/GAP))break;c=up;k++}feedJam+=k+1}}if(b)backed++}
      if(backed*2>=g.list.length&&!issues.some(i=>i.kind==='bottleneck'&&i.title.includes(g.name)))add(74+Math.min(20,feedJam),'bottleneck','Bottleneck: '+g.name+' at '+Math.round(g.util*100)+'%','Input belts are backing up ('+feedJam+' packed tiles) while '+g.list.length+' machine(s) run flat-out. Add or upgrade '+TYPES[g.type].name+'s.',g.list[0]);
    }
    if(g.fB>0.35){
      const s=g.list.slice().sort((a,b)=>b.fB-a.fB)[0];const tr=traceOutput(s);
      if(g.out===IT.coal&&TOPO.nets.every(n=>n.gens.every(q=>q.fuel>=GEN_FUEL_CAP-1))){tr.benign=true;tr.text='generators are fully fuelled (healthy backpressure)'}
      add(tr.benign?12:45+40*g.fB,'blocked','Output blocked: '+g.list.length+'× '+g.name,Math.round(g.fB*100)+'% of time full — '+tr.text+'.',tr.at||s);
    }
    if(g.fS>0.4&&g.type!=='extractor'&&g.r){
      let miss=-1,worst=1e9;
      for(const s of g.list)for(const [it,n] of g.r.i){const v=s.inp[it]/n;if(v<worst){worst=v;miss=it}}
      add(30+40*g.fS,'starved','Starved: '+g.list.length+'× '+g.name,'Idle '+Math.round(g.fS*100)+'% of the time; short on '+itemName(miss)+'.',g.list[0]);
    }
  }
  // saturated belts: running at >=90% of max throughput
  let sat=null,satN=0,jam=0;
  for(const b of TOPO.belts){const m=beltMax(b);if(b.fT>=0.9*m){satN++;if(!sat||b.fT>sat.fT)sat=b}if(b.jam)jam++}
  if(satN)add(50+Math.min(30,satN),'belt','Belt at capacity: '+satN+' tile(s)','Carrying '+sat.fT.toFixed(1)+'/s of max '+beltMax(sat).toFixed(1)+'/s. Upgrade belts or split the flow.',sat);
  if(jam>=4)add(30+Math.min(30,jam),'belt','Congestion: '+jam+' jammed belt tiles','Items are packed end-to-end and crawling; downstream consumers are slower than supply.',TOPO.belts.find(b=>b.jam));
  issues.sort((a,b)=>b.sev-a.sev);
  STATS.issues=issues.slice(0,8);STATS.lastIssuesTick=W.tick;
}

function rle(a){const o=[];let i=0;while(i<a.length){const v=a[i];let n=1;while(i+n<a.length&&a[i+n]===v)n++;o.push(v,n);i+=n}return o}
function unrle(o,len,maxV){
  const a=new Uint8Array(len);if(!Array.isArray(o))throw new Error('map layer missing');
  let p=0;for(let i=0;i+1<o.length;i+=2){const v=intIn(o[i],0,maxV,0),n=intIn(o[i+1],0,len,0);for(let k=0;k<n&&p<len;k++)a[p++]=v}
  if(p!==len)throw new Error('map layer has wrong size');return a;
}
function serialize(withState=true){
  const d={format:'fluxworks',v:1,name:W.name||'',savedAt:Date.now(),mode:W.mode,preset:W.presetId,level:W.levelId,
    settings:{density:SET.density,beltMult:SET.beltMult,machMult:SET.machMult,costMode:SET.costMode,powerDiff:SET.powerDiff,seed:SET.seed},
    w:W.w,h:W.h,terrain:rle(W.terrain),dep:rle(W.dep),depAmt:[]};
  for(let i=0;i<W.dep.length;i++)if(W.dep[i])d.depAmt.push(W.depAmt[i]);
  if(withState){Object.assign(d,{tick:W.tick,credits:W.credits,spent:W.spent,fuelUsed:W.fuelUsed,trips:W.trips,nextId:W.nextId,delivered:Array.from(W.delivered),camp:W.camp?Object.assign({},W.camp):null})}

}
function loadData(d){
  if(!d||typeof d!=='object')throw new Error('Not a factory object');
  if(d.format!=='fluxworks')throw new Error('Not a Fluxworks factory (missing format tag)');
  const w=intIn(d.w,8,256,0),h=intIn(d.h,8,256,0);
  if(!w||!h)throw new Error('Invalid grid size');
  const old=W,oldSet=Object.assign({},SET);
  const warn=[];
  try{
    W=newWorld(w,h);
    W.terrain=unrle(d.terrain,w*h,2);W.dep=unrle(d.dep,w*h,4);
    const amts=Array.isArray(d.depAmt)?d.depAmt:[];let k=0;
    for(let i=0;i<w*h;i++)if(W.dep[i]){const a=num(amts[k++],600);W.depAmt[i]=a<0?-1:Math.min(Math.floor(a),1e9)}
    const st=d.settings||{};
    if([2,3,4].includes(st.density))SET.density=st.density;
    if(typeof st.beltMult==='number'&&st.beltMult>=0.25&&st.beltMult<=4)SET.beltMult=st.beltMult;
    if(typeof st.machMult==='number'&&st.machMult>=0.25&&st.machMult<=4)SET.machMult=st.machMult;
    if(COST_MULT[st.costMode]!==undefined)SET.costMode=st.costMode;
    if(POWER_DIFF[st.powerDiff])SET.powerDiff=st.powerDiff;
    if(Number.isFinite(st.seed))SET.seed=st.seed>>>0;
    applyDensity();
    W.mode=d.mode==='campaign'?'campaign':'sandbox';W.presetId=typeof d.preset==='string'?d.preset.slice(0,40):null;W.levelId=typeof d.level==='string'?d.level.slice(0,40):null;
    W.name=typeof d.name==='string'?d.name.slice(0,60):'';
    W.tick=intIn(d.tick,0,1e12,0);W.credits=num(d.credits,0);W.spent=num(d.spent,0);W.fuelUsed=intIn(d.fuelUsed,0,1e12,0);W.trips=intIn(d.trips,0,1e9,0);
    if(Array.isArray(d.delivered))for(let i=0;i<NI;i++)W.delivered[i]=Math.max(0,num(d.delivered[i],0));
    const list=Array.isArray(d.structs)?d.structs:[];
    if(list.length>60000)throw new Error('Too many structures');
    const used=new Set();let skipped=0;
    for(const o of list){
      const s=deserStruct(o,true);
      if(!s){skipped++;continue}
      if(used.has(s.id))s.id=W.nextId++;
      const r=placeReason(s.type,s.x,s.y);
      if(r){skipped++;continue}
      used.add(s.id);addStruct(s);
    }
    W.nextId=Math.max(W.nextId,intIn(d.nextId,1,1e9,1));
    if(skipped)warn.push(skipped+' invalid structure(s) skipped');
    W.camp=null;
    if(W.mode==='campaign'&&d.camp&&typeof d.camp==='object'){
      const L=LEVELS.find(l=>l.id===d.camp.level);
      if(L){W.camp=campState(L);W.levelId=L.id;
        if(d.camp.got!==undefined){W.camp.got=intIn(d.camp.got,0,1e9,0);W.camp.done=!!d.camp.done;W.camp.startTick=intIn(d.camp.startTick,0,1e12,0);W.camp.doneTick=intIn(d.camp.doneTick,0,1e12,0);W.camp.satSum=Math.max(0,num(d.camp.satSum,0));W.camp.satN=intIn(d.camp.satN,0,1e12,0);W.camp.shown=!!d.camp.done}}
      else W.mode='sandbox';
    }
  }catch(e){W=old;Object.assign(SET,oldSet);applyDensity();topoDirty=true;throw e}
  topoDirty=true;rebuildTopo();resetStats();
  return warn;
}
/* canonical hash of the full simulation state — used to verify exact save/load round trips */

const b64u={

  dec(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const b=atob(str);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
};
async function makeShareCode(){
  const json=JSON.stringify(serialize(false));
  if(window.CompressionStream){
    try{const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();return 'FW1.'+b64u.enc(new Uint8Array(buf))}catch(e){}

async function parseAnyText(text){
  text=String(text||'').trim();
  if(!text)throw new Error('Nothing to import');
  if(text[0]==='{')return JSON.parse(text);
  const m=/^FW([01])\.([A-Za-z0-9_-]+)$/.exec(text.replace(/\s+/g,''));
  if(!m)throw new Error('Not a JSON save or FW share code');
  const bytes=b64u.dec(m[2]);
  if(m[1]==='0')return JSON.parse(new TextDecoder().decode(bytes));
  if(!window.DecompressionStream)throw new Error('This browser cannot decompress share codes');

  return JSON.parse(new TextDecoder().decode(buf));
}

/* =====================================================================
   PRESETS & CAMPAIGN (deterministic builders; seed only affects decoration)
   ===================================================================== */
function builder(){
  const B={
    fails:[],
    dep(x,y,w,h,t,amt){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(inb(i,j)){const c=cidx(i,j);W.dep[c]=t;W.depAmt[c]=amt;W.terrain[c]=0}},
    clear(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(inb(i,j)){const c=cidx(i,j);W.terrain[c]=0;W.dep[c]=0;W.depAmt[c]=0}},
    rock(x,y){if(inb(x,y)&&!W.dep[cidx(x,y)])W.terrain[cidx(x,y)]=1},
    water(x,y,w,h){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(inb(i,j))W.terrain[cidx(i,j)]=2},
    put(type,x,y,dir=0,o={}){
      const r=placeReason(type,x,y);
      if(r){B.fails.push(type+'@'+x+','+y+': '+r);return null}
      const s=makeStruct(type,x,y,dir,o.tier||0,o.cfg);addStruct(s);if(o.init)o.init(s);return s;
    },
    belt(x,y,dir,len,tier=0){const a=[];for(let k=0;k<len;k++)a.push(B.put('belt',x+DX[dir]*k,y+DY[dir]*k,dir,{tier}));return a},
    path(pts,tier=0,lastDir){
      const cells=[];
      for(let k=0;k+1<pts.length;k++){const [ax,ay]=pts[k],[bx,by]=pts[k+1];const sx=Math.sign(bx-ax),sy=Math.sign(by-ay);let x=ax,y=ay;while(x!==bx||y!==by){cells.push([x,y]);x+=sx;y+=sy}}
      const L=pts[pts.length-1];cells.push([L[0],L[1]]);
      const out=[];
      for(let k=0;k<cells.length;k++){
        let d;
        if(k+1<cells.length){const dx=cells[k+1][0]-cells[k][0],dy=cells[k+1][1]-cells[k][1];d=dx>0?0:dx<0?2:dy>0?1:3}
        else if(lastDir!==undefined)d=lastDir;else d=out.length?out[out.length-1].dir:0;
        const s=B.put('belt',cells[k][0],cells[k][1],d,{tier});if(s)out.push(s);
      }
      return out;
    },
    seedItems(belts,item,every=2){belts.forEach((b,k)=>{if(b&&k%every===0&&!b.items.length)b.items.push({t:item,p:0.25+((k*7)%5)*0.1})})},
    autoPower(){
      const R=POLE_R,R2=POLE_REACH*POLE_REACH;
      const poles=()=>[...W.structs.values()].filter(s=>s.type==='pole');
      const covered=(x,y)=>{for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const p=structAt(x+dx,y+dy);if(p&&p.type==='pole')return true}return false};
      const need=()=>[...W.structs.values()].filter(s=>hasPowerRole(s.type)&&!covered(s.x,s.y));
      let list=need(),guard=0;
      while(list.length&&guard++<800){
        const s=list[0],P=poles();let best=null,bs=-1e9;
        for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
          const x=s.x+dx,y=s.y+dy;if(placeReason('pole',x,y))continue;
          let sc=0;for(const t of list)if(Math.abs(t.x-x)<=R&&Math.abs(t.y-y)<=R)sc++;
          if(P.some(p=>(p.x-x)**2+(p.y-y)**2<=R2))sc+=0.5;
          sc-=(Math.abs(dx)+Math.abs(dy))*0.001;
          if(sc>bs){bs=sc;best={x,y}}
        }
        if(!best){list.shift();continue}
        B.put('pole',best.x,best.y);list=list.filter(t=>!(Math.abs(t.x-best.x)<=R&&Math.abs(t.y-best.y)<=R));
      }
      for(let it=0;it<80;it++){
        const P=poles();if(P.length<2)break;
        const par=P.map((_,i)=>i);const f=i=>{while(par[i]!==i){par[i]=par[par[i]];i=par[i]}return i};
        for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++)if((P[i].x-P[j].x)**2+(P[i].y-P[j].y)**2<=R2)par[f(i)]=f(j);
        const sizes=new Map();P.forEach((_,i)=>sizes.set(f(i),(sizes.get(f(i))||0)+1));
        if(sizes.size<2)break;
        const main=[...sizes.entries()].sort((a,b)=>b[1]-a[1])[0][0];
        let bd=1e9,A=null,Bp=null;
        for(let i=0;i<P.length;i++){if(f(i)!==main)continue;for(let j=0;j<P.length;j++){if(f(j)===main)continue;const d=(P[i].x-P[j].x)**2+(P[i].y-P[j].y)**2;if(d<bd){bd=d;A=P[i];Bp=P[j]}}}
        const d=Math.sqrt(bd),t=Math.min(1,(POLE_REACH-0.6)/d),tx=Math.round(A.x+(Bp.x-A.x)*t),ty=Math.round(A.y+(Bp.y-A.y)*t);
        let pick=null,pd=1e9;
        for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const x=tx+dx,y=ty+dy;if(placeReason('pole',x,y))continue;if((x-A.x)**2+(y-A.y)**2>R2)continue;const dd=(x-Bp.x)**2+(y-Bp.y)**2;if(dd<pd){pd=dd;pick={x,y}}}
        if(!pick)break;B.put('pole',pick.x,pick.y);
      }
    },
    rocks(n,rng,avoid){for(let k=0;k<n;k++){const x=Math.floor(rng()*W.w),y=Math.floor(rng()*W.h);if(avoid&&avoid(x,y))continue;const c=cidx(x,y);if(!W.dep[c]&&!W.grid[c])W.terrain[c]=1}},
  };
  return B;
}

function campState(L){return {level:L.id,item:L.item,need:L.need,got:0,reward:L.reward,budget:L.budget,par:L.par,parFoot:L.parFoot,startTick:0,done:false,doneTick:0,satSum:0,satN:0,shown:false}}
function buildWorld(kind,id,seed){
  const def=kind==='campaign'?LEVELS.find(l=>l.id===id):PRESETS.find(p=>p.id===id);
  if(!def)throw new Error('Unknown '+kind+' '+id);
  const w=kind==='sandbox'&&id==='empty'?SET.gridW:def.w,h=kind==='sandbox'&&id==='empty'?SET.gridH:def.h;
  W=newWorld(w,h);W.mode=kind;W.presetId=kind==='sandbox'?id:null;W.levelId=kind==='campaign'?id:null;W.name=def.name;
  const rng=mulberry32((seed>>>0)^hash32(id));
  const B=builder();def.build(B,rng);
  if(kind==='sandbox'&&id!=='empty')genTerrainDecor(rng);
  if(B.fails.length)console.warn('[preset '+id+'] placement issues:',B.fails);
  if(kind==='campaign'){W.camp=campState(def);W.credits=def.budget;if(SET.costMode==='free'){SET.costMode='standard';SET.costForced=true}}
  else{W.credits=0;if(SET.costForced){SET.costMode='free';SET.costForced=false}}
  W.spent=0;topoDirty=true;rebuildTopo();resetStats();
  // stagger extractor timers deterministically so the line starts lively
  let k=0;for(const s of W.structs.values()){if(s.type==='extractor')s.prog=((k++*0.37)%1)*0.9}
  return B.fails;
}
function genTerrainDecor(rng){for(let i=0;i<W.w*W.h;i++){if(rng()<0.004&&!W.grid[i]&&!W.dep[i])W.terrain[i]=1}}
function presetLabel(){if(W.mode==='campaign'){const L=LEVELS.find(l=>l.id===W.levelId);return L?L.name:'Campaign'}const P=PRESETS.find(p=>p.id===W.presetId);return P?P.name:(W.name||'Custom')}
function campaignScore(){
  const c=W.camp,L=LEVELS.find(l=>l.id===c.level);
  const t=((c.done?c.doneTick:W.tick)-c.startTick)/TPS;
  const timeS=Math.round(400*clamp((3*c.par-t)/(2*c.par),0,1));
  const budS=Math.round(250*clamp(1-W.spent/Math.max(1,c.budget),0,1));
  const powS=Math.round(200*(c.satN?c.satSum/c.satN:1));
  const foot=W.structs.size;
  const footS=Math.round(150*clamp(1-(foot-c.parFoot)/(c.parFoot*1.5),0,1));
  const total=timeS+budS+powS+footS;
  return {t,timeS,budS,powS,footS,foot,total,stars:total>=780?3:total>=520?2:1,L};
}

  switch(it){

      poly([[.18,.42],[.34,.18],[.62,.14],[.84,.34],[.86,.62],[.66,.86],[.34,.84],[.14,.64]]);g.fillStyle=c;g.fill();g.stroke();
      g.fillStyle=it===IT.coal?'#6d6d7a':'rgba(255,255,255,.35)';poly([[.34,.26],[.56,.22],[.5,.4],[.32,.42]]);g.fill();
      g.fillStyle=it===IT.copper_ore?'#5fd0b0':it===IT.iron_ore?'#50657a':it===IT.coal?'#15151a':'#8c7b5c';
      g.beginPath();g.arc(.62,.6,.08,0,7);g.arc(.38,.66,.06,0,7);g.fill();break}
    case IT.iron_plate:case IT.copper_plate:{
      rr(g,.16,.2,.68,.6,.08);g.fillStyle=c;g.fill();g.stroke();
      g.fillStyle='rgba(255,255,255,.35)';g.fillRect(.22,.26,.56,.12);g.fillStyle='rgba(0,0,0,.15)';g.fillRect(.22,.62,.56,.1);break}
    case IT.wire:{
      g.strokeStyle='rgba(0,0,0,.8)';g.lineWidth=0.2;g.beginPath();g.arc(.5,.5,.26,0,7);g.stroke();
      g.strokeStyle=c;g.lineWidth=0.11;g.beginPath();g.arc(.5,.5,.26,0,7);g.stroke();
      g.strokeStyle='#ffd3a6';g.lineWidth=0.04;g.beginPath();g.arc(.5,.5,.26,-2.4,-0.8);g.stroke();break}
    case IT.gear:{
      g.beginPath();const n=8;for(let k=0;k<n*2;k++){const a=k*Math.PI/n,r=k%2?.3:.4;g.lineTo(.5+Math.cos(a)*r,.5+Math.sin(a)*r)}g.closePath();
      g.fillStyle=c;g.fill();g.stroke();g.beginPath();g.arc(.5,.5,.1,0,7);g.fillStyle='#39414b';g.fill();break}

function paintBelt(g,tier,curve,frame){

  const col=TIER_COL[tier];

    g.fillStyle='#3a414b';g.fillRect(0,.08,1,.06);g.fillRect(0,.86,1,.06);

    g.globalAlpha=1;

    // arc around the tile corner shared by the entry side and the exit edge
    const cy=curve===1?0:1,sg=curve===1?-1:1;

    g.fillStyle='#14181d';g.beginPath();g.arc(1,cy,.92,0,7);g.arc(1,cy,.08,0,7,true);g.fill();
    g.fillStyle='#2b313a';g.beginPath();g.arc(1,cy,.84,0,7);g.arc(1,cy,.16,0,7,true);g.fill();
    g.strokeStyle='#3a414b';g.lineWidth=.06;g.beginPath();g.arc(1,cy,.89,0,7);g.stroke();g.beginPath();g.arc(1,cy,.11,0,7);g.stroke();

    for(let k=-1;k<3;k++){
      const t=(k+frame/8)/2+.12;if(t<-.05||t>1.05)continue;

    }

}

/* ---------- geometry ---------- */
function beltItemPos(b,p){
  const cx=b.x+.5,cy=b.y+.5,d=b.dir;
  if(b.cs<0)return [cx+DX[d]*(p-.5),cy+DY[d]*(p-.5)];
  const s=b.cs,Cx=cx+(DX[s]+DX[d])*.5,Cy=cy+(DY[s]+DY[d])*.5;
  const a0=Math.atan2(-DY[d],-DX[d]),a1=Math.atan2(-DY[s],-DX[s]);
  let da=a1-a0;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;
  const a=a0+da*p;return [Cx+Math.cos(a)*.5,Cy+Math.sin(a)*.5];
}
function curveCode(b){if(b.cs<0)return 0;return b.cs===leftOf(b.dir)?1:2}

/* ---------- particles ---------- */
const FX=[];
function fxBurst(x,y,color,n=14,spd=2.2,kind='dust'){for(let k=0;k<n&&FX.length<900;k++){const a=Math.random()*Math.PI*2,v=spd*(0.3+Math.random());FX.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:.35+Math.random()*.35,c:color,s:.05+Math.random()*.06,k:kind})}}

function fxSmoke(x,y){if(FX.length<900)FX.push({x,y,vx:(Math.random()-.5)*.25,vy:-.5-Math.random()*.3,life:0,max:1.6,c:'rgba(160,170,180,',s:.08,k:'smoke'})}
function stepFX(dt){for(let i=FX.length-1;i>=0;i--){const p=FX[i];p.life+=dt;if(p.life>=p.max){FX.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='dust'){p.vx*=.9;p.vy*=.9}}}
function drawFX(g,V){
  for(const p of FX){
    const t=p.life/p.max,x=p.x*V.z+V.ox,y=p.y*V.z+V.oy;

  }
  g.globalAlpha=1;
}

/* ---------- main world draw ---------- */
function drawWorld(g,V){
  const z=V.z,S=sprSize(z,V.dpr);
  const X=x=>x*z+V.ox,Y=y=>y*z+V.oy;

  g.fillStyle='#181d21';g.fillRect(X(0),Y(0),W.w*z,W.h*z);
  g.fillStyle='#1b2125';g.beginPath();
  for(let y=V.y0;y<=V.y1;y++)for(let x=V.x0+((V.x0+y)&1);x<=V.x1;x+=2)g.rect(X(x),Y(y),z,z);
  g.fill();
  // terrain + deposits
  for(let y=V.y0;y<=V.y1;y++)for(let x=V.x0;x<=V.x1;x++){
    const i=y*W.w+x,t=W.terrain[i];
    if(t===1)g.drawImage(rockSprite((x*7+y*13)%4,S),X(x),Y(y),z,z);
    else if(t===2)g.drawImage(waterSprite(S),X(x),Y(y),z,z);
    else if(W.dep[i]){const a=W.depAmt[i];g.globalAlpha=a===0?.25:a<0?1:clamp(.45+a/800,.45,1);g.drawImage(depSprite(W.dep[i],(x*3+y*5)%4,S),X(x),Y(y),z,z);g.globalAlpha=1}
  }
  if(V.live&&z>=10){const sh=(Math.sin(rtime*1.5)+1)/2;g.fillStyle='rgba(140,200,255,'+(0.03+sh*0.04)+')';for(let y=V.y0;y<=V.y1;y++)for(let x=V.x0;x<=V.x1;x++)if(W.terrain[y*W.w+x]===2&&((x+y+Math.floor(rtime))&1))g.fillRect(X(x),Y(y),z,z)}
  if(OV.grid&&z>=12){
    g.strokeStyle='rgba(255,255,255,.045)';g.lineWidth=1;g.beginPath();
    for(let x=V.x0;x<=V.x1+1;x++){const sx=Math.round(X(x))+.5;g.moveTo(sx,Y(V.y0));g.lineTo(sx,Y(V.y1+1))}
    for(let y=V.y0;y<=V.y1+1;y++){const sy=Math.round(Y(y))+.5;g.moveTo(X(V.x0),sy);g.lineTo(X(V.x1+1),sy)}
    g.stroke();
  }
  g.strokeStyle='rgba(255,178,56,.35)';g.lineWidth=2;g.strokeRect(X(0)-1,Y(0)-1,W.w*z+2,W.h*z+2);
  if(OV.power||(V.live&&typeof showCoverage==='function'&&showCoverage()))drawCoverage(g,V);
  // belts (base)
  const frameIdx={};
  for(let t=0;t<3;t++){const ph=(rtime*BELT_SPEED[t]*SET.beltMult*(V.live&&!paused?1:0)+ (V.live?0:0))%1;frameIdx[t]=Math.floor(((ph*2)%1)*8)}
  const vis=[],belts=[];
  const lod=z<12;   // level of detail: when zoomed out, batch belts & items into a few paths
  const bp=lod?[new Path2D(),new Path2D(),new Path2D()]:null,bb=lod?new Path2D():null;
  for(let y=V.y0;y<=V.y1;y++)for(let x=V.x0;x<=V.x1;x++){const id=W.grid[y*W.w+x];if(!id)continue;const s=W.structs.get(id);if(!s)continue;
    if(s.type==='belt'){belts.push(s);
      if(lod){const hz=(s.dir&1)===0;if(hz)bb.rect(X(x),Y(y)+z*.12,z,z*.76);else bb.rect(X(x)+z*.12,Y(y),z*.76,z);const p=bp[s.tier];if(hz)p.rect(X(x),Y(y)+z*.46,z,Math.max(1,z*.08));else p.rect(X(x)+z*.46,Y(y),Math.max(1,z*.08),z)}
      else g.drawImage(beltSprite(s.tier,s.dir,curveCode(s),V.live?frameIdx[s.tier]:0,S),X(x),Y(y),z,z)}
    else vis.push(s)}
  if(lod){g.fillStyle='#2b313a';g.fill(bb);for(let t=0;t<3;t++){g.fillStyle=TIER_COL[t];g.globalAlpha=.55;g.fill(bp[t])}g.globalAlpha=1}
  // items on belts
  if(z>=4){
    const isz=Math.max(3,Math.round(z*.42)),ipx=sprSize(isz,V.dpr);
    if(lod){
      const ip=[];for(let i=0;i<NI;i++)ip.push(null);
      for(const b of belts){if(!b.items.length)continue;for(const it of b.items){const [wx,wy]=beltItemPos(b,it.p);(ip[it.t]||(ip[it.t]=new Path2D())).rect(X(wx)-isz/2,Y(wy)-isz/2,isz,isz)}}

}
function drawStruct(g,s,V,S){

    case 'delete':{if(d.moved){const l=structsInRect(d.start,c);if(l.length)deleteStructs(l)}else{const s=structAt(c.x,c.y);if(s)deleteStructs([s])}break}

/* ---------- keyboard ---------- */
const typingTarget=el=>el&&(el.tagName==='INPUT'||el.tagName==='TEXTAREA'||el.tagName==='SELECT'||el.isContentEditable);
window.addEventListener('keydown',e=>{
  auInit();
  if($('#modal').classList.contains('on')){if(e.key==='Escape')closeModal();return}
  if(typingTarget(document.activeElement)){if(e.key==='Escape')document.activeElement.blur();return}
  const k=e.key,lk=k.length===1?k.toLowerCase():k,ctrl=e.ctrlKey||e.metaKey;
  if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&(k===' '||k==='Enter'))document.activeElement.blur();
  if(ctrl){
    if(lk==='z'&&!e.shiftKey){e.preventDefault();undo()}
    else if(lk==='y'||(lk==='z'&&e.shiftKey)){e.preventDefault();redo()}
    else if(lk==='c'){e.preventDefault();copySelection(false)}
    else if(lk==='x'){e.preventDefault();copySelection(true)}
    else if(lk==='v'){e.preventDefault();setTool('paste')}
    else if(lk==='s'){e.preventDefault();quickSave()}
    else if(lk==='a'){e.preventDefault();selection=new Set([...W.structs.keys()]);uiDirty=true;inspectorKey=''}
    return;
  }
  if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(lk.toLowerCase())){keysHeld.add(lk.toLowerCase());e.preventDefault();return}
  switch(lk){
    case ' ':e.preventDefault();togglePause();return;
    case '.':stepOnce();return;
    case '[':changeSpeed(-1);return;
    case ']':changeSpeed(1);return;
    case '=':case '+':zoomAt(VW/2,VH/2,1.2);return;
    case '-':case '_':zoomAt(VW/2,VH/2,1/1.2);return;
    case 'Home':fitCamera();return;
    case 'Escape':if(drag){drag=null;return}if(tool!=='select')setTool('select');else{selection.clear();uiDirty=true;inspectorKey=''}return;
    case 'Delete':case 'Backspace':{const l=[...selection].map(id=>W.structs.get(id)).filter(Boolean);if(l.length)deleteStructs(l);else{const s=structAt(hover.x,hover.y);if(s&&hover.in)deleteStructs([s])}return}
    case 'r':{
      if(tool==='paste'){rotateClipboard();return}
      if(tool==='build'){const p=BP[buildType];p.dir=(p.dir+(e.shiftKey?3:1))&3;sfx('rotate');renderToolOpts();return}
      const l=selection.size?[...selection].map(id=>W.structs.get(id)).filter(Boolean):(hover.in&&structAt(hover.x,hover.y)?[structAt(hover.x,hover.y)]:[]);
      if(l.length)rotateStructs(l,e.shiftKey);return}
    case 'g':startMove();return;
    case '?':openHelp();return;
  }
  const t=TOOLS.find(t=>t!=='-'&&t.key===lk);
  if(t){setTool(t.id);sfx('ui')}
});
window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key.toLowerCase();keysHeld.delete(k)});
window.addEventListener('blur',()=>keysHeld.clear());
function panKeys(dt){
  let dx=0,dy=0;
  if(keysHeld.has('arrowleft')||keysHeld.has('a'))dx--;if(keysHeld.has('arrowright')||keysHeld.has('d'))dx++;
  if(keysHeld.has('arrowup')||keysHeld.has('w'))dy--;if(keysHeld.has('arrowdown')||keysHeld.has('s'))dy++;

  }
  if(inMap){
    const s=structAt(hx,hy);
    const col=tool==='delete'?'#ff5d5d':tool==='upgrade'?'#ffc23d':tool==='eyedrop'?'#b28dff':'rgba(255,255,255,.55)';
    g.strokeStyle=col;g.lineWidth=1.5;g.strokeRect(hx*z+V.ox+1,hy*z+V.oy+1,z-2,z-2);

    if(s&&tool==='delete')label(g,'Delete '+TYPES[s.type].name+(refundOf(s)?' · +'+refundOf(s)+' cr':''),hover.sx+16,hover.sy+14,'#ff8080');
  }
}

/* ---------- charts ---------- */
function drawChart(cvs,series,o={}){
  const r=cvs.getBoundingClientRect();const w=Math.max(50,Math.round(r.width||280)),h=Math.max(30,Math.round(r.height||70));
  const d=Math.min(2,window.devicePixelRatio||1);if(cvs.width!==w*d||cvs.height!==h*d){cvs.width=w*d;cvs.height=h*d}
  const g=cvs.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);
  let mx=o.max||0;for(const s of series){const n=s.n??s.data.length;for(let i=0;i<n;i++)mx=Math.max(mx,s.get?s.get(i):s.data[i])}
  mx=mx||1;
  g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;for(let k=1;k<4;k++){const y=Math.round(h*k/4)+.5;g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
  for(const s of series){
    const n=s.n??s.data.length,N=o.len||n;if(n<2)continue;
    g.beginPath();for(let i=0;i<n;i++){const v=s.get?s.get(i):s.data[i];const x=(N-n+i)/(N-1)*w,y=h-3-(v/mx)*(h-8);i?g.lineTo(x,y):g.moveTo(x,y)}
    if(s.fill){g.lineTo(w,h);g.lineTo((N-n)/(N-1)*w,h);g.closePath();g.fillStyle=s.fill;g.fill();g.beginPath();for(let i=0;i<n;i++){const v=s.get?s.get(i):s.data[i];const x=(N-n+i)/(N-1)*w,y=h-3-(v/mx)*(h-8);i?g.lineTo(x,y):g.moveTo(x,y)}}
    g.strokeStyle=s.color;g.lineWidth=1.6;g.stroke();
  }
  g.fillStyle='#8a96a5';g.font='10px ui-monospace,monospace';g.textAlign='right';g.fillText((o.fmt?o.fmt(mx):fmt(mx,1)),w-4,11);
  if(o.label){g.textAlign='left';g.fillText(o.label,4,11)}
}

/* ---------- inspector ---------- */
function structTitle(s){return TYPES[s.type].name+(TYPES[s.type].tiers>1?' '+TIER_NAME[s.tier]:'')}
function statusOf(s){
  switch(s.type){
    case 'belt':return s.jam?['Jammed — packed & crawling','#ff8a3d']:s.blk?['Front blocked','#ff5d5d']:s.items.length?['Moving','#6fdc6f']:['Empty','#8a96a5'];
    case 'pole':{const n=TOPO.nets[s.net];if(!n)return ['Unlinked','#8a96a5'];if(n.root.trip>0)return ['Breaker tripped','#ff5d5d'];if(n.cap<=0)return ['No power source','#ff5d5d'];if(n.D>0&&n.sat<0.99)return ['Brownout '+Math.round(n.sat*100)+'%','#ff8a3d'];return ['Powered','#6fdc6f']}
    case 'chest':return s.total>=CHEST_CAP[s.tier]?['Full','#ff5d5d']:s.total?['Storing','#6fdc6f']:['Empty','#8a96a5'];
    case 'hub':return s.flashT&&performance.now()-s.flashT<1500?['Receiving','#6fdc6f']:['Waiting for items','#8a96a5'];
    case 'solar':return s.net<0?['Not connected','#ff5d5d']:s.out>0?['Generating','#6fdc6f']:['Night — no output','#8a96a5'];
    case 'battery':return s.net<0?['Not connected','#ff5d5d']:s.flow>0?['Charging','#6fdc6f']:s.flow<0?['Discharging','#ffb238']:['Idle','#8a96a5'];
    case 'inserter':if(s.st===ST.IDLE)return [s.fwd?'Waiting for an item the target accepts':'No target','#8a96a5'];break;
    case 'splitter':case 'merger':if(s.st===ST.IDLE)return ['Idle (empty)','#8a96a5'];break;
  }
  return ST_INFO[s.st]||ST_INFO[0];
}
function pill(st){const i=typeof st==='object'?statusOf(st):(ST_INFO[st]||ST_INFO[0]);return '<span class="pill" style="color:'+i[1]+';border-color:'+i[1]+'55;background:'+i[1]+'14">● '+esc(i[0])+'</span>'}
function segmentInfo(b){
  let n=1,items=b.items.length,cur=b,guard=0;const seen=new Set([b.id]);
  while(guard++<2000){const d=cur.dnb;if(!d||seen.has(d.id))break;seen.add(d.id);n++;items+=d.items.length;cur=d}
  const end=cur.fwd;cur=b;guard=0;
  while(guard++<2000){const back=structAt(cur.x-DX[cur.dir],cur.y-DY[cur.dir]);if(!back||back.type!=='belt'||back.dnb!==cur||seen.has(back.id))break;seen.add(back.id);n++;items+=back.items.length;cur=back}
  return {n,items,end};
}

    inspectorKey=key;
    if(list.length===1)el.innerHTML=inspectorStatic(list[0]);
    else if(list.length>1){
      const counts={};for(const s of list)counts[s.type]=(counts[s.type]||0)+1;

        '<div class="btnrow"><button class="btn" data-a="rot">Rotate</button><button class="btn" data-a="up">Upgrade '+up.length+' ('+up.reduce((a,s)=>a+upgradeCost(s),0)+' cr)</button><button class="btn" data-a="copy">Copy</button><button class="btn" data-a="move">Move</button><button class="btn danger" data-a="del">Delete</button></div></div><div id="insDyn"></div>';

  }

  if(list.length===1)dyn.innerHTML=inspectorDynamic(list[0]);
  else if(list.length>1){let work=0,st=0;for(const s of list){if(s.st===ST.WORK)work++;else if(s.st!==ST.IDLE)st++}dyn.innerHTML='<div class="card"><div class="kv"><div>Working</div><div>'+work+'</div><div>Stalled / other</div><div>'+st+'</div></div></div>'}

}
function histLabel(s){return {belt:'items/s through',extractor:'utilization',smelter:'utilization',assembler:'utilization',inserter:'moves/s',splitter:'items/s',merger:'items/s',chest:'stored items',generator:'output kW',solar:'output kW',battery:'charge %',hub:'deliveries/s',pole:'net demand (teal) vs supplied (amber)'}[s.type]+' · last 60 s'}
function histMax(s){return isMachine(s.type)?1:s.type==='battery'?100:s.type==='belt'?beltMax(s):s.type==='chest'?CHEST_CAP[s.tier]:0}
function histFmt(s){return isMachine(s.type)?(v=>Math.round(v*100)+'%'):s.type==='battery'?(v=>v.toFixed(0)+'%'):(v=>fmt(v,1))}
function inspectorStatic(s){

  if(s.type==='inserter'||s.type==='splitter')ctl+='<div class="row"><span class="l">Filter</span><select data-cfg="filter"><option value="-1">Any item</option>'+ITEM_DEFS.map((d,i)=>'<option value="'+i+'"'+(i===s.cfg.filter?' selected':'')+'>'+esc(d[1])+'</option>').join('')+'</select></div>';
  if(s.type==='splitter')ctl+='<div class="row"><span class="l">Mode</span><select data-cfg="mode"><option value="0">Even split</option><option value="1"'+(s.cfg.mode===1?' selected':'')+'>Front priority</option></select></div>';
  if(ctl)h+='<div class="card">'+ctl+'</div>';
  const can=s.tier<T.tiers-1;
  h+='<div class="btnrow">'+(DIRECTIONAL[s.type]?'<button class="btn" data-a="rot">⟳ Rotate</button>':'')+(can?'<button class="btn" data-a="up">⬆ '+TIER_NAME[s.tier+1]+' ('+upgradeCost(s)+' cr)</button>':'')+'<button class="btn" data-a="eye">Pick</button><button class="btn" data-a="copy">Copy</button>'+(locked(s)?'':'<button class="btn danger" data-a="del">Delete</button>')+'</div>';
  h+='<div id="insDyn"></div>';
  setTimeout(()=>{const c=$('#insIcon');if(c){const g=c.getContext('2d');g.setTransform(88,0,0,88,0,0);g.clearRect(0,0,1,1);if(s.type==='belt')paintBelt(g,s.tier,0,2);else{g.save();paintStruct(g,s.type,s.tier);g.restore()}}},0);
  return h;

  else if(a==='move')startMove();
