  drawWorld(g,{z:tile,ox:0,oy:28,x0:0,y0:0,x1:W.w-1,y1:W.h-1,dpr:1,live:false});
  g.fillStyle='#ffb238';g.font='bold 15px sans-serif';g.textAlign='left';g.fillText('FLUXWORKS · '+presetLabel()+' · tick '+W.tick+' · '+W.structs.size+' structures',8,19);
  c.toBlob(b=>{if(b){download(b,'fluxworks-'+fileSlug()+'-t'+W.tick+'.png');toast('Exported PNG ('+c.width+'×'+c.height+')','ok')}else toast('PNG export failed','err')},'image/png');
  sfx('ui');
}

/* ---------- tooltip ---------- */
let ttShown=false,ttT=0;
function hideTooltip(){if(ttShown){$('#tooltip').style.display='none';ttShown=false}}
function updateTooltip(){
  if(drag||gesture||!hover.in||(tool!=='select'&&tool!=='build'&&tool!=='upgrade')||performance.now()-hover.moveT<380){if(drag||gesture)hideTooltip();return}
  const s=structAt(hover.x,hover.y);
  if(!s){
    const i=inb(hover.x,hover.y)?cidx(hover.x,hover.y):-1;
    if(i>=0&&(W.dep[i]||W.terrain[i])&&tool!=='build'){const t=$('#tooltip');t.innerHTML=W.terrain[i]?'<div class="tt">'+(W.terrain[i]===1?'Rock':'Water')+'</div><div class="tm">obstacle — cannot build</div>':'<div class="tt">'+DEP_NAME[W.dep[i]]+' deposit</div><div class="tm">'+(W.depAmt[i]<0?'renewable (∞)':fmt(W.depAmt[i],0)+' left')+'</div>';placeTooltip(t);return}
    hideTooltip();return;
  }
  if(performance.now()-ttT<200&&ttShown)return;ttT=performance.now();
  const t=$('#tooltip');const i=statusOf(s);
  let m='';
  if(s.type==='belt')m=s.items.length+' items · '+(s.fT||0).toFixed(1)+'/s'+(s.blk?' · front blocked':'');
  else if(s.type==='smelter'||s.type==='assembler'){const r=recipeOf(s);m=(r?r.name+' · '+Math.round(s.prog*100)+'%':'no recipe')+' · util '+Math.round(s.util*100)+'%'+(TYPES[s.type].kw?' · '+fmtKW(s.req):'')}
  else if(s.type==='extractor')m=DEP_NAME[W.dep[cidx(s.x,s.y)]]+' · buf '+s.buf+' · util '+Math.round(s.util*100)+'%';
  else if(s.type==='generator')m=fmtKW(s.out)+' · coal '+s.fuel;
  else if(s.type==='chest')m=s.total+'/'+CHEST_CAP[s.tier]+' items';
  else if(s.type==='battery')m=Math.round(s.stored/BAT_CAP[s.tier]*100)+'% charged';
  else if(s.type==='pole'){const n=TOPO.nets[s.net];m=n?'net #'+(n.id+1)+' · '+Math.round(n.sat*100)+'% · '+fmtKW(n.D):''}
  else if(s.type==='hub'){let tt=0;for(let k=0;k<NI;k++)tt+=s.recv[k];m=fmt(tt,0)+' received'}
  else if(s.type==='inserter')m=s.hand>=0?'holding '+itemName(s.hand):'waiting';
  else if(s.type==='solar')m=fmtKW(s.out);
  t.innerHTML='<div class="tt">'+esc(structTitle(s))+'</div><div class="ts" style="color:'+i[1]+'">'+esc(i[0])+'</div>'+(m?'<div class="tm">'+esc(m)+'</div>':'');
  placeTooltip(t);
}
function placeTooltip(t){t.style.display='block';ttShown=true;const w=t.offsetWidth,h=t.offsetHeight;let x=hover.sx+16,y=hover.sy+18;if(x+w>VW-6)x=hover.sx-w-12;if(y+h>VH-6)y=hover.sy-h-12;t.style.left=x+'px';t.style.top=y+'px'}

/* ---------- help ---------- */
function openHelp(){
  openModal('How to play Fluxworks','<p>Build a production chain: <b>Extractors</b> on ore deposits → <b>belts</b> → <b>Smelters</b>/<b>Assemblers</b> → <b>Delivery Hub</b>. Everything powered needs a <b>Power Pole</b> within 3 tiles, linked to a <b>Generator</b> (burns coal), <b>Solar Panel</b> or <b>Battery</b>.</p>'+
  '<div class="keys"><kbd>Left drag</kbd><span>lay belts / power lines (auto corners), paint buildings, select area</span><kbd>Right/Middle drag</kbd><span>pan · <kbd>wheel</kbd> zoom · touch: two fingers pan & pinch</span><kbd>Shift+drag</kbd><span>straight belt line</span><kbd>R / Shift+R</kbd><span>rotate placement or hovered/selected</span><kbd>Q</kbd><span>eyedropper (copy type & settings)</span><kbd>U</kbd><span>upgrade tool · <kbd>X</kbd> delete tool</span><kbd>Ctrl C / X / V</kbd><span>copy / cut / paste selection</span><kbd>G</kbd><span>move selection (or drag it)</span><kbd>Ctrl Z / Ctrl Y</kbd><span>undo / redo</span><kbd>Space · . · [ ]</kbd><span>pause · single tick · speed</span><kbd>Ctrl S</kbd><span>quick save</span><kbd>Home</kbd><span>fit camera</span></div>'+
  '<p class="hint">Machines stall when starved (…), blocked (■), unpowered (⚡) or misconfigured (?). Red ✕ marks outputs pointing into something that can never accept items. The Analytics tab lists detected bottlenecks — click one to jump to it.</p>',[{label:'Got it',cls:'primary'}]);
}

/* =====================================================================
   AUDIO (procedural Web Audio, unlocked by first user gesture)
   ===================================================================== */
const AU={ctx:null,master:null,last:{},played:0};
function auInit(){
  if(!AU.ctx){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=SET.vol;const comp=AU.ctx.createDynamicsCompressor();AU.master.connect(comp);comp.connect(AU.ctx.destination)}catch(e){AU.ctx=null;return}}
  if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});
}
function tone(f,dur,type='sine',vol=.2,f2,delay=0,attack=.004){
  const c=AU.ctx,t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,vol=.15,freq=1200,delay=0){
  const c=AU.ctx,t=c.currentTime+delay,n=Math.floor(c.sampleRate*dur),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=buf;f.type='lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(Math.max(60,freq/6),t+dur);
  g.gain.value=vol;s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);
}
function sfx(name){
  if(!SET.sound||!AU.ctx||AU.ctx.state!=='running')return;
  const now=performance.now(),min={deliver:90,brown:3500,place:40,ui:30}[name]||25;
  if(AU.last[name]&&now-AU.last[name]<min)return;AU.last[name]=now;AU.played++;
  try{
    switch(name){
      case 'place':tone(180,.09,'square',.12,120);tone(520,.06,'triangle',.1,760,.02);noise(.06,.06,2400);break;
      case 'delete':noise(.18,.18,1800);tone(300,.14,'sawtooth',.06,80);break;
      case 'rotate':tone(900,.035,'square',.05,1200);break;
      case 'ui':tone(1320,.03,'sine',.06);break;
      case 'error':tone(110,.16,'sawtooth',.13,90);tone(116,.16,'square',.06,95,.0);break;
      case 'upgrade':[440,660,880].forEach((f,i)=>tone(f,.1,'triangle',.1,f*1.02,i*.06));break;
      case 'deliver':tone(1568,.18,'sine',.05);tone(2350,.12,'sine',.025,0,.01);break;
      case 'complete':[523,659,784,1047].forEach((f,i)=>tone(f,.35,'triangle',.14,0,i*.11));break;
      case 'brown':tone(70,.4,'sawtooth',.08,55);tone(72,.4,'square',.04,56,.2);break;
    }
  }catch(e){}
}

/* =====================================================================
   MAIN LOOP & BOOT
   ===================================================================== */
function resize(){
  const r=stageEl.getBoundingClientRect();VW=Math.max(50,r.width);VH=Math.max(50,r.height);DPR=Math.min(3,window.devicePixelRatio||1);
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';
}
let frameW=0,frameH=0;
new ResizeObserver(()=>{resize();if(!frameW){frameW=VW;frameH=VH;return}if(Math.abs(frameW-VW)>1||Math.abs(frameH-VH)>1){const fw=VW/frameW,fh=VH/frameH,f=Math.abs(Math.log(fw))>=Math.abs(Math.log(fh))?fw:fh;if(W&&(f<0.8||f>1.25))cam.z=clamp(cam.z*f,ZMIN,ZMAX);frameW=VW;frameH=VH;clampCam()}}).observe(stageEl);
window.addEventListener('resize',()=>{resize()});
function render(){
  const g=ctx;g.setTransform(DPR,0,0,DPR,0,0);g.imageSmoothingEnabled=true;
  g.fillStyle='#0a0d10';g.fillRect(0,0,VW,VH);
  if(topoDirty)rebuildTopo();
  const z=cam.z,ox=VW/2-cam.x*z,oy=VH/2-cam.y*z;
  const V={z,ox,oy,x0:Math.max(0,Math.floor(-ox/z)),y0:Math.max(0,Math.floor(-oy/z)),x1:Math.min(W.w-1,Math.floor((VW-ox)/z)),y1:Math.min(W.h-1,Math.floor((VH-oy)/z)),dpr:DPR,live:true};
  drawWorld(g,V);
  const light=solarLight(W.tick);if(light<0.3){g.fillStyle='rgba(10,20,60,'+((0.3-light)*0.5)+')';g.fillRect(V.ox,V.oy,W.w*z,W.h*z)}
  drawInteraction(g,V);
}
let lastT=performance.now(),acc=0,fpsN=0,fpsT=0,simN=0,hudT=0,panelT=0,lastDel=0,lastAutosave=0,autosaveVer=-1,autosaveTick=-1,lastBrown=0;
function frame(t){
  requestAnimationFrame(frame);
  try{frameBody(t)}catch(e){console.error('[fluxworks] frame error',e);if(!paused){paused=true;syncTopbar();toast('Simulation paused after an internal error: '+e.message,'err')}}
}
function frameBody(t){
  const dt=Math.min(0.1,Math.max(0,(t-lastT)/1000));lastT=t;frameDt=dt;rtime+=dt;nowMs=t;
  panKeys(dt);
  if(Math.min(3,window.devicePixelRatio||1)!==DPR)resize();
  if(!paused){
    acc+=dt*SET.speed;const t0=performance.now();let n=0;lagging=false;
    while(acc>=DT){simTick();acc-=DT;n++;if((n&3)===0&&performance.now()-t0>13){lagging=true;acc=Math.min(acc,DT);break}}
    simN+=n;
  } else acc=0;
  stepFX(dt);
  try{render()}catch(e){console.error(e)}
  fpsN++;
  if(t-fpsT>=1000){fps=fpsN*1000/(t-fpsT);simRate=simN*1000/(t-fpsT);fpsN=0;simN=0;fpsT=t}
  if(t-hudT>250){hudT=t;renderHUD();updateTooltip();if(renderToolOpts&&lastOptsSel!==selection.size&&tool==='select')renderToolOpts();
    let tot=0;for(let i=0;i<NI;i++)tot+=W.delivered[i];if(tot>lastDel){sfx('deliver')}lastDel=tot;
    const p=powerTotals();if(p.D>0&&p.sat<0.7&&!paused&&t-lastBrown>6000){lastBrown=t;sfx('brown')}
    $('#btnUndo').disabled=!undoStack.length;$('#btnRedo').disabled=!redoStack.length;
    const as=$('#sAudioState');if(as)as.textContent='Audio: '+(AU.ctx?AU.ctx.state:'not started (click anywhere)')+' · '+AU.played+' sounds played';
  }
  if(t-panelT>(uiDirty?120:400)){panelT=t;uiDirty=false;
    const panelVisible=!isNarrow()||$('#panel').classList.contains('open');
    if(panelVisible){if(curTab==='inspect')renderInspector();else if(curTab==='stats')renderStats()}}
  checkCampaign();
  if(t-lastAutosave>30000){lastAutosave=t;if(autosaveVer!==editVersion||autosaveTick!==W.tick){autosaveVer=editVersion;autosaveTick=W.tick;saveSlot('autosave')}}
}
window.addEventListener('beforeunload',()=>{try{saveSlot('autosave')}catch(e){}});
document.addEventListener('pointerdown',()=>auInit(),true);
window.addEventListener('error',e=>{console.error('[fluxworks] uncaught',e.message)});
function boot(){
  applyDensity();resetStats();loadPrefs();
  W=newWorld(SET.gridW,SET.gridH);
  buildToolbar();renderChips();renderOverlaysTab();
  resize();
  startWorld('sandbox','starter',true);
  buildSettings();renderSaves();syncTopbar();renderToolOpts();
  const auto=slotIndex().find(s=>s.name==='autosave');
  if(auto)toast('Autosave found ('+new Date(auto.savedAt).toLocaleTimeString()+', tick '+auto.tick+')','',{label:'Resume',fn:()=>loadFromSlot('autosave')});
  lastAutosave=performance.now();
  requestAnimationFrame(t=>{lastT=t;fpsT=t;frame(t)});
}
/* live diagnostics hook for automated validation (read-only helpers + sim access) */
window.FW={get W(){return W},SET,STATS,TOPO,ST,IT,RC,simTick,stateHash,serialize,loadData,structAt,cam,OV,get selection(){return selection},get tool(){return currentToolId()},get paused(){return paused},AU,
  count(type){let n=0;for(const s of W.structs.values())if(!type||s.type===type)n++;return n},
  items(){let n=0;for(const b of TOPO.belts)n+=b.items.length;return n},
  power(){return powerTotals()},
  worldToScreen(x,y){const r=cv.getBoundingClientRect();return [r.left+(x-cam.x)*cam.z+VW/2,r.top+(y-cam.y)*cam.z+VH/2]}};
boot();
</script>
