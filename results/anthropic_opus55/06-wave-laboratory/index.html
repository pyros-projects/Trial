<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%230b1320%22/%3E%3Cpath d=%22M3 12c1.5-4 3-4 4.5 0s3 4 4.5 0 3-4 4.5 0 3 4 4.5 0%22 stroke=%22%234cc9f0%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
<title>Wave Laboratory — 2D Interference &amp; Diffraction</title>
<style>
:root{
  --bg:#070a10; --bg2:#0c111a; --panel:#0f1520; --panel2:#131b28; --line:#1d2839; --line2:#27354b;
  --fg:#dfe7f3; --fg2:#9fb0c7; --fg3:#6d7f98; --acc:#4cc9f0; --acc2:#f8b24c; --ok:#3ddc97; --warn:#f8c24c; --bad:#ff5d6c;
  --wall:#d6dde8; --abs:#8a5cf6; --med:#2dd4bf;
  --r:8px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh;min-height:520px}
/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:linear-gradient(180deg,#0e1420,#0a0f18);border-bottom:1px solid var(--line);flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.2px;font-size:14px;white-space:nowrap;margin-right:4px}
.brand svg{width:22px;height:22px}
.brand small{color:var(--fg3);font-weight:500;font-size:11px}
.grp{display:flex;align-items:center;gap:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:#1a2436;border-color:#34465f}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.tool:focus-visible,.mode:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn svg{width:15px;height:15px;flex:none}
.btn.icon{width:32px;padding:0}
.btn.primary{background:#12324a;border-color:#1f5577}
.btn.primary:hover{background:#17405e}
.btn.danger{border-color:#5a2630;background:#2a1318}
.btn.small{height:26px;padding:0 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.sep{width:1px;height:22px;background:var(--line2);margin:0 2px}
.presetwrap{display:flex;align-items:center;gap:6px;color:var(--fg2)}
select{height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);padding:0 8px;max-width:100%}
.modes{display:flex;gap:2px;padding:2px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.mode{height:26px;padding:0 9px;border:0;border-radius:7px;background:transparent;color:var(--fg2);cursor:pointer;white-space:nowrap}
.mode kbd{font:10px var(--mono);color:var(--fg3);margin-left:4px}
.mode:hover{color:var(--fg);background:#141d2b}
.mode[aria-checked="true"]{background:#173247;color:#e6f7ff;box-shadow:inset 0 0 0 1px #28577a}
/* ---------- workspace ---------- */
.workspace{display:grid;grid-template-columns:50px minmax(0,1fr) 336px;min-height:0}
.toolbar{display:flex;flex-direction:column;gap:3px;padding:8px 6px;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:thin}
.toolbar .tsep{height:1px;background:var(--line);margin:4px 2px;flex:none}
.tool{position:relative;width:38px;height:36px;flex:none;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--fg2);cursor:pointer;display:grid;place-items:center}
.tool svg{width:20px;height:20px}
.tool:hover{background:#131c2a;color:var(--fg)}
.tool[aria-pressed="true"]{background:#14334a;border-color:#23597e;color:#e8f8ff}
.tool .k{position:absolute;right:2px;bottom:1px;font:9px var(--mono);color:var(--fg3)}
.stagecol{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0}
.stage{position:relative;min-height:0;overflow:hidden;background:#05070b}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;outline:none;cursor:crosshair}
#view.select{cursor:default}
#view.grab{cursor:grab}
#view.grabbing{cursor:grabbing}
#view.brush{cursor:none}
.hud{position:absolute;left:10px;top:10px;padding:7px 9px;border-radius:8px;background:rgba(6,10,16,.72);border:1px solid rgba(80,110,150,.25);backdrop-filter:blur(4px);font:11px/1.5 var(--mono);color:#c9d6e8;pointer-events:none;white-space:pre;min-width:190px}
.hud[hidden]{display:none}
.hud b{color:#fff;font-weight:600}
.hud .ok{color:var(--ok)} .hud .warn{color:var(--warn)} .hud .bad{color:var(--bad)} .hud .dim{color:#7f90a8}
.legend{position:absolute;right:10px;bottom:10px;padding:6px 8px 5px;border-radius:8px;background:rgba(6,10,16,.72);border:1px solid rgba(80,110,150,.25);font:10px/1.3 var(--mono);color:#b9c7da;pointer-events:none;min-width:180px}
.legend canvas{display:block;width:180px;height:9px;border-radius:2px;margin:3px 0 2px}
.legend .row{display:flex;justify-content:space-between;gap:8px}
.legend .ttl{color:#e3ecf8;font-weight:600}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:4px 10px;border-radius:12px;background:rgba(6,10,16,.7);border:1px solid rgba(80,110,150,.22);color:#aebdd2;font-size:11.5px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 420px);overflow:hidden;text-overflow:ellipsis}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:min(520px,calc(100% - 24px));padding:10px 12px;border-radius:10px;background:#2a1117;border:1px solid #7a2a38;color:#ffd9de;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px;z-index:5;font-size:12.5px}
.toast.info{background:#0f2233;border-color:#2a5a80;color:#d7eeff}
.toast[hidden]{display:none}
.toast .msg{flex:1}
/* ---------- probe dock ---------- */
.probedock{display:flex;gap:8px;padding:8px;background:var(--bg2);border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;height:176px;align-items:stretch;scrollbar-width:thin}
.probedock .empty{color:var(--fg3);display:flex;align-items:center;gap:10px;padding:0 10px;font-size:12px}
.probedock .empty svg{width:26px;height:26px;opacity:.7}
.pcard{flex:none;width:272px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);padding:6px 8px 6px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.pcard.sel{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset}
.pcard header{display:flex;align-items:center;gap:6px;font-size:12px}
.pcard .dot{width:9px;height:9px;border-radius:50%;background:var(--pc);box-shadow:0 0 6px var(--pc)}
.pcard .pos{color:var(--fg3);font:10.5px var(--mono);margin-left:auto}
.pcard .x{width:20px;height:20px;border:0;border-radius:5px;background:transparent;color:var(--fg3);cursor:pointer;font-size:14px;line-height:1}
.pcard .x:hover{background:#2a1a20;color:#ffb3bd}
.pcard canvas{display:block;width:100%;border-radius:4px;background:#070b12}
.pcard canvas.wf{height:54px}
.pcard canvas.sp{height:30px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 6px;font:10.5px/1.25 var(--mono);color:var(--fg2)}
.pstats b{color:#eef4fb;font-weight:600}
/* ---------- side panel ---------- */
.panel{overflow-y:auto;background:var(--panel);border-left:1px solid var(--line);scrollbar-width:thin}
.sec{border-bottom:1px solid var(--line)}
.sec>summary{list-style:none;cursor:pointer;padding:9px 12px;font-weight:650;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:#aec0d8;display:flex;align-items:center;gap:8px;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid var(--fg3);border-bottom:1.5px solid var(--fg3);transform:rotate(-45deg);transition:transform .15s;margin-right:2px}
.sec[open]>summary::before{transform:rotate(45deg)}
.sec>summary .tag{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--fg3);font-size:11px}
.secbody{padding:2px 12px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:96px minmax(0,1fr) 64px;align-items:center;gap:8px;min-height:24px}
.row.wide{grid-template-columns:96px minmax(0,1fr)}
.row>label,.row>.lbl{color:var(--fg2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row input[type=number]{width:64px;height:24px;border-radius:6px;border:1px solid var(--line2);background:var(--bg2);padding:0 5px;font:11.5px var(--mono);text-align:right}
.row select{height:26px;width:100%}
.row .val{font:11.5px var(--mono);color:var(--fg);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:3px;background:linear-gradient(90deg,#2b6c93 var(--p,50%),#243145 var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:3px;background:#243145}
input[type=range]::-moz-range-progress{height:4px;border-radius:3px;background:#2b6c93}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#d7ecfb;border:2px solid #2b6c93;margin-top:-5px}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#d7ecfb;border:2px solid #2b6c93}
.check{display:flex;align-items:center;gap:8px;color:var(--fg2);font-size:12px;cursor:pointer}
.check input{width:15px;height:15px;accent-color:#3aa7d8;margin:0}
.note{color:var(--fg3);font-size:11.5px;line-height:1.4}
.note b{color:var(--fg2)}
.warnline{color:var(--warn);font-size:11.5px}
.badline{color:var(--bad);font-size:11.5px}
.stab{display:flex;flex-direction:column;gap:4px;padding:7px 8px;border-radius:8px;background:var(--bg2);border:1px solid var(--line)}
.stab .bar{position:relative;height:7px;border-radius:4px;background:#1b2536;overflow:hidden}
.stab .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ok);transition:width .15s}
.stab .bar s{position:absolute;top:-1px;bottom:-1px;width:2px;background:#fff;opacity:.7;left:calc(100% / 1.3)}
.stab .txt{display:flex;justify-content:space-between;flex-wrap:wrap;gap:0 8px;font:11px var(--mono);color:var(--fg2)}
.stab .txt b{color:#fff}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.chipset{display:flex;gap:4px;flex-wrap:wrap}
.chip{height:24px;padding:0 8px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);color:var(--fg2);cursor:pointer;font-size:11.5px}
.chip[aria-pressed="true"]{background:#173247;border-color:#28577a;color:#e6f7ff}
.inshead{display:flex;align-items:center;gap:8px}
.inshead .sw{width:10px;height:10px;border-radius:50%}
.inshead b{font-size:13px}
.inshead .sub{color:var(--fg3);font-size:11.5px}
.inshead .sp{margin-left:auto}
canvas.phasebars{width:100%;height:46px;display:block;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.kbdlist{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px;color:var(--fg2)}
.kbdlist kbd{font:10.5px var(--mono);background:var(--bg2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--fg);justify-self:start}
.swatch{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
/* ---------- responsive ---------- */
@media (max-width:1500px){ .brand small{display:none} .mode kbd{display:none} .mode{padding:0 8px} }
@media (max-width:1360px){ .presetwrap .plabel{display:none} .topbar{gap:8px} .brand{margin-right:0} .presetwrap select{width:184px} .mode{padding:0 7px} .grp{gap:3px} }
@media (max-width:1250px){ .btn .bl{display:none} .btn.lbl{width:32px;padding:0} }
@media (max-width:1180px){ .workspace{grid-template-columns:50px minmax(0,1fr) 300px} .row{grid-template-columns:86px minmax(0,1fr) 60px} .hint{display:none} }
@media (max-width:860px){
  #app{display:block;height:auto;min-height:0}
  .topbar{gap:6px;padding:6px 8px}
  .brand small{display:none}
  .presetwrap{flex:1;min-width:0} .presetwrap select{flex:1;min-width:0}
  .modes{margin-left:0;width:100%;order:10}
  .mode{flex:1 0 auto;padding:0 7px}
  .mode kbd{display:none}
  .workspace{display:flex;flex-direction:column}
  .toolbar{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);padding:5px 6px}
  .toolbar .tsep{width:1px;height:auto;margin:3px 3px}
  .tool .k{display:none}
  .stagecol{display:block}
  .stage{height:auto;aspect-ratio:5/4;width:100%}
  .hud{font-size:8.5px;line-height:1.35;padding:3px 5px;left:5px;top:5px;min-width:0}
  .legend{right:6px;bottom:6px;min-width:0;padding:4px 6px}
  .legend canvas{width:120px}
  .hint{display:none}
  .probedock{height:176px}
  .panel{border-left:0;overflow:visible}
  .row{grid-template-columns:92px minmax(0,1fr) 64px}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" aria-label="Wave Laboratory">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10.5" stroke="#4cc9f0" stroke-opacity=".35"/><path d="M2.5 12c1.6-4 3.2-4 4.8 0s3.2 4 4.7 0 3.2-4 4.8 0 3.1 4 4.7 0" stroke="#4cc9f0" stroke-width="1.8" stroke-linecap="round"/><path d="M5 7.5c1.2-1.4 2.4-1.4 3.6 0M15.4 16.5c1.2 1.4 2.4 1.4 3.6 0" stroke="#f8b24c" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Wave Laboratory <small>FDTD · 2D scalar wave</small></span>
    </div>
    <div class="grp" role="group" aria-label="Simulation transport">
      <button class="btn primary" id="btnPlay" type="button" title="Pause / resume (Space)" aria-label="Pause"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="3.5" y="2.5" width="3" height="11" rx="1"/><rect x="9.5" y="2.5" width="3" height="11" rx="1"/></svg><span>Pause</span></button>
      <button class="btn icon" id="btnStep" type="button" title="Single step: advance exactly one timestep Δt (.)  ·  Shift+. = 10 steps" aria-label="Single step"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M3 2.8v10.4c0 .5.6.8 1 .5l7-5.2a.6.6 0 000-1L4 2.3c-.4-.3-1 0-1 .5z"/><rect x="11.5" y="2.5" width="2" height="11" rx=".8"/></svg></button>
      <button class="btn lbl" id="btnClear" type="button" title="Clear field: zero the wave field and restart the clock; scene is kept (Shift+C)" aria-label="Clear field"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 13h10M5 10l5.5-7 2.5 2-5.5 7H5z"/></svg><span class="bl">Clear field</span></button>
      <button class="btn lbl" id="btnReset" type="button" title="Reset scene: reload the current preset (Shift+R)" aria-label="Reset scene"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 8a5 5 0 105-5H5.5"/><path d="M6.5 1L4.5 3l2 2"/></svg><span class="bl">Reset scene</span></button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn icon" id="btnUndo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M5 3L2 6l3 3"/><path d="M2.5 6H10a4 4 0 010 8H7"/></svg></button>
      <button class="btn icon" id="btnRedo" type="button" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M11 3l3 3-3 3"/><path d="M13.5 6H6a4 4 0 000 8h3"/></svg></button>
    </div>
    <label class="presetwrap" for="presetSel"><span class="plabel">Preset</span> <select id="presetSel" aria-label="Scene preset"></select></label>
    <div class="modes" id="modes" role="radiogroup" aria-label="Visualization mode"></div>
  </header>
  <div class="workspace">
    <nav class="toolbar" id="toolbar" role="toolbar" aria-label="Editing tools"></nav>
    <main class="stagecol">
      <div class="stage" id="stage">
        <canvas id="view" tabindex="0" aria-label="Wave field simulation canvas. Use the selected tool with mouse, pen or touch. Arrow keys nudge the selection."></canvas>
        <div class="hud" id="hud" aria-live="off"></div>
        <div class="legend" id="legend"><div class="row"><span class="ttl" id="legTitle">Amplitude</span><span id="legNote"></span></div><canvas id="legBar" width="360" height="18"></canvas><div class="row"><span id="legMin">−</span><span id="legMid">0</span><span id="legMax">+</span></div></div>
        <div class="hint" id="hint"></div>
        <div class="toast" id="toast" role="alert" hidden><span class="msg" id="toastMsg"></span><span class="btnrow" id="toastBtns"></span></div>
      </div>
      <section class="probedock" id="probeDock" aria-label="Probe readouts"></section>
    </main>
    <aside class="panel" id="panel" aria-label="Controls">
      <details class="sec" open id="secTool"><summary>Tool <span class="tag" id="toolTag"></span></summary><div class="secbody" id="toolBody"></div></details>
      <details class="sec" open id="secSel"><summary>Inspector <span class="tag" id="selTag">nothing selected</span></summary><div class="secbody" id="selBody"></div></details>
      <details class="sec" open id="secSim"><summary>Simulation</summary><div class="secbody" id="simBody"></div></details>
      <details class="sec" open id="secDisp"><summary>Display</summary><div class="secbody" id="dispBody"></div></details>
      <details class="sec" id="secHelp"><summary>Shortcuts &amp; notes</summary><div class="secbody" id="helpBody"></div></details>
    </aside>
  </div>
</div>
<script>
(() => {
'use strict';
/* =====================================================================
   Wave Laboratory — single-file 2D scalar wave FDTD laboratory
   Solver: second-order leapfrog finite differences for
       u_tt = c(x)^2 ∇²u − σ(x) u_t   (+ source forcing)
   on a uniform grid (5-point Laplacian), with an absorbing sponge layer,
   Dirichlet walls, Neumann/periodic ghost boundaries.
   Stability (CFL): c_max Δt √2 / Δx ≤ 1.
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const SQRT2 = Math.SQRT2;
let nextId = 1;
const newId = () => nextId++;
const fx = (x, d = 2) => (Number.isFinite(x) ? x.toFixed(d) : '—');

const RES_OPTIONS = [
  { name: 'Coarse', ny: 180 }, { name: 'Medium', ny: 260 }, { name: 'Fine', ny: 340 }, { name: 'Ultra', ny: 440 },
];
const ASPECT_MIN = 1.25, ASPECT_MAX = 2.0;
const Q_POINT = 12;          // point-source strength normalisation (|u| ≈ amp at one wavelength)
const PROBE_BUF = 4096;
const PROBE_COLORS = ['#fbbf24', '#34d399', '#f472b6', '#60a5fa', '#c084fc', '#fb923c', '#a3e635', '#22d3ee'];

/* ------------------------------ global settings ------------------------------ */
const settings = {
  resIndex: 2,
  dt: 1.3e-3,            // requested timestep [s]
  enforceCFL: true,      // clamp Δt to the CFL limit
  c0: 1.0,               // reference wave speed [m/s] (speed in medium = c0/n)
  damping: 0.0,          // global damping γ [1/s]
  boundary: 'absorb',    // absorb | hard | soft | periodic
  substeps: 5,
  mode: 'amp',           // amp | int | phase | grad | medium | flow
  cmap: 'auto',
  curve: 'lin',          // lin | sqrt | log
  exposure: 0,           // EV
  autoExposure: true,
  persistence: 0,
  showOverlays: true,
  showArrows: true,
  showHud: true,
  // tool options
  brushR: 0.02,
  toolMat: 'wall',
  toolN: 1.6,
  toolSigma: 60,
  slitCount: 2, slitWidth: 0.035, slitSep: 0.2,
  lensN: 1.7,
};

/* ------------------------------ scene model ------------------------------
   Positions (u,v) are normalised to the domain (u across the width, v down the
   height, H = 1 m). Sizes are absolute metres, so shapes stay rigid on resize. */
let scene = { objects: [], sources: [], probes: [] };
let currentPreset = 'two';

const srcTemplate = { freq: 18, amp: 1, phase: 0, wave: 'sine', emit: 'cw', pulseDur: 0.07, repeat: 1.5 };

/* ------------------------------ simulation state ------------------------------ */
const off = document.createElement('canvas');
const offCtx = off.getContext('2d');
const sim = {

document.addEventListener('keydown', (e) => {
  const t = e.target, tag = t && t.tagName;
  const textual = (tag === 'INPUT' && !['range', 'checkbox', 'button', 'radio'].includes(t.type)) || tag === 'SELECT' || tag === 'TEXTAREA';
  if (e.key === 'Escape') { if (ui.drag) cancelDrag(); else if (ui.sel) select(null); else setTool('select'); if (!toastEl.hidden) hideToast(); return; }
  if (textual) return;
  const k = e.key;
  if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if ((e.ctrlKey || e.metaKey) && (k === 'y' || k === 'Y')) { e.preventDefault(); redo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (tag === 'INPUT' && t.type === 'range' && k.startsWith('Arrow')) return;
  if (k === ' ') { e.preventDefault(); togglePause(); return; }
  if (k === '.' || k === '>') { e.preventDefault(); requestStep(e.shiftKey ? 10 : 1); return; }
  if (k === 'C' && e.shiftKey) { e.preventDefault(); doClear(); return; }
  if (k === 'R' && e.shiftKey) { e.preventDefault(); doReset(); return; }
  if (k === 'Delete' || k === 'Backspace') { if (ui.sel) { e.preventDefault(); pushUndo(); removeSelection(ui.sel); } return; }
  if (k === '[' || k === ']') { settings.brushR = clamp(settings.brushR * (k === ']' ? 1.2 : 1 / 1.2), 0.003, 0.12); buildToolPanel(); return; }
  if (k >= '1' && k <= '6') { setMode(MODES[+k - 1]); return; }
  if (k.startsWith('Arrow') && ui.sel) {
    const o = selObj(); if (!o) return;
    e.preventDefault();
    const st = (e.shiftKey ? 10 : 1) * sim.dx;
    touchUndo('nudge' + ui.sel.id);
    if (k === 'ArrowLeft') o.u = clamp(o.u - st / sim.W, 0, 1);
    if (k === 'ArrowRight') o.u = clamp(o.u + st / sim.W, 0, 1);
    if (k === 'ArrowUp') o.v = clamp(o.v - st, 0, 1);
    if (k === 'ArrowDown') o.v = clamp(o.v + st, 0, 1);
    markDirtyFor(ui.sel.type); inspRefresh(); return;
  }

});

      // this is a fast (f/0.65) spherical lens with strong spherical aberration: marginal rays focus well before
      // paraxial ones, so the probe goes midway between the paraxial and least-RMS ray foci (see lensRayFoci)
      const rf = lensRayFoci(D, sag, t0, n), f = 0.5 * (rf.paraxial + rf.rms);
      return { sources: [src], objects: [lens], probes: [makeProbe(xl + f, 0.5, PROBE_COLORS[0]), makeProbe(xl + f, 0.5 + 0.12, PROBE_COLORS[1])], settings: { mode: 'int' }, warmup: 1.7 };
    },
  },
  {
    id: 'refraction', name: 'Refraction at an interface', build(W) {
      const yI = 0.55, n = 1.5, inc = 40 * DEG, ys = 0.2;
      const xHit = 0.5 * W, xs = xHit - (yI - ys) * Math.tan(inc);
      const slab = makeObj('rect', W / 2, yI + 0.4, { hw: W, hh: 0.4, mat: 'medium', n });
      const src = makeSource('line', xs, ys, { len: 0.34, angle: Math.PI - inc, freq: 18 });
      const tr = Math.asin(Math.sin(inc) / n);
      const p1 = makeProbe(xHit - 0.14 * Math.tan(inc), yI - 0.14, PROBE_COLORS[0]);
      const p2 = makeProbe(xHit + 0.22 * Math.sin(tr), yI + 0.22 * Math.cos(tr), PROBE_COLORS[1]);
      return { sources: [src], objects: [slab], probes: [p1, p2], settings: { mode: 'amp' }, warmup: 1.4 };
    },
  },
  {
    id: 'array', name: 'Phased-array beam steering', build(W) {
      const x0 = 0.08 * W, L = 0.5, N = 24, f = 18, th = 25 * DEG;
      const d = L / (N - 1), k = (TAU * f) / 1;
      const src = makeSource('array', x0, 0.5, { len: L, count: N, angle: Math.PI / 2, freq: f, dphi: (-k * d * Math.sin(th)) / DEG });
      const r = 0.6;
      return {
        sources: [src], probes: [makeProbe(x0 + r * Math.cos(th), 0.5 + r * Math.sin(th), PROBE_COLORS[0]), makeProbe(x0 + r * Math.cos(th), 0.5 - r * Math.sin(th), PROBE_COLORS[1])],
        settings: { mode: 'amp' }, warmup: 1.2, select: { type: 'source', id: src.id },
      };
    },
  },
  {
    id: 'pulse', name: 'Pulse through an obstacle field', build(W) {
      let seed = 7;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
      const objs = [], circles = [{ x: 0.58 * W, y: 0.5, r: 0.07, skip: true }];
      let tries = 0;
      while (circles.length < 16 && tries++ < 3000) {
        const r = 0.025 + 0.035 * rnd(), x = (0.3 + 0.52 * rnd()) * W, y = 0.1 + 0.8 * rnd();
        if (circles.some((c) => Math.hypot(c.x - x, c.y - y) < c.r + r + 0.05)) continue;
        if (Math.abs(y - 0.5) < 0.06 && x < 0.42 * W) continue;
        circles.push({ x, y, r });
      }
      for (const c of circles) if (!c.skip) objs.push(makeObj('circle', c.x, c.y, { r: c.r, mat: 'wall' }));
      objs.push(makeObj('rect', 0.9 * W, 0.2, { hw: 0.012, hh: 0.12, angle: 0.5, mat: 'wall' }));
      objs.push(makeObj('rect', 0.9 * W, 0.8, { hw: 0.012, hh: 0.12, angle: -0.5, mat: 'wall' }));
      objs.push(makeObj('rect', 0.58 * W, 0.5, { hw: 0.03, hh: 0.07, mat: 'absorber', sigma: 90 }));
      const src = makeSource('point', 0.07 * W, 0.5, { emit: 'train', pulseDur: 0.085, repeat: 3.0, freq: 18, amp: 1.5 });
      return { sources: [src], objects: objs, probes: [makeProbe(0.2 * W, 0.5, PROBE_COLORS[0]), makeProbe(0.95 * W, 0.5, PROBE_COLORS[1])], settings: { mode: 'amp' }, warmup: 0 };
    },
  },
  { id: 'blank', name: 'Empty tank (blank)', build() { return { settings: { mode: 'amp' }, warmup: 0 }; } },
];
/* exact 2-D ray trace of a symmetric biconvex lens (centred at x = 0, axis along x):
   returns the paraxial axis crossing and the plane of minimum RMS ray spread */
function lensRayFoci(D, sag, t0, n) {
  const a = D / 2, R = (a * a + sag * sag) / (2 * sag), c = t0 / 2 + sag - R, rays = [];
  const refr = (dx, dy, nx, ny, n1, n2) => {
    let ci = -(dx * nx + dy * ny); if (ci < 0) { nx = -nx; ny = -ny; ci = -ci; }
    const r = n1 / n2, k = 1 - r * r * (1 - ci * ci); if (k < 0) return null;
    const ct = Math.sqrt(k); return [r * dx + (r * ci - ct) * nx, r * dy + (r * ci - ct) * ny];
  };
  for (let q = 0; q < 160; q++) {
    const hgt = -a + (2 * a * (q + 0.5)) / 160; let x = -c - Math.sqrt(R * R - hgt * hgt), y = hgt;
    let d = refr(1, 0, (x + c) / R, y / R, 1, n); if (!d) continue;
    const px = x - c, b = px * d[0] + y * d[1], cc = px * px + y * y - R * R, st = -b + Math.sqrt(b * b - cc);
    x += st * d[0]; y += st * d[1]; d = refr(d[0], d[1], (x - c) / R, y / R, n, 1); if (!d) continue;
    rays.push([x, y, d[0], d[1], Math.abs(hgt)]);
  }
  const p = rays.reduce((m, r) => (r[4] < m[4] ? r : m));
  const paraxial = p[0] - (p[1] * p[2]) / p[3];
  let best = Infinity, rms = paraxial;
  for (let z = 0.05; z < 1.5; z += 0.002) { let ss = 0; for (const r of rays) { const yy = r[1] + ((z - r[0]) * r[3]) / r[2]; ss += yy * yy; } if (ss < best) { best = ss; rms = z; } }
  return { paraxial, rms };
}
/* tune the drive to the discrete (m,n) cavity mode of the rasterised box (accounts for staircase walls and grid dispersion) */
function tuneCavity(src, m, n) {
  const { NX, P, dx, wall } = sim;
  const gx = Math.round((src.u * sim.W) / dx + P - 0.5), gy = Math.round(src.v / dx + P - 0.5);
  let l = gx, r = gx, t = gy, b = gy;
  while (l > 0 && !wall[gy * NX + l]) l--;
  while (r < NX - 1 && !wall[gy * NX + r]) r++;
  while (t > 0 && !wall[t * NX + gx]) t--;
  while (b < sim.NY - 1 && !wall[b * NX + gx]) b++;
  const Lx = (r - l) * dx, Ly = (b - t) * dx;
  const kx = (m * Math.PI) / Lx, ky = (n * Math.PI) / Ly, C = (settings.c0 * sim.dt) / dx;
  const s = C * Math.sqrt(Math.sin((kx * dx) / 2) ** 2 + Math.sin((ky * dx) / 2) ** 2);
  src.freq = (2 / sim.dt) * Math.asin(Math.min(1, s)) / TAU;
  sim.tapsDirty = true;
}
const presetSel = $('#presetSel');
for (const p of PRESETS) presetSel.append(h('option', { value: p.id }, p.name));
presetSel.addEventListener('change', () => { pushUndo(); loadPreset(presetSel.value); presetSel.blur(); });
function loadPreset(id) {
  const pr = PRESETS.find((p) => p.id === id) || PRESETS[0];
  currentPreset = pr.id; presetSel.value = pr.id;
  const out = pr.build(sim.W);
  scene = { objects: out.objects || [], sources: out.sources || [], probes: out.probes || [] };
  srcRT.clear(); probeRT.clear();
  Object.assign(settings, { c0: 1, damping: 0, boundary: 'absorb', mode: 'amp', curve: 'lin', persistence: 0, exposure: 0, autoExposure: true }, out.settings || {});
  ui.sel = null;
  sim.mediumDirty = sim.coefDirty = sim.tapsDirty = true;
  processDirty();
  if (out.post) { out.post(); processDirty(); }
  clearField();
  if (sim.blown) sim.blown = false;
  hideToast();
  ui.ff = out.warmup > 0; ui.ffUntil = out.warmup || 0;
  refreshAllPanels();
  if (out.select) select(out.select);
  probeCardsKey = '';
}

/* =====================================================================
   Main loop, resize handling, boot
   ===================================================================== */
function processDirty() {
  if (sim.mediumDirty) rebuildMedium();
  if (sim.coefDirty) rebuildCoefficients();
  if (sim.tapsDirty) rebuildTaps();
}
let needLayout = true, reallocTimer = 0, lastFrame = performance.now(), lastStab = 0;
const perf = { sim: 0, draw: 0 };
const stageEl = $('#stage');
new ResizeObserver(() => { needLayout = true; }).observe(stageEl);
window.addEventListener('resize', () => { needLayout = true; });
function handleLayout() {
  if (!needLayout) return;
  needLayout = false;
  const cssAspect = layoutView();
  const target = clamp(cssAspect, ASPECT_MIN, ASPECT_MAX);
  if (Math.abs(target - sim.W) > 0.015) {
    clearTimeout(reallocTimer);
    reallocTimer = setTimeout(() => { allocGrid(RES_OPTIONS[settings.resIndex].ny, target); layoutView(); buildToolPanel(); buildInspector(); }, 160);
  }
}
function frame(now) {
  const dtR = now - lastFrame; lastFrame = now;
  if (dtR > 0 && dtR < 1000) fps += (1000 / dtR - fps) * 0.06;
  frameNo++;
  handleLayout();
  const tA = performance.now();
  processDirty();
  if (!sim.blown) {
    if (!ui.paused) {
      if (ui.ff && sim.t < ui.ffUntil) {
        const t0 = performance.now();
        let n = 0;
        while (sim.t < ui.ffUntil) { stepOnce(); n++; if ((n & 3) === 0 && performance.now() - t0 > 22) break; }
      } else {
        ui.ff = false;
        for (let k = 0; k < settings.substeps; k++) stepOnce();
      }
    }
  }
  const tB = performance.now();
  updateExposure();
  checkBlowup();
  renderField();
  drawFrame();
  const tC = performance.now();
  perf.sim += (tB - tA - perf.sim) * 0.1; perf.draw += (tC - tB - perf.draw) * 0.1;
  updateHUD(now);
  updateLegend();
  updateProbeUI(now);
  if (now - lastStab > 150) { lastStab = now; updateStabilityBox(); }
  requestAnimationFrame(frame);
}
/* diagnostics hook (read-only use in tests / console) */
window.waveLab = {
  get sim() { return sim; }, get scene() { return scene; }, settings, ui,
  probeStats: (i) => analyzeProbe(scene.probes[i]), sampleField, fieldAt: (x, y) => sampleField(x, y),
  presets: PRESETS.map((p) => p.id), loadPreset, processDirty, view, perf,
  /* world (m) -> CSS client coordinates of the canvas, for automated pointer tests */
  toClient: (x, y) => { const r = canvas.getBoundingClientRect(); return { x: r.left + (view.x + x * view.s) / view.dpr, y: r.top + (view.y + y * view.s) / view.dpr }; },
};

function boot() {
  buildToolbar(); buildModes(); buildSimPanel(); buildDispPanel(); buildHelp();
  const aspect = clamp(layoutView(), ASPECT_MIN, ASPECT_MAX);
  allocGrid(RES_OPTIONS[settings.resIndex].ny, aspect);
  layoutView();
  setTool('select');
  loadPreset('two');
  updatePlayBtn(); updateUndoBtns();
  needLayout = false;
  requestAnimationFrame(frame);
}
boot();
})();
</script>
