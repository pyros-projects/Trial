<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>Vector &amp; Layout Studio</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #111216;
  --panel: #191b20;
  --panel-2: #20232a;
  --panel-3: #282c34;
  --line: #2e323b;
  --line-2: #3a3f4a;
  --text: #ecebe7;
  --muted: #9ba1ac;
  --faint: #6c7280;
  --accent: #ff6a3d;
  --accent-ink: #1a0d08;
  --sel: #4ea1ff;
  --lock: #f5b83d;
  --danger: #ff5f5f;
  --ok: #53d18a;
  --guide: #ff3fa4;
  --paste: #24272d;
  --radius: 7px;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.35 var(--ui); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
#stage:focus { outline: none; }
#stage:focus-visible { outline: 2px solid rgba(78,161,255,.55); outline-offset: -2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app {
  height: 100vh; height: 100dvh; display: grid;
  grid-template-columns: 52px minmax(0, 1fr) 320px;
  grid-template-rows: 48px minmax(0, 1fr) 28px;
  grid-template-areas: "top top top" "tools work panel" "status status status";
}

/* ---------- top bar ---------- */
#topbar { grid-area: top; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: .01em; white-space: nowrap; flex: none; }
.brand svg { flex: none; }
.brand small { color: var(--muted); font-weight: 500; }
.menu { display: flex; align-items: center; gap: 4px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: thin; padding: 4px 0; }
.menu .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; flex: none; }
.btn { height: 28px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--panel-2); white-space: nowrap; flex: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--panel-3); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: #6b2b2b; color: #ffb4a8; }
.btn.danger:hover { background: #3a1d1d; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel-3); }
.btn.icon { width: 28px; padding: 0; justify-content: center; }
.btn svg { width: 15px; height: 15px; flex: none; }
select.btn { padding-right: 4px; }
.group-label { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 0 2px 0 6px; flex: none; }

/* ---------- tool rail ---------- */
#tools { grid-area: tools; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; }
.tool { width: 38px; height: 38px; border-radius: 8px; border: 1px solid transparent; background: transparent; display: grid; place-items: center; position: relative; flex: none; }
.tool svg { width: 19px; height: 19px; }
.tool:hover { background: var(--panel-3); }
.tool[aria-pressed="true"] { background: var(--sel); color: #06121f; }
.tool kbd { position: absolute; right: 2px; bottom: 1px; font: 600 8px/1 var(--mono); color: inherit; opacity: .6; }
.tool-sep { width: 26px; height: 1px; background: var(--line); margin: 4px 0; flex: none; }

/* ---------- workspace ---------- */
#workspace { grid-area: work; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: var(--paste); }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
#stage.tool-select { cursor: default; }
#stage.tool-hand, #stage.panning { cursor: grab; }
#stage.panning.dragging { cursor: grabbing; }
#stage.tool-rect, #stage.tool-ellipse, #stage.tool-line, #stage.tool-path, #stage.tool-text { cursor: crosshair; }
#stage text { white-space: pre; }
#canvasbar { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; pointer-events: none; z-index: 2; }
#canvasbar > * { pointer-events: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 14px; background: rgba(25,27,32,.92); border: 1px solid var(--line-2); backdrop-filter: blur(6px); white-space: nowrap; }
.chip input[type=checkbox] { accent-color: var(--sel); margin: 0; }
.chip input.num { width: 42px; }
.chip .btn { height: 22px; border-radius: 11px; padding: 0 7px; background: transparent; border-color: transparent; }
.chip .btn:hover { background: var(--panel-3); }
.chip output { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
#hint { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 6px 12px; border-radius: 16px; background: rgba(17,18,22,.9); border: 1px solid var(--line-2); color: var(--muted); font-size: 12px; pointer-events: none; text-align: center; z-index: 2; }
#hint b { color: var(--text); font-weight: 600; }
#hint .pbtn { pointer-events: auto; margin-left: 8px; }

/* ---------- panel ---------- */
#panel { grid-area: panel; display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.tabs { display: none; }
#inspector { flex: 1 1 58%; overflow: auto; min-height: 0; padding: 0 0 12px; }
#layersPanel { flex: 1 1 42%; min-height: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.sec { padding: 10px 12px 4px; border-bottom: 1px solid var(--line); }
.sec:last-child { border-bottom: 0; }
.sec h3 { margin: 0 0 8px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sec h3 .tag { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--faint); margin-left: auto; }
.row { display: flex; gap: 6px; align-items: center; margin-bottom: 7px; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 7px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 7px; }
.fld { display: flex; align-items: center; min-width: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; height: 28px; }
.fld:focus-within { border-color: var(--sel); }
.fld > label, .fld > .lab { flex: none; padding: 0 6px 0 8px; color: var(--faint); font-size: 11px; font-weight: 600; min-width: 22px; user-select: none; }
.fld > label.scrub { cursor: ew-resize; }
.fld > label.scrub:hover { color: var(--sel); }
.fld input { flex: 1; min-width: 0; width: 100%; height: 100%; border: 0; background: transparent; padding: 0 6px 0 0; outline: none; font-variant-numeric: tabular-nums; }
.fld input[readonly] { color: var(--muted); }
.fld .unit { color: var(--faint); padding-right: 7px; font-size: 11px; }
.fld.invalid, .fld:has(input[aria-invalid="true"]) { border-color: var(--danger); background: #2c1a1c; }
.fld.wide { flex: 1; }
.full { width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { height: 26px; min-width: 30px; padding: 0 8px; border: 0; background: var(--panel-2); border-right: 1px solid var(--line); display: grid; place-items: center; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--panel-3); }
.seg button[aria-pressed="true"] { background: var(--sel); color: #06121f; }
.seg button:disabled { opacity: .35; cursor: default; }
.seg svg { width: 15px; height: 15px; }
.paint { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
.paint input[type=color] { width: 30px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: var(--panel-2); flex: none; }
.paint .fld { flex: 1; }
.check { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); white-space: nowrap; }
.check input { accent-color: var(--sel); margin: 0; }
textarea.textedit { width: 100%; min-height: 84px; resize: vertical; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; font: 13px/1.4 var(--mono); outline: none; }
textarea.textedit:focus { border-color: var(--sel); }
textarea.textedit[aria-invalid="true"] { border-color: var(--danger); }
select.sel { height: 28px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; min-width: 0; }
input[type=range] { accent-color: var(--sel); flex: 1; min-width: 60px; }
.note { color: var(--faint); font-size: 11.5px; margin: 0 0 8px; }
.note.err { color: #ffaaa0; }
.selhead { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.selhead .title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.badge { font-size: 10.5px; font-weight: 650; padding: 2px 6px; border-radius: 9px; background: var(--panel-3); color: var(--muted); white-space: nowrap; }
.badge.lock { background: #3a2c0e; color: var(--lock); }
.badge.hid { background: #2a2d35; color: var(--muted); }
.ptnav { display: flex; align-items: center; gap: 6px; margin-bottom: 7px; }
.ptnav output { flex: 1; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
.subhead { color: var(--faint); font-size: 11px; margin: 2px 0 5px; }

/* ---------- layers ---------- */
.lhead { display: flex; align-items: center; gap: 4px; padding: 8px 10px 8px 12px; border-bottom: 1px solid var(--line); }
.lhead h3 { margin: 0; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); flex: 1; }
#layers { overflow: auto; flex: 1; padding: 4px 0 10px; }
.lrow { display: flex; align-items: center; height: 28px; padding-right: 4px; gap: 2px; cursor: default; border-left: 2px solid transparent; }
.lrow:hover { background: var(--panel-2); }
.lrow[aria-selected="true"] { background: #1d3350; border-left-color: var(--sel); }
.lrow.hidden-eff .lname, .lrow.hidden-eff .ltype { opacity: .42; }
.lrow.locked-eff .lname { color: #e9d7ae; }
.lrow button { width: 24px; height: 24px; border: 0; background: transparent; border-radius: 5px; display: grid; place-items: center; color: var(--faint); flex: none; padding: 0; }
.lrow button:hover { background: var(--panel-3); color: var(--text); }
.lrow button.on { color: var(--text); }
.lrow button.lk.on { color: var(--lock); }
.lrow button svg { width: 14px; height: 14px; }
.lrow .twist.none { visibility: hidden; }
.ltype { width: 18px; display: grid; place-items: center; color: var(--muted); flex: none; }
.ltype svg { width: 13px; height: 13px; }
.lname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 4px; }
.lname input { width: 100%; height: 22px; background: var(--bg); border: 1px solid var(--sel); border-radius: 4px; padding: 0 4px; outline: none; }
.lempty { color: var(--faint); padding: 10px 12px; }

/* ---------- status ---------- */
#status { grid-area: status; display: flex; align-items: center; gap: 14px; padding: 0 12px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
#status b { color: var(--text); font-weight: 600; }
#status .io { margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
#status .io.err { color: #ffaaa0; }

/* ---------- toasts / modal / preview ---------- */
#toasts { position: fixed; right: 14px; bottom: 40px; display: flex; flex-direction: column; gap: 8px; z-index: 50; pointer-events: none; max-width: min(420px, calc(100vw - 28px)); }
.toast { padding: 9px 12px; border-radius: 8px; background: #23262d; border: 1px solid var(--line-2); box-shadow: 0 8px 24px rgba(0,0,0,.4); font-size: 12.5px; animation: tin .16s ease-out; }
.toast.error { border-color: #7a3030; background: #2d1c1d; color: #ffd2cc; }
.toast.warn { border-color: #6d5520; background: #2b2415; color: #ffe2a8; }
.toast.ok { border-color: #245a3c; background: #172a20; color: #c9f4db; }
@keyframes tin { from { transform: translateY(6px); opacity: 0; } }
.overlay { position: fixed; inset: 0; background: rgba(8,9,12,.72); display: grid; place-items: center; z-index: 40; padding: 16px; }
.overlay[hidden] { display: none; }
.dialog { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.5); max-height: calc(100vh - 32px); overflow: auto; }
.dialog h2 { margin: 0 0 8px; font-size: 16px; }
.dialog p { color: var(--muted); margin: 0 0 14px; }
.dialog .actions { display: flex; gap: 8px; justify-content: flex-end; }
.dialog table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-bottom: 12px; }
.dialog td { padding: 4px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
.dialog td:first-child { color: var(--text); }
.dialog kbd { font: 600 11px var(--mono); background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 5px; color: var(--text); }
#preview .pv { display: flex; flex-direction: column; gap: 10px; align-items: center; max-width: 100%; max-height: 100%; }
#preview .pvbar { display: flex; gap: 10px; align-items: center; color: var(--muted); }
#preview .pvimg { max-width: min(92vw, 1400px); max-height: calc(100vh - 110px); box-shadow: 0 12px 50px rgba(0,0,0,.6); background-color: #fff; }
#preview .pvimg.transparent { background: repeating-conic-gradient(#d9d9d9 0 25%, #ffffff 0 50%) 0 0 / 16px 16px; }

/* ---------- narrow ---------- */
@media (max-width: 820px) {
  #app {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) minmax(0, 40%) 24px;
    grid-template-areas: "top" "tools" "work" "panel" "status";
  }
  #topbar { flex-wrap: wrap; padding: 6px 8px 4px; gap: 4px; }
  .brand { font-size: 12.5px; }
  .brand small { display: none; }
  .menu { flex-basis: 100%; }
  #tools { flex-direction: row; padding: 4px 6px; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tool { width: 40px; height: 36px; }
  .tool-sep { width: 1px; height: 22px; margin: 0 4px; }
  #panel { border-left: 0; border-top: 1px solid var(--line); }
  .tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
  .tabs button { flex: 1; height: 34px; border: 0; background: transparent; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 600; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--sel); }
  #panel[data-tab="inspect"] #layersPanel { display: none; }
  #panel[data-tab="layers"] #inspector { display: none; }
  #layersPanel { border-top: 0; flex: 1 1 100%; }
  #inspector { flex: 1 1 100%; }
  #status { gap: 10px; font-size: 10.5px; padding: 0 8px; }
  #status .opt { display: none; }
  #canvasbar { left: 6px; right: 6px; top: 6px; gap: 4px; }
  .chip { height: 26px; padding: 0 7px; font-size: 12px; }
  #hint { font-size: 11px; bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 16px); }
  .lrow { height: 34px; }
  .lrow button { width: 30px; height: 30px; }
}
@media (pointer: coarse) {
  .btn { height: 32px; }
  .fld { height: 32px; }
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="5" fill="#ff6a3d"/><path d="M5 16 C 7 6, 12 6, 17 6" fill="none" stroke="#1a0d08" stroke-width="2" stroke-linecap="round"/><rect x="3.5" y="14.5" width="3" height="3" fill="#fff" stroke="#1a0d08"/><rect x="15.5" y="4.5" width="3" height="3" fill="#fff" stroke="#1a0d08"/></svg>
      <span>Vector &amp; Layout Studio</span> <small>v1</small>
    </div>
    <div class="menu" role="toolbar" aria-label="Document and file commands">
      <button class="btn" id="btnNew" title="New blank 1200×800 document — replaces the document and clears undo history">New</button>
      <label class="sr" for="compSelect">Composition</label>
      <select class="btn" id="compSelect" title="Example compositions">
        <option value="solstice">Solstice poster</option>
        <option value="bauhaus">Form Follows Function</option>
      </select>
      <button class="btn" id="btnLoadComp" title="Load the chosen composition — replaces the document and clears undo history">Load</button>
      <button class="btn" id="btnImport" title="Import a Vector &amp; Layout Studio project (.json) — replaces the document and clears undo history">Import…</button>
      <input type="file" id="fileImport" accept=".json,application/json" hidden aria-label="Import project file">
      <span class="sep"></span>
      <span class="group-label">Export</span>
      <button class="btn" id="btnExportJSON" title="Download project JSON">Project JSON</button>
      <button class="btn" id="btnExportSVG" title="Download artboard as SVG">SVG</button>
      <label class="sr" for="pngScale">PNG scale</label>
      <select class="btn" id="pngScale" title="PNG resolution">
        <option value="1">PNG 1x</option>
        <option value="2">PNG 2x</option>
        <option value="4">PNG 4x</option>
      </select>
      <button class="btn" id="btnExportPNG" title="Download artboard as PNG">PNG</button>
      <button class="btn" id="btnPreview" title="Preview the artboard without editor UI (P)">Preview</button>
      <span class="sep"></span>
      <button class="btn icon" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 16 16"><path d="M5 3 2 6l3 3M2.5 6H10a4 4 0 0 1 0 8H7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn icon" id="btnRedo" title="Redo (Ctrl+Shift+Z / Ctrl+Y)" aria-label="Redo"><svg viewBox="0 0 16 16"><path d="m11 3 3 3-3 3M13.5 6H6a4 4 0 0 0 0 8h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn icon" id="btnHelp" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
      <button class="btn danger" id="btnReset" title="Reset session: restore the initial composition and clear selection, history and imports (not undoable)">Reset</button>
    </div>
  </header>

  <nav id="tools" role="toolbar" aria-label="Tools"></nav>

  <main id="workspace">
    <svg id="stage" role="application" aria-label="Canvas: artboard editing surface" tabindex="0">
      <defs>
        <pattern id="checker" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#ffffff"/><rect width="8" height="8" fill="#d6d6d6"/><rect x="8" y="8" width="8" height="8" fill="#d6d6d6"/></pattern>
        <filter id="abShadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
      </defs>
      <g id="world">
        <rect id="abShadowRect" filter="url(#abShadow)" fill="#000"/>
        <rect id="abBg"/>
        <g id="gridLayer" pointer-events="none"></g>
        <g id="scene"></g>
        <rect id="abFrame" fill="none" pointer-events="none"/>
      </g>
      <g id="overlay"></g>
    </svg>
    <div id="canvasbar">
      <label class="chip" title="Snap moving objects to grid lines"><input type="checkbox" id="snapGrid"> Grid snap</label>
      <label class="chip" title="Snap to artboard and visible object edges/centers"><input type="checkbox" id="snapObj" checked> Object snap</label>
      <label class="chip" title="Show grid"><input type="checkbox" id="showGrid"> Grid</label>
      <label class="chip" title="Multi-select: clicks add/remove items like Shift-click (useful on touch)"><input type="checkbox" id="addMode"> Multi-select</label>
      <span class="chip"><label for="gridSize">Size</label><input class="num" id="gridSize" value="10" inputmode="decimal" aria-label="Grid size in document units" style="background:transparent;border:0;outline:none;padding:0"></span>
      <span class="spacer"></span>
      <span class="chip" role="group" aria-label="Zoom">
        <button class="btn" id="zoomOut" title="Zoom out (-)" aria-label="Zoom out">−</button>
        <output id="zoomLabel" aria-live="polite">100%</output>
        <button class="btn" id="zoomIn" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button class="btn" id="zoom100" title="Actual size (1)">1:1</button>
        <button class="btn" id="zoomFit" title="Fit artboard (0)">Fit</button>
      </span>
    </div>
    <div id="hint" role="note"></div>
  </main>

  <aside id="panel" data-tab="inspect" aria-label="Properties and layers">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabInspect" aria-selected="true" aria-controls="inspector">Inspect</button>
      <button role="tab" id="tabLayers" aria-selected="false" aria-controls="layersPanel">Layers</button>
    </div>
    <section id="inspector" aria-label="Inspector"></section>
    <section id="layersPanel" aria-label="Layers">
      <div class="lhead">
        <h3>Layers <span style="font-weight:500;letter-spacing:0;text-transform:none;color:var(--faint)">· front to back</span></h3>
        <button class="btn icon ghost" id="lyFront" title="Bring to front (Ctrl+Shift+])" aria-label="Bring to front"><svg viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4M3 1.5h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        <button class="btn icon ghost" id="lyUp" title="Bring forward (])" aria-label="Bring forward"><svg viewBox="0 0 16 16"><path d="M8 13V4M4 8l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        <button class="btn icon ghost" id="lyDown" title="Send backward ([)" aria-label="Send backward"><svg viewBox="0 0 16 16"><path d="M8 3v9M4 8l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
        <button class="btn icon ghost" id="lyBack" title="Send to back (Ctrl+Shift+[)" aria-label="Send to back"><svg viewBox="0 0 16 16"><path d="M8 3v10M4 9l4 4 4-4M3 14.5h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
      </div>
      <div id="layers" role="tree" aria-label="Layer hierarchy, front to back"></div>
    </section>
  </aside>

  <footer id="status" aria-label="Diagnostics"></footer>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="modal" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="dialog"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions" id="modalActions"></div></div>

    <div class="pvbar"><span id="previewInfo"></span><button class="btn" id="previewClose">Close (Esc)</button></div>
  </div>
</div>
