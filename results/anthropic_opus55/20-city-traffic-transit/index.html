<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metroflow · City Traffic &amp; Transit Simulator</title>
<meta name="description" content="Self-contained city traffic and public transit simulator: draw roads, signals, zones, bus routes and watch individual agents route, queue and ride.">
<style>
:root{
  --bg:#0f141b; --bg2:#151c25; --bg3:#1c2530; --line:#2a3542; --line2:#364454;
  --tx:#e6edf3; --tx2:#a9b6c3; --tx3:#71808f;
  --acc:#f5b841; --acc2:#2dd4bf; --bad:#ef5b5b; --warn:#f59e0b; --ok:#34d399; --info:#60a5fa;
  --r:8px; --fs:13px;
  --top:48px; --tool:52px; --panel:348px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-size:var(--fs);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer;line-height:1.2;touch-action:manipulation}
button:hover{border-color:var(--line2);background:#223040}
button:active{transform:translateY(1px)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);color:#1b1405;border-color:#d59a25;font-weight:600}
button.pri:hover{background:#ffc95a}
button.danger{border-color:#6b2a2a;color:#ffb4b4}
button.on{background:#27405a;border-color:#4b7bb0;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
select,input[type=number],input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-width:0}
input[type=range]{accent-color:var(--acc);width:100%}
input[type=checkbox]{accent-color:var(--acc)}
#app{display:grid;grid-template-columns:var(--tool) 1fr var(--panel);grid-template-rows:var(--top) 1fr;height:100vh;height:100dvh;width:100vw}
#topbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(#18212c,#131a22);border-bottom:1px solid var(--line);min-width:0;overflow:visible;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.3px;white-space:nowrap;margin-right:4px}
.brand svg{width:26px;height:26px}
.brand small{font-weight:500;color:var(--tx3);font-size:11px}
.tb-grp{display:flex;gap:4px;align-items:center}
.tb-lbl{display:flex;align-items:center;gap:6px;color:var(--tx2);white-space:nowrap}
#clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:3px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line);min-width:84px;text-align:center}
#clock.paused{color:var(--acc)}
.spacer{flex:1}
.icon-btn{width:32px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:18px;height:18px;pointer-events:none}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:36px;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:230px;box-shadow:0 12px 30px #0009;z-index:50}
.menu-pop[hidden]{display:none}
.menu-pop button{text-align:left}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:3px 0;width:100%}
#toolbar{grid-row:2;grid-column:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:10}
#toolbar::-webkit-scrollbar{display:none}
.tool{width:40px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;position:relative;flex:0 0 auto;border-color:transparent;background:transparent}
.tool svg{width:22px;height:22px;pointer-events:none}
.tool.active{background:#2b3f55;border-color:var(--acc);box-shadow:inset 0 0 0 1px #f5b84155}
.tool .k{position:absolute;right:2px;bottom:1px;font-size:9px;color:var(--tx3);pointer-events:none}
.tsep{width:28px;border-top:1px solid var(--line);margin:3px 0;flex:0 0 auto}
#viewport{grid-row:2;grid-column:2;position:relative;overflow:hidden;background:#cfd8c4;min-width:0;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#map.grab{cursor:grab}#map.grabbing{cursor:grabbing}#map.pointer{cursor:pointer}
#toolopts{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;pointer-events:none;z-index:5}
#toolopts .box{pointer-events:auto;background:#10161ddd;border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;backdrop-filter:blur(4px);max-width:100%}
#toolopts .ttl{font-weight:700;color:var(--acc)}
#toolopts .hint{color:var(--tx2);font-size:12px}
#toolopts label{display:flex;gap:5px;align-items:center;color:var(--tx2);white-space:nowrap}
#hud{position:absolute;left:10px;bottom:10px;background:#0c1117e0;border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--tx2);pointer-events:none;z-index:5;display:grid;grid-template-columns:auto auto;gap:0 12px;min-width:250px}
#hud b{color:var(--tx);font-weight:600}
#hud .pz{grid-column:1/-1;color:var(--acc);font-weight:700}
#legend{position:absolute;right:10px;bottom:10px;background:#0c1117e0;border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;font-size:11px;color:var(--tx2);z-index:5;max-width:260px}
#legend:empty{display:none}
#legend .bar{height:8px;border-radius:4px;margin:4px 0 2px}
#legend .row{display:flex;justify-content:space-between;gap:10px}
#toasts{position:absolute;left:50%;top:56px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:30;pointer-events:none;width:min(92%,520px)}
.toast{background:#101820f2;border:1px solid var(--line2);border-left:4px solid var(--info);border-radius:6px;padding:7px 12px;box-shadow:0 8px 20px #0007;animation:tin .18s ease-out;pointer-events:none;max-width:100%}
.toast button{pointer-events:auto}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#tip{position:absolute;pointer-events:none;background:#0c1117f0;border:1px solid var(--line2);border-radius:6px;padding:4px 8px;font-size:12px;z-index:25;white-space:nowrap;display:none}
#banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;pointer-events:none}
#banner:empty{display:none}
#banner span{display:inline-block;background:#7c2d12e8;border:1px solid #f97316;color:#ffedd5;border-radius:999px;padding:4px 12px;font-weight:600;font-size:12px}
#panel{grid-row:2;grid-column:3;background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:10}
#tabs{display:flex;flex-wrap:wrap;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line);flex:0 0 auto}
#tabs button{border:0;border-radius:6px 6px 0 0;background:transparent;color:var(--tx2);padding:6px 8px;font-size:12px}
#tabs button[aria-selected=true]{background:var(--bg3);color:var(--tx);box-shadow:inset 0 -2px 0 var(--acc)}
#tabbody{overflow-y:auto;padding:10px 12px 40px;flex:1;min-height:0}
.tab{display:none}.tab.show{display:block}
h3{margin:14px 0 6px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3)}
h3:first-child{margin-top:2px}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap}
.row>label{flex:1 1 130px;color:var(--tx2)}
.row .val{font-variant-numeric:tabular-nums;color:var(--tx);min-width:44px;text-align:right}
.field{display:grid;grid-template-columns:1fr 1.25fr auto;align-items:center;gap:8px;margin:6px 0}
.field>span:first-child{color:var(--tx2)}
.field output{font-variant-numeric:tabular-nums;min-width:40px;text-align:right;color:var(--tx)}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--tx2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 7px}
.kpi b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.3px}
.chart{width:100%;height:118px;display:block;background:var(--bg);border:1px solid var(--line);border-radius:6px;margin:4px 0 8px}
.muted{color:var(--tx3)}
.small{font-size:11.5px}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--bg3);border:1px solid var(--line);font-size:11px}
.pill.bad{border-color:#7f2d2d;color:#ffb0b0}.pill.ok{border-color:#1f6b50;color:#9ff0cf}.pill.warn{border-color:#7a5516;color:#ffd58a}
.list{display:flex;flex-direction:column;gap:4px}
.item{display:flex;gap:8px;align-items:center;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer}
.item:hover{border-color:var(--line2)}
.item.sel{border-color:var(--acc)}
.sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto;border:1px solid #0006}
table.t{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:3px 4px;border-bottom:1px solid var(--line);text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--tx3);font-weight:600}
.issues{display:flex;flex-direction:column;gap:4px;font-size:12px}
.issue{padding:4px 7px;border-radius:5px;background:var(--bg);border-left:3px solid var(--warn);cursor:pointer}
.issue.err{border-left-color:var(--bad)}.issue.okk{border-left-color:var(--ok);cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.phase{border:1px solid var(--line);border-radius:7px;padding:7px;margin:6px 0;background:var(--bg)}
.phase.cur{border-color:var(--ok);box-shadow:0 0 0 1px #34d39944}
.phase-h{display:flex;align-items:center;gap:6px;justify-content:space-between;flex-wrap:wrap}
.phase-b{display:grid;grid-template-columns:128px 1fr;gap:8px;margin-top:6px;align-items:start}
.phase canvas{width:128px;height:128px;background:#1a2129;border-radius:6px;cursor:pointer;touch-action:manipulation}
.phase .tm{display:grid;grid-template-columns:auto 58px;gap:4px 6px;align-items:center;font-size:12px;color:var(--tx2)}
.phase .tm input{width:58px}
#timeline{width:100%;height:34px;display:block;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.overlay-list{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.overlay-list label{display:flex;align-items:center;gap:6px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-size:12px}
.overlay-list label:has(input:checked){border-color:var(--acc);background:#2a2415}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal[hidden]{display:none}
#modal .dlg{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;max-width:520px;width:100%;max-height:86vh;overflow:auto;padding:14px 16px;box-shadow:0 20px 50px #000c}
#modal h2{margin:0 0 8px;font-size:16px}
#modal pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;font-size:12px;max-height:240px;overflow:auto}
.prog{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--acc2);width:0}
#sheetHandle{display:none}
/* ---------- narrow / touch layout ---------- */
@media (max-width: 820px){
  :root{--top:auto;--panel:0px}
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  #topbar{flex-wrap:wrap;padding:6px 8px;gap:6px;row-gap:6px}
  .brand small,.tb-lbl .lbl-t{display:none}
  .brand span{font-size:14px}
  #clock{min-width:70px;font-size:13px}
  #toolbar{grid-row:3;grid-column:1;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-top:1px solid var(--line);padding:4px 6px;gap:2px;justify-content:flex-start}
  .tsep{width:0;height:26px;border-top:0;border-left:1px solid var(--line);margin:0 3px}
  #viewport{grid-row:2;grid-column:1}
  #panel{position:fixed;left:0;right:0;bottom:0;height:62dvh;transform:translateY(105%);transition:transform .22s ease;border-left:0;border-top:1px solid var(--line2);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px #000a;z-index:40}
  #panel.open{transform:none}
  #sheetHandle{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 0}
  #sheetHandle i{width:40px;height:4px;border-radius:2px;background:var(--line2);display:block;margin:0 auto}
  #hud{font-size:10.5px;min-width:0;padding:5px 7px;left:6px;bottom:6px;grid-template-columns:auto auto}
  #legend{display:none}
  #toolopts{left:6px;right:6px;top:6px}
  #toolopts .box{padding:5px 7px;gap:5px 8px}
  #toolopts .hint{display:none}
}
@media (max-width: 420px){
  #hud .opt{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand" title="Metroflow">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#1f2a36" stroke="#f5b841" stroke-width="1.5"/><path d="M6 21 C12 21 12 11 18 11 H26" stroke="#e6edf3" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M6 21 C12 21 12 11 18 11 H26" stroke="#f5b841" stroke-width="1" stroke-dasharray="2 2" fill="none"/><circle cx="23" cy="21" r="3.2" fill="#2dd4bf"/><circle cx="9" cy="11" r="2.4" fill="#ef5b5b"/></svg>
      <span>Metroflow</span><small>traffic &amp; transit lab</small>
    </div>
    <label class="tb-lbl"><span class="lbl-t">Scenario</span>
      <select id="scenarioSel" aria-label="Scenario"></select></label>
    <button id="btnLoadScenario" title="Load the selected scenario">Load</button>
    <div class="tb-grp">
      <button id="btnPlay" class="icon-btn" aria-label="Pause" title="Pause / resume (Space)"></button>
      <button id="btnStep" class="icon-btn" aria-label="Single step" title="Advance one simulation step (.)"></button>
      <button id="btnReset" class="icon-btn" aria-label="Reset" title="Reset scenario to its initial state"></button>
    </div>
    <label class="tb-lbl"><span class="lbl-t">Speed</span>
      <select id="speedSel" aria-label="Simulation speed">
        <option value="0.5">0.5×</option><option value="1">1×</option><option value="2">2×</option><option value="4" selected>4×</option><option value="8">8×</option><option value="16">16×</option><option value="32">32×</option><option value="64">64×</option>
      </select></label>
    <div id="clock" title="Simulated time of day">07:30:00</div>
    <div class="tb-grp">
      <button id="btnUndo" class="icon-btn" aria-label="Undo" title="Undo (Ctrl+Z)"></button>
      <button id="btnRedo" class="icon-btn" aria-label="Redo" title="Redo (Ctrl+Y)"></button>
    </div>
    <div class="spacer"></div>
    <div class="menu">
      <button id="btnFile" aria-haspopup="true" aria-expanded="false">File ▾</button>
      <div id="fileMenu" class="menu-pop" hidden>
        <button data-act="saveJson">Save city as JSON…</button>
        <button data-act="loadJson">Load city from JSON…</button>
        <hr>
        <button data-act="saveNamed">Save named scenario…</button>
        <button data-act="openNamed">Named scenarios &amp; autosave…</button>
        <hr>
        <button data-act="exportCsv">Export metrics CSV</button>
        <button data-act="exportPng">Export map PNG</button>
        <hr>
        <button data-act="replay">Deterministic replay of this run</button>
      </div>
    </div>
    <button id="btnSound" class="icon-btn" aria-label="Sound off" title="Toggle procedural audio"></button>
    <button id="btnPanel" class="icon-btn" aria-label="Toggle side panel" title="Panel"></button>
  </header>

  <nav id="toolbar" aria-label="Tools"></nav>

  <main id="viewport">
    <canvas id="map" aria-label="City map canvas" tabindex="0"></canvas>
    <div id="toolopts"></div>
    <div id="banner"></div>
    <div id="hud" aria-live="off"></div>
    <div id="legend"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="tip"></div>
  </main>

  <aside id="panel" aria-label="Details panel">
    <div id="sheetHandle"><span class="muted small">Panel</span><i></i><button id="btnSheetClose" aria-label="Close panel">✕</button></div>
    <div id="tabs" role="tablist"></div>
    <div id="tabbody">
      <section class="tab" id="tab-inspect"></section>
      <section class="tab" id="tab-signals"></section>
      <section class="tab" id="tab-transit"></section>
      <section class="tab" id="tab-demand"></section>
      <section class="tab" id="tab-sim"></section>
      <section class="tab" id="tab-stats"></section>
      <section class="tab" id="tab-layers"></section>
    </div>
  </aside>
</div>
<div id="modal" hidden><div class="dlg" role="dialog" aria-modal="true"></div></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
<script>
'use strict';
// =====================================================================
//  Metroflow — single-file city traffic & transit simulator
//  Sections: core utils · city model/editor · network build · routing ·
//  simulation · transit · metrics · rendering · UI · persistence · audio
// =====================================================================

// ------------------------------ core utils ------------------------------
const DT = 0.2;                 // fixed simulation step in seconds (time acceleration = more steps, never bigger ones)
const LANE_W = 3.5;             // lane width (m)
const TAU = Math.PI * 2;
const FORMAT = 'metroflow-city';
const FORMAT_VERSION = 1;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const hypot = Math.hypot;
const pad2 = n => (n < 10 ? '0' : '') + n;

class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() {
    let t = (this.s = (this.s + 0x6D2B79F5) >>> 0);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + (b - a) * this.next(); }
  int(n) { return Math.floor(this.next() * n); }
  pick(a) { return a[this.int(a.length)]; }
  normal() { const u = 1 - this.next(), v = this.next(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); }
}
function hash01(a, b) {
  let h = Math.imul((a | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(((b | 0) + 0x632be5ab) | 0, 0xc2b2ae35);
  h ^= h >>> 13; h = Math.imul(h, 0x27d4eb2f); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function strHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

class Heap { // binary min-heap keyed by number
  constructor() { this.k = []; this.v = []; }
  get size() { return this.k.length; }
  push(key, val) {
    const k = this.k, v = this.v; let i = k.length; k.push(key); v.push(val);
    while (i > 0) { const p = (i - 1) >> 1; if (k[p] <= key) break; k[i] = k[p]; v[i] = v[p]; i = p; }
    k[i] = key; v[i] = val;
  }
  pop() {
    const k = this.k, v = this.v; const top = v[0]; const lk = k.pop(), lv = v.pop(); const n = k.length;
    if (n > 0) {
      let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1; let m = i, mk = lk;
        if (l < n && k[l] < mk) { m = l; mk = k[l]; }
        if (r < n && k[r] < mk) { m = r; mk = k[r]; }
        if (m === i) break;
        k[i] = k[m]; v[i] = v[m]; i = m;
      }
      k[i] = lk; v[i] = lv;
    }
    return top;
  }
}

function projSeg(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay; const L2 = dx * dx + dy * dy || 1e-9;
  let t = ((px - ax) * dx + (py - ay) * dy) / L2; t = clamp(t, 0, 1);
  const x = ax + dx * t, y = ay + dy * t;
  return { t, x, y, d: hypot(px - x, py - y) };
}
function segX(ax, ay, bx, by, cx, cy, dx, dy) {

// ------------------------------ validation of imported JSON ------------------------------
function validateCityJSON(o) {
  const E = [];
  const num = (v, n) => { if (typeof v !== 'number' || !isFinite(v)) E.push(`${n} must be a finite number`); };
  if (!o || typeof o !== 'object' || Array.isArray(o)) return ['Root must be a JSON object'];
  if (o.format !== FORMAT) E.push(`format must be "${FORMAT}" (got ${JSON.stringify(o.format)})`);
  if (typeof o.version !== 'number' || o.version > FORMAT_VERSION) E.push(`unsupported version ${o.version}`);
  num(o.width, 'width'); num(o.height, 'height');
  if (o.width < 200 || o.width > 10000 || o.height < 200 || o.height > 10000) E.push('map size out of range (200–10000 m)');
  let structural = false;
  for (const k of ['nodes', 'roads', 'zones', 'lots', 'stops', 'routes']) if (!Array.isArray(o[k])) { E.push(`${k} must be an array`); structural = true; }
  if (structural || o.format !== FORMAT) return E;
  const nid = new Set();
  o.nodes.forEach((n, i) => {
    if (!n || typeof n.id !== 'number') { E.push(`nodes[${i}].id missing`); return; }
    if (nid.has(n.id)) E.push(`duplicate node id ${n.id}`); nid.add(n.id);
    num(n.x, `nodes[${i}].x`); num(n.y, `nodes[${i}].y`);
    if (!['none', 'priority', 'allway', 'signal'].includes(n.ctrl)) E.push(`nodes[${i}].ctrl invalid`);
    if (!Array.isArray(n.bans)) E.push(`nodes[${i}].bans must be an array`);
    if (n.sig != null && (typeof n.sig !== 'object' || (n.sig.phases != null && !Array.isArray(n.sig.phases)))) E.push(`nodes[${i}].sig invalid`);
  });
  const rid = new Set();
  o.roads.forEach((r, i) => {
    if (!r || typeof r.id !== 'number') { E.push(`roads[${i}].id missing`); return; }
    if (rid.has(r.id) || nid.has(r.id)) E.push(`duplicate id ${r.id}`); rid.add(r.id);
    if (!nid.has(r.a) || !nid.has(r.b)) E.push(`roads[${i}] references a missing node`);
    if (r.a === r.b) E.push(`roads[${i}] connects a node to itself`);
    for (const k of ['lf', 'lb']) if (!Number.isInteger(r[k]) || r[k] < 0 || r[k] > 4) E.push(`roads[${i}].${k} must be 0–4`);
    if (r.lf + r.lb < 1) E.push(`roads[${i}] has no lanes`);
    num(r.spd, `roads[${i}].spd`); if (r.spd < 5 || r.spd > 130) E.push(`roads[${i}].spd out of range`);
  });
  const sid = new Set();
  o.stops.forEach((s, i) => { if (!rid.has(s.road)) E.push(`stops[${i}] references a missing road`); num(s.t, `stops[${i}].t`); sid.add(s.id); });
  o.routes.forEach((r, i) => {
    if (!Array.isArray(r.stops)) E.push(`routes[${i}].stops must be an array`); else if (r.stops.some(s => !sid.has(s))) E.push(`routes[${i}] references a missing stop`);
    num(r.headway, `routes[${i}].headway`); num(r.cap, `routes[${i}].cap`); num(r.dwell, `routes[${i}].dwell`);
    if (r.headway < 30 || r.cap < 1) E.push(`routes[${i}] headway/capacity out of range`);
  });
  o.zones.forEach((z, i) => { if (!ZONE_TYPES[z.type]) E.push(`zones[${i}].type invalid`); ['x', 'y', 'w', 'h'].forEach(k => num(z[k], `zones[${i}].${k}`)); });
  o.lots.forEach((l, i) => { num(l.x, `lots[${i}].x`); num(l.y, `lots[${i}].y`); num(l.cap, `lots[${i}].cap`); });
  if (o.state != null) {
    const s = o.state;
    if (typeof s !== 'object') E.push('state must be an object');
    else { num(s.t, 'state.t'); if (!Array.isArray(s.veh)) E.push('state.veh must be an array'); if (s.pax != null && !Array.isArray(s.pax)) E.push('state.pax must be an array'); }
  }
  if (typeof o.nextId !== 'number' || [...nid, ...rid].some(id => id >= o.nextId)) E.push('nextId must exceed every id');
  return E.slice(0, 25);
}


// ------------------------------ scenarios ------------------------------
function SB(w, h, name, seed) {
  const c = emptyCity(w, h); c.name = name; c.seed = seed || 1234;
  const B = {
    c,
    node(x, y, ctrl) { const n = addNode(c, x, y); if (ctrl) n.ctrl = ctrl; return n.id; },
    road(a, b, o = {}) { return addRoadRaw(c, a, b, o).id; },
    between(a, b) { return c.roads.find(r => (r.a === a && r.b === b) || (r.a === b && r.b === a)); },
    zone(type, x, y, w, h, k = 1, name, ev) { const z = { id: cid(c), type, x, y, w, h, k, name: name || ZONE_TYPES[type].short + ' ' + (c.zones.length + 1) }; if (ev) z.ev = ev; c.zones.push(z); return z.id; },
    lot(x, y, cap, name) { const l = { id: cid(c), x, y, cap, name: name || 'Parking ' + (c.lots.length + 1) }; c.lots.push(l); return l.id; },
    stop(a, b, t = 0.5, name) { const r = B.between(a, b); if (!r) throw new Error('no road for stop'); const tt = r.a === a ? t : 1 - t; const s = { id: cid(c), road: r.id, t: tt, name: name || 'Stop ' + (c.stops.length + 1) }; c.stops.push(s); return s.id; },
    route(name, color, stops, o = {}) { const r = { id: cid(c), name, color, stops, loop: !!o.loop, headway: o.headway || 360, cap: o.cap || 60, dwell: o.dwell ?? 12, active: true, kind: o.kind || 'bus' }; c.routes.push(r); return r.id; },
    signal(id) { const n = nodeById(c, id); n.ctrl = 'signal'; },
    ctrl(id, k) { nodeById(c, id).ctrl = k; },
  };
  return B;
}
// grid of nodes; hRoads/vRoads describe each row/column: {lf, lb, spd, name, bus}
function gridNet(B, xs, ys, rowSpec, colSpec) {
  const N = ys.map(y => xs.map(x => B.node(x, y)));
  ys.forEach((y, j) => { const s = rowSpec(j); if (!s) return; for (let i = 0; i < xs.length - 1; i++) if (!s.skip || !s.skip(i)) B.road(N[j][i], N[j][i + 1], s); });
  xs.forEach((x, i) => { const s = colSpec(i); if (!s) return; for (let j = 0; j < ys.length - 1; j++) if (!s.skip || !s.skip(j)) B.road(N[j][i], N[j + 1][i], s); });
  return N;
}
function autoSignals(B, N, pred) {
  for (let j = 0; j < N.length; j++) for (let i = 0; i < N[j].length; i++) {
    const id = N[j][i]; const deg = roadsAt(B.c, id).length; if (deg < 3) continue;
    const n = nodeById(B.c, id); n.ctrl = pred(i, j, roadsAt(B.c, id)) || n.ctrl;
  }
}

  tick();
}
function finishReplay() {
  const RP = UI.replay; UI.replay = null; UI.busy = false;

  window.__lastReplay = { ok, checked: RP.checked, matched: RP.matched, mismatchStep: RP.mismatch, endHash, origHash: RP.origHash, actions: RP.log.length };
  UI.sim.log = RP.log.slice(); UI.sim.hashes = [];
  openModal(`<h2>${ok ? '✓ Replay is deterministic' : '✕ Replay diverged'}</h2><p>${ok ? `All ${RP.matched} state checkpoints matched the original run, ending at hash <code>${endHash}</code>.` : `First mismatch at step ${RP.mismatch || RP.endStep}. End hash ${endHash} vs original ${RP.origHash}.`}</p><p class="muted small">Replay restores the run's starting state (scenario, seed, agents) and re-applies the ${RP.log.length} recorded edits and control changes at their original simulation steps. The simulation continues live from here.</p><div class="btns"><button data-m="close" class="pri">Continue</button></div>`);
}
// ---------- audio (procedural, Web Audio; created on user gesture)
const AudioFX = {
  ctx: null, on: false, vol: 0.6, master: null, noise: null, ng: null, nf: null, lastHorn: 0,
  toggle() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) { toast('Web Audio not supported', 'warn'); return; }
      const c = this.ctx = new AC(); this.master = c.createGain(); this.master.gain.value = this.vol * 0.5; this.master.connect(c.destination);
      const len = c.sampleRate * 3, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0); let last = 0;
      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true; this.nf = c.createBiquadFilter(); this.nf.type = 'lowpass'; this.nf.frequency.value = 400; this.ng = c.createGain(); this.ng.gain.value = 0;
      src.connect(this.nf); this.nf.connect(this.ng); this.ng.connect(this.master); src.start(); this.noise = src;
    }
    this.on = !this.on;
    if (this.on) this.ctx.resume(); else this.ctx.suspend();
    const b = $('#btnSound'); b.innerHTML = svg(this.on ? 'soundOn' : 'soundOff'); b.setAttribute('aria-label', this.on ? 'Sound on' : 'Sound off');
    if (this.on) this.chime();
  },
  setVol(v) { this.vol = v; if (this.master) this.master.gain.setTargetAtTime(v * 0.5, this.ctx.currentTime, 0.05); },
  env(type, f0, f1, dur, g, when = 0) {
    if (!this.on || !this.ctx) return; const c = this.ctx, t = c.currentTime + when;
    const o = c.createOscillator(), gn = c.createGain(); o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(g, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(gn); gn.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  click() { this.env('triangle', 1400, 900, 0.05, 0.04); },
  tick() { this.env('sine', 2100, 0, 0.03, 0.02); },
  chime() { this.env('sine', 880, 0, 0.35, 0.06); this.env('sine', 1318, 0, 0.45, 0.04, 0.09); },
  error() { this.env('sawtooth', 160, 110, 0.16, 0.05); },
  horn() { this.env('square', 392, 0, 0.18, 0.025); this.env('square', 466, 0, 0.18, 0.02); },
  update(sim) {
    if (!this.on || !this.ctx) return;
    let n = 0, sv = 0, stopped = 0; for (const v of sim.veh) if (v.vis) { n++; sv += v.v; if (v.v < 0.3) stopped++; }
    const t = this.ctx.currentTime; const g = UI.running ? Math.min(0.2, 0.012 + Math.sqrt(n) * 0.009) : 0.004;
    this.ng.gain.setTargetAtTime(g, t, 0.4); this.nf.frequency.setTargetAtTime(220 + (n ? sv / n : 0) * 45, t, 0.4);
    if (UI.running && stopped > 25 && performance.now() - this.lastHorn > 4000 && Math.random() < 0.25) { this.lastHorn = performance.now(); this.horn(); }
  },
};

    if (t.dataset.d === 'jump' && t.value) { const h = +t.value; let tt = Math.floor(UI.sim.t / 86400) * 86400 + h * 3600; if (tt < UI.sim.t) tt += 86400; UI.sim.act({ type: 'setTime', t: tt }); toast('Clock set to ' + fmtClock(tt, false)); t.value = ''; return; }
    if (t.dataset.s === 'routing') { setParam('routing', t.value, 'Route choice: ' + t.options[t.selectedIndex].text); return; }
    if (t.dataset.s === 'sandbox') { edit(c => { c.budget.sandbox = t.checked; }, t.checked ? 'Sandbox mode' : 'Budget mode'); renderToolOpts(); return; }
