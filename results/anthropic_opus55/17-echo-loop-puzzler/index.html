<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Echo Loop — a time-loop puzzle</title>
<style>
:root {
  --bg0: #060817; --bg1: #0e1433; --panel: rgba(13, 17, 42, 0.9); --panel2: rgba(22, 28, 66, 0.92);
  --ink: #eaf0ff; --muted: #9aa3d0; --dim: #69719c; --line: rgba(150, 170, 255, 0.16); --line2: rgba(150, 170, 255, 0.3);
  --accent: #7ff6ff; --accent2: #ff6fb5; --warn: #ffd166; --danger: #ff4d6d; --ok: #74f2a6;
  --radius: 10px; --ui: 13px;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
.hc { --panel: #000; --panel2: #000; --line: rgba(255,255,255,.55); --line2: #fff; --muted: #d7dcff; --dim: #b8bfe8; }
.bigui { --ui: 15px; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg0); color: var(--ink); font-family: var(--font); font-size: var(--ui); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; grid-template-columns: auto minmax(0, 1fr) auto;
  background: radial-gradient(1200px 700px at 70% -10%, #1a1f55 0%, transparent 60%), linear-gradient(180deg, var(--bg1), var(--bg0)); }
#topbar { grid-row: 1; grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(20,26,64,.95), rgba(10,13,34,.9)); min-width: 0; z-index: 5; }
.brand { font-weight: 800; letter-spacing: .18em; font-size: 14px; white-space: nowrap; display: flex; align-items: center; gap: 8px; user-select: none; }
.brand b { color: var(--accent); text-shadow: 0 0 12px rgba(127,246,255,.6); }
.brand svg { width: 22px; height: 22px; }
#lvlinfo { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
#lvlname { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#lvlsub { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { display: flex; gap: 4px; align-items: center; overflow-x: auto; scrollbar-width: none; margin-left: auto; min-width: 0; }
.bar::-webkit-scrollbar { display: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.04); white-space: nowrap; transition: background .12s, border-color .12s, transform .06s; }
.btn:hover { background: rgba(127,246,255,.1); border-color: var(--line2); }
.btn:active { transform: translateY(1px); }
.btn[aria-pressed="true"], .btn.on { background: rgba(127,246,255,.18); border-color: var(--accent); color: #fff; }
.btn.primary { background: linear-gradient(180deg, #2de0ff, #1597c9); color: #04121c; border-color: transparent; font-weight: 700; }
.btn.danger:hover { background: rgba(255,77,109,.18); border-color: var(--danger); }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn.io .lbl, .btn.io .k { display: none; }
.btn.io { padding: 0 8px; }
@media (max-width: 1420px) { .btn .k { display: none; } }
.btn .k { font-family: var(--mono); font-size: 10px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.sep { width: 1px; height: 22px; background: var(--line); flex: none; }

#stage { grid-row: 2; grid-column: 2; position: relative; min-height: 0; min-width: 0; overflow: hidden; touch-action: none; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#stats { position: absolute; left: 8px; top: 8px; font-family: var(--mono); font-size: 11px; line-height: 1.45; background: rgba(6,8,22,.72); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; pointer-events: none; white-space: pre; max-width: calc(100% - 16px); overflow: hidden; backdrop-filter: blur(4px); z-index: 2; }
#stats .w { color: var(--warn); } #stats .d { color: var(--danger); font-weight: 700; } #stats .g { color: var(--ok); } #stats .m { color: var(--dim); }
#stats.min .x { display: none; }
#diagpanel { position: absolute; right: 8px; top: 8px; width: 250px; font-family: var(--mono); font-size: 10.5px; background: rgba(6,8,22,.8); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; z-index: 2; display: none; }
#diagpanel.show { display: block; }
#diagpanel canvas { width: 100%; height: 46px; display: block; margin-top: 4px; }
#diagpanel .row { display: flex; justify-content: space-between; gap: 6px; }
#diagpanel button { margin-top: 6px; width: 100%; height: 26px; font-size: 11px; }
#toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 4; width: min(92%, 560px); }
.toast { background: var(--panel2); border: 1px solid var(--line2); border-radius: 10px; padding: 8px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); animation: tin .25s ease-out; text-align: center; }
.toast.warn { border-color: var(--warn); } .toast.bad { border-color: var(--danger); } .toast.good { border-color: var(--ok); }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
.reduced .toast { animation: none; }
#banner { position: absolute; left: 50%; top: 18%; transform: translate(-50%, 0); text-align: center; pointer-events: none; z-index: 3; opacity: 0; transition: opacity .6s; width: min(92%, 640px); }
#banner.show { opacity: 1; }
#banner .t1 { font-size: 12px; letter-spacing: .4em; color: var(--accent); text-transform: uppercase; }
#banner .t2 { font-size: clamp(26px, 5vw, 44px); font-weight: 800; letter-spacing: .04em; text-shadow: 0 4px 30px rgba(127,246,255,.35); }
#banner .t3 { color: var(--muted); margin-top: 6px; font-size: 14px; }
#pausebadge { position: absolute; right: 10px; bottom: 10px; z-index: 3; font-family: var(--mono); font-size: 11px; color: var(--warn); background: rgba(6,8,22,.75); border: 1px solid var(--warn); padding: 3px 8px; border-radius: 6px; display: none; }
#pausebadge.show { display: block; }
#audiohint { position: absolute; right: 10px; top: 10px; z-index: 3; font-size: 11px; color: var(--muted); background: rgba(6,8,22,.7); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; pointer-events: none; }
#stage .edonly { display: none; }

/* timeline */
#timeline { grid-row: 3; grid-column: 2; border-top: 1px solid var(--line); background: linear-gradient(180deg, rgba(12,16,42,.96), rgba(7,9,26,.98)); padding: 4px 8px 6px; min-width: 0; }
.tlhead { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); min-height: 28px; flex-wrap: wrap; }
.tlhead .big { color: var(--ink); font-size: 13px; font-weight: 700; }
.tlhead .left { color: var(--accent); }
.tlhead .grow { flex: 1; }
.tlhead .btn { height: 26px; font-size: 11px; padding: 0 8px; }
#tlcv { width: 100%; height: 64px; display: block; touch-action: none; cursor: ew-resize; border-radius: 6px; }

/* touch controls */
#touch { grid-row: 4; grid-column: 1 / -1; display: none; justify-content: space-between; align-items: flex-end; gap: 10px; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); background: rgba(6,8,22,.92); border-top: 1px solid var(--line); user-select: none; -webkit-user-select: none; touch-action: none; }
.touchon #touch { display: flex; }
.tpad { display: flex; gap: 8px; }
.tb { width: 62px; height: 58px; border-radius: 14px; border: 1px solid var(--line2); background: rgba(255,255,255,.06); display: grid; place-items: center; font-weight: 800; font-size: 13px; touch-action: none; }
.tb.big { width: 76px; height: 70px; background: rgba(127,246,255,.14); border-color: var(--accent); }
.tb.held { background: rgba(127,246,255,.35); transform: scale(.96); }
.tb svg { width: 26px; height: 26px; }
.tb small { font-size: 10px; color: var(--muted); display: block; font-weight: 600; }
@media (max-width: 480px) {
  #touch { padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); gap: 6px; }
  .tpad { gap: 5px; }
  .tb { width: 52px !important; height: 52px !important; border-radius: 12px; }
  .tb.big { width: 64px !important; height: 62px !important; }
  .tb[data-action="rewind"] { display: none; }
  .tb svg { width: 22px; height: 22px; }
  #diagpanel { width: 170px; font-size: 9px; max-height: 45%; overflow: auto; }
  #diagpanel canvas { display: none; }
}

/* editor */
#palette, #props { display: none; background: var(--panel); border-color: var(--line); overflow: auto; }
.editing #palette { display: flex; grid-row: 2 / 4; grid-column: 1; flex-direction: column; gap: 3px; padding: 8px 6px; border-right: 1px solid var(--line); width: 128px; }
.editing #props { display: block; grid-row: 2 / 4; grid-column: 3; border-left: 1px solid var(--line); width: 272px; padding: 8px 10px 16px; }
.editing #timeline, .editing #touch { display: none !important; }
.editing #stage .edonly { display: block; }
.editing .playonly { display: none !important; }
body:not(.editing) .edonly { display: none !important; }
.pal { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 7px; border: 1px solid transparent; background: transparent; text-align: left; font-size: 12px; }
.pal:hover { background: rgba(255,255,255,.05); }
.pal[aria-pressed="true"] { background: rgba(127,246,255,.14); border-color: var(--accent); }
.pal i { width: 14px; height: 14px; border-radius: 3px; flex: none; display: inline-block; }
.palh { font-size: 10px; letter-spacing: .15em; color: var(--dim); text-transform: uppercase; margin: 6px 4px 2px; }
#props h3 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 10px 0 6px; }
#props h3:first-child { margin-top: 2px; }
.field { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 6px; margin: 4px 0; }
.field label { color: var(--muted); font-size: 12px; }
.field input, .field select, .field textarea { width: 100%; height: 28px; background: rgba(0,0,0,.35); border: 1px solid var(--line2); border-radius: 6px; padding: 0 6px; }
.field textarea { height: 64px; padding: 4px 6px; resize: vertical; grid-column: 1 / -1; }
.field input[type=checkbox] { width: 18px; height: 18px; justify-self: start; }
.field.wide { grid-template-columns: 1fr; }
.chsw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
#issues { list-style: none; margin: 0; padding: 0; font-size: 12px; }
#issues li { padding: 5px 6px; border-radius: 6px; margin: 3px 0; border: 1px solid var(--line); cursor: pointer; }
#issues li.error { border-color: rgba(255,77,109,.6); background: rgba(255,77,109,.08); }
#issues li.warn { border-color: rgba(255,209,102,.45); background: rgba(255,209,102,.06); }
#issues li.ok { border-color: rgba(116,242,166,.5); color: var(--ok); cursor: default; }
.hint { color: var(--dim); font-size: 11.5px; line-height: 1.45; }
#edstatus { position: absolute; left: 8px; bottom: 8px; font-family: var(--mono); font-size: 11px; background: rgba(6,8,22,.75); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; pointer-events: none; z-index: 2; }
#zoombox { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; z-index: 2; }
#zoombox .btn { height: 28px; padding: 0 8px; background: rgba(6,8,22,.8); }

/* modal */
#modal { position: fixed; inset: 0; display: none; place-items: center; background: rgba(3,4,12,.62); backdrop-filter: blur(3px); z-index: 20; padding: 14px; }
#modal.show { display: grid; }
.card { width: min(760px, 100%); max-height: min(88vh, 900px); overflow: auto; background: linear-gradient(180deg, rgba(24,30,72,.98), rgba(12,15,40,.98)); border: 1px solid var(--line2); border-radius: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.55); padding: 18px 20px; }
.card h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: .02em; }
.card .sub { color: var(--muted); margin-bottom: 12px; }
.card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.card .row.end { justify-content: flex-end; }
.card textarea { width: 100%; min-height: 180px; background: rgba(0,0,0,.4); border: 1px solid var(--line2); border-radius: 8px; padding: 8px; font-family: var(--mono); font-size: 11px; color: var(--ink); }
.card table { width: 100%; border-collapse: collapse; font-size: 13px; }
.card td, .card th { padding: 5px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.card th { color: var(--dim); font-weight: 600; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.lvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.lv { text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.035); display: flex; flex-direction: column; gap: 6px; min-height: 124px; position: relative; }
.lv:hover { border-color: var(--accent); background: rgba(127,246,255,.07); }
.lv .n { font-family: var(--mono); color: var(--accent); font-size: 11px; }
.lv .nm { font-weight: 800; font-size: 16px; }
.lv .bl { color: var(--muted); font-size: 12px; line-height: 1.35; flex: 1; }
.lv .st { font-family: var(--mono); font-size: 11px; color: var(--dim); }
.medal { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font-weight: 900; font-size: 12px; color: #1a1300; position: absolute; right: 10px; top: 10px; }
.medal.g { background: radial-gradient(circle at 35% 30%, #fff3b0, #ffc94a 55%, #b8860b); box-shadow: 0 0 16px rgba(255,201,74,.55); }
.medal.s { background: radial-gradient(circle at 35% 30%, #fff, #c9d3e6 55%, #7d8aa6); }
.medal.b { background: radial-gradient(circle at 35% 30%, #ffd9b8, #d08a4f 55%, #7a4a22); }
.medal.none { background: transparent; border: 1px dashed var(--line2); color: var(--dim); }
.bigmedal { width: 88px; height: 88px; font-size: 34px; position: static; margin: 6px auto 4px; display: grid; }
.reveal { animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { from { transform: scale(.2) rotate(-30deg); opacity: 0; } }
.reduced .reveal { animation: none; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin: 10px 0; }
.kv div { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.kv b { display: block; font-size: 20px; } .kv span { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.set { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; align-items: center; }
.set label { color: var(--muted); }
.set input[type=range] { width: 180px; accent-color: var(--accent); }
.set input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.set select { background: rgba(0,0,0,.35); border: 1px solid var(--line2); border-radius: 6px; height: 28px; }
.keybtn { min-width: 86px; justify-content: center; font-family: var(--mono); font-size: 12px; }
.keybtn.wait { border-color: var(--warn); color: var(--warn); }
.help p, .help li { line-height: 1.5; color: #d7ddff; }
.help kbd, .card kbd { font-family: var(--mono); font-size: 11px; background: rgba(255,255,255,.08); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
.slots { list-style: none; padding: 0; margin: 8px 0; }
.slots li { display: flex; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.slots li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.err { color: var(--danger); white-space: pre-wrap; font-size: 12px; }
.okc { color: var(--ok); }
.tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }

@media (max-width: 760px) {
  .brand span.full, .btn .lbl, .btn .k { display: none; }
  #topbar { gap: 6px; padding: 5px 6px; }
  .btn { padding: 0 8px; }
  #stats { font-size: 10px; padding: 4px 6px; }
  #diagpanel { width: 200px; top: auto; bottom: 8px; }
  .editing #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; }
  .editing #palette { grid-row: 2; grid-column: 1; flex-direction: row; width: auto; overflow-x: auto; padding: 5px; border-right: 0; border-bottom: 1px solid var(--line); }
  .editing .palh { display: none; }
  .editing .pal { flex: none; }
  .editing #stage { grid-row: 3; grid-column: 1; }
  .editing #props { grid-row: 4; grid-column: 1; width: auto; max-height: 34vh; border-left: 0; border-top: 1px solid var(--line); }
  .field { grid-template-columns: 1fr 140px; }
  .card { padding: 14px; }
  .tb { width: 56px; height: 54px; } .tb.big { width: 68px; height: 64px; }
}
@media (max-height: 520px) { #timeline #tlcv { height: 44px; } }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand" aria-label="Echo Loop"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="#7ff6ff" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="none" stroke="#ff6fb5" stroke-width="2" stroke-dasharray="3 2"/><path d="M12 12 L12 5" stroke="#eaf0ff" stroke-width="2" stroke-linecap="round"/></svg><span class="full">ECHO<b>LOOP</b></span></div>
    <div id="lvlinfo"><span id="lvlname">—</span><span id="lvlsub"></span></div>
    <nav class="bar playonly" id="playbar" aria-label="Game controls"></nav>
    <nav class="bar edonly" id="edbar" aria-label="Editor toolbar"></nav>
  </header>
  <aside id="palette" aria-label="Editor palette"></aside>
  <main id="stage">
    <canvas id="cv" tabindex="0" aria-label="Game view. Use arrow keys or A/D to move, Space to jump, E to interact, F to throw, R to rewind."></canvas>
    <div id="stats" aria-live="off"></div>
    <div id="diagpanel" aria-label="Diagnostics"></div>
    <div id="banner" aria-hidden="true"><div class="t1"></div><div class="t2"></div><div class="t3"></div></div>
    <div id="pausebadge">PAUSED</div>
    <div id="audiohint">♪ sound starts on your first key or tap</div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="edstatus" class="edonly"></div>
    <div id="zoombox" class="edonly"></div>
  </main>
  <section id="timeline" class="playonly" aria-label="Loop timeline">
    <div class="tlhead" id="tlhead"></div>
    <canvas id="tlcv" aria-label="Loop timeline. While paused, drag to scrub and preview any moment; use comma and period to step."></canvas>
  </section>
  <aside id="props" aria-label="Properties"></aside>
  <div id="touch" aria-label="Touch controls"></div>
</div>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><div class="card" id="modalcard"></div></div>
<script>
// @@SIM-BEGIN — pure deterministic simulation (no DOM access in this block)
'use strict';
const T = 32, TPS = 60, SNAP_EVERY = 15, DIV_DIST = 16;
const PHYS = Object.freeze({
  g: 0.5, maxFall: 11, run: 3.0, accG: 0.6, accA: 0.36, decG: 0.8, decA: 0.18,
  jumpV: 9.0, jumpCut: 3.0, coyote: 6, buffer: 7,
  aw: 22, ah: 34, cr: 28, throwVX: 5.2, throwVY: 6.5, carrySpeed: 0.85, pushSpeed: 0.6,
  doorSteps: 12
});
const BIT = Object.freeze({ L: 1, R: 2, J: 4, D: 8, I: 16, X: 32 });
const INTERACT_EV = { grab: 1, drop: 1, throw: 1, toggle: 1, press: 1 };
const approach = (v, t, d) => (v < t ? Math.min(t, v + d) : Math.max(t, v - d));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// ---------- object catalogue (shared by loader, validator and editor) ----------
const OBJ = {
  wall:   { name: 'Wall', rs: 'wh', dflt: { w: 4, h: 1 }, rot: 'swap', desc: 'Solid static geometry.' },
  oneway: { name: 'One-way', rs: 'w', fixH: 1, dflt: { w: 3, h: 1 }, desc: 'Jump up through it; hold Down + Jump to drop.' },
  spawn:  { name: 'Spawn', fixW: 1, fixH: 2, unique: 1, desc: 'Where the player and every echo start each loop.' },
  goal:   { name: 'Goal', rs: 'wh', dflt: { w: 2, h: 3 }, rot: 'swap', desc: 'The living player must reach it. Echoes cannot leave.' },
  crate:  { name: 'Crate', fixW: 1, fixH: 1, desc: 'Push, carry (E) and throw (F). Presses plates, blocks lasers, fits 1-tile gaps.' },

    if (!solid(x, y + 1)) other.push(x * T, (y + 1) * T, (x + 1) * T, (y + 1) * T);
    if (!solid(x - 1, y)) other.push(x * T, y * T, x * T, (y + 1) * T);
    if (!solid(x + 1, y)) other.push((x + 1) * T, y * T, (x + 1) * T, (y + 1) * T);
  }
  c = { top, other, grid };
  edgeCache.set(W.st, c);

}

function drawBackground(ctx, vw, vh, L, cam, progress, echoes) {
  const th = THEMES[L.theme % THEMES.length];
  const g = ctx.createLinearGradient(0, 0, 0, vh);
  g.addColorStop(0, th.sky1); g.addColorStop(1, th.sky0);
  ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh);
  const bg = bgFor(L), rm = Settings.reducedMotion, t = FX.time;
  // giant chronometer: its hand is the loop clock
  const R = Math.min(vw, vh) * 0.42, cx = vw * 0.5 - (cam.cx - L.w * T / 2) * 0.04 * cam.z, cy = vh * 0.5 - (cam.cy - L.h * T / 2) * 0.04 * cam.z;
  ctx.save();
  ctx.globalAlpha = Settings.highContrast ? 0.12 : 0.22;
  ctx.strokeStyle = th.rim; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, R * 0.82, 0, Math.PI * 2); ctx.stroke();
  for (let i = 0; i < 60; i++) {
    const a = i / 60 * Math.PI * 2 - Math.PI / 2, r1 = i % 5 ? R * 0.95 : R * 0.9;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R); ctx.stroke();
  }

  for (let i = 0; i < echoes; i++) {
    ctx.strokeStyle = ECHO_COLORS[i % ECHO_COLORS.length]; ctx.setLineDash([6, 10]); ctx.lineDashOffset = rm ? 0 : -t * 20 * (i % 2 ? 1 : -1);
    ctx.beginPath(); ctx.arc(cx, cy, R * (0.74 - i * 0.05), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.setLineDash([]);
  const ang = progress * Math.PI * 2 - Math.PI / 2;
  ctx.globalAlpha = 0.35; ctx.strokeStyle = '#eaf0ff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ang) * R * 0.86, cy + Math.sin(ang) * R * 0.86); ctx.stroke();
  ctx.globalAlpha = 0.12; ctx.fillStyle = th.rim;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R * 0.82, -Math.PI / 2, ang); ctx.closePath(); ctx.fill();
  ctx.restore();

  ctx.fillStyle = th.far; ctx.globalAlpha = 0.85;
  for (const b of bg.sky) {
    const x = ((b.x * vw * 1.3 + px) % (vw * 1.3) + vw * 1.3) % (vw * 1.3) - vw * 0.15, w = b.w * vw, h = b.h * vh;
    ctx.fillRect(x, vh - h, w, h);
    if (b.arch) { ctx.beginPath(); ctx.arc(x + w / 2, vh - h, w / 2, Math.PI, 0); ctx.fill(); }
    if (b.spire) { ctx.beginPath(); ctx.moveTo(x + w * 0.35, vh - h); ctx.lineTo(x + w / 2, vh - h - w * 1.4); ctx.lineTo(x + w * 0.65, vh - h); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  // drifting time-dust
  for (const d of bg.dust) {
    const y = ((d.y * vh - (rm ? 0 : t * 8 * d.z)) % vh + vh) % vh, x = ((d.x * vw + px * d.z) % vw + vw) % vw;
    ctx.globalAlpha = 0.25 + 0.35 * (rm ? 0.5 : (Math.sin(t * 1.5 + d.p) * 0.5 + 0.5));
    ctx.fillStyle = d.z > 0.8 ? th.rim : '#cfd8ff';
    ctx.fillRect(x, y, d.r, d.r);
  }
  ctx.globalAlpha = 1;
}

function drawWalls(ctx, W, th, cam) {
  const e = wallEdges(W);
  for (const s of W.st.walls) {
    const g = ctx.createLinearGradient(0, s.y, 0, s.y + Math.min(s.h, 160));
    g.addColorStop(0, th.wall2); g.addColorStop(1, th.wall);
    ctx.fillStyle = g; ctx.fillRect(s.x, s.y, s.w, s.h);
  }

  ctx.beginPath(); for (const s of W.st.walls) ctx.rect(s.x, s.y, s.w, s.h); ctx.clip();
  ctx.strokeStyle = th.hatch; ctx.lineWidth = 2;
  const x0 = Math.floor((cam.cx - cam.w / 2 / cam.z) / 16) * 16 - 64, x1 = cam.cx + cam.w / 2 / cam.z + 64;
  const y0 = cam.cy - cam.h / 2 / cam.z - 64, y1 = cam.cy + cam.h / 2 / cam.z + 64;
  ctx.beginPath();
  for (let x = x0; x < x1 + (y1 - y0); x += 16) { ctx.moveTo(x, y0); ctx.lineTo(x - (y1 - y0), y1); }
  ctx.stroke();

  ctx.restore();

  ctx.strokeStyle = th.rim; ctx.globalAlpha = 0.28; ctx.lineWidth = 1.5;

  ctx.globalAlpha = 0.25; ctx.lineWidth = 6;
  ctx.beginPath(); for (let i = 0; i < e.top.length; i += 4) { ctx.moveTo(e.top[i], e.top[i + 1] + 1); ctx.lineTo(e.top[i + 2], e.top[i + 3] + 1); } ctx.stroke();

function chBadge(ctx, x, y, ch, extra) {
  const col = CH_COLORS[ch] || '#fff', txt = String(ch) + (extra || '');
  ctx.font = 'bold 10px ' + FONT_MONO;
  const w = Math.max(18, ctx.measureText(txt).width + 10);
  ctx.fillStyle = 'rgba(5,6,16,.85)'; roundRect(ctx, x - w / 2, y - 7, w, 14, 7); ctx.fill();

}

function drawGoal(ctx, g, t, rm) {
  const cx = g.x + g.w / 2;
  const grd = ctx.createLinearGradient(0, g.y, 0, g.y + g.h);
  grd.addColorStop(0, 'rgba(255,241,160,0)'); grd.addColorStop(1, 'rgba(255,241,160,0.28)');

  }

  ctx.fillText('EXIT', cx, g.y - 3);
}

function drawDoor(ctx, d, W, alpha) {
  const col = CH_COLORS[d.ch] || '#fff';
  const o = d.po + (d.o - d.po) * alpha;
  const r = doorRect(d, o);
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.strokeRect(d.x + 0.5, d.y + 0.5, d.w - 1, d.h - 1); ctx.setLineDash([]);
  if (r) {
    ctx.fillStyle = '#2c3358'; ctx.fillRect(r.x + 2, r.y, r.w - 4, r.h);
    ctx.save(); ctx.beginPath(); ctx.rect(r.x + 2, r.y, r.w - 4, r.h); ctx.clip();
    ctx.strokeStyle = col; ctx.globalAlpha = 0.55; ctx.lineWidth = 3;

  }

}

function drawPlate(ctx, p) {

function drawSwitch(ctx, s, t) {

function drawTimer(ctx, tm) {

  } else { ctx.fillStyle = '#7d86b8'; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill(); }

function drawLift(ctx, l, alpha, t) {

function drawSpikes(ctx, s) {
  ctx.fillStyle = '#c9d0ee';
  const hz = s.hz, n = Math.max(1, Math.round((s.dir % 2 === 0 ? s.w : s.h) / 10));
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    if (s.dir === 0) { const w = s.w / n, x = s.x + i * w, b = s.y + s.h; ctx.moveTo(x, b); ctx.lineTo(x + w / 2, b - 14); ctx.lineTo(x + w, b); }
    else if (s.dir === 2) { const w = s.w / n, x = s.x + i * w; ctx.moveTo(x, s.y); ctx.lineTo(x + w / 2, s.y + 14); ctx.lineTo(x + w, s.y); }
    else if (s.dir === 1) { const h = s.h / n, y = s.y + i * h; ctx.moveTo(s.x, y); ctx.lineTo(s.x + 14, y + h / 2); ctx.lineTo(s.x, y + h); }
    else { const h = s.h / n, y = s.y + i * h, r = s.x + s.w; ctx.moveTo(r, y); ctx.lineTo(r - 14, y + h / 2); ctx.lineTo(r, y + h); }
  }

  ctx.strokeStyle = 'rgba(255,77,109,.7)'; ctx.lineWidth = 1; ctx.stroke();
  void hz;

function drawLaser(ctx, L, W, t) {
  const cx = L.x + T / 2, cy = L.y + T / 2, [dx, dy] = DIRV[L.dir];
  const sx = cx + dx * T / 2, sy = cy + dy * T / 2, ex = sx + dx * L.len, ey = sy + dy * L.len;
  const rf = Settings.reducedFlash;
  let warn = 0;
  if (L.mode === 'pulse') { const ph = (W.tick + L.ph) % L.per; if (!L.on && L.per - ph <= 20) warn = 1 - (L.per - ph) / 20; }
  if (L.on) {
    const fl = rf ? 1 : 0.85 + 0.15 * Math.sin(t * 60);
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(255,60,90,' + (0.25 * fl) + ')'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,90,120,' + (0.8 * fl) + ')'; ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.lineCap = 'butt';
    if (!rf) { ctx.fillStyle = 'rgba(255,200,210,.9)'; ctx.beginPath(); ctx.arc(ex, ey, 3 + Math.random() * 2, 0, Math.PI * 2); ctx.fill(); }
  } else {
    ctx.strokeStyle = warn ? 'rgba(255,90,120,' + (0.35 + 0.55 * warn) + ')' : 'rgba(255,110,140,.38)';
    ctx.lineWidth = warn ? 2.5 : 1.5; ctx.setLineDash([3, 6]);

  ctx.fillStyle = L.on ? '#ff5a78' : '#6d2233'; ctx.fillRect(6, -6, 8, 12);
  ctx.restore();
  if (L.mode === 'pulse') {
    const ph = (W.tick + L.ph) % L.per, rem = L.on ? (L.onT - ph) / L.onT : (L.per - ph) / (L.per - L.onT);
    ctx.strokeStyle = L.on ? '#ff5a78' : '#9aa3d0'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 14, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * clamp(rem, 0, 1)); ctx.stroke();

}

function drawCrate(ctx, c, alpha) {
  if (c.gone) return;
  const x = c.px + (c.x - c.px) * alpha, y = c.py + (c.y - c.py) * alpha;
  const g = ctx.createLinearGradient(x, y, x, y + c.h);
  g.addColorStop(0, '#d99b5c'); g.addColorStop(1, '#8a5528');
  ctx.fillStyle = g; roundRect(ctx, x, y, c.w, c.h, 3); ctx.fill();
  ctx.strokeStyle = '#4a2a10'; ctx.lineWidth = 2; ctx.strokeRect(x + 3, y + 3, c.w - 6, c.h - 6);
  ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + c.w - 4, y + c.h - 4); ctx.moveTo(x + c.w - 4, y + 4); ctx.lineTo(x + 4, y + c.h - 4); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,230,190,.5)'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, c.w - 1, c.h - 1);
}

function drawActor(ctx, a, alpha, color, isPlayer, label, divergence, t) {
  const x = a.px + (a.x - a.px) * alpha, y = a.py + (a.y - a.py) * alpha;
  const deadFor = a.dead ? 1 : 0;
  if (deadFor && !isPlayer) {
    ctx.globalAlpha = 0.35; ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 4, y + 8); ctx.lineTo(x + a.w - 4, y + a.h - 4); ctx.moveTo(x + a.w - 4, y + 8); ctx.lineTo(x + 4, y + a.h - 4); ctx.stroke();
    ctx.globalAlpha = 1; return;
  }
  if (deadFor) return;
  let jx = 0;
  if (divergence && !Settings.reducedMotion) jx = Math.sin(t * 70) * 1.5;
  const sq = FX.land[a.idx] || 0;
  const w = a.w * (1 + sq * 0.18), h = a.h * (1 - sq * 0.14), bx = x + (a.w - w) / 2 + jx, by = y + (a.h - h);
  const moving = Math.abs(a.vx) > 0.3 && a.gr;
  const ph = moving ? Math.sin(x * 0.28) : 0;
  ctx.save();
  if (!isPlayer) ctx.globalAlpha = 0.78;
  // legs
  ctx.fillStyle = isPlayer ? '#cfe9ff' : color;
  ctx.fillRect(bx + 4, by + h - 7 + Math.max(0, ph) * 2, 5, 7 - Math.max(0, ph) * 2);
  ctx.fillRect(bx + w - 9, by + h - 7 + Math.max(0, -ph) * 2, 5, 7 - Math.max(0, -ph) * 2);
  // body + hood
  const body = ctx.createLinearGradient(bx, by, bx, by + h);
  if (isPlayer) { body.addColorStop(0, '#ffffff'); body.addColorStop(1, color); }
  else { body.addColorStop(0, color); body.addColorStop(1, 'rgba(20,20,40,.6)'); }
  ctx.fillStyle = body; roundRect(ctx, bx, by, w, h - 6, 9); ctx.fill();
  // visor
  const f = a.face;
  ctx.fillStyle = '#0a0d24'; roundRect(ctx, bx + 3 + (f > 0 ? 3 : 0), by + 7, w - 9, 7, 3.5); ctx.fill();
  ctx.fillStyle = isPlayer ? PLAYER_COLOR : color;
  ctx.fillRect(bx + (f > 0 ? w - 9 : 5), by + 9, 4, 3);
  if (!isPlayer) {
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#000';
    for (let yy = by + 1; yy < by + h - 7; yy += 3) ctx.fillRect(bx + 1, yy, w - 2, 1);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = color; ctx.setLineDash([3, 2]); ctx.lineWidth = 1.5; roundRect(ctx, bx, by, w, h - 6, 9); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, bx + w / 2, by + h * 0.62);
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.2; roundRect(ctx, bx, by, w, h - 6, 9); ctx.stroke();
  }
  if (divergence) {
    ctx.strokeStyle = '#ff4d6d'; ctx.lineWidth = 2.5; roundRect(ctx, bx - 3, by - 3, w + 6, h, 10); ctx.stroke();
    ctx.fillStyle = '#ff4d6d'; ctx.beginPath(); ctx.arc(bx + w / 2, by - 14, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('!', bx + w / 2, by - 13.5);
  }
  ctx.restore();
}

function wrapText(ctx, text, maxW) {
  const words = String(text).split(/\s+/), lines = []; let line = '';
  for (const w of words) { const tl = line ? line + ' ' + w : w; if (ctx.measureText(tl).width > maxW && line) { lines.push(line); line = w; } else line = tl; }
  if (line) lines.push(line);
  return lines.slice(0, 6);
}
function bubble(ctx, sx, sy, lines, color, vw) {
  ctx.font = '600 12.5px ' + FONT_UI;
  const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 18, h = lines.length * 16 + 12;
  const x = clamp(sx - w / 2, 6, vw - w - 6), y = sy - h - 10;
  ctx.fillStyle = 'rgba(8,10,28,.9)'; roundRect(ctx, x, y, w, h, 8); ctx.fill();
  ctx.strokeStyle = color || 'rgba(127,246,255,.6)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#eaf0ff'; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, x + 9, y + 7 + i * 16));
}

// Main scene render. opts: {alpha, sess, preview, diag, echoInfo, player index, editor}
function renderScene(ctx, vw, vh, W, cam, opts) {
  const L = W.L, th = THEMES[L.theme % THEMES.length], t = FX.time, alpha = opts.alpha === undefined ? 1 : opts.alpha;
  const sess = opts.sess, n = W.actors.length - 1;
  drawBackground(ctx, vw, vh, L, cam, opts.progress || 0, opts.echoCount || 0);
  ctx.save();
  let sx = 0, sy = 0;
  if (FX.shake > 0 && !Settings.reducedMotion) { sx = (Math.random() - 0.5) * FX.shake; sy = (Math.random() - 0.5) * FX.shake; }
  ctx.translate(Math.round(vw / 2 + sx), Math.round(vh / 2 + sy)); ctx.scale(cam.z, cam.z); ctx.translate(-cam.cx, -cam.cy);
  // level frame
  ctx.fillStyle = 'rgba(3,4,14,.5)'; ctx.fillRect(0, 0, W.Wpx, W.Hpx);
  for (const g of W.st.goals) drawGoal(ctx, g, t, Settings.reducedMotion);
  for (const s of W.st.signs) {
    ctx.fillStyle = '#39406a'; ctx.fillRect(s.x + T / 2 - 1.5, s.y + 12, 3, T - 12);
    ctx.fillStyle = '#1c2250'; roundRect(ctx, s.x + 4, s.y + 2, T - 8, 14, 3); ctx.fill();
    ctx.strokeStyle = '#7ff6ff'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#7ff6ff'; ctx.font = 'bold 10px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('i', s.x + T / 2, s.y + 9.5);
  }
  drawWalls(ctx, W, th, cam);
  for (const o of W.st.oneways) {
    ctx.fillStyle = '#3d4680'; ctx.fillRect(o.x, o.y, o.w, 5);
    ctx.fillStyle = th.rim; ctx.fillRect(o.x, o.y, o.w, 2);
    ctx.strokeStyle = 'rgba(160,170,255,.35)'; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = o.x + 8; x < o.x + o.w; x += 16) { ctx.moveTo(x, o.y + 5); ctx.lineTo(x - 4, o.y + 10); ctx.moveTo(x, o.y + 5); ctx.lineTo(x + 4, o.y + 10); }
    ctx.stroke();
  }
  for (const s of W.st.spikes) drawSpikes(ctx, s);
  for (const p of W.plates) drawPlate(ctx, p);
  for (const s of W.switches) drawSwitch(ctx, s, t);
  for (const tm of W.timers) drawTimer(ctx, tm);
  for (const l of W.lifts) drawLift(ctx, l, alpha, t);
  for (const d of W.doors) drawDoor(ctx, d, W, alpha);
  // echo intent: upcoming recorded path + interaction markers
  if (sess && Settings.futurePaths && !opts.editor) {
    const tk = W.tick;
    sess.echoes.forEach((e, i) => {
      const a = W.actors[i]; if (!a || a.dead) return;
      const col = ECHO_COLORS[i % ECHO_COLORS.length];
      ctx.strokeStyle = col; ctx.globalAlpha = 0.45; ctx.lineWidth = 1.5; ctx.setLineDash([2, 5]);
      ctx.beginPath(); let first = true;
      for (let k = tk; k < Math.min(e.len, tk + 120); k += 3) { const px = e.track[2 * k] + a.w / 2, py = e.track[2 * k + 1] + a.h / 2; if (first) { ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py); }
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      for (const [et, type] of e.events) if (et >= tk && et < tk + 180) {
        const px = e.track[2 * et] + a.w / 2, py = e.track[2 * et + 1] - 8;
        ctx.fillStyle = col; ctx.globalAlpha = 1 - (et - tk) / 200;
        ctx.save(); ctx.translate(px, py); ctx.rotate(Math.PI / 4); ctx.fillRect(-4, -4, 8, 8); ctx.restore();
        ctx.font = 'bold 9px system-ui'; ctx.textAlign = 'center'; ctx.fillText(type, px, py - 9); ctx.globalAlpha = 1;
      }
      const dv = sess.div[i];
      if (dv && e.len > tk) { // ghost of where it should be
        const gx = e.track[2 * tk], gy = e.track[2 * tk + 1];
        ctx.strokeStyle = '#ff4d6d'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.5; roundRect(ctx, gx, gy, a.w, a.h - 6, 9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(gx + a.w / 2, gy + a.h / 2); ctx.lineTo(a.x + a.w / 2, a.y + a.h / 2); ctx.stroke(); ctx.setLineDash([]);
      }
    });
  }
  // trails
  if (!opts.editor) FX.trails.forEach((tr, i) => {
    if (!tr || tr.length < 4 || i > n) return;
    const col = i === n ? PLAYER_COLOR : ECHO_COLORS[i % ECHO_COLORS.length];
    for (let k = 2; k < tr.length; k += 2) {
      ctx.strokeStyle = col; ctx.globalAlpha = (k / tr.length) * (i === n ? 0.35 : 0.5); ctx.lineWidth = 3 * (k / tr.length);
      ctx.beginPath(); ctx.moveTo(tr[k - 2], tr[k - 1]); ctx.lineTo(tr[k], tr[k + 1]); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });
  for (const c of W.crates) if (!c.by) drawCrate(ctx, c, alpha);
  for (let i = 0; i < W.actors.length; i++) {
    const a = W.actors[i], isP = i === n && !opts.editor;
    const col = isP ? PLAYER_COLOR : ECHO_COLORS[i % ECHO_COLORS.length];
    drawActor(ctx, a, alpha, col, isP, String(i + 1), sess && sess.div[i] && !isP, t);
    if (a.carry) { const c = crateById(W, a.carry); if (c) drawCrate(ctx, c, alpha); }
  }
  for (const L2 of W.lasers) drawLaser(ctx, L2, W, t);
  // particles
  for (const p of FX.particles) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1;
  if (opts.diag) drawDiagnostics(ctx, W, sess, cam);
  ctx.restore();
  // screen-space prompts
  if (!opts.editor && !opts.preview && sess && sess.state === 'play') drawPrompts(ctx, W, cam, vw, vh);
  // vignette
  const vg = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.35, vw / 2, vh / 2, Math.max(vw, vh) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, vw, vh);
  if (FX.flash > 0 && !Settings.reducedFlash) { ctx.fillStyle = 'rgba(255,80,110,' + FX.flash * 0.5 + ')'; ctx.fillRect(0, 0, vw, vh); }
}

function toScreen(cam, vw, vh, x, y) { return [(x - cam.cx) * cam.z + vw / 2, (y - cam.cy) * cam.z + vh / 2]; }

function drawPrompts(ctx, W, cam, vw, vh) {
  const p = W.actors[W.actors.length - 1]; if (!p || p.dead) return;
  const pcx = p.x + p.w / 2, pcy = p.y;
  let text = null;
  const I = Input.label('interact'), X = Input.label('throw');
  if (p.carry) text = I + ' drop  ·  ' + X + ' throw';
  else {
    const ar = { x: p.x - 4, y: p.y, w: p.w + 8, h: p.h };
    if (W.switches.some(s => overlap(ar, { x: s.x, y: s.y, w: T, h: T }))) text = I + ' toggle lever';
    else if (W.timers.some(s => overlap(ar, { x: s.x, y: s.y, w: T, h: T }))) text = I + ' press timer';
    else { const reach = { x: p.x - 12, y: p.y - 6, w: p.w + 24, h: p.h + 8 }; if (W.crates.some(c => !c.by && !c.gone && overlap(reach, c))) text = I + ' pick up crate'; }
    if (!text && p.onOw) text = Input.label('down') + ' + ' + Input.label('jump') + ' drop through';
  }
  for (const s of W.st.signs) {
    const d = Math.hypot(s.x + T / 2 - pcx, s.y + T / 2 - (p.y + p.h / 2));
    if (d < T * 2.6) {
      ctx.font = '600 12.5px ' + FONT_UI;
      const [sx, sy] = toScreen(cam, vw, vh, s.x + T / 2, s.y - 2);
      bubble(ctx, sx, Math.max(sy, 120), wrapText(ctx, s.text, Math.min(300, vw * 0.7)), null, vw);
    }
  }
  // action prompt goes under the feet so it never hides behind a sign bubble
  if (text) { const [sx, sy] = toScreen(cam, vw, vh, pcx, p.y + p.h); bubble(ctx, sx, Math.min(vh - 4, sy + 46), [text], 'rgba(255,209,102,.7)', vw); }
}

function drawDiagnostics(ctx, W, sess, cam) {
  const lw = 1 / cam.z;
  ctx.lineWidth = Math.max(lw, 1);
  ctx.font = (10 / Math.max(cam.z, 0.6)).toFixed(1) + 'px ' + FONT_MONO;
  ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
  ctx.strokeStyle = 'rgba(127,246,255,.35)';
  for (const s of W.st.walls) ctx.strokeRect(s.x, s.y, s.w, s.h);
  ctx.strokeStyle = 'rgba(160,170,255,.8)';
  for (const o of W.st.oneways) ctx.strokeRect(o.x, o.y, o.w, o.h);
  ctx.strokeStyle = '#ff4d6d';
  for (const s of W.st.spikes) ctx.strokeRect(s.hz.x, s.hz.y, s.hz.w, s.hz.h);
  for (const L of W.lasers) if (L.on) { const r = beamRect(L); ctx.strokeRect(r.x, r.y, r.w, r.h); }
  ctx.strokeStyle = '#ffd166';
  for (const p of W.plates) ctx.strokeRect(p.x + 1, p.y + T - 6, p.w - 2, 6);
  ctx.strokeStyle = '#74f2a6';
  for (const g of W.st.goals) ctx.strokeRect(g.x, g.y, g.w, g.h);
  for (const d of W.doors) { const r = doorRect(d); if (r) { ctx.strokeStyle = '#fff'; ctx.strokeRect(r.x, r.y, r.w, r.h); } }
  for (const l of W.lifts) { ctx.strokeStyle = l.blk ? '#ff4d6d' : '#fff'; ctx.strokeRect(l.x, l.y, l.w, l.h); }
  for (const c of W.crates) if (!c.gone) { ctx.strokeStyle = '#ffb347'; ctx.strokeRect(c.x, c.y, c.w, c.h); }
  const n = W.actors.length - 1;
  for (const a of W.actors) {
    if (a.dead) continue;
    const r = R(a);
    ctx.strokeStyle = a.idx === n ? '#7ff6ff' : ECHO_COLORS[a.idx % 8]; ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = '#ff4d6d'; ctx.strokeRect(a.x + 3, a.y + 4, a.w - 6, a.h - 6);
    if (a.gr) { ctx.strokeStyle = '#74f2a6'; ctx.lineWidth = 3 * lw; ctx.beginPath(); ctx.moveTo(a.x, a.y + a.h + 2); ctx.lineTo(a.x + a.w, a.y + a.h + 2); ctx.stroke(); ctx.lineWidth = Math.max(lw, 1); }
    ctx.fillStyle = '#fff';
    ctx.fillText((a.idx === n ? 'P' : 'E' + (a.idx + 1)) + (a.gr ? ' G' : ' air') + ' c' + a.coy + ' b' + a.jb + (a.drift ? ' Δ' + a.drift.toFixed(1) : ''), r.x, r.y - 2);
    // velocity vector
    ctx.strokeStyle = '#e9ff70'; ctx.beginPath(); ctx.moveTo(a.x + a.w / 2, a.y + a.h / 2); ctx.lineTo(a.x + a.w / 2 + a.vx * 6, a.y + a.h / 2 + a.vy * 6); ctx.stroke();
  }
  // contact normals
  ctx.strokeStyle = '#ff9df0'; ctx.fillStyle = '#ff9df0';
  for (const c of W.contacts) {
    ctx.beginPath(); ctx.moveTo(c.x, c.y); ctx.lineTo(c.x + c.nx * 12, c.y + c.ny * 12); ctx.stroke();
    ctx.fillRect(c.x - 1.5, c.y - 1.5, 3, 3);
  }
  // ids + channels
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  const lab = (o, s, x, y) => ctx.fillText('#' + o.id + (s ? ' ' + s : ''), x, y);
  for (const p of W.plates) lab(p, 'ch' + p.ch + (p.on ? ' ON n' + p.n : ''), p.x, p.y + T - 8);
  for (const s of W.switches) lab(s, 'ch' + s.ch + (s.on ? ' ON' : ''), s.x, s.y);
  for (const s of W.timers) lab(s, 'ch' + s.ch + ' ' + s.left, s.x, s.y);
  for (const d of W.doors) lab(d, 'ch' + d.ch + ' ' + W.ch[d.ch] + '/' + d.need + ' o' + d.o, d.x, d.y + d.h + 12);
  for (const l of W.lifts) lab(l, (l.mode === 'channel' ? 'ch' + l.ch : 'loop') + ' s' + l.s.toFixed(1), l.x, l.y - 2);
  for (const L of W.lasers) lab(L, L.mode + (L.mode === 'channel' ? ' ch' + L.ch : '') + (L.on ? ' ON' : ''), L.x, L.y);
  for (const c of W.crates) lab(c, c.by ? 'held' : '', c.x, c.y - 2);
  if (sess) sess.echoes.forEach((e, i) => {
    const tk = W.tick; if (tk >= e.len) return;
    const a = W.actors[i]; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.setLineDash([2, 2]);
    ctx.strokeRect(e.track[2 * tk], e.track[2 * tk + 1], a.w, a.h); ctx.setLineDash([]);
  });
}
// ================= UI: HUD, timeline, overlays, modals, touch =================
const UI = {
  toast(msg, kind, ms) {
    const box = $('#toast');
    const t = el('div', { class: 'toast ' + (kind || '') }, msg);
    box.append(t);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => t.remove(), ms || 3200);
  },
  banner(t1, t2, t3, ms) {
    const b = $('#banner');
    b.querySelector('.t1').textContent = t1; b.querySelector('.t2').textContent = t2; b.querySelector('.t3').textContent = t3 || '';
    b.classList.add('show');
    clearTimeout(this._bt); this._bt = setTimeout(() => b.classList.remove('show'), ms || 3200);
  },
};

// ---------------- modal system (no window.alert/confirm/prompt) ----------------
const Modal = {
  open: false, onClose: null,
  show(build, onClose) {
    const card = $('#modalcard'); card.innerHTML = '';
    build(card);
    $('#modal').classList.add('show'); this.open = true; this.onClose = onClose || null;
    Input.releaseAll();
    setTimeout(() => { const f = card.querySelector('[data-autofocus]') || card.querySelector('button, input, textarea, select'); if (f) f.focus(); }, 20);
  },
  close() {
    if (!this.open) return;
    $('#modal').classList.remove('show'); this.open = false;
    const cb = this.onClose; this.onClose = null; if (cb) cb();
    const cv = $('#cv'); if (cv && App.mode === 'play') cv.focus({ preventScroll: true });
  },
  confirm(title, msg, okLabel, onOk, danger) {
    this.show(c => {
      c.append(el('h2', { id: 'modaltitle' }, title), el('div', { class: 'sub' }, msg),
        el('div', { class: 'row end' }, el('button', { class: 'btn', onclick: () => Modal.close() }, 'Cancel'),
          el('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), 'data-autofocus': true, onclick: () => { Modal.close(); onOk(); } }, okLabel)));
    });
  },
};
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') Modal.close(); });

// ---------------- top bar ----------------
function mkBtn(id, ic, label, key, onclick, title, iconOnly) {
  const b = el('button', { class: 'btn' + (iconOnly ? ' io' : ''), id, title: (title || label) + (key ? ' [' + key + ']' : ''), 'aria-label': title || label, onclick });
  b.innerHTML = icon(ic) + '<span class="lbl"></span>' + (key ? '<span class="k"></span>' : '');
  b.querySelector('.lbl').textContent = label;
  if (key) b.querySelector('.k').textContent = key;
  b.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') setTimeout(() => b.blur(), 0); });
  return b;
}
function buildPlayBar() {
  const bar = $('#playbar'); bar.innerHTML = '';
  const k = a => Input.label(a);
  bar.append(
    mkBtn('b-back', 'edit', 'Back to editor', k('editor'), () => App.command('editor')),
    mkBtn('b-pause', 'pause', 'Pause', k('pause'), () => App.command('pause')),
    mkBtn('b-rewind', 'loop', 'Rewind', k('rewind'), () => App.command('rewind'), 'Rewind: keep this loop as an echo'),
    mkBtn('b-retry', 'retry', 'Retry', k('retry'), () => App.command('retry'), 'Retry loop without keeping it'),
    mkBtn('b-undo', 'undo', 'Undo echo', k('undo'), () => App.command('undo')),
    mkBtn('b-clear', 'clear', 'Clear', k('clear'), () => App.command('clear'), 'Clear all echoes'),
    mkBtn('b-restart', 'restart', 'Restart', '', () => App.command('restart'), 'Restart level', true),
    el('span', { class: 'sep' }),
    mkBtn('b-slow', 'slow', '1×', k('slow'), () => App.command('slow'), 'Slow motion (cycles 1× · ½× · ¼×)'),
    mkBtn('b-step', 'step', 'Step', k('step'), () => App.command('step'), 'Frame step (pauses)', true),
    mkBtn('b-diag', 'diag', 'Diag', k('diag'), () => App.command('diag'), 'Diagnostics overlay', true),
    el('span', { class: 'sep' }),
    mkBtn('b-levels', 'grid', 'Levels', k('levels'), () => App.command('levels'), 'Level select', true),
    mkBtn('b-editor', 'edit', 'Editor', k('editor'), () => App.command('editor'), 'Level editor', true),
    mkBtn('b-settings', 'gear', 'Settings', '', () => showSettings(), 'Settings', true),
    mkBtn('b-help', 'help', 'Help', k('help'), () => App.command('help'), 'Help & controls', true),
    mkBtn('b-sound', Settings.mute ? 'mute' : 'sound', '', '', () => { Settings.mute = !Settings.mute; saveSettings(); buildPlayBar(); Sound.init(); }, Settings.mute ? 'Unmute' : 'Mute', true),
  );
  syncPlayBar();
}
function syncPlayBar() {
  const s = App.sess; if (!s) return;
  const b = id => document.getElementById(id);
  const back = b('b-back'); if (back) back.style.display = App.levelRef && App.levelRef.kind === 'playtest' ? '' : 'none';
  if (back) back.classList.add('primary');
  const p = b('b-pause'); if (p) { p.innerHTML = icon(App.paused ? 'play' : 'pause') + '<span class="lbl">' + (App.paused ? 'Resume' : 'Pause') + '</span><span class="k"></span>'; p.querySelector('.k').textContent = Input.label('pause'); p.setAttribute('aria-pressed', App.paused ? 'true' : 'false'); p.setAttribute('aria-label', App.paused ? 'Resume' : 'Pause'); }
  const u = b('b-undo'); if (u) u.disabled = !s.echoes.length;
  const c = b('b-clear'); if (c) c.disabled = !s.echoes.length;
  const sl = b('b-slow'); if (sl) { sl.querySelector('.lbl').textContent = App.speed === 1 ? '1×' : App.speed === 0.5 ? '½×' : '¼×'; sl.setAttribute('aria-pressed', App.speed !== 1 ? 'true' : 'false'); }
  const d = b('b-diag'); if (d) d.setAttribute('aria-pressed', App.diag ? 'true' : 'false');
  const r = b('b-rewind'); if (r) r.disabled = !!s.watch;
}

// ---------------- live stats overlay ----------------
function updateStats() {
  const box = $('#stats');
  if (Settings.statsMode === 'off') { box.style.display = 'none'; return; }
  box.style.display = '';
  const compact = Settings.statsMode === 'compact' || (Settings.statsMode === 'auto' && App.vw < 560);
  box.classList.toggle('min', compact);
  const lines = [];
  const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  const fps = App.fps.toFixed(0);
  if (App.mode === 'editor') {
    const ed = Editor;
    lines.push('<span class="m">FPS</span> ' + fps + '  <span class="m">EDITOR</span>');
    lines.push('<span class="m">level</span> ' + esc(ed.L.name) + ' <span class="m">' + ed.L.w + '×' + ed.L.h + '</span>');
    lines.push('<span class="m">loop</span> ' + ed.L.loop + ' s  <span class="m">objects</span> ' + ed.L.objects.length);
    lines.push('<span class="m">tool</span> ' + esc(Editor.toolName()) + '  <span class="m">sel</span> ' + ed.sel.size);
    const errs = ed.issues.filter(i => i.sev === 'error').length, warns = ed.issues.length - errs;
    lines.push('<span class="m">validation</span> ' + (errs ? '<span class="d">' + errs + ' error(s)</span>' : '<span class="g">ok</span>') + (warns ? ' <span class="w">' + warns + ' warn</span>' : ''));
    lines.push('<span class="m">pause</span> editing (sim stopped)');
    box.innerHTML = lines.join('\n');
    return;
  }
  const s = App.sess; if (!s) return;
  const W = s.W, p = W.actors[s.n];
  const tick = App.previewTick !== null && App.paused ? App.previewTick : W.tick;
  const left = Math.max(0, s.loopTicks - tick);
  const alive = s.echoes.filter((e, i) => !W.actors[i].dead).length;
  const dv = s.div.map((d, i) => d ? { d, i } : null).filter(Boolean);
  let state = 'idle';
  if (p.dead) state = 'dead (' + p.cause + ')';
  else { state = !p.gr ? (p.vy < 0 ? 'jump' : 'fall') : Math.abs(p.vx) > 0.3 ? (p.push ? 'push' : 'run') : 'idle'; if (p.carry) state += '+carry'; }
  const act = [];
  for (let ch = 1; ch <= 8; ch++) if (W.ch[ch]) act.push('<span style="color:' + CH_COLORS[ch] + '">ch' + ch + '×' + W.ch[ch] + '</span>');
  const lv = App.levelRef;
  const lvName = (lv && lv.kind === 'builtin' ? 'L' + (lv.index + 1) + ' ' : lv && lv.kind === 'playtest' ? 'TEST ' : lv && lv.kind === 'trace' ? 'TRACE ' : '') + s.L.name;
  lines.push('<span class="m">FPS</span> ' + fps + '<span class="x">  <span class="m">sim</span> ' + App.simMs.toFixed(2) + 'ms</span>');
  lines.push('<span class="m">level</span> ' + esc(lvName));
  lines.push('<span class="m">loop</span> #' + (s.n + 1) + ' <span class="m">of max</span> ' + (s.L.maxEchoes + 1) + '<span class="x">  <span class="m">t</span> ' + fmt(tick) + 's</span>');

const TL = {
  cv: null, ctx: null, w: 0, h: 64, gutter: 58, dragging: false,
  init() {
    this.cv = $('#tlcv'); this.ctx = this.cv.getContext('2d');
    const cv = this.cv;
    const tickAt = e => { const r = cv.getBoundingClientRect(); const x = e.clientX - r.left; return clamp(Math.round((x - this.gutter) / (r.width - this.gutter - 8) * App.sess.loopTicks), 0, App.sess.loopTicks); };
    cv.addEventListener('pointerdown', e => {
      if (!App.sess || App.mode !== 'play') return;
      const r = cv.getBoundingClientRect();
      if (e.clientX - r.left < this.gutter) {
        const lane = Math.floor((e.clientY - r.top - 18) / this.laneH());
        if (lane >= 1 && lane <= App.sess.n) UI.toast('Echo ' + lane + ' is locked: editing a recorded echo would silently desync every later echo. Use Undo echo or Clear instead.', 'warn', 4200);
        return;
      }
      cv.setPointerCapture(e.pointerId); this.dragging = true;
      if (!App.paused) App.setPaused(true);
      App.setPreview(tickAt(e));
    });
    cv.addEventListener('pointermove', e => { if (this.dragging) App.setPreview(tickAt(e)); });
    const end = e => { this.dragging = false; try { cv.releasePointerCapture(e.pointerId); } catch (err) { /* already released */ } };
    cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('lostpointercapture', () => { this.dragging = false; });
  },
  laneH() { const n = App.sess ? App.sess.n + 1 : 1; return n > 4 ? 10 : 13; },
  head() {
    const s = App.sess, h = $('#tlhead'); if (!s) return;
    const tick = App.previewTick !== null && App.paused ? App.previewTick : s.W.tick;
    const pv = App.previewTick !== null && App.paused;
    const key = [tick, s.W.tick, pv, App.paused, s.n, s.loopTicks, App.speed, s.cur.len].join('|');
    if (key === this._hk) return; this._hk = key;
    h.innerHTML = '';
    h.append(el('span', { class: 'big' }, 'Loop ' + (s.n + 1)),
      el('span', null, fmt(tick) + ' / ' + fmt(s.loopTicks) + ' s'),
      el('span', { class: 'left' }, fmt(Math.max(0, s.loopTicks - tick)) + ' s left'));
    if (pv) h.append(el('span', { style: 'color:var(--warn)' }, tick > s.W.tick ? 'FORECAST (you idle)' : 'PREVIEW'));
    h.append(el('span', { class: 'grow' }));
    if (App.paused) {
      const back = mkBtn('tl-back', 'back', '', Input.label('stepBack'), () => App.command('stepBack'), 'Scrub back one tick');
      const fwd = mkBtn('tl-step', 'step', '', Input.label('step'), () => App.command('step'), 'Step forward one tick');
      const here = el('button', { class: 'btn', id: 'tl-here', title: 'Resume recording this loop from the previewed moment (checkpoint). Echo tapes are never changed.', onclick: () => App.resumeHere() }, '⟲ Resume from here');

      live.disabled = !pv;
      h.append(back, fwd, here, live);
    } else h.append(el('span', { class: 'm', style: 'color:var(--dim)' }, 'pause (' + Input.label('pause') + ') or click here to scrub'));
  },
  draw() {
    const s = App.sess; if (!s) return;
    const cv = this.cv, dpr = window.devicePixelRatio || 1;
    const lh = this.laneH(), lanes = s.n + 1, h = 20 + lanes * lh + 4;
    const cw = cv.clientWidth;
    if (cv.style.height !== h + 'px') cv.style.height = h + 'px';
    if (cv.width !== Math.round(cw * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(cw * dpr); cv.height = Math.round(h * dpr); }

    g.clearRect(0, 0, cw, h);
    const G = this.gutter, W0 = cw - G - 8, LT = s.loopTicks, X = t => G + t / LT * W0;

    const secs = LT / TPS, stepS = secs > 30 ? 5 : secs > 12 ? 2 : 1;

        g.save(); g.translate(x, yc); g.rotate(Math.PI / 4); g.fillRect(-3.5, -3.5, 7, 7); g.restore();
        g.strokeStyle = '#000'; g.lineWidth = 0.8; g.save(); g.translate(x, yc); g.rotate(Math.PI / 4); g.strokeRect(-3.5, -3.5, 7, 7); g.restore();
      }
      if (!isLive && len < LT) { g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(X(len), y + (lh - 3) / 2, W0 - (X(len) - G), 1); g.fillStyle = '#69719c'; g.font = '8px ' + FONT_MONO; g.textAlign = 'left'; g.fillText('idle', X(len) + 3, y + 1); g.textAlign = 'center'; }

      g.fillStyle = 'rgba(255,255,255,.035)'; g.fillRect(G, y, W0, lh - 1);
      g.textAlign = 'left'; g.font = 'bold 10px ' + FONT_MONO;
      g.fillStyle = col; g.fillRect(4, y + lh / 2 - 1, 7, 5); g.strokeStyle = col; g.lineWidth = 1.2; g.beginPath(); g.arc(7.5, y + lh / 2 - 1.5, 2.3, Math.PI, 0); g.stroke(); g.fillText('E' + (i + 1), 14, y + lh / 2);

    }
    const y0 = laneY(0);
    g.fillStyle = 'rgba(127,246,255,.08)'; g.fillRect(G, y0, W0, lh - 1);
    g.fillStyle = PLAYER_COLOR; g.textBaseline = 'middle'; g.textAlign = 'left'; g.font = 'bold 10px ' + FONT_MONO; g.fillText('YOU', 4, y0 + lh / 2);

// ---------------- touch controls ----------------
function buildTouch() {
  const box = $('#touch'); box.innerHTML = '';
  const mk = (action, ic, label, big) => {
    const b = el('div', { class: 'tb' + (big ? ' big' : ''), role: 'button', 'aria-label': label, 'data-action': action });
    b.innerHTML = icon(ic) + '<small></small>'; b.querySelector('small').textContent = label;
    const ids = new Set();
    const down = e => {
      e.preventDefault(); App.touchActive = true; Sound.init();
      try { b.setPointerCapture(e.pointerId); } catch (err) { /* capture unsupported */ }
      ids.add(e.pointerId); b.classList.add('held');
      if (action === 'rewind' || action === 'pause') { App.command(action); return; }
      Input.touch[action] = (Input.touch[action] || 0) + 1;
      const def = ACTIONS.find(a => a[0] === action); if (def) Input.latch |= def[3];
    };
    const up = e => {
      if (!ids.has(e.pointerId)) return; ids.delete(e.pointerId);
      if (!ids.size) b.classList.remove('held');
      if (action === 'rewind' || action === 'pause') return;
      Input.touch[action] = Math.max(0, (Input.touch[action] || 0) - 1);
    };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
    b.addEventListener('contextmenu', e => e.preventDefault());
    return b;
  };
  box.append(
    el('div', { class: 'tpad' }, mk('left', 'left', 'Left'), mk('down', 'down', 'Down'), mk('right', 'right', 'Right')),
    el('div', { class: 'tpad' }, mk('rewind', 'loop', 'Rewind'), mk('interact', 'hand', 'Grab'), mk('throw', 'throwi', 'Throw'), mk('jump', 'up', 'Jump', true)));
}

    const a = el('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();

      return;
    }
    if (this.paused || Modal.open || s.state !== 'play') return;
    if (s.W.tick === 0 && !s.watch && this.armedW !== s.W) {
      if (!(Input.heldBits() | Input.latch)) { this.acc = 0; return; }
      this.armedW = s.W;
    }
    this.acc += dt * this.speed;
    let n = 0;
    while (this.acc >= 1 / TPS && n < 8) { this.simStep(); this.acc -= 1 / TPS; n++; if (s.state !== 'play' || this.fx.rewind) break; }
    if (n >= 8) this.acc = 0;
    Sound.echoes = s.n; Sound.intensity = s.W.tick / s.loopTicks;
  },
  targetZoom(W) {
    const fit = Math.min(this.vw / W.Wpx, this.vh / W.Hpx) * 0.98;
    const minTile = this.vw < 500 ? 24 : 22;
    return clamp(Math.max(fit, minTile / T), 0.3, 2.2);
  },
  camTarget(W) {
    const z = this.targetZoom(W), hw = this.vw / 2 / z, hh = this.vh / 2 / z;
    const p = W.actors[W.actors.length - 1];
    let tx = W.Wpx / 2, ty = W.Hpx / 2;
    if (p) { tx = p.x + p.w / 2 + p.face * 30; ty = p.y + p.h / 2 - 20; }
    tx = W.Wpx <= hw * 2 ? W.Wpx / 2 : clamp(tx, hw, W.Wpx - hw);
    ty = W.Hpx <= hh * 2 ? W.Hpx / 2 : clamp(ty, hh, W.Hpx - hh);
    return { tx, ty, z };
  },
  snapCamera() { if (!this.sess) return; const c = this.camTarget(this.sess.W); this.cam.cx = c.tx; this.cam.cy = c.ty; this.cam.z = c.z; },
  updateCamera(dt, W) {
    const c = this.camTarget(W), k = 1 - Math.exp(-dt * 6);
    this.cam.cx += (c.tx - this.cam.cx) * k; this.cam.cy += (c.ty - this.cam.cy) * k; this.cam.z += (c.z - this.cam.z) * Math.min(1, k * 1.5);
    this.cam.w = this.vw; this.cam.h = this.vh;
  },
  render() {
    const cv = $('#cv'), ctx = cv.getContext('2d');
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this.mode === 'editor') { Editor.render(ctx, this.vw, this.vh); return; }
    const s = this.sess; if (!s) return;
    let W = s.W, alpha = clamp(this.acc * TPS, 0, 1), preview = false;
    if (this.paused || s.state !== 'play') alpha = 1;
    if (this.fx.rewind) {
      const r = this.fx.rewind, p = clamp(r.t / r.dur, 0, 1), sn = r.snaps;
      W = sn[Math.max(0, Math.round((1 - p) * (sn.length - 1)))].w; alpha = 1;
    } else if (this.paused && this.previewTick !== null) { W = s.previewAt(this.previewTick); preview = true; alpha = 1; }
    this.updateCamera(this._dt || 0.016, W);
    renderScene(ctx, this.vw, this.vh, W, this.cam, { alpha, sess: s, preview, diag: this.diag, progress: W.tick / s.loopTicks, echoCount: s.n });
    const vw = this.vw, vh = this.vh;
    if (this.fx.rewind) {
      const r = this.fx.rewind, p = r.t / r.dur;
      ctx.fillStyle = r.kept ? 'rgba(127,246,255,.10)' : 'rgba(255,111,181,.10)'; ctx.fillRect(0, 0, vw, vh);
      if (!Settings.reducedMotion) { ctx.fillStyle = 'rgba(255,255,255,.06)'; for (let y = (p * 400) % 9; y < vh; y += 9) ctx.fillRect(0, y, vw, 2); }
      ctx.font = '800 ' + Math.min(48, vw / 10) + 'px ' + FONT_UI; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(234,240,255,' + (0.9 - p * 0.5) + ')';
      ctx.fillText(r.kept ? '⟲  ECHO ' + s.n : '⟲  RETRY', vw / 2, vh / 2);
    } else if (preview) {
      ctx.fillStyle = this.previewTick > s.W.tick ? 'rgba(120,90,255,.10)' : 'rgba(255,209,102,.07)'; ctx.fillRect(0, 0, vw, vh);
      ctx.font = '700 13px ' + FONT_MONO; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.fillStyle = '#ffd166';
      ctx.fillText((this.previewTick > s.W.tick ? 'FORECAST ' : 'PREVIEW ') + fmt(this.previewTick) + 's  —  drag the timeline, ' + Input.label('pause') + ' to return live', vw / 2, 10);
    }
    if (!this.fx.rewind && !preview && s.state === 'play' && s.W.tick === 0 && !s.watch && this.armedW !== s.W && !Modal.open) {
      const msg = 'Loop ' + (s.n + 1) + ' is waiting — move or jump to start the clock';
      ctx.font = '700 14px ' + FONT_UI; const tw = ctx.measureText(msg).width + 28;
      ctx.fillStyle = 'rgba(6,8,22,.8)'; roundRect(ctx, vw / 2 - tw / 2, vh - 46, tw, 30, 15); ctx.fill();
      ctx.strokeStyle = 'rgba(127,246,255,.6)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#eaf0ff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(msg, vw / 2, vh - 31);
    }
    if (s.state === 'dying') { ctx.fillStyle = 'rgba(40,0,10,' + (Settings.reducedFlash ? 0.25 : 0.35) + ')'; ctx.fillRect(0, 0, vw, vh); }
    if (s.state === 'won' && !Settings.reducedFlash) { ctx.fillStyle = 'rgba(255,241,160,' + clamp(this.fx.won * 0.2, 0, 0.25) + ')'; ctx.fillRect(0, 0, vw, vh); }
  },
  onResize() {
    const st = $('#stage'), r = st.getBoundingClientRect();
    this.dpr = Math.min(3, window.devicePixelRatio || 1);
    this.vw = Math.max(1, r.width); this.vh = Math.max(1, r.height);
    const cv = $('#cv');
    cv.width = Math.round(this.vw * this.dpr); cv.height = Math.round(this.vh * this.dpr);
    const touch = Settings.touch === 'on' || (Settings.touch === 'auto' && (this.coarse || window.innerWidth < 700));
    if (document.body.classList.contains('touchon') !== touch) { document.body.classList.toggle('touchon', touch); requestAnimationFrame(() => this.onResize()); }
  },
  frame(now) {
    const dt = Math.min(0.1, (now - (this.last || now)) / 1000); this.last = now; this._dt = dt;
    if (dt > 0) this.fps = this.fps * 0.93 + (1 / dt) * 0.07;
    Diag.frames[Diag.fi] = dt * 1000; Diag.fi = (Diag.fi + 1) % 120;
    if (Math.min(3, window.devicePixelRatio || 1) !== this.dpr) this.onResize(); // DPR changes (zoom, monitor move) fire no element resize
    Input.pollGamepad();
    if (this.mode === 'play') this.update(dt);
    FX.update(dt);
    this.render();
    if (this.mode === 'play' && this.sess) { TL.head(); TL.draw(); }
    this.statsT -= dt;
    if (this.statsT <= 0) { this.statsT = 0.1; updateStats(); Diag.update(); }
    this.frames++;
  },
};

function applySettings() {
  document.body.classList.toggle('reduced', Settings.reducedMotion);
  document.body.classList.toggle('hc', Settings.highContrast);
  document.body.classList.toggle('bigui', Settings.bigUI);
  Sound.apply();
  App.onResize();
}

// ---------------- keyboard ----------------
window.addEventListener('keydown', e => {
  Sound.init();
  const code = codeOf(e);
  if (Input.capture) { e.preventDefault(); e.stopPropagation(); Input.capture(code); return; }
  if (isTyping(e.target)) { if (code === 'Escape') { e.target.blur(); } return; }
  if (e.target && e.target.tagName === 'BUTTON' && (code === 'Space' || code === 'Enter')) return;
  if (Modal.open) { if (code === 'Escape') { e.preventDefault(); Modal.close(); } return; }
  if (App.mode === 'editor') {
    if (Editor.onKey(e, true, code)) { e.preventDefault(); return; }
    const acts = Input.actionsFor(code);
    if (acts.includes('help')) { e.preventDefault(); showHelp(); } else if (acts.includes('editor')) { e.preventDefault(); Editor.playtest(); } else if (acts.includes('levels')) { e.preventDefault(); showLevelSelect(); }
    return;
  }
  const acts = Input.actionsFor(code);
  if (code === 'Escape' && !acts.length) acts.push('menu');
  if (!acts.length) return;
  e.preventDefault();
  for (const a of acts) {
    const def = ACTIONS.find(x => x[0] === a);
    if (def && def[2] === 'held') { if (!e.repeat) { Input.keys.add(code); Input.latch |= def[3]; } }
    else if (!e.repeat || a === 'step' || a === 'stepBack') App.command(a, 'key');
  }
}, { capture: false });
window.addEventListener('keyup', e => {
  const code = codeOf(e);
  Input.keys.delete(code);
  if (App.mode === 'editor') Editor.onKey(e, false, code);
});
window.addEventListener('blur', () => { Input.releaseAll('focus'); Editor.space = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden) { Input.releaseAll('hidden'); if (App.mode === 'play' && App.sess && !App.paused) App.setPaused(true); } });
window.addEventListener('gamepadconnected', e => UI.toast('Gamepad connected: ' + String(e.gamepad.id).slice(0, 40), 'good'));
window.addEventListener('gamepaddisconnected', () => { Input.gpBits = 0; Input.gpPrev = []; UI.toast('Gamepad disconnected — inputs released', 'warn'); });
Input.onGamepad = on => { if (!on) Input.gpBits = 0; };
Input.onCommand = (c, src) => App.command(c, src);
Input.onRelease = reason => { if (App.mode === 'play' && reason === 'focus') UI.toast('Focus lost — all held inputs released', 'warn', 2200); };
window.addEventListener('pointerdown', () => Sound.init(), { capture: true });
// ---------------- boot ----------------
(function boot() {
  try { App.coarse = matchMedia('(pointer: coarse)').matches; } catch (e) { App.coarse = false; }
  applySettings();
  buildTouch(); TL.init(); Diag.build();
  new ResizeObserver(() => App.onResize()).observe($('#stage'));
  window.addEventListener('resize', () => App.onResize());
  App.onResize();
  const hash = location.hash.replace('#', '');
  const m = /^level(\d+)$/.exec(hash);
  App.playBuiltin(m ? clamp(+m[1] - 1, 0, BUILTIN.length - 1) : 0);
  $('#cv').focus({ preventScroll: true });
  const loop = t => { try { App.frame(t); } catch (err) { console.error(err); UI.toast('Internal error: ' + err.message, 'bad'); } requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();

// Read-only diagnostics hook for automated inspection (no gameplay shortcuts).
window.EchoLoop = {
  version: 1,
  state() {
    const s = App.sess;
    return {
      mode: App.mode, paused: App.paused, speed: App.speed, diag: App.diag, fps: +App.fps.toFixed(1), modal: Modal.open,
      level: s ? s.L.name : null, levelRef: App.levelRef, loopIndex: s ? s.n + 1 : 0, echoes: s ? s.n : 0, tick: s ? s.W.tick : 0, loopTicks: s ? s.loopTicks : 0,
      sessionState: s ? s.state : null, previewTick: App.previewTick, rewinding: !!App.fx.rewind,
      player: s ? (p => ({ x: +p.x.toFixed(2), y: +p.y.toFixed(2), vx: +p.vx.toFixed(2), vy: +p.vy.toFixed(2), grounded: !!p.gr, carry: p.carry, dead: !!p.dead }))(s.player) : null,
      actors: s ? s.W.actors.map(a => ({ idx: a.idx, x: +a.x.toFixed(2), y: +a.y.toFixed(2), dead: !!a.dead, carry: a.carry, drift: +(a.drift || 0).toFixed(2) })) : [],
      crates: s ? s.W.crates.map(c => ({ id: c.id, x: +c.x.toFixed(2), y: +c.y.toFixed(2), heldBy: c.by })) : [],
      doors: s ? s.W.doors.map(d => ({ id: d.id, open: d.o / PHYS.doorSteps, ch: d.ch })) : [],
      plates: s ? s.W.plates.map(p => ({ id: p.id, on: p.on, ch: p.ch })) : [],
      lasers: s ? s.W.lasers.map(L => ({ id: L.id, on: L.on, mode: L.mode, x: L.x, phaseTick: (s.W.tick + L.ph) % L.per, per: L.per, onT: L.onT })) : [],
      lifts: s ? s.W.lifts.map(l => ({ id: l.id, x: +l.x.toFixed(2), y: +l.y.toFixed(2), blocked: l.blk })) : [],
      switches: s ? s.W.switches.map(q => ({ id: q.id, on: q.on, ch: q.ch })) : [],
      timers: s ? s.W.timers.map(q => ({ id: q.id, left: q.left, ch: q.ch })) : [],
      channels: s ? s.W.ch.slice() : [], divergence: s ? s.div.map(d => d && { t: d.t, cause: d.cause, echo: d.echo }) : [],
      echoEvents: s ? s.echoes.map(e => e.events.map(x => x.slice())) : [], won: s ? !!s.W.won : false,
      hash: s ? worldHash(s.W) : null, stats: s ? Object.assign({}, s.stats) : null, verified: s ? s.verified : null,
      editor: App.mode === 'editor' ? { name: Editor.L.name, objects: Editor.L.objects.length, sel: [...Editor.sel], tool: Editor.tool, undo: Editor.undoStack.length, redo: Editor.redoStack.length, errors: Editor.issues.filter(i => i.sev === 'error').map(i => i.msg), slot: Editor.slotName, zoom: +Editor.cam.z.toFixed(3), cam: { cx: +Editor.cam.cx.toFixed(1), cy: +Editor.cam.cy.toFixed(1) } } : null,
      viewport: { w: App.vw, h: App.vh, dpr: App.dpr, camZoom: +App.cam.z.toFixed(3) },
    };
  },
  verify() { return App.sess ? App.sess.verify() : null; },
  worldToScreen(x, y) { const c = App.mode === 'editor' ? Editor.cam : App.cam; return toScreen(c, App.vw, App.vh, x, y); },
  levelJSON() { return App.mode === 'editor' ? JSON.stringify(Editor.L) : App.sess ? JSON.stringify(App.sess.L) : null; },
};
</script>
