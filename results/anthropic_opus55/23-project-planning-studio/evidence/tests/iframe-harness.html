<!doctype html>
<meta charset="utf-8">
<title>PPS sandbox harness</title>
<!-- Dev-only harness: loads the app in an opaque-origin iframe (scripts + downloads only; no same-origin, no storage, no clipboard). -->
<p style="font:13px system-ui">Sandboxed iframe: <code>sandbox="allow-scripts allow-downloads"</code> → opaque origin.</p>
<iframe id="app" sandbox="allow-scripts allow-downloads" src="/index.html" style="width:1260px;height:720px;border:1px solid #ccc"></iframe>
<pre id="probe" style="font:12px monospace"></pre>
<script>
  const out = [];
  try { document.getElementById("app").contentWindow.document; out.push("parent CAN read iframe DOM (not opaque!)"); } catch (e) { out.push("parent cannot read iframe DOM: " + e.name); }
  fetch("https://example.com/", { mode: "no-cors" }).then(() => out.push("external fetch SUCCEEDED (network not blocked)"), (e) => out.push("external fetch blocked: " + e.message)).finally(() => { document.getElementById("probe").textContent = out.join("\n"); });
</script>
