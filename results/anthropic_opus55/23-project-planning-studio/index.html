<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Planning Studio</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f3f5f8; --panel: #ffffff; --ink: #1b2230; --muted: #5a6475; --faint: #8a93a3;
  --line: #dde2ea; --line-2: #eef1f5; --accent: #2f5bd3; --accent-soft: #e6edff;
  --crit: #d9363e; --crit-soft: #fde8e9; --wait: #e8890c; --wait-soft: #fff3df;
  --nb: #7048e8; --nb-soft: #efe9ff; --ok: #1f8a4c; --ok-soft: #e3f5ea;
  --err: #b42318; --err-soft: #fdecea; --note: #0b6bcb; --note-soft: #e7f2fd;
  --radius: 10px; --hdr-h: 56px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg); color: var(--ink); overflow-x: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 5px 10px;
  cursor: pointer; white-space: nowrap; min-height: 32px;
}
button:hover:not(:disabled) { border-color: #b8c2d3; background: #f8f9fb; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { background: #264cb4; }
button.danger { color: var(--err); border-color: #f1c4bf; }
button.danger:hover:not(:disabled) { background: var(--err-soft); }
button.ghost { border-color: transparent; background: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
input[type=text], select, textarea {
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; background: #fff; min-height: 30px;
}
input[type=text]:hover, select:hover { border-color: #c5cdda; }
input.invalid { border-color: var(--err); background: var(--err-soft); }
label { color: var(--muted); font-size: 12px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

/* ---------- header ---------- */
.app-header { position: sticky; top: 0; z-index: 60; background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0 1px 3px rgba(20,30,50,.05); }
.hdr-row { display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; margin-right: auto; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #2f5bd3, #7048e8); display: inline-block; position: relative; }
.brand-mark::after { content: ""; position: absolute; left: 5px; right: 7px; top: 6px; height: 3px; background: #fff; border-radius: 2px; box-shadow: 4px 5px 0 #fff; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.toolbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 2px; }
.tabs { display: none; }
.toolbar .bs { display: none; }
.sel-strip { display: none; }
.msg-bar { display: none; padding: 7px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.msg-bar.show { display: flex; gap: 10px; align-items: flex-start; }
.msg-bar.error { background: var(--err-soft); color: var(--err); }
.msg-bar.ok { background: var(--ok-soft); color: #145c33; }
.msg-bar.note { background: var(--note-soft); color: #0a4d93; }
.msg-body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.msg-body ul { margin: 3px 0 0; padding-left: 18px; }
.msg-bar button { min-height: 26px; padding: 2px 8px; background: transparent; border-color: currentColor; color: inherit; }

/* ---------- summary ---------- */
.summary { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding: 12px 16px 4px; align-items: stretch; }
.proj-fields { display: flex; gap: 8px; flex-direction: column; justify-content: center; }
.field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.field input[type=text] { width: 100%; }
.proj-fields .f-name { width: 210px; }
.proj-fields .f-start { width: 210px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 6px 11px; min-width: 0; }
.stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.stat .v { font-weight: 650; font-size: 15px; }
.stat .d { font-size: 12px; color: var(--muted); }
.stat.actual { border-left: 4px solid var(--accent); }
.stat.dep { border-left: 4px solid var(--crit); }
.stat.gap { border-left: 4px solid var(--wait); }
.limits { padding: 0 16px 6px; font-size: 12px; color: var(--muted); }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 336px; gap: 12px; padding: 8px 16px 24px; align-items: start; }
.col-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.panel-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 9px 12px; border-bottom: 1px solid var(--line-2); }
.panel-head h2 { font-size: 14px; margin: 0; margin-right: auto; }
.panel-body { padding: 10px 12px; }
.inspector { position: sticky; top: calc(var(--hdr-h) + 8px); max-height: calc(100vh - var(--hdr-h) - 20px); overflow: auto; }
.empty { padding: 22px 12px; text-align: center; color: var(--muted); }

/* ---------- table ---------- */
.table-wrap { overflow-x: auto; }
table.tasks { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 880px; font-size: 13px; }
table.tasks th { text-align: left; font-weight: 600; font-size: 11.5px; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--line); background: #fafbfc; white-space: nowrap; position: sticky; top: 0; }
table.tasks td { padding: 5px 4px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.tasks tr { cursor: pointer; }
table.tasks tbody tr:hover td { background: #fafbfd; }
table.tasks tr.selected td { background: var(--accent-soft) !important; }
table.tasks tr.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
table.tasks input[type=text] { width: 100%; min-height: 28px; padding: 3px 6px; }
table.tasks select { min-height: 28px; padding: 2px 2px; max-width: 104px; }
td.c-id { font-weight: 650; white-space: nowrap; }
td.c-num input { width: 46px !important; text-align: right; }
td.c-name input { min-width: 104px; }
td.c-pred input { min-width: 64px; }
td.c-nb input { width: 100px !important; }
td.c-sched { white-space: nowrap; font-variant-numeric: tabular-nums; }
td.c-del button { padding: 2px 7px; }
td.c-out { white-space: nowrap; font-variant-numeric: tabular-nums; }
.off { color: var(--faint); font-size: 11.5px; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.badge.crit { background: var(--crit-soft); color: var(--crit); border-color: #f6c3c6; }
.badge.wait { background: var(--wait-soft); color: #9a5a00; border-color: #f3d39e; }
.badge.nb { background: var(--nb-soft); color: var(--nb); border-color: #d7cbfb; }
.badge.ms { background: #eef0f3; color: #3b4455; }
.badge.un { background: #f1f3f5; color: #5a6475; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.icon-btn { min-height: 28px; padding: 2px 8px; }

/* ---------- gantt ---------- */
.gantt-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.gantt-tools label.toggle { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); font-size: 13px; cursor: pointer; }
.gantt-scroll { overflow: auto; max-height: 62vh; position: relative; border-radius: 0 0 var(--radius) var(--radius); touch-action: pan-x pan-y; }
.gantt-grid { display: grid; width: max-content; }
.g-corner { position: sticky; left: 0; top: 0; z-index: 4; background: #fafbfc; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 11.5px; color: var(--muted); padding: 6px 8px; display: flex; align-items: flex-end; }
.g-axis { position: sticky; top: 0; z-index: 3; background: #fafbfc; display: block; border-bottom: 1px solid var(--line); }
.g-labels { position: sticky; left: 0; z-index: 2; background: #fff; border-right: 1px solid var(--line); }
.g-label { display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 12.5px; border-bottom: 1px solid var(--line-2); cursor: pointer; overflow: hidden; white-space: nowrap; }
.g-label .lid { font-weight: 650; }
.g-label .lname { overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
.g-label.selected { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.g-label.crit .lid { color: var(--crit); }
.g-body { display: block; cursor: grab; }
.g-body.panning { cursor: grabbing; }
.g-bar { cursor: ew-resize; touch-action: none; }
.g-bar:focus { outline: none; }
.g-bar:focus-visible .bar-rect, .g-bar:focus-visible .ms-shape { stroke: var(--accent); stroke-width: 3; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 7px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line-2); }
.legend span.sw { display: inline-block; width: 18px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.drag-tip { position: absolute; z-index: 10; pointer-events: none; background: #1b2230; color: #fff; font-size: 12px; padding: 6px 9px; border-radius: 7px; box-shadow: 0 4px 14px rgba(0,0,0,.2); max-width: 280px; white-space: normal; }
.drag-tip.bad { background: var(--err); }
.drag-status { display: none; background: #1b2230; color: #fff; font-size: 12px; padding: 6px 12px; }
.drag-status.show { display: block; }
.drag-status.bad { background: var(--err); }

/* ---------- resources ---------- */
.res-list { display: flex; flex-direction: column; gap: 10px; }
.res-card { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.res-head { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; padding: 8px 10px; background: #fafbfc; border-bottom: 1px solid var(--line-2); }
.res-head .rid { font-weight: 700; align-self: center; display: flex; align-items: center; gap: 6px; }
.res-head .rid i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.res-head .f-rname { width: 150px; }
.res-head .f-cap { width: 96px; }
.res-head .rinfo { font-size: 12px; color: var(--muted); align-self: center; margin-right: auto; }
.lane-scroll { overflow-x: auto; }
.lane-svg { display: block; }
.slot { cursor: pointer; }
.slot:hover rect.cell { stroke: var(--accent); }
.res-add { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; padding-top: 4px; }
.res-add .f-rid { width: 90px; } .res-add .f-rname { width: 150px; } .res-add .f-cap { width: 70px; }

/* ---------- inspector ---------- */
.insp h3 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.insp .title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.form-grid .span2 { grid-column: span 2; }
.pred-list { display: flex; flex-wrap: wrap; gap: 4px 12px; max-height: 150px; overflow: auto; padding: 4px 0; }
.pred-list label { color: var(--ink); font-size: 13px; display: inline-flex; gap: 4px; align-items: center; }
.explain { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.explain li { padding: 7px 10px; border-bottom: 1px solid var(--line-2); display: grid; grid-template-columns: 120px 1fr; gap: 8px; font-size: 13px; }
.explain li:last-child { border-bottom: none; }
.explain li .k { color: var(--muted); font-size: 12px; }
.explain li.hl { background: #f6f8ff; }
.explain li.binding .k::after { content: " ◀ sets boundary"; color: var(--accent); font-weight: 600; }
.explain li.delays .k::after { content: " ◀ delays start"; color: #9a5a00; font-weight: 600; }
.cpm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.cpm-grid div { background: #fafbfc; border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 8px; }
.cpm-grid .k { font-size: 11px; color: var(--muted); }
.cpm-grid .v { font-weight: 650; }
.policy { font-size: 13px; }
.policy ol { padding-left: 18px; margin: 6px 0; }
.nb-row { display: flex; gap: 6px; align-items: center; }
.nb-row input { flex: 1; min-width: 0; }
.links { display: flex; gap: 6px; flex-wrap: wrap; }
.linkish { border: none; background: none; padding: 0 2px; min-height: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-weight: 600; }

/* ---------- modal ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(15,22,36,.45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 40px 12px; overflow: auto; }
.modal { background: #fff; border-radius: 12px; width: min(560px, 100%); box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal header { padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; }
.modal .mbody { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.modal footer { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.modal textarea { width: 100%; min-height: 200px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.modal .err-box { background: var(--err-soft); color: var(--err); border-radius: 7px; padding: 7px 10px; font-size: 13px; }
.modal .err-box ul { margin: 2px 0 0; padding-left: 18px; }

/* ---------- narrow ---------- */
@media (max-width: 900px) {
  :root { --hdr-h: 150px; }
  .hdr-row { padding: 6px 12px; gap: 6px; }
  .brand { font-size: 13.5px; margin-right: 0; }
  .brand-mark { width: 18px; height: 18px; }
  .brand-mark::after { left: 4px; right: 5px; top: 5px; box-shadow: 3px 4px 0 #fff; }
  .toolbar { width: 100%; gap: 4px; flex-wrap: nowrap; }
  .toolbar button { padding: 4px 7px; font-size: 13px; flex: 1 1 auto; min-width: 0; }
  .toolbar .bl { display: none; }
  .toolbar .bs { display: inline; }
  .toolbar .sep { display: none; }
  .tabs { display: flex; gap: 0; border-top: 1px solid var(--line); }
  .tabs button { flex: 1; border: none; border-radius: 0; border-bottom: 3px solid transparent; background: #fff; min-height: 38px; font-weight: 600; color: var(--muted); }
  .tabs button[aria-selected=true] { color: var(--accent); border-bottom-color: var(--accent); }
  .sel-strip { display: flex; align-items: center; gap: 8px; padding: 4px 12px; font-size: 12.5px; border-top: 1px solid var(--line-2); background: #fafbfc; min-height: 34px; }
  .sel-strip .sel-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sel-strip button { min-height: 26px; padding: 2px 8px; font-size: 12.5px; }
  .summary { padding: 10px 12px 2px; }
  .summary { grid-template-columns: minmax(0, 1fr); }
  .proj-fields { flex-direction: row; }
  .proj-fields .f-name { width: auto; flex: 1 1 150px; }
  .proj-fields .f-start { width: 130px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .stat { padding: 5px 9px; }
  .stat .d { display: none; }
  .stat .v { font-size: 14px; }
  .limits { display: none; }
  body:not([data-tab=table]) .summary .proj-fields { display: none; }
  .limits { padding: 0 12px 6px; }
  .layout { grid-template-columns: minmax(0, 1fr); padding: 8px 12px 24px; }
  .layout [data-view] { display: none; }
  .layout[data-active=table] [data-view=table],
  .layout[data-active=gantt] [data-view=gantt],
  .layout[data-active=resources] [data-view=resources],
  .layout[data-active=details] [data-view=details] { display: block; }
  .inspector { position: static; max-height: none; }
  .gantt-scroll { max-height: calc(100vh - var(--hdr-h) - 120px); }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .span2 { grid-column: span 1; }
  .explain li { grid-template-columns: 96px 1fr; }
}
</style>
</head>
<body data-tab="table">
<header class="app-header" id="appHeader">
  <div class="hdr-row">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Project Planning Studio</div>
    <div class="toolbar" role="toolbar" aria-label="Plan actions">
      <button type="button" id="btnAddTask" title="Add a task">+ Task</button>
      <button type="button" id="btnAddMilestone" title="Add a zero-duration milestone" aria-label="Add milestone">+ <span class="bl">Milestone</span><span class="bs" aria-hidden="true">◆</span></button>
      <span class="sep"></span>
      <button type="button" id="btnUndo" title="Undo (Ctrl+Z)" aria-label="Undo">↶<span class="bl"> Undo</span></button>
      <button type="button" id="btnRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷<span class="bl"> Redo</span></button>
      <span class="sep"></span>
      <button type="button" id="btnImport" title="Import a plan from JSON (file or pasted text)">Import</button>
      <button type="button" id="btnExport" title="Export JSON, CSV or SVG">Export</button>
      <button type="button" id="btnReset" class="danger" title="Restore the seed plan and clear undo history">Reset</button>
    </div>
  </div>
  <div class="tabs" role="tablist" aria-label="Views">
    <button type="button" role="tab" data-tab="table" aria-selected="true">Table</button>
    <button type="button" role="tab" data-tab="gantt" aria-selected="false">Gantt</button>
    <button type="button" role="tab" data-tab="resources" aria-selected="false">Resources</button>
    <button type="button" role="tab" data-tab="details" aria-selected="false">Details</button>
  </div>
  <div class="sel-strip" id="selStrip"></div>
  <div class="msg-bar" id="msgBar" role="status" aria-live="polite"></div>
</header>

<section class="summary" aria-label="Project summary">
  <div class="proj-fields">
    <div class="field f-name"><label for="projName">Project name</label><input type="text" id="projName" maxlength="200" autocomplete="off"></div>
    <div class="field f-start"><label for="projStart">Start date (Mon–Fri)</label><input type="text" id="projStart" placeholder="YYYY-MM-DD" inputmode="numeric" autocomplete="off"></div>
  </div>
  <div class="stats" id="stats"></div>
</section>
<div class="limits" id="limitsLine"></div>

<main class="layout" id="layout" data-active="table">
  <div class="col-main">
    <section class="panel" data-view="table" aria-labelledby="hTable">
      <div class="panel-head"><h2 id="hTable">Tasks</h2><span class="muted" id="tableCount"></span></div>
      <div class="table-wrap" id="tableWrap"></div>
    </section>

    <section class="panel" data-view="gantt" aria-labelledby="hGantt">
      <div class="panel-head">
        <h2 id="hGantt">Gantt <span class="faint" style="font-weight:400">· working days</span></h2>
        <div class="gantt-tools">
          <label class="toggle"><input type="checkbox" id="critToggle" checked> Dependency-only critical path</label>
          <button type="button" id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button>
          <button type="button" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
          <button type="button" id="zoomFit" title="Fit the whole schedule">Fit</button>
          <button type="button" id="panLeft" aria-label="Pan left" title="Pan left">◀</button>
          <button type="button" id="panRight" aria-label="Pan right" title="Pan right">▶</button>
        </div>
      </div>
      <div class="drag-status" id="dragStatus" aria-live="polite"></div>
      <div class="gantt-scroll" id="ganttScroll" tabindex="0" aria-label="Gantt timeline. Arrow keys pan; drag a bar to set its not-before boundary; Escape cancels a drag."></div>
      <div class="legend" id="ganttLegend"></div>
    </section>

    <section class="panel" data-view="resources" aria-labelledby="hRes">
      <div class="panel-head"><h2 id="hRes">Resources <span class="faint" style="font-weight:400">· occupancy vs capacity per working day</span></h2></div>
      <div class="panel-body" id="resPanel"></div>
    </section>
  </div>

  <aside class="panel inspector" data-view="details" aria-labelledby="hInsp">
    <div class="panel-head"><h2 id="hInsp">Details &amp; explanation</h2></div>
    <div class="panel-body insp" id="inspector"></div>
  </aside>
</main>

<div id="modalRoot"></div>

<script id="pps-engine">
"use strict";
/* Project Planning Studio — scheduling engine (pure functions, no DOM). */
const PPSEngine = (() => {
  const LIMITS = Object.freeze({
    minDate: "2000-01-01", maxDate: "2099-12-31",
    maxOffset: 2600, maxDuration: 260, maxPriority: 9999,
    minCapacity: 1, maxCapacity: 4,
    maxTasks: 500, maxResources: 50, maxIdLength: 64, maxNameLength: 200,
    maxImportChars: 1000000,
  });
  const ID_RE = /^[A-Za-z0-9_-]+$/;
  const DATE_RE = /^(\d{4})-(\d{2})-(\d{2})$/;
  const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  // Calendar arithmetic uses UTC day numbers only — never local time, so DST cannot shift a day.
  function ymdToDn(y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / 86400000); }
  function dnToParts(dn) { const t = new Date(dn * 86400000); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() }; }
  function pad(n, w) { return String(n).padStart(w, "0"); }
  function dnToISO(dn) { const p = dnToParts(dn); return pad(p.y, 4) + "-" + pad(p.m, 2) + "-" + pad(p.d, 2); }
  function weekday(dn) { return ((dn + 4) % 7 + 7) % 7; } // 1970-01-01 was a Thursday; 0 = Sunday
  const MIN_DN = ymdToDn(2000, 1, 1), MAX_DN = ymdToDn(2099, 12, 31);

  /** Parse a strict YYYY-MM-DD date. Returns {ok, dn} or {ok:false, error}. */
  function parseDate(str) {
    if (typeof str !== "string") return { ok: false, error: "must be a YYYY-MM-DD string" };
    const m = DATE_RE.exec(str.trim());
    if (!m) return { ok: false, error: `"${str}" is not in YYYY-MM-DD format` };
    const y = +m[1], mo = +m[2], d = +m[3];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return { ok: false, error: `${str.trim()} is not a real calendar date` };
    const dn = ymdToDn(y, mo, d);
    const back = dnToParts(dn);
    if (back.y !== y || back.m !== mo || back.d !== d) return { ok: false, error: `${str.trim()} is not a real calendar date` };
    if (dn < MIN_DN || dn > MAX_DN) return { ok: false, error: `${str.trim()} is outside the supported range ${LIMITS.minDate} – ${LIMITS.maxDate}` };

  function normalizeWorkday(dn) { const w = weekday(dn); return w === 6 ? dn + 2 : w === 0 ? dn + 1 : dn; }

  /**
   * Validate a whole proposed source model and compute its schedule.
   * Returns {ok:true, model, schedule, cpm, notes} or {ok:false, errors}.
   * Nothing here mutates the input.

    if (!raw || typeof raw !== "object" || Array.isArray(raw)) return { ok: false, errors: ["Plan must be a JSON object"] };
    const p = raw.project;
    if (!p || typeof p !== "object" || Array.isArray(p)) return { ok: false, errors: ["Missing \"project\" object with name and startDate"] };
    const model = { project: { name: "", startDate: "" }, resources: [], tasks: [] };

    if (typeof p.name !== "string" || !p.name.trim()) err("Project name must be a non-empty string");
    else if (p.name.length > LIMITS.maxNameLength) err(`Project name is longer than ${LIMITS.maxNameLength} characters`);
    else model.project.name = p.name;

    let startDn = null;
    const sd = parseDate(p.startDate);
    if (!sd.ok) err(`Project start date: ${sd.error}`);
    else {
      startDn = normalizeWorkday(sd.dn);
      if (startDn > MAX_DN) err(`Project start ${dnToISO(sd.dn)} normalizes to ${dnToISO(startDn)}, beyond ${LIMITS.maxDate}`);
      else {
        if (startDn !== sd.dn) notes.push(`Project start ${fmtDate(sd.dn)} is a weekend day; normalized forward to ${fmtDate(startDn)}.`);
        model.project.startDate = dnToISO(startDn);
      }
    }

    if (!Array.isArray(raw.resources)) err("\"resources\" must be an array");
    if (!Array.isArray(raw.tasks)) err("\"tasks\" must be an array");
    if (errors.length) return { ok: false, errors };
    if (raw.resources.length > LIMITS.maxResources) return { ok: false, errors: [`Too many resources: ${raw.resources.length} (limit ${LIMITS.maxResources})`] };
    if (raw.tasks.length > LIMITS.maxTasks) return { ok: false, errors: [`Too many tasks: ${raw.tasks.length} (limit ${LIMITS.maxTasks})`] };

    const resById = new Map();
    raw.resources.forEach((r, i) => {
      const where = `Resource #${i + 1}`;
      if (!r || typeof r !== "object" || Array.isArray(r)) { err(`${where} must be an object`); return; }
      const idOk = checkId(r.id, where, err);
      const label = idOk ? `Resource ${q(r.id)}` : where;
      if (idOk && resById.has(r.id)) err(`Duplicate resource ID ${q(r.id)}`);
      let name = r.name;
      if (name === undefined || name === null) name = idOk ? r.id : "";
      if (typeof name !== "string") err(`${label}: name must be a string`);
      else if (name.length > LIMITS.maxNameLength) err(`${label}: name is longer than ${LIMITS.maxNameLength} characters`);
      if (!isSafeInt(r.capacity)) err(`${label}: capacity must be an integer ${LIMITS.minCapacity}–${LIMITS.maxCapacity} (got ${clip(JSON.stringify(r.capacity), 30)})`);
      else if (r.capacity < LIMITS.minCapacity || r.capacity > LIMITS.maxCapacity) err(`${label}: capacity ${r.capacity} is outside ${LIMITS.minCapacity}–${LIMITS.maxCapacity}`);
      if (idOk && !resById.has(r.id)) {
        const res = { id: r.id, name: typeof name === "string" ? name : "", capacity: r.capacity };
        resById.set(r.id, res); model.resources.push(res);
      }
    });

    const taskById = new Map(), firstIndex = new Map();
    raw.tasks.forEach((t, i) => {
      const where = `Task #${i + 1}`;
      if (!t || typeof t !== "object" || Array.isArray(t)) { err(`${where} must be an object`); return; }
      const idOk = checkId(t.id, where, err);
      const label = idOk ? `Task ${q(t.id)}` : where;
      if (idOk && taskById.has(t.id)) err(`Duplicate task ID ${q(t.id)} (task #${firstIndex.get(t.id) + 1} and task #${i + 1})`);
      if (typeof t.name !== "string") err(`${label}: name must be a string`);
      else if (t.name.length > LIMITS.maxNameLength) err(`${label}: name is longer than ${LIMITS.maxNameLength} characters`);
      if (!isSafeInt(t.duration)) err(`${label}: duration must be a safe integer (got ${clip(JSON.stringify(t.duration), 30)})`);
      else if (t.duration < 0 || t.duration > LIMITS.maxDuration) err(`${label}: duration ${t.duration} is outside 0–${LIMITS.maxDuration} working days`);
      if (!isSafeInt(t.priority)) err(`${label}: priority must be a safe integer (got ${clip(JSON.stringify(t.priority), 30)})`);
      else if (t.priority < 0 || t.priority > LIMITS.maxPriority) err(`${label}: priority ${t.priority} is outside 0–${LIMITS.maxPriority}`);
      const rid = t.resourceId === undefined ? null : t.resourceId;
      if (rid !== null) {
        if (typeof rid !== "string") err(`${label}: resourceId must be a resource ID string or null`);
        else if (!resById.has(rid)) err(`${label}: unknown resource ${q(rid)}`);
        else if (t.duration === 0) err(`${label}: a duration-0 milestone cannot be assigned to resource ${q(rid)} (milestones occupy no capacity)`);
      }
      const preds = t.predecessors === undefined || t.predecessors === null ? [] : t.predecessors;
      if (!Array.isArray(preds)) err(`${label}: predecessors must be an array of task IDs`);
      else {
        const seen = new Set();
        preds.forEach((pid) => {
          if (typeof pid !== "string" || !ID_RE.test(pid)) err(`${label}: invalid predecessor ID ${clip(JSON.stringify(pid), 40)}`);
          else if (seen.has(pid)) err(`${label}: predecessor ${q(pid)} is listed twice`);
          else if (idOk && pid === t.id) err(`${label}: a task cannot be its own predecessor`);
          seen.add(pid);
        });
      }
      let nb = null;
      if (t.notBefore !== undefined && t.notBefore !== null) {
        const pd = parseDate(t.notBefore);
        if (!pd.ok) err(`${label}: not-before ${pd.error}`);
        else {
          const nd = normalizeWorkday(pd.dn);
          if (nd > MAX_DN) err(`${label}: not-before ${dnToISO(pd.dn)} normalizes to ${dnToISO(nd)}, beyond ${LIMITS.maxDate}`);
          else {
            if (nd !== pd.dn) notes.push(`${label}: not-before ${fmtDate(pd.dn)} is a weekend day; normalized forward to ${fmtDate(nd)}.`);
            nb = dnToISO(nd);
          }

      }
      if (idOk && !taskById.has(t.id)) {
        const task = {
          id: t.id, name: typeof t.name === "string" ? t.name : "", duration: t.duration, priority: t.priority,
          resourceId: rid, predecessors: Array.isArray(preds) ? preds.slice() : [], notBefore: nb,
        };

    if (errors.length) return { ok: false, errors };

    const cycle = findCycle(model.tasks, taskById);
    if (cycle) return { ok: false, errors: [`Dependency cycle: ${cycle.join(" → ")} (finish-to-start links must not loop)`] };

    for (const t of model.tasks) {

      if (cal.offsetToDn(s.finish) > MAX_DN) {
        return { ok: false, errors: [`Task ${q(t.id)} would end at ${dnToISO(cal.offsetToDn(s.finish))} (offset ${s.finish}), beyond the supported date range ending ${LIMITS.maxDate}`] };

    const cpm = computeCPM(model.tasks, taskById);

  function checkId(id, where, err) {
    if (typeof id !== "string" || !id.length) { err(`${where}: ID must be a non-empty string`); return false; }
    if (id.length > LIMITS.maxIdLength) { err(`${where}: ID is longer than ${LIMITS.maxIdLength} characters`); return false; }

  /** Returns a cycle as [a, b, ..., a] or null. Iterative DFS (no recursion limits). */
  function findCycle(tasks, byId) {
    const state = new Map(); // 0/undefined unvisited, 1 on stack, 2 done
    const ids = tasks.map((t) => t.id).sort(cmpId);

        if (top[1] < preds.length) {
          const nxt = preds[top[1]++];
          const st = state.get(nxt);
          if (st === 1) { const i = path.indexOf(nxt); return path.slice(i).concat(nxt).reverse(); }
          if (!st) { state.set(nxt, 1); stack.push([nxt, 0]); path.push(nxt); }

  function cmpId(a, b) { return a < b ? -1 : a > b ? 1 : 0; } // ASCII IDs: UTF-16 order == code-point order

  /**
   * Serial resource-constrained schedule (see policy in the UI):
   * repeatedly pick the ready task with lowest priority, then smallest ID; its candidate
   * boundary is max(0, not-before offset, predecessor finishes); positive-duration assigned

   */
  function scheduleModel(model, cal, resById, taskById) {
    const H = LIMITS.maxOffset;
    const occ = new Map(), bookings = new Map();
    for (const r of model.resources) { occ.set(r.id, new Uint8Array(H)); bookings.set(r.id, []); }
    const remaining = new Map(), succs = new Map();
    for (const t of model.tasks) { remaining.set(t.id, t.predecessors.length); succs.set(t.id, []); }
    for (const t of model.tasks) for (const pid of t.predecessors) succs.get(pid).push(t.id);
    let ready = model.tasks.filter((t) => t.predecessors.length === 0);
    const byId = new Map(), order = [];
    while (ready.length) {
      let bi = 0;
      for (let i = 1; i < ready.length; i++) {
        const a = ready[i], b = ready[bi];
        if (a.priority < b.priority || (a.priority === b.priority && cmpId(a.id, b.id) < 0)) bi = i;
      }
      const t = ready[bi];
      ready.splice(bi, 1);

      let predBound = 0, predBy = [];
      for (const pid of t.predecessors) {
        const f = byId.get(pid).finish;
        if (f > predBound) { predBound = f; predBy = [pid]; } else if (f === predBound) predBy.push(pid);
      }
      if (!t.predecessors.length) predBy = [];
      let nbOffset = null;
      if (t.notBefore) nbOffset = cal.dnToOffset(parseDate(t.notBefore).dn);
      const candidate = Math.max(0, nbOffset === null ? 0 : nbOffset, predBound);
      const fail = (msg) => ({ ok: false, errors: [msg] });
      if (candidate > H) {
        const why = nbOffset !== null && nbOffset >= predBound ? `its not-before ${t.notBefore} is offset ${nbOffset}` : `its predecessors finish at offset ${predBound}`;
        return fail(`Task ${q(t.id)} cannot be scheduled: ${why}, beyond the ${H}-working-day horizon (offsets 0–${H}). The current plan was kept.`);
      }
      let start = candidate, blocks = [], shortGaps = [];
      const res = t.resourceId ? resById.get(t.resourceId) : null;
      if (t.duration > 0 && res) {
        const o = occ.get(res.id);
        let runStart = candidate, found = -1;
        for (let d = candidate; d < H; d++) {
          if (o[d] >= res.capacity) { runStart = d + 1; continue; }
          if (d - runStart + 1 >= t.duration) { found = runStart; break; }
        }
        if (found < 0) return fail(`Task ${q(t.id)} (${t.duration} days on ${q(res.id)}, capacity ${res.capacity}) cannot fit between offset ${candidate} and the ${H}-working-day horizon. The current plan was kept.`);
        start = found;
        if (start > candidate) {
          // Explain every full day that pushed the task later, plus free gaps that were too short.
          let d = candidate;
          while (d < start) {
            if (o[d] >= res.capacity) {
              let e = d; while (e < start && o[e] >= res.capacity) e++;
              const ids = bookings.get(res.id).filter((b) => b.start < e && b.finish > d).map((b) => b.id);
              blocks.push({ from: d, to: e, ids });
              d = e;
            } else {
              let e = d; while (e < start && o[e] < res.capacity) e++;
              shortGaps.push({ from: d, to: e });
              d = e;
            }
          }
        }
      } else if (t.duration > 0 && start + t.duration > H) {
        return fail(`Task ${q(t.id)} would finish at offset ${start + t.duration}, beyond the ${H}-working-day horizon. The current plan was kept.`);
      }
      const finish = start + t.duration;
      if (t.duration > 0 && res) {
        const o = occ.get(res.id);
        for (let d = start; d < finish; d++) o[d]++;
        bookings.get(res.id).push({ id: t.id, start, finish });
      }
      byId.set(t.id, { id: t.id, start, finish, candidate, predBound, predBy, nbOffset, blocks, shortGaps, seq: order.length + 1 });
      order.push(t.id);
      for (const sid of succs.get(t.id)) {
        const n = remaining.get(sid) - 1; remaining.set(sid, n);
        if (n === 0) ready.push(taskById.get(sid));
      }
    }
    let completion = 0;
    for (const s of byId.values()) completion = Math.max(completion, s.finish);
    return { ok: true, byId, order, completion, occ, bookings };

  /** Dependency-only CPM: unlimited resources, no not-before, virtual common finish. */
  function computeCPM(tasks, taskById) {
    const succs = new Map(), indeg = new Map();

    for (const t of tasks) for (const p of t.predecessors) succs.get(p).push(t.id);

    while (queue.length) {
      const id = queue.shift(); topo.push(id);
      for (const s of succs.get(id)) { const n = indeg.get(s) - 1; indeg.set(s, n); if (!n) queue.push(s); }
    }
    const v = new Map();
    for (const id of topo) {
      const t = taskById.get(id);
      let es = 0; for (const p of t.predecessors) es = Math.max(es, v.get(p).ef);
      v.set(id, { es, ef: es + t.duration });
    }
    let completion = 0; for (const x of v.values()) completion = Math.max(completion, x.ef);
    for (let i = topo.length - 1; i >= 0; i--) {
      const id = topo[i], t = taskById.get(id), x = v.get(id);
      let lf = completion; for (const s of succs.get(id)) lf = Math.min(lf, v.get(s).ls);
      x.lf = lf; x.ls = lf - t.duration; x.float = x.ls - x.es; x.critical = x.float === 0;
    }
    const critEdges = new Set();
    for (const t of tasks) for (const p of t.predecessors) {
      const a = v.get(p), b = v.get(t.id);
      if (a.float === 0 && b.float === 0 && a.ef === b.es) critEdges.add(p + "\u0000" + t.id);
    }
    return { byId: v, completion, critEdges, succs };
  }

  const SEED = Object.freeze({
    version: 1,
    project: { name: "Studio Launch", startDate: "2026-09-07" },
    resources: [{ id: "R1", name: "Studio", capacity: 1 }, { id: "R2", name: "Review", capacity: 1 }],
    tasks: [
      { id: "T1", name: "Design", duration: 2, priority: 1, resourceId: "R1", predecessors: [], notBefore: null },
      { id: "T2", name: "Build", duration: 3, priority: 2, resourceId: "R1", predecessors: ["T1"], notBefore: null },
      { id: "T3", name: "Documentation", duration: 2, priority: 3, resourceId: "R1", predecessors: ["T1"], notBefore: null },
      { id: "T4", name: "Review", duration: 1, priority: 4, resourceId: "R2", predecessors: ["T2", "T3"], notBefore: null },
      { id: "T5", name: "Launch", duration: 0, priority: 5, resourceId: null, predecessors: ["T4"], notBefore: null },
    ],
  });

  return {
    LIMITS, ID_RE, SEED, DAY_NAMES, MONTHS,
    parseDate, normalizeWorkday, dnToISO, dnToParts, weekday, fmtDate, fmtShort, makeCalendar,
    parseIntStrict, evaluate, cmpId, MIN_DN, MAX_DN,
  };
})();
if (typeof module !== "undefined") module.exports = PPSEngine;
</script>
<script id="pps-app">

  const narrow = () => window.innerWidth < 600;

  const app = {
    model: null, result: null,
    undo: [], redo: [],
    sel: null,            // {type:"task", id} | {type:"slot", res, day}
    crit: true, pxPerDay: 30, tab: "table",
    drag: null, msg: null,
  };
  const $ = (id) => document.getElementById(id);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  class UserError extends Error {}

  /* ---------- DOM helpers (text is always set via textContent: names stay inert) ---------- */
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) setAttr(el, k, attrs[k]);
    for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));

    else if (k === "checked") el.checked = !!v;

  }

  /* ---------- model access ---------- */
  const cal = () => app.result.cal;

  const resById = (id) => app.model.resources.find((r) => r.id === id);
  const sch = (id) => app.result.schedule.byId.get(id);
  const cpm = (id) => app.result.cpm.byId.get(id);

  function resColor(rid) {
    if (!rid) return UNASSIGNED_COLOR;
    const i = app.model.resources.findIndex((r) => r.id === rid);
    return RES_COLORS[(i < 0 ? 0 : i) % RES_COLORS.length];
  }
  function sourceDoc(model) { return { version: 1, project: clone(model.project), resources: clone(model.resources), tasks: clone(model.tasks) }; }

  /** Per-task waiting analysis used by table badges, Gantt and inspector. */
  function delayInfo(id) {

    return { resWait, nbHold, vsCpm: x.start - c.es, critical: c.critical, milestone: t.duration === 0 };
  }

    if (!r.ok) throw new Error("Seed invalid: " + r.errors.join("; "));
    app.model = r.model; app.result = r;
