<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starfix — find your ship by starlight</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230b1531' stroke='%23d6ab52' stroke-width='3'/%3E%3Cpath d='M32 9 L35 28 L54 32 L35 36 L32 55 L29 36 L10 32 L29 28 Z' fill='%23f2d185'/%3E%3C/svg%3E">
<meta name="description" content="Take real sextant sights by hand, reduce them with a built-in nautical almanac, cross the lines of position into a fix, and find a small island against a current you cannot see.">
<style>
:root{
  --ink:#070d1c; --ink2:#0e1830; --ink3:#15223f; --line:#253660; --line2:#34497a;
  --text:#ece6d5; --muted:#9ba6c0; --faint:#6c7897;
  --brass:#d6ab52; --brass2:#f2d185; --brass3:#8a6a2b;
  --paper:#f2ead6; --paper2:#e6dbc0; --chart:#4c8098; --chart2:#9ab8c4;
  --red:#e2553f; --ok:#71c893; --warn:#eab04a; --blue:#5aa7ff;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.4}
body{overflow:hidden;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
button,.btn{background:var(--ink3);border:1px solid var(--line2);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--text);line-height:1.2;white-space:nowrap;touch-action:manipulation;user-select:none}
button:hover,.btn:hover{border-color:var(--brass);color:var(--brass2)}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
button.primary{background:linear-gradient(#e2b964,#b88a35);color:#1b1304;border-color:#f2d185;font-weight:650}
button.primary:hover{color:#000}
button.ghost{background:transparent}
button.danger{border-color:#7a3b35}
button.danger:hover{border-color:var(--red);color:#ffb3a6}
button[aria-pressed="true"]{border-color:var(--brass);color:var(--brass2);background:#241d10}
input[type=number],input[type=text],input[type=datetime-local],select{background:#0a1226;border:1px solid var(--line2);border-radius:7px;padding:5px 7px;min-width:0}
input[type=range]{accent-color:var(--brass)}
label{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- header ---------- */
header.top{display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:linear-gradient(#0c1631,#08101f);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--serif);font-weight:600;letter-spacing:.06em;font-size:21px;margin:0;color:var(--brass2)}
.brand .sub{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}
.clock{display:flex;flex-direction:column;align-items:flex-start;padding:2px 12px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.chron{font-family:var(--mono);font-size:20px;color:#fff;letter-spacing:.04em}
.chronsub{font-size:11px;color:var(--muted)}
.phase{font-size:12.5px;color:var(--muted);max-width:40ch}
.phase b{color:var(--text);font-weight:600}
.phase.go b{color:var(--ok)}
nav.actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

/* ---------- layout ---------- */
main.app{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 430px;min-height:0}
.deck{position:relative;min-height:0;overflow:hidden;background:#000}
#deckCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#deckCanvas.dragging{cursor:grabbing}
aside.side{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--ink2)}
.chartpane{position:relative;flex:0 0 44%;min-height:220px;border-bottom:1px solid var(--line);background:var(--paper)}
#chartCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.charttools{position:absolute;right:8px;top:8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.charttools button{background:rgba(242,234,214,.92);color:#243447;border-color:#b7a987;padding:4px 8px;font-size:12px}
.charttools button:hover{color:#000;border-color:#6b5a2d}
.charttools button[aria-pressed="true"]{background:#e3cf9a;color:#2a1e05}
.chartlegend{position:absolute;left:8px;bottom:6px;font-size:11px;color:#3d4a58;background:rgba(242,234,214,.85);padding:3px 7px;border-radius:6px;pointer-events:none}
.panel{flex:1;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 6px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--brass2);border-bottom-color:var(--brass)}
.tabpane{flex:1;overflow:auto;padding:12px 14px;min-height:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.row > label{min-width:74px}
.row.tight{gap:4px;flex-wrap:nowrap}
.row.tight button{padding:5px 7px}
.row.tight > label{min-width:0;margin-right:4px}
.grp{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:0 0 12px;background:rgba(10,18,38,.6)}
.grp h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass);font-weight:650}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono);text-align:right}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.warn{color:var(--warn)}
.okc{color:var(--ok)}
.bad{color:#ff8f7a}
.big{font-size:17px}
.btnrow{display:flex;gap:5px;flex-wrap:wrap}
.btnrow button{padding:5px 9px}

/* sights table */
table.log{width:100%;border-collapse:collapse;font-size:12.5px}
table.log th{font-weight:600;color:var(--muted);text-align:left;padding:4px 4px;border-bottom:1px solid var(--line);font-size:11.5px}
table.log td{padding:5px 4px;border-bottom:1px solid #1a2647;font-family:var(--mono);white-space:nowrap}
table.log td.nm{font-family:var(--sans)}
table.log tr{cursor:pointer}
table.log tr:hover td{background:#132047}
table.log tr.sel td{background:#1d2a50}
table.log input{accent-color:var(--brass)}
.redu{font-family:var(--mono);font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:1px 14px;margin-top:6px}
.redu span:nth-child(odd){color:var(--muted);font-family:var(--sans)}
.redu span:nth-child(even){text-align:right}
.redu .sum{border-top:1px solid var(--line2);padding-top:2px}
.planner td,.planner th{font-size:12.5px}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--brass3);color:var(--brass2);font-family:var(--sans);margin-left:4px}
.tag.dim{border-color:var(--line2);color:var(--muted)}

/* deck overlays */
.coach{position:absolute;left:12px;top:12px;max-width:min(380px,calc(100% - 24px));background:rgba(8,14,30,.86);border:1px solid var(--line2);border-radius:12px;padding:12px 14px 10px;backdrop-filter:blur(4px);box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:3}
.coach h2{font-family:var(--serif);font-size:16px;margin:0 0 4px;color:var(--brass2);font-weight:600}
.coach ol{margin:6px 0 4px;padding-left:20px}
.coach li{margin:3px 0;color:var(--muted);font-size:13px}
.coach li.now{color:var(--text)}
.coach li.done{color:var(--ok);text-decoration:line-through;text-decoration-color:rgba(113,200,147,.5)}
.coach .x{position:absolute;right:6px;top:6px;padding:2px 7px;background:transparent;border:0;color:var(--muted)}
.coach p{margin:2px 0;font-size:13px}
.coach .prog{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px}
.coach .dots{display:flex;gap:5px;margin:4px 0 8px}
.coach .dots i{width:18px;height:4px;border-radius:2px;background:var(--line2)}
.coach .dots i.d{background:var(--ok)}
.coach .dots i.n{background:var(--brass2)}
.coach .nowstep{font-size:14px;color:var(--text);margin:0 0 6px}
.coach details{font-size:12px;color:var(--muted)}
.coach summary{cursor:pointer;color:var(--muted)}
.deckhud{position:absolute;right:10px;bottom:46px;display:flex;gap:5px;z-index:2;flex-wrap:wrap;justify-content:flex-end}
.deckhud button{background:rgba(10,18,38,.8);font-size:12.5px}
.bodycard{position:absolute;z-index:4;min-width:210px;max-width:260px;background:rgba(9,15,32,.95);border:1px solid var(--brass3);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.bodycard h4{margin:0;font-family:var(--serif);font-size:17px;color:var(--brass2);font-weight:600}
.bodycard .meta{font-size:12px;color:var(--muted);margin:1px 0 6px}
.bodycard .x{position:absolute;right:4px;top:4px;padding:1px 7px;border:0;background:transparent;color:var(--muted)}
.landho{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-family:var(--serif);font-size:34px;color:#fff;text-shadow:0 2px 20px #000;pointer-events:none;z-index:3;letter-spacing:.05em}

/* sextant */
.sextant{position:absolute;inset:0;z-index:6;background:radial-gradient(ellipse at 40% 50%,rgba(3,6,14,.72),rgba(1,3,8,.94));display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:16px}
.eyewrap{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
#eyeCanvas{width:100%;height:100%;display:block;touch-action:none;cursor:ns-resize}
#eyeCanvas:focus-visible{outline:1px dashed rgba(242,209,133,.35);outline-offset:-4px}
.sxpanel{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.sxtitle{font-family:var(--serif);font-size:20px;color:var(--brass2)}
.sxread{font-family:var(--mono);font-size:32px;color:#fff;letter-spacing:.02em;line-height:1}
.sxread small{font-size:12px;color:var(--muted);display:block;letter-spacing:0;font-family:var(--sans);margin-bottom:4px}
.drum{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.drum button{padding:9px 6px;font-family:var(--mono)}
.markbtn{font-size:18px;padding:14px 10px;letter-spacing:.08em}
.sxnote{font-size:12px;color:var(--muted)}
.tilt{height:22px;border:1px solid var(--line2);border-radius:11px;position:relative;background:#0a1226;overflow:hidden}
.tilt .c{position:absolute;left:50%;top:2px;bottom:2px;width:2px;background:var(--ok);opacity:.6}
.tilt .b{position:absolute;top:3px;width:16px;height:14px;border-radius:7px;background:var(--brass2);transform:translateX(-50%)}

/* modals */
.modal{position:fixed;inset:0;z-index:20;background:rgba(2,4,10,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{background:var(--ink2);border:1px solid var(--line2);border-radius:14px;max-width:760px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal h2{font-family:var(--serif);color:var(--brass2);font-weight:600;margin:0 0 8px;font-size:23px}
.modal h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass);margin:16px 0 6px}
.modal p,.modal li{color:#d6d0c0}
.modal .close{float:right}
.voycards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.voycard{border:1px solid var(--line2);border-radius:12px;padding:12px;background:#0b1428;display:flex;flex-direction:column;gap:6px}
.voycard h4{margin:0;font-family:var(--serif);font-size:17px;color:var(--brass2);font-weight:600}
.voycard p{margin:0;font-size:12.5px;color:var(--muted)}
.voycard button{margin-top:auto;align-self:flex-start}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px}
.form .err{color:#ff9d8a;font-size:12px;grid-column:1/-1}
.refs li{margin:6px 0;font-size:13px}
.refs .u{font-family:var(--mono);font-size:12px;color:#9cc7ff;user-select:all;word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#0b1428}
.stat b{display:block;font-family:var(--mono);font-size:18px;color:#fff}
.stat span{font-size:11.5px;color:var(--muted)}
.toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none;align-items:center;width:max-content;max-width:calc(100vw - 24px)}
.toast{background:rgba(12,20,42,.96);border:1px solid var(--line2);border-left:3px solid var(--brass);padding:8px 12px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.toast.bad{border-left-color:var(--red)}
.toast.good{border-left-color:var(--ok)}
.mtabs{display:none}

/* ---------- narrow ---------- */
@media (max-width: 900px){
  body{overflow:auto;height:auto;min-height:100%}
  header.top{gap:8px;padding:8px 10px}
  .brand h1{font-size:18px}
  .clock{border:0;padding:0}
  .chron{font-size:17px}
  .phase{order:5;flex-basis:100%;max-width:none}
  nav.actions{margin-left:0;flex-basis:100%;gap:4px}
  nav.actions button,nav.actions .btn{padding:5px 8px;font-size:12.5px}
  .mtabs{display:flex;position:sticky;top:0;z-index:8;background:var(--ink2);border-bottom:1px solid var(--line)}
  .mtabs button{flex:1;border:0;border-radius:0;background:transparent;padding:10px 2px;color:var(--muted);border-bottom:2px solid transparent;font-size:13px}
  .mtabs button[aria-selected="true"]{color:var(--brass2);border-bottom-color:var(--brass)}
  main.app{display:block}
  .deck{height:calc(100svh - 196px);min-height:380px}
  aside.side{border-left:0;display:block}
  .chartpane{height:calc(100svh - 196px);min-height:380px}
  .panel .tabs{display:none}
  .tabpane{overflow:visible}
  body[data-view="deck"] aside.side{display:none}
  body:not([data-view="deck"]) .deck{display:none}
  body:not([data-view="chart"]) .chartpane{display:none}
  body[data-view="chart"] .panel{display:none}
  body[data-view="deck"] .panel{display:none}
  .sextant{position:fixed;z-index:15;background:#03060e;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,46svh) auto;padding:10px 12px;gap:6px;overflow:auto}
  .sxpanel{overflow:visible;min-width:0;gap:7px}
  .sxread{font-size:26px}
  .drum{grid-template-columns:repeat(3,minmax(0,1fr))}
  .drum button{font-size:12.5px;padding:8px 2px}
  .sxlong{display:none}
  .markbtn{padding:12px 10px}
  .coach{max-width:calc(100% - 20px);left:10px;top:10px;padding:10px 12px 8px}
  .coach li{font-size:12.5px}
  .deckhud{bottom:44px;right:6px}
  .bodycard{left:10px!important;right:10px;top:auto!important;bottom:88px;max-width:none}
}
</style>
</head>
<body data-view="deck">
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="30" fill="#0b1531" stroke="#d6ab52" stroke-width="2"/>
      <path d="M32 9 L35 28 L54 32 L35 36 L32 55 L29 36 L10 32 L29 28 Z" fill="#f2d185"/>
      <path d="M12 44 Q32 50 52 44" stroke="#5aa7ff" stroke-width="2.5" fill="none"/>
    </svg>
    <div><h1>STARFIX</h1><span class="sub" id="voyName">—</span></div>
  </div>
  <div class="clock" title="Ship's chronometer. Your sights are timed by it.">
    <div class="chron" id="chron">--:--:--</div>
    <div class="chronsub" id="chronSub">chronometer</div>
  </div>
  <div class="phase" id="phase"></div>
  <nav class="actions" aria-label="Session">
    <button id="btnVoyages">Voyages</button>
    <button id="btnGuide" aria-pressed="true">Guide</button>
    <button id="btnAbout">About this idea</button>
    <button id="btnSound" aria-pressed="false" title="Sea wash, chronometer tick and bells (off until you turn it on)">Sound off</button>
    <button id="btnExport" title="Download the voyage log as a JSON file">Export log</button>
    <label class="btn" for="fileImport" tabindex="0" id="lblImport" title="Restore a previously exported voyage log">Import</label>
    <input type="file" id="fileImport" accept=".json,application/json" hidden>
    <button id="btnReset" class="danger" title="Discard everything and restore the opening state">Reset</button>
  </nav>
</header>
<nav class="mtabs" id="mtabs" role="tablist" aria-label="Views">
  <button data-view="deck" aria-selected="true">Deck</button>
  <button data-view="chart" aria-selected="false">Chart</button>
  <button data-view="helm" aria-selected="false">Helm</button>
  <button data-view="sights" aria-selected="false">Sights</button>
  <button data-view="planner" aria-selected="false">Planner</button>
</nav>
<main class="app">
  <section class="deck" id="paneDeck" aria-label="Deck view of sky and sea">
    <canvas id="deckCanvas" tabindex="0" aria-label="Sky and horizon from the deck. Drag to look around, click a star or the Sun to select it."></canvas>
    <div class="coach" id="coach" role="region" aria-label="Navigator's guide"></div>
    <div class="bodycard" id="bodyCard" hidden role="dialog" aria-label="Selected body"></div>
    <div class="landho" id="landho" hidden>Land ho!</div>
    <div class="deckhud">
      <button id="lookL" title="Look left (←)">◀ Look</button>
      <button id="lookR" title="Look right (→)">Look ▶</button>
      <button id="btnLabels" aria-pressed="true" title="Show names of navigational stars">Star names</button>
    </div>
    <div class="sextant" id="sextant" hidden role="dialog" aria-label="Sextant">
      <div class="eyewrap"><canvas id="eyeCanvas" tabindex="0" aria-label="Sextant telescope view. Turn the drum with the mouse wheel, arrow keys, or by dragging up and down."></canvas></div>
      <div class="sxpanel">
        <div><div class="sxtitle" id="sxBody">—</div><div class="sxnote" id="sxBodyNote"></div></div>
        <div class="sxread"><small>Sextant reading (Hs)</small><span id="sxHs">--°--.-′</span></div>
        <div class="drum" role="group" aria-label="Micrometer drum">
          <button data-d="10" title="Page Up = 1°">Arc +10′ ▼</button>
          <button data-d="-10">Arc −10′ ▲</button>
          <button data-d="1" title="↓ key">Arc +1′ ▼</button>
          <button data-d="-1" title="↑ key">Arc −1′ ▲</button>
          <button data-d="0.2">+0.2′</button>
          <button data-d="-0.2">−0.2′</button>
        </div>
        <p class="sxnote sxlong">▼/▲ show which way the body's image moves. Wheel, ↑/↓ (Shift ×10), PgUp/PgDn (1°) or drag the view also turn the drum.</p>
        <div><div class="sxnote">Sextant tilt — mark as the body passes the bottom of its swing</div><div class="tilt" aria-hidden="true"><div class="c"></div><div class="b" id="tiltB"></div></div></div>
        <button class="primary markbtn" id="btnMark">MARK <span style="font-weight:400;font-size:12px">(Space)</span></button>
        <div class="btnrow"><button id="btnPreset" title="Set the arc to the altitude predicted from your dead-reckoning position">Preset from DR</button><button id="btnSxClose">Done (Esc)</button></div>
        <div class="sxnote mono" id="sxClock"></div>
        <div class="sxnote" id="sxMsg" aria-live="polite"></div>
      </div>
    </div>
  </section>
  <aside class="side">
    <section class="chartpane" id="paneChart" aria-label="Plotting sheet">
      <canvas id="chartCanvas" tabindex="0" aria-label="Plotting sheet: dead reckoning, lines of position and fixes. Drag to pan, wheel to zoom."></canvas>
      <div class="charttools">
        <button id="chZoomIn" title="Zoom in">+</button>
        <button id="chZoomOut" title="Zoom out">−</button>
        <button id="chCenter" title="Center on current dead-reckoning position">DR</button>
        <button id="chFit" title="Fit voyage">Fit</button>
      </div>
      <div class="chartlegend" id="chartLegend"></div>
    </section>
    <section class="panel">
      <div class="tabs" role="tablist" aria-label="Panels">
        <button data-tab="helm" role="tab" aria-selected="true">Helm &amp; time</button>
        <button data-tab="sights" role="tab" aria-selected="false">Sights &amp; fix</button>
        <button data-tab="planner" role="tab" aria-selected="false">Star planner</button>

function openAbout() {

  <h3>What you can do</h3>

    <li>Position of the Sun — Wikipedia<br><span class="u">https://en.wikipedia.org/wiki/Position_of_the_Sun</span></li>
    <li>Atmospheric refraction (Bennett and Sæmundsson formulas) — Wikipedia<br><span class="u">https://en.wikipedia.org/wiki/Atmospheric_refraction</span></li>
    <li>Altitude Correction for Dip — Astro Navigation Demystified<br><span class="u">https://astronavigationdemystified.com/altitude-correction-for-dip/</span></li>
    <li>Correcting Sextant Measurements For Dip — Math Encounters (mathscinotes)<br><span class="u">https://www.mathscinotes.com/2015/10/correcting-sextant-measurements-for-dip/</span></li>
    <li>Pitcairn Islands (history: Carteret, 1767) — Wikipedia<br><span class="u">https://en.wikipedia.org/wiki/Pitcairn_Islands</span></li>

    Object.assign(N, { t: st.t, running: false, truePos: st.truePos.slice(), legs: st.legs.map(l => ({ t: l.t, crs: norm360(l.crs), spd: l.spd })), anchors: st.anchors.map(a => ({ t: a.t, pos: a.pos.slice(), kind: a.kind || 'fix' })), trueTrack: st.trueTrack.map(p => p.slice()), fixes: st.fixes.map(f => Object.assign({}, f)), nextId: Math.max(isNum(st.nextId) ? st.nextId : 1, ...st.sights.map(x => x.id + 1)), status: st.status, end: st.end || null, reveal: !!st.reveal, practiceUsed: !!st.practiceUsed, landSeen: !!st.landSeen, sea: SEA[st.sea] ? st.sea : N.sea, selSight: isNum(st.selSight) ? st.selSight : null, lastTrackT: st.t });
    S = N;
    S.sights = st.sights.map(x => { const s = { id: x.id, body: x.body, Hs: x.Hs, IC: x.IC, hEye: x.hEye, t: x.t, chron: x.chron, utc: x.utc, ap: x.ap.slice(), use: !!x.use, consumed: !!x.consumed, truth: Object.assign({ tilt: 0 }, x.truth) }; s.red = reduce(s); s.truth.lopErr = lopError(s); return s; });

    UI.chart.center = null;
    renderAll();

  };
  rd.onerror = () => { if (myGen === GEN) toast('Could not read that file.', 'bad'); };
  rd.readAsText(file);
}

/* ======================================================================
   EVENTS
   ====================================================================== */
function resetSession() {
  Snd.disable();
  UI.vfov = 55; UI.tab = 'helm'; setTab('helm'); setView('deck');
  startVoyage(VOYAGES[0]);
  toast('Session reset: the opening voyage is restored.');
}
function setTab(tab) {
  UI.tab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  $('paneHelm').hidden = tab !== 'helm'; $('paneSights').hidden = tab !== 'sights'; $('panePlanner').hidden = tab !== 'planner';
}
function setView(view) {

}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act],[data-voy],[data-skip],[data-crs],[data-sight],[data-body],[data-tab],[data-view],[data-d]');
  if (!t) return;

  if (t.dataset.tab) { setTab(t.dataset.tab); return; }
  if (t.dataset.view && t.closest('#mtabs')) { setView(t.dataset.view); return; }
  if (t.dataset.voy) { startVoyage(VOYAGES.find(v => v.id === t.dataset.voy), 'New voyage: ' + VOYAGES.find(v => v.id === t.dataset.voy).title); return; }
  if (t.dataset.skip) { skipTo(S.t + Number(t.dataset.skip), 'Time passes'); return; }
  if (t.dataset.crs) { const L = legAt(S.t); setLeg(L.crs + Number(t.dataset.crs), L.spd); return; }
  if (t.dataset.sight && !ev.target.matches('input')) { S.selSight = Number(t.dataset.sight); chartDirty = true; renderSights(); return; }
  if (t.dataset.body) { selectBody(t.dataset.body, true); if (UI.view === 'planner') setView('deck'); return; }
  const a = t.dataset.act;
  switch (a) {
    case 'closecard': S.selBody = null; renderBodyCard(); renderPlanner(); break;
    case 'sight': openSextant(S.selBody); break;
    case 'hidecoach': UI.coach = false; renderCoach(); renderHeader(); break;
    case 'closemodal': closeModal(); break;
    case 'steer': { const dr = drNow(), isl = S.voy.island; setLeg(Geo.rhumbTo(dr[0], dr[1], isl.lat, isl.lon).crs, legAt(S.t).spd || 6); toast('Course set for ' + isl.name + ' from your DR.'); break; }
    case 'heaveto': setLeg(legAt(S.t).crs, 0); break;
    case 'pause': S.running = !S.running; renderHelm(); break;
    case 'twilight': skipTo(nextStarWindow(), 'Star twilight'); break;
    case 'noon': skipTo(nextNoon(), 'Approaching local noon'); break;
    case 'adopt': adoptFix(); break;
    case 'delsight': { const id = Number(t.dataset.id); S.sights = S.sights.filter(s => s.id !== id); if (S.selSight === id) S.selSight = null; S.tick++; chartDirty = true; renderSights(); renderCoach(); break; }
    case 'abandon': endVoyage('abandoned'); break;
    case 'debrief': openDebrief(); break;
    case 'retry': { const v = VOYAGES.find(x => x.id === S.voy.id) || S.voy; startVoyage(v, 'Voyage restarted: ' + v.title); break; }
    case 'voyages': openVoyages(); break;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'inCourse') { const L = legAt(S.t); const v = Number(t.value); if (Number.isFinite(v)) setLeg(v, L.spd); else renderHelm(); }
  else if (t.id === 'inSpeed') { const L = legAt(S.t); setLeg(L.crs, Number(t.value)); }
  else if (t.id === 'inSea') { S.sea = t.value; renderHelm(); t.blur(); }
  else if (t.id === 'inReveal') { S.reveal = t.checked; if (t.checked) S.practiceUsed = true; renderAll(); }
  else if (t.dataset.use) { const s = S.sights.find(x => x.id === Number(t.dataset.use)); if (s) { s.use = t.checked; chartDirty = true; renderSights(); } }
  else if (t.id === 'fileImport') { const f = t.files && t.files[0]; t.value = ''; if (f) importLog(f); }
});
document.addEventListener('input', ev => { if (ev.target.id === 'inSpeed') { const sp = ev.target.nextElementSibling; if (sp) sp.textContent = Number(ev.target.value).toFixed(1) + ' kn'; } });
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'customForm') return; ev.preventDefault();
  try { const v = readCustom(ev.target); startVoyage(v, 'Custom voyage: ' + v.island.name); }
  catch (err) { $('customErr').textContent = err.message; }
});
$('btnVoyages').onclick = openVoyages;
$('btnAbout').onclick = openAbout;
$('btnGuide').onclick = () => { UI.coach = !UI.coach; renderCoach(); renderHeader(); };
$('btnSound').onclick = () => { Snd.on ? Snd.disable() : Snd.enable(); renderHeader(); };
$('btnExport').onclick = exportLog;
$('btnReset').onclick = resetSession;
$('lblImport').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('fileImport').click(); } });
$('btnLabels').onclick = () => { S.labels = !S.labels; renderHeader(); };
$('lookL').onclick = () => { UI.yaw = norm360(UI.yaw - 20); };
$('lookR').onclick = () => { UI.yaw = norm360(UI.yaw + 20); };
$('btnMark').onclick = markSight;
$('btnPreset').onclick = () => { const X = UI.sextant; if (!X) return; X.R = Math.round(predictedHs(X.body, S.t, drNow()).Hs * 12) / 12; $('sxMsg').textContent = 'Arc preset from DR.'; };
$('btnSxClose').onclick = closeSextant;
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('chZoomIn').onclick = () => { UI.chart.scale = clamp(UI.chart.scale * 1.5, 0.15, 60); chartDirty = true; };
$('chZoomOut').onclick = () => { UI.chart.scale = clamp(UI.chart.scale / 1.5, 0.15, 60); chartDirty = true; };
$('chCenter').onclick = () => { UI.chart.center = null; chartDirty = true; };
function chartFit() {
  const fx = computeFix(), active = S.status === 'sailing' && S.sights.some(x => x.use);
  // while working sights, frame the DR, the LOPs and the fix; otherwise show the passage to the island
  const pts = active ? [drNow()] : [drNow(), [S.voy.island.lat, S.voy.island.lon], ...S.fixes.slice(-2).map(f => f.pos)];
  if (fx && fx.pos) pts.push(fx.pos);
  for (const sg of S.sights.filter(x => x.use)) pts.push(Geo.rhumb(sg.red.ap[0], sg.red.ap[1], sg.red.Zn, sg.red.intercept));
  if (S.fixes.length === 0) pts.push(S.voy.dr);
  if (S.reveal || S.status !== 'sailing') { pts.push(S.truePos); for (const p of S.trueTrack) pts.push([p[1], p[2]]); }
  const lat = pts.map(p => p[0]), lon = pts.map(p => p[1]);
  const c = [(Math.min(...lat) + Math.max(...lat)) / 2, (Math.min(...lon) + Math.max(...lon)) / 2];
  const ext = pts.map(p => Geo.toXY(c, p[0], p[1]));
  const wx = Math.max(10, ...ext.map(e => Math.abs(e[0]))) * 2.5 + 20, wy = Math.max(10, ...ext.map(e => Math.abs(e[1]))) * 2.5 + 20;
  if (!chartC.clientWidth) { UI.chart.fitted = false; return; }
  UI.chart.fitted = true;
  UI.chart.center = c; UI.chart.scale = clamp(Math.min(chartC.clientWidth / wx, chartC.clientHeight / wy), 0.15, 60); chartDirty = true;

$('chFit').onclick = chartFit;

// keyboard
const keyDown = new Set();
document.addEventListener('keydown', e => {
  if (!$('modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (UI.sextant) {
    const k = e.key, big = e.shiftKey ? 10 : 1;
    if (k === 'ArrowDown') { drum(0.5 * big); e.preventDefault(); }
    else if (k === 'ArrowUp') { drum(-0.5 * big); e.preventDefault(); }
    else if (k === 'PageDown') { drum(60); e.preventDefault(); }
    else if (k === 'PageUp') { drum(-60); e.preventDefault(); }
    else if ((k === ' ' || k === 'Enter') && !(e.target.tagName === 'BUTTON' && k === 'Enter')) { if (!e.repeat) markSight(); e.preventDefault(); }
    else if (k === 'Escape') { closeSextant(); e.preventDefault(); }
    return;
  }
  if (e.target === deckC || e.target === document.body) {
    if (e.key === 'ArrowLeft') { UI.yaw = norm360(UI.yaw - 5); e.preventDefault(); }
    else if (e.key === 'ArrowRight') { UI.yaw = norm360(UI.yaw + 5); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { UI.pitch = clamp(UI.pitch + 3, 0, 75); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { UI.pitch = clamp(UI.pitch - 3, 0, 75); e.preventDefault(); }
    else if (e.key === 'Enter' && S.selBody) { openSextant(S.selBody); e.preventDefault(); }
  }
});
window.addEventListener('blur', () => { keyDown.clear(); endDrags(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) endDrags(); });

// deck pointer: drag to look, click to select
let deckDrag = null;
deckC.addEventListener('pointerdown', e => {
  deckC.setPointerCapture(e.pointerId); deckC.focus({ preventScroll: true });
  deckDrag = { id: e.pointerId, x: e.clientX, y: e.clientY, yaw: UI.yaw, pitch: UI.pitch, moved: false };
});
deckC.addEventListener('pointermove', e => {
  if (!deckDrag || deckDrag.id !== e.pointerId) return;
  const dx = e.clientX - deckDrag.x, dy = e.clientY - deckDrag.y;
  if (Math.hypot(dx, dy) > 4) { deckDrag.moved = true; deckC.classList.add('dragging'); }
  if (deckDrag.moved) {
    const degPerPx = UI.vfov / deckC.clientHeight;
    UI.yaw = norm360(deckDrag.yaw - dx * degPerPx); UI.pitch = clamp(deckDrag.pitch + dy * degPerPx, 0, 75);
  }
});
function deckUp(e) {
  if (!deckDrag || deckDrag.id !== e.pointerId) return;
  const d = deckDrag; deckDrag = null; deckC.classList.remove('dragging');
  if (e.type === 'pointercancel' || d.moved) return;
  const r = deckC.getBoundingClientRect(), dpr = deckC.width / r.width;
  const x = (e.clientX - r.left) * dpr, y = (e.clientY - r.top) * dpr;
  let best = null, bd = 26 * dpr;
  for (const hh of deckHits) { const dd = Math.hypot(hh.x - x, hh.y - y); if (dd < bd) { bd = dd; best = hh; } }
  if (best) { selectBody(best.b.name, false); } else { S.selBody = null; renderBodyCard(); renderPlanner(); }
}
deckC.addEventListener('pointerup', deckUp);
deckC.addEventListener('pointercancel', deckUp);
deckC.addEventListener('dblclick', () => { if (S.selBody) openSextant(S.selBody); });
deckC.addEventListener('wheel', e => { e.preventDefault(); UI.vfov = clamp(UI.vfov * Math.exp(e.deltaY * 0.001), 20, 90); }, { passive: false });

// eyepiece: drag / wheel turns the drum (drag the image onto the horizon)
let eyeDrag = null;
eyeC.addEventListener('pointerdown', e => { eyeC.setPointerCapture(e.pointerId); eyeDrag = { id: e.pointerId, y: e.clientY }; });
eyeC.addEventListener('pointermove', e => {
  if (!eyeDrag || eyeDrag.id !== e.pointerId || !UI.sextant) return;
  const r = eyeC.getBoundingClientRect(), size = Math.min(r.width, r.height), pxPerArc = size * 0.47 / 32;
  drum((e.clientY - eyeDrag.y) / pxPerArc); eyeDrag.y = e.clientY;
});
const eyeUp = e => { if (eyeDrag && eyeDrag.id === e.pointerId) eyeDrag = null; };
eyeC.addEventListener('pointerup', eyeUp); eyeC.addEventListener('pointercancel', eyeUp);
eyeC.addEventListener('wheel', e => { e.preventDefault(); const d = e.deltaY || e.deltaX; drum(d * (e.deltaMode === 1 ? 0.33 : 0.01) * (e.shiftKey ? 10 : 1)); }, { passive: false });

// chart pointer
let chDrag = null;
chartC.addEventListener('pointerdown', e => { chartC.setPointerCapture(e.pointerId); const v = chartView(); chDrag = { id: e.pointerId, x: e.clientX, y: e.clientY, c: v.center.slice() }; });
chartC.addEventListener('pointermove', e => {
  if (!chDrag || chDrag.id !== e.pointerId) return;
  const dx = e.clientX - chDrag.x, dy = e.clientY - chDrag.y;
  UI.chart.center = Geo.fromXY(chDrag.c, -dx / UI.chart.scale, dy / UI.chart.scale); chartDirty = true;
});
const chUp = e => { if (chDrag && chDrag.id === e.pointerId) chDrag = null; };
chartC.addEventListener('pointerup', chUp); chartC.addEventListener('pointercancel', chUp);
chartC.addEventListener('wheel', e => {
  e.preventDefault();
  const v = chartView(), r = chartC.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const before = s2c(v, mx, my); const k = Math.exp(-e.deltaY * 0.0015);
  UI.chart.scale = clamp(UI.chart.scale * k, 0.15, 60);
  const v2 = Object.assign({}, v, { sc: UI.chart.scale }); const after = s2c(v2, mx, my);
  UI.chart.center = [v.center[0] + before[0] - after[0], norm180(v.center[1] + before[1] - after[1])]; chartDirty = true;
}, { passive: false });
function endDrags() { deckDrag = null; eyeDrag = null; chDrag = null; deckC.classList.remove('dragging'); }
new ResizeObserver(() => { chartDirty = true; }).observe(chartC);

/* ---------- main loop ---------- */
let lastRT = performance.now(), lastPanelTick = -1, lastChartTick = -1, lastSec = -1;
function loop(now) {
  const dt = Math.min(0.25, Math.max(0, (now - lastRT) / 1000)); lastRT = now;
  const rt = now / 1000;
  if (S.running && S.status === 'sailing' && $('modal').hidden) { advanceBy(dt * 1000); }
  try {
    if (UI.view === 'deck' || UI.sextant) { if (UI.sextant) drawEyepiece(rt); else drawDeck(rt); }
    const sec = Math.floor(S.t / 1000);
    if (sec !== lastSec) {
      lastSec = sec; renderDynamic();
      if (UI.sextant && Snd.on) Snd.tick();
      if (sec % 20 === 0) { chartDirty = true; renderHelm(); if (UI.tab === 'planner' || UI.view === 'planner') renderPlanner(); if (!$('bodyCard').contains(document.activeElement)) renderBodyCard(); }
    } else if (UI.sextant) renderDynamic();
    if (S.tick !== lastPanelTick) { lastPanelTick = S.tick; renderPanels(); renderCoach(); chartDirty = true; }
    if (chartDirty && (UI.view !== 'deck' || window.innerWidth > 900)) drawChart();
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}

/* read-only diagnostics for testing */
window.starfix = Object.freeze({
  summary: () => ({ voyage: S.voy.id, status: S.status, t: new Date(S.t).toISOString(), chron: new Date(chronNow()).toISOString(), running: S.running, truePos: S.truePos.slice(), dr: drNow(), sights: S.sights.map(s => ({ id: s.id, body: s.body, Hs: s.Hs, Ho: s.red.Ho, Hc: s.red.Hc, Zn: s.red.Zn, intercept: s.red.intercept, errArc: s.truth.errArc, lopErr: s.truth.lopErr, use: s.use })), fix: (() => { const f = computeFix(); return f && { kind: f.kind, pos: f.pos, err: f.err, cut: f.cut, ellipse: f.ellipse, n: f.n }; })(), fixes: S.fixes.map(f => ({ t: f.t, pos: f.pos, err: f.err, kind: f.kind })), sextant: UI.sextant ? { body: UI.sextant.body.name, R: UI.sextant.R, off: UI.sextant.lastG && UI.sextant.lastG.off, phi: UI.sextant.lastG && UI.sextant.lastG.phi } : null, legs: S.legs.slice(), end: S.end, island: islandInfo(), gen: GEN, audio: Snd.ctx ? Snd.ctx.state : 'off', dragging: { deck: !!deckDrag, eye: !!eyeDrag, chart: !!chDrag } }),
  screenOf: name => { const h = deckHits.find(d => d.b.name === name); if (!h) return null; const r = deckC.getBoundingClientRect(), dpr = deckC.width / r.width; return { x: r.left + h.x / dpr, y: r.top + h.y / dpr }; }
});

startVoyage(VOYAGES[0]);
requestAnimationFrame(loop);

</script>
