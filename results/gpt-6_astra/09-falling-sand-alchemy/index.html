const DEFAULT_PHYSICS={gravity:'down',ambient:20,heatRate:1,reactionRate:1,liquidMobility:3,gasDiffusion:1,fireIntensity:1,explosionStrength:1};
class AlchemyEngine{
 constructor(width=384,height=240,seed=48271){this.width=width;this.height=height;this.length=width*height;this.seed=seed>>>0;this.rng=this.seed||1;this.tick=0;this.reactions=0;this.lastReactions=0;this.explosions=0;this.events=[];this.settings={...DEFAULT_PHYSICS};this.allocate();}

 random(){let x=this.rng;x^=x<<13;x^=x>>>17;x^=x<<5;this.rng=x>>>0;return this.rng/4294967296;}
 index(x,y){return x<0||y<0||x>=this.width||y>=this.height?-1:y*this.width+x;}

 put(i,id,t){const m=MATERIALS[id];this.id[i]=id;this.temp[i]=id?(t??m.temp??this.settings.ambient):0;this.variant[i]=id?(this.random()*255)|0:0;this.fuel[i]=m.fuel||0;this.life[i]=m.life?Math.max(1,(m.life*(.65+this.random()*.7))|0):id===M.PLANT?120:0;this.charge[i]=id===M.ELECTRICITY?1:0;this.vx[i]=this.vy[i]=this.salt[i]=this.activity[i]=0;this.updated[i]=this.tick;}
 change(i,id,t){const heat=t??this.temp[i],vx=this.vx[i],vy=this.vy[i],salt=this.salt[i];this.put(i,id,heat);this.vx[i]=vx;this.vy[i]=vy;this.salt[i]=salt;this.activity[i]=1;this.reactions++;this.lastReactions++;}
 swap(i,j){for(const key of ['id','variant','temp','vx','vy','fuel','life','charge','salt','activity','order']){const a=this[key],v=a[i];a[i]=a[j];a[j]=v;}this.updated[i]=this.updated[j]=this.tick;}
 canMove(i,j,gas=false){if(j<0||this.updated[j]===this.tick)return false;const id=this.id[j];if(!id)return true;const a=MATERIALS[this.id[i]],b=MATERIALS[id];if(b.phase==='solid'||b.phase==='powder')return false;if(gas)return b.phase==='gas'&&a.density<b.density&&this.random()<.4;return a.density>b.density+.03;}
 move(i,dx,dy,gas=false){const x=i%this.width,y=(i/this.width)|0,j=this.index(x+dx,y+dy);if(!this.canMove(i,j,gas))return -1;this.swap(i,j);this.vx[j]=this.vx[j]*.65+dx*.35;this.vy[j]=this.vy[j]*.65+dy*.35;return j;}
 neighbors(i){const x=i%this.width,y=(i/this.width)|0;return [x?i-1:-1,x<this.width-1?i+1:-1,y?i-this.width:-1,y<this.height-1?i+this.width:-1];}
 blast(cx,cy,radius=12,strength=1){this.explosions++;this.events.push({x:cx,y:cy,r:radius,tick:this.tick});if(this.events.length>20)this.events.shift();for(let y=Math.max(0,cy-radius);y<=Math.min(this.height-1,cy+radius);y++)for(let x=Math.max(0,cx-radius);x<=Math.min(this.width-1,cx+radius);x++){const dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy);if(d>radius)continue;const i=y*this.width+x,p=1-d/radius,id=this.id[i];if(id){this.temp[i]+=900*p*strength;this.activity[i]=1;if(id===M.EXPLOSIVE||id===M.GAS||(MATERIALS[id].fuel&&this.random()<p*.6))this.change(i,M.FIRE,1000);else if((id===M.STONE||id===M.GLASS)&&p>.65&&this.random()<.3)this.change(i,M.SAND,400);this.vx[i]=Math.max(-18,Math.min(18,dx/(d||1)*p*15*strength));this.vy[i]=Math.max(-18,Math.min(18,dy/(d||1)*p*15*strength));}else if(this.random()<p*.25){this.put(i,M.FIRE,900);this.vx[i]=dx*.6;this.vy[i]=dy*.6;}}}
 step(settings){if(settings)this.settings={...this.settings,...settings};const s=this.settings,w=this.width,h=this.height,n=this.length;this.tick++;this.lastReactions=0;let blasts=0,sequence=0;const gd={down:[0,1],up:[0,-1],left:[-1,0],right:[1,0],zero:[0,0]}[s.gravity]||[0,1],gx=gd[0],gy=gd[1];const reverse=this.tick%2===0;for(let row=0;row<h;row++){const y=gy>0?h-1-row:gy<0?row:reverse?h-1-row:row;const xr=(this.random()<.5);for(let col=0;col<w;col++){const x=xr?w-1-col:col,i=y*w+x;let id=this.id[i];if(!id)continue;this.order[i]=sequence++;const mat=MATERIALS[id];this.activity[i]*=.92;this.charge[i]*=.94;const ns=[x?i-1:-1,x<w-1?i+1:-1,y?i-w:-1,y<h-1?i+w:-1];const j=ns[(this.random()*4)|0];if(j>=0&&this.id[j]){const b=MATERIALS[this.id[j]],k=Math.min(.24,.1*s.heatRate*Math.sqrt(mat.heat*b.heat));const transfer=(this.temp[i]-this.temp[j])*k;this.temp[i]-=transfer;this.temp[j]+=transfer;}else{this.temp[i]+=(s.ambient-this.temp[i])*.0012*s.heatRate;}
 if(id===M.BATTERY&&this.fuel[i]>0){this.charge[i]=1;this.fuel[i]=Math.max(0,this.fuel[i]-.2*s.reactionRate);}
 if(this.charge[i]>.05){for(const j of ns){if(j<0)continue;const b=this.id[j],conduct=MATERIALS[b].conduct||(b===M.WATER?.12+Math.min(.7,this.salt[j]*.25):0);if(conduct){const q=this.charge[i]-(.025/(conduct||1));if(q>this.charge[j]){this.charge[j]=q;this.activity[j]=Math.max(this.activity[j],q);this.temp[j]+=q*.8;}}else if(MATERIALS[b].fuel&&this.charge[i]>.35){this.temp[j]+=35*this.charge[i];}}}
 if(id===M.WATER){if(this.temp[i]>100+this.salt[i]*2){this.change(i,M.STEAM,Math.max(110,this.temp[i]-12));continue;}if(this.temp[i]<-this.salt[i]*12){this.change(i,M.ICE,Math.min(-1,this.temp[i]));continue;}}
 else if(id===M.ICE&&this.temp[i]>1){this.change(i,M.WATER,2);continue;}
 else if(id===M.STEAM){if(this.temp[i]<88){this.change(i,M.WATER,Math.min(85,this.temp[i]));continue;}if(this.life[i])this.life[i]--;this.temp[i]-=.025*s.heatRate;}
 else if(id===M.LAVA){if(this.temp[i]<780){this.change(i,M.STONE,this.temp[i]);continue;}for(const j of ns)if(j>=0&&this.id[j]===M.WATER&&this.random()<.13*s.reactionRate){this.change(j,M.STEAM,180);this.temp[i]-=170;if(this.temp[i]<900||this.random()<.3)this.change(i,M.STONE,650);break;}}
 else if(id===M.MOLTEN&&this.temp[i]<1150){this.change(i,M.METAL,this.temp[i]);continue;}
 else if((id===M.METAL||id===M.BATTERY)&&this.temp[i]>1200){this.change(i,M.MOLTEN,this.temp[i]);continue;}
 else if(id===M.STONE&&this.temp[i]>1550){this.change(i,M.LAVA,this.temp[i]);continue;}
 else if(id===M.SAND&&this.temp[i]>1450){this.change(i,M.GLASS,this.temp[i]);continue;}
 else if(id===M.GLASS&&this.temp[i]>1900){this.change(i,M.LAVA,this.temp[i]);continue;}
 if(id===M.SALT){for(const j of ns)if(j>=0&&this.id[j]===M.WATER&&this.salt[j]<5&&this.random()<.18*s.reactionRate){this.salt[j]+=1;this.activity[j]=1;this.change(i,M.EMPTY);break;}if(!this.id[i])continue;}
 if(id===M.WATER&&this.salt[i]>.01&&j>=0&&this.id[j]===M.WATER){const d=(this.salt[i]-this.salt[j])*.16;this.salt[i]-=d;this.salt[j]+=d;}
 if(id===M.ACID){for(const j of ns){if(j<0)continue;const target=this.id[j];const susceptibility=target===M.WOOD||target===M.PLANT?1:target===M.METAL?.10:target===M.SOIL?.25:target===M.SAND?.035:target===M.ICE?.2:0;if(susceptibility&&this.random()<susceptibility*.07*s.reactionRate){this.change(j,this.random()<.2?M.GAS:M.EMPTY,35);this.fuel[i]-=8;this.activity[i]=1;break;}}if(this.fuel[i]<=0){this.change(i,M.WATER,35);continue;}}
 if(id===M.PLANT){let wet=false;for(const j of ns)if(j>=0&&this.id[j]===M.WATER){wet=true;this.life[i]=Math.min(500,this.life[i]+12);if(this.random()<.028*s.reactionRate&&this.temp[i]>0&&this.temp[i]<65){const dir=this.random()<.65?2:(this.random()<.5?0:1),q=ns[dir];if(q>=0&&!this.id[q]){this.change(q,M.PLANT,20);this.life[q]=100;if(this.random()<.1)this.change(j,M.EMPTY);}}}if(!wet&&this.life[i]>0)this.life[i]--;if(!wet&&this.life[i]>30&&this.random()<.0008*s.reactionRate){const q=ns[2];if(q>=0&&!this.id[q]){this.change(q,M.PLANT,20);this.life[q]=this.life[i]/2;}}}
 if(id===M.FIRE){if(this.life[i])this.life[i]--;this.temp[i]=Math.max(this.temp[i],600*s.fireIntensity);for(const j of ns){if(j<0)continue;const target=this.id[j];if(target===M.WATER||target===M.ICE){if(this.random()<.06*s.reactionRate){this.change(j,M.STEAM,125);this.change(i,M.SMOKE,110);break;}}else if(target){this.temp[j]+=24*s.fireIntensity*s.reactionRate;if(MATERIALS[target].fuel)this.activity[j]=1;}else if(this.random()<.018*s.fireIntensity&&this.life[i]>20){this.put(j,M.FIRE,700);this.life[j]=Math.min(18,this.life[i]-10);}}
 if(!this.life[i]){this.change(i,this.random()<.65?M.SMOKE:M.EMPTY,160);continue;}}
 else if(mat.ignite&&(this.temp[i]>mat.ignite||this.charge[i]>.5||((id===M.EXPLOSIVE||id===M.GAS)&&ns.some(j=>j>=0&&this.id[j]===M.FIRE)))){if(id===M.EXPLOSIVE||id===M.GAS){if(blasts<4){blasts++;this.blast(x,y,Math.round((id===M.GAS?8:15)*Math.sqrt(s.explosionStrength)),s.explosionStrength);continue;}}else{this.fuel[i]-=(id===M.OIL?3:1.7)*s.fireIntensity*s.reactionRate;this.temp[i]+=1.8*s.fireIntensity;this.activity[i]=1;for(const j of ns)if(j>=0&&!this.id[j]&&this.random()<.12*s.fireIntensity*s.reactionRate){this.put(j,M.FIRE,800);this.reactions++;this.lastReactions++;}if(this.fuel[i]<=0){this.change(i,id===M.OIL?M.SMOKE:M.ASH,220);continue;}}}
 if(id===M.SMOKE){if(this.life[i])this.life[i]--;if(!this.life[i]){this.put(i,M.EMPTY);continue;}}
 if(id===M.ELECTRICITY){this.charge[i]=1;for(const j of ns)if(j>=0){const b=this.id[j];if(MATERIALS[b].conduct||b===M.WATER){this.charge[j]=1;this.activity[j]=1;this.lastReactions++;this.reactions++;}else if(MATERIALS[b].fuel)this.temp[j]+=100;}if(this.life[i])this.life[i]--;if(!this.life[i]){this.put(i,M.EMPTY);continue;}}
 if(this.updated[i]===this.tick)continue;id=this.id[i];if(!id)continue;const phase=MATERIALS[id].phase;this.vx[i]*=.86;this.vy[i]*=.86;
 if(Math.abs(this.vx[i])+Math.abs(this.vy[i])>1.7){const dx=Math.abs(this.vx[i])>.7?Math.sign(this.vx[i]):0,dy=Math.abs(this.vy[i])>.7?Math.sign(this.vy[i]):0;if(this.move(i,dx,dy)>=0)continue;this.vx[i]*=.5;this.vy[i]*=.5;}
 if(phase==='solid')continue;
 const gas=phase==='gas'||phase==='energy';const sign=this.random()<.5?-1:1;const dx=gas?-gx:gx,dy=gas?-gy:gy,px=gy||(!gx?1:0),py=-gx;
 if(gas&&this.random()>.45*s.gasDiffusion)continue;
 if((dx||dy)&&this.move(i,dx,dy,gas)>=0)continue;
 if((dx||dy)&&this.move(i,dx+px*sign,dy+py*sign,gas)>=0)continue;
 if((dx||dy)&&this.move(i,dx-px*sign,dy-py*sign,gas)>=0)continue;
 if(phase==='liquid'||gas||s.gravity==='zero'){const reach=gas?Math.max(1,Math.round(s.gasDiffusion*2)):Math.max(1,Math.round(s.liquidMobility));for(let side=0;side<2;side++){let last=-1;const dir=side?-sign:sign;for(let d=1;d<=reach;d++){const q=this.index(x+px*d*dir,y+py*d*dir);if(q<0||!this.canMove(i,q,gas))break;last=q;}if(last>=0){const tx=last%w-x,ty=((last/w)|0)-y;this.swap(i,last);this.vx[last]=tx*.4;this.vy[last]=ty*.4;break;}}}

Object.defineProperty(window,'alchemy',{value:Object.freeze({inspect:()=>({...engine.stats(),paused,speed,substeps,tool,selectedMaterial:MATERIALS[selected].name,mode,preset,seed,brush:{...brush},physics:{...engine.settings},fps:Number(fps.toFixed(1)),stepMs:Number(tickCost.toFixed(2)),strokes:strokeCount,canvas:{width:canvas.width,height:canvas.height,dpr}}),cell:(x,y)=>{const i=engine.index(x,y);if(i<0)return null;return Object.fromEntries([['material',MATERIALS[engine.id[i]].name],...['id','temp','vx','vy','fuel','life','charge','salt','activity','order'].map(k=>[k,engine[k][i]])]);},snapshot:()=>capture(),fingerprint:()=>{let hash=2166136261;for(const k of ['id','variant','temp','vx','vy','fuel','life','charge','salt','activity','updated','order']){const arr=new Uint8Array(engine[k].buffer);for(let i=0;i<arr.length;i++){hash^=arr[i];hash=Math.imul(hash,16777619);}}return`${engine.width}x${engine.height}:${engine.tick}:${engine.rng}:${hash>>>0}`;}}),writable:false});
materialList();selectMaterial(M.SAND);loadPreset('volcano',false);thumbnails();new ResizeObserver(resizeCanvas).observe($('#world-view'));resizeCanvas();rebuildBuffer();render();try{autosaveEnabled=localStorage.getItem('alchemia-autosave-enabled')!=='0';$('#autosave').checked=autosaveEnabled;$('#autosave-status').textContent=autosaveEnabled?'Autosave on':'Autosave off';const saved=localStorage.getItem('alchemia-autosave-v1');if(saved&&autosaveEnabled){try{applyLoaded(saved,false);toast('Your autosaved world is ready to continue.');}catch(error){autosaveEnabled=false;$('#autosave').checked=false;$('#autosave-status').textContent='Autosave needs attention';toast('The saved copy could not be restored. It has been kept on this device.',true);}}else if(saved)$('#autosave-status').textContent='Saved world available';}catch{$('#autosave-status').textContent='File saving available';}document.addEventListener('visibilitychange',()=>{lastFrame=performance.now();accumulator=0;});window.addEventListener('pagehide',()=>{if(autosaveEnabled)saveLocal();});requestAnimationFrame(animate);
