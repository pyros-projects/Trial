function drawObstacles(){ctx.save();for(const o of world.obstacles){ctx.beginPath();if(o.type==='circle')ctx.arc(o.x,o.y,o.r,0,Math.PI*2);else ctx.roundRect(o.x,o.y,o.w,o.h,Math.min(5,o.h/3));const y=o.type==='circle'?o.y-o.r:o.y,h=o.type==='circle'?o.r*2:o.h;const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#e8ebdf');g.addColorStop(1,'#d7ddcd');ctx.fillStyle=g;ctx.shadowColor='#4e614422';ctx.shadowBlur=12;ctx.shadowOffsetY=6;ctx.fill();ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.strokeStyle='#b6c0a9';ctx.lineWidth=1.1;ctx.stroke();ctx.save();ctx.clip();ctx.beginPath();const x=o.type==='circle'?o.x-o.r:o.x,ww=o.type==='circle'?o.r*2:o.w;for(let k=x-h;k<x+ww;k+=9){ctx.moveTo(k,y+h);ctx.lineTo(k+h,y);}ctx.strokeStyle='#91a17f22';ctx.lineWidth=.8;ctx.stroke();ctx.restore();}ctx.restore();}
function arrow(x,y,dx,dy,color,width=1){const d=Math.hypot(dx,dy);if(d<1.2)return;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx,y+dy);const a=Math.atan2(dy,dx),s=Math.min(4,d*.35);ctx.moveTo(x+dx-s*Math.cos(a-.5),y+dy-s*Math.sin(a-.5));ctx.lineTo(x+dx,y+dy);ctx.lineTo(x+dx-s*Math.cos(a+.5),y+dy-s*Math.sin(a+.5));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
function draw(){const {dpr,s,x,y,w,h}=view;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#f7f9f3';ctx.fillRect(0,0,w,h);ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 if(showGrid){ctx.fillStyle='#b9c5ad65';const step=25;for(let gx=0;gx<=1100;gx+=step)for(let gy=0;gy<=660;gy+=step){ctx.beginPath();ctx.arc(gx,gy,.75/s*.65,0,Math.PI*2);ctx.fill();}}
 ctx.beginPath();ctx.moveTo(18,world.floor);ctx.lineTo(1082,world.floor);ctx.strokeStyle='#b9c4ac';ctx.lineWidth=1;ctx.stroke();ctx.beginPath();for(let i=18;i<1082;i+=14){ctx.moveTo(i,world.floor+1);ctx.lineTo(i-6,world.floor+8);}ctx.strokeStyle='#cbd3c17a';ctx.stroke();ctx.fillStyle='#9caa9066';ctx.font='9px '+getComputedStyle(document.body).getPropertyValue('--mono');ctx.fillText('GROUND / STATIC',24,world.floor+23);
 drawObstacles();const surface=mode==='material'||mode==='stress';ctx.globalAlpha=surface?1:mode==='contacts'?.45:mode==='pins'?.4:.16;for(const b of world.bodies){if(b.type==='cloth')drawCloth(b);else if(b.type==='rope')drawRope(b);else drawBody(b);}ctx.globalAlpha=1;
 for(const c of world.constraints)if(c.active&&c.type==='attachment'){ctx.beginPath();ctx.moveTo(c.a.x,c.a.y);ctx.lineTo(c.b.x,c.b.y);ctx.strokeStyle='#9d927d';ctx.lineWidth=3;ctx.stroke();}
 if(mode==='constraints'){const colors={structural:'#629278bb',shear:'#7d9fb688',bending:'#c3a17155',attachment:'#80735fcc'};for(const type of ['bending','shear','structural','attachment']){ctx.beginPath();for(const c of world.constraints)if(c.active&&c.type===type){ctx.moveTo(c.a.x,c.a.y);ctx.lineTo(c.b.x,c.b.y);}ctx.strokeStyle=colors[type];ctx.lineWidth=type==='structural'?1.2:.8;ctx.stroke();}}
 if(mode==='particles'||mode==='constraints')for(const p of world.particles){ctx.beginPath();ctx.arc(p.x,p.y,mode==='particles'?2.6:1.35,0,Math.PI*2);ctx.fillStyle=p.pin?'#a87649':'#4f7f66';ctx.fill();}
 if(mode==='velocity')for(const p of world.particles){const d=Math.hypot(p.vx,p.vy),k=Math.min(.08,44/(d||1));arrow(p.x,p.y,p.vx*k,p.vy*k,'#6d998cb0',1.2);}
 if(mode==='stress'){for(const c of world.constraints)if(c.active&&c.strain>(world.settings.tearThreshold-1)*.6){ctx.beginPath();ctx.moveTo(c.a.x,c.a.y);ctx.lineTo(c.b.x,c.b.y);ctx.strokeStyle=stressColor(c.strain);ctx.lineWidth=2;ctx.stroke();}}
 if(mode==='contacts')for(const c of world.contactMarks){ctx.beginPath();ctx.arc(c.x,c.y,3.5,0,Math.PI*2);ctx.strokeStyle='#c27a43bb';ctx.lineWidth=1.4;ctx.stroke();arrow(c.x,c.y,c.nx*13,c.ny*13,'#c27a43bb',1);}
 if(mode==='cells'){ctx.font='8px '+getComputedStyle(document.body).getPropertyValue('--mono');for(const [key,ps] of world.cells){const [cx,cy]=key.split(',').map(Number),size=world.cellSize;ctx.fillStyle='#719a5613';ctx.fillRect(cx*size,cy*size,size,size);ctx.strokeStyle='#809c7159';ctx.lineWidth=.8;ctx.strokeRect(cx*size,cy*size,size,size);ctx.fillStyle='#6b8858';ctx.fillText(ps.length,cx*size+3,cy*size+9);}}
 for(const p of world.particles)if(p.pin){ctx.beginPath();ctx.arc(p.x,p.y,mode==='pins'?8:5.5,0,Math.PI*2);ctx.fillStyle='#fffdf0';ctx.fill();ctx.strokeStyle='#7d946b';ctx.lineWidth=1.7;ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fillStyle='#7d946b';ctx.fill();if(mode==='pins'){ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.strokeStyle='#7d946b50';ctx.lineWidth=1;ctx.stroke();}}
 if(selected&&world.particles.includes(selected)){ctx.beginPath();ctx.arc(selected.x,selected.y,12,0,Math.PI*2);ctx.setLineDash([3,3]);ctx.strokeStyle='#406e50';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);}
 if(world.drag){ctx.beginPath();ctx.moveTo(world.drag.p.x,world.drag.p.y);ctx.lineTo(world.drag.x,world.drag.y);ctx.setLineDash([4,5]);ctx.strokeStyle=world.drag.tear?'#ba795c':'#628d63';ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);}
 if(pointer.inside&&pending){ctx.save();ctx.translate(clamp(pointer.x,125,975),clamp(pointer.y,70,490));ctx.setLineDash([6,6]);ctx.strokeStyle='#668b65';ctx.fillStyle='#8caf7b15';ctx.lineWidth=1.5;ctx.beginPath();if(['ball','balloon','obstacle'].includes(pending))ctx.arc(0,0,pending==='ball'?33:48,0,Math.PI*2);else if(pending==='rope'){ctx.moveTo(-125,0);ctx.quadraticCurveTo(0,90,125,0);}else ctx.roundRect(-48,-45,96,pending==='cloth'?128:90,4);ctx.fill();ctx.stroke();ctx.restore();}
 else if(pointer.inside&&!pointer.pan&&['force','wind','cut'].includes(tool)){ctx.beginPath();ctx.arc(pointer.x,pointer.y,tool==='cut'?3+world.settings.radius*.045:world.settings.radius,0,Math.PI*2);ctx.strokeStyle=tool==='cut'?'#bd806b':'#8ba57277';ctx.lineWidth=1.2;ctx.setLineDash(tool==='cut'?[]:[4,6]);ctx.stroke();ctx.setLineDash([]);ctx.beginPath();ctx.arc(pointer.x,pointer.y,2,0,Math.PI*2);ctx.fillStyle='#7d9a6c';ctx.fill();}
 else if(pointer.inside&&!pointer.down){const p=world.nearest(pointer.x,pointer.y,Math.max(world.settings.radius,13/s));if(p){ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.strokeStyle='#527b5b90';ctx.lineWidth=1;ctx.stroke();}}
 for(let i=1;i<cutTrail.length;i++){const a=cutTrail[i-1],b=cutTrail[i];if(b.new)continue;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=`rgba(186,112,90,${Math.min(1,b.life)*.6})`;ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.stroke();ctx.setLineDash([]);}
 for(const e of world.effects){if(e.type==='impulse'){ctx.beginPath();ctx.arc(e.x,e.y,(1-e.life/.6)*e.radius,0,Math.PI*2);ctx.strokeStyle=`rgba(154,157,103,${e.life})`;ctx.lineWidth=2;ctx.stroke();}else{const age=.65-e.life;ctx.strokeStyle=`rgba(184,112,76,${e.life})`;ctx.lineWidth=1;for(let k=0;k<4;k++){const a=k*Math.PI/2+.4;ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*age*15,e.y+Math.sin(a)*age*15);ctx.lineTo(e.x+Math.cos(a)*(age*15+3),e.y+Math.sin(a)*(age*15+3));ctx.stroke();}}}
 for(const g of world.gusts){const age=1.4-g.life;for(let i=-1;i<=1;i++){ctx.beginPath();const gx=g.x+g.dx*age*95-g.dy*i*9,gy=g.y+g.dy*age*95+g.dx*i*9;ctx.moveTo(gx,gy);ctx.lineTo(gx+g.dx*25,gy+g.dy*25);ctx.strokeStyle=`rgba(131,159,110,${g.life*.28})`;ctx.lineWidth=2;ctx.stroke();}}
 ctx.restore();}
function frame(t){requestAnimationFrame(frame);if(!lastTime)lastTime=t;const elapsed=Math.min((t-lastTime)/1000,.1);lastTime=t;if(elapsed>0)fps=fps*.94+(1/elapsed)*.06;const start=performance.now();if(!document.hidden){if(!paused){accumulator+=elapsed;let steps=0;const tick=1/60;while(accumulator>=tick&&steps<2){world.step();accumulator-=tick;steps++;if(performance.now()-start>10)break;}if(accumulator>tick*2)accumulator=tick;}else{accumulator=0;if(pointer.down&&world.drag)world.relax();}physicsMs=physicsMs*.9+(performance.now()-start)*.1;for(const c of cutTrail)c.life-=elapsed;cutTrail=cutTrail.filter(c=>c.life>0);draw();if(t-lastStats>200){updateStats();lastStats=t;}}}
// Read-only diagnostics are also useful when inspecting non-DOM physics in developer tools.
Object.defineProperty(window,'softlab',{value:Object.freeze({get metrics(){return {frames:world.frames,time:world.time,fps,physicsMs,paused,scenario};},inspect:()=>({scenario,paused,mode,tool,pending,selected:selected?.id??null,time:world.time,frames:world.frames,settings:{...world.settings},stats:{...world.stats,particles:world.particles.length,constraints:world.activeConstraints(),pins:world.particles.filter(p=>p.pin).length,fps,physicsMs,cells:world.cells.size},camera:{...view,zoom,panX,panY},particles:world.particles.map(p=>({id:p.id,body:p.body,x:p.x,y:p.y,vx:p.vx,vy:p.vy,mass:p.mass,pin:!!p.pin})),constraints:world.constraints.map(c=>({id:c.id,a:c.a.id,b:c.b.id,type:c.type,active:c.active,strain:c.strain,rest:c.rest})),bodies:world.bodies.map(b=>({id:b.id,type:b.type,points:b.points.map(p=>p.id),closed:b.closed,restArea:b.restArea,area:world.area(b.boundary.length?b.boundary:b.points)})),obstacles:world.obstacles.map(o=>({...o})),drag:world.drag?{particle:world.drag.p.id,x:world.drag.x,y:world.drag.y}:null})})});
loadScene('playground');setPaused(false);showTab('world');setCamera();requestAnimationFrame(frame);
})();
