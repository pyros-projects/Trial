<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Opaque iframe host</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23333' width='16' height='16'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; font-family: sans-serif; background: #222; color: #eee; }
    p { margin: 8px 12px; font-size: 13px; }
    iframe { width: 100%; height: calc(100% - 36px); border: 0; background: #fff; }
  </style>
</head>
<body>
  <p>Opaque-origin iframe (sandbox=&quot;allow-scripts allow-downloads&quot;, no allow-same-origin)</p>
  <iframe id="studio-frame" title="Spreadsheet studio frame" sandbox="allow-scripts allow-downloads" src="../index.html"></iframe>
</body>
</html>
