<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Evolutionary Ecosystem Laboratory</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #081016;
  --bg-2: #0d171f;
  --panel: #12202b;
  --panel-2: #17303c;
  --ink: #e7f2ea;
  --muted: #8aa396;
  --line: #2c4a52;
  --accent: #7fe3b0;
  --accent-2: #d7c27a;
  --herb: #e0b14a;
  --pred: #e35a4f;
  --scav: #b07be3;
  --plant: #4cbf73;
  --danger: #ef6b5a;
  --ok: #7fe3b0;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
button, select, input { font-family: inherit; }
#app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100%;
  min-height: 100dvh;
}
#hud {
  display: flex;
  align-items: stretch;
  gap: 10px;
  padding: 6px 10px;
  background: linear-gradient(#101c24, #0c161c);
  border-bottom: 1px solid var(--line);
  min-height: 46px;
}
.brand {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 168px;
  padding-right: 8px;
  border-right: 1px solid var(--line);
}
.brand b { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
.brand span { font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
#stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  align-items: center;
  flex: 1;
  font-family: var(--mono);
  font-size: 11px;
}
.stat { display: flex; flex-direction: column; min-width: 54px; }
.stat em { font-style: normal; color: var(--muted); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; }
.stat b { font-weight: 600; color: var(--ink); }
.stat.warn b { color: var(--danger); }
.stat.ok b { color: var(--ok); }
#workspace {
  display: grid;
  grid-template-columns: 58px 1fr minmax(280px, 340px);
  min-height: 0;
  position: relative;
}
#tools {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px 6px;
  background: var(--bg-2);
  border-right: 1px solid var(--line);
  overflow: auto;
}
#tools button, #tools .tool {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  width: 100%;
  min-height: 40px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 9px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 4px 2px;
}
#tools button:hover, #tools .tool:hover { color: var(--ink); background: var(--panel); }
#tools button.active, #tools .tool.active {
  color: var(--bg);
  background: var(--accent);
  border-color: #b9f5d6;
}
#stage {
  position: relative;
  min-width: 0;
  min-height: 0;
  background: #05090c;
}
#world {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: crosshair;
}
#hint {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: rgba(8,16,22,0.82);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 11px;
  padding: 6px 8px;
  border-radius: 6px;
  pointer-events: none;
  max-width: min(420px, 70%);
}
#panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--panel);
  border-left: 1px solid var(--line);
  overflow: hidden;
}
.tabs {
  display: flex;
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
}
.tabs button {
  flex: 1;
  background: transparent;
  color: var(--muted);
  border: 0;
  border-bottom: 2px solid transparent;
  padding: 8px 4px;
  cursor: pointer;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
.pane {
  display: none;
  overflow: auto;
  padding: 10px;
  gap: 10px;
  flex-direction: column;
}
.pane.active { display: flex; }
fieldset {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  background: rgba(8,18,24,0.35);
}
legend {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent-2);
  padding: 0 6px;
}
label.row, .row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  margin: 4px 0;
  color: var(--ink);
}
label.row span, .kv span { color: var(--muted); }
input[type="range"] { width: 120px; accent-color: var(--accent); }
input[type="number"], input[type="text"], select {
  background: #0b151c;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 4px 6px;
  font-size: 12px;
}
.kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-family: var(--mono); font-size: 11px; }
.bars { display: flex; flex-direction: column; gap: 4px; }
.bar {
  display: grid;
  grid-template-columns: 78px 1fr 36px;
  gap: 6px;
  align-items: center;
  font-size: 10px;
  color: var(--muted);
}
.bar i {
  display: block;
  height: 7px;
  background: #22343c;
  border-radius: 4px;
  overflow: hidden;
}
.bar i b { display: block; height: 100%; background: var(--accent); width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
  font-size: 10px;
  padding: 3px 7px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #0d1a22;
  color: var(--ink);
  cursor: pointer;
}
.chip.on { background: var(--accent); color: #082018; border-color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.actions button, .btn {
  background: var(--panel-2);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  cursor: pointer;
  font-size: 11px;
}
.actions button:hover, .btn:hover { border-color: var(--accent); }
.actions button.danger { color: #ffd4cf; border-color: #6a3330; }
#transport {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 6px 10px;
  background: #0c161c;
  border-top: 1px solid var(--line);
}
#transport button, #transport select {
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
  font-size: 12px;
}
#transport button.primary { background: var(--accent); color: #082018; border-color: #b9f5d6; font-weight: 650; }
#toast {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #173028;
  color: var(--accent);
  border: 1px solid #2e6a55;
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 12px;
  display: none;
  z-index: 5;
}
.chartbox { background: #0a141a; border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.chartbox h4 { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }
canvas.chart { width: 100%; height: 92px; display: block; }
#phylo { width: 100%; height: 160px; display: block; background: #0a141a; border: 1px solid var(--line); border-radius: 6px; }
.muted { color: var(--muted); font-size: 11px; line-height: 1.4; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
@media (max-width: 900px) {
  #workspace { grid-template-columns: 48px 1fr; }
  #panel {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: min(100%, 320px);
    transform: translateX(100%);
    transition: transform 0.18s ease;
    z-index: 4;
  }
  #panel.open { transform: none; }
  #tools { width: 48px; }
}
@media (max-width: 640px) {
  .brand { display: none; }
  #stats { font-size: 10px; gap: 6px 10px; }
  #workspace { grid-template-columns: 1fr; grid-template-rows: 1fr 52px; }
  #tools {
    flex-direction: row;
    width: 100%;
    overflow-x: auto;
    border-right: 0;
    border-top: 1px solid var(--line);
    order: 2;
    z-index: 5;
  }
  #tools button { min-width: 64px; width: auto; }
  #stage { order: 1; }
  #panel {
    top: auto;
    left: 0;
    right: 0;
    width: 100%;
    height: min(48vh, 380px);
    bottom: 52px;
    transform: translateY(110%);
  }
  #panel.open { transform: none; }
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand">
      <b>EvoLab</b>
      <span>Field station · live biome</span>
    </div>
    <div id="stats" aria-live="polite"></div>
    <div class="actions">
      <button type="button" id="btnPanel" class="btn" aria-label="Toggle inspector panel">Inspect</button>
    </div>
  </header>
  <div id="workspace">
    <nav id="tools" aria-label="Pointer tools"></nav>
    <main id="stage">
      <canvas id="world" aria-label="Ecosystem canvas"></canvas>
      <div id="hint"></div>
      <div id="toast" role="status"></div>
    </main>
    <aside id="panel" aria-label="Laboratory inspector">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="inspect" role="tab">Inspect</button>
        <button type="button" class="tab" data-tab="lineage" role="tab">Lineage</button>
        <button type="button" class="tab" data-tab="charts" role="tab">Charts</button>
        <button type="button" class="tab" data-tab="worldtab" role="tab">World</button>
      </div>
      <section id="inspect" class="pane active"></section>
      <section id="lineage" class="pane"></section>
      <section id="charts" class="pane"></section>
      <section id="worldtab" class="pane"></section>
    </aside>
  </div>
  <footer id="transport"></footer>
</div>
<script>
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const angNorm = (a) => {
    while (a > Math.PI) a -= Math.PI * 2;
    while (a < -Math.PI) a += Math.PI * 2;
    return a;
  };
  const hypot = Math.hypot;
  const TAU = Math.PI * 2;

  function mulberry(seed) {
    let a = seed >>> 0;
    const rng = function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
    rng.state = () => a >>> 0;
    rng.set = (s) => { a = s >>> 0; };
    rng.int = (n) => (rng() * n) | 0;
    rng.range = (lo, hi) => lo + rng() * (hi - lo);
    rng.gauss = () => {
      let u = 1 - rng(), v = rng();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
    };
    rng.pick = (arr) => arr[rng.int(arr.length)];
    return rng;
  }

  const TOOLS = [
    { id: 'select', label: 'Select' },
    { id: 'follow', label: 'Follow' },
    { id: 'spawnH', label: 'Herbivore' },
    { id: 'spawnP', label: 'Predator' },
    { id: 'spawnS', label: 'Scavenger' },
    { id: 'food', label: 'Food' },
    { id: 'erase', label: 'Remove' },
    { id: 'fertile', label: 'Fertility' },
    { id: 'rock', label: 'Terrain' },
    { id: 'barrier', label: 'Barrier' },
    { id: 'heat', label: 'Heat' },
    { id: 'cool', label: 'Cool' },
    { id: 'wet', label: 'Moisture' },
    { id: 'dry', label: 'Dry' },
    { id: 'protect', label: 'Protect' }
  ];

  const VIZ = [
    'natural', 'energy', 'age', 'generation', 'species', 'speed',
    'sensor', 'behavior', 'fertility', 'temperature', 'moisture', 'resources'
  ];

  const PRESETS = [
    'balanced-meadow',
    'predator-prey',
    'island-isolation',
    'harsh-desert',
    'rapid-radiation',
    'mass-extinction',
    'dense-stress'
  ];

  const DISASTERS = [
    { id: 'drought', label: 'Drought' },
    { id: 'bloom', label: 'Bloom' },
    { id: 'cold', label: 'Cold snap' },
    { id: 'disease', label: 'Disease' },
    { id: 'predators', label: 'Introduce predators' },
    { id: 'pulse', label: 'Food pulse' },
    { id: 'wall', label: 'Habitat barrier' }
  ];

  const ROLE = { HERB: 0, PRED: 1, SCAV: 2 };
  const ROLE_NAME = ['herbivore', 'predator', 'scavenger'];
  const BEHAVE = ['foraging', 'hunting', 'scavenging', 'fleeing', 'avoiding', 'resting', 'seeking climate', 'wandering'];

  const CELL = 16;
  const MAX_HIST = 480;
  const SPECIES_TH = 0.28;

  const defaultParams = () => ({
    mutationRate: 0.18,
    mutationMag: 0.08,
    foodGrowth: 0.018,
    metabolicCost: 1,
    reproThreshold: 118,
    sensorRange: 1,
    climateAmp: 0.45,
    renderDensity: 1,
    worldW: 960,
    worldH: 640,
    biteHerb: 7.2,
    bitePred: 28,
    biteScav: 14,
    effHerb: 0.62,
    effPred: 0.48,
    effScav: 0.72,
    corpseDecay: 0.012
  });

  const Lab = {
    seed: 42,
    rng: mulberry(42),
    tick: 0,
    paused: false,
    speed: 2,
    params: defaultParams(),
    viz: 'natural',
    overlays: { rays: false, steer: false, targets: false, grid: false, decisions: false },
    tool: 'select',
    selected: 0,
    follow: false,
    highlightSpecies: 0,
    presetName: 'balanced-meadow',
    nextId: 1,
    nextSpecies: 1,
    intervention: 'none',
    eventUntil: 0,
    day: 0,
    season: 0,
    fps: 0,
    frames: 0,
    fpsT: 0,
    birthsWin: 0,
    deathsWin: 0,
    birthsAcc: 0,
    deathsAcc: 0,
    winT: 0,
    autosaveT: 0,
    paintR: 2,
    protected: null,
    error: '',
    orgs: [],
    corpses: [],
    species: [],
    grid: null,
    cols: 0,
    rows: 0,
    hash: null,
    pher: null,
    history: emptyHistory(),
    camera: { x: 480, y: 320, z: 1 },
    pointer: { x: 0, y: 0, wx: 0, wy: 0, down: false, pan: false, lsx: 0, lsy: 0, id2: null },
    terrainDirty: true,
    off: null,
    lastMeal: 0,
    lastBirth: 0,
    lastDeath: 0
  };

  function emptyHistory() {
    return {
      t: [], herb: [], pred: [], scav: [], births: [], deaths: [],
      energy: [], biomass: [], food: [], gen: [], species: [], diversity: [],
      speed: [], vision: [], size: []
    };
  }

  function gdef(role) {
    const base = {
      size: 1, speed: 1, turn: 1, vision: 1, metabolism: 1,
      diet: 0.15, aggression: 0.3, camouflage: 0.2, fertility: 1, lifespan: 1,
      wFood: 1, wFlee: 1, wChase: 0.2, wAvoid: 1, wCrowd: 0.7, wClimate: 0.5, wWander: 0.18,
      hue: 42
    };
    if (role === ROLE.PRED) {
      Object.assign(base, { size: 1.15, speed: 1.2, vision: 1.25, diet: 0.88, aggression: 0.82, wFood: 0.15, wChase: 1.15, wFlee: 0.35, hue: 6 });
    } else if (role === ROLE.SCAV) {
      Object.assign(base, { size: 0.9, speed: 0.95, diet: 0.48, aggression: 0.25, wFood: 0.55, wChase: 0.4, hue: 280 });
    }
    return base;
  }

  function mutateGene(g, p, rng) {
    const out = Object.assign({}, g);
    const mag = p.mutationMag;
    const rate = p.mutationRate;
    let n = 0;
    for (const k of Object.keys(out)) {
      if (rng() < rate) {
        out[k] += rng.gauss() * mag * (k === 'hue' ? 40 : 1);
        n++;
      }
    }
    out.size = clamp(out.size, 0.55, 1.9);
    out.speed = clamp(out.speed, 0.4, 2.1);
    out.turn = clamp(out.turn, 0.4, 2.2);
    out.vision = clamp(out.vision, 0.4, 2.3);
    out.metabolism = clamp(out.metabolism, 0.45, 1.8);
    out.diet = clamp(out.diet, 0, 1);
    out.aggression = clamp(out.aggression, 0, 1);
    out.camouflage = clamp(out.camouflage, 0, 1);
    out.fertility = clamp(out.fertility, 0.35, 1.8);
    out.lifespan = clamp(out.lifespan, 0.45, 1.9);
    out.wFood = clamp(out.wFood, 0, 2.2);
    out.wFlee = clamp(out.wFlee, 0, 2.2);
    out.wChase = clamp(out.wChase, 0, 2.2);
    out.wAvoid = clamp(out.wAvoid, 0.2, 2.2);
    out.wCrowd = clamp(out.wCrowd, 0, 2);
    out.wClimate = clamp(out.wClimate, 0, 2);
    out.wWander = clamp(out.wWander, 0, 1);
    out.hue = (out.hue % 360 + 360) % 360;
    return { g: out, n };
  }

  function crossover(a, b, rng) {
    const o = {};
    for (const k of Object.keys(a)) o[k] = rng() < 0.5 ? a[k] : b[k];
    return o;
  }

  function roleFromDiet(d) {
    if (d < 0.33) return ROLE.HERB;
    if (d < 0.62) return ROLE.SCAV;
    return ROLE.PRED;
  }

  function gvec(g) {
    return [g.size, g.speed, g.turn, g.vision, g.metabolism, g.diet, g.aggression, g.camouflage, g.fertility, g.lifespan, g.hue / 180];
  }

  function gdist(a, b) {
    const va = gvec(a), vb = gvec(b);
    let s = 0;
    for (let i = 0; i < va.length; i++) { const d = va[i] - vb[i]; s += d * d; }
    const diet = (a.diet - b.diet) * 3.2;
    s += diet * diet;
    return Math.sqrt(s / (va.length + 4));
  }

  function assignSpecies(org) {
    let best = null, bestD = 1e9;
    for (const sp of Lab.species) {
      if (sp.role !== org.role) continue;
      if (sp.alive === 0 && Lab.tick - sp.last > 400) continue;
      const d = gdist(org.g, sp.centroid);
      if (d < bestD) { bestD = d; best = sp; }
    }
    if (best && bestD < SPECIES_TH) {
      org.species = best.id;
      const c = best.centroid;
      for (const k of Object.keys(c)) c[k] = c[k] * 0.94 + org.g[k] * 0.06;
      best.alive++;
      best.last = Lab.tick;
      best.role = org.role;
    } else {
      const id = Lab.nextSpecies++;
      Lab.species.push({
        id, centroid: Object.assign({}, org.g), alive: 1, last: Lab.tick, role: org.role, born: Lab.tick
      });
      org.species = id;
    }
  }

  function recountSpecies() {
    for (const sp of Lab.species) sp.alive = 0;
    for (const o of Lab.orgs) {
      const sp = Lab.species.find(s => s.id === o.species);
      if (sp) { sp.alive++; sp.last = Lab.tick; }
      else assignSpecies(o);
    }
  }

  function Spatial(size) {
    this.size = size;
    this.map = new Map();
  }
  Spatial.prototype.clear = function () { this.map.clear(); };
  Spatial.prototype.key = function (x, y) {
    return ((x / this.size) | 0) * 4096 + ((y / this.size) | 0);
  };
  Spatial.prototype.insert = function (o) {
    const k = this.key(o.x, o.y);
    let b = this.map.get(k);
    if (!b) { b = []; this.map.set(k, b); }
    b.push(o);
  };
  Spatial.prototype.query = function (x, y, r, out) {
    out.length = 0;
    const s = this.size;
    const x0 = ((x - r) / s) | 0, x1 = ((x + r) / s) | 0;
    const y0 = ((y - r) / s) | 0, y1 = ((y + r) / s) | 0;
    const r2 = r * r;
    for (let iy = y0; iy <= y1; iy++) {
      for (let ix = x0; ix <= x1; ix++) {
        const b = this.map.get(ix * 4096 + iy);
        if (!b) continue;
        for (let i = 0; i < b.length; i++) {
          const o = b[i];
          const dx = o.x - x, dy = o.y - y;
          if (dx * dx + dy * dy <= r2) out.push(o);
        }
      }
    }
    return out;
  };

  function makeGrid(w, h) {
    const cols = Math.max(8, (w / CELL) | 0);
    const rows = Math.max(8, (h / CELL) | 0);
    const n = cols * rows;
    Lab.cols = cols; Lab.rows = rows;
    Lab.grid = {
      fert: new Float32Array(n),
      food: new Float32Array(n),
      moist: new Float32Array(n),
      temp: new Float32Array(n),
      tox: new Float32Array(n),
      block: new Uint8Array(n)
    };
    Lab.pher = new Float32Array(n);
    return { cols, rows };
  }

  function idx(c, r) { return r * Lab.cols + c; }
  function cellAt(x, y) {
    const c = clamp((x / CELL) | 0, 0, Lab.cols - 1);
    const r = clamp((y / CELL) | 0, 0, Lab.rows - 1);
    return idx(c, r);
  }
  function blocked(x, y) {
    return Lab.grid.block[cellAt(x, y)] > 0;
  }
  function inProtect(x, y) {
    const p = Lab.protected;
    if (!p) return false;
    return x >= p.x && y >= p.y && x <= p.x + p.w && y <= p.y + p.h;
  }

  function climateAt(i, x, y) {
    const lat = (y / Lab.params.worldH) * 2 - 1;
    const day = 0.5 + 0.5 * Math.sin(Lab.day);
    const season = Math.sin(Lab.season);
    const baseT = Lab.params.climateAmp * (season * 0.55 - lat * 0.35) + Lab.grid.temp[i];
    const night = (day < 0.28) ? -0.25 : 0;
    return {
      temp: clamp(baseT + night, -1, 1),
      moist: clamp(Lab.grid.moist[i] + season * 0.08, 0, 1),
      light: day,
      fert: Lab.grid.fert[i],
      food: Lab.grid.food[i],
      tox: Lab.grid.tox[i]
    };
  }

  function paintCircle(wx, wy, radius, fn) {
    const c0 = ((wx / CELL) | 0), r0 = ((wy / CELL) | 0);
    for (let r = r0 - radius; r <= r0 + radius; r++) {
      for (let c = c0 - radius; c <= c0 + radius; c++) {
        if (c < 0 || r < 0 || c >= Lab.cols || r >= Lab.rows) continue;
        if ((c - c0) * (c - c0) + (r - r0) * (r - r0) > radius * radius) continue;
        const x = (c + 0.5) * CELL, y = (r + 0.5) * CELL;
        if (inProtect(x, y) && Lab.tool !== 'protect' && Lab.tool !== 'select') continue;
        fn(idx(c, r), c, r);
      }
    }
    Lab.terrainDirty = true;
  }

  function makeOrg(role, x, y, genome, parent, parent2) {
    const rng = Lab.rng;
    let g = genome ? Object.assign({}, genome) : gdef(role);
    let muts = 0;
    if (parent) {
      const m = mutateGene(g, Lab.params, rng);
      g = m.g; muts = m.n;
    } else {
      const m = mutateGene(g, { mutationRate: 0.62, mutationMag: 0.11 }, rng);
      g = m.g;
      const diet0 = genome ? genome.diet : gdef(role).diet;
      g.diet = clamp(diet0 + rng.gauss() * 0.05, 0, 1);
      muts = m.n;
    }
    role = roleFromDiet(g.diet);
    const o = blankOrg(role, x, y, g);
    o.id = Lab.nextId++;
    o.energy = 70 + rng.range(0, 30);
    o.heading = rng.range(0, TAU);
    o.gen = parent ? parent.gen + 1 : 0;
    o.parent = parent ? parent.id : 0;
    o.parent2 = parent2 ? parent2.id : 0;
    o.muts = muts;
    bumpLineage(parent);
    if (parent2 && parent2 !== parent) bumpLineage(parent2);
    assignSpecies(o);
    return o;
  }

  function blankOrg(role, x, y, g) {
    return {
      id: 0, role, g, x, y, vx: 0, vy: 0, heading: 0,
      energy: 70, health: 100, age: 0, gen: 0, parent: 0, parent2: 0,
      children: 0, descendants: 0, muts: 0, species: 0, cool: 40, lastEat: -999,
      infected: 0,
      sensors: {
        foodA: 0, foodS: 0, preyA: 0, preyS: 0, predA: 0, predS: 0,
        corpseA: 0, corpseS: 0, obst: 1, crowd: 0, temp: 0, moist: 0, light: 1, pher: 0
      },
      steerX: 0, steerY: 0, behavior: 'wandering',
      outputs: { food: 0, flee: 0, chase: 0, avoid: 0, crowd: 0, climate: 0 },
      target: null
    };
  }

  function restoreOrg(data) {
    const o = blankOrg(data.role, data.x, data.y, Object.assign({}, data.g));
    Object.assign(o, data);
    o.g = Object.assign({}, data.g);
    o.sensors = Object.assign(o.sensors, data.sensors || {});
    o.outputs = Object.assign(o.outputs, data.outputs || {});
    return o;
  }

  function bumpLineage(p) {
    if (!p) return;
    p.children++;
    let cur = p, guard = 0;
    while (cur && guard++ < 64) {
      cur.descendants++;
      cur = cur._parentRef;
    }
  }

  function findById(id) {
    for (const o of Lab.orgs) if (o.id === id) return o;
    return null;
  }

  function phenotype(o) {
    const g = o.g;
    return {
      radius: 4.2 * g.size * (o.role === ROLE.PRED ? 1.15 : o.role === ROLE.SCAV ? 0.92 : 1),
      speed: 1.35 * g.speed * (o.role === ROLE.PRED ? 1.12 : 1),
      turn: 0.18 * g.turn,
      vision: 78 * g.vision * Lab.params.sensorRange,
      maxAge: 900 * g.lifespan,
      camouflage: g.camouflage
    };
  }

  const _near = [];
  function sense(o) {
    const ph = phenotype(o);
    const s = o.sensors;
    const i = cellAt(o.x, o.y);
    const cl = climateAt(i, o.x, o.y);
    s.temp = cl.temp; s.moist = cl.moist; s.light = cl.light; s.pher = Lab.pher[i];
    const vis = ph.vision;
    Lab.hash.query(o.x, o.y, vis, _near);
    let foodS = 0, foodA = 0, preyS = 0, preyA = 0, predS = 0, predA = 0, corpseS = 0, corpseA = 0, crowd = 0;
    let foodX = 0, foodY = 0, preyX = 0, preyY = 0, predX = 0, predY = 0, corpseX = 0, corpseY = 0;
    o.target = null;
    let bestPrey = 0, bestFood = 0, bestCorpse = 0;

    const range = vis;
    const c0 = (o.x / CELL) | 0, r0 = (o.y / CELL) | 0;
    const span = Math.max(1, (range / CELL) | 0);
    for (let r = r0 - span; r <= r0 + span; r++) {
      for (let c = c0 - span; c <= c0 + span; c++) {
        if (c < 0 || r < 0 || c >= Lab.cols || r >= Lab.rows) continue;
        const gi = idx(c, r);
        const f = Lab.grid.food[gi];
        if (f < 0.05) continue;
        const cx = (c + 0.5) * CELL - o.x, cy = (r + 0.5) * CELL - o.y;
        const d2 = cx * cx + cy * cy;
        if (d2 > range * range || d2 < 1) continue;
        const w = f / Math.sqrt(d2);
        foodX += cx * w; foodY += cy * w; foodS += w;
        if (w > bestFood) bestFood = w;
      }
    }
    if (foodS > 0) foodA = Math.atan2(foodY, foodX);

    for (let n = 0; n < _near.length; n++) {
      const q = _near[n];
      if (q === o) continue;
      const dx = q.x - o.x, dy = q.y - o.y;
      const d = hypot(dx, dy) || 0.001;
      crowd += 1 / d;
      const ang = Math.atan2(dy, dx);
      if (q.role === ROLE.PRED && o.role !== ROLE.PRED) {
        const w = (1.2 - q.g.camouflage * 0.5) / d;
        predX -= dx * w; predY -= dy * w; predS += w;
      }
      const edible = (o.role === ROLE.PRED && q.role !== ROLE.PRED) ||
        (o.role === ROLE.SCAV && q.role === ROLE.HERB && o.g.aggression > 0.7 && o.energy < 40);
      if (edible) {
        const hide = 1 - q.g.camouflage * 0.7;
        const w = hide * o.g.aggression / d;
        preyX += dx * w; preyY += dy * w; preyS += w;
        if (w > bestPrey) { bestPrey = w; o.target = q; }
      }
    }
    if (predS > 0) predA = Math.atan2(predY, predX);
    if (preyS > 0) preyA = Math.atan2(preyY, preyX);

    for (const c of Lab.corpses) {
      const dx = c.x - o.x, dy = c.y - o.y;
      const d2 = dx * dx + dy * dy;
      if (d2 > vis * vis || d2 < 1) continue;
      const d = Math.sqrt(d2);
      const w = (c.energy / 40) / d;
      corpseX += dx * w; corpseY += dy * w; corpseS += w;
      if (w > bestCorpse) bestCorpse = w;
    }
    if (corpseS > 0) corpseA = Math.atan2(corpseY, corpseX);

    let obst = 1;
    const look = vis * 0.45;
    for (let k = 0; k < 5; k++) {
      const a = o.heading + (k - 2) * 0.32;
      const px = o.x + Math.cos(a) * look;
      const py = o.y + Math.sin(a) * look;
      if (px < 8 || py < 8 || px > Lab.params.worldW - 8 || py > Lab.params.worldH - 8 || blocked(px, py)) {
        const t = 1 - Math.abs(k - 2) / 3;
        obst = Math.min(obst, 1 - t);
      }
    }
    s.foodA = foodA; s.foodS = clamp(foodS, 0, 4);
    s.preyA = preyA; s.preyS = clamp(preyS, 0, 4);
    s.predA = predA; s.predS = clamp(predS, 0, 4);
    s.corpseA = corpseA; s.corpseS = clamp(corpseS, 0, 4);
    s.obst = obst;
    s.crowd = clamp(crowd * 4, 0, 4);
  }

  function decide(o) {
    const s = o.sensors, g = o.g;
    const hungry = clamp(1.15 - o.energy / 120, 0.15, 1.2);
    const out = o.outputs;
    let sx = 0, sy = 0;
    const add = (ang, mag) => { sx += Math.cos(ang) * mag; sy += Math.sin(ang) * mag; };

    out.food = g.wFood * hungry * (o.role === ROLE.HERB ? s.foodS : o.role === ROLE.SCAV ? (s.corpseS * 1.2 + s.foodS * 0.35) : s.foodS * 0.15);
    out.chase = g.wChase * hungry * (o.role === ROLE.PRED ? s.preyS : s.preyS * g.aggression * 0.4);
    out.flee = g.wFlee * s.predS * (o.role === ROLE.PRED ? 0.25 : 1.1) * (0.4 + (1 - o.health / 100));
    out.avoid = g.wAvoid * (1 - s.obst) * 1.6;
    out.crowd = g.wCrowd * s.crowd * 0.35;
    out.climate = g.wClimate * (Math.abs(s.temp) + Math.abs(s.moist - 0.55));

    if (o.role === ROLE.HERB) add(s.foodA, out.food);
    else if (o.role === ROLE.SCAV) {
      add(s.corpseA, g.wFood * hungry * s.corpseS);
      add(s.foodA, g.wFood * hungry * s.foodS * 0.4);
    } else add(s.foodA, out.food * 0.2);

    add(s.preyA, out.chase);
    add(s.predA, out.flee);
    if (s.obst < 0.85) add(o.heading + Math.PI, out.avoid);
    add(o.heading + Math.PI * 0.5, out.crowd * (s.crowd > 1.2 ? 1 : 0.2));
    if (Math.abs(s.temp) > 0.45) add(-Math.PI / 2 * Math.sign(s.temp), out.climate * 0.4);
    add(o.heading + (Lab.rng() - 0.5) * 0.7, g.wWander * (0.2 + 0.15 * (1 - hungry)));

    if (o.energy > 90 && s.crowd > 2.2) { sx *= 0.4; sy *= 0.4; }

    o.steerX = sx; o.steerY = sy;
    let b = 'wandering', best = 0.22;
    if (out.flee > best) { best = out.flee; b = 'fleeing'; }
    if (out.chase > best) { best = out.chase; b = 'hunting'; }
    if (out.food > best) { best = out.food; b = o.role === ROLE.SCAV ? 'scavenging' : 'foraging'; }
    if (out.avoid > best) { best = out.avoid; b = 'avoiding'; }
    if (out.climate > best && o.energy > 50) { b = 'seeking climate'; }
    if (o.energy > 100 && s.foodS < 0.15 && s.preyS < 0.1) b = 'resting';
    o.behavior = b;
  }

  function act(o) {
    const ph = phenotype(o);
    const mag = hypot(o.steerX, o.steerY);
    let desired = o.heading;
    if (mag > 0.04) desired = Math.atan2(o.steerY, o.steerX);
    let dh = angNorm(desired - o.heading);
    dh = clamp(dh, -ph.turn, ph.turn);
    o.heading = angNorm(o.heading + dh);
    const tired = o.energy < 18 ? 0.55 : 1;
    const night = o.sensors.light < 0.28 && o.role === ROLE.HERB ? 0.72 : 1;
    const heat = 1 - Math.abs(o.sensors.temp) * 0.22;
    const spd = ph.speed * tired * night * heat * (o.behavior === 'resting' ? 0.15 : 1);
    const nx = o.x + Math.cos(o.heading) * spd;
    const ny = o.y + Math.sin(o.heading) * spd;
    if (nx < 6 || nx > Lab.params.worldW - 6 || ny < 6 || ny > Lab.params.worldH - 6 || blocked(nx, ny)) {
      o.heading += (Lab.rng() < 0.5 ? 1 : -1) * 0.9;
      o.health -= 0.15;
    } else {
      o.x = nx; o.y = ny;
    }
    o.vx = Math.cos(o.heading) * spd;
    o.vy = Math.sin(o.heading) * spd;
    const moveCost = 0.085 * spd * o.g.size * o.g.metabolism * Lab.params.metabolicCost;
    const basal = 0.055 * o.g.size * o.g.metabolism * Lab.params.metabolicCost;
    o.energy -= moveCost + basal;
    o.age += 1;
    o.cool = Math.max(0, o.cool - 1);
    if (o.sensors.tox > 0.2) { o.health -= o.sensors.tox * 0.8; o.energy -= 0.2; }
    if (o.infected > 0) { o.health -= 0.7; o.infected--; }
    if (o.behavior === 'fleeing') Lab.pher[cellAt(o.x, o.y)] = Math.min(1, Lab.pher[cellAt(o.x, o.y)] + 0.08);
    feed(o, ph);
    reproduce(o);
    if (o.age > ph.maxAge) o.health -= 0.8;
    if (o.energy < 8) o.health -= 0.5;
  }

  function feed(o, ph) {
    const biteR = ph.radius + 5;
    if (o.role === ROLE.HERB || (o.role === ROLE.SCAV && o.g.diet < 0.55)) {
      const i = cellAt(o.x, o.y);
      const avail = Lab.grid.food[i] * 22;
      if (avail > 0.4) {
        const take = Math.min(Lab.params.biteHerb * o.g.size, avail, 140 - o.energy);
        if (take > 0) {
          Lab.grid.food[i] = Math.max(0, Lab.grid.food[i] - take / 22);
          o.energy += take * Lab.params.effHerb;
          o.lastEat = Lab.tick;
          Lab.lastMeal = Lab.tick;
          Lab.terrainDirty = true;
        }
      }
    }
    if (o.role === ROLE.PRED || (o.role === ROLE.SCAV && o.g.aggression > 0.65 && o.energy < 55)) {
      if (o.target) {
        const d = hypot(o.target.x - o.x, o.target.y - o.y);
        if (d < biteR + phenotype(o.target).radius) {
          const dmg = Lab.params.bitePred * (0.55 + o.g.aggression * 0.6);
          o.target.health -= dmg * 0.55;
          o.target.energy -= dmg * 0.25;
          const gain = Math.min(dmg * Lab.params.effPred, 140 - o.energy);
          o.energy += gain;
          o.lastEat = Lab.tick;
          Lab.lastMeal = Lab.tick;
          if (o.target.health <= 0 || o.target.energy <= 0) kill(o.target, 'predation');
        }
      }
    }
    if (o.role === ROLE.SCAV || o.role === ROLE.PRED && o.energy < 35) {
      for (let i = Lab.corpses.length - 1; i >= 0; i--) {
        const c = Lab.corpses[i];
        if (hypot(c.x - o.x, c.y - o.y) < biteR + 6) {
          const take = Math.min(Lab.params.biteScav, c.energy, 140 - o.energy);
          c.energy -= take;
          o.energy += take * Lab.params.effScav;
          o.lastEat = Lab.tick;
          Lab.lastMeal = Lab.tick;
          if (c.energy <= 1) Lab.corpses.splice(i, 1);
          break;
        }
      }
    }
  }

  function reproduce(o) {
    const need = Lab.params.reproThreshold / Math.max(0.4, o.g.fertility);
    if (o.energy < need || o.cool > 0 || o.age < 90 || o.health < 45) return;
    if (Lab.orgs.length > 1600) return;
    if (o.sensors.crowd > 1.55) return;
    if (o.role === ROLE.HERB && Lab.grid.food[cellAt(o.x, o.y)] < 0.1) return;
    Lab.hash.query(o.x, o.y, 46, _near);
    let mate = null;
    for (const q of _near) {
      if (q !== o && q.role === o.role && q.energy > need * 0.65 && q.cool === 0 && Lab.orgs.indexOf(q) >= 0) {
        mate = q; break;
      }
    }
    if (!mate && o.role !== ROLE.HERB) return;
    if (!mate && o.energy < need + 16) return;
    const g = mate ? crossover(o.g, mate.g, Lab.rng) : Object.assign({}, o.g);
    let a = o.heading + Lab.rng.range(-1.2, 1.2);
    let x = o.x + Math.cos(a) * 12, y = o.y + Math.sin(a) * 12;
    x = clamp(x, 10, Lab.params.worldW - 10);
    y = clamp(y, 10, Lab.params.worldH - 10);
    if (blocked(x, y)) return;
    const child = makeOrg(o.role, x, y, g, o, mate);
    child._parentRef = o;
    child.energy = 40;
    o.energy -= 46 / Math.max(0.5, o.g.fertility);
    o.cool = 95;
    if (mate) { mate.energy -= 22; mate.cool = 70; }
    Lab.orgs.push(child);
    Lab.birthsAcc++;
    Lab.lastBirth = Lab.tick;
  }

  function kill(o, why) {
    const i = Lab.orgs.indexOf(o);
    if (i < 0) return;
    Lab.orgs.splice(i, 1);
    Lab.deathsAcc++;
    Lab.lastDeath = Lab.tick;
    Lab.corpses.push({
      x: o.x, y: o.y, energy: Math.max(8, o.energy * 0.35 + o.g.size * 12),
      age: 0, role: o.role, id: o.id
    });
    if (Lab.selected === o.id) Lab.selected = 0;
    o._dead = why;
  }

  function envTick() {
    Lab.day += 0.012;
    Lab.season += 0.00045;
    const g = Lab.grid;
    const n = g.food.length;
    const grow = Lab.params.foodGrowth;
    const drought = Lab.intervention === 'drought' && Lab.tick < Lab.eventUntil;
    const bloom = Lab.intervention === 'bloom' && Lab.tick < Lab.eventUntil;
    const cold = Lab.intervention === 'cold' && Lab.tick < Lab.eventUntil;
    for (let i = 0; i < n; i++) {
      const r = (i / Lab.cols) | 0;
      const c = i - r * Lab.cols;
      const x = (c + 0.5) * CELL, y = (r + 0.5) * CELL;
      const cl = climateAt(i, x, y);
      let gf = grow * g.fert[i] * (0.35 + cl.moist) * (0.4 + cl.light) * (1 - Math.abs(cl.temp) * 0.5);
      if (drought) gf *= 0.12;
      if (bloom) gf *= 2.4;
      if (cold) gf *= 0.35;
      if (g.block[i]) gf = 0;
      g.food[i] = clamp(g.food[i] + gf - g.food[i] * 0.0015, 0, 1.35 * g.fert[i] + 0.15);
      Lab.pher[i] *= 0.94;
      if (drought && !inProtect(x, y)) g.moist[i] = Math.max(0.02, g.moist[i] * 0.997);
      if (cold && !inProtect(x, y)) g.temp[i] = lerp(g.temp[i], -0.75, 0.01);
    }
    if (Lab.tick % 8 === 0) Lab.terrainDirty = true;
    if (Lab.intervention !== 'none' && Lab.tick >= Lab.eventUntil) Lab.intervention = 'none';

    if (Lab.intervention === 'disease' && Lab.tick < Lab.eventUntil) {
      for (const o of Lab.orgs) {
        if (inProtect(o.x, o.y)) continue;
        if (o.infected > 0) {
          Lab.hash.query(o.x, o.y, 22, _near);
          for (const q of _near) if (q !== o && Lab.rng() < 0.04) q.infected = Math.max(q.infected, 80);
        } else if (Lab.rng() < 0.002) o.infected = 90;
      }
    }

    for (let i = Lab.corpses.length - 1; i >= 0; i--) {
      const c = Lab.corpses[i];
      c.age++;
      const gi = cellAt(c.x, c.y);
      const lose = c.energy * Lab.params.corpseDecay;
      c.energy -= lose + 0.04;
      Lab.grid.fert[gi] = clamp(Lab.grid.fert[gi] + lose * 0.012, 0, 1);
      if (c.energy <= 0.5 || c.age > 900) Lab.corpses.splice(i, 1);
    }
  }

  function simTick() {
    envTick();
    Lab.hash.clear();
    for (let i = 0; i < Lab.orgs.length; i++) Lab.hash.insert(Lab.orgs[i]);
    const list = Lab.orgs;
    for (let i = 0; i < list.length; i++) {
      const o = list[i];
      sense(o);
      decide(o);
      act(o);
    }
    for (let i = Lab.orgs.length - 1; i >= 0; i--) {
      const o = Lab.orgs[i];
      if (o.energy <= 0 || o.health <= 0) kill(o, o.energy <= 0 ? 'starvation' : 'injury');
    }
    Lab.tick++;
    if (Lab.tick % 8 === 0) sampleHistory();
    if (Lab.tick % 40 === 0) recountSpecies();
    Lab.winT++;
    if (Lab.winT >= 30) {
      Lab.birthsWin = Lab.birthsAcc; Lab.deathsWin = Lab.deathsAcc;
      Lab.birthsAcc = 0; Lab.deathsAcc = 0; Lab.winT = 0;
    }
  }

  function totals() {
    let e = 0, food = 0, gen = 0, oldest = 0;
    let herb = 0, pred = 0, scav = 0;
    for (const o of Lab.orgs) {
      e += o.energy;
      gen = Math.max(gen, o.gen);
      oldest = Math.max(oldest, o.age);
      if (o.role === ROLE.HERB) herb++;
      else if (o.role === ROLE.PRED) pred++;
      else scav++;
    }
    const g = Lab.grid;
    for (let i = 0; i < g.food.length; i++) food += g.food[i];
    let corpseE = 0;
    for (const c of Lab.corpses) corpseE += c.energy;
    return {
      herb, pred, scav, pop: Lab.orgs.length, energy: e,
      biomass: e + food * 18 + corpseE, food, gen,
        species: new Set(Lab.orgs.map(o => o.species)).size, oldest
    };
  }

  function sampleHistory() {
    const t = totals();
    const H = Lab.history;
    const push = (arr, v) => { arr.push(v); if (arr.length > MAX_HIST) arr.shift(); };
    push(H.t, Lab.tick);
    push(H.herb, t.herb); push(H.pred, t.pred); push(H.scav, t.scav);
    push(H.births, Lab.birthsWin); push(H.deaths, Lab.deathsWin);
    push(H.energy, t.pop ? t.energy / t.pop : 0);
    push(H.biomass, t.biomass); push(H.food, t.food);
    push(H.gen, t.gen); push(H.species, t.species);
    let div = 0, nSp = 0;
    for (const sp of Lab.species) if (sp.alive > 0) { div += sp.alive; nSp++; }
    push(H.diversity, nSp);
    let sp = 0, vis = 0, sz = 0;
    for (const o of Lab.orgs) { sp += o.g.speed; vis += o.g.vision; sz += o.g.size; }
    const n = t.pop || 1;
    push(H.speed, sp / n); push(H.vision, vis / n); push(H.size, sz / n);
  }

  function seedTerrain(kind) {
    const rng = Lab.rng;
    const g = Lab.grid, n = g.food.length;
    for (let i = 0; i < n; i++) {
      const r = (i / Lab.cols) | 0, c = i - r * Lab.cols;
      const nx = c / Lab.cols, ny = r / Lab.rows;
      const noise = (Math.sin(c * 0.35 + rng.range(0, 3)) + Math.sin(r * 0.27) + Math.sin((c + r) * 0.09)) / 3;
      g.block[i] = 0;
      g.tox[i] = 0;
      g.temp[i] = (0.5 - ny) * 0.4;
      if (kind === 'desert') {
        g.moist[i] = clamp(0.12 + noise * 0.08, 0, 1);
        g.fert[i] = clamp(0.18 + noise * 0.1, 0.05, 1);
        const oasis = hypot(nx - 0.35, ny - 0.55) < 0.12 || hypot(nx - 0.7, ny - 0.32) < 0.09;
        if (oasis) { g.moist[i] = 0.8; g.fert[i] = 0.92; }
        g.food[i] = oasis ? 0.9 : 0.08;
        g.temp[i] = 0.45;
      } else if (kind === 'island') {
        const cx = nx - 0.5, cy = ny - 0.5;
        const rings = Math.abs(Math.sin(hypot(cx, cy) * 9));
        const land = (hypot(cx, cy) < 0.22) || (hypot(cx - 0.28, cy + 0.1) < 0.14) || (hypot(cx + 0.26, cy - 0.16) < 0.13);
        g.block[i] = land ? 0 : 1;
        g.moist[i] = land ? 0.7 : 1;
        g.fert[i] = land ? 0.8 : 0;
        g.food[i] = land ? 0.55 + rng.range(0, 0.3) : 0;
      } else {
        g.moist[i] = clamp(0.55 + noise * 0.25, 0.1, 1);
        g.fert[i] = clamp(0.62 + noise * 0.28, 0.12, 1);
        g.food[i] = clamp(g.fert[i] * 0.7 + rng.range(0, 0.2), 0, 1);
      }
    }
    Lab.terrainDirty = true;
  }

  function populate(spec) {
    Lab.orgs.length = 0;
    Lab.corpses.length = 0;
    Lab.species.length = 0;
    Lab.nextId = 1;
    Lab.nextSpecies = 1;
    Lab.selected = 0;
    const rng = Lab.rng;
    const W = Lab.params.worldW, H = Lab.params.worldH;
    const place = (role, n, genomeFn) => {
      let g = 0;
      while (g < n) {
        const x = rng.range(20, W - 20), y = rng.range(20, H - 20);
        if (blocked(x, y)) continue;
        const o = makeOrg(role, x, y, genomeFn && genomeFn());
        o.energy = rng.range(55, 95);
        Lab.orgs.push(o);
        g++;
      }
    };
    place(ROLE.HERB, spec.herb);
    place(ROLE.PRED, spec.pred);
    place(ROLE.SCAV, spec.scav);
    Lab.hash = new Spatial(48);
    Lab.camera.x = W / 2; Lab.camera.y = H / 2; Lab.camera.z = 1;
  }

  function applyPreset(name) {
    Lab.presetName = name;
    Lab.params = defaultParams();
    Lab.history = emptyHistory();
    Lab.tick = 0; Lab.day = 0.6; Lab.season = 0.2;
    Lab.intervention = 'none'; Lab.eventUntil = 0;
    Lab.protected = null;
    Lab.birthsAcc = Lab.deathsAcc = Lab.birthsWin = Lab.deathsWin = 0;
    Lab.lastMeal = Lab.lastBirth = Lab.lastDeath = 0;
    let terrain = 'meadow';
    let spec = { herb: 70, pred: 12, scav: 14 };
    if (name === 'predator-prey') {
      spec = { herb: 90, pred: 22, scav: 6 };
      Lab.params.foodGrowth = 0.016;
    } else if (name === 'island-isolation') {
      terrain = 'island';
      spec = { herb: 48, pred: 8, scav: 10 };
      Lab.params.worldW = 960; Lab.params.worldH = 640;
    } else if (name === 'harsh-desert') {
      terrain = 'desert';
      spec = { herb: 36, pred: 6, scav: 10 };
      Lab.params.foodGrowth = 0.009;
      Lab.params.metabolicCost = 1.15;
      Lab.params.climateAmp = 0.8;
    } else if (name === 'rapid-radiation') {
      spec = { herb: 64, pred: 10, scav: 12 };
      Lab.params.mutationRate = 0.55;
      Lab.params.mutationMag = 0.22;
    } else if (name === 'mass-extinction') {
      spec = { herb: 28, pred: 4, scav: 8 };
      Lab.params.foodGrowth = 0.028;
      Lab.params.metabolicCost = 0.9;
      Lab.intervention = 'drought';
      Lab.eventUntil = 180;
    } else if (name === 'dense-stress') {
      Lab.params.worldW = 720; Lab.params.worldH = 520;
      spec = { herb: 220, pred: 40, scav: 50 };
      Lab.params.renderDensity = 0.7;
    } else {
      spec = { herb: 72, pred: 14, scav: 16 };
    }
    makeGrid(Lab.params.worldW, Lab.params.worldH);
    seedTerrain(terrain);
    populate(spec);
    sampleHistory();
    toast('Preset: ' + name.replace(/-/g, ' '));
  }

  function reset(seed) {
    if (seed != null && seed !== '') Lab.seed = (parseInt(seed, 10) || 0) >>> 0;
    Lab.rng = mulberry(Lab.seed);
    const preset = ($('presetSel') && $('presetSel').value) || Lab.presetName || 'balanced-meadow';
    applyPreset(preset);
  }

  function disaster(id) {
    Lab.intervention = id;
    Lab.eventUntil = Lab.tick + (id === 'disease' ? 400 : 260);
    const rng = Lab.rng;
    if (id === 'predators') {
      for (let k = 0; k < 8; k++) {
        const x = rng.range(30, Lab.params.worldW - 30), y = rng.range(30, Lab.params.worldH - 30);
        if (blocked(x, y) || inProtect(x, y)) continue;
        Lab.orgs.push(makeOrg(ROLE.PRED, x, y));
      }
    }
    if (id === 'pulse') {
      const g = Lab.grid;
      for (let i = 0; i < g.food.length; i++) if (!g.block[i]) g.food[i] = clamp(g.food[i] + 0.45, 0, 1.3);
      Lab.terrainDirty = true;
    }
    if (id === 'wall') {
      const c = (Lab.cols / 2) | 0;
      for (let r = 0; r < Lab.rows; r++) {
        if (Math.abs(r - Lab.rows / 2) < 3) continue;
        Lab.grid.block[idx(c, r)] = 1;
        Lab.grid.block[idx(c - 1, r)] = 1;
      }
      Lab.terrainDirty = true;
    }
    if (id === 'bloom') {
      for (let i = 0; i < Lab.grid.fert.length; i++) Lab.grid.fert[i] = clamp(Lab.grid.fert[i] + 0.2, 0, 1);
    }
    toast(id.replace(/-/g, ' ') + ' in progress');
  }

  /* ---------- persist ---------- */
  function serialize() {
    const g = Lab.grid;
    return {
      v: 1,
      seed: Lab.seed,
      presetName: Lab.presetName,
      rng: Lab.rng.state(),
      tick: Lab.tick,
      day: Lab.day,
      season: Lab.season,
      paused: Lab.paused,
      speed: Lab.speed,
      params: Lab.params,
      intervention: Lab.intervention,
      eventUntil: Lab.eventUntil,
      protected: Lab.protected,
      nextId: Lab.nextId,
      nextSpecies: Lab.nextSpecies,
      selected: Lab.selected,
      viz: Lab.viz,
      overlays: Lab.overlays,
      cols: Lab.cols, rows: Lab.rows,
      grid: {
        fert: Array.from(g.fert), food: Array.from(g.food), moist: Array.from(g.moist),
        temp: Array.from(g.temp), tox: Array.from(g.tox), block: Array.from(g.block)
      },
      pher: Array.from(Lab.pher),
      species: Lab.species,
      orgs: Lab.orgs.map(o => ({
        id: o.id, role: o.role, g: o.g, x: o.x, y: o.y, heading: o.heading,
        energy: o.energy, health: o.health, age: o.age, gen: o.gen,
        parent: o.parent, parent2: o.parent2, children: o.children,
        descendants: o.descendants, muts: o.muts, species: o.species,
        cool: o.cool, lastEat: o.lastEat, infected: o.infected, behavior: o.behavior
      })),
      corpses: Lab.corpses,
      history: Lab.history
    };
  }

  function hydrate(data) {
    if (!data || data.v !== 1) throw new Error('Unrecognized save format');
    Lab.seed = data.seed;
    Lab.presetName = data.presetName || 'balanced-meadow';
    Lab.rng = mulberry(data.seed);
    Lab.rng.set(data.rng);
    Lab.tick = data.tick;
    Lab.day = data.day; Lab.season = data.season;
    Lab.paused = !!data.paused;
    Lab.speed = data.speed || 1;
    Lab.params = Object.assign(defaultParams(), data.params);
    Lab.intervention = data.intervention || 'none';
    Lab.eventUntil = data.eventUntil || 0;
    Lab.protected = data.protected || null;
    Lab.nextId = data.nextId;
    Lab.nextSpecies = data.nextSpecies;
    Lab.selected = data.selected || 0;
    Lab.viz = data.viz || 'natural';
    Lab.overlays = Object.assign(Lab.overlays, data.overlays || {});
    makeGrid(Lab.params.worldW, Lab.params.worldH);
    const g = Lab.grid, src = data.grid;
    g.fert.set(src.fert); g.food.set(src.food); g.moist.set(src.moist);
    g.temp.set(src.temp); g.tox.set(src.tox); g.block.set(src.block);
    Lab.pher = Float32Array.from(data.pher);
    Lab.species = data.species || [];
    Lab.orgs = (data.orgs || []).map(restoreOrg);
    for (const o of Lab.orgs) o._parentRef = findById(o.parent);
    Lab.corpses = data.corpses || [];
    Lab.history = Object.assign(emptyHistory(), data.history);
    Lab.hash = new Spatial(48);
    Lab.terrainDirty = true;
    Lab.error = '';
  }

  function download(name, text, mime) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: mime }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }

  function saveJSON() {
    download('evolab-save.json', JSON.stringify(serialize()), 'application/json');
    toast('State exported');
  }
  function loadJSONText(text) {
    try { hydrate(JSON.parse(text)); toast('State loaded'); rebuildUI(); }
    catch (e) { Lab.error = String(e.message || e); toast('Load failed: ' + Lab.error); }
  }
  function autosave() {
    try { localStorage.setItem('evolab-autosave', JSON.stringify(serialize())); }
    catch (e) { /* quota */ }
  }
  function exportCSV() {
    const H = Lab.history;
    const keys = Object.keys(H);
    const rows = [keys.join(',')];
    const n = H.t.length;
    for (let i = 0; i < n; i++) rows.push(keys.map(k => H[k][i]).join(','));
    download('evolab-charts.csv', rows.join('\n'), 'text/csv');
    toast('Chart CSV exported');
  }
  function exportPNG() {
    const a = document.createElement('a');
    a.download = 'evolab-view.png';
    a.href = $('world').toDataURL('image/png');
    a.click();
    toast('View exported');
  }

  /* ---------- render ---------- */
  const canvas = $('world');
  const ctx = canvas.getContext('2d', { alpha: false });
  let dpr = 1, viewW = 0, viewH = 0;

  function resize() {
    dpr = Math.min(2.5, window.devicePixelRatio || 1);
    const r = canvas.getBoundingClientRect();
    viewW = Math.max(1, r.width); viewH = Math.max(1, r.height);
    canvas.width = Math.round(viewW * dpr);
    canvas.height = Math.round(viewH * dpr);
    Lab.terrainDirty = true;
  }

  function worldFromEvent(ev) {
    const r = canvas.getBoundingClientRect();
    const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
    const cam = Lab.camera;
    const wx = cam.x + (sx - viewW / 2) / cam.z;
    const wy = cam.y + (sy - viewH / 2) / cam.z;
    return { sx, sy, wx, wy };
  }

  function hsl(h, s, l, a) {
    return a == null ? 'hsl(' + h + ',' + s + '%,' + l + '%)' : 'hsla(' + h + ',' + s + '%,' + l + '%,' + a + ')';
  }

  function terrainColor(i, viz) {
    const g = Lab.grid;
    if (g.block[i]) return viz === 'natural' ? '#3a4450' : '#2a3138';
    if (viz === 'fertility') {
      const v = g.fert[i]; return 'rgb(' + ((1 - v) * 80 | 0) + ',' + (40 + v * 160 | 0) + ',' + (40 | 0) + ')';
    }
    if (viz === 'temperature') {
      const t = (g.temp[i] + 1) * 0.5;
      return 'rgb(' + (40 + t * 200 | 0) + ',' + (50 | 0) + ',' + ((1 - t) * 180 | 0) + ')';
    }
    if (viz === 'moisture') {
      const m = g.moist[i];
      return 'rgb(' + (40 + (1 - m) * 90 | 0) + ',' + (50 + m * 40 | 0) + ',' + (40 + m * 170 | 0) + ')';
    }
    if (viz === 'resources') {
      const f = g.food[i];
      return 'rgb(' + (20 | 0) + ',' + (30 + f * 200 | 0) + ',' + (24 | 0) + ')';
    }
    const m = g.moist[i], f = g.fert[i], food = g.food[i];
    const night = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(Lab.day));
    const rd = (48 + (1 - m) * 70) * night | 0;
    const gr = (52 + f * 70 + food * 50) * night | 0;
    const bl = (38 + m * 40) * night | 0;
    return 'rgb(' + rd + ',' + gr + ',' + bl + ')';
  }

  function drawTerrain(wctx, scale) {
    const g = Lab.grid;
    for (let r = 0; r < Lab.rows; r++) {
      for (let c = 0; c < Lab.cols; c++) {
        const i = idx(c, r);
        wctx.fillStyle = terrainColor(i, Lab.viz);
        wctx.fillRect(c * CELL * scale, r * CELL * scale, CELL * scale + 0.5, CELL * scale + 0.5);
        if (Lab.viz === 'natural' && g.food[i] > 0.12 && !g.block[i]) {
          wctx.fillStyle = hsl(118, 55, 28 + g.food[i] * 22, 0.55);
          const s = 3 + g.food[i] * 6;
          wctx.beginPath();
          wctx.arc((c + 0.5) * CELL * scale, (r + 0.5) * CELL * scale, s * scale * 0.4, 0, TAU);
          wctx.fill();
        }
      }
    }
  }

  function ensureTerrain() {
    if (!Lab.off) Lab.off = document.createElement('canvas');
    const scale = 1;
    const w = Lab.cols * CELL * scale, h = Lab.rows * CELL * scale;
    if (Lab.off.width !== w || Lab.off.height !== h) { Lab.off.width = w; Lab.off.height = h; Lab.terrainDirty = true; }
    if (Lab.terrainDirty) {
      const tctx = Lab.off.getContext('2d');
      drawTerrain(tctx, scale);
      Lab.terrainDirty = false;
    }
  }

  function orgColor(o) {
    const v = Lab.viz;
    if (v === 'energy') return hsl(o.energy * 1.1, 70, 48);
    if (v === 'age') return hsl(280 - (o.age / (900 * o.g.lifespan)) * 200, 60, 50);
    if (v === 'generation') return hsl((o.gen * 37) % 360, 65, 52);
    if (v === 'species' || Lab.highlightSpecies) {
      const id = o.species;
      if (Lab.highlightSpecies && id !== Lab.highlightSpecies) return hsl(0, 0, 35, 0.35);
      return hsl((id * 47) % 360, 70, 52);
    }
    if (v === 'speed') return hsl(200 - o.g.speed * 80, 70, 50);
    if (v === 'sensor') return hsl(190, 20 + o.g.vision * 50, 48);
    if (v === 'behavior') {
      const map = { foraging: 110, hunting: 8, scavenging: 280, fleeing: 50, avoiding: 200, resting: 230, 'seeking climate': 170, wandering: 40 };
      return hsl(map[o.behavior] || 40, 65, 50);
    }
    if (o.role === ROLE.HERB) return hsl(42 + o.g.hue * 0.05, 70 - o.g.camouflage * 30, 52);
    if (o.role === ROLE.PRED) return hsl(4, 72, 50);
    return hsl(280, 55, 58);
  }

  function drawOrg(o, dens) {
    if (Lab.rng() > dens && Lab.camera.z < 0.7) return;
    const ph = phenotype(o);
    const r = ph.radius;
    const col = orgColor(o);
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.heading);
    ctx.fillStyle = col;
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    if (o.role === ROLE.PRED) {
      ctx.moveTo(r * 1.4, 0); ctx.lineTo(-r, r * 0.85); ctx.lineTo(-r * 0.4, 0); ctx.lineTo(-r, -r * 0.85); ctx.closePath();
    } else if (o.role === ROLE.SCAV) {
      ctx.ellipse(0, 0, r * 1.1, r * 0.72, 0, 0, TAU);
    } else {
      ctx.ellipse(0, 0, r * 1.25, r * 0.7, 0, 0, TAU);
    }
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#0b0e10';
    ctx.beginPath(); ctx.arc(r * 0.55, -r * 0.18, Math.max(0.9, r * 0.16), 0, TAU); ctx.fill();
    if (o.infected > 0) {
      ctx.strokeStyle = '#b6ff57'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, TAU); ctx.stroke();
    }
    ctx.restore();
    if (Lab.selected === o.id) {
      ctx.strokeStyle = '#f4f0c8'; ctx.lineWidth = 1.4 / Lab.camera.z;
      ctx.beginPath(); ctx.arc(o.x, o.y, r + 6, 0, TAU); ctx.stroke();
    }
    if (Lab.overlays.rays && (Lab.selected === o.id || Lab.camera.z > 1.3)) {
      const vis = ph.vision;
      ctx.strokeStyle = 'rgba(180,230,210,0.28)';
      ctx.beginPath(); ctx.moveTo(o.x, o.y);
      ctx.lineTo(o.x + Math.cos(o.sensors.foodA) * vis * 0.4, o.y + Math.sin(o.sensors.foodA) * vis * 0.4);
      ctx.stroke();
      if (o.sensors.predS > 0.1) {
        ctx.strokeStyle = 'rgba(255,90,70,0.4)';
        ctx.beginPath(); ctx.moveTo(o.x, o.y);
        ctx.lineTo(o.x + Math.cos(o.sensors.predA) * vis * 0.35, o.y + Math.sin(o.sensors.predA) * vis * 0.35);
        ctx.stroke();
      }
    }
    if (Lab.overlays.steer) {
      ctx.strokeStyle = 'rgba(255,220,120,0.55)';
      ctx.beginPath(); ctx.moveTo(o.x, o.y);
      ctx.lineTo(o.x + o.steerX * 10, o.y + o.steerY * 10); ctx.stroke();
    }
    if (Lab.overlays.targets && o.target) {
      ctx.strokeStyle = 'rgba(255,120,90,0.5)';
      ctx.beginPath(); ctx.moveTo(o.x, o.y); ctx.lineTo(o.target.x, o.target.y); ctx.stroke();
    }
    if (Lab.overlays.decisions && Lab.selected === o.id) {
      ctx.fillStyle = '#dff7ea';
      ctx.font = (10 / Lab.camera.z) + 'px sans-serif';
      ctx.fillText(o.behavior, o.x + 8, o.y - 8);
    }
  }

  function render() {
    ensureTerrain();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#05080b';
    ctx.fillRect(0, 0, viewW, viewH);
    const cam = Lab.camera;
    ctx.save();
    ctx.translate(viewW / 2, viewH / 2);
    ctx.scale(cam.z, cam.z);
    ctx.translate(-cam.x, -cam.y);
    ctx.drawImage(Lab.off, 0, 0);
    if (Lab.overlays.grid) {
      ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1 / cam.z;
      const s = 48;
      const x0 = Math.floor((cam.x - viewW / cam.z) / s) * s;
      const y0 = Math.floor((cam.y - viewH / cam.z) / s) * s;
      for (let x = x0; x < cam.x + viewW / cam.z; x += s) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, Lab.params.worldH); ctx.stroke();
      }
      for (let y = y0; y < cam.y + viewH / cam.z; y += s) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(Lab.params.worldW, y); ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(70,50,40,0.55)';
    for (const c of Lab.corpses) {
      ctx.beginPath(); ctx.ellipse(c.x, c.y, 5, 3.2, 0.4, 0, TAU); ctx.fill();
    }
    const dens = Lab.params.renderDensity;
    const z = cam.z;
    for (const o of Lab.orgs) {
      if (z < 0.45 && dens < 1 && (o.id & 1)) continue;
      drawOrg(o, dens);
    }
    if (Lab.protected) {
      ctx.strokeStyle = 'rgba(242, 214, 112, 0.85)';
      ctx.setLineDash([8 / z, 6 / z]);
      ctx.lineWidth = 2 / z;
      ctx.strokeRect(Lab.protected.x, Lab.protected.y, Lab.protected.w, Lab.protected.h);
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(242,214,112,0.06)';
      ctx.fillRect(Lab.protected.x, Lab.protected.y, Lab.protected.w, Lab.protected.h);
    }
    ctx.restore();
  }

  /* ---------- ui ---------- */
  let toastT = 0;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg; el.style.display = 'block';
    toastT = performance.now() + 2200;
  }

  function selectedOrg() {
    if (!Lab.selected) return null;
    return findById(Lab.selected);
  }

  function barRow(name, v, max) {
    const p = clamp(v / (max || 1), 0, 1);
    return '<div class="bar"><span>' + name + '</span><i><b style="width:' + (p * 100).toFixed(0) + '%"></b></i><span>' + v.toFixed(2) + '</span></div>';
  }

  function inspectHTML() {
    const o = selectedOrg();
    if (!o) {
      return '<p class="muted">Select an organism to inspect live sensors, genotype, lineage and decisions. Click the canvas with the Select tool, or use Follow.</p>';
    }
    const s = o.sensors, g = o.g;
    return '<fieldset><legend>Organism #' + o.id + '</legend>' +
      '<div class="kv">' +
      '<span>Role</span><b>' + ROLE_NAME[o.role] + '</b>' +
      '<span>Species</span><b>' + o.species + '</b>' +
      '<span>Behavior</span><b>' + o.behavior + '</b>' +
      '<span>Energy</span><b>' + o.energy.toFixed(1) + '</b>' +
      '<span>Health</span><b>' + o.health.toFixed(1) + '</b>' +
      '<span>Age</span><b>' + o.age + '</b>' +
      '<span>Generation</span><b>' + o.gen + '</b>' +
      '<span>Parents</span><b>' + o.parent + (o.parent2 ? ' + ' + o.parent2 : '') + '</b>' +
      '<span>Children / descendants</span><b>' + o.children + ' / ' + o.descendants + '</b>' +
      '<span>Mutations at birth</span><b>' + o.muts + '</b>' +
      '<span>Last meal tick</span><b>' + o.lastEat + '</b>' +
      '</div></fieldset>' +
      '<fieldset><legend>Sensors</legend><div class="bars">' +
      barRow('food', s.foodS, 4) + barRow('prey', s.preyS, 4) + barRow('predator', s.predS, 4) +

  function lineageHTML() {
    const o = selectedOrg();
    if (!o) return '<p class="muted">Select an organism to view ancestry and living descendants.</p>' +
      '<canvas id="phylo" width="600" height="160" aria-label="Phylogeny canvas"></canvas>';
    const anc = [];
    let cur = o, g = 0;
    anc.push(o);
    while (cur && cur.parent && g++ < 12) {
      cur = findById(cur.parent);
      if (cur) anc.unshift(cur); else break;
    }
    const kids = Lab.orgs.filter(x => x.parent === o.id || x.parent2 === o.id);
    return '<fieldset><legend>Lineage of #' + o.id + '</legend>' +
      '<p class="muted">Ancestors (oldest first): ' + anc.map(a => '#' + a.id + ' g' + a.gen).join(' → ') + '</p>' +
      '<p class="muted">Living offspring: ' + (kids.length ? kids.map(k => '#' + k.id).join(', ') : 'none') + '</p>' +
      '<div class="chips">' + Lab.species.filter(s => s.alive > 0).slice(0, 18).map(s =>
        '<button type="button" class="chip' + (Lab.highlightSpecies === s.id ? ' on' : '') + '" data-sp="' + s.id + '">sp ' + s.id + ' (' + s.alive + ')</button>'
      ).join('') + '</div>' +
      '</fieldset><canvas id="phylo" width="600" height="160" aria-label="Phylogeny canvas"></canvas>';
  }

  function drawPhylo() {
    const c = $('phylo'); if (!c) return;
    const pctx = c.getContext('2d');
    const w = c.width, h = c.height;
    pctx.fillStyle = '#0a141a'; pctx.fillRect(0, 0, w, h);
    const o = selectedOrg(); if (!o) return;
    const anc = [];
    let cur = o, g = 0;
    anc.push(o);
    while (cur && cur.parent && g++ < 10) {
      const p = findById(cur.parent);
      if (!p) break;
      anc.unshift(p); cur = p;
    }
    const kids = Lab.orgs.filter(x => x.parent === o.id);
    pctx.strokeStyle = '#4d6a62'; pctx.fillStyle = '#dceee4';
    pctx.font = '10px sans-serif';
    const n = anc.length;
    for (let i = 0; i < n; i++) {
      const x = 24 + i * Math.min(70, (w - 80) / Math.max(1, n));
      const y = 50;
      pctx.beginPath(); pctx.arc(x, y, 8, 0, TAU); pctx.fillStyle = orgColor(anc[i]); pctx.fill();
      pctx.fillStyle = '#cfe0d6'; pctx.fillText('#' + anc[i].id, x - 10, y - 14);
      if (i) { pctx.strokeStyle = '#7fe3b0'; pctx.beginPath(); pctx.moveTo(x - Math.min(70, (w - 80) / n) + 8, y); pctx.lineTo(x - 8, y); pctx.stroke(); }
    }
    const ox = 24 + (n - 1) * Math.min(70, (w - 80) / Math.max(1, n));
    kids.slice(0, 8).forEach((k, i) => {
      const x = 40 + i * 48, y = 120;
      pctx.strokeStyle = '#d7c27a';
      pctx.beginPath(); pctx.moveTo(ox, 58); pctx.lineTo(x, y - 8); pctx.stroke();
      pctx.beginPath(); pctx.arc(x, y, 7, 0, TAU); pctx.fillStyle = orgColor(k); pctx.fill();
      pctx.fillStyle = '#cfe0d6'; pctx.fillText('#' + k.id, x - 10, y + 18);
    });
  }

  function drawSeries(id, series, colors) {
    const c = $(id); if (!c) return;
    const p = c.getContext('2d');
    const w = c.width, h = c.height;
    p.fillStyle = '#0a141a'; p.fillRect(0, 0, w, h);
    let max = 1;
    for (const s of series) for (const v of s.data) if (v > max) max = v;
    const n = series[0].data.length; if (n < 2) return;
    for (let si = 0; si < series.length; si++) {
      const s = series[si];
      p.strokeStyle = s.color; p.lineWidth = 1.5; p.beginPath();
      for (let i = 0; i < n; i++) {
        const x = i / (n - 1) * (w - 8) + 4;
        const y = h - 6 - (s.data[i] / max) * (h - 14);
        if (i === 0) p.moveTo(x, y); else p.lineTo(x, y);
      }
      p.stroke();
    }
    p.fillStyle = '#8aa396'; p.font = '10px sans-serif';
    p.fillText(series.map(s => s.name).join(' · ') + '  max ' + max.toFixed(1), 6, 12);
  }

    $('btnPause').onclick = () => { Lab.paused = !Lab.paused; transportHTML(); bindDynamic(); };
    $('btnStep').onclick = () => { Lab.paused = true; simTick(); transportHTML(); bindDynamic(); refreshInspect(); };
    $('btnReset').onclick = () => { reset($('seed').value); rebuildUI(); };

    const pane = (id) => {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.getAttribute('data-tab') === id));
      document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === id));

      if (id === 'lineage') { $('lineage').innerHTML = lineageHTML(); bindDynamic(); drawPhylo(); }

  function refreshInspect() {
    $('inspect').innerHTML = inspectHTML();
    if ($('lineage').classList.contains('active')) {
      $('lineage').innerHTML = lineageHTML();
      bindDynamic();
      drawPhylo();

    drawCharts();

  /* ---------- input ---------- */
  let protectStart = null;
  canvas.addEventListener('pointerdown', (ev) => {
    canvas.setPointerCapture(ev.pointerId);
    const p = worldFromEvent(ev);
    Lab.pointer.down = true;
    Lab.pointer.wx = p.wx; Lab.pointer.wy = p.wy;
    Lab.pointer.lsx = p.sx; Lab.pointer.lsy = p.sy;
    if (ev.button === 1 || ev.shiftKey || Lab.tool === 'select' && ev.altKey) Lab.pointer.pan = true;
    else if (Lab.tool === 'protect') protectStart = { x: p.wx, y: p.wy };
    else if (Lab.tool === 'select' || Lab.tool === 'follow') {
      const hit = pick(p.wx, p.wy);
      if (hit) {
        Lab.selected = hit.id;
        Lab.follow = Lab.tool === 'follow';
        refreshInspect();
      } else {
        Lab.pointer.pan = true;
        if (Lab.tool === 'select') { Lab.selected = 0; Lab.follow = false; }
      }
    } else applyTool(p.wx, p.wy, true);
  });
  canvas.addEventListener('pointermove', (ev) => {
    const p = worldFromEvent(ev);
    Lab.pointer.wx = p.wx; Lab.pointer.wy = p.wy;
    if (!Lab.pointer.down) return;
    if (Lab.pointer.pan) {
      Lab.camera.x -= (p.sx - Lab.pointer.lsx) / Lab.camera.z;
      Lab.camera.y -= (p.sy - Lab.pointer.lsy) / Lab.camera.z;
    } else if (Lab.tool === 'protect' && protectStart) {
      Lab.protected = {
        x: Math.min(protectStart.x, p.wx), y: Math.min(protectStart.y, p.wy),
        w: Math.abs(p.wx - protectStart.x), h: Math.abs(p.wy - protectStart.y)
      };
    } else if (!['select', 'follow', 'spawnH', 'spawnP', 'spawnS'].includes(Lab.tool)) {
      applyTool(p.wx, p.wy, false);
    }
    Lab.pointer.lsx = p.sx;
    Lab.pointer.lsy = p.sy;
  });
  canvas.addEventListener('pointerup', () => {
    Lab.pointer.down = false; Lab.pointer.pan = false; protectStart = null;
  });
  canvas.addEventListener('pointercancel', () => { Lab.pointer.down = false; Lab.pointer.pan = false; });
  canvas.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const p = worldFromEvent(ev);
    const z0 = Lab.camera.z;
    const z1 = clamp(z0 * (ev.deltaY > 0 ? 0.9 : 1.11), 0.25, 4.5);
    Lab.camera.x = p.wx - (p.wx - Lab.camera.x) * (z0 / z1);
    Lab.camera.y = p.wy - (p.wy - Lab.camera.y) * (z0 / z1);
    Lab.camera.z = z1;
  }, { passive: false });

  function pick(wx, wy) {
    let best = null, bestD = 14 / Lab.camera.z + 8;
    for (const o of Lab.orgs) {
      const d = hypot(o.x - wx, o.y - wy);
      const r = phenotype(o).radius + bestD;
      if (d < r && d < bestD + 6) { best = o; bestD = d; }
    }
    return best;
  }

  function applyTool(wx, wy) {
    wx = clamp(wx, 0, Lab.params.worldW);
    wy = clamp(wy, 0, Lab.params.worldH);
    const t = Lab.tool;
    if (t === 'spawnH' || t === 'spawnP' || t === 'spawnS') {
      if (blocked(wx, wy)) return;
      const role = t === 'spawnP' ? ROLE.PRED : t === 'spawnS' ? ROLE.SCAV : ROLE.HERB;
      Lab.orgs.push(makeOrg(role, wx, wy));
      return;
    }
    if (t === 'erase') {
      const hit = pick(wx, wy);
      if (hit) kill(hit, 'removed');
      for (let i = Lab.corpses.length - 1; i >= 0; i--) {
        if (hypot(Lab.corpses[i].x - wx, Lab.corpses[i].y - wy) < 10) Lab.corpses.splice(i, 1);
      }
      paintCircle(wx, wy, 1, (i) => { Lab.grid.food[i] *= 0.4; });
      return;
    }
    const R = Lab.paintR;
    if (t === 'food') paintCircle(wx, wy, R, (i) => { if (!Lab.grid.block[i]) Lab.grid.food[i] = clamp(Lab.grid.food[i] + 0.2, 0, 1.3); });
    if (t === 'fertile') paintCircle(wx, wy, R, (i) => { Lab.grid.fert[i] = clamp(Lab.grid.fert[i] + 0.08, 0, 1); });
    if (t === 'rock' || t === 'barrier') paintCircle(wx, wy, t === 'barrier' ? 0 : 1, (i) => { Lab.grid.block[i] = 1; Lab.grid.food[i] = 0; });
    if (t === 'heat') paintCircle(wx, wy, R, (i) => { Lab.grid.temp[i] = clamp(Lab.grid.temp[i] + 0.06, -1, 1); });
    if (t === 'cool') paintCircle(wx, wy, R, (i) => { Lab.grid.temp[i] = clamp(Lab.grid.temp[i] - 0.06, -1, 1); });
    if (t === 'wet') paintCircle(wx, wy, R, (i) => { Lab.grid.moist[i] = clamp(Lab.grid.moist[i] + 0.06, 0, 1); });
    if (t === 'dry') paintCircle(wx, wy, R, (i) => { Lab.grid.moist[i] = clamp(Lab.grid.moist[i] - 0.06, 0, 1); });
  }

  window.addEventListener('keydown', (ev) => {
    if (ev.target && ['INPUT', 'SELECT', 'TEXTAREA'].includes(ev.target.tagName)) return;
    if (ev.code === 'Space') { ev.preventDefault(); Lab.paused = !Lab.paused; transportHTML(); bindDynamic(); }
    if (ev.key === 'n' || ev.key === 'N') { Lab.paused = true; simTick(); refreshInspect(); }
    if (ev.key === 'r' || ev.key === 'R') { reset($('seed').value); rebuildUI(); }
    if (ev.key === 'f' || ev.key === 'F') { Lab.follow = !!selectedOrg(); Lab.tool = 'follow'; toolsHTML(); }
    if (ev.key === '[') Lab.speed = clamp(Lab.speed / 1.25, 0.25, 20);
    if (ev.key === ']') Lab.speed = clamp(Lab.speed * 1.25, 0.25, 20);
    if (ev.key === 'Escape') { Lab.selected = 0; Lab.follow = false; }
  });
  window.addEventListener('resize', resize);

  /* ---------- loop ---------- */
  let last = performance.now();
  let acc = 0;
  let uiT = 0;
  function frame(now) {
    const dt = Math.min(0.08, (now - last) / 1000);
    last = now;
    Lab.frames++;
    if (now - Lab.fpsT > 500) {
      Lab.fps = Lab.frames / ((now - Lab.fpsT) / 1000);
      Lab.frames = 0; Lab.fpsT = now;
    }
    if (!Lab.paused) {
      acc += dt * Lab.speed * 30;
      let n = 0;
      const cap = Lab.orgs.length > 800 ? 8 : 16;
      while (acc >= 1 && n < cap) { simTick(); acc -= 1; n++; }
      if (acc > 8) acc = 8;
    }
    if (Lab.follow) {
      const o = selectedOrg();
      if (o) {
        Lab.camera.x = lerp(Lab.camera.x, o.x, 0.12);
        Lab.camera.y = lerp(Lab.camera.y, o.y, 0.12);
      }
    }
    render();
    if (now - uiT > 220) {
      uiT = now;
      statsHTML();
      if ($('inspect').classList.contains('active') && Lab.selected) $('inspect').innerHTML = inspectHTML();
      if ($('charts').classList.contains('active')) drawCharts();
      if ($('lineage').classList.contains('active')) drawPhylo();
    }
    if (now - Lab.autosaveT > 8000) { Lab.autosaveT = now; autosave(); }
    if (toastT && now > toastT) { $('toast').style.display = 'none'; toastT = 0; }
    requestAnimationFrame(frame);
  }

  /* ---------- public API ---------- */
  window.EvoLab = {
    get Lab() { return Lab; },
    stats: () => Object.assign(totals(), {
      tick: Lab.tick, fps: Lab.fps, paused: Lab.paused, speed: Lab.speed,
      births: Lab.birthsWin, deaths: Lab.deathsWin, intervention: Lab.intervention,
      selected: Lab.selected, lastMeal: Lab.lastMeal, lastBirth: Lab.lastBirth, lastDeath: Lab.lastDeath
    }),
    selected: () => {
      const o = selectedOrg();
      if (!o) return null;
      return {
        id: o.id, role: ROLE_NAME[o.role], species: o.species, behavior: o.behavior,
        energy: o.energy, health: o.health, age: o.age, gen: o.gen,
        parent: o.parent, descendants: o.descendants, muts: o.muts,
        sensors: o.sensors, outputs: o.outputs, genome: o.g, x: o.x, y: o.y
      };
    },
    history: () => Lab.history,
    pause: () => { Lab.paused = true; },
    resume: () => { Lab.paused = false; },
    step: () => { Lab.paused = true; simTick(); },
    reset: (s) => reset(s),
    preset: (n) => { applyPreset(n); rebuildUI(); },
    disaster,
    serialize, hydrate,
    setSpeed: (s) => { Lab.speed = s; },
    selectId: (id) => { Lab.selected = id; refreshInspect(); },
    runTicks: (n) => { for (let i = 0; i < n; i++) simTick(); },
    pickNearest: (x, y) => { const o = pick(x, y); if (o) { Lab.selected = o.id; refreshInspect(); } return o && o.id; },
    paint: (tool, x, y) => { const prev = Lab.tool; Lab.tool = tool; applyTool(x, y, true); Lab.tool = prev; }
  };

  /* boot */
  resize();
  reset(42);
  rebuildUI();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
