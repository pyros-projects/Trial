<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Falling-Sand Alchemy Sandbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23c4a35a' width='16' height='16'/%3E%3Crect fill='%23c45c3e' x='6' y='2' width='4' height='8'/%3E%3C/svg%3E" />
<style>
:root {
  --bg: #100e0c;
  --bg2: #171410;
  --panel: #1c1916;
  --ink: #efe6d6;
  --muted: #8f8373;
  --line: #3a332c;
  --gold: #c4a35a;
  --gold2: #e0c888;
  --danger: #c45c3e;
  --ok: #7daf6a;
  --shadow: 0 10px 40px rgba(0,0,0,.45);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body {
  font: 13px/1.4 "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
  background:
    radial-gradient(1200px 500px at 10% -10%, #2a2218 0%, transparent 55%),
    radial-gradient(900px 600px at 110% 10%, #1a1512 0%, transparent 50%),
    var(--bg);
}
button, input, select { font: inherit; color: inherit; }
#app { display: flex; flex-direction: column; height: 100%; min-height: 0; }
header {
  display: flex; align-items: center; gap: 14px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(#221e19, #161310);
  flex-wrap: wrap;
}
.brand { display: flex; flex-direction: column; min-width: 160px; }
.brand h1 {
  margin: 0; font: 600 20px/1 Palatino, "Palatino Linotype", Georgia, serif;
  letter-spacing: .08em; color: var(--gold2);
}
.brand small { color: var(--muted); letter-spacing: .16em; text-transform: uppercase; font-size: 9px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
header .row { margin-left: auto; }
.btn, header select, .dock select, .dock button, .filebtn {
  background: #2a251f;
  border: 1px solid #4a4034;
  color: var(--ink);
  border-radius: 4px;
  padding: 5px 9px;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
}
.btn:hover, .dock button:hover, .filebtn:hover { border-color: var(--gold); color: var(--gold2); }
.btn.on, .mat.on, .tool.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), inset 0 0 10px rgba(196,163,90,.18); }
.btn.danger { border-color: #6a3a2e; }
.workspace { display: flex; flex: 1; min-height: 0; }
.palette, .dock {
  background: var(--panel);
  border-color: var(--line);
  overflow: auto;
  padding: 10px;
}
.palette { width: 168px; border-right: 1px solid var(--line); }
.dock { width: 292px; border-left: 1px solid var(--line); }
.stage { flex: 1; position: relative; min-width: 0; min-height: 0; background: #050403; }
canvas {
  display: block; width: 100%; height: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
  cursor: crosshair; touch-action: none;
}
.hud {
  position: absolute; left: 10px; top: 10px;
  background: rgba(12,10,8,.72);
  border: 1px solid rgba(196,163,90,.28);
  color: #f0e6d4;
  padding: 8px 10px;
  font: 11px/1.45 ui-monospace, "Cascadia Code", monospace;
  pointer-events: none;
  border-radius: 4px;
  max-width: min(420px, calc(100% - 20px));
  text-shadow: 0 1px 0 #000;
}
.hud b { color: var(--gold2); font-weight: 600; }
.hint {
  position: absolute; right: 10px; bottom: 10px;
  color: var(--muted); font-size: 11px;
  background: rgba(12,10,8,.55); padding: 6px 8px; border-radius: 4px;
  pointer-events: none; max-width: 46%;
}
h2 {
  margin: 0 0 8px;
  font: 600 11px/1 Palatino, Georgia, serif;
  letter-spacing: .18em; text-transform: uppercase; color: var(--gold);
}
.mats { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.mat {
  display: flex; align-items: center; gap: 6px;
  background: #241f1b; border: 1px solid #3d352c;
  border-radius: 4px; padding: 5px 6px; cursor: pointer; text-align: left;
}
.sw { width: 12px; height: 12px; border-radius: 2px; border: 1px solid rgba(0,0,0,.4); flex: 0 0 12px; }
.tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 10px; }
.tool { padding: 6px 4px; font-size: 11px; }
.ctrl { margin: 0 0 8px; }
.ctrl label { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; gap: 8px; }
.ctrl output { color: var(--ink); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--gold); }
.sect { margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #2c2722; }
.insp { color: var(--muted); font: 11px ui-monospace, monospace; min-height: 2.8em; }
.filebtn { display: inline-block; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
@media (max-width: 860px) {
  header { padding: 6px 8px; gap: 8px; max-height: 26vh; overflow: auto; }
  .workspace { flex-direction: column; }
  .palette { width: 100%; max-height: 16vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .dock { width: 100%; border-left: 0; border-top: 1px solid var(--line); max-height: 30vh; }
  .stage { min-height: 38vh; flex: 1 1 auto; }
  .mats { grid-template-columns: repeat(4, 1fr); }
  .brand h1 { font-size: 16px; }
  .hint { display: none; }
  .hud { font-size: 10px; left: 6px; top: 6px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>Athanor</h1>
      <small>Falling-Sand Alchemy</small>
    </div>
    <div class="row" role="toolbar" aria-label="Simulation transport">
      <button class="btn on" id="btnPause" aria-pressed="false">Pause</button>
      <button class="btn" id="btnStep">Step</button>
      <button class="btn" id="btnReset">Reset</button>
      <button class="btn danger" id="btnClear">Clear</button>
    </div>
    <div class="row">
      <label>Preset
        <select id="preset" aria-label="Scene preset"></select>
      </label>
      <button class="btn" id="btnPreset">Load scene</button>
      <label>Seed <input id="seed" type="number" value="46" style="width:72px;background:#2a251f;border:1px solid #4a4034;border-radius:4px;padding:4px 6px" /></label>
    </div>
    <div class="row">
      <label>View
        <select id="viz" aria-label="Visualization mode"></select>
      </label>
      <button class="btn" id="btnSave">Save JSON</button>
      <button class="btn" id="btnLoad">Load JSON</button>
      <button class="btn" id="btnAuto">Load autosave</button>
      <button class="btn" id="btnPng">Export PNG</button>
      <input class="sr" id="fileIn" type="file" accept="application/json,.json" />
    </div>
  </header>
  <div class="workspace">
    <aside class="palette">
      <h2>Materials</h2>
      <div class="mats" id="mats"></div>
    </aside>
    <div class="stage">
      <canvas id="cv" tabindex="0" aria-label="Simulation canvas"></canvas>
      <div class="hud" id="hud"></div>
      <div class="hint">Paint continuously. Space pause · N step · [ ] brush · I dropper · E erase · H heat · C cool · F fill · B blast</div>
    </div>
    <aside class="dock">
      <div class="sect">
        <h2>Tools</h2>
        <div class="tools" id="tools"></div>
        <div class="insp" id="insp">Hover a cell for diagnostics.</div>
      </div>
      <div class="sect">
        <h2>Brush</h2>
        <div class="ctrl"><label>Radius <output id="oRadius">4</output></label><input id="brushR" type="range" min="1" max="32" value="4" /></div>
        <div class="ctrl"><label>Shape</label>
          <select id="brushShape" aria-label="Brush shape">
            <option value="circle">Circle</option>
            <option value="square">Square</option>
            <option value="diamond">Diamond</option>
          </select>
        </div>
        <div class="ctrl"><label>Amount <output id="oAmt">1.00</output></label><input id="brushAmt" type="range" min="5" max="100" value="100" /></div>
        <div class="ctrl"><label>Temperature <output id="oTemp">auto</output></label><input id="brushTemp" type="range" min="-50" max="1500" value="20" /></div>
        <div class="ctrl"><label><input id="tempAuto" type="checkbox" checked /> Material default temperature</label></div>
        <div class="ctrl"><label>Velocity <output id="oVel">0</output></label><input id="brushVel" type="range" min="-8" max="8" value="0" /></div>
        <div class="ctrl"><label>Spray <output id="oSpray">0.00</output></label><input id="brushSpray" type="range" min="0" max="100" value="0" /></div>
      </div>
      <div class="sect">
        <h2>Simulation</h2>
        <div class="ctrl"><label>Resolution</label>
          <select id="res" aria-label="Simulation resolution">
            <option value="160x90">160×90</option>
            <option value="192x108">192×108</option>
            <option value="256x144" selected>256×144</option>
            <option value="320x180">320×180</option>
            <option value="384x216">384×216</option>
            <option value="480x270">480×270</option>
          </select>
        </div>
        <div class="ctrl"><label>Speed <output id="oSpeed">1.00</output></label><input id="speed" type="range" min="10" max="400" value="100" /></div>
        <div class="ctrl"><label>Substeps <output id="oSub">1</output></label><input id="substeps" type="range" min="1" max="4" value="1" /></div>
        <div class="ctrl"><label>Gravity</label>
          <select id="gravity" aria-label="Gravity direction">
            <option value="down">Down</option>
            <option value="up">Up</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
          </select>
        </div>
        <div class="ctrl"><label>Ambient °C <output id="oAmb">20</output></label><input id="amb" type="range" min="-40" max="80" value="20" /></div>
        <div class="ctrl"><label>Heat transfer <output id="oHeat">1.00</output></label><input id="heatRate" type="range" min="10" max="300" value="100" /></div>
        <div class="ctrl"><label>Reaction rate <output id="oRx">1.00</output></label><input id="reactRate" type="range" min="10" max="300" value="100" /></div>
        <div class="ctrl"><label>Liquid mobility <output id="oLiq">1.00</output></label><input id="liqMob" type="range" min="10" max="300" value="100" /></div>
        <div class="ctrl"><label>Gas diffusion <output id="oGas">1.00</output></label><input id="gasDiff" type="range" min="10" max="300" value="100" /></div>
        <div class="ctrl"><label>Fire intensity <output id="oFire">1.00</output></label><input id="fireInt" type="range" min="10" max="300" value="100" /></div>
        <div class="ctrl"><label>Explosion strength <output id="oBoom">1.00</output></label><input id="explStr" type="range" min="20" max="300" value="100" /></div>
      </div>
    </aside>
  </div>
</div>
<script>
(function () {
  'use strict';

  var EMPTY=0, WALL=1, SAND=2, WATER=3, OIL=4, SALT=5, WOOD=6, PLANT=7, FIRE=8, SMOKE=9,
      STEAM=10, ICE=11, LAVA=12, STONE=13, METAL=14, MOLTEN=15, ACID=16, GAS=17, SPARK=18, TNT=19, ASH=20;

  var MAT = [
    {n:'Empty', k:0, d:0, c:[10,9,11], fl:0, fu:0, econd:0, cr:0, melt:-9999, boil:9999, hc:1, tc:0.03, flow:0},
    {n:'Wall', k:1, d:50, c:[58,54,50], fl:0, fu:0, econd:0, cr:255, melt:9999, boil:9999, hc:5, tc:0.05, flow:0},
    {n:'Sand', k:2, d:2.4, c:[210,176,98], fl:0, fu:0, econd:0, cr:90, melt:1420, boil:2230, hc:1.2, tc:0.12, flow:0},
    {n:'Water', k:3, d:1.0, c:[52,118,198], fl:0, fu:0, econd:0.05, cr:0, melt:0, boil:100, hc:1.8, tc:0.28, flow:4},
    {n:'Oil', k:3, d:0.78, c:[96,64,28], fl:0.88, fu:150, econd:0, cr:20, melt:-40, boil:260, hc:1.4, tc:0.1, flow:2.4},
    {n:'Salt', k:2, d:2.16, c:[230,230,234], fl:0, fu:0, econd:0.2, cr:10, melt:800, boil:1400, hc:1, tc:0.16, flow:0},
    {n:'Wood', k:1, d:0.72, c:[118,78,42], fl:0.72, fu:190, econd:0, cr:36, melt:9999, boil:9999, hc:1.3, tc:0.08, flow:0},
    {n:'Plant', k:1, d:0.5, c:[46,142,62], fl:0.82, fu:95, econd:0, cr:22, melt:9999, boil:9999, hc:1.1, tc:0.08, flow:0},
    {n:'Fire', k:5, d:0.11, c:[255,132,34], fl:0, fu:0, econd:0, cr:0, melt:-9999, boil:9999, hc:0.4, tc:0.35, flow:1},
    {n:'Smoke', k:4, d:0.07, c:[90,90,94], fl:0, fu:0, econd:0, cr:0, melt:-9999, boil:9999, hc:0.5, tc:0.12, flow:2},
    {n:'Steam', k:4, d:0.08, c:[186,198,210], fl:0, fu:0, econd:0, cr:0, melt:0, boil:100, hc:0.6, tc:0.18, flow:3},
    {n:'Ice', k:1, d:0.92, c:[176,216,242], fl:0, fu:0, econd:0.02, cr:40, melt:0, boil:100, hc:1.6, tc:0.22, flow:0},
    {n:'Lava', k:3, d:2.7, c:[255,76,22], fl:0, fu:0, econd:0.1, cr:200, melt:1100, boil:2600, hc:1.5, tc:0.42, flow:1.15},
    {n:'Stone', k:1, d:2.55, c:[94,92,90], fl:0, fu:0, econd:0, cr:78, melt:1100, boil:2600, hc:2.2, tc:0.16, flow:0},
    {n:'Metal', k:1, d:7.8, c:[148,158,172], fl:0, fu:0, econd:1, cr:48, melt:850, boil:2800, hc:1.1, tc:0.72, flow:0},
    {n:'Molten metal', k:3, d:6.9, c:[255,166,58], fl:0, fu:0, econd:0.85, cr:80, melt:850, boil:2800, hc:1.1, tc:0.55, flow:1.3},
    {n:'Acid', k:3, d:1.18, c:[150,224,54], fl:0, fu:0, econd:0.25, cr:0, melt:-40, boil:118, hc:1.5, tc:0.24, flow:3.4},
    {n:'Gas', k:4, d:0.05, c:[170,212,90], fl:0.96, fu:70, econd:0, cr:0, melt:-9999, boil:9999, hc:0.5, tc:0.1, flow:3},
    {n:'Electricity', k:6, d:0.01, c:[150,214,255], fl:0, fu:0, econd:1, cr:0, melt:-9999, boil:9999, hc:0.2, tc:0.2, flow:0},
    {n:'Explosive', k:2, d:1.72, c:[178,40,40], fl:0.94, fu:40, econd:0.1, cr:30, melt:9999, boil:9999, hc:1, tc:0.1, flow:0},
    {n:'Ash', k:2, d:0.55, c:[126,122,116], fl:0, fu:0, econd:0, cr:16, melt:1200, boil:2000, hc:1, tc:0.1, flow:0}
  ];

  var TOOLS = [
    ['paint','Paint'],['erase','Erase'],['dropper','Eyedropper'],['heat','Heat'],
    ['cool','Cool'],['wind','Wind'],['bomb','Explosion'],['wall','Walls'],['fill','Fill']
  ];
  var VIZ = [
    ['normal','Normal'],['temp','Temperature'],['vel','Velocity'],['dens','Density'],
    ['charge','Electrical charge'],['fuel','Remaining fuel'],['rxn','Corrosion / activity'],['order','Update order']
  ];
  var PRESETS = [
    ['volcano','Volcano and ocean'],
    ['building','Burning building'],
    ['electrical','Electrical laboratory'],
    ['acid','Acid factory'],
    ['steam','Steam engine'],
    ['lake','Frozen lake'],
    ['plants','Plant ecosystem'],
    ['fireworks','Fireworks chain reaction'],
    ['stress','Dense stress-test']
  ];

  var W=256, H=144, N=W*H, gx=0, gy=1, tick=1, reactions=0, lastRx=0;
  var type, temp, life, aux, vx, vy, stamp, active;
  var paused=false, speed=1, substeps=1, amb=20, heatRate=1, reactRate=1, liqMob=1, gasDiff=1, fireInt=1, explStr=1;
  var vis='normal', tool='paint', mat=SAND, brushR=4, brushShape='circle', amount=1, spray=0, brushVel=0, tempAuto=true, brushTemp=20;
  var painting=false, lastCX=-1, lastCY=-1, lastPX=0, lastPY=0, hoverX=-1, hoverY=-1;
  var fps=0, fpsE=60, counts=new Uint32Array(MAT.length), activeCount=0, avgTemp=20, seed=46, currentPreset='volcano';
  var evenScan=false, boomArmed=true, processedThis=0, autosaveAt=0, rxWindow=0, rxPerSec=0, rxClock=0;

  var R=0xA341316C;
  function rnd(){ R = (Math.imul(R,1664525)+1013904223)|0; return (R>>>0)/4294967296; }
  function ri(n){ return (rnd()*n)|0; }
  function clamp(v,a,b){ return v<a?a:v>b?b:v; }
  function I(x,y){ return y*W+x; }
  function IN(x,y){ return (x|0)===x && (y|0)===y ? (x>=0&&y>=0&&x<W&&y<H) : (x>=0&&y>=0&&x<W&&y<H); }

  function alloc(w,h){
    W=w; H=h; N=w*h;
    type=new Uint8Array(N);
    temp=new Float32Array(N);
    life=new Uint8Array(N);
    aux=new Uint8Array(N);
    vx=new Int8Array(N);
    vy=new Int8Array(N);
    stamp=new Uint32Array(N);
    active=new Uint8Array(N);
    for(var i=0;i<N;i++) temp[i]=amb;
  }

  function wake(x,y){
    var x0=x-1,x1=x+1,y0=y-1,y1=y+1;
    if(x0<0)x0=0; if(y0<0)y0=0; if(x1>=W)x1=W-1; if(y1>=H)y1=H-1;
    for(var yy=y0;yy<=y1;yy++) for(var xx=x0;xx<=x1;xx++) active[yy*W+xx]=6;
  }
  function wakei(i){ wake(i%W,(i/W)|0); }
  function wakeAll(){ for(var i=0;i<N;i++) if(type[i]||active[i]) active[i]=8; }

  function defTemp(t){
    if(t===FIRE) return 980;
    if(t===LAVA) return 1280;
    if(t===STEAM) return 112;
    if(t===SMOKE) return 90;
    if(t===ICE) return -8;
    if(t===MOLTEN) return 940;
    if(t===SPARK) return 420;
    if(t===WATER) return Math.min(amb, 22);
    return amb;
  }
  function defLife(t){
    if(t===FIRE) return 42+ri(28);
    if(t===SMOKE) return 70+ri(50);
    if(t===STEAM) return 110+ri(50);
    if(t===SPARK) return 10+ri(8);
    if(t===WOOD) return 200;
    if(t===PLANT) return 110;
    if(t===OIL) return 160;
    if(t===GAS) return 140;
    if(t===TNT) return 255;
    return 0;
  }

  function setCell(i, t, opt){
    opt=opt||{};
    type[i]=t;
    if(t===EMPTY){
      if(!opt.keep){ temp[i]=opt.temp!=null?opt.temp:amb; life[i]=0; aux[i]=0; vx[i]=0; vy[i]=0; }
      else { life[i]=0; aux[i]=0; }
    } else if(!opt.keep){
      temp[i]=opt.temp!=null?opt.temp:defTemp(t);
      life[i]=opt.life!=null?opt.life:defLife(t);
      aux[i]=opt.aux||0;
      vx[i]=opt.vx||0;
      vy[i]=opt.vy||0;
    } else {
      if(opt.life!=null) life[i]=opt.life;
      if(opt.aux!=null) aux[i]=opt.aux;
      if(opt.temp!=null) temp[i]=opt.temp;
    }
    wakei(i);
  }

  function dens(i){
    var t=type[i], d=MAT[t].d;
    if(t===WATER) d += aux[i]*0.0012;
    return d;
  }

  function canDisplace(i,j){
    var a=type[i], b=type[j];
    if(b===WALL || a===WALL) return false;
    if(b===EMPTY) return true;
    var kb=MAT[b].k;
    if(kb===1) return false;
    var da=dens(i), db=dens(j);
    if(da<=db+0.04) return false;
    var ka=MAT[a].k;
    if(ka===2) return kb===3||kb===4||kb===5||kb===6||kb===2&&da>db+0.5;
    if(ka===3) return (kb===3||kb===4||kb===5||kb===6) && rnd()<clamp(0.25+(da-db)*0.45,0.08,0.85);
    if(ka===4) return kb===4 && rnd()<0.45;
    if(ka===5||ka===6) return kb===4||kb===6||b===EMPTY;
    return false;
  }

  function swap(i,j){
    var t=type[i]; type[i]=type[j]; type[j]=t;
    var f=temp[i]; temp[i]=temp[j]; temp[j]=f;
    var u=life[i]; life[i]=life[j]; life[j]=u;
    u=aux[i]; aux[i]=aux[j]; aux[j]=u;
    var s=vx[i]; vx[i]=vx[j]; vx[j]=s;
    s=vy[i]; vy[i]=vy[j]; vy[j]=s;
    stamp[j]=tick; stamp[i]=tick;
    wakei(i); wakei(j);
    return true;
  }

  function ignite(i){
    var t=type[i];
    if(t===FIRE||t===WALL||t===WATER||t===ICE||t===STEAM||t===SPARK) return;
    if(t===TNT){ fuse(i); return; }
    var fuel=MAT[t].fu || 40;
    if(t===OIL||t===GAS) fuel = life[i] || fuel;
    setCell(i, FIRE, {temp: Math.max(temp[i], 860), life: clamp(fuel>>1, 18, 220)});
    reactions++;
  }

  function fuse(i){
    if(type[i]!==TNT) return;
    if(aux[i]===0){ aux[i]=3+ri(6); wakei(i); reactions++; }
  }

  function explode(cx,cy,radius,power){
    var r=Math.max(2, radius|0), r2=r*r;
    for(var y=cy-r;y<=cy+r;y++){
      for(var x=cx-r;x<=cx+r;x++){
        if(x<0||y<0||x>=W||y>=H) continue;
        var dx=x-cx, dy=y-cy, d2=dx*dx+dy*dy;
        if(d2>r2) continue;
        var d=Math.sqrt(d2), f=1-d/(r+0.001);
        var i=I(x,y), t=type[i];
        if(t===WALL && f<0.82) continue;
        var imp=f*power*6;
        vx[i]=clamp((vx[i]+dx*imp)|0,-127,127);
        vy[i]=clamp((vy[i]+dy*imp)|0,-127,127);
        temp[i]+=380*f*power;
        if(t===TNT){ aux[i]=1+ri(5); wake(x,y); continue; }
        if(t===GAS && f>0.2){ ignite(i); continue; }
        if(f>0.28 && t!==EMPTY && t!==WALL){
          if(rnd()<f*0.9){
            if(rnd()<0.45*fireInt) setCell(i,FIRE,{temp:900+ri(200), life:20+ri(30)});
            else if(rnd()<0.4) setCell(i,SMOKE,{temp:140, life:30+ri(40)});
            else setCell(i,EMPTY,{temp:200});
          }
        } else wake(x,y);
      }
    }
    reactions+=12;
  }

  var N4x=[1,-1,0,0], N4y=[0,0,1,-1];
  var N8x=[1,-1,0,0,1,1,-1,-1], N8y=[0,0,1,-1,1,-1,1,-1];

  function conductive(t,i){
    if(t===METAL||t===MOLTEN||t===SPARK) return true;
    if(t===WATER && aux[i]>18) return true;
    if(t===ACID) return true;
    return MAT[t].econd>0.5;
  }

  function heatPass(){
    var hr=heatRate, a=amb;
    for(var y=0;y<H;y++){
      for(var x=0;x<W;x++){
        var i=I(x,y);
        if(!type[i] && !active[i] && Math.abs(temp[i]-a)<3) continue;
        if(x+1<W){
          var j=i+1;
          var ci=type[i]?MAT[type[i]].tc:0.045, cj=type[j]?MAT[type[j]].tc:0.045;
          var k=Math.min(ci,cj)*hr;
          var d=(temp[j]-temp[i])*k*0.012;
          if(d>8) d=8; if(d<-8) d=-8;
          if(d>0.08||d<-0.08){
            temp[i]+=d; temp[j]-=d;
            if(d>0.5||d<-0.5){ if(!active[i]) active[i]=3; if(!active[j]) active[j]=3; }
          }
        }
        if(y+1<H){
          var j2=i+W;
          var ci2=type[i]?MAT[type[i]].tc:0.045, cj2=type[j2]?MAT[type[j2]].tc:0.045;
          var k2=Math.min(ci2,cj2)*hr;
          var d2=(temp[j2]-temp[i])*k2*0.012;
          if(d2>8) d2=8; if(d2<-8) d2=-8;
          if(d2>0.08||d2<-0.08){
            temp[i]+=d2; temp[j2]-=d2;
            if(d2>0.5||d2<-0.5){ if(!active[i]) active[i]=3; if(!active[j2]) active[j2]=3; }
          }
        }
        var hc=type[i]?MAT[type[i]].hc:0.7;
        temp[i]+=(a-temp[i])*(0.00035*hr)/hc;
        if(temp[i]<-90) temp[i]=-90;
        if(temp[i]>2500) temp[i]=2500;
        if(type[i]===LAVA && temp[i]<1450) temp[i]+=1.2;
        if(type[i]===FIRE) temp[i]=Math.max(temp[i], 760+fireInt*90);
      }
    }
  }

  function phases(i){
    var t=type[i], T=temp[i];
    if(t===WATER && T<=-0.5){ setCell(i,ICE,{keep:1}); reactions++; return; }
    if(t===ICE && T>=1.2){ setCell(i,WATER,{keep:1}); reactions++; return; }
    if(t===WATER && T>=100){ setCell(i,STEAM,{keep:1, life:100+ri(40)}); reactions++; return; }
    if(t===STEAM && T<=88){ setCell(i,WATER,{keep:1}); reactions++; return; }
    if(t===ACID && T>=118){ setCell(i,STEAM,{keep:1, life:80}); reactions++; return; }
    if(t===METAL && T>=850){ setCell(i,MOLTEN,{keep:1}); reactions++; return; }
    if(t===MOLTEN && T<=740){ setCell(i,METAL,{keep:1, aux:aux[i]}); reactions++; return; }
    if(t===STONE && T>=1100){ setCell(i,LAVA,{keep:1}); reactions++; return; }
    if(t===LAVA && T<=760 && rnd()<0.12*reactRate){ setCell(i,STONE,{keep:1}); reactions++; return; }
    if(t===SAND && T>=1420){ setCell(i,LAVA,{keep:1}); reactions++; return; }
    if(t===ASH && T>=1200){ setCell(i,LAVA,{keep:1}); reactions++; return; }
    var m=MAT[t];
    if(m.fl>0 && T>= 210+(1-m.fl)*200) ignite(i);
    if(t===TNT && T>=155) fuse(i);
  }

  function growPlant(x,y,i){
    var wet=false;
    for(var k=0;k<8;k++){
      var nx=x+N8x[k], ny=y+N8y[k];
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      var u=type[I(nx,ny)];
      if(u===WATER||u===ICE||(u===SAND&&aux[I(nx,ny)]>10)) wet=true;
    }
    if(!wet) return;
    if(rnd()>0.045*reactRate) return;
    var dirs=[[-gx,-gy],[-gx+gy,-gy-gx],[-gx-gy,-gy+gx],[gy,-gx],[-gy,gx]];
    for(var d=0;d<dirs.length;d++){
      var px=x+dirs[d][0], py=y+dirs[d][1];
      if(px<0||py<0||px>=W||py>=H) continue;
      var j=I(px,py);
      if(type[j]===EMPTY){ setCell(j,PLANT,{temp:Math.max(amb,8)}); reactions++; return; }
    }
  }

  function chem(x,y,i){
    var t=type[i];
    for(var k=0;k<4;k++){
      var nx=x+N4x[k], ny=y+N4y[k];
      if(nx<0||ny<0||nx>=W||ny>=H) continue;
      var j=I(nx,ny), u=type[j];

      if((t===LAVA && (u===WATER||u===ICE)) || ((t===WATER||t===ICE) && u===LAVA)){
        var wi= (t===WATER||t===ICE)?i:j;
        var li= t===LAVA?i:j;
        setCell(wi, STEAM, {temp:140, life:90+ri(40)});
        temp[li]-=140;
        if(temp[li]<900 || rnd()<0.45*reactRate) setCell(li, STONE, {keep:1});
        reactions++; return;
      }
      if((t===MOLTEN && (u===WATER||u===ICE)) || ((t===WATER||t===ICE) && u===MOLTEN)){
        var w2=(t===WATER||t===ICE)?i:j;
        var m2=t===MOLTEN?i:j;
        setCell(w2, STEAM, {temp:130, life:80});
        temp[m2]-=80;
        reactions++; return;
      }
      if(t===FIRE && (u===WATER||u===ICE)){
        setCell(i, SMOKE, {temp:95, life:36+ri(24)});
        temp[j]+=28*fireInt;
        if(u===WATER && temp[j]>=100) setCell(j,STEAM,{keep:1,life:70});
        if(u===ICE && temp[j]>0) setCell(j,WATER,{keep:1});
        reactions++; return;
      }
      if(t===SALT && u===WATER){
        setCell(i, EMPTY, {});
        aux[j]=Math.min(255, aux[j]+70);
        temp[j]-=1;
        reactions++; return;
      }
      if(t===WATER && u===SALT){
        setCell(j, EMPTY, {});
        aux[i]=Math.min(255, aux[i]+70);
        reactions++; return;
      }
      if(t===ACID && (u===METAL||u===STONE||u===PLANT||u===WOOD||u===ICE||u===ASH||u===SAND)){
        var chance=0.12*reactRate*(1-MAT[u].cr/280);
        if(u===METAL) chance*=1.6;
        if(u===PLANT||u===WOOD) chance*=1.4;
        if(u===STONE) chance*=0.7;
        if(rnd()<chance){
          aux[j]=Math.min(255, aux[j]+ (u===METAL?48:u===STONE?16:u===ICE?60:36));
          reactions++;
          if(aux[j]>MAT[u].cr){
            setCell(j, EMPTY, {temp:temp[j]});
            if(rnd()<0.35) setCell(i, EMPTY, {});
          }
        }
      }
      if(t===FIRE && MAT[u].fl>0 && rnd()<0.14*fireInt*MAT[u].fl*reactRate) ignite(j);
      if(t===LAVA && MAT[u].fl>0 && rnd()<0.08*fireInt*reactRate) ignite(j);
      if((t===METAL||t===MOLTEN) && temp[i]>180 && (u===WATER||u===ICE) && rnd()<0.25*reactRate){
        setCell(j, STEAM, {temp:120, life:70});
        temp[i]-=18;
        reactions++;
      }
      if(t===SPARK){
        if(MAT[u].fl>0) ignite(j);
        if(u===TNT) fuse(j);
        if(conductive(u,j)) aux[j]=Math.min(255, aux[j]+90);
        if(u===WATER && aux[j]>10 && rnd()<0.4) aux[j]=Math.min(255,aux[j]+40);
      }
      if(t===GAS && (u===FIRE||u===SPARK||u===LAVA) && rnd()<0.5*reactRate){
        explode(x,y, 3+ri(2), 0.7*explStr);
        return;
      }
    }
    if(t===PLANT) growPlant(x,y,i);
    if(t===FIRE){
      temp[i]=Math.max(temp[i], 720+fireInt*80);
      for(var h=0;h<4;h++){
        var hx=x+N4x[h], hy=y+N4y[h];
        if(hx<0||hy<0||hx>=W||hy>=H) continue;
        temp[I(hx,hy)] += 7*fireInt;
        active[I(hx,hy)]=4;
      }
      if(rnd()<0.55+0.2*fireInt) {
        if(life[i]>0) life[i]--;
      }
      if(life[i]<=0){
        if(rnd()<0.4) setCell(i,SMOKE,{temp:130,life:40+ri(30)});
        else if(rnd()<0.45) setCell(i,ASH,{temp:90});
        else setCell(i,EMPTY,{temp:70});
      } else if(rnd()<0.22*fireInt){
        var ux=x-gx, uy=y-gy;
        if(ux>=0&&uy>=0&&ux<W&&uy<H && type[I(ux,uy)]===EMPTY)
          setCell(I(ux,uy), SMOKE, {temp:110, life:35+ri(40)});
      }
    }
    if(t===SMOKE || t===STEAM){
      if(life[i] && rnd()<0.1+0.04*gasDiff) life[i]--;
      if(life[i]<=0) setCell(i,EMPTY,{temp:temp[i]});
    }
    if(t===SPARK){
      if(life[i]) life[i]--;
      if(life[i]<=0) setCell(i,EMPTY,{});
    }
    if(t===TNT && aux[i]>0){
      aux[i]--;
      temp[i]+=18;
      if(aux[i]<=0){
        setCell(i,FIRE,{temp:1200,life:12});
        explode(x,y, Math.round(6*explStr+4), explStr*1.15);
      }
    }
    if((t===METAL||t===MOLTEN||(t===WATER&&aux[i]>18)) && aux[i]>0){
      var shared=false;
      for(var c=0;c<4;c++){
        var cx=x+N4x[c], cy=y+N4y[c];
        if(cx<0||cy<0||cx>=W||cy>=H) continue;
        var ci=I(cx,cy);
        if(conductive(type[ci],ci) && aux[ci]<aux[i]){
          var g=((aux[i]-aux[ci])>>2)+1;
          aux[i]-=g; aux[ci]=Math.min(255,aux[ci]+g);
          shared=true; wake(cx,cy);
        }
      }
      if(aux[i]>28 && rnd()<0.12*reactRate){
        for(var s=0;s<8;s++){
          var sx=x+N8x[s], sy=y+N8y[s];
          if(sx<0||sy<0||sx>=W||sy>=H) continue;
          var si=I(sx,sy);
          if(type[si]===EMPTY){ setCell(si,SPARK,{temp:380,life:8+ri(6)}); aux[i]-=12; reactions++; break; }
          if(MAT[type[si]].fl>0 && rnd()<0.5) ignite(si);
          if(type[si]===TNT) fuse(si);
        }
      }
      if(!shared && rnd()<0.2) aux[i]--;
    }
  }

  function moveCell(x,y,i){
    var t=type[i];
    var k=MAT[t].k;
    if(k===0||k===1) return;
    var ex=0, ey=0;
    if(vx[i]>1){ ex=1; vx[i]--; } else if(vx[i]<-1){ ex=-1; vx[i]++; }
    if(vy[i]>1){ ey=1; vy[i]--; } else if(vy[i]<-1){ ey=-1; vy[i]++; }
    if(ex||ey){
      var nx=x+ex, ny=y+ey;
      if(nx>=0&&ny>=0&&nx<W&&ny<H && canDisplace(i,I(nx,ny))){ swap(i,I(nx,ny)); return; }
    }
    var p=((x+y+tick)&1)?1:-1;
    if(k===2){
      var dx=gx, dy=gy;
      if(x+dx>=0&&y+dy>=0&&x+dx<W&&y+dy<H && canDisplace(i,I(x+dx,y+dy))){ swap(i,I(x+dx,y+dy)); return; }
      var sx=gx+p*gy, sy=gy-p*gx;
      if(x+sx>=0&&y+sy>=0&&x+sx<W&&y+sy<H && canDisplace(i,I(x+sx,y+sy))){ swap(i,I(x+sx,y+sy)); return; }
      sx=gx-p*gy; sy=gy+p*gx;
      if(x+sx>=0&&y+sy>=0&&x+sx<W&&y+sy<H && canDisplace(i,I(x+sx,y+sy))){ swap(i,I(x+sx,y+sy)); return; }
    } else if(k===3){
      var dx=gx, dy=gy;
      if(x+dx>=0&&y+dy>=0&&x+dx<W&&y+dy<H && canDisplace(i,I(x+dx,y+dy))){ swap(i,I(x+dx,y+dy)); return; }
      var sx=gx+p*gy, sy=gy-p*gx;
      if(x+sx>=0&&y+sy>=0&&x+sx<W&&y+sy<H && canDisplace(i,I(x+sx,y+sy))){ swap(i,I(x+sx,y+sy)); return; }
      sx=gx-p*gy; sy=gy+p*gx;
      if(x+sx>=0&&y+sy>=0&&x+sx<W&&y+sy<H && canDisplace(i,I(x+sx,y+sy))){ swap(i,I(x+sx,y+sy)); return; }
      var flow=Math.max(1, (MAT[t].flow*liqMob+0.4)|0);
      if(flow>4) flow=4;
      var hx=p*gy, hy=-p*gx;
      for(var n=1;n<=flow;n++){
        var fx=x+hx*n, fy=y+hy*n;
        if(fx<0||fy<0||fx>=W||fy>=H) break;
        var fi=I(fx,fy);
        if(type[fi]!==EMPTY && !canDisplace(i,fi)) break;
        if(n===1 && canDisplace(i,fi)){ swap(i,fi); return; }
      }
      hx=-p*gy; hy=p*gx;
      var fx2=x+hx, fy2=y+hy;
      if(fx2>=0&&fy2>=0&&fx2<W&&fy2<H && canDisplace(i,I(fx2,fy2))){ swap(i,I(fx2,fy2)); return; }
    } else if(k===4){
      var ux=-gx, uy=-gy;
      if(rnd()<0.15*gasDiff){ ux+=((ri(3)-1)); uy+=((ri(3)-1)); }
      if(x+ux>=0&&y+uy>=0&&x+ux<W&&y+uy<H && canDisplace(i,I(x+ux,y+uy))){ swap(i,I(x+ux,y+uy)); return; }
      var sx=-gx+p*gy, sy=-gy-p*gx;
      if(x+sx>=0&&y+sy>=0&&x+sx<W&&y+sy<H && canDisplace(i,I(x+sx,y+sy))){ swap(i,I(x+sx,y+sy)); return; }
      sx=-gx-p*gy; sy=-gy+p*gx;
      if(x+sx>=0&&y+sy>=0&&x+sx<W&&y+sy<H && canDisplace(i,I(x+sx,y+sy))){ swap(i,I(x+sx,y+sy)); return; }
      var hx=p*gy, hy=-p*gx;
      if(x+hx>=0&&y+hy>=0&&x+hx<W&&y+hy<H && canDisplace(i,I(x+hx,y+hy))){ swap(i,I(x+hx,y+hy)); return; }
    } else if(k===5){
      var ux=-gx, uy=-gy;
      if(rnd()<0.55){
        if(x+ux>=0&&y+uy>=0&&x+ux<W&&y+uy<H && (type[I(x+ux,y+uy)]===EMPTY||type[I(x+ux,y+uy)]===SMOKE))
          swap(i,I(x+ux,y+uy));
      } else {
        var sx=ri(3)-1, sy=ri(3)-1;
        if(x+sx>=0&&y+sy>=0&&x+sx<W&&y+sy<H && (type[I(x+sx,y+sy)]===EMPTY||MAT[type[I(x+sx,y+sy)]].k>=4))
          swap(i,I(x+sx,y+sy));
      }
    } else if(k===6){
      var best=-1, bd=99;
      for(var r=1;r<=3;r++){
        for(var s=0;s<8;s++){
          var sx=x+N8x[s]*r, sy=y+N8y[s]*r;
          if(sx<0||sy<0||sx>=W||sy>=H) continue;
          var si=I(sx,sy);
          if(conductive(type[si],si)){
            var stepx=x+(sx>x?1:sx<x?-1:0), stepy=y+(sy>y?1:sy<y?-1:0);
            if(stepx>=0&&stepy>=0&&stepx<W&&stepy<H){
              var ti=I(stepx,stepy);
              if(type[ti]===EMPTY || conductive(type[ti],ti) || MAT[type[ti]].k>=4){
                best=ti; bd=0; break;
              }
            }
          }
        }
        if(best>=0) break;
      }
      if(best>=0){
        if(type[best]===EMPTY || MAT[type[best]].k>=4) swap(i,best);
        else { aux[best]=Math.min(255,aux[best]+70); setCell(i,EMPTY,{}); }
      } else {
        var rx=x+ri(3)-1, ry=y+ri(3)-1;
        if(rx>=0&&ry>=0&&rx<W&&ry<H && type[I(rx,ry)]===EMPTY) swap(i,I(rx,ry));
      }
    }
  }

  function step(){
    tick++;
    if(tick>0x7fffff00) tick=1;
    reactions=0;
    evenScan=!evenScan;
    processedThis=0;
    heatPass();
    var y0,y1,ys,x0,x1,xs;
    if(gy>0){ y0=H-1; y1=-1; ys=-1; }
    else if(gy<0){ y0=0; y1=H; ys=1; }
    else if(gx>0){ y0=0; y1=H; ys=1; }
    else { y0=0; y1=H; ys=1; }

    for(var y=y0;y!==y1;y+=ys){
      var ltr = evenScan ^ (y&1);
      if(gx>0) ltr=false;
      if(gx<0) ltr=true;
      if(ltr){ x0=0; x1=W; xs=1; } else { x0=W-1; x1=-1; xs=-1; }
      for(var x=x0;x!==x1;x+=xs){
        var i=I(x,y);
        var t=type[i];
        if(!t && !active[i]) continue;
        if(stamp[i]===tick) continue;
        processedThis++;
        if(t){
          phases(i);
          t=type[i];
          if(!t){ if(active[i]) active[i]--; continue; }
          chem(x,y,i);
          t=type[i];
          if(!t){ if(active[i]) active[i]--; continue; }
          if(stamp[i]!==tick) moveCell(x,y,i);
        } else if(active[i]) active[i]--;
      }
    }
    lastRx=reactions;
    rxWindow+=reactions;
  }

  var cv=document.getElementById('cv');
  var ctx=cv.getContext('2d',{alpha:false});
  var buf=document.createElement('canvas');
  var bctx=buf.getContext('2d',{alpha:false});
  var img, pix;
  function resizeBuf(){
    buf.width=W; buf.height=H;
    img=bctx.createImageData(W,H);
    pix=new Uint32Array(img.data.buffer);
  }

  function lerpC(a,b,t){
    t=t<0?0:t>1?1:t;
    return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
  }
  function pack(r,g,b){
    r=r<0?0:r>255?255:r|0;
    g=g<0?0:g>255?255:g|0;
    b=b<0?0:b>255?255:b|0;
    return (255<<24)|(b<<16)|(g<<8)|r;
  }

  function tempColor(T){
    if(T<0) return lerpC([20,40,140],[40,90,200], clamp((-T)/40,0,1));
    if(T<20) return lerpC([40,50,70],[70,70,72], T/20);
    if(T<100) return lerpC([80,50,40],[200,50,30], (T-20)/80);
    if(T<400) return lerpC([200,50,30],[255,140,30], (T-100)/300);
    if(T<900) return lerpC([255,140,30],[255,230,80], (T-400)/500);
    return lerpC([255,230,80],[255,255,245], clamp((T-900)/700,0,1));
  }

  function render(){
    var mode=vis, fr=tick;
    for(var i=0;i<N;i++){
      var t=type[i], m=MAT[t], col, n=((i*1103515245+12345)>>8)&7;
      if(mode==='normal'){
        var c=m.c;
        if(t===EMPTY){ pix[i]=pack(8,7,9); continue; }
        var r=c[0]+n-3, g=c[1]+n-3, b=c[2]+n-3;
        if(t===FIRE){
          var f=0.5+0.5*Math.sin((i*0.17)+(fr*0.45));
          r=255; g=70+(life[i]*0.6)+f*90; b=18+f*30;
        } else if(t===LAVA){
          r=255; g=40+(temp[i]-800)*0.08+n*3; b=12;
        } else if(t===WATER){
          r=48; g=110+n; b=190+(aux[i]>>3);
          if(aux[i]>40){ r+=20; g+=20; }
        } else if(t===SPARK){
          r=160+n*8; g=220; b=255;
        } else if(t===STEAM||t===SMOKE){
          r=c[0]+n; g=c[1]+n; b=c[2]+n;
        } else if(t===METAL && aux[i]>8){
          r=c[0]; g=c[1]+aux[i]*0.3; b=c[2]+aux[i]*0.45;
        } else if(t===TNT && aux[i]>0 && (fr&4)){
          r=255; g=180; b=60;
        }
        if(t && temp[i]>400 && t!==FIRE && t!==LAVA && t!==MOLTEN){
          r=r*0.7+90; g=g*0.7+40; b=b*0.55;
        }
        pix[i]=pack(r,g,b);
      } else if(mode==='temp'){
        col=tempColor(temp[i]);
        pix[i]=pack(col[0],col[1],col[2]);
      } else if(mode==='vel'){
        var mag=Math.min(1, Math.hypot(vx[i],vy[i])/12);
        var ang=Math.atan2(vy[i],vx[i]);
        var hr=(ang/Math.PI+1)*0.5, sat=0.2+mag*0.8, val=0.12+mag*0.85;
        pix[i]=pack(hsv(hr,sat,val)[0],hsv(hr,sat,val)[1],hsv(hr,sat,val)[2]);
      } else if(mode==='dens'){
        var d=t?dens(i):0;
        var u=clamp(d/8,0,1);
        pix[i]=pack(20+u*40, 20+u*80, 24+u*200);
      } else if(mode==='charge'){
        var ch = t===SPARK?255:aux[i];
        var on=conductive(t,i)||t===SPARK;
        pix[i]=pack(10+ch*0.15, 8+ch*0.55, on? 20+ch*0.9 : 12);
      } else if(mode==='fuel'){
        var fu = (t===FIRE||t===WOOD||t===PLANT||t===OIL||t===GAS||t===TNT)? life[i] : (MAT[t].fu?MAT[t].fu:0);
        pix[i]=pack(20+fu*0.9, 12+fu*0.4, 10);
      } else if(mode==='rxn'){
        var act=aux[i];
        var hot=type[i]===FIRE||type[i]===LAVA||type[i]===SPARK||type[i]===ACID;
        pix[i]=pack(hot?180:18+act*0.6, 10+act*0.2, hot?40:18+act);
      } else {
        var processed=stamp[i]===tick || active[i]>0;
        var u=((evenScan?xOf(i):W-1-xOf(i))+yOf(i)*3)%W / W;
        var hv=hsv(u, processed?0.75:0.12, processed?0.9:0.18);
        pix[i]=pack(hv[0],hv[1],hv[2]);
      }
    }
    bctx.putImageData(img,0,0);
    var dpr=window.devicePixelRatio||1;
    var r=cv.getBoundingClientRect();
    var cw=Math.max(1,(r.width*dpr)|0), ch=Math.max(1,(r.height*dpr)|0);
    if(cv.width!==cw||cv.height!==ch){ cv.width=cw; cv.height=ch; }
    ctx.imageSmoothingEnabled=false;
    ctx.fillStyle='#050403';
    ctx.fillRect(0,0,cw,ch);
    var scale=Math.min(cw/W, ch/H);
    var dw=W*scale, dh=H*scale;
    var ox=(cw-dw)*0.5, oy=(ch-dh)*0.5;
    ctx.drawImage(buf,0,0,W,H,ox,oy,dw,dh);
    if(hoverX>=0){
      ctx.save();
      ctx.strokeStyle='rgba(224,200,136,.85)';
      ctx.lineWidth=Math.max(1,dpr);
      var br=brushR;
      ctx.strokeRect(ox+(hoverX-br+0.5)*scale, oy+(hoverY-br+0.5)*scale, (br*2)*scale, (br*2)*scale);
      ctx.restore();
    }
  }
  function xOf(i){ return i%W; }
  function yOf(i){ return (i/W)|0; }
  function hsv(h,s,v){
    var i=(h*6)|0, f=h*6-i, p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s);
    var r,g,b;
    switch(i%6){
      case 0: r=v;g=t;b=p;break; case 1: r=q;g=v;b=p;break;
      case 2: r=p;g=v;b=t;break; case 3: r=p;g=q;b=v;break;
      case 4: r=t;g=p;b=v;break; default: r=v;g=p;b=q;
    }
    return [r*255,g*255,b*255];
  }

  var viewMap={ox:0,oy:0,s:1};
  function clientToCell(e){
    var r=cv.getBoundingClientRect();
    var dpr=window.devicePixelRatio||1;
    var cw=cv.width, ch=cv.height;
    var scale=Math.min(cw/W, ch/H);
    var ox=(cw-W*scale)*0.5, oy=(ch-H*scale)*0.5;
    viewMap={ox:ox,oy:oy,s:scale};
    var px=(e.clientX-r.left)*dpr, py=(e.clientY-r.top)*dpr;
    return [(px-ox)/scale, (py-oy)/scale];
  }

  function inBrush(dx,dy){
    var r=brushR;
    if(brushShape==='square') return Math.abs(dx)<=r && Math.abs(dy)<=r;
    if(brushShape==='diamond') return Math.abs(dx)+Math.abs(dy)<=r;
    return dx*dx+dy*dy<=r*r;
  }

  function applyTool(x,y,ptr){
    x=x|0; y=y|0;
    if(x<0||y<0||x>=W||y>=H) return;
    var i=I(x,y);
    if(tool==='paint'){
      var t=mat;
      var opt={};
      if(!tempAuto) opt.temp=brushTemp;
      if(brushVel){ opt.vx=gx?brushVel*gx:0; opt.vy=gy?brushVel*gy:0; }
      setCell(i,t,opt);
    } else if(tool==='erase'){
      setCell(i,EMPTY,{});
    } else if(tool==='wall'){
      setCell(i,WALL,{});
    } else if(tool==='heat'){
      temp[i]=clamp(temp[i]+32+fireInt*10, -90, 2500);
      active[i]=8; wake(x,y);
    } else if(tool==='cool'){
      temp[i]=clamp(temp[i]-32, -90, 2500);
      active[i]=8; wake(x,y);
    } else if(tool==='wind'){
      var dx=ptr&&ptr.dx||0, dy=ptr&&ptr.dy||0;
      var m=Math.hypot(dx,dy)||1;
      vx[i]=clamp(vx[i]+(dx/m)*8,-127,127);
      vy[i]=clamp(vy[i]+(dy/m)*8,-127,127);
      wake(x,y);
    } else if(tool==='dropper'){
      if(type[i]) selectMat(type[i]);
    }
  }

  function stampAt(cx,cy,ptr){
    if(tool==='fill'){ fillEnclosed(cx|0,cy|0); return; }
    if(tool==='dropper'){ applyTool(cx,cy); tool='paint'; syncTools(); return; }
    if(tool==='bomb'){
      if(boomArmed){ explode(cx|0,cy|0, Math.round(5*explStr), explStr); boomArmed=false; }
      return;
    }
    var r=brushR;
    for(var dy=-r; dy<=r; dy++){
      for(var dx=-r; dx<=r; dx++){
        if(!inBrush(dx,dy)) continue;
        if(rnd()>amount) continue;
        var px=cx+dx, py=cy+dy;
        if(spray>0){ px+=(rnd()-0.5)*2*spray*r; py+=(rnd()-0.5)*2*spray*r; }
        applyTool(px,py,ptr);
      }
    }
  }

  function stroke(x0,y0,x1,y1,ptr){
    if(tool==='fill'||tool==='dropper'||tool==='bomb') return;
    var dx=x1-x0, dy=y1-y0;
    var n=Math.max(1, Math.ceil(Math.hypot(dx,dy)*2));
    for(var k=0;k<=n;k++) stampAt(x0+dx*k/n, y0+dy*k/n, ptr);
  }

  function fillEnclosed(sx,sy){
    if(sx<0||sy<0||sx>=W||sy>=H) return;
    if(type[I(sx,sy)]!==EMPTY) return;
    var stack=[sx,sy], seen=new Uint8Array(N), cells=[], enclosed=true;
    seen[I(sx,sy)]=1;
    while(stack.length){
      var y=stack.pop(), x=stack.pop();
      var i=I(x,y);
      if(type[i]!==EMPTY) continue;
      if(x===0||y===0||x===W-1||y===H-1){ enclosed=false; break; }
      cells.push(i);
      if(cells.length>N){ enclosed=false; break; }
      var nbs=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
      for(var k=0;k<4;k++){
        var nx=nbs[k][0], ny=nbs[k][1];
        if(nx<0||ny<0||nx>=W||ny>=H) continue;
        var j=I(nx,ny);
        if(!seen[j] && type[j]===EMPTY){ seen[j]=1; stack.push(nx,ny); }
      }
    }
    if(!enclosed) return;
    var opt={};
    if(!tempAuto) opt.temp=brushTemp;
    for(var c=0;c<cells.length;c++) setCell(cells[c], mat, opt);
  }

  cv.addEventListener('pointerdown', function(e){
    cv.setPointerCapture(e.pointerId);
    painting=true; boomArmed=true;
    var c=clientToCell(e);
    lastCX=c[0]; lastCY=c[1]; lastPX=e.clientX; lastPY=e.clientY;
    stampAt(c[0],c[1],{dx:0,dy:1});
    if(tool==='dropper'||tool==='fill'||tool==='bomb') painting=false;
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function(e){
    var c=clientToCell(e);
    hoverX=c[0]|0; hoverY=c[1]|0;
    inspect(hoverX,hoverY);
    if(!painting) return;
    var ptr={dx:e.clientX-lastPX, dy:e.clientY-lastPY};
    stroke(lastCX,lastCY,c[0],c[1],ptr);
    lastCX=c[0]; lastCY=c[1]; lastPX=e.clientX; lastPY=e.clientY;
    boomArmed=true;
    e.preventDefault();
  });
  function endPtr(e){ painting=false; boomArmed=true; if(e) e.preventDefault(); }

  window.addEventListener('keydown', function(e){
    if(e.target && (e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='TEXTAREA')) return;
    var k=e.key;
    if(k===' ' ){ e.preventDefault(); setPaused(!paused); }
    else if(k==='n'||k==='N'){ for(var i=0;i<substeps;i++) step(); }
    else if(k==='['){ brushR=Math.max(1,brushR-1); document.getElementById('brushR').value=brushR; document.getElementById('oRadius').textContent=brushR; }
    else if(k===']'){ brushR=Math.min(32,brushR+1); document.getElementById('brushR').value=brushR; document.getElementById('oRadius').textContent=brushR; }
    else if(k==='e'||k==='E'){ tool='erase'; syncTools(); }
    else if(k==='i'||k==='I'){ tool='dropper'; syncTools(); }
    else if(k==='h'||k==='H'){ tool='heat'; syncTools(); }
    else if(k==='c'||k==='C'){ tool='cool'; syncTools(); }
    else if(k==='w'||k==='W'){ tool='wind'; syncTools(); }
    else if(k==='b'||k==='B'){ tool='bomb'; syncTools(); }
    else if(k==='f'||k==='F'){ tool='fill'; syncTools(); }
    else if(k==='p'||k==='P'){ tool='paint'; syncTools(); }
    else if(k==='s' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); exportJSON(); }
    else if(k>='1'&&k<='9'){ var id=+k; if(id<MAT.length) selectMat(id); }
  });

  function seeded(s){
    var x=s|0 || 1;
    return function(){
      x = Math.imul(x ^ x >>> 15, 1 | x);
      x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x;
      return ((x ^ x >>> 14) >>> 0) / 4294967296;
    };
  }

  function put(x,y,t,opt){
    x=x|0; y=y|0;
    if(x<0||y<0||x>=W||y>=H) return;
    setCell(I(x,y), t, opt||{});
  }
  function disk(cx,cy,r,t,p,rng,opt){
    var r2=r*r;
    for(var y=cy-r;y<=cy+r;y++) for(var x=cx-r;x<=cx+r;x++)
      if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=r2 && (!p || rng()<p)) put(x,y,t,opt);
  }
  function rect(x0,y0,x1,y1,t,p,rng,opt){
    if(x0>x1){ var a=x0;x0=x1;x1=a; } if(y0>y1){ var b=y0;y0=y1;y1=b; }
    for(var y=y0;y<=y1;y++) for(var x=x0;x<=x1;x++) if(!p||rng()<p) put(x,y,t,opt);
  }
  function line(x0,y0,x1,y1,t,th,rng,opt){
    var n=Math.max(1, Math.hypot(x1-x0,y1-y0)|0);
    for(var i=0;i<=n;i++) disk(x0+(x1-x0)*i/n, y0+(y1-y0)*i/n, th, t, 1, rng, opt);
  }

  function clearWorld(){
    for(var i=0;i<N;i++){ type[i]=EMPTY; temp[i]=amb; life[i]=0; aux[i]=0; vx[i]=0; vy[i]=0; stamp[i]=0; active[i]=0; }
  }

  function borderWalls(){
    for(var x=0;x<W;x++){ put(x,0,WALL); put(x,H-1,WALL); }
    for(var y=0;y<H;y++){ put(0,y,WALL); put(W-1,y,WALL); }
  }

  function loadPreset(name, sd){
    currentPreset=name;
    document.getElementById('preset').value=name;
    seed=sd|0 || 46;
    document.getElementById('seed').value=seed;
    R = (seed ^ 0x9E3779B9) >>> 0;
    var rng=seeded(seed);
    clearWorld();
    borderWalls();
    var w=W, h=H;
    if(name==='volcano'){
      var beach=(w*0.52)|0;
      for(var x=1;x<w-1;x++){
        var ground=h-6-(Math.sin(x*0.07)*2)|0;
        for(var y=ground;y<h-1;y++) put(x,y, x<beach?SAND:STONE);
        if(x>beach) for(var y2=ground-Math.max(10,(h*0.22)|0);y2<ground;y2++) if(y2>1) put(x,y2,WATER,{temp:18});
      }
      var vx0=(w*0.30)|0;
      for(var y=8;y<h-6;y++){
        var spread=3+((y/h)*w*0.20)|0;
        for(var x=vx0-spread;x<=vx0+spread;x++){
          if(x<1||x>=w-1) continue;
          var edge=Math.abs(x-vx0)/(spread+0.01);
          if(edge>0.78) put(x,y,STONE);
          else if(y>h*0.28 && edge<0.55) put(x,y,LAVA,{temp:1320});
          else if(y>h*0.18) put(x,y,STONE);
        }
      }
      disk(vx0, (h*0.24)|0, Math.max(4,(w*0.03)|0), LAVA, 1, rng, {temp:1400});
      var slopeX0=vx0+((w*0.06)|0);
      for(var y=(h*0.26)|0; y<(h*0.72)|0; y++){
        var ox=slopeX0 + (((y-h*0.26)/(h*0.5))*w*0.16)|0;
        put(ox, y, EMPTY, {});
        put(ox+1, y, EMPTY, {});
        put(ox-1, y, LAVA, {temp:1310});
        put(ox+2, y, LAVA, {temp:1280});
      }
      var gy=(h-7)|0;
      for(var i=0;i<22;i++) put((beach-18+rng()*16)|0, gy-1, PLANT);
      for(i=0;i<10;i++) put((beach-28+rng()*12)|0, gy-1, WOOD);
    } else if(name==='building'){
      rect(8,h-6,w-8,h-2,STONE,1,rng);
      for(var floor=0;floor<4;floor++){
        var y=h-8-floor*Math.floor((h-16)/4);
        rect(18,y,w-18,y+1,WOOD,1,rng);
        if(floor<3){
          rect(18,y-Math.floor((h-16)/4)+2, 20, y, WOOD,1,rng);
          rect(w-21,y-Math.floor((h-16)/4)+2, w-19, y, WOOD,1,rng);
          rect( (w/2)|0, y-Math.floor((h-16)/4)+2, (w/2+1)|0, y, WOOD,1,rng);
        }
        for(var k=0;k<8;k++) disk(24+rng()*(w-48), y-2-rng()*6, 2, OIL, 1, rng);
        for(k=0;k<10;k++) put((22+rng()*(w-44))|0, y-1, PLANT);
      }
      disk((w*0.3)|0, h-20, 4, FIRE,1,rng,{temp:1000,life:80});
      disk((w*0.7)|0, h-36, 3, FIRE,1,rng,{temp:1000,life:70});
      rect(20,h-10,28,h-7,TNT,1,rng);
    } else if(name==='electrical'){
      rect(6,h-5,w-6,h-2,STONE,1,rng);
      for(var y=12;y<h-12;y+=10) line(12,y,w-12,y,METAL,1,rng);
      for(var x=16;x<w-16;x+=14) line(x,10,x,h-12,METAL,1,rng);
      disk(14,12,3,SPARK,1,rng,{life:20});
      disk(w-16,12,3,SPARK,1,rng,{life:20});
      rect(40,h-16,70,h-8,WATER,1,rng);
      for(var i=40;i<70;i++) aux[I(i,h-10)]=120;
      rect(w-80,h-18,w-50,h-8,TNT,1,rng);
      rect(90,20,110,40,WOOD,1,rng);
    } else if(name==='acid'){
      rect(6,h-4,w-6,h-2,STONE,1,rng);
      rect(20,h-40,70,h-8,STONE,1,rng);
      rect(24,h-36,66,h-10,ACID,1,rng,{temp:22});
      rect(90,h-36,140,h-8,STONE,1,rng);
      rect(94,h-32,136,h-10,WATER,1,rng);
      line(70,h-38,90,h-38,METAL,1,rng);
      line(70,h-30,90,h-30,METAL,1,rng);
      rect(160,h-28,w-20,h-8,METAL,1,rng);
      for(var y=10;y<h-40;y++) if(rng()<0.15) put((30+rng()*40)|0,y,ACID);
      disk(50,16,4,SALT,1,rng);
    } else if(name==='steam'){
      rect(20,h-50,90,h-12,METAL,1,rng);
      rect(24,h-46,86,h-16,WATER,1,rng);
      rect(22,h-12,88,h-6,STONE,1,rng);
      rect(30,h-6,80,h-3,FIRE,1,rng,{temp:1100,life:200});
      rect(40,h-3,70,h-2,WOOD,1,rng);
      line(90,h-48,140,h-48,METAL,1,rng);
      line(140,h-48,140,20,METAL,1,rng);
      rect(130,8,170,22,METAL,1,rng);
      rect(148,h-20,w-16,h-6,WATER,1,rng);
      disk(60,h-8,5,LAVA,1,rng,{temp:1250});
    } else if(name==='lake'){
      for(var x=1;x<w-1;x++){
        var iceY=(h*0.42 + Math.sin(x*0.12)*2)|0;
        for(var y=iceY;y<h-1;y++) put(x,y, y<iceY+3?ICE:WATER, {temp: y<iceY+3?-6:1});
        if(x<w*0.25||x>w*0.78) for(var y2=iceY-6;y2<iceY;y2++) if(rng()<0.4) put(x,y2,SAND);
      }
      rect(1,h-6,w-2,h-2,STONE,1,rng);
      disk((w*0.2)|0,(h*0.35)|0,6,PLANT,1,rng);
      disk((w*0.8)|0,(h*0.34)|0,5,WOOD,1,rng);
      disk((w*0.5)|0, 8, 3, FIRE,1,rng,{temp:900,life:40});
    } else if(name==='plants'){
      rect(1,h-7,w-2,h-2,SAND,1,rng);
      for(var x=1;x<w-1;x++){
        for(var y=h-18;y<h-7;y++) put(x,y, WATER);
        if(rng()<0.35) put(x,h-8,PLANT);
        if(rng()<0.08) disk(x,(h*0.55+rng()*h*0.2)|0,1,PLANT,1,rng);
      }
      for(var i=0;i<40;i++) disk((2+rng()*(w-4))|0,(h*0.7)|0,2,PLANT,1,rng);
      for(i=0;i<8;i++) disk((10+rng()*(w-20))|0, (h*0.3)|0, 3, WATER, 0.7, rng);
    } else if(name==='fireworks'){
      rect(1,h-4,w-2,h-2,STONE,1,rng);
      rect(18,h-10,w-18,h-6,TNT,1,rng);
      for(var x=22;x<w-22;x+=18){
        disk(x, h-16, 3, OIL,1,rng);
        disk(x, h-26, 5, GAS,1,rng);
      }
      for(var y=h-10;y<h-6;y++) for(var x=18;x<28;x++) if(IN(x,y)) aux[I(x,y)]=2+ri(3);
      disk(22, h-11, 4, FIRE,1,rng,{temp:1200,life:100});
    } else if(name==='stress'){
      var pool=[SAND,WATER,OIL,SALT,WOOD,PLANT,FIRE,ICE,LAVA,STONE,METAL,MOLTEN,ACID,GAS,TNT,ASH,SMOKE,STEAM];
      for(var i=0;i<N;i++){
        if(type[i]===WALL) continue;
        if(rng()<0.72){
          var t=pool[(rng()*pool.length)|0];
          setCell(i,t,{});
          if(t===WATER && rng()<0.2) aux[i]=80;
          if(t===METAL && rng()<0.15) aux[i]=200;
        }
      }
    }
    wakeAll();
  }

  function setRes(nw,nh){
    alloc(nw,nh);
    resizeBuf();
    layoutCanvas();
  }

  function layoutCanvas(){
    var r=cv.getBoundingClientRect();
    var dpr=window.devicePixelRatio||1;
    cv.width=Math.max(1,(r.width*dpr)|0);
    cv.height=Math.max(1,(r.height*dpr)|0);
  }
  window.addEventListener('resize', layoutCanvas);

  function b64enc(u8){
    var s='', CH=0x8000;
    for(var i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null, u8.subarray(i,i+CH));
    return btoa(s);
  }
  function b64dec(str){
    var bin=atob(str), u=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return u;
  }

  function exportState(){
    var extras=[];
    for(var i=0;i<N;i++){
      if(!type[i] && Math.abs(temp[i]-amb)<1 && !aux[i] && !vx[i] && !vy[i]) continue;
      extras.push(i&255,(i>>8)&255,(i>>16)&255, type[i],
        (temp[i]+400)|0 &255, ((temp[i]+400)|0)>>8,
        life[i], aux[i], vx[i]&255, vy[i]&255);
    }
    return {
      v:1, w:W, h:H, preset:currentPreset, seed:seed,
      cfg:{speed:speed,substeps:substeps,amb:amb,heatRate:heatRate,reactRate:reactRate,liqMob:liqMob,gasDiff:gasDiff,fireInt:fireInt,explStr:explStr,gx:gx,gy:gy,paused:paused},
      cells:b64enc(new Uint8Array(extras))
    };
  }
  function exportJSON(){
    var blob=new Blob([JSON.stringify(exportState())], {type:'application/json'});
    var a=document.createElement('a');
    a.download='athanor-save.json';
    a.href=URL.createObjectURL(blob);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  }
  function importJSON(str){
    var o=JSON.parse(str);
    if(!o||!o.w) throw new Error('bad save');
    document.getElementById('res').value=o.w+'x'+o.h;
    if(![].some.call(document.getElementById('res').options, function(op){ return op.value===document.getElementById('res').value; })){
      var opt=document.createElement('option'); opt.value=o.w+'x'+o.h; opt.textContent=o.w+'×'+o.h; document.getElementById('res').appendChild(opt);
    }
    alloc(o.w,o.h); resizeBuf(); layoutCanvas();
    if(o.cfg){
      speed=o.cfg.speed||1; substeps=o.cfg.substeps||1; amb=o.cfg.amb||20;
      heatRate=o.cfg.heatRate||1; reactRate=o.cfg.reactRate||1; liqMob=o.cfg.liqMob||1;
      gasDiff=o.cfg.gasDiff||1; fireInt=o.cfg.fireInt||1; explStr=o.cfg.explStr||1;
      gx=o.cfg.gx||0; gy=o.cfg.gy==null?1:o.cfg.gy;
      document.getElementById('speed').value=(speed*100)|0;
      document.getElementById('oSpeed').textContent=speed.toFixed(2);
      document.getElementById('gravity').value= gy>0?'down':gy<0?'up':gx<0?'left':'right';
    }
    var u=b64dec(o.cells||'');
    for(var p=0;p+9<u.length;p+=10){
      var i=u[p]| (u[p+1]<<8) | (u[p+2]<<16);
      if(i<0||i>=N) continue;
      type[i]=u[p+3];
      temp[i]=(u[p+4]|(u[p+5]<<8))-400;
      life[i]=u[p+6]; aux[i]=u[p+7];
      vx[i]=u[p+8]<<24>>24; vy[i]=u[p+9]<<24>>24;
      active[i]=6;
    }
    currentPreset=o.preset||currentPreset;
    seed=o.seed||seed;
    wakeAll();
  }

  function autosave(){
    try{ localStorage.setItem('athanor-autosave', JSON.stringify(exportState())); autosaveAt=performance.now(); }catch(e){}
  }

  function tally(){
    counts.fill(0); activeCount=0; var sum=0, n=0;
    for(var i=0;i<N;i++){
      counts[type[i]]++;
      if(type[i]){ activeCount++; sum+=temp[i]; n++; }
    }
    avgTemp=n?sum/n:amb;
  }

  function hud(){
    var parts=[];
    for(var i=1;i<MAT.length;i++) if(counts[i]>0) parts.push(MAT[i].n.toLowerCase()+' '+counts[i]);
    parts.sort(function(a,b){ return parseInt(b.replace(/\D/g,''),10)-parseInt(a.replace(/\D/g,''),10); });
    document.getElementById('hud').innerHTML=
      '<b>FPS</b> '+fpsE.toFixed(0)+
      '  <b>Grid</b> '+W+'×'+H+
      '  <b>Active</b> '+activeCount+
      '<br><b>Avg T</b> '+avgTemp.toFixed(1)+'°C  <b>Rxn/s</b> '+Math.round(rxPerSec)+
      '  <b>Speed</b> '+speed.toFixed(2)+
      '  <b>'+(paused?'PAUSED':'LIVE')+'</b>'+
      '<br><b>Tool</b> '+tool+'  <b>Mat</b> '+MAT[mat].n+
      '<br>'+parts.slice(0,8).join(' · ');
  }

  var acc=0, lastT=performance.now(), hudN=0;
  function frame(t){
    var dt=Math.min(0.08,(t-lastT)/1000); lastT=t;
    fps=dt>0?1/dt:60; fpsE=fpsE*0.9+fps*0.1;
    rxClock+=dt;
    if(rxClock>=0.5){ rxPerSec=rxWindow/rxClock; rxWindow=0; rxClock=0; }
    if(!paused){
      acc+=dt*speed*60;
      var guard=0;
      while(acc>=1 && guard<6){
        for(var s=0;s<substeps;s++) step();
        acc-=1; guard++;
      }
      if(acc>6) acc=0;
    }
    render();
    hudN++;
    if(hudN%12===0){ tally(); hud(); }
    if(t-autosaveAt>10000) autosave();
    requestAnimationFrame(frame);
  }

  function setResAndBoot(){
    var p=document.getElementById('res').value.split('x');
    alloc(+p[0],+p[1]);
    resizeBuf();
    layoutCanvas();
  }

  window.Athanor = {
    cellAt: function(x,y){ if(!IN(x,y)) return null; var i=I(x,y); return {x:x,y:y,type:type[i],name:MAT[type[i]].n,temp:temp[i],life:life[i],aux:aux[i],vx:vx[i],vy:vy[i]}; },
    counts: function(){ tally(); var o={}; for(var i=0;i<MAT.length;i++) if(counts[i]) o[MAT[i].n]=counts[i]; return o; },
    step: step,
    explode: explode,
    loadPreset: loadPreset,
    exportState: exportState,
    importJSON: importJSON,
    paintAt: function(x,y,t){ put(x,y,t); },
    get paused(){ return paused; },
    setPaused: setPaused,
    get size(){ return {w:W,h:H}; },
    get rxPerSec(){ return rxPerSec; },
    get lastRx(){ return lastRx; },
    MAT: MAT, ids:{EMPTY:EMPTY,WALL:WALL,SAND:SAND,WATER:WATER,OIL:OIL,SALT:SALT,WOOD:WOOD,PLANT:PLANT,FIRE:FIRE,SMOKE:SMOKE,STEAM:STEAM,ICE:ICE,LAVA:LAVA,STONE:STONE,METAL:METAL,MOLTEN:MOLTEN,ACID:ACID,GAS:GAS,SPARK:SPARK,TNT:TNT,ASH:ASH}
  };

  buildUI();
  setResAndBoot();
  loadPreset('volcano', 46);
  tally(); hud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
