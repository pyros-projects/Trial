<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cinderline — Factory Automation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23e07a2f' width='32' height='32' rx='6'/%3E%3Crect fill='%23f0c14a' x='14' y='6' width='4' height='16'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#100e0c;--bg2:#181410;--panel:#221c16;--panel2:#2a221a;--line:#3d3126;
  --ink:#f3eadc;--muted:#9a8b76;--ember:#e07a2f;--ember2:#ffb060;--teal:#4ecdc4;
  --gold:#f0c14a;--rose:#e85d4c;--leaf:#8fce6a;--steel:#8a96a3;--shadow:#00000088;
  --ok:#8fce6a;--warn:#f0c14a;--bad:#e85d4c;
  font-family:"Segoe UI","Helvetica Neue",ui-sans-serif,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;height:100%;grid-template-rows:auto 1fr auto;grid-template-columns:auto 1fr auto}
#top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:6px 10px;background:linear-gradient(180deg,#2a2118,#1a1612);border-bottom:1px solid var(--line);min-height:44px;flex-wrap:wrap}
#brand{display:flex;align-items:center;gap:8px;font-weight:750;letter-spacing:.08em;font-size:14px}
#brand .mark{width:22px;height:22px;border-radius:4px;background:conic-gradient(from 210deg,var(--ember),var(--gold),var(--ember));box-shadow:0 0 10px #e07a2f66}
#top .sep{width:1px;height:22px;background:var(--line)}
#top label{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
#top select,#top input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:#0003;border:1px solid var(--line)}
.chip.ok{border-color:#3d6a38;color:var(--leaf)}
.chip.warn{border-color:#7a5a18;color:var(--gold)}
.chip.bad{border-color:#7a2a22;color:var(--rose)}
#tools{width:72px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:6px;overflow:auto}
#tools button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
#tools button .ic{width:22px;height:22px}
#tools button small{font-size:9px;color:var(--muted);letter-spacing:.02em}
#tools button.active{border-color:var(--ember);background:#3a2616;box-shadow:inset 0 0 0 1px #e07a2f55}
#stagewrap{position:relative;min-width:0;min-height:0;background:
  radial-gradient(1200px 500px at 20% 0%,#2a1c12 0%,transparent 50%),
  repeating-linear-gradient(0deg,#14110e 0 31px,#16120f 31px 32px),
  repeating-linear-gradient(90deg,#14110e 0 31px,#16120f 31px 32px)}
#world{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;font-variant-numeric:tabular-nums}
#hud .h{pointer-events:auto;background:#120e0ccc;backdrop-filter:blur(6px);border:1px solid #3d3126aa;border-radius:8px;padding:4px 8px;font-size:11px;color:#efe4d2}
#hud b{color:var(--ember2)}
#tip{position:absolute;pointer-events:none;z-index:5;background:#1a1410f2;border:1px solid var(--ember);color:var(--ink);font-size:11px;padding:6px 8px;border-radius:6px;max-width:240px;display:none;box-shadow:0 8px 24px var(--shadow)}
#inspect{width:280px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;max-height:100%;overflow:hidden}
#inspect .pad{padding:8px 10px;overflow:auto;flex:1;min-height:0}
#inspect h2{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#inspect .kv{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:12px;margin-bottom:8px}
#inspect .kv span{color:var(--muted)}
#ov{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
#ov label{font-size:10px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 7px;display:flex;align-items:center;gap:4px}
#charts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.spark{background:#140f0c;border:1px solid var(--line);border-radius:6px;padding:4px}
.spark canvas{width:100%;height:36px;display:block}
.spark small{color:var(--muted);font-size:10px}
#bottom{grid-column:1/-1;background:linear-gradient(0deg,#1c1712,#16120e);border-top:1px solid var(--line);padding:6px 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:4;position:relative}
#bottom .group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#bottom button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px}
#bottom button.primary{background:#5a3014;border-color:var(--ember);color:var(--ember2)}
#bottom button:disabled{opacity:.45;cursor:default}
#bottom input[type=range]{width:90px}
#modals{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0008;z-index:20}
#modals.show{display:flex}
.modal{background:#221c16;border:1px solid var(--ember);border-radius:12px;padding:18px;max-width:520px;width:calc(100% - 24px);box-shadow:0 20px 60px #000a}
.modal h3{margin:0 0 8px}
.modal p{color:var(--muted);font-size:13px;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#2a1c12;border:1px solid var(--ember);padding:8px 14px;border-radius:8px;z-index:30;display:none;font-size:13px}
#io{display:none}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto}
  #tools{grid-row:2;width:auto;flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}
  #tools button{min-width:58px}
  #inspect{width:auto;border-left:0;border-top:1px solid var(--line);max-height:28vh}
  #stagewrap{min-height:42vh}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="brand"><span class="mark" aria-hidden="true"></span>CINDERLINE</div>
    <div class="sep"></div>
    <label>Mode <select id="modeSel" aria-label="Game mode"><option value="sandbox">Sandbox</option><option value="campaign">Campaign</option></select></label>
    <label>Preset <select id="presetSel" aria-label="Factory preset">
      <option value="starter">Starter line</option>
      <option value="balanced">Balanced factory</option>
      <option value="congested">Congested belts</option>
      <option value="powercrisis">Power crisis</option>
      <option value="bus">Multi-product bus</option>
      <option value="stress">High-throughput stress</option>
      <option value="blank">Blank yard</option>
    </select></label>
    <label>Mission <select id="missionSel" aria-label="Campaign mission"></select></label>
    <span id="contractChip" class="chip" aria-live="polite">Sandbox</span>
    <span id="scoreChip" class="chip">Score 0</span>
    <span id="budgetChip" class="chip">Budget —</span>
    <div style="flex:1"></div>
    <button id="btnHelp" aria-label="Open help">Help</button>
    <button id="btnExportPng" aria-label="Export factory PNG">PNG</button>
    <button id="btnShare" aria-label="Copy share code">Share</button>
    <button id="btnImportTxt" aria-label="Import share code">Import</button>
    <button id="btnSave" aria-label="Save factory JSON">Save</button>
    <button id="btnLoad" aria-label="Load factory JSON">Load</button>
    <input id="io" type="file" accept="application/json,.json,text/plain">
  </header>
  <nav id="tools" aria-label="Construction tools"></nav>
  <div id="stagewrap">
    <canvas id="world" aria-label="Factory yard"></canvas>
    <div id="hud" aria-live="polite"></div>
    <div id="tip"></div>
  </div>
  <aside id="inspect" aria-label="Inspector">
    <div class="pad">
      <h2>Inspector</h2>
      <div id="inspBody" class="kv"><span>Nothing selected</span><b>—</b></div>
      <div id="inspCfg"></div>
      <h2>Overlays</h2>
      <div id="ov">
        <label><input type="checkbox" id="ovFlow" aria-label="Item flow overlay"> Flow</label>
        <label><input type="checkbox" id="ovGraph" aria-label="Connection graph overlay"> Graph</label>
        <label><input type="checkbox" id="ovPower" aria-label="Power network overlay"> Power</label>
        <label><input type="checkbox" id="ovUtil" aria-label="Utilization heatmap overlay"> Util</label>
        <label><input type="checkbox" id="ovCong" aria-label="Congestion overlay"> Congest</label>
        <label><input type="checkbox" id="ovBlock" aria-label="Blocked outputs overlay"> Blocked</label>
        <label><input type="checkbox" id="ovStatus" aria-label="Structure status overlay" checked> Status</label>
      </div>
      <h2>Analytics</h2>
      <div id="charts"></div>
      <h2>Slots</h2>
      <div class="row">
        <select id="slotSel" aria-label="Autosave slot"><option>1</option><option>2</option><option>3</option><option>4</option></select>
        <button id="btnSlotSave" aria-label="Save named slot">Save slot</button>
        <button id="btnSlotLoad" aria-label="Load named slot">Load slot</button>
      </div>
      <p id="ratesBox" style="font-size:11px;color:var(--muted);white-space:pre-wrap;margin:8px 0 0"></p>
    </div>
  </aside>
  <footer id="bottom">
    <div class="group">
      <button id="btnPause" class="primary" aria-label="Pause or resume simulation">Pause</button>
      <button id="btnStep" aria-label="Single-step simulation">Step</button>
      <button id="btnReset" aria-label="Reset factory">Reset</button>
      <button id="btnUndo" aria-label="Undo">Undo</button>
      <button id="btnRedo" aria-label="Redo">Redo</button>
    </div>
    <div class="group">
      <label>Speed <input id="speedRange" type="range" min="0.25" max="4" step="0.25" value="1" aria-label="Simulation speed"><span id="speedLbl">1.00×</span></label>
      <label>Belt <input id="beltRange" type="range" min="0.4" max="2.5" step="0.1" value="1" aria-label="Belt speed"></label>
      <label>Machines <input id="machRange" type="range" min="0.4" max="2.5" step="0.1" value="1" aria-label="Machine speed"></label>
      <label>Density <select id="densSel" aria-label="Item density"><option value="items">Items</option><option value="packets">Packets</option></select></label>
      <label>Cost <select id="costSel" aria-label="Construction cost mode"><option value="free">Free</option><option value="budget">Budget</option></select></label>
      <label>Power <select id="pwrDiff" aria-label="Power difficulty"><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></label>
      <label>Seed <input id="seedInp" type="number" value="1337" aria-label="Deterministic seed" style="width:78px"></label>
      <label>Grid <select id="gridSel" aria-label="Grid size"><option value="24x16">24×16</option><option value="32x20" selected>32×20</option><option value="40x24">40×24</option><option value="48x28">48×28</option></select></label>
    </div>
  </footer>
</div>
<div id="modals" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status"></div>
<script>
(function(){
"use strict";

const DIRS=[{x:1,y:0,n:"E"},{x:0,y:1,n:"S"},{x:-1,y:0,n:"W"},{x:0,y:-1,n:"N"}];
const OPP=[2,3,0,1];
const TILE=40;
const ITEMS={
  ore:{id:"ore",name:"Ore",col:"#c4652a",ch:"O"},
  coal:{id:"coal",name:"Coal",col:"#4a4540",ch:"C"},
  plate:{id:"plate",name:"Plate",col:"#c5cdd4",ch:"P"},
  wire:{id:"wire",name:"Wire",col:"#d4954a",ch:"W"},
  gear:{id:"gear",name:"Gear",col:"#d4b46a",ch:"G"},
  circuit:{id:"circuit",name:"Circuit",col:"#3dba6e",ch:"R"},
  widget:{id:"widget",name:"Widget",col:"#4ecdc4",ch:"Q"}
};
const RECIPES={
  plate:{id:"plate",name:"Smelt Plate",machine:"smelter",time:1.6,in:{ore:1},out:{plate:1},power:22},
  wire:{id:"wire",name:"Draw Wire",machine:"assembler",time:1.2,in:{plate:1},out:{wire:2},power:26},
  gear:{id:"gear",name:"Cut Gear",machine:"assembler",time:2.0,in:{plate:2},out:{gear:1},power:30},
  circuit:{id:"circuit",name:"Print Circuit",machine:"assembler",time:2.4,in:{plate:1,wire:2},out:{circuit:1},power:42},
  widget:{id:"widget",name:"Assemble Widget",machine:"assembler",time:3.0,in:{gear:1,circuit:1},out:{widget:1},power:52}
};
const BDEFS={
  select:{tool:1,name:"Select",cost:0,power:0},
  pan:{tool:1,name:"Pan",cost:0,power:0},
  copy:{tool:1,name:"Copy",cost:0,power:0},
  move:{tool:1,name:"Move",cost:0,power:0},
  delete:{tool:1,name:"Delete",cost:0,power:0},
  belt:{name:"Belt",cost:1,power:0,cap:3,build:"drag"},
  splitter:{name:"Splitter",cost:6,power:0,cap:2},
  merger:{name:"Merger",cost:6,power:0,cap:2},
  inserter:{name:"Inserter",cost:4,power:5},
  extractor:{name:"Extractor",cost:12,power:14,needDep:1},
  chest:{name:"Chest",cost:8,power:0,store:24},
  smelter:{name:"Smelter",cost:18,power:8,machine:1,recipes:["plate"]},
  assembler:{name:"Assembler",cost:24,power:10,machine:1,recipes:["wire","gear","circuit","widget"]},
  generator:{name:"Generator",cost:30,power:0,gen:150},
  pole:{name:"Pole",cost:2,power:0,range:5},
  sink:{name:"Sink",cost:10,power:0}
};
const MISSIONS=[
  {id:"m1",name:"First Plate",goal:{plate:20},budget:220,desc:"Extract ore, smelt plates, and deliver 20 plates. Keep the generator fed."},
  {id:"m2",name:"Gear Run",goal:{gear:12},budget:300,desc:"Turn plates into gears. Two plates make one gear."},
  {id:"m3",name:"Two Streams",goal:{circuit:10},budget:380,desc:"Combine plates and wire into circuits — two independently produced parts."},
  {id:"m4",name:"Widget Contract",goal:{widget:8},budget:480,desc:"Gear plus circuit becomes a widget. Balance both branches."},
  {id:"m5",name:"Efficiency Run",goal:{widget:16},budget:560,desc:"Hit the widget quota with a tight yard. Score rewards speed and a small footprint."}
];
const TOOLS=["select","pan","belt","extractor","smelter","assembler","generator","pole","splitter","merger","inserter","chest","sink","copy","move","delete"];

function mulberry(seed){let s=seed|0||1;return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function key(x,y){return x+","+y}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display="none",1800)}
function deep(o){return JSON.parse(JSON.stringify(o))}

const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");
const tipEl=document.getElementById("tip");

const S={
  w:32,h:20,seed:1337,tick:0,time:0,paused:false,speed:1,beltMul:1,machMul:1,
  density:"items",costMode:"free",pwrDiff:"normal",mode:"sandbox",mission:0,
  tool:"select",dir:0,cam:{x:0,y:0,z:1},
  cells:Object.create(null),
  deposits:Object.create(null),
  obstacles:Object.create(null),
  itemsMoved:0,
  delivered:Object.create(null),
  produced:Object.create(null),
  consumed:Object.create(null),
  spent:0,budget:0,
  history:[],future:[],
  sel:null,selSet:null,
  drag:null,ghost:null,copyGhost:null,moveGhost:null,
  overlay:{flow:false,graph:false,power:false,util:false,cong:false,block:false,status:true},
  rates:{},
  samples:{prod:{},cons:{},power:[],delivery:[],util:[],cong:[],t:[]},
  lastSample:0,
  events:[],
  audioOn:false,
  fps:0,_frames:0,_fpsT:0,
  completed:false,score:0,wonAt:0
};

let audioCtx=null,masterGain=null;
function ensureAudio(){
  if(S.audioOn)return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=0.12;
    masterGain.connect(audioCtx.destination);
    S.audioOn=true;
  }catch(e){}
}
function beep(freq,dur,type,vol){
  if(!S.audioOn||!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type||"square";o.frequency.value=freq;
  g.gain.setValueAtTime((vol||0.2),audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(masterGain);o.start();o.stop(audioCtx.currentTime+dur);
}
function sfx(kind){
  if(kind==="place")beep(220+S.dir*20,0.06,"triangle",0.16);
  else if(kind==="del")beep(140,0.08,"sawtooth",0.12);
  else if(kind==="err")beep(90,0.12,"square",0.18);
  else if(kind==="ok"){beep(440,0.08,"triangle",0.14);setTimeout(()=>beep(660,0.1,"triangle",0.12),70)}
  else if(kind==="tick")beep(180,0.02,"square",0.04);
  else if(kind==="win"){beep(523,0.12,"triangle",0.2);setTimeout(()=>beep(659,0.12,"triangle",0.2),120);setTimeout(()=>beep(784,0.2,"triangle",0.22),240)}
}

function emptyBuf(){return Object.create(null)}
function bufCount(b){let n=0;for(const k in b)n+=b[k];return n}
function bufAdd(b,item,n){b[item]=(b[item]||0)+n}
function bufHas(b,need){for(const k in need)if((b[k]||0)<need[k])return false;return true}
function bufSub(b,need){for(const k in need)b[k]=(b[k]||0)-need[k]}

function newBuilding(type,x,y,dir,extra){
  const d=BDEFS[type];
  const b={id:type+"_"+x+"_"+y+"_"+Math.random().toString(36).slice(2,7),type,x,y,dir:dir||0,tier:1,status:"idle",util:0,inBuf:emptyBuf(),outBuf:emptyBuf(),progress:0,filter:null,recipe:null,fuel:0,burn:0,items:[],hist:[],splitFlip:0,cfg:{}};
  if(extra)Object.assign(b,extra);
  if(type==="smelter")b.recipe=b.recipe||"plate";
  if(type==="assembler")b.recipe=b.recipe||"wire";
  if(type==="splitter")b.cfg.mode=b.cfg.mode||"alt";
  if(type==="sink")b.cfg.accept=b.cfg.accept||"any";
  if(type==="generator")b.fuel=b.fuel||0;
  b.cap=type==="chest"?(d.store||24):type==="belt"?3:4;
  return b;
}

function cell(x,y){return S.cells[key(x,y)]}
function inb(x,y){return x>=0&&y>=0&&x<S.w&&y<S.h}
function occ(x,y){return !!(S.cells[key(x,y)]||S.obstacles[key(x,y)])}

function pushHist(cmd){S.history.push(cmd);if(S.history.length>200)S.history.shift();S.future.length=0}
function applyCmd(cmd,inv){
  if(cmd.op==="place"){if(inv)removeAt(cmd.b.x,cmd.b.y,true);else put(cmd.b,true)}
  else if(cmd.op==="remove"){if(inv)put(cmd.b,true);else removeAt(cmd.b.x,cmd.b.y,true)}
  else if(cmd.op==="batch"){const seq=inv?cmd.cmds.slice().reverse():cmd.cmds;for(const c of seq)applyCmd(c,inv)}
  else if(cmd.op==="rot"){const b=cell(cmd.x,cmd.y);if(b)b.dir=inv?cmd.from:cmd.to}
  else if(cmd.op==="cfg"){const b=cell(cmd.x,cmd.y);if(b){if(inv)Object.assign(b,cmd.prev);else Object.assign(b,cmd.next)}}
  else if(cmd.op==="tier"){const b=cell(cmd.x,cmd.y);if(b)b.tier=inv?cmd.from:cmd.to}
}
function undo(){const c=S.history.pop();if(!c)return;applyCmd(c,true);S.future.push(c);sfx("del")}
function redo(){const c=S.future.pop();if(!c)return;applyCmd(c,false);S.history.push(c);sfx("place")}

function put(b,silent){
  S.cells[key(b.x,b.y)]=b;
  if(!silent){pushHist({op:"place",b:deep(serializeB(b))});sfx("place")}
}
function serializeB(b){
  return {id:b.id,type:b.type,x:b.x,y:b.y,dir:b.dir,tier:b.tier,recipe:b.recipe,filter:b.filter,cfg:deep(b.cfg||{}),inBuf:deep(b.inBuf),outBuf:deep(b.outBuf),progress:b.progress,fuel:b.fuel,burn:b.burn,items:deep(b.items||[]),splitFlip:b.splitFlip||0};
}
function removeAt(x,y,silent){
  const b=cell(x,y);if(!b)return;
  delete S.cells[key(x,y)];
  if(S.sel&&S.sel.x===x&&S.sel.y===y)S.sel=null;
  if(!silent){pushHist({op:"remove",b:serializeB(b)});sfx("del")}
}

function depositAt(x,y){return S.deposits[key(x,y)]}
function costOf(type,tier){const c=BDEFS[type]?BDEFS[type].cost:0;return Math.round(c*(tier||1))}
function canAfford(type){
  if(S.mode==="sandbox"&&S.costMode==="free")return true;
  return S.spent+costOf(type)<= (S.mode==="campaign"?S.budget:1e9);
}
function spend(type){if(S.mode==="campaign"||S.costMode==="budget")S.spent+=costOf(type)}
function refund(type,tier){if(S.mode==="campaign"||S.costMode==="budget")S.spent=Math.max(0,S.spent-costOf(type,tier))}

function validPlace(type,x,y){
  if(!inb(x,y))return {ok:false,why:"Out of bounds"};
  if(S.obstacles[key(x,y)])return {ok:false,why:"Obstacle"};
  if(cell(x,y))return {ok:false,why:"Occupied"};
  if(BDEFS[type]&&BDEFS[type].needDep){
    const d=depositAt(x,y);
    if(!d)return {ok:false,why:"Needs deposit"};
  }else if(depositAt(x,y)&&type!=="extractor"){
    return {ok:false,why:"Deposit reserved"};
  }
  if(!canAfford(type))return {ok:false,why:"Over budget"};
  return {ok:true};
}

function placeTool(type,x,y,dir,extra,batch){
  const v=validPlace(type,x,y);if(!v.ok){if(!batch)sfx("err");return null}
  const b=newBuilding(type,x,y,dir,extra);
  S.cells[key(x,y)]=b;spend(type);
  if(!batch){pushHist({op:"place",b:serializeB(b)});sfx("place")}
  return b;
}

function rotateAt(x,y){
  const b=cell(x,y);if(!b||BDEFS[b.type].tool)return;
  const from=b.dir;b.dir=(b.dir+1)&3;
  pushHist({op:"rot",x,y,from,to:b.dir});sfx("place");
}

function upgradeAt(x,y){
  const b=cell(x,y);if(!b||["belt","pole","select"].includes(b.type))return;
  if(b.tier>=3){toast("Already T3");return}
  const from=b.tier;b.tier++;
  if(S.mode==="campaign"||S.costMode==="budget")S.spent+=Math.round(costOf(b.type)*0.6);
  pushHist({op:"tier",x,y,from,to:b.tier});sfx("ok");
}

function facing(b){return {x:b.x+DIRS[b.dir].x,y:b.y+DIRS[b.dir].y}}
function behind(b){return {x:b.x+DIRS[OPP[b.dir]].x,y:b.y+DIRS[OPP[b.dir]].y}}

function itemCap(b){
  const t=b.tier||1;
  if(b.type==="belt")return 3;
  if(b.type==="chest")return Math.round((BDEFS.chest.store||24)* (t===1?1:t===2?1.5:2));
  if(b.type==="splitter"||b.type==="merger")return 3;
  return Math.round(4*(t===1?1:t===2?1.5:2));
}

function beltAccept(b,item,pos){
  if(!b.items)b.items=[];
  const cap=itemCap(b);
  const count=S.density==="packets"?b.items.reduce((n,it)=>n+it.count,0):b.items.length;
  if(count>=cap)return false;
  if(S.density==="packets"){
    const last=b.items[0];
    if(last&&last.item===item&&last.count<8){last.count++;return true}
    b.items.unshift({item,pos:clamp(pos||0,0,0.92),count:1});
  }else b.items.unshift({item,pos:clamp(pos||0,0,0.92),count:1});
  return true;
}

function machineAccept(b,item){
  const rec=RECIPES[b.recipe];
  const isGen=b.type==="generator";
  const isExt=b.type==="extractor";
  const isSink=b.type==="sink";
  const isChest=b.type==="chest";
  if(isSink){
    if(b.cfg.accept!=="any"&&b.cfg.accept!==item)return false;
    bufAdd(b.inBuf,item,1);return true;
  }
  if(isGen){if(item!=="coal")return false;if((b.fuel||0)+ (b.inBuf.coal||0)>=8)return false;bufAdd(b.inBuf,item,1);return true}
  if(isChest){if(bufCount(b.inBuf)>=itemCap(b))return false;bufAdd(b.inBuf,item,1);return true}
  if(isExt)return false;
  if(rec&&!(item in rec.in))return false;
  const need=rec?rec.in[item]:2;
  if((b.inBuf[item]||0)>=need*2+2)return false;
  if(bufCount(b.inBuf)>=itemCap(b))return false;
  bufAdd(b.inBuf,item,1);return true;
}

function acceptInto(ent,item,fromDir,pos){
  if(!ent)return false;
  if(ent.type==="belt")return beltAccept(ent,item,pos);
  if(ent.type==="splitter"){
    if((ent.items||[]).length>=itemCap(ent))return false;
    ent.items=ent.items||[];ent.items.push({item,pos:0,count:1});return true;
  }
  if(ent.type==="merger"){
    if((ent.items||[]).length>=itemCap(ent))return false;
    ent.items=ent.items||[];ent.items.push({item,pos:0,count:1});return true;
  }
  return machineAccept(ent,item);
}

function ejectFrom(b){
  const t=facing(b);const dest=cell(t.x,t.y);
  if(!dest)return false;
  let item=null;
  if(b.type==="extractor"||b.type==="smelter"||b.type==="assembler"||b.type==="chest"){
    for(const k in b.outBuf){if(b.outBuf[k]>0){item=k;break}}
    if(!item&&b.type==="chest"){for(const k in b.inBuf){if(b.inBuf[k]>0){item=k;break}}}
  }
  if(!item)return false;
  if(acceptInto(dest,item,OPP[b.dir],0.02)){
    if(b.outBuf[item]>0)b.outBuf[item]--;
    else if(b.inBuf[item]>0)b.inBuf[item]--;
    note("moved",item,1);
    return true;
  }
  return false;
}

function note(kind,item,n){
  if(kind==="prod")S.produced[item]=(S.produced[item]||0)+n;
  if(kind==="cons")S.consumed[item]=(S.consumed[item]||0)+n;
  if(kind==="deliv")S.delivered[item]=(S.delivered[item]||0)+n;
  S.events.push({t:S.time,kind,item,n});
  if(S.events.length>4000)S.events.splice(0,2000);
}

function powerMult(){return S.pwrDiff==="easy"?1.35:S.pwrDiff==="hard"?0.72:1}
function demandMult(){return S.pwrDiff==="easy"?0.85:S.pwrDiff==="hard"?1.25:1}

function rebuildPower(){
  const poles=[];const gens=[];const cons=[];
  for(const k in S.cells){
    const b=S.cells[k];
    if(b.type==="pole")poles.push(b);
    if(b.type==="generator")gens.push(b);
    const idle=BDEFS[b.type];
    if(idle&&(idle.power>0||(b.type==="smelter"||b.type==="assembler")))cons.push(b);
  }
  const nets=[];
  const seen=new Set();
  function near(a,b,r){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)<=r}
  for(const p of poles){
    if(seen.has(p.id))continue;
    const net={poles:[],gens:[],cons:[],supply:0,demand:0,sat:1};
    const q=[p];seen.add(p.id);
    while(q.length){
      const cur=q.pop();net.poles.push(cur);
      for(const o of poles)if(!seen.has(o.id)&&near(cur,o,BDEFS.pole.range)){seen.add(o.id);q.push(o)}
    }
    nets.push(net);
  }
  function attach(b){
    let best=null,bd=99;
    for(const net of nets){
      for(const p of net.poles){
        const d=Math.abs(p.x-b.x)+Math.abs(p.y-b.y);
        if(d<=BDEFS.pole.range&&d<bd){bd=d;best=net}
      }
    }
    if(!best&&nets.length===0){
      best={poles:[],gens:[],cons:[],supply:0,demand:0,sat:1,orphan:1};nets.push(best);
    }
    return best;
  }
  for(const g of gens){
    const n=attach(g);if(n){n.gens.push(g);g._net=n}else g._net=null;
  }
  for(const c of cons){
    const n=attach(c);if(n){n.cons.push(c);c._net=n}else c._net=null;
  }
  for(const n of nets){
    n.supply=0;n.demand=0;
    for(const g of n.gens)n.supply+=g._gen||0;
    for(const c of n.cons)n.demand+=c._demand||0;
    n.sat=n.demand<=0?1:clamp(n.supply/n.demand,0,1);
    if(n.sat<0.12)n.sat=0;
  }
  S.powerNets=nets;
  let ts=0,td=0;
  for(const n of nets){ts+=n.supply;td+=n.demand}
  S.power={supply:ts,demand:td,sat:td<=0?1:clamp(ts/td,0,1)};
}

function tierSpeed(t){return t===3?2.15:t===2?1.5:1}
function tierStore(t){return t===3?2:t===2?1.5:1}

function tickExtractor(b,dt){
  const dep=depositAt(b.x,b.y);
  b._demand=BDEFS.extractor.power*demandMult();
  const sat=b._net?b._net.sat:0;
  if(sat<=0){b.status="unpowered";b.util=0;return}
  if(!dep||(dep.amount<=0&&!dep.regen)){b.status="starved";b.util=0;return}
  if((b.outBuf[dep.item]||0)>=itemCap(b)){b.status="blocked";b.util=0.15;return}
  b.status="working";
  b.progress+=(dt*S.machMul*tierSpeed(b.tier)*sat)/1.1;
  b.util=sat;
  while(b.progress>=1){
    b.progress-=1;
    if(dep.amount>0)dep.amount--;
    bufAdd(b.outBuf,dep.item,1);
    note("prod",dep.item,1);
  }
  if(dep.regen)dep.amount=Math.min(dep.max||200,dep.amount+dep.regen*dt);
  ejectFrom(b);
}

function tickMachine(b,dt){
  const rec=RECIPES[b.recipe];
  if(!rec){b.status="misconfig";b.util=0;return}
  const pwr=(rec.power+ (BDEFS[b.type].power||0))*demandMult();
  b._demand=pwr;
  const sat=b._net?b._net.sat:0;
  if(sat<=0){b.status="unpowered";b.util=0;return}
  if(!bufHas(b.inBuf,rec.in)&&b.progress<=0){b.status="starved";b.util=0;ejectFrom(b);return}
  const outItem=Object.keys(rec.out)[0];
  const outN=rec.out[outItem];
  if((b.outBuf[outItem]||0)+outN>itemCap(b)){b.status="blocked";b.util=0.2;ejectFrom(b);return}
  if(b.progress<=0){if(!bufHas(b.inBuf,rec.in)){b.status="starved";return}bufSub(b.inBuf,rec.in);for(const k in rec.in)note("cons",k,rec.in[k]);b.progress=0.0001}
  b.status="working";
  b.progress+=(dt*S.machMul*tierSpeed(b.tier)*sat)/rec.time;
  b.util=sat;
  if(b.progress>=1){
    b.progress=0;
    for(const k in rec.out){bufAdd(b.outBuf,k,rec.out[k]);note("prod",k,rec.out[k])}
  }
  ejectFrom(b);
}

function tickGen(b,dt){
  if((b.inBuf.coal||0)>0&&b.fuel<6){b.fuel+=(b.inBuf.coal||0);b.inBuf.coal=0}
  const out=BDEFS.generator.gen*powerMult()*tierSpeed(b.tier);
  if(b.fuel>0){
    b.burn+=dt;
    const burnT=S.pwrDiff==="hard"?2.2:S.pwrDiff==="easy"?4.2:3.2;
    if(b.burn>=burnT){b.burn=0;b.fuel--;note("cons","coal",1)}
    b._gen=out;b.status="working";b.util=1;
  }else{b._gen=0;b.status="starved";b.util=0}
}

function tickInserter(b,dt){
  b._demand=BDEFS.inserter.power*demandMult();
  const sat=b._net?b._net.sat:0;
  if(sat<=0){b.status="unpowered";b.util=0;return}
  b.progress+=dt*S.machMul*tierSpeed(b.tier)*sat*2.4;
  if(b.progress<1){b.status="idle";b.util=0.2;return}
  b.progress=0;
  const src=cell(behind(b).x,behind(b).y);
  const dst=cell(facing(b).x,facing(b).y);
  if(!src||!dst){b.status="misconfig";return}
  let item=null;
  const takeFromBuf=buf=>{
    const keys=Object.keys(buf).filter(k=>buf[k]>0);
    if(b.filter&&keys.includes(b.filter)&&buf[b.filter]>0)return b.filter;
    return keys[0]||null;
  };
  if(src.items&&src.items.length){
    const it=src.items[src.items.length-1];
    if(!b.filter||it.item===b.filter){item=it.item;if(it.count>1)it.count--;else src.items.pop()}
  }else{
    item=takeFromBuf(src.outBuf)||takeFromBuf(src.inBuf);
    if(item){if(src.outBuf[item]>0)src.outBuf[item]--;else src.inBuf[item]--}
  }
  if(!item){b.status="starved";b.util=0;return}
  if(!acceptInto(dst,item,OPP[b.dir],0.05)){
    if(src.outBuf)bufAdd(src.outBuf,item,1);
    else if(src.items)src.items.push({item,pos:0.9,count:1});
    b.status="blocked";return;
  }
  b.status="working";b.util=1;note("moved",item,1);
}

function tickSink(b){
  for(const k in b.inBuf){
    const n=b.inBuf[k];if(!n)continue;
    note("deliv",k,n);b.inBuf[k]=0;
    b.status="working";
  }
}

function destOfBelt(b){return cell(b.x+DIRS[b.dir].x,b.y+DIRS[b.dir].y)}

function tickTransport(dt){
  const belts=[];
  for(const k in S.cells){
    const b=S.cells[k];
    if(b.type==="belt"||b.type==="splitter"||b.type==="merger")belts.push(b);
  }
  const step=dt*S.beltMul*1.35;
  for(const b of belts){
    if(!b.items)b.items=[];
    b.items.sort((a,c)=>c.pos-a.pos);
    const spacing=1/Math.max(2,itemCap(b));
    for(let i=0;i<b.items.length;i++){
      const it=b.items[i];
      let np=it.pos+step;
      if(i>0)np=Math.min(np,b.items[i-1].pos-spacing);
      if(np<0.98){it.pos=Math.max(0,np);continue}
      it.pos=0.98;
    }
  }
  for(const b of belts){
    if(!b.items.length){b.status="idle";b.util=0;continue}
    const dest=b.type==="splitter"?null:destOfBelt(b);
    const keep=[];
    for(const it of b.items){
      if(it.pos<0.97){keep.push(it);continue}
      let ok=false;
      if(b.type==="splitter"){
        const left=(b.dir+3)&3,right=(b.dir+1)&3;
        const outs=[cell(b.x+DIRS[left].x,b.y+DIRS[left].y),cell(b.x+DIRS[right].x,b.y+DIRS[right].y)];
        if(b.cfg.mode==="filter"&&b.filter){
          const prefer=it.item===b.filter?0:1;
          const a=outs[prefer],c=outs[1-prefer];
          ok=a&&acceptInto(a,it.item,OPP[prefer===0?left:right],0.02)||c&&acceptInto(c,it.item,0,0.02);
        }else{
          const i=b.splitFlip&1;b.splitFlip++;
          const a=outs[i],c=outs[1-i];
          ok=a&&acceptInto(a,it.item,0,0.02)||c&&acceptInto(c,it.item,0,0.02);
        }
      }else if(b.type==="merger"){
        ok=dest&&acceptInto(dest,it.item,OPP[b.dir],0.02);
      }else{
        ok=dest&&acceptInto(dest,it.item,OPP[b.dir],it.pos-1);
      }
      if(ok){note("moved",it.item,it.count||1);S.itemsMoved++}
      else keep.push(it);
    }
    b.items=keep;
    b.util=b.items.length/itemCap(b);
    b.status=b.items.some(it=>it.pos>=0.96)?"blocked":"working";
  }
}

function sampleAnalytics(){
  const win=6;
  const cut=S.time-win;
  const rec={prod:{},cons:{},deliv:{}};
  for(const e of S.events){
    if(e.t<cut)continue;
    if(e.kind==="prod")rec.prod[e.item]=(rec.prod[e.item]||0)+e.n;
    if(e.kind==="cons")rec.cons[e.item]=(rec.cons[e.item]||0)+e.n;
    if(e.kind==="deliv")rec.deliv[e.item]=(rec.deliv[e.item]||0)+e.n;
  }
  const scale=1/win;
  S.rates={prod:{},cons:{},deliv:{}};
  for(const k in rec.prod)S.rates.prod[k]=rec.prod[k]*scale;
  for(const k in rec.cons)S.rates.cons[k]=rec.cons[k]*scale;
  for(const k in rec.deliv)S.rates.deliv[k]=rec.deliv[k]*scale;
  let work=0,stall=0,cong=0,bc=0,util=0,mc=0;
  for(const k in S.cells){
    const b=S.cells[k];
    if(["smelter","assembler","extractor","generator","inserter"].includes(b.type)){
      mc++;util+=b.util||0;if(b.status==="working")work++;else stall++;
    }
    if(b.type==="belt"){bc++;if((b.util||0)>0.8||b.status==="blocked")cong++}
    if(S.sel&&S.sel.id===b.id){
      b.hist.push(b.util||0);if(b.hist.length>60)b.hist.shift();
    }
  }
  S.counts={work,stall,cong,belts:bc,mach:mc,util:mc?util/mc:0,items:countItems()};
  const arr=S.samples;
  arr.t.push(S.time);
  arr.power.push(S.power?S.power.supply-S.power.demand:0);
  arr.delivery.push(Object.values(S.rates.deliv).reduce((a,c)=>a+c,0));
  arr.util.push(S.counts.util);
  arr.cong.push(bc?cong/bc:0);
  const keep=80;
  if(arr.t.length>keep){arr.t.splice(0,arr.t.length-keep);arr.power.splice(0,arr.power.length-keep);arr.delivery.splice(0,arr.delivery.length-keep);arr.util.splice(0,arr.util.length-keep);arr.cong.splice(0,arr.cong.length-keep)}
}

function countItems(){
  let n=0;
  for(const k in S.cells){
    const b=S.cells[k];
    if(b.items)n+=S.density==="packets"?b.items.reduce((a,it)=>a+(it.count||1),0):b.items.length;
    n+=bufCount(b.inBuf)+bufCount(b.outBuf)+(b.fuel||0);
  }
  return n;
}

function simTick(dt){
  if(S.paused)return;
  const slice=1/30;
  let acc=dt*S.speed;
  if(acc>0.25)acc=0.25;
  S._acc=(S._acc||0)+acc;
  while(S._acc>=slice){
    S._acc-=slice;
    stepOnce(slice);
  }
}

function stepOnce(dt){
  S.tick++;
  S.time+=dt;
  for(const k in S.cells){
    const b=S.cells[k];
    if(b.type==="generator")tickGen(b,dt);
  }
  rebuildPower();
  for(const k in S.cells){
    const b=S.cells[k];
    if(b.type==="extractor")tickExtractor(b,dt);
    else if(b.type==="smelter"||b.type==="assembler")tickMachine(b,dt);
    else if(b.type==="inserter")tickInserter(b,dt);
    else if(b.type==="chest"){b.status=bufCount(b.inBuf)>=itemCap(b)?"blocked":"idle";ejectFrom(b)}
    else if(b.type==="sink")tickSink(b);
    else if(b.type==="pole")b.status="idle";
  }
  tickTransport(dt);
  if(S.time-S.lastSample>=0.35){S.lastSample=S.time;sampleAnalytics();checkMission()}
}

function goalItems(){return MISSIONS[S.mission]?MISSIONS[S.mission].goal:{}}
function deliveredGoal(){
  const g=goalItems();let have=0,need=0;
  for(const k in g){need+=g[k];have+=Math.min(g[k],S.delivered[k]||0)}
  return {have,need,pct:need?have/need:0};
}
function checkMission(){
  if(S.mode!=="campaign"||S.completed)return;
  const p=deliveredGoal();
  if(p.need&&p.have>=p.need){
    S.completed=true;S.wonAt=S.time;
    const foot=Object.keys(S.cells).length;
    const pwr=S.power?S.power.sat:0;
    const tScore=Math.max(0,8000-S.time*40);
    const eScore=2000*(S.counts?S.counts.util:0);
    const fScore=Math.max(0,1800-foot*12);
    S.score=Math.round(tScore+eScore+fScore+pwr*600);
    sfx("win");
    showModal("Contract complete","Delivered in "+S.time.toFixed(1)+"s. Score "+S.score+". Footprint "+foot+" buildings.","Restart mission","Close",()=>loadMission(S.mission));
  }
}

function worldFromEvt(e){
  const r=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  const x=(e.clientX-r.left);
  const y=(e.clientY-r.top);
  const gx=Math.floor((x-S.cam.x)/(TILE*S.cam.z));
  const gy=Math.floor((y-S.cam.y)/(TILE*S.cam.z));
  return {gx,gy,sx:x,sy:y};
}

function pathCells(x0,y0,x1,y1){
  const out=[];
  let x=x0,y=y0,dir=x1!==x0?(x1>x0?0:2):(y1>y0?1:3);
  out.push({x,y,dir});
  while(x!==x1){dir=x1>x?0:2;x+=Math.sign(x1-x);out.push({x,y,dir})}
  while(y!==y1){dir=y1>y?1:3;y+=Math.sign(y1-y);out.push({x,y,dir})}
  for(let i=0;i<out.length-1;i++){
    const a=out[i],c=out[i+1];
    a.dir=c.x>a.x?0:c.x<a.x?2:c.y>a.y?1:3;
  }
  return out;
}

function drawGrid(){
  const z=S.cam.z,T=TILE*z;
  ctx.save();
  ctx.translate(S.cam.x,S.cam.y);
  const x0=Math.max(0,Math.floor((-S.cam.x)/T)-1);
  const y0=Math.max(0,Math.floor((-S.cam.y)/T)-1);
  const x1=Math.min(S.w,Math.ceil((canvas._cssW-S.cam.x)/T)+1);
  const y1=Math.min(S.h,Math.ceil((canvas._cssH-S.cam.y)/T)+1);
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    const h=((x*19+y*37+S.seed)&7);
    ctx.fillStyle=h<2?"#1a1612":"#16130f";
    ctx.fillRect(x*T,y*T,T-0.6,T-0.6);
    const dep=depositAt(x,y);
    if(dep){
      ctx.fillStyle=dep.item==="coal"?"#2c2a28":"#6a3a18";
      ctx.beginPath();ctx.arc(x*T+T/2,y*T+T*0.58,T*0.28,0,6.28);ctx.fill();
      ctx.fillStyle=dep.item==="coal"?"#6a645c":"#c4682a";
      ctx.beginPath();ctx.arc(x*T+T*0.38,y*T+T*0.42,T*0.14,0,6.28);ctx.fill();
      ctx.fillStyle="#efe4d2aa";ctx.font=(10*z)+"px sans-serif";ctx.textAlign="center";
      ctx.fillText(dep.amount|0,x*T+T/2,y*T+T*0.9);
    }
    if(S.obstacles[key(x,y)]){
      ctx.fillStyle="#3a322c";
      ctx.fillRect(x*T+T*0.15,y*T+T*0.2,T*0.7,T*0.62);
      ctx.fillStyle="#5a4a3a";
      ctx.fillRect(x*T+T*0.22,y*T+T*0.16,T*0.3,T*0.28);
    }
  }
  ctx.strokeStyle="#2a241c";ctx.lineWidth=1;
  ctx.strokeRect(0,0,S.w*T,S.h*T);
  ctx.restore();
}

function colStatus(st){
  return st==="working"?"#8fce6a":st==="blocked"?"#e85d4c":st==="starved"?"#f0c14a":st==="unpowered"?"#7aa0ff":st==="misconfig"?"#d080ff":"#8a7a68";
}

function drawBuilding(b,ghost,invalid){
  const z=S.cam.z,T=TILE*z;
  const x=b.x*T+S.cam.x,y=b.y*T+S.cam.y;
  ctx.save();
  ctx.globalAlpha=ghost?0.45:1;
  if(invalid)ctx.globalAlpha=0.35;
  const pulse=b.status==="working"?0.5+0.5*Math.sin(S.time*8):1;
  const base=b.type==="belt"?"#4a3a22":b.type==="extractor"?"#6a3a22":b.type==="smelter"?"#5a2a22":b.type==="assembler"?"#243a44":b.type==="generator"?"#4a3a14":b.type==="pole"?"#3a3a22":b.type==="sink"?"#1a3a34":b.type==="chest"?"#3a3228":b.type==="inserter"?"#3a4450":b.type==="splitter"?"#4a4030":b.type==="merger"?"#403848":"#333";
  ctx.fillStyle=base;
  roundRect(x+3,y+3,T-6,T-6,6);
  ctx.fill();
  if(!ghost&&S.overlay.util&&["smelter","assembler","extractor","generator","inserter"].includes(b.type)){
    ctx.fillStyle=`rgba(${Math.round(255*(1-(b.util||0)))},${Math.round(200*(b.util||0))},40,0.35)`;
    ctx.fillRect(x+3,y+3,T-6,T-6);
  }
  if(!ghost&&S.overlay.cong&&b.type==="belt"){
    ctx.fillStyle=`rgba(232,80,60,${(b.util||0)*0.45})`;ctx.fillRect(x+3,y+3,T-6,T-6);
  }
  ctx.strokeStyle=invalid?"#e85d4c":(S.sel&&S.sel.id===b.id)?"#ffb060":"#0006";
  ctx.lineWidth=(S.sel&&S.sel.id===b.id)?2:1;
  roundRect(x+3,y+3,T-6,T-6,6);ctx.stroke();
  ctx.save();
  ctx.translate(x+T/2,y+T/2);
  ctx.rotate(b.dir*Math.PI/2);
  ctx.fillStyle="#efe4d2";
  if(b.type==="belt"){
    ctx.fillStyle="#c9a05a";
    ctx.fillRect(-T*0.32,-T*0.12,T*0.64,T*0.24);
    ctx.fillStyle="#f0c14a";
    const off=((S.time*S.beltMul*40)%(T*0.35));
    for(let i=-1;i<3;i++){
      ctx.beginPath();
      const ox=-T*0.28+i*T*0.28+off*0.4;
      ctx.moveTo(ox,-T*0.08);ctx.lineTo(ox+T*0.1,0);ctx.lineTo(ox,-T*-0.08);ctx.fill();
    }
  }else if(b.type==="extractor"){
    ctx.fillStyle="#e08a3c";ctx.fillRect(-T*0.08,-T*0.28,T*0.16,T*0.4);
    ctx.beginPath();ctx.arc(0,T*0.12,T*0.16,0,6.28);ctx.fill();
  }else if(b.type==="smelter"){
    ctx.fillStyle="#e85d4c";ctx.fillRect(-T*0.18,-T*0.22,T*0.36,T*0.4);
    ctx.fillStyle=`rgba(255,160,60,${0.3+0.5*pulse})`;ctx.fillRect(-T*0.1,-T*0.1,T*0.2,T*0.18);
  }else if(b.type==="assembler"){
    ctx.fillStyle="#4ecdc4";ctx.fillRect(-T*0.2,-T*0.2,T*0.4,T*0.4);
    ctx.strokeStyle="#0c2020";ctx.strokeRect(-T*0.12,-T*0.12,T*0.24,T*0.24);
  }else if(b.type==="generator"){
    ctx.fillStyle="#f0c14a";ctx.beginPath();ctx.arc(0,0,T*0.18,0,6.28);ctx.fill();
    ctx.fillStyle="#1a1408";ctx.fillRect(-T*0.04,-T*0.22,T*0.08,T*0.2);
  }else if(b.type==="pole"){
    ctx.fillStyle="#f0d14a";ctx.fillRect(-2,-T*0.28,4,T*0.5);
    ctx.beginPath();ctx.arc(0,-T*0.22,5,0,6.28);ctx.fill();
    if(!ghost){
      ctx.restore();ctx.save();
      ctx.strokeStyle="rgba(240,209,74,0.35)";ctx.lineWidth=1;
      const R=BDEFS.pole.range;
      for(const k in S.cells){
        const o=S.cells[k];
        if(o.type==="pole"&&o.id>b.id&&Math.abs(o.x-b.x)+Math.abs(o.y-b.y)<=R){
          ctx.beginPath();
          ctx.moveTo(x+T/2,y+T*0.22);
          ctx.lineTo(o.x*T+S.cam.x+T/2,o.y*T+S.cam.y+T*0.22);
          ctx.stroke();
        }
      }
      ctx.restore();ctx.save();ctx.translate(x+T/2,y+T/2);ctx.rotate(b.dir*Math.PI/2);
    }
  }else if(b.type==="sink"){
    ctx.fillStyle="#4ecdc4";ctx.fillRect(-T*0.22,-T*0.16,T*0.44,T*0.32);
    ctx.fillStyle="#102820";ctx.fillRect(-T*0.12,-T*0.08,T*0.24,T*0.16);
  }else if(b.type==="chest"){
    ctx.fillStyle="#c4a574";ctx.fillRect(-T*0.2,-T*0.16,T*0.4,T*0.32);
  }else if(b.type==="inserter"){
    ctx.strokeStyle="#9ad0ff";ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(-T*0.22,0);ctx.lineTo(T*0.22,0);ctx.stroke();
    ctx.fillStyle="#9ad0ff";ctx.beginPath();ctx.moveTo(T*0.1,-6);ctx.lineTo(T*0.24,0);ctx.lineTo(T*0.1,6);ctx.fill();
  }else if(b.type==="splitter"){
    ctx.fillStyle="#e0c070";ctx.fillRect(-T*0.08,-T*0.22,T*0.16,T*0.2);
    ctx.fillRect(-T*0.26,-T*0.08,T*0.52,T*0.16);
  }else if(b.type==="merger"){
    ctx.fillStyle="#c090d0";ctx.fillRect(-T*0.26,-T*0.08,T*0.52,T*0.16);
    ctx.fillRect(-T*0.08,0,T*0.16,T*0.22);
  }
  ctx.restore();
  if(b.items){
    for(const it of b.items){
      const d=DIRS[b.dir];
      const px=x+T/2+ (it.pos-0.5)*d.x*T*0.7;
      const py=y+T/2+ (it.pos-0.5)*d.y*T*0.7;
      drawItem(px,py,it.item,z,it.count);
    }
  }
  if(!ghost&&(b.progress>0)&&(b.type==="smelter"||b.type==="assembler"||b.type==="extractor")){
    ctx.strokeStyle="#ffe0a0";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(x+T-8,y+8,5,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(b.progress,0,1));ctx.stroke();
  }
  if(!ghost&&S.overlay.status&&b.status&&b.status!=="idle"&&b.status!=="working"){
    ctx.fillStyle=colStatus(b.status);
    ctx.beginPath();ctx.arc(x+8,y+8,4,0,6.28);ctx.fill();
  }
  if(!ghost&&S.overlay.block&&b.status==="blocked"){
    ctx.strokeStyle="#e85d4c";ctx.lineWidth=2;ctx.strokeRect(x+2,y+2,T-4,T-4);
  }
  if(!ghost&&S.overlay.flow&&(b.type==="belt"||b.type==="inserter")){
    ctx.fillStyle="#4ecdc4aa";
    const d=DIRS[b.dir];
    const ax=x+T/2+d.x*T*0.28,ay=y+T/2+d.y*T*0.28;
    ctx.beginPath();ctx.arc(ax,ay,3,0,6.28);ctx.fill();
  }
  if(b.tier>1){
    ctx.fillStyle="#ffb060";ctx.font=Math.max(9,10*z)+"px sans-serif";
    ctx.fillText("T"+b.tier,x+6,y+T-6);
  }
  ctx.restore();
}

function drawItem(px,py,item,z,count){
  const it=ITEMS[item]||{col:"#fff",ch:"?"};
  ctx.fillStyle=it.col;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(px-7*z,py-7*z,14*z,14*z,3):ctx.fillRect(px-6,py-6,12,12);
  if(ctx.roundRect)ctx.fill();
  else ctx.fill();
  ctx.fillStyle="#111";ctx.font=Math.max(8,10*z)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(it.ch,px,py+0.5);
  if(count&&count>1){ctx.fillStyle="#fff";ctx.font=Math.max(8,9*z)+"px sans-serif";ctx.fillText(count,px+6*z,py-6*z)}
  ctx.textAlign="start";ctx.textBaseline="alphabetic";
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);
  else ctx.rect(x,y,w,h);
}

function drawOverlays(){
  const z=S.cam.z,T=TILE*z;
  if(S.overlay.power&&S.powerNets){
    for(const n of S.powerNets){
      ctx.strokeStyle=n.sat>=1?"rgba(143,206,106,0.35)":n.sat>0.2?"rgba(240,193,74,0.4)":"rgba(232,93,76,0.45)";
      ctx.lineWidth=2;
      for(const p of n.poles){
        ctx.beginPath();
        ctx.arc(p.x*T+S.cam.x+T/2,p.y*T+S.cam.y+T/2,BDEFS.pole.range*T,0,6.28);
        ctx.stroke();
      }
    }
  }
  if(S.overlay.graph){
    ctx.strokeStyle="rgba(78,205,196,0.45)";ctx.lineWidth=1.5;
    for(const k in S.cells){
      const b=S.cells[k];
      const t=facing(b);const d=cell(t.x,t.y);
      if(!d)continue;
      ctx.beginPath();
      ctx.moveTo(b.x*T+S.cam.x+T/2,b.y*T+S.cam.y+T/2);
      ctx.lineTo(d.x*T+S.cam.x+T/2,d.y*T+S.cam.y+T/2);
      ctx.stroke();
    }
  }
}

function drawGhost(){
  if(!S.ghost)return;
  const g=S.ghost;
  if(g.path){
    for(const p of g.path){
      const v=validPlace("belt",p.x,p.y);
      drawBuilding({type:"belt",x:p.x,y:p.y,dir:p.dir,status:"idle",items:[]},true,!v.ok&&!cell(p.x,p.y));
    }
    return;
  }
  const v=validPlace(g.type,g.x,g.y);
  drawBuilding({type:g.type,x:g.x,y:g.y,dir:g.dir||S.dir,status:"idle",items:[],tier:1},true,!v.ok);
}

function drawSelectBox(){
  if(!S.drag||S.drag.kind!=="select")return;
  const a=S.drag.a,c=S.drag.b;
  if(!c)return;
  const z=S.cam.z,T=TILE*z;
  const x0=Math.min(a.x,c.x),y0=Math.min(a.y,c.y),x1=Math.max(a.x,c.x)+1,y1=Math.max(a.y,c.y)+1;
  ctx.strokeStyle="#ffb060";ctx.fillStyle="rgba(224,122,47,0.12)";
  ctx.fillRect(x0*T+S.cam.x,y0*T+S.cam.y,(x1-x0)*T,(y1-y0)*T);
  ctx.strokeRect(x0*T+S.cam.x,y0*T+S.cam.y,(x1-x0)*T,(y1-y0)*T);
}

function render(){
  const dpr=window.devicePixelRatio||1;
  const r=canvas.getBoundingClientRect();
  const w=Math.max(1,r.width),h=Math.max(1,r.height);
  if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  }
  canvas._cssW=w;canvas._cssH=h;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="#100e0c";ctx.fillRect(0,0,w,h);
  drawGrid();
  for(const k in S.cells)drawBuilding(S.cells[k]);
  drawGhost();
  drawSelectBox();
  drawOverlays();
  if(S.selSet){
    ctx.strokeStyle="#4ecdc4";
    const z=S.cam.z,T=TILE*z;
    for(const b of S.selSet)ctx.strokeRect(b.x*T+S.cam.x+2,b.y*T+S.cam.y+2,T-4,T-4);
  }
}

function sparkline(cv,data,col){
  const c=cv.getContext("2d");
  const w=cv.width=cv.clientWidth*2||160,h=cv.height=cv.clientHeight*2||72;
  c.clearRect(0,0,w,h);
  if(!data||data.length<2)return;
  let min=Math.min(...data),max=Math.max(...data);
  if(min===max){min-=1;max+=1}
  c.strokeStyle=col;c.lineWidth=2;c.beginPath();
  data.forEach((v,i)=>{
    const x=i/(data.length-1)*w,y=h-4-((v-min)/(max-min))*(h-8);
    i?c.lineTo(x,y):c.moveTo(x,y);
  });
  c.stroke();
}

function renderCharts(){
  const box=document.getElementById("charts");
  if(!box.dataset.ready){
    box.innerHTML=["Production","Power slack","Delivery","Utilization","Congestion","Queue"].map((n,i)=>
      `<div class="spark"><small>${n}</small><canvas id="spk${i}"></canvas></div>`).join("");
    box.dataset.ready="1";
  }
  const prod=Object.values(S.rates.prod||{});
  const q=[];
  for(const k in S.cells){const b=S.cells[k];if(b.items)q.push(b.items.length)}
  const prodHist=S.samples.t.map((_,i)=>Object.values(S.rates.prod||{}).reduce((a,c)=>a+c,0));
  sparkline(document.getElementById("spk0"),prodHist.length>1?S.samples.delivery.map((d,i)=>d+(S.samples.util[i]||0)):S.samples.delivery,"#e07a2f");
  sparkline(document.getElementById("spk1"),S.samples.power,"#f0c14a");
  sparkline(document.getElementById("spk2"),S.samples.delivery,"#4ecdc4");
  sparkline(document.getElementById("spk3"),S.samples.util,"#8fce6a");
  sparkline(document.getElementById("spk4"),S.samples.cong,"#e85d4c");
  sparkline(document.getElementById("spk5"),q.length?q:S.samples.cong,"#c090d0");
  const lines=[];
  lines.push("Rates /s");
  const all=new Set([...Object.keys(S.rates.prod||{}),...Object.keys(S.rates.cons||{}),...Object.keys(S.rates.deliv||{})]);
  for(const it of all){
    const nm=ITEMS[it]?ITEMS[it].name:it;
    lines.push(`${nm}  +${(S.rates.prod[it]||0).toFixed(2)}  -${(S.rates.cons[it]||0).toFixed(2)}  sink ${(S.rates.deliv[it]||0).toFixed(2)}`);
  }
  const c=S.counts||{};
  lines.push(`Util ${(c.util||0)*100|0}%  belts ${c.belts||0}  congested ${c.cong||0}`);
  if(S.power)lines.push(`Power nets ${(S.powerNets||[]).length}  sat ${Math.round((S.power.sat||0)*100)}%`);
  const bott=detectBottlenecks();
  if(bott.length)lines.push("Bottlenecks: "+bott.slice(0,4).join("; "));
  document.getElementById("ratesBox").textContent=lines.join("\n");
}

function detectBottlenecks(){
  const out=[];
  for(const k in S.cells){
    const b=S.cells[k];
    if(b.status==="blocked")out.push(b.type+" @"+b.x+","+b.y+" blocked");
    if(b.status==="starved"&&["smelter","assembler","generator"].includes(b.type))out.push(b.type+" @"+b.x+","+b.y+" starved");
    if(b.status==="unpowered")out.push(b.type+" @"+b.x+","+b.y+" no power");
    if(b.type==="belt"&&(b.util||0)>0.85)out.push("belt @"+b.x+","+b.y+" congested");
  }
  return out;
}

function inspect(b){
  S.sel=b;
  const el=document.getElementById("inspBody");
  const cfg=document.getElementById("inspCfg");
  if(!b){el.innerHTML="<span>Nothing selected</span><b>—</b>";cfg.innerHTML="";return}
  const rec=b.recipe?RECIPES[b.recipe]:null;
  const rows=[
    ["Type",BDEFS[b.type]?BDEFS[b.type].name:b.type],
    ["Cell",b.x+", "+b.y],
    ["Facing",DIRS[b.dir].n],
    ["Tier","T"+b.tier],
    ["Status",b.status],
    ["Util",((b.util||0)*100|0)+"%"],
    ["In",fmtBuf(b.inBuf)],
    ["Out",fmtBuf(b.outBuf)],
    ["Items",(b.items||[]).map(it=>it.item+(it.count>1?"×"+it.count:"")).join(" ")||"—"],
    ["Progress",(b.progress||0).toFixed(2)],
    ["Fuel",String(b.fuel||0)],
    ["Recipe",rec?rec.name:"—"],
    ["Power draw",((b._demand||0)|0)+" W"],
    ["Power gen",((b._gen||0)|0)+" W"],
    ["Network sat",b._net?Math.round(b._net.sat*100)+"%":"—"]
  ];
  el.innerHTML=rows.map(r=>`<span>${r[0]}</span><b>${r[1]}</b>`).join("");
  let html="";
  if(b.type==="assembler"||b.type==="smelter"){
    const opts=BDEFS[b.type].recipes.map(id=>`<option value="${id}"${b.recipe===id?" selected":""}>${RECIPES[id].name}</option>`).join("");
    html+=`<label>Recipe <select id="cfgRecipe" aria-label="Recipe selection">${opts}</select></label>`;
  }
  if(b.type==="splitter"){
    html+=`<label>Mode <select id="cfgSplit" aria-label="Splitter mode"><option value="alt"${b.cfg.mode==="alt"?" selected":""}>Alternate</option><option value="filter"${b.cfg.mode==="filter"?" selected":""}>Filter</option></select></label>`;
    html+=itemFilterSel("cfgFilter",b.filter);
  }
  if(b.type==="inserter"||b.type==="sink"){
    html+=itemFilterSel(b.type==="sink"?"cfgAccept":"cfgFilter",b.type==="sink"?b.cfg.accept:b.filter,true);
  }
  html+=`<div class="row"><button id="cfgRot" aria-label="Rotate selected">Rotate</button><button id="cfgUp" aria-label="Upgrade selected">Upgrade</button><button id="cfgDel" aria-label="Delete selected">Delete</button></div>`;
  if(b.hist&&b.hist.length)html+=`<div class="spark"><small>Entity utilization</small><canvas id="spkEnt"></canvas></div>`;
  cfg.innerHTML=html;
  const recEl=document.getElementById("cfgRecipe");
  if(recEl)recEl.onchange=()=>{const prev={recipe:b.recipe};b.recipe=recEl.value;pushHist({op:"cfg",x:b.x,y:b.y,prev,next:{recipe:b.recipe}});sfx("place")};
  const sp=document.getElementById("cfgSplit");
  if(sp)sp.onchange=()=>{b.cfg.mode=sp.value};
  const fi=document.getElementById("cfgFilter");
  if(fi)fi.onchange=()=>{b.filter=fi.value||null};
  const ac=document.getElementById("cfgAccept");
  if(ac)ac.onchange=()=>{b.cfg.accept=ac.value};
  const rot=document.getElementById("cfgRot");if(rot)rot.onclick=()=>rotateAt(b.x,b.y);
  const up=document.getElementById("cfgUp");if(up)up.onclick=()=>upgradeAt(b.x,b.y);
  const del=document.getElementById("cfgDel");if(del)del.onclick=()=>{refund(b.type,b.tier);removeAt(b.x,b.y);inspect(null)};
  const ent=document.getElementById("spkEnt");if(ent)sparkline(ent,b.hist,"#ffb060");
}
function fmtBuf(b){const p=[];for(const k in b)if(b[k])p.push((ITEMS[k]?ITEMS[k].ch:k)+":"+b[k]);return p.join(" ")||"—"}
function itemFilterSel(id,cur,any){
  let o=(any?`<option value="any"${!cur||cur==="any"?" selected":""}>Any</option>`:`<option value="">None</option>`)+
    Object.keys(ITEMS).map(k=>`<option value="${k}"${cur===k?" selected":""}>${ITEMS[k].name}</option>`).join("");
  return `<label>Filter <select id="${id}" aria-label="Item filter">${o}</select></label>`;
}

function showModal(title,body,okTxt,cancelTxt,onok){
  const m=document.getElementById("modals");
  m.className="show";
  m.innerHTML=`<div class="modal"><h3>${title}</h3><p>${body}</p><div class="row"><button id="mOk" class="primary">${okTxt||"OK"}</button><button id="mNo">${cancelTxt||"Close"}</button></div></div>`;
  document.getElementById("mOk").onclick=()=>{m.className="";if(onok)onok()};
  document.getElementById("mNo").onclick=()=>{m.className=""};
}

function buildTools(){
  const nav=document.getElementById("tools");
  nav.innerHTML=TOOLS.map(t=>{

function scatterDeposits(rng,opts){
  const nOre=opts.ore||8,nCoal=opts.coal||4,nRock=opts.rock||10;
  function spot(item,amt,regen){
    for(let i=0;i<80;i++){
      const x=2+(rng()*(S.w-4)|0),y=2+(rng()*(S.h-4)|0);
      const k=key(x,y);
      if(S.deposits[k]||S.obstacles[k])continue;
      S.deposits[k]={item,amount:amt,max:amt,regen:regen||0};
      return {x,y};
    }
    return null;
  }
  const ores=[],coals=[];
  for(let i=0;i<nOre;i++){const p=spot("ore",opts.oreAmt||180,opts.oreRegen||0);if(p)ores.push(p)}
  for(let i=0;i<nCoal;i++){const p=spot("coal",opts.coalAmt||120,opts.coalRegen||0);if(p)coals.push(p)}
  for(let i=0;i<nRock;i++){
    const x=1+(rng()*(S.w-2)|0),y=1+(rng()*(S.h-2)|0);
    if(!S.deposits[key(x,y)])S.obstacles[key(x,y)]=1;
  }
  return {ores,coals};
}

function clearCell(x,y){
  delete S.obstacles[key(x,y)];

function P(type,x,y,dir,extra){
  clearCell(x,y);
  if(type!=="extractor")delete S.deposits[key(x,y)];
  return placeTool(type,x,y,dir,extra,true);
}
function beltLine(x,y,dir,n){
  const d=DIRS[dir];
  for(let i=0;i<n;i++)P("belt",x+d.x*i,y+d.y*i,dir);
}
function poles(){
  for(const p of arguments){
    if(cell(p[0],p[1]))continue;
    delete S.obstacles[key(p[0],p[1])];
    placeTool("pole",p[0],p[1],0,null,true);
  }
}

function stitchPower(){
  const gens=[], need=[];
  for(const k in S.cells){
    const b=S.cells[k];
    if(b.type==="generator")gens.push(b);
    if(b.type==="extractor"||b.type==="smelter"||b.type==="assembler"||b.type==="inserter")need.push(b);
  }
  if(!gens.length)return;
  function drop(x,y){
    if(!inb(x,y)||cell(x,y)||depositAt(x,y))return;
    delete S.obstacles[key(x,y)];
    placeTool("pole",x,y,0,null,true);
  }
  for(const g of gens){drop(g.x+1,g.y);drop(g.x,g.y+1)}
  for(const c of need){
    drop(c.x+1,c.y);drop(c.x-1,c.y);
    const g=gens.reduce((a,b)=> (Math.abs(a.x-c.x)+Math.abs(a.y-c.y) < Math.abs(b.x-c.x)+Math.abs(b.y-c.y)?a:b));
    let x=c.x,y=c.y,guard=40,step=0;
    while(guard-- && Math.abs(x-g.x)+Math.abs(y-g.y)>4){
      if(Math.abs(x-g.x)>=Math.abs(y-g.y))x+=Math.sign(g.x-x);
      else y+=Math.sign(g.y-y);
      if((step++&1)===0)drop(x,y);
    }
  }
}

  return {
    v:1,w:S.w,h:S.h,seed:S.seed,tick:S.tick,time:S.time,paused:S.paused,speed:S.speed,
    beltMul:S.beltMul,machMul:S.machMul,density:S.density,costMode:S.costMode,pwrDiff:S.pwrDiff,
    mode:S.mode,mission:S.mission,spent:S.spent,budget:S.budget,completed:S.completed,score:S.score,
    delivered:deep(S.delivered),produced:deep(S.produced),consumed:deep(S.consumed),
    deposits:Object.keys(S.deposits).map(k=>({k,...S.deposits[k]})),
    obstacles:Object.keys(S.obstacles),
    buildings:Object.keys(S.cells).map(k=>serializeB(S.cells[k]))
  };
}

function validateSnap(data){
  if(!data||typeof data!=="object")throw new Error("Not an object");
  if(data.v!==1)throw new Error("Unsupported version");
  if(!(data.w>4&&data.h>4&&data.w<=80&&data.h<=60))throw new Error("Bad grid");
  if(!Array.isArray(data.buildings))throw new Error("Missing buildings");
  for(const b of data.buildings){
    if(!BDEFS[b.type]||BDEFS[b.type].tool)throw new Error("Bad building "+b.type);
    if(!Number.isFinite(b.x)||!Number.isFinite(b.y))throw new Error("Bad coord");
  }
  return true;
}

function applySnap(data){
  validateSnap(data);
  S.w=data.w;S.h=data.h;S.seed=data.seed;S.tick=data.tick||0;S.time=data.time||0;
  S.paused=!!data.paused;S.speed=data.speed||1;S.beltMul=data.beltMul||1;S.machMul=data.machMul||1;
  S.density=data.density||"items";S.costMode=data.costMode||"free";S.pwrDiff=data.pwrDiff||"normal";
  S.mode=data.mode||"sandbox";S.mission=data.mission||0;S.spent=data.spent||0;S.budget=data.budget||0;
  S.completed=!!data.completed;S.score=data.score||0;
  S.delivered=data.delivered||{};S.produced=data.produced||{};S.consumed=data.consumed||{};
  S.cells=Object.create(null);S.deposits=Object.create(null);S.obstacles=Object.create(null);
  S.events=[];S.history=[];S.future=[];S.sel=null;
  for(const d of data.deposits||[])S.deposits[d.k]={item:d.item,amount:d.amount,max:d.max,regen:d.regen};
  for(const k of data.obstacles||[])S.obstacles[k]=1;
  for(const raw of data.buildings){
    if(!inb(raw.x,raw.y))continue;
    const b=newBuilding(raw.type,raw.x,raw.y,raw.dir,raw);
    b.inBuf=raw.inBuf||emptyBuf();b.outBuf=raw.outBuf||emptyBuf();
    b.items=raw.items||[];b.progress=raw.progress||0;b.fuel=raw.fuel||0;b.tier=raw.tier||1;
    S.cells[key(b.x,b.y)]=b;
  }
  document.getElementById("modeSel").value=S.mode;
  document.getElementById("seedInp").value=S.seed;
  document.getElementById("speedRange").value=S.speed;
  document.getElementById("beltRange").value=S.beltMul;
  document.getElementById("machRange").value=S.machMul;
  document.getElementById("densSel").value=S.density;
  document.getElementById("costSel").value=S.costMode;
  document.getElementById("pwrDiff").value=S.pwrDiff;
  document.getElementById("gridSel").value=S.w+"x"+S.h;
  rebuildPower();sampleAnalytics();
}

function beltDragCommit(path){
  const cmds=[];
  for(const p of path){
    const ex=cell(p.x,p.y);
    if(ex&&ex.type==="belt"){ex.dir=p.dir;continue}
    const v=validPlace("belt",p.x,p.y);if(!v.ok)continue;
    const b=placeTool("belt",p.x,p.y,p.dir,null,true);
    if(b)cmds.push({op:"place",b:serializeB(b)});
  }
  if(cmds.length)pushHist({op:"batch",cmds});
}

function deleteArea(x0,y0,x1,y1){
  const cmds=[];
  for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)
    for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++){
      const b=cell(x,y);if(!b)continue;
      cmds.push({op:"remove",b:serializeB(b)});
      refund(b.type,b.tier);removeAt(x,y,true);
    }
  if(cmds.length){pushHist({op:"batch",cmds});sfx("del")}
}

let pointers=new Map();
function onDown(e){
  ensureAudio();
  try{canvas.setPointerCapture(e.pointerId)}catch(err){}
  const w=worldFromEvt(e);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY,w});
  if(pointers.size===2||S.tool==="pan"||e.button===1||e.shiftKey){
    S.drag={kind:"pan",lx:e.clientX,ly:e.clientY};return;
  }
  if(S.tool==="select"){
    if(cell(w.gx,w.gy)){inspect(cell(w.gx,w.gy));S.drag={kind:"idle"}}
    else {S.drag={kind:"select",a:{x:w.gx,y:w.gy},b:{x:w.gx,y:w.gy}};inspect(null)}
    return;
  }
  if(S.tool==="copy"){
    const b=cell(w.gx,w.gy);
    if(b){S.copyGhost={type:b.type,dir:b.dir,recipe:b.recipe,cfg:deep(b.cfg||{}),filter:b.filter};S.tool=b.type;S.dir=b.dir;syncTools();toast("Copied "+b.type);sfx("ok")}
    return;
  }
  if(S.tool==="move"){
    const b=cell(w.gx,w.gy);
    if(b){S.moveGhost=serializeB(b);removeAt(b.x,b.y);refund(b.type,b.tier);S.tool=b.type;S.dir=b.dir;syncTools()}
    return;
  }
  if(S.tool==="delete"){
    S.drag={kind:"erase",x:w.gx,y:w.gy};
    const b=cell(w.gx,w.gy);if(b){refund(b.type,b.tier);removeAt(w.gx,w.gy)}
    return;
  }
  if(S.tool==="belt"||S.tool==="pole"){
    S.drag={kind:"stroke",type:S.tool,x0:w.gx,y0:w.gy,x1:w.gx,y1:w.gy};
    S.ghost={path:pathCells(w.gx,w.gy,w.gx,w.gy).map(p=>({...p,type:S.tool}))};
    return;
  }
  if(BDEFS[S.tool]&&!BDEFS[S.tool].tool){
    const extra=S.copyGhost&&S.copyGhost.type===S.tool?{recipe:S.copyGhost.recipe,cfg:S.copyGhost.cfg,filter:S.copyGhost.filter}:null;
    const b=placeTool(S.tool,w.gx,w.gy,S.dir,extra);
    if(b)inspect(b);
  }
}
function onMove(e){
  const w=worldFromEvt(e);
  const tip=BDEFS[S.tool]&&!BDEFS[S.tool].tool?`${BDEFS[S.tool].name} ${DIRS[S.dir].n}`:(cell(w.gx,w.gy)?(BDEFS[cell(w.gx,w.gy).type].name+" "+cell(w.gx,w.gy).status):"");
  if(tip){tipEl.style.display="block";tipEl.style.left=(e.clientX+14)+"px";tipEl.style.top=(e.clientY+14)+"px";tipEl.textContent=tip}
  else tipEl.style.display="none";
  if(!S.drag){
    if(BDEFS[S.tool]&&!BDEFS[S.tool].tool)S.ghost={type:S.tool,x:w.gx,y:w.gy,dir:S.dir};
    return;
  }
  if(S.drag.kind==="pan"){
    S.cam.x+=e.clientX-S.drag.lx;S.cam.y+=e.clientY-S.drag.ly;S.drag.lx=e.clientX;S.drag.ly=e.clientY;return;
  }
  if(S.drag.kind==="select"){S.drag.b={x:w.gx,y:w.gy};return}
  if(S.drag.kind==="erase"){
    if(w.gx!==S.drag.x||w.gy!==S.drag.y){
      S.drag.x=w.gx;S.drag.y=w.gy;
      const b=cell(w.gx,w.gy);if(b){refund(b.type,b.tier);removeAt(w.gx,w.gy)}
    }
    return;
  }
  if(S.drag.kind==="stroke"){
    S.drag.x1=w.gx;S.drag.y1=w.gy;
    S.ghost={path:pathCells(S.drag.x0,S.drag.y0,w.gx,w.gy).map(p=>({...p,type:S.drag.type}))};
  }
}
function onUp(e){
  const w=worldFromEvt(e);
  if(S.drag&&S.drag.kind==="stroke"){
    const path=pathCells(S.drag.x0,S.drag.y0,S.drag.x1,S.drag.y1);
    if(S.drag.type==="belt")beltDragCommit(path);
    else{
      const cmds=[];
      for(const p of path){
        if(cell(p.x,p.y))continue;
        const b=placeTool("pole",p.x,p.y,0,null,true);
        if(b)cmds.push({op:"place",b:serializeB(b)});
      }
      if(cmds.length)pushHist({op:"batch",cmds});
    }
  }
  if(S.drag&&S.drag.kind==="select"&&S.drag.b){
    const set=[];
    const x0=Math.min(S.drag.a.x,S.drag.b.x),x1=Math.max(S.drag.a.x,S.drag.b.x);
    const y0=Math.min(S.drag.a.y,S.drag.b.y),y1=Math.max(S.drag.a.y,S.drag.b.y);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const b=cell(x,y);if(b)set.push(b)}
    S.selSet=set.length?set:null;
    if(set.length===1)inspect(set[0]);
  }
  S.drag=null;S.ghost=null;pointers.delete(e.pointerId);
  try{canvas.releasePointerCapture(e.pointerId)}catch(err){}
}
function onWheel(e){
  e.preventDefault();
  const old=S.cam.z;
  S.cam.z=clamp(S.cam.z*(e.deltaY<0?1.1:0.9),0.4,2.4);
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  S.cam.x=mx-(mx-S.cam.x)*(S.cam.z/old);
  S.cam.y=my-(my-S.cam.y)*(S.cam.z/old);
}

function bindUI(){
  document.getElementById("btnPause").onclick=()=>{S.paused=!S.paused;document.getElementById("btnPause").textContent=S.paused?"Resume":"Pause"};
  document.getElementById("btnStep").onclick=()=>{S.paused=true;document.getElementById("btnPause").textContent="Resume";stepOnce(1/30);sfx("tick")};
  document.getElementById("btnReset").onclick=()=>{loadPreset(document.getElementById("presetSel").value,S.seed);toast("Reset")};
  document.getElementById("btnUndo").onclick=undo;
  document.getElementById("btnRedo").onclick=redo;
  document.getElementById("speedRange").oninput=e=>{S.speed=+e.target.value;document.getElementById("speedLbl").textContent=S.speed.toFixed(2)+"×"};
  document.getElementById("beltRange").oninput=e=>{S.beltMul=+e.target.value};
  document.getElementById("machRange").oninput=e=>{S.machMul=+e.target.value};
  document.getElementById("densSel").onchange=e=>{S.density=e.target.value};
  document.getElementById("costSel").onchange=e=>{S.costMode=e.target.value};
  document.getElementById("pwrDiff").onchange=e=>{S.pwrDiff=e.target.value};
  document.getElementById("seedInp").onchange=e=>{S.seed=+e.target.value||1337};
  document.getElementById("gridSel").onchange=()=>{if(confirm("Resize and reload preset?"))loadPreset(document.getElementById("presetSel").value,S.seed)};
  document.getElementById("presetSel").onchange=e=>{if(S.mode==="sandbox")loadPreset(e.target.value,S.seed)};
  document.getElementById("modeSel").onchange=e=>{
    S.mode=e.target.value;
    if(S.mode==="campaign")loadMission(S.mission);else{S.costMode="free";document.getElementById("costSel").value="free";loadPreset(document.getElementById("presetSel").value,S.seed)}
  };
  document.getElementById("missionSel").onchange=e=>{if(S.mode==="campaign")loadMission(+e.target.value)};
  document.getElementById("btnSave").onclick=exportJSON;
  document.getElementById("btnLoad").onclick=()=>document.getElementById("io").click();
  document.getElementById("io").onchange=ev=>{
    const f=ev.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{importShare(String(rd.result));toast("Loaded")}catch(err){toast("Invalid factory: "+err.message)}};
    rd.readAsText(f);
  };
  document.getElementById("btnExportPng").onclick=exportPNG;
  document.getElementById("btnShare").onclick=shareCode;
  document.getElementById("btnImportTxt").onclick=()=>{
    const t=prompt("Paste CL1 share code or JSON");
    if(!t)return;
    try{importShare(t);toast("Imported")}catch(err){toast("Invalid: "+err.message)}
  };
  document.getElementById("btnSlotSave").onclick=()=>saveSlot(document.getElementById("slotSel").value);
  document.getElementById("btnSlotLoad").onclick=()=>loadSlot(document.getElementById("slotSel").value);
  document.getElementById("btnHelp").onclick=()=>showModal("Cinderline",
    "Drag belts to route items. R rotates, Del deletes, F copies, U upgrades. Space pauses, . steps. Middle-drag or Pan pans. Q/E rotate the ghost. Campaign pays a construction budget; sandbox is free. Default starter already extracts, smelts, powers, and delivers plates.",
    "Close","Hints",()=>{});
  ["ovFlow","ovGraph","ovPower","ovUtil","ovCong","ovBlock","ovStatus"].forEach(id=>{
    const el=document.getElementById(id);
    const map={ovFlow:"flow",ovGraph:"graph",ovPower:"power",ovUtil:"util",ovCong:"cong",ovBlock:"block",ovStatus:"status"};
    el.onchange=()=>{S.overlay[map[id]]=el.checked};
  });
  canvas.addEventListener("pointerdown",onDown);
  canvas.addEventListener("pointermove",onMove);
  canvas.addEventListener("pointerup",onUp);
  canvas.addEventListener("pointercancel",onUp);
  canvas.addEventListener("wheel",onWheel,{passive:false});
  canvas.addEventListener("contextmenu",e=>{e.preventDefault();S.dir=(S.dir+1)&3;if(S.ghost)S.ghost.dir=S.dir});
  window.addEventListener("keydown",e=>{
    if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA"))return;
    const k=e.key;
    if(k===" "){e.preventDefault();document.getElementById("btnPause").click()}
    if(k==="."||k===">")document.getElementById("btnStep").click();
    if(k==="r"||k==="R"){
      if(S.sel)rotateAt(S.sel.x,S.sel.y);else S.dir=(S.dir+1)&3;
    }
    if(k==="q"||k==="Q")S.dir=(S.dir+3)&3;
    if(k==="e"||k==="E")S.dir=(S.dir+1)&3;
    if(k==="f"||k==="F")S.tool="copy";
    if(k==="u"||k==="U"){if(S.sel)upgradeAt(S.sel.x,S.sel.y)}
    if(k==="Delete"||k==="Backspace"){
      if(S.selSet&&S.selSet.length){
        const cmds=S.selSet.map(b=>({op:"remove",b:serializeB(b)}));
        for(const b of S.selSet){refund(b.type,b.tier);removeAt(b.x,b.y,true)}
        pushHist({op:"batch",cmds});S.selSet=null;inspect(null);sfx("del");
      }else if(S.sel){refund(S.sel.type,S.sel.tier);removeAt(S.sel.x,S.sel.y);inspect(null)}
    }
    if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();undo()}
    if((e.ctrlKey||e.metaKey)&&k==="y"){e.preventDefault();redo()}
    if((e.ctrlKey||e.metaKey)&&k==="s"){e.preventDefault();exportJSON()}
    if(k==="Escape"){S.tool="select";S.ghost=null;S.selSet=null;syncTools()}
    if(k==="1")S.tool="select";
    if(k==="2")S.tool="belt";
    if(k==="3")S.tool="extractor";
    if(k==="4")S.tool="smelter";
    if(k==="5")S.tool="assembler";
    if(k==="0")S.tool="delete";
    syncTools();
    const pan={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]};
    if(pan[k]&&!e.ctrlKey){S.cam.x-=pan[k][0]*28;S.cam.y-=pan[k][1]*28}
  });
  window.addEventListener("resize",()=>{});
  setInterval(()=>{if(!S.paused)autosave()},15000);
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  S._frames++;if(now-S._fpsT>500){S.fps=S._frames*1000/(now-S._fpsT);S._frames=0;S._fpsT=now}
  simTick(dt);
  render();
  if((S.tick&7)===0){hudText();if(S.sel)inspect(S.sel);renderCharts()}
  requestAnimationFrame(loop);
}

window.Cinderline={
  state:S,ITEMS,RECIPES,BDEFS,MISSIONS,
  snapshot,applySnap,validateSnap,loadPreset,loadMission,stepOnce,simTick,
  placeTool,rotateAt,removeAt,upgradeAt,inspect,shareCode,importShare,
  getHud(){return {fps:S.fps,tick:S.tick,speed:S.speed,items:(S.counts||{}).items,work:(S.counts||{}).work,stall:(S.counts||{}).stall,power:S.power,delivered:S.delivered,rates:S.rates,tool:S.tool,progress:deliveredGoal(),paused:S.paused}},
  getEntity(x,y){return cell(x,y)},
  bottlenecks:detectBottlenecks,
  pause(){S.paused=true},play(){S.paused=false},
  setSpeed(v){S.speed=v;document.getElementById("speedRange").value=v}
};

function init(){
  buildTools();fillMissions();bindUI();
  try{
    const auto=localStorage.getItem("cinderline-auto");
    if(auto&&location.hash==="#resume"){applySnap(JSON.parse(auto))}
    else loadPreset("starter",1337);
  }catch(e){loadPreset("starter",1337)}
  document.getElementById("presetSel").value="starter";
  requestAnimationFrame(loop);
}
init();
})();
</script>
