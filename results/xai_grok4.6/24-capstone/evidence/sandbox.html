<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ut Pendet sandbox iframe</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; }
    iframe { width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe
    src="../index.html"
    sandbox="allow-scripts allow-downloads"
    referrerpolicy="no-referrer"
  ></iframe>
</body>
</html>
