<!DOCTYPE html><html><body>
<script>
window.__errs=[];
window.onerror=function(msg,src,line,col){ window.__errs.push(String(msg)+' @'+line+':'+col); return false; };
fetch('index.html').then(r=>r.text()).then(t=>{
  const body = t.match(/<body>([\s\S]*)<\/body>/)[1];
  document.open(); document.write('<!DOCTYPE html><html><head></head><body>'+body+'</body></html>'); document.close();
}).catch(e=>window.__errs.push('fetchfail '+e));
</script>
</body></html>
