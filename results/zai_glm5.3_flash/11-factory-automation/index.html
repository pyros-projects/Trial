<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>FLOWWORKS — Factory Automation &amp; Logistics</title>
<style>
:root{
  --bg:#0b0e12; --panel:#12161e; --panel2:#151b24; --line:#2a313c; --line2:#334052;
  --ink:#dfe7ee; --dim:#8fa3b8; --faint:#647689; --acc:#ffb454; --acc2:#ffd9a0;
  --good:#3fae6a; --bad:#e05252; --warn:#ffd166;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;width:100%;height:100%;overscroll-behavior:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.hidden{display:none !important}
kbd{background:#1d2733;border:1px solid #3a4656;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:10.5px;font-family:ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;color:#cfe0f0}
.dim{color:var(--dim)} .faint{color:var(--faint)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--acc)}
small{font-size:10.5px}
/* ---------- top bar ---------- */
#topbar{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;padding:5px 8px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(#12161ef2,#12161ed0);border-bottom:1px solid var(--line);z-index:20;min-height:40px}
.brand{font-weight:800;letter-spacing:2px;font-size:13px;color:var(--acc);margin-right:2px;white-space:nowrap}
.brand span{color:var(--ink)}
#hud{display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.chip{display:inline-flex;gap:4px;align-items:center;background:#1a212b;border:1px solid var(--line);border-radius:6px;
  padding:2px 7px;font-size:11px;white-space:nowrap;line-height:16px}
.chip b{color:var(--acc);font-weight:600}
.chip .pbar{width:44px;height:5px;background:#0d1116;border-radius:3px;overflow:hidden;display:inline-block}
.chip .pbar i{display:block;height:100%;background:linear-gradient(90deg,#3fae6a,#ffd166)}
.tbg{display:flex;gap:4px;align-items:center}
.btn{background:#1c2530;border:1px solid var(--line2);color:#cfe0f0;border-radius:6px;padding:4px 9px;font-size:12px;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:16px;white-space:nowrap}
.btn:hover{background:#263444;border-color:#4a5f78}
.btn:active{transform:translateY(1px)}
.btn.primary{background:#7a4b12;border-color:#b47a2a;color:var(--acc2)}
.btn.active{background:#204a35;border-color:#3f8f63;color:#b9ecd0}
.btn.small{padding:2px 7px;font-size:11px}
.btn.ghostb{background:transparent}
select.ctl{background:#1c2530;color:#cfe0f0;border:1px solid var(--line2);border-radius:6px;padding:3px 6px;font-size:12px;outline:none}
/* ---------- palette ---------- */
#palette{position:absolute;left:8px;top:46px;display:flex;flex-direction:column;gap:5px;z-index:15;max-height:calc(100% - 100px);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.pcat{display:flex;flex-direction:column;gap:3px;background:#12161eee;border:1px solid var(--line);border-radius:10px;padding:5px}
.pcat h4{margin:0 0 1px 2px;font-size:9px;color:var(--faint);letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.tool{width:54px;height:50px;border-radius:8px;background:#1a212b;border:1px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;cursor:pointer;position:relative;color:#cfe0f0;padding:0}
.tool:hover{border-color:#4a5f78;background:#223041}
.tool.active{border-color:var(--acc);background:#3a2c14;box-shadow:0 0 0 1px #ffb45466}
.tool canvas{width:30px;height:30px}
.tool .gl{font-size:20px;line-height:30px;height:30px}
.tool .lb{font-size:8.5px;color:#9db1c5;line-height:11px}
.tool .ky{position:absolute;top:1px;right:4px;font-size:8px;color:var(--faint)}
.tool .cost{position:absolute;bottom:1px;right:4px;font-size:8px;color:#ffb45499}
#hint{position:absolute;left:8px;bottom:8px;font-size:11px;background:#12161ed8;padding:4px 9px;border-radius:7px;
  border:1px solid var(--line);max-width:44vw;z-index:15;color:var(--dim);line-height:1.5}
#hint b{color:var(--acc2);font-weight:600}
/* ---------- panels ---------- */
#analytics{position:absolute;right:0;top:46px;bottom:0;width:312px;background:#10151bee;border-left:1px solid var(--line);
  z-index:18;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px;transform:translateX(102%);transition:transform .18s ease;scrollbar-width:thin}
#analytics.open{transform:none}
.sec{background:var(--panel2);border:1px solid #262f3b;border-radius:9px;padding:7px 8px;font-size:11px;flex-shrink:0}
.sec h3{margin:0 0 5px;font-size:9.5px;letter-spacing:1.2px;color:var(--dim);text-transform:uppercase;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sec h3 .x{cursor:pointer;color:var(--faint);font-size:12px;padding:0 3px}
.sec h3 .x:hover{color:var(--ink)}
.bar{height:6px;background:#0d1116;border-radius:3px;overflow:hidden;margin:2px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#3fae6a,#ffd166);transition:width .3s}
.bar.red i{background:linear-gradient(90deg,#a13d3d,#e05252)}
table.rates{width:100%;border-collapse:collapse;font-size:10.5px}
table.rates td,table.rates th{padding:1.5px 4px;text-align:right;font-weight:400}
table.rates th{color:var(--dim);text-align:right;font-size:9.5px;text-transform:uppercase;letter-spacing:.5px}
table.rates td:first-child,table.rates th:first-child{text-align:left}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:baseline}
.chipsrow{display:flex;gap:3px;flex-wrap:wrap;margin:4px 0}
.chartbtn{background:#1a212b;border:1px solid var(--line);border-radius:5px;color:#9db1c5;font-size:9.5px;padding:2px 6px;cursor:pointer}
.chartbtn.active{border-color:var(--acc);color:var(--acc2);background:#3a2c14}
.rangerow{display:flex;align-items:center;gap:6px;font-size:10.5px;margin:3px 0;color:var(--dim)}
.rangerow input[type=range]{flex:1;accent-color:var(--acc);height:14px}
.rangerow .val{width:38px;text-align:right;color:var(--ink);font-family:ui-monospace,Menlo,monospace;font-size:10px}
.togglerow{display:flex;align-items:center;justify-content:space-between;font-size:11px;margin:3px 0;color:var(--dim)}
#analytics canvas{width:100%;display:block}
/* ---------- inspector ---------- */
#inspector{position:absolute;left:72px;top:52px;width:258px;background:#12171fee;border:1px solid var(--line2);
  border-radius:11px;z-index:19;padding:9px 10px;font-size:11.5px;box-shadow:0 8px 30px #000a}
#inspector h3{margin:0 0 6px;font-size:13px;color:var(--acc);display:flex;align-items:center;gap:7px}
#inspector h3 canvas{width:26px;height:26px}
#inspector .row{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
#inspector .kv{display:flex;justify-content:space-between;margin:2px 0;color:var(--dim)}
#inspector .kv b{color:var(--ink);font-weight:500}
#inspector select{width:100%;background:#1c2530;color:#cfe0f0;border:1px solid var(--line2);border-radius:6px;padding:3px 6px;font-size:11.5px;margin-top:3px}
.iobadges{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.iob{background:#0d1116;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:10px;display:inline-flex;gap:4px;align-items:center}
.iob .sw{margin-right:0}
/* ---------- tooltip / toasts / modal ---------- */
#tooltip{position:fixed;pointer-events:none;background:#0d1218f5;border:1px solid #3a4656;padding:5px 9px;border-radius:7px;
  font-size:11px;z-index:55;max-width:250px;display:none;line-height:1.5;box-shadow:0 6px 18px #000c}
#tooltip b{color:var(--acc2)}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:65;align-items:center;pointer-events:none}
.toast{background:#1b2430f0;border:1px solid #3a4656;padding:6px 14px;border-radius:9px;font-size:12px;animation:tin .18s ease;box-shadow:0 6px 20px #000a;max-width:80vw;text-align:center}
.toast.good{border-color:#3f8f63}.toast.bad{border-color:#a13d3d}.toast.warn{border-color:#b08a2e}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.modal-bg{position:fixed;inset:0;background:#05070ad9;z-index:70;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#121820;border:1px solid var(--line2);border-radius:13px;padding:16px 18px;width:min(680px,94vw);
  max-height:88vh;overflow-y:auto;font-size:12.5px;line-height:1.55;scrollbar-width:thin}
.modal h2{margin:0 0 10px;color:var(--acc);font-size:17px;letter-spacing:.5px}
.modal h4{margin:12px 0 5px;font-size:12px;color:var(--acc2)}
.modal .kv{display:flex;justify-content:space-between;margin:3px 0;color:var(--dim)}
.modal .kv b{color:var(--ink);font-weight:500}
.modal .btnrow{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap;justify-content:flex-end}
.preset-card{display:flex;gap:11px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;margin-bottom:7px;align-items:center}
.preset-card:hover{border-color:var(--acc);background:#1a2130}
.preset-card canvas{width:52px;height:52px;flex-shrink:0;border-radius:8px;background:#0d1116}
.preset-card .t{font-weight:700;font-size:13px}
.preset-card .d{color:var(--dim);font-size:11px;margin-top:2px}
.stage-card{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:7px}
.stage-card.locked{opacity:.45}
.stage-card.done{border-color:#3f8f63}
.fieldrow{display:flex;gap:9px;align-items:center;margin:7px 0;flex-wrap:wrap}
.fieldrow label{color:var(--dim);font-size:11.5px;min-width:90px}
.fieldrow input[type=number],.fieldrow input[type=text],.fieldrow select{background:#1c2530;color:#cfe0f0;border:1px solid var(--line2);border-radius:6px;padding:4px 7px;font-size:12px;outline:none}
.fieldrow input[type=text]{flex:1}
textarea.sharebox{width:100%;background:#0d1116;color:#b8ccdf;border:1px solid var(--line);border-radius:7px;
  padding:7px;font-size:10.5px;font-family:ui-monospace,Menlo,monospace;min-height:64px;resize:vertical;-webkit-user-select:text;user-select:text}
.slotrow{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:5px;font-size:11.5px}
.slotrow .nm{flex:1;font-weight:600}
.slotrow .meta{color:var(--faint);font-size:10px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2b3646;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
@media (max-width:920px){
  #palette{flex-direction:row;left:0;right:0;top:auto;bottom:0;max-height:none;overflow-x:auto;overflow-y:hidden;padding:5px 6px;border-top:1px solid var(--line);background:#10151ef0}
  .pcat{flex-direction:row;flex-shrink:0}
  .pcat h4{display:none}
  #hint{bottom:78px;left:6px;max-width:70vw}
  #analytics{width:min(92vw,340px);top:88px}
  #inspector{left:8px;top:auto;bottom:80px;width:min(300px,86vw)}
  .brand{display:none}
  #hud .chip{font-size:10px;padding:1px 5px}
}
@media (max-width:560px){
  .hide-sm{display:none !important}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="topbar">
  <div class="brand">FLOW<span>WORKS</span></div>
  <div id="hud"></div>
  <div class="tbg" id="simctl"></div>
  <div class="tbg" id="menuctl"></div>
</div>
<div id="palette"></div>
<div id="hint"></div>
<div id="analytics"></div>
<div id="inspector" class="hidden"></div>
<div id="tooltip"></div>
<div id="toasts"></div>
<div id="modals"></div>
<noscript><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0e12;color:#dfe7ee">FLOWWORKS requires JavaScript.</div></noscript>
<script>
'use strict';
/* =====================================================================
   FLOWWORKS — single-file factory automation & logistics game
   All simulation, rendering, audio and UI are embedded. No external deps.
   ===================================================================== */
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function RNG(seed){const f=mulberry32(typeof seed==='number'?(seed>>>0):xmur3(String(seed))());return{f,range:(a,b)=>a+(b-a)*f(),int:(a,b)=>Math.floor(a+(b-a+1)*f()),pick:a=>a[Math.floor(f()*a.length)]};}
const fmtN=n=>{n=Math.round(n);if(Math.abs(n)>=1e6)return (n/1e6).toFixed(2)+'M';if(Math.abs(n)>=1e4)return (n/1e3).toFixed(1)+'k';return String(n);};
const fmtW=w=>Math.abs(w)>=1000?(w/1000).toFixed(2)+' kW':Math.round(w)+' W';
const fmtT=t=>{const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0');};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};
function download(name,url){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),150);}
/* ---------------- dirs: 0=N 1=E 2=S 3=W ---------------- */
const DIRV=[[0,-1],[1,0],[0,1],[-1,0]];
const OPP=[2,3,0,1], LEFT=[3,0,1,2], RIGHT=[1,2,3,0];
/* ---------------- items ---------------- */
const ITEMS={
  iron_ore:   {n:'Iron Ore',    c:'#aeb6c2', shape:'ore'},
  copper_ore: {n:'Copper Ore',  c:'#e08a4a', shape:'ore'},
  coal:       {n:'Coal',        c:'#56565e', shape:'ore'},
  iron_plate: {n:'Iron Plate',  c:'#cdd6e0', shape:'plate'},
  copper_plate:{n:'Copper Plate',c:'#eda45f', shape:'plate'},
  gear:       {n:'Iron Gear',   c:'#9fb6c9', shape:'gear'},
  wire:       {n:'Wire Coil',   c:'#f0b26a', shape:'coil'},
  circuit:    {n:'Circuit',     c:'#5ecb7a', shape:'chip'},
  module:     {n:'Logic Module',c:'#c96ae0', shape:'chip'},
};
/* ---------------- recipes ---------------- */
const RECIPES={
  smelter:[
    {id:'iron_plate', name:'Iron Smelting', in:{iron_ore:1}, out:{iron_plate:1}, time:2, pw:40},
    {id:'copper_plate', name:'Copper Smelting', in:{copper_ore:1}, out:{copper_plate:1}, time:2, pw:40},
  ],
  assembler:[
    {id:'gear', name:'Iron Gear', in:{iron_plate:2}, out:{gear:1}, time:2.5, pw:70},
    {id:'wire', name:'Wire Coil', in:{copper_plate:1}, out:{wire:2}, time:1.5, pw:55},
    {id:'circuit', name:'Circuit Board', in:{iron_plate:1, wire:3}, out:{circuit:1}, time:4, pw:90},
    {id:'module', name:'Logic Module', in:{gear:2, circuit:2}, out:{module:1}, time:6, pw:130},
  ]
};
/* ---------------- building defs ---------------- */
const BDEFS={
  belt:     {name:'Conveyor', cat:'Logistics', cost:5,   desc:'Moves items. Drag to lay lines with automatic corners.', tiers:[{speed:1.6},{speed:2.8,cost:14}]},
  splitter: {name:'Splitter', cat:'Logistics', cost:25,  desc:'1 input (back) → 3 outputs (round-robin).', tiers:[{}]},
  merger:   {name:'Merger',   cat:'Logistics', cost:25,  desc:'3 inputs (sides+back) → 1 output (front).', tiers:[{}]},
  inserter: {name:'Inserter', cat:'Logistics', cost:30,  desc:'Swings items from the cell behind to the cell in front.', tiers:[{swing:0.55},{swing:0.30,cost:65}]},
  storage:  {name:'Storage',  cat:'Logistics', cost:60,  desc:'Buffers mixed items; releases toward its facing.', tiers:[{cap:120},{cap:400,cost:160}]},
  port:     {name:'Delivery Port', cat:'Logistics', cost:0, desc:'Delivery target. Items entering here count toward contracts.', tiers:[{}]},
  extractor:{name:'Extractor',cat:'Production',cost:80,  desc:'Mines ore from a resource deposit. Needs power.', tiers:[{rate:0.5,pw:40},{rate:0.8,pw:66,cost:190}]},
  smelter:  {name:'Smelter',  cat:'Production',cost:120, desc:'Smelts ore into plates. Needs power.', tiers:[{spd:1,pwm:1},{spd:1.6,pwm:1.5,cost:290}]},
  assembler:{name:'Assembler',cat:'Production',cost:200, desc:'Crafts components from plates. Needs power.', tiers:[{spd:1,pwm:1},{spd:1.6,pwm:1.5,cost:460}]},
  generator:{name:'Generator',cat:'Power',     cost:150, desc:'Burns coal for 100 kW. Feed it coal by belt or inserter.', tiers:[{out:100,burn:8},{out:175,burn:8,cost:340}]},
  pole:     {name:'Power Pole',cat:'Power',    cost:10,  desc:'Networks nearby machines (radius 3.5). Poles link up to 6.5 tiles.', tiers:[{}]},
};
const BUILD_ORDER=['belt','splitter','merger','inserter','storage','port','extractor','smelter','assembler','generator','pole'];
const KEYMAP={belt:'1',splitter:'2',merger:'3',inserter:'4',storage:'5',extractor:'6',smelter:'7',assembler:'8',generator:'9',pole:'0',port:'P'};
const POWERED={extractor:1,smelter:1,assembler:1};
const OUTCAP=8, FUELCAP=6, SUPPLY_R=3.5, LINK_R=6.5;
const INCAP=b=>b.ty==='smelter'?4:6;
const GAP=()=>G.sim.gap;
const tierStat=(b)=>BDEFS[b.ty].tiers[Math.min(b.tier,BDEFS[b.ty].tiers.length)-1]||{};
/* ---------------- audio (procedural, Web Audio) ---------------- */
const Snd={
  ctx:null,master:null,hum:null,humG:null,last:{},
  ensure(){
    if(this.ctx){ if(this.ctx.state==='suspended') this.ctx.resume(); return; }
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      this.ctx=new AC();
      this.master=this.ctx.createGain(); this.master.gain.value=G.settings.vol; this.master.connect(this.ctx.destination);
      this.hum=this.ctx.createOscillator(); this.hum.type='sawtooth'; this.hum.frequency.value=52;
      const hf=this.ctx.createBiquadFilter(); hf.type='lowpass'; hf.frequency.value=180;
      this.humG=this.ctx.createGain(); this.humG.gain.value=0;
      this.hum.connect(hf); hf.connect(this.humG); this.humG.connect(this.master); this.hum.start();
    }catch(e){}
  },
  setVol(v){G.settings.vol=v; if(this.master) this.master.gain.value=v;},
  tone(f,dur,type,vol,slide,delay){
    if(!this.ctx||!G.settings.sound) return;
    try{
      const t0=this.ctx.currentTime+(delay||0);
      const o=this.ctx.createOscillator(), g=this.ctx.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(f,t0);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+dur);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(Math.max(0.001,vol||0.15),t0+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
      o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0+dur+0.02);
    }catch(e){}
  },
  play(name){
    if(!G.settings.sound) return; this.ensure(); if(!this.ctx) return;
    const now=performance.now(); if(this.last[name] && now-this.last[name]<70) return; this.last[name]=now;
    switch(name){
      case 'ui': this.tone(700,0.045,'square',0.06); break;
      case 'place': this.tone(185,0.09,'triangle',0.22,70); break;
      case 'delete': this.tone(150,0.11,'square',0.15,-80); break;
      case 'rotate': this.tone(520,0.05,'square',0.08,120); break;

function newBuild(ty,x,y,dir,tier){

function addBuilding(ty,x,y,dir,tier,opts){
  opts=opts||{};
  if(!BDEFS[ty]||!inGrid(x,y)) return null;
  const b=newBuild(ty,x,y,dir,tier);

function removeBuilding(b,opts){
  opts=opts||{};
  const c=G.cells[b.y*G.W+b.x];
  if(c.b===b){ c.b=null; c.items=null; c.jam=0; }
  const i=G.buildings.indexOf(b); if(i>=0) G.buildings.splice(i,1);

function canPlace(ty,x,y){
  if(!BDEFS[ty]) return {ok:false,why:'Unknown structure'};
  if(!inGrid(x,y)) return {ok:false,why:'Out of bounds'};
  const c=G.cells[y*G.W+x];
  if(c.b) return {ok:false,why:'Occupied by '+BDEFS[c.b.ty].name};
  if(c.t===T_ROCK) return {ok:false,why:'Blocked by rocks (clear with Delete tool)'};
  if(ty==='extractor'){
    if(c.t< T_IRON||c.t>T_COAL) return {ok:false,why:'Extractor needs a resource deposit'};
    if(c.amt<=0) return {ok:false,why:'Deposit depleted'};
  } else if(c.t>=T_IRON&&c.t<=T_COAL) return {ok:false,why:'Blocked by '+TERR_NAME[c.t]};
  return {ok:true};
}
/* ---------------- map generation ---------------- */
function applySpec(spec,seed){
  const R=RNG(seed||'map');
  const dx=Math.floor((G.W-64)/2), dy=Math.floor((G.H-64)/2);
  (spec.dep||[]).forEach(d=>{
    const [x,y,w,h,ty,amt]=d;
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){
      const cx=x+i+dx, cy=y+j+dy;
      if(!inGrid(cx,cy)) continue;
      const c=G.cells[cy*G.W+cx];
      c.t=({iron:T_IRON,copper:T_COPPER,coal:T_COAL})[ty]; c.amt=Math.round(amt*(0.75+0.5*R.f()));
    }
  });
  (spec.rock||[]).forEach(d=>{
    const [x,y,w,h]=d;
    const R2=RNG('rock'+x+','+y+seed);
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){
      const cx=x+i+dx, cy=y+j+dy;
      if(!inGrid(cx,cy)) continue;
      const c=G.cells[cy*G.W+cx];
      if(c.t===0 && R2.f()<0.85) c.t=T_ROCK;
    }
  });
}
/* preset builder api */
function makeAPI(){
  const api={
    dep:(x,y,w,h,ty,amt)=>applySpec({dep:[[x,y,w,h,ty,amt]]}),
    rock:(x,y,w,h)=>applySpec({rock:[[x,y,w,h]]},G.seed),
    put(ty,x,y,dir,tier){ const c=cellAt(x,y); if(!c||c.b) return null; return addBuilding(ty,x,y,(dir===undefined?1:dir),tier||1,{silent:true}); },
    run(x1,y1,x2,y2){ // straight belt run; returns belts
      const out=[];
      const dx=Math.sign(x2-x1), dy=Math.sign(y2-y1);
      let x=x1,y=y1, dir = dx>0?1:dx<0?3:dy>0?2:0;
      const d = dir;
      while(true){
        const b=api.put('belt',x,y,d); if(b) out.push(b);
        if(x===x2&&y===y2) break;
        x+=dx; y+=dy;
        if(out.length>400) break;
      }
      return out;
    },
    pre(belts,ty,frac){
      (belts||[]).forEach(b=>{
        const c=G.cells[b.y*G.W+b.x]; if(!c.b||c.b.ty!=='belt') return;
        c.items=[]; let p=1-GAP()*0.6;
        const n=Math.ceil((1/(GAP()))*(frac===undefined?1:frac));
        for(let i=0;i<n&&p>0;i++){ c.items.push({ty,p,l:0,e:OPP[b.dir]}); p-=GAP(); }
      });
    }
  };
  return api;
}

/* =====================================================================
   PART 3 — simulation core
   ===================================================================== */
const DT=0.05;
function edgeCenter(x,y,s){ const dv=DIRV[s]; return [x+0.5+dv[0]*0.5, y+0.5+dv[1]*0.5]; }
function beltItemPos(b,it){
  const x0=b.x,y0=b.y;
  if(it.e===OPP[b.dir]){
    const dv=DIRV[b.dir], px=-dv[1], py=dv[0];
    return [x0+0.5-dv[0]*0.5+dv[0]*it.p+px*it.l, y0+0.5-dv[1]*0.5+dv[1]*it.p+py*it.l];
  }
  const E=edgeCenter(x0,y0,it.e), X=edgeCenter(x0,y0,b.dir);
  const C=(it.e===0||it.e===2)?[X[0],E[1]]:[E[0],X[1]];
  const u=1-it.p;
  const bx=u*u*E[0]+2*u*it.p*C[0]+it.p*it.p*X[0];
  const by=u*u*E[1]+2*u*it.p*C[1]+it.p*it.p*X[1];
  let tx=2*u*(C[0]-E[0])+2*it.p*(X[0]-C[0]), ty=2*u*(C[1]-E[1])+2*it.p*(X[1]-C[1]);
  const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
  const lat=it.l*(1-it.p*0.6);
  return [bx-ty*lat, by+tx*lat];
}
function junctionIns(b){
  if(b.ty==='splitter') return [OPP[b.dir]];
  if(b.ty==='merger') return [OPP[b.dir],LEFT[b.dir],RIGHT[b.dir]];
  return [];
}
function junctionOuts(b){
  if(b.ty==='splitter') return [b.dir,LEFT[b.dir],RIGHT[b.dir]];
  if(b.ty==='merger') return [b.dir];
  return [];
}
/* ---- admission: can building b accept item ty entering through side s? ---- */
function admitItem(b,ty,s,o){
  o=o||{};
  switch(b.ty){
    case 'belt':{
      if(b.dir===s) return false; // belt exits back through entry edge -> invalid connection
      const c=G.cells[b.y*G.W+b.x];
      if(!c.items) c.items=[];
      if(c.items.length && c.items[c.items.length-1].p<GAP()) return false;
      c.items.push({ty,p:0,l:clamp(o.l||0,-0.45,0.45),e:s});
      return true;
    }
    case 'smelter': case 'assembler':{
      if(s===b.dir) return false;
      const list=b.recipe?(RECIPES[b.ty].filter(r=>r.id===b.recipe)):RECIPES[b.ty];
      let wanted=false;
      for(const r of list){ if(r.in[ty]&&(b.in[ty]||0)<INCAP(b)){wanted=true;break;} }
      if(!wanted) return false;
      b.in[ty]=(b.in[ty]||0)+1;
      return true;
    }
    case 'generator':
      if(ty!=='coal'||b.fuel>=FUELCAP) return false;
      b.fuel++; return true;
    case 'storage':{
      if(stoCount(b)>=tierStat(b).cap) return false;
      b.sto[ty]=(b.sto[ty]||0)+1; return true;
    }
    case 'port': deliverItem(ty,b); return true;
    case 'splitter': case 'merger':{
      if(junctionIns(b).indexOf(s)<0) return false;
      if(b.buf.length>=3) return false;
      b.buf.push(ty); return true;
    }
    default: return false;
  }
}
function activeRecipe(b){
  const list=RECIPES[b.ty]; if(!list) return null;
  if(b.prog>0&&b.active){ return list.find(r=>r.id===b.active)||null; }
  if(b.recipe){ return list.find(r=>r.id===b.recipe)||null; }
  for(const r of list){
    let ok=true;
    for(const k in r.in) if((b.in[k]||0)<r.in[k]){ok=false;break;}
    if(ok) return r;
  }
  return null;
}
/* ---- delivery ---- */
function deliverItem(ty,b){
  G.delivered[ty]=(G.delivered[ty]||0)+1;
  G.deliveredTotal++; G.delAcc++;
  addFx('spark',b.x+0.5,b.y+0.5,ITEMS[ty].c);
  Snd.play('deliver');
  checkContract();
}
function checkContract(){
  if(G.mode!=='campaign'||!G.contract||G.contractDone) return;
  const tg=G.contract.targets;
  for(const k in tg) if((G.delivered[k]||0)<tg[k]) return;
  completeStage();

/* ---- power ---- */
function rebuildNetworks(){
  const poles=G.buildings.filter(b=>b.ty==='pole');
  const par=new Map(poles.map(p=>[p.id,p.id]));
  const find=id=>{while(par.get(id)!==id){par.set(id,par.get(par.get(id)));id=par.get(id);}return id;};
  for(let i=0;i<poles.length;i++)for(let j=i+1;j<poles.length;j++){
    const a=poles[i],c=poles[j];
    if(dist2(a.x,a.y,c.x,c.y)<=LINK_R*LINK_R){ const ra=find(a.id),rc=find(c.id); if(ra!==rc) par.set(ra,rc); }
  }
  const nets=[];
  const netOfRoot=new Map();
  for(const p of poles){
    const r=find(p.id);
    if(!netOfRoot.has(r)){ netOfRoot.set(r,nets.length); nets.push({id:nets.length,sup:0,dem:0,sat:1,load:0,poles:[]}); }
    p.net=netOfRoot.get(r); nets[p.net].poles.push(p);
  }
  for(const b of G.buildings){
    if(b.ty==='pole') continue;
    b.net=-1;
    if(!(POWERED[b.ty]||b.ty==='generator')) continue;
    let best=-1,bd=Infinity;
    for(const p of poles){
      const d=dist2(b.x,b.y,p.x,p.y);
      if(d<=SUPPLY_R*SUPPLY_R&&d<bd){bd=d;best=p.net;}
    }
    b.net=best;
  }
  G.nets=nets; G.netDirty=false;
}
function powerPass(){
  for(const n of G.nets){ n.sup=0; n.dem=0; }
  for(const b of G.buildings){
    b.want=false;
    if(b.ty==='generator'){
      if((b.burn>0||b.fuel>0)&&b.net>=0) G.nets[b.net].sup+=tierStat(b).out;
      continue;
    }
    if(!POWERED[b.ty]||b.net<0||!b.en) continue;
    let want=false;
    if(b.ty==='extractor'){
      const c=G.cells[b.y*G.W+b.x];
      want=c.amt>0&&outTotal(b)<OUTCAP;
    } else {
      const rec=activeRecipe(b);
      want=!!rec&&outTotal(b)<OUTCAP;
    }
    if(want){ b.want=true; G.nets[b.net].dem+=drawOf(b); }
  }
  const diff=G.sim.pwDiff;
  for(const n of G.nets){
    n.dem*=diff;
    n.sat=n.dem<=0?1:Math.min(1,n.sup/n.dem);
    n.load=n.sup>0?Math.min(1,n.dem/n.sup):0;
  }
}
function drawOf(b){
  const t=tierStat(b);
  if(b.ty==='extractor') return t.pw;
  const rec=activeRecipe(b);
  return rec?rec.pw*(t.pwm||1):0;
}
/* ---- per-building tick ---- */
function tickBuilding(b,dt){
  const net=b.net>=0?G.nets[b.net]:null;
  const sat=net?net.sat:(POWERED[b.ty]?0:1);
  b.sat=sat;
  switch(b.ty){
    case 'extractor':{
      if(!b.en){b.st='off';break;}
      const c=G.cells[b.y*G.W+b.x];
      if(c.amt<=0){b.st='depleted';break;}
      if(sat<=0){b.st='nopo';break;}
      tryPushOut(b,dt);
      if(outTotal(b)>=OUTCAP){b.st='blocked';ema(b,'B',dt);break;}
      const t=tierStat(b);
      b.prog+=dt*t.rate*G.sim.machMul*sat;
      b.st='working'; ema(b,'W',dt);
      if(b.prog>=1){
        b.prog=0; c.amt--;
        const ore=ORE_OF[c.t];
        b.out[ore]=(b.out[ore]||0)+1;
        prodAcc(ore);
      }
      tryPushOut(b,dt);
      break;
    }
    case 'smelter': case 'assembler':{
      if(!b.en){b.st='off';break;}
      if(sat<=0){b.st='nopo';break;}
      const rec=activeRecipe(b);
      if(!rec){b.st='starved';ema(b,'S',dt);break;}
      const t=tierStat(b);
      tryPushOut(b,dt);
      // completion
      if(b.prog>=rec.time){
        let fits=true;
        for(const k in rec.out) if((b.out[k]||0)+rec.out[k]>OUTCAP){fits=false;break;}
        if(!fits){b.st='blocked';ema(b,'B',dt);break;}
        for(const k in rec.out){ b.out[k]=(b.out[k]||0)+rec.out[k]; prodAcc(k); }
        b.prog=0; b.active=null;
      }
      // start
      if(b.prog===0){
        let can=true;
        for(const k in rec.in) if((b.in[k]||0)<rec.in[k]){can=false;break;}
        if(!can){b.st='starved';ema(b,'S',dt);break;}
        for(const k in rec.in){ b.in[k]-=rec.in[k]; consAcc(k); if(b.in[k]<=0) delete b.in[k]; }
        b.active=rec.id; b.prog=0.0001;
      }
      b.prog+=dt*t.spd*G.sim.machMul*sat;
      b.st='working'; ema(b,'W',dt);
      break;
    }
    case 'generator':{
      if(b.burn>0){
        b.burn-=dt*Math.max(net?net.load:0,0.04);
        if(b.burn<=0){
          if(b.fuel>0){b.fuel--;b.burn=tierStat(b).burn;}
          else b.burn=0;
        }
        b.st=b.burn>0?'working':'starved';
      } else if(b.fuel>0&&(net?net.load:0)>0){
        b.fuel--; b.burn=tierStat(b).burn; b.st='working';
      } else b.st=b.fuel>0?'idle':'starved';
      break;
    }
    case 'storage':{
      if(!b.en){b.st='off';break;}
      b.pushT+=dt;
      b.st=stoCount(b)>=tierStat(b).cap?'full':'idle';
      if(b.pushT>=0.35){
        b.pushT=0;
        const keys=Object.keys(b.sto);
        for(const k of keys){
          if(b.sto[k]>0){
            const nb=bAt(b.x+DIRV[b.dir][0],b.y+DIRV[b.dir][1]);
            if(nb&&admitItem(nb,k,OPP[b.dir])){ b.sto[k]--; if(b.sto[k]<=0)delete b.sto[k]; }
            break;
          }
        }
      }
      break;
    }
    case 'splitter': case 'merger':{
      if(b.buf.length){
        const outs=junctionOuts(b);
        for(let k=0;k<outs.length;k++){
          const s=outs[(b.rr+k)%outs.length];
          const nb=bAt(b.x+DIRV[s][0],b.y+DIRV[s][1]);
          if(nb&&admitItem(nb,b.buf[0],OPP[s])){ b.buf.shift(); b.rr=(b.rr+k+1)%outs.length; b.st='working'; break; }
        }
        if(b.buf.length>=3) b.st='blocked'; else if(b.buf.length) b.st='idle';
      } else b.st='idle';
      break;
    }
    case 'inserter': tickInserter(b,dt); break;
  }
}
function ema(b,k,dt){ const f=Math.min(1,dt/6); if(k==='W')b.emaW+=(1-b.emaW)*f; if(k==='B')b.emaB+=(1-b.emaB)*f; if(k==='S')b.emaS+=(1-b.emaS)*f; }
function prodAcc(ty){ G.prodAcc[ty]=(G.prodAcc[ty]||0)+1; G.produced[ty]=(G.produced[ty]||0)+1; }
function consAcc(ty){ G.consAcc[ty]=(G.consAcc[ty]||0)+1; G.consumed[ty]=(G.consumed[ty]||0)+1; }
function tryPushOut(b,dt){
  const keys=Object.keys(b.out).filter(k=>b.out[k]>0);
  if(!keys.length) return;
  const ty=keys[b.rr%keys.length];
  const dv=DIRV[b.dir];
  const nb=bAt(b.x+dv[0],b.y+dv[1]);
  if(nb&&admitItem(nb,ty,OPP[b.dir])){
    b.out[ty]--; if(b.out[ty]<=0)delete b.out[ty];
    b.rr=(b.rr+1)%Math.max(1,keys.length);
  } else if(b.st==='working') b.st='blocked';
}
function tickInserter(b,dt){
  if(!b.en){b.st='off';return;}
  const sw=tierStat(b).swing||0.55;
  const grabPt=edgeCenter(b.x,b.y,OPP[b.dir]);
  const dropPt=edgeCenter(b.x,b.y,b.dir);
  if(!b.hold){
    b.ph+=dt/sw*0.5;
    if(b.ph>=0.5){
      b.ph=0.5;
      const got=grabFrom(cellAt(b.x-DIRV[b.dir][0],b.y-DIRV[b.dir][1]),grabPt);
      if(got){b.hold=got;b.ph=0.5;}
      else b.st='starved';
    } else b.st='working';
  } else {
    b.ph+=dt/sw*0.5;
    if(b.ph>=1){
      const nb=bAt(b.x+DIRV[b.dir][0],b.y+DIRV[b.dir][1]);
      if(nb&&admitItem(nb,b.hold,OPP[b.dir])){ b.hold=null; b.ph=0; b.st='working'; }
      else b.st='blocked';
    } else b.st='working';
  }
}
function grabFrom(sb,pt){
  if(!sb) return null;
  const b=sb.b;
  if(!b) return null;
  if(b.ty==='belt'){
    const arr=G.cells[b.y*G.W+b.x].items;
    if(!arr||!arr.length) return null;
    let best=-1,bd=0.55*0.55;
    for(let i=0;i<arr.length;i++){
      const p=beltItemPos(b,arr[i]);
      const d=dist2(p[0],p[1],pt[0],pt[1]);
      if(d<bd){bd=d;best=i;}
    }
    if(best<0) return null;
    const it=arr[best]; arr.splice(best,1);
    return it.ty;
  }
  if(b.ty==='smelter'||b.ty==='assembler'||b.ty==='extractor'){
    const keys=Object.keys(b.out).filter(k=>b.out[k]>0);
    if(!keys.length) return null;
    const ty=keys[0]; b.out[ty]--; if(b.out[ty]<=0)delete b.out[ty];
    return ty;
  }
  if(b.ty==='storage'){
    const keys=Object.keys(b.sto).filter(k=>b.sto[k]>0);
    if(!keys.length) return null;
    const ty=keys[0]; b.sto[ty]--; if(b.sto[ty]<=0)delete b.sto[ty];
    return ty;
  }
  if(b.ty==='splitter'||b.ty==='merger'){
    if(!b.buf.length) return null;
    return b.buf.shift();
  }
  return null;
}
/* ---- belts ---- */
function transferFront(b){
  const c=G.cells[b.y*G.W+b.x];
  const it=c.items[0];
  const dv=DIRV[b.dir];
  const nb=inGrid(b.x+dv[0],b.y+dv[1])?G.cells[(b.y+dv[1])*G.W+(b.x+dv[0])]:null;
  if(!nb||!nb.b) return false;
  const side=OPP[b.dir];
  const tb=nb.b;
  if(tb.ty==='belt'){
    if(tb.dir===side) return false;
    const arr=nb.items||(nb.items=[]);
    if(arr.length&&arr[arr.length-1].p<GAP()) return false;
    const pos=beltItemPos(b,it);
    const E=edgeCenter(tb.x,tb.y,side);
    const l=(side===0||side===2)?pos[0]-E[0]:pos[1]-E[1];
    arr.push({ty:it.ty,p:0,l:clamp(l,-0.45,0.45),e:side});
    G.beltXfer++; b.throughput++;
    return true;
  }
  const pos=beltItemPos(b,it);
  const E=edgeCenter(tb.x,tb.y,side);
  const l=(side===0||side===2)?pos[0]-E[0]:pos[1]-E[1];
  if(admitItem(tb,it.ty,side,{l:clamp(l,-0.45,0.45)})){ b.throughput++; return true; }
  return false;
}
function updateBelts(dt){
  const step=1.6*G.sim.beltMul*dt;
  for(const b of G.buildings){
    if(b.ty!=='belt') continue;
    const c=G.cells[b.y*G.W+b.x];
    const arr=c.items;
    if(!arr||!arr.length){ c.jam*=0.98; continue; }
    // front transfers
    let guard=0;
    while(arr.length&&arr[0].p>=1&&guard++<4){ if(transferFront(b)) arr.shift(); else break; }
    if(!arr.length){ c.jam*=0.98; continue; }
    // movement
    for(let i=0;i<arr.length;i++){
      const it=arr[i];
      let lim=(i===0)?1:arr[i-1].p-GAP();
      const np=Math.min(it.p+step,lim);
      if(np>it.p) it.p=np;
    }
    c.jam=lerp(c.jam,(arr[0].p>=0.999)?1:0,Math.min(1,dt/2.5));
    c.jam=Math.max(0,c.jam-0.005);
  }
}
/* ---- master step ---- */
function stepSim(dt){
  G.sim.t+=dt; G.sim.tick++;
  if(G.netDirty) rebuildNetworks();
  powerPass();
  for(const b of G.buildings) tickBuilding(b,dt);
  updateBelts(dt);
  // fx & sampling use real time but sim-driven sampling:
  G.sampT+=dt;
  if(G.sampT>=1){ G.sampT-=1; sampleStats(); }
  G.bneckT+=dt;
  if(G.bneckT>=2){ G.bneckT=0; detectBottlenecks(); }
}
/* ---- effects ---- */
function addFx(kind,x,y,col,txt){
  if(G.effects.length>400) G.effects.shift();
  G.effects.push({k:kind,x,y,col,t:0,dur:kind==='smoke'?1.6:kind==='text'?1.1:0.7,txt});
}
function tickFx(dt){
  for(let i=G.effects.length-1;i>=0;i--){
    const f=G.effects[i]; f.t+=dt;
    if(f.k==='smoke') f.y-=dt*0.5;
    if(f.t>=f.dur) G.effects.splice(i,1);
  }
}

/* =====================================================================
   PART 4 — analytics, undo, save/load, share, PNG export
   ===================================================================== */
const HLEN=180;
function ring(arr,v){ arr.push(v); if(arr.length>HLEN) arr.shift(); }
function sampleStats(){
  G.stats.delRate=G.stats.delRate*0.6+G.delAcc*60*0.4;
  G.stats.beltRate=G.stats.beltRate*0.6+G.beltXfer*60*0.4;
  G.delAcc=0; G.beltXfer=0;
  for(const k in G.prodAcc){ G.rates.prod[k]=(G.rates.prod[k]||0)*0.6+G.prodAcc[k]*60*0.4; delete G.prodAcc[k]; }
  for(const k in G.consAcc){ G.rates.cons[k]=(G.rates.cons[k]||0)*0.6+G.consAcc[k]*60*0.4; delete G.consAcc[k]; }
  let sup=0,dem=0,util=0,um=0,conges=0,cm=0,queue=0,items=0;
  for(const n of G.nets){ sup+=n.sup; dem+=n.dem; }
  for(const b of G.buildings){
    if(POWERED[b.ty]){ util+=b.emaW; um++; ring(b.hist,b.emaW*100); }
    if(b.ty==='belt'){ const c=G.cells[b.y*G.W+b.x]; const full=c.items?Math.min(1,c.items.length*GAP()):0; conges+=Math.max(full,c.jam); cm++; }
  }
  for(const c of G.cells){ if(c.items) {queue+=c.items.length; items+=c.items.length;} }
  G.rates.powerG=sup; G.rates.powerD=dem;
  G.rates.util=um?util/um:0;
  G.rates.conges=cm?conges/cm:0;
  G.rates.queue=queue;
  G.stats.itemPeak=Math.max(G.stats.itemPeak,items);
  const h=G.hist=G.hist||{};
  if(!h.t)h.t=[]; if(!h.powG)h.powG=[]; if(!h.powD)h.powD=[]; if(!h.del)h.del=[];
  if(!h.util)h.util=[]; if(!h.conges)h.conges=[]; if(!h.queue)h.queue=[];
  ring(h.t,G.sim.t);
  ring(h.powG,sup);
  ring(h.powD,dem);
  ring(h.del,G.stats.delRate);
  ring(h.util,G.rates.util);
  ring(h.conges,G.rates.conges);
  ring(h.queue,G.rates.queue);
  if(!h.prod) h.prod={};
  for(const k in G.rates.prod) { if(!h.prod[k]) h.prod[k]=[]; ring(h.prod[k],G.rates.prod[k]); }
  refreshInspectorLight();
}
function detectBottlenecks(){
  const out=[];
  for(const b of G.buildings){
    if(b.ty==='smelter'||b.ty==='assembler'||b.ty==='extractor'){
      if(b.emaB>0.3) out.push({sev:b.emaB,txt:BDEFS[b.ty].name+' @ ('+b.x+','+b.y+') output blocked '+Math.round(b.emaB*100)+'%'});
      else if(b.emaS>0.4) out.push({sev:b.emaS*0.8,txt:BDEFS[b.ty].name+' @ ('+b.x+','+b.y+') starved of inputs'});
      if(b.st==='nopo') out.push({sev:1,txt:BDEFS[b.ty].name+' @ ('+b.x+','+b.y+') has no power'});
    }
    if(b.ty==='generator'&&b.st==='starved') out.push({sev:0.9,txt:'Generator @ ('+b.x+','+b.y+') out of coal'});
  }
  for(const n of G.nets){
    if(n.sat<0.999&&n.dem>0) out.push({sev:1.2-n.sat,txt:'Power network #'+n.id+' in brownout — '+(n.sat*100).toFixed(0)+'% power ('+fmtW(n.sup)+' / '+fmtW(n.dem)+')'});
  }
  let worstJam=0,wx=0,wy=0;
  for(const b of G.buildings){
    if(b.ty!=='belt') continue;
    const c=G.cells[b.y*G.W+b.x];
    if(c.jam>worstJam){worstJam=c.jam;wx=b.x;wy=b.y;}
  }
  if(worstJam>0.5) out.push({sev:worstJam,txt:'Belt jam near ('+wx+','+wy+') — check downstream'});
  out.sort((a,b)=>b.sev-a.sev);
  G.bneck=out.slice(0,6);
}
/* ---------------- undo / redo ---------------- */
function serB(b){
  const c=G.cells[b.y*G.W+b.x];
  const s={ty:b.ty,x:b.x,y:b.y,d:b.dir,tier:b.tier,en:b.en,invested:b.invested||0,
    in:Object.assign({},b.in),out:Object.assign({},b.out),prog:b.prog,active:b.active,recipe:b.recipe,
    hold:b.hold,ph:b.ph,sto:Object.assign({},b.sto),pushT:b.pushT,fuel:b.fuel,burn:b.burn,
    buf:b.buf.slice(),rr:b.rr};
  if(b.ty==='belt'&&c.items) s.it=c.items.map(i=>[i.ty,+i.p.toFixed(4),+i.l.toFixed(3),i.e]);
  return s;
}
function restoreB(s,opts){
  const b=addBuilding(s.ty,s.x,s.y,s.d,s.tier,{silent:true});
  if(!b) return null;
  Object.assign(b,{en:s.en,invested:s.invested||0,in:s.in||{},out:s.out||{},prog:s.prog||0,active:s.active||null,
    recipe:s.recipe||null,hold:s.hold||null,ph:s.ph||0,sto:s.sto||{},pushT:s.pushT||0,fuel:s.fuel||0,burn:s.burn||0,
    buf:s.buf||[],rr:s.rr||0});
  if(s.it){ G.cells[b.y*G.W+b.x].items=s.it.map(a=>({ty:a[0],p:a[1],l:a[2],e:a[3]})); }
  if(!opts||!opts.silent){ addFx('ring',b.x+0.5,b.y+0.5,'#8fd0ff'); }
  return b;
}
function pushOp(op){ if(G.stroke){ G.stroke.ops.push(op); } else { G.undo.push([op]); if(G.undo.length>120)G.undo.shift(); G.redo=[]; } }
function commitStroke(){
  if(G.stroke&&G.stroke.ops.length){ G.undo.push(G.stroke.ops); if(G.undo.length>120)G.undo.shift(); G.redo=[]; }
  G.stroke=null;
}
function applyUndo(){
  const ops=G.undo.pop(); if(!ops){toast('Nothing to undo');return;}
  for(let i=ops.length-1;i>=0;i--) invertOp(ops[i]);
  G.redo.push(ops);
  G.netDirty=true;
}
function applyRedo(){
  const ops=G.redo.pop(); if(!ops){toast('Nothing to redo');return;}
  for(const op of ops) redoOp(op);
  G.undo.push(ops);
  G.netDirty=true;
}
function invertOp(op){
  switch(op.a){
    case 'add':{ const b=G.bmap.get(op.id); if(b) removeBuilding(b,{silent:false}); break; }
    case 'del': restoreB(op.ser); break;
    case 'dir':{ const b=G.bmap.get(op.id); if(b) b.dir=op.from; break; }
    case 'up':{ const b=G.bmap.get(op.id); if(b){ b.tier=op.from; refund(op.cost); b.invested=Math.max(0,(b.invested||0)-op.cost);} break; }
    case 'recipe':{ const b=G.bmap.get(op.id); if(b) b.recipe=op.from; break; }
    case 'rock':{ const c=cellAt(op.x,op.y); if(c){c.t=op.from;} break; }
  }
}
function redoOp(op){
  switch(op.a){
    case 'add': restoreB(op.ser); break;
    case 'del':{ const c=cellAt(op.x,op.y); if(c&&c.b) removeBuilding(c.b,{silent:false}); break; }
    case 'dir':{ const b=G.bmap.get(op.id); if(b) b.dir=op.to; break; }
    case 'up':{ const b=G.bmap.get(op.id); if(b){ b.tier=op.to; spend(op.cost); b.invested=(b.invested||0)+op.cost;} break; }
    case 'recipe':{ const b=G.bmap.get(op.id); if(b) b.recipe=op.to; break; }
    case 'rock':{ const c=cellAt(op.x,op.y); if(c){c.t=T_ROCK;} break; }
  }
}
function spend(cost){
  if(!G.sim.costMode||!cost) return true;
  if(isFinite(G.credits)&&G.credits<cost) return false;
  G.credits-=cost; G.spent+=cost; return true;
}
function refund(amount){ if(!G.sim.costMode||!amount) return; if(isFinite(G.credits)) G.credits+=amount; G.spent=Math.max(0,G.spent-amount); }
function tierUpCost(b){ const t=BDEFS[b.ty].tiers[b.tier]; return (t&&t.cost)||0; }
function upgradeB(b){
  const cost=tierUpCost(b);
  if(!cost){ toast('Already at max tier'); Snd.play('error'); return false; }
  if(!spend(cost)){ toast('Insufficient credits','bad'); Snd.play('error'); return false; }
  pushOp({a:'up',id:b.id,from:b.tier,to:b.tier+1,cost});
  b.tier++; b.invested=(b.invested||0)+cost; G.netDirty=true;
  addFx('ring',b.x+0.5,b.y+0.5,'#8fd0ff'); Snd.play('upgrade');
  return true;
}
function deleteB(b){
  const ser=serB(b);
  pushOp({a:'del',x:b.x,y:b.y,ser});
  const refundV=G.sim.costMode?Math.floor((b.invested||BDEFS[b.ty].cost)*0.5):0;
  removeBuilding(b);
  refund(refundV);
  if(refundV) toast('+'+refundV+' credits refunded');
}

/* ---------------- serialization ---------------- */
function validateSave(o){
  if(!o||typeof o!=='object') throw new Error('Not an object');
  if(o.v!==1) throw new Error('Unsupported save version');
  if(!Number.isInteger(o.W)||o.W<16||o.W>256||!Number.isInteger(o.H)||o.H<16||o.H>256) throw new Error('Bad grid size');
  if(!Array.isArray(o.buildings)||o.buildings.length>30000) throw new Error('Bad buildings array');
  const clean={v:1,W:o.W,H:o.H,seed:String(o.seed||'x').slice(0,40),mode:o.mode==='campaign'?'campaign':'sandbox',
    stageIdx:Number.isInteger(o.stageIdx)?o.stageIdx:-1,presetId:typeof o.presetId==='string'?o.presetId:null,
    sim:Object.assign({},G.sim,o.sim||{}),credits:typeof o.credits==='number'&&isFinite(o.credits)?o.credits:Infinity,
    delivered:(o.delivered&&typeof o.delivered==='object')?o.delivered:{},produced:(o.produced&&typeof o.produced==='object')?o.produced:{},
    consumed:(o.consumed&&typeof o.consumed==='object')?o.consumed:{},
    deposits:Array.isArray(o.deposits)?o.deposits:[],buildings:[]};
  for(const k in clean.delivered){ if(!(k in ITEMS)||typeof clean.delivered[k]!=='number') delete clean.delivered[k]; }
  for(const s of o.buildings){
    if(!s||!BDEFS[s.ty]) throw new Error('Unknown structure type');
    if(!Number.isInteger(s.x)||!Number.isInteger(s.y)||s.x<0||s.y<0||s.x>=o.W||s.y>=o.H) throw new Error('Structure out of bounds');
    const b={ty:s.ty,x:s.x,y:s.y,d:(s.d|0)&3,tier:clamp(s.tier|0||1,1,BDEFS[s.ty].tiers.length),en:s.en!==false,
      invested:typeof s.invested==='number'?s.invested:0,in:{},out:{},prog:clamp(+s.prog||0,0,99),active:null,recipe:null,
      hold:null,ph:clamp(+s.ph||0,0,1),sto:{},pushT:0,fuel:clamp(s.fuel|0||0,0,FUELCAP),burn:Math.max(0,+s.burn||0),buf:[],rr:0,it:[]};
    for(const k in (s.in||{})) if(k in ITEMS) b.in[k]=clamp(Math.round(s.in[k]),0,99);
    for(const k in (s.out||{})) if(k in ITEMS) b.out[k]=clamp(Math.round(s.out[k]),0,OUTCAP);
    for(const k in (s.sto||{})) if(k in ITEMS) b.sto[k]=clamp(Math.round(s.sto[k]),0,9999);
    if(s.recipe){ const rl=RECIPES[s.ty]; if(rl&&rl.find(r=>r.id===s.recipe)) b.recipe=s.recipe; }
    if(s.active){ const rl=RECIPES[s.ty]; if(rl&&rl.find(r=>r.id===s.active)) b.active=s.active; }
    if(s.hold in ITEMS) b.hold=s.hold;
    if(Array.isArray(s.buf)) for(const x of s.buf) if(x in ITEMS&&b.buf.length<3) b.buf.push(x);
    if(Array.isArray(s.it)) for(const a of s.it.slice(0,6)) if(Array.isArray(a)&&a[0] in ITEMS) b.it.push([a[0],clamp(+a[1]||0,0,1),clamp(+a[2]||0,-0.5,0.5),(a[3]|0)&3]);
    clean.buildings.push(b);
  }
  return clean;
}
function serializeWorld(){
  const deposits=[];

    const c=G.cells[y*G.W+x];

function loadWorld(o,opts){

  Object.assign(G.sim,clean.sim); G.sim.paused=false;
  G.credits=isFinite(clean.credits)?clean.credits:Infinity;
  G.delivered=clean.delivered; G.produced=clean.produced; G.consumed=clean.consumed;
  G.contract=clean.mode==='campaign'?{targets:clean.contract?clean.contract.targets:{}}:null;
  makeCells();
  for(const d of clean.deposits){
    const [x,y,t,amt]=d;
    if(inGrid(x,y)&&t>=T_IRON&&t<=T_ROCK){ const c=G.cells[y*G.W+x]; c.t=t; c.amt=clamp(Math.round(amt)||0,0,999999); }
  }
  for(const s of clean.buildings) restoreB(s,{silent:true});
  rebuildNetworks();
  G.cam.x=G.W/2; G.cam.y=G.H/2;
  if(!opts.silent){ toast('Factory loaded ('+clean.buildings.length+' structures)','good'); refreshAllUI(); }
}
function saveSlot(name){
  const data=JSON.stringify(serializeWorld());
  const ok=store.set('fw_slot_'+name,data);
  if(ok){ toast('Saved to slot "'+name+'"','good'); Snd.play('save'); }
  else toast('Local storage unavailable — use Export file instead','bad');

}
function listSlots(){
  const out=[];
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.startsWith('fw_slot_')){
        let meta={};
        try{ const d=JSON.parse(localStorage.getItem(k)); meta={t:d.sim?d.sim.t:0,n:d.buildings?d.buildings.length:0,m:d.mode}; }catch(e){}
        out.push({name:k.slice(8),meta});
      }
    }
  }catch(e){}
  out.sort((a,b)=>a.name=== 'autosave'?-1:b.name==='autosave'?1:a.name.localeCompare(b.name));

/* ---------------- share codes ---------------- */
function shareCode(){
  const json=JSON.stringify(serializeWorld());
  try{ return 'FW1.'+btoa(unescape(encodeURIComponent(json))); }
  catch(e){ return null; }
}
function parseShare(code){
  code=(code||'').trim();

}
/* ---------------- PNG export ---------------- */
function exportPNG(){
  const TS=14, pad=2;
  const cv=document.createElement('canvas');
  cv.width=(G.W+pad*2)*TS; cv.height=(G.H+pad*2+3)*TS;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#0d1016'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save(); ctx.translate(pad*TS,pad*TS);
  const s=TS;
  ctx.fillStyle='#131a22';
  ctx.fillRect(0,0,G.W*s,G.H*s);
  for(let y=0;y<G.H;y++)for(let x=0;x<G.W;x++){
    const c=G.cells[y*G.W+x];
    if(c.t>=T_IRON&&c.t<=T_COAL){
      ctx.fillStyle=['','#2a3442','#3a2c22','#22242a'][c.t];
      ctx.fillRect(x*s,y*s,s,s);
      ctx.fillStyle=['','#7d8ea3','#d08a4e','#5c5f6e'][c.t];
      for(let i=0;i<3;i++) ctx.fillRect(x*s+2+i*4,y*s+3+(i%2)*4,2,2);
    } else if(c.t===T_ROCK){
      ctx.fillStyle='#3a4148'; ctx.beginPath(); ctx.arc(x*s+s/2,y*s+s/2,s*0.32,0,TAU); ctx.fill();
    }
  }
  // belts + items + buildings (simplified static render)
  for(const b of G.buildings){
    const x=b.x*s,y=b.y*s,cx=x+s/2,cy=y+s/2;
    if(b.ty==='belt'){
      ctx.fillStyle='#232b35'; ctx.fillRect(x+1,y+1,s-2,s-2);
      const dv=DIRV[b.dir];
      ctx.strokeStyle='#3d4a5a'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(cx-dv[0]*s*0.3,cy-dv[1]*s*0.3); ctx.lineTo(cx+dv[0]*s*0.3,cy+dv[1]*s*0.3); ctx.stroke();
      const items=G.cells[b.y*G.W+b.x].items||[];
      for(const it of items){
        const p=beltItemPos(b,it);
        ctx.fillStyle=ITEMS[it.ty].c;
        ctx.fillRect(p[0]*s-2.5,p[1]*s-2.5,5,5);
      }
      continue;
    }
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(b.dir*Math.PI/2);
    const col={extractor:'#5d6b7d',smelter:'#6e5a4a',assembler:'#4a5d6e',generator:'#6b5d3f',pole:'#8a93a0',storage:'#54617a',splitter:'#4f5a68',merger:'#4f5a68',inserter:'#5a5464',port:'#2f6b52'}[b.ty]||'#555';
    ctx.fillStyle=col;
    const r=s*0.38;
    ctx.beginPath(); ctx.roundRect(-r,-r,r*2,r*2,2); ctx.fill();
    ctx.fillStyle='#ffd16677';
    ctx.fillRect(-1.5,-r,3,2.5);
    ctx.restore();
  }
  ctx.restore();
  // legend
  ctx.fillStyle='#0d1016ee'; ctx.fillRect(0,cv.height-3*TS,cv.width,3*TS);
  ctx.fillStyle='#ffb454'; ctx.font='bold '+(TS*0.9)+'px sans-serif';
  ctx.fillText('FLOWWORKS',TS,cv.height-2*TS+2);
  ctx.fillStyle='#8fa3b8'; ctx.font=(TS*0.72)+'px sans-serif';
  ctx.fillText((G.mode==='campaign'?CAMPAIGN[G.stageIdx].name:PRESETS[G.presetId]?PRESETS[G.presetId].name:'Custom')+' · seed '+G.seed+' · '+fmtT(G.sim.t)+' · '+G.buildings.length+' structures · '+fmtN(G.deliveredTotal)+' delivered',TS+TS*6.5,cv.height-2*TS+2);
  download('flowworks-'+Date.now()+'.png',cv.toDataURL('image/png'));
  toast('PNG exported','good');
}

const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let DPR=1,VW=0,VH=0;
function resizeCanvas(){
  DPR=Math.min(2.5,window.devicePixelRatio||1);
  VW=innerWidth; VH=innerHeight;
  cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
}
window.addEventListener('resize',()=>{resizeCanvas();});
function w2s(wx,wy){ return [(wx-G.cam.x)*G.cam.z+VW/2,(wy-G.cam.y)*G.cam.z+VH/2]; }
function s2w(sx,sy){ return [(sx-VW/2)/G.cam.z+G.cam.x,(sy-VH/2)/G.cam.z+G.cam.y]; }
function utilColor(v){
  // 0 blue -> 0.5 yellow -> 1 red
  v=clamp(v,0,1);
  if(v<0.5){ const t=v/0.5; return 'rgb('+Math.round(60+t*195)+','+Math.round(140+t*70)+','+Math.round(220-t*140)+')'; }
  const t=(v-0.5)/0.5;
  return 'rgb('+Math.round(255)+','+Math.round(210-t*140)+','+Math.round(80-t*60)+')';
}
function itemGlyph(x,y,s,shape,col){
  ctx.fillStyle=col; ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=1;
  if(shape==='ore'){
    ctx.beginPath(); ctx.arc(x,y,s*0.42,0,TAU); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.arc(x-s*0.12,y-s*0.12,s*0.13,0,TAU); ctx.fill();
  } else if(shape==='plate'){
    ctx.beginPath(); ctx.roundRect(x-s*0.4,y-s*0.32,s*0.8,s*0.64,2); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.3)';
    ctx.beginPath(); ctx.moveTo(x-s*0.25,y); ctx.lineTo(x+s*0.25,y); ctx.stroke();
  } else if(shape==='gear'){
    ctx.beginPath(); ctx.arc(x,y,s*0.34,0,TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle=col; ctx.lineWidth=s*0.14;
    for(let i=0;i<4;i++){ const a=i*Math.PI/4+0.4;
      ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*s*0.3,y+Math.sin(a)*s*0.3); ctx.lineTo(x+Math.cos(a)*s*0.48,y+Math.sin(a)*s*0.48); ctx.stroke(); }
    ctx.fillStyle='rgba(0,0,0,.4)'; ctx.beginPath(); ctx.arc(x,y,s*0.12,0,TAU); ctx.fill();
  } else if(shape==='coil'){
    ctx.strokeStyle=col; ctx.lineWidth=s*0.16;
    ctx.beginPath(); ctx.arc(x,y,s*0.28,0.6,TAU-0.6); ctx.stroke();
    ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(x,y,s*0.28,0.6,TAU-0.6); ctx.stroke();
  } else if(shape==='chip'){
    ctx.beginPath(); ctx.roundRect(x-s*0.36,y-s*0.28,s*0.72,s*0.56,2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.5)';
    for(let i=0;i<3;i++) ctx.fillRect(x-s*0.3+i*s*0.24,y-s*0.12,s*0.12,s*0.24);
  }
}
function drawBadge(cx,cy,txt,col,pulse){
  const r=7;

const STATUS_META={working:['▶','#3fae6a',0],starved:['…','#ffd166',0],blocked:['▮','#e05252',0],nopo:['⚡','#e05252',1],off:['○','#8a93a0',0],full:['■','#7fb0ff',0],depleted:['∅','#c96ae0',0],idle:['·','#647689',0],blockedjam:['▮','#e05252',1]};
function drawBuilding(b,t,ghost,ghostOk){
  const z=G.cam.z;
  const [sx,sy]=w2s(b.x,b.y);
  ctx.save(); ctx.translate(sx,sy);
  if(ghost) ctx.globalAlpha=0.55;
  const s=z;
  switch(b.ty){
    case 'belt': drawBelt(b,s,t); break;
    case 'extractor': drawExtractor(b,s,t); break;
    case 'smelter': drawSmelter(b,s,t); break;
    case 'assembler': drawAssembler(b,s,t); break;
    case 'generator': drawGenerator(b,s,t); break;
    case 'pole': drawPole(b,s); break;
    case 'storage': drawStorage(b,s); break;
    case 'splitter': case 'merger': drawJunction(b,s); break;
    case 'inserter': drawInserterBase(b,s); break;
    case 'port': drawPort(b,s,t); break;
  }
  ctx.restore();
  // items on belts
  if(b.ty==='belt'&&!ghost){
    const arr=G.cells[b.y*G.W+b.x].items;
    if(arr) for(const it of arr){
      const p=beltItemPos(b,it);
      const [ix,iy]=w2s(p[0],p[1]);
      const isz=Math.max(4,s*0.3);
      ctx.save(); ctx.translate(ix,iy);
      if(z>=15) itemGlyph(0,0,isz,ITEMS[it.ty].shape,ITEMS[it.ty].c);
      else { ctx.fillStyle=ITEMS[it.ty].c; ctx.fillRect(-isz/2,-isz/2,isz,isz); }
      ctx.restore();
    }
  }
  // inserter arm on top
  if(b.ty==='inserter'&&!ghost) drawInserterArm(b,s);
  // status badge (skip for belts unless jammed)
  if(!ghost){
    if(b.ty==='belt'){
      const c=G.cells[b.y*G.W+b.x];
      if(c.jam>0.5&&z>12) drawBadge(sx+s*0.72,sy-s*0.72,'▮','#e05252',true);
    } else if(b.ty!=='pole'){
      const m=STATUS_META[b.st];
      if(m&&(b.st==='nopo'||b.st==='blocked'||b.st==='depleted'||(b.st==='starved'&&z>14)||(b.st==='full'&&z>14)))
        drawBadge(sx+s*0.72,sy-s*0.72,m[0],m[1],m[2]);
    }
    // selection outline
    if(G.sel===b){
      ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
      ctx.lineDashOffset=-performance.now()/60;
      ctx.strokeRect(sx+s*0.06,sy+s*0.06,s*0.88,s*0.88);
      ctx.setLineDash([]);
    }
    if(G.hover===b&&G.sel!==b){
      ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1;
      ctx.strokeRect(sx+1,sy+1,s-2,s-2);
    }
  }
  if(ghost){
    ctx.globalAlpha=0.9;
    ctx.strokeStyle=ghostOk?'#3fae6a':'#e05252'; ctx.lineWidth=1.5;
    ctx.strokeRect(sx+1,sy+1,s-2,s-2);
    // direction arrow
    const dv=DIRV[G.tool.dir];
    ctx.strokeStyle=ghostOk?'#3fae6a':'#e05252';
    ctx.beginPath(); ctx.moveTo(sx+s/2-dv[0]*s*0.3,sy+s/2-dv[1]*s*0.3);
    ctx.lineTo(sx+s/2+dv[0]*s*0.3,sy+s/2+dv[1]*s*0.3); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawBelt(b,s,t){
  const x=-s/2,y=-s/2;
  ctx.fillStyle='#1b222c';
  ctx.beginPath(); ctx.roundRect(x+s*0.08,y+s*0.08,s*0.84,s*0.84,3); ctx.fill();
  ctx.fillStyle='#232b35';
  ctx.beginPath(); ctx.roundRect(x+s*0.14,y+s*0.14,s*0.72,s*0.72,2); ctx.fill();
  // animated chevrons along the path
  const speed=1.6*G.sim.beltMul;
  const phase=(G.sim.t*speed)%0.25;
  const dv=DIRV[b.dir];
  const arr=G.cells[b.y*G.W+b.x].items;
  const full=arr?Math.min(1,arr.length*GAP()):0;
  ctx.strokeStyle='rgba(140,170,200,'+(0.25+full*0.3)+')';
  ctx.lineWidth=Math.max(1,s*0.05);
  for(let k=0;k<3;k++){
    let p=(k*0.25+phase)%1;
    p=0.08+p*0.84;
    const pos=beltItemPos(b,{p,e:OPP[b.dir],l:0});
    const [wx,wy]=w2s(pos[0],pos[1]);
    const [ax,ay]=w2s(b.x+0.5,b.y+0.5);
    const px=wx-ax, py=wy-ay;
    ctx.beginPath();
    ctx.moveTo(px-dv[0]*s*0.1-dv[1]*s*0.12,py-dv[1]*s*0.1-dv[0]*s*0.12);
    ctx.lineTo(px+dv[0]*s*0.1,py+dv[1]*s*0.1);
    ctx.lineTo(px-dv[0]*s*0.1+dv[1]*s*0.12,py-dv[1]*s*0.1+dv[0]*s*0.12);
    ctx.stroke();
  }
}

function drawPole(b,s){
  ctx.fillStyle='#2c333d';

  ctx.strokeStyle='#8a93a0'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.strokeStyle='#aab4c0'; ctx.lineWidth=Math.max(1.5,s*0.06);
  ctx.beginPath(); ctx.moveTo(-s*0.26,s*0.1); ctx.lineTo(0,-s*0.2); ctx.lineTo(s*0.26,s*0.1); ctx.stroke();
  const n=G.nets[b.net];
  if(n&&(n.sup>0||n.dem>0)){
    ctx.fillStyle=n.sat>=0.999?'#ffd166':n.sat>0?'#ff9d54':'#e05252';
    ctx.beginPath(); ctx.arc(0,-s*0.2,s*0.06,0,TAU); ctx.fill();
  }
}
function drawStorage(b,s){
  const x=-s/2,y=-s/2;
  ctx.fillStyle='#333c4a'; ctx.beginPath(); ctx.roundRect(x+s*0.08,y+s*0.08,s*0.84,s*0.84,4); ctx.fill();
  ctx.strokeStyle='#54617a'; ctx.lineWidth=1.5; ctx.stroke();
  const cap=tierStat(b).cap, cnt=stoCount(b);
  const h=s*0.62*Math.min(1,cnt/cap);
  ctx.fillStyle='rgba(143,208,255,.35)';
  ctx.fillRect(-s*0.26,s*0.28-h,s*0.52,h);
  ctx.strokeStyle='#8fd0ff88';
  ctx.strokeRect(-s*0.26,s*0.28-s*0.62,s*0.52,s*0.62);
  const dv=DIRV[b.dir];
  ctx.fillStyle='#8fd0ff88'; ctx.fillRect(-s*0.08+dv[0]*s*0.34,-s*0.08+dv[1]*s*0.34,s*0.16,s*0.16);
  if(G.cam.z>16&&cnt>0){
    ctx.fillStyle='#cfe0f0'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    ctx.fillText(cnt,0,s*0.1); ctx.textAlign='left';
  }
}
function drawJunction(b,s){
  const x=-s/2,y=-s/2;
  ctx.fillStyle='#2b323d'; ctx.beginPath(); ctx.roundRect(x+s*0.1,y+s*0.1,s*0.8,s*0.8,3); ctx.fill();
  ctx.strokeStyle='#4f5a68'; ctx.lineWidth=1.5; ctx.stroke();
  const outs=junctionOuts(b), ins=junctionIns(b);
  const arrow=(dir,col)=>{
    const dv=DIRV[dir];
    ctx.strokeStyle=col; ctx.lineWidth=Math.max(1.5,s*0.06);
    ctx.beginPath(); ctx.moveTo(-dv[0]*s*0.2,-dv[1]*s*0.2); ctx.lineTo(dv[0]*s*0.28,dv[1]*s*0.28); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(dv[0]*s*0.32,dv[1]*s*0.32);
    ctx.lineTo(dv[0]*s*0.16-dv[1]*s*0.1,dv[1]*s*0.16-dv[0]*s*0.1);
    ctx.lineTo(dv[0]*s*0.16+dv[1]*s*0.1,dv[1]*s*0.16+dv[0]*s*0.1);
    ctx.closePath(); ctx.fillStyle=col; ctx.fill();
  };
  for(const d of ins) arrow(d,'rgba(143,208,255,.5)');
  for(const d of outs) arrow(d,b.buf.length?'#ffd166':'#3fae6a');
}
function drawInserterBase(b,s){
  const x=-s/2,y=-s/2;
  ctx.fillStyle='#322d3a'; ctx.beginPath(); ctx.arc(0,0,s*0.3,0,TAU); ctx.fill();
  ctx.strokeStyle='#5a5464'; ctx.lineWidth=1.5; ctx.stroke();
}
function drawInserterArm(b,s){
  const [sx,sy]=w2s(b.x,b.y);
  const f=b.dir, back=OPP[b.dir];
  const angF=Math.atan2(DIRV[f][1],DIRV[f][0]);
  const angB=Math.atan2(DIRV[back][1],DIRV[back][0]);
  let da=angB-angF; while(da>Math.PI)da-=TAU; while(da<-Math.PI)da+=TAU;
  const ph=b.hold?0.5+(b.ph-0.5):b.ph*1.0; // 0..1 ; 0.5 = at source
  const ang=angF+da*(1-ph);
  ctx.save(); ctx.translate(sx,sy); ctx.rotate(ang);
  ctx.strokeStyle='#9a92ab'; ctx.lineWidth=Math.max(2,s*0.07);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s*0.42,0); ctx.stroke();
  ctx.fillStyle='#c5bed6'; ctx.fillRect(s*0.36,-s*0.07,s*0.1,s*0.14);
  ctx.restore();
  if(b.hold){
    const hx=sx+Math.cos(ang)*s*0.42, hy=sy+Math.sin(ang)*s*0.42;
    const isz=Math.max(4,s*0.26);
    if(G.cam.z>=15) itemGlyph(hx,hy,isz,ITEMS[b.hold].shape,ITEMS[b.hold].c);
    else { ctx.fillStyle=ITEMS[b.hold].c; ctx.fillRect(hx-isz/2,hy-isz/2,isz,isz); }
  }
}
function drawPort(b,s,t){
  const x=-s/2,y=-s/2;
  ctx.fillStyle='#1d3328'; ctx.beginPath(); ctx.roundRect(x+s*0.06,y+s*0.06,s*0.88,s*0.88,5); ctx.fill();
  ctx.strokeStyle='#3f8f63'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.setLineDash([3,3]); ctx.strokeStyle='#3fae6a88';
  ctx.strokeRect(x+s*0.16,y+s*0.16,s*0.68,s*0.68); ctx.setLineDash([]);
  // beacon
  const pulse=0.5+0.5*Math.sin(t*4);
  ctx.fillStyle='rgba(63,174,106,'+(0.35+pulse*0.5)+')';
  ctx.beginPath(); ctx.arc(0,0,s*0.12,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(63,174,106,'+(0.5-pulse*0.4)+')';
  ctx.beginPath(); ctx.arc(0,0,s*(0.2+pulse*0.25),0,TAU); ctx.stroke();
  if(G.cam.z>13){
    ctx.fillStyle='#8fd6ae'; ctx.font='bold 9px sans-serif'; ctx.textAlign='center';
    let d=0; for(const k in G.delivered) d+=G.delivered[k];
    ctx.fillText('▾ '+fmtN(d),0,s*0.38); ctx.textAlign='left';
  }
}
/* overlays */
function drawOverlays(t){
  const o=G.settings.overlay;
  if(o==='none') return;
  const z=G.cam.z;
  if(o==='power'||o==='links'){
    // pole links
    for(const n of G.nets){
      const ps=n.poles;
      for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){
        const a=ps[i],c=ps[j];
        if(dist2(a.x,a.y,c.x,c.y)>LINK_R*LINK_R) continue;
        const [ax,ay]=w2s(a.x+0.5,a.y+0.5),[bx,by]=w2s(c.x+0.5,c.y+0.5);
        ctx.strokeStyle=n.sat>=0.999?'rgba(255,209,102,.35)':'rgba(224,82,82,.45)';
        ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
        if(o==='power'&&n.sup>0){
          const k=(t*0.6+(i*0.31+j*0.17))%1;
          const px=ax+(bx-ax)*k, py=ay+(by-ay)*k;
          ctx.fillStyle='#ffd166';
          ctx.beginPath(); ctx.arc(px,py,2,0,TAU); ctx.fill();
        }
      }
      if(o==='power'){
        for(const p of ps){
          const [cx,cy]=w2s(p.x+0.5,p.y+0.5);
          ctx.fillStyle='rgba(255,209,102,.06)';
          ctx.beginPath(); ctx.arc(cx,cy,SUPPLY_R*z,0,TAU); ctx.fill();
          ctx.strokeStyle='rgba(255,209,102,.18)';
          ctx.stroke();
        }
        if(ps.length){
          const [lx,ly]=w2s(ps[0].x+0.5,ps[0].y-0.2);
          ctx.fillStyle='#ffd166'; ctx.font='10px sans-serif'; ctx.textAlign='center';
          ctx.fillText('#'+n.id+' '+fmtW(n.sup)+'/'+fmtW(n.dem)+(n.sat<1?' ('+Math.round(n.sat*100)+'%)':''),lx,ly-8);
          ctx.textAlign='left';
        }
      }
    }
  }
  if(o==='links'){
    ctx.lineWidth=1.5;
    for(const b of G.buildings){
      if(b.ty==='belt'||b.ty==='pole') continue;
      if(b.ty==='inserter'){
        const [ax,ay]=w2s(b.x+0.5,b.y+0.5);
        const [bx,by]=w2s(b.x+0.5+DIRV[b.dir][0],b.y+0.5+DIRV[b.dir][1]);
        ctx.strokeStyle='rgba(154,146,171,.4)';
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
        continue;
      }
      if(b.ty==='extractor'||b.ty==='smelter'||b.ty==='assembler'||b.ty==='storage'||b.ty==='generator'){
        const dv=DIRV[b.dir];
        const nb=bAt(b.x+dv[0],b.y+dv[1]);
        if(!nb) continue;
        const [ax,ay]=w2s(b.x+0.5,b.y+0.5);
        const [bx,by]=w2s(b.x+0.5+dv[0],b.y+0.5+dv[1]);
        const bad=(outTotal(b)>0)&&nb.ty!=='port'&&nb.ty!=='belt'&&nb.ty!=='storage'&&!junctionIns(nb).includes(OPP[b.dir]);
        ctx.strokeStyle=bad?'rgba(224,82,82,.8)':'rgba(63,174,106,.4)';
        ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
      }
    }
  }
  if(o==='heat'){
    for(const b of G.buildings){
      let v=-1;
      if(POWERED[b.ty]) v=b.emaW;
      else if(b.ty==='belt'){ const c=G.cells[b.y*G.W+b.x]; v=b.throughput>0?0.5:0; }
      if(v<0) continue;
      const [sx,sy]=w2s(b.x,b.y);
      ctx.fillStyle=utilColor(v); ctx.globalAlpha=0.45;
      ctx.fillRect(sx+2,sy+2,z-4,z-4);
      ctx.globalAlpha=1;
    }
  }
  if(o==='conges'){
    for(const b of G.buildings){
      if(b.ty!=='belt') continue;
      const c=G.cells[b.y*G.W+b.x];
      const full=c.items?Math.min(1,c.items.length*GAP()):0;
      const v=Math.max(full,c.jam);
      const [sx,sy]=w2s(b.x,b.y);
      ctx.fillStyle=utilColor(v); ctx.globalAlpha=0.4;
      ctx.fillRect(sx+2,sy+2,z-4,z-4);
      ctx.globalAlpha=1;
    }
  }
  if(o==='blocked'){
    for(const b of G.buildings){
      const bad=(b.st==='blocked')||(b.st==='nopo')||(b.ty==='belt'&&G.cells[b.y*G.W+b.x].jam>0.4)||(b.ty==='generator'&&b.st==='starved');
      if(!bad) continue;
      const [sx,sy]=w2s(b.x,b.y);
      const p=0.5+0.5*Math.sin(t*7);
      ctx.strokeStyle='rgba(224,82,82,'+(0.4+p*0.5)+')';
      ctx.lineWidth=2;
      ctx.strokeRect(sx+1.5,sy+1.5,z-3,z-3);
    }
  }
  if(o==='status'){
    for(const b of G.buildings){
      if(b.ty==='belt'||b.ty==='pole') continue;
      const m=STATUS_META[b.st]||STATUS_META.idle;
      const [sx,sy]=w2s(b.x,b.y);
      ctx.fillStyle=m[1]; ctx.globalAlpha=0.85;
      ctx.fillRect(sx+z-7,sy+2,5,5);
      ctx.globalAlpha=1;
    }
  }
}
/* main render */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // bg
  ctx.fillStyle='#0b0e12'; ctx.fillRect(0,0,VW,VH);
  const z=G.cam.z;
  const [wx0,wy0]=s2w(0,0), [wx1,wy1]=s2w(VW,VH);
  const x0=Math.max(0,Math.floor(wx0)), y0=Math.max(0,Math.floor(wy0));
  const x1=Math.min(G.W-1,Math.ceil(wx1)), y1=Math.min(G.H-1,Math.ceil(wy1));
  const t=performance.now()/1000;
  // terrain
  ctx.fillStyle='#10151c';
  ctx.fillRect(0,0,VW,VH);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const c=G.cells[y*G.W+x];
    const [sx,sy]=w2s(x,y);
    if(c.t>=T_IRON&&c.t<=T_COAL){
      ctx.fillStyle=['','#1c2430','#2b2118','#1d1f26'][c.t];
      ctx.fillRect(sx,sy,z,z);
      if(z>10){
        ctx.fillStyle=['','#7d8ea3','#d08a4e','#5c5f6e'][c.t];
        const n=4;
        for(let i=0;i<n;i++){
          const px=sx+((x*7+i*13)%97)/97*(z-5)+2, py=sy+((y*11+i*29)/97%1)*(z-5)+2;
          ctx.fillRect(px,py,2.2,2.2);
        }
      }
      if(c.amt<=0){ ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(sx,sy,z,z); }
    } else if(c.t===T_ROCK){
      ctx.fillStyle='#151a21'; ctx.fillRect(sx,sy,z,z);
      ctx.fillStyle='#3a4148';
      ctx.beginPath();
      ctx.arc(sx+z*0.4,sy+z*0.55,z*0.22,0,TAU);
      ctx.arc(sx+z*0.62,sy+z*0.4,z*0.16,0,TAU);
      ctx.arc(sx+z*0.5,sy+z*0.68,z*0.13,0,TAU);
      ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.08)';
      ctx.beginPath(); ctx.arc(sx+z*0.36,sy+z*0.46,z*0.08,0,TAU); ctx.fill();
    } else {
      if((x+y)%2===0){ ctx.fillStyle='rgba(255,255,255,.012)'; ctx.fillRect(sx,sy,z,z); }
    }
  }
  if(G.settings.showGrid&&z>=13){
    ctx.strokeStyle='rgba(140,170,200,.06)'; ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=x0;x<=x1+1;x++){ const [sx]=w2s(x,0); ctx.moveTo(sx,0); ctx.lineTo(sx,VH); }
    for(let y=y0;y<=y1+1;y++){ const [,sy]=w2s(0,y); ctx.moveTo(0,sy); ctx.lineTo(VW,sy); }
    ctx.stroke();
  }
  // world border
  {
    const [bx,by]=w2s(0,0), [bx2,by2]=w2s(G.W,G.H);
    ctx.strokeStyle='rgba(255,180,84,.25)'; ctx.lineWidth=2;
    ctx.strokeRect(bx,by,bx2-bx,by2-by);
  }
  // buildings: belts first, then others
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const b=G.cells[y*G.W+x].b;
    if(b&&b.ty==='belt') drawBuilding(b,t);
  }
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const b=G.cells[y*G.W+x].b;
    if(b&&b.ty!=='belt') drawBuilding(b,t);
  }
  drawOverlays(t);
  // effects
  for(const f of G.effects){
    const [sx,sy]=w2s(f.x,f.y);
    const k=f.t/f.dur;
    if(f.k==='ring'){
      ctx.strokeStyle=f.col||'#ffd166'; ctx.globalAlpha=1-k; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(sx,sy,z*(0.2+k*0.6),0,TAU); ctx.stroke();
    } else if(f.k==='poof'){
      ctx.fillStyle='#9db1c5'; ctx.globalAlpha=(1-k)*0.7;
      for(let i=0;i<5;i++){
        const a=i*TAU/5+k*2;
        ctx.beginPath(); ctx.arc(sx+Math.cos(a)*z*k*0.5,sy+Math.sin(a)*z*k*0.5,z*0.08*(1-k),0,TAU); ctx.fill();
      }
    } else if(f.k==='spark'){
      ctx.fillStyle=f.col||'#3fae6a'; ctx.globalAlpha=1-k;
      for(let i=0;i<6;i++){
        const a=i*TAU/6;
        ctx.beginPath(); ctx.arc(sx+Math.cos(a)*z*k*0.7,sy+Math.sin(a)*z*k*0.7-z*k*0.4,2*(1-k),0,TAU); ctx.fill();
      }
    } else if(f.k==='smoke'){
      ctx.fillStyle='rgba(150,150,160,'+(0.25*(1-k))+')';
      ctx.beginPath(); ctx.arc(sx,sy,z*0.12*(0.5+k),0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // marquee
  if(G.marquee){
    const [ax,ay]=w2s(G.marquee.x0,G.marquee.y0),[bx,by]=w2s(G.marquee.x1,G.marquee.y1);
    ctx.fillStyle='rgba(143,208,255,.12)';
    ctx.fillRect(Math.min(ax,bx),Math.min(ay,by),Math.abs(bx-ax),Math.abs(by-ay));
    ctx.strokeStyle='#8fd0ff'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
    ctx.strokeRect(Math.min(ax,bx),Math.min(ay,by),Math.abs(bx-ax),Math.abs(by-ay));
    ctx.setLineDash([]);
  }
  // belt drag path preview
  if(G.stroke&&G.stroke.path&&G.tool.kind==='build'&&G.tool.ty==='belt'){
    ctx.strokeStyle='rgba(255,209,102,.7)'; ctx.lineWidth=2; ctx.setLineDash([6,4]);
    ctx.beginPath();
    G.stroke.path.forEach((p,i)=>{
      const [sx,sy]=w2s(p[0]+0.5,p[1]+0.5);
      if(i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy);
    });
    ctx.stroke(); ctx.setLineDash([]);
  }
  // ghost
  drawGhost(t);
}
function drawGhost(t){
  const kind=G.tool.kind;
  if(kind==='build'&&G.tool.ty){
    const [gx,gy]=G.hoverCell||[null,null];
    if(gx===null) return;
    const ok=canPlace(G.tool.ty,gx,gy);
    const fake=newBuild(G.tool.ty,gx,gy,G.tool.dir,1);
    drawBuilding(fake,t,true,ok.ok);
    if(!ok.ok&&G.cam.z>12){
      const [sx,sy]=w2s(gx,gy);
      ctx.fillStyle='rgba(224,82,82,.9)'; ctx.font='10px sans-serif';
      ctx.fillText(ok.why,sx,sy-4);
    }
    // belt path ghost
    if(G.tool.ty==='belt'&&G.stroke&&G.stroke.path){
      ctx.globalAlpha=0.4;
      for(const p of G.stroke.path){
        if(canPlace('belt',p[0],p[1]).ok){
          const f=newBuild('belt',p[0],p[1],p[2]!==undefined?p[2]:G.tool.dir,1);
          drawBuilding(f,t,true,true);
        }
      }
      ctx.globalAlpha=1;
    }
  } else if(kind==='move'&&G.hand){
    const [gx,gy]=G.hoverCell||[null,null];
    if(gx===null) return;
    const ser=G.hand.ser;
    const fake=newBuild(ser.ty,gx,gy,G.hand.dir,ser.tier);
    const ok=canPlace(ser.ty,gx,gy);
    drawBuilding(fake,t,true,ok.ok);
  }
}

const $=s=>document.querySelector(s);
function el(tag,attrs,html){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){ if(k==='onclick') e.onclick=attrs[k]; else if(k==='className') e.className=attrs[k]; else e.setAttribute(k,attrs[k]); }
  if(html!==undefined) e.innerHTML=html;
  return e;
}
function toast(msg,cls){
  const box=$('#toasts');
  const t=el('div',{className:'toast '+(cls||'')},esc(msg));
  box.appendChild(t);
  while(box.children.length>4) box.firstChild.remove();
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .4s'; setTimeout(()=>t.remove(),450); },3200);
}

function drawToolIcon(cv2,ty){
  const c2=cv2.getContext('2d');
  const W=cv2.width,H=cv2.height;
  c2.clearRect(0,0,W,H);
  c2.save(); c2.translate(W/2,H/2);
  const s=Math.min(W,H)*0.62;
  const base=(col,stroke)=>{c2.fillStyle=col;c2.beginPath();c2.roundRect(-s/2,-s/2,s,s,s*0.16);c2.fill();if(stroke){c2.strokeStyle=stroke;c2.lineWidth=Math.max(1.2,s*0.05);c2.stroke();}};
  const arrow=(dv,col,len)=>{c2.strokeStyle=col;c2.lineWidth=Math.max(1.5,s*0.07);c2.lineCap='round';
    c2.beginPath();c2.moveTo(-dv[0]*len*0.5,-dv[1]*len*0.5);c2.lineTo(dv[0]*len*0.5,dv[1]*len*0.5);c2.stroke();
    c2.beginPath();c2.moveTo(dv[0]*len*0.5,dv[1]*len*0.5);
    c2.lineTo(dv[0]*len*0.3-dv[1]*len*0.18,dv[1]*len*0.3-dv[0]*len*0.18);
    c2.lineTo(dv[0]*len*0.3+dv[1]*len*0.18,dv[1]*len*0.3+dv[0]*len*0.18);
    c2.closePath();c2.fillStyle=col;c2.fill();c2.lineCap='butt';};
  const dv=[0,-1];
  switch(ty){
    case 'belt': base('#232b35','#3d4a5a'); arrow(dv,'#8caac8',s*0.6); break;
    case 'splitter': base('#2b323d','#4f5a68'); arrow(dv,'#3fae6a',s*0.55); arrow([-1,0],'rgba(143,208,255,.6)',s*0.4); arrow([1,0],'rgba(143,208,255,.6)',s*0.4); break;
    case 'merger': base('#2b323d','#4f5a68'); arrow(dv,'#ffd166',s*0.55); arrow([-1,0],'rgba(143,208,255,.6)',s*0.4); arrow([1,0],'rgba(143,208,255,.6)',s*0.4); break;
    case 'inserter': base('#322d3a','#5a5464'); c2.rotate(-Math.PI/4); c2.strokeStyle='#9a92ab'; c2.lineWidth=s*0.09; c2.beginPath(); c2.moveTo(-s*0.3,s*0.3); c2.lineTo(s*0.28,-s*0.28); c2.stroke(); c2.fillStyle='#c5bed6'; c2.fillRect(s*0.18,-s*0.36,s*0.12,s*0.12); break;
    case 'storage': base('#333c4a','#54617a'); c2.fillStyle='rgba(143,208,255,.5)'; c2.fillRect(-s*0.26,s*0.05,s*0.52,s*0.2); c2.strokeStyle='#8fd0ff88'; c2.strokeRect(-s*0.26,-s*0.26,s*0.52,s*0.52); break;
    case 'port': base('#1d3328','#3f8f63'); c2.setLineDash([s*0.06,s*0.05]); c2.strokeStyle='#3fae6a88'; c2.strokeRect(-s*0.32,-s*0.32,s*0.64,s*0.64); c2.setLineDash([]); c2.fillStyle='#3fae6a'; c2.beginPath(); c2.arc(0,0,s*0.14,0,TAU); c2.fill(); break;
    case 'extractor': base('#39424f','#5d6b7d'); c2.rotate(Math.PI/4); c2.strokeStyle='#ffd166'; c2.lineWidth=s*0.08; for(let i=0;i<3;i++){const a=i*TAU/3; c2.beginPath(); c2.moveTo(0,0); c2.lineTo(Math.cos(a)*s*0.3,Math.sin(a)*s*0.3); c2.stroke();} break;
    case 'smelter': base('#4a3d33','#6e5a4a'); c2.fillStyle='#241d18'; c2.beginPath(); c2.roundRect(-s*0.24,-s*0.08,s*0.48,s*0.3,s*0.06); c2.fill(); { const g2=c2.createRadialGradient(0,s*0.07,1,0,s*0.07,s*0.26); g2.addColorStop(0,'rgba(255,170,60,.9)'); g2.addColorStop(1,'rgba(255,120,30,0)'); c2.fillStyle=g2; c2.fillRect(-s*0.26,-s*0.1,s*0.52,s*0.36); } break;
    case 'assembler': base('#3d4a56','#5d7285'); c2.fillStyle='#2c3640'; c2.beginPath(); c2.roundRect(-s*0.26,-s*0.26,s*0.52,s*0.52,s*0.08); c2.fill(); c2.strokeStyle='#8fd0ff'; c2.lineWidth=s*0.07; c2.beginPath(); c2.moveTo(-s*0.16,s*0.08); c2.lineTo(s*0.18,-s*0.1); c2.stroke(); break;
    case 'generator': base('#4d4436','#77683f'); c2.strokeStyle='#ffd166'; c2.lineWidth=s*0.06; for(let i=0;i<4;i++){const a=i*Math.PI/2; c2.beginPath(); c2.moveTo(0,0); c2.lineTo(Math.cos(a)*s*0.28,Math.sin(a)*s*0.28); c2.stroke();} break;
    case 'pole': c2.strokeStyle='#aab4c0'; c2.lineWidth=s*0.07; c2.beginPath(); c2.moveTo(-s*0.3,s*0.12); c2.lineTo(0,-s*0.24); c2.lineTo(s*0.3,s*0.12); c2.stroke(); c2.fillStyle='#ffd166'; c2.beginPath(); c2.arc(0,-s*0.24,s*0.07,0,TAU); c2.fill(); break;
  }
  c2.restore();
}

function drawChart(){
  const a=$('#analytics'); const cc=a?a.querySelector('canvas'):null;
  if(!cc) return;
  const c2=cc.getContext('2d');
  const W=cc.width,H=cc.height;
  c2.clearRect(0,0,W,H);
  c2.fillStyle='#0d1116'; c2.fillRect(0,0,W,H);
  const m=G.ui.chartMetric;
  const h=G.hist||{};
  const series=[];
  if(m==='power'){
    if(h.powG) series.push({d:h.powG,c:'#ffd166',n:'supply'});
    if(h.powD) series.push({d:h.powD,c:'#e05252',n:'demand'});
  } else if(m==='prod'){
    for(const k in (h.prod||{})) series.push({d:h.prod[k],c:ITEMS[k].c,n:ITEMS[k].n});
  } else if(m==='del'){ if(h.del) series.push({d:h.del,c:'#3fae6a',n:'delivered/min'}); }
  else if(m==='util'){ if(h.util) series.push({d:h.util,c:'#8fd0ff',n:'utilization'}); }
  else if(m==='conges'){ if(h.conges) series.push({d:h.conges,c:'#ff9d54',n:'congestion'}); }
  else if(m==='queue'){ if(h.queue) series.push({d:h.queue,c:'#c96ae0',n:'items on belts'}); }
  c2.strokeStyle='rgba(140,170,200,.12)';
  c2.beginPath();
  for(let i=1;i<4;i++){ c2.moveTo(0,H*i/4); c2.lineTo(W,H*i/4); }
  c2.stroke();
  if(!series.length){ c2.fillStyle='#647689'; c2.font='16px sans-serif'; c2.fillText('collecting data…',20,H/2); return; }
  let max=0;
  for(const s of series) for(const v of s.d) if(v>max) max=v;
  if(m==='util'||m==='conges') max=Math.max(max,1);
  if(max<=0) max=1;
  max*=1.15;
  c2.font='13px sans-serif';
  for(const s of series){
    c2.strokeStyle=s.c; c2.lineWidth=2.2;
    c2.beginPath();
    const n=s.d.length;
    for(let i=0;i<n;i++){
      const x=i/(HLEN-1)*W;
      const y=H-(s.d[i]/max)*(H-14)-4;
      if(i===0) c2.moveTo(x,y); else c2.lineTo(x,y);
    }
    c2.stroke();
    const last=s.d[n-1]||0;
    c2.fillStyle=s.c;
    c2.fillText(s.n+' '+(last>=100?Math.round(last):last.toFixed(1)),8,16+series.indexOf(s)*18);
  }
}

function pickBuilding(x,y){ const c=cellAt(x,y); return c?c.b:null; }
function beltPathFor(x0,y0,x1,y1){
  const pts=[];
  const dx=x1-x0, dy=y1-y0;
  const horizFirst=Math.abs(dx)>=Math.abs(dy);
  const mx=horizFirst?x1:x0, my=horizFirst?y0:y1;
  const sx=Math.sign(mx-x0)||0, sy=Math.sign(my-y0)||0;
  let x=x0,y=y0;
  while(x!==mx||y!==my){ pts.push([x,y, sx? (sx>0?1:3) : (sy>0?2:0)]); x+=sx; y+=sy; if(pts.length>500)break; }
  pts.push([mx,my, 0]);
  const tx=Math.sign(x1-mx)||0, ty=Math.sign(y1-my)||0;
  if(tx||ty) pts[pts.length-1][2]= tx?(tx>0?1:3):(ty>0?2:0); // corner points along 2nd segment
  while(x!==x1||y!==y1){ x+=tx; y+=ty; pts.push([x,y, tx?(tx>0?1:3):(ty>0?2:0)]); if(pts.length>500)break; }
  if(pts.length) pts[pts.length-1][2]=pts.length>1?pts[pts.length-2][2]:G.tool.dir;
  if(pts.length===1) pts[0][2]=G.tool.dir;
  return pts;
}
function placeBeltPath(path){
  for(let i=0;i<path.length;i++){
    const [x,y,d]=path[i];
    const c=cellAt(x,y);
    if(!c) continue;
    if(c.b&&c.b.ty==='belt'){
      if(c.b.dir!==d){ pushOp({a:'dir',id:c.b.id,from:c.b.dir,to:d}); c.b.dir=d; }
      continue;
    }
    const ok=canPlace('belt',x,y);
    if(!ok.ok){ if(c.b) continue; else continue; }
    if(!spend(BDEFS.belt.cost)) { toastOnce('Out of credits','bad'); continue; }
    const b=addBuilding('belt',x,y,d,1,{silent:true});
    if(b){ b.invested=BDEFS.belt.cost; pushOp({a:'add',id:b.id,ser:serB(b)}); }
  }
}
let lastToastT=0;
function toastOnce(msg,cls){ const n=performance.now(); if(n-lastToastT>1200){ lastToastT=n; toast(msg,cls); } }
function poleLineFor(x0,y0,x1,y1){
  const pts=[];
  const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));
  const sx=Math.sign(x1-x0),sy=Math.sign(y1-y0);
  let last=null;
  for(let i=0;i<=n;i++){
    const x=Math.round(x0+(n?(x1-x0)*i/n:0)), y=Math.round(y0+(n?(y1-y0)*i/n:0));
    if(!last||dist2(x,y,last[0],last[1])>=16||i===n){ pts.push([x,y]); last=[x,y]; }
  }
  return pts;
}
