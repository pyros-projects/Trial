    cancelStroke();
    const ps=[...pointers.values()];
    pinch={d:Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y),cx:(ps[0].x+ps[1].x)/2,cy:(ps[0].y+ps[1].y)/2};
    downInfo=null;
    return;
  }
  const [cx,cy]=cellFromEvent(e);
  const pan=e.button===1||e.button===2;
  if(pan){ G.ui.dragCam=true; return; }
  downInfo={x:e.clientX,y:e.clientY,cx,cy,moved:false,btn:e.button,alt:e.altKey};
  if(e.altKey){ eyedrop(cx,cy); downInfo.consumed=true; return; }
  const t=G.tool;
  if(t.kind==='build'&&t.ty==='belt'){
    G.stroke={ops:[],path:[[cx,cy,t.dir]],sx:cx,sy:cy};
    placeBeltPath([[cx,cy,t.dir]]);
  } else if(t.kind==='build'){
    G.stroke={ops:[]};
    placeOne(t.ty,cx,cy);
  } else if(t.kind==='delete'){
    G.stroke={ops:[]};
    deleteAt(cx,cy);
  } else if(t.kind==='upgrade'){
    G.stroke={ops:[]};
    upgradeAt(cx,cy);
  } else if(t.kind==='move'){
    moveAt(cx,cy);
  } else if(t.kind==='select'){
    const b=pickBuilding(cx,cy);
    if(b){ openInspector(b); Snd.play('ui'); }
    else {
      closeInspector();
      G.marquee={x0:cx,y0:cy,x1:cx,y1:cy};
    }
  }
});
function placeOne(ty,x,y){
  const ok=canPlace(ty,x,y);
  if(!ok.ok){ toastOnce(ok.why,'bad'); Snd.play('error'); return; }
  if(!spend(BDEFS[ty].cost)){ toastOnce('Insufficient credits','bad'); Snd.play('error'); return; }
  const b=addBuilding(ty,x,y,G.tool.dir,1,{silent:false});
  if(b){ b.invested=BDEFS[ty].cost; pushOp({a:'add',id:b.id,ser:serB(b)}); }
}
function deleteAt(x,y){
  const c=cellAt(x,y); if(!c) return;
  if(c.b){ deleteB(c.b); return; }
  if(c.t===T_ROCK){ pushOp({a:'rock',x,y,from:T_ROCK}); c.t=0; addFx('poof',x+0.5,y+0.5); Snd.play('delete'); }
}
function upgradeAt(x,y){
  const b=pickBuilding(x,y);
  if(b) upgradeB(b);
}
function eyedrop(cx,cy){
  const b=pickBuilding(cx,cy);
  if(b&&b.ty!=='pole'){ setTool({kind:'build',ty:b.ty,dir:b.dir}); toast('Pipette: '+BDEFS[b.ty].name+' ▸'+['N','E','S','W'][b.dir]); Snd.play('pickup'); }
  else if(b){ setTool({kind:'build',ty:'pole',dir:0}); toast('Pipette: Power Pole'); }
}
function moveAt(x,y){
  if(!G.hand){
    const b=pickBuilding(x,y);
    if(!b){ toast('Nothing to pick up'); return; }
    const ser=serB(b);
    G.hand={ser,dir:b.dir};
    pushOp({a:'del',x:b.x,y:b.y,ser});
    removeBuilding(b,{silent:false});
    Snd.play('pickup');
    setToolKeepHand();
  } else {
    const ser=G.hand.ser;
    const ok=canPlace(ser.ty,x,y);
    if(!ok.ok){ toastOnce(ok.why,'bad'); Snd.play('error'); return; }
    const b=restoreB(Object.assign({},ser,{x,y,d:G.hand.dir}),{silent:false});
    if(b){ pushOp({a:'add',id:b.id,ser:serB(b)}); Snd.play('drop'); }
    G.hand=null;
    refreshPalette();
  }
}
function setToolKeepHand(){ refreshPalette(); }
function cancelStroke(){
  if(G.marquee){ G.marquee=null; }
  if(G.stroke){ commitStroke(); }
}
function deleteMarquee(){
  if(!G.marquee) return;
  const {x0,y0,x1,y1}=G.marquee;
  const ax=Math.min(x0,x1),bx=Math.max(x0,x1),ay=Math.min(y0,y1),by=Math.max(y0,y1);
  G.stroke={ops:[]};
  let n=0;
  for(let y=ay;y<=by;y++)for(let x=ax;x<=bx;x++){
    const c=cellAt(x,y);
    if(c&&c.b){ deleteB(c.b); n++; }
    else if(c&&c.t===T_ROCK){ pushOp({a:'rock',x,y,from:T_ROCK}); c.t=0; n++; }
  }
  commitStroke();
  toast('Deleted '+n+' tiles');
  G.marquee=null;
}
cv.addEventListener('pointermove',e=>{
  const pt=pointers.get(e.pointerId);
  if(pt){ pt.x=e.clientX; pt.y=e.clientY; }
  const r=cv.getBoundingClientRect();
  const [wx,wy]=s2w(e.clientX-r.left,e.clientY-r.top);
  G.hoverCell=[Math.floor(wx),Math.floor(wy)];
  G.hover=pickBuilding(G.hoverCell[0],G.hoverCell[1]);
  if(pointers.size===2&&pinch){
    const ps=[...pointers.values()];
    const d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);
    const cx=(ps[0].x+ps[1].x)/2, cy=(ps[0].y+ps[1].y)/2;
    const k=clamp(d/Math.max(1,pinch.d),0.9,1.1);
    const r2=cv.getBoundingClientRect();
    const [wx0,wy0]=s2w(cx-r2.left,cy-r2.top);
    G.cam.z=clamp(G.cam.z*k,6,72);
    const [wx1,wy1]=s2w(cx-r2.left,cy-r2.top);
    G.cam.x+=wx0-wx1; G.cam.y+=wy0-wy1;
    G.cam.x+= (cx-pinch.cx)/G.cam.z; G.cam.y+=(cy-pinch.cy)/G.cam.z;
    pinch={d,cx,cy};
    return;
  }
  if(G.ui.dragCam&&pt){
    G.cam.x-=e.movementX/G.cam.z; G.cam.y-=e.movementY/G.cam.z;
    return;
  }
  if(downInfo){
    const dx=e.clientX-downInfo.x, dy=e.clientY-downInfo.y;
    if(Math.abs(dx)>4||Math.abs(dy)>4) downInfo.moved=true;
    const t=G.tool;
    const [cx,cy]=G.hoverCell;
    if(t.kind==='build'&&t.ty==='belt'&&G.stroke){
      const path=beltPathFor(G.stroke.sx,G.stroke.sy,cx,cy);
      G.stroke.path=path;
      placeBeltPath(path);
    } else if(t.kind==='build'&&t.ty==='pole'&&G.stroke){
      const pts=poleLineFor(G.stroke.sx,G.stroke.sy,cx,cy);
      for(const p of pts) placeOne('pole',p[0],p[1]);
    } else if((t.kind==='build'||t.kind==='delete'||t.kind==='upgrade')&&downInfo.moved){
      if(t.kind==='build') placeOne(t.ty,cx,cy);
      else if(t.kind==='delete') deleteAt(cx,cy);
      else upgradeAt(cx,cy);
    } else if(t.kind==='select'&&G.marquee){
      G.marquee.x1=cx; G.marquee.y1=cy;
    }
  }
  updateTooltip(e);
});
cv.addEventListener('pointerup',e=>{
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(G.ui.dragCam){ G.ui.dragCam=false; return; }
  if(downInfo&&!downInfo.consumed){
    if(G.stroke) commitStroke();
    if(G.marquee&&!e.shiftKey){
      // keep marquee for Del; also allow immediate click-through if tiny
      const m=G.marquee;
      if(m.x0===m.x1&&m.y0===m.y1) G.marquee=null;
    }
  }
  downInfo=null;
});
cv.addEventListener('pointercancel',e=>{ pointers.delete(e.pointerId); pinch=null; downInfo=null; G.ui.dragCam=false; if(G.stroke)commitStroke(); });
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const [wx0,wy0]=s2w(e.clientX-r.left,e.clientY-r.top);
  G.cam.z=clamp(G.cam.z*Math.exp(-e.deltaY*0.0012),6,72);
  const [wx1,wy1]=s2w(e.clientX-r.left,e.clientY-r.top);
  G.cam.x+=wx0-wx1; G.cam.y+=wy0-wy1;
},{passive:false});
/* ---------------- tooltip ---------------- */
function updateTooltip(e){
  const tt=$('#tooltip');
  const b=G.hover;
  if(!b||downInfo||G.hand){ tt.style.display='none'; return; }
  const d=BDEFS[b.ty];
  let html='<b>'+esc(d.name)+(b.tier>1?' T'+b.tier:'')+'</b> <span class="faint">('+b.x+','+b.y+')</span><br>';
  const st={working:'<span class="good">working</span>',starved:'<span class="warn">starved — missing inputs</span>',blocked:'<span class="bad">blocked — output full</span>',nopo:'<span class="bad">no power — place a pole nearby</span>',full:'<span class="warn">storage full</span>',depleted:'<span style="color:#c96ae0">deposit depleted</span>',off:'disabled',idle:'idle'}[b.st]||b.st;
  html+='status: '+st;
  if(POWERED[b.ty]) html+='<br>draw: '+fmtW(b.want?drawOf(b)*G.sim.pwDiff:0)+' · util '+Math.round(b.emaW*100)+'%';
  if(b.ty==='generator') html+='<br>coal '+b.fuel+'/'+FUELCAP+' · '+fmtW(b.burn>0?tierStat(b).out:0);
  if(b.ty==='belt'){ const arr=G.cells[b.y*G.W+b.x].items||[]; html+='<br>'+arr.length+' items · '+(tierStat(b).speed*G.sim.beltMul).toFixed(1)+' tiles/s'; }
  if(b.ty==='extractor'){ const c=G.cells[b.y*G.W+b.x]; html+='<br>deposit: '+fmtN(c.amt)+' left'; }
  if(b.ty==='smelter'||b.ty==='assembler'){ const rec=activeRecipe(b); if(rec) html+='<br>'+esc(rec.name)+' · '+Math.round(Math.min(1,b.prog/rec.time)*100)+'%'; }
  if(b.ty==='storage') html+='<br>'+stoCount(b)+' / '+tierStat(b).cap;
  if(b.ty==='pole'&&G.nets[b.net]) html+='<br>net #'+b.net+': '+fmtW(G.nets[b.net].sup)+'/'+fmtW(G.nets[b.net].dem);
  if(b.ty==='inserter'&&b.hold) html+='<br>holding '+ITEMS[b.hold].n;
  html+='<br><span class="faint">click to inspect</span>';
  tt.innerHTML=html;
  tt.style.display='block';
  const x=Math.min(innerWidth-260,e.clientX+14), y=Math.min(innerHeight-90,e.clientY+14);
  tt.style.left=x+'px'; tt.style.top=y+'px';
}
/* ---------------- keyboard ---------------- */
window.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select') return;
  Snd.ensure();
  const k=e.key;
  if(e.ctrlKey||e.metaKey){
    if(k==='z'||k==='Z'){ e.preventDefault(); applyUndo(); return; }
    if(k==='y'||k==='Y'){ e.preventDefault(); applyRedo(); return; }
    if(k==='s'||k==='S'){ e.preventDefault(); openFileModal(); return; }
    return;
  }
  switch(k){
    case ' ': e.preventDefault(); togglePause(); break;
    case 'n': case 'N': case '.': doStep(); break;
    case 'r': case 'R':{
      if(G.hand){ G.hand.dir=(G.hand.dir+1)&3; Snd.play('rotate'); }
      else if(G.tool.kind==='build'){ G.tool.dir=(G.tool.dir+1)&3; Snd.play('rotate'); updateHUD(); }
      else if(G.sel){ pushOp({a:'dir',id:G.sel.id,from:G.sel.dir,to:(G.sel.dir+1)&3}); G.sel.dir=(G.sel.dir+1)&3; Snd.play('rotate'); }
      break;
    }
    case 'q': case 'Q': if(G.hoverCell) eyedrop(G.hoverCell[0],G.hoverCell[1]); break;
    case 'v': case 'V': setTool({kind:'select'}); break;
    case 'm': case 'M': setTool({kind:'move'}); break;
    case 'u': case 'U': setTool({kind:'upgrade'}); break;
    case 'x': case 'X': case 'Delete': case 'Backspace':
      if(G.marquee){ deleteMarquee(); }
      else if(G.sel){ deleteB(G.sel); }
      else setTool({kind:'delete'});
      break;
    case 'Escape':
      if($('#modals').innerHTML) closeModal();
      else if(G.hand){ // drop back to origin
        const ser=G.hand.ser;
        const ok=canPlace(ser.ty,ser.x,ser.y);
        if(ok.ok){ const nb=restoreB(Object.assign({},ser,{d:G.hand.dir})); if(nb) pushOp({a:'add',id:nb.id,ser:serB(nb)}); }
        G.hand=null; refreshPalette();
      }
      else { G.marquee=null; closeInspector(); setToolKeepHand(); }
      break;
    case '-': case '_': cycleSpeed(-1); break;
    case '=': case '+': cycleSpeed(1); break;
    case 'g': case 'G': G.settings.showGrid=!G.settings.showGrid; break;
    case 'f': case 'F': G.cam.x=G.W/2; G.cam.y=G.H/2; break;
    case 'Tab': e.preventDefault(); toggleAnalytics(); break;
    case '?': case 'h': case 'H': openHelp(); break;
  }
  if(KEYREV[k]&&BDEFS[KEYREV[k]]){ setTool({kind:'build',ty:KEYREV[k]}); }
  const pan=28/G.cam.z*16;
  if(k==='a'||k==='ArrowLeft') G.cam.x-=pan;
  if(k==='d'||k==='ArrowRight') G.cam.x+=pan;
  if(k==='w'||k==='ArrowUp') G.cam.y-=pan;
  if(k==='s'||k==='ArrowDown') G.cam.y+=pan;
});
/* ---------------- main loop ---------------- */
let lastT=performance.now(), acc=0;
function frame(now){
  const dtReal=Math.min(0.1,(now-lastT)/1000);
  lastT=now;
  // fps
  G.ui.frames++;
  if(now-G.ui.fpsT>1000){ G.ui.fps=G.ui.frames; G.ui.frames=0; G.ui.fpsT=now; }
  if(!G.sim.paused){
    acc+=dtReal*G.sim.speed;
    const maxSteps=24;
    let steps=0;
    while(acc>=DT&&steps<maxSteps){ stepSim(DT); steps++; acc-=DT; }
    if(acc>DT*maxSteps) acc=0;
    // autosave
    G.autosaveT+=dtReal*G.sim.speed;
    if(G.settings.autosave&&G.autosaveT>45){ G.autosaveT=0; saveSlot('autosave'); }
  }
  tickFx(dtReal);
  render();
  // hum
  let wm=0,pm=0;
  for(const b of G.buildings){ if(POWERED[b.ty]){pm++; if(b.st==='working')wm++;} }
  Snd.setHum(pm?wm/pm:0);
  // HUD 4Hz
  if(now-(G.ui.hudT||0)>250){ G.ui.hudT=now; updateHUD(); }
  // analytics 1Hz
  if(G.ui.analyticsOpen&&now-(G.ui.anaT||0)>1000){ G.ui.anaT=now; refreshAnalytics(); }
  // inspector light refresh 2Hz
  if(G.ui.inspectorB&&now-(G.ui.insT||0)>500){ G.ui.insT=now; refreshInspectorLight(); }
  requestAnimationFrame(frame);
}
/* ---------------- public API (debug/testing) ---------------- */
window.FW={
  G, stepSim, startPreset, startStage, PRESETS, CAMPAIGN, ITEMS, BDEFS,
  togglePause, doStep, cycleSpeed, toggleAnalytics, openPresets, openCampaign, openFileModal, openShareModal, openHelp, openNewWorld,
  closeModal, loadAutosave(){ try{ loadWorld(JSON.parse(store.get('fw_slot_autosave'))); }catch(e){ toast('No autosave found','bad'); } },
  nextStage(){ closeModal(); if(G.stageIdx+1<CAMPAIGN.length) startStage(G.stageIdx+1); },
  setTool, applyUndo, applyRedo, saveSlot, loadWorld, serializeWorld, exportPNG,
  inspRotate(){ const b=G.ui.inspectorB; if(b){ pushOp({a:'dir',id:b.id,from:b.dir,to:(b.dir+1)&3}); b.dir=(b.dir+1)&3; Snd.play('rotate'); refreshInspector(); } },
  inspToggle(){ const b=G.ui.inspectorB; if(b){ b.en=!b.en; G.netDirty=true; refreshInspector(); } },
  inspUpgrade(){ const b=G.ui.inspectorB; if(b){ upgradeB(b); refreshInspector(); } },
  inspMove(){ const b=G.ui.inspectorB; if(b){ setTool({kind:'move'}); moveAt(b.x,b.y); } },
  inspDelete(){ const b=G.ui.inspectorB; if(b){ deleteB(b); } },
  refreshAllUI,
};
function refreshAllUI(){
  buildPalette(); buildAnalytics();
  if(G.ui.analyticsOpen) $('#analytics').classList.add('open');
  const ba=$('#btnAna'); if(ba) ba.classList.toggle('active',G.ui.analyticsOpen);
  const bs=$('#btnSnd'); if(bs) bs.classList.toggle('active',G.settings.sound);
  refreshSimCtl(); updateHUD(); updateHint();
  const ov=$('#ovSel'); if(ov) ov.value=G.settings.overlay;
}
/* ---------------- boot ---------------- */
function boot(){
  resizeCanvas();
  buildTopbar();
  startPreset('starter',{silent:true});
  refreshAllUI();
  requestAnimationFrame(frame);
  setTimeout(()=>toast('Welcome to FLOWWORKS — the Starter Line is already running. Press H for help.','good'),400);
}
window.addEventListener('beforeunload',()=>{ if(G.settings.autosave&&G.buildings.length) saveSlot('autosave'); });
boot();
</script>
