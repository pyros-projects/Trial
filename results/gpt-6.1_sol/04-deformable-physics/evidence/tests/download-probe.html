<!doctype html><title>Local download probe</title><button id="probe">Download text</button><button id="png">Download PNG</button><canvas id="canvas" width="320" height="200"></canvas><script>canvas.getContext('2d').fillRect(0,0,320,200);function save(blob,name){const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(blob);document.body.append(a);a.click();a.remove();}probe.onclick=()=>save(new Blob(['Local download probe.'],{type:'text/plain'}),'probe.txt');png.onclick=()=>canvas.toBlob(b=>save(b,'probe.png'),'image/png');</script>
