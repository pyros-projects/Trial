function truthTable(circuit,inputs,outputs,settings={}){let bits=0;const nodes=new Map(circuit.components.map(c=>[c.id,c]));for(const id of inputs){const c=nodes.get(id);if(!c||!['SWITCH','BUTTON','CONST'].includes(c.type))throw Error('Mark switches, buttons or constants as table inputs.');bits+=c.bits}if(bits>8)throw Error('Truth tables support up to 8 input bits (256 rows).');if(!outputs.length)throw Error('Mark at least one output.');const ancestors=new Set();const walk=id=>{if(ancestors.has(id))return;ancestors.add(id);for(const w of circuit.wires)if(w.to.id===id)walk(w.from.id)};for(const o of outputs)walk(o.id);for(const id of ancestors)if(seqTypes.has(nodes.get(id)?.type)||nodes.get(id)?.type==='CLOCK')throw Error('Selected outputs depend on sequential state or a clock. Choose a combinational subcircuit.');const rows=[];for(let row=0;row<2**bits;row++){const c=copy(circuit);let shift=bits;const iv=[];for(const id of inputs){const n=c.components.find(n=>n.id===id);shift-=n.bits;n.value=(row>>shift)&mask(n.bits);iv.push(n.value)}const e=new Engine(c,settings);e.reset();const ov=outputs.map(o=>e.output(o.id,o.port));rows.push({inputs:iv,outputs:ov,status:ov.some(v=>!known(v))?'unresolved':'stable'})}return{inputs:inputs.map(id=>({id,label:nodes.get(id).label,bits:nodes.get(id).bits})),outputs:outputs.map(o=>({...o,label:nodes.get(o.id).label,bits:ports(nodes.get(o.id)).find(p=>p.key===o.port)?.bits||1})),rows,bits}}
function expression(table,oi){if(table.outputs[oi].bits!==1||table.inputs.some(i=>i.bits!==1))return 'Bus output · see enumerated values';if(table.rows.some(r=>!known(r.outputs[oi])))return 'Unresolved rows · expression unavailable';const terms=table.rows.map((r,i)=>r.outputs[oi]===1?i:null).filter(v=>v!==null);if(!terms.length)return '0';if(terms.length===table.rows.length)return '1';let implicants=terms.map(i=>({s:i.toString(2).padStart(table.bits,'0'),covers:[i]})),primes=[];while(implicants.length){const used=new Set(),next=new Map();for(let i=0;i<implicants.length;i++)for(let j=i+1;j<implicants.length;j++){let diff=0,pos=-1;for(let k=0;k<table.bits;k++)if(implicants[i].s[k]!==implicants[j].s[k]){diff++;pos=k}if(diff===1&&implicants[i].s[pos]!=='-'&&implicants[j].s[pos]!=='-'){used.add(i);used.add(j);const s=implicants[i].s.slice(0,pos)+'-'+implicants[i].s.slice(pos+1);next.set(s,{s,covers:[...new Set([...implicants[i].covers,...implicants[j].covers])]})}}implicants.forEach((p,i)=>{if(!used.has(i))primes.push(p)});implicants=Array.from(next.values())}const remaining=new Set(terms),chosen=[];while(remaining.size){const p=primes.sort((a,b)=>b.covers.filter(x=>remaining.has(x)).length-a.covers.filter(x=>remaining.has(x)).length)[0];if(!p)break;chosen.push(p);p.covers.forEach(x=>remaining.delete(x));primes=primes.filter(x=>x!==p)}return chosen.map(p=>Array.from(p.s,(v,i)=>v==='-'?'':(v==='0'?'¬':'')+table.inputs[i].label).filter(Boolean).join(' · ')||'1').join(' + ')}

function nodeHTML(c){const h=nh(c),outs=L.ports(c).filter(p=>p.dir==='out'),main=engine.output(c.id,outs[0]?.key),cls=stateClass(main),titleFont=Math.max(11,9/view.z),maxChars=Math.max(5,Math.floor(118/(titleFont*.55)));let center='';if(c.type==='SWITCH'&&c.bits===1){center=`<g data-toggle="${c.id}" tabindex="0" role="button" aria-label="Toggle ${esc(c.label)}" aria-pressed="${main===1}"><rect class="toggle-track ${cls}" x="47" y="45" width="48" height="24" rx="12"/><circle class="toggle-knob" cx="${main===1?82:60}" cy="57" r="9"/><text class="toggle-digit" style="font-size:${Math.max(11,8/view.z)}px" x="${main===1?60:82}" y="61" text-anchor="middle">${val(main,c.bits)}</text></g>`}else if(['SWITCH','CONST','LED','COUNTER','REGISTER','DFF','LATCH','RAM','ROM'].includes(c.type)){const valueLen=String(val(main,c.bits)).length,valueFont=Math.max(15,9/view.z),bw=Math.min(112,Math.max(50,valueLen*valueFont*.6+20)),fitFont=Math.min(valueFont,(bw-14)/(Math.max(1,valueLen)*.6));center=`<g ${c.type==='SWITCH'?`data-toggle="${c.id}" tabindex="0" role="button" aria-label="Advance ${esc(c.label)}"`:''}><rect class="value-badge ${cls}" x="${(NW-bw)/2}" y="${h/2-8}" width="${bw}" height="30" rx="6"/><text class="value-text" style="font-size:${fitFont}px" x="${NW/2}" y="${h/2+13}" text-anchor="middle">${esc(val(main,c.bits))}</text></g>`}else if(c.type==='BUTTON'){center=`<g data-momentary="${c.id}" tabindex="0" role="button" aria-label="Hold ${esc(c.label)}"><circle class="value-badge ${cls}" cx="71" cy="${h/2+6}" r="16"/><circle fill="none" stroke="var(--wire)" cx="71" cy="${h/2+6}" r="10"/></g>`}else center=`<g class="node-glyph ${cls}" transform="translate(53 ${h/2-8}) scale(1.3)">${glyph(c.type)}</g>`;

function renderScene(){const focused=document.activeElement,focusData=focused?.closest?.('[data-port],[data-toggle],[data-momentary],[data-wire]')?.dataset,restoreFocus=focusData?{...focusData}:null;const cm=new Map(circuit.components.map(c=>[c.id,c]));$('#wires-layer').innerHTML=circuit.wires.map(w=>{const a=cm.get(w.from.id),b=cm.get(w.to.id);if(!a||!b)return'';const ap=portPos(a,w.from.port,'out'),bp=portPos(b,w.to.port,'in'),d=path(ap,bp),v=engine.output(a.id,w.from.port),cls=stateClass(v),bits=L.ports(a).find(p=>p.key===w.from.port&&p.dir==='out').bits;const badge=(bits>1||settings.overlay==='values'||selectedWire===w.id)?`<g transform="translate(${(ap.x+bp.x)/2} ${(ap.y+bp.y)/2-12})"><rect class="wire-value" x="-22" y="-9" width="44" height="16" rx="4"/><text class="wire-value-text" text-anchor="middle" y="2">${esc(val(v,bits).length>7?String(v):val(v,bits))}</text></g>`:'';return`<g data-wire="${w.id}" role="button" tabindex="0" aria-label="Wire ${esc(a.label)} ${w.from.port} to ${esc(b.label)} ${w.to.port}"><title>${esc(a.label)} → ${esc(b.label)} · ${bits} bit · ${esc(val(v,bits))}</title><path class="wire-hit" d="${d}"/><path class="wire ${cls} ${selectedWire===w.id?'selected':''} ${v&&L.known(v)&&settings.animation?'flow':''}" d="${d}"/>${badge}</g>`}).join('');$('#nodes-layer').innerHTML=circuit.components.map(nodeHTML).join('');if(settings.overlay==='queue'){for(const id of [...engine.queue,...engine.next]){const el=$(`[data-node="${id}"] .node-body`);if(el){el.style.stroke='var(--unknown)';el.style.fill='var(--soft)'}}}if(settings.overlay==='loops'){for(const loop of engine.loops)for(const id of loop){const el=$(`[data-node="${id}"] .node-body`);if(el){el.style.stroke='var(--unknown)';el.style.strokeDasharray='5 3'}}}renderTransform();renderGuides();renderDraft();drawMinimap();if(restoreFocus){let selector;if(restoreFocus.port)selector=`[data-component="${restoreFocus.component}"][data-port="${restoreFocus.port}"][data-direction="${restoreFocus.directi function bounds(){if(!circuit.components.length)return{x:0,y:0,w:600,h:400};const xs=circuit.components.map(c=>c.x),ys=circuit.components.map(c=>c.y);const x=Math.min(...xs)-35,y=Math.min(...ys)-35;return{x,y,w:Math.max(...circuit.components.map(c=>c.x+NW))+35-x,h:Math.max(...circuit.components.map(c=>c.y+nh(c)))+35-y}}

function startWire(port){const id=port.dataset.component,key=port.dataset.port,dir=port.dataset.direction;if(!wiring){wiring={id,port:key,dir};draftPoint=portPos(circuit.components.find(c=>c.id===id),key,dir);$('#canvas-hint').textContent='Choose a compatible '+(dir==='out'?'input':'output')+' port · Esc cancels';renderDraft();return}const other={id,port:key,dir};if(wiring.id===id&&wiring.port===key&&wiring.dir===dir)return;if(wiring.dir===dir){toast('Connect an output to an input.');wiring=null;renderDraft();return}const from=wiring.dir==='out'?wiring:other,to=wiring.dir==='in'?wiring:other;const a=circuit.components.find(c=>c.id===from.id),b=circuit.components.find(c=>c.id===to.id);if(!a||!b){toast('Connection cancelled · endpoint was removed.');return}const ap=L.ports(a).find(p=>p.dir==='out'&&p.key===from.port),bp=L.ports(b).find(p=>p.dir==='in'&&p.key===to.port);wiring=null;draftPoint=null;renderDraft();$('#canvas-hint').textContent='Click an input to toggle · Connect ports to create a wire';if(ap.bits!==bp.bits){toast(`Incompatible width: ${ap.bits}-bit output → ${bp.bits}-bit input.`);return}if(circuit.wires.some(w=>w.from.id===from.id&&w.from.port===from.port&&w.to.id===to.id&&w.to.port===to.port)){toast('These ports are already connected.');return}change(()=>circuit.wires.push({id:uid('w'),from:{id:from.id,port:from.port},to:{id:to.id,port:to.port}}));toast('Connected · '+ap.bits+' bit'+(ap.bits>1?'s':''));if(engine.warnings.length)toast(engine.warnings[0])}
function addComponent(type){let bits=['CLOCK','BUTTON','DFF','NOT'].includes(type)?1:settings.bits;if(['SPLIT','JOIN','REGISTER','COUNTER','RAM','ALU'].includes(type)&&bits===1)bits=4;if(type==='DECODER')bits=Math.min(3,bits);if(type==='CONTROL'||type==='ROM')bits=8;const r=$('#scene').getBoundingClientRect(),id=uid(),x=(r.width/2-view.x)/view.z-NW/2,y=(r.height/2-view.y)/view.z-50;const snap=v=>settings.snap?Math.round(v/20)*20:v;change(()=>{circuit.components.push({id,type,label:L.catalog[type].name,bits,x:snap(x)+selected.size*20,y:snap(y)+selected.size*20,value:0,initial:0,divider:1,...(['RAM','ROM'].includes(type)?{memory:Array(16).fill(0)}:{})});selected=new Set([id]);selectedWire=null});$('.palette').classList.remove('open');toast(L.catalog[type].name+' added · drag to place')}

function renderInspector(){const el=$('#inspector-content');if(!engine)return;if(inspectorTab==='diagnostics'){el.innerHTML=diagnosticsHTML();return}const cs=circuit.components.filter(c=>selected.has(c.id));if(selectedWire){const w=circuit.wires.find(w=>w.id===selectedWire);if(!w){selectedWire=null;return renderInspector()}const a=circuit.components.find(c=>c.id===w.from.id),b=circuit.components.find(c=>c.id===w.to.id),p=L.ports(a).find(p=>p.key===w.from.port&&p.dir==='out');el.innerHTML=`<div class="prop-heading"><div class="glyph-tile">${ico('wire')}</div><div><h2>Connection</h2><p>${p.bits} BIT BUS</p></div></div><p class="inspector-note">${esc(a.label)} / ${w.from.port}<br>↓<br>${esc(b.label)} / ${w.to.port}</p><div class="section-label">Live signal</div><div class="signal-row"><span class="signal-dot ${stateClass(engine.output(a.id,w.from.port))}"></span><span>${esc(val(engine.output(a.id,w.from.port),p.bits))}</span></div><div class="inspector-actions"><button data-action="addprobe">${ico('probe')}Probe</button><button data-action="delete">${ico('trash')}Delete</button></div>`;return}if(cs.length>1){el.innerHTML=`<div class="prop-heading"><div class="glyph-tile">${ico('grid')}</div><div><h2>${cs.length} components</h2><p>MULTIPLE SELECTION</p></div></div><p class="inspector-note">Drag to move the group. Internal connections stay attached.</p><div class="inspector-actions"><button data-action="duplicate">${ico('copy')}Duplicate</button><button data-action="delete">${ico('trash')}Delete</button></div><div class="section-label">Selection</div>${cs.map(c=>`<div class="diag-row"><span>${esc(c.label)}</span><span>${c.bits}b</span></div>`).join('')}`;return}if(!cs.length){el.innerHTML=`<div class="intro-card"><div class="eyebrow">YOUR CIRCUIT PLAYGROUND</div><h2>Small signals.<br>Big possibilities.</h2><p>Toggle an input. Follow the signal.<br>See the logic come to life.</p><button data-action="help">A quick tour ${ico('chevron')}</button></div><div class="section-label">Live signals <span style="float:right" class="mono">${circuit.probes.length} PROBES</span></div><div class="signal-list">${circuit.probes.slice(0,7).map(p=>{const c=circuit.components.find(c=>c.id===p.component),v=p.dir==='in'?engine.input(p.component,p.port):engine.output(p.component,p.port);return`<div class="signal-row"><span class="signal-dot ${stateClass(v)}"></span><span>${esc(p.name)}</span><span class="live-val ${v&&L.known(v)?'high-val':''}" data-live-probe="${p.id}">${esc(val(v,c?L.ports(c).find(q=>q.key===p.port&&q.dir===(p.dir||'out'))?.bits||1:1))}</span></div>`}).join('')}</div><div class="section-label">On the workbench</div><div class="diag-row"><span>Components</span><span>${circuit.components.length}</span></div><div class="diag-row"><span>Connections</span><span>${circuit.wires.length}</span></div><p class="inspector-note">Select a component to edit its properties or attach a named probe.</p>${engine.warnings.map(w=>`<div class="warning-card">${esc(w)}</div>`).join('')}`;return}const c=cs[0],ps=L.ports(c),sources=['SWITCH','BUTTON','CONST'].includes(c.type);el.innerHTML=`<div class="prop-heading"><div class="glyph-tile">${glyphSVG(c.type)}</div><div><h2>${esc(L.catalog[c.type].name)}</h2><p>${c.bits} BIT · ${esc(c.id.slice(-9))}</p></div></div><label class="field">Label<input data-property="label" aria-label="Component label" value="${esc(c.label)}" maxlength="100"></label><div class="field-row"><label class="field">Bit width<select data-property="bits" aria-label="Component bit width">${Array.from({length:16},(_,i)=>i+1).filter(b=>c.type==='CLOCK'?b===1:c.type==='CONTROL'?b===8:c.type!=='DECODER'||b<=3).map(b=>`<option value="${b}" ${c.bits===b?'selected':''}>${b} bit${b===1?'':'s'}</option>`).join('')}</select></label><label class="field">${sources?'Input value':'Initial value'}<input data-property="${sources?'value':'initial'}" aria-label="${sources?'Input value':'Initial value'}" type="number" min="0" max="${L.mask(c.bits)}" value="${sources?c.value:c.initial||0}"></label></div>${c.type==='CLOCK'?'<label class="field">Clock divider<input data-property="divider" aria-label="Clock divider" type="number" min="1" max="100" value="'+(c.divider||1)+'"></label>':''}<p class="inspector-note" style="margin-top:0">${esc(L.catalog[c.type].desc)}</p><div class="section-label">Live ports</div>${ps.map(p=>{const v=p.dir==='in'?engine.input(c.id,p.key):engine.output(c.id,p.key);return`<div class="port-inspect"><span class="signal-dot ${stateClass(v)}"></span><span>${p.dir==='in'?'←':'→'} ${esc(p.label)}</span><span class="muted">${p.bits}b</span><span class="port-val">${esc(val(v,p.bits))}</span><button data-probe-component="${c.id}" data-probe-port="${p.key}" data-probe-dir="${p.dir}" aria-label="Probe ${esc(p.label)}" title="Attach probe">${ico('probe')}</button></div>`}).join('')}<div class="section-label">Truth table markers</div>${sources?`<label class="check-row"><input type="checkbox" data-marker="input" ${circuit.truthInputs.includes(c.id)?'checked':''}>Use as table input</label>`:''}<label class="check-row"><input type="checkbox" data-marker="output" ${circuit.truthOutputs.some(o=>o.id===c.id)?'checked':''}>Use ${esc(ps.find(p=>p.dir==='out')?.label||'Q')} as table output</label>${['RAM','ROM'].includes(c.type)?`<button class="small" data-action="memory">${ico('code')}Edit memory words</button>`:''}<div class="inspector-actions"><button data-action="duplicate">${ico('copy')}Duplicate</button><button data-action="delete">${ico('trash')}Delete</button></div>`;if(!sources&&!['DFF','REGISTER','COUNTER','LATCH'].includes(c.type))el.querySelector('[data-property="initial"]')?.closest('label')?.remove()}
function diagnosticsHTML(){const domains=circuit.components.filter(c=>c.type==='CLOCK');return`<div class="eyebrow">ENGINE / LIVE DIAGNOSTICS</div><div class="diag-row"><span>State</span><span>${running?'RUNNING':'PAUSED'}</span></div><div class="diag-row"><span>Clock ticks</span><span>${engine.ticks}</span></div><div class="diag-row"><span>Propagation rounds</span><span>${engine.iterations}</span></div><div class="diag-row"><span>Pending events</span><span>${engine.pendingCount}</span></div><div class="diag-row"><span>Evaluations</span><span>${engine.events}</span></div><div class="diag-row"><span>Floating inputs</span><span>${engine.floating||0}</span></div><div class="diag-row"><span>Feedback regions</span><span>${engine.loops.length}</span></div><div class="section-label">Clock domains</div>${domains.length?domains.map(c=>`<div class="diag-row"><span>${esc(c.label)}</span><span>${(settings.speed/(c.divider||1)).toFixed(1)} Hz</span></div>`).join(''):'<p class="inspector-note" style="margin:0">Combinational circuit · no clock</p>'}<div class="section-label">Evaluation order (latest)</div><div class="queue-list">${engine.order.slice(-15).map(id=>esc(circuit.components.find(c=>c.id===id)?.label||id)).join(' → ')||'Idle'}</div><div class="section-label">Dirty event queue</div><div class="queue-list">${[...engine.queue,...engine.next].map(id=>esc(circuit.components.find(c=>c.id===id)?.label||id)).join(' → ')||'Empty · all signals settled'}</div><div class="section-label">Feedback & contention</div>${engine.warnings.length?engine.warnings.map(w=>`<div class="warning-card">${esc(w)}</div>`).join(''):'<p class="inspector-note" style="margin:0">'+(engine.loops.length?'Stable feedback · stored state resolved':'No feedback loops or competing drivers')+'</p>'}<div class="section-label">Canvas overlay</div><select id="overlay-select" aria-label="Diagnostic overlay" style="width:100%;font-size:11px">${[['none','None'],['values','Bus values'],['order','Evaluation order'],['que function updateStatus(){$('#footer-state').textContent=running?'RUNNING':'PAUSED';$('#footer-counts').textContent=circuit.components.length+' components · '+circuit.wires.length+' wires';$('#footer-events').textContent=engine.pendingCount+' pending';$('#footer-iterations').textContent=engine.iterations+' delta';$('#footer-clock').textContent='tick '+engine.ticks+' · '+settings.speed+' Hz';$('#footer-tool').textContent=activeTool.toUpperCase();$('#footer-fps').textContent=Math.round(fps)+' FPS';const v=selectedSignal();$('#footer-signal').textContent='signal '+(v===null?'—':val(v,1));$('#footer-warning').textContent=engine.warnings.length?'⚠ '+engine.warnings.length+' warning'+(engine.warnings.length>1?'s':''):'';$('#footer-warning').className=engine.warnings.length?'warning':'';$('#sim-status').innerHTML=`<span class="dot" style="background:${engine.warnings.length?'var(--unknown)':'var(--high)'}"></span>${engine.pendingCount?'Settling':running?'Running':engine.warnings.length?'Unresolved':'Ready'}`;$('#sample-count').textContent=engine.samples.length+' SAMPLE'+(engine.samples.length===1?'':'S');$('#record-state .dot').style.background=recording?'var(--high)':'var(--muted)';for(const el of $$('[data-live-probe]')){const p=circuit.probes.find(p=>p.id===el.dataset.liveProbe);if(!p)continue;const c=circuit.components.find(c=>c.id===p.component),v=p.dir==='in'?engine.input(p.component,p.port):engine.output(p.component,p.port);el.textContent=val(v,c?L.ports(c).find(q=>q.key===p.port&&q.dir===(p.dir||'out'))?.bits||1:1);el.classList.toggle('high-val',!!v&&L.known(v));el.previousElementSibling?.previousElementSibling?.classList?.remove('high','unknown','floating');el.parentElement.querySelector('.signal-dot').className='signal-dot '+stateClass(v)}}
function renderWave(){const svg=$('#waveform');if(!svg||instrumentTab!=='wave')return;const r=$('#instrument-body').getBoundingClientRect(),w=r.width,h=Math.max(r.height,circuit.probes.length*30+25),origin=w<500?128:172,rowH=Math.min(35,(h-25)/Math.max(1,circuit.probes.length)),scale=waveScale;svg.style.height=h+'px';svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const samples=engine.samples,count=samples.length,capacity=Math.max(1,Math.floor((w-origin-12)/scale)),start=Math.max(0,count-capacity-1-waveOffset),end=Math.min(count,start+capacity+2);let s=`<rect width="${origin}" height="${h}" fill="var(--paper)"/><line x1="${origin}" x2="${origin}" y1="0" y2="${h}" stroke="var(--line)"/>`;for(let i=0;i<=capacity+1;i++){const x=origin+i*scale;if(x>w)break;const sample=samples[start+i];s+=`<line class="wave-grid" x1="${x}" x2="${x}" y1="22" y2="${h}"/>${i%Math.max(1,Math.ceil(50/scale))===0?`<text class="wave-axis" x="${x+3}" y="13">${sample?'t'+sample.tick+(sample.time%2?'.5':''):''}</text>`:''}`}s+=`<text class="wave-axis" x="12" y="13">SIGNAL</text><text class="wave-axis" x="${origin-12}" y="13" text-anchor="end">VALUE</text>`;const inspect=waveCursor===null?count-1:Math.max(0,Math.min(count-1,waveCursor));circuit.probes.forEach((p,pi)=>{const c=circuit.components.find(c=>c.id===p.component),port=c&&L.ports(c).find(q=>q.key===p.port&&q.dir===(p.dir||'out')),bits=port?.bits||1,y=25+pi*rowH,lo=y+rowH-7,hi=y+6,v=samples[inspect]?.values[p.id]??'X';s+=`<line x1="0" x2="${w}" y1="${y+rowH}" y2="${y+rowH}" stroke="var(--line)" stroke-width=".5"/><circle cx="13" cy="${y+rowH/2}" r="2.5" fill="var(--high)"/><text class="wave-label" x="23" y="${y+rowH/2+3}">${esc(p.name.length>(w<500?6:12)?p.name.slice(0,w<500?5:11)+'…':p.name)}</text><text class="wave-value" x="${origin-11}" y="${y+rowH/2+3}" text-anchor="end">${esc(val(v,bits).length>8?String(v):val(v,bits))}</text>`;if(!count)return;if(bits===1){let pathStr='',lastY=null;for(let i=start;i<end;i++){const value=samples[i].values[p.id]??'X',vy=value===1?hi:value===0?lo:(hi+lo)/2,x=origin+(i-start)*scale;if(i===start)pathStr=`M${x} ${vy}`;else pathStr+=`H${x}V${vy}`;lastY=vy}pathStr+=`H${count<capacity?Math.min(w-12,origin+Math.max(2,count)*scale):w-12}`;s+=`<path class="wave-path" d="${pathStr}"/>`;for(let i=start;i<end;i++){const v=samples[i].values[p.id];if(!L.known(v))s+=`<text class="wave-axis" x="${origin+(i-start)*scale+4}" y="${y+rowH/2-3}" style="fill:var(--unknown)">${esc(v??'X')}</text>`}}else{let i=start;while(i<end){const v=samples[i].values[p.id]??'X';let j=i+1;while(j<end&&samples[j].values[p.id]===v)j++;const x=origin+(i-start)*scale,x2=count<capacity&&j===count?Math.min(w-12,origin+Math.max(2,count)*scale):Math.min(w-12,origin+(j-start)*scale);s+=`<path class="wave-bus" d="M${x} ${hi+2}L${x+3} ${hi}H${x2-3}L${x2} ${(hi+lo)/2}L${x2-3} ${lo}H${x+3}L${x} ${(hi+lo)/2}Z"/><text class="wave-axis" x="${(x+x2)/2}" y="${y+rowH/2+3}" text-anchor="middle" style="fill:var(--accent)">${esc(x2-x>50?val(v,bits):String(v))}</text>`;i=j}}});if(!circuit.probes.length)s+=`<text class="wave-empty" x="${w/2}" y="${h/2}" text-anchor="middle">Attach a probe to a live port to start recording.</text>`;else if(count===1&&w>400)s+=`<text class="wave-empty" x="${origin+130}" y="${h-9}">Toggle inputs or tick a clock to capture changes.</text>`;if(waveCursor!==null&&samples[inspect]){const x=origin+(inspect-start)*scale;s+=`<line class="wave-cursor" x1="${x}" x2="${x}" y1="0" y2="${h}"/><rect x="${Math.min(w-118,Math.max(origin,x+5))}" y="2" width="110" height="16" rx="3" fill="var(--ink)"/><text x="${Math.min(w-111,Math.max(origin+7,x+12))}" y="13" fill="var(--panel)" font-family="var(--mono)" font-size="8">sample ${samples[inspect].time} · tick ${samples[inspect].tick}</text>`}svg.innerHTML=s;svg.dataset.start=start;svg.dataset.origin=origin;svg.setAttribute('aria-label','Live waveforms. '+circuit.probes.map(p=>p.name+' '+String(samples[inspect]?.values[p.id]??'X')).join(', '));waveDirty=false}
function setInstrument(tab){instrumentTab=tab;$$('[data-instrument]').forEach(b=>b.classList.toggle('active',b.dataset.instrument===tab));if(tab==='wave'){$('#instrument-body').innerHTML='<svg id="waveform" role="img" aria-label="Live signal waveforms"></svg>';waveDirty=true;renderWave()}else renderTruth();}
function renderTruth(){if(!truthResult){$('#instrument-body').innerHTML=`<div class="truth-body"><div class="truth-empty"><div><h3>Every input. Every outcome.</h3><p>Enumerate a combinational circuit, up to 8 input bits.</p></div><button class="primary small" data-action="truth">${ico('table')}Generate table</button></div></div>`;return}const t=truthResult;$('#instrument-body').innerHTML=`<div class="truth-body">${t.outputs.map((o,i)=>`<div class="expression">${esc(o.label)} = ${esc(L.expression(t,i))}</div>`).join(' ')} <button class="small" data-action="truth">Configure</button> <button class="small" data-action="truthcsv">${ico('export')}CSV</button><table class="truth-table"><thead><tr>${[...t.inputs,...t.outputs].map(c=>`<th>${esc(c.label)}${c.bits>1?' ['+c.bits+']':''}</th>`).join('')}<th>State</th></tr></thead><tbody>${t.rows.map(r=>`<tr>${[...r.inputs,...r.outputs].map((v,i)=>`<td class="${v===1?'true':''}">${esc(val(v,[...t.inputs,...t.outputs][i].bits))}</td>`).join('')}<td>${esc(r.status)}</td></tr>`).join('')}</tbody></table></div>`}
function addProbe(id,port,dir='out',name){if(circuit.probes.length>=64){toast('The analyzer supports up to 64 probes.');return}const c=circuit.components.find(c=>c.id===id);if(!c)return;captureHistory();circuit.probes.push({id:uid('p'),component:id,port,dir,name:(name||c.label+' '+port).slice(0,50)});engine.sample();updateHeading();renderInspector();waveDirty=true;autosave();toast('Probe attached to '+c.label+' / '+port)}

function exportCSV(){const header=['sample','tick',...circuit.probes.map(p=>p.name)].map(csvCell).join(',');const lines=engine.samples.map(s=>[s.time,s.tick,...circuit.probes.map(p=>s.values[p.id]??'X')].map(csvCell).join(','));download('logiclab-waveforms.csv',[header,...lines].join('\n'),'text/csv')}
function exportVCD(){const defs=circuit.probes.map((p,i)=>{const c=circuit.components.find(c=>c.id===p.component),bits=L.ports(c).find(q=>q.key===p.port&&q.dir===(p.dir||'out')).bits;return{p,bits,code:'s'+i}});let t='$date '+new Date().toISOString()+' $end\n$version Logic Lab $end\n$timescale 1ns $end\n$scope module circuit $end\n'+defs.map(d=>'$var wire '+d.bits+' '+d.code+' '+d.p.name.replace(/\W/g,'_')+' $end').join('\n')+'\n$upscope $end\n$enddefinitions $end\n';for(const sample of engine.samples){t+='#'+sample.time+'\n';for(const d of defs){const v=sample.values[d.p.id]??'X';t+='b'+(L.known(v)?v.toString(2).padStart(d.bits,'0'):String(v).toLowerCase().repeat(d.bits))+' '+d.code+'\n'}}download('logiclab-waveforms.vcd',t)}
function exportSVG(png=false){if(sceneDirty)renderScene();const b=bounds(),defs=$('#scene defs').outerHTML,exportWorld=$('#world').cloneNode(true);exportWorld.classList.remove('overview');exportWorld.querySelector('#draft-layer')?.remove();exportWorld.querySelector('#guides-layer')?.remove();for(const group of exportWorld.querySelectorAll('[data-node]')){const c=circuit.components.find(c=>c.id===group.dataset.node);group.classList.remove('selected');const title=group.querySelector('.node-title');if(title&&c){title.textContent=c.label.length>20?c.label.slice(0,19)+'…':c.label;title.style.fontSize='11px'}for(const el of group.querySelectorAll('.node-subtitle'))el.style.fontSize='8px';for(const el of group.querySelectorAll('.port-label'))el.style.fontSize='7px';for(const el of group.querySelectorAll('.toggle-digit'))el.style.fontSize='11px';for(const el of group.querySelectorAll('.value-text'))el.style.fontSize=el.textContent.length>10?'10px':'15px'}const world=exportWorld.innerHTML;const text=`<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(b.w)}" height="${Math.ceil(b.h)}" viewBox="${b.x} ${b.y} ${b.w} ${b.h}" class="${settings.theme==='dark'?'dark':settings.theme==='contrast'?'contrast':''}"><style>${$('#styles').textContent}</style><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="${getComputedStyle(document.body).getPropertyValue('--paper').trim()}"/>${defs}${world}</svg>`;if(!png){download('logiclab-circuit.svg',text,'image/svg+xml');return}const url=URL.createObjectURL(new Blob([text],{type:'image/svg+xml'})),img=new Image();img.onload=()=>{try{const canvas=document.createElement('canvas'),scale=Math.min(2,4000/b.w,4000/b.h);canvas.width=Math.ceil(b.w*scale);canvas.height=Math.ceil(b.h*scale);const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{if(blob)download('logiclab-circuit.png',blob,'image/png');else toast('PNG export could not be encoded.')})}catch(e){toast('PNG export failed: '+e.message)}URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);toast('PNG rendering failed. SVG export is available.')};img.src=url}
function compact(){const bytes=new TextEncoder().encode(JSON.stringify(circuit));let binary='';for(const b of bytes)binary+=String.fromCharCode(b);return'#c='+btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function showModal(title,subtitle,body,width=790){closeModal();lastFocus=document.activeElement;const overlay=document.createElement('div');overlay.className='modal-backdrop';overlay.id='modal';overlay.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" style="max-width:${width}px"><div class="modal-head"><div><h2 id="modal-title">${esc(title)}</h2><p>${esc(subtitle)}</p></div><button class="icon-btn" data-action="closemodal" aria-label="Close dialog">${ico('close')}</button></div><div class="modal-body">${body}</div></section>`;overlay.addEventListener('pointerdown',e=>{if(e.target===overlay)closeModal()});document.body.append(overlay);setTimeout(()=>overlay.querySelector('input,button,select,textarea')?.focus(),0)}
function closeModal(){const modal=$('#modal');if(modal){modal.remove();lastFocus?.focus?.()}}
const exampleInfo=[['half','Half adder','Two gates add two bits.','XOR'],['full','Full adder','Make room for carry-in.','ADDER'],['mux','Multiplexer','One select. Two possibilities.','MUX'],['sr','SR latch','Feedback that remembers.','NOR'],['register','Edge-triggered register','Capture data on a clock edge.','REGISTER'],['counter','Binary counter','Watch four bits count to 15.','COUNTER'],['alu','Small ALU','Arithmetic meets logic.','ALU'],['memory','Memory test','Write, address, and read.','RAM'],['cpu','Tiny 4-bit CPU','A connected computer that counts.','CONTROL']];

`).join('')}</select></label>${[['grid','Dot grid'],['snap','Snap to 20-unit grid'],['animation','Animate active signals']].map(([v,t])=>`<label class="check-row"><input type="checkbox" data-setting="${v}" ${settings[v]?'checked':''}>${t}</label>`).join('')}</div></div><div class="settings-note">Ports must match direction and bit width. Multiple drivers are allowed: disagreement is X, and tri-state Z releases the bus. Sequential blocks sample on rising edges. Feedback is bounded by the settling limit.</div><div class="modal-foot"><button class="primary" data-action="closemodal">${ico('check')}Done</button><button class="small" data-action="export">Export & import</button><button class="small" data-action="help">Guide</button></div>`,640)}
function saveModal(){const projects=readStore('logiclab.projects',{});showModal('Your local projects.','Saved in this browser. Export a JSON file for a portable backup.',`<form id="project-form" class="project-form"><input id="save-name" aria-label="Project name" placeholder="Give your circuit a name" value="${esc(circuit.name)}" maxlength="80" required><button class="primary" type="submit">${ico('save')}Save project</button></form><div class="section-label">Saved projects · ${Object.keys(projects).length}</div><div id="project-list">${Object.entries(projects).sort((a,b)=>b[1].savedAt-a[1].savedAt).map(([key,p])=>`<div class="project-item"><div><h3>${esc(p.circuit.name)}</h3><p>${p.circuit.components.length} components · ${new Date(p.savedAt).toLocaleString()}</p></div><button data-load-project="${esc(key)}">Open</button><button class="icon-btn" data-delete-project="${esc(key)}" aria-label="Delete saved ${esc(p.circuit.name)}">${ico('trash')}</button></div>`).join('')||'<p class="inspector-note">Your first project starts here. Your active work is also autosaved.</p>'}</div><div class="modal-foot"><button class="small" data-action="export">${ico('export')}Export backup</button><button class="small" data-action="import">${ico('folder')}Import circuit</button></div>`,600)}
function exportModal(){showModal('Take your circuit with you.','Everything stays local. Export, import, or share your circuit as data.',`<div class="export-grid">${[['json','code','Circuit JSON','Complete editable topology, properties, and probes.'],['svg','image','Vector SVG','A crisp, scalable snapshot of your circuit.'],['png','image','High-resolution PNG','A rendered image for notes and presentations.'],['share','share','Compact share link','Circuit data in the URL fragment. No server required.'],['csv','wave','Waveform CSV','Real captured samples with ticks and signal values.'],['vcd','wave','Waveform VCD','Standard textual waveforms for other logic tools.']].map(([v,ic,t,d])=>`<button class="export-option" data-export="${v}">${ico(ic)}<div><h3>${t}</h3><p>${d}</p></div></button>`).join('')}</div><div class="modal-foot"><button data-action="import">${ico('folder')}Import JSON</button><button class="small" data-action="save">Named projects</button></div>`,640)}
function importModal(){showModal('Open a circuit.','Import validated Logic Lab JSON. Components are interpreted as data; imported code is never executed.',`<label class="field">Choose JSON file<input id="import-file" type="file" accept=".json,application/json" aria-label="Import circuit file"></label><label class="field">Or paste circuit JSON<textarea id="import-text" class="import-area" aria-label="Circuit JSON" placeholder='{"version":1,"name":"My circuit","components":[],"wires":[],"probes":[]}' spellcheck="false"></textarea></label><div class="inline-error" id="import-error" role="alert"></div><button class="primary" data-action="importjson">${ico('folder')}Open circuit</button>`,620)}
function importText(text){try{if(text.length>4e6)throw Error('File is larger than 4 MB.');const c=L.validateCircuit(JSON.parse(text));setRun(false);change(()=>{circuit=c;selected.clear();selectedWire=null});closeModal();fit();toast('Circuit imported · '+c.components.length+' components')}catch(e){$('#import-error').textContent='Could not import: '+e.message}}
function truthModal(){const candidates=circuit.components.filter(c=>['SWITCH','BUTTON','CONST'].includes(c.type));const outs=circuit.components.filter(c=>L.ports(c).some(p=>p.dir==='out'));let outDefaults=circuit.truthOutputs.length?circuit.truthOutputs:outs.filter(c=>c.type==='LED').map(c=>({id:c.id,port:'Q'}));if(selected.size>1){const so=outs.filter(c=>selected.has(c.id)&&!candidates.includes(c));if(so.length)outDefaults=so.map(c=>({id:c.id,port:L.ports(c).find(p=>p.dir==='out').key}))}showModal('Every possible combination.','Mark input sources and observed outputs. We enumerate up to 8 input bits, without changing your live circuit.',`<div class="mark-grid"><div><h3>Input sources</h3><div class="mark-list">${candidates.map(c=>`<label class="check-row"><input name="truth-in" type="checkbox" value="${c.id}" ${circuit.truthInputs.length?circuit.truthInputs.includes(c.id)?'checked':'':'checked'}>${esc(c.label)} <span class="badge">${c.bits}b</span></label>`).join('')||'<p class="inspector-note">Add a switch or constant.</p>'}</div></div><div><h3>Observed outputs</h3><div class="mark-list">${outs.map(c=>L.ports(c).filter(p=>p.dir==='out').map(p=>`<label class="check-row"><input name="truth-out" type="checkbox" value="${c.id}:${p.key}" ${outDefaults.some(o=>o.id===c.id&&o.port===p.key)?'checked':''}>${esc(c.label)} / ${esc(p.label)} <span class="badge">${p.bits}b</span></label>`).join('')).join('')}</div></div></div><div class="inline-error" id="truth-error" role="alert"></div><div class="modal-foot"><button class="primary" data-action="generatetruth">${ico('table')}Generate table</button><span class="muted" style="font-size:10px">Sequential ancestors are detected and rejected.</span></div>`,680)}
function probeModal(ref){let initial=ref;if(!initial&&selectedWire){const w=circuit.wires.find(w=>w.id===selectedWire);initial={id:w.from.id,port:w.from.port,dir:'out'}}if(!initial&&selected.size){const c=circuit.components.find(c=>c.id===Array.from(selected)[0]);initial={id:c.id,port:L.ports(c).find(p=>p.dir==='out').key,dir:'out'}}showModal('Put a signal under the scope.','Name a probe and attach it to an actual simulation port.',`<label class="field">Probe name<input id="probe-name" aria-label="Probe name" placeholder="e.g. Accumulator" maxlength="50" value="${initial?esc(circuit.components.find(c=>c.id===initial.id).label):''}"></label><label class="field">Live port<select id="probe-port" aria-label="Probe port">${circuit.components.map(c=>`<optgroup label="${esc(c.label)}">${L.ports(c).map(p=>`<option value="${c.id}:${p.key}:${p.dir}" ${initial&&initial.id===c.id&&initial.port===p.key&&initial.dir===p.dir?'selected':''}>${esc(c.label)} / ${p.label} · ${p.dir} · ${p.bits} bit</option>`).join('')}</optgroup>`).join('')}</select></label><button class="primary" data-action="attachprobe">${ico('probe')}Attach probe</button><div class="section-label">Current probes</div>${circuit.probes.map(p=>`<div class="project-item"><div><h3>${esc(p.name)}</h3><p>${esc(circuit.components.find(c=>c.id===p.component)?.label||'')} / ${esc(p.port)} · ${p.dir||'out'}</p></div><button class="icon-btn" data-remove-probe="${p.id}" aria-label="Remove ${esc(p.name)} probe">${ico('trash')}</button></div>`).join('')}`,530)}
function instrumentModal(){showModal('Your signal recorder.','Samples come directly from simulation ports. Captures retain the latest 2,048 samples.',`<div class="diag-row"><span>Captured samples</span><span>${engine.samples.length}</span></div><div class="diag-row"><span>Clock tick</span><span>${engine.ticks}</span></div><label class="check-row"><input id="recording" type="checkbox" ${recording?'checked':''}>Record new samples</label><label class="field">Time scale (pixels / sample)<input id="wave-scale" aria-label="Waveform time scale" type="range" min="8" max="100" value="${waveScale}"></label><div class="modal-foot"><button class="small" data-action="clearwave">Clear capture</button><button class="small" data-export="csv">Export CSV</button><button class="small" data-export="vcd">Export VCD</button></div><div class="modal-foot"><button class="small" data-action="addprobe">${ico('probe')}Manage probes</button><button class="small" data-action="truth">${ico('table')}Truth table</button></div><div class="modal-foot"><button class="small" data-action="settings">${ico('settings')}Lab settings</button><button class="small" data-action="help">${ico('help')}Guide & shortcuts</button></div><p class="inspector-note">Click the waveform to inspect a sample. Scroll over it to move through history; hold Ctrl to zoom the time axis.</p>`,520)}
function memoryModal(){const c=circuit.components.find(c=>c.id===Array.from(selected)[0]);if(!c||!['RAM','ROM'].includes(c.type))return;showModal('Edit '+c.label,'16 words, each '+c.bits+' bits. Decimal or 0x-prefixed hexadecimal values, separated by spaces or commas.',`<textarea id="memory-words" class="import-area" aria-label="Memory words">${(c.memory||Array(16).fill(0)).map(v=>'0x'+v.toString(16).toUpperCase()).join(' ')}</textarea><div class="inline-error" id="memory-error" role="alert"></div><button class="primary" data-action="applymemory">${ico('check')}Apply words</button>${c.type==='ROM'&&c.bits===8?'<p class="inspector-note">CPU instructions: 0x1n LDI n · 0x2n ADD n · 0x30 OUT · 0x4n JMP n · 0xF0 HALT. The low nibble is the four-bit immediate.</p>':''}`,560)}
function helpModal(){showModal('A few bits of guidance.','Build real circuits, follow live signals, and take one clock edge at a time.',`<div class="help-grid"><div><h3>Connect the dots</h3><p>Click a palette component to add it. Drag its body to arrange it. Click an output port, then a matching input port to connect them; dragging between ports also works. Ports show the live value and bus width in their tooltip.</p><h3 style="margin-top:18px">Understand the signals</h3><p>Green = active / high. Grey = low. Amber X = unknown or conflicting. Blue-grey Z = floating / high impedance. Accessible mode uses blue and amber plus distinct line patterns.</p><h3 style="margin-top:18px">Inspect & experiment</h3><p>Use the inspector to name components, change bit widths, edit memory, and attach probes. Generate a truth table for marked combinational inputs and outputs. Diagnostics expose the queue, evaluation order, clock domains, fan-out, and feedback.</p><h3 style="margin-top:18px">The tiny CPU</h3><p>The clock drives a program counter, accumulator, and output register. ROM feeds instruction control; the ALU uses the accumulator and immediate bus. Each rising edge executes the current instruction. The built-in program counts 1, 2, 3… on OUTPUT. All blocks and wires are editable.</p></div><div><h3>Keyboard shortcuts</h3><div class="shortcuts">${[['Select / wire / pan','V / W / H'],['Pan temporarily','Hold Space'],['Multi-select','Shift + click'],['Select all','Ctrl / ⌘ + A'],['Copy / paste','Ctrl / ⌘ + C / V'],['Duplicate','Ctrl / ⌘ + D'],['Delete selection','Delete / Backspace'],['Undo / redo','Ctrl / ⌘ + Z / Shift Z'],['Save project','Ctrl / ⌘ + S'],['Clock tick / event step','T / E'],['Run / pause','Enter'],['Reset simulation','R'],['Fit / zoom','F / + / −'],['Cancel / close','Esc'],['Open this guide','?']].map(([t,k])=>`<span>${t}</span><kbd>${k}</kbd>`).join('')}</div><div class="settings-note">Mouse wheel zooms the workspace. Touch a component to drag it, touch ports to wire, and drag empty space to pan. Two fingers pinch to zoom. Everything runs in this file; there are no network calls.</div></div></div>`,760)}
const actions={
 workspace(){closeModal();$('.palette').classList.remove('open');$('.inspector').classList.remove('open')},examples:examplesModal,settings:settingsModal,save:saveModal,export:exportModal,help:helpModal,import:importModal,truth:truthModal,addprobe:()=>probeModal(),instrumentmenu:instrumentModal,memory:memoryModal,
 closemodal:closeModal,palette(){const p=$('.palette');p.classList.toggle('open');$('.inspector').classList.remove('open')},inspector(){const p=$('.inspector');p.classList.toggle('open');$('.palette').classList.remove('open')},
 undo:()=>undo(),redo:()=>undo(true),delete:deleteSelection,duplicate(){copySelection();pasteSelection()},copy:copySelection,paste:pasteSelection,fit,zoomin:()=>zoom(1.2),zoomout:()=>zoom(1/1.2),pan:()=>setTool(activeTool==='pan'?'select':'pan'),
 run:()=>setRun(!running),tick,reset(){cancelInteraction();setRun(false);engine.reset();sceneDirty=true;waveDirty=true;renderInspector();toast('Simulation reset · deterministic state restored')},
 event(){setRun(false);if(!engine.pendingCount){engine.iterations=0;for(const c of circuit.components)engine.enqueue(c.id)}engine.stepEvent();if(recording)engine.sample();sceneDirty=true;waveDirty=true;renderInspector();toast(engine.pendingCount+' events pending')},
 new(){setRun(false);change(()=>{circuit={version:1,name:'Untitled circuit',description:'Your next idea starts with a single bit.',components:[],wires:[],probes:[],truthInputs:[],truthOutputs:[]};selected.clear();selectedWire=null});closeModal();fit()},
 collapse(){document.body.classList.toggle('collapsed');$('[data-action="collapse"]').setAttribute('aria-label',document.body.classList.contains('collapsed')?'Expand instruments':'Collapse instruments');setTimeout(()=>{waveDirty=true;drawMinimap()},0)},
 wavezoomin(){waveScale=Math.min(100,waveScale*1.25);waveDirty=true},wavezoomout(){waveScale=Math.max(8,waveScale/1.25);waveDirty=true},

 importjson(){importText($('#import-text').value)},
 generatetruth(){try{const inputs=$$('input[name="truth-in"]:checked').map(e=>e.value),outputs=$$('input[name="truth-out"]:checked').map(e=>{const [id,port]=e.value.split(':');return{id,port}});const result=L.truthTable(circuit,inputs,outputs,{limit:settings.limit});captureHistory();circuit.truthInputs=inputs;circuit.truthOutputs=outputs;truthResult=result;truthResult.fixedSources=Object.fromEntries(circuit.components.filter(c=>['SWITCH','BUTTON','CONST'].includes(c.type)&&!inputs.includes(c.id)).map(c=>[c.id,c.value]));autosave();closeModal();document.body.classList.remove('collapsed');setInstrument('truth');toast(result.rows.length+' combinations · '+result.rows.filter(r=>r.status==='unresolved').length+' unresolved')}catch(e){$('#truth-error').textContent=e.message}},
 truthcsv(){if(!truthResult)return;const t=truthResult;download('logiclab-truth-table.csv',[[...t.inputs.map(c=>c.label),...t.outputs.map(c=>c.label),'status'],...t.rows.map(r=>[...r.inputs,...r.outputs,r.status])].map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv')},

};
