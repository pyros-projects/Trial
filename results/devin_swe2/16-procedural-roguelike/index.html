    d.n} — ${esc(d.desc)}</span>
    ${d.use?mbtn('USE',`RG.ui.invDo(${i},'use')`):''}
    ${d.slot?mbtn('EQUIP',`RG.ui.invDo(${i},'equip')`):''}
    ${mbtn('DROP',`RG.ui.invDo(${i},'drop')`)}</div>`}
function invDo(i,op){const it=S.player.inv[i];if(!it)return;
  if(op==='use'&&['firebomb','knife','fwand','smoke'].includes(ITEMS[it.id].use)){
    closeModal();openTargeting(it.id);return}
  S.modal=false;closeModal();commitAction({a:op,item:it})}
function unequip(slot){const p=S.player,it=p.equip[slot];if(!it)return;
  p.equip[slot]=null;p.inv.push(it);showInventory()}
/* ---- death / victory / levelup ---- */
function showDeath(){const r=S.result;openModal(`<h1 style="color:var(--blood)">YOU DIED</h1>
  <div class="sub">${r.how} · floor ${r.floor+1} · turn ${r.turn}</div>
  <div style="font-size:1.4em;color:var(--amber)">score ${r.score}</div>
  <div class="row">${SET.perma?'':mbtn('RETRY FLOOR','RG.ui.retryFloor()')}
  ${mbtn('NEW RUN','RG.ui.toTitle()')}${mbtn('EXPORT REPLAY','RG.ui.exportRep()')}</div>`)}
function showVictory(){const r=S.result;openModal(`<h1 style="color:var(--amber)">VICTORY</h1>
  <div class="sub">The Hollow King is unmade. The crown is yours.</div>
  <div style="font-size:1.4em;color:var(--amber)">score ${r.score}</div>
  <div class="row">${mbtn('NEW RUN','RG.ui.toTitle()')}${mbtn('EXPORT REPLAY','RG.ui.exportRep()')}</div>`)}
function checkLevelup(){if(R.replaying)return;
  if(R.pendingLevelup&&S.awaitInput&&!S.modal){R.pendingLevelup=false;R.levelupOpen=true;
  const opts=[{n:'Sharpen',d:'+2 weapon damage'},{n:'Harden',d:'+1 armor'},
    {n:'Focus',d:'+8 accuracy'}];
  openModal(`<h1>LEVEL UP</h1><div class="sub">choose a boon</div><div class="row">
    ${opts.map((o,i)=>`<div class="pick" onclick="RG.ui.boon(${i})"><div class="pn">${o.n}</div>
      <div class="pd">${o.d}</div></div>`).join('')}</div>`)}}
function pickBoon(i){if(!R.levelupOpen)return;R.levelupOpen=false;const p=S.player;
  if(i===0){p.baseDmg=[p.baseDmg[0]+1,p.baseDmg[1]+1]}
  if(i===1)p.armor+=1;
  if(i===2)p.baseAcc+=8;
  S.actionLog.push({a:'lvl',pick:i});closeModal();updateHUD()}
/* ---- action bar ---- */
function buildAct(){const A=el('act');
  const defs=[['WAIT','wait','.'],['LOOK','insp','x'],['PACK','inv','i'],
    ['AIM','fire','f'],['POWER','abil','q'],['DOWN','desc','>'],['MENU','menu','esc']];
  A.innerHTML=defs.map(d=>`<button class="btn" id="b_${d[1]}" onclick="RG.ui.act('${d[1]}')">
    ${d[0]}<kbd>${d[2]}</kbd></button>`).join('')}

/* ========================== UI CALLBACKS ========================== */
const UI={
  pickCls(k){document.querySelectorAll('#clsrow .pick').forEach(p=>
    p.style.borderColor=p.dataset.cls===k?'var(--amber)':'');UI._cls=k;sfx('ui')},
  _cls:'vanguard',
  dailySeed(){el('seedin').value='daily-'+new Date().toISOString().slice(0,10);sfx('ui')},
  start(){const seed=(el('seedin').value.trim()||('run-'+Math.floor(Math.random()*1e9).toString(36)));
    const daily=seed.startsWith('daily-')?seed:null;
    SET.diff=el('diffin').value;SET.perma=el('permain').checked;saveSettings();
    closeModal();
    newRun({seed,cls:UI._cls,diff:SET.diff,arena:el('arenain').checked,
      floor0:+el('floorin').value,daily})},
  cont(){const st=loadGame();if(st){closeModal();loadState(st);S.over=false;
    if(S.result)S.result=null;toast('Run restored')}else toast('No save found')},
  importBox(){el('mcard').insertAdjacentHTML('beforeend',
    `<h2>Import run JSON</h2><textarea id="impbox" placeholder="paste exported run JSON"></textarea>
     <div class="row">${mbtn('LOAD','RG.ui.doImport()')}</div>`)},
  doImport(){importRun(el('impbox').value)},
  exportRun(){const j=exportRun();download('below-run.json',j);toast('Run exported')},
  exportRep(){const j=exportReplay();download('below-replay.json',j);toast('Replay exported')},
  settings(){showSettings()},help(){showHelp()},
  done(){closeModal();saveSettings();
    document.documentElement.style.setProperty('--fs',SET.text+'px')},
  resume(){closeModal()},saveTitle(){saveGame();closeModal();if(S)S.paused=false;showTitle()},
  restart(){const seed=S.seed,cls=S.cls;closeModal();
    newRun({seed,cls,diff:S.diff,arena:S.arena,floor0:0,daily:S.daily})},
  retryFloor(){closeModal();retryFloor()},
  toTitle(){closeModal();showTitle()},
  invMenu,invDo,unequip,boon:pickBoon,
  act(b){ensureAudio();if(!S||S.modal&&b!=='menu')return;
    switch(b){case 'wait':commitAction({a:'wait'});break;
      case 'insp':R.inspect=!R.inspect;toast(R.inspect?'Inspect — click a tile':'Inspect off');break;
      case 'inv':showInventory();break;
      case 'fire':openFire();break;
      case 'abil':openAbility();break;
      case 'desc':commitAction({a:'descend'});break;
      case 'menu':togglePause();break}}};
function download(name,text){const b=new Blob([text],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

/* ============================= BOOT ============================= */
function boot(){loadSettings();
  document.documentElement.style.setProperty('--fs',SET.text+'px');
  document.body.classList.toggle('hc',!!SET.contrast);
  R.parts=[];R.floaters=[];R.tracers=[];R.shake=0;R.hitFlash=0;
  resize();tileSprites();buildAct();bindPointer();
  window.addEventListener('resize',resize);
  window.addEventListener('keydown',keydown);
  showTitle();
  requestAnimationFrame(frame);
  setInterval(()=>{if(S&&S.awaitInput)checkLevelup()},200)}
window.RG={get S(){return S},set S(v){S=v},get TS(){return TS},ui:UI,DIAG,R,SET,
  commitAction,commitThrow,verifyReplay,stateHash,newRun,loadState,saveGame,loadGame,
  exportReplay,exportRun,importRun,serializeState,computeFOV,losClear,bfsFrom,pathTo,
  distMapPlayer,actorsAlive,floodRegions,buildFloor,T,ITEMS,ENEMIES,
  // diagnostic spawn/debug hooks (also used by diag overlays & tests)
  spawnEnemy(id,x,y){const e=mkEnemy(id,x,y);e.nextT=S.time+e.spd;S.ents.push(e);return e},
  give(id,qty){const it={id,qty:qty||ITEMS[id].qty||1};S.player.inv.push(it);return it},
  tp(x,y){S.player.x=x;S.player.y=y;S.player.rx=x;S.player.ry=y;refreshFOV()},
  mkEnemy,mkItemEnt,emitNoise,meleeAttack,hurt,refreshFOV,tickWorld};
boot();
</script>
</body>
</html>
