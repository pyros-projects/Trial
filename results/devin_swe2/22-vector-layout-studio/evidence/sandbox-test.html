<!doctype html><meta charset="utf-8">
<title>sandbox host</title>
<iframe id="f" sandbox="allow-scripts allow-downloads" src="../index.html"
  style="width:1200px;height:760px;border:0"></iframe>
<div id="result">pending</div>
<script>
const f=document.getElementById('f');
f.addEventListener('load',()=>{
  setTimeout(()=>{
    try{
      const w=f.contentWindow;
      // opaque origin: DOM access must throw or be denied
      let dom='accessible';
      try{ void w.document.querySelector('canvas'); }catch(e){ dom='blocked:'+e.name; }
      document.getElementById('result').textContent='dom-access='+dom;
    }catch(e){document.getElementById('result').textContent='err '+e.message;}
  },800);
});
</script>
