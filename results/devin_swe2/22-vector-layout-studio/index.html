const COL_RE=/^#[0-9a-fA-F]{3,8}$/;
function vNum(v,min,max){return isFin(v)&&v>=min&&v<=max;}
function vCoord(v){return vNum(v,-LIMITS.coord,LIMITS.coord);}
function vColor(v){return v==='none'||v==='transparent'||COL_RE.test(v);}
function validateItem(raw,ids,depth){
  if(!raw||typeof raw!=='object')return 'item is not an object';
  if(typeof raw.id!=='string'||!raw.id||raw.id.length>64)return 'bad/missing id';
  if(ids.has(raw.id))return 'duplicate id "'+raw.id+'"';
  ids.add(raw.id);
  if(!['rect','ellipse','line','text','path','group'].includes(raw.type))
    return 'unsupported type "'+raw.type+'"';
  const t=raw.t;if(!t||!vCoord(t.x)||!vCoord(t.y)||!isFin(t.rot)||!isFin(t.s)||t.s<=0||t.s>1e4)
    return 'bad transform on '+raw.id;
  if(raw.name!=null&&(typeof raw.name!=='string'||raw.name.length>80))return 'bad name';
  if(raw.fill!=null&&(typeof raw.fill!=='string'||!vColor(raw.fill)))return 'bad fill';
  if(raw.stroke!=null){const st=raw.stroke;
    if(st!==null&&(typeof st!=='object'||!vColor(st.color)||!vNum(st.width,0,LIMITS.strokeMax)))
      return 'bad stroke';}
  if(raw.opacity!=null&&!vNum(raw.opacity,0,1))return 'bad opacity';
  if(raw.visible!=null&&typeof raw.visible!=='boolean')return 'bad visible';
  if(raw.locked!=null&&typeof raw.locked!=='boolean')return 'bad locked';
  switch(raw.type){
    case 'rect':case 'ellipse':
      if(!vNum(raw.w,0.01,LIMITS.coord)||!vNum(raw.h,0.01,LIMITS.coord))return 'bad size';
      break;
    case 'line':
      if(!vCoord(raw.x1)||!vCoord(raw.y1)||!vCoord(raw.x2)||!vCoord(raw.y2))return 'bad line';
      break;
    case 'text':
      if(typeof raw.text!=='string'||raw.text.length>LIMITS.textChars)return 'bad text';
      if(!FAMILIES.includes(raw.family)||!WEIGHTS.includes(raw.weight)||
         !ALIGNS.includes(raw.align)||!vNum(raw.size,LIMITS.fontMin,LIMITS.fontMax)||
         !vNum(raw.lineHeight,0.4,4))return 'bad text props';
      break;
    case 'path':
      if(!Array.isArray(raw.pts)||raw.pts.length<2||raw.pts.length>LIMITS.anchors)
        return 'bad anchor count';
      for(const p of raw.pts){
        if(!p||!vCoord(p.x)||!vCoord(p.y))return 'bad anchor';
        for(const k of ['ci','co'])if(p[k]!=null&&(!vCoord(p[k].x)||!vCoord(p[k].y)))
          return 'bad handle';}
      if(raw.closed!=null&&typeof raw.closed!=='boolean')return 'bad closed';
      break;
    case 'group':
      if(depth>=LIMITS.groupDepth)return 'group nesting beyond '+LIMITS.groupDepth;
      if(!Array.isArray(raw.children)||!raw.children.length)return 'bad group children';
      for(const c of raw.children){const e=validateItem(c,ids,depth+1);if(e)return e;}
      break;
  }
  return null;
}
function sanitizeItem(raw){ // produce clean item with all defaults applied
  const it={id:raw.id,type:raw.type,name:typeof raw.name==='string'?raw.name:raw.type,
    t:{x:raw.t.x,y:raw.t.y,rot:raw.t.rot||0,s:raw.t.s},
    fill:vColor(raw.fill)?raw.fill:'none',
    stroke:raw.stroke?{color:raw.stroke.color,width:raw.stroke.width}:null,
    opacity:raw.opacity==null?1:clamp(raw.opacity,0,1),
    visible:raw.visible!==false,locked:raw.locked===true};
  switch(raw.type){
    case 'rect':case 'ellipse':it.w=raw.w;it.h=raw.h;break;
    case 'line':it.x1=raw.x1;it.y1=raw.y1;it.x2=raw.x2;it.y2=raw.y2;break;
    case 'text':it.text=raw.text;it.family=raw.family;it.size=raw.size;
      it.weight=raw.weight;it.align=raw.align;it.lineHeight=raw.lineHeight;break;
    case 'path':it.pts=raw.pts.map(p=>({x:p.x,y:p.y,
      ci:p.ci?{x:p.ci.x,y:p.ci.y}:null,co:p.co?{x:p.co.x,y:p.co.y}:null}));
      it.closed=!!raw.closed;break;
    case 'group':it.children=raw.children.map(sanitizeItem);break;
  }
  return it;
}
function importProject(text){
  try{
    if(text.length>LIMITS.fileBytes)return 'File too large ('+LIMITS.fileBytes+' byte cap).';
    let o;try{o=JSON.parse(text);}catch(e){return 'Not valid JSON.';}
    if(!o||typeof o!=='object')return 'Not a project file.';
    if(o.app!=='vector-layout-studio')return 'Not a Vector & Layout Studio project.';
    if(o.version!==1)return 'Unsupported project version '+JSON.stringify(o.version)+'.';
    const a=o.artboard;
    if(!a||!vNum(a.w,LIMITS.artMin,LIMITS.artMax)||!vNum(a.h,LIMITS.artMin,LIMITS.artMax))
      return 'Bad artboard size.';
    if(!['solid','transparent'].includes(a.bgType))return 'Bad background type.';
    if(a.bgType==='solid'&&!vColor(a.bg))return 'Bad background color.';
    if(!Array.isArray(o.items))return 'Missing items array.';
    const ids=new Set();let n=0;
    for(const r of o.items){const e=validateItem(r,ids,0);if(e)return 'Invalid item: '+e;
      n+=1+(function cnt(x){let m=0;if(x.type==='group')for(const c of x.children)m+=1+cnt(c);return m;})(r);}
    if(n>LIMITS.items)return 'Item count '+n+' exceeds limit '+LIMITS.items+'.';
    // all good — swap document atomically
    doc={app:'vector-layout-studio',version:1,
      artboard:{w:a.w,h:a.h,bgType:a.bgType,bg:a.bgType==='solid'?a.bg:'#ffffff'},
      items:o.items.map(sanitizeItem)};
    clearTimeout(nudgeTimer);nudgeBefore=null;
    sel=new Set();selAnchor=-1;inPath=null;docGen++;buildIndex();clearHistory();
    say('Project imported ('+n+' items). History cleared at this boundary.','ok');
    zoomFit();return null;
  }catch(err){return 'Import failed: '+err.message;}
}

/* ---------- SVG export ---------- */
function svgTransform(t){return `translate(${fmt(t.x)} ${fmt(t.y)}) rotate(${fmt(t.rot||0)}) scale(${fmt(t.s)})`;}
function svgItem(it,parentOp){
  if(!it.visible)return '';
  const op=(parentOp*(it.opacity==null?1:it.opacity));
  const tr=` transform="${svgTransform(it.t)}"`;
  const oa=op<1?` opacity="${fmt(op)}"`:'';
  if(it.type==='group')
    return `<g${tr}${oa}>${it.children.map(c=>svgItem(c,op)).join('')}</g>`;
  const fill=it.fill&&it.fill!=='none'?it.fill:'none';
  const st=it.stroke&&it.stroke.width>0?
    ` stroke="${it.stroke.color}" stroke-width="${fmt(it.stroke.width)}" stroke-linejoin="round" stroke-linecap="round"`:'';
  switch(it.type){
    case 'rect':return `<rect${tr}${oa} x="0" y="0" width="${fmt(it.w)}" height="${fmt(it.h)}" fill="${fill}"${st}/>`;
    case 'ellipse':return `<ellipse${tr}${oa} cx="${fmt(it.w/2)}" cy="${fmt(it.h/2)}" rx="${fmt(it.w/2)}" ry="${fmt(it.h/2)}" fill="${fill}"${st}/>`;
    case 'line':return `<line${tr}${oa} x1="${fmt(it.x1)}" y1="${fmt(it.y1)}" x2="${fmt(it.x2)}" y2="${fmt(it.y2)}"${st||' stroke="#000000" stroke-width="1"'}/>`;
    case 'path':{const pts=it.pts;if(!pts.length)return '';
      let d=`M ${fmt(pts[0].x)} ${fmt(pts[0].y)}`;
      for(const s of pathSegments(pts,it.closed))
        d+=` C ${fmt(s[1].x)} ${fmt(s[1].y)} ${fmt(s[2].x)} ${fmt(s[2].y)} ${fmt(s[3].x)} ${fmt(s[3].y)}`;
      if(it.closed)d+=' Z';
      return `<path${tr}${oa} d="${d}" fill="${fill}"${st}/>`;}
    case 'text':{const tm=textMetrics(it);
      const spans=tm.lines.map((ln,i)=>{
        const x=it.align==='center'?(tm.w-tm.widths[i])/2:it.align==='right'?tm.w-tm.widths[i]:0;
        return `<tspan x="${fmt(x)}" y="${fmt(i*tm.adv+it.size*0.8)}">${esc(ln)}</tspan>`;}).join('');
      return `<text${tr}${oa} font-family="${it.family}" font-size="${fmt(it.size)}" font-weight="${it.weight}" fill="${fill}">${spans}</text>`;}
  }
  return '';
}
function exportSVG(){
  const a=doc.artboard;
  let s=`<svg xmlns="${SVGNS}" width="${a.w}" height="${a.h}" viewBox="0 0 ${a.w} ${a.h}">`;
  if(a.bgType==='solid')s+=`<rect width="${a.w}" height="${a.h}" fill="${a.bg}"/>`;
  s+=doc.items.map(it=>svgItem(it,1)).join('')+'</svg>';
  downloadBlob('artboard.svg',new Blob([s],{type:'image/svg+xml'}));
}

/* ---------- PNG export ---------- */
function exportPNG(scale){
  const a=doc.artboard,w=Math.round(a.w*scale),h=Math.round(a.h*scale);
  if(w>4096||h>4096||w*h>16777216){
    say('Export refused: '+w+'×'+h+' exceeds 4096px side or 16,777,216px total.','err');return;}
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d');g.scale(scale,scale);
  renderScene(g,true);
  c.toBlob(b=>{if(!b){say('PNG encode failed.','err');return;}
    downloadBlob('artboard-'+scale+'x.png',b);},'image/png');
}

/* ---------- file input ---------- */
const fileInput=document.getElementById('fileInput');
fileInput.addEventListener('change',()=>{
  const f=fileInput.files[0];fileInput.value='';
  if(!f)return;
  if(f.size>LIMITS.fileBytes){say('File too large ('+LIMITS.fileBytes+' byte cap).','err');return;}
  const r=new FileReader(),gen=docGen;
  r.onload=()=>{if(gen!==docGen)return; // stale read after reset/replace
    const err=importProject(String(r.result));
    if(err)say('Import refused: '+err,'err');};
  r.onerror=()=>{if(gen===docGen)say('Could not read file.','err');};
  r.readAsText(f);
});

/* ---------- session ops ---------- */
function replaceDoc(makeDoc,label){
  if(inPath)inPath=null;
  closeTextEditor(false);if(gesture)cancelGesture();
  clearTimeout(nudgeTimer);nudgeBefore=null;
  sel=new Set();selAnchor=-1;docGen++;
  doc=makeDoc();buildIndex();clearHistory();
  say(label+' — history cleared at this boundary.','warn');zoomFit();
}
function resetEditor(){ // two-step confirm (no native dialogs: sandboxed)
  const b=document.getElementById('mReset');
  if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Click again to confirm reset';
    clearTimeout(b._t);b._t=setTimeout(()=>{b.dataset.arm='';b.textContent='Reset editor';},6000);
    say('Reset is non-undoable: restores the opening composition, clears history and pending edits. Click Reset again to confirm.','warn');return;}
  b.dataset.arm='';b.textContent='Reset editor';
  replaceDoc(compSignal,'Editor reset to opening composition');
}
function exitPreview(){previewOn=false;document.body.classList.remove('preview');render();}
function enterPreview(){previewOn=true;document.body.classList.add('preview');
  closeTextEditor(true);if(gesture)cancelGesture();
  // fit artboard into stage, draw clean
  render();zoomFit();}
document.getElementById('previewExit').addEventListener('click',exitPreview);

/* ---------- wiring ---------- */
document.getElementById('mNew').addEventListener('click',()=>replaceDoc(newDoc,'New blank document'));
document.getElementById('mOpen').addEventListener('click',()=>fileInput.click());
document.getElementById('mSave').addEventListener('click',exportProject);
document.getElementById('mSvg').addEventListener('click',exportSVG);
document.getElementById('mPng1').addEventListener('click',()=>exportPNG(1));
document.getElementById('mPng2').addEventListener('click',()=>exportPNG(2));
document.getElementById('mCompA').addEventListener('click',()=>replaceDoc(compSignal,'Composition A — Signal'));
document.getElementById('mCompB').addEventListener('click',()=>replaceDoc(compStudioCard,'Composition B — Studio Card'));
document.getElementById('mPreview').addEventListener('click',enterPreview);
document.getElementById('mReset').addEventListener('click',resetEditor);
document.querySelectorAll('#toolGroup .tbtn').forEach(b=>
  b.addEventListener('click',()=>setTool(b.dataset.tool)));
document.getElementById('snapObjBtn').addEventListener('click',()=>{snapObj=!snapObj;say('Object/artboard snapping '+(snapObj?'on':'off'));render();});
document.getElementById('snapGridBtn').addEventListener('click',()=>{snapGrid=!snapGrid;say('Grid snapping '+(snapGrid?'on':'off'));render();});
document.getElementById('gridSize').addEventListener('change',e=>{
  const v=parseFloat(e.target.value);
  if(!vNum(v,1,512)){e.target.value=gridSize;say('Grid size 1–512.','warn');return;}
  gridSize=Math.round(v);render();});
document.getElementById('gridSize').addEventListener('keydown',e=>e.stopPropagation());
document.querySelectorAll('[data-al]').forEach(b=>
  b.addEventListener('click',()=>alignSel(b.dataset.al)));
document.querySelectorAll('[data-dist]').forEach(b=>
  b.addEventListener('click',()=>distributeSel(b.dataset.dist)));
document.getElementById('undoBtn').addEventListener('click',undo);
document.getElementById('redoBtn').addEventListener('click',redo);
document.getElementById('dupBtn').addEventListener('click',dupSel);
document.getElementById('groupBtn').addEventListener('click',groupSel);
document.getElementById('ungroupBtn').addEventListener('click',ungroupSel);
document.getElementById('delBtn').addEventListener('click',delSel);
document.getElementById('zoomIn').addEventListener('click',()=>zoomStep(1.25));
document.getElementById('zoomOut').addEventListener('click',()=>zoomStep(0.8));
document.getElementById('zoomFit').addEventListener('click',zoomFit);
document.getElementById('zoom100').addEventListener('click',zoom100);
document.getElementById('panelToggle').addEventListener('click',()=>
  document.getElementById('panel').classList.toggle('open'));
// close menus on outside click
document.addEventListener('pointerdown',e=>{
  document.querySelectorAll('details.menu[open]').forEach(d=>{
    if(!d.contains(e.target))d.removeAttribute('open');});},true);
document.querySelectorAll('details.menu .drop button').forEach(b=>
  b.addEventListener('click',()=>b.closest('details').removeAttribute('open')));

/* ---------- render hooks for panels ---------- */
const _render=render;
render=function(){_render();buildLayers();buildInspector();};

/* ---------- boot ---------- */
doc=compSignal();buildIndex();
// read-only diagnostics for testing/console inspection (no mutation API)
window.__vls={
  get doc(){return doc;},get sel(){return [...sel];},get view(){return view;},
  get past(){return past.length;},get future(){return future.length;},
  docBox:(id)=>{const it=byId.get(id);return it?docBox(it):null;},
  item:(id)=>byId.get(id)||null,
  exportSVG:()=>{const a=doc.artboard;
    let s=`<svg xmlns="${SVGNS}" width="${a.w}" height="${a.h}" viewBox="0 0 ${a.w} ${a.h}">`;
    if(a.bgType==='solid')s+=`<rect width="${a.w}" height="${a.h}" fill="${a.bg}"/>`;
    return s+doc.items.map(it=>svgItem(it,1)).join('')+'</svg>';}
};
render();zoomFit();
</script>
