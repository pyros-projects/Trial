<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector &amp; Layout Studio</title>
<style>
:root{
  --bg:#141519; --bg2:#1c1e24; --panel:#20232b; --panel2:#262a33;
  --line:#333845; --txt:#dfe3ea; --dim:#8b93a3; --acc:#4da3ff; --acc2:#2b6cb0;
  --warn:#ffb454; --err:#ff6b6b; --ok:#6bd88f; --snap:#ff4dd2;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--txt);display:flex;flex-direction:column;
  overflow:hidden;user-select:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.38;cursor:default}
/* ---------- top bar ---------- */
#topbar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:var(--bg2);
  border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:5}
#topbar .brand{font-weight:650;letter-spacing:.3px;margin-right:6px;white-space:nowrap;
  color:var(--acc);font-size:13px}
.tb-group{display:flex;align-items:center;gap:3px;background:var(--panel);
  border:1px solid var(--line);border-radius:7px;padding:2px}
.tb-group+.tb-group{margin-left:4px}
.tbtn{border:0;background:transparent;color:var(--txt);border-radius:5px;
  padding:4px 7px;min-width:26px;height:26px;display:inline-flex;align-items:center;
  justify-content:center;gap:4px;white-space:nowrap}
.tbtn:hover{background:var(--panel2)}
.tbtn.on{background:var(--acc2);color:#fff}
.tbtn.danger{color:var(--err)}
.tbtn svg{display:block}
.tb-sep{width:1px;align-self:stretch;background:var(--line);margin:2px 2px}
.tb-label{color:var(--dim);font-size:11px;padding:0 3px}
.tb-num{width:46px;background:var(--bg);border:1px solid var(--line);border-radius:5px;
  color:var(--txt);padding:2px 4px;height:24px;text-align:right}
.tb-num:focus{outline:1px solid var(--acc)}
details.menu{position:relative}
details.menu>summary{list-style:none;cursor:pointer;border-radius:5px;padding:4px 8px;
  min-height:26px;display:inline-flex;align-items:center;color:var(--txt)}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>summary:hover{background:var(--panel2)}
details.menu[open]>summary{background:var(--acc2);color:#fff}
details.menu .drop{position:absolute;top:calc(100% + 5px);left:0;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;min-width:200px;padding:4px;
  box-shadow:0 10px 28px rgba(0,0,0,.5);z-index:50}
.drop button{display:flex;width:100%;text-align:left;background:none;border:0;
  padding:6px 9px;border-radius:5px;color:var(--txt);align-items:center;gap:8px}
.drop button:hover{background:var(--acc2);color:#fff}
.drop .sub{color:var(--dim);font-size:11px;padding:5px 9px 2px;text-transform:uppercase;letter-spacing:.5px}
/* ---------- main ---------- */
#main{flex:1;display:flex;min-height:0;position:relative}
#stage{flex:1;position:relative;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#stage.pan #cv{cursor:grab}
#stage.panning #cv{cursor:grabbing}
#editLayer{position:absolute;inset:0;pointer-events:none}
#textEditor{position:absolute;pointer-events:auto;display:none;z-index:20;
  background:rgba(28,30,36,.96);border:1px solid var(--acc);border-radius:6px;
  color:var(--txt);padding:8px;resize:none;outline:none;
  box-shadow:0 8px 30px rgba(0,0,0,.55);user-select:text}
/* ---------- side panel ---------- */
#panel{width:264px;background:var(--bg2);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:4}
#panelToggle{display:none;position:absolute;right:8px;top:8px;z-index:30;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;
  color:var(--txt);padding:5px 9px}
.panel-scroll{flex:1;overflow-y:auto;min-height:0}
.psec{border-bottom:1px solid var(--line);padding:8px 10px}
.psec h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--dim);margin-bottom:7px;font-weight:650}
.prow{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.prow label{color:var(--dim);font-size:11px;min-width:14px}
.prow .lab{width:52px}
.prow input[type=number]{width:58px;background:var(--bg);border:1px solid var(--line);
  border-radius:5px;color:var(--txt);padding:3px 5px;text-align:right}
.prow input[type=number]:focus,.prow select:focus,.prow textarea:focus,#textEditor:focus{
  outline:1px solid var(--acc)}
.prow input[type=range]{flex:1;accent-color:var(--acc)}
.prow input[type=color]{width:30px;height:24px;padding:0;border:1px solid var(--line);
  border-radius:5px;background:var(--bg)}
.prow select{background:var(--bg);border:1px solid var(--line);border-radius:5px;
  color:var(--txt);padding:3px 4px;max-width:130px}
.prow textarea{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:5px;color:var(--txt);padding:5px;resize:vertical;min-height:52px;user-select:text}
.pbtn{background:var(--panel2);border:1px solid var(--line);border-radius:5px;
  color:var(--txt);padding:4px 8px;font-size:12px}
.pbtn:hover{border-color:var(--acc);color:#fff}
.pbtn.warn{border-color:var(--warn);color:var(--warn)}
.pbtn.on{background:var(--acc2);border-color:var(--acc2);color:#fff}
.hint{color:var(--dim);font-size:11px;margin-top:2px}
/* ---------- layers ---------- */
#layers{min-height:120px}
.lrow{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:5px;
  cursor:pointer;border:1px solid transparent}
.lrow:hover{background:var(--panel2)}
.lrow.sel{background:rgba(77,163,255,.16);border-color:var(--acc)}
.lrow .lic{color:var(--dim);flex:none;width:14px;text-align:center;font-size:10px}
.lrow .lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.lrow .lname.hidden-it{color:var(--dim);font-style:italic}
.lrow .lname.locked-it{color:var(--warn)}
.lrow button{background:none;border:0;color:var(--dim);padding:2px 3px;border-radius:4px;
  font-size:11px;line-height:1}
.lrow button:hover{color:#fff;background:var(--panel)}
.lrow button.lock-on{color:var(--warn)}
.lrow button.vis-off{color:var(--dim)}
.lrow .ord{color:var(--dim)}
.lindent{display:inline-block;width:12px;flex:none}
.lrename{flex:1;background:var(--bg);border:1px solid var(--acc);border-radius:4px;
  color:var(--txt);padding:1px 4px;font-size:12px;user-select:text}
/* ---------- status bar ---------- */
#statusbar{display:flex;align-items:center;gap:14px;padding:4px 10px;background:var(--bg2);
  border-top:1px solid var(--line);font-size:11.5px;color:var(--dim);overflow:hidden}
#statusbar .st{white-space:nowrap}
#statusbar #stMsg{margin-left:auto;color:var(--txt);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:46%}
#stMsg.err{color:var(--err)}
#stMsg.warn{color:var(--warn)}
#stMsg.ok{color:var(--ok)}
/* ---------- preview mode ---------- */
body.preview #topbar,body.preview #panel,body.preview #statusbar,body.preview #panelToggle{display:none!important}
#previewExit{display:none;position:absolute;top:10px;right:10px;z-index:40;
  background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--txt);
  padding:6px 10px}
body.preview #previewExit{display:block}
/* ---------- narrow ---------- */
@media (max-width:760px){
  #panel{position:absolute;right:0;top:0;bottom:0;transform:translateX(100%);
    transition:transform .15s;box-shadow:-8px 0 24px rgba(0,0,0,.5)}
  #panel.open{transform:none}
  #panelToggle{display:block}
  #statusbar{gap:8px;font-size:10.5px}
  #statusbar .st.hide-sm{display:none}
}
</style>
</head>
<body>
<header id="topbar">
  <span class="brand">Vector &amp; Layout Studio</span>
  <details class="menu"><summary>File</summary><div class="drop">
    <button id="mNew">New document <span style="margin-left:auto;color:var(--dim)">1200×800</span></button>
    <button id="mOpen">Open project…</button>
    <button id="mSave">Download project JSON</button>
    <div class="sub">Export</div>
    <button id="mSvg">Download SVG</button>
    <button id="mPng1">Download PNG · 1x</button>
    <button id="mPng2">Download PNG · 2x</button>
    <div class="sub">Examples</div>
    <button id="mCompA">Composition A — Signal</button>
    <button id="mCompB">Composition B — Studio Card</button>
    <div class="sub">Session</div>
    <button id="mPreview">Artboard preview</button>
    <button id="mReset" class="danger" style="color:var(--err)">Reset editor</button>
  </div></details>
  <div class="tb-group" id="toolGroup" role="toolbar" aria-label="Tools">
    <button class="tbtn" data-tool="select" title="Select / move (V)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 1l8 6-4.5.8L4 12z" fill="currentColor"/></svg></button>
    <button class="tbtn" data-tool="node" title="Node edit — path anchors &amp; handles (A)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 12C4 4 10 10 12 2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="1" y="10.5" width="3" height="3" fill="currentColor"/><rect x="10.5" y=".5" width="3" height="3" fill="currentColor"/></svg></button>
    <button class="tbtn" data-tool="rect" title="Rectangle (R)"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="3" width="10" height="8" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <button class="tbtn" data-tool="ellipse" title="Ellipse (O)"><svg width="14" height="14" viewBox="0 0 14 14"><ellipse cx="7" cy="7" rx="5.5" ry="4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <button class="tbtn" data-tool="line" title="Line (L)"><svg width="14" height="14" viewBox="0 0 14 14"><line x1="2" y1="12" x2="12" y2="2" stroke="currentColor" stroke-width="1.5"/></svg></button>
    <button class="tbtn" data-tool="path" title="Path — cubic Bézier pen (P)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 12Q7 1 12 12" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="2" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="7" cy="4" r="1.2" fill="currentColor"/></svg></button>
    <button class="tbtn" data-tool="text" title="Text (T)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 3h10M7 3v9" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
    <button class="tbtn" data-tool="pan" title="Pan view (H, or hold Space)"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 1v12M1 7h12M7 1L5 3m2-2l2 2M7 13l-2-2m2 2l2-2M1 7l2-2M1 7l2 2M13 7l-2-2m2 2l-2 2" stroke="currentColor" stroke-width="1.2" fill="none"/></svg></button>
  </div>
  <div class="tb-group" aria-label="Snapping">
    <button class="tbtn" id="snapObjBtn" title="Snap to objects &amp; artboard">Obj</button>
    <button class="tbtn" id="snapGridBtn" title="Snap to grid">Grid</button>
    <input class="tb-num" id="gridSize" type="number" min="1" max="512" step="1" value="10" title="Grid size (document units)" aria-label="Grid size">
  </div>
  <div class="tb-group" aria-label="Align and distribute">
    <button class="tbtn" data-al="l" title="Align left edges">⇤</button>
    <button class="tbtn" data-al="cx" title="Align horizontal centers">⇹</button>
    <button class="tbtn" data-al="r" title="Align right edges">⇥</button>
    <span class="tb-sep"></span>
    <button class="tbtn" data-al="t" title="Align top edges">⤒</button>
    <button class="tbtn" data-al="cy" title="Align vertical centers">⇄</button>
    <button class="tbtn" data-al="b" title="Align bottom edges">⤓</button>
    <span class="tb-sep"></span>
    <button class="tbtn" data-dist="h" title="Distribute equal horizontal gaps (3+)">⬌g</button>
    <button class="tbtn" data-dist="v" title="Distribute equal vertical gaps (3+)">⬍g</button>
  </div>
  <div class="tb-group" aria-label="Edit">
    <button class="tbtn" id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
    <button class="tbtn" id="redoBtn" title="Redo (Ctrl+Shift+Z / Ctrl+Y)">↷</button>
    <button class="tbtn" id="dupBtn" title="Duplicate (Ctrl+D)">⧉</button>
    <button class="tbtn" id="groupBtn" title="Group selection (Ctrl+G)">⧈</button>
    <button class="tbtn" id="ungroupBtn" title="Ungroup (Ctrl+Shift+G)">⧉̸</button>
    <button class="tbtn danger" id="delBtn" title="Delete (Del)">✕</button>
  </div>
  <div class="tb-group" aria-label="Zoom">
    <button class="tbtn" id="zoomOut" title="Zoom out">−</button>
    <span class="tb-label" id="zoomPct">100%</span>
    <button class="tbtn" id="zoomIn" title="Zoom in">+</button>
    <button class="tbtn" id="zoomFit" title="Fit artboard (0)">Fit</button>
    <button class="tbtn" id="zoom100" title="Zoom to 100% (1)">1:1</button>
  </div>
</header>
<main id="main">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="editLayer"><textarea id="textEditor" spellcheck="false" aria-label="Text editor"></textarea></div>
    <button id="previewExit">Exit preview (Esc)</button>
  </div>
  <button id="panelToggle">Panel</button>
  <aside id="panel"><div class="panel-scroll">
    <div class="psec" id="inspector"></div>
    <div class="psec" id="layers"><h3>Layers <span id="layerCount" style="text-transform:none;letter-spacing:0"></span></h3><div id="layerList"></div></div>
  </div></aside>
</main>
<footer id="statusbar">
  <span class="st" id="stTool">Select</span>
  <span class="st" id="stZoom">100%</span>
  <span class="st hide-sm" id="stSel">—</span>
  <span class="st hide-sm" id="stBounds">—</span>
  <span class="st hide-sm" id="stCount">—</span>
  <span class="st hide-sm" id="stHist">—</span>
  <span id="stMsg"></span>
</footer>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">
<script>
'use strict';
/* ================================================================
   Vector & Layout Studio — single-file 2D vector/layout editor.
   Scene model: tree of items, each with a similarity transform
   {x,y,rot,s} (translate · rotate · uniform-scale, s>0).
   ================================================================ */
const LIMITS = {
  items:200, anchors:32, groupDepth:4, textChars:2000, coord:1e6,
  artMin:64, artMax:2048, fileBytes:4*1024*1024, strokeMax:256,
  fontMin:4, fontMax:600, histMax:200
};
const SNAP_CSS = 6;            // snap window in CSS px
const HIT_CSS  = 6;            // pointer hit tolerance in CSS px
const FAMILIES = ['sans-serif','serif','monospace'];
const WEIGHTS  = ['normal','bold'];
const ALIGNS   = ['left','center','right'];
const SVGNS = 'http://www.w3.org/2000/svg';

/* ---------- small utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const isFin=v=>typeof v==='number'&&Number.isFinite(v);
const near=(a,b,e)=>Math.abs(a-b)<=(e==null?1e-9:e);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const deepClone=o=>JSON.parse(JSON.stringify(o));
function fmt(v){ return Math.abs(v)<1e-9?0:+v.toFixed(2); }
function fmtN(v){ return Math.round(v*100)/100; }

/* ---------- 2x3 matrix helpers ---------- */
const M={
  id:()=>({a:1,b:0,c:0,d:1,e:0,f:0}),
  mul:(m,n)=>({
    a:m.a*n.a+m.c*n.b, b:m.b*n.a+m.d*n.b,
    c:m.a*n.c+m.c*n.d, d:m.b*n.c+m.d*n.d,
    e:m.a*n.e+m.c*n.f+m.e, f:m.b*n.e+m.d*n.f+m.f}),
  apply:(m,p)=>({x:m.a*p.x+m.c*p.y+m.e, y:m.b*p.x+m.d*p.y+m.f}),
  inv(m){const det=m.a*m.d-m.b*m.c; if(!isFin(det)||Math.abs(det)<1e-12)return null;
    return {a:m.d/det,b:-m.b/det,c:-m.c/det,d:m.a/det,
      e:(m.c*m.f-m.d*m.e)/det, f:(m.b*m.e-m.a*m.f)/det};},
  fromT(t){const r=(t.rot||0)*Math.PI/180,co=Math.cos(r),si=Math.sin(r),s=t.s;
    return {a:co*s,b:si*s,c:-si*s,d:co*s,e:t.x,f:t.y};},
  toT(m){const s=Math.hypot(m.a,m.b);
    return {x:m.e,y:m.f,rot:Math.atan2(m.b,m.a)*180/Math.PI,s};},
  rotAbout(c,deg){const r=deg*Math.PI/180,co=Math.cos(r),si=Math.sin(r);
    return {a:co,b:si,c:-si,d:co,e:c.x-co*c.x+si*c.y,f:c.y-si*c.x-co*c.y};},
  scaleAbout(c,k){return {a:k,b:0,c:0,d:k,e:c.x-k*c.x,f:c.y-k*c.y};}
};
/* transform one similarity by another (L' = P⁻¹ · G · P · L handled by caller) */

/* ---------- scene model ---------- */
let uidCtr=1;
function uid(){ // generate id that cannot collide with imported ids
  let id; do{ id='n'+(uidCtr++); }while(byId.has(id)); return id;
}
function baseItem(type,name){
  return {id:'',type,name,t:{x:0,y:0,rot:0,s:1},fill:'none',
    stroke:null,opacity:1,visible:true,locked:false};
}
function mkRect(x,y,w,h,fill,name){const it=baseItem('rect',name||'Rectangle');
  it.id=uid();it.t.x=x;it.t.y=y;it.w=w;it.h=h;it.fill=fill;return it;}
function mkEllipse(x,y,w,h,fill,name){const it=baseItem('ellipse',name||'Ellipse');
  it.id=uid();it.t.x=x;it.t.y=y;it.w=w;it.h=h;it.fill=fill;return it;}
function mkLine(x1,y1,x2,y2,color,width,name){const it=baseItem('line',name||'Line');
  it.id=uid();it.x1=x1;it.y1=y1;it.x2=x2;it.y2=y2;
  it.stroke={color:color||'#dfe3ea',width:width==null?2:width};return it;}
function mkText(x,y,text,o){o=o||{};const it=baseItem('text',o.name||'Text');
  it.id=uid();it.t.x=x;it.t.y=y;it.text=text;
  it.family=o.family||'sans-serif';it.size=o.size||24;
  it.weight=o.weight||'normal';it.align=o.align||'left';
  it.lineHeight=o.lineHeight||1.25;it.fill=o.fill||'#111318';return it;}
function mkPath(pts,closed,o){o=o||{};const it=baseItem('path',o.name||'Path');
  it.id=uid();it.pts=pts;it.closed=!!closed;it.fill=o.fill||'none';
  if(o.stroke)it.stroke=o.stroke;if(o.tx||o.ty){it.t.x=o.tx||0;it.t.y=o.ty||0;}
  return it;}
function mkGroup(children,name){const it=baseItem('group',name||'Group');
  it.id=uid();it.children=children;return it;}
function anchor(x,y,ci,co){return {x,y,ci:ci||null,co:co||null};}

/* ---------- document ---------- */
let doc, byId=new Map(), parentOf=new Map();
function newDoc(){return {app:'vector-layout-studio',version:1,
  artboard:{w:1200,h:800,bgType:'solid',bg:'#ffffff'},items:[]};}
function buildIndex(){
  byId=new Map();parentOf=new Map();
  (function walk(list,parent,depth){
    for(const it of list){byId.set(it.id,it);parentOf.set(it.id,parent);
      if(it.type==='group')walk(it.children,it,depth+1);}
  })(doc.items,null,0);
}
function ancestorsOf(id){const out=[];let p=parentOf.get(id);while(p){out.push(p);p=parentOf.get(p.id);}return out;}
function descendantsOf(item){const out=[];(function w(it){if(it.type==='group')for(const c of it.children){out.push(c);w(c);}})(item);return out;}
function itemCount(){let n=0;for(const k of byId.keys())n++;return n;}
function groupDepthOf(item){let d=0,p=item;while(p){if(p.type==='group')d++;p=parentOf.get(p.id);}return d;}
function effVisible(item){ // visible here and through all ancestors
  let it=item;while(it){if(!it.visible)return false;it=parentOf.get(it.id);}return true;}
function effLocked(item){
  let it=item;while(it){if(it.locked)return true;it=parentOf.get(it.id);}return false;}
function hasLockedInside(item){
  if(item.locked)return true;
  for(const c of descendantsOf(item))if(c.locked)return true;return false;}
function selHasLocked(roots){ // locked self/ancestor OR locked descendant
  return roots.some(r=>effLocked(r)||hasLockedInside(r));}
function worldMatrix(item){
  let m=M.id(),chain=[];
  for(let it=item;it;it=parentOf.get(it.id))chain.unshift(it);
  for(const it of chain)m=M.mul(m,M.fromT(it.t));
  return m;
}

/* ---------- text measurement ---------- */
const mctx=document.createElement('canvas').getContext('2d');
function textFont(it){return it.weight+' '+it.size+'px '+it.family;}
function textMetrics(it){ // consistent layout for edit/bounds/export
  const lines=String(it.text).split('\n');
  mctx.font=textFont(it);
  let w=0;const widths=lines.map(l=>{const lw=mctx.measureText(l).width;if(lw>w)w=lw;return lw;});
  const adv=it.size*it.lineHeight;
  return {lines,widths,w:Math.max(w,1),h:Math.max(lines.length*adv,1),adv};
}

/* ---------- local geometry box (pre-transform, per spec convention) ---- */
function cubicExtrema(p0,c1,c2,p3){ // returns {minx,miny,maxx,maxy}
  let minx=Math.min(p0.x,p3.x),maxx=Math.max(p0.x,p3.x),
      miny=Math.min(p0.y,p3.y),maxy=Math.max(p0.y,p3.y);
  for(const ax of ['x','y']){
    const A=-p0[ax]+3*c1[ax]-3*c2[ax]+p3[ax];
    const B=3*p0[ax]-6*c1[ax]+3*c2[ax];
    const C=-3*p0[ax]+3*c1[ax];
    // solve 3At^2+2Bt+C=0
    const qa=3*A,qb=2*B,qc=C,roots=[];
    if(Math.abs(qa)<1e-12){if(Math.abs(qb)>1e-12)roots.push(-qc/qb);}
    else{const d=qb*qb-4*qa*qc;if(d>=0){const sd=Math.sqrt(d);
      roots.push((-qb+sd)/(2*qa),(-qb-sd)/(2*qa));}}
    for(const t of roots){if(t>1e-9&&t<1-1e-9){
      const u=1-t,v=u*u*u*p0[ax]+3*u*u*t*c1[ax]+3*u*t*t*c2[ax]+t*t*t*p3[ax];
      if(ax==='x'){if(v<minx)minx=v;if(v>maxx)maxx=v;}
      else{if(v<miny)miny=v;if(v>maxy)maxy=v;}}}
  }
  return {minx,miny,maxx,maxy};
}
function pathSegments(pts,closed){ // list of [a,c1,c2,b]
  const out=[],n=pts.length,last=closed?n:n-1;
  for(let i=0;i<last;i++){const a=pts[i],b=pts[(i+1)%n];
    out.push([a,a.co||a,b.ci||b,b]);}
  return out;
}
function localBox(item){
  switch(item.type){
    case 'rect':case 'ellipse':return {x:0,y:0,w:item.w,h:item.h};
    case 'line':{const x=Math.min(item.x1,item.x2),y=Math.min(item.y1,item.y2);
      return {x,y,w:Math.abs(item.x2-item.x1),h:Math.abs(item.y2-item.y1)};}
    case 'text':{const tm=textMetrics(item);return {x:0,y:0,w:tm.w,h:tm.h};}
    case 'path':{const pts=item.pts;if(!pts.length)return {x:0,y:0,w:0,h:0};
      let x0=pts[0].x,y0=pts[0].y,x1=x0,y1=y0;
      for(const s of pathSegments(pts,item.closed)){
        const e=cubicExtrema(s[0],s[1],s[2],s[3]);
        x0=Math.min(x0,e.minx);y0=Math.min(y0,e.miny);
        x1=Math.max(x1,e.maxx);y1=Math.max(y1,e.maxy);}
      for(const p of pts){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);
        x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}
      return {x:x0,y:y0,w:x1-x0,h:y1-y0};}
  }
  return {x:0,y:0,w:0,h:0};
}
/* document-space AABB: corners of local box through world matrix;
   groups = union of descendant document boxes (spec convention) */
function docBox(item,W){
  W=W||worldMatrix(item);
  if(item.type==='group'){
    let r=null;
    for(const c of item.children){
      const cb=docBox(c,M.mul(W,M.fromT(c.t)));
      r=r?unionBox(r,cb):cb;}
    return r||{x:0,y:0,w:0,h:0};
  }
  const b=localBox(item);
  const p1=M.apply(W,{x:b.x,y:b.y}),p2=M.apply(W,{x:b.x+b.w,y:b.y}),
        p3=M.apply(W,{x:b.x,y:b.y+b.h}),p4=M.apply(W,{x:b.x+b.w,y:b.y+b.h});
  const x0=Math.min(p1.x,p2.x,p3.x,p4.x),x1=Math.max(p1.x,p2.x,p3.x,p4.x),
        y0=Math.min(p1.y,p2.y,p3.y,p4.y),y1=Math.max(p1.y,p2.y,p3.y,p4.y);
  return {x:x0,y:y0,w:x1-x0,h:y1-y0};
}
function unionBox(a,b){const x0=Math.min(a.x,b.x),y0=Math.min(a.y,b.y);
  return {x:x0,y:y0,w:Math.max(a.x+a.w,b.x+b.w)-x0,h:Math.max(a.y+a.h,b.y+b.h)-y0};}
function selectionRoots(){ // effective selection: drop items whose ancestor is also selected
  const roots=[];
  for(const id of sel){const it=byId.get(id);if(!it)continue;
    if(!ancestorsOf(id).some(a=>sel.has(a.id)))roots.push(it);}

function unionSelBox(){let r=null;for(const it of selectionRoots()){
  const b=docBox(it);r=r?unionBox(r,b):b;}return r;}

/* ---------- rendering ---------- */
function itemPath2D(it){ // Path2D of local geometry (fill outline)
  const p=new Path2D();
  switch(it.type){
    case 'rect':p.rect(0,0,it.w,it.h);break;
    case 'ellipse':p.ellipse(it.w/2,it.h/2,Math.abs(it.w/2),Math.abs(it.h/2),0,0,Math.PI*2);break;
    case 'line':p.moveTo(it.x1,it.y1);p.lineTo(it.x2,it.y2);break;
    case 'path':{const pts=it.pts;if(!pts.length)break;p.moveTo(pts[0].x,pts[0].y);
      for(const s of pathSegments(pts,it.closed))
        p.bezierCurveTo(s[1].x,s[1].y,s[2].x,s[2].y,s[3].x,s[3].y);
      if(it.closed)p.closePath();break;}
  }
  return p;
}
function paintItem(g,it,parentOp){
  if(!it.visible)return;
  const op=parentOp*(it.opacity==null?1:it.opacity);
  g.save();
  const m=M.fromT(it.t);g.transform(m.a,m.b,m.c,m.d,m.e,m.f);
  if(it.type==='group'){for(const c of it.children)paintItem(g,c,op);g.restore();return;}
  g.globalAlpha=op;
  if(it.type==='text'){
    const tm=textMetrics(it);
    g.font=textFont(it);g.textBaseline='alphabetic';
    if(it.fill&&it.fill!=='none'){g.fillStyle=it.fill;
      tm.lines.forEach((ln,i)=>{const lw=tm.widths[i];
        const x=it.align==='center'?(tm.w-lw)/2:it.align==='right'?tm.w-lw:0;
        g.fillText(ln,x,i*tm.adv+it.size*0.8);});}
    g.restore();return;
  }
  const p2=itemPath2D(it);
  if(it.fill&&it.fill!=='none'&&it.type!=='line'){g.fillStyle=it.fill;g.fill(p2);}
  if(it.stroke&&it.stroke.width>0){g.strokeStyle=it.stroke.color;
    g.lineWidth=it.stroke.width;g.lineJoin='round';g.lineCap='round';g.stroke(p2);}
  g.restore();
}
function drawChecker(g,x,y,w,h,cell){ // transparency backdrop
  g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  g.fillStyle='#3a3d45';g.fillRect(x,y,w,h);g.fillStyle='#454952';
  for(let r=0;r*cell<h;r++)for(let c=0;c*cell<w;c++)
    if((r+c)%2)g.fillRect(x+c*cell,y+r*cell,cell,cell);
  g.restore();
}
function artScreen(){const a=doc.artboard;
  return {x:view.tx,y:view.ty,w:a.w*view.k,h:a.h*view.k};}
function renderScene(g,forExport){ // draw artboard + items at current view in doc coords
  const a=doc.artboard;
  if(a.bgType==='transparent'){if(!forExport)drawChecker(g,0,0,a.w,a.h,8);}
  else{g.fillStyle=a.bg;g.fillRect(0,0,a.w,a.h);}
  if(forExport){g.save();g.beginPath();g.rect(0,0,a.w,a.h);g.clip();}
  for(const it of doc.items)paintItem(g,it,1);
  if(forExport)g.restore();
}
function render(){
  dpr=Math.max(1,window.devicePixelRatio||1);
  const r=stage.getBoundingClientRect();
  if(cv.width!==Math.round(r.width*dpr)||cv.height!==Math.round(r.height*dpr)){
    cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);}
  cw=r.width;ch=r.height;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle='#141519';ctx.fillRect(0,0,cw,ch);
  // artboard shadow + paper
  const ar=artScreen();
  ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=24;ctx.shadowOffsetY=6;
  ctx.fillStyle=doc.artboard.bgType==='transparent'?'#3a3d45':doc.artboard.bg;
  ctx.fillRect(ar.x,ar.y,ar.w,ar.h);ctx.restore();
  ctx.strokeStyle='#3d4350';ctx.strokeRect(ar.x-.5,ar.y-.5,ar.w+1,ar.h+1);
  // doc space
  ctx.setTransform(dpr*view.k,0,0,dpr*view.k,dpr*view.tx,dpr*view.ty);
  renderScene(ctx,false);
  // grid (inside artboard)
  if(snapGrid&&!previewOn){
    const a=doc.artboard;let step=gridSize;
    while(step*view.k<7)step*=2;
    ctx.save();ctx.beginPath();ctx.rect(0,0,a.w,a.h);ctx.clip();
    ctx.strokeStyle='rgba(120,140,170,.18)';ctx.lineWidth=1/view.k;ctx.beginPath();
    for(let x=step;x<a.w;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,a.h);}
    for(let y=step;y<a.h;y+=step){ctx.moveTo(0,y);ctx.lineTo(a.w,y);}
    ctx.stroke();ctx.restore();
  }
  // in-progress path
  if(inPath)drawInPath();
  // screen-space overlays
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(!previewOn){
    drawSnapGuides();
    drawSelectionChrome();
    if(gesture&&gesture.type==='marquee')drawMarquee();
  }
  status();
}
function drawInPath(){
  const pts=inPath.pts;ctx.save();

  const p=new Path2D();p.moveTo(pts[0].x,pts[0].y);
  for(const s of pathSegments(pts,false))p.bezierCurveTo(s[1].x,s[1].y,s[2].x,s[2].y,s[3].x,s[3].y);
  ctx.stroke(p);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  for(const a of pts){const s=docToScreen(a);
    ctx.fillStyle='#fff';ctx.strokeStyle='#4da3ff';ctx.lineWidth=1.5;
    ctx.strokeRect(s.x-3.5,s.y-3.5,7,7);}

}
function drawSnapGuides(){

  ctx.save();ctx.strokeStyle='#ff4dd2';ctx.lineWidth=1;ctx.setLineDash([5,3]);
  for(const g of gesture.guides){

    else{const p=docToScreen({x:g.from,y:g.v}),q=docToScreen({x:g.to,y:g.v});
      ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);}

}
function selBoxScreen(){const b=unionSelBox();if(!b)return null;

  const b=selBoxScreen();if(!b)return null;
  const hs=[],x0=b.x,y0=b.y,x1=b.x+b.w,y1=b.y+b.h,cx=(x0+x1)/2,cy=(y0+y1)/2;
  const roots=selectionRoots();
  const isLine=roots.length===1&&roots[0].type==='line';
  const free=roots.length===1&&(roots[0].type==='rect'||roots[0].type==='ellipse');
  if(isLine)return [{id:'rot',x:cx,y:y0-22,rot:true}]; // endpoints are the handles
  hs.push({id:'nw',x:x0,y:y0},{id:'ne',x:x1,y:y0},{id:'se',x:x1,y:y1},{id:'sw',x:x0,y:y1});
  if(free)hs.push({id:'n',x:cx,y:y0},{id:'e',x:x1,y:cy},{id:'s',x:cx,y:y1},{id:'w',x:x0,y:cy});

function drawSelectionChrome(){
  ctx.save();
  for(const id of sel){const it=byId.get(id);if(!it||!effVisible(it))continue;
    const b=docBox(it),p=docToScreen({x:b.x,y:b.y});
    ctx.strokeStyle='rgba(77,163,255,.9)';ctx.lineWidth=1;
    ctx.strokeRect(p.x,p.y,b.w*view.k,b.h*view.k);
    if(it.type==='group'){ // child bounds
      ctx.strokeStyle='rgba(77,163,255,.4)';
      for(const c of it.children){const cb=docBox(c),cp=docToScreen({x:cb.x,y:cb.y});
        ctx.strokeRect(cp.x,cp.y,cb.w*view.k,cb.h*view.k);}}

  if(roots.length&&roots.every(i=>effVisible(i))){
    const hs=handlePositions()||[];
    for(const h of hs){
      if(h.rot){const b=selBoxScreen();ctx.strokeStyle='#4da3ff';
        ctx.beginPath();ctx.moveTo(b.x+b.w/2,b.y);ctx.lineTo(h.x,h.y);ctx.stroke();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(h.x,h.y,5,0,7);ctx.fill();
        ctx.strokeStyle='#4da3ff';ctx.stroke();}
      else{ctx.fillStyle='#fff';ctx.strokeStyle='#4da3ff';ctx.lineWidth=1.5;
        ctx.fillRect(h.x-4,h.y-4,8,8);ctx.strokeRect(h.x-4,h.y-4,8,8);}}

      ctx.fillStyle='#fff';ctx.strokeStyle='#4da3ff';ctx.lineWidth=1.5;

function drawNodeChrome(roots){

    const W=worldMatrix(it);
    it.pts.forEach((a,i)=>{
      const s=docToScreen(M.apply(W,a));
      if(i===selAnchor){
        // handle lines + dots
        const segs=[['ci',i===0&&it.closed?it.pts.length-1:i-1],
                    ['co',i===it.pts.length-1&&it.closed?0:i+1]];
        for(const [k,ni] of segs){const h=a[k];if(!h)continue;
          if(ni<0||ni>=it.pts.length)continue;

          ctx.strokeStyle='rgba(255,77,210,.9)';ctx.lineWidth=1;
          ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(hs.x,hs.y);ctx.stroke();

function drawMarquee(){

/* ---------- hit testing ---------- */
function hitLeaf(dp){ // topmost leaf under doc point (skips invisible)
  const tol=HIT_CSS/view.k;
  function test(it,W){
    if(!it.visible)return null;
    const Wc=M.mul(W,M.fromT(it.t));
    if(it.type==='group'){
      for(let i=it.children.length-1;i>=0;i--){
        const h=test(it.children[i],Wc);if(h)return h;}
      return null;}
    const inv=M.inv(Wc);if(!inv)return null;
    const lp=M.apply(inv,dp);
    switch(it.type){
      case 'rect':{const sw=it.stroke?it.stroke.width/2:0;
        if(it.fill&&it.fill!=='none'&&lp.x>=-tol&&lp.x<=it.w+tol&&lp.y>=-tol&&lp.y<=it.h+tol)return it;
        if(it.stroke&&lp.x>=-tol-sw&&lp.x<=it.w+tol+sw&&lp.y>=-tol-sw&&lp.y<=it.h+tol+sw){
          const inn=lp.x>tol+sw&&lp.x<it.w-tol-sw&&lp.y>tol+sw&&lp.y<it.h-tol-sw;
          if(!inn)return it;}
        return null;}
      case 'ellipse':{const cx=it.w/2,cy=it.h/2,rx=Math.max(it.w/2,1),ry=Math.max(it.h/2,1);
        const d=((lp.x-cx)/rx)**2+((lp.y-cy)/ry)**2;
        const sw=(it.stroke?it.stroke.width/2:0)+tol;
        const edge=sw/Math.max(rx,ry);
        if(it.fill&&it.fill!=='none'&&d<=1+edge)return it;
        if(it.stroke&&d<=1+edge*2&&d>=1-edge*2)return it;
        return null;}
      case 'line':{const d=distSeg(lp,{x:it.x1,y:it.y1},{x:it.x2,y:it.y2});
        return d<=Math.max(tol,(it.stroke?it.stroke.width/2:0)+2/view.k)?it:null;}
      case 'path':{const p2=itemPath2D(it);
        mctx.save();mctx.setTransform(1,0,0,1,0,0);
        let hit=false;
        if(it.fill&&it.fill!=='none')hit=mctx.isPointInPath(p2,lp.x,lp.y);
        if(!hit){mctx.lineWidth=(it.stroke?it.stroke.width:0)+2*tol+1;
          mctx.lineJoin='round';hit=mctx.isPointInStroke(p2,lp.x,lp.y);}
        mctx.restore();return hit?it:null;}
      case 'text':{const tm=textMetrics(it);
        return (lp.x>=-tol&&lp.x<=tm.w+tol&&lp.y>=-tol&&lp.y<=tm.h+tol)?it:null;}
    }
    return null;
  }
  for(let i=doc.items.length-1;i>=0;i--){
    const h=test(doc.items[i],M.id());if(h)return h;}
  return null;
}
function distSeg(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;
  const t=L?clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/L,0,1):0;
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
}
function topSelectable(leaf){ // canvas click selects root-level ancestor (groups as units)
  let it=leaf;while(parentOf.get(it.id))it=parentOf.get(it.id);return it;
}

/* ---------- snapping ---------- */
function collectSnapTargets(movingRoots){
  const moving=new Set();
  for(const r of movingRoots){moving.add(r.id);
    for(const d of descendantsOf(r))moving.add(d.id);}
  const anc=new Set();
  for(const r of movingRoots)for(const a of ancestorsOf(r.id))anc.add(a.id);
  const xs=[],ys=[];
  for(const it of byId.values()){
    if(moving.has(it.id)||anc.has(it.id))continue;
    if(!effVisible(it))continue;
    const b=docBox(it);
    xs.push({v:b.x,from:b.y,to:b.y+b.h},{v:b.x+b.w/2,from:b.y,to:b.y+b.h},{v:b.x+b.w,from:b.y,to:b.y+b.h});
    ys.push({v:b.y,from:b.x,to:b.x+b.w},{v:b.y+b.h/2,from:b.x,to:b.x+b.w},{v:b.y+b.h,from:b.x,to:b.x+b.w});
  }
  const a=doc.artboard;
  xs.push({v:0,from:0,to:a.h},{v:a.w/2,from:0,to:a.h},{v:a.w,from:0,to:a.h});
  ys.push({v:0,from:0,to:a.w},{v:a.h/2,from:0,to:a.w},{v:a.h,from:0,to:a.w});
  return {xs,ys};
}
function snapDelta(roots,b0,dx,dy){
  // returns {dx,dy,guides} — snap window SNAP_CSS px independent of zoom
  const guides=[],win=SNAP_CSS/view.k;
  if(!b0)return {dx,dy,guides};
  const moving=collectSnapTargets(roots);
  const featsX=[{v:b0.x,f:'l'},{v:b0.x+b0.w/2,f:'c'},{v:b0.x+b0.w,f:'r'}];
  const featsY=[{v:b0.y,f:'t'},{v:b0.y+b0.h/2,f:'c'},{v:b0.y+b0.h,f:'b'}];
  function best(feats,targets,gridVals){
    let bestC=null;
    const cand=[];
    if(snapObj)for(const t of targets)cand.push(t);
    if(snapGrid)for(const f of feats)gridVals(f.v).forEach(v=>
      cand.push({v,grid:true,from:null,to:null}));
    for(const f of feats)for(const t of cand){
      const c=t.v-f.v;if(Math.abs(c)>win)continue;
      if(!bestC||Math.abs(c)<Math.abs(bestC.c)-1e-9||
        (near(Math.abs(c),Math.abs(bestC.c))&&(t.v<bestC.t.v||
        (near(t.v,bestC.t.v)&&f.v<bestC.f.v))))
        bestC={c,t,f};}
    return bestC;
  }
  const gridAt=v=>{const g=Math.round(v/gridSize)*gridSize;return [g];};
  // proposed features = start + delta; evaluate corrections on top of dx,dy
  const fx=featsX.map(f=>({v:f.v+dx,f:f.f})),fy=featsY.map(f=>({v:f.v+dy,f:f.f}));
  const bx=best(fx,moving.xs,gridAt),by=best(fy,moving.ys,gridAt);
  if(bx){dx+=bx.c;
    const s=Math.min(b0.y+dy,bx.t.from==null?b0.y+dy:bx.t.from),
          e=Math.max(b0.y+dy+b0.h,bx.t.to==null?b0.y+dy+b0.h:bx.t.to);
    guides.push({axis:'x',v:bx.t.v,from:s,to:e});}
  if(by){dy+=by.c;
    const s=Math.min(b0.x+dx,by.t.from==null?b0.x+dx:by.t.from),
          e=Math.max(b0.x+dx+b0.w,by.t.to==null?b0.x+dx+b0.w:by.t.to);
    guides.push({axis:'y',v:by.t.v,from:s,to:e});}
  return {dx,dy,guides};
}

/* ---------- gestures ---------- */
function docDeltaToLocal(item,dx,dy){ // doc-space delta -> parent-space delta
  const p=parentOf.get(item.id);
  if(!p)return {x:dx,y:dy};
  const P=worldMatrix(p),inv=M.inv({a:P.a,b:P.b,c:P.c,d:P.d,e:0,f:0});
  const v=M.apply(inv,{x:dx,y:dy});return v;
}
function applyTranslate(roots,dx,dy){
  for(const it of roots){const l=docDeltaToLocal(it,dx,dy);
    it.t.x=it._sx+l.x;it.t.y=it._sy+l.y;}
}
cv.addEventListener('pointerdown',onDown);
cv.addEventListener('dblclick',e=>{
  if(textEdit)return;
  const dp=screenToDoc(evPos(e)),leaf=hitLeaf(dp);
  if(leaf&&leaf.type==='text'&&!effLocked(leaf)){
    sel=new Set([topSelectable(leaf).id]);openTextEditor(leaf,false);}});
window.addEventListener('pointermove',onMove);
window.addEventListener('pointerup',onUp);
window.addEventListener('pointercancel',()=>{if(gesture)cancelGesture();});
window.addEventListener('blur',()=>{if(gesture)cancelGesture();});

function onDown(e){
  if(textEdit)return; // editing text: canvas inert
  const pos=evPos(e),dp=screenToDoc(pos);
  if(e.button===1||tool==='pan'||spaceDown){
    gesture={type:'pan',sx:pos.x,sy:pos.y,tx:view.tx,ty:view.ty};
    stage.classList.add('panning');return;}
  switch(tool){
    case 'select':downSelect(e,pos,dp);break;
    case 'node':downNode(e,pos,dp);break;
    case 'rect':case 'ellipse':case 'line':downCreate(e,pos,dp);break;
    case 'text':downText(pos,dp);break;
    case 'path':downPath(pos,dp,e);break;
  }
  render();
}
function downSelect(e,pos,dp){
  // 1. selection handles?
  const hs=handlePositions()||[];
  for(const h of hs){if(Math.abs(pos.x-h.x)<=7&&Math.abs(pos.y-h.y)<=7){
    beginHandleGesture(h,pos,dp);return;}}
  // 2. line endpoint handles
  const roots=selectionRoots();
  if(roots.length===1&&roots[0].type==='line'){
    const it=roots[0],W=worldMatrix(it);
    for(const [i,pt] of [[1,{x:it.x1,y:it.y1}],[2,{x:it.x2,y:it.y2}]]){
      const s=docToScreen(M.apply(W,pt));
      if(Math.hypot(pos.x-s.x,pos.y-s.y)<=8){
        gesture={type:'lineEnd',item:it,idx:i,before:save()};
        return;}}
  }
  selAnchor=-1;
  // 3. item hit
  const leaf=hitLeaf(dp);
  if(leaf){
    const top=topSelectable(leaf);
    const chosen=sel.has(leaf.id)?leaf:top;
    let toggleId=null;
    if(e.shiftKey){
      if(sel.has(chosen.id))toggleId=chosen.id; // deselect on click-release
      else sel.add(chosen.id);
    }else if(!sel.has(chosen.id))sel=new Set([chosen.id]);
    const target=byId.get(chosen.id);
    const rs=selectionRoots();
    if((target&&effLocked(target)&&!toggleId)||selHasLocked(rs)){
      say('“'+(target.name||target.type)+'” is locked — unlock it in Layers to edit.','warn');
      gesture={type:'noop'};render();return;}
    for(const it of rs){it._sx=it.t.x;it._sy=it.t.y;}
    gesture={type:'move',roots:rs,start:dp,spx:pos.x,spy:pos.y,moved:false,
      box:unionSelBox(),before:save(),shift:e.shiftKey,hitId:chosen.id,toggleId};
    return;
  }
  // 4. marquee / deselect
  gesture={type:'marquee',sx:pos.x,sy:pos.y,cx:pos.x,cy:pos.y,
    base:e.shiftKey?new Set(sel):new Set(),shift:e.shiftKey};
}
function beginHandleGesture(h,pos,dp){
  const roots=selectionRoots();
  if(selHasLocked(roots)){say('Selection contains locked items.','warn');
    gesture={type:'noop'};return;}
  const b=unionSelBox();if(!b)return;
  const C={x:b.x+b.w/2,y:b.y+b.h/2};
  for(const it of roots){it._Wt=worldMatrix(it);
    const p=parentOf.get(it.id);it._PWt=p?worldMatrix(p):M.id();}
  const single=roots.length===1?roots[0]:null;
  if(h.rot){
    gesture={type:'rot',roots,C,startAng:Math.atan2(dp.y-C.y,dp.x-C.x),
      before:save()};
  }else if(single&&(single.type==='rect'||single.type==='ellipse')){
    gesture={type:'rectSize',item:single,hid:h.id,W:single._Wt,
      before:save()};
    // fixed opposite point in local coords
    const w=single.w,h2=single.h;
    const map={nw:[0,0],n:[null,0],ne:[w,0],e:[w,null],se:[w,h2],s:[null,h2],sw:[0,h2],w:[0,null]};
    const opp={nw:[w,h2],n:[null,h2],ne:[0,h2],e:[0,null],se:[0,0],s:[null,0],sw:[w,0],w:[w,null]}[h.id];
    gesture.opp={x:opp[0],y:opp[1]};
    gesture.fix={x:map[h.id][0],y:map[h.id][1]}; // coord pinned by edge handles
    gesture.worldOpp=M.apply(single._Wt,{x:opp[0]==null?0:opp[0],y:opp[1]==null?0:opp[1]});
    gesture.oppFree=opp;
  }else{
    gesture={type:'scale',roots,C,startD:Math.max(1e-6,Math.hypot(dp.x-C.x,dp.y-C.y)),
      before:save()};
  }
}
function downNode(e,pos,dp){
  // pick handle dot / anchor of selected path(s), else behave like select
  const roots=selectionRoots();
  for(const it of roots){if(it.type!=='path')continue;
    const W=worldMatrix(it);
    if(selAnchor>=0&&selAnchor<it.pts.length){
      const a=it.pts[selAnchor];
      for(const k of ['ci','co']){const h=a[k];if(!h)continue;
        const s=docToScreen(M.apply(W,h));
        if(Math.hypot(pos.x-s.x,pos.y-s.y)<=8){
          if(effLocked(it)||hasLockedInside(it)){say('Path is locked.','warn');gesture={type:'noop'};return;}
          gesture={type:'handle',item:it,ai:selAnchor,key:k,other:e.altKey?null:(k==='ci'?'co':'ci'),
            before:save()};return;}}
    }
    for(let i=0;i<it.pts.length;i++){const a=it.pts[i];
      const s=docToScreen(M.apply(W,a));
      if(Math.hypot(pos.x-s.x,pos.y-s.y)<=8){
        selAnchor=i;
        if(effLocked(it)||hasLockedInside(it)){say('Path is locked.','warn');gesture={type:'noop'};return;}
        if(e.altKey){ // alt-drag: grow symmetric handles from anchor
          gesture={type:'newHandle',item:it,ai:i,before:save()};
        }else gesture={type:'anchor',item:it,ai:i,moved:false,before:save()};
        return;}}

  downSelect(e,pos,dp);
}
function downCreate(e,pos,dp){
  if(itemCount()>=LIMITS.items){say('Item limit reached ('+LIMITS.items+').','err');
    gesture={type:'noop'};return;}
  const before=save();
  const it=tool==='rect'?mkRect(dp.x,dp.y,0,0,'#4da3ff')
    :tool==='ellipse'?mkEllipse(dp.x,dp.y,0,0,'#ff9f45')
    :mkLine(dp.x,dp.y,dp.x,dp.y,'#dfe3ea',2);
  doc.items.push(it);buildIndex();
  sel=new Set([it.id]);

}
function downText(pos,dp){

function isDark(hex){const c=parseInt(hex.slice(1,7),16);

function downPath(pos,dp,e){
  if(!inPath){

    inPath={pts:[],hoverClose:false};
  }

function commitPath(closed){

function onMove(e){
  if(!gesture)return;
  const pos=evPos(e),dp=screenToDoc(pos),g=gesture;
  switch(g.type){
    case 'pan':view.tx=g.tx+pos.x-g.sx;view.ty=g.ty+pos.y-g.sy;break;
    case 'noop':break;
    case 'marquee':g.cx=pos.x;g.cy=pos.y;break;
    case 'create':{
      let x=dp.x,y=dp.y;
      if(snapGrid){x=Math.round(x/gridSize)*gridSize;y=Math.round(y/gridSize)*gridSize;}
      if(g.kind==='line'){g.item.x2=x;g.item.y2=y;}
      else{let w=x-g.sx,h=y-g.sy;
        if(e.shiftKey){const m2=Math.max(Math.abs(w),Math.abs(h));w=Math.sign(w||1)*m2;h=Math.sign(h||1)*m2;}
        g.item.t.x=Math.min(g.sx,g.sx+w);g.item.t.y=Math.min(g.sy,g.sy+h);
        g.item.w=Math.abs(w);g.item.h=Math.abs(h);}
      g.created=true;break;}
    case 'move':{
      const dx=dp.x-g.start.x,dy=dp.y-g.start.y;
      if(!g.moved){if(Math.hypot(pos.x-g.spx,pos.y-g.spy)<3)break;g.moved=true;}
      const s=snapDelta(g.roots,g.box,dx,dy);

    case 'rot':{
      const ang=Math.atan2(dp.y-g.C.y,dp.x-g.C.x)-g.startAng;
      let deg=ang*180/Math.PI;

        const Wn=M.mul(G,it._Wt);
        const Ln=M.mul(M.inv(it._PWt),Wn);
        const t=M.toT(Ln);it.t.x=t.x;it.t.y=t.y;it.t.rot=t.rot;it.t.s=t.s;}
      break;}
    case 'scale':{

        const t=M.toT(Ln);it.t.x=t.x;it.t.y=t.y;it.t.rot=t.rot;it.t.s=t.s;}
      break;}
    case 'rectSize':{
      const it=g.item,inv=M.inv(it._Wt);if(!inv)break;
      const lp=M.apply(inv,dp);
      const fxMap={nw:it.w,n:null,ne:0,e:0,se:0,s:null,sw:it.w,w:it.w};
      const fyMap={nw:it.h,n:it.h,ne:it.h,e:null,se:0,s:0,sw:0,w:null};
      const fx=fxMap[g.hid],fy=fyMap[g.hid];
      const x0=fx==null?0:Math.min(fx,lp.x),x1=fx==null?it.w:Math.max(fx,lp.x);
      const y0=fy==null?0:Math.min(fy,lp.y),y1=fy==null?it.h:Math.max(fy,lp.y);
      const nw=Math.max(1,x1-x0),nh=Math.max(1,y1-y0);

      const newA={x:fx==null?x0:(fx===0?x0:x1),y:fy==null?y0:(fy===0?y0:y1)};

      it.t.x=WA.x-(RS.a*newA.x+RS.c*newA.y);

      if(a.co){a.co.x+=dx;a.co.y+=dy;}

    case 'handle':{

      if(g.other&&a[g.other]){ // smooth: mirror opposite handle

    case 'newHandle':{
      const it=g.item,inv=M.inv(worldMatrix(it));if(!inv)break;
      const lp=M.apply(inv,dp),a=it.pts[g.ai];

      break;}
  }
  render();
}
function onUp(e){
  if(!gesture)return;
  const g=gesture;gesture=null;
  stage.classList.remove('panning');
  switch(g.type){
    case 'move':{
      if(!g.moved){ // plain click
        if(g.toggleId)sel.delete(g.toggleId);
        else if(!g.shift&&sel.size>1&&g.hitId)sel=new Set([g.hitId]);
        render();return;}
      commit(g.before,'Move');break;}
    case 'marquee':{
      const x0=Math.min(g.sx,g.cx),x1=Math.max(g.sx,g.cx),
            y0=Math.min(g.sy,g.cy),y1=Math.max(g.sy,g.cy);
      const drag=Math.hypot(x1-x0,y1-y0)>3;
      if(!drag){sel=g.base;render();return;}
      const d0=screenToDoc({x:x0,y:y0}),d1=screenToDoc({x:x1,y:y1});
      const mr={x:d0.x,y:d0.y,w:d1.x-d0.x,h:d1.y-d0.y};
      const next=new Set(g.base);
      for(const it of doc.items){ // root-level marquee selection
        if(!effVisible(it))continue;
        const b=docBox(it);
        if(b.x<mr.x+mr.w&&b.x+b.w>mr.x&&b.y<mr.y+mr.h&&b.y+b.h>mr.y)next.add(it.id);}
      sel=next;break;}
    case 'create':{
      const it=g.item;
      const empty=(it.type==='line')?(near(it.x1,it.x2)&&near(it.y1,it.y2))
        :(it.w<1&&it.h<1);
      if(empty){ // click without drag: default size
        if(it.type==='line'){it.x2=it.x1+80;it.y2=it.y1;}
        else{it.w=80;it.h=80;}}
      commit(g.before,'Create '+it.type);break;}
    case 'rectSize':{const it=g.item;
      if(it.w<=0)it.w=1;if(it.h<=0)it.h=1;
      commit(g.before,'Resize');break;}
    case 'rot':case 'scale':{
      for(const it of g.roots){delete it._Wt;delete it._PWt;}
      commit(g.before,g.type==='rot'?'Rotate':'Scale');break;}
    case 'lineEnd':commit(g.before,'Move endpoint');break;
    case 'anchor':if(g.moved)commit(g.before,'Move anchor');break;
    case 'handle':case 'newHandle':commit(g.before,'Edit handle');break;
    case 'penDrag':break; // path continues; not committed yet
  }
  for(const id of sel){const it=byId.get(id);if(it){delete it._sx;delete it._sy;}}
  render();
}
function cancelGesture(){
  const g=gesture;gesture=null;
  stage.classList.remove('panning');
  if(g&&g.before){restore(g.before);say('Drag cancelled — geometry restored.');}
  if(g)for(const it of byId.values()){delete it._sx;delete it._sy;delete it._Wt;delete it._PWt;delete it._nx;delete it._ny;}
  render();
}

/* ---------- history ---------- */
function save(){return JSON.stringify({d:doc,s:[...sel],a:selAnchor});}
function restore(s){const o=JSON.parse(s);doc=o.d;buildIndex();
  sel=new Set((o.s||[]).filter(id=>byId.has(id)));selAnchor=o.a??-1;}
function commit(before,label){
  if(nudgeBefore){const nb=nudgeBefore;nudgeBefore=null;clearTimeout(nudgeTimer);
    commit(nb,'Nudge');}
  const after=save();
  if(before===after)return;
  past.push({b:before,a:after,label});
  if(past.length>LIMITS.histMax)past.shift();
  future=[];render();
}
function undo(){if(!past.length)return;
  const e=past.pop();future.push(e);restore(e.b);
  say('Undo: '+e.label);render();}
function redo(){if(!future.length)return;
  const e=future.pop();past.push(e);restore(e.a);
  say('Redo: '+e.label);render();}
function clearHistory(msg){past=[];future=[];if(msg)say(msg,'warn');}

/* ---------- move helpers ---------- */
function translateRoots(roots,dx,dy){
  for(const it of roots){const l=docDeltaToLocal(it,dx,dy);
    it.t.x+=l.x;it.t.y+=l.y;}
}
function transformAbout(roots,G){ // apply doc-space similarity G about selection center
  const out=[];
  for(const it of roots){
    const W=worldMatrix(it),p=parentOf.get(it.id),
          Pw=p?worldMatrix(p):M.id(),inv=M.inv(Pw);if(!inv)return false;
    const Ln=M.mul(inv,M.mul(G,W)),t=M.toT(Ln);
    if(!isFin(t.s)||t.s<=0||!isFin(t.x)||!isFin(t.y))return false;
    out.push([it,t]);}
  for(const [it,t] of out){it.t.x=t.x;it.t.y=t.y;it.t.rot=t.rot;it.t.s=t.s;}
  return true;
}
function selCenter(){const b=unionSelBox();
  return b?{x:b.x+b.w/2,y:b.y+b.h/2}:null;}

/* ---------- alignment & distribution ---------- */
function alignSel(mode){
  const roots=selectionRoots();
  if(selHasLocked(roots)){
    say('Selection contains locked items — cannot align.','warn');return;}
  if(!roots.length)return;
  let ref;
  if(roots.length===1){const a=doc.artboard;ref={x:0,y:0,w:a.w,h:a.h};}
  else ref=unionSelBox();
  const b0=save();
  for(const it of roots){const b=docBox(it);let dx=0,dy=0;
    if(mode==='l')dx=ref.x-b.x; if(mode==='cx')dx=ref.x+ref.w/2-(b.x+b.w/2);
    if(mode==='r')dx=ref.x+ref.w-(b.x+b.w);
    if(mode==='t')dy=ref.y-b.y; if(mode==='cy')dy=ref.y+ref.h/2-(b.y+b.h/2);
    if(mode==='b')dy=ref.y+ref.h-(b.y+b.h);
    translateRoots([it],dx,dy);}
  commit(b0,'Align');say('Aligned '+roots.length+' item(s).','ok');
}
function distributeSel(axis){
  const roots=selectionRoots();
  if(roots.length<3){say('Distribution needs at least 3 items.','warn');return;}
  if(selHasLocked(roots)){say('Selection contains locked items — cannot distribute.','warn');return;}
  const horiz=axis==='h';
  const arr=roots.map(it=>({it,b:docBox(it)}));
  arr.sort((p,q)=>{const d=(horiz?p.b.x:p.b.y)-(horiz?q.b.x:q.b.y);
    return d||p.it.id.localeCompare(q.it.id);});
  const first=arr[0],last=arr[arr.length-1];
  const avail=(horiz?(last.b.x-(first.b.x+first.b.w)):(last.b.y-(first.b.y+first.b.h)));
  let ext=0;for(let i=1;i<arr.length-1;i++)ext+=horiz?arr[i].b.w:arr[i].b.h;
  const gap=(avail-ext)/(arr.length-1);
  if(avail<ext-1e-9){say('Cannot distribute: available span '+fmtN(avail)+
    ' < total item extents '+fmtN(ext)+' — make more room.','err');return;}
  const b0=save();
  let cursor=horiz?first.b.x+first.b.w:first.b.y+first.b.h;
  for(let i=1;i<arr.length-1;i++){const it=arr[i].it,b=arr[i].b;
    const target=cursor+gap,delta=target-(horiz?b.x:b.y);
    translateRoots([it],horiz?delta:0,horiz?0:delta);
    cursor=target+(horiz?b.w:b.h);}
  commit(b0,'Distribute');say('Distributed with '+fmtN(gap)+' unit gaps.','ok');
}

/* ---------- group / ungroup ---------- */
function groupSel(){
  const roots=selectionRoots();
  if(!roots.length){say('Nothing selected to group.','warn');return;}
  if(selHasLocked(roots)){say('Selection contains locked items — cannot group.','warn');return;}
  const par=parentOf.get(roots[0].id)||null;
  for(const r of roots)if((parentOf.get(r.id)||null)!==par){
    say('Cannot group: selected items live in different parents.','err');return;}
  const list=par?par.children:doc.items;
  const idx=roots.map(r=>list.indexOf(r)).sort((a,b)=>a-b);
  for(let i=1;i<idx.length;i++)if(idx[i]!==idx[0]+i){
    say('Cannot group: selected items are not contiguous siblings — occlusion would change.','err');return;}
  if(itemCount()+1>LIMITS.items){say('Item limit reached.','err');return;}
  // depth check: new group adds one level
  const parentGroups=par?groupDepthOf(par):0;
  let maxInner=0;
  for(const r of roots){let d=0;(function w(it,dd){if(it.type==='group')
    {dd++;if(dd>d)d=dd;for(const c of it.children)w(c,dd);}})(r,0);maxInner=Math.max(maxInner,d);}
  if(parentGroups+1+maxInner>LIMITS.groupDepth){
    say('Cannot group: would exceed '+LIMITS.groupDepth+' nested group levels.','err');return;}
  const b0=save();
  const grp=mkGroup(roots.slice().sort((a,b)=>list.indexOf(a)-list.indexOf(b)),'Group');
  list.splice(idx[0],idx.length,grp);
  buildIndex();sel=new Set([grp.id]);
  commit(b0,'Group');say('Grouped '+roots.length+' items.','ok');
}
function ungroupSel(){
  const roots=selectionRoots().filter(i=>i.type==='group');
  if(!roots.length){say('Select a group to ungroup.','warn');return;}
  for(const g of roots)if(hasLockedInside(g)){
    say('Cannot ungroup: group or its contents are locked.','warn');return;}
  const b0=save();const newSel=[];
  for(const g of roots){
    const par=parentOf.get(g.id),list=par?par.children:doc.items,
          i=list.indexOf(g),gm=M.fromT(g.t);
    for(const c of g.children){
      c.t=M.toT(M.mul(gm,M.fromT(c.t))); // compose into parent space
      if(!isFin(c.t.s)||c.t.s<=0){say('Cannot ungroup: singular transform.','err');restore(b0);return;}}
    list.splice(i,1,...g.children);newSel.push(...g.children.map(c=>c.id));}
  buildIndex();sel=new Set(newSel);
  commit(b0,'Ungroup');say('Ungrouped — geometry and paint order preserved.','ok');
}

/* ---------- duplicate / delete / reorder / nudge ---------- */
function cloneSubtree(it){
  const c=deepClone(it);(function w(n){n.id=uid();delete n._sx;delete n._sy;
    delete n._Wt;delete n._PWt;if(n.type==='group')n.children.forEach(w);})(c);
  return c;}
function dupSel(){
  const roots=selectionRoots();
  if(!roots.length)return;
  if(itemCount()+roots.reduce((n,r)=>n+1+descendantsOf(r).length,0)>LIMITS.items){
    say('Item limit reached.','err');return;}
  const b0=save();const ns=[];
  for(const it of roots){const c=cloneSubtree(it);
    const l=docDeltaToLocal(it,10,10);c.t.x+=l.x;c.t.y+=l.y;c.locked=false;
    const par=parentOf.get(it.id),list=par?par.children:doc.items;
    list.splice(list.indexOf(it)+1,0,c);ns.push(c.id);}
  buildIndex();sel=new Set(ns);commit(b0,'Duplicate');}
function delSel(){
  const roots=selectionRoots();if(!roots.length)return;
  if(selHasLocked(roots)){say('Selection contains locked items — nothing deleted.','warn');return;}
  const b0=save();
  for(const it of roots){const par=parentOf.get(it.id),
    list=par?par.children:doc.items;list.splice(list.indexOf(it),1);}
  sel=new Set();buildIndex();commit(b0,'Delete');}
function reorderSel(dir){ // dir=+1 toward front (later sibling), -1 toward back
  const roots=selectionRoots();if(roots.length!==1)return;
  const it=roots[0];if(effLocked(it)||hasLockedInside(it)){say('Item is locked.','warn');return;}
  const par=parentOf.get(it.id),list=par?par.children:doc.items,
        i=list.indexOf(it),j=i+dir;
  if(j<0||j>=list.length){say(dir>0?'Already at front.':'Already at back.');return;}
  const b0=save();list.splice(i,1);list.splice(j,0,it);
  buildIndex();commit(b0,'Reorder');}
function nudgeSel(dx,dy){
  const roots=selectionRoots();if(!roots.length)return;
  if(selHasLocked(roots)){say('Selection contains locked items.','warn');return;}
  if(!nudgeBefore)nudgeBefore=save();
  translateRoots(roots,dx,dy);
  clearTimeout(nudgeTimer);
  nudgeTimer=setTimeout(()=>{if(nudgeBefore){commit(nudgeBefore,'Nudge');nudgeBefore=null;}},450);
  render();
}

/* ---------- inspector ---------- */
const inspector=document.getElementById('inspector');
function field(label,input){const d=document.createElement('div');d.className='prow';
  const l=document.createElement('label');l.className='lab';l.textContent=label;
  if(input&&!input.getAttribute('aria-label'))input.setAttribute('aria-label',label);
  d.append(l,input);return d;}
function numIn(v,cb,opt){opt=opt||{};const i=document.createElement('input');
  i.type='number';i.value=fmtN(v);if(opt.step)i.step=opt.step;
  if(opt.min!=null)i.min=opt.min;if(opt.max!=null)i.max=opt.max;
  let pre=v;
  i.addEventListener('focus',()=>{pre=parseFloat(i.value);});
  i.addEventListener('keydown',e=>{e.stopPropagation();
    if(e.key==='Enter'){i.blur();}
    else if(e.key==='Escape'){i.value=pre;i.blur();}});
  i.addEventListener('change',()=>{const val=parseFloat(i.value);
    if(!isFin(val)){i.value=fmtN(pre);say('Invalid number — reverted.','warn');return;}
    cb(val,i);});
  return i;}
function colorIn(v,cb){const i=document.createElement('input');i.type='color';
  i.value=/^#[0-9a-fA-F]{6}$/.test(v)?v:'#000000';
  let b=null;
  i.addEventListener('focus',()=>{b=save();});
  i.addEventListener('input',()=>cb(i.value,false));
  i.addEventListener('change',()=>{cb(i.value,true,b);b=null;});
  return i;}
function btn(label,cb,cls){const b=document.createElement('button');
  b.className='pbtn'+(cls?' '+cls:'');b.textContent=label;b.addEventListener('click',cb);return b;}

function buildInspector(){
  inspector.innerHTML='';
  const h=document.createElement('h3');h.textContent='Inspector';inspector.append(h);
  const roots=selectionRoots();
  if(!roots.length){buildDocInspector();return;}
  const multi=roots.length>1,single=roots[0];
  const selLocked=selHasLocked(roots);
  const title=document.createElement('div');title.className='prow';
  title.innerHTML='<b style="font-size:12px">'+esc(multi?roots.length+' items':(single.name||single.type))+'</b>'+
    (single.locked?' <span style="color:var(--warn)">· locked</span>':'');
  inspector.append(title);
  // bounds
  const b=multi?unionSelBox():docBox(single);
  inspector.append(field('X',numIn(b.x,v=>{if(selHasLocked(roots)){say('Locked item in selection.','warn');return;}
    if(!vCoord(v)){say('Coordinate out of bounds (±'+LIMITS.coord+').','warn');return;}
    const bb=multi?unionSelBox():docBox(single);
    const c=save();translateRoots(roots,v-bb.x,0);commit(c,'Set X');})));
  inspector.append(field('Y',numIn(b.y,v=>{if(selHasLocked(roots)){say('Locked item in selection.','warn');return;}
    if(!vCoord(v)){say('Coordinate out of bounds (±'+LIMITS.coord+').','warn');return;}
    const bb=multi?unionSelBox():docBox(single);
    const c=save();translateRoots(roots,0,v-bb.y);commit(c,'Set Y');})));
  if(!multi&&(single.type==='rect'||single.type==='ellipse')){
    inspector.append(field('W',numIn(single.w,v=>{if(v<1){say('Min size 1.','warn');return;}
      if(selLocked){say('Locked item in selection.','warn');return;}
      if(v>LIMITS.coord){say('Size out of bounds.','warn');return;}
      const c=save();resizeLocalKeepCenter(single,v,single.h);commit(c,'Set W');})));
    inspector.append(field('H',numIn(single.h,v=>{if(v<1){say('Min size 1.','warn');return;}
      if(selLocked){say('Locked item in selection.','warn');return;}
      if(v>LIMITS.coord){say('Size out of bounds.','warn');return;}
      const c=save();resizeLocalKeepCenter(single,single.w,v);commit(c,'Set H');})));
  }else{
    inspector.append(field('W',numIn(b.w,v=>{if(v<0.01){say('Too small.','warn');return;}
      if(selLocked){say('Locked item in selection.','warn');return;}
      const c=save();const bb=multi?unionSelBox():docBox(single);
      const C={x:bb.x+bb.w/2,y:bb.y+bb.h/2},k=v/Math.max(1e-9,bb.w);
      transformAbout(roots,M.scaleAbout(C,k));commit(c,'Scale');})));
    const hi=numIn(b.h,()=>{});hi.disabled=true;hi.title='Height follows uniform scale';
    inspector.append(field('H',hi));
  }
  // rotation + scale
  const Wm=worldMatrix(single),wt=M.toT(Wm);
  const rin=numIn(fmtN(wt.rot),v=>{if(selLocked){say('Locked item in selection.','warn');return;}
    const c=save();const C=selCenter();
    const cur=M.toT(worldMatrix(single)).rot;
    transformAbout(roots,M.rotAbout(C,v-cur));commit(c,'Rotate');});
  rin.step=1;rin.title=multi?'Rotate selection to this absolute angle is N/A':'Rotation (deg)';
  if(multi)rin.disabled=true;
  inspector.append(field('Rot°',rin));
  const sin=numIn(fmtN(wt.s*100),v=>{if(v<=0){say('Scale must be positive.','warn');return;}
    if(selLocked){say('Locked item in selection.','warn');return;}
    const c=save();const C=selCenter();const cur=M.toT(worldMatrix(single)).s;
    transformAbout(roots,M.scaleAbout(C,(v/100)/cur));commit(c,'Scale');});
  sin.title='Uniform scale %';if(multi)sin.disabled=true;
  inspector.append(field('Scale%',sin));
  // opacity
  const opWrap=document.createElement('div');opWrap.className='prow';
  const opl=document.createElement('label');opl.className='lab';opl.textContent='Opac';
  const op=document.createElement('input');op.type='range';op.min=0;op.max=100;
  op.value=Math.round((single.opacity??1)*100);
  let ob=null;
  op.addEventListener('pointerdown',()=>{ob=save();});
  op.addEventListener('input',()=>{if(selLocked){say('Locked item in selection.','warn');return;}
    const v=op.value/100;
    for(const it of roots)it.opacity=v;render();});
  op.addEventListener('change',()=>{if(ob){commit(ob,'Opacity');ob=null;}});
  opWrap.append(opl,op);inspector.append(opWrap);
  // fill & stroke
  const fw=document.createElement('div');fw.className='prow';
  const fl=document.createElement('label');fl.className='lab';fl.textContent='Fill';
  const fcol=colorIn(single.fill==='none'?'#000000':single.fill,(v,done,bb)=>{
    if(selLocked){say('Locked item in selection.','warn');return;}
    if(done==null)done=true;
    if(done===false){for(const it of roots)it.fill=v;render();return;}
    const c=bb||save();for(const it of roots)it.fill=v;commit(c,'Fill');});
  const fnone=btn(single.fill==='none'?'∅':'set none',()=>{
    if(selLocked){say('Locked item in selection.','warn');return;}
    const c=save();for(const it of roots)it.fill=
      roots.every(i=>i.fill==='none')?'#4da3ff':'none';commit(c,'Fill');});
  fnone.title='Toggle fill';
  fw.append(fl,fcol,fnone);inspector.append(fw);
  const sw=document.createElement('div');sw.className='prow';
  const sl=document.createElement('label');sl.className='lab';sl.textContent='Stroke';
  const scol=colorIn(single.stroke?single.stroke.color:'#000000',(v,done,bb)=>{
    if(selLocked){say('Locked item in selection.','warn');return;}
    if(done===false){for(const it of roots){it.stroke=it.stroke||{color:v,width:2};it.stroke.color=v;}render();return;}
    const c=bb||save();for(const it of roots){it.stroke=it.stroke||{color:v,width:2};it.stroke.color=v;}commit(c,'Stroke');});
  const swid=numIn(single.stroke?single.stroke.width:0,v=>{
    if(v<0||v>LIMITS.strokeMax){say('Stroke width 0–'+LIMITS.strokeMax+'.','warn');return;}
    if(selLocked){say('Locked item in selection.','warn');return;}
    const c=save();for(const it of roots){
      if(v===0)it.stroke=null;else{it.stroke=it.stroke||{color:'#1c2333',width:2};it.stroke.width=v;}}
    commit(c,'Stroke width');},{min:0,max:LIMITS.strokeMax});
  swid.title='Stroke width (0 = none)';sw.append(sl,scol,swid);inspector.append(sw);
  // per-type extras
  if(single.type==='text'&&!multi)buildTextInspector(single);
  if(single.type==='line'&&!multi)buildLineInspector(single);
  if(single.type==='path')buildPathInspector(single);
  // actions
  const act=document.createElement('div');act.className='prow';
  act.append(btn('Duplicate',dupSel),btn('Delete',delSel),
    btn('Group',groupSel),btn('Ungroup',ungroupSel));
  inspector.append(act);
}
function resizeLocalKeepCenter(it,w,h){
  const W=worldMatrix(it),lb=localBox(it),
        Cold=M.apply(W,{x:lb.x+lb.w/2,y:lb.y+lb.h/2});
  it.w=w;it.h=h;
  const lb2=localBox(it),RS=W;
  it.t.x=Cold.x-(RS.a*(lb2.x+lb2.w/2)+RS.c*(lb2.y+lb2.h/2));
  it.t.y=Cold.y-(RS.b*(lb2.x+lb2.w/2)+RS.d*(lb2.y+lb2.h/2));
}
function buildTextInspector(it){
  if(effLocked(it)){const lk=document.createElement('div');lk.className='hint';
    lk.textContent='Locked — unlock in Layers to edit.';inspector.append(lk);return;}
  const s=document.createElement('div');s.innerHTML='<h3 style="margin-top:8px">Text</h3>';

  ta.rows=3;let tb=null;
  ta.addEventListener('focus',()=>{tb=save();});

    if(e.key==='Escape'){ta.value=it.text;ta.blur();}
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))ta.blur();});
  ta.addEventListener('change',()=>{if(ta.value===it.text)return;
    const c=tb||save();it.text=ta.value.slice(0,LIMITS.textChars);tb=null;
    commit(c,'Edit text');});
  inspector.append(ta);
  const r1=document.createElement('div');r1.className='prow';
  const fam=document.createElement('select');
  for(const f of FAMILIES){const o=document.createElement('option');o.value=f;o.textContent=f;fam.append(o);}
  fam.value=it.family;
  fam.addEventListener('change',()=>{const c=save();it.family=fam.value;commit(c,'Font family');});
  const wt=document.createElement('select');
  for(const w of WEIGHTS){const o=document.createElement('option');o.value=w;o.textContent=w;wt.append(o);}
  wt.value=it.weight;
  wt.addEventListener('change',()=>{const c=save();it.weight=wt.value;commit(c,'Font weight');});
  r1.append(fam,wt);inspector.append(r1);
  const r2=document.createElement('div');r2.className='prow';
  const ll=document.createElement('label');ll.className='lab';ll.textContent='Size';
  const sz=numIn(it.size,v=>{if(v<LIMITS.fontMin||v>LIMITS.fontMax){
    say('Font size '+LIMITS.fontMin+'–'+LIMITS.fontMax+'.','warn');return;}
    const c=save();it.size=v;commit(c,'Font size');},{min:LIMITS.fontMin,max:LIMITS.fontMax});
  const ll2=document.createElement('label');ll2.textContent='LH';

function buildLayers(){
  layerList.innerHTML='';
  document.getElementById('layerCount').textContent='· '+itemCount()+'/'+LIMITS.items;
  const frag=document.createDocumentFragment();
  (function walk(list,depth){
    for(let i=list.length-1;i>=0;i--){ // front-to-back: last child on top
      const it=list[i],row=document.createElement('div');row.className='lrow';
      if(sel.has(it.id))row.classList.add('sel');
      row.dataset.id=it.id;
      for(let d=0;d<depth;d++){const sp=document.createElement('span');
        sp.className='lindent';row.append(sp);}
      const vb=document.createElement('button');vb.innerHTML=it.visible?EYE:EYEO;
      vb.title=it.visible?'Hide':'Show';if(!it.visible)vb.classList.add('vis-off');
      vb.addEventListener('click',ev=>{ev.stopPropagation();
        if(effLocked(it)||hasLockedInside(it)){say('Locked — unlock first.','warn');return;}
        const c=save();it.visible=!it.visible;commit(c,'Visibility');});
      const lb=document.createElement('button');lb.innerHTML=it.locked?LOCK:UNLOCK;
      lb.title=it.locked?'Unlock':'Lock';if(it.locked)lb.classList.add('lock-on');
      lb.addEventListener('click',ev=>{ev.stopPropagation();
        const c=save();it.locked=!it.locked;commit(c,it.locked?'Lock':'Unlock');});
      const ic=document.createElement('span');ic.className='lic';
      ic.textContent={rect:'▭',ellipse:'◯',line:'╱',text:'T',path:'✎',group:'▸'}[it.type]||'?';
      const nm=document.createElement('span');nm.className='lname'+
        (it.visible?'':' hidden-it')+(it.locked?' locked-it':'');
      nm.textContent=it.name||it.type;nm.title='Double-click to rename';
      nm.addEventListener('dblclick',ev=>{ev.stopPropagation();renameRow(row,it);});
      const up=document.createElement('button');up.className='ord';up.textContent='▲';
      up.title='Forward (paint later)';
      up.addEventListener('click',ev=>{ev.stopPropagation();moveSibling(it,1);});
      const dn=document.createElement('button');dn.className='ord';dn.textContent='▼';
      dn.title='Backward (paint earlier)';

        i=list.indexOf(it),j=i+dir;

/* ---------- keyboard ---------- */
window.addEventListener('keydown',e=>{
  const tgt=e.target;
  const editing=tgt&&(tgt.tagName==='INPUT'||tgt.tagName==='TEXTAREA'||tgt.isContentEditable);
  if(textEdit){return;}
  if(editing){if(e.key==='Escape')tgt.blur();return;}
  if(e.key==='Escape'){
    if(inPath){inPath=null;say('Path discarded.');render();return;}
    if(gesture){cancelGesture();return;}
    if(previewOn){exitPreview();return;}
    if(sel.size){sel=new Set();selAnchor=-1;render();}
    return;}
  const meta=e.ctrlKey||e.metaKey;
  if(meta&&e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();undo();return;}
  if(meta&&(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey))){e.preventDefault();redo();return;}
  if(meta&&e.key.toLowerCase()==='d'){e.preventDefault();dupSel();return;}
  if(meta&&e.key.toLowerCase()==='g'&&!e.shiftKey){e.preventDefault();groupSel();return;}
  if(meta&&e.key.toLowerCase()==='g'&&e.shiftKey){e.preventDefault();ungroupSel();return;}
  if(meta&&e.key.toLowerCase()==='a'){e.preventDefault();
    sel=new Set(doc.items.map(i=>i.id));render();return;}
  if(e.key==='Enter'&&tool==='path'&&inPath){commitPath(false);render();return;}
  if(e.key==='Delete'||e.key==='Backspace'){
    if(tool==='node'&&selAnchor>=0){deleteAnchor();return;}
    e.preventDefault();delSel();return;}
  const step=e.shiftKey?10:1;
  if(e.key.startsWith('Arrow')){
    e.preventDefault();
    if(tool==='node'&&selAnchor>=0){nudgeAnchor(e.key,step);return;}
    const d={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[e.key];
    if(d)nudgeSel(d[0],d[1]);return;}
  const k=e.key.toLowerCase();
  const tools={v:'select',a:'node',r:'rect',o:'ellipse',l:'line',p:'path',t:'text',h:'pan'};
  if(tools[k]){setTool(tools[k]);return;}
  if(k==='0'){zoomFit();return;}
  if(k==='1'){zoom100();return;}
  if(k==='+'||k==='='){zoomStep(1.25);return;}
  if(k==='-'){zoomStep(0.8);return;}
  if(e.key===' '){spaceDown=true;e.preventDefault();}
});
window.addEventListener('keyup',e=>{if(e.key===' ')spaceDown=false;});
function setTool(t){

function deleteAnchor(){
  const roots=selectionRoots();
  for(const it of roots){if(it.type!=='path')continue;
    if(effLocked(it)){say('Path is locked.','warn');return;}
    if(selAnchor<0||selAnchor>=it.pts.length)continue;
    if(it.pts.length<=2){say('A path needs at least 2 anchors.','warn');return;}
    const c=save();it.pts.splice(selAnchor,1);selAnchor=-1;commit(c,'Delete anchor');return;}
}
function nudgeAnchor(key,step){
  const roots=selectionRoots();
  for(const it of roots){if(it.type!=='path'||selAnchor<0)continue;
    if(effLocked(it)){say('Path is locked.','warn');return;}
    const a=it.pts[selAnchor];if(!a)continue;
    if(!nudgeBefore)nudgeBefore=save();
    const d={ArrowLeft:[-step,0],ArrowRight:[step,0],ArrowUp:[0,-step],ArrowDown:[0,step]}[key];
    a.x+=d[0];a.y+=d[1];
    if(a.ci){a.ci.x+=d[0];a.ci.y+=d[1];}
    if(a.co){a.co.x+=d[0];a.co.y+=d[1];}
    clearTimeout(nudgeTimer);
    nudgeTimer=setTimeout(()=>{if(nudgeBefore){commit(nudgeBefore,'Nudge anchor');nudgeBefore=null;}},450);
    render();return;}
}

function zoomStep(f,cx,cy){
  const c=cx==null?{x:cw/2,y:ch/2}:{x:cx,y:cy};
  const k2=clamp(view.k*f,0.05,32),f2=k2/view.k;
  view.tx=c.x-(c.x-view.tx)*f2;view.ty=c.y-(c.y-view.ty)*f2;view.k=k2;render();
}
function zoom100(){const a=doc.artboard;

  const k=clamp(Math.min((cw-pad*2)/a.w,(ch-pad*2)/a.h),0.05,32);
  view.k=k;view.tx=cw/2-a.w*k/2;view.ty=ch/2-a.h*k/2;render();}
