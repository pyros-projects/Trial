<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Metroflux — City Traffic &amp; Transit Simulator</title>
<style>
:root{
  --bg:#0d1117; --bg2:#121826; --bg3:#182032; --panel:#151d2e; --panel2:#1b2740;
  --line:#26334d; --txt:#d7e1f2; --dim:#8594b0; --acc:#4cc2ff; --acc2:#ffd166;
  --good:#46d19a; --warn:#ffb454; --bad:#ff5d6c; --bus:#ffa94d; --rail:#c792ea;
  --mono:'SFMono-Regular',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font:13px/1.45 -apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  -webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
/* ---------- toolbar ---------- */
#toolbar{display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--bg2);
  border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:44px}
#toolbar .brand{font-weight:700;letter-spacing:.5px;color:var(--acc);margin-right:8px;
  font-size:14px;white-space:nowrap}
#toolbar .brand small{color:var(--dim);font-weight:400;letter-spacing:0}
.tbtn{background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:6px;
  padding:5px 9px;cursor:pointer;font-size:12px;white-space:nowrap;line-height:1.2}
.tbtn:hover{border-color:var(--acc);color:#fff}
.tbtn.on{background:#1e3a5f;border-color:var(--acc);color:#fff;box-shadow:0 0 0 1px var(--acc) inset}
.tbtn.warn.on{background:#4a2d1e;border-color:var(--warn)}
.tbtn:disabled{opacity:.4;cursor:default}
.tsep{width:1px;height:22px;background:var(--line);margin:0 4px;flex:0 0 auto}
.tgroup{display:flex;gap:2px;align-items:center}
select.tbtn,input.tbtn{padding:4px 6px}
/* ---------- main ---------- */
#main{flex:1;position:relative;display:flex;min-height:0}
#mapwrap{flex:1;position:relative;min-width:0;overflow:hidden;background:#0a0e14}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
/* ---------- HUD ---------- */
#hud{position:absolute;top:8px;left:8px;background:rgba(13,17,23,.82);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;font-family:var(--mono);font-size:11px;pointer-events:none;
  backdrop-filter:blur(3px);min-width:210px;z-index:5}
#hud .r{display:flex;justify-content:space-between;gap:14px}
#hud .r b{color:var(--txt);font-weight:600}
#hud .r span{color:var(--dim)}
#hud .paused b{color:var(--warn)}
#hudTitle{color:var(--acc);font-weight:700;margin-bottom:3px;font-size:10px;letter-spacing:1px}
#toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#1e2b45;
  border:1px solid var(--acc);padding:7px 14px;border-radius:8px;font-size:12px;z-index:9;
  opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center}
/* ---------- side panel ---------- */
#panel{width:308px;background:var(--panel);border-left:1px solid var(--line);display:flex;
  flex-direction:column;min-width:308px;transition:margin-right .2s}
#panel.hidden{margin-right:-308px}
#ptabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--bg2)}
.ptab{padding:6px 9px;font-size:11px;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap}
.ptab.on{color:var(--acc);border-bottom-color:var(--acc)}
#pbody{flex:1;overflow-y:auto;padding:10px;font-size:12px}
#pbody::-webkit-scrollbar{width:8px}#pbody::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.sec{margin-bottom:14px}
.sec h4{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:6px}
.row{display:flex;align-items:center;gap:6px;margin:5px 0}
.row label{flex:1;color:var(--txt);font-size:12px}
.row .val{color:var(--acc);font-family:var(--mono);font-size:11px;min-width:42px;text-align:right}
input[type=range]{flex:2;accent-color:var(--acc)}
input[type=number],input[type=text]{background:var(--bg3);border:1px solid var(--line);color:var(--txt);
  border-radius:5px;padding:4px 6px;width:64px;font-size:12px}
input[type=checkbox]{accent-color:var(--acc)}
select{background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:5px;padding:4px}
.btn{background:var(--bg3);border:1px solid var(--line);color:var(--txt);border-radius:6px;
  padding:5px 10px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:#1e3a5f;border-color:var(--acc)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{padding:2px 7px;font-size:11px}
.hint{color:var(--dim);font-size:11px;margin:4px 0}
.kv{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;padding:2px 0}
.kv span{color:var(--dim)}.kv b{font-weight:600}
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10px;font-weight:600;margin-left:4px}
.pill.g{background:#123b2c;color:var(--good)}.pill.y{background:#3d3013;color:var(--warn)}.pill.r{background:#431b22;color:var(--bad)}
.chip{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--bg3);border:1px solid var(--line);
  margin:2px 3px 2px 0;cursor:pointer;font-size:11px}
.chip.on{border-color:var(--acc);color:var(--acc)}
.chip.danger.on{border-color:var(--bad);color:var(--bad)}
/* signal editor */
.siggrid{border-collapse:collapse;margin:6px 0;font-size:10px}
.siggrid td,.siggrid th{border:1px solid var(--line);padding:3px 5px;text-align:center}
.siggrid th{color:var(--dim);font-weight:600}
.siggrid td.mv{text-align:left;font-family:var(--mono);white-space:nowrap}
.sigcell{width:18px;height:16px;border-radius:3px;background:#3a2226;cursor:pointer;display:inline-block}
.sigcell.on{background:var(--good)}
.sigcell.conflict{box-shadow:0 0 0 2px var(--bad)}
/* scenario list */
.scen{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border:1px solid var(--line);
  border-radius:6px;margin:4px 0;cursor:pointer}
.scen:hover{border-color:var(--acc)}
.scen .d{color:var(--dim);font-size:10px}
/* charts */
.chartbox{margin:8px 0}
.chartbox .t{font-size:11px;color:var(--dim);margin-bottom:2px;display:flex;justify-content:space-between}
.chartbox .t b{color:var(--txt)}
canvas.chart{width:100%;height:64px;background:var(--bg);border:1px solid var(--line);border-radius:5px;display:block}
/* status bar */
#statusbar{display:flex;align-items:center;gap:12px;padding:3px 10px;background:var(--bg2);
  border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--dim);min-height:22px}
#statusbar .r{margin-left:auto}
#collapseBtn{position:absolute;top:8px;right:8px;z-index:6;background:var(--bg3);border:1px solid var(--line);
  color:var(--dim);border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px}
/* narrow layout */
@media (max-width:700px){
  #panel{position:absolute;right:0;top:0;bottom:0;z-index:8;box-shadow:-8px 0 24px rgba(0,0,0,.5)}
  #hud{min-width:0;font-size:10px;padding:5px 8px}
  .tbtn{padding:5px 7px;font-size:11px}
}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(560px,92vw);max-height:80vh;overflow:auto}
.modal h3{margin-bottom:10px;color:var(--acc)}
.modal textarea{width:100%;height:180px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;font-family:var(--mono);font-size:11px;padding:8px}
</style>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <span class="brand">METROFLUX <small>traffic &amp; transit lab</small></span>
    <div class="tgroup" id="toolBtns"></div>
    <div class="tsep"></div>
    <div class="tgroup">
      <button class="tbtn" id="btnPlay" title="Space">⏸</button>
      <button class="tbtn" id="btnStep" title="Single step (.)">▶|</button>
      <button class="tbtn" id="btnSlower" title="slower">−</button>
      <span class="tbtn" id="speedLbl" style="cursor:default">1×</span>
      <button class="tbtn" id="btnFaster" title="faster">+</button>
      <button class="tbtn" id="btnReset" title="Reset simulation (keep map)">↺</button>
    </div>
    <div class="tsep"></div>
    <div class="tgroup">
      <button class="tbtn" id="btnUndo" title="Ctrl+Z">↶</button>
      <button class="tbtn" id="btnRedo" title="Ctrl+Y">↷</button>
    </div>
    <div class="tsep"></div>
    <select class="tbtn" id="overlaySel" title="Heatmap overlay"></select>
    <select class="tbtn" id="scenSel" title="Load scenario"></select>
    <button class="tbtn" id="btnAudio" title="Sound">🔇</button>
  </header>
  <div id="main">
    <div id="mapwrap">
      <canvas id="map"></canvas>
      <div id="hud"></div>
      <div id="toast"></div>
      <button id="collapseBtn" title="toggle panel">☰</button>
    </div>
    <aside id="panel">
      <div id="ptabs"></div>
      <div id="pbody"></div>
    </aside>
  </div>
  <footer id="statusbar"><span id="stLeft">ready</span><span class="r" id="stRight"></span></footer>
</div>
<script>
'use strict';
/* =====================================================================
   METROFLUX — single-file city traffic & transit simulator
   Sections: utils · model · graph edit · routing · signals · vehicles ·
   transit · demand · analytics · render · editor · scenarios · io · audio
   ===================================================================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const fmt=(v,d=1)=>v===undefined||v===null||isNaN(v)?'–':(+v).toFixed(d);
const fmtT=s=>{s=Math.floor(s);const h=Math.floor(s/3600)%24,m=Math.floor(s/60)%60;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');};
const fmtT2=s=>{s=Math.floor(s);const d=Math.floor(s/86400);return (d?'d'+d+' ':'')+fmtT(s);};
/* deterministic RNG */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let _uid=1; const nid=()=>'n'+(_uid++), eid=()=>'e'+(_uid++), zid=()=>'z'+(_uid++), sid=()=>'s'+(_uid++), rid=()=>'r'+(_uid++), vid=()=>'v'+(_uid++);
function segInt(p1,p2,p3,p4){ // segment intersection point or null
  const d1x=p2.x-p1.x,d1y=p2.y-p1.y,d2x=p4.x-p3.x,d2y=p4.y-p3.y,den=d1x*d2y-d1y*d2x;
  if(Math.abs(den)<1e-9)return null;
  const t=((p3.x-p1.x)*d2y-(p3.y-p1.y)*d2x)/den,u=((p3.x-p1.x)*d1y-(p3.y-p1.y)*d1x)/den;
  if(t<-1e-6||t>1+1e-6||u<-1e-6||u>1+1e-6)return null;
  return{x:p1.x+t*d1x,y:p1.y+t*d1y,t,u};
}
function ptSeg(p,a,b){ // dist & param of point to segment
  const dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy||1e-9;
  const t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/L2,0,1);
  return{d:dist(p.x,p.y,a.x+t*dx,a.y+t*dy),t,x:a.x+t*dx,y:a.y+t*dy};
}
/* ===================== GLOBAL STATE ===================== */
const W={ // world/model state
  nodes:new Map(), edges:new Map(), zones:new Map(), stops:new Map(), routes:new Map(),
  vehs:[], pax:[], incidents:[],
  simTime:6*3600+30*60, seed:12345, rng:mulberry32(12345),
  nextVehId:1, tripLog:[], busTrips:0, carTrips:0, failedTrips:0, unserved:0,
};
const S={ // session/ui state
  tool:'select', paused:false, speed:1, stepOnce:false, overlay:'none',
  cam:{x:0,y:0,z:1}, sel:null, // {kind:'edge'|'node'|'zone'|'stop'|'route'|'veh'|'incident',id}
  draw:null, hover:null, panel:'inspect', editRouteId:null,
  undo:[], redo:[], charts:{}, audioOn:false,
  weather:1, eventMode:false,
};
const P={ // tunable parameters (persisted with save)
  demand:1.0, transitShare:0.25, spawnCap:900, headway:1.0, aggr:0.5,
  reroute:0.5, laneChange:0.5, signalPolicy:'auto', busHeadway:120, busCap:40,
  dwell:12, incidentRate:0.3, weather:'clear', mapW:2600, mapH:1800,
  budget:0, sandbox:true, dayNight:false,
};
const DT=1/30, MAXSUB=240; // fixed sim dt, substep cap per frame
const VTYPES={
  car:{len:4.4,w:2.0,v0:14,acc:2.2,brk:4.2,cap:1.4,color:'#7fb2ff',label:'Car'},
  truck:{len:8.5,w:2.5,v0:11,acc:1.3,brk:3.0,cap:0,color:'#b98cff',label:'Freight'},
  bus:{len:11,w:2.6,v0:12.5,acc:1.5,brk:3.2,cap:40,color:'#ffa94d',label:'Bus'},
};
const ZTYPES={
  res:{c:'#3f7d5a',fill:'rgba(63,160,110,.16)',label:'Residential',gen:1.0,att:0.7},
  com:{c:'#4cc2ff',fill:'rgba(76,194,255,.14)',label:'Commercial',gen:0.6,att:1.4},
  ind:{c:'#b98cff',fill:'rgba(185,140,255,.13)',label:'Industrial',gen:0.5,att:0.9},
  sch:{c:'#ffd166',fill:'rgba(255,209,102,.14)',label:'School',gen:0.4,att:1.0},
  evt:{c:'#ff5d6c',fill:'rgba(255,93,108,.14)',label:'Event venue',gen:0.15,att:0.2},
};

/* ===================== GRAPH MODEL =====================
   Nodes = junction points. Edges = straight segments a<->b with per-direction
   lane counts. pts[] optional shape polyline (rendering + lane geometry).   */
function newNode(x,y){const n={id:nid(),x,y,edges:[],signal:null,roundabout:false,closed:false};W.nodes.set(n.id,n);return n;}
function newEdge(a,b,o={}){
  const na=W.nodes.get(a),nb=W.nodes.get(b);if(!na||!nb)return null;
  const e={id:eid(),a,b,len:0,pts:null,speed:o.speed||13.9, // 50 km/h default
    lanesF:o.lanesF??1,lanesB:o.lanesB??1,oneway:o.oneway||null, // null|'f'|'b'
    name:o.name||'',closed:false,cond:1, // cond: speed multiplier (incident/weather local)
    emaT:0,emaQ:0,load:0,nTurns:0};
  e.len=dist(na.x,na.y,nb.x,nb.y);
  W.edges.set(e.id,e);na.edges.push(e.id);nb.edges.push(e.id);
  edgeGeom(e);markDirty();return e;
}
function edgeGeom(e){ // straight or shaped geometry
  const a=W.nodes.get(e.a),b=W.nodes.get(e.b);
  e._a=a;e._b=b;
  if(!e.pts||e.pts.length<3)e.pts=[{x:a.x,y:a.y},{x:b.x,y:b.y}];
  e.seglen=[];e.len=0;
  for(let i=0;i<e.pts.length-1;i++){const l=dist(e.pts[i].x,e.pts[i].y,e.pts[i+1].x,e.pts[i+1].y);e.seglen.push(l);e.len+=l;}
}
function edgeLanes(e){return e.oneway==='f'?e.lanesF:e.oneway==='b'?e.lanesB:e.lanesF+e.lanesB;}
function dirLanes(e,dir){ // dir 'f': a->b, 'b': b->a
  if(e.oneway)return e.oneway===dir?Math.max(e.lanesF,e.lanesB):0;
  return dir==='f'?e.lanesF:e.lanesB;
}
function laneOffset(e,dir,lane){ // lateral offset (m) of lane center, right-hand traffic
  const LW=3.2;const nF=e.oneway?(e.oneway==='f'?e.lanesF:e.lanesB):e.lanesF;
  const nB=e.oneway?0:e.lanesB;
  if(e.oneway){ // one-way: lanes stacked to right of centerline
    return (lane-((e.oneway==='f'?e.lanesF:e.lanesB)-1)/2)*LW*(dir==='f'?1:-1);
  }
  const k=dir==='f'?lane:nB-1-lane; // outer lanes toward right
  return (k+0.5)*LW*(dir==='f'?1:-1);
}
function edgePoint(e,dir,s,lane){ // position at arclength s in dir, lateral lane
  const pts=e.pts, sl=e.seglen;
  if(dir==='b')s=e.len-s;
  let i=0;while(i<sl.length-1&&s>sl[i]){s-=sl[i];i++;}
  const l=sl[i]||1,t=clamp(s/l,0,1),p0=pts[i],p1=pts[i+1];
  const dx=(p1.x-p0.x)/l,dy=(p1.y-p0.y)/l,off=laneOffset(e,dir,lane||0);
  return{x:p0.x+dx*l*t - dy*off, y:p0.y+dy*l*t + dx*off, dx, dy};
}
function nodeEdges(n){return n.edges.map(i=>W.edges.get(i)).filter(Boolean);}
function otherEnd(e,nid){return e.a===nid?e.b:e.a;}
function pushUndo(label){
  S.undo.push({label,snap:modelSnapshot()});
  if(S.undo.length>60)S.undo.shift();S.redo.length=0;
}
function modelSnapshot(){
  return{nodes:[...W.nodes.values()].map(n=>({id:n.id,x:n.x,y:n.y,signal:n.signal?JSON.parse(JSON.stringify({phases:n.signal.phases,offset:n.signal.offset,mode:n.signal.mode,cycle:n.signal.cycle})):null,roundabout:n.roundabout,closed:n.closed})),
    edges:[...W.edges.values()].map(e=>({id:e.id,a:e.a,b:e.b,pts:e.pts,speed:e.speed,lanesF:e.lanesF,lanesB:e.lanesB,oneway:e.oneway,name:e.name,closed:e.closed,noTurns:e.noTurns?{...e.noTurns}:undefined})),
    zones:[...W.zones.values()].map(z=>({...z})),
    stops:[...W.stops.values()].map(s=>({id:s.id,edge:s.edge,pos:s.pos,dir:s.dir,name:s.name})),
    routes:[...W.routes.values()].map(r=>({id:r.id,name:r.name,color:r.color,stops:[...r.stops],headway:r.headway,capacity:r.capacity})),
    seed:W.seed,simTime:W.simTime,nextVehId:W.nextVehId,params:{...P} };
}
function modelRestore(snap){
  W.nodes.clear();W.edges.clear();W.zones.clear();W.stops.clear();W.routes.clear();
  W.vehs.length=0;W.pax.length=0;W.incidents.length=0;W.tripLog.length=0;
  W.carTrips=W.busTrips=W.failedTrips=W.unserved=0;
  for(const n of snap.nodes){const nn={...n,edges:[],signal:null};nn._sig=n.signal||null;W.nodes.set(n.id,nn);}
  for(const e of snap.edges){const ee={...e,emaT:0,emaQ:0,load:0,nTurns:0};W.edges.set(ee.id,ee);
    W.nodes.get(ee.a)?.edges.push(ee.id);W.nodes.get(ee.b)?.edges.push(ee.id);edgeGeom(ee);}
  for(const z of snap.zones)W.zones.set(z.id,{...z});
  for(const s of snap.stops)W.stops.set(s.id,{...s,routeIds:s.routeIds||[]});
  for(const r of snap.routes)W.routes.set(r.id,{...r,vehs:[],nextSpawn:W.simTime||0,rid:0});
  W.seed=snap.seed??W.seed;W.simTime=snap.simTime??0;W.nextVehId=snap.nextVehId||1;
  W.rng=mulberry32(W.seed);
  if(snap.params)Object.assign(P,snap.params);
  rebuildAll();
  // restore signals after edges rebuilt (autoPhases needs live edges)
  for(const n of W.nodes.values()){
    if(n._sig){const d=n._sig;delete n._sig;
      if(d&&d.phases&&d.phases.length){n.signal={phases:d.phases,idx:0,t:0,offset:d.offset||0,mode:d.mode||'auto',cycle:d.phases.reduce((a,p)=>a+p.dur,0)};}
      else mkSignal(n);
    }
  }
}
function undo(){if(!S.undo.length)return;S.redo.push({label:'',snap:modelSnapshot()});const u=S.undo.pop();modelRestore(u.snap);toast('undo: '+u.label);}
function redo(){if(!S.redo.length)return;S.undo.push({label:'',snap:modelSnapshot()});const u=S.redo.pop();modelRestore(u.snap);toast('redo');}

/* ---- crossing & junction bookkeeping ---- */
const nodeCache=new Map();
function rebuildAll(){nodeCache.clear();for(const n of W.nodes.values())buildNodeInfo(n);for(const s of W.stops.values()){s.routeIds=W.routes?[]:s.routeIds;}
  for(const r of W.routes.values())linkRouteStops(r);
  for(const e of W.edges.values())e._a=W.nodes.get(e.a),e._b=W.nodes.get(e.b);
  invalidateRoutes();}
function markDirty(){nodeCache.clear();invalidateRoutes();}
function buildNodeInfo(n){ // movements + conflict matrix per node
  const inc=[],deg={};
  for(const eid of n.edges){const e=W.edges.get(eid);if(!e)continue;
    const dirIn=e.a===n.id?'f':'b'; // traffic heading INTO node travels dir toward node
    if(dirLanes(e,dirIn)>0)inc.push(e);
  }
  const moves=[]; // {inE,outE,kind,pts}
  for(const ei of inc){for(const eo of n.edges.map(i=>W.edges.get(i)).filter(Boolean)){
    if(eo===ei&&n.edges.length>1)continue; // no u-turn except dead ends

  // same exit merges (serialized by the outgoing-edge room check instead)
  for(let i=0;i<moves.length;i++)for(let j=i+1;j<moves.length;j++){

function moveKey(inE,outE){return inE+'>'+outE;}
function mkMove(n,ei,eo){

function pathsCross(A,B){for(let i=0;i<A.length-1;i++)for(let j=0;j<B.length-1;j++){if(segInt(A[i],A[i+1],B[j],B[j+1]))return true;}return false;}

/* ---- adding a drawn road polyline ---- */
const SNAP_R=14;
function snapPoint(x,y,excludeEdges){
  let best=null;

  for(const e of W.edges.values()){if(excludeEdges&&excludeEdges.has(e.id))continue;
    for(let i=0;i<e.pts.length-1;i++){const r=ptSeg({x,y},e.pts[i],e.pts[i+1]);
      if(r.d<SNAP_R&&(!best||r.d<best.d))best={type:'edge',id:e.id,seg:i,t:r.t,d:r.d,x:r.x,y:r.y};}}

function splitEdgeAt(e,seg,t,x,y){

  const ptsB=[{x,y}].concat(e.pts.slice(seg+1));
  const a=e.a,b=e.b;
  const keepStops=[...W.stops.values()].filter(s=>s.edge===e.id)
    .map(s=>({s,p:edgePoint(e,'f',s.pos,0)}));
  const e1={id:eid(),a,b:n.id,pts:ptsA,speed:e.speed,lanesF:e.lanesF,lanesB:e.lanesB,oneway:e.oneway,name:e.name,closed:e.closed,emaT:0,emaQ:0,load:0,nTurns:0};
  const e2={id:eid(),a:n.id,b,pts:ptsB,speed:e.speed,lanesF:e.lanesF,lanesB:e.lanesB,oneway:e.oneway,name:e.name,closed:e.closed,emaT:0,emaQ:0,load:0,nTurns:0};
  removeEdge(e.id,true,true);
  W.edges.set(e1.id,e1);W.nodes.get(e1.a).edges.push(e1.id);W.nodes.get(e1.b).edges.push(e1.id);edgeGeom(e1);
  W.edges.set(e2.id,e2);W.nodes.get(e2.a).edges.push(e2.id);W.nodes.get(e2.b).edges.push(e2.id);edgeGeom(e2);
  // reattach stops to whichever piece is closest
  for(const{s,p}of keepStops){
    let best=e1,bd=1e9,bestS=0;
    for(const cand of[e1,e2]){let d=1e9,ss=0,cs=0;
      for(let i=0;i<cand.pts.length-1;i++){const r=ptSeg(p,cand.pts[i],cand.pts[i+1]);
        if(r.d<d){d=r.d;cs=ss+r.t*cand.seglen[i];}ss+=cand.seglen[i];}
      if(d<bd){bd=d;best=cand;bestS=cs;}}

function removeEdge(id,skipVeh,keepStops){

  W.nodes.get(e.b)?.edges.splice(W.nodes.get(e.b).edges.indexOf(id),1);

}
function vehiclesOnEdgeGone(id){ // reroute or fail vehicles referencing edge
  for(const v of W.vehs){
    if(v.edge===id){v.state='failed';v.stuck=1e9;}
    else if(v.path&&v.path.some(p=>p.e===id))attemptReroute(v);

}
function removeNode(id){
  const n=W.nodes.get(id);if(!n)return;

}
function removeStop(id){const s=W.stops.get(id);if(!s)return;
  for(const r of W.routes.values()){const i=r.stops.indexOf(id);if(i>=0)r.stops.splice(i,1);}
  for(const p of W.pax)if(p.atStop===id)p.state='failed';

/* add a polyline road; resolves node snaps, splits crossed edges, merges dupes */
function addRoad(pts,opts={}){
  if(pts.length<2)return null;
  pushUndo('add road');
  const created=[];
  let curStart=null;
  // resolve endpoints to nodes
  const endSnap=snapPoint(pts[0].x,pts[0].y);
  curStart=endSnap?resolveSnap(endSnap):newNode(pts[0].x,pts[0].y);
  let prev=curStart,acc=[{x:curStart.x,y:curStart.y}];
  const segs=[];
  for(let i=1;i<pts.length;i++)segs.push([pts[i-1],pts[i]]);
  // gather crossings along whole polyline
  const events=[]; // {segIdx,t,type,edge?,x,y}
  segs.forEach((sg,si)=>{
    const p0=sg[0],p1=sg[1];
    // intersections with existing edges
    for(const e of W.edges.values()){
      for(let k=0;k<e.pts.length-1;k++){
        const hit=segInt(p0,p1,e.pts[k],e.pts[k+1]);
        if(hit&&hit.t>0.02&&hit.t<0.98)events.push({segIdx:si,t:hit.t,type:'cross',edge:e,eseg:k,et:hit.u,x:hit.x,y:hit.y});

    // nearby existing nodes
    for(const n of W.nodes.values()){
      const r=ptSeg(n,p0,p1);if(r.d<SNAP_R*0.7&&r.t>0.05&&r.t<0.95)events.push({segIdx:si,t:r.t,type:'node',node:n,x:n.x,y:n.y});
    }
  });
  events.sort((a,b)=>a.segIdx-b.segIdx||a.t-b.t);

  // dedupe events closer than 10m
  const evs=[];let lx=-1e9,ly=-1e9;
  for(const ev of events){if(dist(ev.x,ev.y,lx,ly)>10){evs.push(ev);lx=ev.x;ly=ev.y;}}
  let pi=1; // polyline point cursor
  for(const ev of evs){
    let n;
    if(ev.type==='node')n=ev.node;
    else n=splitEdgeAt(ev.edge,ev.eseg,ev.et,ev.x,ev.y);
    // finish current road piece at n — trim acc to ev point

  }

  acc.push({x:lastN.x,y:lastN.y});
  commitPiece(prev,lastN,acc,opts,created);
  const cost=created.reduce((a,e)=>a+e.len*120,0);
  if(!P.sandbox){if(cost>P.budget){
    for(const e of created)removeEdge(e.id,true);S.undo.pop();
    toast('Insufficient budget ($'+fmt(P.budget,0)+' — need $'+fmt(cost,0)+')');return null;}
    P.budget-=cost;}

}
function resolveSnap(sn){

function commitPiece(na,nb,pts,opts,created){

  const e=newEdge(na.id,nb.id,opts);
  if(e&&pts.length>2){e.pts=pts.map(p=>({x:p.x,y:p.y}));e.pts[0]={x:na.x,y:na.y};e.pts[e.pts.length-1]={x:nb.x,y:nb.y};edgeGeom(e);}

/* ===================== SIGNALS ===================== */
function mkSignal(n){
  const sig={phases:autoPhases(n),idx:0,t:0,offset:0,mode:P.signalPolicy==='fixed'?'fixed':'auto',cycle:0};
  sig.cycle=sig.phases.reduce((a,p)=>a+p.dur,0);
  n.signal=sig;return sig;
}
function autoPhases(n){
  // group incoming edges by axis; each phase = one axis group green
  const inc=[...new Set(n.edges.map(eid=>{const e=W.edges.get(eid);
    const d=e.a===n.id?'f':'b';return dirLanes(e,d)>0?eid:null;}).filter(Boolean))];
  if(inc.length<2)return[];
  // cluster by approach angle
  const angs=inc.map(eid=>{const e=W.edges.get(eid);const o=e.a===n.id?e._b:e._a;
    return Math.atan2(n.y-o.y,n.x-o.x);});
  const groups=[];
  inc.forEach((eid,i)=>{
    let g=groups.find(g=>{let d=Math.abs(((angs[i]-g.ang+Math.PI*3)%(Math.PI*2))-Math.PI);return d<0.8;});
    if(!g){g={ang:angs[i],ins:[]};groups.push(g);}g.ins.push(eid);
    g.ang=(g.ang*(g.ins.length-1)+angs[i])/g.ins.length;
  });
  if(groups.length<2)groups.length=2, groups[1]=groups[1]||{ins:[inc[1]||inc[0]]};
  const phases=[];
  const gc=groups.length;
  for(let i=0;i<gc;i++){
    // pair opposite-ish groups when 4-way: phase i greens group i + opposite
    const allow=new Set();
    if(gc>=3&&gc%2===0){const opp=groups[(i+gc/2)%gc];
      for(const a of[groups[i],opp])for(const eid of a.ins)allow.add(eid+':*');
      // permissive right/straight for others off
    }else{for(const eid of groups[i].ins)allow.add(eid+':*');}
    phases.push({dur:22,allow:[...allow]});
  }
  return phases.length?phases:[{dur:22,allow:[inc[0]+':*']}];
}
function signalState(n,inEid){ // 'g'|'r'|'y' for approach inEid
  const sig=n.signal;if(!sig||!sig.phases.length)return'g';
  const ph=sig.phases[sig.idx%sig.phases.length];
  const yel=ph.dur-(sig.t)<2.2&&sig.t>1; // last 2.2s = amber
  const ok=ph.allow.some(a=>{const[ie,oe]=a.split(':');return ie===inEid&&(oe==='*'||oe===undefined);});
  return ok?(yel?'y':'g'):'r';
}
function stepSignals(dt){
  for(const n of W.nodes.values()){const sig=n.signal;if(!sig||!sig.phases.length)continue;
    sig.t+=dt;
    const ph=sig.phases[sig.idx%sig.phases.length];
    if(sig.t>=ph.dur){sig.t=0;sig.idx=(sig.idx+1)%sig.phases.length;
      if(sig.mode==='auto')autoRetune(n);}
  }
}
function autoRetune(n){ // adaptive: lengthen phase serving longest queue
  const sig=n.signal;if(!sig||sig.mode!=='auto'||sig.phases.length<2)return;
  const ph=sig.phases[sig.idx%sig.phases.length];
  let q=0;for(const a of ph.allow){const ie=a.split(':')[0];q+=queueOn(ie);}
  ph.dur=clamp(14+q*1.2,12,40);
  sig.cycle=sig.phases.reduce((a,p)=>a+p.dur,0);
  if(sig.cycle>100){const k=100/sig.cycle;for(const p of sig.phases)p.dur=Math.max(8,p.dur*k);sig.cycle=sig.phases.reduce((a,p)=>a+p.dur,0);}
}
function queueOn(eid){ // vehicles queued (v<0.5) on edge both dirs
  const e=W.edges.get(eid);if(!e)return 0;let q=0;
  for(const v of W.vehs)if(v.edge===eid&&v.v<0.6)q++;
  return q;
}
function signalDiag(n){ // conflicts & unreachable phases
  const sig=n.signal,out={conflicts:[],unreachable:[]};
  if(!sig)return out;
  const inE=new Set(n._info?n._info.moves.map(m=>m.inE):[]);
  sig.phases.forEach((ph,i)=>{
    let any=false;
    for(const a of ph.allow){const[ie,oe]=a.split(':');
      if(!W.edges.has(ie))continue;
      if(oe==='*'){if(movementsInto(n,ie).length)any=true;}
      else if(movementAt(n,ie,oe))any=true;}
    if(!any)out.unreachable.push(i);
    // conflicting greens within phase
    const keys=[];
    for(const a of ph.allow){const[ie,oe]=a.split(':');
      const mv=oe==='*'?movementsInto(n,ie):[movementAt(n,ie,oe)].filter(Boolean);
      mv.forEach(m=>keys.push(m.key));}
    for(let x=0;x<keys.length;x++)for(let y=x+1;y<keys.length;y++)
      if(movesConflict(n,keys[x],keys[y]))out.conflicts.push({phase:i,a:keys[x],b:keys[y]});

/* ===================== ROUTING ===================== */
/* directed Dijkstra over (edge,dir) — vehicles travel edge a->b ('f') or b->a ('b') */
const routeCache={stamp:0,map:new Map()};
function invalidateRoutes(){routeCache.stamp++;}
function edgeCost(e,dir,veh){
  if(e.closed||e.oneway&&e.oneway!==dir)return Infinity;
  if(dirLanes(e,dir)<=0)return Infinity;
  const sp=e.speed*(e.cond||1)*weatherMult();
  let t=e.len/Math.max(sp,0.5);
  if(P.reroute>0.01&&e.emaT>0)t=lerp(t,e.emaT,P.reroute);
  t+=e.load*0.8*P.reroute;
  return t;
}
function routeEdges(fromKey,toKey,veh){ // keys 'edgeId:dir'; returns [{e,dir}] or null
  const toE=toKey.split(':')[0];
  const distM=new Map(),prev=new Map(),pq=[[0,fromKey]];
  const nodeOf=(eid,dir)=>dir==='f'?W.edges.get(eid).b:W.edges.get(eid).a;
  distM.set(fromKey,0);
  const goal=[];
  while(pq.length){
    pq.sort((a,b)=>a[0]-b[0]);const[d,key]=pq.shift();
    if(d>(distM.get(key)??Infinity))continue;
    const[eid,dir]=key.split(':'),e=W.edges.get(eid);if(!e)continue;
    const node=W.nodes.get(nodeOf(eid,dir));if(!node||node.closed)continue;
    if(eid===toE){goal.push({key,d});continue;}
    for(const eid2 of node.edges){const e2=W.edges.get(eid2);if(!e2)continue;
      const dir2=e2.a===node.id?'f':'b';
      // turn restriction
      if(e.noTurns&&e.noTurns[eid2])continue;
      const c=edgeCost(e2,dir2,veh);if(!isFinite(c))continue;
      const k2=eid2+':'+dir2,nd=d+c+turnPenalty(e,e2,node);
      if(nd<(distM.get(k2)??Infinity)){distM.set(k2,nd);prev.set(k2,key);pq.push([nd,k2]);}
    }
  }
  if(!goal.length)return null;
  goal.sort((a,b)=>a.d-b.d);
  let k=goal[0].key,path=[];
  while(k&&k!==fromKey){const[eid,dir]=k.split(':');path.unshift({e:eid,dir});k=prev.get(k);}
  return path;
}
function turnPenalty(e1,e2,node){
  if(e1.id===e2.id)return 30; // u-turn
  const m=movementAt(node,e1.id,e2.id);
  let p=node.signal?9:node.roundabout?5:3.5;
  if(m&&m.kind==='L')p+=4;
  return p;
}
function nearestEdgePoint(x,y){
  let best=null;
  for(const e of W.edges.values()){
    for(let i=0;i<e.pts.length-1;i++){const r=ptSeg({x,y},e.pts[i],e.pts[i+1]);
      if(!best||r.d<best.d)best={e,d:r.d,x:r.x,y:r.y,t:r.t,seg:i};}}
  if(!best)return null;
  // arclength along edge
  let s=0;for(let i=0;i<best.seg;i++)s+=best.e.seglen[i];s+=(best.e.seglen[best.seg]||0)*best.t;

}
function zoneAnchor(z){ // edge + s where zone attaches
  if(z._edge&&W.edges.has(z._edge))return{edge:W.edges.get(z._edge),s:z._s||0};
  const c={x:z.x+z.w/2,y:z.y+z.h/2};
  const b=nearestEdgePoint(c.x,c.y);
  if(b){z._edge=b.e.id;z._s=b.s;return{edge:b.e,s:b.s};}

function weatherMult(){return S.weather;}

/* ===================== VEHICLES ===================== */
function spawnVehicle(o,d,type,route){
  const a=zoneAnchor(o),b=zoneAnchor(d);if(!a||!b)return null;

  for(const od of odirs){for(const dd of['f','b']){
    const p=routeEdges(a.edge.id+':'+od,b.edge.id+':'+dd,null);
    if(p&&p.length){path=p;dirO=od;break;}}if(path)break;}
  // also allow zero-hop case: origin==dest edge
  if(!path&&a.edge===b.edge){path=[];dirO=odirs[0];}
  if(!path){W.failedTrips++;W.tripLog.push({t:W.simTime,ok:0,why:'unreachable'});return null;}
  const T=VTYPES[type];
  const v={id:'v'+(W.nextVehId++),type,edge:a.edge.id,dir:dirO,lane:0,laneF:0,
    s:clamp(a.s,2,a.edge.len-2),v:T.v0*0.6,path:[{e:a.edge.id,dir:dirO},...path],pi:0,state:'drive',
    t0:W.simTime,dist:0,wait:0,o:o.id,d:d.id,mv:null,jt:0,lcCd:2+W.rng()*4,
    doneS:0,hway:T.cap||0};
  // dest stop position on final edge
  const fe=W.edges.get(v.path[v.path.length-1].e);
  v.doneS=(b.edge===fe)?clamp(b.s,1,fe.len-5):fe.len-5;
  if(v.path.length===1&&v.doneS<v.s+25)v.doneS=fe.len-5;

}
function laneVehMap(){ // rebuild per substep: edgeId:dir -> sorted arrays per lane
  const m=new Map();
  for(const v of W.vehs){
    if(v.state!=='drive')continue;
    const e=W.edges.get(v.edge);if(!e)continue;
    const k=v.edge+':'+v.dir;
    let L=m.get(k);if(!L){L=[];m.set(k,L);}
    L.push(v);
  }
  for(const L of m.values())L.sort((a,b)=>a.s-b.s);
  return m;
}
function gapAhead(v){ // distance to leader in same lane (via scan)

  for(const u of W.vehs){if(u===v||u.edge!==v.edge||u.dir!==v.dir||u.lane!==v.lane)continue;
    if(u.state!=='drive')continue;
    const T=VTYPES[u.type];const d=u.s-v.s-T.len;

function leaderOf(v,lanes){
  const L=lanes.get(v.edge+':'+v.dir);if(!L)return{g:1e9};
  let g=1e9,lead=null;
  for(const u of L){if(u===v)continue;if(u.lane!==v.lane)continue;
    const T=VTYPES[u.type];const d=u.s-v.s-T.len;
    if(d>-T.len&&d<g){g=d;lead=u;}}
  // incident blocking this lane acts as stopped vehicle
  for(const ic of W.incidents){if(ic.edge===v.edge&&ic.dir===v.dir&&ic.lane===v.lane){
    const d=ic.s-v.s-4;if(d>-4&&d<g){g=d;lead=null;}}}
  return{g,lead};
}
function junctionGate(v,e){ // can v leave edge into next edge? returns {stop:bool}
  if(!v.path||v.pi>=v.path.length-1)return{stop:false,last:true};
  const nxt=v.path[v.pi+1],node=W.nodes.get(v.dir==='f'?e.b:e.a);
  if(!node)return{stop:true};
  const outE=W.edges.get(nxt.e);
  if(!outE||outE.closed){return{stop:true,reroute:true};}
  if(dirLanes(outE,nxt.dir)<=0)return{stop:true,reroute:true};
  if(e.noTurns&&e.noTurns[nxt.e])return{stop:true,reroute:true};
  if(node.closed)return{stop:true};
  const m=movementAt(node,v.edge,nxt.e);
  if(!m)return{stop:true,reroute:true};
  if(node.signal){const st=signalState(node,v.edge);
    if(st==='r')return{stop:true};if(st==='y'&&e.len-v.s>7)return{stop:true};}
  // conflict check vs occupants
  const occ=node._occ||(node._occ=[]);
  if(node.roundabout){
    let inside=0;for(const o2 of occ){if(W.simTime-o2.t<14)inside++;}
    if(inside>=Math.max(2,node.edges.length))return{stop:true};
  }
  const win=node.signal?1.6:node.roundabout?2.2:3;
  for(const o2 of occ)if(movesConflict(node,m.key,o2.key)&&W.simTime-o2.t<win)return{stop:true};
  if(!node.signal&&!node.roundabout){
    // priority yield: lower-class approach yields to faster-class approaching vehs
    const cls=x=>W.edges.get(x)?W.edges.get(x).speed*edgeLanes(W.edges.get(x)):0;
    if(cls(v.edge)<cls2max(node,v.edge)){
      for(const u of W.vehs){if(u===v||u.state!=='drive'||u.edge===v.edge)continue;
        const eu=W.edges.get(u.edge);if(!eu)continue;
        const un=W.nodes.get(u.dir==='f'?eu.b:eu.a);
        if(un!==node)continue;
        const mu=movementAt(node,u.edge,nextOf(u));
        if(!mu||!movesConflict(node,m.key,mu.key))continue;
        if(cls(u.edge)>cls(v.edge)&&eu.len-u.s<26&&u.v>3)return{stop:true};
      }
    }
  }
  // room on outgoing edge
  const nl=dirLanes(outE,nxt.dir),lane=Math.min(v.lane,nl-1);
  let tail=1e9;for(const u of W.vehs){if(u.edge===nxt.e&&u.dir===nxt.dir&&u.lane===lane&&u.state==='drive'){
    const d=u.s+ (u.jt||0);if(d<tail)tail=u.s;}}
  if(tail<VTYPES[v.type].len+3.5)return{stop:true};
  return{stop:false,move:m,node,outE,nxt};
}
function nextOf(v){return v.path&&v.path[v.pi+1]?v.path[v.pi+1].e:v.edge;}
function cls2max(node,except){let c=0;for(const eid of node.edges){if(eid===except)continue;const e=W.edges.get(eid);if(e)c=Math.max(c,e.speed*edgeLanes(e));}return c;}
function attemptReroute(v){
  if(v.bus){busLeg(v);return;}
  rerouteVehicle(v,true);
}
function rerouteVehicle(v,force){
  const d=W.zones.get(v.d);const b=d?zoneAnchor(d):null;
  const e=W.edges.get(v.edge);if(!e||!b){v.state='failed';return;}
  let path=null;
  for(const dd of[b.edge.oneway||'f',(b.edge.oneway||'f')==='f'?'b':'f']){
    path=routeEdges(v.edge+':'+v.dir,b.edge.id+':'+dd,v);if(path&&path.length)break;path=null;}
  if(!path){v.state='failed';W.failedTrips++;W.tripLog.push({t:W.simTime,ok:0,why:'reroute-fail'});return;}
  v.path=[{e:v.edge,dir:v.dir},...path];v.pi=0;
  const fe=W.edges.get(v.path[v.path.length-1].e);
  v.doneS=(b.edge===fe)?clamp(b.s,1,fe.len-5):fe.len-5;
  if(v.path.length===1&&v.doneS<v.s+25)v.doneS=fe.len-5;
  e.nTurns=(e.nTurns||0)+1;
}
function stepVehicles(dt){
  const lanes=laneVehMap();
  for(const v of W.vehs){
    const T=VTYPES[v.type];
    if(v.state==='cross'){stepCross(v,dt);continue;}
    if(v.state==='dwell'){v.dwellT-=dt;if(v.dwellT<=0){v.state='drive';v.holdT=0;}continue;}
    if(v.state!=='drive')continue;
    const e=W.edges.get(v.edge);if(!e){v.state='failed';continue;}
    const{g,lead}=leaderOf(v,lanes);
    const v0=T.v0*(0.85+0.3*P.aggr)*Math.min(1,e.speed/14)*weatherMult()*(e.cond||1);
    const hw=P.headway*(v.type==='bus'?1.4:v.type==='truck'?1.6:1);
    // junction gate lookahead
    let gap=g,stopAt=-1;
    const distEnd=e.len-v.s;
    const gate=distEnd<60?junctionGate(v,e):{stop:false};
    if(gate.stop&&distEnd<40){const dStop=Math.max(0,distEnd-3.5);
      if(dStop<gap){gap=dStop;stopAt=dStop;}
      if(gate.reroute&&distEnd<6){v.wait+=dt;if(v.wait>3){attemptReroute(v);v.wait=0;}}
      else if(gate.stop)v.wait+=dt*0;
    }
    const sstar=(2.2+hw*1.5)+Math.max(0,v.v*hw+ v.v*(v.v-(lead?lead.v:0))/(2*Math.sqrt(T.acc*T.brk)));
    const acc=T.acc*(1-Math.pow(v.v/Math.max(v0,0.5),4)-Math.pow(sstar/Math.max(gap,0.5),2));
    v.v=clamp(v.v+acc*dt,0,v0*1.05);
    const ds=v.v*dt;v.s+=ds;v.dist+=ds;
    if(v.v<0.3)v.wait+=dt;else v.wait=Math.max(0,v.wait-dt);
    // reached destination?
    if(!v.bus&&v.pi===v.path.length-1&&(v.s>=v.doneS||v.s>=e.len-0.5)){finishVehicle(v,true);continue;}
    // reached edge end → cross junction
    if(v.s>=e.len-0.01){
      if(gate.stop){
        v.s=e.len-0.01;
        if(v.v<0.4&&gate.reroute){v.wait+=dt;if(v.wait>2){attemptReroute(v);v.wait=0;}}
        if(v.wait>240&&W.rng()<0.002){attemptReroute(v);}
      }else if(gate.move){
        v.state='cross';v.mv=gate.move;v.jt=0;v.node=gate.node.id;v.nxt=gate.nxt;
        gate.node._occ=gate.node._occ||[];gate.node._occ.push({key:gate.move.key,t:W.simTime,v:v.id});
        if(gate.node._occ.length>40)gate.node._occ.splice(0,10);
        e.emaQ=lerp(e.emaQ||0,v.wait>3?1:0,0.15);
      }
    }
    // lane change (simple gap-seeking)
    if(P.laneChange>0.01){v.lcCd-=dt;
      if(v.lcCd<=0&&v.state==='drive')tryLaneChange(v,e,lanes);}
    if(v.laneF!==v.lane)v.laneF+=clamp(v.lane-v.laneF,-dt*2.2,dt*2.2);
    // stuck-fail
    if(v.wait>400&&v.state==='drive'){if(W.rng()<0.005){v.state='failed';W.failedTrips++;W.tripLog.push({t:W.simTime,ok:0,why:'stuck'});}}
  }
  // cull done/failed
  for(let i=W.vehs.length-1;i>=0;i--){const v=W.vehs[i];
    if(v.state==='done'||v.state==='failed')W.vehs.splice(i,1);}
}
function stepCross(v,dt){
  const m=v.mv,n=W.nodes.get(v.node);
  const spd=Math.max(v.v,3);
  v.jt+=spd*dt;
  const need=m.len+VTYPES[v.type].len*0.5;
  if(v.jt>=need){
    const ne=W.edges.get(v.nxt.e);
    if(!ne){v.state='failed';return;}
    v.edge=ne.id;v.dir=v.nxt.dir;v.s=1.5;v.pi++;v.state='drive';v.wait=0;
    const nl=dirLanes(ne,v.dir);v.lane=Math.min(v.lane,Math.max(0,nl-1));
    ne.load+=1;
    const prevE=n?null:null;
    if(v.bus)busArriveCheck(v);
  }
}
function tryLaneChange(v,e,lanes){
  const nl=dirLanes(e,v.dir);if(nl<2)return;
  const{g}=leaderOf(v,lanes);
  let best=v.lane,bestG=g;
  for(const dl of[-1,1]){const l=v.lane+dl;if(l<0||l>=nl)continue;
    let ga=1e9,gb=1e9;
    for(const u of W.vehs){if(u===v||u.edge!==v.edge||u.dir!==v.dir||u.lane!==l||u.state!=='drive')continue;
      const d=u.s-v.s-VTYPES[u.type].len;
      if(d>-VTYPES[u.type].len&&d<ga)ga=d;
      const db=v.s-u.s-VTYPES[v.type].len;
      if(db>-VTYPES[v.type].len&&db<gb)gb=d;}
    for(const ic of W.incidents)if(ic.edge===v.edge&&ic.dir===v.dir&&ic.lane===l){
      const d=ic.s-v.s-4;if(d>-4&&d<ga)ga=d;}
    if(gb<5)continue;
    if(ga>bestG+3+P.laneChange*8){bestG=ga;best=l;}
  }
  if(best!==v.lane){v.lane=best;v.lcCd=2.5+W.rng()*5;}
}
function finishVehicle(v,ok){
  v.state=ok?'done':'failed';
  const tt=W.simTime-v.t0;
  const ff=v.dist/ (VTYPES[v.type].v0*weatherMult());
  W.tripLog.push({t:W.simTime,ok:ok?1:0,tt,dist:v.dist,delay:Math.max(0,tt-ff),type:v.type,why:ok?'':'failed'});
  if(W.tripLog.length>4000)W.tripLog.splice(0,1000);
  if(ok)W.carTrips++;else W.failedTrips++;
}

/* ===================== TRANSIT ===================== */
function linkRouteStops(r){for(const sid2 of r.stops){const s=W.stops.get(sid2);if(s)s.routeIds=s.routeIds||[],s.routeIds.includes(r.id)||s.routeIds.push(r.id);}}
function stopPos(s){const e=W.edges.get(s.edge);if(!e)return null;return edgePoint(e,s.dir||'f',s.pos,0);}
function transitPath(fromStop,toStopId){ // BFS legs over routes; returns [{route,board,alight}]
  const q=[{s:fromStop,legs:[]}],seen=new Set([fromStop]);
  while(q.length){const cur=q.shift();
    if(cur.s===toStopId)return cur.legs;
    const st=W.stops.get(cur.s);if(!st)continue;
    for(const rid2 of st.routeIds||[]){const r=W.routes.get(rid2);if(!r)continue;
      const idx=r.stops.indexOf(cur.s);if(idx<0)continue;
      for(let j=0;j<r.stops.length;j++){if(j===idx)continue;
        const ts=r.stops[j],key=ts;
        if(seen.has(key))continue;
        const legs=cur.legs.concat([{route:rid2,board:cur.s,alight:ts}]);
        if(ts===toStopId)return legs;
        seen.add(key);q.push({s:ts,legs});}
    }
  }
  return null;
}
function spawnPax(o,d){
  // find nearest stop to origin zone and destination zone
  const so=nearestStopTo(o),sd=nearestStopTo(d);
  if(!so||!sd||so===sd)return false;
  const legs=transitPath(so,sd);if(!legs)return false;
  W.pax.push({id:'p'+(W.nextVehId++),o:o.id,d:d.id,atStop:so,legs,leg:0,
    state:'wait',t0:W.simTime,waitT:0,rideT:0,stop:sd});
  return true;
}
function nearestStopTo(z){
  let best=null;
  for(const s of W.stops.values()){const p=stopPos(s);if(!p)continue;
    const dx=Math.max(z.x-p.x,0,p.x-(z.x+z.w)),dy=Math.max(z.y-p.y,0,p.y-(z.y+z.h));
    const d=Math.hypot(dx,dy);
    if(d<520&&(!best||d<best.d))best={id:s.id,d};}
  return best?best.id:null;
}
function spawnBus(r){
  if(!r.stops.length)return;
  const s0=W.stops.get(r.stops[0]);if(!s0)return;
  const e=W.edges.get(s0.edge);if(!e)return;
  const dir=s0.dir||'f';
  for(const u of W.vehs)if(u.edge===e.id&&Math.abs(u.s-s0.pos)<14){r.nextSpawn=20;return;} // occupied
  const si0=Math.floor(W.rng()*r.stops.length);
  const st0=W.stops.get(r.stops[si0]);const e0=st0&&W.edges.get(st0.edge);
  const v={id:'v'+(W.nextVehId++),type:'bus',bus:true,route:r.id,edge:(e0||e).id,dir:(st0||s0).dir||'f',
    lane:0,laneF:0,s:clamp((st0||s0).pos,2,(e0||e).len-2),v:5,path:null,pi:0,state:'drive',
    t0:W.simTime,dist:0,wait:0,si:si0,hway:0,board:0,holdT:0,mv:null,jt:0,lcCd:5,doneS:0};
  if(!busLeg(v)){return;}
  W.vehs.push(v);r.vehs.push(v.id);
}
function busLeg(v){ // route to next stop on its route
  const r=W.routes.get(v.route);if(!r||r.stops.length<2)return false;
  const nextIdx=(v.si+1)%r.stops.length;
  const st=W.stops.get(r.stops[nextIdx]);if(!st)return false;
  const e2=W.edges.get(st.edge);if(!e2)return false;
  const from=v.edge+':'+v.dir;
  const path=routeEdges(from,st.edge+':'+ (st.dir||'f'),v)
          ||routeEdges(from,st.edge+':'+((st.dir||'f')==='f'?'b':'f'),v);
  if(!path||!path.length){ // give up this leg — try skipping
    v.si=nextIdx;if(v.si===0)return false;return busLeg(v);
  }
  v.path=[{e:v.edge,dir:v.dir},...path];v.pi=0;v.nextStop=st.id;
  const fe=W.edges.get(v.path[v.path.length-1].e);
  v.doneS=(fe.id===st.edge)?clamp(st.pos,1,fe.len-5):fe.len-5;
  return true;
}
function busArriveCheck(v){}
function stepBuses(dt){
  for(const r of W.routes.values()){
    if(r.stops.length<1)continue;
    r.nextSpawn-=dt;
    if(r.nextSpawn<=0){r.nextSpawn=(r.headway||P.busHeadway);spawnBus(r);}
    r.vehs=r.vehs.filter(id=>W.vehs.some(v=>v.id===id));
  }
  for(const v of W.vehs){
    if(!v.bus||v.state!=='drive')continue;
    const st=W.stops.get(v.nextStop);if(!st)continue;
    const e=W.edges.get(v.edge);if(!e||v.edge!==st.edge||v.pi!==v.path.length-1)continue;
    const fpos=v.dir==='b'?e.len-v.s:v.s;
    if(Math.abs(fpos-st.pos)<3){
      W._dwells=(W._dwells||0)+1;
      v.state='dwell';v.dwellT=P.dwell*(0.8+W.rng()*0.4);v.v=0;
      busExchange(v,st);
    }
  }
}
function busExchange(v,st){
  const r=W.routes.get(v.route);
  // alight
  for(const p of W.pax){
    if(p.state!=='ride'||p.veh!==v.id)continue;
    const leg=p.legs[p.leg];
    if(leg&&leg.alight===st.id){p.leg++;
      if(p.leg>=p.legs.length){p.state='done';p.waitT2=W.simTime-p.t0;W.busTrips++;
        W.tripLog.push({t:W.simTime,ok:1,tt:W.simTime-p.t0,type:'pax',wait:p.waitT});}
      else{p.state='wait';p.atStop=st.id;p.waitT=0;}
    }
  }
  // board
  let cap=(r.capacity||P.busCap)-v.board;
  for(const p of W.pax){
    if(cap<=0)break;
    if(p.state==='wait'&&p.atStop===st.id){
      const leg=p.legs[p.leg];
      if(leg&&leg.board===st.id&&leg.route===v.route){
        p.state='ride';p.veh=v.id;p.waitEnd=W.simTime;p.waitT+=W.simTime-p.t0-p.rideT;
        v.board++;cap--;r.rid=(r.rid||0)+1;

    }
  }
  // advance to next stop after dwell (handled when leaving dwell)
  const r2=W.routes.get(v.route);

function stepPax(dt){
  for(const p of W.pax){
    if(p.state==='wait'){p.waitT+=dt;
      if(p.waitT>900){p.state='failed';W.unserved++;W.tripLog.push({t:W.simTime,ok:0,why:'pax-abandon'});}}
    else if(p.state==='ride'){
      const b=W.vehs.find(v=>v.id===p.veh);
      if(!b){p.state='failed';W.unserved++;W.tripLog.push({t:W.simTime,ok:0,why:'bus-lost'});}
    }
  }
  for(let i=W.pax.length-1;i>=0;i--){if(W.pax[i].state==='done'||W.pax[i].state==='failed')W.pax.splice(i,1);}
}
function waitingAt(sid2){let n=0;for(const p of W.pax)if(p.state==='wait'&&p.atStop===sid2)n++;return n;}

/* ===================== DEMAND ===================== */
function todMult(){ // time-of-day demand shape
  const h=(W.simTime/3600)%24;
  let m=0.35;
  m+=1.5*Math.exp(-Math.pow(h-8.2,2)/1.8);   // AM peak
  m+=1.15*Math.exp(-Math.pow(h-17.6,2)/2.6); // PM peak
  m+=0.35*Math.exp(-Math.pow(h-12.5,2)/4);
  if(S.eventMode)m+=1.6*Math.exp(-Math.pow(h-20,2)/1.5);
  return m;
}
let demandAcc=0;
function stepDemand(dt){
  const zones=[...W.zones.values()];
  if(zones.length<2||!W.edges.size)return;
  let rate=0;
  for(const z of zones)rate+=(ZTYPES[z.type]?.gen||0.5)*z.w*z.h/22000;
  rate*=P.demand*todMult()*dt/90; // trips/sec accumulator
  demandAcc+=rate;
  const rng=W.rng;
  while(demandAcc>1){
    demandAcc-=1;
    if(W.vehs.filter(v=>!v.bus).length>P.spawnCap)break;
    const o=pickZone(zones,'gen'),d=pickZone(zones,'att',o);
    if(!o||!d||o===d){demandAcc+=0;continue;}
    const goTransit=W.stops.size>=2&&rng()<P.transitShare;
    if(goTransit&&spawnPax(o,d))continue;
    // vehicle type: freight to/from industrial
    let type='car';
    if(o.type==='ind'||d.type==='ind')type=rng()<0.7?'truck':'car';
    else if(rng()<0.06)type='truck';
    const v=spawnVehicle(o,d,type);
    if(!v&&!goTransit)demandAcc+=0.0; // failed spawn counted inside
  }
}
function pickZone(zones,mode,avoid){
  let tot=0;const w=[];
  const h=(W.simTime/3600)%24;const am=h>6&&h<10,pm=h>15.5&&h<19.5;
  for(const z of zones){const Z=ZTYPES[z.type];if(!Z)continue;
    let wt=z.w*z.h/10000*(mode==='gen'?Z.gen:Z.att)*(z.boost||1);
    if(mode==='att'&&am&&z.type==='com')wt*=2.4;
    if(mode==='gen'&&am&&z.type==='res')wt*=1.9;
    if(mode==='att'&&pm&&z.type==='res')wt*=2.1;
    if(mode==='gen'&&pm&&z.type==='com')wt*=1.6;
    if(S.eventMode&&z.type==='evt')wt*=(mode==='att'?26:8);
    if(z===avoid)wt*=0.15;
    w.push(wt);tot+=wt;}
  if(!tot)return null;
  let r=W.rng()*tot;
  for(let i=0;i<zones.length;i++){r-=w[i];if(r<=0)return zones[i];}
  return zones[zones.length-1];
}
/* ===================== INCIDENTS ===================== */
function addIncident(edge,dir,lane,s,kind,dur){
  const ic={id:'i'+(_uid++),edge,dir,lane,s,kind:kind||'crash',t:W.simTime+(dur||240)};
  W.incidents.push(ic);
  const e=W.edges.get(edge);if(e)e.cond=Math.min(e.cond,kind==='roadwork'?0.45:0.3);
  rerouteAffected(edge);
  toast((kind==='roadwork'?'Roadworks':'Incident')+' on '+ (e?.name||edge));
  return ic;
}
function rerouteAffected(eid){
  for(const v of W.vehs)if(v.path&&v.path.some(p=>p.e===eid)&&W.rng()<P.reroute)attemptReroute(v);
}
function stepIncidents(dt){
  for(let i=W.incidents.length-1;i>=0;i--){const ic=W.incidents[i];
    if(W.simTime>ic.t){const e=W.edges.get(ic.edge);if(e)e.cond=1;W.incidents.splice(i,1);}}
  // random incidents
  if(P.incidentRate>0&&W.edges.size&&W.rng()<P.incidentRate*dt/900){
    const es=[...W.edges.values()].filter(e=>!e.closed);
    if(es.length){const e=es[Math.floor(W.rng()*es.length)];
      const dir=e.oneway||(W.rng()<0.5?'f':'b');
      if(dirLanes(e,dir)>0)addIncident(e.id,dir,Math.floor(W.rng()*dirLanes(e,dir)),e.len*(0.3+W.rng()*0.5),'crash',180+W.rng()*240);}
  }
}

/* ===================== ANALYTICS ===================== */
const AN={hist:[],t:0,series:{throughput:[],travel:[],delay:[],queue:[],speed:[],pax:[],wait:[],occ:[],emis:[]},
  edgeT:new Map()};
function pct(arr,p){if(!arr.length)return 0;const a=[...arr].sort((x,y)=>x-y);return a[Math.min(a.length-1,Math.floor(p*a.length))];}
function metrics(){
  const recent=W.tripLog.filter(l=>l.ok&&W.simTime-l.t<600);
  const failed=W.tripLog.filter(l=>!l.ok&&W.simTime-l.t<600).length;
  const tts=recent.map(l=>l.tt),dels=recent.map(l=>l.delay||0);
  let queue=0,vsum=0,vn=0,emis=0;
  for(const v of W.vehs){if(v.v<0.6)queue++;vsum+=v.v;vn++;emis+=v.v*v.v*0.001+ (v.v<0.6?0.8:0.15);}
  const through=W.tripLog.filter(l=>W.simTime-l.t<300&&l.ok).length*12;
  const waitP=W.pax.filter(p=>p.state==='wait');
  const doneP=W.tripLog.filter(l=>l.type==='pax'&&l.ok&&W.simTime-l.t<600);
  let occ=0,bn=0;for(const v of W.vehs)if(v.bus){occ+=v.board;bn++;}
  return{throughput:through,avgT:tts.length?tts.reduce((a,b)=>a+b,0)/tts.length:0,
    p50:pct(tts,0.5),p95:pct(tts,0.95),
    delay:dels.length?dels.reduce((a,b)=>a+b,0)/dels.length:0,
    queue,netSpeed:vn?vsum/vn*3.6:0,active:W.vehs.length,
    completed:W.carTrips+W.busTrips,failed:W.failedTrips,unserved:W.unserved,
    paxWait:waitP.length,ridership:W.busTrips,occ:bn?occ/bn:0,
    avgWait:doneP.length?doneP.reduce((a,l)=>a+(l.wait||0),0)/doneP.length:0,
    emis};
}
function stepAnalytics(dt){
  AN.t+=dt;
  for(const e of W.edges.values())e.load*=Math.pow(0.5,dt/45); // decay route-choice load
  if(AN.t>=2){
    AN.t=0;const m=metrics();
    const S2=AN.series;
    (S2.throughput.push(m.throughput),S2.travel.push(m.avgT),S2.delay.push(m.delay),
     S2.queue.push(m.queue),S2.speed.push(m.netSpeed),S2.pax.push(m.paxWait),
     S2.wait.push(m.avgWait),S2.occ.push(m.occ),S2.emis.push(m.emis));
    for(const k in S2)if(S2[k].length>300)S2[k].shift();
    AN.hist.push({t:W.simTime,...m});
    if(AN.hist.length>300)AN.hist.shift();
  }
}
function updateEdgeEMA(){ // called on vehicle completion region — cheap approx: per-edge mean speed
  const agg=new Map();
  for(const v of W.vehs){if(v.state!=='drive')continue;
    const e=W.edges.get(v.edge);if(!e)continue;
    let a=agg.get(v.edge);if(!a)a={n:0,s:0};a.n++;a.s+=v.v;agg.set(v.edge,a);}
  for(const e of W.edges.values()){
    const a=agg.get(e.id);
    const sp=a?a.s/a.n:e.speed;
    const t=e.len/Math.max(sp,0.5);
    e.emaT=lerp(e.emaT||t,t,0.05);
  }
}
function congestedEdges(){
  return[...W.edges.values()].map(e=>{const a={e,ratio:0};
    const sp=e.len/Math.max(e.emaT||e.len/e.speed,0.01);
    a.ratio=sp/e.speed;a.q=queueOn(e.id);return a;})
    .sort((a,b)=>a.ratio-b.ratio).slice(0,6);
}
/* ===================== MAIN STEP ===================== */
function stepSim(dt){
  W.simTime+=dt;
  stepSignals(dt);stepVehicles(dt);stepBuses(dt);stepDemand(dt);stepPax(dt);
  stepIncidents(dt);stepAnalytics(dt);
  updateEdgeEMA();
}
function resetSim(keepMap=true){
  const snap=keepMap?modelSnapshot():null;
  W.vehs.length=0;W.pax.length=0;W.incidents.length=0;W.tripLog.length=0;
  W.carTrips=W.busTrips=W.failedTrips=W.unserved=0;demandAcc=0;
  W.simTime=W.startT??6*3600+30*60;W.rng=mulberry32(W.seed);
  AN.hist.length=0;for(const k in AN.series)AN.series[k].length=0;
  for(const e of W.edges.values()){e.emaT=0;e.load=0;e.cond=1;e.emaQ=0;}
  for(const r of W.routes.values()){r.vehs=[];r.nextSpawn=5+W.rng()*20;r.rid=0;}
  for(const n of W.nodes.values()){if(n.signal){n.signal.idx=0;n.signal.t=0;}n._occ=[];}
}

/* ===================== RENDER ===================== */
const cv=$('#map'),ctx=cv.getContext('2d');
let DPR=1;
function resize(){
  const w=$('#mapwrap');DPR=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(w.clientWidth*DPR);cv.height=Math.round(w.clientHeight*DPR);
}
addEventListener('resize',resize);
const cam=S.cam;
function w2s(x,y){return{x:(x-cam.x)*cam.z+cv.width/2/DPR,y:(y-cam.y)*cam.z+cv.height/2/DPR};}
function s2w(x,y){return{x:(x-cv.width/2/DPR)/cam.z+cam.x,y:(y-cv.height/2/DPR)/cam.z+cam.y};}
function heatCol(t){ // 0 green → 1 red
  t=clamp(t,0,1);const h=(1-t)*0.36;
  return`hsl(${h*360},85%,${45+t*10}%)`;
}
const OV_OPTIONS=[['none','No overlay'],['speed','Speed'],['density','Density'],['queue','Queue length'],
  ['travel','Travel time'],['route','Route choice'],['signal','Signal phase'],['turn','Turn movements'],
  ['coverage','Transit coverage'],['pax','Waiting passengers'],['emis','Emissions'],['od','O-D demand'],
  ['valid','Network validation']];
function overlayColor(e){
  const o=S.overlay;if(o==='none')return null;
  if(o==='speed'){const sp=e.len/Math.max(e.emaT||e.len/e.speed,.01);return heatCol(1-sp/e.speed);}
  if(o==='density'){let n=0;for(const v of W.vehs)if(v.edge===e.id)n++;return heatCol(n/(e.len/9*edgeLanes(e)));}
  if(o==='queue'){let n=0;for(const v of W.vehs)if(v.edge===e.id&&v.v<0.6)n++;return heatCol(n/10);}
  if(o==='travel'){const t=(e.emaT||e.len/e.speed)/(e.len/e.speed);return heatCol((t-1)/2);}
  if(o==='route')return heatCol(e.load/8);
  if(o==='coverage'){let cov=0;for(const s of W.stops.values())if(s.edge===e.id)cov=1;
    if(cov)return'rgba(76,194,255,.75)';for(const s of W.stops.values()){const p=stopPos(s);
      if(p&&ptSeg(p,e.pts[0],e.pts[e.pts.length-1]).d<200)return'rgba(76,194,255,.35)';}
    return'rgba(70,80,100,.5)';}
  if(o==='emis'){let q=0;for(const v of W.vehs)if(v.edge===e.id)q+=v.v<0.6?1:0.3;return heatCol(q/8);}
  if(o==='valid'){const c=componentOf(e);return c===0?'#46d19a':c===1?'#ffb454':'#ff5d6c';}
  return null;
}
let compCache={stamp:-1,map:new Map()};
function componentOf(e){ // weak connectivity components
  if(compCache.stamp!==routeCache.stamp){
    compCache.stamp=routeCache.stamp;compCache.map=new Map();
    const adj=new Map();
    for(const ed of W.edges.values()){if(ed.closed)continue;
      if(!adj.has(ed.a))adj.set(ed.a,new Set());if(!adj.has(ed.b))adj.set(ed.b,new Set());
      if(dirLanes(ed,'f')>0)adj.get(ed.a).add(ed.b);if(dirLanes(ed,'b')>0)adj.get(ed.b).add(ed.a);}
    let ci=0;const nc=new Map();
    for(const n of W.nodes.keys()){if(nc.has(n))continue;
      const q=[n];nc.set(n,ci);while(q.length){const c=q.pop();
        for(const m of adj.get(c)||[])if(!nc.has(m)){nc.set(m,ci);q.push(m);}}
      ci++;}
    for(const ed of W.edges.values()){const a=nc.get(ed.a),b=nc.get(ed.b);
      compCache.map.set(ed.id,(a===b)?(a===0?0:1):2);}
  }
  return compCache.map.get(e.id);
}
function draw(){
  const cw=cv.width/DPR,ch=cv.height/DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // background
  const g=ctx.createLinearGradient(0,0,0,ch);g.addColorStop(0,'#0b1017');g.addColorStop(1,'#0a0d13');
  ctx.fillStyle=g;ctx.fillRect(0,0,cw,ch);
  // night tint
  const h=(W.simTime/3600)%24;const night=P.dayNight?Math.max(0,Math.sin((h-18)/24*Math.PI*2)*0.5+ (h<6||h>19?0.28:0)):0;
  ctx.save();
  ctx.translate(cw/2,ch/2);ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);
  // world bounds
  ctx.strokeStyle='rgba(90,110,150,.12)';ctx.lineWidth=2/cam.z;
  ctx.strokeRect(0,0,P.mapW,P.mapH);
  drawZones();
  drawOD();
  drawEdges();
  if(S.overlay==='turn')drawTurnOverlay();
  drawStops();
  drawRoutes();
  drawSignals();
  drawVehicles();
  drawIncidents();
  drawSelection();
  drawPreview();
  ctx.restore();
  if(night>0){ctx.fillStyle=`rgba(8,10,30,${night*0.55})`;ctx.fillRect(0,0,cw,ch);}
  drawMinimap(cw,ch);
}
function drawZones(){
  for(const z of W.zones.values()){
    const Z=ZTYPES[z.type]||ZTYPES.res;
    ctx.fillStyle=Z.fill;ctx.fillRect(z.x,z.y,z.w,z.h);
    ctx.strokeStyle=Z.c+'55';ctx.lineWidth=1.2/cam.z;ctx.strokeRect(z.x,z.y,z.w,z.h);
    // procedural buildings
    if(cam.z>0.34){ctx.fillStyle=Z.c+'30';
      const n=Math.floor(z.w*z.h/9000);
      for(let i=0;i<Math.min(n,40);i++){
        const r=mulberry32(hash(z.id)*7+i);
        const bw=14+r()*22,bh=12+r()*20;
        const bx=z.x+8+r()*Math.max(1,z.w-bw-16),by=z.y+8+r()*Math.max(1,z.h-bh-16);
        ctx.fillRect(bx,by,bw,bh);}
    }
    if(cam.z>0.3){ctx.fillStyle=Z.c;ctx.font=`${12/cam.z}px sans-serif`;
      ctx.globalAlpha=0.85;ctx.fillText(Z.label+' '+(z.name||''),z.x+8,z.y+14/cam.z);ctx.globalAlpha=1;}
  }
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}
function drawOD(){
  if(S.overlay!=='od')return;
  ctx.lineWidth=1.5/cam.z;
  const zl=[...W.zones.values()];
  for(let i=0;i<zl.length;i++)for(let j=i+1;j<zl.length;j++){
    const a=zl[i],b=zl[j];
    const w=((ZTYPES[a.type]?.gen||0)*(ZTYPES[b.type]?.att||0)+(ZTYPES[b.type]?.gen||0)*(ZTYPES[a.type]?.att||0));
    if(w<0.5)continue;
    ctx.strokeStyle=`rgba(255,209,102,${clamp(w/6,0.05,0.8)})`;
    ctx.beginPath();ctx.moveTo(a.x+a.w/2,a.y+a.h/2);ctx.lineTo(b.x+b.w/2,b.y+b.h/2);ctx.stroke();
  }
}
function drawEdges(){
  const LW=3.2;
  for(const e of W.edges.values()){
    const w=edgeLanes(e)*LW+2.4;
    const ov=overlayColor(e);
    // casing
    ctx.strokeStyle=e.closed?'#33262a':'#1a1f2a';ctx.lineWidth=w+2.6;ctx.lineCap='round';
    pathEdge(e);ctx.stroke();
    // asphalt or overlay
    ctx.strokeStyle=ov||(e.closed?'#3d2c30':'#272d3a');ctx.lineWidth=w;
    pathEdge(e);ctx.stroke();
    if(e.closed){ctx.strokeStyle='#ff5d6c';ctx.lineWidth=1.4/cam.z;
      ctx.setLineDash([6,6]);pathEdge(e);ctx.stroke();ctx.setLineDash([]);}
    else{
      // center line
      ctx.strokeStyle=e.oneway?'rgba(255,255,255,.25)':'rgba(255,209,102,.5)';
      ctx.lineWidth=0.7;ctx.setLineDash([]);pathEdge(e);ctx.stroke();
      // lane dashes
      if(cam.z>0.5){ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=0.5;
        ctx.setLineDash([4,5]);
        const nL=e.oneway?(e.oneway==='f'?e.lanesF:e.lanesB):e.lanesF+e.lanesB;
        for(let l=1;l<nL;l++){pathEdgeOff(e,(l-nL/2)*LW);ctx.stroke();}
        ctx.setLineDash([]);}
      // one-way arrows
      if(e.oneway&&cam.z>0.35){const mid=edgePoint(e,e.oneway,e.len/2,0);
        drawArrow(mid.x,mid.y,Math.atan2(mid.dy,mid.dx),'#8fd3ff');}
    }
    // road name
    if(e.name&&cam.z>0.6){const mid=edgePoint(e,'f',e.len/2,0);
      ctx.fillStyle='rgba(200,215,240,.6)';ctx.font='11px sans-serif';ctx.textAlign='center';
      ctx.fillText(e.name,mid.x,mid.y-edgeLanes(e)*LW/2-6);ctx.textAlign='left';}
  }
}
function pathEdge(e){ctx.beginPath();ctx.moveTo(e.pts[0].x,e.pts[0].y);
  for(let i=1;i<e.pts.length;i++)ctx.lineTo(e.pts[i].x,e.pts[i].y);}
function pathEdgeOff(e,off){ // offset polyline for lane marking
  ctx.beginPath();
  for(let i=0;i<e.pts.length-1;i++){const p0=e.pts[i],p1=e.pts[i+1];
    const l=dist(p0.x,p0.y,p1.x,p1.y)||1,dx=(p1.x-p0.x)/l,dy=(p1.y-p0.y)/l;
    const ox=-dy*off,oy=dx*off;
    if(i===0)ctx.moveTo(p0.x+ox,p0.y+oy);else ctx.lineTo(p0.x+ox,p0.y+oy);
    if(i===e.pts.length-2)ctx.lineTo(p1.x+ox,p1.y+oy);}
}
function drawArrow(x,y,ang,c){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(6,0);ctx.lineTo(-4,-4);ctx.lineTo(-4,4);ctx.closePath();ctx.fill();ctx.restore();
}
function drawTurnOverlay(){
  // count planned movements per node
  const cnt=new Map();
  for(const v of W.vehs){
    if(!v.path||v.pi>=v.path.length-1)continue;
    const e=W.edges.get(v.edge);if(!e)continue;
    const nid2=v.dir==='f'?e.b:e.a;
    const m=movementAt(W.nodes.get(nid2),v.edge,v.path[v.pi+1].e);
    if(m)cnt.set(nid2+'|'+m.key,(cnt.get(nid2+'|'+m.key)||0)+1);
  }
  const kc={L:'#ff5d6c',T:'#46d19a',R:'#4cc2ff'};
  for(const n of W.nodes.values()){
    if(!n._info)continue;
    for(const m of n._info.moves){
      const c=cnt.get(n.id+'|'+m.key)||0;
      if(c<1)continue;
      ctx.strokeStyle=kc[m.kind];ctx.lineWidth=Math.min(6,1+c*0.8);ctx.globalAlpha=0.75;
      ctx.beginPath();ctx.moveTo(m.pts[0].x,m.pts[0].y);
      for(let i=1;i<m.pts.length;i++)ctx.lineTo(m.pts[i].x,m.pts[i].y);
      ctx.stroke();ctx.globalAlpha=1;
    }
  }
}
function drawSignals(){
  for(const n of W.nodes.values()){
    if(n.edges.length<2)continue;
    if(S.overlay==='signal'&&n.signal){const ph=n.signal.phases[n.signal.idx];
      ctx.fillStyle='rgba(76,194,255,.12)';ctx.beginPath();ctx.arc(n.x,n.y,26,0,7);ctx.fill();
    }
    if(n.roundabout){ctx.strokeStyle='#39435a';ctx.lineWidth=10;
      ctx.beginPath();ctx.arc(n.x,n.y,11,0,7);ctx.stroke();
      ctx.fillStyle='#1c2536';ctx.beginPath();ctx.arc(n.x,n.y,5,0,7);ctx.fill();continue;}
    if(n.signal){ // signal heads on each approach
      for(const eid of n.edges){const e=W.edges.get(eid);if(!e)continue;
        const dIn=e.a===n.id?'f':'b';if(dirLanes(e,dIn)<=0)continue;
        const o=e.a===n.id?e._b:e._a;
        const ang=Math.atan2(n.y-o.y,n.x-o.x);
        const hx=n.x-Math.cos(ang)*9,hy=n.y-Math.sin(ang)*9;
        const st=signalState(n,eid);
        ctx.fillStyle=st==='g'?'#2ee08a':st==='y'?'#ffb454':'#ff5d6c';
        ctx.beginPath();ctx.arc(hx,hy,Math.max(2.6,2.2/cam.z),0,7);ctx.fill();
        ctx.strokeStyle='#0009';ctx.lineWidth=0.8;ctx.stroke();
      }
    }else{ctx.fillStyle='rgba(120,140,180,.25)';
      ctx.beginPath();ctx.arc(n.x,n.y,2.2,0,7);ctx.fill();}
  }
}
function drawStops(){

function drawRoutes(){
  for(const r of W.routes.values()){
    const sel=S.sel&&S.sel.kind==='route'&&S.sel.id===r.id;
    const editing=S.editRouteId===r.id;

function drawVehicles(){

      const t=clamp(v.jt/Math.max(v.mv.len,1),0,1);const pts=v.mv.pts;

    if(v.bus){ctx.fillStyle='#2b2b10';for(let i=0;i<5;i++)ctx.fillRect(-T.len/2+1.6+i*2,-T.w/2+0.4,1.2,T.w-0.8);}
    if(hl){ctx.fillStyle='rgba(255,240,180,.9)';ctx.fillRect(T.len/2-0.4,-T.w/2+0.2,0.5,0.5);ctx.fillRect(T.len/2-0.4,T.w/2-0.7,0.5,0.5);
      ctx.fillStyle='rgba(255,230,150,.08)';ctx.beginPath();ctx.moveTo(T.len/2,0);ctx.lineTo(T.len/2+9,-4);ctx.lineTo(T.len/2+9,4);ctx.fill();}

      for(let i=v.pi+1;i<v.path.length;i++){const pe=W.edges.get(v.path[i].e);if(!pe)continue;
        const mp=edgePoint(pe,'f',pe.len/2,0);ctx.lineTo(mp.x,mp.y);}
      ctx.stroke();ctx.setLineDash([]);}
  }
}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawIncidents(){
  for(const ic of W.incidents){
    const e=W.edges.get(ic.edge);if(!e)continue;
    const p=edgePoint(e,ic.dir,ic.s,ic.lane);
    ctx.save();ctx.translate(p.x,p.y);
    const ik=Math.max(1,10/(7*cam.z));ctx.scale(ik,ik);
    ctx.fillStyle=ic.kind==='roadwork'?'#ff9d3d':'#ff5d6c';
    ctx.beginPath();ctx.moveTo(0,-6);ctx.lineTo(6,5);ctx.lineTo(-6,5);ctx.closePath();ctx.fill();
    ctx.fillStyle='#0d1117';ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.fillText('!',0,3.5);
    ctx.restore();
    if(ic.kind==='roadwork'){ctx.strokeStyle='rgba(255,157,61,.5)';ctx.setLineDash([4,4]);
      ctx.lineWidth=6;ctx.beginPath();ctx.arc(p.x,p.y,16,0,7);ctx.stroke();ctx.setLineDash([]);}
  }
}
function drawSelection(){
  if(!S.sel)return;
  ctx.strokeStyle='#fff';ctx.lineWidth=1.6/cam.z;ctx.setLineDash([6,4]);
  const k=S.sel.kind,id=S.sel.id;
  if(k==='node'){const n=W.nodes.get(id);if(n){ctx.beginPath();ctx.arc(n.x,n.y,16,0,7);ctx.stroke();}}
  else if(k==='edge'){const e=W.edges.get(id);if(e){pathEdge(e);ctx.lineWidth=edgeLanes(e)*3.2+5;ctx.stroke();}}
  else if(k==='zone'){const z=W.zones.get(id);if(z)ctx.strokeRect(z.x-3,z.y-3,z.w+6,z.h+6);}
  else if(k==='stop'){const s=W.stops.get(id);const p=s&&stopPos(s);if(p){ctx.beginPath();ctx.arc(p.x,p.y,9,0,7);ctx.stroke();}}
  else if(k==='veh'){}
  ctx.setLineDash([]);
}
function drawPreview(){
  const d=S.draw;if(!d)return;
  if(d.kind==='road'&&d.pts.length){
    ctx.strokeStyle='rgba(76,194,255,.8)';ctx.lineWidth=edgeLanesPreview()*3.2+2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(d.pts[0].x,d.pts[0].y);
    for(const p of d.pts.slice(1))ctx.lineTo(p.x,p.y);
    if(d.hover)ctx.lineTo(d.hover.x,d.hover.y);
    ctx.stroke();
    if(d.hover){const sn=snapPoint(d.hover.x,d.hover.y);
      ctx.fillStyle=sn?'#46d19a':'#4cc2ff';ctx.beginPath();
      ctx.arc(d.hover.x,d.hover.y,4,0,7);ctx.fill();}
  }
  if(d.kind==='zone'&&d.p0&&d.hover){
    ctx.strokeStyle='#46d19a';ctx.setLineDash([5,4]);ctx.lineWidth=1.5;
    ctx.strokeRect(Math.min(d.p0.x,d.hover.x),Math.min(d.p0.y,d.hover.y),
      Math.abs(d.hover.x-d.p0.x),Math.abs(d.hover.y-d.p0.y));ctx.setLineDash([]);
  }
}
function edgeLanesPreview(){return(S.toolOpt&&S.toolOpt.lanes||1);}
function drawMinimap(cw,ch){
  if(cw<700)return;
  const mw=150,mh=mw*P.mapH/P.mapW,x0=cw-mw-12,y0=ch-mh-12;
  ctx.fillStyle='rgba(13,17,23,.75)';ctx.fillRect(x0-4,y0-4,mw+8,mh+8);
  ctx.strokeStyle='var(--line)';ctx.strokeStyle='#26334d';ctx.strokeRect(x0-4,y0-4,mw+8,mh+8);
  const sx=mw/P.mapW,sy=mh/P.mapH;
  ctx.strokeStyle='#3d4d70';ctx.lineWidth=1;
  for(const e of W.edges.values()){ctx.beginPath();
    ctx.moveTo(x0+e.pts[0].x*sx,y0+e.pts[0].y*sy);
    for(let i=1;i<e.pts.length;i++)ctx.lineTo(x0+e.pts[i].x*sx,y0+e.pts[i].y*sy);ctx.stroke();}
  // viewport rect
  const tl=s2w(0,0),br=s2w(cw,ch);
  ctx.strokeStyle='#4cc2ff';ctx.strokeRect(x0+tl.x*sx,y0+tl.y*sy,(br.x-tl.x)*sx,(br.y-tl.y)*sy);
}

/* ===================== EDITOR / INPUT ===================== */
const TOOLS=[
  ['select','⭢ Select'],['pan','✋ Pan'],['road','🛣 Road'],['zone','▦ Zone'],
  ['stop','🚏 Bus stop'],['route','🚌 Route'],['signal','🚦 Signal'],['circle','⭕ Roundabout'],
  ['incident','⚠ Incident'],['erase','✖ Eraser']];
S.toolOpt={lanes:1,speed:13.9,oneway:false,zoneType:'res'};
const ptr={down:false,moved:false,x:0,y:0,wx:0,wy:0,button:0,panning:false,pinch:0,pts:{}};
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  const w=s2w(e.offsetX,e.offsetY);
  ptr.down=true;ptr.moved=false;ptr.x=e.offsetX;ptr.y=e.offsetY;ptr.wx=w.x;ptr.wy=w.y;ptr.button=e.button;
  ptr.pts[e.pointerId]={x:e.offsetX,y:e.offsetY};
  if(e.button===1||S.tool==='pan'||(e.button===0&&e.shiftKey)){ptr.panning=true;return;}
  if(Object.keys(ptr.pts).length===2){ptr.pinch=dist(ptr.pts[Object.keys(ptr.pts)[0]].x,ptr.pts[Object.keys(ptr.pts)[0]].y,ptr.pts[Object.keys(ptr.pts)[1]].x,ptr.pts[Object.keys(ptr.pts)[1]].y);return;}
  toolDown(w,e);
});
cv.addEventListener('pointermove',e=>{
  const w=s2w(e.offsetX,e.offsetY);
  if(ptr.pts[e.pointerId])ptr.pts[e.pointerId]={x:e.offsetX,y:e.offsetY};
  const keys=Object.keys(ptr.pts);
  if(keys.length===2&&ptr.pinch){ // pinch zoom
    const a=ptr.pts[keys[0]],b=ptr.pts[keys[1]];
    const d=dist(a.x,a.y,b.x,b.y);
    if(ptr.pinch>0){const z=clamp(cam.z*d/ptr.pinch,0.08,6);
      const mid=s2w((a.x+b.x)/2,(a.y+b.y)/2);
      cam.z=z;cam.x=mid.x;cam.y=mid.y;}
    ptr.pinch=d;return;
  }
  if(ptr.panning&&ptr.down){
    cam.x-=(e.offsetX-ptr.x)/cam.z;cam.y-=(e.offsetY-ptr.y)/cam.z;
    ptr.x=e.offsetX;ptr.y=e.offsetY;return;
  }
  if(Math.hypot(e.offsetX-ptr.x,e.offsetY-ptr.y)>4)ptr.moved=true;
  toolMove(w,e);
});
cv.addEventListener('pointerup',e=>{
  const w=s2w(e.offsetX,e.offsetY);
  delete ptr.pts[e.pointerId];
  if(ptr.panning){ptr.panning=false;ptr.down=false;return;}
  if(ptr.down&&!ptr.moved&&e.button===0)toolClick(w,e);
  else if(ptr.down)toolUp(w,e);
  ptr.down=false;ptr.pinch=0;
});
cv.addEventListener('pointercancel',e=>{delete ptr.pts[e.pointerId];ptr.down=false;ptr.panning=false;});
cv.addEventListener('dblclick',e=>{ // finish road drawing
  if(S.draw&&S.draw.kind==='road')finishRoad();
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const z=clamp(cam.z*(e.deltaY<0?1.12:0.89),0.08,6);
  const w=s2w(e.offsetX,e.offsetY);
  cam.z=z;
  const w2=s2w(e.offsetX,e.offsetY);
  cam.x+=w.x-w2.x;cam.y+=w.y-w2.y;
},{passive:false});
cv.addEventListener('contextmenu',e=>{e.preventDefault();
  if(S.draw&&S.draw.kind==='road'&&S.draw.pts.length>1)finishRoad();
  else{S.draw=null;S.editRouteId=null;renderPanel();}
});
function toolDown(w,e){
  if(S.tool==='zone'){S.draw={kind:'zone',p0:w};}
}
function toolMove(w,e){
  if(S.draw){S.draw.hover=w;
    if(S.tool==='zone')return;}
  if(S.tool==='road'&&(!S.draw||S.draw.kind!=='road'))S.draw={kind:'road',pts:[],hover:w};
  if(S.draw)S.draw.hover=w;
}
function toolClick(w,e){
  switch(S.tool){
    case 'select':pickAt(w);break;
    case 'road':roadClick(w);break;
    case 'stop':placeStop(w);break;
    case 'route':routeClick(w);break;
    case 'signal':toggleSignal(w);break;
    case 'circle':toggleRoundabout(w);break;
    case 'incident':placeIncident(w);break;
    case 'erase':eraseAt(w);break;
  }
}
function toolUp(w,e){
  if(S.tool==='zone'&&S.draw&&S.draw.kind==='zone'){
    const p0=S.draw.p0;
    const z={id:zid(),type:S.toolOpt.zoneType,
      x:Math.min(p0.x,w.x),y:Math.min(p0.y,w.y),
      w:Math.abs(w.x-p0.x),h:Math.abs(w.y-p0.y),boost:1};
    if(z.w>20&&z.h>20){pushUndo('add zone');W.zones.set(z.id,z);toast(ZTYPES[z.type].label+' zone added');}
    S.draw=null;
  }
}
function roadClick(w){
  if(!S.draw||S.draw.kind!=='road')S.draw={kind:'road',pts:[]};
  const sn=snapPoint(w.x,w.y);
  const p=sn?{x:sn.x,y:sn.y}:w;
  const d=S.draw;
  if(d.pts.length>1&&dist(p.x,p.y,d.pts[0].x,d.pts[0].y)<SNAP_R){ // close loop
    d.pts.push({x:d.pts[0].x,y:d.pts[0].y});finishRoad();return;}
  if(d.pts.length&&dist(p.x,p.y,d.pts[d.pts.length-1].x,d.pts[d.pts.length-1].y)<2)return; // dup click
  d.pts.push(p);
  if(d.pts.length>=24)finishRoad();
}
function finishRoad(){
  const d=S.draw;S.draw=null;
  if(!d||d.pts.length<2)return;
  const created=addRoad(d.pts,{lanesF:S.toolOpt.lanes,lanesB:S.toolOpt.lanes,
    oneway:S.toolOpt.oneway?'f':null,speed:S.toolOpt.speed});
  toast(created&&created.length?created.length+' road segment(s) added':'Nothing added');
  refreshAll();
}
function pickAt(w){
  // vehicles first (topmost), then stops, nodes, edges, zones
  let best=null,bd=14/cam.z;
  for(const v of W.vehs){const e=W.edges.get(v.edge);if(!e)continue;
    const p=edgePoint(e,v.dir,v.s,v.laneF);const d=dist(w.x,w.y,p.x,p.y);
    if(d<bd){bd=d;best={kind:'veh',id:v.id};}}
  for(const s of W.stops.values()){const p=stopPos(s);if(p&&dist(w.x,w.y,p.x,p.y)<bd+2){best={kind:'stop',id:s.id};bd=dist(w.x,w.y,p.x,p.y);}}
  for(const ic of W.incidents){const e=W.edges.get(ic.edge);if(!e)continue;
    const p=edgePoint(e,ic.dir,ic.s,ic.lane);
    if(dist(w.x,w.y,p.x,p.y)<bd+4){best={kind:'incident',id:ic.id};break;}}
  for(const n of W.nodes.values()){const d=dist(w.x,w.y,n.x,n.y);
    if(d<bd+3){bd=d;best={kind:'node',id:n.id};}}
  if(!best){let bd2=10/cam.z;
    for(const e of W.edges.values()){for(let i=0;i<e.pts.length-1;i++){
      const r=ptSeg(w,e.pts[i],e.pts[i+1]);
      if(r.d<bd2+edgeLanes(e)*1.6){bd2=r.d;best={kind:'edge',id:e.id};}}}}
  if(!best)for(const z of W.zones.values()){
    if(w.x>=z.x&&w.x<=z.x+z.w&&w.y>=z.y&&w.y<=z.y+z.h){best={kind:'zone',id:z.id};}}
  if(!best)for(const r of W.routes.values()){
    for(const sid2 of r.stops){const s=W.stops.get(sid2);const p=s&&stopPos(s);
      if(p&&dist(w.x,w.y,p.x,p.y)<12){best={kind:'route',id:r.id};break;}}}
  S.sel=best;
  if(best&&best.kind==='veh')S.panel='inspect';
  renderPanel();
}
function placeStop(w){
  const b=nearestEdgePoint(w.x,w.y);
  if(!b||b.d>30){toast('Click near a road to place a stop');return;}
  pushUndo('add stop');
  const dir=b.e.oneway||(b.s<b.e.len/2?'f':'f'); // attach to forward dir unless oneway b
  const s={id:sid(),edge:b.e.id,pos:clamp(b.s,3,b.e.len-3),dir:b.e.oneway==='b'?'b':'f',
    name:'Stop '+W.stops.size,routeIds:[]};
  W.stops.set(s.id,s);markDirty();
  if(S.editRouteId){const r=W.routes.get(S.editRouteId);if(r&&!r.stops.includes(s.id)){r.stops.push(s.id);linkRouteStops(r);}}
  toast('Bus stop placed');renderPanel();
}
function routeClick(w){
  if(!S.editRouteId){toast('Pick or create a route in the Transit tab first');return;}
  const r=W.routes.get(S.editRouteId);if(!r)return;
  // click a stop to append/remove
  let hit=null;
  for(const s of W.stops.values()){const p=stopPos(s);if(p&&dist(w.x,w.y,p.x,p.y)<14){hit=s;break;}}
  if(hit){
    pushUndo('edit route');
    const i=r.stops.indexOf(hit.id);
    if(i>=0&&i===r.stops.length-1)r.stops.pop();
    else if(i<0)r.stops.push(hit.id);
    linkRouteStops(r);renderPanel();return;
  }
  const b=nearestEdgePoint(w.x,w.y);
  if(b&&b.d<30){ // create stop and append
    pushUndo('add stop');
    const s={id:sid(),edge:b.e.id,pos:clamp(b.s,3,b.e.len-3),dir:b.e.oneway==='b'?'b':'f',name:'Stop '+W.stops.size,routeIds:[]};
    W.stops.set(s.id,s);r.stops.push(s.id);linkRouteStops(r);markDirty();renderPanel();
  }
}
function toggleSignal(w){
  const n=nearNode(w);if(!n){toast('Click an intersection');return;}
  pushUndo('signal');
  if(n.signal){n.signal=null;n.roundabout=false;toast('Signal removed');}
  else{if(!P.sandbox){if(P.budget<15000){S.undo.pop();toast('Insufficient budget for signal ($15k)');return;}P.budget-=15000;}
    n.roundabout=false;mkSignal(n);toast('Signal added');}
  markDirty();renderPanel();
}
function toggleRoundabout(w){
  const n=nearNode(w);if(!n){toast('Click an intersection');return;}
  pushUndo('roundabout');
  n.roundabout=!n.roundabout;if(n.roundabout)n.signal=null;
  toast(n.roundabout?'Roundabout':'Roundabout removed');markDirty();renderPanel();
}
function nearNode(w){let best=null,bd=18/cam.z;
  for(const n of W.nodes.values()){if(n.edges.length<2)continue;const d=dist(w.x,w.y,n.x,n.y);if(d<bd){bd=d;best=n;}}
  return best;}
function placeIncident(w){
  const b=nearestEdgePoint(w.x,w.y);
  if(!b||b.d>30){toast('Click a road');return;}
  pushUndo('incident');
  const dir=b.e.oneway||'f';
  addIncident(b.e.id,dir,0,clamp(b.s,5,b.e.len-5),S.toolOpt.incKind||'crash',S.toolOpt.incDur||300);
}
function eraseAt(w){
  pushUndo('erase');
  for(const ic of [...W.incidents]){const e=W.edges.get(ic.edge);if(!e)continue;
    const p=edgePoint(e,ic.dir,ic.s,ic.lane);
    if(dist(w.x,w.y,p.x,p.y)<14){W.incidents.splice(W.incidents.indexOf(ic),1);e.cond=1;toast('Incident cleared');return;}}
  for(const s of [...W.stops.values()]){const p=stopPos(s);if(p&&dist(w.x,w.y,p.x,p.y)<12){removeStop(s.id);toast('Stop removed');return;}}
  const n=nearNode(w);if(n){removeNode(n.id);toast('Junction removed');return;}
  let bd=10/cam.z+4,be=null;
  for(const e of W.edges.values()){for(let i=0;i<e.pts.length-1;i++){const r=ptSeg(w,e.pts[i],e.pts[i+1]);
    if(r.d<bd+edgeLanes(e)*1.6){bd=r.d;be=e;}}}
  if(be){removeEdge(be.id);toast('Road removed');return;}
  for(const z of [...W.zones.values()])if(w.x>=z.x&&w.x<=z.x+z.w&&w.y>=z.y&&w.y<=z.y+z.h){
    W.zones.delete(z.id);toast('Zone removed');return;}
  S.undo.pop();toast('Nothing to erase');
}

const TABS=[['inspect','Inspect'],['build','Build'],['transit','Transit'],['demand','Demand'],
  ['signals','Signals'],['analytics','Analytics'],['layers','Overlays'],['scen','Scenarios'],['io','Save/Load']];

function renderTabs(){
  const t=$('#ptabs');t.innerHTML='';

function renderPanel(){buildToolbar();renderTabs();

function el(tag,cls,html){const d=document.createElement(tag);if(cls)d.className=cls;if(html!==undefined)d.innerHTML=html;return d;}
function row(label,val){return el('div','kv',`<span>${label}</span><b>${val}</b>`);}
function slider(label,key,min,max,step,fmt2){
  const r=el('div','row');r.innerHTML=`<label>${label}</label>`;
  const i=document.createElement('input');i.type='range';i.min=min;i.max=max;i.step=step;i.value=P[key];
  const v=el('span','val',fmt2?fmt2(P[key]):P[key]);
  i.oninput=()=>{P[key]=+i.value;v.textContent=fmt2?fmt2(P[key]):i.value;};
  r.appendChild(i);r.appendChild(v);return r;
}
/* ---- Inspect ---- */
function panelInspect(b){
  const sel=S.sel;
  if(!sel){b.appendChild(el('div','hint','Click anything on the map — roads, junctions, vehicles, stops, zones.'));
    b.appendChild(el('div','sec','<h4>Network</h4>'+netSummary()));return;}

    h.appendChild(row('Avg traversal',fmt(e.emaT,1)+' s'));
    h.appendChild(row('Queue',queueOn(e.id)));
    h.appendChild(row('Load (route choice)',fmt(e.load,1)));
    const r1=el('div','row');
    r1.innerHTML='<label>Lanes each dir</label>';

    r1.appendChild(inp);
    const ow=el('div','row');ow.innerHTML='<label>One-way</label>';

    sel2.innerHTML='<option value="">two-way</option><option value="f">a→b</option><option value="b">b→a</option>';
    sel2.value=e.oneway||'';sel2.onchange=()=>{pushUndo('oneway');e.oneway=sel2.value||null;markDirty();renderPanel();};
    ow.appendChild(sel2);

    cb.textContent=e.closed?'Reopen road':'Close road';

    cl.appendChild(cb);
    const sp=el('div','row');sp.innerHTML='<label>Speed km/h</label>';
    const si=document.createElement('input');si.type='number';si.min=10;si.max=130;si.value=Math.round(e.speed*3.6);
    si.onchange=()=>{pushUndo('speed');e.speed=clamp(+si.value,10,130)/3.6;markDirty();};
    sp.appendChild(si);
    const nm=el('div','row');nm.innerHTML='<label>Name</label>';
    const ni=document.createElement('input');ni.type='text';ni.value=e.name||'';ni.style.width='110px';
