    h.append(nm,ow,sp,r1,cl);
    // turn restrictions
    h.appendChild(el('div','hint','Turn restrictions: select the junction node to edit.'));
  }
  else if(sel.kind==='node'){const n=W.nodes.get(sel.id);if(!n){S.sel=null;return;}
    h.innerHTML=`<h4>Junction ${n.id} ${n.signal?'<span class="pill g">signal</span>':''} ${n.roundabout?'<span class="pill y">roundabout</span>':''}</h4>`;
    h.appendChild(row('Legs',n.edges.length));
    h.appendChild(row('Movements',(n._info?.moves||[]).length));
    if(n.signal){const st=n.signal.phases[n.signal.idx];
      h.appendChild(row('Phase',`${n.signal.idx+1}/${n.signal.phases.length} — ${fmt(st.dur-n.signal.t,0)}s left`));}
    const btns=el('div','row');
    const b1=el('button','btn small',n.signal?'Remove signal':'Add signal');
    b1.onclick=()=>{pushUndo('sig');if(n.signal)n.signal=null;else{n.roundabout=false;mkSignal(n);}markDirty();renderPanel();};
    const b2=el('button','btn small',n.roundabout?'Remove roundabout':'Roundabout');
    b2.onclick=()=>{pushUndo('rbt');n.roundabout=!n.roundabout;if(n.roundabout)n.signal=null;markDirty();renderPanel();};
    btns.append(b1,b2);h.appendChild(btns);
    if(n.signal)h.appendChild(el('div','hint','Edit phases in the Signals tab.'));
    // turn restrictions
    const incs=nodeEdges(n).filter(e=>dirLanes(e,e.a===n.id?'f':'b')>0);
    if(incs.length>1){
      h.appendChild(el('div','hint','Banned turns (in → out):'));
      for(const ei of incs){const line=el('div','row');
        line.appendChild(el('span','',(W.edges.get(ei.id).name||ei.id)+' →'));
        for(const eo of nodeEdges(n)){if(eo===ei)continue;
          const dirOut=eo.a===n.id?'f':'b';if(dirLanes(eo,dirOut)<=0)continue;
          const banned=ei.noTurns&&ei.noTurns[eo.id];
          const c=el('span','chip'+(banned?' danger on':''),(eo.name||eo.id));
          c.onclick=()=>{pushUndo('turn');ei.noTurns=ei.noTurns||{};
            if(ei.noTurns[eo.id])delete ei.noTurns[eo.id];else ei.noTurns[eo.id]=1;
            invalidateRoutes();renderPanel();};
          line.appendChild(c);}
        h.appendChild(line);}
    }
  }
  else if(sel.kind==='veh'){const v=W.vehs.find(x=>x.id===sel.id);if(!v){S.sel=null;return;}
    h.innerHTML=`<h4>${v.bus?'🚌':'🚗'} ${VTYPES[v.type].label} ${v.id} <span class="pill ${v.state==='drive'?'g':'y'}">${v.state}</span></h4>`;
    h.appendChild(row('Speed',fmt(v.v*3.6,0)+' km/h'));
    h.appendChild(row('Trip time',fmt(W.simTime-v.t0,0)+' s'));
    h.appendChild(row('Distance',fmt(v.dist,0)+' m'));
    h.appendChild(row('Path',v.path?v.path.length+' edges':'—'));
    h.appendChild(row('On edge',v.edge+' · s='+fmt(v.s,0)));
    if(v.bus){h.appendChild(row('Route',v.route));h.appendChild(row('On board',v.board));
      h.appendChild(row('Next stop',v.nextStop||'—'));}
    h.appendChild(row('O → D',v.o+' → '+v.d));
    const rb=el('button','btn small danger','Remove vehicle');
    rb.onclick=()=>{v.state='failed';S.sel=null;renderPanel();};
    h.appendChild(rb);
  }
  else if(sel.kind==='stop'){const s=W.stops.get(sel.id);if(!s){S.sel=null;return;}
    h.innerHTML=`<h4>🚏 ${s.name||s.id}</h4>`;
    h.appendChild(row('Edge',s.edge+' @ '+fmt(s.pos,0)+'m'));
    h.appendChild(row('Waiting',waitingAt(s.id)));
    h.appendChild(row('Routes',(s.routeIds||[]).map(i=>W.routes.get(i)?.name||i).join(', ')||'none'));
    const db=el('button','btn small danger','Delete stop');db.onclick=()=>{pushUndo('del stop');removeStop(s.id);S.sel=null;renderPanel();};
    h.appendChild(db);
  }
  else if(sel.kind==='route'){const r=W.routes.get(sel.id);if(!r){S.sel=null;return;}
    h.innerHTML=`<h4 style="color:${r.color}">Route ${r.name}</h4>`;
    h.appendChild(row('Stops',r.stops.length));
    h.appendChild(row('Headway',fmt(r.headway||P.busHeadway,0)+' s'));
    h.appendChild(row('Vehicles',r.vehs.length));
    h.appendChild(row('Boardings',r.rid||0));
    const eb=el('button','btn small primary','Edit route (click stops)');
    eb.onclick=()=>{S.editRouteId=r.id;S.tool='route';renderPanel();};
    const db=el('button','btn small danger','Delete route');
    db.onclick=()=>{pushUndo('del route');W.routes.delete(r.id);S.sel=null;renderPanel();};
    h.append(eb,document.createTextNode(' '),db);
  }
  else if(sel.kind==='zone'){const z=W.zones.get(sel.id);if(!z){S.sel=null;return;}
    h.innerHTML=`<h4 style="color:${ZTYPES[z.type].c}">${ZTYPES[z.type].label} zone</h4>`;
    h.appendChild(row('Area',fmt(z.w*z.h/10000,1)+' ha'));
    h.appendChild(row('Anchor edge',z._edge||'—'));
    const ts=el('div','row');ts.innerHTML='<label>Type</label>';
    const tsel=document.createElement('select');
    for(const k in ZTYPES)tsel.innerHTML+=`<option ${k===z.type?'selected':''} value="${k}">${ZTYPES[k].label}</option>`;
    tsel.onchange=()=>{z.type=k;renderPanel();};ts.appendChild(tsel);
    const bs=slider('Demand boost','__zboost',0,4,0.1,x=>fmt(x,1)+'×');
    bs.querySelector('input').value=z.boost||1;
    bs.querySelector('input').oninput=e2=>{z.boost=+e2.target.value;bs.querySelector('.val').textContent=fmt(z.boost,1)+'×';};
    h.append(ts,bs);
    const db=el('button','btn small danger','Delete zone');
    db.onclick=()=>{pushUndo('del zone');W.zones.delete(z.id);S.sel=null;renderPanel();};h.appendChild(db);
  }
  else if(sel.kind==='incident'){const ic=W.incidents.find(i=>i.id===sel.id);
    if(!ic){S.sel=null;return;}
    h.innerHTML='<h4>⚠ '+(ic.kind==='roadwork'?'Roadworks':'Crash')+'</h4>';
    h.appendChild(row('Edge',ic.edge));h.appendChild(row('Clears in',fmt(ic.t-W.simTime,0)+' s'));
    const cb=el('button','btn small','Clear now');cb.onclick=()=>{const e=W.edges.get(ic.edge);if(e)e.cond=1;
      W.incidents.splice(W.incidents.indexOf(ic),1);S.sel=null;renderPanel();};h.appendChild(cb);
  }
  b.appendChild(h);
  b.appendChild(el('div','sec','<h4>Network</h4>'+netSummary()));
}
function netSummary(){
  const kv=(l,v)=>`<div class="kv"><span>${l}</span><b>${v}</b></div>`;
  return kv('Roads',W.edges.size)+kv('Junctions',[...W.nodes.values()].filter(n=>n.edges.length>1).length)
   +kv('Zones',W.zones.size)+kv('Stops',W.stops.size)+kv('Routes',W.routes.size)
   +kv('Vehicles',W.vehs.length)+kv('Waiting pax',W.pax.filter(p=>p.state==='wait').length);
}

function panelSignals(b){
  const s0=el('div','sec','<h4>Policy</h4>');
  const pr=el('div','row');pr.innerHTML='<label>Global policy</label>';
  const psel=document.createElement('select');
  psel.innerHTML='<option value="auto">Adaptive (queue-aware)</option><option value="fixed">Fixed time</option>';
  psel.value=P.signalPolicy;psel.onchange=()=>{P.signalPolicy=psel.value;
    for(const n of W.nodes.values())if(n.signal)n.signal.mode=psel.value;};
  pr.appendChild(psel);s0.appendChild(pr);
  b.appendChild(s0);
  // find signalized nodes
  const sigs=[...W.nodes.values()].filter(n=>n.signal);
  if(!sigs.length){b.appendChild(el('div','hint','No signals yet — use the Signal tool on a junction.'));return;}
  const n=(S.sel&&S.sel.kind==='node'&&W.nodes.get(S.sel.id)?.signal)?W.nodes.get(S.sel.id):sigs[0];
  const picker=el('div','row');picker.innerHTML='<label>Junction</label>';
  const pk=document.createElement('select');
  for(const sn of sigs)pk.innerHTML+=`<option ${sn===n?'selected':''} value="${sn.id}">${sn.id} (${sn.edges.length} legs)</option>`;
  pk.onchange=()=>{S.sel={kind:'node',id:pk.value};renderPanel();};picker.appendChild(pk);
  b.appendChild(picker);
  const sig=n.signal;
  const s1=el('div','sec',`<h4>Phases — junction ${n.id}</h4>`);
  s1.appendChild(row('Current phase',(sig.idx+1)+'/'+sig.phases.length));
  s1.appendChild(row('Cycle',fmt(sig.phases.reduce((a,p)=>a+p.dur,0),0)+' s'));
  const mr=el('div','row');mr.innerHTML='<label>Mode</label>';
  const msel=document.createElement('select');
  msel.innerHTML='<option value="auto">adaptive</option><option value="fixed">fixed</option>';
  msel.value=sig.mode;msel.onchange=()=>sig.mode=msel.value;mr.appendChild(msel);s1.appendChild(mr);
  // phase editor: movements × phases
  const moves=n._info?n._info.moves:[];
  const tbl=document.createElement('table');tbl.className='siggrid';
  let thead='<tr><th>movement</th>';sig.phases.forEach((p,i)=>thead+=`<th>P${i+1}${i===sig.idx?'●':''}<br>${p.dur}s</th>`);thead+='</tr>';
  tbl.innerHTML=thead;
  for(const m of moves){
    const tr=document.createElement('tr');
    tr.innerHTML=`<td class="mv">${shortE(m.inE)}→${shortE(m.outE)} ${m.kind}</td>`;
    sig.phases.forEach((p,pi)=>{
      const td=document.createElement('td');
      const key=m.inE+':'+m.outE;
      const on=p.allow.includes(m.inE+':*')||p.allow.includes(key);
      const c=document.createElement('span');c.className='sigcell'+(on?' on':'');
      c.onclick=()=>{pushUndo('phase');
        const star=m.inE+':*';
        if(p.allow.includes(star)){p.allow=p.allow.filter(a=>a!==star);
          // add individual moves except this one
          for(const mm of movementsInto(n,m.inE))if(mm.key!==m.key)p.allow.push(mm.inE+':'+mm.outE);
        }else if(p.allow.includes(key)){p.allow=p.allow.filter(a=>a!==key);}
        else{
          const siblings=movementsInto(n,m.inE).filter(mm=>mm.key!==m.key);
          if(siblings.every(mm=>p.allow.includes(mm.inE+':'+mm.outE))){
            p.allow=p.allow.filter(a=>!(a.startsWith(m.inE+':')&&a!==star));p.allow.push(star);
          }else p.allow.push(key);
        }
        renderPanel();};
      td.appendChild(c);tr.appendChild(td);});
    tbl.appendChild(tr);
  }
  s1.appendChild(tbl);
  // duration editors
  sig.phases.forEach((p,i)=>{
    const r=el('div','row');r.innerHTML=`<label>P${i+1} duration</label>`;
    const inp=document.createElement('input');inp.type='number';inp.min=4;inp.max=120;inp.value=p.dur;
    inp.onchange=()=>{p.dur=clamp(+inp.value,4,120);sig.cycle=sig.phases.reduce((a,x)=>a+x.dur,0);renderPanel();};
    r.appendChild(inp);s1.appendChild(r);});
  const ab=el('div','row');
  const addp=el('button','btn small','＋ phase');addp.onclick=()=>{pushUndo('phase+');sig.phases.push({dur:15,allow:[]});renderPanel();};
  const delp=el('button','btn small danger','− last');delp.onclick=()=>{if(sig.phases.length>1){pushUndo('phase-');sig.phases.pop();sig.idx%=sig.phases.length;renderPanel();}};
  const au=el('button','btn small','Auto-design');au.onclick=()=>{pushUndo('auto');sig.phases=autoPhases(n);sig.idx=0;sig.t=0;renderPanel();};
  ab.append(addp,delp,au);s1.appendChild(ab);
  // diagnostics
  const dg=signalDiag(n);
  const dd=el('div','sec','<h4>Diagnostics</h4>');
  if(!dg.conflicts.length&&!dg.unreachable.length)dd.appendChild(el('div','hint','✓ no conflicts, all phases reachable'));
  for(const c of dg.conflicts)dd.appendChild(el('div','hint',`⚠ P${c.phase+1}: conflicting greens ${shortE(c.a)} / ${shortE(c.b)}`));
  for(const u of dg.unreachable)dd.appendChild(el('div','hint',`⚠ P${u+1}: serves no movement`));
  s1.appendChild(dd);b.appendChild(s1);
}

function drawCharts(){
  for(const c of $$('canvas.chart')){
    const k=c.dataset.k,data=AN.series[k];
    const dpr=Math.min(devicePixelRatio||1,2);
    c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;
    const g=c.getContext('2d');g.scale(dpr,dpr);
    const w=c.clientWidth,h=c.clientHeight;
    if(!data||data.length<2){g.fillStyle='#333d52';g.font='10px sans-serif';g.fillText('collecting…',8,h/2);continue;}
    const mx=Math.max(...data)*1.15||1;
    g.strokeStyle=c.dataset.col;g.lineWidth=1.4;g.beginPath();
    data.forEach((v,i)=>{const x=i/(data.length-1)*w,y=h-3-(v/mx)*(h-6);
      i?g.lineTo(x,y):g.moveTo(x,y);});
    g.stroke();
    g.fillStyle=c.dataset.col+'22';g.lineTo(w,h);g.lineTo(0,h);g.fill();
  }
}

function clearWorld(){
  W.nodes.clear();W.edges.clear();W.zones.clear();W.stops.clear();W.routes.clear();
  _uid=1;nodeCache.clear();

function G(x,y){return newNode(x,y);} // grid helper
function roadN(a,b,o){const e=newEdge(a.id,b.id,o);return e;}
function gridRoads(x0,y0,nx,ny,dx,dy,o){
  const ns=[];
  for(let j=0;j<=ny;j++){ns.push([]);for(let i=0;i<=nx;i++)ns[j].push(G(x0+i*dx,y0+j*dy));}
  for(let j=0;j<=ny;j++)for(let i=0;i<nx;i++)roadN(ns[j][i],ns[j][i+1],o);
  for(let j=0;j<ny;j++)for(let i=0;i<=nx;i++)roadN(ns[j][i],ns[j+1][i],o);
  return ns;
}
function signalize(ns,cond){for(let j=0;j<ns.length;j++)for(let i=0;i<ns[j].length;i++){
  const n=ns[j][i];if(n.edges.length>=3&&(!cond||cond(i,j)))mkSignal(n);}}
function mkRoute(name,color,coords,opt){
  const stops=[];
  for(const[x,y]of coords){const b=nearestEdgePoint(x,y);if(!b||b.d>140)continue;
    const s={id:sid(),edge:b.e.id,pos:clamp(b.s,3,b.e.len-3),dir:b.e.oneway==='b'?'b':'f',
      name:name+' '+(stops.length+1),routeIds:[]};
    W.stops.set(s.id,s);stops.push(s.id);}
  if(stops.length<2)return null;
  const r={id:rid(),name,color,stops,headway:opt?.headway||P.busHeadway,capacity:opt?.cap||P.busCap,vehs:[],nextSpawn:3,rid:0};
  W.routes.set(r.id,r);linkRouteStops(r);markDirty();return r;
}
function Z(type,x,y,w,h,o){const z={id:zid(),type,x,y,w,h,boost:o?.boost||1,name:o?.name||''};W.zones.set(z.id,z);return z;}

function fitCamera(){
  const wr=$('#mapwrap');
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of W.nodes.values()){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x);y1=Math.max(y1,n.y);}
  if(x0>x1){x0=0;y0=0;x1=P.mapW;y1=P.mapH;}
  const m=140;x0-=m;y0-=m;x1+=m;y1+=m;
  cam.x=(x0+x1)/2;cam.y=(y0+y1)/2;
  cam.z=Math.min(wr.clientWidth/(x1-x0),wr.clientHeight/(y1-y0));
  cam.z=clamp(cam.z,0.42,3);
}

/* ===================== SAVE / LOAD / EXPORT ===================== */
function serialize(){return JSON.stringify({v:1,model:modelSnapshot()},null,0);}
function deserialize(txt){
  const o=JSON.parse(txt);
  if(!o||!o.model||!Array.isArray(o.model.edges)||!Array.isArray(o.model.nodes))
    throw new Error('not a Metroflux city file');
  for(const e of o.model.edges)if(!W||typeof e.a!=='string'){}
  for(const e of o.model.edges){if(!e.id||!e.a||!e.b)throw new Error('edge missing fields');}
  for(const n of o.model.nodes){if(!n.id||!isFinite(n.x)||!isFinite(n.y))throw new Error('node missing fields');}
  return o;
}
function saveFile(){
  const blob=new Blob([serialize()],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='metroflux-city.json';a.click();URL.revokeObjectURL(a.href);
}
function loadFile(file){
  const r=new FileReader();
  r.onload=()=>{try{const o=deserialize(r.result);pushUndo('load');
    modelRestore(o.model);resetSim();rebuildAll();cam.x=P.mapW/2;cam.y=P.mapH/2;
    cam.z=Math.min($('#mapwrap').clientWidth/P.mapW,$('#mapwrap').clientHeight/P.mapH)*0.95;
    toast('City loaded');renderPanel();}
    catch(err){toast('Import failed: '+err.message);}};
  r.readAsText(file);
}

const AU={ctx:null,master:null,eng:null,noise:null};
function audioInit(){
  if(AU.ctx)return;
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=0;AU.master.connect(AU.ctx.destination);
  // traffic bed: filtered noise
  const len=AU.ctx.sampleRate*2,buf=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  AU.noise=AU.ctx.createBufferSource();AU.noise.buffer=buf;AU.noise.loop=true;
  const f=AU.ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=420;f.Q.value=0.6;
  AU.eng=AU.ctx.createGain();AU.eng.gain.value=0;
  AU.noise.connect(f);f.connect(AU.eng);AU.eng.connect(AU.master);AU.noise.start();
}
function audioSet(on){
  S.audioOn=on;$('#btnAudio').textContent=on?'🔊':'🔇';
  if(on){audioInit();if(!AU.ctx)return;AU.ctx.resume();
    AU.master.gain.linearRampToValueAtTime(0.5,AU.ctx.currentTime+0.3);}
  else if(AU.ctx)AU.master.gain.linearRampToValueAtTime(0,AU.ctx.currentTime+0.2);
}
function audioFrame(){
  if(!S.audioOn||!AU.ctx)return;
  const m=metrics();
  const target=clamp(m.active/300,0,1)*0.5+clamp(m.netSpeed/60,0,1)*0.1;
  AU.eng.gain.linearRampToValueAtTime(target*0.14,AU.ctx.currentTime+0.4);
}
function beep(f=660,d=0.06,g=0.1){
  if(!S.audioOn||!AU.ctx)return;
  const o=AU.ctx.createOscillator(),gn=AU.ctx.createGain();
  o.frequency.value=f;o.type='sine';gn.gain.value=g;
  gn.gain.exponentialRampToValueAtTime(0.001,AU.ctx.currentTime+d);
  o.connect(gn);gn.connect(AU.master);o.start();o.stop(AU.ctx.currentTime+d);
}

/* ===================== HUD / LOOP ===================== */
let fpsA=0,fpsC=0,lastF=performance.now(),acc=0,panelTimer=0;
function hud(){
  const m=metrics();
  $('#hud').innerHTML=`<div id="hudTitle">METROFLUX</div>`+
   `<div class="r"><span>fps</span><b>${(window._fps||0)|0}</b></div>`+
   `<div class="r"><span>sim time</span><b>${fmtT2(W.simTime)}</b></div>`+
   `<div class="r"><span>speed</span><b>${S.speed}× ${S.paused?'⏸':''}</b></div>`+
   `<div class="r"><span>vehicles</span><b>${m.active}</b></div>`+
   `<div class="r"><span>trips done</span><b>${m.completed}</b></div>`+
   `<div class="r"><span>failed</span><b>${m.failed+m.unserved}</b></div>`+
   `<div class="r"><span>avg travel</span><b>${fmt(m.avgT,0)}s</b></div>`+
   `<div class="r"><span>net speed</span><b>${fmt(m.netSpeed,0)} km/h</b></div>`+
   `<div class="r"><span>queue</span><b>${m.queue}</b></div>`+
   `<div class="r"><span>ridership</span><b>${m.ridership}</b></div>`+
   `<div class="r"><span>incidents</span><b>${W.incidents.length}</b></div>`+
   `<div class="r"><span>tool</span><b>${S.tool}</b></div>`+
   (S.paused?`<div class="r paused"><span>state</span><b>PAUSED</b></div>`:'');
  $('#stLeft').textContent=`${W.nodes.size} nodes · ${W.edges.size} edges · ${W.zones.size} zones · ${W.stops.size} stops · ${W.routes.size} routes`;
  $('#stRight').textContent=`seed ${W.seed} · ${fmt(cam.z,2)}× · ${S.overlay}`+(P.sandbox?'':` · $${fmt(P.budget,0)}`);
}
function toast(msg,ms=2200){const t=$('#toast');t.textContent=msg;t.style.opacity=1;
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,ms);}
function frame(t){
  requestAnimationFrame(frame);
  const dtms=Math.min(100,t-lastF);lastF=t;
  fpsC++;if(t-fpsA>500){$('#hud');window._fps=fpsC*1000/(t-fpsA);fpsA=t;fpsC=0;}
  // pending scenario effects
  if(W._pendingClose&&W.simTime>W._pendingClose.t){const e=W.edges.get(W._pendingClose.e);
    if(e){e.closed=true;rerouteAffected(e.id);toast('🚧 '+ (e.name||'Bridge')+' CLOSED',3500);beep(220,0.4,0.2);}
    W._pendingClose=null;}
  if(!S.paused||S.stepOnce){
    const steps=S.stepOnce?1:Math.min(MAXSUB,Math.round(dtms/1000*30*S.speed));
    acc+=S.stepOnce?DT:dtms/1000*S.speed;
    let n=0;
    while(acc>=DT&&n<MAXSUB){stepSim(DT);acc-=DT;n++;}
    if(n>=MAXSUB)acc=0;
    S.stepOnce=false;
  }
  draw();hud();
  panelTimer+=dtms;
  if(panelTimer>2000){panelTimer=0;
    if(S.panel==='analytics'){renderPanel();}
    else if(S.sel&&['node','veh','stop','edge','incident'].includes(S.sel.kind)&&S.panel==='inspect')renderPanel();
    audioFrame();}
}
/* keyboard */
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
  const k=e.key;
  if(k===' '){e.preventDefault();togglePause();}
  else if(k==='.'){S.stepOnce=true;S.paused=true;$('#btnPlay').textContent='▶';}
  else if(k==='+'||k==='=')setSpeed(S.speed*2);
  else if(k==='-')setSpeed(S.speed/2);
  else if(k==='Escape'){S.draw=null;S.sel=null;S.editRouteId=null;renderPanel();}
  else if((k==='z'||k==='Z')&&(e.ctrlKey||e.metaKey)){e.preventDefault();e.shiftKey?redo():undo();}
  else if((k==='y'||k==='Y')&&(e.ctrlKey||e.metaKey)){e.preventDefault();redo();}
  else if(k==='v')S.tool='select';else if(k==='h')S.tool='pan';else if(k==='r')S.tool='road';
  buildToolbar();
});
function togglePause(){S.paused=!S.paused;$('#btnPlay').textContent=S.paused?'▶':'⏸';}
const SPEEDS=[0.25,0.5,1,2,4,8,16];
function setSpeed(v){S.speed=clamp(v,0.25,16);
  $('#speedLbl').textContent=(S.speed<1?fmt(S.speed,2):S.speed)+'×';}
$('#btnPlay').onclick=togglePause;
$('#btnStep').onclick=()=>{S.paused=true;$('#btnPlay').textContent='▶';S.stepOnce=true;};
$('#btnReset').onclick=()=>{resetSim();toast('Simulation reset (map kept)');};
$('#btnSlower').onclick=()=>setSpeed(S.speed/2);
$('#btnFaster').onclick=()=>setSpeed(S.speed*2);
$('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;
$('#btnAudio').onclick=()=>audioSet(!S.audioOn);
$('#collapseBtn').onclick=()=>{$('#panel').classList.toggle('hidden');};
// scenario dropdown mirrors the panel list
const scSel=$('#scenSel');
scSel.innerHTML='<option value="">▶ Scenarios…</option>'+Object.keys(SCEN).map(k=>`<option value="${k}">${SCEN[k].name}</option>`).join('');
scSel.onchange=()=>{if(scSel.value)loadScenario(scSel.value);scSel.value='';};
/* autosave */
setInterval(()=>{try{localStorage.setItem('metroflux:autosave',serialize());}catch(e){}},15000);
function refreshAll(){markDirty();}
/* ===================== INIT ===================== */
function init(){
  resize();
  try{const auto=localStorage.getItem('metroflux:autosave');
    if(auto){/* autosave exists but default scenario is friendlier on first paint */}}catch(e){}
  loadScenario('downtown');
  W.seed=(Math.random()*1e9)|0;
  S.speed=1;
  requestAnimationFrame(t=>{lastF=t;frame(t);});
  // audio unlock on first gesture
  const unlock=()=>{if(S.audioOn)audioInit();removeEventListener('pointerdown',unlock);};
  addEventListener('pointerdown',unlock);
}
init();
</script>
