<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MODULA — Modular Synth & Sequencer</title>
<style>
:root{
  --bg:#0a0c11; --pan:#12151d; --pan2:#181d28; --line:#262c3d;
  --txt:#cdd6e6; --dim:#78839b; --bright:#eef4ff;
  --cy:#3ee6ff; --mg:#ff4fd8; --am:#ffb648; --gn:#5dffa2; --rd:#ff5d5d; --vi:#9d7bff;
  --tc0:#3ee6ff; --tc1:#ff4fd8; --tc2:#ffb648; --tc3:#5dffa2;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
body{min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#2c3348;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:1px solid var(--cy);outline-offset:1px}

#app{display:flex;flex-direction:column;min-height:100vh;gap:6px;padding:8px;max-width:1720px;margin:0 auto}

/* ---------- header ---------- */
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 10px;
  background:linear-gradient(180deg,#161a26,#10131c);border:1px solid var(--line);border-radius:10px}
.brand{font-weight:700;letter-spacing:.18em;font-size:15px;color:var(--bright);white-space:nowrap}
.brand b{color:var(--cy)}
.brand small{display:block;font-size:9px;letter-spacing:.3em;color:var(--dim);font-weight:400}
.tgroup{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--pan);
  border:1px solid var(--line);border-radius:8px}
.tgroup .lab{font-size:9px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
.tbtn{background:var(--pan2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;
  min-width:34px;text-align:center;transition:background .12s,border-color .12s}
.tbtn:hover{background:#202634}
.tbtn.on{border-color:var(--cy);color:var(--cy);box-shadow:0 0 8px rgba(62,230,255,.25) inset}
.tbtn.play.on{border-color:var(--gn);color:var(--gn);box-shadow:0 0 10px rgba(93,255,162,.35) inset}
.tbtn.danger:hover{border-color:var(--rd);color:var(--rd)}
input[type=number],input[type=text],select{background:var(--pan2);border:1px solid var(--line);
  border-radius:5px;padding:4px 6px;max-width:100%}
input[type=number]{width:58px}
select{max-width:130px}
input[type=range]{accent-color:var(--cy);height:18px}
.slim{width:74px}
.hspace{flex:1}

/* ---------- status strip ---------- */
#status{display:flex;flex-wrap:wrap;gap:4px 14px;padding:5px 10px;background:var(--pan);
  border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--dim)}
#status b{color:var(--txt);font-weight:600}
#status .warn{color:var(--am)} #status .bad{color:var(--rd)} #status .ok{color:var(--gn)}

/* ---------- main grid ---------- */
main{display:grid;grid-template-columns:264px minmax(0,1fr) 330px;gap:8px;align-items:start}
.panel{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:8px}
.panel h3{margin:0 0 6px;font-size:10px;letter-spacing:.18em;color:var(--dim);
  text-transform:uppercase;font-weight:600}
.panel h3 .r{float:right;letter-spacing:0;text-transform:none}

/* ---------- track cards ---------- */
#tracks{display:flex;flex-direction:column;gap:6px}
.tcard{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--pan2);
  cursor:pointer;position:relative;transition:border-color .12s}
.tcard.sel{border-color:var(--tc,var(--cy));box-shadow:0 0 0 1px var(--tc,var(--cy)) inset}
.tcard .tname{font-weight:700;color:var(--tc,var(--cy));letter-spacing:.1em;font-size:11px}
.tcard .ttype{color:var(--dim);font-size:9px;letter-spacing:.12em}
.trow{display:flex;align-items:center;gap:6px;margin-top:5px}
.msbtn{width:22px;height:20px;border:1px solid var(--line);border-radius:4px;background:var(--pan);
  font-size:10px;padding:0;text-align:center}
.msbtn.m.on{background:var(--am);color:#111;border-color:var(--am)}
.msbtn.s.on{background:var(--cy);color:#111;border-color:var(--cy)}
.meter{flex:1;height:8px;background:#0c0f16;border:1px solid var(--line);border-radius:3px;
  overflow:hidden;position:relative}
.meter i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);
  background:linear-gradient(90deg,var(--gn) 60%,var(--am) 85%,var(--rd));}
.meter.peak i{background:var(--rd)}
.mixrow{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:9px;color:var(--dim)}
.mixrow label{width:26px;letter-spacing:.08em}
.mixrow input[type=range]{flex:1;min-width:0}
.sendrow{display:flex;gap:4px;margin-top:5px}
.sendrow .send{flex:1;display:flex;flex-direction:column;gap:2px;font-size:9px;color:var(--dim)}
.sendrow .send input{width:100%}

/* ---------- editor ---------- */
#editor{min-width:0}
.edhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}
.edhead .big{font-size:13px;font-weight:700;color:var(--tc,var(--cy));letter-spacing:.12em}
.knobzone{display:flex;flex-wrap:wrap;gap:4px 10px;padding:6px;background:var(--pan2);
  border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
.kgroup{display:flex;gap:8px;align-items:flex-start;padding:0 6px;border-right:1px dashed var(--line)}
.kgroup:last-child{border-right:0}
.kglabel{writing-mode:vertical-rl;transform:rotate(180deg);font-size:8px;letter-spacing:.2em;
  color:var(--dim);align-self:center;text-transform:uppercase}
.knobwrap{display:flex;flex-direction:column;align-items:center;gap:2px;width:56px}
.knobwrap .klab{font-size:8.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;text-align:center}
.knobwrap .kval{font-size:9px;color:var(--bright);min-height:12px}
.knob{width:42px;height:42px;border-radius:50%;position:relative;touch-action:none;cursor:ns-resize;
  background:conic-gradient(from 225deg,var(--kc,var(--cy)) calc(var(--p)*270deg),#232a3a 0 270deg,#141821 0);
  box-shadow:0 2px 6px rgba(0,0,0,.5)}
.knob::before{content:"";position:absolute;inset:5px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#262d3f,#12151d);border:1px solid var(--line)}
.knob .needle{position:absolute;inset:0;transform:rotate(calc(-135deg + var(--p)*270deg))}
.knob .needle::after{content:"";position:absolute;left:50%;top:7px;width:2.5px;height:11px;
  margin-left:-1.25px;border-radius:2px;background:var(--kc,var(--cy));
  box-shadow:0 0 5px var(--kc,var(--cy))}
.knob.small{width:34px;height:34px}
.selwrap{display:flex;flex-direction:column;gap:2px;align-items:center;width:70px}
.selwrap .klab{font-size:8.5px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.selwrap select{width:100%;font-size:10px;padding:2px 3px}

/* ---------- sequencer ---------- */
.gridwrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:8px;
  background:#0c0f16;padding:6px;-webkit-overflow-scrolling:touch}
.grid{display:grid;gap:2px;user-select:none}
.proll{display:grid;gap:2px;user-select:none}
.cell{height:15px;min-width:20px;background:#161a26;border:1px solid #20263a;border-radius:3px;
  cursor:pointer;padding:0;touch-action:none}
.cell.inscale{background:#1a2030}
.cell.beat{border-left-color:#39415c}
.cell.on{background:var(--tc,#3ee6ff);border-color:var(--tc,#3ee6ff);
  box-shadow:0 0 6px color-mix(in srgb,var(--tc,#3ee6ff) 55%,transparent)}
.cell.acc{box-shadow:0 0 0 1px var(--bright) inset,0 0 8px var(--tc,#3ee6ff)}
.cell.now{background:#fff!important;border-color:#fff}
.rowlab{height:15px;min-width:20px;font-size:8px;color:var(--dim);display:flex;align-items:center;
  justify-content:flex-end;padding-right:4px;position:sticky;left:0;background:#0c0f16;z-index:2;
  white-space:nowrap}
.rowlab.root{color:var(--bright)}
.drowlab{height:22px;min-width:52px;font-size:9px;color:var(--dim);display:flex;align-items:center;
  padding:0 6px;position:sticky;left:0;background:#0c0f16;z-index:2;cursor:pointer;
  border-right:1px solid var(--line);white-space:nowrap}
.drowlab.sel{color:var(--bright);background:#1a2130}
.dcell{height:22px;min-width:20px;background:#161a26;border:1px solid #20263a;border-radius:3px;
  cursor:pointer;padding:0;touch-action:none}
.dcell.beat{border-left-color:#39415c}
.dcell.on{background:var(--tc,#5dffa2);border-color:var(--tc,#5dffa2)}
.dcell.acc{box-shadow:0 0 0 1px var(--bright) inset}
.dcell.now{background:#fff!important;border-color:#fff}
.vlane{display:grid;gap:2px;margin-top:4px}
.vbar{min-width:20px;height:34px;background:#12151f;border:1px solid #20263a;border-radius:3px;
  position:relative;cursor:ns-resize;touch-action:none}
.vbar i{position:absolute;left:0;right:0;bottom:0;background:var(--tc,#3ee6ff);opacity:.8;
  border-radius:0 0 2px 2px}
.vbar.acc::before{content:"";position:absolute;top:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;
  border-radius:50%;background:var(--bright)}
.vbar.now{border-color:#fff}
.gridhint{font-size:9.5px;color:var(--dim);margin-top:5px}
.gridhint b{color:var(--txt)}

/* ---------- right column ---------- */
#side{display:flex;flex-direction:column;gap:8px}
.viz{display:block;width:100%;background:#0a0d14;border:1px solid var(--line);border-radius:6px}
.fxbank{display:flex;flex-direction:column;gap:6px}
.fxblock{border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--pan2)}
.fxblock .fxhead{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.fxblock .fxname{font-size:10px;letter-spacing:.15em;color:var(--bright);font-weight:600}
.fxblock .fxname.off{color:var(--dim)}
.fxknobs{display:flex;flex-wrap:wrap;gap:4px 8px}
.led{width:9px;height:9px;border-radius:50%;background:#2a3040;display:inline-block}
.led.on{background:var(--gn);box-shadow:0 0 6px var(--gn)}
.led.clip.on{background:var(--rd);box-shadow:0 0 6px var(--rd)}

/* ---------- keyboard ---------- */
#kbdzone{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;padding:8px;
  background:var(--pan);border:1px solid var(--line);border-radius:10px}
#piano{position:relative;height:88px;flex:1;min-width:300px;user-select:none;touch-action:none}
.pkey{position:absolute;top:0;bottom:0;border:1px solid #000;border-radius:0 0 4px 4px;cursor:pointer}
.pkey.w{background:linear-gradient(180deg,#e8ecf4,#c9d1e0);border-color:#39415c}
.pkey.b{background:linear-gradient(180deg,#14161f,#05060a);height:58%;z-index:2;border-color:#000}
.pkey.on{background:var(--cy)!important;box-shadow:0 0 12px var(--cy)}
.pkey .kn{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);font-size:8px;color:#667;
  pointer-events:none}
.pkey.b .kn{color:#556}
.kctl{display:flex;flex-direction:column;gap:4px;justify-content:center}
.kctl .tbtn{font-size:11px}

/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;background:rgba(6,8,12,.92);z-index:50;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:20px}
#overlay h1{font-size:34px;letter-spacing:.3em;color:var(--bright);margin:0;font-weight:700}
#overlay h1 b{color:var(--cy)}
#overlay p{color:var(--dim);max-width:520px;font-size:13px}
#powerBtn{font-size:16px;padding:14px 34px;border-radius:10px;border:1px solid var(--cy);
  background:#0f2230;color:var(--cy);letter-spacing:.15em;box-shadow:0 0 24px rgba(62,230,255,.25)}
#powerBtn:hover{background:#143048;box-shadow:0 0 34px rgba(62,230,255,.45)}
.overlayfoot{font-size:10px;color:#4a5470;letter-spacing:.15em}

/* ---------- misc ---------- */
.btnrow{display:flex;flex-wrap:wrap;gap:5px}
.mini{font-size:10px;padding:3px 7px;background:var(--pan2);border:1px solid var(--line);border-radius:5px}
.mini:hover{border-color:var(--cy);color:var(--cy)}
.mini.warn:hover{border-color:var(--am);color:var(--am)}
.hidden{display:none!important}
.notewin{display:flex;gap:4px;align-items:center;font-size:9px;color:var(--dim)}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:#101828;
  border:1px solid var(--cy);color:var(--txt);padding:8px 16px;border-radius:8px;z-index:60;
  font-size:11px;box-shadow:0 4px 20px rgba(0,0,0,.6)}

@media (max-width:1100px){
  main{grid-template-columns:220px minmax(0,1fr)}
  #side{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start}
}
@media (max-width:760px){
  main{grid-template-columns:1fr}
  #tracks{flex-direction:row;overflow-x:auto}
  .tcard{min-width:210px;flex-shrink:0}
  #side{display:flex;flex-direction:column}
  #piano{min-width:0;height:76px}
  header{gap:5px}
  .brand small{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <div id="status"></div>
  <main>
    <div class="panel" id="trackPanel"><h3>Tracks</h3><div id="tracks"></div></div>
    <div class="panel" id="editor"></div>
    <div id="side"></div>
  </main>
  <div id="kbdzone"></div>
</div>
<div id="overlay">
  <h1>MOD<b>U</b>LA</h1>
  <p>Browser modular workstation — 4 tracks, step sequencer, subtractive + FM synth,
     procedural drums, sends, master FX, offline WAV render.<br>
     Audio starts only after your gesture.</p>
  <button id="powerBtn">▶ &nbsp;POWER ON</button>
  <div class="overlayfoot">WEB AUDIO · NO SAMPLES · NO NETWORK</div>
</div>
<script>
'use strict';
/* ============================== utils ============================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const mtof=m=>440*Math.pow(2,(m-69)/12);
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const m2n=m=>NOTE_NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);
function n2m(s){const m=/^([A-Ga-g])([#b]?)(-?\d)$/.exec(s.trim());if(!m)return 60;
  const base={c:0,d:2,e:4,f:5,g:7,a:9,b:11}[m[1].toLowerCase()];
  const acc=m[2]==='#'?1:m[2]==='b'?-1:0;return base+acc+(parseInt(m[3],10)+1)*12;}
function mulberry32(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;
  return((t^t>>>14)>>>0)/4294967296;}}
function fmtHz(f){return f>=1000?(f/1000).toFixed(f>=10000?0:1)+'k':Math.round(f)+''}
function toast(msg,ms=2200){const t=document.createElement('div');t.className='toast';
  t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}

const SCALES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],
  phrygian:[0,1,3,5,7,8,10],mixolydian:[0,2,4,5,7,9,10],pentMin:[0,3,5,7,10],
  pentMaj:[0,2,4,7,9],harmMin:[0,2,3,5,7,8,11]};
const WAVES=['sine','triangle','sawtooth','square'];
const LFO_TARGETS=['pitch','cutoff','amp','pan'];
const DRUM_ROWS=['kick','snare','clap','hatC','hatO','tom','perc'];
const DRUM_LABEL={kick:'KICK',snare:'SNARE',clap:'CLAP',hatC:'HAT·C',hatO:'HAT·O',tom:'TOM',perc:'PERC'};
const TRACK_COLORS=['#3ee6ff','#ff4fd8','#ffb648','#5dffa2'];

/* ============================== default state ============================== */
function emptySteps(len){return Array.from({length:len},()=>({notes:[],v:.85,a:false,g:.8}));}
function drumSteps(len){return Array.from({length:len},()=>({on:false,v:.9,a:false}));}
function defSynth(o={}){return Object.assign({
  wave:'sawtooth',wave2:'off',detune:12,mix2:.5,fm:0,oct:0,poly:8,glide:0,gate:.75,
  a:.005,d:.15,s:.4,r:.18,ftype:'lowpass',cut:5200,res:2,env:.35,ktrk:.5,
  lfoW:'sine',lfoR:1.2,lfoD:0,lfoT:'cutoff'},o);}
function defDrums(){const r={};for(const k of DRUM_ROWS){
  r[k]={tune:k==='kick'?55:k==='snare'?190:k==='tom'?110:k==='perc'?740:6000,
        decay:k==='hatC'?.05:k==='hatO'?.32:k==='kick'?.34:.18,
        tone:.5,level:.9,pattern:drumSteps(16)};}return r;}
function defTrack(i,name,type,extra={}){return Object.assign({
  id:i,name,type,len:16,vol:.8,pan:0,mute:false,solo:false,sendD:.0,sendR:.15,
  synth:defSynth(),drums:type==='drums'?defDrums():null,
  pattern:emptySteps(16)},extra);}

function freshState(){return{
  version:1,bpm:122,swing:.14,metronome:false,masterVol:.8,
  octave:0,root:9 /*A*/,scale:'minor',seed:20260910,
  selTrack:0,lowNote:36,
  fx:{
    delay:{on:true,sync:'3/16',time:.32,fb:.38,mix:.22,damp:5200},
    reverb:{on:true,decay:2.4,mix:.2,predelay:.012},
    sat:{on:true,drive:.22,mix:1},
    tone:{freq:17500,hp:28},
    comp:{on:true,thr:-14,ratio:5,att:.004,rel:.16}
  },
  tracks:[
    defTrack(0,'BASS','synth',{len:16,vol:.9,sendR:.05,synth:defSynth({
      wave:'sawtooth',oct:-1,poly:1,glide:.04,gate:.8,a:.004,d:.16,s:.3,r:.1,
      cut:850,res:9,env:.62,ktrk:.35,lfoR:.4,lfoD:.12,lfoT:'cutoff'})}),
    defTrack(1,'KEYS','synth',{len:16,vol:.72,sendD:.25,sendR:.3,synth:defSynth({
      wave:'square',detune:9,a:.002,d:.22,s:.12,r:.16,cut:3400,res:3,env:.4,
      gate:.5,lfoR:5,lfoD:.06,lfoT:'pitch'})}),
    defTrack(2,'PAD','synth',{len:32,vol:.62,sendR:.55,sendD:.12,synth:defSynth({
      wave:'sawtooth',wave2:'sawtooth',detune:16,mix2:.5,poly:8,a:.5,d:.6,s:.7,r:1.1,
      cut:2400,res:1.2,env:.22,gate:.95,lfoR:.25,lfoD:.25,lfoT:'cutoff'})}),
    defTrack(3,'DRUMS','drums',{len:16,vol:.95,sendR:.08}),
  ]};}

/* compact pattern builders */
function putNotes(track,map,vel=.85){ /* map: {step:[noteStr|midi,...]} */
  for(const [s,ns] of Object.entries(map)){const st=track.pattern[+s];if(!st)continue;
    st.notes=ns.map(x=>typeof x==='string'?n2m(x):x);st.v=vel;}}
function drumRow(track,row,str,vel=.9){const p=track.drums[row].pattern;
  for(let i=0;i<Math.min(str.length,p.length);i++){const c=str[i];
    if(c==='.'||c===' ')continue;p[i].on=true;p[i].v=c==='o'?.55:vel;p[i].a=(c==='X');}}

/* ============================== song presets ============================== */
function songNeonDrive(){const st=freshState();st.bpm=122;st.root=9;st.scale='minor';
  const[B,K,P,D]=st.tracks;
  putNotes(B,{0:['A1'],2:['A1'],3:['A2'],6:['G1'],8:['A1'],10:['C2'],11:['A1'],14:['E2']});
  B.pattern[0].a=true;B.pattern[8].a=true;
  putNotes(K,{2:['A3','C4','E4'],6:['G3','B3','D4'],10:['A3','C4','E4'],
    14:['F3','A3','C4']},.7);
  K.pattern[2].g=.4;K.pattern[6].g=.4;K.pattern[10].g=.4;K.pattern[14].g=.4;
  putNotes(P,{0:['A2','E3','A3','C4'],8:['F2','C3','F3','A3'],
    16:['C3','G3','C4','E4'],24:['G2','D3','G3','B3']},.6);
  drumRow(D,'kick','x...x...x...x...');
  drumRow(D,'snare','....x.......x...');
  drumRow(D,'clap','............X...',.8);
  drumRow(D,'hatC','..o...o...o..oX.');
  drumRow(D,'hatO','..............x.');
  drumRow(D,'tom','..............X.',.8);
  drumRow(D,'perc','..x.....x.......',.6);
  return st;}

function songDub(){const st=freshState();st.bpm=96;st.swing=.22;st.root=2;st.scale='minor';
  const[B,K,P,D]=st.tracks;
  B.synth=defSynth({wave:'triangle',wave2:'sine',mix2:.7,oct:-1,poly:1,glide:.06,
    a:.006,d:.3,s:.5,r:.2,cut:640,res:4,env:.5,gate:.85});

    else{const stp=tr.pattern[pos];

        stp.notes.forEach(m=>ENG.noteOn(i,m,v,st,stp.g*tr.synth.gate*dur*4));}}
  });
  if(state.metronome&&s%4===0)ENG.click(st,s%16===0);
}

function tick(){
  if(!playing||!ENG)return;
  const t0=performance.now();
  while(nextTime<AC.currentTime+LOOKAHEAD){
    try{scheduleStep(gstep,nextTime);}catch(e){console.warn('sched skip',e);}
    gstep++;nextTime+=stepDur();}
  // safety sweep: drop released voices whose osc end-time already passed
  const ct=AC.currentTime;
  for(const v of ENG.voices)if(v.released&&v.endAt!=null&&v.endAt<ct-.05){
    ENG.voices.delete(v);}
  schedMs=schedMs*.85+(performance.now()-t0)*.15;
}
function startPlay(){if(!ENG||playing)return;playing=true;
  nextTime=AC.currentTime+.06;schedTimer=setInterval(tick,TICK);tick();
  ui.transport();}
function stopPlay(){playing=false;if(schedTimer){clearInterval(schedTimer);schedTimer=null;}
  if(ENG)ENG.allLiveOff(AC.currentTime);ui.transport();}
function restart(){if(!ENG)return;gstep=0;stepRing=[];
  if(playing){nextTime=AC.currentTime+.06;}ui.transport();}
function currentStep(){                    // audible step from audio clock
  if(!ENG||!stepRing.length)return -1;
  const ct=AC.currentTime;let s=stepRing[0].s;
  for(const e of stepRing)if(e.t<=ct)s=e.s;return s;}

const KEYMAP={a:0,w:1,s:2,e:3,d:4,f:5,t:6,g:7,y:8,h:9,u:10,j:11,
  k:12,o:13,l:14,p:15,';':16,"'":17};
const heldKeys=new Set();
function liveOn(midi,vel=.85){if(!ENG)return;const ti=state.selTrack;
  if(state.tracks[ti].type==='drums'){
    ENG.drum(ti,DRUM_ROWS[((midi-60)%7+7)%7],vel,AC.currentTime);return;}
  ENG.noteOn(ti,midi+state.octave*12,vel,AC.currentTime,null,true);}

window.addEventListener('keydown',e=>{
  const tag=e.target.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;
  if(e.code==='Space'){e.preventDefault();if(ENG){playing?stopPlay():startPlay();}return;}
  const k=e.key.toLowerCase();

  if(k==='x'){state.octave=clamp(state.octave+1,-3,3);ui.octave();return;}
  if(!(k in KEYMAP)||e.repeat||heldKeys.has(k))return;
  heldKeys.add(k);
  liveOn(60+KEYMAP[k]);
  markKey(midiToPianoIdx(60+state.octave*12+KEYMAP[k]),true);
});

function lcmArr(ns){const gcd=(a,b)=>b?gcd(b,a%b):a;
  return ns.reduce((a,b)=>a*b/gcd(a,b),1);}
function renderWav(cycles=1){
  const lens=state.tracks.map(t=>t.len);
  const cycleSteps=clamp(lcmArr(lens),1,256);
  const steps=cycleSteps*cycles;
  const sd=stepDur(),total=steps*sd+4;         // tail for FX
  const OC=new OfflineAudioContext(2,Math.ceil(total*44100),44100);
  const save=ENG;                              // engine reads global `state`
  const E=buildEngine(OC);
  let t=.05;
  for(let s=0;s<steps;s++){
    const st=t+(s%2===1?state.swing*sd:0);
    state.tracks.forEach((tr,i)=>{
      if(!trackAudible(tr))return;const pos=s%tr.len;
      if(tr.type==='drums'){for(const row of DRUM_ROWS){const c=tr.drums[row].pattern[pos];
        if(c&&c.on)E.drum(i,row,effVel(c.v,c.a),st);}}
      else{const stp=tr.pattern[pos];
        if(stp&&stp.notes.length){const v=effVel(stp.v,stp.a);
          stp.notes.forEach(m=>E.noteOn(i,m,v,st,stp.g*tr.synth.gate*sd*4));}}
    });
    t+=sd;}
  return E?OC.startRendering().then(encodeWav):Promise.reject();
  function encodeWav(buf){                    // 16-bit PCM stereo
    const n=buf.length,nc=buf.numberOfChannels,sr=buf.sampleRate;
    const out=new DataView(new ArrayBuffer(44+n*nc*2));
    const W=(o,s)=>{for(let i=0;i<s.length;i++)out.setUint8(o+i,s.charCodeAt(i));};
    W(0,'RIFF');out.setUint32(4,36+n*nc*2,true);W(8,'WAVE');W(12,'fmt ');
    out.setUint32(16,16,true);out.setUint16(20,1,true);out.setUint16(22,nc,true);
    out.setUint32(24,sr,true);out.setUint32(28,sr*nc*2,true);
    out.setUint16(32,nc*2,true);out.setUint16(34,16,true);
    W(36,'data');out.setUint32(40,n*nc*2,true);
    const chans=[];for(let c=0;c<nc;c++)chans.push(buf.getChannelData(c));
    let o=44;for(let i=0;i<n;i++)for(let c=0;c<nc;c++){
      const v=clamp(chans[c][i],-1,1);out.setInt16(o,v<0?v*0x8000:v*0x7FFF,true);o+=2;}
    return new Blob([out.buffer],{type:'audio/wav'});}}

    catch(e){}},300);}
function serialize(){return JSON.stringify({app:'modula',v:1,state},null,1);}
function applyLoaded(obj){
  if(!obj||!obj.tracks||!Array.isArray(obj.tracks))throw new Error('not a modula project');
  const fresh=freshState();
  state=Object.assign(fresh,obj);
  for(const k of Object.keys(fresh.fx))
    state.fx[k]=Object.assign(fresh.fx[k],(obj.fx||{})[k]);
  state.tracks=state.tracks.slice(0,4);
  state.tracks.forEach((t,i)=>{const d=defTrack(i,t.name||('T'+(i+1)),t.type);
    const m=state.tracks[i]=Object.assign(d,t);
    if(m.type==='synth'){m.synth=Object.assign(defSynth(),m.synth);
      while(m.pattern.length<m.len)m.pattern.push({notes:[],v:.85,a:false,g:.8});}
    else{if(!m.drums)m.drums=defDrums();const dd=defDrums();for(const r of DRUM_ROWS){
      m.drums[r]=Object.assign(dd[r],m.drums[r]||{});
      while(m.drums[r].pattern.length<m.len)
        m.drums[r].pattern.push({on:false,v:.9,a:false});}}
  });
  state.selTrack=clamp(state.selTrack|0,0,state.tracks.length-1);
  if(ENG){ENG.sync();ENG.rebuildIR();ENG.rebuildSat();}
  persist();ui.all();
}

function knobBox(parent,o){
  const w=el('div','knobwrap');
  const k=el('div','knob'+(o.small?' small':''));
  k.style.setProperty('--kc',o.color||'var(--cy)');
  k.appendChild(el('div','needle'));
  const lab=el('div','klab',o.label),val=el('div','kval','');
  w.append(k,lab,val);parent.appendChild(w);
  const p2v=p=>o.log?o.min*Math.pow(o.max/o.min,p):o.min+p*(o.max-o.min);
  const v2p=v=>o.log?Math.log(v/o.min)/Math.log(o.max/o.min):(v-o.min)/(o.max-o.min);
  function upd(){const p=clamp(v2p(o.get()),0,1);k.style.setProperty('--p',p);
    val.textContent=o.fmt?o.fmt(o.get()):(+o.get()).toFixed(2);}
  function setP(p,fire=true){p=clamp(p,0,1);let v=p2v(p);
    if(o.step)v=Math.round(v/o.step)*o.step;
    o.set(clamp(v,o.min,o.max));upd();if(fire){touch();if(o.after)o.after();}}
  let drag=null;
  k.addEventListener('pointerdown',e=>{e.preventDefault();try{k.setPointerCapture(e.pointerId)}catch(_){}
    drag={y:e.clientY,p:v2p(o.get())};});
  k.addEventListener('pointermove',e=>{if(!drag)return;
    setP(drag.p+(drag.y-e.clientY)/130);});
  const end=e=>{drag=null;};
  k.addEventListener('pointerup',end);k.addEventListener('pointercancel',end);
  k.addEventListener('wheel',e=>{e.preventDefault();
    setP(v2p(o.get())+(e.deltaY<0?.04:-.04));},{passive:false});
  k.addEventListener('dblclick',()=>{if(o.def!=null){o.set(o.def);upd();touch();
    if(o.after)o.after();}});
  upd();return{upd,el:w};}

function randDrums(tr,rng){
  const euclid=(k,n)=>{const a=new Array(n).fill(0);let b=0;
    for(let i=0;i<n;i++){b+=k;if(b>=n){b-=n;a[i]=1;}}return a;};
  const dens={kick:4,snare:2,clap:1,hatC:8,hatO:3,tom:2,perc:4};
  for(const r of DRUM_ROWS){const p=tr.drums[r].pattern,eu=euclid(dens[r],tr.len);
    for(let i=0;i<tr.len;i++){const c=p[i];
      c.on=!!eu[i]&&(r==='kick'?i%4===0||rng()<.3:true);
      if(r==='snare'||r==='clap')c.on=(i%8===4)||(c.on&&rng()<.4);
      c.v=.5+rng()*.45;c.a=rng()<.15;}}
  tr.drums.kick.pattern[0].on=true;}
function randMelodic(tr,rng){
  const scale=SCALES[state.scale],n=tr.len;
  const euclid=(k,n)=>{const a=new Array(n).fill(0);let b=0;
    for(let i=0;i<n;i++){b+=k;if(b>=n){b-=n;a[i]=1;}}return a;};
  const on=euclid(3+Math.floor(rng()*5),n);
  const lo=tr.synth.oct<0?36:60;
  for(let i=0;i<n;i++){const st=tr.pattern[i];st.notes=[];st.a=rng()<.18;
    st.v=.5+rng()*.45;st.g=.3+rng()*.6;
    if(on[i]){const pick=()=>lo+scale[Math.floor(rng()*scale.length)]+
      12*Math.floor(rng()*2);
      st.notes.push(pick());
      if(tr.synth.poly>1&&rng()<.28){st.notes.push(pick());if(rng()<.4)st.notes.push(pick());}}}
}
function randSynth(s,rng){
  s.wave=WAVES[Math.floor(rng()*4)];s.detune=rng()*30;
  s.fm=rng()<.3?rng()*.9:0;s.a=.001+rng()*.4;s.d=.05+rng()*.6;s.s=rng();
  s.r=.05+rng();s.cut=200+rng()*12000;s.res=.5+rng()*14;s.env=rng()*1.6-.4;
  s.ktrk=rng();s.lfoR=.1+rng()*12;s.lfoD=rng()*.7;
  s.lfoT=LFO_TARGETS[Math.floor(rng()*4)];s.gate=.3+rng()*.7;}

function applyTrackPreset(tr,name){
  const p=TRACK_PRESETS[name];if(!p)return;
  if(tr.type==='synth'&&p.synth){Object.assign(tr.synth,p.synth);
    if(p.sendR!=null)tr.sendR=p.sendR;}
  else if(tr.type==='drums'&&p.type==='drums'){
    Object.assign(tr.drums.kick,{tune:52,decay:.5,tone:.3,level:1});
    Object.assign(tr.drums.snare,{tune:185,decay:.22,tone:.5,level:.85});
    Object.assign(tr.drums.hatC,{tune:6000,decay:.045,level:.8});
    Object.assign(tr.drums.hatO,{tune:6000,decay:.3,level:.8});
    Object.assign(tr.drums.tom,{tune:100,decay:.3,level:.85});
    Object.assign(tr.drums.perc,{tune:810,decay:.25,tone:.4,level:.7});
    tr.name='DRUMS·808';}
  else if(tr.type==='drums'&&p.type==='drums909'){
    Object.assign(tr.drums.kick,{tune:60,decay:.28,tone:.6,level:1});
    Object.assign(tr.drums.snare,{tune:210,decay:.16,tone:.7,level:.9});
    Object.assign(tr.drums.hatC,{tune:8000,decay:.035,level:.85});
    Object.assign(tr.drums.hatO,{tune:8000,decay:.28,level:.85});
    Object.assign(tr.drums.perc,{tune:540,decay:.06,tone:.8,level:.7});
    tr.name='DRUMS·909';}
  touch();ui.tracks();ui.editor();toast('Preset: '+name);}

function buildGrid(ed,tr,ti){
  const wrap=el('div','gridwrap');
  const len=tr.len;
  cellCols=Array.from({length:len},()=>[]);
  vbarEls=[];
  if(tr.type==='synth'){
    // auto-fit window: keep the pattern's lowest note in view
    let mn=127;tr.pattern.forEach(s=>s.notes.forEach(m=>{if(m<mn)mn=m;}));
    if(mn<127&&(mn<state.lowNote||mn>state.lowNote+ROLL_ROWS-1))
      state.lowNote=clamp(mn-2,12,84);
    const lo=state.lowNote,ss=scaleSet();
    const g=el('div','proll');
    g.style.gridTemplateColumns=`44px repeat(${len},minmax(20px,1fr))`;
    // note rows, top = highest
    for(let r=0;r<ROLL_ROWS;r++){
      const midi=lo+ROLL_ROWS-1-r;
      const lab=el('div','rowlab'+(midi%12===0||midi%12===state.root?' root':''),
        (midi%12===state.root||midi%12===0)?m2n(midi):'');
      lab.style.gridRow=r+1;lab.style.gridColumn=1;g.appendChild(lab);
      for(let s=0;s<len;s++){
        const c=el('button','cell');c.style.gridRow=r+1;c.style.gridColumn=s+2;
        if(ss.has(midi%12))c.classList.add('inscale');
        if(s%4===0)c.classList.add('beat');
        c.dataset.s=s;c.dataset.m=midi;
        c.title=m2n(midi)+' · step '+(s+1);
        bindMelCell(c,tr,s,midi);
        g.appendChild(c);cellCols[s].push(c);}}
    wrap.appendChild(g);
    // range shift
    const nw=el('div','notewin');
    const up=el('button','mini','▲ octave');const dn=el('button','mini','▼ octave');
    up.onclick=()=>{state.lowNote=clamp(state.lowNote+12,12,84);touch();ui.editor();};
    dn.onclick=()=>{state.lowNote=clamp(state.lowNote-12,12,84);touch();ui.editor();};
    nw.append(dn,up,el('span',null,m2n(lo)+' – '+m2n(lo+ROLL_ROWS-1)));
    ed.appendChild(wrap);ed.appendChild(nw);
  }else{
    const g=el('div','grid');
    g.style.gridTemplateColumns=`60px repeat(${len},minmax(20px,1fr))`;
    DRUM_ROWS.forEach((row,ri)=>{
      const lab=el('div','drowlab'+(row===drumSel?' sel':''),DRUM_LABEL[row]);
      lab.style.gridRow=ri+1;lab.style.gridColumn=1;
      lab.onclick=()=>{drumSel=row;ui.editor();};
      lab.title='Select for parameter editing';
      g.appendChild(lab);
      for(let s=0;s<len;s++){
        const c=el('button','dcell');c.style.gridRow=ri+1;c.style.gridColumn=s+2;
        if(s%4===0)c.classList.add('beat');
        c.title=DRUM_LABEL[row]+' · step '+(s+1);
        bindDrumCell(c,tr,row,s);
        g.appendChild(c);cellCols[s].push(c);}});
    wrap.appendChild(g);ed.appendChild(wrap);
  }
  // velocity lane
  const lane=el('div','vlane');
  lane.style.gridTemplateColumns=(tr.type==='drums'?'60px':'44px')+
    ` repeat(${len},minmax(20px,1fr))`;
  lane.appendChild(el('div','rowlab','VEL'));
  for(let s=0;s<len;s++){
    const b=el('div','vbar');b.style.gridRow=1;b.style.gridColumn=s+2;
    b.appendChild(el('i'));vbarEls.push(b);
    bindVbar(b,tr,s);lane.appendChild(b);}
  ed.appendChild(lane);
  paintGrid(tr);
  const hint=el('div','gridhint');
  hint.innerHTML='click = toggle note · <b>drag ↕ on cell = velocity</b> · '+
    '<b>shift+click = accent</b> · velocity lane = per-step level'+
    (tr.type==='drums'?' · lane follows selected row':'');
  ed.appendChild(hint);
}

function paintGrid(tr){
  if(tr.type==='synth'){
    for(let s=0;s<tr.len;s++){const st=tr.pattern[s];
      cellCols[s].forEach(c=>{const m=+c.dataset.m;
        c.classList.toggle('on',st.notes.includes(m));});
      const b=vbarEls[s];if(b){b.firstChild.style.height=(st.v*100)+'%';
        b.classList.toggle('acc',st.a);}}}
  else{
    for(let s=0;s<tr.len;s++){
      DRUM_ROWS.forEach((row,ri)=>{const c=cellCols[s][ri];
        const cell=tr.drums[row].pattern[s];
        c.classList.toggle('on',cell.on);c.classList.toggle('acc',cell.a);
        c.style.opacity=cell.on?(.45+.55*cell.v):1;});
      const cell=tr.drums[drumSel].pattern[s];
      const b=vbarEls[s];if(b){b.firstChild.style.height=(cell.v*100)+'%';
        b.classList.toggle('acc',cell.a);}}
  }
}

function bindMelCell(c,tr,s,midi){
  let drag=null;
  c.addEventListener('pointerdown',e=>{e.preventDefault();
    try{c.setPointerCapture(e.pointerId)}catch(_){}
    const st=tr.pattern[s];
    if(e.shiftKey){st.a=!st.a;paintGrid(tr);touch();drag='skip';return;}
    const i=st.notes.indexOf(midi);
    if(i>=0){st.notes.splice(i,1);drag='skip';}
    else{st.notes.push(midi);drag={y:e.clientY,v:st.v};
      if(ENG&&AC)ENG.noteOn(state.selTrack,midi,.7,AC.currentTime,.15);}
    paintGrid(tr);touch();});
  c.addEventListener('pointermove',e=>{if(!drag||drag==='skip')return;
    tr.pattern[s].v=clamp(drag.v+(drag.y-e.clientY)/120,.05,1);paintGrid(tr);});
  const end=()=>{if(drag&&drag!=='skip')touch();drag=null;};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
function bindDrumCell(c,tr,row,s){
  let drag=null;
  c.addEventListener('pointerdown',e=>{e.preventDefault();
    try{c.setPointerCapture(e.pointerId)}catch(_){}
    const cell=tr.drums[row].pattern[s];
    if(e.shiftKey){cell.a=!cell.a;paintGrid(tr);touch();drag='skip';return;}
    cell.on=!cell.on;
    if(cell.on){drag={y:e.clientY,v:cell.v};
      if(ENG&&AC)ENG.drum(state.selTrack,row,cell.v,AC.currentTime);}
    else drag='skip';
    paintGrid(tr);touch();});
  c.addEventListener('pointermove',e=>{if(!drag||drag==='skip')return;
    tr.drums[row].pattern[s].v=clamp(drag.v+(drag.y-e.clientY)/120,.05,1);
    paintGrid(tr);});
  const end=()=>{if(drag&&drag!=='skip')touch();drag=null;};
  c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);
}
function bindVbar(b,tr,s){
  const set=e=>{const r=b.getBoundingClientRect();
    const v=clamp(1-(e.clientY-r.top)/r.height,.05,1);
    if(tr.type==='synth')tr.pattern[s].v=v;
    else tr.drums[drumSel].pattern[s].v=v;
    paintGrid(tr);};
  let on=false;
  b.addEventListener('pointerdown',e=>{e.preventDefault();
    try{b.setPointerCapture(e.pointerId)}catch(_){}on=true;set(e);});
  b.addEventListener('pointermove',e=>{if(on)set(e);});
  const end=()=>{if(on)touch();on=false;};
  b.addEventListener('pointerup',end);b.addEventListener('pointercancel',end);
}

  const dn=el('button','tbtn','−oct');const val=el('span','lab','0');
  val.id='octVal';const up=el('button','tbtn','+oct');
  dn.onclick=()=>{state.octave=clamp(state.octave-1,-3,3);ui.octave();touch();};
  up.onclick=()=>{state.octave=clamp(state.octave+1,-3,3);ui.octave();touch();};
  ctl.append(dn,val,up,el('span','lab','LIVE →'));
  z.appendChild(ctl);
  const piano=el('div');piano.id='piano';
  const W=100/15;let wc=0;
  for(let i=0;i<25;i++){const semi=(60+i)%12;
    const black=[1,3,6,8,10].includes(semi);
    const k=el('div','pkey '+(black?'b':'w'));k.dataset.i=i;
    k.appendChild(el('span','kn',''));
    if(black){k.style.left=(wc*W-W*.3)+'%';k.style.width=(W*.6)+'%';}
    else{k.style.left=(wc*W)+'%';k.style.width=W+'%';wc++;}
    const midi=60+i;
    const down=e=>{e.preventDefault();
      if(ptrNotes.get(e.pointerId))keyUp(e);
      ptrNotes.set(e.pointerId,{midi,el:k});
      liveOn(midi);k.classList.add('on');};
    const keyUp=e=>{const p=ptrNotes.get(e.pointerId);
      if(!p)return;ptrNotes.delete(e.pointerId);
      liveOff(p.midi);p.el.classList.remove('on');};
    k.addEventListener('pointerdown',down);
    k.addEventListener('pointerenter',e=>{if(e.buttons&1)down(e);});
    k.addEventListener('pointerup',keyUp);
    k.addEventListener('pointercancel',keyUp);
    k.addEventListener('pointerleave',e=>{if(ptrNotes.has(e.pointerId))keyUp(e);});
    piano.appendChild(k);}
  piano.addEventListener('contextmenu',e=>e.preventDefault());
  z.appendChild(piano);
  buildPianoLabels();
}

/* ============================== viz + status loop ============================== */
let lastFrame=0,frameEMA=16,statTick=0,clipUntil=0,slowMode=false;
const fdata=new Float32Array(2048),bdata=new Uint8Array(2048),tdata=new Float32Array(256);
function clearNow(){$$('.cell.now,.dcell.now,.vbar.now').forEach(x=>x.classList.remove('now'));}
function peakOf(ana,buf){ana.getFloatTimeDomainData(buf);let p=0;
  for(let i=0;i<buf.length;i+=2){const v=Math.abs(buf[i]);if(v>p)p=v;}return p;}

function loop(ts){
  requestAnimationFrame(loop);
  const dt=ts-(lastFrame||ts);lastFrame=ts;
  frameEMA=frameEMA*.92+clamp(dt,0,100)*.08;slowMode=frameEMA>34;
  // playhead
  const tr=state.tracks[state.selTrack],aud=currentStep();
  if(tr&&aud>=0){const pos=aud%tr.len;
    if(lastAudPos.pos!==pos||lastAudPos.ti!==state.selTrack){clearNow();
      (cellCols[pos]||[]).forEach(c=>c.classList.add('now'));
      if(vbarEls[pos])vbarEls[pos].classList.add('now');
      lastAudPos={ti:state.selTrack,pos};}}
  else if(lastAudPos.pos!=null){clearNow();lastAudPos={};}
  if(!ENG||!AC)return;
  // track meters
  for(let i=0;i<meters.length&&i<ENG.trk.length;i++){const t=ENG.trk[i];
    if(!t||!t.ana)continue;const p=peakOf(t.ana,tdata);
    meters[i].style.transform=`scaleX(${clamp(p,0,1)})`;
    meters[i].parentElement.classList.toggle('peak',p>.95);}
  const mp=peakOf(ENG.g.ana,fdata);
  if(mp>=.98)clipUntil=performance.now()+900;
  drawScope();drawSpec();if(!slowMode||(statTick&1))drawGram();
  if(++statTick%6===0)updateStatus(mp);
}
function drawScope(){if(!cvScope)return;const x=fitCanvas(cvScope);
  const w=cvScope.width,h=cvScope.height;
  x.fillStyle='#0a0d14';x.fillRect(0,0,w,h);
  ENG.g.ana.getFloatTimeDomainData(fdata);
  x.strokeStyle='#3ee6ff';x.lineWidth=1.5*devicePixelRatio;x.beginPath();
  const n=fdata.length,step=4;
  for(let i=0;i<n;i+=step){const px=i/n*w,py=h/2-fdata[i]*h*.46;
    i?x.lineTo(px,py):x.moveTo(px,py);}
  x.stroke();}
function drawSpec(){if(!cvSpec)return;const x=fitCanvas(cvSpec);
  const w=cvSpec.width,h=cvSpec.height;
  x.fillStyle='#0a0d14';x.fillRect(0,0,w,h);
  ENG.g.ana.getByteFrequencyData(bdata);
  const bars=96,bw=w/bars,sr=AC.sampleRate/2;
  for(let i=0;i<bars;i++){// log freq mapping 30Hz..20k
    const f0=30*Math.pow(20000/30,i/bars),f1=30*Math.pow(20000/30,(i+1)/bars);
    const b0=Math.floor(f0/sr*bdata.length),b1=Math.max(b0+1,Math.floor(f1/sr*bdata.length));
    let m=0;for(let b=b0;b<b1&&b<bdata.length;b++)if(bdata[b]>m)m=bdata[b];
    const bh=(m/255)*h*.94;
    x.fillStyle=`hsl(${185+i*1.6},90%,${45+m/9}%)`;
    x.fillRect(i*bw+1,h-bh,bw-1.5,bh);}}
function drawGram(){if(!cvGram)return;const c=cvGram,x=fitCanvas(c);
  const w=c.width,h=c.height;
  ENG.g.ana.getByteFrequencyData(bdata);
  x.drawImage(c,-1,0);
  const sr=AC.sampleRate/2;
  for(let y=0;y<h;y++){const f=40*Math.pow(16000/40,(h-1-y)/h);
    const b=Math.min(bdata.length-1,Math.floor(f/sr*bdata.length));
    const v=bdata[b];
    x.fillStyle=v<8?'#0a0d14':`hsl(${200-v*.5},95%,${v/5.1}%)`;
    x.fillRect(w-1,y,1,1);}}

function updateStatus(mp){
  const s=$('#status');if(!s)return;
  const st=AC.state,playingCls=playing?'ok':'';
  if(playing&&wall0)drift=((AC.currentTime-ctxT0)-(performance.now()-wall0)/1000)*1000;
  const db=mp>0.0001?(20*Math.log10(mp)).toFixed(1):'-∞';
  const clip=performance.now()<clipUntil;
  const aud=currentStep(),tr=state.tracks[state.selTrack];
  s.innerHTML=
    `<span>ctx <b class="${st==='running'?'ok':'warn'}">${st}</b> ${AC.sampleRate/1000}k</span>`+
    `<span>bpm <b>${state.bpm}</b></span>`+
    `<span>step <b>${aud>=0&&tr?aud%tr.len+1:'—'}</b></span>`+
    `<span>look <b>${Math.round(LOOKAHEAD*1000)}ms</b></span>`+
    `<span>voices <b>${ENG?[...ENG.voices].filter(v=>!v.released||v.endAt>AC.currentTime).length:0}</b></span>`+
    `<span>eng <b>${schedMs.toFixed(2)}ms</b>/tick</span>`+
    `<span>out <b>${db}dB</b></span>`+
    `<span class="${clip?'bad':'ok'}">${clip?'⚠ CLIP':'· clean'}</span>`+
    `<span>drift <b>${playing?(drift>=0?'+':'')+drift.toFixed(1):'0'}ms</b></span>`+
    `<span>key <b>${NOTE_NAMES[state.root]} ${state.scale}</b></span>`+
    `<span>${slowMode?'<b class="warn">eco-viz</b>':''}</span>`;}

/* ============================== randomize helpers in state ============================== */
ui.all=()=>{buildHeader();buildTracks();ui.editor();buildSide();buildKeys();
  ui.transport();ui.octave();};

/* ============================== boot ============================== */
(function boot(){
  try{const raw=localStorage.getItem(LS_KEY);
    if(raw){const o=JSON.parse(raw);applyLoaded(o.state||o);}}
  catch(e){/* corrupted or unavailable → factory */}
  ui.all();
  requestAnimationFrame(loop);
  const pb=$('#powerBtn');
  pb.onclick=async()=>{
    try{
      AC=new (window.AudioContext||window.webkitAudioContext)();
      ENG=buildEngine(AC);
      await AC.resume();
      wall0=performance.now();ctxT0=AC.currentTime;
      AC.onstatechange=()=>updateStatus(0);
      $('#overlay').style.display='none';
      startPlay();
      toast('Engine live — keyboard: A–; rows play, Z/X octave, Space transport');
    }catch(e){toast('Audio init failed: '+e.message);}
  };
})();
</script>
