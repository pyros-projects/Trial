<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LogicLab — Digital Logic & Tiny-CPU Laboratory</title>
<style>
:root{
  --bg:#0d1117; --bg2:#11161f; --panel:#161c26; --panel2:#1c2430; --line:#2a3442;
  --txt:#d7e0ea; --txt2:#8b98a8; --acc:#4fc3f7; --acc2:#7c4dff;
  --w0:#5c6b7d; --w1:#39d98a; --wx:#ff5c5c; --wz:#4d7ea8; --wc:#ff9f1c; --wosc:#e040fb;
  --btn:#212b3a; --btnh:#2b3a4f; --danger:#ff5c5c; --ok:#39d98a; --warn:#ffb020;
  --font:ui-monospace,'Cascadia Mono','JetBrains Mono',Menlo,Consolas,monospace;
}
body.light{--bg:#eef1f5;--bg2:#e4e8ee;--panel:#f7f9fb;--panel2:#eceff4;--line:#c9d2dc;
  --txt:#1c2733;--txt2:#5a6b7d;--acc:#0277bd;--acc2:#5e35b1;--btn:#dde4ec;--btnh:#cbd6e2;
  --w0:#7a8a99;--w1:#0b8043;--wx:#d32f2f;--wz:#7aa3c4;--wc:#e65100;--wosc:#8e24aa;}
body.cvd{--w0:#6b7b8c;--w1:#0072b2;--wx:#d55e00;--wz:#56b4e9;--wc:#cc79a7;--wosc:#e69f00;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:13px}
#app{display:flex;flex-direction:column;height:100%}
button,select,input,textarea{font-family:inherit;font-size:12px;background:var(--btn);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:4px 8px;cursor:pointer}
button:hover,select:hover{background:var(--btnh)}
button.on{background:var(--acc);color:#06121a;border-color:var(--acc);font-weight:700}
button.danger{color:var(--danger)}
input[type=text],input[type=number],textarea{cursor:text}
input[type=range]{padding:0}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- toolbar ---------- */
#toolbar{display:flex;align-items:center;gap:4px;padding:5px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:30}
#toolbar .logo{font-weight:800;color:var(--acc);margin-right:8px;letter-spacing:.5px;white-space:nowrap}
#toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#toolbar .grp{display:flex;gap:3px;align-items:center}
#toolbar .lbl{color:var(--txt2);font-size:11px;margin-left:6px}
.tbtn{min-width:30px}
.msel{position:relative}
.menu{position:absolute;top:calc(100% + 4px);left:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:190px;box-shadow:0 8px 30px #000a;z-index:60;display:none}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 9px;border-radius:5px}
.menu button:hover{background:var(--btnh)}
.menu .mh{color:var(--txt2);font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:6px 9px 2px}

/* ---------- main ---------- */
#main{flex:1;display:flex;min-height:0}
#palette{width:172px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0;padding:6px}
#palette .pg{color:var(--txt2);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin:8px 2px 4px}
#palette .pi{display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:6px;cursor:grab;border:1px solid transparent;user-select:none}
#palette .pi:hover{background:var(--btnh);border-color:var(--line)}
#palette .pi .sw{width:16px;height:16px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--acc);flex-shrink:0}
#cwrap{flex:1;position:relative;min-width:0;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#cv.pan{cursor:grab}
#minimap{position:absolute;right:10px;bottom:10px;width:170px;height:110px;border:1px solid var(--line);border-radius:8px;background:var(--panel);opacity:.92;z-index:5;display:none}
#minimap.show{display:block}
#hud{position:absolute;left:8px;top:8px;background:#0009;color:#cfe3ff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;line-height:1.55;pointer-events:none;z-index:6;white-space:pre;font-family:var(--font)}
body.light #hud{background:#ffffffd8;color:#123}
#hud .warn{color:var(--warn)}
#toasts{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--acc);padding:7px 14px;border-radius:7px;box-shadow:0 6px 24px #0008;animation:tin .18s ease-out;max-width:70vw}
.toast.err{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
#ctxmenu{position:absolute;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px;min-width:180px;box-shadow:0 8px 30px #000a;z-index:80;display:none}
#ctxmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;border-radius:5px}
#ctxmenu button:hover{background:var(--btnh)}
#ctxmenu .ch{color:var(--txt2);font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:6px 10px 2px}
#tip{position:absolute;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;color:var(--txt);pointer-events:none;z-index:75;display:none;white-space:pre}

/* ---------- side panel ---------- */
#side{width:264px;background:var(--panel);border-left:1px solid var(--line);flex-shrink:0;display:flex;flex-direction:column;min-height:0}
#side .tabs{display:flex;border-bottom:1px solid var(--line)}
#side .tabs button{flex:1;border:0;border-radius:0;padding:8px 4px;background:transparent;color:var(--txt2);border-bottom:2px solid transparent}
#side .tabs button.on{background:transparent;color:var(--acc);border-bottom-color:var(--acc);font-weight:700}
#sideBody{flex:1;overflow-y:auto;padding:10px}
#sideBody h4{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px}
#sideBody h4:first-child{margin-top:0}
.frow{display:flex;align-items:center;gap:6px;margin:5px 0}
.frow>label{flex:0 0 84px;color:var(--txt2);font-size:11px}
.frow>input,.frow>select{flex:1;min-width:0}
.frow input[type=checkbox]{flex:0}
table.ptab{width:100%;border-collapse:collapse;font-size:11px;margin-top:4px}
table.ptab td,table.ptab th{border:1px solid var(--line);padding:3px 6px;text-align:left}
table.ptab th{color:var(--txt2);font-weight:600;background:var(--panel2)}
.v0{color:var(--w0)}.v1{color:var(--w1);font-weight:700}.vx{color:var(--wx);font-weight:700}.vz{color:var(--wz)}.vosc{color:var(--wosc);font-weight:700}
.chk{display:flex;align-items:center;gap:7px;margin:6px 0;color:var(--txt)}
.chk input{width:14px;height:14px}
.small{font-size:11px;color:var(--txt2)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

/* ---------- analyzer ---------- */
#analyzer{height:200px;background:var(--panel);border-top:1px solid var(--line);display:none;flex-direction:column;flex-shrink:0}
#analyzer.show{display:flex}
#anHead{display:flex;align-items:center;gap:6px;padding:4px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#anHead .t{font-weight:700;color:var(--acc);margin-right:6px}
#anBody{flex:1;display:flex;min-height:0}
#anNames{width:190px;border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0}
#anNames .pr{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line)}
#anNames .pr .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#anNames .pr .val{color:var(--acc);font-weight:700}
#anNames .pr button{padding:1px 6px;font-size:10px}
#waveWrap{flex:1;position:relative;overflow:hidden}
#wave{position:absolute;inset:0;width:100%;height:100%}
#anStatus{padding:2px 10px;font-size:10px;color:var(--txt2);border-top:1px solid var(--line)}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;background:#000a;z-index:100;display:none;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(860px,94vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px #000c}
.modal .mh2{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.modal .mb{padding:14px 16px;overflow-y:auto;flex:1}
.modal .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
table.tt{border-collapse:collapse;font-size:11px}
table.tt td,table.tt th{border:1px solid var(--line);padding:3px 8px;text-align:center}
table.tt th{background:var(--panel2);color:var(--acc)}
table.tt tr.oscrow td{background:#4d1f2f55}
.ttlist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px}
.projrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line)}
.projrow .nm{flex:1}
textarea.jarea{width:100%;height:180px;background:var(--bg2);color:var(--txt);font-size:11px}
kbd{background:var(--btn);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:10px}
#helpBody td{padding:3px 10px 3px 0;color:var(--txt2)}#helpBody td:first-child{color:var(--acc);white-space:nowrap}

/* ---------- narrow ---------- */
@media (max-width:760px){
  #main{flex-direction:column}
  #palette{width:100%;height:118px;display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line);align-items:flex-start}
  #palette .pg{display:none}
  #palette .pi{flex-direction:column;font-size:9px;gap:3px;min-width:52px;text-align:center}
  #side{position:absolute;right:0;top:44px;bottom:0;width:min(300px,86vw);z-index:40;box-shadow:-10px 0 40px #000a;display:none}
  #side.open{display:flex}
  #sideToggle{display:inline-block!important}
  #minimap{width:110px;height:72px}
  #hud{font-size:10px;padding:4px 7px;max-width:70vw;overflow:hidden}
  #analyzer{height:170px}
  #anNames{width:130px}
  #toolbar{font-size:11px}
}
#sideToggle{display:none;position:absolute;right:8px;top:44px;z-index:41}
</style>

<body>
<div id="app">
  <div id="toolbar"></div>
  <div id="main">
    <div id="palette"></div>
    <div id="cwrap">
      <canvas id="cv"></canvas>
      <canvas id="minimap" width="340" height="220"></canvas>
      <div id="hud"></div>
      <button id="sideToggle" title="Inspector">☰</button>
      <div id="ctxmenu"></div>
      <div id="tip"></div>
      <div id="toasts"></div>
    </div>
    <div id="side">
      <div class="tabs">
        <button id="tabInsp" class="on">Inspector</button>
        <button id="tabDiag">Diagnostics</button>
        <button id="tabSet">Settings</button>
      </div>
      <div id="sideBody"></div>
    </div>
  </div>
  <div id="analyzer">
    <div id="anHead"></div>
    <div id="anBody"><div id="anNames"></div><div id="waveWrap"><canvas id="wave"></canvas></div></div>
    <div id="anStatus"></div>
  </div>
</div>
<div id="modalRoot"></div>
<script>
"use strict";
/* ============================== CORE / SIM ============================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let _uid=1; const uid=()=>"c"+(_uid++);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const MASK=w=>w>=32?0xFFFFFFFF:((1<<w)-1);
const maskW=(v,w)=>v&MASK(w);

/* value: {v:int, s:'ok'|'x'|'z'|'osc'} per net (bus-level flag) */
const V=(v,s='ok')=>({v,s});
const VEQ=(a,b)=>a&&b&&a.v===b.v&&a.s===b.s;

const S={
  comps:new Map(), wires:new Map(), probes:[],
  sel:new Set(), clip:null,
  view:{x:60,y:40,z:1.2},
  tool:'select', dragPal:null,
  settings:{clockHz:2, delay:'none', stepLimit:60, defBits:1, grid:10, snap:true,
    wireStyle:'curved', radix:'hex', theme:'dark', anim:true, minimap:true,
    ovOrder:false, ovFanout:false, ovBus:true, ovClock:false, ovLoops:true},
  sim:null, hist:[], histI:-1,
  ttIns:new Set(), ttOuts:new Set(),
};

function newSim(){
  S.sim={t:0,tick:0,half:0,running:false,events:[],dirty:new Set(),
    iters:0,lastIters:0,edges:0,osc:false,conflict:false,
    netVal:new Map(),netPrev:new Map(),pinCache:new Map(),
    evalOrder:[],orderIdx:new Map(),hz:0,_hzC:0,_hzT:0,warn:[]};
}

/* ---------- pins ---------- */
/* def(type).pins(comp) -> [{name,dir,w,ox,oy}]  ox,oy relative to comp.x/y */
function pinsOf(c){const d=CT[c.type];return d.pins?d.pins(c):d._pins;}

function rebuildNets(){
  // union pins over wires
  const parent=new Map();
  const key=(c,p)=>c+"."+p;
  const find=k=>{let r=k;while(parent.get(r)!==r&&parent.has(r))r=parent.get(r);let x=k;while(parent.get(x)!==x&&parent.has(x)){const n=parent.get(x);parent.set(x,r);x=n}return r};
  const union=(a,b)=>{parent.set(find(a),find(b))};
  const allKeys=new Set();
  for(const c of S.comps.values())for(const p of pinsOf(c))allKeys.add(key(c.id,p.name));
  for(const k of allKeys)parent.set(k,k);
  for(const w of S.wires.values()){union(key(w.a.c,w.a.p),key(w.b.c,w.b.p));}
  S.netOf=new Map(); // pinkey -> netKey
  S.netPins=new Map(); // netKey -> [pinkey]
  for(const k of allKeys){const r=find(k);S.netOf.set(k,r);
    if(!S.netPins.has(r))S.netPins.set(r,[]);S.netPins.get(r).push(k);}
  // rebind probes to current net keys (they store comp.pin ref)
  for(const pr of S.probes){pr.net=S.netOf.get(pr.ref);}
}

function pinDir(c,p){for(const q of pinsOf(c))if(q.name===p)return q.dir;return null}
function pinW(c,p){for(const q of pinsOf(c))if(q.name===p)return q.w;return 1}

function netOfPin(c,p){return S.netOf.get(c+"."+p)}
function netVal(nk){return S.sim.netVal.get(nk)||{v:0,s:'z'}}
function pinVal(c,p){return netVal(netOfPin(c,p))}
function setNetVal(nk,val){S.sim.netVal.set(nk,val)}

/* resolve net: gather drivers (out pins), combine */
function resolveNet(nk){
  const pins=S.netPins.get(nk)||[];let drv=[];
  for(const k of pins){const dot=k.lastIndexOf('.');const cid=k.slice(0,dot),pn=k.slice(dot+1);
    const c=S.comps.get(cid);if(!c)continue;
    if(pinDir(c,pn)!=='out')continue;
    drv.push(S.sim.drvVal.get(k)||{v:0,s:'z',w:pinW(c,pn)});}
  if(!drv.length)return{v:0,s:'z'};
  const real=drv.filter(d=>d.s!=='z');
  if(!real.length)return{v:0,s:'z'};
  if(real.length===1){const d=real[0];return{v:d.v,s:d.s==='ok'?'ok':d.s};}
  // multiple real drivers
  const okV=real.filter(d=>d.s==='ok');
  if(okV.length===real.length&&okV.every(d=>d.v===okV[0].v))return{v:okV[0].v,s:'ok'};
  return{v:0,s:'x',conflict:true};
}

/* ---------- eval dispatch ---------- */
/* CT[type].eval(comp, get) -> {pin:val} ; get(name)->pin val obj */
function evalComp(c){
  const d=CT[c.type];
  const ins={};for(const p of pinsOf(c))if(p.dir==='in')ins[p.name]=pinVal(c.id,p.name);
  return d.eval(c,ins);
}

/* ---------- settle ---------- */
function settle(){
  const sim=S.sim;sim.lastIters=0;sim.osc=false;sim.conflict=false;
  const snap=new Map(sim.netVal); // pre-wave values for edge capture
  const edges=[];
  let guard=0;
  while(sim.dirty.size&&guard++<S.settings.stepLimit){
    sim.lastIters++;
    const dcs=[...sim.dirty];sim.dirty.clear();
    const dn=new Set();
    for(const cid of dcs){
      const c=S.comps.get(cid);if(!c)continue;
      if(!sim.orderIdx.has(cid)){sim.orderIdx.set(cid,sim.evalOrder.length);sim.evalOrder.push(cid);}
      const outs=evalComp(c);
      for(const pn in outs){
        const k=cid+"."+pn,nk=S.netOf.get(k);if(nk===undefined)continue;
        const old=sim.drvVal.get(k);
        if(!VEQ(old,outs[pn])){sim.drvVal.set(k,outs[pn]);dn.add(nk);}
      }
    }
    for(const nk of dn){
      const nv=resolveNet(nk);if(nv.conflict)sim.conflict=true;
      const ov=sim.netVal.get(nk);
      if(!VEQ(ov,nv)){
        sim.netVal.set(nk,nv);
        // clock-edge detection: 0/undefined -> ok-1
        const obit=ov&&ov.s==='ok'?ov.v:0, nbit=nv.s==='ok'?nv.v:0;
        if((obit&1)===0&&(nbit&1)===1){
          for(const k of (S.netPins.get(nk)||[])){
            const dot=k.lastIndexOf('.');const c=S.comps.get(k.slice(0,dot));
            if(!c)continue;const pn=k.slice(dot+1);
            if(pinDir(c,pn)==='in'&&CT[c.type].clkPin===pn)edges.push(c);
          }
        }
        for(const k of (S.netPins.get(nk)||[])){
          const dot=k.lastIndexOf('.');const cid=k.slice(0,dot),pn=k.slice(dot+1);
          const c=S.comps.get(cid);if(!c)continue;
          if(pinDir(c,pn)==='in')sim.dirty.add(cid);
        }
      }
    }
    if(S.settings.delay==='unit')probesSample(sim.t+guard*0.01);
  }
  if(sim.dirty.size){
    // non-settling: mark nets of still-dirty comps as osc
    sim.osc=true;
    const oscNets=new Set();
    for(const cid of sim.dirty){const c=S.comps.get(cid);if(!c)continue;
      for(const p of pinsOf(c)){const nk=S.netOf.get(cid+"."+p.name);if(nk)oscNets.add(nk);}}
    for(const nk of oscNets){const v=sim.netVal.get(nk)||{v:0,s:'z'};sim.netVal.set(nk,{v:v.v,s:'osc'});}
    sim.dirty.clear();
  }else{
    // settled: unresolved (x) nets inside combinational feedback are non-settling physically
    const cn=cycleNetSet();let f=false;
    for(const nk of cn){const v=sim.netVal.get(nk);if(v&&v.s==='x'){sim.netVal.set(nk,{v:v.v,s:'osc'});f=true;}}
    if(f)sim.osc=true;
  }
  // apply captured edges (use pre-wave input snapshot semantics: inputs settled before clk moved)
  if(edges.length){
    sim.edges+=edges.length;
    for(const c of edges){const d=CT[c.type];if(d.edge)d.edge(c,snap,sim);}
    // re-settle after state update
    if(sim.dirty.size)settle();
  }
}

function touchComp(c){S.sim.dirty.add(c.id)}
function dirtyAll(){S.sim.dirty.clear();for(const c of S.comps.values())S.sim.dirty.add(c.id)}
function dirtyNetConsumers(nk){for(const k of (S.netPins.get(nk)||[])){const d=k.lastIndexOf('.');const c=S.comps.get(k.slice(0,d));if(c&&pinDir(c,k.slice(d+1))==='in')S.sim.dirty.add(c.id);}}
function drvSet(c,p,v){S.sim.dirty.add(c.id);}

/* ---------- sequential helpers ---------- */
/* nets on combinational feedback cycles */
function cycleNetSet(){
  const adj=new Map();
  for(const w of S.wires.values()){if(!adj.has(w.a.c))adj.set(w.a.c,[]);adj.get(w.a.c).push(w.b.c);}
  const nets=new Set(),state=new Map(),stack=[];
  function dfs(u){state.set(u,1);stack.push(u);
    for(const v of adj.get(u)||[]){
      if(state.get(v)===1){const i=stack.indexOf(v);
        for(let k=i;k<stack.length;k++){const c=S.comps.get(stack[k]);if(!c)continue;
          for(const p of pinsOf(c))if(p.dir==='out'){const nk=S.netOf.get(c.id+'.'+p.name);if(nk!==undefined)nets.add(nk);}}}
      else if(!state.get(v))dfs(v);}
    stack.pop();state.set(u,2);}
  for(const id of S.comps.keys())if(!state.get(id))dfs(id);
  return nets;}

function seqSample(c,snap,names){
  const r={};for(const n of names){const nk=S.netOf.get(c.id+"."+n);
    const v=nk!==undefined?(snap.get(nk)||{v:0,s:'z'}):{v:0,s:'z'};r[n]=v;}return r;}

/* ---------- clock scheduling ---------- */
function scheduleClock(c){
  const half=Math.max(1,c.props.period|0);
  S.sim.events.push({t:S.sim.t+half,c:c.id,kind:'clk'});
  S.sim.events.sort((a,b)=>a.t-b.t);
}
function initClocks(){S.sim.events.length=0;for(const c of S.comps.values())if(c.type==='clock')scheduleClock(c);}

/* ---------- sim ops ---------- */
function simReset(keepState){
  const keep=new Map();
  if(keepState)for(const c of S.comps.values())keep.set(c.id,c.state);
  newSim();S.sim.drvVal=new Map();
  for(const pr of S.probes)pr.samples=[];
  for(const c of S.comps.values()){
    c.state={};
    const d=CT[c.type];if(d.init)d.init(c);
    if(keepState&&keep.has(c.id))c.state=keep.get(c.id);
    for(const p of pinsOf(c))if(p.dir==='out')S.sim.drvVal.set(c.id+"."+p.name,{v:0,s:'z'});
  }
  initClocks();dirtyAll();settle();probesSample();
}
function stepEvent(){
  const sim=S.sim;
  if(sim.events.length&&sim.events[0].t<=sim.t+0){/* fire due event */}
  // fire next scheduled event if any pending within reach
  const ev=sim.events.shift();
  if(ev){
    sim.t=Math.max(sim.t+1,ev.t);
    const c=S.comps.get(ev.c);
    if(c&&ev.kind==='clk'){c.state.out=c.state.out?0:1;drvSet(c,'Q',V(c.state.out));if(c.state.out)sim.tick++;scheduleClock(c);}
  }else{sim.t++;}
  settle();probesSample();
}
function stepHalf(){stepEvent();}
function stepTick(){ // advance until next rising edge of any clock (or one event if none)
  const sim=S.sim, target=sim.tick+1;let guard=1000;
  while(sim.tick<target&&guard--){
    if(!sim.events.length){sim.t++;settle();probesSample();break;}
    stepEvent();
  }
  if(!guard)toast('tick step aborted (no clock?)','err');
}
function runFrame(now){
  const sim=S.sim;if(!sim.running)return;
  if(!sim._last)sim._last=now;
  // speed: clockHz = ticks/sec target → half-events/sec = 2*hz
  const want=S.settings.clockHz;
  const evPerSec=Math.max(0.1,want*2);
  sim._acc=(sim._acc||0)+(now-sim._last)/1000*evPerSec;sim._last=now;
  let n=0,budget=2000;
  while(sim._acc>=1&&n++<budget){sim._acc--;stepEvent();}
  if(n>=budget)sim._acc=0;
  // measured tick freq
  if(now-(sim._ptm||0)>500){
    sim.hz=Math.round((sim.tick-(sim._pt||0))/Math.max(0.001,(now-(sim._ptm||now))/1000)*10)/10;
    sim._pt=sim.tick;sim._ptm=now;}
}

/* ---------- probes ---------- */
function probesSample(t){
  if(t===undefined)t=S.sim.t;
  for(const pr of S.probes){
    const v=pr.ref?netVal(pr.net):{v:0,s:'z'};
    const L=pr.samples;
    if(!L.length||L[L.length-1].t<t||!VEQ(L[L.length-1],v))
      L.push({t,v:v.v,s:v.s});
    else L[L.length-1]={t,v:v.v,s:v.s};
  }
}
/* net may change on rebuild: store ref as comp.pin */
function addProbe(cid,pn,name){
  const ref=cid+"."+pn;const nk=netOfPin(cid,pn);
  S.probes.push({id:uid(),name:name||("P"+(S.probes.length+1)),ref,net:nk,samples:[]});
  probesSample();renderAnalyzer();pushHist();
}

/* ---------- history ---------- */
function snapshot(){
  return JSON.stringify({v:1,comps:[...S.comps.values()].map(c=>({id:c.id,type:c.type,x:c.x,y:c.y,label:c.label,props:c.props,state:c.state})),
    wires:[...S.wires.values()].map(w=>({id:w.id,a:w.a,b:w.b})),
    probes:S.probes.map(p=>({name:p.name,ref:p.ref})),ttIns:[...S.ttIns],ttOuts:[...S.ttOuts],view:{...S.view}});
}
function restore(js){
  const d=typeof js==='string'?JSON.parse(js):js;
  S.comps.clear();S.wires.clear();S.sel.clear();S.ttIns=new Set(d.ttIns||[]);S.ttOuts=new Set(d.ttOuts||[]);
  for(const cd of d.comps){if(!CT[cd.type])continue;
    S.comps.set(cd.id,{id:cd.id,type:cd.type,x:cd.x,y:cd.y,label:cd.label||"",props:{...(CT[cd.type].defProps?CT[cd.type].defProps():{}),...(cd.props||{})},state:cd.state?JSON.parse(JSON.stringify(cd.state)):{}});}
  for(const wd of d.wires){if(!S.comps.get(wd.a.c)||!S.comps.get(wd.b.c))continue;
    if(!pinDir(S.comps.get(wd.a.c),wd.a.p)||!pinDir(S.comps.get(wd.b.c),wd.b.p))continue;
    S.wires.set(wd.id,{id:wd.id,a:wd.a,b:wd.b,pts:wd.pts||null});}
  S.probes=(d.probes||[]).map(p=>({id:uid(),name:p.name,ref:p.ref,samples:[]}));
  if(d.view)S.view={...S.view,...d.view};
  _uid=1+[...S.comps.keys(),...S.wires.keys()].reduce((m,k)=>Math.max(m,parseInt(String(k).slice(1))||0),0);
  rebuildNets();for(const pr of S.probes)pr.net=S.netOf.get(pr.ref);
  simReset(true);renderAnalyzer();
}
function pushHist(){
  S.hist=S.hist.slice(0,S.histI+1);S.hist.push(snapshot());if(S.hist.length>120)S.hist.shift();
  S.histI=S.hist.length-1;autosave();
}
function undo(){if(S.histI>0){S.histI--;restore(S.hist[S.histI]);toast('undo');}}
function redo(){if(S.histI<S.hist.length-1){S.histI++;restore(S.hist[S.histI]);toast('redo');}}

/* ---------- storage ---------- */
function autosave(){try{localStorage.setItem('dllab.autosave',snapshot());localStorage.setItem('dllab.settings',JSON.stringify(S.settings));}catch(e){}}
function projList(){const r=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('dllab.proj.'))r.push(k.slice(11));}return r.sort();}
function projSave(n){localStorage.setItem('dllab.proj.'+n,snapshot());}
function projLoad(n){const s=localStorage.getItem('dllab.proj.'+n);if(s)restore(s);}

/* ---------- validation ---------- */
function validateCircuit(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.comps)||!Array.isArray(d.wires))throw new Error('not a circuit file');
  if(d.comps.length>5000||d.wires.length>20000)throw new Error('circuit too large');
  for(const c of d.comps){if(typeof c.id!=='string'||typeof c.type!=='string'||!CT[c.type])throw new Error('bad component '+(c&&c.type));
    if(typeof c.x!=='number'||typeof c.y!=='number'||!isFinite(c.x)||!isFinite(c.y))throw new Error('bad position');
    if(c.props&&typeof c.props!=='object')throw new Error('bad props');
    if(c.props)for(const k in c.props){const v=c.props[k];if(typeof v!=='number'&&typeof v!=='string'&&typeof v!=='boolean'&&!Array.isArray(v))throw new Error('bad prop');}}
  for(const w of d.wires){if(!w.a||!w.b||typeof w.a.c!=='string'||typeof w.a.p!=='string')throw new Error('bad wire');}
  return true;
}

/* ---------- toast / misc ---------- */
function toast(msg,cls){const t=document.createElement('div');t.className='toast '+(cls||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2600);}
function fmtVal(v,w,radix){
  if(!v)return'z';if(v.s==='z')return'Z';if(v.s==='x')return'X';if(v.s==='osc')return'~OSC';
  radix=radix||S.settings.radix;w=w||1;
  if(w===1)return v.v?'1':'0';
  if(radix==='bin')return'0b'+v.v.toString(2).padStart(w,'0');
  if(radix==='dec')return String(v.v);
  return'0x'+v.v.toString(16).toUpperCase().padStart(Math.ceil(w/4),'0');
}
function valCls(v){return !v?'vz':v.s==='z'?'vz':v.s==='x'?'vx':v.s==='osc'?'vosc':v.v?'v1':'v0';}
/* ============================== COMPONENTS ============================== */
const ok=v=>v&&v.s==='ok';
const bit1=(v,b)=>ok(v)?((v.v>>b)&1):null;
function gAnd(ins,w){const vs=Object.values(ins);if(vs.some(v=>ok(v)&&v.v===0))return V(0);if(vs.every(ok)){let r=MASK(w);for(const v of vs)r&=v.v;return V(r);}return V(0,'x');}
function gOr(ins,w){const vs=Object.values(ins);if(vs.some(v=>ok(v)&&v.v===MASK(w)))return V(MASK(w));if(vs.every(ok)){let r=0;for(const v of vs)r|=v.v;return V(r);}return V(0,'x');}
function gXor(ins,w){const vs=Object.values(ins);if(vs.every(ok)){let r=0;for(const v of vs)r^=v.v;return V(r);}return V(0,'x');}
function gNot(v,w){return ok(v)?V(maskW(~v.v,w)):V(0,'x');}
const INY=(i,n,h)=>Math.round(h*(i+1)/(n+1));

/* layout helper: insLeft(count,offsets), outsRight */
function layRect(w,h,ins,outs){ // ins/outs: [{name,w,bit?}] even spaced
  const pins=[];
  ins.forEach((p,i)=>pins.push({name:p.name,dir:'in',w:p.w,x:0,y:INY(i,ins.length,h)}));
  outs.forEach((p,i)=>pins.push({name:p.name,dir:'out',w:p.w,x:w,y:INY(i,outs.length,h)}));
  return{w,h,pins};
}
function gateLay(n,cw,ch,bits){
  const ins=[];for(let i=0;i<n;i++)ins.push({name:'ABCDEF'[i],w:bits});
  return layRect(cw,ch,ins,[{name:'Q',w:bits}]);
}

/* ============================== EDITOR ============================== */
const cv=$('#cv'),ctx=cv.getContext('2d');
const mmc=$('#minimap'),mmx=mmc.getContext('2d');
let DPR=1,CW=0,CH=0;
function resize(){
  const r=$('#cwrap').getBoundingClientRect();DPR=Math.min(2.5,window.devicePixelRatio||1);
  CW=r.width;CH=r.height;cv.width=CW*DPR;cv.height=CH*DPR;
  if(S.settings.minimap)mmc.classList.add('show');else mmc.classList.remove('show');
  drawWave();
}
window.addEventListener('resize',resize);

const w2s=(x,y)=>({x:(x-S.view.x)*S.view.z,y:(y-S.view.y)*S.view.z});
const s2w=(x,y)=>({x:x/S.view.z+S.view.x,y:y/S.view.z+S.view.y});
const Lview=()=>({x:S.view.x,y:S.view.y,z:S.view.z,w:CW/S.view.z,h:CH/S.view.z});

/* theme palette for canvas */
function pal(){const b=document.body;
  const v=n=>getComputedStyle(b).getPropertyValue(n).trim();
  return{grid:v('--line'),w0:v('--w0'),w1:v('--w1'),wx:v('--wx'),wz:v('--wz'),wc:v('--wc'),wosc:v('--wosc'),
    panel:v('--panel'),line:v('--line'),txt:v('--txt'),txt2:v('--txt2'),acc:v('--acc'),bg:v('--bg')};}

/* ---------- hit testing ---------- */
function compAt(wx,wy){let best=null,bd=1e9;
  for(const c of S.comps.values()){const sz=CT[c.type].size(c);
    if(wx>=c.x-4&&wx<=c.x+sz.w+4&&wy>=c.y-4&&wy<=c.y+sz.h+4){
      const d=Math.hypot(wx-c.x-sz.w/2,wy-c.y-sz.h/2);if(d<bd){bd=d;best=c;}}}
  return best;}
function pinAt(wx,wy){const tol=8/S.view.z;
  for(const c of S.comps.values())for(const p of pinsOf(c)){
    if(Math.hypot(wx-(c.x+p.x),wy-(c.y+p.y))<=tol)return{c,p};}return null;}
function wireAt(wx,wy){
  for(const w of S.wires.values()){const pts=wirePts(w);
    for(let i=0;i<pts.length-1;i++){if(dSeg(wx,wy,pts[i],pts[i+1])<6/S.view.z)return w;}}
  return null;}
function dSeg(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy;
  if(!l2)return Math.hypot(px-a.x,py-a.y);
  let t=((px-a.x)*dx+(py-a.y)*dy)/l2;t=clamp(t,0,1);
  return Math.hypot(px-a.x-t*dx,py-a.y-t*dy);}

function pinAbs(c,p){return{x:c.x+p.x,y:c.y+p.y}}

/* ---------- wire routing ---------- */
function wirePts(w){
  const a=S.comps.get(w.a.c),b=S.comps.get(w.b.c);if(!a||!b)return[];
  const pa=pinsOf(a).find(p=>p.name===w.a.p),pb=pinsOf(b).find(p=>p.name===w.b.p);
  if(!pa||!pb)return[];
  const A=pinAbs(a,pa),B=pinAbs(b,pb);
  if(S.settings.wireStyle==='orth'){
    const dx=Math.max(18,Math.abs(B.x-A.x)*0.45);
    const ax=A.x+(pa.dir==='out'?dx:-dx),bx=B.x+(pb.dir==='in'?-dx:dx);
    if(Math.abs(A.y-B.y)<1)return[A,B];
    return[A,{x:ax,y:A.y},{x:ax,y:B.y},{x:bx,y:B.y},B];
  }
  // curved → approximate with sampled bezier for hit/draw
  const dx=Math.max(24,Math.abs(B.x-A.x)*0.5);
  const c1={x:A.x+(pa.dir==='out'?dx:-dx),y:A.y},c2={x:B.x+(pb.dir==='in'?-dx:dx),y:B.y};
  const pts=[];for(let i=0;i<=16;i++){const t=i/16,u=1-t;
    pts.push({x:u*u*u*A.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*B.x,
              y:u*u*u*A.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*B.y});}
  return pts;
}

/* ---------- draw ---------- */
function netColor(v,P){return!v?P.wz:v.s==='z'?P.wz:v.s==='x'?P.wx:v.s==='osc'?P.wosc:v.v?P.w1:P.w0;}
function draw(){
  const P=pal();ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=P.bg;ctx.fillRect(0,0,CW,CH);
  ctx.save();ctx.scale(S.view.z,S.view.z);ctx.translate(-S.view.x,-S.view.y);
  drawGrid(P);
  // wires
  for(const w of S.wires.values())drawWire(w,P);
  if(E.wireFrom)drawWirePreview(P);
  // comps
  for(const c of S.comps.values())drawComp(c,P);
  if(E.marquee){ctx.strokeStyle=P.acc;ctx.setLineDash([4,4]);ctx.lineWidth=1/S.view.z;
    const m=E.marquee;ctx.strokeRect(Math.min(m.x0,m.x1),Math.min(m.y0,m.y1),Math.abs(m.x1-m.x0),Math.abs(m.y1-m.y0));ctx.setLineDash([]);}
  for(const g of E.guides){ctx.strokeStyle='#ffd166';ctx.lineWidth=1/S.view.z;ctx.beginPath();
    if(g.v){ctx.moveTo(g.p,S.view.y);ctx.lineTo(g.p,S.view.y+CH/S.view.z);}else{ctx.moveTo(S.view.x,g.p);ctx.lineTo(S.view.x+CW/S.view.z,g.p);}ctx.stroke();}
  ctx.restore();
  drawMinimap(P);
}
function drawGrid(P){
  const L=Lview(),g=S.settings.grid;ctx.strokeStyle=P.grid;ctx.globalAlpha=.35;ctx.lineWidth=1/S.view.z;
  const st=S.view.z<0.5?g*4:g;
  ctx.beginPath();
  for(let x=Math.floor(L.x/st)*st;x<L.x+L.w;x+=st){ctx.moveTo(x,L.y);ctx.lineTo(x,L.y+L.h);}
  for(let y=Math.floor(L.y/st)*st;y<L.y+L.h;y+=st){ctx.moveTo(L.x,y);ctx.lineTo(L.x+L.w,y);}
  ctx.stroke();ctx.globalAlpha=1;
}
function drawWire(w,P){
  const pts=wirePts(w);if(pts.length<2)return;
  const nk=S.netOf.get(w.b.c+'.'+w.b.p);const v=S.sim.netVal.get(nk);
  const sel=S.sel.has(w.id);
  ctx.strokeStyle=sel?'#ffffff':netColor(v,P);
  ctx.lineWidth=(sel?3:2.2)/S.view.z*(pinW(S.comps.get(w.b.c),w.b.p)>1?1.6:1);
  const osc=v&&v.s==='osc';
  if(S.settings.anim&&v&&v.s==='ok'&&v.v){ctx.setLineDash([10,8]);ctx.lineDashOffset=-(performance.now()/40)%18;}
  else if(v&&(v.s==='z'||osc))ctx.setLineDash([5,5]);
  else ctx.setLineDash([]);
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.stroke();ctx.setLineDash([]);
  if(S.settings.ovBus&&pinW(S.comps.get(w.b.c),w.b.p)>1){
    const m=pts[Math.floor(pts.length/2)];
    ctx.fillStyle=netColor(v,P);ctx.font=`${11/S.view.z*Math.min(1,S.view.z)}px monospace`;
    ctx.font='11px monospace';ctx.fillText(fmtVal(v,pinW(S.comps.get(w.b.c),w.b.p)),m.x+4,m.y-4);
  }
}
function drawWirePreview(P){
  const pts=wirePtsPreview();if(pts.length<2)return;
  ctx.strokeStyle=E.wireBad?P.wx:P.acc;ctx.setLineDash([6,4]);ctx.lineWidth=2/S.view.z;
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();ctx.setLineDash([]);
}
function wirePtsPreview(){
  const {c,p}=E.wireFrom;const A=pinAbs(c,p);const B=E.mouse;
  return[{x:A.x,y:A.y},{x:B.x,y:B.y}];
}
function drawComp(c,P){
  const d=CT[c.type],sz=d.size(c),pins=pinsOf(c);
  const sel=S.sel.has(c.id);
  // body
  ctx.fillStyle=P.panel;ctx.strokeStyle=sel?P.acc:P.line;ctx.lineWidth=(sel?2.5:1.4)/S.view.z;
  roundRect(c.x,c.y,sz.w,sz.h,7);ctx.fill();ctx.stroke();
  if(S.settings.ovClock&&d.clkPin){ctx.strokeStyle='#ffd16655';ctx.lineWidth=4/S.view.z;roundRect(c.x,c.y,sz.w,sz.h,7);ctx.stroke();}
  // glyph
  ctx.fillStyle=P.txt2;ctx.font=`bold ${Math.min(16,sz.h*0.32)}px monospace`;ctx.textAlign='center';
  ctx.fillText(d.glyph,c.x+sz.w/2,c.y+sz.h*0.38);
  // labels & state
  ctx.fillStyle=P.txt;ctx.font='10px monospace';
  if(c.type==='switch'||c.type==='button'||c.type==='const'){
    const v=c.type==='const'?maskW(c.props.val,c.props.bits):(c.state.val||0);
    ctx.fillText(fmtVal(V(v),c.props.bits),c.x+sz.w/2,c.y+sz.h*0.72);
  }else if(c.type==='led'){
    const v=pinVal(c.id,'D');const on=ok(v)&&v.v;
    ctx.fillStyle=ok(v)?(v.v?P.w1:P.w0):netColor(v,P);
    ctx.beginPath();ctx.arc(c.x+sz.w/2,c.y+sz.h*0.62,6,0,7);ctx.fill();
    if(c.props.bits>1){ctx.fillStyle=P.txt;ctx.fillText(fmtVal(v,c.props.bits),c.x+sz.w/2,c.y+sz.h*0.3);}
  }else if(c.type==='display'){
    const v=pinVal(c.id,'D');ctx.fillStyle='#000';ctx.fillRect(c.x+7,c.y+12,sz.w-14,sz.h-20);
    ctx.fillStyle=ok(v)?'#7CFC00':'#284018';ctx.font=`bold ${sz.h*0.42}px monospace`;
    ctx.fillText(ok(v)?v.v.toString(16).toUpperCase().padStart(Math.ceil(c.props.bits/4),'0'):(v.s==='z'?'Z':'X'),c.x+sz.w/2,c.y+sz.h*0.68);
  }else if(d.clkPin||c.type==='ram'){
    let sv='';if(c.state.q!==undefined)sv=fmtVal(V(maskW(c.state.q,c.props.bits||1)),c.props.bits||1);
    if(c.type==='ram')sv=(c.state.mem||[]).length+'c';
    if(c.type==='clock')sv='T'+(c.props.period);
    ctx.fillStyle=P.txt;ctx.fillText(sv,c.x+sz.w/2,c.y+sz.h*0.72);
  }else if(c.type!=='led'&&c.type!=='display'){
    const q=pins.find(p=>p.name==='Q'&&p.dir==='out');
    if(q&&c.props.bits>1){const v=pinVal(c.id,'Q');ctx.fillStyle=P.txt;ctx.fillText(fmtVal(v,c.props.bits),c.x+sz.w/2,c.y+sz.h*0.72);}
  }
  // label
  ctx.fillStyle=P.txt2;ctx.font='10px monospace';ctx.textAlign='left';
  const lbl=c.label||d.label;ctx.fillText(lbl,c.x+2,c.y-5);
  if(S.settings.ovOrder&&S.sim.orderIdx.has(c.id)){
    ctx.fillStyle='#ffd166';ctx.fillText('#'+S.sim.orderIdx.get(c.id),c.x+sz.w-16,c.y-5);}
  if(S.settings.ovFanout){let f=0;for(const w of S.wires.values())if(w.a.c===c.id)f++;
    ctx.fillStyle=P.txt2;ctx.fillText('→'+f,c.x+2,c.y+sz.h+11);}
  // pins
  for(const p of pins){
    const a=pinAbs(c,p);const v=pinVal(c.id,p.name);
    ctx.fillStyle=netColor(v,P);ctx.strokeStyle=P.line;ctx.lineWidth=1/S.view.z;
    ctx.beginPath();ctx.arc(a.x,a.y,p.w>1?4.4:3.6,0,7);ctx.fill();ctx.stroke();
    if(p.w>1){ctx.fillStyle=P.txt2;ctx.font='8px monospace';ctx.textAlign=p.dir==='in'?'left':'right';
      ctx.fillText(p.w,p.dir==='in'?a.x+7:a.x-7,a.y-6);}
    if(S.view.z>0.9){ctx.fillStyle=P.txt2;ctx.font='8.5px monospace';ctx.textAlign=p.dir==='in'?'left':'right';
      ctx.fillText(p.name,p.dir==='in'?a.x+7:a.x-7,a.y+3);}
  }
  if(E.hoverPin&&E.hoverPin.c===c){const p=E.hoverPin.p;const a=pinAbs(c,p);
    ctx.strokeStyle=P.acc;ctx.lineWidth=2/S.view.z;ctx.beginPath();ctx.arc(a.x,a.y,7,0,7);ctx.stroke();}
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function drawMinimap(P){
  if(!S.settings.minimap||!S.comps.size)return;
  const mw=mmc.width,mh=mmc.height;mmx.setTransform(1,0,0,1,0,0);
  mmx.fillStyle=P.panel;mmx.fillRect(0,0,mw,mh);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const c of S.comps.values()){const s=CT[c.type].size(c);x0=Math.min(x0,c.x);y0=Math.min(y0,c.y);x1=Math.max(x1,c.x+s.w);y1=Math.max(y1,c.y+s.h);}
  const L=Lview();x0=Math.min(x0,L.x);y0=Math.min(y0,L.y);x1=Math.max(x1,L.x+L.w);y1=Math.max(y1,L.y+L.h);
  const sc=Math.min((mw-8)/(x1-x0||1),(mh-8)/(y1-y0||1));
  mmx.save();mmx.translate(4,4);mmx.scale(sc,sc);mmx.translate(-x0,-y0);
  mmx.fillStyle='#5b8dd9';
  for(const c of S.comps.values()){const s=CT[c.type].size(c);mmx.fillRect(c.x,c.y,s.w,s.h);}
  mmx.strokeStyle='#8899aa';mmx.lineWidth=1/sc;
  for(const w of S.wires.values()){const a=S.comps.get(w.a.c),b=S.comps.get(w.b.c);if(!a||!b)continue;
    mmx.beginPath();mmx.moveTo(a.x,a.y);mmx.lineTo(b.x,b.y);mmx.stroke();}
  mmx.strokeStyle='#ffd166';mmx.lineWidth=1.5/sc;mmx.strokeRect(L.x,L.y,L.w,L.h);
  mmx.restore();
}

/* ---------- interaction state ---------- */
const E={down:null,mouse:{x:0,y:0},wireFrom:null,wireBad:false,marquee:null,
  hoverPin:null,hoverComp:null,dragging:null,preDrag:null,moved:false,
  panning:false,spacePan:false,placeType:null,guides:[],btnHeld:null,pinch:null};

function snapV(v){return S.settings.snap?Math.round(v/S.settings.grid)*S.settings.grid:Math.round(v);}
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

cv.addEventListener('pointerdown',ev=>{
  cv.setPointerCapture(ev.pointerId);
  const m=pos(ev);const w=s2w(m.x,m.y);E.mouse=w;
  if(ev.pointerType==='touch')trackPinch(ev);
  if(E.pinch)return;
  if(ev.button===1||S.tool==='pan'||E.spacePan){E.panning={x:m.x,y:m.y,vx:S.view.x,vy:S.view.y};return;}
  if(E.placeType){placeComp(E.placeType,w.x,w.y);if(!ev.shiftKey)E.placeType=null;return;}
  const pin=pinAt(w.x,w.y);
  if(S.tool==='wire'&&pin){E.wireFrom={c:pin.c,p:pin.p};return;}
  if(pin){E.wireFrom={c:pin.c,p:pin.p};return;}
  const c=compAt(w.x,w.y);
  if(c){
    const wasSel=S.sel.has(c.id);
    if(ev.shiftKey||ev.ctrlKey){wasSel?S.sel.delete(c.id):S.sel.add(c.id);renderInspector();return;}
    if(!wasSel){S.sel.clear();S.sel.add(c.id);}
    renderInspector();
    if(c.type==='button'&&!wasSel){CT.button.onDown(c);dirtyNetConsumers(netOfPin(c.id,'Q'));S.sim.dirty.add(c.id);settle();probesSample();E.btnHeld=c;E.down={x:m.x,y:m.y,btn:c};return;}
    E.dragging={ids:[...S.sel],start:w,orig:new Map([...S.sel].map(id=>{const cc=S.comps.get(id);return[id,{x:cc.x,y:cc.y}];}))};
    E.preDrag=snapshot();E.moved=false;E.down={x:m.x,y:m.y,tap:c};return;
  }
  const wi=wireAt(w.x,w.y);
  if(wi){S.sel.clear();S.sel.add(wi.id);renderInspector();E.dragging={wire:wi,start:w,pre:snapshot()};E.moved=false;E.down={x:m.x,y:m.y};return;}
  if(!ev.shiftKey){S.sel.clear();renderInspector();}
  E.marquee={x0:w.x,y0:w.y,x1:w.x,y1:w.y};
  E.down={x:m.x,y:m.y};
});

cv.addEventListener('pointermove',ev=>{
  const m=pos(ev);const w=s2w(m.x,m.y);E.mouse=w;
  if(E.pinch){pinchMove(ev);return;}
  if(E.panning){S.view.x=E.panning.vx-(m.x-E.panning.x)/S.view.z;S.view.y=E.panning.vy-(m.y-E.panning.y)/S.view.z;return;}
  if(E.btnHeld&&E.down&&Math.hypot(m.x-E.down.x,m.y-E.down.y)>5){
    // convert to drag
    CT.button.onUp(E.btnHeld);S.sim.dirty.add(E.btnHeld.id);settle();probesSample();
    const c=E.btnHeld;E.btnHeld=null;
    E.dragging={ids:[c.id],start:w,orig:new Map([[c.id,{x:c.x,y:c.y}]])};E.preDrag=snapshot();E.moved=false;
  }
  if(E.wireFrom){
    const pin=pinAt(w.x,w.y);E.wireBad=false;
    if(pin)E.wireBad=!canConnect(E.wireFrom,{c:pin.c,p:pin.p}).ok;
    return;}
  if(E.dragging&&E.down){
    if(Math.hypot(m.x-E.down.x,m.y-E.down.y)>3)E.moved=true;
    if(E.dragging.ids){
      const dx=w.x-E.dragging.start.x,dy=w.y-E.dragging.start.y;
      E.guides=[];
      for(const id of E.dragging.ids){const c=S.comps.get(id);const o=E.dragging.orig.get(id);if(!c||!o)continue;
        let nx=o.x+dx,ny=o.y+dy;
        if(S.settings.snap){nx=snapV(nx);ny=snapV(ny);}
        // alignment guides vs others
        const sz=CT[c.type].size(c);
        for(const oc of S.comps.values()){if(E.dragging.ids.includes(oc.id))continue;
          const os=CT[oc.type].size(oc);
          for(const [cv2,ov2,vert] of[[nx,oc.x,1],[nx+sz.w,oc.x+os.w,1],[nx,oc.x+os.w,1],[nx+sz.w,oc.x,1],[ny,oc.y,0],[ny+sz.h,oc.y+os.h,0],[ny,oc.y+os.h,0],[ny+sz.h,oc.y,0]]){
            if(Math.abs(cv2-ov2)<5/S.view.z){if(vert){nx=ov2-(cv2-nx);E.guides.push({v:1,p:ov2});}else{ny=ov2-(cv2-ny);E.guides.push({v:0,p:ov2});}}}
        }
        c.x=nx;c.y=ny;}
      return;
    }
    if(E.dragging.wire){E.dragging.wire.pts=null;return;}
  }
  if(E.marquee){E.marquee.x1=w.x;E.marquee.y1=w.y;
    const m0x=Math.min(E.marquee.x0,w.x),m1x=Math.max(E.marquee.x0,w.x);
    const m0y=Math.min(E.marquee.y0,w.y),m1y=Math.max(E.marquee.y0,w.y);
    S.sel.clear();
    for(const c of S.comps.values()){const s=CT[c.type].size(c);
      if(c.x+s.w>m0x&&c.x<m1x&&c.y+s.h>m0y&&c.y<m1y)S.sel.add(c.id);}
    for(const wi of S.wires.values()){const a=S.comps.get(wi.a.c),b=S.comps.get(wi.b.c);
      if(a&&b&&((a.x>m0x&&a.x<m1x&&a.y>m0y&&a.y<m1y)||(b.x>m0x&&b.x<m1x&&b.y>m0y&&b.y<m1y)))S.sel.add(wi.id);}
    renderInspector();return;}
  // hover
  const hp=pinAt(w.x,w.y);E.hoverPin=hp;
  const hc=hp?null:compAt(w.x,w.y);E.hoverComp=hc;
  cv.style.cursor=hp?'crosshair':(hc?(CT[hc.type].onTap||hc.type==='button'?'pointer':'move'):'crosshair');
  tooltip(ev,hp,hc,w);
});

cv.addEventListener('pointerup',ev=>{
  const m=pos(ev);const w=s2w(m.x,m.y);
  if(E.pinch){E.pinch=null;return;}
  if(E.panning){E.panning=null;return;}
  if(E.btnHeld){const c=E.btnHeld;E.btnHeld=null;
    if(Math.hypot(m.x-E.down.x,m.y-E.down.y)<=5){}
    CT.button.onUp(c);S.sim.dirty.add(c.id);settle();probesSample();pushHist();E.down=null;return;}
  if(E.wireFrom){
    const pin=pinAt(w.x,w.y);
    if(pin)tryConnect(E.wireFrom,{c:pin.c,p:pin.p});
    E.wireFrom=null;E.wireBad=false;return;}
  if(E.dragging){
    if(E.dragging.ids&&E.moved)pushHistPre(E.preDrag);
    else if(E.down&&E.down.tap&&Math.hypot(m.x-E.down.x,m.y-E.down.y)<=5){
      const c=E.down.tap;const d=CT[c.type];
      if(d.onTap){d.onTap(c);S.sim.dirty.add(c.id);settle();probesSample();pushHist();}

const ptrs=new Map();
function trackPinch(ev){ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(ptrs.size===2){const[a,b]=[...ptrs.values()];
    E.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:S.view.z,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};}}
function pinchMove(ev){if(!ptrs.has(ev.pointerId))return;
  ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(ptrs.size===2&&E.pinch){const[a,b]=[...ptrs.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    const r=cv.getBoundingClientRect();const mx=cx-r.left,my=cy-r.top;
    const nz=clamp(E.pinch.z*d/E.pinch.d,0.15,6);
    const wx=S.view.x+mx/S.view.z,wy=S.view.y+my/S.view.z;
    S.view.z=nz;S.view.x=wx-mx/nz;S.view.y=wy-my/nz;}}

/* ---------- wiring logic ---------- */
function canConnect(F,T){
  const dc=F.c===T.c;
  if(F.c.id===T.c.id&&F.p.name===T.p.name)return{ok:false,why:'same pin'};
  const dF=F.p.dir,dT=T.p.dir;
  if(dF===dT)return{ok:false,why:'cannot connect '+dF+' to '+dT};
  // multiple drivers on one input pin = bus/contention (resolved by sim)
  if(F.p.w!==T.p.w)return{ok:false,why:'width mismatch '+F.p.w+'b ↔ '+T.p.w+'b'};
  return{ok:true};
}
function tryConnect(F,T){
  const chk=canConnect(F,T);
  if(!chk.ok){toast('✗ '+chk.why,'err');return;}
  const drv=F.p.dir==='out'?F:T,load=F.p.dir==='in'?F:T;
  const w={id:uid(),a:{c:drv.c.id,p:drv.p.name},b:{c:load.c.id,p:load.p.name}};
  S.wires.set(w.id,w);rebuildNets();
  const nk=S.netOf.get(w.b.c+'.'+w.b.p);dirtyNetConsumers(nk);S.sim.dirty.add(w.a.c);settle();probesSample();
  pushHist();toast('wired '+w.a.p+' → '+w.b.p,'ok');
}
function placeComp(type,x,y){
  const d=CT[type];const c={id:uid(),type,x:snapV(x-20),y:snapV(y-15),label:'',props:d.defProps(),state:{}};
  if(d.init)d.init(c);S.comps.set(c.id,c);rebuildNets();
  S.sel.clear();S.sel.add(c.id);S.sim.dirty.add(c.id);settle();probesSample();pushHist();renderInspector();
}

/* ---------- context menu ---------- */
function showCtx(mx,my,pin,c,wi){
  const cm=$('#ctxmenu');cm.innerHTML='';cm.style.display='block';
  const r=$('#cwrap').getBoundingClientRect();
  cm.style.left=Math.min(mx,r.width-200)+'px';cm.style.top=Math.min(my,r.height-260)+'px';
  const add=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{cm.style.display='none';fn();};cm.appendChild(b);};
  const head=t=>{const h=document.createElement('div');h.className='ch';h.textContent=t;cm.appendChild(h);};
  if(pin){head(pin.p.name+' · '+pin.p.dir+' '+pin.p.w+'b');
    add('Add probe here',()=>addProbe(pin.c.id,pin.p.name));}
  else if(c){head((c.label||CT[c.type].label)+' · '+c.type);
    if(!S.sel.has(c.id)){S.sel.clear();S.sel.add(c.id);}
    add('Duplicate (Ctrl+D)',dupSel);add('Copy (Ctrl+C)',copySel);add('Delete (Del)',delSel);
    head('Truth table');
    if(['switch','button','const'].includes(c.type))add(S.ttIns.has(c.id)?'✓ TT input':'Mark as TT input',()=>{S.ttIns.has(c.id)?S.ttIns.delete(c.id):S.ttIns.add(c.id);pushHist();});
    add(S.ttOuts.has(c.id)?'✓ TT output':'Mark as TT output',()=>{S.ttOuts.has(c.id)?S.ttOuts.delete(c.id):S.ttOuts.add(c.id);pushHist();});
    head('Probes');
    for(const p of pinsOf(c))add('Probe '+p.name,()=>addProbe(c.id,p.name));}
  else if(wi){head('wire '+wi.a.p+' → '+wi.b.p);
    add('Add probe on wire',()=>addProbe(wi.b.c,wi.b.p));
    add('Delete wire',()=>{S.wires.delete(wi.id);rebuildNets();dirtyAll();settle();probesSample();pushHist();});}
  else{head('canvas');
    add('Paste',pasteClip);add('Select all',()=>{S.comps.forEach(c=>S.sel.add(c.id));S.wires.forEach(w=>S.sel.add(w.id));renderInspector();});
    add('Reset view',()=>{S.view={x:60,y:40,z:1.2};});
    add('Fit circuit',fitView);}
  const dismiss=e=>{if(cm.contains(e.target))return;cm.style.display='none';document.removeEventListener('pointerdown',dismiss);};
  setTimeout(()=>document.addEventListener('pointerdown',dismiss),0);
}
function fitView(){
  if(!S.comps.size)return;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const c of S.comps.values()){const s=CT[c.type].size(c);x0=Math.min(x0,c.x);y0=Math.min(y0,c.y);x1=Math.max(x1,c.x+s.w);y1=Math.max(y1,c.y+s.h);}
  const z=clamp(Math.min(CW/(x1-x0+120),CH/(y1-y0+120)),0.2,2.5);
  S.view.z=z;S.view.x=x0-60;S.view.y=y0-60;
}

/* ---------- clipboard / delete ---------- */
function selComps(){return[...S.sel].map(id=>S.comps.get(id)).filter(Boolean)}
function copySel(){
  const cs=selComps();if(!cs.length)return;
  const ids=new Set(cs.map(c=>c.id));
  S.clip={comps:cs.map(c=>({type:c.type,x:c.x,y:c.y,label:c.label,props:JSON.parse(JSON.stringify(c.props)),sid:c.id})),
    wires:[...S.wires.values()].filter(w=>ids.has(w.a.c)&&ids.has(w.b.c)).map(w=>({a:w.a,b:w.b}))};
  toast('copied '+cs.length+' comp(s)');
}
function pasteClip(){
  if(!S.clip)return;const map={};S.sel.clear();
  for(const cd of S.clip.comps){const c={id:uid(),type:cd.type,x:cd.x+30,y:cd.y+30,label:cd.label,props:JSON.parse(JSON.stringify(cd.props)),state:{}};
    if(CT[c.type].init)CT[c.type].init(c);map[cd.sid]=c.id;S.comps.set(c.id,c);S.sel.add(c.id);}
  for(const wd of S.clip.wires){if(map[wd.a.c]&&map[wd.b.c]){const id=uid();
    S.wires.set(id,{id,a:{c:map[wd.a.c],p:wd.a.p},b:{c:map[wd.b.c],p:wd.b.p}});}}
  rebuildNets();dirtyAll();settle();probesSample();pushHist();renderInspector();
}
function dupSel(){if(!selComps().length)return;copySel();pasteClip();}
function delSel(){
  if(!S.sel.size)return;
  for(const id of S.sel){if(S.comps.has(id)){S.comps.delete(id);S.ttIns.delete(id);S.ttOuts.delete(id);}
    else S.wires.delete(id);}
  for(const wid of[...S.wires.keys()]){const w=S.wires.get(wid);
    if(!S.comps.has(w.a.c)||!S.comps.has(w.b.c))S.wires.delete(wid);}
  S.probes=S.probes.filter(p=>{const[cid]=p.ref.split('.');return S.comps.has(cid);});
  S.sel.clear();rebuildNets();dirtyAll();settle();probesSample();pushHist();renderInspector();
}
function pushHistPre(pre){S.hist=S.hist.slice(0,S.histI+1);S.hist.push(pre);S.histI=S.hist.length-1;pushHist();}

/* ---------- keyboard ---------- */
window.addEventListener('keydown',ev=>{
  const tag=(ev.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select')return;
  const k=ev.key.toLowerCase();
  if(k===' '){E.spacePan=true;cv.classList.add('pan');ev.preventDefault();return;}
  if(ev.ctrlKey||ev.metaKey){
    if(k==='z'){ev.preventDefault();ev.shiftKey?redo():undo();}
    else if(k==='y'){ev.preventDefault();redo();}
    else if(k==='c'){ev.preventDefault();copySel();}
    else if(k==='v'){ev.preventDefault();pasteClip();}
    else if(k==='d'){ev.preventDefault();dupSel();}
    else if(k==='a'){ev.preventDefault();S.comps.forEach(c=>S.sel.add(c.id));S.wires.forEach(w=>S.sel.add(w.id));renderInspector();}
    else if(k==='s'){ev.preventDefault();saveModal();}
    return;}
  if(k==='delete'||k==='backspace')delSel();
  else if(k==='escape'){E.placeType=null;E.wireFrom=null;S.sel.clear();$('#ctxmenu').style.display='none';closeModals();renderInspector();}
  else if(k==='w')setTool('wire');else if(k==='v'&&!ev.ctrlKey)setTool('select');
  else if(k==='h')setTool('pan');
  else if(k==='t')stepTick();else if(k==='e')stepEvent();
  else if(k==='r'){S.sim.running?pauseRun():startRun();}
  else if(k==='0')simReset();
});

  sb.appendChild(d);

  const h3=document.createElement('h4');h3.textContent='Feedback / loops';sb.appendChild(h3);
  const d3=document.createElement('div');d3.className='small';
  const fb=findLoops();d3.innerHTML=fb.length?fb.map(x=>'↻ '+x).join('<br>'):'no combinational loops';

function findLoops(){
  // DFS on comp-graph (comp -> comps driven by its outputs)
  const adj=new Map();for(const w of S.wires.values()){
    if(!adj.has(w.a.c))adj.set(w.a.c,[]);adj.get(w.a.c).push(w.b.c);}
  const loops=new Set(),vis=new Set(),stk=new Set();
  function dfs(n,path){if(stk.has(n)){loops.add(path.slice(path.indexOf(n)).join('→')+'→'+n);return;}
    if(vis.has(n))return;vis.add(n);stk.add(n);
    for(const m of adj.get(n)||[])dfs(m,[...path,n]);stk.delete(n);}
  for(const id of S.comps.keys())dfs(id,[]);
  return[...loops].slice(0,8).map(s=>s.split('→').map(id=>{const c=S.comps.get(id);return c?(c.label||CT[c.type].label):id;}).join('→'));
}

function drawWave(){
  const wv=$('#wave');if(!wv||!AN.open)return;
  const r=$('#waveWrap').getBoundingClientRect();wv.width=r.width*DPR;wv.height=r.height*DPR;
  const g=wv.getContext('2d');const P=pal();g.setTransform(DPR,0,0,DPR,0,0);
  g.fillStyle=P.bg;g.fillRect(0,0,r.width,r.height);
  const pxT=x=>(x-AN.off)*4*AN.zoom+6;
  const tMax=S.sim.t+4;
  // tick grid
  g.strokeStyle=P.line;g.globalAlpha=.4;
  const tickStep=Math.max(1,Math.round(2/Math.max(0.001,S.settings.clockHz)));
  for(let t=Math.floor(AN.off);t<AN.off+r.width/(4*AN.zoom)+2;t++){
    g.beginPath();g.moveTo(pxT(t),0);g.lineTo(pxT(t),r.height);g.stroke();
    g.fillStyle=P.txt2;g.font='9px monospace';g.fillText(t,pxT(t)+2,10);}
  g.globalAlpha=1;

    const y0=8+i*rowH,y1=y0+rowH-14,yb=y0+rowH-6;
    const w=probeW(pr);const multi=w>1;
    const samples=pr.samples;
    g.strokeStyle=P.line;g.beginPath();g.moveTo(0,yb);g.lineTo(r.width,yb);g.stroke();
    if(samples.length<1)return;
    let cur=null;
    for(let s=0;s<samples.length;s++){const sm=samples[s];const x=pxT(sm.t);
      const nx=s+1<samples.length?pxT(samples[s+1].t):r.width;
      const col=sm.s==='ok'?(multi?P.acc:(sm.v?P.w1:P.w0)):sm.s==='z'?P.wz:sm.s==='x'?P.wx:P.wosc;
      if(!multi){
        const yv=sm.s==='ok'?(sm.v?y0+4:y1-2):(y0+y1)/2;
        g.strokeStyle=col;g.lineWidth=1.6;
        if(cur!==null){g.beginPath();g.moveTo(x,cur.y);g.lineTo(x,yv);g.stroke();}
        g.beginPath();g.moveTo(x,yv);g.lineTo(nx,yv);g.stroke();
        cur={y:yv};
      }else{
        g.strokeStyle=col;g.lineWidth=1.4;
        g.beginPath();g.moveTo(x,y0+6);g.lineTo(x+3,y0+2);g.lineTo(nx-3,y0+2);g.lineTo(nx,y0+6);
        g.lineTo(nx-3,y1-4);g.lineTo(x+3,y1-4);g.lineTo(x,y0+6);g.stroke();
        if(nx-x>16){g.fillStyle=col;g.font='10px monospace';g.textAlign='center';
          g.fillText(fmtVal(sm,w),x+(nx-x)/2,(y0+y1)/2+2);g.textAlign='left';}
        cur=null;}
    }
    g.fillStyle=P.txt2;g.font='9px monospace';g.fillText(pr.name,4,y0+9);
  });
}

/* Quine-McCluskey (small n) → SOP string */
function qmSOP(mt,n){
  const terms=mt.map(m=>({bits:m.toString(2).padStart(n,'0'),used:false}));
  let primes=[];
  function combine(terms){
    const next=new Map(),used=new Set();
    for(let i=0;i<terms.length;i++)for(let j=i+1;j<terms.length;j++){
      const a=terms[i].bits,b=terms[j].bits;let diff=-1,cnt=0;
      for(let k=0;k<a.length;k++)if(a[k]!==b[k]){diff=k;cnt++;}
      if(cnt===1){const c=a.slice(0,diff)+'-'+a.slice(diff+1);next.set(c,true);used.add(i);used.add(j);}}
    terms.forEach((t,i)=>{if(!used.has(i))primes.push(t.bits);});
    if(next.size)combine([...next.keys()].map(k=>({bits:k})));
  }
  combine(terms);
  primes=[...new Set(primes)];
  if(!primes.length)return '0';
  // cover: prime -> minterms covered
  const covers=primes.map(p=>mt.filter(m=>{const b=m.toString(2).padStart(n,'0');
    return[...p].every((c,k)=>c==='-'||c===b[k]);}));
  const uncovered=new Set(mt);const chosen=[];
  while(uncovered.size){let best=-1,bi=-1;
    covers.forEach((c,i)=>{const cnt=c.filter(m=>uncovered.has(m)).length;
      if(cnt>best&&!chosen.includes(i)){best=cnt;bi=i;}});
    if(best<=0)break;chosen.push(bi);covers[bi].forEach(m=>uncovered.delete(m));}
  const vars='ABCDEFGH'.slice(0,n).split('');
  const term=p=>{const lits=[];[...p].forEach((c,k)=>{if(c==='1')lits.push(vars[k]);if(c==='0')lits.push(vars[k]+"'" );});return lits.length?lits.join('·'):'1';};
  return chosen.map(i=>term(primes[i])).join(' + ');
}

/* ---------------- TINY 4-BIT CPU ----------------
 Harvard: program ROM (16x8, WE=0) + data RAM (16x4).
 instr = ROM[PC] : opcode=hi4, operand=lo4
 1 LDA imm | 2 ADD imm | 3 SUB imm | 4 STA a | 5 LDM a | 6 JMP a | 7 JZ a | 8 HLT
 Single-cycle: one instruction per rising edge of gated clock.          */
presetDef('Tiny CPU (4-bit)',L=>{
  const k=bComp(L,'clock',40,40,{period:1},'CLK');
  const rst=bComp(L,'button',40,120,{},'RESET');
  const c1=bComp(L,'const',40,200,{bits:1,val:1},'1');
  const c0=bComp(L,'const',40,270,{bits:1,val:0},'0');
  const c04=bComp(L,'const',40,340,{bits:4,val:0},'0x0');
  const c08=bComp(L,'const',40,410,{bits:8,val:0},'0x00');
  const hlt=bComp(L,'dff',250,40,{},'HALT');
  const nh=bComp(L,'not',400,50,{},'~halt');
  const cg=bComp(L,'and',500,60,{},'CLKG');
  bWire(L,k,'Q',cg,'A');bWire(L,hlt,'Q',nh,'A');bWire(L,nh,'Q',cg,'B');
  bWire(L,rst,'Q',hlt,'RST');bWire(L,c1,'Q',hlt,'EN');
  // PC + ROM + IR
  const pc=bComp(L,'cnt',170,190,{bits:4},'PC');
  const rom=bComp(L,'ram',350,180,{aw:4,bits:8,mem:[0x10,0x4F,0x5F,0x21,0x4F,0x62,0x82]},'ROM prog');
  const ir=bComp(L,'reg',350,330,{bits:8},'IR');
  bWire(L,pc,'Q',rom,'A');bWire(L,c08,'Q',rom,'D');bWire(L,c0,'Q',rom,'WE');
  bWire(L,rom,'Q',ir,'D');bWire(L,cg,'Q',ir,'CLK');bWire(L,c1,'Q',ir,'EN');bWire(L,rst,'Q',ir,'RST');
  bWire(L,cg,'Q',pc,'CLK');bWire(L,c1,'Q',pc,'EN');bWire(L,rst,'Q',pc,'RST');
  // decode
  const sp=bComp(L,'split',530,250,{parts:[4,4]},'op|opnd'); // O0=lo=operand, O1=hi=opcode
  const dec=bComp(L,'dec',680,120,{n:4},'OPDEC');
  bWire(L,rom,'Q',sp,'B');bWire(L,sp,'O1',dec,'A');bWire(L,c1,'Q',dec,'EN');
  // control lines
  const oAL=bComp(L,'or',830,430,{n:4},'aLoad');
  bWire(L,dec,'Y1',oAL,'A');bWire(L,dec,'Y2',oAL,'B');bWire(L,dec,'Y3',oAL,'C');bWire(L,dec,'Y5',oAL,'D');
  const jz=bComp(L,'and',830,340,{},'JZ&zero');
  const cmp=bComp(L,'cmp',680,590,{bits:4},'A==0');
  const orJ=bComp(L,'or',980,370,{},'pcLoad');
  bWire(L,dec,'Y7',jz,'A');bWire(L,cmp,'EQ',jz,'B');
  bWire(L,dec,'Y6',orJ,'A');bWire(L,jz,'Q',orJ,'B');
  bWire(L,orJ,'Q',pc,'LD');
  const opnd=sp; // operand = O0
  bWire(L,opnd,'O0',pc,'D');
  // ALU: sub = operand XOR broadcast(sub3) ; adder A + aluB + cin(sub3)
  const bc=bComp(L,'join',830,690,{parts:[1,1,1,1]},'sub*F');
  bWire(L,dec,'Y3',bc,'I0');bWire(L,dec,'Y3',bc,'I1');bWire(L,dec,'Y3',bc,'I2');bWire(L,dec,'Y3',bc,'I3');
  const xb=bComp(L,'xor',700,700,{bits:4},'opnd^sub');
  bWire(L,opnd,'O0',xb,'A');bWire(L,bc,'Q',xb,'B');
  const reg=bComp(L,'reg',1230,560,{bits:4},'A');
  const add=bComp(L,'adder',850,560,{bits:4},'ALU');
  bWire(L,reg,'Q',add,'A');bWire(L,xb,'Q',add,'B');bWire(L,dec,'Y3',add,'CIN');
  // data RAM
  const dm=bComp(L,'ram',1050,680,{aw:4,bits:4},'RAM data');
  bWire(L,opnd,'O0',dm,'A');bWire(L,reg,'Q',dm,'D');bWire(L,dec,'Y4',dm,'WE');bWire(L,cg,'Q',dm,'CLK');
  // A next mux4: D0=alu, D1=imm, D2=ram, S={ldm,lda}
  const mx=bComp(L,'mux',1040,480,{bits:4,n:4},'Asrc');
  bWire(L,add,'S',mx,'D0');bWire(L,opnd,'O0',mx,'D1');bWire(L,dm,'Q',mx,'D2');bWire(L,c04,'Q',mx,'D3');
  const sel=bComp(L,'join',920,470,{parts:[1,1]},'sel');
  bWire(L,dec,'Y5',sel,'I1');bWire(L,dec,'Y1',sel,'I0');bWire(L,sel,'Q',mx,'S');
  bWire(L,mx,'Q',reg,'D');bWire(L,oAL,'Q',reg,'EN');bWire(L,cg,'Q',reg,'CLK');bWire(L,rst,'Q',reg,'RST');
  // halt decode → halt dff
  bWire(L,dec,'Y8',hlt,'D');bWire(L,cg,'Q',hlt,'CLK');
  // comparator A==0
  bWire(L,reg,'Q',cmp,'A');bWire(L,c04,'Q',cmp,'B');
  // output
  const dsp=bComp(L,'display',1400,560,{bits:4},'OUT = A');
  const led=bComp(L,'led',680,40,{},'HALTED');
  const dsp2=bComp(L,'display',530,340,{bits:8},'INSTR');
  bWire(L,reg,'Q',dsp,'D');bWire(L,hlt,'Q',led,'D');bWire(L,rom,'Q',dsp2,'D');
  // probes
  bProbe(L,k,'Q','clk');bProbe(L,pc,'Q','pc');bProbe(L,reg,'Q','A');
  bProbe(L,rom,'Q','instr');bProbe(L,cg,'Q','clkg');
  L.view={x:-20,y:0,z:0.8};
}),
];

function loadPreset(id){
  const p=PRESETS.find(x=>x.id===id);if(!p)return;
  const L={comps:[],wires:[],probes:[]};p.build(L);
  S.comps.clear();S.wires.clear();S.sel.clear();S.ttIns.clear();S.ttOuts.clear();
  for(const c of L.comps)S.comps.set(c.id,c);
  for(const w of L.wires)S.wires.set(w.id,w);
  S.probes=L.probes.map(pr=>({id:uid(),name:pr.name,ref:pr.ref,samples:[]}));
  if(L.view)S.view={...S.view,...L.view};
  rebuildNets();for(const pr of S.probes)pr.net=S.netOf.get(pr.ref);
  S.hist=[];S.histI=-1;simReset();pushHist();renderInspector();renderAnalyzer();
}

/* ---------- PNG ---------- */
function circBounds(){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const c of S.comps.values()){const s=CT[c.type].size(c);x0=Math.min(x0,c.x);y0=Math.min(y0,c.y);x1=Math.max(x1,c.x+s.w);y1=Math.max(y1,c.y+s.h);}
  for(const w of S.wires.values())for(const p of wirePts(w)){x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}
  return{x0,y0,x1:x1+30,y1:y1+30,x0:x0-30,y0:y0-30};}
function exportPNG(){
  const b=circBounds();const w=b.x1-b.x0,h=b.y1-b.y0,sc=2;
  const oc=document.createElement('canvas');oc.width=w*sc;oc.height=h*sc;
  const g=oc.getContext('2d');const P=pal();
  g.fillStyle=P.bg;g.fillRect(0,0,oc.width,oc.height);
  g.scale(sc,sc);g.translate(-b.x0,-b.y0);
  for(const w of S.wires.values())drawWireCtx(g,w,P);
  for(const c of S.comps.values())drawCompCtx(g,c,P);
  oc.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='circuit.png';a.click();});
}
function drawWireCtx(g,w,P){const pts=wirePts(w);if(pts.length<2)return;
  const nk=S.netOf.get(w.b.c+'.'+w.b.p);const v=S.sim.netVal.get(nk);
  g.strokeStyle=netColor(v,P);g.lineWidth=2.2*(pinW(S.comps.get(w.b.c),w.b.p)>1?1.6:1);
  if(v&&(v.s==='z'||v.s==='osc'))g.setLineDash([5,5]);
  g.beginPath();g.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)g.lineTo(pts[i].x,pts[i].y);g.stroke();g.setLineDash([]);}
function drawCompCtx(g,c,P){
  const d=CT[c.type],sz=d.size(c),pins=pinsOf(c);
  g.fillStyle=P.panel;g.strokeStyle=P.line;g.lineWidth=1.4;
  g.beginPath();g.roundRect(c.x,c.y,sz.w,sz.h,7);g.fill();g.stroke();
  g.fillStyle=P.txt2;g.font=`bold ${Math.min(16,sz.h*0.32)}px monospace`;g.textAlign='center';
  g.fillText(d.glyph,c.x+sz.w/2,c.y+sz.h*0.38);
  g.fillStyle=P.txt;g.font='10px monospace';
  if(c.type==='display'){const v=pinVal(c.id,'D');g.fillStyle='#000';g.fillRect(c.x+7,c.y+12,sz.w-14,sz.h-20);
    g.fillStyle='#7CFC00';g.font=`bold ${sz.h*0.4}px monospace`;g.fillText(ok(v)?v.v.toString(16).toUpperCase():'X',c.x+sz.w/2,c.y+sz.h*0.66);}
  else if(c.state.q!==undefined||c.type==='led'){}
  if(c.type==='led'){const v=pinVal(c.id,'D');g.fillStyle=ok(v)&&v.v?P.w1:P.w0;
    g.beginPath();g.arc(c.x+sz.w/2,c.y+sz.h*0.62,6,0,7);g.fill();}
  g.fillStyle=P.txt2;g.font='10px monospace';g.textAlign='left';
  g.fillText(c.label||d.label,c.x+2,c.y-5);
  for(const p of pins){const a=pinAbs(c,p);const v=pinVal(c.id,p.name);
    g.fillStyle=netColor(v,P);g.beginPath();g.arc(a.x,a.y,3.6,0,7);g.fill();}
}

/* ---------- SVG ---------- */
function exportSVG(){
  const b=circBounds();const P=pal();
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b.x0} ${b.y0} ${b.x1-b.x0} ${b.y1-b.y0}" font-family="monospace">`;
  s+=`<rect x="${b.x0}" y="${b.y0}" width="${b.x1-b.x0}" height="${b.y1-b.y0}" fill="${P.bg}"/>`;
  for(const w of S.wires.values()){const pts=wirePts(w);if(pts.length<2)continue;
    const nk=S.netOf.get(w.b.c+'.'+w.b.p);const v=S.sim.netVal.get(nk);
    s+=`<polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${netColor(v,P)}" stroke-width="2" ${v&&v.s!=='ok'?'stroke-dasharray="5 5"':''}/>`;}
  for(const c of S.comps.values()){const d=CT[c.type],sz=d.size(c);
    s+=`<g><rect x="${c.x}" y="${c.y}" width="${sz.w}" height="${sz.h}" rx="7" fill="${P.panel}" stroke="${P.line}"/>`;
    s+=`<text x="${c.x+sz.w/2}" y="${c.y+sz.h*0.4}" fill="${P.txt2}" font-size="14" font-weight="bold" text-anchor="middle">${esc(d.glyph)}</text>`;
    s+=`<text x="${c.x+2}" y="${c.y-5}" fill="${P.txt2}" font-size="10">${esc(c.label||d.label)}</text>`;
    for(const p of pinsOf(c)){const a=pinAbs(c,p);const v=pinVal(c.id,p.name);
      s+=`<circle cx="${a.x}" cy="${a.y}" r="3.5" fill="${netColor(v,P)}"/>`;}
    s+='</g>';}
  s+='</svg>';download('circuit.svg',s,'image/svg+xml');}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ============================== RUN / LOOP ============================== */
function startRun(){S.sim.running=true;S.sim._last=0;S.sim._acc=0;
  $('#btnRun').classList.add('on');$('#btnPause').classList.remove('on');}
function pauseRun(){S.sim.running=false;$('#btnRun').classList.remove('on');}

let _lastHud=0,_lastWave=0;
function frame(now){
  runFrame(now);draw();
  if(AN.open&&now-_lastWave>200){drawWave();_lastWave=now;}
  if(now-_lastHud>140){hud();_lastHud=now;
    if(now-ft2>500){fps=Math.round(fc2*1000/(now-ft2));fc2=0;ft2=now;}}
  fc2++;requestAnimationFrame(frame);}
let fc2=0,ft2=0;

/* ============================== BOOT ============================== */
function boot(){
  try{const st=JSON.parse(localStorage.getItem('dllab.settings')||'null');
    if(st&&typeof st==='object')Object.assign(S.settings,st);}catch(e){}
  buildToolbar();buildPalette();applyTheme();resize();
  setTool('select');
  const saved=localStorage.getItem('dllab.autosave');
  if(saved){try{const d=JSON.parse(saved);validateCircuit(d);restore(d);pushHist();}
    catch(e){loadPreset('welcome-switch-and-led');}}
  else loadPreset('welcome-switch-and-led');
  renderInspector();renderAnalyzer();
  window.LAB={S,CT,settle,simReset,stepEvent,stepTick,netVal,netOfPin,pinVal,pinsOf,
    w2s,s2w,probesSample,loadPreset,pushHist,snapshot,restore,fitView,
    screenOf:(cid,pn)=>{const c=S.comps.get(cid);const p=pinsOf(c).find(x=>x.name===pn);
      const a=pinAbs(c,p);const r=cv.getBoundingClientRect();const s=w2s(a.x,a.y);return{x:s.x+r.left,y:s.y+r.top};}};
  requestAnimationFrame(frame);
}
try{boot();}catch(e){window.__bootErr=e.stack||e.message;console.error('BOOT FAIL',e);}
</script></body></html>
