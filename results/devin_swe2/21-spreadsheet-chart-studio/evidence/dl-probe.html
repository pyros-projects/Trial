<!doctype html><html><body>
<button id="blob">blob</button>
<button id="data">data</button>
<button id="dataurl">dataurl-anchor</button>
<script>
document.getElementById('blob').onclick=()=>{const a=document.createElement('a');a.download='probe-blob.txt';a.href=URL.createObjectURL(new Blob(['hello'],{type:'text/plain'}));document.body.appendChild(a);a.click()};
document.getElementById('data').onclick=()=>{const a=document.createElement('a');a.download='probe-data.txt';a.href='data:text/plain,hello-data';document.body.appendChild(a);a.click()};
document.getElementById('dataurl').onclick=()=>{location.href='data:text/plain,hello-nav'};
</script>
</body></html>
