<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FORGE — Node Graphics Studio</title>
<style>
:root{
  --bg:#0d0f14; --panel:#141824; --panel2:#1a1f2e; --panel3:#222838;
  --line:#2a3247; --txt:#dfe5f2; --dim:#8b94ab; --acc:#7c6cff; --acc2:#39d0d8;
  --err:#ff5c6c; --warn:#ffb454; --ok:#48d597;
  --ty-f:#9db4d8; --ty-v2:#7fd8a0; --ty-v3:#5cc8ff; --ty-c4:#e48cff; --ty-any:#c9a26b;
  --shadow:0 6px 24px rgba(0,0,0,.45);
}
[data-theme="light"]{
  --bg:#e8eaf1; --panel:#f4f5fa; --panel2:#e9ebf4; --panel3:#dde1ee;
  --line:#c3c9dc; --txt:#1c2233; --dim:#5a627a; --acc:#5b4ae0; --acc2:#0d8d94;
  --err:#d92b3d; --warn:#b87600; --ok:#0d8a4e;
  --ty-f:#476a9e; --ty-v2:#1f8a4a; --ty-v3:#0f72b8; --ty-c4:#a72fbe; --ty-any:#8a6420;
  --shadow:0 6px 24px rgba(40,50,90,.18);
}
[data-theme="contrast"]{
  --bg:#000; --panel:#0a0a0a; --panel2:#111; --panel3:#1c1c1c;
  --line:#5a5a5a; --txt:#fff; --dim:#bbb; --acc:#ffe74c; --acc2:#4ceaff;
  --err:#ff4d4d; --warn:#ffb000; --ok:#37ff8b;
  --ty-f:#c0d4ff; --ty-v2:#57ff9b; --ty-v3:#3fbfff; --ty-c4:#ff7bff; --ty-any:#e6c26b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font:12px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit;background:var(--panel3);border:1px solid var(--line);border-radius:6px;padding:4px 8px;outline:none}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button.warn{background:var(--err);border-color:var(--err);color:#fff}
input[type=number],input[type=text]{background:var(--panel2)}
input[type=color]{padding:1px;width:34px;height:24px;background:var(--panel2)}
input[type=range]{padding:0;accent-color:var(--acc)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100%}
#toolbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
#toolbar .logo{font-weight:800;letter-spacing:1px;font-size:14px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:4px}
#toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
#toolbar select{max-width:150px}
.tb{display:flex;align-items:center;gap:4px}
.tb button{padding:4px 8px;white-space:nowrap}
#main{flex:1;display:flex;min-height:0;position:relative}
#left{width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#graphWrap{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(circle at 0 0, transparent 0, transparent 100%);background-color:var(--bg);touch-action:none}
#right{width:340px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
#timeline{flex:none;background:var(--panel);border-top:1px solid var(--line);height:150px;display:flex;flex-direction:column;min-height:0}
#tlTop{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#tlTop input[type=number]{width:58px}
#dopeWrap{flex:1;overflow:auto;position:relative}
#dope{position:relative;min-width:100%}

/* palette */
#left h3,#right h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);padding:8px 10px 4px}
#palSearch{margin:6px 8px;width:calc(100% - 16px)}
#palList{flex:1;overflow-y:auto;padding:0 6px 10px}
.palCat{color:var(--dim);font-size:10px;text-transform:uppercase;letter-spacing:1px;margin:8px 4px 3px}
.palItem{padding:5px 8px;margin:2px 0;border-radius:6px;background:var(--panel2);border:1px solid var(--line);cursor:grab;display:flex;justify-content:space-between;align-items:center}
.palItem:hover{border-color:var(--acc);background:var(--panel3)}
.palItem .cat{font-size:9px;color:var(--dim)}

/* inspector */
#inspector{flex:none;max-height:55%;overflow-y:auto;border-top:1px solid var(--line);padding-bottom:8px}
.inspRow{display:flex;align-items:center;gap:6px;padding:3px 10px}
.inspRow label{flex:1;color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inspRow input[type=range]{flex:1.2;min-width:60px}
.inspRow input[type=number]{width:60px}
.inspRow .keybtn{padding:1px 6px;font-size:11px}
.inspRow .keybtn.on{color:var(--warn);border-color:var(--warn)}
.inspHead{padding:6px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);margin-bottom:4px}
.inspHead b{font-size:12px}

/* nodes */
#world{position:absolute;transform-origin:0 0}
.node{position:absolute;width:190px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow);font-size:11px}
.node.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc),var(--shadow)}
.node.err{border-color:var(--err);box-shadow:0 0 0 2px var(--err)}
.node.dirtyN{border-style:dashed}
.node.cachedN{border-color:var(--ok)}
.nodeHdr{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px 8px 0 0;background:var(--panel3);cursor:grab;border-bottom:1px solid var(--line)}
.nodeHdr .dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.nodeHdr .t{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nodeHdr button{padding:0 4px;border:none;background:none;color:var(--dim);font-size:11px}
.nodeHdr button:hover{color:var(--txt)}
.ports{display:flex;justify-content:space-between;gap:4px;padding:4px 0}
.pcol{display:flex;flex-direction:column;gap:2px;min-width:0}
.port{display:flex;align-items:center;gap:5px;height:18px;padding:0 6px;color:var(--dim);cursor:default;position:relative}
.port .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
.pcol.out .port{flex-direction:row-reverse;text-align:right}
.port .jack{width:11px;height:11px;border-radius:50%;background:var(--panel);border:2px solid var(--ty-f);flex:none;cursor:crosshair;position:relative;z-index:3}
.port.f .jack{border-color:var(--ty-f)} .port.v2 .jack{border-color:var(--ty-v2)}
.port.v3 .jack{border-color:var(--ty-v3)} .port.c4 .jack{border-color:var(--ty-c4)} .port.any .jack{border-color:var(--ty-any)}
.port.hi .jack{background:var(--acc2);box-shadow:0 0 6px var(--acc2)}
.port .comp{position:absolute;font-size:8px;color:var(--dim)}
.nparams{padding:2px 8px 6px;display:flex;flex-direction:column;gap:3px}
.nparam{display:flex;align-items:center;gap:5px}
.nparam label{flex:none;width:52px;color:var(--dim);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nparam input[type=range]{flex:1;min-width:40px}
.nparam input[type=number]{width:46px;padding:1px 4px}
.nparam select{flex:1;padding:1px 4px;min-width:0}
.nparam .val{width:34px;text-align:right;color:var(--dim);font-size:10px}
.nprev{padding:4px 8px 8px}
.nprev canvas{width:100%;height:56px;border-radius:5px;border:1px solid var(--line);background:#000;display:block}
.node .errMsg{padding:3px 8px;color:var(--err);font-size:10px;border-top:1px solid var(--line)}
.commentNode{background:rgba(120,140,255,.07);border-style:dashed}
.commentNode textarea{width:calc(100% - 12px);margin:4px 6px 6px;background:transparent;border:none;color:var(--txt);resize:vertical;min-height:38px;font-size:11px}

/* frames */
.frame{position:absolute;border:2px solid var(--acc);border-radius:10px;background:rgba(124,108,255,.06)}
.frame .ftitle{position:absolute;top:-20px;left:6px;font-size:11px;font-weight:700;color:var(--acc);background:var(--bg);padding:0 6px;border-radius:4px;cursor:grab}
.frame.sel{outline:2px dashed var(--acc2)}
.frame .fres{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;background:var(--acc);border-radius:6px 0 8px 0}

/* wires */
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#wires path.wire{fill:none;stroke-width:2.4;pointer-events:stroke;cursor:pointer}
#wires path.wire:hover{stroke-width:4}
#wires path.wire.sel{stroke:var(--acc)!important;stroke-width:3.4}
#wires path.temp{stroke-dasharray:6 4;stroke-width:2.4}
#boxSel{position:absolute;border:1px dashed var(--acc2);background:rgba(57,208,216,.08);display:none;z-index:5}
#guides .g{position:absolute;background:var(--warn);z-index:8;pointer-events:none}
#guides .gv{width:1px;top:0;bottom:0}#guides .gh{height:1px;left:0;right:0}

/* minimap */
#minimap{position:absolute;right:10px;bottom:10px;width:150px;height:100px;background:var(--panel);border:1px solid var(--line);border-radius:7px;opacity:.92;cursor:pointer;z-index:6}
#minimap canvas{width:100%;height:100%;display:block}

/* command palette / menus */
#cmdk{position:absolute;left:50%;top:14%;transform:translateX(-50%);width:340px;background:var(--panel);border:1px solid var(--acc);border-radius:10px;box-shadow:var(--shadow);z-index:50;display:none}
#cmdk input{width:100%;border:none;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;padding:10px;background:var(--panel2)}
#cmdkList{max-height:260px;overflow-y:auto;padding:4px}
#cmdkList .ck{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between}
#cmdkList .ck:hover,#cmdkList .ck.act{background:var(--panel3)}
#cmdkList .ck span{color:var(--dim);font-size:10px}
#ctx{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:60;min-width:170px;padding:4px;display:none}
#ctx .ci{padding:6px 10px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
#ctx .ci:hover{background:var(--panel3)}
#ctx .ci span{color:var(--dim);font-size:10px}
#ctx .cdv{height:1px;background:var(--line);margin:3px 6px}

/* preview panel */
#pvBox{position:relative;margin:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;flex:none}
#preview{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#pvTools{display:flex;gap:4px;flex-wrap:wrap;padding:0 8px 6px;align-items:center}
#pvTools button{padding:2px 7px;font-size:11px}
#pvTools select{font-size:11px;padding:3px 5px}
#pxInfo{font:10px/1.5 ui-monospace,monospace;color:var(--dim);padding:2px 10px 8px;min-height:30px;white-space:pre-wrap}
.setRow{display:flex;align-items:center;gap:6px;padding:3px 10px}
.setRow label{flex:1;color:var(--dim)}
.setRow input[type=number]{width:64px}
.setRow select{max-width:140px}

/* timeline */
.tlBtns button{padding:2px 9px;font-size:12px}
#tlTime{font:11px ui-monospace,monospace;color:var(--dim);min-width:110px}
.dopeRow{display:flex;align-items:center;height:24px;border-bottom:1px solid var(--line)}
.dopeRow .rn{width:170px;flex:none;padding:0 8px;font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid var(--line)}
.dopeRow .tr{flex:1;position:relative;height:100%}
.dopeRow .ky{position:absolute;top:6px;width:11px;height:11px;background:var(--warn);transform:translateX(-5px) rotate(45deg);cursor:ew-resize;border:1px solid #0008}
.dopeRow .ky:hover{background:var(--acc2)}
.dopeRow select{font-size:9px;padding:0 2px;margin-left:4px;height:16px}
#playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--err);pointer-events:none;z-index:4}
#tlRuler{position:absolute;top:0;left:170px;right:0;height:14px;pointer-events:none}

/* HUD */
#hud{position:fixed;left:8px;bottom:158px;z-index:40;font:10px/1.6 ui-monospace,monospace;color:var(--txt);background:rgba(10,12,18,.78);border:1px solid var(--line);border-radius:7px;padding:5px 9px;pointer-events:none;white-space:pre}
[data-theme="light"] #hud{background:rgba(244,245,250,.85)}
#hud .bad{color:var(--err)} #hud .good{color:var(--ok)} #hud .warnC{color:var(--warn)}

/* toast + modal */
#toasts{position:fixed;top:48px;right:12px;z-index:100;display:flex;flex-direction:column;gap:6px;max-width:320px}
.toast{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:7px;padding:8px 12px;box-shadow:var(--shadow);animation:tin .18s ease-out}
.toast.err{border-left-color:var(--err)} .toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:200}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;width:min(520px,92vw);max-height:80vh;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
#modal .box textarea{min-height:160px;font:11px ui-monospace,monospace;resize:vertical;white-space:pre}
#modal .box .row{display:flex;gap:8px;justify-content:flex-end}
#empty{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);text-align:center;color:var(--dim);pointer-events:none;z-index:2}
#empty h2{color:var(--txt);margin-bottom:6px;font-weight:600}
#empty .hint{font-size:11px;opacity:.8}

.hidden{display:none!important}
@media (max-width:900px){
  #left,#right{position:absolute;top:0;bottom:0;z-index:30;transition:transform .2s}
  #left{transform:translateX(-100%)} #right{transform:translateX(100%);right:0}
  #left.open,#right.open{transform:none}
  #hud{bottom:8px}
  #timeline{height:120px}
}
.mobOnly{display:none}
@media (max-width:900px){.mobOnly{display:inline-flex}}
</style>
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="logo">◆ FORGE</div>
    <button class="mobOnly" id="mLeft">☰</button>
    <select id="presetSel" title="Presets"></select>
    <div class="sep"></div>
    <div class="tb">
      <button id="bUndo" title="Undo (Ctrl+Z)">↶</button>
      <button id="bRedo" title="Redo (Ctrl+Y)">↷</button>
    </div>
    <div class="sep"></div>
    <div class="tb">
      <button id="bAdd" title="Add node (double-click canvas or Ctrl+K)">＋ Node</button>
      <button id="bFrame" title="Frame selection">▭ Frame</button>
      <button id="bComment" title="Add comment note">✎ Note</button>
    </div>
    <div class="sep"></div>
    <div class="tb">
      <button id="bSave" title="Save project (Ctrl+S)">Save</button>
      <button id="bOpen" title="Open project">Open</button>
      <button id="bExport" title="Export menu">Export ▾</button>
    </div>
    <div class="sep"></div>
    <div class="tb">
      <button id="bPlay" title="Play/pause (Space)">▶</button>
      <input id="tlClock" type="number" step="0.1" style="width:64px" title="Time (s)" value="0">
    </div>
    <div style="flex:1"></div>
    <button class="mobOnly" id="mRight">Preview</button>
    <span id="projName" style="color:var(--dim)">untitled</span>
  </header>

  <div id="main">
    <aside id="left">
      <h3>Node Library</h3>
      <input id="palSearch" placeholder="Search nodes… (Ctrl+K)">
      <div id="palList"></div>
      <div id="inspector">
        <h3>Inspector</h3>
        <div id="inspBody"><div class="inspRow" style="color:var(--dim)">Select a node to edit its parameters.</div></div>
      </div>
    </aside>

    <div id="graphWrap" tabindex="0">
      <svg id="wires"></svg>
      <div id="world"></div>
      <div id="boxSel"></div><div id="guides"></div>
      <div id="minimap"><canvas id="mmCanvas"></canvas></div>
      <div id="cmdk"><input id="cmdkIn" placeholder="Type to search nodes…"><div id="cmdkList"></div></div>
      <div id="ctx"></div>
      <div id="empty" class="hidden">
        <h2>Empty graph</h2>
        <div class="hint">Double-click or press Ctrl+K to add nodes.<br>Drag from a port to connect. Feed an Output node to render.</div>
      </div>
    </div>

    <aside id="right">
      <h3>Preview</h3>
      <div id="pvBox" style="aspect-ratio:1/1"><canvas id="preview"></canvas></div>
      <div id="pvTools">
        <button id="pvFit" title="Fit">Fit</button>
        <button id="pv11" title="100%">1:1</button>
        <button id="pvTile" title="Tile preview">▦ <span id="pvTileN">1×</span></button>
        <button id="pvFreeze" title="Freeze reference">❄</button>
        <select id="pvDiag">
          <option value="final">Final color</option><option value="r">Red</option><option value="g">Green</option><option value="b">Blue</option>
          <option value="a">Alpha</option><option value="lum">Luminance</option><option value="normal">Normal (sel.)</option>
          <option value="node">Node output (sel.)</option><option value="range">Value range</option><option value="nan">NaN / invalid</option>
          <option value="dirty">Cached vs dirty (editor)</option>
        </select>
      </div>
      <div id="pxInfo">hover preview for pixel info · click freezes probe</div>
      <h3>Export</h3>
      <div class="setRow"><label>Export size</label><input id="expW" type="number" value="1024" min="16" max="8192"><span style="color:var(--dim)">×</span><input id="expH" type="number" value="1024" min="16" max="8192"></div>
      <div class="setRow"><button id="bPNG">PNG</button><button id="bWebM">WebM clip</button><button id="bGLSL">GLSL src</button><button id="bSeq" title="PNG frame sequence">Seq</button></div>
      <h3>Settings</h3>
      <div id="setBody"></div>
    </aside>
  </div>

  <footer id="timeline">
    <div id="tlTop">
      <div class="tlBtns">
        <button id="tlStart" title="To start">⏮</button><button id="tlBack" title="Frame back">◀|</button>
        <button id="tlPlay" title="Play/pause (Space)">▶</button>
        <button id="tlFwd" title="Frame forward">|▶</button><button id="tlEnd" title="To end">⏭</button>
      </div>
      <span id="tlTime">t=0.000 f=0</span>
      <label style="color:var(--dim)">dur <input id="tlDur" type="number" value="4" step="0.5" min="0.1" style="width:56px">s</label>
      <label style="color:var(--dim)">fps <input id="tlFps" type="number" value="30" min="1" max="120" style="width:48px"></label>
      <label style="color:var(--dim)"><input id="tlLoop" type="checkbox" checked> loop</label>
      <label style="color:var(--dim)"><input id="tlKey" type="checkbox"> auto-key</label>
      <button id="tlFit" title="Fit keys">fit</button>
    </div>
    <div id="dopeWrap"><div id="tlRuler"></div><div id="dope"></div><div id="playhead"></div></div>
  </footer>
</div>
<div id="hud"></div>
<div id="toasts"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<script>
'use strict';
/* ============================================================
   FORGE — node-based generative graphics studio (single file)
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
let UID=1; const uid=()=>UID++;
function toast(msg,kind){const d=document.createElement('div');d.className='toast '+(kind||'');d.textContent=msg;$('#toasts').appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .4s';setTimeout(()=>d.remove(),420)},3600)}
function modal(build){const m=$('#modal'),b=$('#modalBox');b.innerHTML='';build(b,()=>{m.style.display='none'});m.style.display='flex'}
function askText(title,val,cb){modal((b,close)=>{b.innerHTML=`<b>${title}</b>`;const t=document.createElement('textarea');t.value=val;b.appendChild(t);const r=document.createElement('div');r.className='row';const ok=document.createElement('button');ok.className='primary';ok.textContent='OK';ok.onclick=()=>{close();cb(t.value)};const no=document.createElement('button');no.textContent='Cancel';no.onclick=close;r.append(ok,no);b.appendChild(r);t.focus()})}
function askConfirm(title,msg,cb){modal((b,close)=>{b.innerHTML=`<b>${title}</b><div style="color:var(--dim)">${msg}</div>`;const r=document.createElement('div');r.className='row';const ok=document.createElement('button');ok.className='warn';ok.textContent='Confirm';ok.onclick=()=>{close();cb()};const no=document.createElement('button');no.textContent='Cancel';no.onclick=close;r.append(ok,no);b.appendChild(r)})}
const download=(name,blob)=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)};
const hex2rgb=h=>{h=h.replace('#','');return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255]};

/* ================= TYPES =================
   f = scalar, v2, v3, c4 = color(vec4), any = accepts all            */
const RANK={f:1,v2:2,v3:3,c4:4,any:0};
const TYC={f:'float',v2:'vec2',v3:'vec3',c4:'vec4',any:'float'};
const TYCLASS={f:'f',v2:'v2',v3:'v3',c4:'c4',any:'any'};
function canConvert(a,b){ if(a===b||b==='any'||a==='any')return true;
  if(a==='f')return true;                       // scalar splats up
  if(a==='v2')return b==='v3'||b==='c4';
  if(a==='v3')return b==='c4';
  return false; }                               // downgrades need Split/Channel nodes
function cvt(e,a,b){ if(a===b||b==='any')return e;
  if(a==='f'){if(b==='v2')return`vec2(${e})`;if(b==='v3')return`vec3(${e})`;if(b==='c4')return`vec4(vec3(${e}),1.)`;return e}
  if(a==='v2'){if(b==='v3')return`vec3(${e},0.)`;if(b==='c4')return`vec4(${e},0.,1.)`}
  if(a==='v3'&&b==='c4')return`vec4(${e},1.)`;
  if(a==='c4'&&b==='v3')return`(${e}).rgb`;
  return e; }
function outTyExpr(n,I,tys){ // resolve 'auto' outputs
  const d=DEFS[n.type];
  if(d.outTy)return d.outTy(n,I,tys);
  return null; }

/* ================= GLSL HELPER LIBRARY ================= */
const GLSL_LIB={
hash:`float hash12(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec2 hash22(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xx+q.yz)*q.zy);}
vec3 hash32(vec2 p){vec3 q=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xxy+q.yzz)*q.zyx);}`,
vnoise:`float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
 return mix(mix(hash12(i),hash12(i+vec2(1,0)),u.x),mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),u.x),u.y);}`,
gnoise:`float gnoise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*f*(f*(f*6.-15.)+10.);
 vec2 ga=hash22(i)*2.-1.,gb=hash22(i+vec2(1,0))*2.-1.,gc=hash22(i+vec2(0,1))*2.-1.,gd=hash22(i+vec2(1,1))*2.-1.;
 float a=dot(ga,f),b=dot(gb,f-vec2(1,0)),c=dot(gc,f-vec2(0,1)),d=dot(gd,f-vec2(1,1));
 return mix(mix(a,b,u.x),mix(c,d,u.x),u.y)*1.414;}`,
fbm:`float fbm(vec2 p,int oct,float gain,float lac){float v=0.,a=.5,f=1.;for(int i=0;i<10;i++){if(i>=oct)break;v+=a*gnoise(p*f);f*=lac;a*=gain;}return v;}
float fbmv(vec2 p,int oct,float gain,float lac){float v=0.,a=.5,f=1.;for(int i=0;i<10;i++){if(i>=oct)break;v+=a*vnoise(p*f);f*=lac;a*=gain;}return v;}
float ridged(vec2 p,int oct,float gain,float lac){float v=0.,a=.5,f=1.;for(int i=0;i<10;i++){if(i>=oct)break;v+=a*(1.-abs(gnoise(p*f)));f*=lac;a*=gain;}return v;}`,
voro:`vec3 voro(vec2 p,float j,float seed){vec2 ip=floor(p),fp=fract(p);float f1=8.,f2=8.;vec2 cell=vec2(0);
 for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){vec2 g=vec2(float(x),float(y));vec2 o=hash22(ip+g+seed)*j;vec2 r=g+o-fp;float d=dot(r,r);
 if(d<f1){f2=f1;f1=d;cell=ip+g;}else if(d<f2){f2=d;}}return vec3(sqrt(f1),sqrt(f2),hash12(cell));}`,
sdf:`float sdg(vec2 p,int sh,float a,float b){
 if(sh==0)return length(p)-a;                                  // circle
 if(sh==1){vec2 d=abs(p)-vec2(a);return length(max(d,0.))+min(max(d.x,d.y),0.)-b;} // round box
 if(sh==2)return abs(length(p)-a)-b;                           // ring
 if(sh==3){vec2 q=abs(p);return max(dot(q,vec2(.866,.5)),q.y)-a;}// hexagon-ish
 if(sh==4){vec2 q=vec2(abs(p.x),p.y);return max(q.x*.866+p.y*.5,-p.y)-a*.5;} // tri
 if(sh==5)return abs(p.y)-b*max(0.,a-abs(p.x))/max(a,.0001);    // line seg x
 float ang=atan(p.y,p.x),r=length(p);return r-a*(1.+b*sin(ang*5.));}`, // star/blob
grad:`float gradm(vec2 p,int m){if(m==0)return p.x;if(m==1)return p.y;if(m==2)return length(p);
 if(m==3)return atan(p.y,p.x)/6.28318+.5;if(m==4)return (p.x+p.y)*.5+.5;return max(abs(p.x),abs(p.y));}`,
blend:`vec3 blendm(vec3 a,vec3 b,int m,float t){
 vec3 r;if(m==0)r=b;else if(m==1)r=a+b;else if(m==2)r=a-b;else if(m==3)r=a*b;
 else if(m==4)r=1.-(1.-a)*(1.-b);else if(m==5)r=mix(2.*a*b,1.-2.*(1.-a)*(1.-b),step(.5,a));
 else if(m==6)r=abs(a-b);else if(m==7)r=max(a,b);else if(m==8)r=min(a,b);
 else if(m==9)r=a/(max(1.-b,1e-4));else r=b/max(1.-a,1e-4);return mix(a,clamp(r,0.,4.),t);}`,
tile:`vec3 tileuv(vec2 p,vec2 c,float mir){vec2 id=floor(p*c);vec2 f=fract(p*c);
 if(mir>.5){vec2 m=mod(id,2.);f=mix(f,1.-f,m);}return vec3(f,id.x+id.y*377.+1.);}`,
hsv:`vec3 hsv2rgb(vec3 c){vec3 p=abs(fract(c.xxx+vec3(0.,2./3.,1./3.))*6.-3.);return c.z*mix(vec3(1.),clamp(p-1.,0.,1.),c.y);}`,
ramp:`vec4 ramp8(float t,float pos[8],vec4 col[8],int cnt){t=clamp(t,0.,1.);
 if(t<=pos[0])return col[0];for(int i=1;i<8;i++){if(i>=cnt)return col[cnt-1];
 if(t<=pos[i]){float u=(t-pos[i-1])/max(pos[i]-pos[i-1],1e-5);return mix(col[i-1],col[i],u);}}return col[cnt-1];}`,
light:`vec4 light3(vec4 alb,vec3 n,vec3 L,float amb,float spec){float d=max(dot(n,normalize(L)),0.);
 vec3 h=normalize(normalize(L)+vec3(0,0,1));float s=pow(max(dot(n,h),0.),32.)*spec;
 return vec4(alb.rgb*(amb+d*(1.-amb))+s,alb.a);}`,
};

const MATH_OPS=['add','sub','mul','div','pow','min','max','mod','step','atan2','hypot','dist','abs','floor','ceil','fract','sqrt','exp','log','length','norm','dot'];
def('math',{t:'Math',cat:'Math',ins:[IN('a','a','any','P:a'),IN('b','b','any','P:b')],outs:[OUT('v','result','auto')],
 params:[P('op','op','sel',{opts:MATH_OPS,def:'add',structural:1}),P('av','a','float',{def:0,animatable:1}),P('b','b','float',{def:1,animatable:1})],
 outTy:(n,I)=>{const un=['abs','floor','ceil','fract','sqrt','exp','log','length','norm'].includes(n.params.op);
   if(n.params.op==='length'||n.params.op==='dot'||n.params.op==='dist')return'f';
   if(un)return(I.a&&I.a.ty)||'f'; return maxTy(I.a,I.b);},
 gen:(n,I,c)=>{const a=I.a?I.a.e:c.u(n,'av'),b=I.b?I.b.e:c.u(n,'b');const op=n.params.op;
   const B={add:`(${a}+${b})`,sub:`(${a}-${b})`,mul:`(${a}*${b})`,div:`(${a}/(${b}+1e-8))`,pow:`pow(abs(${a}),${b})`,min:`min(${a},${b})`,max:`max(${a},${b})`,mod:`mod(${a},${b})`,step:`step(${a},${b})`,atan2:`atan(${a},${b})`,hypot:`length(vec2(${a},${b}))`,dist:`distance(${a},${b})`,abs:`abs(${a})`,floor:`floor(${a})`,ceil:`ceil(${a})`,fract:`fract(${a})`,sqrt:`sqrt(abs(${a}))`,exp:`exp(${a})`,log:`log(abs(${a})+1e-8)`,length:`length(${a})`,norm:`normalize(${a})`,dot:`dot(${a},${b})`};
   return B[op]||`(0.)`;}});
function maxTy(a,b){const ta=a?a.ty:'f',tb=b?b.ty:'f';return RANK[ta]>=RANK[tb]?ta:tb}
def('remap',{t:'Remap',cat:'Math',ins:[IN('v','v','f','P:v')],outs:[OUT('v','out','f')],
 params:[P('v','v','float',{def:.5,animatable:1}),P('i0','in min','float',{def:0,animatable:1}),P('i1','in max','float',{def:1,animatable:1}),P('o0','out min','float',{def:0,animatable:1}),P('o1','out max','float',{def:1,animatable:1}),P('cl','clamp','bool',{def:true,structural:1})],
 gen:(n,I,c)=>{const v=I.v?I.v.e:c.u(n,'v');const inner=`((${v}-${c.u(n,'i0')})/(${c.u(n,'i1')}-${c.u(n,'i0')}+1e-8))`;
   return `mix(${c.u(n,'o0')},${c.u(n,'o1')},${n.params.cl?'clamp('+inner+',0.,1.)':inner})`;}});

/* substitute the canonical position token inside an expr (warp/blur) */
function subP(e,newp){return e.replace(/\bp\b/g,newp)}

/* ================= GRAPH VALIDATION ================= */
function ancestorsOf(ids){const seen=new Set();const st=[...ids];while(st.length){const id=st.pop();if(seen.has(id))continue;seen.add(id);
  for(const e of S.edges)if(e.to===id)st.push(e.from);}return seen}
function downstreamOf(id){const seen=new Set();const st=[id];while(st.length){const x=st.pop();if(seen.has(x))continue;seen.add(x);
  for(const e of S.edges)if(e.from===x)st.push(e.to);}return seen}
function wouldCycle(fromId,toId){return downstreamOf(toId).has(fromId)}
function topoOrder(ids){const ind={},adj={};ids.forEach(i=>{ind[i]=0;adj[i]=[]});
  for(const e of S.edges)if(ids.has(e.from)&&ids.has(e.to)){adj[e.from].push(e.to);ind[e.to]++}
  const q=Object.keys(ind).filter(k=>ind[k]==0).map(Number),out=[];
  while(q.length){const id=q.shift();out.push(id);for(const m of adj[id])if(--ind[m]==0)q.push(m)}
  return out}

/* ================= COMPILE GRAPH -> GLSL ================= */
let uniforms={};   // name -> {type:'float|vec2|vec3|vec4|int|float[8]|vec4[8]', node,param}
let compiledMeta={order:[],exprTy:{},lineNode:{},used:new Set()};

function collectUniforms(){
  uniforms={u_res:{type:'vec2'},u_time:{type:'float'},u_dur:{type:'float'},u_frame:{type:'float'},
    u_seed:{type:'float'},u_aspect:{type:'float'},u_diag:{type:'int'},u_pv:{type:'int'},u_range:{type:'vec2'}};
  for(const n of S.nodes){const d=DEFS[n.type]||DEFS.missing;
    for(const p of d.params){
      if(p.kind==='float'||p.kind==='int')uniforms[`u_${n.id}_${p.k}`]={type:'float',node:n,param:p};
      else if(p.kind==='vec2')uniforms[`u_${n.id}_${p.k}`]={type:'vec2',node:n,param:p};
      else if(p.kind==='vec3')uniforms[`u_${n.id}_${p.k}`]={type:'vec3',node:n,param:p};
      else if(p.kind==='color')uniforms[`u_${n.id}_${p.k}`]={type:'vec3',node:n,param:p};
      else if(p.kind==='ramp'){uniforms[`u_${n.id}_pos`]={type:'float8',node:n,param:p};uniforms[`u_${n.id}_col`]={type:'vec48',node:n,param:p};uniforms[`u_${n.id}_cnt`]={type:'int',node:n,param:p};}}}
}
function animVal(node,p,t){
  const tr=S.anim[node.id]&&S.anim[node.id][p.k];
  if(!tr||!tr.keys.length)return node.params[p.k]!==undefined?node.params[p.k]:p.def;
  const ks=tr.keys;if(t<=ks[0].t)return ks[0].v;if(t>=ks[ks.length-1].t)return ks[ks.length-1].v;
  for(let i=0;i<ks.length-1;i++){const a=ks[i],b=ks[i+1];if(t>=a.t&&t<=b.t){const u=(t-a.t)/Math.max(b.t-a.t,1e-6);
    const it=a.interp||tr.interp||'linear';
    const f=it==='step'?0:it==='smooth'?u*u*(3-2*u):u;
    if(Array.isArray(a.v))return a.v.map((x,j)=>lerp(x,b.v[j],f));return lerp(a.v,b.v,f)}}
  return ks[0].v;
}
function paramVal(node,p){return animVal(node,p,S.tl.t)}

function compile(){
  collectUniforms();compileErr=null;errNodes.clear();
  const outputs=S.nodes.filter(n=>n.type==='output');
  const pvNode=S.nodes.find(n=>n.id===S.previewNodeId);
  const need=new Set(ancestorsOf(outputs.map(o=>o.id)));
  if(pvNode&&need.has(pvNode.id)===false){ancestorsOf([pvNode.id]).forEach(i=>need.add(i))}
  compiledMeta.used=need;
  const order=topoOrder(need);compiledMeta.order=order;
  const fnsNeeded=new Set(),body=[],lineNode={};let curLine=0;
  const push=(s,nid)=>{body.push(s);curLine+=s.split('\n').length;lineNode[curLine]=nid};
  const ctx={f:k=>fnsNeeded.add(k),u:(n,k)=>`u_${n.id}_${k}`};
  const exprTy={};
  const orderSet=new Set(order);
  /* raw fully-inlined exprs (contain bare 'p') for resampling inputs */
  const rawMemo={};let rawBudget=400000;
  const rawOf=(nid,pk)=>{
    const key=nid+'_'+pk;if(rawMemo[key]!==undefined)return rawMemo[key];
    const n=nodeById(nid),d=DEFS[n.type];if(!d)return'0.';
    const I={};
    for(const inp of d.ins){const e=S.edges.find(e=>e.to===nid&&e.toPort===inp.k);
      if(e&&orderSet.has(e.from)){const sn=nodeById(e.from);const sd=DEFS[sn.type]||DEFS.missing;
        const sout=sd.outs.find(o=>o.k===e.fromPort);const sty=sout?resolveOutTy(sn,sout,e.fromPort):'f';
        I[inp.k]={e:cvt(rawOf(e.from,e.fromPort),sty,inp.ty),ty:inp.ty==='any'?sty:inp.ty}}}
    let out;try{out=d.gen(n,I,ctx)}catch(err){out={}}
    rawMemo[nid]=typeof out==='string'?{[d.outs[0]?d.outs[0].k:'v']:out}:out;
    const r=rawMemo[nid][pk]||'0.';
    rawBudget-=r.length;if(rawBudget<0)errNodes.set(nid,'expression too large (resample chain)');
    return r};
  for(const nid of order){const n=nodeById(nid);const d=DEFS[n.type];
    if(!d){errNodes.set(nid,'unknown node type');continue}
    const I={};let bad=false;
    for(const inp of d.ins){const e=S.edges.find(e=>e.to===nid&&e.toPort===inp.k);
      if(e&&!order.includes(e.from)){errNodes.set(nid,`input "${inp.l}" is in a cycle — dropped`);bad=true;continue}
      if(e){const sn=nodeById(e.from);const sd=DEFS[sn.type]||DEFS.missing;
        const sout=sd.outs.find(o=>o.k===e.fromPort);const sty=resolveOutTy(sn,sout,e.fromPort);
        if(!canConvert(sty,inp.ty)){errNodes.set(nid,`type mismatch on "${inp.l}"`);bad=true;continue}
        const isRs=(d.rsIns||[]).includes(inp.k);
        const src=isRs?rawOf(e.from,e.fromPort):`v${e.from}_${e.fromPort}`;
        I[inp.k]={e:cvt(src,sty,inp.ty),ty:inp.ty==='any'?sty:inp.ty};}}
    if(bad)continue;
    try{const out=d.gen(n,I,ctx);
      if(typeof out==='string'){if(d.outs[0]){const ty=resolveOutTy(n,d.outs[0],d.outs[0].k);
        push(`  ${TYC[ty]} v${nid}_${d.outs[0].k} = ${out}; // ${d.t}`,nid);exprTy[`${nid}_${d.outs[0].k}`]=ty;}}
      else{for(const o of d.outs){if(!out[o.k])continue;const ty=resolveOutTy(n,o,o.k);
        push(`  ${TYC[ty]} v${nid}_${o.k} = ${out[o.k]};`,nid);exprTy[`${nid}_${o.k}`]=ty;}}
    }catch(err){errNodes.set(nid,'gen: '+err.message)}}
  // final color
  let fin='vec4(0.)';
  if(outputs.length){const o=outputs[0];const e=S.edges.find(e=>e.to===o.id&&e.toPort==='in');
    if(e){const sn=nodeById(e.from);const sd=DEFS[sn.type];const sout=sd&&sd.outs.find(x=>x.k===e.fromPort);
      const sty=sout?resolveOutTy(sn,sout,e.fromPort):'f';
      fin=cvt(`v${e.from}_${e.fromPort}`,sty,'c4')+`*u_${o.id}_pbr`;}
    else fin=`vec4(u_${o.id}_c,1.)`;}
  push(`  vec4 col = ${fin};`,outputs[0]&&outputs[0].id);
  // node preview override
  const pvExpr=[];
  for(const nid of order){const n2=nodeById(nid);const d2=DEFS[n2.type];if(!d2||!d2.outs.length)continue;
    const o2=d2.outs[0];const ty2=resolveOutTy(n2,o2,o2.k);
    if(exprTy[`${nid}_${o2.k}`])pvExpr.push(`  if(u_pv==${nid}) col = ${cvt(`v${nid}_${o2.k}`,ty2,'c4')};`)}
  body.push(...pvExpr);
  // header
  const udecl=Object.entries(uniforms).map(([k,u])=>{
    const t=u.type;return`uniform ${t==='float8'?'float':t==='vec48'?'vec4':t==='vec2'?'vec2':t==='vec3'?'vec3':t==='vec4'?'vec4':t==='int'?'int':'float'} ${k}${t==='float8'?'[8]':t==='vec48'?'[8]':''};`}).join('\n');
  const fsrc=Object.keys(GLSL_LIB).filter(k=>fnsNeeded.has(k)).map(k=>GLSL_LIB[k]).join('\n');
  const src=`precision highp float;
${udecl}
out vec4 frag;
${fsrc}
void main(){
  vec2 uv0=gl_FragCoord.xy/u_res;
  vec2 p=vec2(uv0.x*u_aspect,uv0.y);
${body.join('\n')}
  int nan = (col.r!=col.r||col.g!=col.g||col.b!=col.b||col.a!=col.a)?1:0;
  if(u_diag==1)col=vec4(col.rrr,1.);
  else if(u_diag==2)col=vec4(col.ggg,1.);
  else if(u_diag==3)col=vec4(col.bbb,1.);
  else if(u_diag==4)col=vec4(col.aaa,1.);
  else if(u_diag==5)col=vec4(vec3(dot(col.rgb,vec3(.299,.587,.114))),1.);
  else if(u_diag==6)col=vec4(col.rgb*.5+.5,1.);
  else if(u_diag==8)col=vec4((col.rgb-u_range.x)/max(u_range.y-u_range.x,1e-5),1.);
  else if(u_diag==9)col=nan>0?vec4(1.,0.,1.,1.):vec4(col.rgb*.15,1.);

  else if(g.kind==='move'){const dx=(e.clientX-g.sx)/S.view.z,dy=(e.clientY-g.sy)/S.view.z;
    if(Math.abs(dx)+Math.abs(dy)>2)g.moved=true;
    let gx=null,gy=null;
    for(const id of g.ids){const n=nodeById(id);let nx=g.start[id].x+dx,ny=g.start[id].y+dy;
      if(S.settings.snap){nx=Math.round(nx/S.settings.grid)*S.settings.grid;ny=Math.round(ny/S.settings.grid)*S.settings.grid}
      // alignment guides: snap within 6 world units to other node edges/centers
      for(const o of S.nodes){if(g.ids.includes(o.id))continue;
        for(const c of [o.x,o.x+95,o.x+190])if(Math.abs(nx-c)<6){nx=c;gx=c}
        for(const c of [o.y,o.y+55,o.y+110])if(Math.abs(ny-c)<6){ny=c;gy=c}}
      n.x=nx;n.y=ny;const el=nodeEl[id];if(el){el.style.left=nx+'px';el.style.top=ny+'px'}}
    const gd=$('#guides');gd.innerHTML='';
    if(gx!==null){const d=document.createElement('div');d.className='g gv';d.style.left=(gx*S.view.z+S.view.x)+'px';gd.appendChild(d)}
    if(gy!==null){const d=document.createElement('div');d.className='g gh';d.style.top=(gy*S.view.z+S.view.y)+'px';gd.appendChild(d)}
    drawWires()}
  else if(g.kind==='moveF'){const dx=(e.clientX-g.sx)/S.view.z,dy=(e.clientY-g.sy)/S.view.z;g.moved=true;
    g.f.x=g.fx+dx;g.f.y=g.fy+dy;for(const o of g.nodes){o.n.x=o.x+dx;o.n.y=o.y+dy;
      const el=nodeEl[o.n.id];if(el){el.style.left=o.n.x+'px';el.style.top=o.n.y+'px'}}
    const fe=world.querySelector(`.frame`);renderFramesOnly();drawWires()}
  else if(g.kind==='fres'){g.f.w=Math.max(60,g.ow+(e.clientX-g.sx)/S.view.z);g.f.h=Math.max(40,g.oh+(e.clientY-g.sy)/S.view.z);renderFramesOnly()}
  else if(g.kind==='wire'){
    const c=e.clientX-wrap.getBoundingClientRect().left,d=e.clientY-wrap.getBoundingClientRect().top;
    const a=wpos[g.fromKey];if(a)dragWire={a,b:{x:c,y:d}};
    const tgt=portAt(e.clientX,e.clientY);let compat=tgt?compatible(g.fromKey,tgt):null;
    $$('.port.hi').forEach(x=>x.classList.remove('hi'));
    if(tgt&&compat&&!compat.err){const[tid,tk,tio]=tgt.split(':');const je=$(`.jack[data-n="${tid}"][data-k="${tk}"][data-io="${tio}"]`);
      if(je)je.closest('.port').classList.add('hi')}
    drawWires();}
});
function renderSelOnly(){$$('.node').forEach(el=>el.classList.toggle('sel',S.sel.has(+el.dataset.id)))}
function renderFramesOnly(){// cheap: rebuild frames
  world.querySelectorAll('.frame').forEach(el=>el.remove());
  const frag=document.createDocumentFragment();for(const f of S.frames)frag.appendChild(frameEl(f));
  world.insertBefore(frag,world.firstChild)}
function endGesture(e){const g=gesture;gesture=null;boxSel.style.display='none';$('#guides').innerHTML='';
  if(!g)return;
  if(g.kind==='wire'){dragWire=null;const tgt=e?portAt(e.clientX,e.clientY):null;
    if(tgt){const c=compatible(g.fromKey,tgt);
      if(c&&!c.err){S.edges=S.edges.filter(x=>!(x.to===c.to&&x.toPort===c.toPort));
        S.edges.push({id:uid(),...c});commit('connect');toast(`connected ${c.from}.${c.fromPort} → ${c.to}.${c.toPort}`,'ok')}
      else if(c&&c.err){if(g.replacing)S.edges.push(g.replacing);toast('✕ '+c.err,'err');renderNodes()}}
    else{if(g.replacing){commit('disconnect');toast('wire disconnected')}else renderNodes()}
    $$('.port.hi').forEach(x=>x.classList.remove('hi'));}
  else if((g.kind==='move'&&g.moved)||(g.kind==='moveF'&&g.moved)||g.kind==='fres')commit('move');
  else if(g.kind==='box')renderNodes();
}

/* ---- node actions ---- */
function addNode(type,x,y,params){
  if(S.nodes.length>=S.settings.maxNodes){toast(`node cap ${S.settings.maxNodes} reached`,'err');return null}
  const d=DEFS[type];const n={id:uid(),type,x:x??(sc2w(wrap.clientWidth/2,wrap.clientHeight/2).x),y:y??(sc2w(0,0).y),params:{},collapsed:false};
  for(const p of d.params)n.params[p.k]=p.def!==undefined?JSON.parse(JSON.stringify(p.def)):0;
  S.nodes.push(n);if(params)Object.assign(n.params,params);
  dirtyNodes.add(n.id);commit('add node');return n;
}
function deleteNodes(ids){const s=new Set(ids);S.nodes=S.nodes.filter(n=>!s.has(n.id));
  S.edges=S.edges.filter(e=>!s.has(e.from)&&!s.has(e.to));
  for(const id of ids){delete S.anim[id];dirtyNodes.delete(id);errNodes.delete(id)}
  commit('delete');renderDope()}
function duplicateNodes(ids){const map={},news=[];
  for(const id of ids){const n=nodeById(id);if(!n)continue;const c=JSON.parse(JSON.stringify(n));c.id=uid();c.x+=30;c.y+=30;map[id]=c.id;news.push(c);S.nodes.push(c)}
  for(const e of S.edges.slice())if(map[e.from]&&map[e.to])S.edges.push({id:uid(),from:map[e.from],fromPort:e.fromPort,to:map[e.to],toPort:e.toPort});
  for(const id of ids)if(map[id]&&S.anim[id])S.anim[map[id]]=JSON.parse(JSON.stringify(S.anim[id]));
  S.sel=new Set(news.map(n=>n.id));news.forEach(n=>dirtyNodes.add(n.id));commit('duplicate')}
function frameSelection(){if(!S.sel.size){toast('select nodes first');return}
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;S.sel.forEach(id=>{const n=nodeById(id);x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+200);y1=Math.max(y1,n.y+140)});
  const hue=Math.floor(Math.random()*360);
  S.frames.push({id:uid(),x:x0-24,y:y0-36,w:x1-x0+48,h:y1-y0+60,title:'group',color:`hsl(${hue} 70% 60%)`});commit('frame')}
function copyNodes(){if(!S.sel.size)return;const ids=S.sel;
  const data={nodes:S.nodes.filter(n=>ids.has(n.id)).map(n=>JSON.parse(JSON.stringify(n))),
    edges:S.edges.filter(e=>ids.has(e.from)&&ids.has(e.to)).map(e=>JSON.parse(JSON.stringify(e))),
    anim:JSON.parse(JSON.stringify(Object.fromEntries([...ids].filter(i=>S.anim[i]).map(i=>[i,S.anim[i]]))))};
  clipboard=data;try{navigator.clipboard.writeText(JSON.stringify({forgeClip:1,...data}))}catch(e){}
  toast(`copied ${data.nodes.length} node(s)`)}
let clipboard=null;
function pasteInternal(pt){let data=clipboard;
  const finish=d=>{if(!d||!d.nodes)return;const map={};const news=[];
    for(const n0 of d.nodes){const n=JSON.parse(JSON.stringify(n0));const old=n.id;n.id=uid();
      n.x=(pt?pt.x:100)+(n.x-d.nodes[0].x);n.y=(pt?pt.y:100)+(n.y-d.nodes[0].y);map[old]=n.id;news.push(n);S.nodes.push(n)}
    for(const e of d.edges)if(map[e.from]&&map[e.to])S.edges.push({id:uid(),from:map[e.from],fromPort:e.fromPort,to:map[e.to],toPort:e.toPort});
    for(const k in (d.anim||{}))if(map[k])S.anim[map[k]]=JSON.parse(JSON.stringify(d.anim[k]));
    S.sel=new Set(news.map(n=>n.id));news.forEach(n=>dirtyNodes.add(n.id));commit('paste');renderDope()};
  if(navigator.clipboard&&navigator.clipboard.readText){navigator.clipboard.readText().then(t=>{try{const j=JSON.parse(t);if(j.forgeClip){finish(j);return}}catch(e){}finish(data)}).catch(()=>finish(data))}
  else finish(data)}

      kb.onclick=()=>{if(tr&&tr.keys.length){if(confirm('remove keys?')){delete S.anim[n.id][p.k];renderDope();refreshInspector()}}

/* ---- minimap ---- */
const mmCv=$('#mmCanvas'),mmCtx=mmCv.getContext('2d');
function drawMinimap(){mmCv.width=150*devicePixelRatio;mmCv.height=100*devicePixelRatio;mmCtx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  mmCtx.clearRect(0,0,150,100);if(!S.nodes.length)return;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of S.nodes){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+200);y1=Math.max(y1,n.y+140)}
  const wr=wrap.getBoundingClientRect();
  x0=Math.min(x0,-S.view.x/S.view.z);y0=Math.min(y0,-S.view.y/S.view.z);
  x1=Math.max(x1,(-S.view.x+wr.width)/S.view.z);y1=Math.max(y1,(-S.view.y+wr.height)/S.view.z);
  const sc=Math.min(150/(x1-x0),100/(y1-y0))*.92;
  const ox=(150-(x1-x0)*sc)/2,oy=(100-(y1-y0)*sc)/2;
  const cs=getComputedStyle(document.documentElement);
  for(const f of S.frames){mmCtx.fillStyle=(f.color||'#7c6cff')+'22';mmCtx.fillRect(ox+(f.x-x0)*sc,oy+(f.y-y0)*sc,f.w*sc,f.h*sc)}
  for(const n of S.nodes){mmCtx.fillStyle=S.sel.has(n.id)?'#39d0d8':'#8b94ab';
    mmCtx.fillRect(ox+(n.x-x0)*sc,oy+(n.y-y0)*sc,Math.max(3,190*sc),Math.max(2,110*sc))}
  mmCtx.strokeStyle='#ffb454';mmCtx.lineWidth=1;
  mmCtx.strokeRect(ox+(-S.view.x/S.view.z-x0)*sc,oy+(-S.view.y/S.view.z-y0)*sc,wr.width/S.view.z*sc,wr.height/S.view.z*sc);
  mmCv._map={x0,y0,sc,ox,oy}}
$('#minimap').addEventListener('pointerdown',e=>{e.stopPropagation();const m=mmCv._map;if(!m)return;
  const mv=ev=>{const r=mmCv.getBoundingClientRect();const wx=(ev.clientX-r.left-m.ox)/m.sc+m.x0,wy=(ev.clientY-r.top-m.oy)/m.sc+m.y0;
    const wr=wrap.getBoundingClientRect();S.view.x=-(wx)*S.view.z+wr.width/2;S.view.y=-(wy)*S.view.z+wr.height/2;applyView()};
  mv(e);const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)});

/* ---- undo/redo ---- */
const hist=[],histI={i:-1};
function snapshot(){return JSON.stringify({nodes:S.nodes,edges:S.edges,frames:S.frames,anim:S.anim,tl:S.tl})}
function pushHist(why){hist.splice(histI.i+1);hist.push(snapshot());if(hist.length>100)hist.shift();histI.i=hist.length-1}
function restore(s){const j=JSON.parse(s);S.nodes=j.nodes;S.edges=j.edges;S.frames=j.frames;S.anim=j.anim;Object.assign(S.tl,j.tl||{});
  S.sel.clear();S.selEdges.clear();dirtyNodes.clear();S.nodes.forEach(n=>dirtyNodes.add(n.id));needsCompile=true;renderNodes();renderDope()}
function undo(){if(histI.i>0){histI.i--;restore(hist[histI.i]);toast('undo')}}
function redo(){if(histI.i<hist.length-1){histI.i++;restore(hist[histI.i]);toast('redo')}}
function commit(why){pushHist(why);needsCompile=true;renderNodes();scheduleSave()}
function commitNoRender(){pushHist();needsCompile=true;scheduleSave()}

/* ---- keyboard ---- */
document.addEventListener('keydown',e=>{
  const inField=/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName);
  if(e.key===' '&&e.target===document.body||e.code==='Space'&&!inField){/*play*/ }
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openCmdk();return}
  if(inField)return;
  if(e.code==='Space'){e.preventDefault();togglePlay();return}
  if(e.code==='Space'||e.key===' '){spaceDown=true}
  if((e.ctrlKey||e.metaKey)&&e.key==='z'&&!e.shiftKey){e.preventDefault();undo()}
  else if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();redo()}
  else if((e.ctrlKey||e.metaKey)&&e.key==='c'){copyNodes()}
  else if((e.ctrlKey||e.metaKey)&&e.key==='v'){pasteInternal()}
  else if((e.ctrlKey||e.metaKey)&&e.key==='d'){e.preventDefault();duplicateNodes([...S.sel])}
  else if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveProject()}
  else if(e.key==='Delete'||e.key==='Backspace'){if(S.selEdges.size){S.edges=S.edges.filter(x=>!S.selEdges.has(x.id));S.selEdges.clear();commit('del wire')}
    else if(S.sel.size)deleteNodes([...S.sel]);
    if(S.selFrames&&S.selFrames.size){S.frames=S.frames.filter(f=>!S.selFrames.has(f.id));S.selFrames.clear();commit('del frame')}}
  else if(e.key==='f'&&!e.ctrlKey){frameSelection()}
  else if(e.key==='Escape'){S.sel.clear();S.selEdges.clear();closeCmdk();renderNodes()}
});
document.addEventListener('keyup',e=>{if(e.key===' ')spaceDown=false});
window.addEventListener('blur',()=>{spaceDown=false;if(gesture&&gesture.kind==='wire'&&gesture.replacing)S.edges.push(gesture.replacing);gesture=null;dragWire=null});

/* ================= TIMELINE ================= */
function addKey(n,p,t,v){S.anim[n.id]=S.anim[n.id]||{};const tr=S.anim[n.id][p.k]=S.anim[n.id][p.k]||{keys:[],interp:'smooth'};
  const ex=tr.keys.find(k=>Math.abs(k.t-t)<1e-4);const vv=Array.isArray(v)?v.slice():v;
  if(ex)ex.v=vv;else tr.keys.push({t,v:vv,interp:tr.interp});tr.keys.sort((a,b)=>a.t-b.t);
  scheduleSave();renderDope();refreshInspector()}
function renderDope(){const d=$('#dope');d.innerHTML='';const dur=S.tl.dur;
  const rows=[];
  for(const nid in S.anim)for(const pk in S.anim[nid]){const tr=S.anim[nid][pk];if(tr.keys.length)rows.push({nid:+nid,pk,tr})}

/* ---- ramp editor ---- */
function rampEditor(n,p){modal((b,close)=>{const st=(n.params[p.k]||p.def).map(s=>({...s}));
  b.innerHTML='<b>Color ramp</b>';
  const cv=document.createElement('canvas');cv.width=480;cv.height=70;cv.style.cssText='width:100%;border-radius:6px;border:1px solid var(--line)';b.appendChild(cv);
  const info=document.createElement('div');info.style.cssText='color:var(--dim);font-size:11px';info.textContent='double-click bar to add stop · drag to move · click stop then color picker · right-click removes';b.appendChild(info);
  const cp=document.createElement('input');cp.type='color';cp.style.display='none';b.appendChild(cp);
  let selS=null;const draw=()=>{const c2=cv.getContext('2d');const g=c2.createLinearGradient(0,0,480,0);
    st.forEach(s=>g.addColorStop(s.p,s.c));c2.fillStyle=g;c2.fillRect(0,0,480,70);
    st.forEach(s=>{c2.fillStyle=s===selS?'#fff':'#000';c2.strokeStyle='#000';c2.beginPath();
      c2.rect(s.p*480-4,58,8,10);c2.fill();c2.stroke()})};draw();
  const pos=ev=>{const r=cv.getBoundingClientRect();return clamp((ev.clientX-r.left)/r.width,0,1)};
  cv.addEventListener('pointerdown',ev=>{selS=st.reduce((a,s)=>Math.abs(s.p-pos(ev))<Math.abs((a||{p:9}).p-pos(ev))?s:a,null);
    if(Math.abs(selS.p-pos(ev))>.02)selS=null;else cp.value=selS.c;draw();
    const mv=e2=>{if(selS){selS.p=pos(e2);st.sort((a,b)=>a.p-b.p);draw()}};const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};
    window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)});
  cv.addEventListener('dblclick',ev=>{const s={p:pos(ev),c:'#ffffff'};st.push(s);st.sort((a,b)=>a.p-b.p);selS=s;cp.value='#fff';draw()});
  cv.addEventListener('contextmenu',ev=>{ev.preventDefault();const s=st.reduce((a,x)=>Math.abs(x.p-pos(ev))<Math.abs((a||{p:9}).p-pos(ev))?x:a,null);
    if(s&&st.length>2){st.splice(st.indexOf(s),1);draw()}});
  cp.oninput=()=>{if(selS){selS.c=cp.value;draw()}};
  cv.addEventListener('click',()=>{if(selS)cp.click()});
  const r=document.createElement('div');r.className='row';
  const ok=document.createElement('button');ok.className='primary';ok.textContent='Apply';
  ok.onclick=()=>{n.params[p.k]=st;markDirty(n,'param');uniformsDirty=true;close()};
  const no=document.createElement('button');no.textContent='Cancel';no.onclick=close;r.append(ok,no);b.appendChild(r)})}

const pvCtx=pvCanvas.getContext('2d');let framePix=null,pvDrag=null;

/* ================= RENDER LOOP ================= */
let uniformsDirty=true,thumbsDirty=true,lastT=performance.now();
function frameLoop(now){
  requestAnimationFrame(frameLoop);
  const dt=Math.min((now-lastT)/1000,.1);lastT=now;fpsAvg=lerp(fpsAvg,1/Math.max(dt,.0001),.06);
  if(S.tl.playing){S.tl.t+=dt;if(S.tl.t>S.tl.dur){if(S.tl.loop)S.tl.t-=S.tl.dur;else{S.tl.t=S.tl.dur;togglePlay()}}syncTl()}
  if(needsCompile&&gl){const src=compile();lastGLSL=src;
    if(buildProgram(src)){lastCompileOK=true;dirtyNodes.clear();diagDirty=false}else{lastCompileOK=false;
      if(compileErr&&compileErr.node){toast(`shader error @ node #${compileErr.node}`,'err')}else toast('shader compile error — keeping last valid frame','err')}
    needsCompile=false;uniformsDirty=true;renderNodes()}
  const res=S.preview.res;const frame=Math.floor(S.tl.t*S.tl.fps);
  if(progOKCheck()){renderToCanvas(res,res);readFrame(res)}
  if(S.preview.mode==='dirty'&&frameEvery%20===0)$$('.node').forEach(el=>{const id=+el.dataset.id;
    el.classList.toggle('dirtyN',dirtyNodes.has(id));el.classList.toggle('cachedN',!dirtyNodes.has(id)&&!errNodes.has(id))});
  drawPreview();renderThumbs();
}
let frameEvery=0;
function progOKCheck(){return gl&&prog&&!needsCompile}
function renderToCanvas(w,h){glc.width=w;glc.height=h;gl.viewport(0,0,w,h);
  const t0=performance.now();
  gl.useProgram(prog);setUniforms(S.tl.t,Math.floor(S.tl.t*S.tl.fps),w,h,S.settings.seed);
  gl.bindBuffer(gl.ARRAY_BUFFER,quad);const la=gl.getAttribLocation(prog,'a');
  gl.enableVertexAttribArray(la);gl.vertexAttribPointer(la,2,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.TRIANGLES,0,3);evalMs=performance.now()-t0;}
const pixBuf={w:0,arr:null};
function readFrame(res){if(!pixBuf.arr||pixBuf.w!==res){pixBuf.arr=new Uint8Array(res*res*4);pixBuf.w=res}
  gl.readPixels(0,0,res,res,gl.RGBA,gl.UNSIGNED_BYTE,pixBuf.arr);
  if(S.preview.mode==='range'){let lo=255,hi=0;for(let i=0;i<pixBuf.arr.length;i+=16){const v=pixBuf.arr[i];if(v<lo)lo=v;if(v>hi)hi=v}
    S.rangeMin=lerp(S.rangeMin||0,lo/255,.3);S.rangeMax=lerp(S.rangeMax||1,Math.max(hi,lo+8)/255,.3)}
  const img=new ImageData(new Uint8ClampedArray(pixBuf.arr),res,res);flipY(img);framePix=img}
function flipY(img){const w=img.width,h=img.height,d=img.data;const row=new Uint8ClampedArray(w*4);
  for(let y=0;y<h/2;y++){const a=y*w*4,b=(h-1-y)*w*4;row.set(d.subarray(a,a+w*4));d.copyWithin(a,b,b+w*4);d.set(row,b)}}
function renderThumbs(){if(!gl||!prog)return;if(!S.settings.cachePrev){thumbsDirty=true}
  if(!thumbsDirty&&frameEvery%30!==0){frameEvery++;return}
  thumbsDirty=false;let count=0;
  const q=S.settings.nodePrevQ;
  for(const n of S.nodes){if(!n._thumb||count>=8)continue;const d=DEFS[n.type];if(!d||!d.outs.length)continue;
    if(!compiledMeta.used.has(n.id)){const c2=n._thumb.getContext('2d');c2.fillStyle='#111';c2.fillRect(0,0,q,q);
      c2.fillStyle='#556';c2.font='9px sans-serif';c2.fillText('not connected',4,14);continue}
    gl.viewport(0,0,q,q);gl.useProgram(prog);
    const savedPv=S.previewNodeId;const loc=uloc['u_pv'];
    setUniforms(S.tl.t,Math.floor(S.tl.t*S.tl.fps),q,q,S.settings.seed);
    if(loc)gl.uniform1i(loc,n.id);const dl=uloc['u_diag'];if(dl)gl.uniform1i(dl,0);

    const arr=new Uint8Array(q*q*4);gl.readPixels(0,0,q,q,gl.RGBA,gl.UNSIGNED_BYTE,arr);
    const img=new ImageData(new Uint8ClampedArray(arr),q,q);flipY(img);
    n._thumb.getContext('2d').putImageData(img,0,0);count++}
  if(count){gl.viewport(0,0,glc.width,glc.height)}frameEvery++}

/* ================= PERSISTENCE ================= */
function serialize(){return{app:'forge',v:1,name:S.name,
  nodes:S.nodes.map(n=>({id:n.id,type:n.type,missingType:n.missingType,x:n.x,y:n.y,params:n.params,collapsed:n.collapsed,showPrev:n.showPrev})),
  edges:S.edges.map(e=>({from:e.from,fromPort:e.fromPort,to:e.to,toPort:e.toPort})),
  frames:S.frames,anim:S.anim,tl:S.tl,view:S.view,settings:S.settings,preview:{res:S.preview.res,mode:S.preview.mode,tile:S.preview.tile}}}
function validateProject(j){
  if(!j||j.app!=='forge')return'missing forge marker';
  if(!Array.isArray(j.nodes)||!Array.isArray(j.edges))return'nodes/edges missing';
  if(j.nodes.length>2000)return'too many nodes';
  for(const n of j.nodes)if(typeof n.id!=='number'||typeof n.x!=='number'||typeof n.type!=='string')return'malformed node';
  for(const e of j.edges)if(typeof e.from!=='number'||typeof e.to!=='number')return'malformed edge';
  return null}
function loadProject(j){
  const err=validateProject(j);if(err){toast('load failed: '+err,'err');return false}
  UID=1;S.nodes=j.nodes.map(n=>{UID=Math.max(UID,n.id+1);const nn={id:n.id,type:n.type,x:+n.x||0,y:+n.y||0,params:{},collapsed:!!n.collapsed,showPrev:n.showPrev};
    const d=DEFS[n.type];if(!d){nn.type='missing';nn.missingType=n.type;toast(`unknown node type "${n.type}" → placeholder`,'err')}
    const dd=DEFS[nn.type];for(const p of dd.params)nn.params[p.k]=p.def!==undefined?JSON.parse(JSON.stringify(p.def)):0;
    Object.assign(nn.params,n.params||{});return nn});
  S.edges=j.edges.map(e=>({id:uid(),from:e.from,fromPort:e.fromPort,to:e.to,toPort:e.toPort}))
    .filter(e=>nodeById(e.from)&&nodeById(e.to));
  S.frames=j.frames||[];S.anim=j.anim||{};Object.assign(S.tl,j.tl||{});
  Object.assign(S.view,j.view||{});Object.assign(S.settings,j.settings||{});
  if(j.preview)Object.assign(S.preview,{res:j.preview.res||384,mode:j.preview.mode||'final',tile:j.preview.tile||1});
  S.name=j.name||'untitled';$('#projName').textContent=S.name;
  S.sel.clear();S.selEdges.clear();dirtyNodes.clear();S.nodes.forEach(n=>dirtyNodes.add(n.id));
  errNodes.clear();hist.length=0;histI.i=-1;pushHist('load');
  $('#tlDur').value=S.tl.dur;$('#tlFps').value=S.tl.fps;$('#tlLoop').checked=S.tl.loop;
  $('#pvDiag').value=S.preview.mode;$('#expW').value=1024;
  applySettingsUI();if(!j.view)fitGraph();applyView();needsCompile=true;renderNodes();renderDope();syncTl();return true}
function fitGraph(){if(!S.nodes.length)return;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of S.nodes){x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+200);y1=Math.max(y1,n.y+150)}
  const wr=wrap.getBoundingClientRect();const z=clamp(Math.min(wr.width/(x1-x0+80),wr.height/(y1-y0+80)),.2,1.4);
  S.view.z=z;S.view.x=wr.width/2-(x0+x1)/2*z;S.view.y=wr.height/2-(y0+y1)/2*z}
function saveProject(){askText('Project name',S.name,v=>{if(!v)return;S.name=v;$('#projName').textContent=v;

function exportPNG(){const w=clamp(+$('#expW').value||1024,16,S.settings.maxExport),h=clamp(+$('#expH').value||1024,16,S.settings.maxExport);
  if(+$('#expW').value>S.settings.maxExport)toast('clamped to '+S.settings.maxExport,'err');
  if(!prog){toast('nothing to export','err');return}
  renderToCanvas(w,h);const arr=new Uint8Array(w*h*4);gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,arr);
  const img=new ImageData(new Uint8ClampedArray(arr),w,h);flipY(img);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').putImageData(img,0,0);
  c.toBlob(b=>{download(`${S.name}_${w}x${h}.png`,b);toast(`PNG ${w}×${h} exported`,'ok')});
  renderToCanvas(S.preview.res,S.preview.res)}
function exportWebM(){if(!prog){toast('nothing to export','err');return}
  const stream=pvCanvas.captureStream(30);const rec=new MediaRecorder(stream,{mimeType:'video/webm'});
  const chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{download(S.name+'.webm',new Blob(chunks,{type:'video/webm'}));toast('webm exported','ok');S.tl.playing=false;$('#bPlay').textContent=$('#tlPlay').textContent='▶'};
  S.tl.t=0;S.tl.playing=true;$('#bPlay').textContent=$('#tlPlay').textContent='⏸';rec.start();
  toast('recording one loop…');setTimeout(()=>rec.stop(),S.tl.dur*1000+250)}
function exportSeq(){const fps=S.tl.fps,dur=S.tl.dur,N=Math.min(Math.ceil(dur*fps),240);
  askConfirm('PNG sequence',`Render ${N} frames at preview res ${S.preview.res}px and download each?`,()=>{
    let i=0;const step=()=>{if(i>=N){toast('sequence done','ok');S.tl.t=0;syncTl();renderToCanvas(S.preview.res,S.preview.res);return}
      S.tl.t=i/fps;renderToCanvas(S.preview.res,S.preview.res);
      const arr=new Uint8Array(S.preview.res**2*4);gl.readPixels(0,0,S.preview.res,S.preview.res,gl.RGBA,gl.UNSIGNED_BYTE,arr);
      const img=new ImageData(new Uint8ClampedArray(arr),S.preview.res,S.preview.res);flipY(img);
      const c=document.createElement('canvas');c.width=c.height=S.preview.res;c.getContext('2d').putImageData(img,0,0);
      c.toBlob(b=>download(`${S.name}_f${String(i).padStart(4,'0')}.png`,b));i++;setTimeout(step,30)};step()})}

function buildSettings(){const b=$('#setBody');b.innerHTML='';
  for(const [k,l,kind,o] of SETTINGS){const r=document.createElement('div');r.className='setRow';
    const lb=document.createElement('label');lb.textContent=l;r.appendChild(lb);
    if(kind==='float'){const i=document.createElement('input');i.type='number';i.min=o.min;i.max=o.max;i.step=o.step||1;

    else if(kind==='sel'){const s=document.createElement('select');for(const op of o.opts){const oo=document.createElement('option');oo.value=op;oo.textContent=op;s.appendChild(oo)}
      s.value=k==='pvres'?S.preview.res:S.settings[k];s.onchange=()=>applySet(k,s.value);r.appendChild(s)}
    else{const c=document.createElement('input');c.type='checkbox';c.checked=k==='checker'?S.preview.checker:S.settings[k];

function applySet(k,v){if(k==='pvres'){S.preview.res=+v;$('#pvFit').click()}
  else if(k==='checker')S.preview.checker=v;
  else if(k==='theme'){S.settings.theme=v;document.documentElement.dataset.theme=v==='dark'?'':v}
  else if(k==='maxExport'||k==='maxNodes'||k==='nodePrevQ'||k==='grid')S.settings[k]=+v;
  else if(k==='seed'){S.settings.seed=+v;uniformsDirty=true}

  scheduleSave()}

/* helper: N(type,x,y,params), E(aIdx,'port',bIdx,'port') */
function buildGraph(defs,links,anim){
  const nodes=[],edges=[];let idc=1000;
  defs.forEach(d=>{const[t,x,y,pr]=d;const dd=DEFS[t];if(!dd)return;
    const n={id:idc,type:t,x,y,params:{},collapsed:false};idc++;
    for(const p of dd.params)n.params[p.k]=p.def!==undefined?JSON.parse(JSON.stringify(p.def)):0;
    if(pr)Object.assign(n.params,pr);nodes.push(n)});
  links.forEach(l=>{const[a,ap,b,bp]=l;edges.push({id:idc++,from:nodes[a].id,fromPort:ap,to:nodes[b].id,toPort:bp})});
  const an={};if(anim)for(const[ai,pk,keys,interp]of anim){an[nodes[ai].id]=an[nodes[ai].id]||{};
    an[nodes[ai].id][pk]={keys:keys.map(k=>({t:k[0],v:k[1],interp:interp||'smooth'})),interp:interp||'smooth'}}
  return{nodes,edges,anim:an}}
function preset(name,nodes,edges,anim,tl){return{name,...buildGraph(nodes,edges,anim),tl:tl||{t:0,dur:4,fps:30,loop:true}}}
