<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Opaque-Origin Iframe Sandbox Test</title>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; background: #334155; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <!-- Opaque-origin sandboxed iframe: scripts and downloads allowed, NO allow-same-origin, NO clipboard permission -->
  <iframe id="app-frame" sandbox="allow-scripts allow-downloads" src="index.html"></iframe>
</body>
</html>
