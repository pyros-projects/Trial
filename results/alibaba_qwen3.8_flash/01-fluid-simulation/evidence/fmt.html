<!doctype html><meta charset=utf8><body><canvas id=c></canvas><script>
const c=document.getElementById('c');
const gl=c.getContext('webgl2',{alpha:false,depth:false,stencil:false});
const out=[];
function t(name, internal, format, type, align){
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, align||4);
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,internal,64,64,0,format,type,null);
  const e1=gl.getError();
  const fbo=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  const st=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  const e2=gl.getError();
  out.push(name+' err='+e1+' fbo='+st+' err2='+e2+' complete='+(st===gl.FRAMEBUFFER_COMPLETE));
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
t('RGBA16F',gl.RGBA16F,gl.RGBA,gl.HALF_FLOAT);
t('RG16F',gl.RG16F,gl.RG,gl.HALF_FLOAT);
t('RG16F-align1',gl.RG16F,gl.RG,gl.HALF_FLOAT,1);
t('R16F',gl.R16F,gl.RED,gl.HALF_FLOAT);
t('R16F-align1',gl.R16F,gl.RED,gl.HALF_FLOAT,1);
document.title='done';
window.__out=out;
</script>
