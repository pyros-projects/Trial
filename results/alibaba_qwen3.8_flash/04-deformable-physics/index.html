/* ==========================================================================
 * RENDERER — Canvas 2D, deliberate visual polish + 8 diagnostic modes.
 * Batched fills (shade buckets) keep per-frame path counts low.
 * =========================================================================*/

const MODES = [
  { id: 'render', name: 'Render', hint: 'shaded surfaces, shadows, contacts' },
  { id: 'particles', name: 'Particles', hint: 'raw particle positions, speed-tinted' },
  { id: 'constraints', name: 'Constraints', hint: 'constraint graph by type' },
  { id: 'velocity', name: 'Velocity', hint: 'motion vectors' },
  { id: 'stress', name: 'Stress', hint: 'live constraint strain / tear warning' },
  { id: 'contacts', name: 'Contacts', hint: 'collision pairs this frame' },
  { id: 'pins', name: 'Pins', hint: 'pinned particles + anchors' },
  { id: 'grid', name: 'Grid', hint: 'spatial-partition cells (broad phase)' }
];

const TOOL_INFO = {
  grab: { name: 'Grab', key: '1', color: '#6ee7ff' },
  pin: { name: 'Pin / Unpin', key: '2', color: '#ffd166' },
  cut: { name: 'Cut / Tear', key: '3', color: '#ff5d73' },
  push: { name: 'Impulse', key: '4', color: '#a78bfa' },
  wind: { name: 'Wind gust', key: '5', color: '#5eead4' },
  spawn: { name: 'Spawn', key: '6', color: '#8ce99a' },
  erase: { name: 'Erase body', key: '7', color: '#f87171' }
};

function createRenderer(canvas) {
  const ctx = canvas.getContext('2d', { alpha: false });
  const R = {
    canvas: canvas, ctx: ctx,
    view: { scale: 1, ox: 0, oy: 0, w: 800, h: 500, dpr: 1 },
    shadeCache: new Map(),
    windSeeds: null
  };

  function resize(cssW, cssH, worldW, worldH) {
    const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    const w = Math.max(120, Math.floor(cssW)), h = Math.max(120, Math.floor(cssH));
    const need = Math.round(w * dpr), needH = Math.round(h * dpr);
    if (canvas.width !== need || canvas.height !== needH) {
      canvas.width = need; canvas.height = needH;
    }
    const pad = 10;
    const scale = Math.min((w - pad * 2) / worldW, (h - pad * 2) / worldH);
    const V = R.view;
    const old = V.scale;
    V.scale = scale;
    V.ox = (w - worldW * scale) / 2;
    V.oy = (h - worldH * scale) / 2;
    V.w = w; V.h = h; V.dpr = dpr;
    return old !== scale;
  }

  function screenToWorld(sx, sy) {
    const V = R.view;
    return [(sx - V.ox) / V.scale, (sy - V.oy) / V.scale];
  }

  function applyView() {
    const V = R.view;
    ctx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }

  /* fast transform: world -> device px, drawn with an identity-ish transform
     so batched paths do not pay per-path transform cost */
  function setWorldTransform() {
    const V = R.view;
    ctx.setTransform(V.dpr * V.scale, 0, 0, V.dpr * V.scale, V.dpr * V.ox, V.dpr * V.oy);
  }

  function shadeKey(r, g, b) { return (r << 16) | (g << 8) | b; }

  /* ---------------------------- background -------------------------------- */
  function drawBackdrop(app) {
    const V = R.view;
    ctx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, V.h);
    g.addColorStop(0, '#0d1522');
    g.addColorStop(0.55, '#121c2b');
    g.addColorStop(1, '#182435');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, V.w, V.h);
    /* world plate */
    setWorldTransform();
    ctx.fillStyle = 'rgba(255,255,255,0.022)';
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
    /* grid guides */
    ctx.strokeStyle = 'rgba(140,180,220,0.055)';
    ctx.lineWidth = 1 / V.viewScale;
    ctx.beginPath();
    for (let x = 0; x <= WORLD_W; x += 50) { ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H); }
    for (let y = 0; y <= WORLD_H; y += 50) { ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y); }
    ctx.stroke();
    setWorldTransform();
    ctx.strokeStyle = 'rgba(120,200,255,0.30)';
    ctx.lineWidth = 2.5 / V.viewScale;
    ctx.strokeRect(0, 0, WORLD_W, WORLD_H);
  }

  /* wind streamlines: make the wind field visible while it is enabled */
  function drawWind(W, S) {
    if (S.wind < 30) return;
    const V = R.view;
    if (!R.windSeeds || R.windSeeds.n !== 64) {
      const n = 64, arr = new Float32Array(n * 4);
      for (let i = 0; i < n; i++) {
        arr[i * 4] = Math.random() * WORLD_W;
        arr[i * 4 + 1] = Math.random() * WORLD_H;
        arr[i * 4 + 2] = 0.4 + Math.random() * 0.8;
        arr[i * 4 + 3] = Math.random() * 6.28;
      }
      R.windSeeds = { a: arr, n: n };
    }
    const A = R.windSeeds.a;
    const sp = Math.min(420, S.wind) * 0.55;
    const dx = S.windDx, dy = S.windDy;
    ctx.save();
    setWorldTransform();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(125,205,255,0.17)';
    ctx.lineWidth = 1.6 / V.viewScale;
    ctx.beginPath();
    for (let i = 0; i < R.windSeeds.n; i++) {
      const o = i * 4;
      const x = A[o], y = A[o + 1], len = A[o + 2];
      const l = 34 + len * 46;
      ctx.moveTo(x, y);
      ctx.lineTo(x + dx * l, y + dy * l);
      A[o] += dx * sp * 0.016;
      A[o + 1] += dy * sp * 0.016 + Math.sin(W.t * 2 + A[o + 3]) * 0.45;
      if (A[o] > WORLD_W + 40 || A[o] < -40 || A[o + 1] > WORLD_H + 40 || A[o + 1] < -40) {
        A[o] = dx > 0 ? -20 : (dx < 0 ? WORLD_W + 20 : Math.random() * WORLD_W);
        A[o + 1] = dy > 0 ? -20 : (dy < 0 ? WORLD_H + 20 : Math.random() * WORLD_H);
        if (Math.abs(dx) < 0.1) A[o] = Math.random() * WORLD_W;
        if (Math.abs(dy) < 0.1) A[o + 1] = Math.random() * WORLD_H;
      }
    }
    ctx.stroke();
    ctx.restore();
    void V;
  }

  /* --------------------------- spatial grid ------------------------------- */
  function drawGrid(W) {
    const G = W.grid;
    if (!G) return;
    const V = R.view;
    setWorldTransform();
    const cs = G.cs;
    ctx.fillStyle = 'rgba(110,231,255,0.05)';
    ctx.strokeStyle = 'rgba(110,231,255,0.16)';
    ctx.lineWidth = 0.7 / V.viewScale;
    ctx.beginPath();
    let hot = 0;
    for (let cy = 0; cy < G.gh; cy++) {
      for (let cx = 0; cx < G.gw; cx++) {
        const c = cy * G.gw + cx;
        const k = G.count[c];
        const x = (cx - 1) * cs, y = (cy - 1) * cs;
        if (k > 0) {
          if (k > hot) hot = k;
          ctx.rect(x, y, cs, cs);
        }
      }
    }
    ctx.fill();
    ctx.beginPath();
    for (let cy = 0; cy < G.gh; cy++) {
      for (let cx = 0; cx < G.gw; cx++) {
        const c = cy * G.gw + cx;
        if (G.count[c] === 0) continue;
        const x = (cx - 1) * cs, y = (cy - 1) * cs;
        ctx.moveTo(x, y); ctx.lineTo(x + cs, y);
        ctx.moveTo(x + cs, y); ctx.lineTo(x + cs, y + cs);
      }
    }
    ctx.stroke();
    /* dense cells glow: shows where the broad phase is actually working */
    if (hot > 1) {
      ctx.fillStyle = 'rgba(255,120,90,0.16)';
      ctx.beginPath();
      for (let cy = 0; cy < G.gh; cy++) {
        for (let cx = 0; cx < G.gw; cx++) {
          const c = cy * G.gw + cx;
          const k = G.count[c];
          if (k >= 4) ctx.rect((cx - 1) * cs, (cy - 1) * cs, cs, cs);
        }
      }
      ctx.fill();
    }
    R.lastHot = hot;
  }

  /* ------------------------------ obstacles ------------------------------- */
  function drawShapes(W, mode) {
    setWorldTransform();
    const V = R.view;
    for (let i = 0; i < W.shapes.length; i++) {
      const sh = W.shapes[i];
      if (!sh.alive) continue;
      const kin = !!sh.spin || !!sh.orbit || sh.kin;
      ctx.beginPath();
      if (sh.kind === 'circle') {
        ctx.arc(sh.cx, sh.cy, sh.r, 0, 6.2831853);
      } else if (sh.kind === 'seg') {
        const a = Math.atan2(sh.y1 - sh.y0, sh.x1 - sh.x0);
        ctx.lineWidth = sh.r * 2;
        ctx.lineCap = 'round';
        if (mode === 'render') {
          ctx.strokeStyle = kin ? 'rgba(255,150,90,0.85)' : 'rgba(122,146,176,0.9)';
          ctx.moveTo(sh.x0, sh.y0); ctx.lineTo(sh.x1, sh.y1); ctx.stroke();
          ctx.lineWidth = sh.r * 0.9;
          ctx.strokeStyle = 'rgba(20,28,40,0.75)';
          ctx.moveTo(sh.x0, sh.y0); ctx.lineTo(sh.x1, sh.y1); ctx.stroke();
        } else {
          ctx.strokeStyle = 'rgba(150,180,210,0.5)';
          ctx.lineWidth = 1.5 / V.viewScale;
          ctx.moveTo(sh.x0, sh.y0); ctx.lineTo(sh.x1, sh.y1); ctx.stroke();
        }
        continue;
      } else {
        ctx.save();
        ctx.translate(sh.cx, sh.cy);
        ctx.rotate(sh.angle);
        ctx.rect(-sh.hw, -sh.hh, sh.hw * 2, sh.hh * 2);
        ctx.restore();
      }
      if (mode === 'render') {
        const g = ctx.createLinearGradient(sh.cx - 60, sh.cy - 60, sh.cx + 60, sh.cy + 60);
        if (kin) { g.addColorStop(0, 'rgba(255,159,98,0.92)'); g.addColorStop(1, 'rgba(180,80,50,0.92)'); }
        else { g.addColorStop(0, 'rgba(150,172,200,0.9)'); g.addColorStop(1, 'rgba(88,106,132,0.9)'); }
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = 'rgba(15,22,32,0.85)';
        ctx.lineWidth = 2 / V.viewScale;
        ctx.stroke();
      } else {
        ctx.strokeStyle = 'rgba(160,190,220,0.75)';
        ctx.lineWidth = 1.4 / V.viewScale;
        ctx.stroke();
      }
    }
  }

  /* -------------------------------- cloth --------------------------------- */
  const shadeOf = (t) => (t < 0 ? 0 : (t > 1 ? 1 : t));

  function drawClothRender(W, b) {
    const V = R.view;
    const cols = b.cols, rows = b.rows;
    const x = W.x, y = W.y;
    const at = (r, c) => b.p0 + r * cols + c;
    const h = b.hsl;
    /* shadow pass: whole sheet, offset with the "light" direction */
    const sx = 11, sy = 15;
    ctx.beginPath();
    for (let r = 0; r < rows - 1; r++) {
      for (let c = 0; c < cols - 1; c++) {
        const a = at(r, c), d = at(r, c + 1), e = at(r + 1, c + 1), f = at(r + 1, c);
        ctx.moveTo(x[a] + sx, y[a] + sy);
        ctx.lineTo(x[d] + sx, y[d] + sy);
        ctx.lineTo(x[e] + sx, y[e] + sy);
        ctx.lineTo(x[f] + sx, y[f] + sy);
        ctx.closePath();
      }
    }
    ctx.fillStyle = 'rgba(4,8,14,0.30)';
    ctx.fill();

    /* shaded quads, bucketed into 12 brightness levels (12 fills total) */
    const NB = 12;
    if (!R.buckets) {
      R.buckets = [];
      for (let i = 0; i < NB; i++) R.buckets.push(new Path2D());
    }
    const paths = R.buckets;
    for (let i = 0; i < NB; i++) paths[i] = new Path2D();
    const sp = b.sp || 20;
    for (let r = 0; r < rows - 1; r++) {
      for (let c = 0; c < cols - 1; c++) {
        const a = at(r, c), d = at(r, c + 1), e = at(r + 1, c + 1), f = at(r + 1, c);
        const w0 = Math.abs(x[d] - x[a]) + Math.abs(x[e] - x[f]);
        const h0 = Math.abs(y[e] - y[a]) + Math.abs(y[f] - y[d]);
        /* fold darkness from in-plane compression, sheen from edge-on run */
        const comp = Math.max(0, Math.min(1.4, (2 * sp - Math.abs(w0)) / (2 * sp)));
        const edge = Math.abs(w0) / (Math.abs(h0) + 0.001);
        const sheen = Math.max(0, 1 - Math.abs(edge - 0.55) * 1.7) * 0.45;
        const t = shadeOf(0.62 - comp * 0.5 + sheen);
        const p = paths[Math.min(NB - 1, (t * (NB - 1)) | 0)];
        p.moveTo(x[a], y[a]); p.lineTo(x[d], y[d]);
        p.lineTo(x[e], y[e]); p.lineTo(x[f], y[f]);
        p.closePath();
      }
    }
    for (let i = 0; i < NB; i++) {
      const t = i / (NB - 1);
      const l = 22 + t * 52;
      const s = h.s - t * 12;
      ctx.fillStyle = 'hsl(' + h.h + ',' + Math.max(18, s) + '%,' + l + '%)';
      ctx.fill(paths[i]);
    }
    /* weave lines: cheap diagonal texture along the sheet */
    ctx.strokeStyle = 'rgba(0,0,0,0.20)';
    ctx.lineWidth = 0.8 / V.viewScale;
    ctx.beginPath();
    for (let r = 0; r < rows - 1; r += 2) {
      for (let c = 0; c < cols - 1; c += 2) {
        const a = at(r, c), e = at(r + 1, c + 1);
        ctx.moveTo(x[a], y[a]); ctx.lineTo(x[e], y[e]);
      }
    }
    ctx.stroke();
  }

  function drawJellyRender(W, b) {
    const cols = b.cols, rows = b.rows, x = W.x, y = W.y;
    const at = (r, c) => b.p0 + r * cols + c;
    ctx.beginPath();
    for (let r = 0; r < rows - 1; r++) {
      for (let c = 0; c < cols - 1; c++) {
        const a = at(r, c), d = at(r, c + 1), e = at(r + 1, c + 1), f = at(r + 1, c);
        ctx.moveTo(x[a] + 9, y[a] + 13); ctx.lineTo(x[d] + 9, y[d] + 13);
        ctx.lineTo(x[e] + 9, y[e] + 13); ctx.lineTo(x[f] + 9, y[f] + 13);
        ctx.closePath();
      }
    }
    ctx.fillStyle = 'rgba(6,10,18,0.35)';
    ctx.fill();
    const h = b.hsl;
    const NB = 8;
    if (!R.jb) { R.jb = []; for (let i = 0; i < NB; i++) R.jb.push(new Path2D()); }
    for (let i = 0; i < NB; i++) R.jb[i] = new Path2D();
    for (let r = 0; r < rows - 1; r++) {
      for (let c = 0; c < cols - 1; c++) {
        const a = at(r, c), d = at(r, c + 1), e = at(r + 1, c + 1), f = at(r + 1, c);
        const dx1 = x[d] - x[a], dy1 = y[d] - y[a];
        const dx2 = x[f] - x[e], dy2 = y[f] - y[e];
        const len1 = Math.hypot(dx1, dy1), len2 = Math.hypot(dx2, dy2);
        const area = (len1 + len2) * 0.5 * Math.abs(Math.sin(Math.atan2(dy1, dx1) - Math.atan2(dy2, dx2)));
        const t = Math.max(0, Math.min(1, 0.30 + (area - 300) / 900));
        const p = R.jb[Math.min(NB - 1, (t * (NB - 1)) | 0)];
        p.moveTo(x[a], y[a]); p.lineTo(x[d], y[d]);
        p.lineTo(x[e], y[e]); p.lineTo(x[f], y[f]);
        p.closePath();
      }
    }
    for (let i = 0; i < NB; i++) {
      const t = i / (NB - 1);
      ctx.fillStyle = 'hsla(' + h.h + ',' + (60 + t * 20) + '%,' + (34 + t * 30) + '%,0.92)';
      ctx.fill(R.jb[i]);
    }
    /* rim light around the outline */
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.6 / R.view.viewScale;
    ctx.beginPath();
    const c1 = b.p0, c2 = b.p0 + cols - 1, c3 = c2 + (rows - 1) * cols, c4 = c1 + (rows - 1) * cols;
    polyStroke(ctx, x, y, c1, c2);
    polyStroke(ctx, x, y, c2, c3);
    polyStroke(ctx, x, y, c3, c4);
    polyStroke(ctx, x, y, c4, c1);
    ctx.stroke();
  }
  function polyStroke(ctx, x, y, a, b) {
    if (b > a) { for (let i = a; i <= b; i++) { if (i === a) ctx.moveTo(x[i], y[i]); else ctx.lineTo(x[i], y[i]); } }
    else { for (let i = a; i >= b; i--) { if (i === a) ctx.moveTo(x[i], y[i]); else ctx.lineTo(x[i], y[i]); } }
  }

  /* pressurised shell: smooth loop through the ring particles */
  function drawBlobRender(W, b) {
    const x = W.x, y = W.y;
    const n = b.ring;
    if (n < 3) return;
    const cx0 = (() => { let sx = 0, sy = 0; for (let i = 0; i < n; i++) { sx += x[b.p0 + i]; sy += y[b.p0 + i]; } return [sx / n, sy / n]; })();
    ctx.beginPath();
    /* quadratic smoothing through midpoints */
    let mx = (x[b.p0 + n - 1] + x[b.p0]) * 0.5, my = (y[b.p0 + n - 1] + y[b.p0]) * 0.5;
    ctx.moveTo(mx, my);
    for (let i = 0; i < n; i++) {
      const a = b.p0 + i, c = b.p0 + (i + 1) % n;
      const mx2 = (x[a] + x[c]) * 0.5, my2 = (y[a] + y[c]) * 0.5;
      ctx.quadraticCurveTo(x[a], y[a], mx2, my2);
    }
    ctx.closePath();
    let maxR = 0;
    for (let i = 0; i < n; i++) {
      const d = Math.hypot(x[b.p0 + i] - cx0[0], y[b.p0 + i] - cx0[1]);
      if (d > maxR) maxR = d;
    }
    const h = b.hsl;
    const g = ctx.createRadialGradient(
      cx0[0] - maxR * 0.35, cx0[1] - maxR * 0.45, maxR * 0.08,
      cx0[0], cx0[1], maxR * 1.15);
    g.addColorStop(0, 'hsla(' + h.h + ',88%,74%,0.98)');
    g.addColorStop(0.55, 'hsla(' + h.h + ',72%,54%,0.97)');
    g.addColorStop(1, 'hsla(' + (h.h + 14) + ',66%,34%,0.96)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(12,18,28,0.8)';
    ctx.lineWidth = 2 / R.view.viewScale;
    ctx.stroke();
    /* specular highlight */
    ctx.beginPath();
    ctx.ellipse(cx0[0] - maxR * 0.3, cx0[1] - maxR * 0.42, maxR * 0.30, maxR * 0.16,
      -0.5, 0, 6.2831853);
    ctx.fillStyle = 'rgba(255,255,255,0.42)';
    ctx.fill();
  }

  function drawClusterRender(W, b) {
    const hull = b.hull;
    if (!hull || hull.length < 3) return;
    const x = W.x, y = W.y;
    ctx.beginPath();
    ctx.moveTo(x[hull[0]], y[hull[0]]);
    for (let i = 1; i < hull.length; i++) ctx.lineTo(x[hull[i]], y[hull[i]]);
    ctx.closePath();
    let cx0 = 0, cy0 = 0;
    for (let i = 0; i < hull.length; i++) { cx0 += x[hull[i]]; cy0 += y[hull[i]]; }
    cx0 /= hull.length; cy0 /= hull.length;
    const g = ctx.createRadialGradient(cx0 - 12, cy0 - 16, 4, cx0, cy0, b.rad * 1.4);
    g.addColorStop(0, 'rgba(232,238,250,0.98)');
    g.addColorStop(0.6, 'rgba(150,166,196,0.96)');
    g.addColorStop(1, 'rgba(74,88,112,0.95)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(14,20,30,0.9)';
    ctx.lineWidth = 2 / R.view.viewScale;
    ctx.stroke();
  }

  function drawRopeRender(W, b) {
    const x = W.x, y = W.y;
    const n = b.pn;
    if (n < 2) return;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    /* dark backing, then core, then highlight: reads as twisted fibre */
    const passes = [
      [b.thick * 1.0, 'rgba(10,14,22,0.55)'],
      [b.thick * 0.72, b.ropeCol || 'rgba(226,176,92,0.95)'],
      [b.thick * 0.26, 'rgba(255,238,200,0.55)']
    ];
    for (let p = 0; p < passes.length; p++) {
      ctx.beginPath();
      ctx.moveTo(x[b.p0], y[b.p0]);
      for (let i = 1; i < n; i++) ctx.lineTo(x[b.p0 + i], y[b.p0 + i]);
      if (b.closed) { ctx.lineTo(x[b.p0], y[b.p0]); ctx.closePath(); }
      ctx.lineWidth = passes[p][0];
      ctx.strokeStyle = passes[p][1];
      ctx.stroke();
    }
  }

  /* --------------------------- diagnostic modes --------------------------- */
  function drawParticlesMode(W, mode) {
    const x = W.x, y = W.y, act = W.act, cr = W.cr;
    setWorldTransform();
    const V = R.view;
    if (mode === 'particles' || mode === 'pins') {
      const NB = 10;
      if (!R.pb) { R.pb = []; for (let i = 0; i < NB; i++) R.pb.push(new Path2D()); }
      for (let i = 0; i < NB; i++) R.pb[i] = new Path2D();
      for (let i = 0; i < W.n; i++) {
        if (!act[i]) continue;
        const sp = Math.min(1, Math.hypot(W.vx[i], W.vy[i]) / 900);
        const bi = Math.min(NB - 1, (sp * NB) | 0);
        const r = Math.max(1.6, cr[i] * 0.75);
        R.pb[bi].moveTo(x[i] + r, y[i]);
        R.pb[bi].arc(x[i], y[i], r, 0, 6.2831853);
      }
      for (let i = 0; i < NB; i++) {
        const t = i / (NB - 1);
        ctx.fillStyle = 'hsl(' + (200 - t * 200) + ',85%,' + (55 + t * 8) + '%)';
        ctx.fill(R.pb[i]);
      }
      if (mode === 'pins') {
        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 2 / V.viewScale;
        ctx.beginPath();
        for (let i = 0; i < W.n; i++) {
          if (!act[i] || !W.pin[i]) continue;
          const r = 5;
          ctx.moveTo(x[i] - r, y[i] - r); ctx.lineTo(x[i] + r, y[i] + r);
          ctx.moveTo(x[i] + r, y[i] - r); ctx.lineTo(x[i] - r, y[i] + r);
        }
        ctx.stroke();
      }
    } else if (mode === 'velocity') {
      const NB = 12;
      if (!R.vb) { R.vb = []; for (let i = 0; i < NB; i++) R.vb.push(new Path2D()); }
      for (let i = 0; i < NB; i++) R.vb[i] = new Path2D();
      let maxSp = 1;
      for (let i = 0; i < W.n; i++) {
        const s = Math.hypot(W.vx[i], W.vy[i]);
        if (s > maxSp) maxSp = s;
      }
      for (let i = 0; i < W.n; i++) {
        if (!act[i]) continue;
        const s = Math.hypot(W.vx[i], W.vy[i]);
        if (s < 3) continue;
        const k = 0.075;
        const bi = Math.min(NB - 1, (s / maxSp * NB) | 0);
        R.vb[bi].moveTo(x[i], y[i]);
        R.vb[bi].lineTo(x[i] - W.vx[i] * k, y[i] - W.vy[i] * k);
      }
      for (let i = 0; i < NB; i++) {
        const t = (i + 1) / NB;
        ctx.strokeStyle = 'hsl(' + (190 - t * 190) + ',90%,60%)';
        ctx.lineWidth = Math.max(0.8, 2.2 * t) / V.viewScale;
        ctx.stroke(R.vb[i]);
      }
    } else if (mode === 'contacts') {
      ctx.beginPath();
      const x2 = W.cX, y2 = W.cY;
      for (let c = 0; c < W.cc; c++) {
        const px = x2[c], py = y2[c];
        ctx.moveTo(px + 3.2, py);
        ctx.arc(px, py, 3.2, 0, 6.2831853);
      }
      ctx.fillStyle = 'rgba(255,90,90,0.75)';
      ctx.fill();
      ctx.beginPath();
      for (let c = 0; c < W.cc; c++) {
        const px = x2[c], py = y2[c];
        const nx = W.cNX[c], ny = W.cNY[c];
        ctx.moveTo(px, py);
        ctx.lineTo(px + nx * 9, py + ny * 9);
      }
      ctx.strokeStyle = 'rgba(120,255,190,0.5)';
      ctx.lineWidth = 1 / V.viewScale;
      ctx.stroke();
    }
  }

  function drawConstraintsMode(W, mode) {
    setWorldTransform();
    const V = R.view;
    const x = W.x, y = W.y;
    if (mode === 'constraints') {
      const cols = ['rgba(90,220,200,0.85)', 'rgba(240,180,80,0.6)',
        'rgba(160,120,255,0.55)', 'rgba(255,255,255,0.8)'];
      const lw = [1.5, 1.0, 0.9, 2.0];
      for (let cls = 1; cls <= 4; cls++) {
        ctx.beginPath();
        for (let k = 0; k < W.pc; k++) {
          if (!W.palive[k] || W.pcls[k] !== cls) continue;
          const a = W.pa[k], b = W.pb[k];
          ctx.moveTo(x[a], y[a]); ctx.lineTo(x[b], y[b]);
        }
        ctx.strokeStyle = cols[cls - 1];
        ctx.lineWidth = lw[cls - 1] / V.viewScale;
        ctx.stroke();
      }
      /* closed area / pressure loops */
      ctx.beginPath();
      for (let c = 0; c < W.ac; c++) {
        if (!W.aAlive[c]) continue;
        const off = W.aOff[c], n = W.aCnt[c];
        for (let i = 0; i < n; i++) {
          const a = W.poly[off + i], b = W.poly[off + (i + 1) % n];
          ctx.moveTo(x[a], y[a]); ctx.lineTo(x[b], y[b]);
        }
      }
      ctx.strokeStyle = 'rgba(255,120,190,0.55)';
      ctx.lineWidth = 1 / V.viewScale;
      ctx.stroke();
    } else if (mode === 'stress') {
      const thr = Math.max(0.02, R.app ? R.app.S.tear : 0.5);
      const NB = 14;
      if (!R.sb) { R.sb = []; for (let i = 0; i < NB; i++) R.sb.push(new Path2D()); }
      for (let i = 0; i < NB; i++) R.sb[i] = new Path2D();
      let maxSt = 0.001, hot = 0;
      for (let k = 0; k < W.pc; k++) {
        if (!W.palive[k]) continue;
        const s = W.pstr[k];
        if (s > maxSt) maxSt = s;
        const t = Math.min(1, s / thr);
        const bi = Math.min(NB - 1, (t * NB) | 0);
        if (t > 0.8) hot++;
        const a = W.pa[k], b = W.pb[k];
        R.sb[bi].moveTo(x[a], y[a]); R.sb[bi].lineTo(x[b], y[b]);
      }
      for (let i = 0; i < NB; i++) {
        const t = (i + 1) / NB;
        const hue = 140 - t * 140;
        ctx.strokeStyle = 'hsl(' + Math.max(0, hue) + ',95%,' + (48 + t * 12) + '%)';
        ctx.lineWidth = (1.1 + t * 2.4) / V.viewScale;
        ctx.stroke(R.sb[i]);
      }
      if (hot > 0) {   /* imminent tearing flashes */
        const pulse = 0.45 + 0.35 * Math.sin(W.t * 18);
        ctx.beginPath();
        for (let k = 0; k < W.pc; k++) {
          if (!W.palive[k]) continue;
          if (W.pstr[k] / thr <= 0.8) continue;
          const a = W.pa[k], b = W.pb[k];
          ctx.moveTo(x[a], y[a]); ctx.lineTo(x[b], y[b]);
        }
        ctx.strokeStyle = 'rgba(255,40,120,' + pulse.toFixed(3) + ')';
        ctx.lineWidth = 3.4 / V.viewScale;
        ctx.stroke();
      }
      R.stressInfo = { max: maxSt, hot: hot, thr: thr };
    }
  }

  /* ------------------------------ tool layer ------------------------------ */
  function drawToolLayer(W, S, app) {
    const V = R.view;
    setWorldTransform();
    const p = app.pointer;
    /* tool ring */
    if (p.inside) {
      const info = TOOL_INFO[app.tool] || TOOL_INFO.grab;
      const r = (app.tool === 'cut' ? 12 : app.tool === 'erase' ? 26 : S.grabRadius);
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 6.2831853);
      ctx.strokeStyle = info.color;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 1.6 / V.viewScale;
      ctx.stroke();
      if (app.tool === 'wind' || app.tool === 'push') {
        ctx.beginPath();
        ctx.arc(p.x, p.y, r * 0.55, 0, 6.2831853);
        ctx.globalAlpha = 0.35;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      if (p.down) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.2, 0, 6.2831853);
        ctx.fillStyle = info.color;
        ctx.fill();
      }
    }
    /* grab tethers */
    if (app.tool === 'grab' && app.grabs && app.grabs.length) {
      ctx.beginPath();
      for (const g of app.grabs) {
        if (!g.idx) continue;
        for (let i = 0; i < g.n; i++) {
          ctx.moveTo(g.tx, g.ty);
          ctx.lineTo(W.x[g.idx[i]], W.y[g.idx[i]]);
        }
      }
      ctx.strokeStyle = 'rgba(110,231,255,0.5)';
      ctx.lineWidth = 1 / V.viewScale;
      ctx.stroke();
    }
    /* cut trail */
    if (app.cutTrail && app.cutTrail.length > 2) {
      ctx.beginPath();
      ctx.moveTo(app.cutTrail[0], app.cutTrail[1]);
      for (let i = 2; i < app.cutTrail.length; i += 2) ctx.lineTo(app.cutTrail[i], app.cutTrail[i + 1]);
      ctx.strokeStyle = 'rgba(255,93,115,0.9)';
      ctx.lineWidth = 2.4 / V.viewScale;
      ctx.stroke();
    }
    /* spawn ghost */
    if (app.spawnGhost) {
      const g = app.spawnGhost;
      ctx.strokeStyle = 'rgba(140,233,154,0.9)';
      ctx.lineWidth = 1.6 / V.viewScale;
      ctx.setLineDash([6 / V.viewScale, 5 / V.viewScale]);
      ctx.strokeRect(g.x, g.y, g.w, g.h);
      ctx.setLineDash([]);
    }
  }

  /* --------------------------------- frame -------------------------------- */
  function draw(W, S, app) {
    const V = R.view;
    V.viewScale = V.scale;
    R.app = app;
    applyView();
    drawBackdrop(app);
    const mode = app.mode;
    if (mode === 'grid') drawGrid(W);
    if (mode === 'render') drawWind(W, S);
    setWorldTransform();
    /* shadows for the smooth bodies first, then the bodies themselves */
    drawShapes(W, mode);
    for (let i = 0; i < W.bodies.length; i++) {
      const b = W.bodies[i];
      if (b.dead || b.pn === 0) continue;
      if (mode === 'render') {
        if (b.kind === BK_CLOTH) drawClothRender(W, b);
        else if (b.kind === BK_JELLY) {
          if (b.hull) drawClusterRender(W, b);
          else if (b.closed) drawBlobRender(W, b);
          else drawJellyRender(W, b);
        } else if (b.kind === BK_BLOB) drawBlobRender(W, b);
        else drawRopeRender(W, b);
      } else if (mode !== 'grid') {
        if (b.kind === BK_ROPE) drawRopeRender(W, b);
      }
    }
    if (mode !== 'render' && mode !== 'grid') drawParticlesMode(W, mode);
    if (mode === 'constraints' || mode === 'stress') drawConstraintsMode(W, mode);
    drawToolLayer(W, S, app);
    ctx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  }

  return { resize: resize, draw: draw, screenToWorld: screenToWorld, R: R };
}

/* ===== 15-scenarios.js ===== */
/* ==========================================================================
 * SCENARIOS — each one builds a fresh world and can tune the solver defaults.
 * World box is 1600 x 1000 world units, +y is down, 100 u = 1 "metre".
 * =========================================================================*/

function makeScenarios(A) {
  const SC = [];
  const shape = (W, s) => A.addShape(W, s);
  const cloth = (W, o) => A.buildCloth(W, o);
  const rope = (W, o) => A.buildChain(W, o);
  const blob = (W, o) => A.buildBlob(W, o);
  const jelly = (W, o) => A.buildJelly(W, o);
  const ball = (W, o) => A.buildCluster(W, Object.assign({ sp: 15 }, o));

  /* press a body's particles to a neighbour body (attachment constraints) */
  function sew(W, body, host, maxDist) {
    let n = 0;
    for (let i = body.p0; i < body.p0 + body.pn; i++) {
      const k = A.weldNearest(W, i, host, maxDist || 30);
      if (k >= 0) n++;
    }
    return n;
  }

  /* pressurised tube: elliptical shell that conserves its area */
  function tube(W, o) {
    const n = o.n;
    const b = A.addBody(W, {
      kind: A.BK_BLOB, p0: W.n, pn: n, closed: true, aero: false, self: true,
      name: 'tube', dampMul: 1.5, ring: n, rad: Math.max(o.rx, o.ry),
      thick: 7, hsl: { h: o.hue, s: 66, l: 55 }
    });
    const start = W.n;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      A.addP(W, o.cx + Math.cos(a) * o.rx, o.y0 + Math.sin(a) * o.ry, o.im, 4.2, b, i, 0, 2, false);
    }
    const idx = [];
    for (let i = 0; i < n; i++) idx.push(start + i);
    for (let i = 0; i < n; i++) {
      A.addPair(W, start + i, start + (i + 1) % n, undefined, A.CL_STRUCT);
      A.addPair(W, start + i, start + (i + 2) % n, undefined, A.CL_BEND);
    }
    A.addArea(W, idx, n, 1);
    return b;
  }

  /* ------------------------------------------------------------ scenarios */

  SC.push({
    id: 'cascade', name: 'Cascade Crash', default: true,
    blurb: 'Sheet, pendulum chain and a spinning paddle: the machine keeps running.',
    tool: 'grab',

    build(W) {
      /* One machine, not a still life: everything is in contact with something.
         A steep chute feeds a kinematic paddle; a chain hangs into the paddle;
         a curtain hangs across the chute and gets raked by the pucks; the
         right-hand bin collects pucks, jelly and a pressurised balloon. */
      shape(W, { kind: 'seg', x0: 110, y0: 210, x1: 660, y1: 470, r: 14 });
      shape(W, { kind: 'seg', x0: 990, y0: 330, x1: 700, y1: 540, r: 14 });
      shape(W, { kind: 'box', cx: 780, cy: 720, hw: 180, hh: 13, spin: 2.2 });
      shape(W, { kind: 'circle', cx: 1060, cy: 250, r: 95 });
      shape(W, { kind: 'box', cx: 1120, cy: 620, hw: 15, hh: 165, angle: 0.22 });
      shape(W, { kind: 'box', cx: 1490, cy: 620, hw: 15, hh: 165, angle: -0.22 });
      shape(W, { kind: 'box', cx: 1290, cy: 830, hw: 220, hh: 16 });
      /* curtain: pinned along the top every 4th node so it can billow */
      /* banner: held along its whole top edge so it stays taut and streams
         in the wind instead of crumpling into a long tail */
      const c = cloth(W, { x0: 90, y0: 70, cols: 16, rows: 7, sp: 20, im: 0.45, hue: 168 });
      for (let r = 0; r < 16; r++) A.pinP(W, c.p0 + r);
      /* chain hanging into the paddle */
      const ro = rope(W, { x0: 620, y0: 150, dx: 0.5, dy: 1, n: 18, seg: 20, im: 0.32, thick: 6.5 });
      A.pinP(W, ro.p0);
      /* pucks: two on the chute, one on the deflector, three already in the bin */
      ball(W, { cx: 250, y0: 250, r: 34, sp: 14, im: 0.28, name: 'puck' });
      ball(W, { cx: 420, y0: 330, r: 28, sp: 13, im: 0.28, name: 'puck' });
      ball(W, { cx: 560, y0: 380, r: 24, sp: 13, im: 0.28, name: 'puck' });
      ball(W, { cx: 1060, y0: 90, r: 36, sp: 14, im: 0.28, name: 'puck' });
      ball(W, { cx: 1230, y0: 700, r: 30, sp: 14, im: 0.28, name: 'puck' });

      ball(W, { cx: 1400, y0: 700, r: 26, sp: 13, im: 0.28, name: 'puck' });

      void j1;
    }
  });

  SC.push({
    id: 'sandbox', name: 'Sandbox',
    blurb: 'Mostly empty: obstacles, one sheet, one shell. Use the Spawn tool to fill it up.',
    tool: 'spawn',
    settings: { gravity: 900, wind: 150, tear: 0.5 },
    build(W) {
      shape(W, { kind: 'box', cx: 420, cy: 650, hw: 260, hh: 16, angle: -0.2 });
      shape(W, { kind: 'circle', cx: 980, cy: 520, r: 120 });
      shape(W, { kind: 'box', cx: 1330, cy: 360, hw: 160, hh: 11, spin: 1.1 });
      shape(W, { kind: 'seg', x0: 120, y0: 880, x1: 700, y1: 820, r: 12 });
      cloth(W, { x0: 250, y0: 80, cols: 22, rows: 16, sp: 21, im: 0.5, hue: 168 });
      blob(W, { cx: 1200, y0: 220, r: 62, n: 22, im: 0.5, hue: 344 });
    }
  });

  return { list: SC, byId: (id) => SC.find((s) => s.id === id) || SC[0] };
}


/* ===== 20-app.js ===== */
/* ==========================================================================
 * APP — UI wiring, pointer/keyboard tools, main loop, HUD, persistence.
 * =========================================================================*/

const DEFAULTS = {
  gravity: 900, gravDir: 90, wind: 220, windDir: 0, windTurb: 0.55,
  damping: 0.8, restitution: 0.12, friction: 0.5, thick: 6,
  iters: 6, substeps: 3, dtScale: 1.0,
  kStruct: 0.9, kShear: 0.4, kBend: 0.16, pressure: 0.55,
  tear: 0.5, tearOn: true, selfCollide: true, pairCollide: true,
  density: 1.5, grabRadius: 44, grabK: 0.55,
  hud: true, spark: true
};

const SPAWN_TYPES = [
  { id: 'cloth', name: 'Cloth sheet' },
  { id: 'rope', name: 'Rope / chain' },
  { id: 'blob', name: 'Soft body (pressurised)' },
  { id: 'balloon', name: 'Balloon' },
  { id: 'jelly', name: 'Jelly lattice' },
  { id: 'ball', name: 'Rigid puck' },
  { id: 'circle', name: 'Static circle' },
  { id: 'box', name: 'Static box' },
  { id: 'spinner', name: 'Spinning paddle' }
];

const TOOL_ORDER = ['grab', 'pin', 'cut', 'push', 'wind', 'spawn', 'erase'];

const TOOL_HINT = {
  grab: 'Drag particles. <kbd>Space</kbd> pause · <kbd>N</kbd> step · <kbd>R</kbd> reset · <kbd>V</kbd> viz mode · <kbd>1-7</kbd> tools · <kbd>[</kbd><kbd>]</kbd> radius',
  pin: 'Click or drag to pin points; drag over pinned points to unpin them. <kbd>2</kbd> = this tool.',
  cut: 'Drag across the mesh to sever constraints. Tearing stays torn — the graph really changes.',
  push: 'Drag to punch impulses into the material (direction = drag direction).',
  wind: 'Hold to blow a local wind gust; drag to steer it.',
  spawn: 'Press and drag to size a new object, release to drop it. Pick the type in the panel.',
  erase: 'Click or drag over a body to delete that body and its constraints.'
};

function bootApp(api, makeScenarios, createRenderer) {
  const doc = document;
  const canvas = doc.getElementById('sim');
  const stage = doc.getElementById('stage');
  const hud = doc.getElementById('hud');
  const hintEl = doc.getElementById('hint');
  const toastEl = doc.getElementById('toast');
  const sparkC = doc.getElementById('spark');
  const sparkCtx = sparkC ? sparkC.getContext('2d') : null;

  const A = api;
  const scen = makeScenarios(api);
  let W = A.makeWorld();
  const S = Object.assign({
    gx: 0, gy: 900, windDx: 1, windDy: 0, maxStep: 9, cellSize: 15,
    substeps: 3, iters: 6
  }, DEFAULTS);

  const view = {
    paused: false, stepOnce: false, mode: 'render', tool: 'grab',
    spawnType: 'cloth', panelOpen: true, fps: 60
  };
  const app = {
    W: W, S: S, mode: 'render', tool: 'grab',
    pointer: { x: 0, y: 0, inside: false, down: false, px: 0, py: 0, dx: 0, dy: 0 },
    grabs: [], cutTrail: [], spawnGhost: null,
    toasts: [], errors: [], keys: TOOL_ORDER.slice(), sceneId: 'cascade'
  };

  /* --------------------------------------------------------------- helpers */
  function toast(msg, isErr) {
    const d = doc.createElement('div');
    d.className = 'toast' + (isErr ? ' err' : '');
    d.textContent = msg;
    toastEl.appendChild(d);
    app.toasts.push({ el: d, t: performance.now(), msg: msg, err: !!isErr });
    while (app.toasts.length > 4) {
      const old = app.toasts.shift();
      if (old.el.parentNode) old.el.parentNode.removeChild(old.el);
    }
    setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 2600);
  }

  const fmt = {
    int: (v) => String(Math.round(v)),
    f1: (v) => v.toFixed(1),
    f2: (v) => v.toFixed(2)
  };

  /* ------------------------------------------------------------- renderer  */
  const R = createRenderer(canvas);
  app.R = R;

  function refit() {
    const rect = stage.getBoundingClientRect();
    const cr = canvas.getBoundingClientRect();
    R.resize(cr.width || rect.width, cr.height || rect.height, A.WORLD_W, A.WORLD_H);
    drawSpark();
  }

  /* ------------------------------------------------------------- scenarios */
  function applyScenarioDefaults(sc) {
    if (sc.settings) Object.assign(S, sc.settings);
    if (sc.tool) { app.tool = sc.tool; syncToolButtons(); }
    rebuildForces();
    syncControls();
  }

  function loadScenario(id, quiet) {
    const sc = scen.byId(id);
    app.sceneId = sc.id;
    W = A.makeWorld();
    app.W = W;
    Object.assign(S, DEFAULTS);
    applyScenarioDefaults(sc);
    sc.build(W, S);
    doc.getElementById('blurb').textContent = sc.name + ' — ' + sc.blurb;
    if (!quiet) toast('Scenario: ' + sc.name);
    refit();
    saveSession();
  }

  function rebuildForces() {
    const th = (S.gravDir * Math.PI) / 180;
    S.gx = Math.cos(th) * S.gravity;
    S.gy = Math.sin(th) * S.gravity;
    const wa = (S.windDir * Math.PI) / 180;
    S.windDx = Math.cos(wa);
    S.windDy = Math.sin(wa);
  }

  /* ------------------------------------------------------------ tool setup */
  const toolsWrap = doc.getElementById('tools');
  function buildToolButtons() {
    toolsWrap.innerHTML = '';
    for (const t of TOOL_ORDER) {
      const b = doc.createElement('button');
      b.className = 'tool' + (t === app.tool ? ' active' : '');
      b.dataset.tool = t;
      b.title = TOOL_INFO[t].name + '  (' + TOOL_INFO[t].key + ')';
      b.innerHTML = '<span>' + TOOL_INFO[t].name + '</span><small>' + TOOL_INFO[t].key + '</small>';
      b.addEventListener('click', () => setTool(t));
      toolsWrap.appendChild(b);
    }
  }
  function syncToolButtons() {
    for (const b of toolsWrap.querySelectorAll('.tool')) {
      b.classList.toggle('active', b.dataset.tool === app.tool);
    }
    canvas.style.cursor = app.tool === 'grab' ? 'grab'
      : (app.tool === 'cut' ? 'cell' : app.tool === 'erase' ? 'not-allowed' : 'crosshair');
    hintEl.innerHTML = TOOL_HINT[app.tool] || '';
  }
  function setTool(t) {
    if (!TOOL_INFO[t]) return;
    app.tool = t;
    if (t !== 'grab') { W.grab = null; app.grabs = []; }
    app.cutTrail.length = 0;
    app.spawnGhost = null;
    syncToolButtons();
    saveSession();
  }

  /* mode select */
  const modeSel = doc.getElementById('mode');
  for (const m of MODES) {
    const o = doc.createElement('option');
    o.value = m.id;
    o.textContent = m.name;
    o.title = m.hint;
    modeSel.appendChild(o);
  }
  modeSel.addEventListener('change', () => {
    app.mode = modeSel.value;              /* never touches the world */
    saveSession();
  });

  /* scenario select */
  const scenSel = doc.getElementById('scenario');
  for (const sc of scen.list) {
    const o = doc.createElement('option');
    o.value = sc.id;
    o.textContent = sc.name;
    o.title = sc.blurb;
    scenSel.appendChild(o);
  }
  scenSel.addEventListener('change', () => loadScenario(scenSel.value));

  /* spawn type select */
  const spawnSel = doc.getElementById('spawnType');
  for (const t of SPAWN_TYPES) {
    const o = doc.createElement('option');
    o.value = t.id;
    o.textContent = t.name;
    spawnSel.appendChild(o);
  }

  /* ------------------------------------------------------------- controls */
  const ctrls = Array.from(doc.querySelectorAll('[data-s],[data-c]'));
  function syncControls() {
    for (const el of ctrls) {
      const key = el.dataset.s || el.dataset.c;
      if (!(key in S)) continue;
      if (el.type === 'checkbox') el.checked = !!S[key];
      else {
        el.value = String(S[key]);
        const out = el.parentNode.querySelector('output');
        if (out) out.textContent = (fmt[el.dataset.fmt] || fmt.f2)(S[key]);
      }
    }
    modeSel.value = app.mode;
    spawnSel.value = app.spawnType;
    scenSel.value = app.sceneId;
  }

  function onControl(el) {
    const key = el.dataset.s || el.dataset.c;
    if (el.type === 'checkbox') S[key] = el.checked;
    else {
      S[key] = parseFloat(el.value);
      const out = el.parentNode.querySelector('output');
      if (out) out.textContent = (fmt[el.dataset.fmt] || fmt.f2)(S[key]);
    }
    if (key === 'gravity' || key === 'gravDir' || key === 'wind' || key === 'windDir') rebuildForces();
    saveSession();
  }
  for (const el of ctrls) {
    el.addEventListener('input', () => onControl(el));
    el.addEventListener('change', () => onControl(el));
  }

  /* ---------------------------------------------------------- persistence */
  const LS_KEY = 'softplay.session.v1';
  let saveTimer = 0;
  function saveSession() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        const data = { v: 1, scene: app.sceneId, mode: app.mode, tool: app.tool,
          spawn: app.spawnType, paused: view.paused, s: {} };
        for (const el of ctrls) {
          const key = el.dataset.s || el.dataset.c;
          data.s[key] = el.type === 'checkbox' ? el.checked : parseFloat(el.value);
        }
        localStorage.setItem(LS_KEY, JSON.stringify(data));
      } catch (e) { /* storage unavailable (file:// without perms) — ignore */ }
    }, 260);
  }
  function loadSession() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { data = null; }
    if (!data || !data.s) return null;
    Object.assign(S, data.s);
    app.mode = data.mode || 'render';
    app.tool = data.tool || 'grab';
    app.spawnType = data.spawn || 'cloth';
    view.paused = !!data.paused;
    return data.scene || 'cascade';
  }

  /* --------------------------------------------------------------- transport */
  const btnPause = doc.getElementById('btnPause');
  function setPaused(p) {
    view.paused = p;
    btnPause.classList.toggle('on', p);
    btnPause.textContent = p ? '▶ Resume' : '⏸ Pause';
    saveSession();
  }
  btnPause.addEventListener('click', () => setPaused(!view.paused));
  doc.getElementById('btnStep').addEventListener('click', () => {
    view.stepOnce = true;
    if (!view.paused) setPaused(true);
  });
  doc.getElementById('btnReset').addEventListener('click', () => loadScenario(app.sceneId));
  doc.getElementById('btnClear').addEventListener('click', () => {
    W = A.makeWorld();
    app.W = W;
    W.grab = null;
    app.grabs = [];
    toast('World cleared — use the Spawn tool or pick a scenario');
    refit();
  });
  doc.getElementById('btnCentre').addEventListener('click', refit);
  doc.getElementById('btnDefaults').addEventListener('click', () => {
    Object.assign(S, DEFAULTS);
    rebuildForces();
    syncControls();
    toast('Settings restored to defaults');
    saveSession();
  });

  /* panel drawer */
  const panel = doc.getElementById('panel');
  const fab = doc.getElementById('fab');
  function setPanel(open) {
    view.panelOpen = open;
    panel.classList.toggle('hidden', !open);
    fab.setAttribute('aria-expanded', open ? 'true' : 'false');
    fab.textContent = open ? 'Controls ✕' : '☰ Controls';
  }
  fab.addEventListener('click', () => setPanel(!view.panelOpen));
  if (window.innerWidth < 820) setPanel(false);

  /* --------------------------------------------------------- export/import */
  function serializeWorld() {
    const w = app.W;
    const r3 = (v) => Math.round(v * 1000) / 1000;
    const parts = [];
    for (let i = 0; i < w.n; i++) {
      parts.push([r3(w.x[i]), r3(w.y[i]), r3(w.vx[i]), r3(w.vy[i]), w.im[i],
        w.cr[i], w.pin[i], w.ta[i], w.tb[i], w.tmode[i], w.aero[i], w.act[i], w.body[i],
        r3(w.px[i]), r3(w.py[i])]);
    }
    const pairs = [];
    for (let k = 0; k < w.pc; k++) {
      pairs.push([w.pa[k], w.pb[k], r3(w.prest[k]), w.pcls[k], w.palive[k]]);
    }
    const areas = [];
    for (let k = 0; k < w.ac; k++) {
      const idx = [];
      for (let j = 0; j < w.aCnt[k]; j++) idx.push(w.poly[w.aOff[k] + j]);
      areas.push([r3(w.aRest[k]), w.aAlive[k], idx]);
    }
    const bodies = w.bodies.map((b) => ({
      kind: b.kind, cols: b.cols, rows: b.rows, p0: b.p0, pn: b.pn, closed: b.closed,
      aero: b.aero, name: b.name, hsl: b.hsl, thick: b.thick, ring: b.ring,
      rad: b.rad, sp: b.sp, dead: b.dead, hull: !!b.hull
    }));
    const shapes = w.shapes.map((s) => {
      const o = {};
      for (const k in s) if (typeof s[k] !== 'function') o[k] = s[k];
      return o;
    });
    return {
      v: 1, app: 'softplay', scene: app.sceneId, settings: { ...S },
      n: w.n, polyN: w.polyN, parts, pairs, areas, bodies, shapes
    };
  }

  function deserializeWorld(data) {
    if (!data || data.v !== 1 || !Array.isArray(data.parts) || !Array.isArray(data.pairs)) {
      throw new Error('not a softplay world file');
    }
    const w = A.makeWorld();
    if (data.parts.length > w.cap) throw new Error('file needs ' + data.parts.length + ' particles (max ' + w.cap + ')');
    for (const s of (data.shapes || [])) A.addShape(w, { ...s });
    for (const p of data.parts) {
      A.addP(w, p[0], p[1], p[4], p[5], undefined, p[7], p[8], p[9], !!p[10]);
    }
    for (let i = 0; i < data.parts.length; i++) {
      const p = data.parts[i];
      w.act[i] = p[11]; w.body[i] = p[12];
      w.px[i] = p[13]; w.py[i] = p[14];
      if (p[6]) { w.pin[i] = 1; w.im[i] = 0; }
    }
    for (const pr of data.pairs) {
      if (!pr[4]) continue;
      A.addPair(w, pr[0], pr[1], pr[2], pr[3]);
    }
    for (const a of (data.areas || [])) {
      if (!a[1]) continue;
      const c = w.ac;
      A.addArea(w, a[2], a[2].length, 1);
      w.aRest[c] = a[0];
    }
    for (const b of (data.bodies || [])) {
      const spec = { ...b, dead: !!b.dead };
      delete spec.hull;
      const nb = A.addBody(w, spec);
      if (b.hull) nb.hull = A.hullOf(w, nb.p0, nb.pn);
    }
    if (data.settings) {
      Object.assign(S, data.settings);
      rebuildForces();
      syncControls();
    }
    app.W = W = w;
    app.grabs = [];
    W.grab = null;
    refit();
    return true;
  }

  doc.getElementById('btnSave').addEventListener('click', () => {
    try {
      const json = JSON.stringify(serializeWorld());
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = doc.createElement('a');
      a.href = url;
      a.download = 'softplay-' + app.sceneId + '-' + Date.now() + '.json';
      doc.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); doc.body.removeChild(a); }, 500);
      toast('World exported (' + Math.round(json.length / 1024) + ' KB)');
    } catch (e) {
      toast('Export failed: ' + e.message, true);
    }
  });

  const fileEl = doc.getElementById('fileImport');
  doc.getElementById('btnLoad').addEventListener('click', () => fileEl.click());
  fileEl.addEventListener('change', () => {
    const f = fileEl.files && fileEl.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onerror = () => toast('Could not read that file', true);
    rd.onload = () => {
      try {
        deserializeWorld(JSON.parse(String(rd.result)));
        toast('World loaded: ' + f.name);
      } catch (e) {
        toast('Load failed: ' + e.message, true);
      }
    };
    rd.readAsText(f);
    fileEl.value = '';
  });

  /* -------------------------------------------------------------- spawning */
  const SPAWN_LIMIT = 9200;
  function imFor(kind) {
    const vol = kind === 'cluster' ? 2.4 : (kind === 'jelly' ? 1.0 : (kind === 'rope' ? 0.4 : 0.6));
    return 1 / Math.max(0.2, S.density * vol);
  }

  function spawnAt(type, x0, y0, x1, y1) {
    const w = app.W;
    if (w.n > SPAWN_LIMIT) { toast('Particle budget reached (' + SPAWN_LIMIT + ')', true); return null; }
    const dx = x1 - x0, dy = y1 - y0;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const sgn = (v) => (v < 0 ? -1 : 1);
    const clampX = (v) => Math.max(8, Math.min(A.WORLD_W - 8, v));
    const clampY = (v) => Math.max(8, Math.min(A.WORLD_H - 8, v));
    let desc = '';
    switch (type) {
      case 'cloth': {
        const cw = Math.min(560, Math.max(60, adx || 240));
        const ch = Math.min(430, Math.max(40, ady || 220));
        const cols = Math.max(3, Math.round(cw / 21)), rows = Math.max(3, Math.round(ch / 21));
        const ox = clampX(x0 - (dx < 0 ? cw : 0)), oy = clampY(y0 - (dy < 0 ? ch : 0));
        A.buildCloth(w, { x0: ox, y0: oy, cols: cols, rows: rows, sp: 21, im: imFor('cloth'), hue: 168 });
        desc = 'cloth ' + cols + '×' + rows;
        break;
      }
      case 'rope': {
        const n = Math.max(4, Math.min(70, Math.round(Math.max(120, Math.hypot(dx, dy)) / 20)));
        const dirx = Math.abs(dx) < 1 ? 0.05 : sgn(dx), diry = Math.abs(dy) < 1 ? 0.9 : sgn(dy);
        A.buildChain(w, { x0: clampX(x0), y0: clampY(y0), dx: dirx, dy: diry, n: n, seg: 20, im: imFor('rope') });
        desc = 'rope ' + n + ' links';
        break;
      }
      case 'blob': {
        const r = Math.max(24, Math.min(170, Math.max(adx, ady) * 0.5 || 60));
        A.buildBlob(w, { cx: clampX(x0), y0: clampY(y0), r: r, n: Math.round(Math.max(16, r / 3.4)), im: imFor('blob'), hue: 344 });
        desc = 'soft body r=' + Math.round(r);
        break;
      }
      case 'balloon': {
        const r = Math.max(24, Math.min(170, Math.max(adx, ady) * 0.5 || 62));
        A.buildBlob(w, { cx: clampX(x0), y0: clampY(y0), r: r, n: Math.round(Math.max(16, r / 3.2)), im: imFor('blob') * 0.55, hue: 300, core: true });
        desc = 'balloon r=' + Math.round(r);
        break;
      }
      case 'jelly': {
        const cw = Math.min(300, Math.max(40, adx || 150)), ch = Math.min(300, Math.max(40, ady || 130));
        const cols = Math.max(3, Math.round(cw / 26)), rows = Math.max(3, Math.round(ch / 26));
        A.buildJelly(w, {
          x0: clampX(x0 - (dx < 0 ? cw : 0)), y0: clampY(y0 - (dy < 0 ? ch : 0)),
          cols: cols, rows: rows, sp: 26, im: imFor('jelly'), hue: 214
        });
        desc = 'jelly ' + cols + '×' + rows;
        break;
      }
      case 'ball': {
        const r = Math.max(20, Math.min(120, Math.max(adx, ady) * 0.5 || 44));
        A.buildCluster(w, { cx: clampX(x0), y0: clampY(y0), r: r, sp: 15, im: imFor('cluster'), name: 'puck' });
        desc = 'rigid puck r=' + Math.round(r);
        break;
      }
      case 'circle': {
        const r = Math.max(16, Math.min(200, Math.max(adx, ady) * 0.5 || 70));
        A.addShape(w, { kind: 'circle', cx: clampX(x0), cy: clampY(y0), r: r });
        desc = 'static circle r=' + Math.round(r);
        break;
      }
      case 'box': {
        const hw = Math.max(12, Math.min(280, adx * 0.5 || 90)), hh = Math.max(12, Math.min(280, ady * 0.5 || 60));
        A.addShape(w, { kind: 'box', cx: clampX(x0), cy: clampY(y0), hw: hw, hh: hh, angle: 0 });
        desc = 'static box';
        break;
      }
      case 'spinner': {
        const hw = Math.max(30, Math.min(260, adx * 0.5 || 120)), hh = Math.max(8, Math.min(60, ady * 0.5 || 12));
        A.addShape(w, { kind: 'box', cx: clampX(x0), cy: clampY(y0), hw: hw, hh: hh, angle: 0, spin: 1.6 });
        desc = 'spinning paddle';
        break;
      }
      default: return null;
    }
    saveSession();
    return desc;
  }

  doc.getElementById('btnDrop').addEventListener('click', () => {
    const d = spawnAt(app.spawnType, A.WORLD_W * 0.5, 140, A.WORLD_W * 0.5 + 150, 240);
    if (d) toast('Dropped ' + d);
  });

  /* ---------------------------------------------------------------- pointer */
  const pointers = new Map();

  function toWorld(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return R.screenToWorld(clientX - rect.left, clientY - rect.top);
  }

  function beginTool(p, e) {
    const w = app.W;
    const rad = S.grabRadius;
    switch (app.tool) {
      case 'grab': {
        const idx = [];
        let best = -1, bd = 1e18;
        for (let i = 0; i < w.n; i++) {
          if (!w.act[i]) continue;
          const dx = w.x[i] - p.x, dy = w.y[i] - p.y;
          const d2 = dx * dx + dy * dy;
          if (d2 < rad * rad) {
            idx.push(i);
            if (d2 < bd) { bd = d2; best = i; }
          }
        }
        if (idx.length > 44) {           /* keep the strongest, closest ones */
          idx.sort((a, b) => {
            const da = (w.x[a] - p.x) ** 2 + (w.y[a] - p.y) ** 2;
            const db = (w.x[b] - p.x) ** 2 + (w.y[b] - p.y) ** 2;
            return da - db;
          });
          idx.length = 44;
        }
        p.grab = { idx: idx, n: idx.length, tx: p.x, ty: p.y };
        if (!idx.length) {
          toast('Nothing within ' + Math.round(rad) + ' u — widen the radius with [ ]', true);
        }
        break;
      }
      case 'pin': {
        const i = A.nearestParticle(w, p.x, p.y, 18);
        p.pinMode = (i >= 0 && w.pin[i]) ? 'unpin' : 'pin';
        applyPin(p);
        break;
      }
      case 'cut': {
        p.cut = A.cutSegment(w, p.px, p.py, p.x, p.y);
        app.cutTrail.length = 0;
        app.cutTrail.push(p.x, p.y);
        break;
      }
      case 'push':
      case 'wind':
        break;
      case 'spawn': {
        app.spawnGhost = { x: p.x, y: p.y, w: 0, h: 0 };
        break;
      }
      case 'erase': {
        const b = A.eraseBody(w, p.x, p.y, 26);
        if (b) toast('Deleted ' + b.name + ' (' + b.pn + ' particles)');
        else toast('No body under the cursor', true);
        break;
      }
    }
    void e;
  }

  function applyPin(p) {
    const w = app.W;
    const r = 14;
    let n = 0;
    for (let i = 0; i < w.n; i++) {
      if (!w.act[i]) continue;
      const dx = w.x[i] - p.x, dy = w.y[i] - p.y;
      if (dx * dx + dy * dy > r * r) continue;
      if (p.pinMode === 'pin' && !w.pin[i]) { A.pinP(w, i, w.x[i], w.y[i]); n++; }
      else if (p.pinMode === 'unpin' && w.pin[i]) { A.unpinP(w, i); n++; }
    }
    return n;
  }

  function moveTool(p) {
    const w = app.W;
    switch (app.tool) {
      case 'grab':
        if (p.grab) { p.grab.tx = p.x; p.grab.ty = p.y; }
        break;
      case 'pin':
        applyPin(p);
        break;
      case 'cut': {
        const n = A.cutSegment(w, p.px, p.py, p.x, p.y);
        p.cut = (p.cut || 0) + n;
        if (app.cutTrail.length > 90) { app.cutTrail.splice(0, 2); }
        app.cutTrail.push(p.x, p.y);
        break;
      }
      case 'push': {
        const sp = Math.hypot(p.dx, p.dy);
        if (sp > 0.6) {
          const k = Math.min(6, sp * 0.55) * (0.4 + S.grabK);
          A.applyImpulse(w, p.x, p.y, S.grabRadius, p.dx, p.dy, k);
        }
        break;
      }
      case 'wind': {
        const sp = Math.hypot(p.dx, p.dy);
        let ux = 0, uy = 0;
        if (sp > 0.4) { ux = p.dx / sp; uy = p.dy / sp; }
        else { ux = S.windDx; uy = S.windDy; }
        w.gust = { x: p.x, y: p.y, r: Math.max(40, S.grabRadius * 1.5),
          k: 0.6 + S.grabK * 1.8, dx: ux, dy: uy };
        break;
      }
      case 'spawn': {
        if (app.spawnGhost) {
          app.spawnGhost.w = p.x - app.spawnGhost.ox;
          app.spawnGhost.h = p.y - app.spawnGhost.oy;
        }
        break;
      }
      case 'erase': {
        const b = A.eraseBody(w, p.x, p.y, 20);
        if (b) toast('Deleted ' + b.name);
        break;
      }
    }
  }

  function endTool(p) {
    if (app.tool === 'spawn' && app.spawnGhost) {
      const g = app.spawnGhost;
      const d = spawnAt(app.spawnType, g.ox, g.oy, g.ox + g.w, g.oy + g.h);
      if (d) toast('Spawned ' + d);
      app.spawnGhost = null;
    }
    if (app.tool === 'cut' && p.cut) toast('Severed ' + p.cut + ' constraints');
    if (app.tool === 'wind') app.W.gust = null;
    if (p.grab) p.grab = null;
  }

  function syncGrab() {
    const idx = [];
    for (const p of pointers.values()) if (p.grab && p.grab.idx) idx.push(...p.grab.idx);
    if (!idx.length) { app.W.grab = null; app.grabs = []; return; }
    const g = { idx: idx, n: idx.length, tx: 0, ty: 0 };
    let cx = 0, cy = 0;
    for (const p of pointers.values()) if (p.grab) { cx += p.grab.tx; cy += p.grab.ty; }
    const k = pointers.size || 1;
    g.tx = cx / k; g.ty = cy / k;
    app.W.grab = g;
    app.grabs = Array.from(pointers.values()).filter((p) => p.grab).map((p) => p.grab);
  }

  canvas.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 && e.pointerType === 'mouse') return;
    const [wx, wy] = toWorld(e.clientX, e.clientY);
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    const p = { id: e.pointerId, x: wx, y: wy, px: wx, py: wy, dx: 0, dy: 0, t: performance.now() };
    pointers.set(e.pointerId, p);
    app.pointer.x = wx; app.pointer.y = wy; app.pointer.inside = true;
    app.pointer.down = true;
    app.pointer.px = wx; app.pointer.py = wy;
    beginTool(p, e);
    syncGrab();
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', (e) => {
    const [wx, wy] = toWorld(e.clientX, e.clientY);
    let p = pointers.get(e.pointerId);
    if (!p) {
      p = { id: e.pointerId, x: wx, y: wy, px: wx, py: wy, dx: 0, dy: 0, t: performance.now() };
      if (!view.paused || !app.pointer.down) { /* hover tracking only */ }
    }
    const now = performance.now();
    const dt = Math.max(8, now - p.t) / 1000;
    p.dx = (wx - p.x) / dt / 26;
    p.dy = (wy - p.y) / dt / 26;
    p.px = p.x; p.py = p.y;
    p.x = wx; p.y = wy; p.t = now;
    if (!pointers.has(e.pointerId)) pointers.set(e.pointerId, p);
    app.pointer.x = wx; app.pointer.y = wy; app.pointer.inside = true;
    app.pointer.dx = p.dx; app.pointer.dy = p.dy;
    if (app.pointer.down) { moveTool(p); syncGrab(); }
  });

  function releasePointer(e) {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    endTool(p);
    pointers.delete(e.pointerId);
    if (!pointers.size) {
      app.pointer.down = false;
      app.W.gust = null;
      app.W.grab = null;
      app.grabs = [];
      app.cutTrail.length = 0;
    }
    syncGrab();
  }
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  canvas.addEventListener('pointerleave', (e) => {
    app.pointer.inside = false;
    releasePointer(e);
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  /* -------------------------------------------------------------- keyboard */
  const KEYMAP = { '1': 'grab', '2': 'pin', '3': 'cut', '4': 'push', '5': 'wind', '6': 'spawn', '7': 'erase' };
  doc.addEventListener('keydown', (e) => {
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    const k = e.key;
    if (k === ' ' || k === 'Spacebar') { setPaused(!view.paused); e.preventDefault(); }
    else if (k === 'n' || k === 'N') { doc.getElementById('btnStep').click(); }
    else if (k === 'r' || k === 'R') { loadScenario(app.sceneId); }
    else if (k === 'x' || k === 'X') { doc.getElementById('btnClear').click(); }
    else if (k === 'v' || k === 'V') {
      const i = MODES.findIndex((m) => m.id === app.mode);
      const nx = e.shiftKey ? (i + MODES.length - 1) % MODES.length : (i + 1) % MODES.length;
      app.mode = MODES[nx].id;
      modeSel.value = app.mode;
      toast('View: ' + MODES[nx].name + ' — ' + MODES[nx].hint);
      saveSession();
    }
    else if (KEYMAP[k]) setTool(KEYMAP[k]);
    else if (k === '[') { S.grabRadius = Math.max(6, S.grabRadius - 6); syncControls(); saveSession(); }
    else if (k === ']') { S.grabRadius = Math.min(160, S.grabRadius + 6); syncControls(); saveSession(); }
    else if (k === ',') { S.substeps = Math.max(1, S.substeps - 1); syncControls(); saveSession(); }
    else if (k === '.') { S.substeps = Math.min(8, S.substeps + 1); syncControls(); saveSession(); }
    else if (k === 'h' || k === 'H') { S.hud = !S.hud; syncControls(); saveSession(); }
    else if (k === 'p' || k === 'P') setPanel(!view.panelOpen);
    else if (k === 'Escape') { pointers.clear(); app.W.grab = null; app.grabs = []; }
    else return;
    e.preventDefault();
  });

  /* shortcut legend */
  doc.getElementById('keys').innerHTML =
    '<b>Space</b> pause · <b>N</b> step · <b>R</b> reset · <b>X</b> clear<br>' +
    '<b>1-7</b> tools · <b>V</b> / <b>Shift+V</b> viz mode<br>' +
    '<b>[ ]</b> tool radius · <b>, .</b> substeps · <b>H</b> hud · <b>P</b> panel';

  /* --------------------------------------------------------------- the HUD */
  const fpsHist = new Float32Array(120);
  let fpsIdx = 0;
  let hudText = '';
  function updateHud(fps, fpsAvg) {
    if (!S.hud) { hud.style.display = 'none'; return; }
    hud.style.display = 'block';
    const st = app.W.stats;
    const err = st.maxErr.toFixed(1);
    const strain = (st.maxStrain * 100).toFixed(1);
    const ti = TOOL_INFO[app.tool] || TOOL_INFO.grab;
    const modeName = (MODES.find((m) => m.id === app.mode) || MODES[0]).name;
    const sc = scen.byId(app.sceneId);
    const lines = [
      (view.paused ? '‖ PAUSED  ' : '▶ RUNNING ') + '  ' + fps.toFixed(1) + ' fps (avg ' + fpsAvg.toFixed(1) + ')',
      'particles <b>' + st.parts + '</b>   constraints <b>' + st.cons + '</b>   bodies ' + app.W.bodies.filter((b) => !b.dead).length,
      'collision pairs <b>' + st.pairsTested + '</b>   contacts ' + st.contacts + '   tears ' + st.tears,
      'solver ' + st.iters + ' it × ' + st.subs + ' sub   step ' + st.solveMs.toFixed(2) + ' ms   draw ' + st.renderMs.toFixed(2) + ' ms',
      'max link error <b>' + err + ' u</b>   strain ' + strain + ' %   skin ' + S.thick.toFixed(1),
      'tool <b>' + ti.name + '</b>   view <b>' + modeName + '</b>   r=' + Math.round(S.grabRadius) + ' u',
      'scenario <b>' + sc.name + '</b>   g ' + Math.round(S.gravity) + ' u/s² @ ' + Math.round(S.gravDir) + '°   wind ' + Math.round(S.wind)
    ];
    const t = lines.join('\n');
    if (t !== hudText) { hud.innerHTML = t; hudText = t; }
    if (S.spark && sparkCtx) drawSpark();
  }

  function drawSpark() {
    if (!sparkCtx || !S.spark) return;
    const c = sparkCtx, wpx = sparkC.width, hpx = sparkC.height;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, wpx, hpx);
    c.fillStyle = '#0d1826';
    c.fillRect(0, 0, wpx, hpx);
    c.strokeStyle = 'rgba(110,231,255,0.35)';
    c.beginPath();
    const y60 = hpx - (60 / 90) * hpx;
    c.moveTo(0, y60); c.lineTo(wpx, y60);
    c.stroke();
    c.fillStyle = 'rgba(140,170,200,0.65)';
    c.font = '9px ui-monospace,monospace';
    c.fillText('60 fps', 3, y60 - 3);
    c.beginPath();
    const n = fpsHist.length;
    for (let i = 0; i < n; i++) {
      const v = fpsHist[(fpsIdx + i) % n];
      const x = (i / (n - 1)) * wpx;
      const y = hpx - Math.min(90, v) / 90 * hpx;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.strokeStyle = '#5fe3d0';
    c.lineWidth = 1.5;
    c.stroke();
  }

  /* ------------------------------------------------------------- main loop */
  let last = performance.now();
  let acc = 0, frames = 0, fps = 60, fpsAvg = 60, lastHud = 0;
  let stepCounter = 0;

  function loop(now) {
    requestAnimationFrame(loop);
    const dtReal = Math.min(80, now - last);
    last = now;
    acc += dtReal; frames++;
    if (acc >= 250) {
      fps = (frames * 1000) / acc;
      fpsAvg = fpsAvg * 0.6 + fps * 0.4;
      fpsHist[fpsIdx % fpsHist.length] = fps;
      fpsIdx++;
      acc = 0; frames = 0;
    }
    const t0 = performance.now();
    if (!view.paused || view.stepOnce) {
      view.stepOnce = false;
      rebuildForces();
      const dt = (1 / 60) * S.dtScale;
      const ts = performance.now();
      A.stepFrame(app.W, S, dt);
      app.W.stats.solveMs = performance.now() - ts;
      stepCounter++;
    }
    const t1 = performance.now();
    R.draw(app.W, S, app);
    app.W.stats.renderMs = performance.now() - t1;
    app.W.stats.fps = fps;
    if (now - lastHud > 110) { updateHud(fps, fpsAvg); lastHud = now; }
    void t0;
  }

  /* ------------------------------------------------------------------ boot */
  const saved = loadSession();
  buildToolButtons();
  syncToolButtons();
  loadScenario(saved || (scen.list.find((s) => s.default) || scen.list[0]).id, true);
  syncControls();
  setPaused(view.paused);
  refit();

  let ro = null;
  if (window.ResizeObserver) {
    ro = new ResizeObserver(() => refit());
    ro.observe(stage);
  }
  window.addEventListener('resize', () => { refit(); });

  /* debug / harness hook */
  window.SOFTPLAY = {
    version: '1.0.0',
    api: api,
    app: app,
    get world() { return app.W; },
    stats() {
      const st = app.W.stats;
      return { fps: Math.round(st.fps * 10) / 10, particles: st.parts, constraints: st.cons,
        pairs: st.pairsTested, contacts: st.contacts, iters: st.iters, substeps: st.subs,
        maxErr: st.maxErr, tool: app.tool, mode: app.mode, scene: app.sceneId,
        paused: view.paused, solveMs: Math.round(st.solveMs * 100) / 100 };
    },
    setTool(t) { setTool(t); },
    setMode(m) { app.mode = m; modeSel.value = m; },
    setScenario(id) { scenSel.value = id; loadScenario(id); },
    setSetting(k, v) { S[k] = v; syncControls(); },
    spawn(type, x, y, w, h) { return spawnAt(type || app.spawnType, x, y, x + (w || 0), y + (h || 0)); },
    /* scripted pointer for automated checks: real DOM PointerEvents */
    drag(sx, sy, ex, ey, steps) {
      const mk = (type, x, y, id) => {
        const ev = new PointerEvent(type, {
          pointerType: 'mouse', pointerId: id || 1, button: 0, buttons: type === 'pointerup' ? 0 : 1,
          clientX: x, clientY: y, bubbles: true, cancelable: true
        });
        canvas.dispatchEvent(ev);
      };
      const n = steps || 8;
      mk('pointermove', sx, sy);
      mk('pointerdown', sx, sy);
      for (let i = 1; i <= n; i++) {
        const t = i / n;
        mk('pointermove', sx + (ex - sx) * t, sy + (ey - sy) * t);
      }
      mk('pointerup', ex, ey);
      return true;
    },
    screenToWorld: (x, y) => R.screenToWorld(x, y),
    refit: refit,
    errors: app.errors
  };
  window.addEventListener('error', (e) => {
    app.errors.push(String(e.message));
    if (app.errors.length > 20) app.errors.shift();
  });

  requestAnimationFrame(loop);
  return app;
}

bootApp(CORE_API, makeScenarios, createRenderer);

})();
</script>
</body>
</html>
