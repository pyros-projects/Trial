<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Soft-Body, Cloth & Constraint Playground</title>
<style>
:root{
  --bg:#0b111b; --bg2:#121c2b; --panel:rgba(17,26,40,.86); --line:rgba(120,170,220,.16);
  --ink:#dce8f5; --dim:#8ea6c0; --accent:#5fe3d0; --accent2:#6fb4ff; --warn:#ff7a8c;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  overflow:hidden; -webkit-text-size-adjust:100%;
}
#app{display:flex; flex-direction:column; height:100%; width:100%}

/* ---------------------------------------------------------------- top bar */
header{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  padding:8px 10px; background:linear-gradient(180deg,#16233a,#101a29);
  border-bottom:1px solid var(--line); z-index:5;
}
.brand{display:flex; flex-direction:column; gap:1px; min-width:0}
.brand b{font-size:12.5px; letter-spacing:.14em; color:var(--accent); font-weight:650; white-space:nowrap}
.brand span{font-size:10.5px; color:var(--dim); max-width:44vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.spacer{flex:1 1 8px}
select,button{
  font-family:var(--sans); font-size:12px; color:var(--ink);
  background:#1b293f; border:1px solid var(--line); border-radius:7px;
  padding:6px 9px; cursor:pointer; transition:background .12s,border-color .12s;
}
select{padding:6px 6px}
button:hover,select:hover{background:#233450; border-color:rgba(140,200,255,.4)}
button:active{transform:translateY(1px)}
button.on{background:var(--accent); color:#06231f; border-color:var(--accent); font-weight:650}
button.warn.on{background:var(--warn); color:#2b0710; border-color:var(--warn)}
.tools{display:flex; gap:4px; overflow-x:auto; padding-bottom:2px; max-width:100%}
.tool{display:flex; flex-direction:column; align-items:center; gap:2px; min-width:62px; padding:5px 6px}
.tool small{font-size:9px; opacity:.6; letter-spacing:.06em}
.tool.active{background:#2b4a6b; border-color:var(--accent2); color:#eaf6ff}
.tool.active small{opacity:.85}

/* ------------------------------------------------------------------ stage */
.stage{position:relative; flex:1 1 auto; min-height:0; overflow:hidden}
canvas#sim{
  display:block; width:100%; height:100%; touch-action:none; cursor:crosshair;
  background:#0b111b;
}
#hud{
  position:absolute; left:10px; top:10px; pointer-events:none;
  background:rgba(9,15,24,.72); border:1px solid var(--line); border-radius:9px;
  padding:8px 10px; font-family:var(--mono); font-size:10.5px; line-height:1.5;
  color:#cfe3f7; backdrop-filter:blur(3px); max-width:min(62vw,430px);
  white-space:pre; text-shadow:0 1px 1px rgba(0,0,0,.6);
}
#hud b{color:var(--accent); font-weight:600}
#hud .bad{color:var(--warn)}
#spark{display:block; margin-top:4px; opacity:.85}
#hint{
  position:absolute; left:10px; bottom:10px; right:10px; pointer-events:none;
  font-family:var(--mono); font-size:10px; color:#9fb6cf;
  background:rgba(9,15,24,.6); border:1px solid var(--line); border-radius:8px;
  padding:6px 9px; line-height:1.55;
}
#hint kbd{
  background:#22334c; border:1px solid var(--line); border-radius:4px;
  padding:0 4px; font-family:var(--mono); font-size:9.5px; color:#cfe3f7;
}
#toast{
  position:absolute; left:50%; top:14px; transform:translateX(-50%);
  display:flex; flex-direction:column; gap:5px; align-items:center; pointer-events:none;
}
.toast{
  font-family:var(--mono); font-size:11px; padding:6px 12px; border-radius:20px;
  background:rgba(20,34,52,.94); border:1px solid rgba(120,200,255,.35); color:#dceefc;
  animation:pop .18s ease-out; box-shadow:0 4px 18px rgba(0,0,0,.4);
}
.toast.err{background:rgba(58,20,28,.95); border-color:rgba(255,122,140,.5); color:#ffd7dd}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}

/* ------------------------------------------------------------------- panel */
#panel{
  position:absolute; right:8px; top:8px; bottom:8px; width:286px;
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:8px; overflow-y:auto; overscroll-behavior:contain;
  backdrop-filter:blur(6px); box-shadow:0 6px 26px rgba(0,0,0,.35);
  transition:transform .2s ease, opacity .2s ease;
}
#panel.hidden{transform:translateX(112%); opacity:.0; pointer-events:none}
.grp{margin-bottom:10px}
.grp>h4{
  margin:0 0 6px; font-size:9.5px; letter-spacing:.18em; color:var(--accent);
  font-weight:650; border-bottom:1px solid var(--line); padding-bottom:3px;
}
.ctl{display:flex; align-items:center; gap:6px; margin:0 0 5px}
.ctl label{flex:0 0 96px; font-size:10.5px; color:var(--dim)}
.ctl input[type=range]{flex:1 1 auto; min-width:0; height:16px; accent-color:var(--accent)}
.ctl output{
  flex:0 0 52px; text-align:right; font-family:var(--mono); font-size:10px;
  color:#cfe3f7; background:#16233a; border-radius:4px; padding:2px 4px;
}
.ctl.chk label{flex:1 1 auto; color:var(--ink)}
.ctl.chk input{accent-color:var(--accent); width:15px; height:15px}
.row{display:flex; gap:5px; flex-wrap:wrap}
.row button{flex:1 1 auto; font-size:11px; padding:6px 7px}
#keys{font-family:var(--mono); font-size:9.5px; color:#93aabf; line-height:1.7}
#keys b{color:var(--accent2)}
#fab{
  position:absolute; right:10px; bottom:10px; z-index:6; display:none;
  background:var(--accent); color:#06231f; border:0; border-radius:20px;
  padding:9px 13px; font-size:12px; font-weight:650; box-shadow:0 4px 16px rgba(0,0,0,.45);
}

/* --------------------------------------------------------------- narrow UI */
@media (max-width:820px){
  header{padding:6px}
  .brand{width:100%}
  .brand span{max-width:80vw}
  #panel{
    left:6px; right:6px; top:auto; bottom:6px; width:auto; height:52%;
    max-height:52%;
  }
  #panel.hidden{transform:translateY(115%)}
  #fab{display:block; bottom:auto; top:8px; right:10px}
  #hud{font-size:9px; max-width:82vw; left:6px; top:6px; padding:6px 7px}
  #hint{display:none}
  .stage{padding-bottom:0}
}
@media (max-width:390px){
  #hud{font-size:8.2px; line-height:1.4}
  .ctl label{flex-basis:82px; font-size:9.8px}
  .ctl output{flex-basis:44px; font-size:9.4px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <b>SOFT-BODY · CLOTH · CONSTRAINT PLAYGROUND</b>
      <span id="blurb">XPBD constraint solver · drag, pin, cut, tear</span>
    </div>
    <div class="spacer"></div>
    <select id="scenario" title="Scenario" aria-label="Scenario"></select>
    <select id="mode" title="Visualisation mode" aria-label="Visualisation mode"></select>
    <button id="btnPause" title="Pause / resume (Space)">⏸ Pause</button>
    <button id="btnStep" title="Single step (N)">⏭ Step</button>
    <button id="btnReset" title="Reset scenario (R)">↺ Reset</button>
    <button id="btnClear" title="Delete all objects (X)">✕ Clear</button>
    <div class="tools" id="tools" role="toolbar" aria-label="Tools"></div>
  </header>

  <div class="stage" id="stage">
    <canvas id="sim" aria-label="Physics simulation canvas"></canvas>
    <div id="hud" aria-hidden="true"></div>
    <div id="toast" aria-live="polite"></div>
    <div id="hint"></div>
    <button id="fab" aria-expanded="true">Controls</button>
    <aside id="panel" aria-label="Controls">
      <div class="grp">
        <h4>WORLD</h4>
        <div class="ctl"><label for="s-gravity">Gravity</label><input id="s-gravity" type="range" min="0" max="2600" step="10" data-s="gravity" data-fmt="int"><output></output></div>
        <div class="ctl"><label for="s-gravDir">Gravity dir °</label><input id="s-gravDir" type="range" min="0" max="360" step="1" data-s="gravDir" data-fmt="int"><output></output></div>
        <div class="ctl"><label for="s-wind">Wind</label><input id="s-wind" type="range" min="0" max="1400" step="10" data-s="wind" data-fmt="int"><output></output></div>
        <div class="ctl"><label for="s-windDir">Wind dir °</label><input id="s-windDir" type="range" min="0" max="360" step="1" data-s="windDir" data-fmt="int"><output></output></div>
        <div class="ctl"><label for="s-windTurb">Turbulence</label><input id="s-windTurb" type="range" min="0" max="1" step="0.01" data-s="windTurb" data-fmt="f2"><output></output></div>
      </div>
      <div class="grp">
        <h4>MATERIAL</h4>
        <div class="ctl"><label for="s-kStruct">Structural k</label><input id="s-kStruct" type="range" min="0.02" max="1" step="0.01" data-s="kStruct" data-fmt="f2"><output></output></div>
        <div class="ctl"><label for="s-kShear">Shear k</label><input id="s-kShear" type="range" min="0" max="1" step="0.01" data-s="kShear" data-fmt="f2"><output></output></div>
        <div class="ctl"><label for="s-kBend">Bending k</label><input id="s-kBend" type="range" min="0" max="1" step="0.01" data-s="kBend" data-fmt="f2"><output></output></div>
        <div class="ctl"><label for="s-pressure">Pressure</label><input id="s-pressure" type="range" min="0" max="1" step="0.01" data-s="pressure" data-fmt="f2"><output></output></div>
        <div class="ctl"><label for="s-tear">Tear threshold</label><input id="s-tear" type="range" min="0.04" max="2" step="0.01" data-s="tear" data-fmt="f2"><output></output></div>
        <div class="ctl chk"><label for="s-tearOn">Tearing enabled</label><input id="s-tearOn" type="checkbox" data-c="tearOn"></div>
        <div class="ctl"><label for="s-density">Object density</label><input id="s-density" type="range" min="0.2" max="6" step="0.1" data-s="density" data-fmt="f1"><output></output></div>
      </div>
      <div class="grp">
        <h4>SOLVER</h4>
        <div class="ctl"><label for="s-iters">Iterations</label><input id="s-iters" type="range" min="1" max="24" step="1" data-s="iters" data-fmt="int"><output></output></div>
        <div class="ctl"><label for="s-substeps">Substeps</label><input id="s-substeps" type="range" min="1" max="8" step="1" data-s="substeps" data-fmt="int"><output></output></div>
        <div class="ctl"><label for="s-dtScale">Timestep ×</label><input id="s-dtScale" type="range" min="0.1" max="1.6" step="0.05" data-s="dtScale" data-fmt="f2"><output></output></div>
        <div class="ctl"><label for="s-damping">Damping</label><input id="s-damping" type="range" min="0" max="4" step="0.05" data-s="damping" data-fmt="f2"><output></output></div>
        <div class="ctl"><label for="s-restitution">Restitution</label><input id="s-restitution" type="range" min="0" max="0.95" step="0.01" data-s="restitution" data-fmt="f2"><output></output></div>
        <div class="ctl"><label for="s-friction">Friction</label><input id="s-friction" type="range" min="0" max="1" step="0.01" data-s="friction" data-fmt="f2"><output></output></div>
        <div class="ctl"><label for="s-thick">Collision skin</label><input id="s-thick" type="range" min="1" max="16" step="0.5" data-s="thick" data-fmt="f1"><output></output></div>
        <div class="ctl chk"><label for="s-selfCollide">Self-collision</label><input id="s-selfCollide" type="checkbox" data-c="selfCollide"></div>
        <div class="ctl chk"><label for="s-pairCollide">Object↔object + obstacles</label><input id="s-pairCollide" type="checkbox" data-c="pairCollide"></div>
      </div>
      <div class="grp">
        <h4>INTERACTION</h4>
        <div class="ctl"><label for="s-grabRadius">Radius</label><input id="s-grabRadius" type="range" min="6" max="160" step="1" data-s="grabRadius" data-fmt="int"><output></output></div>
        <div class="ctl"><label for="s-grabK">Strength</label><input id="s-grabK" type="range" min="0.02" max="1" step="0.01" data-s="grabK" data-fmt="f2"><output></output></div>
        <div class="row">
          <select id="spawnType" title="Object to spawn" aria-label="Object to spawn"></select>
          <button id="btnDrop" title="Drop one at the top centre">Drop</button>
        </div>
      </div>
      <div class="grp">
        <h4>VIEW</h4>
        <div class="ctl chk"><label for="s-hud">Show diagnostics overlay</label><input id="s-hud" type="checkbox" data-c="hud"></div>
        <div class="ctl chk"><label for="s-spark">FPS sparkline</label><input id="s-spark" type="checkbox" data-c="spark"></div>
        <canvas id="spark" width="252" height="30" style="width:100%;height:30px;background:#0d1826;border-radius:6px;border:1px solid var(--line)"></canvas>
      </div>
      <div class="grp">
        <h4>SESSION</h4>
        <div class="row">
          <button id="btnSave">Save world .json</button>
          <button id="btnLoad">Load world .json</button>
        </div>
        <div class="row" style="margin-top:5px">
          <button id="btnDefaults">Reset all settings</button>
          <button id="btnCentre">Recentre view</button>
        </div>
        <input id="fileImport" type="file" accept="application/json,.json" hidden>
      </div>
      <div class="grp">
        <h4>SHORTCUTS</h4>
        <div id="keys"></div>
      </div>
    </aside>
  </div>
</div>
<script>
__SCRIPTS__
</script>
</body>
</html>
