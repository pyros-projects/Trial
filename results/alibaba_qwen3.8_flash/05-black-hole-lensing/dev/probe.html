<!doctype html><html><head><meta charset="utf-8"><title>probe</title></head>
<body><canvas id="c" width="64" height="64"></canvas><pre id="out"></pre>
<script>
const out=[];
const c=document.getElementById('c');
const gl=c.getContext('webgl2');
out.push('webgl2='+!!gl);
if(gl){
  out.push('VERSION: '+gl.getParameter(gl.VERSION));
  out.push('VENDOR: '+gl.getParameter(gl.VENDOR));
  out.push('RENDERER: '+gl.getParameter(gl.RENDERER));
  out.push('GLSL: '+gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
  out.push('maxTexSize='+gl.getParameter(gl.MAX_TEXTURE_SIZE));
  out.push('max3DTex='+gl.getParameter(gl.MAX_3D_TEXTURE_SIZE));
  out.push('maxDrawBuf='+gl.getParameter(gl.MAX_DRAW_BUFFERS));
  out.push('maxTexUnits='+gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS));
  out.push('floatLinear='+!!gl.getExtension('OES_texture_float_linear'));
  const cbf=gl.getExtension('EXT_color_buffer_float');
  out.push('EXT_color_buffer_float='+!!cbf);
  // test RGBA16F render target
  const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,64,64,0,gl.RGBA,gl.HALF_FLOAT,null);
  const fbo=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  out.push('fbo16F complete='+ (gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE));
  const ok=gl.getExtension('EXT_float_blend'); out.push('EXT_float_blend='+!!ok);
  const dbg=gl.getExtension('WEBGL_debug_renderer_info');
  if(dbg) out.push('UNMASKED: '+gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
}
out.push('dpr='+window.devicePixelRatio);
document.getElementById('out').textContent=out.join('\n');
window.__probe=out.join('\n');
</script></body></html>
