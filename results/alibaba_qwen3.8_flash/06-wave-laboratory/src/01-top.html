<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wave Interference & Diffraction Laboratory</title>
<style>
:root{
  --bg:#080b11; --bg2:#0d1219; --panel:#111823; --panel2:#151d2a; --line:#22303f;
  --ink:#cfe0ee; --ink2:#8ea3b8; --dim:#5f7488;
  --cy:#37d6c4; --am:#ffb454; --rd:#ff5d6c; --bl:#4aa3ff; --gn:#7ddc7d;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:13px/1.45 system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
/* ---------- top bar ---------- */
#bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;
  background:linear-gradient(180deg,#131c29,#0d131c);border-bottom:1px solid var(--line);z-index:5}
#bar h1{font-size:13px;margin:0 10px 0 0;font-weight:600;letter-spacing:.3px;color:#e6f2ff;white-space:nowrap}
#bar h1 b{color:var(--cy)}
.sp{flex:1 1 auto}
select,button,input[type=text],textarea{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  border-radius:4px;font:12px var(--mono);padding:3px 6px}
button{cursor:pointer}
button:hover{border-color:var(--cy);color:#fff}
button.on{background:#123b39;border-color:var(--cy);color:var(--cy)}
button.warn{background:#3a1d20;border-color:var(--rd);color:#ff9aa3}
button.big{padding:4px 9px}
#stab{display:flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line);
  border-radius:4px;background:var(--panel2);font:11px var(--mono);white-space:nowrap}
#stab .dot{width:8px;height:8px;border-radius:50%;background:var(--gn);box-shadow:0 0 6px var(--gn)}
#stab.mid{color:var(--am)} #stab.mid .dot{background:var(--am);box-shadow:0 0 6px var(--am)}
#stab.bad{color:var(--rd);border-color:var(--rd)} #stab.bad .dot{background:var(--rd);box-shadow:0 0 8px var(--rd)}
/* ---------- layout ---------- */
#main{display:flex;flex:1 1 auto;min-height:0}
#stage{position:relative;flex:1 1 auto;min-width:0;background:
  radial-gradient(1200px 500px at 50% 40%,#0e151f,#070a0f 80%);display:flex;flex-direction:column;padding:6px}
#cvwrap{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:auto}
#field{border:1px solid #1b2735;border-radius:3px;background:#05070b;touch-action:none;cursor:crosshair}
#panel{width:322px;flex:0 0 322px;border-left:1px solid var(--line);background:var(--panel);
  overflow-y:auto;padding:8px 10px 40px;font-size:12px}
#scopes{border-top:1px solid var(--line);background:var(--bg2);padding:4px 8px;display:flex;gap:8px;
  align-items:stretch;overflow-x:auto;height:150px;flex:0 0 150px}
.scopeCv{display:block}
/* ---------- panel bits ---------- */
.sec{border:1px solid var(--line);border-radius:5px;margin-bottom:8px;background:var(--panel2)}
.sec>.h{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);
  font:11px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--cy);cursor:pointer;user-select:none}
.sec>.h .tw{margin-left:auto;color:var(--dim)}
.sec.collapsed .body{display:none}
.body{padding:7px 8px}
.row{display:flex;align-items:center;gap:6px;margin:0 0 5px}
.row.wrap{flex-wrap:wrap}
.lbl{flex:0 0 96px;color:var(--ink2);font-size:11px}
.val{font:11px var(--mono);color:var(--am);flex:0 1 auto;max-width:168px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;text-align:right}
input[type=range]{flex:1 1 auto;min-width:52px;-webkit-appearance:none;appearance:none;height:16px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#25384a;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--cy);margin-top:-4px;border:1px solid #06514a}
input[type=range]::-moz-range-track{height:3px;background:#25384a;border-radius:2px}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--cy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;font-size:10px;
  line-height:1.15;text-align:center}
.tool kbd{font:9px var(--mono);color:var(--dim)}
.tool.sel{background:#123b39;border-color:var(--cy);color:var(--cy)}
.hint{color:var(--dim);font-size:11px;font-family:var(--mono);margin:4px 0 0}
.swatch{width:12px;height:12px;border-radius:2px;border:1px solid #2b3b4d;display:inline-block;vertical-align:-2px}
/* ---------- HUD ---------- */
#hud{position:absolute;left:14px;top:14px;background:rgba(6,10,15,.82);border:1px solid #1f2c3b;
  border-radius:5px;padding:6px 9px;font:11px/1.5 var(--mono);color:#a9c2d8;pointer-events:none;
  min-width:220px;backdrop-filter:blur(2px)}
#hud b{color:#e9f6ff;font-weight:600}
#hud .k{color:#617b91;display:inline-block;width:74px}
#hud .paused{color:var(--am)}
#hud .run{color:var(--cy)}
#hud .bad{color:var(--rd)}
#legend{position:absolute;right:14px;top:14px;background:rgba(6,10,15,.82);border:1px solid #1f2c3b;
  border-radius:5px;padding:5px 7px;font:10px var(--mono);color:#a9c2d8;pointer-events:none}
#toolbar{position:absolute;left:14px;bottom:12px;display:flex;gap:4px;background:rgba(6,10,15,.8);
  border:1px solid #1f2c3b;border-radius:5px;padding:4px}
#toolbar button{border:0;background:transparent;padding:3px 7px;font:11px var(--mono);color:var(--ink2)}
#toolbar button.on{background:#123b39;color:var(--cy);border-radius:3px}
#brushring{position:absolute;pointer-events:none;border:1px solid rgba(255,180,84,.85);border-radius:50%;
  transform:translate(-50%,-50%);display:none;box-shadow:0 0 0 1px rgba(0,0,0,.6) inset}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#1b2a3a;
  border:1px solid var(--cy);border-radius:4px;padding:5px 12px;font:11px var(--mono);
  color:var(--cy);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.scope{border:1px solid #1f2c3b;border-radius:4px;background:#0a0f16;flex:0 0 auto}
#noscopes{color:var(--dim);font:11px var(--mono);padding:14px 6px}
/* ---------- narrow ---------- */
@media (max-width:900px){
  #app{height:auto;overflow:visible}
  #main{flex-direction:column}
  #stage{padding:4px}
  /* without an explicit height the flex column collapses and the tank
     renders ~240px wide on a 390px phone */
  #cvwrap{height:min(56vh,430px);flex:0 0 auto}
  #panel{padding-bottom:24px}
  #panel{width:auto;flex:none;border-left:0;border-top:1px solid var(--line);max-height:none}
  #hud{font-size:10px;min-width:0;left:8px;top:8px;padding:4px 6px}
  #legend{display:none}
  #toolbar{left:8px;bottom:8px;flex-wrap:wrap;max-width:70vw}
}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <h1>WAVE LAB <b>2-D FDTD</b></h1>
    <select id="presetSel" title="Scene presets"></select>
    <button id="btnPause" class="big" title="Space">⏸ Pause</button>
    <button id="btnStep" class="big" title="S">⏭ Step</button>
    <select id="modeSel" title="Visualisation mode"></select>
    <div class="sp"></div>
    <div id="stab" title="Courant–Friedrichs–Lewy number c·dt/dx (limit 0.707)"><span class="dot"></span><span id="stabTxt">CFL —</span></div>
    <button id="btnUnsafe" title="Disable the stability clamp (lets unstable settings blow up)">safe-mode</button>
  </header>

  <div id="main">
    <div id="stage">
      <div id="cvwrap">
        <canvas id="field"></canvas>
        <div id="hud"></div>
        <div id="legend"><span id="legTitle"></span><br><canvas id="legC" width="176" height="10"></canvas><br><span id="legMin"></span></div>
        <div id="toolbar"></div>
        <div id="brushring"></div>
        <div id="toast"></div>
      </div>
    </div>

    <aside id="panel">
      <div class="sec" id="secTools"><div class="h">Tools & brush <span class="tw">▾</span></div><div class="body" id="pTools"></div></div>
      <div class="sec" id="secSrc"><div class="h">Source inspector <span class="tw">▾</span></div><div class="body" id="pSrc"></div></div>
      <div class="sec" id="secPhys"><div class="h">Field & numerics <span class="tw">▾</span></div><div class="body" id="pPhys"></div></div>
      <div class="sec" id="secDisp"><div class="h">Display <span class="tw">▾</span></div><div class="body" id="pDisp"></div></div>
      <div class="sec" id="secData"><div class="h">Scene data <span class="tw">▾</span></div><div class="body" id="pData"></div></div>
      <div class="sec" id="secKeys"><div class="h">Keys & help <span class="tw">▾</span></div><div class="body" id="pKeys"></div></div>
    </aside>
  </div>

  <footer id="scopes"><div id="noscopes">probes: pick the <b>probe</b> tool (P) and click the tank — each probe gets a live trace, amplitude, dominant frequency and spectrum</div></footer>
</div><script>
