<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wave Interference & Diffraction Laboratory</title>
<style>
:root{
  --bg:#080b11; --bg2:#0d1219; --panel:#111823; --panel2:#151d2a; --line:#22303f;
  --ink:#cfe0ee; --ink2:#8ea3b8; --dim:#5f7488;
  --cy:#37d6c4; --am:#ffb454; --rd:#ff5d6c; --bl:#4aa3ff; --gn:#7ddc7d;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:13px/1.45 system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
/* ---------- top bar ---------- */
#bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 10px;
  background:linear-gradient(180deg,#131c29,#0d131c);border-bottom:1px solid var(--line);z-index:5}
#bar h1{font-size:13px;margin:0 10px 0 0;font-weight:600;letter-spacing:.3px;color:#e6f2ff;white-space:nowrap}
#bar h1 b{color:var(--cy)}
.sp{flex:1 1 auto}
select,button,input[type=text],textarea{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  border-radius:4px;font:12px var(--mono);padding:3px 6px}
button{cursor:pointer}
button:hover{border-color:var(--cy);color:#fff}
button.on{background:#123b39;border-color:var(--cy);color:var(--cy)}
button.warn{background:#3a1d20;border-color:var(--rd);color:#ff9aa3}
button.big{padding:4px 9px}
#stab{display:flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line);
  border-radius:4px;background:var(--panel2);font:11px var(--mono);white-space:nowrap}
#stab .dot{width:8px;height:8px;border-radius:50%;background:var(--gn);box-shadow:0 0 6px var(--gn)}
#stab.mid{color:var(--am)} #stab.mid .dot{background:var(--am);box-shadow:0 0 6px var(--am)}
#stab.bad{color:var(--rd);border-color:var(--rd)} #stab.bad .dot{background:var(--rd);box-shadow:0 0 8px var(--rd)}
/* ---------- layout ---------- */
#main{display:flex;flex:1 1 auto;min-height:0}
#stage{position:relative;flex:1 1 auto;min-width:0;background:
  radial-gradient(1200px 500px at 50% 40%,#0e151f,#070a0f 80%);display:flex;flex-direction:column;padding:6px}
#cvwrap{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;image-rendering:auto}
#field{border:1px solid #1b2735;border-radius:3px;background:#05070b;touch-action:none;cursor:crosshair}
#panel{width:322px;flex:0 0 322px;border-left:1px solid var(--line);background:var(--panel);
  overflow-y:auto;padding:8px 10px 40px;font-size:12px}
#scopes{border-top:1px solid var(--line);background:var(--bg2);padding:4px 8px;display:flex;gap:8px;
  align-items:stretch;overflow-x:auto;height:150px;flex:0 0 150px}
.scopeCv{display:block}
/* ---------- panel bits ---------- */
.sec{border:1px solid var(--line);border-radius:5px;margin-bottom:8px;background:var(--panel2)}
.sec>.h{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);
  font:11px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--cy);cursor:pointer;user-select:none}
.sec>.h .tw{margin-left:auto;color:var(--dim)}
.sec.collapsed .body{display:none}
.body{padding:7px 8px}
.row{display:flex;align-items:center;gap:6px;margin:0 0 5px}
.row.wrap{flex-wrap:wrap}
.lbl{flex:0 0 96px;color:var(--ink2);font-size:11px}
.val{font:11px var(--mono);color:var(--am);flex:0 1 auto;max-width:168px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;text-align:right}
input[type=range]{flex:1 1 auto;min-width:52px;-webkit-appearance:none;appearance:none;height:16px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#25384a;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:var(--cy);margin-top:-4px;border:1px solid #06514a}
input[type=range]::-moz-range-track{height:3px;background:#25384a;border-radius:2px}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:var(--cy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;font-size:10px;
  line-height:1.15;text-align:center}
.tool kbd{font:9px var(--mono);color:var(--dim)}
.tool.sel{background:#123b39;border-color:var(--cy);color:var(--cy)}
.hint{color:var(--dim);font-size:11px;font-family:var(--mono);margin:4px 0 0}
.swatch{width:12px;height:12px;border-radius:2px;border:1px solid #2b3b4d;display:inline-block;vertical-align:-2px}
/* ---------- HUD ---------- */
#hud{position:absolute;left:14px;top:14px;background:rgba(6,10,15,.82);border:1px solid #1f2c3b;
  border-radius:5px;padding:6px 9px;font:11px/1.5 var(--mono);color:#a9c2d8;pointer-events:none;
  min-width:220px;backdrop-filter:blur(2px)}
#hud b{color:#e9f6ff;font-weight:600}
#hud .k{color:#617b91;display:inline-block;width:74px}
#hud .paused{color:var(--am)}
#hud .run{color:var(--cy)}
#hud .bad{color:var(--rd)}
#legend{position:absolute;right:14px;top:14px;background:rgba(6,10,15,.82);border:1px solid #1f2c3b;
  border-radius:5px;padding:5px 7px;font:10px var(--mono);color:#a9c2d8;pointer-events:none}
#toolbar{position:absolute;left:14px;bottom:12px;display:flex;gap:4px;background:rgba(6,10,15,.8);
  border:1px solid #1f2c3b;border-radius:5px;padding:4px}
#toolbar button{border:0;background:transparent;padding:3px 7px;font:11px var(--mono);color:var(--ink2)}
#toolbar button.on{background:#123b39;color:var(--cy);border-radius:3px}
#brushring{position:absolute;pointer-events:none;border:1px solid rgba(255,180,84,.85);border-radius:50%;
  transform:translate(-50%,-50%);display:none;box-shadow:0 0 0 1px rgba(0,0,0,.6) inset}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:#1b2a3a;
  border:1px solid var(--cy);border-radius:4px;padding:5px 12px;font:11px var(--mono);
  color:var(--cy);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
.scope{border:1px solid #1f2c3b;border-radius:4px;background:#0a0f16;flex:0 0 auto}
#noscopes{color:var(--dim);font:11px var(--mono);padding:14px 6px}
/* ---------- narrow ---------- */
@media (max-width:900px){
  #app{height:auto;overflow:visible}
  #main{flex-direction:column}
  #stage{padding:4px}
  /* without an explicit height the flex column collapses and the tank
     renders ~240px wide on a 390px phone */
  #cvwrap{height:min(56vh,430px);flex:0 0 auto}
  #panel{padding-bottom:24px}
  #panel{width:auto;flex:none;border-left:0;border-top:1px solid var(--line);max-height:none}
  #hud{font-size:10px;min-width:0;left:8px;top:8px;padding:4px 6px}
  #legend{display:none}
  #toolbar{left:8px;bottom:8px;flex-wrap:wrap;max-width:70vw}
}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <h1>WAVE LAB <b>2-D FDTD</b></h1>
    <select id="presetSel" title="Scene presets"></select>
    <button id="btnPause" class="big" title="Space">⏸ Pause</button>
    <button id="btnStep" class="big" title="S">⏭ Step</button>
    <select id="modeSel" title="Visualisation mode"></select>
    <div class="sp"></div>
    <div id="stab" title="Courant–Friedrichs–Lewy number c·dt/dx (limit 0.707)"><span class="dot"></span><span id="stabTxt">CFL —</span></div>
    <button id="btnUnsafe" title="Disable the stability clamp (lets unstable settings blow up)">safe-mode</button>
  </header>

  <div id="main">
    <div id="stage">
      <div id="cvwrap">
        <canvas id="field"></canvas>
        <div id="hud"></div>
        <div id="legend"><span id="legTitle"></span><br><canvas id="legC" width="176" height="10"></canvas><br><span id="legMin"></span></div>
        <div id="toolbar"></div>
        <div id="brushring"></div>
        <div id="toast"></div>
      </div>
    </div>

    <aside id="panel">
      <div class="sec" id="secTools"><div class="h">Tools & brush <span class="tw">▾</span></div><div class="body" id="pTools"></div></div>
      <div class="sec" id="secSrc"><div class="h">Source inspector <span class="tw">▾</span></div><div class="body" id="pSrc"></div></div>
      <div class="sec" id="secPhys"><div class="h">Field & numerics <span class="tw">▾</span></div><div class="body" id="pPhys"></div></div>
      <div class="sec" id="secDisp"><div class="h">Display <span class="tw">▾</span></div><div class="body" id="pDisp"></div></div>
      <div class="sec" id="secData"><div class="h">Scene data <span class="tw">▾</span></div><div class="body" id="pData"></div></div>
      <div class="sec" id="secKeys"><div class="h">Keys & help <span class="tw">▾</span></div><div class="body" id="pKeys"></div></div>
    </aside>
  </div>

  <footer id="scopes"><div id="noscopes">probes: pick the <b>probe</b> tool (P) and click the tank — each probe gets a live trace, amplitude, dominant frequency and spectrum</div></footer>
</div><script>
"use strict";
(function () {
/*__CORE_START__*/
/* =========================================================================
   WaveCore — DOM-free 2D scalar wave solver (finite difference, leapfrog).

     u_tt + 2*gamma*u_t = c(x,y)^2 * lap(u) + sources

   Discretisation (5-point Laplacian, dx = dy, leapfrog in time):

     (u2 - 2*u1 + u0)/dt^2 + 2*gamma*(u2 - u0)/(2*dt) = c^2 * lap/dx^2
     =>  u2 = ( 2*u1 - (1-g)*u0 + k^2*lap ) / (1 + g)
         g = gamma*dt ,  k = c*dt/dx  (CFL; stable while k <= 1/sqrt(2))

   WALL cells are dropped from the stencil, so a fluid cell next to a wall
   uses "sum(avail) - n*u1": a zero-normal-derivative (rigid) condition that
   reflects in phase, like a ripple-tank barrier.  Absorbers instead raise
   gamma locally (and drop c) so energy dies inside them.

   Everything here is DOM free and deterministic: the same buffers and the
   same calls reproduce bit-for-bit, which lets the Node test-harness drive
   exactly the code the browser runs.
   ========================================================================= */
var WaveCore = (function () {
  "use strict";

  var WATER = 0, WALL = 1;
  var HIST = 640;
  var MAXPROBE = 8;
  var CFL_LIMIT = 1 / Math.SQRT2;

  /* ---------------------------------------------------------------- create */
  function create(cfg) {
    var W = cfg.W | 0, H = cfg.H | 0, Lx = cfg.Lx, N = W * H;
    var dx = Lx / W;
    var S = {
      W: W, H: H, N: N, Lx: Lx, Ly: H * dx, dx: dx,
      flag: new Uint8Array(N),
      spd: new Float32Array(N),      /* local wave-speed multiplier        */
      los: new Float32Array(N),      /* local damping gamma (1/s)          */
      k2: new Float32Array(N),       /* (c*dt/dx)^2, rebuilt per frame     */
      gd: new Float32Array(N),       /* gamma*dt                           */
      iD: new Float32Array(N),       /* 1/(1+gamma*dt)                     */
      I: new Float32Array(N),        /* time-averaged intensity (EMA of u^2)
                                      */
      env: new Float32Array(N),      /* persistence / long-exposure trace  */
      q: new Float32Array(N),        /* leaky integral of u -> quadrature  */
      fx: new Float32Array(N),
      fy: new Float32Array(N),
      up: new Float32Array(N),
      uc: new Float32Array(N),
      un: new Float32Array(N),
      time: 0, steps: 0, dtRef: 0.006,
      maxAbs: 0, energy: 0, dtUsed: cfg.dt || 0.006,
      cfl: 0, lamCells: 0, dirty: true, unsafe: false, k2dt: 0,
      pStr: 1,
      probes: [], sources: [],
      p: {
        dt: cfg.dt || 0.006, c0: cfg.c0 || 1.0, damping: 0.25,
        boundary: "absorb", substeps: 3, persistence: 0.0, refFreq: 2.5
      },
      stats: { bad: 0 }
    };
    S.spd.fill(1);
    rebuild(S);
    return S;
  }

  /* ------------------------------------------------------- cache rebuild  */
  function rebuild(S) {
    var p = S.p, dt = p.dt, dx = S.dx;
    var kbase = p.c0 * dt / dx;
    var band = p.boundary === "absorb"
      ? Math.max(6, Math.round(0.14 * Math.min(S.W, S.H))) : 0;
    var W = S.W, H = S.H, i = 0, maxK = kbase;
    for (var y = 0; y < H; y++) {
      var edgeY = y < H - 1 - y ? y : H - 1 - y;
      for (var x = 0; x < W; x++, i++) {
        var sm = S.spd[i], g = p.damping + S.los[i];
        if (band) {
          var d = x < W - 1 - x ? x : W - 1 - x;
          if (edgeY < d) d = edgeY;
          if (d < band) {
            var t = 1 - d / band;
            var add = 90 * t * t * t;
            if (add > g) g = add;
            sm *= 1 - 0.32 * t;
          }
        }
        var kk = sm * kbase;
        if (kk > maxK) maxK = kk;
        var gd = g * dt;
        S.gd[i] = gd;
        S.iD[i] = 1 / (1 + gd);
        S.k2[i] = kk * kk;
      }
    }
    S.cfl = maxK;
    S.lamCells = p.c0 / Math.max(0.05, p.refFreq) / dx;
    S.unstable = maxK > CFL_LIMIT + 1e-9;
    S.dirty = false;
  }

  /* ------------------------------------------------------------ clear/ops */
  function clearField(S) {
    S.up.fill(0); S.uc.fill(0); S.un.fill(0);
    S.I.fill(0); S.env.fill(0); S.q.fill(0); S.fx.fill(0); S.fy.fill(0);
    S.maxAbs = 0; S.energy = 0; S.stats.bad = 0;
    for (var i = 0; i < S.probes.length; i++) { S.probes[i].n = 0; S.probes[i].hp = 0; }
  }

  function clearMedium(S) {
    S.flag.fill(WATER); S.los.fill(0); S.spd.fill(1);
    S.dirty = true;
  }

  /* Circular brush. mode: 1 wall | 2 absorber | 3 medium(spd=val)
                            4 lens | 0 erase                                */
  function paintDisc(S, cx, cy, r, mode, val) {
    /* absorbers use a wider, tapered footprint: a 1-2 cell damped layer
       reflects most of what hits it, a graded ~10 cell layer absorbs it */
    var rEff = mode === 2 ? r * 1.7 : r;
    var r2 = rEff * rEff, n = 0;
    var x0 = Math.max(0, Math.floor(cx - rEff - 1)), x1 = Math.min(S.W - 1, Math.ceil(cx + rEff + 1));
    var y0 = Math.max(0, Math.floor(cy - rEff - 1)), y1 = Math.min(S.H - 1, Math.ceil(cy + rEff + 1));
    for (var y = y0; y <= y1; y++) {
      for (var x = x0; x <= x1; x++) {
        var ddx = x - cx, ddy = y - cy, d2 = ddx * ddx + ddy * ddy;
        if (d2 > r2) continue;
        var i = y * S.W + x;
        n++;
        switch (mode) {
          case 1: S.flag[i] = WALL; S.los[i] = 0; S.spd[i] = 1; break;
          case 2: {
            var prof = 1 - d2 / r2;
            var l = 80 * prof * prof;
            S.flag[i] = WATER;
            S.los[i] = S.los[i] > l ? S.los[i] : l;
            var sv = 1 - 0.68 * prof;
            S.spd[i] = S.spd[i] < sv ? S.spd[i] : sv;
            break;
          }
          case 3:
            S.flag[i] = WATER; S.los[i] = 0;
            S.spd[i] = S.spd[i] < val ? S.spd[i] : val;
            break;
          case 4: {
            var prof4 = 1 - d2 / r2;
            S.flag[i] = WATER; S.los[i] = 0;
            var target = 1 - 0.42 * prof4 * prof4;
            if (target < S.spd[i]) S.spd[i] = target;
            break;
          }
          default: S.flag[i] = WATER; S.los[i] = 0; S.spd[i] = 1; break;
        }
      }
    }
    if (n) S.dirty = true;
    return n;
  }

  /* Barrier along a segment with a slot of `gap` cells at its midpoint. */
  function paintSlit(S, x0, y0, x1, y1, r, gap) {
    var mx = (x0 + x1) * 0.5, my = (y0 + y1) * 0.5;
    var len = Math.hypot(x1 - x0, y1 - y0);
    var steps = Math.max(1, Math.ceil(len));
    var half = gap * 0.5, done = 0;
    for (var s = 0; s <= steps; s++) {
      var t = s / steps, px = x0 + (x1 - x0) * t, py = y0 + (y1 - y0) * t;
      if (Math.hypot(px - mx, py - my) < half) continue;
      done += paintDisc(S, px, py, r, 1, 0);
    }
    return done;
  }

  /* ------------------------------------------------------------- sampling */
  function sampleBuf(buf, S, x, y) {
    var W = S.W, H = S.H;
    if (!(x >= 0)) x = 0;
    if (!(y >= 0)) y = 0;
    if (x > W - 1.001) x = W - 1.001;
    if (y > H - 1.001) y = H - 1.001;
    var x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0;
    var i = y0 * W + x0;
    var a = buf[i], b = buf[i + 1], c = buf[i + W], d = buf[i + W + 1];
    return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
  }
  function sample(S, x, y) { return sampleBuf(S.uc, S, x, y); }

  /* ------------------------------------------------- source footprint math */
  function buildFootprint(S, src) {
    var cells = [], W = S.W, H = S.H;
    var sigma = src.sigma > 0 ? src.sigma : (src.shape === "point" ? 1.15 : 0.7);
    var cspeed = Math.max(0.05, src.speed);

    function addBlob(x, y, delay) {
      var x0 = Math.max(0, Math.floor(x - 3 * sigma)), x1 = Math.min(W - 1, Math.ceil(x + 3 * sigma));
      var y0 = Math.max(0, Math.floor(y - 3 * sigma)), y1 = Math.min(H - 1, Math.ceil(y + 3 * sigma));
      for (var yy = y0; yy <= y1; yy++) {
        for (var xx = x0; xx <= x1; xx++) {
          if (xx < 0 || yy < 0 || xx > W - 1 || yy > H - 1) continue;
          var i = yy * W + xx;
          if (S.flag[i] === WALL) continue;
          var ddx = xx - x, ddy = yy - y;
          var w = Math.exp(-(ddx * ddx + ddy * ddy) / (2 * sigma * sigma));
          if (w < 0.02) continue;
          cells.push(i, delay, w);
        }
      }
    }

    var a = src.angle * Math.PI / 180;
    var ux = Math.cos(a), uy = Math.sin(a);          /* along the elements */
    var vx = -uy, vy = Math.cos(a);                   /* beam axis          */

    if (src.shape === "point") {
      addBlob(src.x, src.y, 0);
    } else if (src.shape === "line") {
      var L = Math.max(1, src.len);
      var n = Math.min(300, Math.max(2, Math.round(L / 1.3)));
      var st = Math.sin(src.steer * Math.PI / 180);
      for (var k = 0; k < n; k++) {
        var u = (k / (n - 1) - 0.5) * L;
        /* delays are in seconds: convert the cell offset to metres first */
        addBlob(src.x + ux * u, src.y + uy * u, -(u * st * S.dx) / cspeed);
      }
    } else {
      var ne = Math.max(1, src.n | 0), sp = src.spacing;
      var R = Math.abs(src.curv) < 1 ? 0 : src.curv;
      var pts = [], i;
      for (i = 0; i < ne; i++) {
        var uu = (i - (ne - 1) / 2) * sp;
        var vv = R === 0 ? 0 : -(uu * uu) / (2 * R);
        pts.push([uu, vv]);
      }
      var dmin = 1e9, ds = [];
      var F = src.focus > 0.5 ? src.focus : 0;
      for (i = 0; i < ne; i++) {
        var fu = pts[i][0], fv = pts[i][1] - F;
        var dd = Math.hypot(fu, fv);
        ds.push(dd); if (dd < dmin) dmin = dd;
      }
      var st2 = Math.sin(src.steer * Math.PI / 180);
      for (i = 0; i < ne; i++) {
        var pu = pts[i][0], pv = pts[i][1];
        var delay = (ds[i] - dmin) * S.dx / cspeed;
        /* sign chosen so that a positive "steer" angle tilts the beam
           towards +y (down on screen); verified in tests/core-test.mjs 8b */
        if (Math.abs(st2) > 1e-9) delay -= (pu * st2 * S.dx) / cspeed;
        addBlob(src.x + ux * pu + vx * pv, src.y + uy * pu + vy * pv, delay);
      }
    }
    src.cells = cells;
    src.nEl = cells.length / 3;
    return src;
  }

  /* ------------------------------------------------- waveform of a source  */
  function srcValue(src, t, delay) {
    var amp = src.amp;
    if (amp === 0) return 0;
    var tw = t - delay;
    if (tw < 0) return 0;
    var f = src.freq;
    if (src.kind === "pulse") {
      var per = Math.max(src.pulseW * 2.5, 0.05);
      var tw2 = src.repeat === false ? tw : tw % per;
      if (tw2 > src.pulseW) return 0;
      var z = (tw2 - src.pulseW * 0.5) / (src.pulseW * 0.35);
      var env = Math.exp(-z * z);
      return amp * env * Math.sin(2 * Math.PI * f * tw + src.phase * Math.PI / 180);
    }
    var ph = 2 * Math.PI * f * tw + src.phase * Math.PI / 180;
    switch (src.wf) {
      case "square": return amp * (Math.sin(ph) >= 0 ? 1 : -1);
      case "tri": return amp * (2 / Math.PI) * Math.asin(Math.sin(ph));
      case "burst": {

    const sk = Math.max(6, P.arrowSkip);
    ctx.strokeStyle = "rgba(255,255,255,.75)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y = sk >> 1; y < sim.H; y += sk) {
      for (let x = sk >> 1; x < sim.W; x += sk) {
        const i = y * sim.W + x;
        if (sim.flag[i] === 1) continue;
        const fx = sim.fx[i], fy = sim.fy[i];
        const m = Math.hypot(fx, fy);
        if (m < 0.02) continue;
        const cxp = (x + 0.5) * sim.dx * pxPerM, cyp = (y + 0.5) * sim.dx * pxPerM;
        const L = Math.min(9, 2 + m * 26);
        const ux = fx / m, uy = fy / m;
        ctx.moveTo(cxp - ux * L * .5, cyp - uy * L * .5);
        ctx.lineTo(cxp + ux * L * .5, cyp + uy * L * .5);
        ctx.moveTo(cxp + ux * L * .5, cyp + uy * L * .5);
        ctx.lineTo(cxp + ux * L * .5 - ux * 3 - uy * 2, cyp + uy * L * .5 - uy * 3 + ux * 2);
      }
    }
    ctx.stroke();
  }

  const cpm = pxPerM * sim.dx;          /* css px per cell                */
  const cp = (cx, cy) => [cx * cpm, cy * cpm];

  /* sources */
  for (const s of scene.sources) {
    const pts = sourceMarkers(s);
    const col = !s.active ? "#5d6b7a" : (s.kind === "pulse" ? "#ff9d3d" : "#37d6c4");
    ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.lineWidth = sel === s ? 2.4 : 1.4;
    ctx.beginPath();
    for (const [mx, my] of pts) {
      const [x, y] = cp(mx, my);
      ctx.moveTo(x + 3.2, y); ctx.arc(x, y, 3.2, 0, TAU);
    }
    ctx.stroke();
    if (sel === s) {
      ctx.strokeStyle = "rgba(255,255,255,.55)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      const a = -Math.PI / 2 + s.angle * Math.PI / 180;
      const [x0, y0] = cp(s.x, s.y);
      ctx.moveTo(x0, y0);
      ctx.lineTo(x0 + Math.cos(a) * 26, y0 + Math.sin(a) * 26);
      ctx.stroke();
      ctx.fillStyle = "rgba(55,214,196,.15)";
      ctx.beginPath(); ctx.arc(x0, y0, 15, 0, TAU); ctx.fill();
    }
    if (!s.active) {
      const [x, y] = cp(s.x, s.y);
      ctx.strokeStyle = "#ff5d6c"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(x - 5, y - 5); ctx.lineTo(x + 5, y + 5);
      ctx.moveTo(x + 5, y - 5); ctx.lineTo(x - 5, y + 5); ctx.stroke();
    }
  }

  /* probes */
  for (const pr of scene.probes) {
    const [x, y] = cp(pr.x, pr.y);
    ctx.strokeStyle = sel === pr ? "#ffe66d" : "#8fd0ff";
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, y, 5.5, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y);
    ctx.moveTo(x, y - 9); ctx.lineTo(x, y + 9); ctx.stroke();
    ctx.fillStyle = "rgba(255,230,109,.9)";
    ctx.font = "9px ui-monospace,monospace";
    ctx.fillText("P" + (scene.probes.indexOf(pr) + 1), x + 7, y - 5);
  }

  /* slit preview */
  if (dragState && dragState.mode === "slit") {
    const [a, b] = toPx(dragState.x0, dragState.y0), [c, d] = toPx(dragState.x1, dragState.y1);
    ctx.strokeStyle = "#ff5d6c"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.stroke();
    const g2 = slitGapShow * pxPerM;
    const mx = (a + c) / 2, my = (b + d) / 2;
    ctx.strokeStyle = "#ffe66d";
    ctx.beginPath(); ctx.arc(mx, my, g2 / 2, 0, TAU); ctx.stroke();
  }

  /* ruler */
  ctx.fillStyle = "rgba(190,215,235,.65)";
  ctx.font = "9px ui-monospace,monospace";
  ctx.strokeStyle = "rgba(190,215,235,.35)";
  ctx.lineWidth = 1;
  const stepM = 1;
  ctx.beginPath();
  for (let m = stepM; m < LX; m += stepM) {
    const [x] = toPx(m, 0);
    ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, viewH / dpr);
  }
  ctx.stroke();
  ctx.restore();
}

/* Marker geometry, in CELL units — the same units buildFootprint() uses. */
function sourceMarkers(s) {
  const pts = [];
  const a = s.angle * Math.PI / 180;
  const ux = Math.cos(a), uy = Math.sin(a), vx = -uy, vy = Math.cos(a);
  if (s.shape === "point") pts.push([s.x, s.y]);
  else if (s.shape === "line") {
    const n = Math.max(2, Math.round(Math.max(1, s.len) / 3.5));
    for (let k = 0; k < n; k++) {
      const u = (k / (n - 1) - 0.5) * s.len;
      pts.push([s.x + ux * u, s.y + uy * u]);
    }
  } else {
    const n = Math.max(1, s.n | 0), sp = s.spacing;
    const R = Math.abs(s.curv) < 1 ? 0 : s.curv;
    for (let k = 0; k < n; k++) {
      const u = (k - (n - 1) / 2) * sp;
      const v = R === 0 ? 0 : -(u * u) / (2 * R);
      pts.push([s.x + ux * u + vx * v, s.y + uy * u + vy * v]);
    }
  }
  return pts;
}
/* cell -> css px */
function cToPx(cx, cy, cpm) { return [cx * cpm, cy * cpm]; }

function drawLegend() {

  const mode = P.mode, w = c.width, h = c.height;
  const im = g.createImageData(w, h);
  for (let x = 0; x < w; x++) {
    const t = x / (w - 1);
    let r, gg, b;
    if (mode === "amp") { const li = clamp((t * 511) | 0, 0, 511); r = LUT_AMP[li * 3]; gg = LUT_AMP[li * 3 + 1]; b = LUT_AMP[li * 3 + 2]; }

    else { const li = clamp((t * 255) | 0, 0, 255); r = LUT_POS[li * 3]; gg = LUT_POS[li * 3 + 1]; b = LUT_POS[li * 3 + 2]; }
    for (let y = 0; y < h; y++) { const p = (y * w + x) * 4; im.data[p] = r; im.data[p + 1] = gg; im.data[p + 2] = b; im.data[p + 3] = 255; }

const LSKEY = "wavelab.scene.v1";
function rle(arr) {
  const out = [];
  let v = arr[0], c = 0;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] === v && c < 65000) c++;
    else { out.push(v, c); v = arr[i]; c = 1; }
  }
  out.push(v, c);
  return out;
}
function unrle(flat, len) {
  const out = new Uint8Array(len);
  let p = 0;
  for (let i = 0; i + 1 < flat.length; i += 2) {
    const v = flat[i], c = flat[i + 1];
    for (let k = 0; k < c && p < len; k++) out[p++] = v;
  }
  return out;
}
function packMedium() {
  const N = sim.N;
  const a = new Uint8Array(N), b = new Uint8Array(N), c = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    a[i] = sim.flag[i] ? 1 : 0;
    b[i] = Math.round(clamp((sim.spd[i] - 0.3) / 1.3, 0, 1) * 255);
    c[i] = Math.round(clamp(sim.los[i] / 80, 0, 1) * 255);
  }
  return { W: sim.W, H: sim.H, f: rle(Array.from(a)), s: rle(Array.from(b)), l: rle(Array.from(c)) };
}
function unpackMedium(o) {
  if (!o || !o.f) return false;
  if (o.W !== sim.W || o.H !== sim.H) return false;      /* res changed */
  try {
    const f = unrle(o.f, sim.N), s = unrle(o.s, sim.N), l = unrle(o.l, sim.N);
    for (let i = 0; i < sim.N; i++) {
      sim.flag[i] = f[i];
      sim.spd[i] = 0.3 + (s[i] / 255) * 1.3;
      sim.los[i] = (l[i] / 255) * 80;
    }
    sim.dirty = true;
    return true;
  } catch (e) { return false; }
}
function serialize() {
  return JSON.stringify({
    v: 1,
    params: { res: Par.res, dt: Par.dt, speed: Par.speed, damping: Par.damping, boundary: Par.boundary, substeps: Par.substeps },
    display: { mode: P.mode, exposure: P.exposure, autoExp: P.autoExp, persistence: P.persistence, refFreq: P.refFreq },
    medium: packMedium(),
    sources: scene.sources.map((s) => { const o = Object.assign({}, s); delete o.cells; return o; }),
    probes: scene.probes.map((p) => ({ x: p.x, y: p.y, id: p.id }))

function deserialize(txt) {

  if (o.params && o.params.res !== Par.res) {

  }
  if (o.params) {

    sim.p.dt = Par.dt; sim.p.c0 = Par.speed; sim.p.damping = Par.damping;
    sim.p.boundary = Par.boundary; sim.p.substeps = Par.substeps;
  }
  if (o.display) Object.assign(P, o.display);
  if (!unpackMedium(o.medium)) return "grid size does not match this scene";
  scene.sources = (o.sources || []).map((s) => WaveCore.buildFootprint(sim, Object.assign({ id: idSeq++ }, s)));
  scene.probes = (o.probes || []).map((p) => ({ id: p.id || idSeq++, x: p.x, y: p.y, hist: new Float32Array(WaveCore.HIST), n: 0, hp: 0 }));

/* ------------------------------------------------------- scope instruments */
const FFTN = 256, BARS = 26;
const fre = new Float64Array(FFTN), fim = new Float64Array(FFTN), mag = new Float64Array(FFTN / 2);
function fft(re, im, n) {
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const ar = re[i + k], ai = im[i + k];
        const br = re[i + k + len / 2] * cr - im[i + k + len / 2] * ci;
        const bi = re[i + k + len / 2] * ci + im[i + k + len / 2] * cr;
        re[i + k] = ar + br; im[i + k] = ai + bi;
        re[i + k + len / 2] = ar - br; im[i + k + len / 2] = ai - bi;
        const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
}
function rebuildScopes() {
  const host = $("scopes");
  host.innerHTML = "";
  scopeCanvases = [];
  if (!scene.probes.length) {
    el("div", { id: "noscopes", html: "probes: pick the <b>probe</b> tool (P) and click the tank — each probe gets a live trace, amplitude, dominant frequency and spectrum" }, host);
    return;
  }
  for (let i = 0; i < scene.probes.length; i++) {
    const p = scene.probes[i];
    const box = el("div", { class: "scope" }, host);
    const c = el("canvas", { class: "scopeCv" }, box);
    scopeCanvases.push({ probe: p, cv: c, box: box });
  }
  layoutScopes();
}
function layoutScopes() {
  const n = scopeCanvases.length;
  if (!n) return;
  const avail = Math.max(200, $("scopes").clientWidth - 12 - (n - 1) * 8);
  const w = clamp(Math.floor(avail / n), 190, 430);
  const h = clamp(($("scopes").clientHeight || 140) - 10, 90, 200);
  for (const s of scopeCanvases) {
    s.cv.style.width = w + "px"; s.cv.style.height = h + "px";
    s.cv.width = Math.round(w * dpr); s.cv.height = Math.round(h * dpr);
  }
}
function drawScopes() {
  if (!scopeCanvases.length) return;
  const S = sim;
  const ref = scene.sources.find((s) => s.active && s.kind !== "pulse");
  const fref = ref ? ref.freq : P.refFreq;
  for (const sc of scopeCanvases) {
    const p = sc.probe, c = sc.cv;
    const g = c.getContext("2d");
    const W = c.width, H = c.height;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = "#0a0f16"; g.fillRect(0, 0, W, H);
    const n = Math.min(p.n, 300);
    const dtS = Math.max(1e-4, S.pStr * (S.dtUsed || S.p.dt));
    const tw = n * dtS;
    /* ---- waveform panel ---- */
    const wl = Math.floor(W * 0.6);
    let peak = 0, rms = 0;
    for (let k = 0; k < n; k++) {
      const v = p.hist[(p.hp - n + k + 2 * WaveCore.HIST) % WaveCore.HIST];
      const a = Math.abs(v); if (a > peak) peak = a; rms += v * v;
    }
    rms = Math.sqrt(rms / Math.max(1, n));
    const sc2 = Math.max(1e-6, peak * 1.15);
    g.strokeStyle = "rgba(120,150,175,.25)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, H / 2); g.lineTo(wl, H / 2); g.stroke();
    g.strokeStyle = "#37d6c4"; g.lineWidth = 1.1;
    g.beginPath();
    for (let px = 0; px < wl; px++) {
      const k = Math.floor(px / wl * n);
      const v = p.hist[(p.hp - n + k + 2 * WaveCore.HIST) % WaveCore.HIST];
      const y = H * 0.55 - (v / sc2) * H * 0.42;
      if (px === 0) g.moveTo(px, y); else g.lineTo(px, y);
    }
    g.stroke();
    /* ---- spectrum panel ---- */
    const x0 = wl + 6, w2 = W - x0 - 4;
    if (n > 64) {
      for (let k = 0; k < FFTN; k++) {
        const k2 = n - FFTN + k;
        const w0 = 0.5 - 0.5 * Math.cos(TAU * k / (FFTN - 1));
        fre[k] = p.hist[(p.hp - n + k2 + 2 * WaveCore.HIST) % WaveCore.HIST] * w0;
        fim[k] = 0;
      }
      fft(fre, fim, FFTN);
      let mmax = 1e-9;
      for (let k = 1; k < FFTN / 2; k++) {
        const m = Math.hypot(fre[k], fim[k]);
        mag[k] = m; if (m > mmax) mmax = m;
      }
      const fmax = Math.min(14, 0.5 / dtS);
      const bw = w2 / BARS;
      for (let b = 0; b < BARS; b++) {
        const f0 = fmax * b / BARS, f1 = fmax * (b + 1) / BARS;
        let m = 0;
        const k0 = Math.max(1, Math.floor(f0 * FFTN * dtS)), k1 = Math.min(FFTN / 2 - 1, Math.ceil(f1 * FFTN * dtS));
        for (let k = k0; k <= k1; k++) if (mag[k] > m) m = mag[k];
        const hgt = Math.pow(m / mmax, 0.6) * (H - 14);
        g.fillStyle = b % 2 ? "#3b6ea8" : "#4aa3ff";
        g.fillRect(x0 + b * bw, H - 4 - hgt, Math.max(1, bw - 1), hgt);
      }
      if (ref) {
        const bx = x0 + (fref / fmax) * w2;
        g.strokeStyle = "#ffb454"; g.setLineDash([2, 2]);
        g.beginPath(); g.moveTo(bx, 3); g.lineTo(bx, H - 3); g.stroke();
        g.setLineDash([]);
      }
      /* dominant frequency, parabolic peak */
      let bi = 1;
      for (let k = 2; k < FFTN / 2; k++) if (mag[k] > mag[bi]) bi = k;
      const y0v = mag[bi - 1] || 1e-9, y1v = mag[bi] || 1e-9, y2v = mag[bi + 1] || 1e-9;
      const dk = 0.5 * (y0v - y2v) / Math.max(1e-12, y0v - 2 * y1v + y2v);
      const fdom = (bi + clamp(dk, -0.5, 0.5)) / (FFTN * dtS);
      /* ---- phase vs reference (Hann projection at fref) ---- */
      let phTxt = "";
      if (ref && fref > 0.05 && fref < 0.5 / dtS - 0.05) {
        let A = 0, B = 0;
        for (let k = 0; k < n; k++) {
          const v = p.hist[(p.hp - n + k + 2 * WaveCore.HIST) % WaveCore.HIST];
          const trel = (k - n + 1) * dtS;
          const w0 = 0.5 - 0.5 * Math.cos(TAU * k / (n - 1));
          A += v * w0 * Math.cos(TAU * fref * trel);
          B += v * w0 * Math.sin(TAU * fref * trel);
        }
        let ph = Math.atan2(B, A) * 180 / Math.PI - ref.phase;
        ph = ((ph + 180) % 360 + 360) % 360 - 180;
        const amp = Math.hypot(A, B) / n;
        phTxt = "  Δφ " + ph.toFixed(0) + "°";
        /* phasor dial */
        const cx = W - 16, cy = 14, r = 9;
        g.strokeStyle = "rgba(255,180,84,.6)";
        g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.stroke();
        const a = (ph + ref.phase) * Math.PI / 180;
        g.strokeStyle = amp > 1e-5 ? "#ffe66d" : "#5f7488";
        g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); g.stroke();
      }
      g.fillStyle = "#8ea3b8";
      g.font = Math.round(9 * dpr) + "px ui-monospace,monospace";
      g.fillText("|u| " + peak.toFixed(3) + " rms " + rms.toFixed(3) + phTxt, 4, 10);
      g.fillStyle = "#cfe0ee";
      g.fillText("f₀ " + fdom.toFixed(2) + " Hz", 4, H - 5);
      g.fillStyle = "#5f7488";
      g.fillText("probe " + (p.x * sim.dx).toFixed(2) + "," + (p.y * sim.dx).toFixed(2) + "  " + tw.toFixed(1) + " s win", x0, 10);
    } else {
      g.fillStyle = "#5f7488";
      g.font = Math.round(10 * dpr) + "px ui-monospace,monospace";
      g.fillText("collecting…", x0, 20);
      g.fillStyle = "#8ea3b8";
      g.fillText("|u| " + peak.toFixed(3), 4, 12);
    }
  }
}

let toolBtns = [];

/* ------------------------------------------------------------- toolbar/HUD */

}
function updateRing() {
  const ring = $("brushring");

  ring.style.display = paint && lastPx ? "" : "none";
  if (paint && lastPx) {
    const d = 2 * brush * sim.dx * scale / dpr;
    ring.style.width = d + "px"; ring.style.height = d + "px";

let lastPx = null;
function updateHUD() {

    (rClamped ? " · dt clamped " + (used * 1000).toFixed(1) + " of " + (Par.dt * 1000).toFixed(1) + " ms"
      : (S.unstable ? " · UNSTABLE" : ""));

    "<span class='k'>grid</span><b>" + S.W + "×" + S.H + "</b> = " + (S.N / 1000).toFixed(0) + "k cells · dx " + S.dx.toFixed(4) + " m",
    "<span class='k'>dt</span>" + (used * 1000).toFixed(2) + " ms × " + nSub + " sub" + (rClamped ? " <span class='bad'>clamped</span>" : "") + " = <b>" + (used * nSub * 1000).toFixed(1) + " ms</b> physics/frame",
    "<span class='k'>c₀</span>" + Par.speed.toFixed(2) + " m/s · λ(ref) " + (S.lamCells).toFixed(1) + " cells · damping " + Par.damping.toFixed(2) + " · " + Par.boundary,
    "<span class='k'>t</span><b>" + S.time.toFixed(3) + " s</b> · step " + S.steps + " · " + rt.toFixed(2) + "× realtime",
    "<span class='k'>fps</span><b>" + fps.toFixed(0) + "</b> · " + workMs.toFixed(1) + " ms/frame work · " + (S.unstable ? "<span class='bad'>UNSTABLE</span>" : "stable") + (nSub === 0 ? " · <span class='paused'>PAUSED</span>" : ""),
    "<span class='k'>sources</span>" + activeSources.length + "/" + scene.sources.length + " · probes <b>" + scene.probes.length + "</b> · " + P.mode + " · " + tool

/* ------------------------------------------------------------- pointer I/O */
/* Pointer input is metres + css px; source/probe objects live in cells.   */
let drag = null;
function canvasPos(e) {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * LX;
  const y = (e.clientY - r.top) / r.height * LY;
  return [x, y, e.clientX - r.left, e.clientY - r.top];
}
function paintAt(x, y) {
  const [cx, cy] = toCells(x, y);
  if (tool === "wall") WaveCore.paintDisc(sim, cx, cy, brush, 1, 0);
  else if (tool === "absorb") WaveCore.paintDisc(sim, cx, cy, brush, 2, 0);
  else if (tool === "medium") WaveCore.paintDisc(sim, cx, cy, brush, 3, indexBrush);
  else if (tool === "erase") { WaveCore.paintDisc(sim, cx, cy, brush, 0, 0); clearNear(cx, cy, brush * 1.2); }
  sim.dirty = true;
}
function onDown(e) {
  const [x, y, px, py] = canvasPos(e);
  lastPx = [px, py];
  if (x < 0 || y < 0 || x > LX || y > LY) return;
  const [cx, cy] = toCells(x, y);
  const del = e.altKey || e.ctrlKey;
  const hitR = Math.max(3, brush * 0.6);
  if (tool === "emit" || tool === "select") {
    const s = srcAt(cx, cy, hitR);
    const p = probeAt(cx, cy, hitR);
    if (del && (s || p)) { if (s) removeSource(s); else removeProbe(p); toast("deleted"); return; }
    if (s) { sel = s; drag = { mode: "move", o: s }; refreshInspector(); return; }
    if (p) { sel = p; drag = { mode: "move", o: p }; refreshInspector(); return; }
    if (tool === "emit") {
      if (scene.sources.length >= 24) { toast("24 emitters is the cap", true); return; }
      const s = mkSource({
        x: cx, y: cy, shape: emitShape, kind: emitKind, freq: emitFreq, amp: 1,
        pulseW: 0.09, repeat: emitKind !== "pulse", len: toC(1.2)
      });
      scene.sources.push(s); sel = s; refreshActive(); refreshInspector();
      drag = { mode: "move", o: s };
      toast("new " + s.kind + " " + s.shape + " emitter — tune it in the Source inspector");
    } else { sel = null; refreshInspector(); }
    return;
  }
  if (tool === "probe") {
    const p = probeAt(cx, cy, Math.max(3, brush * 0.6));
    if (p) { sel = p; drag = { mode: "move", o: p }; refreshInspector(); return; }
    if (scene.probes.length >= WaveCore.MAXPROBE) { toast("probe cap is " + WaveCore.MAXPROBE, true); return; }
    const np = mkProbe(cx, cy);
    scene.probes.push(np); sim.probes = scene.probes; sel = np;
    rebuildScopes(); refreshInspector();
    return;
  }
  if (tool === "slit") { drag = { mode: "slit", x0: x, y0: y, x1: x, y1: y }; return; }
  if (tool === "lens") {
    drag = { mode: "lens", x0: cx, y0: cy };
    WaveCore.paintDisc(sim, cx, cy, Math.max(1, brush * 0.7), 4, 0);
    sim.dirty = true;
    return;
  }
  drag = { mode: "paint", lx: x, ly: y };
  paintAt(x, y);
}
function paintSeg(x0, y0, x1, y1) {
  const d = Math.hypot(x1 - x0, y1 - y0);
  const step = Math.max(sim.dx * 0.8, brush * sim.dx * 0.5);
  const n = Math.max(1, Math.ceil(d / step));
  for (let k = 0; k <= n; k++) paintAt(x0 + (x1 - x0) * k / n, y0 + (y1 - y0) * k / n);
}
function onMove(e) {
  const [x, y, px, py] = canvasPos(e);
  lastPx = [px, py];
  updateRing();
  if (!drag) return;
  if (drag.mode === "paint") { paintSeg(drag.lx, drag.ly, x, y); drag.lx = x; drag.ly = y; }
  else if (drag.mode === "move") {
    const o = drag.o;
    o.x = clamp(x / sim.dx, 1, sim.W - 2);
    o.y = clamp(y / sim.dx, 1, sim.H - 2);
    if (o.hist === undefined) rebuildAll();
  } else if (drag.mode === "slit") { drag.x1 = x; drag.y1 = y; }
  else if (drag.mode === "lens") {
    const cx = x / sim.dx, cy = y / sim.dx;
    WaveCore.paintDisc(sim, drag.x0, drag.y0, Math.max(1, Math.hypot(cx - drag.x0, cy - drag.y0)), 4, 0);
    sim.dirty = true;
  }
}
function onUp() {
  const d = drag;
  drag = null;
  if (!d) return;
  if (d.mode === "move" && d.o && d.o.hist === undefined) rebuildAll();
  if (d.mode === "slit") {
    const n = WaveCore.paintSlit(sim, d.x0 / sim.dx, d.y0 / sim.dx, d.x1 / sim.dx, d.y1 / sim.dx,
                                Math.max(1, brush), Math.max(2.5, slitGap / sim.dx));
    sim.dirty = true;
    toast(n ? "barrier painted with a " + slitGap.toFixed(2) + " m slot" : "drag further to lay a barrier", !n);
  }
}

/* ------------------------------------------------------------------- main loop */
let raf = 0, lastFrameT = 0, workMs = 0;
function step(nSub) {
  const wantFlux = P.mode === "flow";
  const r = WaveCore.stepFrame(sim, nSub, activeSources, { unsafe: P.unsafe, flux: wantFlux });
  if (r.clamped) {
    if (!lastClamp) toast("dt above the stability limit — auto-reduced to " + (r.dt * 1000).toFixed(2) + " ms", true);
    lastClamp = true;
  } else lastClamp = false;
  return r;
}
function frame(now) {
  raf = requestAnimationFrame(frame);

  let nSub = 0;
  if (!paused) nSub = Par.substeps;
  else if (pendingSteps > 0) { nSub = Par.substeps; pendingSteps--; }
  let r = null;
  if (nSub > 0) r = step(nSub);
  /* paused + energy-flow view: refresh the flux vectors over the frozen
     field so the arrows are not stuck on whatever the last run left behind */
  else if (P.mode === "flow") WaveCore.stepFrame(sim, 0, [], { unsafe: P.unsafe, flux: true });
  hudSub = nSub; hudClamped = !!(r && r.clamped);
  renderField();
  drawOverlays(now);
  uiTick++;
  if (uiTick % 4 === 0) updateHUD();
  if (uiTick % 3 === 0 && scene.probes.length && (nSub > 0 || uiTick % 24 === 0)) drawScopes();
  const ms = performance.now() - t0;
  const interval = now - lastFrameT; lastFrameT = now;
  if (interval > 0 && interval < 500) fps += 0.06 * (1000 / interval - fps);
  workMs = ms;
  if (nSub > 0) {
    rtPhys += (sim.dtUsed || Par.dt) * nSub;
    rtWall2 += ms / 1000;
    if (uiTick % 45 === 0) { rtPhys *= 0.5; rtWall2 *= 0.5; }
  }
  if (P.autosave && uiTick % 900 === 0) { try { localStorage.setItem(LSKEY, serialize()); } catch (e) { } }
}

/* ------------------------------------------------------------------- boot */
function syncControls() {

  for (const b of $("toolbar").querySelectorAll("button")) b.classList.toggle("on", b.dataset.mode === P.mode);
  drawLegend();

  const s = ph.querySelectorAll("input[type=range]");
  if (s.length >= 4) {
    s[0].value = Par.dt; s[1].value = Par.substeps; s[2].value = Par.speed; s[3].value = Par.damping;
    for (const x of s) x.dispatchEvent(new Event("input"));

}
function download(name, text) {

}
function boot() {

    else if (k === "r") { applyPreset(); toast("scene rebuilt"); }
    else if (k === "Enter") { WaveCore.clearMedium(sim); applyPreset(); toast("medium + field cleared"); }
    else if (k === "[") { brush = clamp(brush - 1, 1, 40); updateRing(); }
    else if (k === "]") { brush = clamp(brush + 1, 1, 40); updateRing(); }
    else if (k === "Delete" || k === "Backspace") { if (sel) { if (sel.hist !== undefined) removeProbe(sel); else removeSource(sel); toast("deleted"); } }
    else if (/^[1-7]$/.test(k)) { setMode(MODES[+k - 1].id); }

    stats: () => ({

    sample: (x, y) => WaveCore.sample(sim, x / sim.dx, y / sim.dx),
    addProbe: (x, y) => { const p = mkProbe(x, y); scene.probes.push(p); sim.probes = scene.probes; rebuildScopes(); return p; },
    addSource: (o) => { const s = mkSource(o); scene.sources.push(s); refreshActive(); return s; },
    serialize, deserialize
  };
}

boot();
})();
</script>
