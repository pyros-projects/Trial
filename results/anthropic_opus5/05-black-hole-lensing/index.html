function makeControl(it){
  const wrap = document.createElement('div');
  wrap.className = 'ctl';
  const id = 'c_' + it.id;
  if(it.t === 'check'){
    const l = document.createElement('label');
    l.className = 'chk'; l.setAttribute('for', id);
    const inp = document.createElement('input');
    inp.type='checkbox'; inp.id=id; inp.checked = !!P[it.id];
    const sp = document.createElement('span'); sp.textContent = it.label;
    l.appendChild(inp); l.appendChild(sp);
    wrap.appendChild(l);
    inp.addEventListener('change', ()=>{ if(uiSuppress) return; setParam(it.id, inp.checked); });
    ui[it.id] = { el:inp, kind:'check', spec:it };
  } else if(it.t === 'select'){
    const row = document.createElement('div'); row.className='row';
    const l = document.createElement('label'); l.setAttribute('for', id); l.textContent = it.label;
    row.appendChild(l); wrap.appendChild(row);
    const sel = document.createElement('select'); sel.id = id;
    sel.setAttribute('aria-label', it.label);
    for(const [v,txt] of it.opts){
      const o = document.createElement('option'); o.value=v; o.textContent=txt; sel.appendChild(o);
    }
    sel.value = String(P[it.id]);
    wrap.appendChild(sel);
    sel.addEventListener('change', ()=>{ if(uiSuppress) return; setParam(it.id, sel.value); });
    ui[it.id] = { el:sel, kind:'select', spec:it };
  } else {
    const row = document.createElement('div'); row.className='row';
    const l = document.createElement('label'); l.setAttribute('for', id); l.textContent = it.label;
    const out = document.createElement('output'); out.htmlFor = id;
    row.appendChild(l); row.appendChild(out); wrap.appendChild(row);
    const inp = document.createElement('input');
    inp.type='range'; inp.id=id; inp.min=it.min; inp.max=it.max; inp.step=it.step;
    inp.setAttribute('aria-label', it.label);
    inp.value = String(readParam(it.id));
    wrap.appendChild(inp);
    inp.addEventListener('input', ()=>{ if(uiSuppress) return; setParam(it.id, parseFloat(inp.value)); });
    ui[it.id] = { el:inp, out:out, kind:'range', spec:it };
  }
  if(it.hint){
    const h = document.createElement('p'); h.className='hint'; h.textContent = it.hint;
    wrap.appendChild(h);
  }
  return wrap;
}

/* virtual params that live on CAM */
function readParam(id){
  if(id === 'camDist')  return CAM.dist;
  if(id === 'camPitch') return CAM.pitch/DEG;
  if(id === 'camYaw')   return ((CAM.yaw/DEG)%360+360)%360;
  return P[id];
}
/* Every parameter write refreshes the derived geometry immediately, so the CPU-side
   integrator (ray picking, shadow tracing, step sampling) can never run on stale values
   between a control change and the next rendered frame. */
function setParam(id, v){ setParamInner(id, v); updateDerived(); }
function setParamInner(id, v){
  if(id === 'camDist'){ CAM.dist = clamp(v, 3.5, 200); markDirty(); syncUI(); return; }
  if(id === 'camPitch'){ CAM.pitch = clamp(v,-89,89)*DEG; markDirty(); syncUI(); return; }
  if(id === 'camYaw'){ CAM.yaw = v*DEG; markDirty(); syncUI(); return; }
  if(id === 'quality'){ applyQuality(v); return; }
  if(id === 'mode'){ P.mode = parseInt(v,10)|0; markDirty(); updateLegend(); syncUI(); return; }
  if(id === 'spinDir'){ P.spinDir = parseFloat(v); markDirty(); syncUI(); return; }
  if(id === 'rk4'){ P.rk4 = parseInt(v,10)|0; markDirty(); syncUI(); return; }
  if(id === 'accumMode'){ P.accumMode = v; markDirty(); syncUI(); return; }
  if(id === 'renderScale'){ P.renderScale = v; pendingResize = true; markDirty(); toCustom(id); syncUI(); return; }
  if(typeof P[id] === 'boolean') P[id] = !!v;
  else if(typeof P[id] === 'number') P[id] = v;
  else P[id] = v;
  if(id==='maxSteps'||id==='stepSize'||id==='octaves') toCustom(id);
  markDirty(); syncUI();
}
function toCustom(id){
  const q = QUALITY[P.quality];
  if(!q) return;
  if(q[id] !== undefined && Math.abs(q[id] - P[id]) > 1e-9) P.quality = 'custom';
}
function applyQuality(name){
  P.quality = name;
  const q = QUALITY[name];
  if(q){ P.renderScale=q.renderScale; P.maxSteps=q.maxSteps; P.octaves=q.octaves; P.rk4=q.rk4; P.stepSize=q.stepSize; }
  pendingResize = true; markDirty(); syncUI();
}
function syncUI(){
  uiSuppress = true;
  for(const id in ui){
    const u = ui[id];
    if(u.kind === 'check') u.el.checked = !!P[id];
    else if(u.kind === 'select') u.el.value = String(P[id]);
    else {
      const v = readParam(id);
      if(document.activeElement !== u.el) u.el.value = String(v);
      u.out.textContent = u.spec.fmt ? u.spec.fmt(v) : String(v);
    }
  }
  uiSuppress = false;
  document.getElementById('btnPause').textContent = P.paused ? 'Resume' : 'Pause';
  document.getElementById('btnPause').classList.toggle('on', P.paused);
  document.getElementById('btnOrbit').classList.toggle('on', P.autoOrbit);
}

function resetAll(){
  Object.assign(P, JSON.parse(JSON.stringify(P_DEFAULT)));
  Object.assign(CAM, JSON.parse(JSON.stringify(CAM_DEFAULT)));
  applyAutoQuality();
  selected = null;
  document.getElementById('raypanel').classList.add('hidden');
  pendingResize = true; markDirty(); syncUI(); updateLegend();
  toast('Everything reset to defaults.');
}

/* ------------------------------------------------------------------ presets */
function buildPresets(){
  const bar = document.getElementById('presetbar');
  PRESETS.forEach((pr, i)=>{
    const b = document.createElement('button');
    b.className='btn'; b.textContent = pr.name;
    b.title = 'Camera preset: ' + pr.name;
    b.onclick = ()=> applyPreset(i);
    bar.appendChild(b);
  });
}
let presetIdx = 0, camAnim = null;
function applyPreset(i){
  presetIdx = i;
  const pr = PRESETS[i];
  camAnim = {
    t:0, dur:0.9,
    from:{dist:CAM.dist, yaw:CAM.yaw, pitch:CAM.pitch, fov:P.fov, tilt:P.diskTilt},
    to:{dist:pr.dist, yaw:nearestAngle(CAM.yaw, pr.yaw), pitch:pr.pitch, fov:pr.fov, tilt:pr.tilt}
  };
  CAM.target = [0,0,0];
  document.querySelectorAll('#presetbar .btn').forEach((b,k)=>b.classList.toggle('on', k===i));
  toast('Preset: ' + pr.name);
}
function nearestAngle(from, to){
  let d = (to - from) % (Math.PI*2);
  if(d > Math.PI) d -= Math.PI*2;
  if(d < -Math.PI) d += Math.PI*2;
  return from + d;
}
function tickCamAnim(dt){
  if(!camAnim) return;
  camAnim.t += dt/camAnim.dur;
  const t = clamp(camAnim.t, 0, 1);
  const e = t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  CAM.dist = lerp(camAnim.from.dist, camAnim.to.dist, e);
  CAM.yaw = lerp(camAnim.from.yaw, camAnim.to.yaw, e);
  CAM.pitch = lerp(camAnim.from.pitch, camAnim.to.pitch, e);
  P.fov = lerp(camAnim.from.fov, camAnim.to.fov, e);
  P.diskTilt = lerp(camAnim.from.tilt, camAnim.to.tilt, e);
  markDirty();
  if(t >= 1){ camAnim = null; syncUI(); }
}

/* ------------------------------------------------------------------ pointer input */
const pointers = new Map();
let dragMode = null, dragStart = null, movedPx = 0, pinchStart = null;

cv.style.touchAction = 'none';
function onDown(e){
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(pointers.size === 1){
    dragMode = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
    dragStart = {x:e.clientX, y:e.clientY, yaw:CAM.yaw, pitch:CAM.pitch, target:CAM.target.slice()};
    movedPx = 0;
    camAnim = null;
  } else if(pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinchStart = { d:Math.hypot(a.x-b.x, a.y-b.y), dist:CAM.dist,
                   cx:(a.x+b.x)/2, cy:(a.y+b.y)/2, target:CAM.target.slice() };
    dragMode = 'pinch';
  }
}
function onMove(e){
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(dragMode === 'pinch' && pointers.size >= 2){
    const [a,b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(pinchStart && pinchStart.d > 4){
      CAM.dist = clamp(pinchStart.dist * (pinchStart.d/d), 3.5, 200);
      const cx = (a.x+b.x)/2, cy = (a.y+b.y)/2;
      panBy(cx - pinchStart.cx, cy - pinchStart.cy, pinchStart.target);
      markDirty(); syncUI();
    }
    return;
  }
  if(!dragStart) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  movedPx = Math.max(movedPx, Math.hypot(dx, dy));
  if(dragMode === 'orbit'){
    CAM.yaw = dragStart.yaw - dx * 0.0055;
    CAM.pitch = clamp(dragStart.pitch + dy * 0.0045, -1.5533, 1.5533);
  } else {
    panBy(dx, dy, dragStart.target);
  }
  markDirty(); syncUI();
}
function panBy(dx, dy, baseTarget){
  const b = camBasis();
  const scale = CAM.dist * Math.tan(P.fov*DEG*0.5) * 2 / Math.max(R.cssH,1);
  CAM.target = V.add(baseTarget, V.add(V.mul(b.right, -dx*scale), V.mul(b.up, dy*scale)));
}
function onUp(e){
  const wasSingle = pointers.size === 1;
  pointers.delete(e.pointerId);
  if(wasSingle && movedPx < 6 && dragMode !== 'pinch'){
    selectRay(e.clientX, e.clientY);
  }
  if(pointers.size === 0){ dragMode = null; dragStart = null; pinchStart = null; }
}
cv.addEventListener('pointerdown', onDown);
cv.addEventListener('pointermove', onMove);
cv.addEventListener('pointerup', onUp);
cv.addEventListener('pointercancel', onUp);
cv.addEventListener('contextmenu', e=>e.preventDefault());
/* Zoom from anywhere over the viewport, but let the scrollable UI panels scroll. */
window.addEventListener('wheel', e=>{
  if(!R.ok) return;
  if(e.target && e.target.closest && e.target.closest('#panel, #raypanel')) return;
  e.preventDefault();
  const f = Math.exp(clamp(e.deltaY, -220, 220) * 0.0016);
  CAM.dist = clamp(CAM.dist * f, 3.5, 200);
  camAnim = null; markDirty(); syncUI();
}, {passive:false});

function selectRay(cssX, cssY){
  updateDerived();
  const b = camBasis();
  const dir = rayForPixel(cssX, cssY);
  const T = traceJS(b.pos, dir, {path:true});
  selected = { x:cssX, y:cssY, dir:dir, trace:T };
  document.getElementById('raypanel').classList.remove('hidden');
  refreshRayPanel();
}
function refreshSelected(){
  if(!selected) return;
  const b = camBasis();
  selected.dir = rayForPixel(selected.x, selected.y);
  selected.trace = traceJS(b.pos, selected.dir, {path:true});
  refreshRayPanel();
}
function refreshRayPanel(){
  const T = selected && selected.trace;
  if(!T) return;
  drawRayDiagram(T);
  const bcrit = 3*Math.sqrt(3)*P.mass;
  const cls = ['escaped to sky','captured by horizon','step budget exhausted','absorbed in disk'][T.outcome];
  const h0 = T.hits[0];
  const rows = [
    ['pixel', Math.round(selected.x)+', '+Math.round(selected.y), ''],
    ['impact param b', T.b.toFixed(3)+' r_g', 'cy'],
    ['b / b_crit', (T.b/bcrit).toFixed(3), Math.abs(T.b/bcrit-1)<0.06?'hi':'cy'],
    ['integration steps', String(T.steps)+' / '+P.maxSteps, T.steps>=P.maxSteps?'hi':''],
    ['closest approach', T.minR.toFixed(3)+' r_g', T.minR<3*P.mass?'hi':''],
    ['total deflection', (T.defl/DEG).toFixed(1)+'°', ''],
    ['net bend (in↔out)', (T.totalBend/DEG).toFixed(1)+'°', ''],
    ['winding Δφ', (T.winding/DEG).toFixed(1)+'°', ''],
    ['outcome', cls, T.outcome===1?'hi':'cy'],
    ['disk crossings', String(T.hits.length), '']
  ];
  if(h0){
    rows.push(['hit r, φ', h0.r.toFixed(2)+' r_g, '+(h0.phi/DEG).toFixed(0)+'°', 'cy']);
    rows.push(['Doppler δ', h0.gd.toFixed(4), h0.gd>1?'cy':'hi']);
    rows.push(['grav. shift √…', h0.gg.toFixed(4), '']);
    rows.push(['T emitted → obs', Math.round(h0.Tem)+' → '+Math.round(h0.Tobs)+' K', '']);
  }
  document.getElementById('rayvals').innerHTML = rows.map(r =>
    '<div class="r"><span class="k">'+r[0]+'</span><span class="v '+r[2]+'">'+escapeHTML(r[1])+'</span></div>').join('');
}
document.getElementById('rayClose').onclick = ()=>{
  selected = null; document.getElementById('raypanel').classList.add('hidden');
};

/* ------------------------------------------------------------------ keyboard */
window.addEventListener('keydown', e=>{
  if(e.target && /input|select|textarea/i.test(e.target.tagName) && e.key !== 'Escape') return;
  const k = e.key.toLowerCase();
  if(k === ' '){ e.preventDefault(); togglePause(); }
  else if(k === 'o'){ P.autoOrbit = !P.autoOrbit; syncUI(); }
  else if(k === 'r'){ resetAll(); }
  else if(k === 'h'){ toggleUI(); }
  else if(k === 'c'){ applyPreset((presetIdx+1) % PRESETS.length); }
  else if(k === 'f'){ CAM.target=[0,0,0]; CAM.dist=28; markDirty(); syncUI(); }
  else if(k === 'tab'){ e.preventDefault(); panel.classList.toggle('open');
    document.body.classList.toggle('drawer-open', panel.classList.contains('open')); }
  else if(k === 'escape'){ selected=null; document.getElementById('raypanel').classList.add('hidden'); }
  else if(k >= '1' && k <= '8'){ setParam('mode', String(parseInt(k,10)-1)); }
  else if(k === 'arrowleft'){ CAM.yaw -= 0.06; markDirty(); syncUI(); }
  else if(k === 'arrowright'){ CAM.yaw += 0.06; markDirty(); syncUI(); }
  else if(k === 'arrowup'){ CAM.pitch = clamp(CAM.pitch+0.04, -1.5533, 1.5533); markDirty(); syncUI(); }
  else if(k === 'arrowdown'){ CAM.pitch = clamp(CAM.pitch-0.04, -1.5533, 1.5533); markDirty(); syncUI(); }
  else if(k === '+' || k === '='){ CAM.dist = clamp(CAM.dist*0.9, 3.5, 200); markDirty(); syncUI(); }
  else if(k === '-'){ CAM.dist = clamp(CAM.dist*1.1, 3.5, 200); markDirty(); syncUI(); }
});
function togglePause(){ P.paused = !P.paused; syncUI(); }
let uiHidden = false;
function toggleUI(){
  uiHidden = !uiHidden;
  for(const id of ['topbar','panel','hud','legend','raypanel'])
    document.getElementById(id).style.opacity = uiHidden ? '0' : '';
  for(const id of ['topbar','panel','hud','legend','raypanel'])
    document.getElementById(id).style.pointerEvents = uiHidden ? 'none' : '';
  toast(uiHidden ? 'UI hidden — press H to bring it back' : 'UI shown');
}
document.getElementById('btnPause').onclick = togglePause;
document.getElementById('btnReset').onclick = resetAll;
document.getElementById('btnOrbit').onclick = ()=>{ P.autoOrbit = !P.autoOrbit; syncUI(); };
document.getElementById('panelToggle').onclick = ()=>{
  panel.classList.toggle('open');
  document.body.classList.toggle('drawer-open', panel.classList.contains('open'));
};

/* ------------------------------------------------------------------ toast */
let toastTimer = null;
function toast(msg, ms){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), ms || 2200);
}

/* ------------------------------------------------------------------ legend + HUD */
function updateLegend(){
  const m = MODES[P.mode];
  document.getElementById('legtitle').textContent = m.name;
  const bar = document.getElementById('legbar');
  const ticks = document.getElementById('legticks');
  const cats = document.getElementById('legcats');
  bar.style.display = 'none'; ticks.style.display='none'; cats.innerHTML=''; cats.style.display='none';
  if(m.legend === 'ramp'){
    bar.style.display='block'; ticks.style.display='flex';
    bar.style.background = rampCSS('turbo');
    ticks.innerHTML = '<span>'+m.lo+'</span><span>'+m.mid+'</span><span>'+m.hi+'</span>';
  } else if(m.legend === 'div'){
    bar.style.display='block'; ticks.style.display='flex';
    bar.style.background = 'linear-gradient(90deg,#eb2e1f,#f5f5f5,#2970fa)';
    ticks.innerHTML = '<span>'+m.lo+'</span><span>'+m.mid+'</span><span>'+m.hi+'</span>';
  } else if(m.legend === 'cats'){
    cats.style.display='flex';
    const items = P.mode === 7
      ? [['#6b0d17','captured by horizon'],['#fa8c21','absorbed in disk'],
         ['#e61ed9','step budget exhausted'],['#1a6bd1','escaped to sky']]
      : [['#ff3b3b','φ = 0°'],['#3bff8a','φ = 120°'],['#3b8aff','φ = 240°'],
         ['#888','dim = inner radius, bright = outer; rings every 2 r_g']];
    cats.innerHTML = items.map(i=>'<div><i style="background:'+i[0]+'"></i>'+i[1]+'</div>').join('');
  } else {
    cats.style.display='flex';
    cats.innerHTML = '<div style="color:var(--dim2)">Physically-shaded render: blackbody disk with ' +
      'relativistic beaming and redshift, lensed procedural star field.</div>';
  }
}
function rampCSS(){
  const stops = [];
  for(let i=0;i<=10;i++){
    const x = i/10;
    const c = turboJS(x);
    stops.push('rgb('+c.map(v=>Math.round(v*255)).join(',')+') '+(x*100)+'%');
  }
  return 'linear-gradient(90deg,' + stops.join(',') + ')';
}
function turboJS(x){
  x = clamp(x,0,1);
  const v4 = [1, x, x*x, x*x*x], v2 = [v4[2]*v4[2], v4[3]*v4[2]];
  const kR4=[0.13572138,4.61539260,-42.66032258,132.13108234], kR2=[-152.94239396,59.28637943];
  const kG4=[0.09140261,2.19418839,4.84296658,-14.18503333],   kG2=[4.27729857,2.82956604];
  const kB4=[0.10667330,12.64194608,-60.58204836,110.36276771],kB2=[-89.90310912,27.34824973];
  const d=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
  return [clamp(d(v4,kR4)+d(v2,kR2),0,1), clamp(d(v4,kG4)+d(v2,kG2),0,1), clamp(d(v4,kB4)+d(v2,kB2),0,1)];
}

let avgSteps = 0, avgSampleCounter = 0;
function sampleAverageSteps(){
  const b = camBasis();
  let tot = 0, n = 0;
  for(let j=0;j<5;j++){
    for(let i=0;i<7;i++){
      const x = (i+0.5)/7 * R.cssW, y = (j+0.5)/5 * R.cssH;
      tot += traceJS(b.pos, rayForPixel(x,y), {}).steps; n++;
    }
  }
  avgSteps = tot/Math.max(n,1);
}

const hud = document.getElementById('hud');
function updateHUD(){
  const m = MODES[P.mode];
  const rows = [
    ['fps', fpsAvg.toFixed(1) + ' (' + msAvg.toFixed(1) + ' ms)', fpsAvg<20?'warn':(fpsAvg>45?'ok':'')],
    ['render', R.W + '×' + R.H + '  ' + Math.round(100*R.W/Math.max(1,R.cssW*R.dpr)) + '%', ''],
    ['display', R.cssW + '×' + R.cssH + ' @' + R.dpr.toFixed(2) + 'x', ''],
    ['steps', 'avg~' + avgSteps.toFixed(0) + (selected ? '  sel ' + selected.trace.steps : '') + ' / ' + P.maxSteps, ''],
    ['quality', P.quality + (P.adaptive && adaptiveScale<0.999 ? ' (adapt ' + Math.round(adaptiveScale*100) + '%)' : ''), 'amber'],
    ['mode', m.name, 'amber'],
    ['cam dist', CAM.dist.toFixed(1) + ' r_g', ''],
    ['accum', P.accumMode === 'off' ? 'off' : (P.accumMode + ' n=' + R.accumN), ''],
    ['sim t', P.simTime.toFixed(1) + ' M', ''],
    ['state', P.paused ? 'PAUSED' : (P.autoOrbit ? 'orbiting' : 'running'), P.paused?'warn':'ok']
  ];
  hud.innerHTML = rows.map((r,i) =>
      (i===4?'<hr>':'') +
      '<div class="hrow"><span class="k">'+r[0]+'</span><span class="v '+r[2]+'">'+escapeHTML(r[1])+'</span></div>'
    ).join('');
}

/* ============================================================== 7. MAIN LOOP */

function applyAutoQuality(){
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
  const forced = hash.get('quality') || URLQ.get('quality');
  if(forced && QUALITY[forced]){ applyQuality(forced); return; }
  const narrow = Math.min(window.innerWidth, window.innerHeight) < 620;
  if(R.software){ applyQuality('low'); }
  else if(narrow){ applyQuality('medium'); }
  else applyQuality('high');
}

let hudCounter = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(now - lastT, 100);
  lastT = now;
  msAvg = msAvg*0.9 + dt*0.1;
  fpsAvg = 1000/Math.max(msAvg, 0.01);

  if(pendingResize){ pendingResize = false; computeSize(); markDirty(); }
  tickCamAnim(dt/1000);
  renderFrame(dt);
  updateAdaptive(dt);

  if(selected) refreshSelected();
  drawOverlay();

  if(++hudCounter % 6 === 0) updateHUD();
  if(++avgSampleCounter % 45 === 0) sampleAverageSteps();
}

function boot(){
  buildPresets();
  buildUI();
  if(!initGL()) { document.getElementById('overlay').style.display='none'; return; }
  applyAutoQuality();
  computeSize();
  updateDerived();
  syncUI();
  updateLegend();
  sampleAverageSteps();
  window.addEventListener('resize', ()=>{ pendingResize = true; markDirty(); });
  if(window.ResizeObserver){
    new ResizeObserver(()=>{ pendingResize = true; markDirty(); }).observe(document.body);
  }
  document.querySelectorAll('#presetbar .btn')[0].classList.add('on');
  if(R.software){
    toast('Software renderer detected (' + R.rendererName.slice(0,42) + '…) — starting at the Low quality preset.', 6000);
  }
  requestAnimationFrame(t=>{ lastT = t; loop(t); });
}

/* ---- debug / validation surface (read-only introspection, no effect on rendering) ---- */
window.__bh = {
  P, CAM, G, R, MODES, PRESETS,
  setParam, applyPreset, applyQuality, selectRay, traceJS, resetAll, camBasis, worldToScreen,
  metrics: ()=>({ fps:fpsAvg, ms:msAvg, W:R.W, H:R.H, cssW:R.cssW, cssH:R.cssH, dpr:R.dpr,
                  scale:P.renderScale, adaptive:adaptiveScale, accumN:R.accumN, frame:R.frame,
                  avgSteps, mode:P.mode, quality:P.quality, paused:P.paused, camDist:CAM.dist,
                  renderer:R.rendererName, software:R.software, fmt:R.halfOnly?'half':'float' }),
  selection: ()=> selected ? { x:selected.x, y:selected.y, trace:{
      steps:selected.trace.steps, b:selected.trace.b, minR:selected.trace.minR,
      defl:selected.trace.defl, outcome:selected.trace.outcome, hits:selected.trace.hits.length,
      hit0:selected.trace.hits[0] || null } } : null,
  /* Render one frame and read the canvas back as a coarse signature. Used to prove that
     the image genuinely changes when the camera or parameters change. */
  signature: (n)=>{
    n = n || 8;
    const gl = R.gl; if(!gl) return null;
    renderFrame(16);
    const px = new Uint8Array(R.W*R.H*4);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.readPixels(0, 0, R.W, R.H, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const out = [];
    for(let j=0;j<n;j++) for(let i=0;i<n;i++){
      let s=0, c=0;
      const x0=Math.floor(i*R.W/n), x1=Math.floor((i+1)*R.W/n);
      const y0=Math.floor(j*R.H/n), y1=Math.floor((j+1)*R.H/n);
      for(let y=y0;y<y1;y+=2) for(let x=x0;x<x1;x+=2){
        const o=(y*R.W+x)*4; s += px[o]*0.3+px[o+1]*0.59+px[o+2]*0.11; c++;
      }
      out.push(+(s/Math.max(c,1)).toFixed(2));
    }
    return out;
  }
};

document.getElementById('fatalRetry').onclick = ()=> location.reload();
document.getElementById('fatalCopy').onclick = ()=>{
  const d = window.__bhFatal || {};
  const txt = [d.kind, d.title, d.detail, 'UA: '+navigator.userAgent].join('\n');
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast('Diagnostics copied.'),()=>{});
};

boot();
</script>
