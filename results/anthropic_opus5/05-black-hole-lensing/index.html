<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Singularis — Black Hole &amp; Gravitational Lensing Explorer</title>
<style>
:root{
  --bg:#05060a;
  --panel:rgba(10,13,20,0.82);
  --panel-solid:#0b0e15;
  --line:rgba(255,255,255,0.10);
  --line-strong:rgba(255,255,255,0.20);
  --txt:#e8ecf4;
  --dim:#8f9bb3;
  --dim2:#63708a;
  --accent:#ffb454;
  --accent2:#5fd3f3;
  --warn:#ff6b6b;
  --ok:#67e8a0;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --topbar-h:46px;
  --panel-w:326px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{touch-action:none}
canvas{display:block}
#glcanvas{position:fixed;inset:0;width:100%;height:100%;background:#000;z-index:0;
  image-rendering:auto;touch-action:none}
#overlay{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.hidden{display:none !important}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:var(--topbar-h);z-index:6;
  display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(180deg,rgba(5,6,10,0.92),rgba(5,6,10,0.55) 70%,rgba(5,6,10,0));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#brand{display:flex;align-items:baseline;gap:9px;user-select:none;white-space:nowrap}
#brand b{font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:650;color:var(--txt)}
#brand span{font-size:10.5px;color:var(--dim2);letter-spacing:.06em}
#presetbar{display:flex;gap:5px;margin-left:auto;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#presetbar::-webkit-scrollbar{display:none}
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,0.045);color:var(--txt);
  font:500 11.5px/1 var(--sans);letter-spacing:.02em;padding:7px 10px;border-radius:7px;cursor:pointer;
  white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:rgba(255,255,255,0.11);border-color:var(--line-strong)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
.btn.on{background:rgba(255,180,84,0.18);border-color:rgba(255,180,84,0.55);color:#ffd9a3}
.btn.icon{padding:7px 9px;font-family:var(--mono);font-size:12px}

/* ---------- control panel ---------- */
#panel{position:fixed;top:var(--topbar-h);left:0;bottom:0;width:var(--panel-w);z-index:5;
  background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;
  padding:8px 0 26px;transition:transform .22s ease;touch-action:pan-y}
#panel::-webkit-scrollbar{width:9px}
#panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.14);border-radius:9px}
details.grp{border-bottom:1px solid var(--line)}
details.grp>summary{list-style:none;cursor:pointer;padding:9px 14px;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);user-select:none;display:flex;align-items:center;gap:7px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary:hover{color:var(--txt)}
details.grp>summary::before{content:"▸";font-size:9px;color:var(--dim2);transition:transform .15s}
details.grp[open]>summary::before{transform:rotate(90deg)}
.grpbody{padding:2px 14px 12px}
.ctl{margin:9px 0}
.ctl .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:3px}
.ctl label{font-size:11.5px;color:var(--dim);letter-spacing:.01em}
.ctl output,.ctl .val{font-family:var(--mono);font-size:11px;color:var(--accent2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.hint{font-size:10px;color:var(--dim2);line-height:1.45;margin:2px 0 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;
  cursor:pointer;display:block;margin:0}
input[type=range]:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:4px}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:rgba(255,255,255,0.16);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--accent);margin-top:-5px;border:none;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
input[type=range]::-moz-range-track{height:3px;background:rgba(255,255,255,0.16);border-radius:3px}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);border:none}
select{width:100%;background:#11151f;color:var(--txt);border:1px solid var(--line);border-radius:6px;
  padding:6px 8px;font:12px var(--sans);cursor:pointer}
select:focus-visible{outline:2px solid var(--accent2)}
.chk{display:flex;align-items:center;gap:8px;margin:7px 0;cursor:pointer;font-size:11.5px;color:var(--dim)}
.chk input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;margin:0}
.chk:hover{color:var(--txt)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.aboutp{font-size:10.5px;color:var(--dim2);line-height:1.55;margin:6px 0}
.aboutp b{color:var(--dim);font-weight:600}
.aboutp code{font-family:var(--mono);color:var(--accent2);font-size:10px}

/* ---------- HUD ---------- */
#hud{position:fixed;top:calc(var(--topbar-h) + 8px);right:10px;z-index:4;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-family:var(--mono);font-size:10.5px;line-height:1.62;padding:8px 10px;min-width:196px;
  font-variant-numeric:tabular-nums;pointer-events:none}
#hud .hrow{display:flex;justify-content:space-between;gap:12px}
#hud .k{color:var(--dim2)}
#hud .v{color:var(--accent2)}
#hud .v.warn{color:var(--warn)}
#hud .v.ok{color:var(--ok)}
#hud .v.amber{color:var(--accent)}
#hud hr{border:0;border-top:1px solid var(--line);margin:5px 0}

/* ---------- legend ---------- */
#rightstack{position:fixed;right:10px;bottom:10px;z-index:5;display:flex;flex-direction:column;
  gap:8px;align-items:flex-end;max-height:calc(100vh - var(--topbar-h) - 20px);pointer-events:none}
#rightstack>*{pointer-events:auto}
#legend{width:214px;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#legend h4{margin:0 0 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
#legbar{height:9px;border-radius:3px;border:1px solid var(--line);margin-bottom:4px}
#legticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--dim2)}
#legcats{display:flex;flex-direction:column;gap:3px;font-size:10px;color:var(--dim)}
#legcats div{display:flex;align-items:center;gap:6px}
#legcats i{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.5)}

/* ---------- ray panel ---------- */
#raypanel{width:274px;flex:0 1 auto;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:9px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:hidden}
#raypanel header{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;
  border-bottom:1px solid var(--line)}
#raypanel header h4{margin:0;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
#raypanel .body{padding:8px 10px 10px}
#raydiagram{width:100%;height:150px;display:block;border-radius:6px;background:#04060c;
  border:1px solid var(--line)}
#rayvals{margin-top:7px;font-family:var(--mono);font-size:10px;line-height:1.6;
  font-variant-numeric:tabular-nums}
#rayvals .r{display:flex;justify-content:space-between;gap:10px}
#rayvals .k{color:var(--dim2)}
#rayvals .v{color:var(--txt)}
#rayvals .v.hi{color:var(--accent)}
#rayvals .v.cy{color:var(--accent2)}
#rayhint{font-size:10px;color:var(--dim2);line-height:1.5;padding:10px}

/* ---------- toast / notices ---------- */
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9;
  background:rgba(12,16,24,0.95);border:1px solid var(--line-strong);border-radius:8px;
  padding:8px 14px;font-size:12px;color:var(--txt);opacity:0;transition:opacity .25s;pointer-events:none;
  max-width:min(560px,90vw);text-align:center}
#toast.show{opacity:1}

/* ---------- fatal error screen ---------- */
#fatal{position:fixed;inset:0;z-index:20;background:radial-gradient(120% 90% at 50% 0%,#161c2b,#05060a 70%);
  display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
#fatal .card{max-width:760px;width:100%;background:rgba(10,13,20,.9);border:1px solid var(--line-strong);
  border-radius:14px;padding:26px 28px}
#fatal h1{margin:0 0 4px;font-size:20px;letter-spacing:.01em}
#fatal .sub{color:var(--accent);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
#fatal p{color:var(--dim);font-size:13.5px;line-height:1.65;margin:9px 0}
#fatal ul{color:var(--dim);font-size:13px;line-height:1.7;margin:9px 0 9px 18px;padding:0}
#fatal pre{background:#05070c;border:1px solid var(--line);border-radius:8px;padding:12px;
  font-family:var(--mono);font-size:10.5px;line-height:1.5;color:#ffb4b4;overflow:auto;max-height:280px;
  white-space:pre-wrap;word-break:break-word}
#fatal .foot{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- responsive ---------- */
#panelToggle{display:none}
@media (max-width: 900px){
  body.drawer-open #hud, body.drawer-open #rightstack{opacity:0;pointer-events:none}
  :root{--panel-w:min(88vw,326px)}
  #panelToggle{display:inline-flex}
  #panel{transform:translateX(-102%);box-shadow:0 0 40px rgba(0,0,0,.6)}
  #panel.open{transform:translateX(0)}
  #brand span{display:none}
  #hud{min-width:0;font-size:9.5px;padding:6px 8px;top:calc(var(--topbar-h) + 6px);right:6px}
  #hud .hrow{gap:8px}
  #rightstack{right:6px;bottom:6px;left:6px;align-items:stretch}
  #legend{width:auto}
  #raypanel{width:auto}
  #raydiagram{height:118px}
}
@media (max-width: 560px){
  :root{--topbar-h:44px}
  #brand b{font-size:12px;letter-spacing:.1em}
  .btn{padding:6px 8px;font-size:11px}
  #hud{font-size:9px}
  #legend{width:auto}
}
@media (max-height: 560px){
  #legend,#raypanel{max-height:56vh;overflow:auto}
  #raydiagram{height:96px}
}
</style>
</head>
<body>

<canvas id="glcanvas" aria-label="Black hole render viewport"></canvas>
<canvas id="overlay"></canvas>

<div id="topbar">
  <button class="btn icon" id="panelToggle" aria-label="Toggle controls panel" title="Controls (Tab)">☰</button>
  <div id="brand"><b>Singularis</b><span>gravitational lensing explorer</span></div>
  <div id="presetbar" role="group" aria-label="Camera presets"></div>
  <button class="btn" id="btnOrbit" title="Auto-orbit (O)">Auto-orbit</button>
  <button class="btn" id="btnPause" title="Pause / resume (Space)">Pause</button>
  <button class="btn icon" id="btnReset" title="Reset everything (R)">↺</button>
</div>

<aside id="panel" aria-label="Simulation controls"></aside>

<div id="hud" aria-live="off"></div>

<div id="rightstack">
<div id="legend">
  <h4 id="legtitle">Legend</h4>
  <div id="legbar"></div>
  <div id="legticks"><span>—</span><span>—</span><span>—</span></div>
  <div id="legcats"></div>
</div>

<div id="raypanel" class="hidden">
  <header>
    <h4>Selected ray</h4>
    <button class="btn icon" id="rayClose" aria-label="Clear ray selection">✕</button>
  </header>
  <div class="body">
    <canvas id="raydiagram" aria-label="Diagram of the selected ray trajectory"></canvas>
    <div id="rayvals"></div>
  </div>
</div>

</div>

<div id="toast" role="status"></div>

<div id="fatal" class="hidden">
  <div class="card">
    <div class="sub" id="fatalKind">Renderer error</div>
    <h1 id="fatalTitle">This explorer could not start</h1>
    <div id="fatalBody"></div>
    <div class="foot">
      <button class="btn" id="fatalRetry">Try again</button>
      <button class="btn" id="fatalCopy">Copy diagnostics</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================================
   SINGULARIS — real-time black hole + gravitational lensing explorer
   Single file, no dependencies, no network.  WebGL2 fragment-shader geodesic integrator.

   PHYSICS SUMMARY (see the "Model & units" panel section for the user-facing version)
   -------------------------------------------------------------------------------------
   Units: geometric, G = c = 1, length unit = r_g = GM/c^2 with M = "mass" slider.
   Null geodesics of the Schwarzschild metric obey the Binet equation
        d^2u/dphi^2 + u = 3 M u^2 ,  u = 1/r
   which is exactly equivalent to the 3-vector ODE
        d^2 x/dl^2 = -3 M h^2 x / |x|^5 ,   h = |x cross dx/dl| (conserved)
   That ODE is what both the GPU shader and the CPU mirror integrate (Verlet or RK4,
   adaptive step).  It is a *coherent ray integration*, not a screen-space warp.
   Spin is an approximation: the gravitomagnetic (Lense-Thirring) term
        a_LT = -2 v x B ,  B = (2/r^3)(3 (J.rhat) rhat - J),  J = a M^2 spin-axis
   which drags rays and makes the shadow asymmetric, plus the Kerr horizon
   r_h = M(1 + sqrt(1-a^2)).
   ===================================================================================== */

/* ------------------------------------------------------------------ tiny vec3 helpers */
const V = {
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  norm:a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];},
  mix:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]
};
const clamp=(x,a,b)=>x<a?a:(x>b?b:x);
const lerp=(a,b,t)=>a+(b-a)*t;
const DEG=Math.PI/180;

/* ============================================================== 1. STATE / PARAMETERS */

const P = {                      // every simulation parameter lives here
  // simulation
  paused:false, timeScale:1.0, simTime:0.0,
  // gravity
  mass:1.0, horizonScale:1.0, spin:0.55, spinDir:1,
  // disk
  diskIn:5.2, diskOut:20.0, diskH:0.32, diskTilt:0.0, diskAz:0.0,
  temp:6600, turb:0.75, turbScale:0.55, diskGain:1.0, diskOpacity:0.9,
  doppler:1.0, redshift:1.0,
  // sky
  skyGain:1.0,
  // camera
  fov:35, autoOrbit:false, orbitSpeed:0.06,
  // rendering
  exposure:-0.35, contrast:1.08, bloom:0.42,
  stepSize:0.14, maxSteps:220, renderScale:0.70, quality:'high',
  octaves:3, rk4:0, accumMode:'taa', adaptive:true,
  // visualization
  mode:0,
  ovHorizon:false, ovPhoton:false, ovDisk:false, ovRay:true
};
const P_DEFAULT = JSON.parse(JSON.stringify(P));

const CAM = { dist:32.0, yaw:0.62, pitch:0.145, target:[0,0,0] };
const CAM_DEFAULT = JSON.parse(JSON.stringify(CAM));

const QUALITY = {
  low:    { renderScale:0.34, maxSteps:110, octaves:2, rk4:0, stepSize:0.20 },
  medium: { renderScale:0.52, maxSteps:170, octaves:3, rk4:0, stepSize:0.16 },
  high:   { renderScale:0.70, maxSteps:220, octaves:3, rk4:0, stepSize:0.14 },
  ultra:  { renderScale:1.00, maxSteps:400, octaves:4, rk4:1, stepSize:0.09 }
};

const MODES = [
  {id:0, name:'Cinematic',        legend:'cinematic'},
  {id:1, name:'Ray step count',   legend:'ramp', map:'turbo', lo:'0', mid:'steps', hi:'max'},
  {id:2, name:'Deflection angle', legend:'ramp', map:'turbo', lo:'0°', mid:'total bend', hi:'≥720°'},
  {id:3, name:'Gravitational redshift', legend:'div', lo:'z↑ red', mid:'g = 1', hi:'blue'},
  {id:4, name:'Doppler factor',   legend:'div', lo:'receding', mid:'δ = 1', hi:'approaching'},
  {id:5, name:'Disk hit (r, φ)',  legend:'cats'},
  {id:6, name:'Closest approach', legend:'ramp', map:'turbo', lo:'r=rₕ', mid:'min r', hi:'≥30 r_g'},
  {id:7, name:'Escape class',     legend:'cats'}
];

const PRESETS = [
  {name:'Classic',   dist:32,  yaw:0.62, pitch:0.145, fov:35, tilt:0},
  {name:'Edge-on',   dist:30,  yaw:1.85, pitch:0.045, fov:30, tilt:0},
  {name:'Polar',     dist:36,  yaw:0.40, pitch:1.36,  fov:42, tilt:0},
  {name:'Photon ring',dist:30,  yaw:2.60, pitch:0.22,  fov:26, tilt:0},
  {name:'Close pass',dist:11.0,yaw:3.75, pitch:0.42,  fov:80, tilt:0.22},
  {name:'Wide',      dist:66,  yaw:5.20, pitch:0.50,  fov:24, tilt:0.16}
];

/* ============================================================== 2. SHADER SOURCE CODE */

const VS = `#version 300 es
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

/* ---- the main geodesic ray-integration shader ---- */
const FS_MAIN = `#version 300 es
precision highp float;
precision highp int;
out vec4 outColor;

uniform vec2  uRes;
uniform vec2  uJitter;
uniform vec3  uCamPos, uCamRight, uCamUp, uCamFwd;
uniform float uTanHalf, uAspect;

uniform float uMass, uRh, uSpin, uSpinDir, uEscape;
uniform vec3  uN, uDU, uDV;
uniform float uDiskIn, uDiskOut, uDiskH, uHmax, uDiskStep;
uniform float uT0, uTurb, uTurbScale, uDop, uRed, uDiskGain, uDiskOpacity;
uniform float uTime, uStep, uSkyGain;
uniform int   uMaxSteps, uMode, uRK4, uOct;
uniform sampler2D uBB;

#define PI 3.141592653589793

/* ---------------------------------------------------------------- hashes and noise */
float hash13(vec3 p3){
  p3 = fract(p3 * 0.1031);
  p3 += dot(p3, p3.zyx + 31.32);
  return fract((p3.x + p3.y) * p3.z);
}
vec3 hash33(vec3 p3){
  p3 = fract(p3 * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yxz + 33.33);
  return fract((p3.xxy + p3.yxx) * p3.zyx);
}
float vnoise(vec3 x){
  vec3 i = floor(x), f = fract(x);
  f = f*f*(3.0 - 2.0*f);
  float a = mix(mix(mix(hash13(i+vec3(0,0,0)), hash13(i+vec3(1,0,0)), f.x),
                    mix(hash13(i+vec3(0,1,0)), hash13(i+vec3(1,1,0)), f.x), f.y),
                mix(mix(hash13(i+vec3(0,0,1)), hash13(i+vec3(1,0,1)), f.x),
                    mix(hash13(i+vec3(0,1,1)), hash13(i+vec3(1,1,1)), f.x), f.y), f.z);
  return a;
}
float fbm(vec3 p, int oct){
  float a = 0.5, s = 0.0, n = 0.0;
  for(int i=0;i<6;i++){
    if(i>=oct) break;
    s += a * vnoise(p);
    n += a; a *= 0.5; p = p*2.03 + vec3(17.3, 5.1, 9.7);
  }
  return s / max(n, 1e-5);
}

/* ------------------------------------------------------- colour: blackbody + ramps */
/* Planck-locus chroma, unit luminance, baked into a 256x1 LUT on the CPU from the same
   fit used by blackbodyLUT() in JS.  One texture fetch instead of six transcendentals. */
vec3 blackbodyRGB(float K){
  float t = (log2(clamp(K, 500.0, 60000.0)) - 8.9657843) * 0.14478311;
  return texture(uBB, vec2(clamp(t, 0.0, 1.0), 0.5)).rgb * 8.0;   // LUT stored at 1/8
}
float p075(float x){ float s = sqrt(max(x,0.0)); return s*sqrt(s); }   // x^(3/4)
float p025(float x){ return sqrt(sqrt(max(x,0.0))); }                  // x^(1/4)
float pow4(float x){ float y = x*x; return y*y; }
vec3 turbo(float x){
  const vec4 kR4 = vec4(0.13572138, 4.61539260, -42.66032258, 132.13108234);
  const vec4 kG4 = vec4(0.09140261, 2.19418839,   4.84296658, -14.18503333);
  const vec4 kB4 = vec4(0.10667330,12.64194608, -60.58204836, 110.36276771);
  const vec2 kR2 = vec2(-152.94239396, 59.28637943);
  const vec2 kG2 = vec2(4.27729857, 2.82956604);
  const vec2 kB2 = vec2(-89.90310912, 27.34824973);
  x = clamp(x, 0.0, 1.0);
  vec4 v4 = vec4(1.0, x, x*x, x*x*x);
  vec2 v2 = v4.zw * v4.z;
  return clamp(vec3(dot(v4,kR4)+dot(v2,kR2), dot(v4,kG4)+dot(v2,kG2), dot(v4,kB4)+dot(v2,kB2)),0.0,1.0);
}
vec3 diverging(float x){                        // -1 red .. 0 white .. +1 blue
  float t = clamp(x, -1.0, 1.0);
  vec3 warm = vec3(0.92, 0.18, 0.12);
  vec3 cool = vec3(0.16, 0.44, 0.98);
  vec3 mid  = vec3(0.96, 0.96, 0.96);
  return (t < 0.0) ? mix(mid, warm, -t) : mix(mid, cool, t);
}

/* --------------------------------------------------------------- procedural sky */
vec3 starTint(float t){
  return mix(mix(vec3(1.00,0.53,0.28), vec3(1.00,0.94,0.86), smoothstep(0.0,0.5,t)),
             vec3(0.62,0.74,1.00), smoothstep(0.45,1.0,t));
}
/* Stars live on a gnomonic cube-face grid.  Distances must be measured with that
   projection's angular metric, otherwise stars smear into ellipses away from the face
   centre.  For face coords (u,v): dtheta^2 = ((1+v^2)du^2 - 2uv du dv + (1+u^2)dv^2)/(1+u^2+v^2)^2 */
vec3 starLayer(vec2 uv, float face, float scale, float seed, float thresh, float gain){
  vec3 col = vec3(0.0);
  vec2 g = uv * scale;
  vec2 gi = floor(g), gf = g - gi;
  float w = 1.0 + uv.x*uv.x + uv.y*uv.y;
  vec3 met = vec3(1.0 + uv.y*uv.y, -2.0*uv.x*uv.y, 1.0 + uv.x*uv.x) / (w*w);
  for(int y=-1;y<=1;y++){
    for(int x=-1;x<=1;x++){
      vec2 o = vec2(float(x), float(y));
      vec3 h = hash33(vec3(gi + o, face * 13.7 + seed));
      if(h.z < thresh) continue;
      vec2 sp = o + vec2(h.x, h.y);
      vec2 e = gf - sp;
      float d2 = met.x*e.x*e.x + met.y*e.x*e.y + met.z*e.y*e.y;
      if(d2 > 0.02) continue;                      // cheap cull: profile is already ~0 here
      float mag = fract(h.z * 137.13);
      float core = exp(-d2 * (1400.0 - 900.0*mag));
      float amp = core + 0.028 * exp(-d2 * 400.0);
      if(amp < 0.002) continue;
      col += starTint(fract(h.x*91.7 + h.y*13.1)) * amp * (0.25 + 3.4*mag*mag) * gain;
    }
  }
  return col;
}
vec3 sky(vec3 d){
  vec3 ad = abs(d);
  float ma = max(ad.x, max(ad.y, ad.z));
  vec2 uv; float face;
  if(ma == ad.x){ uv = vec2(d.y, d.z)/d.x; face = d.x > 0.0 ? 0.0 : 1.0; }
  else if(ma == ad.y){ uv = vec2(d.x, d.z)/d.y; face = d.y > 0.0 ? 2.0 : 3.0; }
  else { uv = vec2(d.x, d.y)/d.z; face = d.z > 0.0 ? 4.0 : 5.0; }

  vec3 col = vec3(0.0);
  col += starLayer(uv, face, 13.0, 0.0,  0.55, 1.0);
  col += starLayer(uv, face, 37.0, 7.3,  0.72, 0.30);
  col += starLayer(uv, face, 91.0, 21.7, 0.86, 0.11);

  // galactic band + dust (the expensive fbm layers are gated on the band envelope)
  vec3 gN = normalize(vec3(0.30, 0.90, -0.31));
  float b = dot(d, gN);
  float band = exp(-b*b*13.0);
  if(band > 0.012){
    float dust = fbm(d*3.1 + 4.0, 3);
    float lane = smoothstep(0.35, 0.75, fbm(d*5.0 + 40.0, 2));
    vec3 neb = mix(vec3(0.20,0.26,0.50), vec3(0.62,0.40,0.24), dust);
    col += neb * band * (0.25 + 1.1*dust) * (1.0 - 0.72*lane) * 0.115;
    col += vec3(0.030,0.038,0.075) * (0.35 + 0.75*dust) * (0.35 + 0.9*band);
  }
  col += vec3(0.0035, 0.0045, 0.0085);         // faint floor so lensing stays readable
  return col * uSkyGain;
}

/* --------------------------------------------------------------- geodesic machinery */
vec3 accel(vec3 p, vec3 v, float h2){
  float r2 = dot(p, p);
  float r  = sqrt(r2);
  vec3 a = (-3.0 * uMass * h2 / (r2 * r2 * r)) * p;        // Schwarzschild (exact Binet form)
  if(uSpin > 0.001){                                        // Lense-Thirring approximation
    vec3 rh = p / r;
    vec3 J  = uN * (uSpin * uMass * uMass * uSpinDir);
    vec3 B  = (2.0 / (r2 * r)) * (3.0 * dot(J, rh) * rh - J);
    a += -2.0 * cross(v, B);
  }
  return a;
}
/* Velocity Verlet with the end-of-step acceleration carried into the next step, so each
   step costs one force evaluation.  Exact for the (velocity-independent) Schwarzschild
   term; the spin term uses a one-step-stale velocity, which is well inside its own
   approximation error. */
void stepVerlet(inout vec3 p, inout vec3 v, inout vec3 a, float h2, float dt){
  p = p + v*dt + (0.5*dt*dt)*a;
  vec3 an = accel(p, v + dt*a, h2);
  v = v + (0.5*dt)*(a + an);
  a = an;
}
void stepRK4(inout vec3 p, inout vec3 v, float h2, float dt){
  vec3 k1p = v,                k1v = accel(p, v, h2);
  vec3 k2p = v + (0.5*dt)*k1v, k2v = accel(p + (0.5*dt)*k1p, k2p, h2);
  vec3 k3p = v + (0.5*dt)*k2v, k3v = accel(p + (0.5*dt)*k2p, k3p, h2);
  vec3 k4p = v + dt*k3v,       k4v = accel(p + dt*k3p, k4p, h2);
  p += (dt/6.0)*(k1p + 2.0*k2p + 2.0*k3p + k4p);
  v += (dt/6.0)*(k1v + 2.0*k2v + 2.0*k3v + k4v);
}
float stepLen(vec3 p, vec3 v, float h2, float r){
  float dt = uStep * r;                                       // geometric progress
  dt = min(dt, uStep * (r*r*r*r) / (3.0*uMass*h2 + 1e-3));     // deflection-limited
  dt = min(dt, max(0.25*(r - uRh), 0.006*uMass));              // horizon proximity
  float y  = dot(p, uN);
  float rc = length(p - y*uN);
  float H  = uDiskH * (0.6 + 0.4 * sqrt(max(rc, uDiskIn) / uDiskIn));  // local scale height
  float dv = abs(y) - H*2.5;
  float dr = max(uDiskIn - rc, rc - uDiskOut);
  // Inside the slab the sampling rate is set by how fast the density changes *along the ray*:
  // steeply crossing rays need H-sized steps, grazing rays only need to resolve the
  // horizontal turbulence scale.  Without this, edge-on rays burn the whole step budget.
  float ndv = abs(dot(v, uN)) / max(length(v), 1e-6);
  float sIn = min(H * uDiskStep / max(ndv, 0.05), 0.8 / max(uTurbScale, 0.1));
  dt = min(dt, max(0.6 * max(dv, dr), sIn));                   // disk-slab proximity
  return max(dt, 0.004*uMass);
}

/* --------------------------------------------------------------- accretion disk */
struct Sample { vec3 emit; float dens; float gd; float gg; float r; float phi; };

Sample diskSample(vec3 p, vec3 v, float gcam){
  Sample S;
  S.emit = vec3(0.0); S.dens = 0.0; S.gd = 1.0; S.gg = 1.0; S.r = 0.0; S.phi = 0.0;
  float y  = dot(p, uN);
  vec3  q  = p - y*uN;
  float r  = length(q);
  if(r < uDiskIn || r > uDiskOut) return S;
  float H = uDiskH * (0.6 + 0.4 * sqrt(r / uDiskIn));           // mild flare
  float vert = exp(-(y*y)/(H*H));
  if(vert < 0.004) return S;

  float du = dot(q, uDU), dv = dot(q, uDV);
  S.r = r;
  S.phi = (uMode == 5) ? atan(dv, du) : 0.0;                   // atan only where it is shown

  // --- differentially rotating (Keplerian) turbulence, frozen into the fluid frame.
  //     Rotating (du,dv) by -omega*t is the same as evaluating at phi - omega*t, without atan.
  float om  = uSpinDir * sqrt(uMass / (r*r*r));
  float ct = cos(om * uTime), st = sin(om * uTime);
  vec3  np  = vec3(du*ct + dv*st, dv*ct - du*st, y*2.2) * uTurbScale;
  float n   = fbm(np + vec3(0.0, 0.0, uTime*0.03), uOct);
  float fil = 1.0 - abs(2.0*fbm(np*2.7 + 31.0, max(uOct-1,1)) - 1.0);
  float tex = mix(1.0, (0.34 + 1.25*n) * (0.55 + 0.75*fil), clamp(uTurb, 0.0, 1.0));

  // spiral density waves: rings in r whose phase is perturbed by the fluid-frame noise,
  // so they co-rotate with the flow and shear into arcs
  float wave = 0.55 + 0.45 * sin(r * 2.6 + 9.0 * n);
  float sigma = uDiskIn / r;                          // surface-density profile, Sigma ~ 1/r
  float edge = smoothstep(0.0, 0.16, (r - uDiskIn)/max(uDiskIn,1e-3))
             * smoothstep(0.0, 0.30, (uDiskOut - r)/max(uDiskOut,1e-3));
  S.dens = vert * edge * sigma * tex * mix(1.0, wave, clamp(uTurb, 0.0, 1.0));
  if(S.dens <= 0.0) return S;

  // --- temperature (Shakura-Sunyaev thin disk, normalised so the peak equals uT0)
  float x  = clamp(uDiskIn / r, 0.0, 0.999999);
  float Tem = uT0 * 2.05 * p075(x) * p025(1.0 - sqrt(x));
  if(Tem < 1.0) return S;

  // --- Doppler (special relativistic, local static frame) + gravitational shift
  vec3 rhat = q / r;
  vec3 vhat = normalize(cross(uN, rhat)) * uSpinDir;
  float beta = min(sqrt(uMass / max(r - 2.0*uMass, 0.15*uMass)), 0.995);
  float gam  = 1.0 / sqrt(1.0 - beta*beta);
  vec3 nobs  = -normalize(v);                                   // emitter -> observer
  float gd = 1.0 / (gam * (1.0 - beta * dot(vhat, nobs)));
  float gg = sqrt(max(1.0 - 2.0*uMass/max(length(p), 1e-3), 1e-4)) / gcam;
  S.gd = gd; S.gg = gg;

  float gEff = mix(1.0, gd, clamp(uDop, 0.0, 3.0)) * mix(1.0, gg, clamp(uRed, 0.0, 3.0));
  gEff = clamp(gEff, 0.05, 12.0);
  float Tobs = Tem * gEff;

  // Brightness follows the radial T^4 law and the g^4 beaming/redshift law.  It is divided
  // by the vertical column depth (H*sqrt(pi)) so that changing the disk thickness changes
  // the shape of the disk, not the exposure of the picture.
  float bright = pow4(Tem / uT0) * pow4(gEff);
  S.emit = blackbodyRGB(Tobs) * bright * uDiskGain * (0.85 / (H * 1.7725));
  return S;
}

/* --------------------------------------------------------------- the trace */
struct Trace {
  vec3 color; float trans; int steps; float minR; float defl;
  int outcome;                 // 0 sky, 1 captured, 2 step budget exhausted, 3 disk opaque
  float hitR; float hitPhi; float gd; float gg; int nHits; vec3 endDir;
};

Trace trace(vec3 ro, vec3 rd){
  Trace T;
  T.color = vec3(0.0); T.trans = 1.0; T.steps = 0; T.minR = 1e9; T.defl = 0.0;
  T.outcome = 2; T.hitR = -1.0; T.hitPhi = 0.0; T.gd = 1.0; T.gg = 1.0; T.nHits = 0;
  T.endDir = rd;

  vec3 p = ro, v = rd;
  vec3 L = cross(p, v);
  float h2 = dot(L, L);
  float gcam = sqrt(max(1.0 - 2.0*uMass/max(length(ro),1e-3), 1e-4));
  vec3 a = accel(p, v, h2);

  for(int i = 0; i < 4096; i++){
    if(i >= uMaxSteps) break;
    float r = length(p);
    T.minR = min(T.minR, r);
    float pv = dot(p, v);
    if(r < uRh){ T.outcome = 1; break; }
    if(r < 3.0*uMass && pv < 0.0){ T.outcome = 1; break; }      // inside the barrier, infalling
    if(r > uEscape && pv > 0.0){ T.outcome = 0; break; }
    if(T.trans < 0.004){ T.outcome = 3; break; }
    T.steps = i + 1;

    float dt = stepLen(p, v, h2, r);
    vec3 p0 = p, v0 = v;
    if(uRK4 == 1){ stepRK4(p, v, h2, dt); } else { stepVerlet(p, v, a, h2, dt); }
    if(uSpin > 0.001){ L = cross(p, v); h2 = dot(L, L); }

    if(uMode == 2){   // chord ~= turn angle for the small per-step deflections used here
      T.defl += sqrt(max(2.0 - 2.0*dot(normalize(v0), normalize(v)), 0.0));
    }

    // volumetric emission along the segment (midpoint quadrature)
    vec3 pm = 0.5*(p0 + p);
    float y = dot(pm, uN);
    if(abs(y) < uHmax*2.6){
      float segLen = length(p - p0);
      Sample S = diskSample(pm, 0.5*(v0 + v), gcam);
      if(S.dens > 0.0){
        T.color += T.trans * S.emit * S.dens * segLen;
        T.trans *= exp(-S.dens * uDiskOpacity * segLen);
        if(T.nHits == 0){ T.hitR = S.r; T.hitPhi = S.phi; T.gd = S.gd; T.gg = S.gg; }
        T.nHits += 1;
      }
    }
  }
  T.endDir = normalize(v);
  if(T.outcome == 0) T.color += T.trans * sky(T.endDir);
  return T;
}

/* --------------------------------------------------------------- diagnostics */
vec3 diagnostic(Trace T, vec3 rd){
  if(uMode == 1){
    return turbo(float(T.steps) / max(float(uMaxSteps), 1.0));
  } else if(uMode == 2){
    return turbo(clamp(T.defl / (4.0*PI), 0.0, 1.0));
  } else if(uMode == 3){
    if(T.hitR < 0.0) return vec3(0.045, 0.05, 0.06);
    return diverging(clamp(log2(max(T.gg, 1e-3)) * 2.2, -1.0, 1.0));
  } else if(uMode == 4){
    if(T.hitR < 0.0) return vec3(0.045, 0.05, 0.06);
    return diverging(clamp(log2(max(T.gd, 1e-3)) * 1.6, -1.0, 1.0));
  } else if(uMode == 5){
    if(T.hitR < 0.0) return vec3(0.03, 0.035, 0.045);
    float a = T.hitPhi / (2.0*PI) + 0.5;
    float rn = (T.hitR - uDiskIn) / max(uDiskOut - uDiskIn, 1e-3);
    // hue wheel for phi, contour rings every 2 r_g, brightness ramps with radius
    vec3 hue = 0.5 + 0.5*cos(6.2831853*(a + vec3(0.0, 0.33, 0.67)));
    float ring = smoothstep(0.42, 0.5, abs(fract(T.hitR*0.5) - 0.5));
    float spoke = smoothstep(0.40, 0.5, abs(fract(a*12.0) - 0.5));
    return hue * (0.30 + 0.70*rn) * (0.55 + 0.45*ring) * (0.60 + 0.40*spoke);
  } else if(uMode == 6){
    float t = clamp((T.minR - uRh) / max(30.0*uMass, 1e-3), 0.0, 1.0);
    return turbo(t);
  } else {
    if(T.outcome == 1) return vec3(0.42, 0.05, 0.09);           // captured
    if(T.outcome == 3) return vec3(0.98, 0.55, 0.13);           // absorbed by the disk
    if(T.outcome == 2) return vec3(0.90, 0.12, 0.85);           // step budget exhausted
    return vec3(0.10, 0.42, 0.82);                              // escaped to sky
  }
}

void main(){
  vec2 px  = gl_FragCoord.xy + uJitter;
  vec2 ndc = (px / uRes) * 2.0 - 1.0;
  vec3 dir = normalize(uCamFwd + uCamRight*(ndc.x*uAspect*uTanHalf) + uCamUp*(ndc.y*uTanHalf));
  Trace T = trace(uCamPos, dir);
  vec3 col = (uMode == 0) ? T.color : diagnostic(T, dir);
  outColor = vec4(col, 1.0);
}`;

/* ---- accumulation (temporal AA / progressive averaging) ---- */
const FS_ACCUM = `#version 300 es
precision highp float;
uniform sampler2D uScene, uPrev;
uniform float uAlpha;
out vec4 outColor;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec3 s = texelFetch(uScene, c, 0).rgb;
  vec3 p = texelFetch(uPrev, c, 0).rgb;
  outColor = vec4(mix(p, s, clamp(uAlpha, 0.0, 1.0)), 1.0);
}`;

/* ---- bloom bright-pass (box downsample x2) ---- */
const FS_BRIGHT = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform float uThresh;
out vec4 outColor;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy) * 2;
  vec3 s = texelFetch(uTex, c, 0).rgb + texelFetch(uTex, c+ivec2(1,0), 0).rgb
         + texelFetch(uTex, c+ivec2(0,1), 0).rgb + texelFetch(uTex, c+ivec2(1,1), 0).rgb;
  s *= 0.25;
  float l = max(max(s.r, s.g), s.b);
  float k = max(l - uThresh, 0.0) / max(l, 1e-4);
  outColor = vec4(s * k, 1.0);
}`;

/* ---- separable gaussian ---- */
const FS_BLUR = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform vec2 uDir;          // texel-sized direction
out vec4 outColor;
void main(){
  vec2 uv = gl_FragCoord.xy * (1.0 / vec2(textureSize(uTex, 0)));
  vec3 s = texture(uTex, uv).rgb * 0.2270270270;
  s += (texture(uTex, uv + uDir*1.3846153846).rgb + texture(uTex, uv - uDir*1.3846153846).rgb) * 0.3162162162;
  s += (texture(uTex, uv + uDir*3.2307692308).rgb + texture(uTex, uv - uDir*3.2307692308).rgb) * 0.0702702703;
  outColor = vec4(s, 1.0);
}`;

/* ---- downsample for the second bloom octave ---- */
const FS_DOWN = `#version 300 es
precision highp float;
uniform sampler2D uTex;
out vec4 outColor;
void main(){
  vec2 uv = (gl_FragCoord.xy) * (2.0 / vec2(textureSize(uTex, 0)));
  vec3 s = texture(uTex, uv).rgb;
  outColor = vec4(s, 1.0);
}`;

/* ---- final tonemap / composite ---- */
const FS_COMP = `#version 300 es
precision highp float;
uniform sampler2D uScene, uBloomA, uBloomB;
uniform float uExposure, uContrast, uBloom, uRaw, uVignette;
uniform vec2 uRes;
out vec4 outColor;

vec3 aces(vec3 x){
  const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
  return clamp((x*(a*x + b)) / (x*(c*x + d) + e), 0.0, 1.0);
}
void main(){
  vec3 c = texelFetch(uScene, ivec2(gl_FragCoord.xy), 0).rgb;
  if(uRaw > 0.5){                                  // diagnostic modes: show data verbatim
    outColor = vec4(clamp(c, 0.0, 1.0), 1.0);
    return;
  }
  vec2 uv = gl_FragCoord.xy / uRes;
  if(uBloom > 0.0){
    c += (texture(uBloomA, uv).rgb * 0.62 + texture(uBloomB, uv).rgb * 1.05) * uBloom;
  }
  c *= exp2(uExposure);
  c = aces(c);
  c = pow(c, vec3(1.0/2.2));
  c = clamp((c - 0.5) * uContrast + 0.5, 0.0, 1.0);
  vec2 q = uv - 0.5;
  c *= 1.0 - uVignette * dot(q, q) * 1.5;
  float d = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
  c += (d - 0.5) / 255.0;                          // dither out 8-bit banding
  outColor = vec4(c, 1.0);
}`;

/* ============================================================== 3. CPU MIRROR OF THE INTEGRATOR
   Same equations as FS_MAIN, used for: the selected-ray read-out and its path overlay,
   the numerically traced shadow boundary, and the sampled average step count. */

const G = {           // derived geometry, refreshed every frame
  M:1, rh:2, N:[0,1,0], DU:[1,0,0], DV:[0,0,1], escape:120, Hmax:1, diskStep:0.2
};

function updateDerived(){
  G.M = P.mass;
  const a = clamp(P.spin, 0, 0.998);
  G.rh = P.mass * (1 + Math.sqrt(Math.max(1 - a*a, 0))) * P.horizonScale;
  // disk frame: normal tilted from world up by diskTilt about the world X axis, then spun by diskAz
  const ct = Math.cos(P.diskTilt), st = Math.sin(P.diskTilt);
  const ca = Math.cos(P.diskAz),  sa = Math.sin(P.diskAz);
  const N  = V.norm([ st*sa, ct, st*ca ]);
  let ref = Math.abs(N[1]) > 0.95 ? [1,0,0] : [0,1,0];
  const DU = V.norm(V.cross(ref, N));
  const DV = V.cross(N, DU);
  G.N = N; G.DU = DU; G.DV = DV;
  G.Hmax = P.diskH * (0.6 + 0.4 * Math.sqrt(P.diskOut / Math.max(P.diskIn, 1e-3)));
  G.diskStep = clamp(P.stepSize*2.5, 0.15, 1.2);      // fraction of the local scale height
  G.escape = Math.max(CAM.dist, P.diskOut) * 2.2 + 25*P.mass;
}

function jsAccel(p, v, h2){
  const r2 = V.dot(p,p), r = Math.sqrt(r2);
  const k = -3*G.M*h2/(r2*r2*r);
  let a = [p[0]*k, p[1]*k, p[2]*k];
  if(P.spin > 0.001){
    const rh = V.mul(p, 1/r);
    const J  = V.mul(G.N, P.spin*G.M*G.M*P.spinDir);
    const B  = V.mul(V.sub(V.mul(rh, 3*V.dot(J, rh)), J), 2/(r2*r));
    a = V.add(a, V.mul(V.cross(v, B), -2));
  }
  return a;
}
function jsStepLen(p, v, h2, r){
  let dt = P.stepSize * r;
  dt = Math.min(dt, P.stepSize * (r*r*r*r) / (3*G.M*h2 + 1e-3));
  dt = Math.min(dt, Math.max(0.25*(r - G.rh), 0.006*G.M));
  const y = V.dot(p, G.N);
  const rc = V.len(V.sub(p, V.mul(G.N, y)));
  const H = P.diskH * (0.6 + 0.4 * Math.sqrt(Math.max(rc, P.diskIn) / Math.max(P.diskIn,1e-3)));
  const dv = Math.abs(y) - H*2.5;
  const dr = Math.max(P.diskIn - rc, rc - P.diskOut);
  const ndv = Math.abs(V.dot(v, G.N)) / Math.max(V.len(v), 1e-6);
  const sIn = Math.min(H * G.diskStep / Math.max(ndv, 0.05), 0.8 / Math.max(P.turbScale, 0.1));
  dt = Math.min(dt, Math.max(0.6*Math.max(dv, dr), sIn));
  return Math.max(dt, 0.004*G.M);
}
/* Returns full diagnostics for one ray. opts.path = record polyline. */
function traceJS(ro, rd, opts){
  opts = opts || {};
  const out = { steps:0, minR:1e9, defl:0, outcome:2, hits:[], path:null, endDir:rd.slice(),
                b:0, winding:0 };
  let p = ro.slice(), v = rd.slice();
  let L = V.cross(p,v), h2 = V.dot(L,L);
  out.b = Math.sqrt(h2) / Math.max(V.len(v), 1e-9);
  const gcam = Math.sqrt(Math.max(1 - 2*G.M/Math.max(V.len(ro),1e-3), 1e-4));
  const maxS = opts.maxSteps || P.maxSteps;
  if(opts.path) out.path = [p.slice()];
  const p0dir = V.norm(rd);
  let a = jsAccel(p, v, h2);
  for(let i=0;i<maxS;i++){
    const r = V.len(p);
    out.minR = Math.min(out.minR, r);
    const pv = V.dot(p,v);
    if(r < G.rh){ out.outcome = 1; break; }
    if(r < 3*G.M && pv < 0){ out.outcome = 1; break; }
    if(r > G.escape && pv > 0){ out.outcome = 0; break; }
    out.steps = i+1;
    const dt = jsStepLen(p, v, h2, r);
    const pPrev = p.slice(), vPrev = v.slice();
    // velocity Verlet with carried acceleration — identical scheme to the shader
    const pn = V.add(V.add(p, V.mul(v, dt)), V.mul(a, 0.5*dt*dt));
    const an = jsAccel(pn, V.add(v, V.mul(a, dt)), h2);
    v = V.add(v, V.mul(V.add(a, an), 0.5*dt));
    p = pn; a = an;
    if(P.spin > 0.001){ L = V.cross(p,v); h2 = V.dot(L,L); }
    out.defl += Math.acos(clamp(V.dot(V.norm(vPrev), V.norm(v)), -1, 1));
    const dphi = Math.acos(clamp(V.dot(V.norm(pPrev), V.norm(p)), -1, 1));
    out.winding += dphi;
    if(opts.path) out.path.push(p.slice());
    // disk crossing (mid-plane), recorded for the read-out
    const y0 = V.dot(pPrev, G.N), y1 = V.dot(p, G.N);
    if(y0 * y1 < 0 && out.hits.length < 6){
      const t = y0/(y0 - y1);
      const hp = V.mix(pPrev, p, t);
      const hy = V.dot(hp, G.N);
      const q  = V.sub(hp, V.mul(G.N, hy));
      const rr = V.len(q);
      if(rr >= P.diskIn && rr <= P.diskOut){
        const phi = Math.atan2(V.dot(q, G.DV), V.dot(q, G.DU));
        const rhat = V.mul(q, 1/rr);
        const vhat = V.mul(V.norm(V.cross(G.N, rhat)), P.spinDir);
        const beta = Math.min(Math.sqrt(G.M/Math.max(rr - 2*G.M, 0.15*G.M)), 0.995);
        const gam  = 1/Math.sqrt(1 - beta*beta);
        const nobs = V.mul(V.norm(V.mix(vPrev, v, t)), -1);
        const gd = 1/(gam*(1 - beta*V.dot(vhat, nobs)));
        const gg = Math.sqrt(Math.max(1 - 2*G.M/Math.max(V.len(hp),1e-3), 1e-4))/gcam;
        const x  = clamp(P.diskIn/rr, 0, 0.999999);
        const Tem = P.temp * 2.05 * Math.pow(x, 0.75) * Math.pow(Math.max(1-Math.sqrt(x),0), 0.25);
        out.hits.push({ r:rr, phi:phi, gd:gd, gg:gg, pos:hp, Tem:Tem, Tobs:Tem*gd*gg });
      }
    }
  }
  out.endDir = V.norm(v);
  out.totalBend = Math.acos(clamp(V.dot(p0dir, out.endDir), -1, 1));
  return out;
}

function fatal(kind, title, htmlBody, detail){
  document.getElementById('fatalKind').textContent = kind;
  document.getElementById('fatalTitle').textContent = title;
  document.getElementById('fatalBody').innerHTML = htmlBody +
      (detail ? '<pre id="fatalDetail">' + escapeHTML(detail) + '</pre>' : '');
  document.getElementById('fatal').classList.remove('hidden');
  document.getElementById('glcanvas').style.display = 'none';
  window.__bhFatal = { kind, title, detail: detail || '' };
}
function escapeHTML(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function compile(gl, type, src, name){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s) || '(no log)';
    const lines = src.split('\n');
    let ann = log.trim() + '\n\n--- shader source near the error ---\n';
    const m = /ERROR:\s*\d+:(\d+)/.exec(log);
    const centre = m ? parseInt(m[1],10) : 1;
    for(let i = Math.max(1, centre-4); i <= Math.min(lines.length, centre+4); i++){
      ann += String(i).padStart(4,' ') + (i===centre?' >':'  ') + ' ' + lines[i-1] + '\n';
    }
    throw new Error('Shader "' + name + '" failed to compile.\n' + ann);
  }
  return s;
}
function link(gl, vsSrc, fsSrc, name){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vsSrc, name+':vs'));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fsSrc, name+':fs'));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error('Program "' + name + '" failed to link.\n' + (gl.getProgramInfoLog(p)||''));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const inf = gl.getActiveUniform(p,i); u[inf.name] = gl.getUniformLocation(p, inf.name); }
  return { prog:p, u:u };
}
/* Planck-locus colour (Tanner Helland's fit to the blackbody chromaticity), converted to
   linear light and normalised to unit luminance so brightness comes only from the physics.
   Baked once into a 256x1 texture that the shader samples. */
function blackbodyLinear(K){
  const t = clamp(K, 1000, 40000) / 100;
  let r, g, b;
  r = (t <= 66) ? 255 : 329.698727446 * Math.pow(Math.max(t-60,1e-3), -0.1332047592);
  g = (t <= 66) ? (99.4708025861 * Math.log(t) - 161.1195681661)
                : 288.1221695283 * Math.pow(Math.max(t-60,1e-3), -0.0755148492);
  b = (t >= 66) ? 255 : ((t <= 19) ? 0 : 138.5177312231 * Math.log(Math.max(t-10,1e-3)) - 305.0447927307);
  let c = [r,g,b].map(v => Math.pow(clamp(v/255, 0, 1), 2.2));
  const l = 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
  return c.map(v => v / Math.max(l, 1e-4));
}
const BB_LUT_SCALE = 0.125;      // stored pre-scaled so an 8-bit fallback still has range
function makeBlackbodyLUT(gl){
  const N = 256, data = new Float32Array(N*4);
  const l0 = Math.log2(500), l1 = Math.log2(60000);
  for(let i=0;i<N;i++){
    const c = blackbodyLinear(Math.pow(2, lerp(l0, l1, i/(N-1))));
    data[i*4] = c[0]*BB_LUT_SCALE; data[i*4+1] = c[1]*BB_LUT_SCALE;
    data[i*4+2] = c[2]*BB_LUT_SCALE; data[i*4+3] = 1;
  }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if(R.fmt.hdr === gl.RGBA8){
    const b = new Uint8Array(N*4);
    for(let i=0;i<N*4;i++) b[i] = Math.round(clamp(data[i], 0, 1) * 255);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, N, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, b);
  } else {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, N, 1, 0, gl.RGBA, gl.FLOAT, data);
  }
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}
function makeTarget(gl, w, h, internal, type, filter){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, w, h, 0, gl.RGBA, type, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  if(st !== gl.FRAMEBUFFER_COMPLETE) return null;
  return { tex:t, fb:f, w:w, h:h };
}

function initGL(){

    if(!TEST_NO_WEBGL2){

        powerPreference:'high-performance', desynchronized:false
      });

  }catch(e){ gl = null; }

  if(!gl){
    fatal('WebGL2 unavailable', 'This explorer needs WebGL 2',
      '<p>The page asked your browser for a <b>WebGL 2</b> rendering context and did not get one. ' +
      'Every frame here is produced by integrating light rays on the GPU, so there is no meaningful ' +
      'fallback renderer — a flat picture of a black disc would not be the same thing.</p>' +
      '<p>Things that usually fix it:</p><ul>' +
      '<li>Enable hardware acceleration in your browser settings, then restart the browser.</li>' +
      '<li>Update your graphics driver, or update to a current Chrome, Edge, Firefox or Safari 15+.</li>' +
      '<li>Check <code>chrome://gpu</code> (or <code>about:support</code> in Firefox) for a blocklisted GPU.</li>' +
      '<li>Disable extensions that block canvas fingerprinting for this page.</li>' +
      '</ul><p>The controls stay disabled until a context is available.</p>',
      'navigator.userAgent: ' + navigator.userAgent + '\nwebgl2 context: null' +
      (TEST_NO_WEBGL2 ? '\n(forced by the ?nowebgl2 test flag)' : ''));
    return false;
  }

  R.gl = gl;
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  R.rendererName = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : (gl.getParameter(gl.RENDERER) || '');
  R.software = /swiftshader|llvmpipe|software|basic render|microsoft basic/i.test(R.rendererName);

  const cbf  = gl.getExtension('EXT_color_buffer_float');
  const cbhf = gl.getExtension('EXT_color_buffer_half_float');
  gl.getExtension('OES_texture_float_linear');
  if(cbf)       { R.fmt = { hdr:gl.RGBA16F, hdrType:gl.HALF_FLOAT, acc:gl.RGBA32F, accType:gl.FLOAT }; }
  else if(cbhf) { R.fmt = { hdr:gl.RGBA16F, hdrType:gl.HALF_FLOAT, acc:gl.RGBA16F, accType:gl.HALF_FLOAT }; R.halfOnly = true; }
  else          { R.fmt = { hdr:gl.RGBA8,  hdrType:gl.UNSIGNED_BYTE, acc:gl.RGBA8, accType:gl.UNSIGNED_BYTE }; R.halfOnly = true; }

  try{
    const mainSrc = TEST_BAD_SHADER
      ? FS_MAIN.replace('void main(){', 'void main(){ this_symbol_does_not_exist(uRes);')
      : FS_MAIN;
    R.progs.main   = link(gl, VS, mainSrc,   'geodesic');
    R.progs.accum  = link(gl, VS, FS_ACCUM,  'accumulate');
    R.progs.bright = link(gl, VS, FS_BRIGHT, 'bloom-bright');
    R.progs.blur   = link(gl, VS, FS_BLUR,   'bloom-blur');
    R.progs.down   = link(gl, VS, FS_DOWN,   'bloom-down');
    R.progs.comp   = link(gl, VS, FS_COMP,   'composite');
  }catch(err){
    fatal('Shader compilation failed', 'The renderer’s shaders did not build on this GPU',
      '<p>WebGL 2 is available, but one of the ray-integration shader programs failed to compile or ' +
      'link on this driver. The exact compiler message is below — it names the shader and the line.</p>' +
      '<p>This is almost always a driver or GPU-emulation limitation (very old mobile GPUs, ' +
      'remote-desktop software renderers, or a browser running with a restricted GL backend).</p>' +
      '<ul><li>Try a different browser or machine, or enable hardware acceleration.</li>' +
      '<li>If you are on a software renderer, reload and pick the <b>Low</b> quality preset.</li></ul>',
      String(err.message || err) + '\n\nRenderer: ' + R.rendererName);

  });
  cv.addEventListener('webglcontextrestored', ()=>{
    R.contextLost = false; toast('WebGL context restored. Rebuilding…', 2500);

function allocTargets(){
  const gl = R.gl;
  if(!gl) return;
  for(const k in R.fbo){
    const t = R.fbo[k];
    if(t){ gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fb); }
  }
  R.fbo = {};
  const W = R.W, H = R.H, hw = Math.max(1, W>>1), hh = Math.max(1, H>>1),
        qw = Math.max(1, W>>2), qh = Math.max(1, H>>2);
  const f = R.fmt;
  R.fbo.scene  = makeTarget(gl, W, H, f.hdr, f.hdrType, gl.NEAREST);
  R.fbo.accA   = makeTarget(gl, W, H, f.acc, f.accType, gl.NEAREST);
  R.fbo.accB   = makeTarget(gl, W, H, f.acc, f.accType, gl.NEAREST);
  R.fbo.bloom1 = makeTarget(gl, hw, hh, f.hdr, f.hdrType, gl.LINEAR);
  R.fbo.bloom2 = makeTarget(gl, hw, hh, f.hdr, f.hdrType, gl.LINEAR);
  R.fbo.bloom3 = makeTarget(gl, qw, qh, f.hdr, f.hdrType, gl.LINEAR);
  R.fbo.bloom4 = makeTarget(gl, qw, qh, f.hdr, f.hdrType, gl.LINEAR);
  for(const k in R.fbo){
    if(!R.fbo[k]){
      fatal('Framebuffer error', 'Could not allocate the render targets',
        '<p>The browser refused to create the floating-point render targets this renderer needs ' +
        '(<code>' + k + '</code>). This usually means the GPU is out of memory, or the ' +
        '<code>EXT_color_buffer_float</code> path is broken in this driver.</p>' +
        '<ul><li>Close other GPU-heavy tabs and reload.</li>' +
        '<li>Lower the render resolution before reloading (the app starts at the Low preset ' +
        'with <code>#quality=low</code>).</li></ul>',
        'Renderer: ' + R.rendererName + '\nRequested: ' + R.W + 'x' + R.H);
      R.ok = false; return;
    }
  }
  resetAccum();
}

function resetAccum(){ R.accumN = 0; }

/* ------------------------------------------------------------------ sizing */
let pendingResize = true;
function computeSize(){
  const cssW = Math.max(1, window.innerWidth);
  const cssH = Math.max(1, window.innerHeight);
  const dpr  = Math.min(window.devicePixelRatio || 1, 2);
  R.cssW = cssW; R.cssH = cssH; R.dpr = dpr;
  const s = clamp(P.renderScale * adaptiveScale, 0.12, 1.0);
  const W = Math.max(64, Math.round(cssW * dpr * s));
  const H = Math.max(64, Math.round(cssH * dpr * s));
  if(W !== R.W || H !== R.H || !R.fbo.scene){
    R.W = W; R.H = H;
    cv.width = W; cv.height = H;
    allocTargets();
  }
  ov.width  = Math.round(cssW * dpr);
  ov.height = Math.round(cssH * dpr);
  ov.style.width = cssW + 'px'; ov.style.height = cssH + 'px';
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ------------------------------------------------------------------ camera */
function camBasis(){
  const cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);
  const pos = V.add(CAM.target, [CAM.dist*cp*Math.sin(CAM.yaw), CAM.dist*sp, CAM.dist*cp*Math.cos(CAM.yaw)]);
  const fwd = V.norm(V.sub(CAM.target, pos));
  const wup = Math.abs(fwd[1]) > 0.999 ? [0,0,1] : [0,1,0];
  const right = V.norm(V.cross(fwd, wup));
  const up = V.cross(right, fwd);
  return { pos, fwd, right, up };
}
function rayForPixel(cssX, cssY){          // css pixels -> world ray direction
  const b = camBasis();
  const ndcX = (cssX / R.cssW) * 2 - 1;
  const ndcY = 1 - (cssY / R.cssH) * 2;
  const th = Math.tan(P.fov * DEG * 0.5);
  const asp = R.cssW / R.cssH;
  return V.norm(V.add(V.add(b.fwd, V.mul(b.right, ndcX*asp*th)), V.mul(b.up, ndcY*th)));
}
function worldToScreen(p){                 // world -> css pixels (null if behind)
  const b = camBasis();
  const d = V.sub(p, b.pos);
  const z = V.dot(d, b.fwd);
  if(z <= 1e-4) return null;
  const th = Math.tan(P.fov * DEG * 0.5);
  const asp = R.cssW / R.cssH;
  const x = V.dot(d, b.right) / (z * th * asp);
  const y = V.dot(d, b.up) / (z * th);
  return [ (x*0.5 + 0.5) * R.cssW, (0.5 - y*0.5) * R.cssH, z ];
}

/* ------------------------------------------------------------------ frame loop */
const HALTON = [];
(function(){
  const h=(i,b)=>{let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b);}return r;};
  for(let i=1;i<=64;i++) HALTON.push([h(i,2)-0.5, h(i,3)-0.5]);
})();

let adaptiveScale = 1.0;
let lastT = performance.now(), fpsAvg = 60, msAvg = 16, adaptCounter = 0;
let camDirty = true;

function markDirty(){ camDirty = true; }

function draw(target, prog, setup){
  const gl = R.gl;
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fb : null);
  gl.viewport(0, 0, target ? target.w : R.W, target ? target.h : R.H);
  gl.useProgram(prog.prog);
  if(setup) setup(gl, prog.u);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function bindTex(gl, loc, unit, tex){
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(loc, unit);
}

function renderFrame(dtMs){
  if(!R.ok || R.contextLost) return;
  const gl = R.gl;
  updateDerived();

  if(!P.paused) P.simTime += (dtMs/1000) * P.timeScale;
  if(P.autoOrbit && !P.paused){ CAM.yaw += P.orbitSpeed * (dtMs/1000); markDirty(); }

  const b = camBasis();
  const animating = (!P.paused && (P.timeScale > 0)) || P.autoOrbit;
  if(camDirty){ resetAccum(); camDirty = false; }
  const jit = (P.accumMode === 'off') ? [0,0] : HALTON[R.accumN % HALTON.length];

  // ---- pass 1: geodesic integration
  draw(R.fbo.scene, R.progs.main, (gl,u)=>{
    gl.uniform2f(u.uRes, R.W, R.H);
    gl.uniform2f(u.uJitter, jit[0], jit[1]);
    gl.uniform3fv(u.uCamPos, b.pos);
    gl.uniform3fv(u.uCamRight, b.right);
    gl.uniform3fv(u.uCamUp, b.up);
    gl.uniform3fv(u.uCamFwd, b.fwd);
    gl.uniform1f(u.uTanHalf, Math.tan(P.fov*DEG*0.5));
    gl.uniform1f(u.uAspect, R.W / R.H);
    gl.uniform1f(u.uMass, P.mass);
    gl.uniform1f(u.uRh, G.rh);
    gl.uniform1f(u.uSpin, P.spin);
    gl.uniform1f(u.uSpinDir, P.spinDir);
    gl.uniform1f(u.uEscape, G.escape);
    gl.uniform3fv(u.uN, G.N);
    gl.uniform3fv(u.uDU, G.DU);
    gl.uniform3fv(u.uDV, G.DV);
    gl.uniform1f(u.uDiskIn, P.diskIn);
    gl.uniform1f(u.uDiskOut, P.diskOut);
    gl.uniform1f(u.uDiskH, P.diskH);
    gl.uniform1f(u.uHmax, G.Hmax);
    gl.uniform1f(u.uDiskStep, G.diskStep);
    gl.uniform1f(u.uT0, P.temp);
    gl.uniform1f(u.uTurb, P.turb);
    gl.uniform1f(u.uTurbScale, P.turbScale);
    gl.uniform1f(u.uDop, P.doppler);
    gl.uniform1f(u.uRed, P.redshift);
    gl.uniform1f(u.uDiskGain, P.diskGain);
    gl.uniform1f(u.uDiskOpacity, P.diskOpacity);
    gl.uniform1f(u.uTime, P.simTime);
    gl.uniform1f(u.uStep, P.stepSize);
    gl.uniform1f(u.uSkyGain, P.skyGain);
    gl.uniform1i(u.uMaxSteps, P.maxSteps|0);
    gl.uniform1i(u.uMode, P.mode|0);
    gl.uniform1i(u.uRK4, P.rk4|0);
    gl.uniform1i(u.uOct, P.octaves|0);
    bindTex(gl, u.uBB, 3, R.bbTex);
  });

  // ---- pass 2: temporal accumulation
  const prev = R.cur ? R.fbo.accB : R.fbo.accA;
  const next = R.cur ? R.fbo.accA : R.fbo.accB;
  let alpha = 1.0;
  if(P.accumMode !== 'off'){
    const n = R.accumN;
    if(P.accumMode === 'progressive') alpha = animating ? Math.max(1/(n+1), 0.22) : 1/(n+1);
    else alpha = Math.max(1/(n+1), 0.34);
  }
  draw(next, R.progs.accum, (gl,u)=>{
    bindTex(gl, u.uScene, 0, R.fbo.scene.tex);
    bindTex(gl, u.uPrev, 1, prev.tex);
    gl.uniform1f(u.uAlpha, alpha);
  });
  R.cur ^= 1;
  R.accumN++;

  // ---- pass 3: bloom
  const bloomOn = P.bloom > 0.001 && P.mode === 0;
  if(bloomOn){
    draw(R.fbo.bloom1, R.progs.bright, (gl,u)=>{
      bindTex(gl, u.uTex, 0, next.tex);
      gl.uniform1f(u.uThresh, 0.85);
    });
    draw(R.fbo.bloom2, R.progs.blur, (gl,u)=>{
      bindTex(gl, u.uTex, 0, R.fbo.bloom1.tex);
      gl.uniform2f(u.uDir, 1/R.fbo.bloom1.w, 0);
    });
    draw(R.fbo.bloom1, R.progs.blur, (gl,u)=>{
      bindTex(gl, u.uTex, 0, R.fbo.bloom2.tex);
      gl.uniform2f(u.uDir, 0, 1/R.fbo.bloom1.h);
    });
    draw(R.fbo.bloom3, R.progs.down, (gl,u)=>{ bindTex(gl, u.uTex, 0, R.fbo.bloom1.tex); });
    draw(R.fbo.bloom4, R.progs.blur, (gl,u)=>{
      bindTex(gl, u.uTex, 0, R.fbo.bloom3.tex);
      gl.uniform2f(u.uDir, 1/R.fbo.bloom3.w, 0);
    });
    draw(R.fbo.bloom3, R.progs.blur, (gl,u)=>{
      bindTex(gl, u.uTex, 0, R.fbo.bloom4.tex);
      gl.uniform2f(u.uDir, 0, 1/R.fbo.bloom3.h);
    });
  }

  // ---- pass 4: composite to the canvas
  draw(null, R.progs.comp, (gl,u)=>{
    bindTex(gl, u.uScene, 0, next.tex);
    bindTex(gl, u.uBloomA, 1, (bloomOn?R.fbo.bloom1:R.fbo.scene).tex);
    bindTex(gl, u.uBloomB, 2, (bloomOn?R.fbo.bloom3:R.fbo.scene).tex);
    gl.uniform1f(u.uExposure, P.exposure);
    gl.uniform1f(u.uContrast, P.contrast);
    gl.uniform1f(u.uBloom, bloomOn ? P.bloom : 0.0);
    gl.uniform1f(u.uRaw, P.mode === 0 ? 0.0 : 1.0);
    gl.uniform1f(u.uVignette, P.mode === 0 ? 0.30 : 0.0);
    gl.uniform2f(u.uRes, R.W, R.H);
  });
  R.frame++;
}

/* ------------------------------------------------------------------ adaptive resolution */
function updateAdaptive(ms){
  if(!P.adaptive){ if(adaptiveScale !== 1){ adaptiveScale = 1; pendingResize = true; } return; }
  adaptCounter++;
  if(adaptCounter < 10) return;
  adaptCounter = 0;
  const target = 1000/30, ceiling = 1000/52;
  let s = adaptiveScale;
  if(msAvg > target * 2.5)      s = Math.max(0.22, s * 0.66);   // far off: converge fast
  else if(msAvg > target * 1.15) s = Math.max(0.22, s * 0.86);
  else if(msAvg < ceiling && s < 1) s = Math.min(1, s * 1.08);
  if(Math.abs(s - adaptiveScale) > 0.005){ adaptiveScale = s; pendingResize = true; }
}

/* ============================================================== 5. OVERLAYS (2D canvas) */

let selected = null;             // { x, y, trace }
let shadowCache = { key:'', pts:null };

function silhouettePolygon(Rsphere){
  // exact silhouette circle of a sphere of radius Rsphere as seen from the camera
  const b = camBasis();
  const d = V.len(b.pos);
  if(d <= Rsphere*1.001) return null;
  const c = V.mul(b.pos, (Rsphere*Rsphere)/(d*d));           // centre of the silhouette circle
  const rr = Rsphere * Math.sqrt(Math.max(1 - (Rsphere*Rsphere)/(d*d), 0));
  const n = V.norm(b.pos);
  let ref = Math.abs(n[1]) > 0.95 ? [1,0,0] : [0,1,0];
  const e1 = V.norm(V.cross(ref, n)), e2 = V.cross(n, e1);
  const pts = [];
  for(let i=0;i<=72;i++){
    const a = i/72*Math.PI*2;
    const p = V.add(c, V.add(V.mul(e1, rr*Math.cos(a)), V.mul(e2, rr*Math.sin(a))));
    pts.push(worldToScreen(p));
  }
  return pts;
}
function diskRingPolygon(radius){
  const pts = [];
  for(let i=0;i<=96;i++){
    const a = i/96*Math.PI*2;
    const p = V.add(V.mul(G.DU, radius*Math.cos(a)), V.mul(G.DV, radius*Math.sin(a)));
    pts.push(worldToScreen(p));
  }
  return pts;
}
function strokePoly(pts, style, width, dash){
  if(!pts) return;
  octx.save();
  octx.strokeStyle = style; octx.lineWidth = width;
  octx.setLineDash(dash || []);
  octx.beginPath();
  let started = false;
  for(const p of pts){
    if(!p){ started = false; continue; }
    if(!started){ octx.moveTo(p[0], p[1]); started = true; }
    else octx.lineTo(p[0], p[1]);
  }
  octx.stroke(); octx.restore();
}

/* Numerically traced capture boundary ("shadow edge"): bisect the angular offset
   from the black-hole direction between a captured ray and an escaping one. */
function computeShadow(){
  const b = camBasis();
  const toBH = V.norm(V.sub([0,0,0], b.pos));
  const key = [b.pos.map(x=>x.toFixed(2)).join(','), P.mass, P.spin, P.horizonScale, P.diskTilt, P.diskAz].join('|');
  if(shadowCache.key === key) return shadowCache.pts;
  let ref = Math.abs(toBH[1]) > 0.95 ? [1,0,0] : [0,1,0];
  const e1 = V.norm(V.cross(ref, toBH)), e2 = V.cross(toBH, e1);
  const nAz = P.spin > 0.02 ? 28 : 1;
  const dist = V.len(b.pos);
  const hiGuess = Math.min(Math.asin(clamp(6.5*P.mass/dist, 0, 0.999)) * 1.8, 1.2);
  const radii = [];
  for(let k=0;k<nAz;k++){
    const az = k/nAz*Math.PI*2;
    const axis = V.add(V.mul(e1, Math.cos(az)), V.mul(e2, Math.sin(az)));
    let lo = 0, hi = hiGuess;
    // ensure hi escapes
    for(let g=0; g<6; g++){
      const d = V.norm(V.add(V.mul(toBH, Math.cos(hi)), V.mul(axis, Math.sin(hi))));
      if(traceJS(b.pos, d, {maxSteps:200}).outcome === 0) break;
      hi = Math.min(hi*1.5, 1.5);
    }
    for(let it=0; it<15; it++){
      const mid = 0.5*(lo+hi);
      const d = V.norm(V.add(V.mul(toBH, Math.cos(mid)), V.mul(axis, Math.sin(mid))));
      if(traceJS(b.pos, d, {maxSteps:200}).outcome === 0) hi = mid; else lo = mid;
    }
    radii.push(0.5*(lo+hi));
  }
  const pts = [];
  const steps = 96;
  for(let i=0;i<=steps;i++){
    const az = i/steps*Math.PI*2;
    const idx = (az/(Math.PI*2))*nAz;
    const i0 = Math.floor(idx) % nAz, i1 = (i0+1)%nAz, f = idx - Math.floor(idx);
    const ang = nAz === 1 ? radii[0] : lerp(radii[i0], radii[i1], f);
    const axis = V.add(V.mul(e1, Math.cos(az)), V.mul(e2, Math.sin(az)));
    const d = V.norm(V.add(V.mul(toBH, Math.cos(ang)), V.mul(axis, Math.sin(ang))));
    pts.push(worldToScreen(V.add(b.pos, V.mul(d, Math.max(V.len(b.pos)*0.5, 5)))));
  }
  shadowCache = { key, pts };
  return pts;
}

function drawOverlay(){
  octx.clearRect(0, 0, R.cssW, R.cssH);
  if(!R.ok) return;
  const showAny = P.ovHorizon || P.ovPhoton || P.ovDisk || (P.ovRay && selected);
  if(!showAny) return;

  if(P.ovDisk){
    strokePoly(diskRingPolygon(P.diskIn),  'rgba(95,211,243,0.75)', 1.2, [5,4]);
    strokePoly(diskRingPolygon(P.diskOut), 'rgba(95,211,243,0.55)', 1.2, [5,4]);
    strokePoly(diskRingPolygon((P.diskIn+P.diskOut)*0.5), 'rgba(95,211,243,0.22)', 1, [2,6]);
    // radial spokes
    for(let i=0;i<8;i++){
      const a = i/8*Math.PI*2;
      const p0 = V.add(V.mul(G.DU, P.diskIn*Math.cos(a)), V.mul(G.DV, P.diskIn*Math.sin(a)));
      const p1 = V.add(V.mul(G.DU, P.diskOut*Math.cos(a)), V.mul(G.DV, P.diskOut*Math.sin(a)));
      strokePoly([worldToScreen(p0), worldToScreen(p1)], 'rgba(95,211,243,0.16)', 1);
    }
  }
  if(P.ovPhoton){
    strokePoly(silhouettePolygon(3*P.mass), 'rgba(255,180,84,0.55)', 1.2, [4,4]);
    strokePoly(computeShadow(), 'rgba(255,224,150,0.95)', 1.6);
  }
  if(P.ovHorizon){
    strokePoly(silhouettePolygon(G.rh), 'rgba(255,90,90,0.85)', 1.4, [3,3]);
  }
  if(P.ovRay && selected && selected.trace && selected.trace.path){
    const path = selected.trace.path;
    octx.save();
    octx.lineWidth = 1.7; octx.strokeStyle = 'rgba(120,255,190,0.9)';
    octx.shadowColor = 'rgba(120,255,190,0.5)'; octx.shadowBlur = 6;
    octx.beginPath();
    let started = false;
    for(const wp of path){
      const s = worldToScreen(wp);
      if(!s){ started = false; continue; }
      if(!started){ octx.moveTo(s[0], s[1]); started = true; } else octx.lineTo(s[0], s[1]);
    }
    octx.stroke(); octx.restore();
    for(const h of selected.trace.hits){
      const s = worldToScreen(h.pos);
      if(!s) continue;
      octx.save();
      octx.fillStyle = 'rgba(255,180,84,0.95)';
      octx.beginPath(); octx.arc(s[0], s[1], 3.2, 0, 6.2832); octx.fill();
      octx.restore();
    }
    // crosshair at the picked pixel
    octx.save();
    octx.strokeStyle = 'rgba(255,255,255,0.85)'; octx.lineWidth = 1;
    octx.beginPath();
    octx.moveTo(selected.x-9, selected.y); octx.lineTo(selected.x-3, selected.y);
    octx.moveTo(selected.x+3, selected.y); octx.lineTo(selected.x+9, selected.y);
    octx.moveTo(selected.x, selected.y-9); octx.lineTo(selected.x, selected.y-3);
    octx.moveTo(selected.x, selected.y+3); octx.lineTo(selected.x, selected.y+9);
    octx.stroke();
    octx.restore();
  }
  // legend for the overlay curves
  if(P.ovHorizon || P.ovPhoton || P.ovDisk){
    const items = [];
    if(P.ovHorizon) items.push(['rgba(255,90,90,0.9)', 'event horizon r_h (geometric)']);
    if(P.ovPhoton)  items.push(['rgba(255,180,84,0.7)', 'photon sphere 3M (geometric)'],
                               ['rgba(255,224,150,0.95)', 'shadow edge (lensed, traced)']);
    if(P.ovDisk)    items.push(['rgba(95,211,243,0.8)', 'disk plane r_in / r_out (geometric)']);
    octx.save();
    octx.font = '10px ui-monospace,monospace';
    const pad = 6, lh = 13;
    const w = 218, h = items.length*lh + pad*2;
    const x = 12, y = R.cssH - h - 12;
    octx.fillStyle = 'rgba(10,13,20,0.72)';
    octx.strokeStyle = 'rgba(255,255,255,0.10)';
    octx.beginPath(); octx.rect(x, y, w, h); octx.fill(); octx.stroke();
    items.forEach((it, i)=>{
      octx.fillStyle = it[0];
      octx.fillRect(x+pad, y+pad+i*lh+4, 12, 2);
      octx.fillStyle = 'rgba(200,210,225,0.9)';
      octx.fillText(it[1], x+pad+18, y+pad+i*lh+8);
    });
    octx.restore();
  }
}

/* ------------------------------------------------------------------ ray diagram */
const rayCanvas = document.getElementById('raydiagram');
const rctx = rayCanvas.getContext('2d');
function drawRayDiagram(T){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const w = rayCanvas.clientWidth || 250, h = rayCanvas.clientHeight || 150;
  rayCanvas.width = Math.round(w*dpr); rayCanvas.height = Math.round(h*dpr);
  rctx.setTransform(dpr,0,0,dpr,0,0);
  rctx.clearRect(0,0,w,h);
  if(!T || !T.path || T.path.length < 2) return;
  // Project into the ray's own orbital plane, then plot radius on a sqrt scale so the
  // near-horizon structure and the far approach are both legible in one small panel.
  const o = T.path[0];
  const e1 = V.norm(o);
  let d0 = V.sub(T.path[1], o);
  let e2 = V.sub(d0, V.mul(e1, V.dot(d0, e1)));
  if(V.len(e2) < 1e-6) e2 = V.norm(V.cross(e1, [0,1,0]));
  e2 = V.norm(e2);
  const raw = T.path.map(p => [V.dot(p,e1), V.dot(p,e2)]);
  let maxR = Math.max(6*P.mass, P.diskOut*0.6);
  for(const q of raw) maxR = Math.max(maxR, Math.hypot(q[0], q[1]));
  maxR = Math.min(maxR, Math.max(CAM.dist*1.05, 14*P.mass));
  const S = Math.sqrt(maxR);
  const sc = Math.min(w, h) * 0.44 / S;
  const cx = w*0.5, cy = h*0.5;
  const warp = q => {                                   // sqrt radial warp
    const r = Math.hypot(q[0], q[1]);
    if(r < 1e-6) return [cx, cy];
    const k = Math.sqrt(r)/r*sc;
    return [cx + q[0]*k, cy - q[1]*k];
  };
  const ringPx = r => Math.sqrt(Math.min(r, maxR))*sc;

  // labelled radial rings
  rctx.font = '8px ui-monospace,monospace';
  for(const r of [10, 20, 40]){
    if(r > maxR) continue;
    rctx.strokeStyle = 'rgba(255,255,255,0.07)'; rctx.lineWidth = 1;
    rctx.beginPath(); rctx.arc(cx, cy, ringPx(r), 0, 6.2832); rctx.stroke();
    rctx.fillStyle = 'rgba(140,155,175,0.75)';
    rctx.fillText(r + ' r_g', cx + ringPx(r) - 22, cy - 2);
  }
  // disk radial extent (indicative projection onto this plane)
  rctx.strokeStyle = 'rgba(95,211,243,0.4)'; rctx.lineWidth = 3;
  for(const sgn of [-1, 1]){
    rctx.beginPath();
    rctx.moveTo(cx + sgn*ringPx(P.diskIn), cy); rctx.lineTo(cx + sgn*ringPx(P.diskOut), cy);
    rctx.stroke();
  }
  // photon sphere + horizon
  rctx.setLineDash([3,3]); rctx.strokeStyle = 'rgba(255,180,84,0.7)'; rctx.lineWidth = 1;
  rctx.beginPath(); rctx.arc(cx, cy, ringPx(3*P.mass), 0, 6.2832); rctx.stroke();
  rctx.setLineDash([]);
  rctx.fillStyle = '#000'; rctx.strokeStyle = 'rgba(255,90,90,0.9)';
  rctx.beginPath(); rctx.arc(cx, cy, ringPx(G.rh), 0, 6.2832); rctx.fill(); rctx.stroke();
  // the ray
  rctx.lineWidth = 1.7; rctx.strokeStyle = '#78ffbe';
  rctx.beginPath();
  raw.forEach((q,i)=>{ const s2 = warp(q); i ? rctx.lineTo(s2[0], s2[1]) : rctx.moveTo(s2[0], s2[1]); });
  rctx.stroke();
  // camera marker, direction arrow and disk hits
  const c0 = warp(raw[0]);
  rctx.fillStyle = '#fff';
  rctx.beginPath(); rctx.arc(c0[0], c0[1], 2.6, 0, 6.2832); rctx.fill();
  rctx.fillStyle = 'rgba(255,180,84,0.95)';
  for(const hit of T.hits){
    const q = warp([V.dot(hit.pos,e1), V.dot(hit.pos,e2)]);
    rctx.beginPath(); rctx.arc(q[0], q[1], 3, 0, 6.2832); rctx.fill();
  }
  rctx.font = '9px ui-monospace,monospace';
  rctx.fillStyle = 'rgba(160,175,195,0.75)';
  rctx.fillText('orbital plane · \u221Ar scale', 6, 11);
  rctx.fillStyle = 'rgba(200,210,225,0.85)';
  rctx.fillText('camera', Math.min(Math.max(c0[0]+6, 2), w-46), c0[1]-5);
  const label = T.outcome===1?'captured':(T.outcome===0?'escaped':'budget exhausted');
  rctx.fillStyle = T.outcome===1?'#ff8080':(T.outcome===0?'#7fb6ff':'#ff6ee0');
  rctx.fillText(label, w-6-rctx.measureText(label).width, 11);
}

   { id:'adaptive', t:'check', label:'Adaptive resolution (target 30 fps)' },
   { id:'maxSteps', t:'range', label:'Max integration steps', min:32, max:768, step:1, fmt:v=>String(Math.round(v)) },

   '<code>x″ = −3M h² x /|x|⁵</code> with <code>h = |x × x′|</code> conserved — a coherent ray integration, ' +

   'with <code>g = δ_Doppler · √(1−2M/r)/√(1−2M/r_cam)</code>. Turbulence is frozen into the Keplerian fluid frame, ' +
