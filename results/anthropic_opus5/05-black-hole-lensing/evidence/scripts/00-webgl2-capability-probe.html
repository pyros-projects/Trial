<!doctype html><html><head><meta charset="utf-8"><title>WebGL2 probe</title></head><body style="background:#111;color:#eee;font-family:monospace">
<canvas id="c" width="64" height="64"></canvas><pre id="out">running</pre>
<script>
const c=document.getElementById('c');
const gl=c.getContext('webgl2',{antialias:false});
const res={webgl2:!!gl};
if(gl){
  const dbg=gl.getExtension('WEBGL_debug_renderer_info');
  res.vendor=dbg?gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL):gl.getParameter(gl.VENDOR);
  res.renderer=dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER);
  res.version=gl.getParameter(gl.VERSION);
  res.glsl=gl.getParameter(gl.SHADING_LANGUAGE_VERSION);
  res.maxTex=gl.getParameter(gl.MAX_TEXTURE_SIZE);
  res.cbf=!!gl.getExtension('EXT_color_buffer_float');
  res.cbhf=!!gl.getExtension('EXT_color_buffer_half_float');
  res.tfl=!!gl.getExtension('OES_texture_float_linear');
  // tiny render benchmark: heavy loop shader
  const vs=`#version 300 es
  void main(){vec2 p=vec2((gl_VertexID<<1)&2,gl_VertexID&2);gl_Position=vec4(p*2.0-1.0,0,1);} `;
  const fs=`#version 300 es
  precision highp float; out vec4 o; uniform float u;
  void main(){float a=0.0;vec3 p=vec3(gl_FragCoord.xy*0.01,u);
  for(int i=0;i<200;i++){p+=vec3(sin(p.y),cos(p.z),sin(p.x))*0.01;a+=length(p)*0.0001;}
  o=vec4(fract(a),0.2,0.4,1.0);}`;
  function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x;}
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
  res.link=gl.getProgramParameter(pr,gl.LINK_STATUS)||gl.getProgramInfoLog(pr);
  gl.useProgram(pr);const va=gl.createVertexArray();gl.bindVertexArray(va);
  c.width=512;c.height=512;gl.viewport(0,0,512,512);
  const t0=performance.now();let n=0;
  for(;n<20;n++){gl.uniform1f(gl.getUniformLocation(pr,'u'),n);gl.drawArrays(gl.TRIANGLES,0,3);}
  gl.finish();
  const px=new Uint8Array(4);gl.readPixels(10,10,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  res.pixel=Array.from(px);
  res.msPerFrame512=(performance.now()-t0)/n;
}
document.getElementById('out').textContent=JSON.stringify(res,null,1);
window.__probe=res;
</script></body></html>
