<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FLUXWORKS — Factory Automation &amp; Logistics</title>
<style>
:root{
  --bg:#0b0f14; --bg2:#0e141b; --panel:#131b24; --panel2:#18222d; --panel3:#1e2a37;
  --line:#26333f; --line2:#33455a;
  --txt:#c9d8e6; --txt2:#8fa3b8; --txt3:#61758a;
  --acc:#ffb347; --acc2:#56d3f0; --ok:#5fd68a; --warn:#ffcc55; --bad:#ff6b6b; --pow:#ffd75e;
  --shadow:0 6px 24px rgba(0,0,0,.5);
  --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--txt);font-family:var(--ui);font-size:13px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0a0e13}
::-webkit-scrollbar-thumb{background:#2c3b4b;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#3d5064}

#app{display:grid;height:100%;width:100%;
  grid-template-columns:188px 1fr 316px;
  grid-template-rows:44px 1fr 30px;
  grid-template-areas:"top top top" "pal stage side" "bot bot bot";
  gap:0}

/* ---------- TOP BAR ---------- */
#topbar{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 8px;min-width:0;background:linear-gradient(180deg,#16202b,#101820);border-bottom:1px solid var(--line);z-index:30}
.brand{display:flex;flex:none;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;font-size:13px;color:var(--acc);white-space:nowrap}
.brand small{font-weight:600;letter-spacing:.06em;color:var(--txt3);font-size:9px}
.brand canvas{display:block;image-rendering:pixelated}
.modeSwitch{display:flex;flex:none;background:#0b1117;border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.modeSwitch button{background:transparent;border:0;color:var(--txt2);padding:4px 10px;border-radius:5px;cursor:pointer;font-weight:600;font-size:11px;letter-spacing:.04em}
.modeSwitch button.on{background:var(--panel3);color:var(--acc);box-shadow:inset 0 0 0 1px var(--line2)}
.spacer{flex:1}
.objective{display:flex;align-items:center;gap:8px;background:#0b1117;border:1px solid var(--line);border-radius:7px;padding:4px 10px;min-width:0;flex:0 1 auto;overflow:hidden}
.objective .lbl{font-size:9px;letter-spacing:.12em;color:var(--txt3);text-transform:uppercase}
.objective .val{font-size:12px;font-weight:700;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{width:110px;height:7px;background:#0a1016;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#3fa9ff,#56d3f0);width:0%}
.tbtn{background:var(--panel2);border:1px solid var(--line);color:var(--txt2);padding:5px 9px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap;transition:.12s}
.tbtn:hover{background:var(--panel3);color:var(--txt);border-color:var(--line2)}
.tbtn.on{background:#243545;color:var(--acc2);border-color:#38566e}
.tbtn.pri{background:#2a4a2f;border-color:#3d6b45;color:#b8f0c4}

/* ---------- PALETTE ---------- */
#palette{grid-area:pal;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden;padding:6px;min-width:0;min-height:0}
.grp{margin-bottom:5px}
.grpTitle{font-size:8.5px;letter-spacing:.16em;color:var(--txt3);text-transform:uppercase;padding:3px 4px 3px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;justify-content:space-between}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.pitem{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 2px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.1s;user-select:none}
.pitem:hover{background:var(--panel3);border-color:var(--line2);transform:translateY(-1px)}
.pitem.on{border-color:var(--acc);background:#2a2417;box-shadow:0 0 0 1px var(--acc) inset}
.pitem canvas{display:block}
.pitem .nm{font-size:9px;color:var(--txt2);text-align:center;line-height:1.1;font-weight:600}
.pitem .cst{font-size:8px;color:var(--txt3);font-family:var(--mono);line-height:1.1}
.pitem .key{position:absolute;top:2px;right:3px;font-size:8px;color:var(--txt3);font-family:var(--mono);opacity:.75}
.pitem.on .nm{color:var(--acc)}
.toolRow{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.toolRow .pitem .nm{font-size:8.5px}

/* ---------- STAGE ---------- */
#stage{grid-area:stage;position:relative;overflow:hidden;background:#0a0e13;touch-action:none;min-width:0;min-height:0}
#gl{display:block;position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
#hud{position:absolute;left:8px;top:8px;background:rgba(9,14,19,.82);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:var(--mono);font-size:10px;line-height:1.42;color:var(--txt2);pointer-events:auto;cursor:pointer;backdrop-filter:blur(6px);min-width:168px;z-index:6;user-select:none}
#hud b{color:var(--txt);font-weight:700}
#hud .hr{height:1px;background:var(--line);margin:4px -4px}
#hud .k{display:inline-block;min-width:68px;color:var(--txt3)}
.good{color:var(--ok)} .warnc{color:var(--warn)} .badc{color:var(--bad)} .accc{color:var(--acc)} .acc2c{color:var(--acc2)} .powc{color:var(--pow)}
#tooltip{position:absolute;pointer-events:none;background:rgba(10,15,21,.96);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;font-size:11px;line-height:1.45;color:var(--txt);box-shadow:var(--shadow);z-index:20;max-width:250px;display:none}
#tooltip .tt{font-weight:700;color:var(--acc);margin-bottom:2px;font-size:11.5px}
#tooltip .r{color:var(--txt2);font-size:10.5px;font-family:var(--mono)}
#overlayBar{position:absolute;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:min(56%,430px);justify-content:flex-end;z-index:6}
.ovb{background:rgba(11,17,23,.9);border:1px solid var(--line);color:var(--txt3);border-radius:6px;padding:3px 7px;font-size:10px;cursor:pointer;font-weight:600;backdrop-filter:blur(6px)}
.ovb:hover{color:var(--txt);border-color:var(--line2)}
.ovb.on{background:#1c3242;color:var(--acc2);border-color:#3a6076}
#toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:50px;display:flex;flex-direction:column;gap:5px;align-items:center;z-index:25;pointer-events:none}
.toast{background:rgba(13,20,27,.95);border:1px solid var(--line2);border-left:3px solid var(--acc);padding:6px 13px;border-radius:6px;font-size:11.5px;color:var(--txt);box-shadow:var(--shadow);animation:tin .2s ease}
.toast.err{border-left-color:var(--bad);color:#ffd0d0}
.toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#speedDock{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;display:flex;align-items:center;gap:4px;background:rgba(11,17,23,.9);border:1px solid var(--line);border-radius:8px;padding:4px 6px;backdrop-filter:blur(6px);z-index:6}
#speedDock button{background:var(--panel2);border:1px solid var(--line);color:var(--txt2);border-radius:5px;width:28px;height:24px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0}
#speedDock button:hover{background:var(--panel3);color:var(--txt)}
#speedDock button.on{background:#243545;color:var(--acc2);border-color:#38566e}
#speedDock .sv{font-family:var(--mono);font-size:11px;color:var(--acc);min-width:38px;text-align:center;font-weight:700}

/* ---------- SIDE PANEL ---------- */
#side{grid-area:side;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--bg2);flex:none}
.tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--txt3);padding:8px 2px;cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.04em}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);background:var(--panel2)}
.tabs button:hover{color:var(--txt2)}
.tabBody{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;min-height:0}
.tabBody[hidden]{display:none}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}
.card h4{margin:0 0 6px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt3);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2.5px 0;font-size:11px}
.row .l{color:var(--txt3)}
.row .v{font-family:var(--mono);color:var(--txt);font-weight:600}
.field{margin-bottom:7px}
.field label{display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);margin-bottom:3px;letter-spacing:.04em}
.field label b{color:var(--acc);font-family:var(--mono);font-weight:700}
input[type=range]{width:100%;height:18px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#0a1016;border:1px solid var(--line);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--acc);margin-top:-5.5px;border:1px solid #7a5518;cursor:pointer}
input[type=range]::-moz-range-track{height:4px;background:#0a1016;border:1px solid var(--line);border-radius:3px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--acc);border:1px solid #7a5518;cursor:pointer}
select,input[type=text],input[type=number]{width:100%;background:#0a1016;border:1px solid var(--line);border-radius:6px;padding:5px 7px;color:var(--txt);font-size:11px}
select:focus,input:focus{outline:none;border-color:var(--line2)}
.btnRow{display:flex;gap:5px;flex-wrap:wrap}
.btnRow .tbtn{flex:1;text-align:center;min-width:60px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{background:#0d151d;border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:10px;color:var(--txt2);cursor:pointer}
.chip:hover{border-color:var(--line2);color:var(--txt)}
.chip.on{background:#243545;color:var(--acc2);border-color:#38566e}
.spark{display:block;width:100%;height:34px;background:#080d12;border:1px solid var(--line);border-radius:5px}
.statLine{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11px;border-bottom:1px solid #1b242e}
.statLine:last-child{border-bottom:0}
.swatch{width:9px;height:9px;border-radius:2px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.statLine .nm{flex:1;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statLine .n{font-family:var(--mono);font-weight:700;font-size:10.5px}
.bar{height:5px;background:#0a1016;border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--acc2);transition:width .18s}
.help{font-size:10px;color:var(--txt3);line-height:1.5}
.kbd{display:inline-block;background:#0b1117;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-family:var(--mono);font-size:9.5px;color:var(--txt2)}
.warnBox{background:#2a1a12;border:1px solid #5c3520;color:#ffc9a3;border-radius:6px;padding:6px 8px;font-size:10.5px;margin-bottom:7px}
.okBox{background:#132a1c;border:1px solid #2c5c3c;color:#a9edc2;border-radius:6px;padding:6px 8px;font-size:10.5px;margin-bottom:7px}
.miniTbl{width:100%;border-collapse:collapse;font-size:10.5px}
.miniTbl td{padding:2px 3px;border-bottom:1px solid #1b242e}
.miniTbl td:last-child{text-align:right;font-family:var(--mono);color:var(--txt)}
.miniTbl td:first-child{color:var(--txt3)}

/* ---------- BOTTOM ---------- */
#bottom{grid-area:bot;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--bg2);border-top:1px solid var(--line);font-size:10.5px;color:var(--txt3);overflow:hidden;white-space:nowrap}
#bottom b{color:var(--txt2)}
#statusMsg{color:var(--acc2);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis}

/* ---------- MODAL ---------- */
#modalWrap{position:fixed;inset:0;background:rgba(4,7,10,.78);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(3px)}
#modalWrap.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);padding:16px}
.modal h2{margin:0 0 4px;font-size:17px;color:var(--acc);letter-spacing:.04em}
.modal p{color:var(--txt2);font-size:12px;line-height:1.6;margin:6px 0}
.modal .close{float:right;background:transparent;border:0;color:var(--txt3);font-size:19px;cursor:pointer;line-height:1;padding:0 4px}
textarea{width:100%;min-height:110px;background:#0a1016;border:1px solid var(--line);border-radius:6px;color:var(--txt);font-family:var(--mono);font-size:10.5px;padding:7px;resize:vertical}
.scoreGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}
.scoreCell{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}
.scoreCell .lbl{font-size:9px;letter-spacing:.12em;color:var(--txt3);text-transform:uppercase}
.scoreCell .num{font-size:19px;font-weight:800;color:var(--acc2);font-family:var(--mono)}

/* ---------- MOBILE ---------- */
#mobBar{display:none;grid-area:mob}
@media (max-width:900px){
  #app{grid-template-columns:1fr;grid-template-rows:42px 1fr 42px 26px;
    grid-template-areas:"top" "stage" "mob" "bot"}
  #palette{position:absolute;left:0;top:42px;bottom:68px;width:170px;z-index:40;box-shadow:var(--shadow);display:none}
  #palette.open{display:block}
  #side{position:absolute;right:0;top:42px;bottom:68px;width:min(330px,92vw);z-index:40;box-shadow:var(--shadow);display:none}
  #side.open{display:flex}
  #mobBar{display:flex;align-items:center;gap:5px;padding:0 6px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
  #mobBar .tbtn{flex:none;padding:6px 9px}
  .brand small{display:none}
  #overlayBar{max-width:70%}
  #hud{font-size:9px;min-width:0;padding:4px 6px;max-width:56vw}
  #hud .k{min-width:58px}
  .objective{padding:3px 6px}
  .objective .val{max-width:34vw}
  .pbar{width:44px}
  #overlayBar{max-width:64vw;top:6px;right:6px}
  .ovb{padding:2px 5px;font-size:9px}
}
@media (max-width:520px){
  .brand span.long{display:none}
  #toasts{bottom:46px}
  .objective{display:none}
  .modeSwitch button{padding:4px 6px;font-size:10px}
  #bottomHints{display:none}
}
.hide{display:none !important}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="brand"><canvas id="logo" width="22" height="22"></canvas><span class="long">FLUXWORKS</span></div>
    <div class="modeSwitch" id="modeSwitch">
      <button data-mode="campaign" class="on">CAMPAIGN</button>
      <button data-mode="sandbox">SANDBOX</button>
    </div>
    <div class="objective" id="objBox">
      <div style="min-width:0">
        <div class="lbl">Contract</div>
        <div class="val" id="objText">—</div>
      </div>
      <div class="pbar"><i id="objBar"></i></div>
      <div class="val" id="objPct" style="font-family:var(--mono);min-width:38px;text-align:right">0%</div>
    </div>
    <div class="spacer"></div>
    <button class="tbtn" id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
    <button class="tbtn" id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
    <button class="tbtn" id="btnPresets">Presets</button>
    <button class="tbtn" id="btnHelp" title="Help (H)">?</button>
    <button class="tbtn" id="btnPal" style="display:none">☰</button>
    <button class="tbtn" id="btnSide" style="display:none">▤</button>
  </div>

  <div id="palette"></div>

  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="hud"></div>
    <div id="overlayBar"></div>
    <div id="speedDock">
      <button id="spPause" title="Pause/Resume (Space)">❚❚</button>
      <button id="spStep" title="Single step (.)">⏭</button>
      <button id="spDown" title="Slower ([)">－</button>
      <div class="sv" id="spVal">1.0×</div>
      <button id="spUp" title="Faster (])">＋</button>
    </div>
    <div id="tooltip"></div>
    <div id="toasts"></div>
  </div>

  <div id="side">
    <div class="tabs" id="sideTabs">
      <button data-tab="inspect" class="on">INSPECT</button>
      <button data-tab="stats">ANALYTICS</button>
      <button data-tab="sim">SIM</button>
      <button data-tab="data">SAVE</button>
    </div>
    <div class="tabBody" id="tab-inspect"></div>
    <div class="tabBody" id="tab-stats" hidden></div>
    <div class="tabBody" id="tab-sim" hidden></div>
    <div class="tabBody" id="tab-data" hidden></div>
  </div>

  <div id="mobBar"></div>

  <div id="bottom">
    <span id="statusMsg">Ready.</span>
    <span class="spacer" style="flex:1"></span>
    <span id="bottomHints"></span>
  </div>
</div>

<div id="modalWrap"><div class="modal" id="modal"></div></div>
<script>
"use strict";
/* =========================================================================
   FLUXWORKS — Factory Automation & Logistics
   Single-file simulation game. No dependencies, no network, no build step.
   ========================================================================= */

/* ---------------------------------- utils ------------------------------- */
const $ = id => document.getElementById(id);
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b-a)*t;
const fmt = (v,d=1) => (!isFinite(v)?'—':Math.abs(v)>=10000?(v/1000).toFixed(1)+'k':v.toFixed(d));
const fmtInt = v => (!isFinite(v)?'—':Math.abs(v)>=1e6?(v/1e6).toFixed(2)+'M':Math.abs(v)>=10000?(v/1000).toFixed(1)+'k':Math.round(v).toString());
const fmtPow = kw => Math.abs(kw)>=1000 ? (kw/1000).toFixed(2)+' MW' : Math.round(kw)+' kW';
const fmtTime = s => { s=Math.max(0,Math.floor(s)); const m=Math.floor(s/60); return (m<10?'0':'')+m+':'+((s%60)<10?'0':'')+(s%60); };

function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261>>>0; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

// value-noise for deposit fields
function makeNoise(seed){
  const rnd = mulberry32(seed);
  const P = new Float32Array(256*256);
  for (let i=0;i<P.length;i++) P[i] = rnd();
  const at = (x,y) => P[((y&255)<<8) | (x&255)];
  return function(x,y){
    const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
    const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
    return lerp(lerp(at(xi,yi),at(xi+1,yi),u), lerp(at(xi,yi+1),at(xi+1,yi+1),u), v);
  };
}

/* ------------------------------ direction ------------------------------- */
// 0=North(up) 1=East(right) 2=South(down) 3=West(left)
const DX=[0,1,0,-1], DY=[-1,0,1,0];
const DIRNAME=['North','East','South','West'];
const opp = d => (d+2)&3;

/* -------------------------------- items --------------------------------- */
const ITEMS = {
  ironOre:    {name:'Iron Ore',      c:'#98a6b6', c2:'#6d7d8e', sh:'chunk', tier:0},
  copperOre:  {name:'Copper Ore',    c:'#d5834f', c2:'#a05e33', sh:'chunk', tier:0},
  coal:       {name:'Coal',          c:'#454b54', c2:'#23282e', sh:'chunk', tier:0},
  stone:      {name:'Stone',         c:'#8f867a', c2:'#6a6259', sh:'chunk', tier:0},
  ironIngot:  {name:'Iron Ingot',    c:'#ccd7e2', c2:'#94a3b1', sh:'ingot', tier:1},
  copperIngot:{name:'Copper Ingot',  c:'#eda86f', c2:'#b57b46', sh:'ingot', tier:1},
  brick:      {name:'Stone Brick',   c:'#bfae90', c2:'#8f8069', sh:'ingot', tier:1},

function idx(x,y){ return y*S.W + x; }
function inBounds(x,y){ return x>=0 && y>=0 && x<S.W && y<S.H; }
function cellAt(x,y){ return inBounds(x,y) ? S.cells[idx(x,y)] : 0; }
function entAt(x,y){ const id = cellAt(x,y); return id ? S.ents.get(id) : null; }

/* -------------------------- entity construction ------------------------- */
function sizeOf(type, dir){
  const b = B[type];
  return (dir & 1) ? {w:b.h, h:b.w} : {w:b.w, h:b.h};
}
function footprint(e){ return sizeOf(e.type, e.dir); }
function covers(e, fn){
  const s = footprint(e);
  for (let j=0;j<s.h;j++) for (let i=0;i<s.w;i++) fn(e.x+i, e.y+j);
}
function entCenter(e){ const s=footprint(e); return {x:e.x+s.w/2, y:e.y+s.h/2}; }

/** The single tile through which a producer pushes items, plus the tile it pushes into. */
function outPort(e){
  const s = footprint(e), d = e.dir;
  let px, py;
  if (d===0){ px = e.x + ((s.w-1)>>1); py = e.y; }
  else if (d===1){ px = e.x + s.w-1;   py = e.y + ((s.h-1)>>1); }
  else if (d===2){ px = e.x + ((s.w-1)>>1); py = e.y + s.h-1; }
  else { px = e.x; py = e.y + ((s.h-1)>>1); }
  return {x:px, y:py, tx:px+DX[d], ty:py+DY[d]};
}

function defaultRecipe(type){
  if (type==='smelter') return 'smeltIron';
  if (type==='constructor') return 'mkPlate';
  if (type==='assembler') return 'mkCircuit';
  return null;
}

function makeEntity(type, x, y, dir){
  const e = { id:S.nextId++, type, x, y, dir:dir|0, tier:1, module:'none', built:0, moved:0, thru:0 };
  if (type==='belt'){ e.items = []; e.shape = 0; e.thru = 0; }
  else if (type==='splitter'){ e.items=[]; e.rr=0; e.thru=0; }
  else if (type==='merger'){ e.slots=[null,null,null]; e.rr=0; e.thru=0; }
  else if (type==='inserter'){ e.held=null; e.swing=0; e.filter=null; e.thru=0; }
  else if (type==='pole'){ e.net=-1; }
  else if (type==='generator'){ e.fuelMax=6; e.fuel=2; e.load=0; e.net=-1; e.burn=0; }
  else if (type==='miner'){ e.progress=0; e.out={}; e.net=-1; e.rich=0; e.status='ok'; e.actAcc=0; e.actPct=0; }
  else if (isMachine(type)){ e.recipe=defaultRecipe(type); e.progress=0; e.in={}; e.out={}; e.net=-1; e.status='ok'; e.actAcc=0; e.actPct=0; }
  else if (type==='storage'){ e.store={}; e.cap=600; }
  else if (type==='hub'){ e.net=-1; e.received={}; }
  return e;
}

/* --------------------------- buffer helpers ----------------------------- */
function bufCount(b){ let n=0; for (const k in b) n += b[k]; return n; }
function bufAdd(b,k,n){ b[k]=(b[k]||0)+n; }
function bufTake(b,k,n){ if (!b[k]) return 0; const t=Math.min(b[k],n); b[k]-=t; if (b[k]<=0) delete b[k]; return t; }

function machCapIn(e, item){
  const r = RECIPES[e.recipe]; if (!r) return 0;
  const need = r.in[item] || 0; if (!need) return 0;
  return Math.ceil(need * 3 * MODULES[e.module].cap);
}
function machCapOut(e, item){
  const r = RECIPES[e.recipe]; if (!r) return 0;
  const mk = r.out[item] || 0; if (!mk) return 0;
  return Math.ceil(mk * 4 * MODULES[e.module].cap);
}

/* ------------------------ belt slot / item helpers ---------------------- */
function beltSpacing(){ return 1 / Math.max(1, S.itemDensity); }
function beltVel(e){ return S.beltSpeed * TIER_MUL[e.tier]; }

/** Can entity `e` accept `item` arriving from direction `fromDir` (the direction of travel)? */
function canAccept(e, item, fromDir, srcX, srcY){
  if (!e) return false;
  switch (e.type){
    case 'belt': {
      if (e.dir === opp(fromDir)) return false;             // head-on
      const sp = beltSpacing();
      for (const it of e.items) if (it.p < sp) return false; // tail occupied
      return e.items.length < S.itemDensity + 1;
    }
    case 'splitter': {
      if (fromDir !== e.dir) return false;                  // only from the back
      return e.items.length < 2;
    }
    case 'merger': {
      const si = mergerSlotIndex(e, fromDir);
      return si >= 0 && !e.slots[si];
    }
    case 'storage': return bufCount(e.store) < e.cap;
    case 'generator': return item==='coal' && e.fuel < e.fuelMax;
    case 'hub': return true;
    case 'smelter': case 'constructor': case 'assembler': {
      const cap = machCapIn(e, item);
      if (!cap) return false;
      return (e.in[item]||0) < cap;
    }
    case 'inserter': return false;   // inserters are pulled from, never pushed into
    case 'miner': case 'pole': return false;
  }
  return false;
}

/** Push `item` into `e` (caller must have checked canAccept). */
function doAccept(e, item, fromDir){
  switch (e.type){
    case 'belt': case 'splitter':
      e.items.push({t:item, p:0}); e.items.sort((a,b)=>b.p-a.p); e.thru++; return true;
    case 'merger': {
      const si = mergerSlotIndex(e, fromDir);
      if (si < 0 || e.slots[si]) return false;
      e.slots[si] = {t:item, p:0}; e.thru++; return true; }
    case 'storage': bufAdd(e.store, item, 1); return true;
    case 'generator': e.fuel++; return true;
    case 'hub': bufAdd(e.received, item, 1); onDelivered(item); return true;
    default: bufAdd(e.in, item, 1); return true;
  }
}

/** Try to hand one item to whatever occupies (tx,ty) coming from direction d. */
function tryHandoff(item, tx, ty, d){
  const tgt = entAt(tx,ty);
  if (!tgt) return null;
  if (!canAccept(tgt, item, d, tx-DX[d], ty-DY[d])) return null;
  doAccept(tgt, item, d);
  return tgt;
}

/* =========================================================================
   POWER NETWORKS
   Poles supply a 7x7 area and link to other poles within 8 tiles.
   ========================================================================= */
const POLE_REACH = 8, POLE_AREA = 3;   // area = radius in tiles (3 -> 7x7)
let netMap = null;

function rebuildNets(){
  const poles = S.list.poles;
  const n = poles.length;
  const parent = new Int32Array(n); for (let i=0;i<n;i++) parent[i]=i;
  const find = a => { while (parent[a]!==a){ parent[a]=parent[parent[a]]; a=parent[a]; } return a; };
  const uni = (a,b) => { a=find(a); b=find(b); if (a!==b) parent[b]=a; };
  for (let i=0;i<n;i++) for (let j=i+1;j<n;j++){
    const dx = poles[i].x-poles[j].x, dy = poles[i].y-poles[j].y;
    if (dx*dx+dy*dy <= POLE_REACH*POLE_REACH) uni(i,j);
  }
  const rootToNet = new Map();
  S.nets = [];
  for (let i=0;i<n;i++){
    const r = find(i);
    let ni = rootToNet.get(r);
    if (ni === undefined){ ni = S.nets.length; rootToNet.set(r, ni);
      S.nets.push({id:ni, poles:[], gens:[], loads:[], supply:0, demand:0, sat:1, produced:0}); }
    S.nets[ni].poles.push(poles[i]); poles[i].net = ni;
  }
  if (!netMap || netMap.length !== S.W*S.H) netMap = new Int32Array(S.W*S.H);
  netMap.fill(-1);
  for (const p of poles){
    for (let dy=-POLE_AREA; dy<=POLE_AREA; dy++) for (let dx=-POLE_AREA; dx<=POLE_AREA; dx++){
      const x=p.x+dx, y=p.y+dy; if (!inBounds(x,y)) continue;
      netMap[idx(x,y)] = p.net;
    }
  }
  for (const net of S.nets){ net.gens.length=0; net.loads.length=0; }
  const assign = e => {
    let found = -1;
    const s = footprint(e);
    for (let j=0;j<s.h && found<0;j++) for (let i=0;i<s.w;i++){
      const x=e.x+i, y=e.y+j; if (!inBounds(x,y)) continue;
      const nn = netMap[idx(x,y)]; if (nn>=0){ found=nn; break; }
    }
    e.net = found;
    if (found>=0){ if (e.type==='generator') S.nets[found].gens.push(e); else S.nets[found].loads.push(e); }
  };
  for (const e of S.list.gens) assign(e);
  for (const e of S.list.powered) assign(e);
  S.netDirty = false;
}

function baseDemand(e){
  const b = B[e.type];
  if (b.pw <= 0) return 0;
  const tier = e.tier||1, mod = MODULES[e.module||'none'];
  return b.pw * TIER_POW[tier] * mod.pw * S.powerDiff;
}
function genMax(e){ return -B.generator.pw * TIER_POW[e.tier] * MODULES[e.module].spd; }

/* =========================================================================
   ENTITY LISTS
   ========================================================================= */
function rebuildLists(){
  const L = {belts:[], splitters:[], mergers:[], inserters:[], miners:[], machines:[],
             gens:[], storages:[], hubs:[], poles:[], powered:[], all:[]};
  const ids = [...S.ents.keys()].sort((a,b)=>a-b);
  for (const id of ids){
    const e = S.ents.get(id); L.all.push(e);
    switch (e.type){
      case 'belt': L.belts.push(e); break;
      case 'splitter': L.splitters.push(e); break;
      case 'merger': L.mergers.push(e); break;
      case 'inserter': L.inserters.push(e); break;
      case 'miner': L.miners.push(e); break;
      case 'generator': L.gens.push(e); break;
      case 'storage': L.storages.push(e); break;
      case 'hub': L.hubs.push(e); break;
      case 'pole': L.poles.push(e); break;
      default: if (isMachine(e.type)) L.machines.push(e); break;
    }
    if (consumesPower(e.type)) L.powered.push(e);
  }
  S.list = L;
  S.netDirty = true;
  for (const e of L.belts) recalcBeltShape(e);
  for (const e of L.miners) recalcMinerRichness(e);
}

/** Which neighbouring tiles push INTO this belt? Determines corner shape. */
function feedsInto(e, fromDir){
  // is there something at the tile on side `fromDir` of e that outputs into e?
  const nx = e.x + DX[fromDir], ny = e.y + DY[fromDir];
  const s = entAt(nx, ny);
  if (!s) return false;
  if (s.type==='belt' || s.type==='splitter' || s.type==='merger'){
    if (s.type==='belt' || s.type==='merger') return s.dir === opp(fromDir);
    // splitter: outputs to left/front/right
    const d = s.dir; return opp(fromDir)===d || opp(fromDir)===((d+1)&3) || opp(fromDir)===((d+3)&3);
  }
  if (s.type==='inserter') return s.dir === opp(fromDir);
  const p = outPort(s);
  return (p.tx === e.x && p.ty === e.y);
}
function recalcBeltShape(e){
  const d = e.dir, back = opp(d), left = (d+3)&3, right = (d+1)&3;
  const fb = feedsInto(e, back), fl = feedsInto(e, left), fr = feedsInto(e, right);
  e.shape = fb ? 0 : (fl && !fr) ? 1 : (fr && !fl) ? 2 : 0;
  e.sideIn = (fl?1:0) | (fr?2:0);
}
function recalcBeltNeighborhood(x,y){
  for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++){
    const e = entAt(x+dx, y+dy); if (e && e.type==='belt') recalcBeltShape(e);
  }
}
function recalcMinerRichness(e){
  const s = footprint(e); let counts = {}, total=0;
  for (let j=0;j<s.h;j++) for (let i=0;i<s.w;i++){
    const x=e.x+i, y=e.y+j; if (!inBounds(x,y)) continue;
    const o = S.ore[idx(x,y)];
    if (o>0 && (S.depositMode==='infinite' || S.oreAmt[idx(x,y)]>0)){ const k=ORE_TYPES[o-1]; counts[k]=(counts[k]||0)+1; total++; }
  }
  let best=null, bn=0;
  for (const k in counts) if (counts[k]>bn){ bn=counts[k]; best=k; }
  e.oreType = best; e.rich = best ? bn/(s.w*s.h) : 0;
}

/* =========================================================================
   SIMULATION
   ========================================================================= */
const MINER_BASE = 0.85;    // ore per second at 100% richness, tier 1
const INSERTER_RATE = 1.5;  // swings per second at tier 1
const COAL_SECONDS = 5.0;   // seconds of full output per coal

function simStep(dt){
  S.simTime += dt; S.tick++;
  if (S.netDirty) rebuildNets();

  /* --- phase A: intent + power demand --------------------------------- */
  for (const e of S.list.machines) machineIntent(e);
  for (const e of S.list.miners) minerIntent(e);
  for (const e of S.list.inserters) inserterIntent(e);
  for (const e of S.list.hubs) e.demand = baseDemand(e);
  for (const e of S.list.splitters) e.demand = baseDemand(e) * (e.items.length ? 1 : .25);
  for (const e of S.list.mergers) e.demand = baseDemand(e) * (e.slots.some(s=>s) ? 1 : .25);

  /* --- phase B: solve each network ------------------------------------ */
  let totSup=0, totDem=0;
  for (const net of S.nets){
    let dem=0, sup=0;
    for (const l of net.loads) dem += l.demand || 0;
    for (const g of net.gens) sup += (g.fuel>0 ? genMax(g) : 0);
    net.demand = dem; net.supply = sup;
    net.sat = dem <= 0.0001 ? 1 : clamp(sup/dem, 0, 1);
    net.produced = Math.min(dem, sup);
    totSup += sup; totDem += dem;
    // burn fuel proportional to actual load
    for (const g of net.gens){
      if (g.fuel<=0){ g.load=0; continue; }
      const share = sup>0 ? genMax(g)/sup : 0;
      g.load = net.produced * share;
      g.burn += (g.load / genMax(g)) * dt / COAL_SECONDS;
      while (g.burn >= 1 && g.fuel > 0){ g.burn -= 1; g.fuel--; S.cons.coal=(S.cons.coal||0)+1; }
      if (g.fuel<=0) g.burn = 0;
    }
  }
  for (const g of S.list.gens) if (g.net < 0){ g.load = 0; }
  S.totalSupply = totSup; S.totalDemand = totDem;
  S.globalSat = totDem <= 0.0001 ? 1 : clamp(totSup/totDem, 0, 1);

  const satOf = e => e.net >= 0 ? S.nets[e.net].sat : 0;

  /* --- phase C: run ---------------------------------------------------- */
  for (const e of S.list.miners) updateMiner(e, dt, satOf(e));
  for (const e of S.list.machines) updateMachine(e, dt, satOf(e));
  for (const e of S.list.inserters) updateInserter(e, dt, satOf(e));
  for (const e of S.list.belts) updateBelt(e, dt);
  for (const e of S.list.splitters) updateSplitter(e, dt, satOf(e));
  for (const e of S.list.mergers) updateMerger(e, dt, satOf(e));

  sampleStats(dt);
}

/* ------------------------------- belts ---------------------------------- */
function updateBelt(e, dt){
  const n = e.items.length; if (!n) return;
  const v = beltVel(e)*dt, sp = beltSpacing();
  const tx = e.x+DX[e.dir], ty = e.y+DY[e.dir];
  let prevP = Infinity;
  for (let i=0;i<e.items.length;i++){
    const it = e.items[i];
    let np = it.p + v;
    if (prevP === Infinity){
      if (np >= 1){
        if (tryHandoff(it.t, tx, ty, e.dir)){ e.items.splice(i,1); i--; e.moved++; continue; }
        np = 1;
      }
    } else {
      np = Math.min(np, prevP - sp);
      if (np < it.p) np = it.p;
    }
    it.p = np; prevP = np;
  }
}

/* ------------------------------ splitter -------------------------------- */
function updateSplitter(e, dt, sat){
  if (!e.items.length) return;
  const v = beltVel(e)*dt*Math.max(.15,sat), sp = beltSpacing();
  const d = e.dir, order = [(d+3)&3, d, (d+1)&3];
  let prevP = Infinity;
  for (let i=0;i<e.items.length;i++){
    const it = e.items[i];
    let np = it.p + v;
    if (prevP === Infinity){
      if (np >= 1){
        let sent = false;
        for (let k=0;k<3 && !sent;k++){
          const oi = (e.rr + k) % 3, od = order[oi];
          if (tryHandoff(it.t, e.x+DX[od], e.y+DY[od], od)){ e.rr = (oi+1)%3; sent = true; }
        }
        if (sent){ e.items.splice(i,1); i--; e.moved++; continue; }
        np = 1;
      }
    } else { np = Math.min(np, prevP - sp); if (np < it.p) np = it.p; }
    it.p = np; prevP = np;
  }
}

/* ------------------------------- merger --------------------------------- */
function mergerSlotIndex(e, fromDir){
  const entry = opp(fromDir), d = e.dir;
  if (entry === ((d+3)&3)) return 0;
  if (entry === opp(d)) return 1;
  if (entry === ((d+1)&3)) return 2;
  return -1;
}
function updateMerger(e, dt, sat){
  const v = beltVel(e)*dt*Math.max(.15,sat);
  const d = e.dir, tx = e.x+DX[d], ty = e.y+DY[d];
  for (let i=0;i<3;i++){ const s=e.slots[i]; if (s && s.p<1) s.p = Math.min(1, s.p+v); }
  for (let k=0;k<3;k++){
    const si = (e.rr + k) % 3, s = e.slots[si];
    if (s && s.p >= 1){
      if (tryHandoff(s.t, tx, ty, d)){ e.slots[si] = null; e.rr = (si+1)%3; e.moved++; }
      break;
    }
  }
}

/* -------------------------------- miner --------------------------------- */
function minerIntent(e){
  recalcMinerRichnessLazy(e);
  const full = bufCount(e.out) >= 12;
  const has = e.rich > 0;
  e.want = has && !full;
  e.demand = baseDemand(e) * (e.want ? 1 : 0.15);
  e.status = !has ? 'nodeposit' : full ? 'blocked' : 'ok';
}
let richnessClock = 0;
function recalcMinerRichnessLazy(e){
  if (S.depositMode==='infinite') { if (e.rich===undefined || e.oreType===undefined) recalcMinerRichness(e); return; }
  if ((S.tick & 63) === 0 || e.rich === undefined) recalcMinerRichness(e);
}
function updateMiner(e, dt, sat){
  pushOut(e);   // always drain the buffer, even when the drill itself is paused
  if (e.net < 0){ e.status='unpowered'; e.actPct=lerp(e.actPct,0,.02); return; }
  if (sat < 0.999 && e.want) e.status = sat<=0.02 ? 'unpowered' : 'brownout';
  if (!e.want) return;
  const rate = MINER_BASE * e.rich * TIER_MUL[e.tier] * MODULES[e.module].spd * S.machineSpeed * sat;
  if (rate <= 0) return;
  e.progress += rate*dt;
  e.actAcc += dt * (sat);
  while (e.progress >= 1){
    e.progress -= 1;
    const k = e.oreType; if (!k) break;
    if (S.depositMode !== 'infinite'){
      // drain one unit from the richest covered tile
      const s = footprint(e); let bx=-1, by=-1, bv=0;
      for (let j=0;j<s.h;j++) for (let i=0;i<s.w;i++){
        const x=e.x+i, y=e.y+j; if (!inBounds(x,y)) continue;
        const ii = idx(x,y);
        if (S.ore[ii]===ORE_TYPES.indexOf(k)+1 && S.oreAmt[ii]>bv){ bv=S.oreAmt[ii]; bx=x; by=y; }
      }
      if (bx<0){ e.rich=0; break; }
      S.oreAmt[idx(bx,by)] -= 1;
      if (S.oreAmt[idx(bx,by)] <= 0) recalcMinerRichness(e);
    }
    bufAdd(e.out, k, 1); S.prod[k]=(S.prod[k]||0)+1;
  }
  pushOut(e);
}

/** Push produced items from an entity's out-buffer through its output port. */
function pushOut(e){
  const keys = Object.keys(e.out); if (!keys.length) return;
  const p = outPort(e);
  // round-robin across produced item types so multi-output recipes drain evenly
  e.outRR = (e.outRR|0) % keys.length;
  for (let n=0;n<keys.length;n++){
    const k = keys[(e.outRR + n) % keys.length];
    if (!e.out[k]) continue;
    if (tryHandoff(k, p.tx, p.ty, e.dir)){ e.out[k]--; if (!e.out[k]) delete e.out[k]; e.outRR = (e.outRR + n + 1) % Math.max(1,keys.length); return; }
  }
}

/* ------------------------------- machine -------------------------------- */
function machineIntent(e){
  const r = RECIPES[e.recipe];
  if (!r || !r.m){ e.want=false; e.demand=baseDemand(e)*0.15; e.status='norecipe'; return; }
  if (e.crafting){ e.want = true; e.demand = baseDemand(e); e.status='ok'; return; }
  let starved = false;
  for (const k in r.in) if ((e.in[k]||0) < r.in[k]) starved = true;
  let blocked = false;
  for (const k in r.out) if ((e.out[k]||0) + r.out[k] > machCapOut(e,k)) blocked = true;
  e.want = !starved && !blocked;
  e.demand = baseDemand(e) * (e.want ? 1 : 0.15);
  e.status = starved ? 'starved' : blocked ? 'blocked' : 'ok';
}
function updateMachine(e, dt, sat){
  pushOut(e);
  if (e.net < 0){ e.status='unpowered'; e.actPct = lerp(e.actPct,0,.02); return; }
  const r = RECIPES[e.recipe]; if (!r || !r.m) return;
  if (!e.crafting){
    if (!e.want) return;
    for (const k in r.in){ e.in[k] -= r.in[k]; if (e.in[k]<=0) delete e.in[k]; S.cons[k]=(S.cons[k]||0)+r.in[k]; }
    e.crafting = true; e.progress = 0;
  }
  if (sat < 0.999) e.status = sat<=0.02 ? 'unpowered' : 'brownout';
  const spd = TIER_MUL[e.tier] * MODULES[e.module].spd * S.machineSpeed * sat;
  e.progress += (dt * spd) / r.t;
  e.actAcc += dt * sat;
  if (e.progress >= 1){
    e.progress = 0; e.crafting = false;
    for (const k in r.out){ bufAdd(e.out, k, r.out[k]); S.prod[k]=(S.prod[k]||0)+r.out[k]; }
    e.made = (e.made||0)+1;
    pushOut(e);
  }
}

/* ------------------------------ inserter -------------------------------- */
function sourceTile(e){ return {x:e.x-DX[e.dir], y:e.y-DY[e.dir]}; }
function targetTile(e){ return {x:e.x+DX[e.dir], y:e.y+DY[e.dir]}; }
function inserterIntent(e){
  e.want = true;
  e.demand = baseDemand(e) * (e.held || peekSource(e) ? 1 : 0.2);
}
function peekSource(e){
  const s = sourceTile(e), src = entAt(s.x, s.y); if (!src) return null;
  const f = e.filter;
  switch (src.type){
    case 'belt': case 'splitter': {
      for (const it of src.items) if (it.p > 0.35 && (!f || it.t===f)) return it.t;
      return null; }
    case 'merger': { for (const s2 of src.slots) if (s2 && (!f || s2.t===f)) return s2.t; return null; }
    case 'storage': { for (const k in src.store) if (!f || k===f) return k; return null; }
    case 'miner': case 'smelter': case 'constructor': case 'assembler': {
      for (const k in src.out) if (!f || k===f) return k; return null; }
  }
  return null;
}
function takeFromSource(e, want){
  const s = sourceTile(e), src = entAt(s.x, s.y); if (!src) return null;
  switch (src.type){
    case 'belt': case 'splitter': {
      for (let i=0;i<src.items.length;i++){ const it=src.items[i]; if (it.p>0.35 && it.t===want){ src.items.splice(i,1); return want; } }
      return null; }
    case 'merger': { for (let i=0;i<3;i++){ const s2=src.slots[i]; if (s2 && s2.t===want){ src.slots[i]=null; return want; } } return null; }
    case 'storage': return bufTake(src.store, want, 1) ? want : null;
    case 'miner': case 'smelter': case 'constructor': case 'assembler': return bufTake(src.out, want, 1) ? want : null;
  }
  return null;
}
function updateInserter(e, dt, sat){
  if (e.net < 0){ e.status='unpowered'; return; }
  if (sat <= 0.02){ e.status='unpowered'; return; }
  e.status = sat < 0.999 ? 'brownout' : 'ok';
  const rate = INSERTER_RATE * TIER_MUL[e.tier] * MODULES[e.module].spd * S.machineSpeed * sat;
  if (!e.held){
    const want = peekSource(e);
    if (!want){ e.status = 'starved'; e.swing = Math.max(0, e.swing - rate*dt*2); return; }
    const t = targetTile(e), tgt = entAt(t.x, t.y);
    if (!canAccept(tgt, want, e.dir, e.x, e.y)){ e.status='blocked'; return; }
    const got = takeFromSource(e, want);
    if (!got) return;
    e.held = got; e.swing = 0;
  }
  e.swing += rate*dt;
  e.actAcc += dt*sat;
  if (e.swing >= 1){
    const t = targetTile(e);
    if (tryHandoff(e.held, t.x, t.y, e.dir)){ e.held = null; e.swing = 0; e.thru++; e.moved=(e.moved||0)+1; }
    else { e.swing = 1; e.status='blocked'; }
  }
}

/* =========================================================================
   WORLD GENERATION
   ========================================================================= */
function generateWorld(seed, W, H){
  S.seed = seed>>>0; S.W = W|0; S.H = H|0;
  const n = S.W*S.H;
  S.cells = new Int32Array(n); S.ore = new Uint8Array(n); S.oreAmt = new Float32Array(n);
  S.ents.clear(); S.nextId = 1;
  const rnd = mulberry32(seed ^ 0x9e3779b9);
  // scattered elliptical deposit patches, one cluster per ore type per region
  const patches = [];
  const wants = [
    {t:1, n:5, r:[3.2,5.4], amt:[2600,5200]},   // iron
    {t:2, n:4, r:[2.8,4.6], amt:[2200,4200]},   // copper
    {t:3, n:4, r:[2.8,4.8], amt:[2400,4600]},   // coal
    {t:4, n:3, r:[2.6,4.2], amt:[2000,3800]},   // stone
  ];
  for (const w of wants){
    for (let i=0;i<w.n;i++){
      let tries=0, px, py, ok=false;
      while (tries++ < 90){
        px = 4 + rnd()*(S.W-8); py = 4 + rnd()*(S.H-8);
        // keep the middle of the map clear for the build area
        if (Math.abs(px - S.W/2) < 7 && Math.abs(py - S.H/2) < 6) continue;
        ok = true;
        for (const p of patches){ const dx=p.x-px, dy=p.y-py; if (dx*dx+dy*dy < 64) { ok=false; break; } }
        if (ok) break;
      }
      if (!ok) continue;
      patches.push({x:px, y:py, t:w.t, rx:lerp(w.r[0],w.r[1],rnd()), ry:lerp(w.r[0],w.r[1],rnd()),
                    amt:lerp(w.amt[0],w.amt[1],rnd()), rot:rnd()*Math.PI});
    }
  }
  const noise = makeNoise(seed);
  for (const p of patches){
    const R = Math.ceil(Math.max(p.rx,p.ry))+2;
    const cs=Math.cos(p.rot), sn=Math.sin(p.rot);
    for (let dy=-R; dy<=R; dy++) for (let dx=-R; dx<=R; dx++){
      const x=Math.round(p.x)+dx, y=Math.round(p.y)+dy;
      if (!inBounds(x,y)) continue;
      const lx = dx*cs + dy*sn, ly = -dx*sn + dy*cs;
      const d = (lx*lx)/(p.rx*p.rx) + (ly*ly)/(p.ry*p.ry);
      const nz = noise(x*0.42, y*0.42)*0.55;
      if (d + nz*0.9 - 0.28 < 1){
        const ii = idx(x,y);
        const density = clamp(1.25 - d, 0.14, 1);
        const a = p.amt * density;
        if (a > S.oreAmt[ii]){ S.ore[ii] = p.t; S.oreAmt[ii] = Math.round(a); }
      }
    }
  }
  S.oreMax = 0; for (let i=0;i<n;i++) if (S.oreAmt[i] > S.oreMax) S.oreMax = S.oreAmt[i];
  S.oreStamps = [];
  S.undo.length = 0; S.redo.length = 0;
  resetStats();
  rebuildLists();
}

/* =========================================================================
   BUILD / REMOVE  (all mutations go through here so undo stays correct)
   ========================================================================= */
function areaFree(type, x, y, dir, ignoreId){
  const s = sizeOf(type, dir);
  if (x<0 || y<0 || x+s.w > S.W || y+s.h > S.H) return false;
  for (let j=0;j<s.h;j++) for (let i=0;i<s.w;i++){
    const id = S.cells[idx(x+i, y+j)];
    if (id && id !== ignoreId) return false;
  }
  return true;
}
function placementProblem(type, x, y, dir){
  if (!areaFree(type, x, y, dir)) return 'occupied';
  if (type==='miner'){
    const s = sizeOf(type, dir); let any=false;
    for (let j=0;j<s.h;j++) for (let i=0;i<s.w;i++){
      const ii = idx(x+i, y+j);
      if (S.ore[ii] > 0 && (S.depositMode==='infinite' || S.oreAmt[ii] > 0)) any = true;
    }
    if (!any) return 'no deposit';
  }
  if (costOf(type,1,'none') > budgetLeft() && S.costMode!=='free') return 'no budget';
  return null;
}
function costOf(type, tier, module){
  if (S.costMode === 'free') return 0;
  let c = B[type].cost * (S.costMode==='strict' ? 1.5 : 1);
  for (let t=2;t<=(tier||1);t++) c += upgCost(type, t);
  c += MODULES[module||'none'].cost;
  return Math.round(c);
}
function budgetLeft(){ return S.costMode==='free' ? Infinity : S.credits - S.spent; }

function snapshotCellRegion(x,y,w,h){
  const seen = new Set(), out = [];
  for (let j=0;j<h;j++) for (let i=0;i<w;i++){
    const xx=x+i, yy=y+j; if (!inBounds(xx,yy)) continue;
    const id = S.cells[idx(xx,yy)];
    if (id && !seen.has(id)){ seen.add(id); out.push(serializeEnt(S.ents.get(id))); }
  }
  return out;
}
function serializeEnt(e){
  const o = {id:e.id, type:e.type, x:e.x, y:e.y, dir:e.dir, tier:e.tier, module:e.module};
  if (e.recipe) o.recipe = e.recipe;
  if (e.filter) o.filter = e.filter;
  if (e.items && e.items.length) o.items = e.items.map(i=>[i.t, +i.p.toFixed(3)]);
  if (e.slots) o.slots = e.slots.map(s => s ? [s.t, +s.p.toFixed(3)] : 0);
  if (e.in && bufCount(e.in)) o.in = {...e.in};
  if (e.out && bufCount(e.out)) o.out = {...e.out};
  if (e.store && bufCount(e.store)) o.store = {...e.store};
  if ('fuel' in e) o.fuel = e.fuel;
  if (e.held) o.held = e.held;
  if (e.progress) o.prog = +e.progress.toFixed(3);
  if (e.crafting) o.crafting = 1;
  return o;
}
function deserializeEnt(o){
  const e = makeEntity(o.type, o.x, o.y, o.dir|0);
  e.id = o.id || e.id;
  if (e.id >= S.nextId) S.nextId = e.id+1;
  e.tier = clamp(o.tier|0 || 1, 1, 3);
  e.module = own(MODULES, o.module) ? o.module : 'none';
  if (own(RECIPES, o.recipe)) e.recipe = o.recipe;
  if (own(ITEMS, o.filter)) e.filter = o.filter;
  if (Array.isArray(o.items) && e.items) e.items = o.items.filter(a=>Array.isArray(a)&&own(ITEMS,a[0])).slice(0,32).map(a=>({t:a[0], p:clamp(+a[1]||0,0,1)})).sort((a,b)=>b.p-a.p);
  if (Array.isArray(o.slots) && e.slots) e.slots = [0,1,2].map(i => { const s2=o.slots[i]; return (Array.isArray(s2) && own(ITEMS,s2[0])) ? {t:s2[0], p:clamp(+s2[1]||0,0,1)} : null; });
  if (o.in && e.in) for (const k in o.in) if (own(ITEMS,k)) e.in[k] = clamp(o.in[k]|0, 0, 9999);
  if (o.out && e.out) for (const k in o.out) if (own(ITEMS,k)) e.out[k] = clamp(o.out[k]|0, 0, 9999);
  if (o.store && e.store) for (const k in o.store) if (own(ITEMS,k)) e.store[k] = clamp(o.store[k]|0, 0, e.cap);
  if (o.fuel !== undefined && 'fuel' in e) e.fuel = clamp(o.fuel|0, 0, e.fuelMax);
  if (own(ITEMS, o.held) && 'held' in e) e.held = o.held;
  if (o.prog) e.progress = clamp(+o.prog||0, 0, 1);
  if (o.crafting) e.crafting = true;
  return e;
}
function insertEnt(e){
  S.ents.set(e.id, e);
  covers(e, (x,y)=>{ if (inBounds(x,y)) S.cells[idx(x,y)] = e.id; });
}
function removeEntById(id){
  const e = S.ents.get(id); if (!e) return null;
  covers(e, (x,y)=>{ if (inBounds(x,y) && S.cells[idx(x,y)]===id) S.cells[idx(x,y)] = 0; });
  S.ents.delete(id);
  return e;
}

/** Apply an action: {before:[serialized...], after:[serialized...], cost:n, label} */
function applyAction(act, isRedo){
  for (const o of act.before) removeEntById(o.id);
  for (const o of act.after) removeEntById(o.id);
  for (const o of act.after) insertEnt(deserializeEnt(o));
  S.spent += act.cost;
  rebuildLists();
  return act;
}
function revertAction(act){
  for (const o of act.after) removeEntById(o.id);
  for (const o of act.before) removeEntById(o.id);
  for (const o of act.before) insertEnt(deserializeEnt(o));
  S.spent -= act.cost;
  rebuildLists();
}
function commit(act){
  if (!act.before.length && !act.after.length) return false;
  applyAction(act);
  S.undo.push(act); if (S.undo.length > 200) S.undo.shift();
  S.redo.length = 0;
  markDirty();
  return true;
}
function doUndo(){
  const a = S.undo.pop(); if (!a){ toast('Nothing to undo'); return; }
  revertAction(a); S.redo.push(a); markDirty(); sfx('undo');
  status('Undid: ' + a.label);
}
function doRedo(){
  const a = S.redo.pop(); if (!a){ toast('Nothing to redo'); return; }
  applyAction(a); S.undo.push(a); markDirty(); sfx('undo');
  status('Redid: ' + a.label);
}

/** Build one structure. Returns true on success. */
function build(type, x, y, dir, opts){
  opts = opts || {};
  const problem = placementProblem(type, x, y, dir);
  if (problem){
    if (!opts.quiet) { toast('Cannot place: ' + problem, 'err'); sfx('deny'); }
    return false;
  }
  const e = makeEntity(type, x, y, dir);
  if (opts.tier) e.tier = clamp(opts.tier,1,3);
  if (own(MODULES, opts.module)) e.module = opts.module;
  if (own(RECIPES, opts.recipe) && RECIPES[opts.recipe].m === type) e.recipe = opts.recipe;
  if (opts.filter !== undefined) e.filter = opts.filter;
  const act = {before:[], after:[serializeEnt(e)], cost:costOf(type, e.tier, e.module), label:'build '+B[type].name};
  if (opts.batch) return act;
  commit(act);
  return true;
}
/** Build many at once (belt drags, paste) as a single undo step. */
function buildMany(specs, label){
  const before = [], after = [], seen = new Set();
  let cost = 0;
  const tmpCells = new Map();   // simulated occupancy for the batch
  const occupied = (x,y) => tmpCells.has(x+','+y) ? tmpCells.get(x+','+y) : S.cells[idx(x,y)];
  for (const sp of specs){
    const s = sizeOf(sp.type, sp.dir);
    if (sp.x<0||sp.y<0||sp.x+s.w>S.W||sp.y+s.h>S.H) continue;
    let clash = false, replaced = [];
    for (let j=0;j<s.h;j++) for (let i=0;i<s.w;i++){
      const id = occupied(sp.x+i, sp.y+j);
      if (id){
        const other = S.ents.get(id);
        // belts may overwrite belts; anything else blocks
        if (sp.replace && other && (other.type==='belt'||other.type==='splitter'||other.type==='merger') && sp.type==='belt'){ replaced.push(id); }
        else clash = true;
      }
    }
    if (clash) continue;
    let c = costOf(sp.type, sp.tier||1, sp.module||'none');
    for (const rid of replaced){
      const ex = S.ents.get(rid);
      if (ex && !seen.has(rid)){ seen.add(rid); before.push(serializeEnt(ex)); cost -= costOf(ex.type, ex.tier, ex.module); }
      covers(S.ents.get(rid), (x,y)=>tmpCells.set(x+','+y, 0));
    }
    if (S.costMode!=='free' && cost + c > budgetLeft()) { continue; }
    if (sp.type==='miner' && placementProblemNoBudget(sp.type, sp.x, sp.y, sp.dir, occupied)) continue;
    const e = makeEntity(sp.type, sp.x, sp.y, sp.dir);
    if (sp.tier) e.tier = clamp(sp.tier,1,3);
    if (own(MODULES, sp.module)) e.module = sp.module;
    if (own(RECIPES, sp.recipe)) e.recipe = sp.recipe;
    if (sp.filter) e.filter = sp.filter;
    cost += c;
    after.push(serializeEnt(e));
    covers(e, (x,y)=>tmpCells.set(x+','+y, e.id));
  }
  if (!after.length && !before.length) return false;
  return commit({before, after, cost, label:label||'build'});
}
function placementProblemNoBudget(type, x, y, dir, occ){
  const s = sizeOf(type, dir); let any=false;
  for (let j=0;j<s.h;j++) for (let i=0;i<s.w;i++){
    const ii = idx(x+i, y+j);
    if (S.ore[ii] > 0 && (S.depositMode==='infinite' || S.oreAmt[ii] > 0)) any = true;
  }
  return any ? null : 'no deposit';
}
/** Delete every structure overlapping a rect. */
function deleteRect(x0,y0,x1,y1){
  const xa=Math.min(x0,x1), xb=Math.max(x0,x1), ya=Math.min(y0,y1), yb=Math.max(y0,y1);
  const seen = new Set(), before = []; let refund = 0;
  for (let y=ya;y<=yb;y++) for (let x=xa;x<=xb;x++){
    if (!inBounds(x,y)) continue;
    const id = S.cells[idx(x,y)];
    if (id && !seen.has(id)){
      const e = S.ents.get(id);
      if (e.type==='hub' && S.mode==='campaign') continue;   // hub is fixed in campaign
      seen.add(id); before.push(serializeEnt(e)); refund += costOf(e.type, e.tier, e.module);
    }
  }
  if (!before.length) return false;
  return commit({before, after:[], cost:-refund, label:'delete ×'+before.length});
}
/** Modify an existing structure in place (rotate / recipe / tier / module / filter). */
function modifyEnt(e, changes, label){
  const before = [serializeEnt(e)];
  const after = {...before[0], ...changes};
  let cost = 0;
  if (changes.tier !== undefined) for (let t=(e.tier|0)+1; t<=changes.tier; t++) cost += (S.costMode==='free'?0:upgCost(e.type, t));
  if (changes.module !== undefined && changes.module !== e.module) cost += (S.costMode==='free'?0:MODULES[changes.module].cost - MODULES[e.module].cost);
  if (changes.dir !== undefined && !areaFree(e.type, e.x, e.y, changes.dir, e.id)) { toast('No room to rotate','err'); sfx('deny'); return false; }
  if (cost > budgetLeft()){ toast('Not enough credits','err'); sfx('deny'); return false; }
  return commit({before, after:[after], cost, label:label||'modify'});
}

/* =========================================================================
   BLUEPRINT (copy / paste / move)
   ========================================================================= */
function captureBlueprint(x0,y0,x1,y1){
  const xa=Math.min(x0,x1), xb=Math.max(x0,x1), ya=Math.min(y0,y1), yb=Math.max(y0,y1);
  const seen = new Set(), parts = [];
  for (let y=ya;y<=yb;y++) for (let x=xa;x<=xb;x++){
    if (!inBounds(x,y)) continue;
    const id = S.cells[idx(x,y)]; if (!id || seen.has(id)) continue;
    const e = S.ents.get(id); seen.add(id);
    const s = footprint(e);
    if (e.x<xa || e.y<ya || e.x+s.w-1>xb || e.y+s.h-1>yb) continue;  // only fully-contained
    parts.push({type:e.type, dx:e.x-xa, dy:e.y-ya, dir:e.dir, tier:e.tier, module:e.module, recipe:e.recipe, filter:e.filter});
  }
  if (!parts.length) return null;
  return {parts, w:xb-xa+1, h:yb-ya+1, ox:xa, oy:ya};
}
function rotateBlueprint(bp){
  const parts = bp.parts.map(p => {
    const s = sizeOf(p.type, p.dir);
    return {...p, dir:(p.dir+1)&3, dx: bp.h - 1 - (p.dy + s.h - 1), dy: p.dx};
  });
  return {parts, w:bp.h, h:bp.w};
}
function blueprintSpecs(bp, ox, oy){
  return bp.parts.map(p => ({type:p.type, x:ox+p.dx, y:oy+p.dy, dir:p.dir, tier:p.tier, module:p.module, recipe:p.recipe, filter:p.filter}));
}

/* =========================================================================
   STATISTICS
   ========================================================================= */
const HIST_LEN = 120, HIST_DT = 0.5;   // 60 s of history
function ring(){ return {a:new Float32Array(HIST_LEN), i:0, n:0, max:0}; }
function ringPush(r, v){ r.a[r.i] = v; r.i = (r.i+1)%HIST_LEN; if (r.n<HIST_LEN) r.n++; }
function ringAt(r, k){ return r.a[(r.i - r.n + k + HIST_LEN*2) % HIST_LEN]; }
function ringMax(r){ let m=0; for (let i=0;i<r.n;i++){ const v=ringAt(r,i); if (v>m) m=v; } return m; }
function ringAvg(r, count){ const c=Math.min(count||r.n, r.n); if (!c) return 0; let s=0; for (let i=r.n-c;i<r.n;i++) s+=ringAt(r,i); return s/c; }

function resetStats(){
  S.prod = {}; S.cons = {}; S.prodRate = {}; S.consRate = {};
  S.hist = {}; S.lastProd = {}; S.lastCons = {};
  for (const k of ITEM_KEYS){ S.hist[k] = {p:ring(), c:ring()}; }
  S.powerHist = ring(); S.demandHist = ring(); S.satHist = ring(); S.deliveredHist = ring();
  S.delivered = 0; S.lastDelivered = 0; S.deliverRate = 0;
  S.statClock = 0; S.simTime = 0; S.tick = 0;
  S.bottlenecks = []; S.beltLoad = 0; S.itemCount = 0;
  S.contractTime = 0;
}
function sampleStats(dt){
  S.statClock += dt;
  if (S.statClock < HIST_DT) return;
  const w = S.statClock; S.statClock = 0;
  // rates are the mean over the last RATE_WIN samples (4 s) — burst-proof and
  // numerically equal to the true average production rate
  const RATE_WIN = 8;
  for (const k of ITEM_KEYS){
    const p = (S.prod[k]||0), c = (S.cons[k]||0);
    const pr = (p - (S.lastProd[k]||0)) / w, cr = (c - (S.lastCons[k]||0)) / w;
    S.lastProd[k] = p; S.lastCons[k] = c;
    ringPush(S.hist[k].p, pr); ringPush(S.hist[k].c, cr);
    S.prodRate[k] = ringAvg(S.hist[k].p, RATE_WIN);
    S.consRate[k] = ringAvg(S.hist[k].c, RATE_WIN);
  }
  ringPush(S.powerHist, S.totalSupply||0);
  ringPush(S.demandHist, S.totalDemand||0);
  ringPush(S.satHist, (S.globalSat||1)*100);
  const dr = (S.delivered - S.lastDelivered)/w; S.lastDelivered = S.delivered;
  ringPush(S.deliveredHist, dr);
  S.deliverRate = ringAvg(S.deliveredHist, 10);

  // per-entity utilisation + throughput
  let items=0, cap=0, run=0, stall=0;
  for (const e of S.list.all){
    if (e.actAcc !== undefined){ e.actPct = lerp(e.actPct||0, clamp(e.actAcc/w,0,1)*100, .35); e.actAcc = 0; }
    if (e.moved !== undefined){ e.rate = lerp(e.rate||0, e.moved/w, .25); e.moved = 0; }
    if (e.items){ items += e.items.length; cap += S.itemDensity; }
    if (e.slots){ for (const s of e.slots) if (s) items++; }
    if (e.held) items++;
    if (isMachine(e.type) || e.type==='miner' || e.type==='inserter'){
      const hard = e.status && e.status!=='ok' && e.status!=='brownout';
      if (hard) stall++; else if (e.actPct > 2) run++;
    }
  }
  S.itemCount = items; S.beltLoad = cap ? items/cap : 0;
  S.runCount = run; S.stallCount = stall;
  detectBottlenecks();
}
function detectBottlenecks(){
  const groups = new Map();
  for (const e of S.list.all){
    if (!(isMachine(e.type)||e.type==='miner'||e.type==='inserter'||e.type==='generator')) continue;
    let reason = e.status;
    if (e.type==='generator'){ reason = e.fuel<=0 ? 'nofuel' : (e.net<0 ? 'unpowered' : null); }
    if (!reason || reason==='ok') continue;
    const label = B[e.type].name + ' — ' + statusLabel(reason);
    const g = groups.get(label) || {label, n:0, reason, ex:e};
    g.n++; groups.set(label, g);
  }
  let arr = [...groups.values()].sort((a,b)=>b.n-a.n).slice(0,6);
  if (S.globalSat < 0.995 && S.totalDemand > 0)
    arr.unshift({label:'Power deficit — '+fmtPow(S.totalDemand-S.totalSupply)+' short', n:0, reason:'brownout', ex:null});
  let badLinks = 0;
  for (const e of S.list.all) if (linkProblem(e)) badLinks++;
  if (badLinks) arr.unshift({label:'Invalid connections — '+badLinks+' output'+(badLinks>1?'s':'')+' cannot hand off', n:badLinks, reason:'badlink', ex:null});
  const congested = S.list.belts.filter(b => b.items.length >= S.itemDensity).length;
  if (congested > 4) arr.push({label:'Belt congestion — '+congested+' saturated tiles', n:congested, reason:'blocked', ex:null});
  S.bottlenecks = arr.slice(0,7);
}
/** Structural connection problem at an entity's output — independent of item type. */
function linkProblem(e){
  let d, tx, ty;
  if (e.type==='belt' || e.type==='merger' || e.type==='inserter'){ d = e.dir; tx = e.x+DX[d]; ty = e.y+DY[d]; }
  else if (isMachine(e.type) || e.type==='miner'){ const p = outPort(e); d = e.dir; tx = p.tx; ty = p.ty; }
  else return null;
  if (!inBounds(tx,ty)) return 'points off the map';
  const t = entAt(tx,ty);
  if (!t) return null;                       // an open end just holds items, that is legal
  switch (t.type){
    case 'belt':      return t.dir === opp(d) ? 'faces an oncoming belt' : null;
    case 'splitter':  return d !== t.dir ? 'splitters only take from the back' : null;
    case 'merger':    return mergerSlotIndex(t, d) < 0 ? 'feeds the merger output face' : null;
    case 'inserter':  return 'inserters cannot be loaded, only unloaded';
    case 'pole':      return 'blocked by a power pole';
    case 'miner':     return 'drills do not accept items';
    case 'generator': return null;
    default:          return null;
  }
}
function statusLabel(s){
  return {ok:'running', starved:'starved (missing input)', blocked:'output blocked', unpowered:'no power',
          brownout:'brownout (low power)', norecipe:'no recipe set', nodeposit:'no ore left',
          nofuel:'out of fuel', badlink:'invalid connection'}[s] || s;
}

   ========================================================================= */
const cv = $('gl'), ctx = cv.getContext('2d', {alpha:false});
const cam = {x:35, y:26, z:26, tz:26};
let VW=800, VH=600, DPR=1;
function resizeCanvas(){
  const st = $('stage');
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  VW = Math.max(1, st.clientWidth); VH = Math.max(1, st.clientHeight);
  cv.width = Math.round(VW*DPR); cv.height = Math.round(VH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);   // CSS size comes from inset:0, so the stage can shrink freely
}
const w2sx = wx => (wx - cam.x)*cam.z + VW/2;
const w2sy = wy => (wy - cam.y)*cam.z + VH/2;
const s2wx = sx => (sx - VW/2)/cam.z + cam.x;
const s2wy = sy => (sy - VH/2)/cam.z + cam.y;
function centerOn(x,y){ cam.x=x; cam.y=y; }
function fitWorld(){ cam.z = cam.tz = clamp(Math.min(VW/S.W, VH/S.H)*0.92, 5, 60); centerOn(S.W/2, S.H/2); }
function factoryBounds(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, n=0;
  for (const e of S.ents.values()){ const s=footprint(e); n++;
    x0=Math.min(x0,e.x); y0=Math.min(y0,e.y); x1=Math.max(x1,e.x+s.w); y1=Math.max(y1,e.y+s.h); }
  return n ? {x0,y0,x1,y1} : null;
}
function fitFactory(pad){
  const b = factoryBounds(); if (!b){ fitWorld(); return; }
  pad = pad===undefined ? 2 : pad;
  // keep the factory clear of the HUD panel and the speed dock
  const iL = VW > 700 ? 190 : 0, iT = 4, iB = VH > 420 ? 56 : 0;
  const availW = Math.max(120, VW - iL), availH = Math.max(120, VH - iT - iB);
  const w = (b.x1-b.x0)+pad*2, h = (b.y1-b.y0)+pad*2;
  cam.z = cam.tz = clamp(Math.min(availW/w, availH/h), 6, 40);
  const cxs = iL + availW/2, cys = iT + availH/2;
  cam.x = (b.x0+b.x1)/2 + (VW/2 - cxs)/cam.z;
  cam.y = (b.y0+b.y1)/2 + (VH/2 - cys)/cam.z;
}

/* =========================================================================

   ========================================================================= */
function rr(c,x,y,w,h,r){ r=Math.min(r,w/2,h/2); c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=clamp(Math.round(r+amt*255),0,255); g=clamp(Math.round(g+amt*255),0,255); b=clamp(Math.round(b+amt*255),0,255);
  return 'rgb('+r+','+g+','+b+')';
}
const BCOL = {
  belt:'#3b4653', splitter:'#4a5566', merger:'#4a5566', inserter:'#6b5a3a', pole:'#5a4a35',
  generator:'#6b4030', miner:'#4a5f6e', smelter:'#6e4a34', constructor:'#3f5f52', assembler:'#4d4a70',
  storage:'#5b5140', hub:'#2f5d78'
};
const ORE_COL = ['#98a6b6','#d5834f','#3c4249','#8f867a'];

/* ------------------------------ item glyphs ----------------------------- */
function drawItem(c, kind, x, y, s){
  const I = ITEMS[kind]; if (!I) return;
  c.save(); c.translate(x,y);
  if (s < 4.5){ c.fillStyle=I.c; c.fillRect(-s*.45,-s*.45,s*.9,s*.9); c.restore(); return; }
  switch (I.sh){
    case 'chunk':
      c.fillStyle=I.c; c.beginPath();
      c.moveTo(-s*.42,-s*.12); c.lineTo(-s*.2,-s*.44); c.lineTo(s*.26,-s*.4); c.lineTo(s*.44,s*.06); c.lineTo(s*.14,s*.44); c.lineTo(-s*.34,s*.3); c.closePath(); c.fill();
      c.fillStyle=I.c2; c.beginPath(); c.moveTo(-s*.34,s*.3); c.lineTo(s*.14,s*.44); c.lineTo(s*.44,s*.06); c.lineTo(s*.1,s*.1); c.closePath(); c.fill();
      break;
    case 'ingot':
      c.fillStyle=I.c2; rr(c,-s*.44,-s*.24,s*.88,s*.48,s*.1); c.fill();
      c.fillStyle=I.c; rr(c,-s*.4,-s*.28,s*.8,s*.34,s*.09); c.fill();
      break;
    case 'plate':
      c.fillStyle=I.c2; rr(c,-s*.46,-s*.34,s*.92,s*.68,s*.08); c.fill();
      c.fillStyle=I.c; rr(c,-s*.4,-s*.3,s*.8,s*.5,s*.06); c.fill();
      c.fillStyle=I.c2; c.fillRect(-s*.24,-s*.14,s*.48,s*.05);
      break;
    case 'rod':
      c.fillStyle=I.c2; rr(c,-s*.48,-s*.13,s*.96,s*.26,s*.13); c.fill();
      c.fillStyle=I.c; rr(c,-s*.42,-s*.09,s*.84,s*.12,s*.06); c.fill();
      break;
    case 'coil':
      c.strokeStyle=I.c; c.lineWidth=Math.max(1,s*.13); c.lineCap='round';
      for (let i=0;i<3;i++){ c.beginPath(); c.arc(0,0,s*(.16+i*.13),0.6,5.4); c.stroke(); }
      break;
    case 'board':
      c.fillStyle=I.c2; rr(c,-s*.44,-s*.38,s*.88,s*.76,s*.09); c.fill();
      c.fillStyle=I.c; rr(c,-s*.38,-s*.32,s*.76,s*.64,s*.07); c.fill();
      c.fillStyle=I.c2; c.fillRect(-s*.2,-s*.2,s*.4,s*.16); c.fillRect(-s*.24,s*.06,s*.16,s*.16); c.fillRect(s*.06,s*.06,s*.16,s*.16);
      break;
    case 'gear': {
      c.fillStyle=I.c; c.beginPath();
      for (let i=0;i<8;i++){ const a=i/8*Math.PI*2, r1=s*.46, r2=s*.3;
        c.lineTo(Math.cos(a)*r1, Math.sin(a)*r1); c.lineTo(Math.cos(a+.3)*r2, Math.sin(a+.3)*r2); }
      c.closePath(); c.fill();
      c.fillStyle='#12181e'; c.beginPath(); c.arc(0,0,s*.15,0,7); c.fill();
      break; }
    case 'unit':
      c.fillStyle=I.c2; rr(c,-s*.46,-s*.42,s*.92,s*.84,s*.14); c.fill();
      c.fillStyle=I.c; rr(c,-s*.36,-s*.32,s*.72,s*.64,s*.1); c.fill();
      c.fillStyle='#0e1a22'; c.beginPath(); c.arc(0,0,s*.19,0,7); c.fill();

    default: c.fillStyle=I.c; c.beginPath(); c.arc(0,0,s*.4,0,7); c.fill();
  }
