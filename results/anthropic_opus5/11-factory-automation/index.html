/* --------------------------- belt path geometry ------------------------- */
function beltPoint(e, p){
  const d = e.dir;
  const ex = 0.5 + DX[d]*0.5, ey = 0.5 + DY[d]*0.5;
  if (e.shape === 0){
    const sx = 0.5 - DX[d]*0.5, sy = 0.5 - DY[d]*0.5;
    return {x: lerp(sx,ex,p), y: lerp(sy,ey,p)};
  }
  const side = e.shape===1 ? (d+3)&3 : (d+1)&3;
  const sx = 0.5 + DX[side]*0.5, sy = 0.5 + DY[side]*0.5;
  const t = p, mt = 1-t;
  return {x: mt*mt*sx + 2*mt*t*0.5 + t*t*ex, y: mt*mt*sy + 2*mt*t*0.5 + t*t*ey};
}
function beltPathTrace(c, e, ox, oy, z){
  const d = e.dir;
  const ex = ox + (0.5+DX[d]*0.5)*z, ey = oy + (0.5+DY[d]*0.5)*z;
  if (e.shape === 0){
    c.moveTo(ox + (0.5-DX[d]*0.5)*z, oy + (0.5-DY[d]*0.5)*z); c.lineTo(ex, ey);
  } else {
    const side = e.shape===1 ? (d+3)&3 : (d+1)&3;
    c.moveTo(ox + (0.5+DX[side]*0.5)*z, oy + (0.5+DY[side]*0.5)*z);
    c.quadraticCurveTo(ox+0.5*z, oy+0.5*z, ex, ey);
  }
}

/* ------------------------------ structures ------------------------------ */
function drawBelt(c, e, ox, oy, z, t){
  const lw = z*0.74;
  c.lineCap = 'butt';
  c.strokeStyle = '#242c35'; c.lineWidth = lw; c.beginPath(); beltPathTrace(c,e,ox,oy,z); c.stroke();
  c.strokeStyle = e.tier>=3 ? '#43566b' : e.tier>=2 ? '#3d4d5c' : '#37424f'; c.lineWidth = lw*0.82;
  c.beginPath(); beltPathTrace(c,e,ox,oy,z); c.stroke();
  if (z >= 11){
    // scrolling chevrons
    const spd = beltVel(e), phase = (t*spd) % 1;
    const col = e.tier>=3 ? 'rgba(120,225,255,.5)' : e.tier>=2 ? 'rgba(160,215,150,.45)' : 'rgba(255,190,110,.36)';
    c.strokeStyle = col; c.lineWidth = Math.max(1, z*0.075); c.lineCap='round'; c.lineJoin='round';
    for (let k=0;k<2;k++){
      let p = (phase + k*0.5) % 1;
      const P = beltPoint(e, p), Pa = beltPoint(e, Math.min(1,p+0.09));
      const dx = Pa.x-P.x, dy = Pa.y-P.y, L = Math.hypot(dx,dy)||1;
      const ux = dx/L, uy = dy/L, px = -uy, py = ux, s = z*0.2;
      const cx = ox+P.x*z, cy = oy+P.y*z;
      c.beginPath();
      c.moveTo(cx - ux*s + px*s, cy - uy*s + py*s);
      c.lineTo(cx + ux*s*0.7, cy + uy*s*0.7);
      c.lineTo(cx - ux*s - px*s, cy - uy*s - py*s);
      c.stroke();
    }
  }
}
function drawArrowHead(c, x, y, d, s, col){
  c.fillStyle = col; c.save(); c.translate(x,y); c.rotate(d*Math.PI/2);
  c.beginPath(); c.moveTo(0,-s); c.lineTo(s*0.72,s*0.55); c.lineTo(-s*0.72,s*0.55); c.closePath(); c.fill(); c.restore();
}
function drawBody(c, e, ox, oy, w, h, z, col){
  const pad = z*0.07;
  c.fillStyle = '#0d1319'; rr(c, ox+pad*0.4, oy+pad*0.4, w-pad*0.8, h-pad*0.8, z*0.16); c.fill();
  const g = c.createLinearGradient(ox, oy, ox, oy+h);
  g.addColorStop(0, shade(col, .09)); g.addColorStop(1, shade(col, -.12));
  c.fillStyle = g; rr(c, ox+pad, oy+pad, w-pad*2, h-pad*2, z*0.14); c.fill();
  c.strokeStyle = shade(col, .18); c.lineWidth = Math.max(1, z*0.045);
  rr(c, ox+pad, oy+pad, w-pad*2, h-pad*2, z*0.14); c.stroke();
}
function drawStructure(c, e, t, ghost){
  const s = footprint(e), z = cam.z;
  const ox = w2sx(e.x), oy = w2sy(e.y), w = s.w*z, h = s.h*z;
  const cx = ox + w/2, cy = oy + h/2;
  const col = BCOL[e.type] || '#4a5566';
  const active = (e.status==='ok' || e.status===undefined) && (e.actPct>3 || e.crafting || (e.items&&e.items.length));

  if (e.type === 'belt'){ drawBelt(c, e, ox, oy, z, t); return; }

  if (e.type === 'splitter' || e.type === 'merger'){
    drawBody(c, e, ox, oy, w, h, z, col);
    const d = e.dir, dirs = e.type==='splitter' ? [(d+3)&3, d, (d+1)&3] : [(d+3)&3, opp(d), (d+1)&3];
    if (z>=10){
      for (const dd of dirs){
        const ax = cx + DX[dd]*z*0.33, ay = cy + DY[dd]*z*0.33;
        drawArrowHead(c, ax, ay, e.type==='splitter'?dd:opp(dd), z*0.15, 'rgba(255,190,110,.75)');
      }
      const od = e.type==='splitter' ? null : d;
      if (od!==null) drawArrowHead(c, cx + DX[od]*z*0.36, cy + DY[od]*z*0.36, od, z*0.18, '#ffd08a');
      c.fillStyle='#0e141a'; c.beginPath(); c.arc(cx,cy,z*0.13,0,7); c.fill();
      c.fillStyle = e.type==='splitter' ? '#ffb347' : '#7fd4ff'; c.beginPath(); c.arc(cx,cy,z*0.07,0,7); c.fill();
    }
    // items in transit
    const list = e.type==='splitter' ? e.items.map(i=>({t:i.t, x:0.5+DX[opp(e.dir)]*0.5*(1-i.p), y:0.5+DY[opp(e.dir)]*0.5*(1-i.p)}))
      : e.slots.map((sl,i)=>{ if(!sl) return null; const dd=[(e.dir+3)&3, opp(e.dir), (e.dir+1)&3][i];
          return {t:sl.t, x:0.5+DX[dd]*0.5*(1-sl.p), y:0.5+DY[dd]*0.5*(1-sl.p)}; }).filter(Boolean);
    for (const it of list) drawItem(c, it.t, ox+it.x*z, oy+it.y*z, z*0.48);
    return;
  }

  if (e.type === 'inserter'){
    c.fillStyle = '#161d25'; rr(c, ox+z*0.1, oy+z*0.1, w-z*0.2, h-z*0.2, z*0.14); c.fill();
    c.fillStyle = e.status==='ok' ? '#6b5a3a' : '#4a4030'; c.beginPath(); c.arc(cx,cy,z*0.24,0,7); c.fill();
    const swing = e.held ? clamp(e.swing,0,1) : 0.0;
    const a = (e.dir*Math.PI/2) + Math.PI - swing*Math.PI;
    const armLen = z*0.42;
    c.strokeStyle = '#c99a4e'; c.lineWidth = Math.max(1.2, z*0.09); c.lineCap='round';
    c.beginPath(); c.moveTo(cx,cy); c.lineTo(cx+Math.sin(a)*armLen, cy-Math.cos(a)*armLen); c.stroke();
    if (e.held) drawItem(c, e.held, cx+Math.sin(a)*armLen, cy-Math.cos(a)*armLen, z*0.42);
    if (z>=12){
      drawArrowHead(c, cx+DX[e.dir]*z*0.4, cy+DY[e.dir]*z*0.4, e.dir, z*0.12, 'rgba(255,200,120,.8)');
      if (e.filter){ c.fillStyle=ITEMS[e.filter].c; c.fillRect(ox+z*0.12, oy+z*0.12, z*0.14, z*0.14); }
    }
    return;
  }

  if (e.type === 'pole'){
    c.fillStyle='#2b2015'; c.beginPath(); c.arc(cx,cy,z*0.2,0,7); c.fill();
    c.fillStyle='#7a6038'; c.fillRect(cx-z*0.06, cy-z*0.34, z*0.12, z*0.68);
    c.fillRect(cx-z*0.3, cy-z*0.3, z*0.6, z*0.09);
    c.fillStyle = e.net>=0 ? '#ffd75e' : '#5c5c5c';
    c.beginPath(); c.arc(cx, cy-z*0.36, z*0.09, 0, 7); c.fill();
    return;
  }

  drawBody(c, e, ox, oy, w, h, z, col);

  if (e.type === 'miner'){
    const spin = (e.actPct>3) ? t*4.5 : 0;
    c.save(); c.translate(cx,cy);
    c.fillStyle='#1a222a'; c.beginPath(); c.arc(0,0,z*0.44,0,7); c.fill();
    c.save(); c.rotate(spin);
    c.fillStyle='#8fa4b4';
    for (let i=0;i<3;i++){ c.save(); c.rotate(i/3*Math.PI*2); c.fillRect(-z*0.06, -z*0.4, z*0.12, z*0.4); c.restore(); }
    c.restore();
    c.fillStyle = e.oreType ? ITEMS[e.oreType].c : '#556';
    c.beginPath(); c.arc(0,0,z*0.16,0,7); c.fill();
    c.restore();
    if (z>=14){
      c.strokeStyle='rgba(255,190,110,.75)'; c.lineWidth=Math.max(1.4,z*0.07);
      c.beginPath(); c.arc(cx,cy,z*0.55, -Math.PI/2, -Math.PI/2 + e.progress*Math.PI*2); c.stroke();
    }
  }
  else if (e.type === 'smelter'){
    const glow = e.crafting ? 0.55 + Math.sin(t*7)*0.3 : 0.08;
    const gx = cx, gy = cy + h*0.06;
    const rg = c.createRadialGradient(gx,gy,0,gx,gy,z*0.72);
    rg.addColorStop(0, 'rgba(255,150,40,'+glow+')'); rg.addColorStop(1, 'rgba(255,90,20,0)');
    c.fillStyle = rg; c.fillRect(ox,oy,w,h);
    c.fillStyle='#1c1410'; rr(c, cx-z*0.42, cy-z*0.18, z*0.84, z*0.52, z*0.1); c.fill();
    c.fillStyle = 'rgba(255,'+Math.round(120+glow*110)+',60,'+(0.35+glow*0.6)+')';
    rr(c, cx-z*0.34, cy-z*0.1, z*0.68, z*0.38, z*0.07); c.fill();
    c.fillStyle='#2a333c'; c.fillRect(ox+w*0.12, oy+h*0.08, w*0.16, h*0.2);
    c.fillRect(ox+w*0.72, oy+h*0.08, w*0.16, h*0.2);
  }
  else if (e.type === 'constructor'){
    const p = e.crafting ? e.progress : 0;
    const py = cy - z*0.3 + Math.abs(Math.sin(p*Math.PI*3))*z*0.34;
    c.fillStyle='#1a2620'; rr(c, cx-z*0.5, cy-z*0.05, z*1.0, z*0.5, z*0.06); c.fill();
    c.fillStyle='#8fd0ae'; rr(c, cx-z*0.34, py-z*0.12, z*0.68, z*0.2, z*0.05); c.fill();
    c.strokeStyle='#5c8a74'; c.lineWidth=Math.max(1,z*0.05);
    c.beginPath(); c.moveTo(cx-z*0.3, cy-z*0.55); c.lineTo(cx-z*0.3, py); c.moveTo(cx+z*0.3, cy-z*0.55); c.lineTo(cx+z*0.3, py); c.stroke();
  }
  else if (e.type === 'assembler'){
    c.fillStyle='#151a26'; c.beginPath(); c.arc(cx,cy,z*0.62,0,7); c.fill();
    const spin = e.crafting ? t*2.4 : t*0.25;
    c.save(); c.translate(cx,cy); c.rotate(spin);
    c.strokeStyle = e.crafting ? '#b9a8ff' : '#6b6390'; c.lineWidth=Math.max(1.4,z*0.09); c.lineCap='round';
    for (let i=0;i<3;i++){ c.save(); c.rotate(i/3*Math.PI*2);
      c.beginPath(); c.moveTo(0,0); c.lineTo(0,-z*0.5); c.stroke();
      c.fillStyle = e.crafting ? '#d8ccff' : '#5b5580'; c.beginPath(); c.arc(0,-z*0.52,z*0.1,0,7); c.fill(); c.restore(); }
    c.restore();
    c.fillStyle='#20263a'; c.beginPath(); c.arc(cx,cy,z*0.2,0,7); c.fill();
    if (e.crafting){ c.fillStyle='rgba(190,170,255,'+(0.35+0.3*Math.sin(t*9))+')'; c.beginPath(); c.arc(cx,cy,z*0.13,0,7); c.fill(); }
  }
  else if (e.type === 'generator'){
    const on = e.load > 1;
    c.fillStyle='#20161200'; 
    c.fillStyle='#241812'; rr(c, cx-z*0.75, cy-z*0.25, z*1.5, z*0.85, z*0.08); c.fill();
    // stack
    c.fillStyle='#3b2b22'; c.fillRect(cx+z*0.32, oy+h*0.1, z*0.34, z*0.62);
    if (on && z>=12){
      for (let i=0;i<3;i++){
        const pp = ((t*0.6 + i*0.33) % 1);
        c.fillStyle = 'rgba(190,180,170,'+((1-pp)*0.32)+')';
        c.beginPath(); c.arc(cx+z*0.49, oy+h*0.1 - pp*z*1.1, z*(0.1+pp*0.24), 0, 7); c.fill();
      }
    }
    // firebox
    const fg = e.fuel/e.fuelMax;
    const glow = on ? 0.5+Math.sin(t*11)*0.25 : (e.fuel>0?0.12:0);
    c.fillStyle='rgba(255,'+Math.round(110+glow*90)+',30,'+(0.2+glow)+')';
    rr(c, cx-z*0.62, cy+z*0.02, z*0.72, z*0.4, z*0.05); c.fill();
    c.fillStyle='#0e1319'; c.fillRect(cx-z*0.66, cy+z*0.52, z*1.32, z*0.16);
    c.fillStyle = fg>0.34?'#5fd68a':fg>0?'#ffcc55':'#ff6b6b'; c.fillRect(cx-z*0.66, cy+z*0.52, z*1.32*fg, z*0.16);
    if (z>=13){ c.fillStyle='rgba(255,215,94,.9)'; c.font = 'bold '+Math.round(z*0.34)+'px var(--mono),monospace'; c.textAlign='center';
      c.fillText(Math.round(e.load)+'kW', cx, oy+h*0.32); }
  }
  else if (e.type === 'storage'){
    const n = bufCount(e.store), f = clamp(n/e.cap,0,1);
    c.fillStyle='#1b1710'; rr(c, ox+z*0.22, oy+z*0.22, w-z*0.44, h-z*0.44, z*0.08); c.fill();
    const keys = Object.keys(e.store).sort((a,b)=>e.store[b]-e.store[a]).slice(0,4);
    const bx = ox+z*0.3, by = oy+z*0.3, bw = w-z*0.6, bh = h-z*0.6;
    keys.forEach((k,i)=>{ c.fillStyle = ITEMS[k].c; const cw=bw/Math.max(1,keys.length);
      c.fillRect(bx+i*cw, by+bh*(1-clamp(e.store[k]/e.cap*keys.length,0,1)), cw-1, bh*clamp(e.store[k]/e.cap*keys.length,0,1)); });
    c.strokeStyle='#8a7a55'; c.lineWidth=Math.max(1,z*0.05); rr(c, ox+z*0.22, oy+z*0.22, w-z*0.44, h-z*0.44, z*0.08); c.stroke();
    if (z>=14){ c.fillStyle='#e8d9ae'; c.font='bold '+Math.round(z*0.32)+'px monospace'; c.textAlign='center';
      c.fillText(n+'/'+e.cap, cx, oy+h-z*0.14); }
  }
  else if (e.type === 'hub'){
    const pulse = 0.5+0.5*Math.sin(t*2.2);
    c.fillStyle='#0f2130'; c.beginPath(); c.arc(cx,cy,z*0.9,0,7); c.fill();
    c.strokeStyle='rgba(90,200,255,'+(0.25+pulse*0.4)+')'; c.lineWidth=Math.max(1.5,z*0.07);
    c.beginPath(); c.arc(cx,cy,z*(0.55+pulse*0.4),0,7); c.stroke();
    c.strokeStyle='rgba(90,200,255,.35)'; c.lineWidth=Math.max(1,z*0.05);
    c.beginPath(); c.arc(cx,cy,z*0.86,0,7); c.stroke();
    c.fillStyle='#1b3d52'; c.beginPath(); c.arc(cx,cy,z*0.46,0,7); c.fill();
    const target = S.contract ? S.contract.item : 'unit';
    drawItem(c, target, cx, cy, z*0.8);
    if (z>=12){ c.fillStyle='#9fe4ff'; c.font='bold '+Math.round(z*0.3)+'px monospace'; c.textAlign='center';
      c.fillText('HUB', cx, oy+h-z*0.16); }
  }

  // output port marker
  if (z>=12 && (isMachine(e.type)||e.type==='miner')){
    const p = outPort(e);
    const px = w2sx(p.x+0.5)+DX[e.dir]*z*0.42, py = w2sy(p.y+0.5)+DY[e.dir]*z*0.42;
    drawArrowHead(c, px, py, e.dir, z*0.16, 'rgba(255,200,120,.85)');
  }
  // build-in animation
  if (e.built && t - e.built < 0.5){
    const k = (t - e.built)/0.5;
    c.strokeStyle = 'rgba(120,220,255,'+(1-k)+')'; c.lineWidth = Math.max(1.5, z*0.1);
    rr(c, ox - k*z*0.4, oy - k*z*0.4, w + k*z*0.8, h + k*z*0.8, z*0.2); c.stroke();
  }
}

/* ------------------------------ status pips ----------------------------- */
const STAT_COL = {ok:'#5fd68a', starved:'#ffcc55', blocked:'#ff8f4d', unpowered:'#ff6b6b',
                  brownout:'#ffd75e', norecipe:'#b48fff', nodeposit:'#9aa7b4', nofuel:'#ff6b6b',
                  badlink:'#ff4d6d'};
function drawStatusPip(c, e, z){
  let st = e.status;
  if (e.type==='generator') st = e.fuel<=0 ? 'nofuel' : (e.net<0 ? 'unpowered' : 'ok');
  if (!st || st==='ok') return;
  const s = footprint(e);
  const x = w2sx(e.x + s.w) - z*0.22, y = w2sy(e.y) + z*0.22;
  c.fillStyle = STAT_COL[st] || '#fff';
  c.beginPath(); c.arc(x, y, Math.max(2.5, z*0.15), 0, 7); c.fill();
  c.strokeStyle='rgba(0,0,0,.55)'; c.lineWidth=1; c.stroke();
}

/* =========================================================================
   MAIN RENDER
   ========================================================================= */
const OVERLAYS = {flow:false, graph:false, power:false, util:false, congestion:false, blocked:false, status:true};
const fx = [];   // transient particles
function spawnFx(x,y,kind,col){ fx.push({x,y,kind,col,t:0,life:kind==='deliver'?0.9:0.45}); if (fx.length>240) fx.shift(); }

function render(now){
  const t = now/1000;
  const z = cam.z;
  ctx.fillStyle = '#0a0e13'; ctx.fillRect(0,0,VW,VH);

  const x0 = Math.max(0, Math.floor(s2wx(0))-1), x1 = Math.min(S.W-1, Math.ceil(s2wx(VW))+1);
  const y0 = Math.max(0, Math.floor(s2wy(0))-1), y1 = Math.min(S.H-1, Math.ceil(s2wy(VH))+1);

  // ground
  ctx.fillStyle = '#101821';
  ctx.fillRect(w2sx(0), w2sy(0), S.W*z, S.H*z);

  // ore deposits
  if (z >= 3){
    for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
      const ii = idx(x,y), o = S.ore[ii]; if (!o) continue;
      const amt = S.oreAmt[ii];
      if (S.depositMode!=='infinite' && amt<=0) continue;
      const f = S.depositMode==='infinite' ? 0.8 : clamp(amt/(S.oreMax||1),0.08,1);
      ctx.fillStyle = ORE_COL[o-1];
      ctx.globalAlpha = 0.13 + f*0.34;
      ctx.fillRect(w2sx(x), w2sy(y), z+0.6, z+0.6);
      ctx.globalAlpha = 1;
      if (z >= 15){
        const r = mulberry32(hashStr(x+'_'+y))();
        ctx.fillStyle = ORE_COL[o-1]; ctx.globalAlpha = 0.30 + f*0.38;
        ctx.beginPath(); ctx.arc(w2sx(x)+z*(0.3+r*0.4), w2sy(y)+z*(0.3+((r*7)%1)*0.4), z*0.1*(0.6+f), 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  // grid
  if (z >= 9){
    ctx.strokeStyle = 'rgba(90,120,150,.09)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x=x0;x<=x1+1;x++){ const sx=Math.round(w2sx(x))+.5; ctx.moveTo(sx, w2sy(y0)); ctx.lineTo(sx, w2sy(y1+1)); }
    for (let y=y0;y<=y1+1;y++){ const sy=Math.round(w2sy(y))+.5; ctx.moveTo(w2sx(x0), sy); ctx.lineTo(w2sx(x1+1), sy); }
    ctx.stroke();
    if (z >= 16){
      ctx.strokeStyle = 'rgba(90,120,150,.16)'; ctx.beginPath();
      for (let x=Math.ceil(x0/8)*8; x<=x1+1; x+=8){ const sx=Math.round(w2sx(x))+.5; ctx.moveTo(sx, w2sy(y0)); ctx.lineTo(sx, w2sy(y1+1)); }
      for (let y=Math.ceil(y0/8)*8; y<=y1+1; y+=8){ const sy=Math.round(w2sy(y))+.5; ctx.moveTo(w2sx(x0), sy); ctx.lineTo(w2sx(x1+1), sy); }
      ctx.stroke();
    }
  }
  // world border
  ctx.strokeStyle = 'rgba(120,160,200,.28)'; ctx.lineWidth = 2;
  ctx.strokeRect(w2sx(0), w2sy(0), S.W*z, S.H*z);

  /* ---- power overlay (below structures) ---- */
  if (OVERLAYS.power){
    const NETC = ['#ffd75e','#7fd4ff','#a0ff9c','#ff9ecb','#c9a6ff','#ffb37f'];
    for (const p of S.list.poles){
      if (p.net<0) continue;
      const net = S.nets[p.net]; const col = NETC[p.net % NETC.length];
      ctx.fillStyle = col; ctx.globalAlpha = net.sat<0.999 ? 0.10+0.06*Math.sin(t*8) : 0.07;
      ctx.fillRect(w2sx(p.x-POLE_AREA), w2sy(p.y-POLE_AREA), (POLE_AREA*2+1)*z, (POLE_AREA*2+1)*z);
      ctx.globalAlpha = 1;
    }
    // wires
    ctx.lineWidth = Math.max(1, z*0.04);
    for (let i=0;i<S.list.poles.length;i++) for (let j=i+1;j<S.list.poles.length;j++){
      const a=S.list.poles[i], b=S.list.poles[j];
      const dx=a.x-b.x, dy=a.y-b.y; if (dx*dx+dy*dy > POLE_REACH*POLE_REACH) continue;
      const col = NETC[(a.net<0?0:a.net) % NETC.length];
      ctx.strokeStyle = col; ctx.globalAlpha = 0.5;
      ctx.beginPath(); ctx.moveTo(w2sx(a.x+.5), w2sy(a.y+.5)-z*0.36); ctx.lineTo(w2sx(b.x+.5), w2sy(b.y+.5)-z*0.36); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  if (OVERLAYS.util || OVERLAYS.congestion){
    for (const e of S.list.all){
      const s = footprint(e);
      if (e.x>x1||e.y>y1||e.x+s.w<x0||e.y+s.h<y0) continue;
      let v = -1;
      if (OVERLAYS.util && (isMachine(e.type)||e.type==='miner'||e.type==='inserter')) v = (e.actPct||0)/100;
      if (OVERLAYS.congestion && e.items) v = e.items.length/Math.max(1,S.itemDensity);
      if (OVERLAYS.congestion && e.slots) v = e.slots.filter(Boolean).length/3;
      if (v < 0) continue;
      const hue = OVERLAYS.util ? v*120 : (1-v)*120;
      ctx.fillStyle = 'hsla('+hue+',85%,55%,'+(0.16+v*0.42)+')';
      ctx.fillRect(w2sx(e.x), w2sy(e.y), s.w*z, s.h*z);
    }
  }

  /* ---- structures ---- */
  const vis = [];
  for (const e of S.list.all){
    const s = footprint(e);
    if (e.x > x1+1 || e.y > y1+1 || e.x+s.w < x0-1 || e.y+s.h < y0-1) continue;
    vis.push(e);
  }
  const lod = z < 11;
  if (lod){
    // far zoom: one stroked path per belt tier keeps thousands of tiles cheap
    const byTier = [[],[],[]];
    for (const e of vis) if (e.type==='belt') byTier[e.tier-1].push(e);
    const cols = ['#37424f','#3d4d5c','#43566b'];
    ctx.lineCap = 'butt';
    for (let ti=0; ti<3; ti++){
      const list = byTier[ti]; if (!list.length) continue;
      ctx.beginPath();
      for (const e of list) beltPathTrace(ctx, e, w2sx(e.x), w2sy(e.y), z);
      ctx.strokeStyle = '#242c35'; ctx.lineWidth = z*0.74; ctx.stroke();
      ctx.strokeStyle = cols[ti]; ctx.lineWidth = z*0.6; ctx.stroke();
    }
    for (const e of vis) if (e.type!=='belt') drawStructure(ctx, e, t);
  } else {
    for (const e of vis) drawStructure(ctx, e, t);
  }

  /* ---- items on belts ---- */
  const isz = z*0.46;
  if (z >= 3){
    if (isz < 4.5){
      // far zoom: bucket by item type so fillStyle is set once per colour
      const buckets = new Map();
      for (const e of vis){
        if (e.type !== 'belt' || !e.items.length) continue;
        const ox = w2sx(e.x), oy = w2sy(e.y);
        for (const it of e.items){
          const P = beltPoint(e, it.p);
          let a = buckets.get(it.t); if (!a){ a = []; buckets.set(it.t, a); }
          a.push(ox+P.x*z, oy+P.y*z);
        }
      }
      const sq = Math.max(1.4, isz*0.9), h2 = sq/2;
      for (const [k, a] of buckets){
        ctx.fillStyle = ITEMS[k] ? ITEMS[k].c : '#fff';
        for (let i=0;i<a.length;i+=2) ctx.fillRect(a[i]-h2, a[i+1]-h2, sq, sq);
      }
    } else {
      for (const e of vis){
        if (e.type !== 'belt' || !e.items.length) continue;
        const ox = w2sx(e.x), oy = w2sy(e.y);
        for (const it of e.items){
          const P = beltPoint(e, it.p);
          drawItem(ctx, it.t, ox+P.x*z, oy+P.y*z, isz);
        }
      }
    }
  }

  /* ---- overlays above ---- */
  if (OVERLAYS.flow){
    ctx.lineWidth = Math.max(1, z*0.05);
    for (const e of vis){
      if (!(e.type==='belt'||e.type==='splitter'||e.type==='merger'||e.type==='inserter')) continue;
      const s = footprint(e), cx = w2sx(e.x+s.w/2), cy = w2sy(e.y+s.h/2);
      drawArrowHead(ctx, cx+DX[e.dir]*z*0.26, cy+DY[e.dir]*z*0.26, e.dir, z*0.2, 'rgba(120,230,255,.85)');
    }
  }
  if (OVERLAYS.graph){
    ctx.strokeStyle = 'rgba(120,255,190,.5)'; ctx.lineWidth = Math.max(1, z*0.05);
    ctx.beginPath();
    for (const e of vis){
      const links = outLinks(e);
      const c0 = entCenter(e);
      for (const L of links){
        const tgt = entAt(L.x, L.y); if (!tgt) continue;
        const c1 = entCenter(tgt);
        ctx.moveTo(w2sx(c0.x), w2sy(c0.y)); ctx.lineTo(w2sx(c1.x), w2sy(c1.y));
      }
    }
    ctx.stroke();
    ctx.fillStyle = 'rgba(120,255,190,.85)';
    for (const e of vis){ const c0 = entCenter(e); ctx.beginPath(); ctx.arc(w2sx(c0.x), w2sy(c0.y), Math.max(1.5,z*0.07), 0, 7); ctx.fill(); }
  }
  if (OVERLAYS.blocked){
    for (const e of vis){
      const st = e.type==='generator' ? (e.fuel<=0?'nofuel':null) : e.status;
      if (!st || st==='ok') continue;
      const s = footprint(e);
      ctx.strokeStyle = STAT_COL[st] || '#f66'; ctx.lineWidth = Math.max(1.5, z*0.07);
      ctx.setLineDash([z*0.2, z*0.14]);
      ctx.strokeRect(w2sx(e.x)+2, w2sy(e.y)+2, s.w*z-4, s.h*z-4);
      ctx.setLineDash([]);
    }
  }
  if (OVERLAYS.status && z>=8) for (const e of vis) drawStatusPip(ctx, e, z);
  if (z >= 9){
    // structurally impossible hand-offs are always called out, overlays or not
    for (const e of vis){
      if (!linkProblem(e)) continue;
      let d, mx, my;
      if (isMachine(e.type)||e.type==='miner'){ const p=outPort(e); d=e.dir; mx=p.x+0.5+DX[d]*0.5; my=p.y+0.5+DY[d]*0.5; }
      else { d=e.dir; mx=e.x+0.5+DX[d]*0.5; my=e.y+0.5+DY[d]*0.5; }
      const sx = w2sx(mx), sy = w2sy(my), r = Math.max(3, z*0.19);
      ctx.fillStyle = 'rgba(255,77,109,'+(0.65+0.3*Math.sin(t*6))+')';
      ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill();
      ctx.strokeStyle = '#2a0d13'; ctx.lineWidth = Math.max(1, z*0.05); ctx.stroke();
      ctx.fillStyle = '#2a0d13'; ctx.fillRect(sx-r*0.11, sy-r*0.52, r*0.22, r*0.6);
      ctx.fillRect(sx-r*0.11, sy+r*0.2, r*0.22, r*0.22);
    }
  }

  /* ---- power pulses along wires ---- */
  if (z>=10){
    for (let i=0;i<S.list.poles.length;i++){
      const p = S.list.poles[i]; if (p.net<0) continue;
      const net = S.nets[p.net]; if (!net || net.produced<=0) continue;
      const ph = ((t*1.6 + i*0.27) % 1);
      ctx.fillStyle = 'rgba(255,215,94,'+(0.65*(1-Math.abs(ph*2-1)))+')';
      ctx.beginPath(); ctx.arc(w2sx(p.x+.5), w2sy(p.y+.5)-z*0.36-ph*z*0.15, Math.max(1,z*0.07), 0, 7); ctx.fill();
    }
  }

  /* ---- transient effects ---- */
  for (let i=fx.length-1;i>=0;i--){
    const f = fx[i]; f.t += 1/60;
    if (f.t >= f.life){ fx.splice(i,1); continue; }
    const k = f.t/f.life;
    const sx = w2sx(f.x), sy = w2sy(f.y);
    if (f.kind==='deliver'){
      ctx.strokeStyle = 'rgba(127,217,255,'+(1-k)+')'; ctx.lineWidth=Math.max(1,z*0.06);
      ctx.beginPath(); ctx.arc(sx, sy, z*(0.4+k*1.6), 0, 7); ctx.stroke();
    } else if (f.kind==='build'){
      ctx.fillStyle = 'rgba(160,230,255,'+(1-k)*0.6+')';
      for (let a=0;a<6;a++){ const an=a/6*Math.PI*2; ctx.beginPath();
        ctx.arc(sx+Math.cos(an)*z*k*1.1, sy+Math.sin(an)*z*k*1.1, z*0.09*(1-k), 0, 7); ctx.fill(); }
    } else {
      ctx.fillStyle = 'rgba(255,120,80,'+(1-k)*0.7+')';
      ctx.beginPath(); ctx.arc(sx, sy, z*0.4*(1-k)+2, 0, 7); ctx.fill();
    }
  }

  /* ---- tool preview ---- */
  drawToolPreview(ctx, t);

  /* ---- selection ---- */
  if (sel && S.ents.has(sel.id)){
    const s = footprint(sel);
    ctx.strokeStyle = '#ffb347'; ctx.lineWidth = Math.max(1.6, z*0.07);
    ctx.setLineDash([z*0.28, z*0.16]); ctx.lineDashOffset = -t*z*0.6;
    rr(ctx, w2sx(sel.x)-2, w2sy(sel.y)-2, s.w*z+4, s.h*z+4, z*0.18); ctx.stroke();
    ctx.setLineDash([]); ctx.lineDashOffset = 0;
  }
}
function outLinks(e){
  const out = [];
  if (e.type==='belt'){ out.push({x:e.x+DX[e.dir], y:e.y+DY[e.dir]}); }
  else if (e.type==='splitter'){ const d=e.dir; for (const dd of [(d+3)&3,d,(d+1)&3]) out.push({x:e.x+DX[dd], y:e.y+DY[dd]}); }
  else if (e.type==='merger'||e.type==='inserter'){ out.push({x:e.x+DX[e.dir], y:e.y+DY[e.dir]}); }
  else if (isMachine(e.type)||e.type==='miner'||e.type==='storage'){ const p=outPort(e); out.push({x:p.tx, y:p.ty}); }
  return out;
}

/* =========================================================================
   TOOLS & INPUT
   ========================================================================= */
let tool = 'build', curType = 'belt', curDir = 1;
let hover = {x:-1, y:-1}, mouse = {x:0, y:0, over:false};
let drag = null, sel = null, clipboard = null, pasteBp = null, areaSel = null;
let panKeys = {};

function setTool(t, type){
  tool = t;
  if (type) curType = type;
  if (t!=='paste') pasteBp = null;
  if (t!=='area') areaSel = null;
  refreshPalette(); updateHints();
}
function setBuild(type){ setTool('build', type); status('Build: '+B[type].name+'  —  '+B[type].desc); }

function routeL(x0,y0,x1,y1,axis){
  const pts=[];
  const sx = Math.sign(x1-x0), sy = Math.sign(y1-y0);
  if (axis==='h'){
    for (let x=x0; x!==x1; x+=sx) pts.push({x, y:y0});
    for (let y=y0; y!==y1; y+=sy) pts.push({x:x1, y});
  } else {
    for (let y=y0; y!==y1; y+=sy) pts.push({x:x0, y});
    for (let x=x0; x!==x1; x+=sx) pts.push({x, y:y1});
  }
  pts.push({x:x1, y:y1});
  return pts;
}
function pathSpecs(pts, type, fallbackDir){
  const out = [];
  for (let i=0;i<pts.length;i++){
    let d = fallbackDir;
    if (i < pts.length-1){
      const dx = pts[i+1].x-pts[i].x, dy = pts[i+1].y-pts[i].y;
      d = dx>0?1:dx<0?3:dy>0?2:0;
    } else if (pts.length>1){
      const dx = pts[i].x-pts[i-1].x, dy = pts[i].y-pts[i-1].y;
      d = dx>0?1:dx<0?3:dy>0?2:0;
    }
    out.push({type, x:pts[i].x, y:pts[i].y, dir:d, replace:true});
  }
  return out;
}
function polePath(x0,y0,x1,y1){
  const dx=x1-x0, dy=y1-y0, len=Math.max(Math.abs(dx),Math.abs(dy));
  const step = POLE_REACH-2;
  const pts=[]; const n = Math.max(1, Math.ceil(len/step));
  for (let i=0;i<=n;i++){
    const x = Math.round(x0 + dx*i/n), y = Math.round(y0 + dy*i/n);
    if (!pts.some(p=>p.x===x&&p.y===y)) pts.push({x,y});
  }
  return pts.map(p=>({type:'pole', x:p.x, y:p.y, dir:0}));
}

function currentDragSpecs(){
  if (!drag) return null;
  if (drag.mode==='belt'){
    const pts = routeL(drag.sx, drag.sy, hover.x, hover.y, drag.axis);
    return pathSpecs(pts, curType, curDir);
  }
  if (drag.mode==='poles') return polePath(drag.sx, drag.sy, hover.x, hover.y);
  return null;
}

function drawToolPreview(c, t){
  const z = cam.z;
  if (!mouse.over && !drag) return;
  // area / delete rectangles
  if (drag && (drag.mode==='rect' || drag.mode==='area')){
    const xa=Math.min(drag.sx,hover.x), xb=Math.max(drag.sx,hover.x);
    const ya=Math.min(drag.sy,hover.y), yb=Math.max(drag.sy,hover.y);
    c.fillStyle = drag.mode==='rect' ? 'rgba(255,80,80,.16)' : 'rgba(120,220,255,.14)';
    c.fillRect(w2sx(xa), w2sy(ya), (xb-xa+1)*z, (yb-ya+1)*z);
    c.strokeStyle = drag.mode==='rect' ? '#ff6b6b' : '#7fd4ff'; c.lineWidth=2;
    c.setLineDash([6,4]); c.strokeRect(w2sx(xa)+1, w2sy(ya)+1, (xb-xa+1)*z-2, (yb-ya+1)*z-2); c.setLineDash([]);
    c.fillStyle = '#dff'; c.font='bold 12px monospace'; c.textAlign='left';
    c.fillText((xb-xa+1)+'×'+(yb-ya+1), w2sx(xa)+4, w2sy(ya)-5);
    return;
  }
  if (areaSel){
    const {x0,y0,x1,y1} = areaSel;
    c.strokeStyle='rgba(127,212,255,.85)'; c.lineWidth=2; c.setLineDash([7,5]); c.lineDashOffset=-t*12;
    c.strokeRect(w2sx(x0)+1, w2sy(y0)+1, (x1-x0+1)*z-2, (y1-y0+1)*z-2); c.setLineDash([]); c.lineDashOffset=0;
  }
  // drag path preview
  const specs = currentDragSpecs();
  if (specs){
    for (const sp of specs) drawGhost(c, sp, t);
    c.fillStyle='#cfe8ff'; c.font='bold 12px monospace'; c.textAlign='left';
    const cost = specs.reduce((a,s)=>a+costOf(s.type,1,'none'),0);
    c.fillText(specs.length+' × '+B[specs[0].type].name + (S.costMode!=='free'?('  ('+cost+'¢)'):''), w2sx(hover.x)+z*0.7, w2sy(hover.y)-6);
    return;
  }
  if (tool==='paste' && pasteBp){
    const ox = hover.x - (pasteBp.w>>1), oy = hover.y - (pasteBp.h>>1);
    for (const sp of blueprintSpecs(pasteBp, ox, oy)) drawGhost(c, sp, t);
    c.strokeStyle='rgba(127,212,255,.6)'; c.lineWidth=1.5;
    c.strokeRect(w2sx(ox), w2sy(oy), pasteBp.w*z, pasteBp.h*z);
    return;
  }
  if (tool==='build' && inBounds(hover.x,hover.y)) drawGhost(c, {type:curType, x:hover.x, y:hover.y, dir:curDir}, t);
  if ((tool==='delete'||tool==='upgrade'||tool==='pick'||tool==='select') && inBounds(hover.x,hover.y)){
    const e = entAt(hover.x,hover.y);
    if (e){ const s=footprint(e);
      c.strokeStyle = tool==='delete' ? 'rgba(255,107,107,.9)' : 'rgba(127,212,255,.8)'; c.lineWidth=2;
      rr(c, w2sx(e.x)+1, w2sy(e.y)+1, s.w*z-2, s.h*z-2, z*0.15); c.stroke();
    } else if (tool==='delete'||tool==='select'){
      c.strokeStyle='rgba(140,170,200,.35)'; c.lineWidth=1;
      c.strokeRect(w2sx(hover.x)+.5, w2sy(hover.y)+.5, z-1, z-1);
    }
  }
}
function drawGhost(c, sp, t){
  const z = cam.z, s = sizeOf(sp.type, sp.dir);
  const ok = !placementProblemGhost(sp);
  const ox = w2sx(sp.x), oy = w2sy(sp.y);
  c.globalAlpha = 0.55;
  const tmp = makeEntity(sp.type, sp.x, sp.y, sp.dir);
  S.nextId--;   // ghost must not consume an id
  if (tmp.type==='belt'){ tmp.shape = 0; }
  drawStructure(c, tmp, t, true);
  c.globalAlpha = 1;
  c.strokeStyle = ok ? 'rgba(110,240,160,.95)' : 'rgba(255,90,90,.95)';
  c.lineWidth = Math.max(1.5, z*0.06);
  rr(c, ox+1, oy+1, s.w*z-2, s.h*z-2, z*0.14); c.stroke();
  if (!ok){
    c.strokeStyle='rgba(255,90,90,.8)'; c.beginPath();
    c.moveTo(ox+3, oy+3); c.lineTo(ox+s.w*z-3, oy+s.h*z-3);
    c.moveTo(ox+s.w*z-3, oy+3); c.lineTo(ox+3, oy+s.h*z-3); c.stroke();
  }
}
function placementProblemGhost(sp){
  const s = sizeOf(sp.type, sp.dir);
  if (sp.x<0||sp.y<0||sp.x+s.w>S.W||sp.y+s.h>S.H) return 'out of bounds';
  for (let j=0;j<s.h;j++) for (let i=0;i<s.w;i++){
    const id = S.cells[idx(sp.x+i, sp.y+j)];
    if (id){
      const o = S.ents.get(id);
      const overBelt = o && (o.type==='belt'||o.type==='splitter'||o.type==='merger');
      if (!(sp.replace && overBelt && sp.type==='belt')) return 'occupied';
    }
  }
  if (sp.type==='miner' && placementProblemNoBudget(sp.type, sp.x, sp.y, sp.dir)) return 'no deposit';
  if (S.costMode!=='free' && costOf(sp.type,1,'none') > budgetLeft()) return 'no budget';
  return null;
}

/* ------------------------------- pointer -------------------------------- */
function evTile(ev){
  const r = cv.getBoundingClientRect();
  const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
  return {x: Math.floor(s2wx(sx)), y: Math.floor(s2wy(sy)), sx, sy};
}
const pointers = new Map();
let pinch = null, lastClient = {x:0, y:0};

cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', ev => {
  try { cv.setPointerCapture(ev.pointerId); } catch(err){ /* capture is a nicety, never a requirement */ }
  pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  audioUnlock();
  const p = evTile(ev);
  lastClient = {x:ev.clientX, y:ev.clientY};
  hover.x = p.x; hover.y = p.y; mouse.over = true;

  if (pointers.size === 2){
    const it = [...pointers.values()];
    pinch = {d: Math.hypot(it[0].x-it[1].x, it[0].y-it[1].y), z: cam.z,
             cx:(it[0].x+it[1].x)/2, cy:(it[0].y+it[1].y)/2, wx:cam.x, wy:cam.y};
    drag = null; return;
  }
  const panBtn = (ev.button===1) || (ev.button===2) || panKeys[' '];
  if (panBtn){
    drag = {mode:'pan', sx:ev.clientX, sy:ev.clientY, cx:cam.x, cy:cam.y, btn:ev.button, moved:0};
    cv.style.cursor='grabbing'; return;
  }
  if (ev.pointerType==='touch' && (tool==='select')){
    drag = {mode:'pan', sx:ev.clientX, sy:ev.clientY, cx:cam.x, cy:cam.y, btn:-1, moved:0};
    return;
  }
  startToolDrag(p);
});
function startToolDrag(p){
  if (!inBounds(p.x,p.y)) return;
  switch (tool){
    case 'build':
      if (curType==='belt') drag = {mode:'belt', sx:p.x, sy:p.y, axis:null};
      else if (curType==='pole') drag = {mode:'poles', sx:p.x, sy:p.y};
      else { doBuildAt(p.x,p.y); drag = {mode:'stamp', last:p.x+','+p.y}; }
      break;
    case 'delete': drag = {mode:'rect', sx:p.x, sy:p.y}; break;
    case 'area': drag = {mode:'area', sx:p.x, sy:p.y}; break;
    case 'paste': doPaste(p.x, p.y); break;
    case 'pick': doPick(p.x, p.y); break;
    case 'upgrade': doUpgrade(p.x, p.y); break;
    default: {
      const e = entAt(p.x,p.y);
      selectEnt(e); sfx('click');
      drag = {mode:'pan', sx:p.sx===undefined?0:lastClient.x, sy:p.sy===undefined?0:lastClient.y,
              cx:cam.x, cy:cam.y, btn:-1, moved:0};
      break;
    }
  }
}
window.addEventListener('pointermove', ev => {
  if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  const r = cv.getBoundingClientRect();
  mouse.x = ev.clientX - r.left; mouse.y = ev.clientY - r.top;
  mouse.over = mouse.x>=0 && mouse.y>=0 && mouse.x<=r.width && mouse.y<=r.height;
  if (pinch && pointers.size===2){
    const it = [...pointers.values()];
    const d = Math.hypot(it[0].x-it[1].x, it[0].y-it[1].y);
    cam.z = cam.tz = clamp(pinch.z * (d/Math.max(1,pinch.d)), 5, 70);
    const ncx=(it[0].x+it[1].x)/2, ncy=(it[0].y+it[1].y)/2;
    cam.x = pinch.wx - (ncx-pinch.cx)/cam.z; cam.y = pinch.wy - (ncy-pinch.cy)/cam.z;
    return;
  }
  const p = {x: Math.floor(s2wx(mouse.x)), y: Math.floor(s2wy(mouse.y))};
  const changed = (p.x!==hover.x || p.y!==hover.y);
  hover.x = p.x; hover.y = p.y;
  if (!drag){ if (changed) updateTooltip(); return; }
  if (drag.mode==='pan'){
    const dx = ev.clientX-drag.sx, dy = ev.clientY-drag.sy;
    drag.moved = Math.max(drag.moved||0, Math.abs(dx)+Math.abs(dy));
    if (!drag.noPan){ cam.x = drag.cx - dx/cam.z; cam.y = drag.cy - dy/cam.z; }
    return;
  }
  if (drag.mode==='belt' && drag.axis===null && changed){
    const dx = Math.abs(hover.x-drag.sx), dy = Math.abs(hover.y-drag.sy);
    if (dx||dy) drag.axis = dx>=dy ? 'h' : 'v';
  }
  if (drag.mode==='stamp' && changed){
    const key = hover.x+','+hover.y;
    if (key !== drag.last){ drag.last = key; doBuildAt(hover.x, hover.y, true); }
  }
  if (changed) updateTooltip();
});
window.addEventListener('pointerup', ev => {
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinch = null;
  cv.style.cursor = '';
  if (!drag) return;
  const d = drag; drag = null;
  if (d.mode==='pan'){
    if (d.btn===2 && (d.moved||0) < 5){ quickDelete(hover.x, hover.y); }
    return;
  }
  if (d.mode==='belt' || d.mode==='poles'){
    const specs = d.mode==='belt' ? pathSpecs(routeL(d.sx,d.sy,hover.x,hover.y, d.axis||'h'), curType, curDir)
                                  : polePath(d.sx,d.sy,hover.x,hover.y);
    const n0 = S.ents.size;
    if (buildMany(specs, 'lay '+B[specs[0].type].name+' ×'+specs.length)){
      sfx('build'); spawnFx(hover.x+.5, hover.y+.5, 'build');
      status('Placed '+(S.ents.size-n0)+' × '+B[specs[0].type].name);
    }
    return;
  }
  if (d.mode==='rect'){
    if (deleteRect(d.sx,d.sy,hover.x,hover.y)){ sfx('delete'); status('Deleted structures'); }
    return;
  }
  if (d.mode==='area'){
    areaSel = {x0:Math.min(d.sx,hover.x), y0:Math.min(d.sy,hover.y), x1:Math.max(d.sx,hover.x), y1:Math.max(d.sy,hover.y)};
    const bp = captureBlueprint(areaSel.x0,areaSel.y0,areaSel.x1,areaSel.y1);
    status(bp ? ('Selected '+bp.parts.length+' structures — use Copy / Cut / Delete') : 'Empty selection');
    renderSide(); sfx('click');
    return;
  }
});
cv.addEventListener('pointerleave', ()=>{ mouse.over=false; $('tooltip').style.display='none'; });

cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect();
  const mx = ev.clientX-r.left, my = ev.clientY-r.top;
  const wx = s2wx(mx), wy = s2wy(my);
  const f = Math.pow(1.0016, -ev.deltaY);
  cam.z = cam.tz = clamp(cam.z*f, 5, 70);
  cam.x = wx - (mx-VW/2)/cam.z; cam.y = wy - (my-VH/2)/cam.z;
}, {passive:false});

/* ------------------------------ tool actions ----------------------------- */
function doBuildAt(x,y,quiet){
  const opts = {};
  if (isMachine(curType)) opts.recipe = lastRecipe[curType] || defaultRecipe(curType);
  if (build(curType, x, y, curDir, {...opts, quiet})){
    const e = entAt(x,y); if (e) e.built = performance.now()/1000;
    sfx('build'); spawnFx(x+0.5, y+0.5, 'build');
    status('Built '+B[curType].name+' at '+x+','+y);
    if (isMachine(curType)) selectEnt(entAt(x,y));
  }
}
function quickDelete(x,y){
  const e = entAt(x,y); if (!e) return;
  if (e.type==='hub' && S.mode==='campaign'){ toast('The Delivery Hub is fixed in campaign mode','err'); return; }
  const s = footprint(e);
  if (deleteRect(e.x,e.y,e.x+s.w-1,e.y+s.h-1)){ sfx('delete'); spawnFx(x+.5,y+.5,'pop'); status('Removed '+B[e.type].name); if (sel===e) selectEnt(null); }
}
function doPick(x,y){
  const e = entAt(x,y);
  if (!e){ toast('Nothing to pick here'); return; }
  curType = e.type; curDir = e.dir;
  if (e.recipe) lastRecipe[e.type] = e.recipe;
  pickTier = e.tier; pickModule = e.module;
  setTool('build', e.type);
  status('Picked '+B[e.type].name+(e.recipe?' ('+RECIPES[e.recipe].name+')':'')+' — tier '+e.tier);
  sfx('click');
}
function doUpgrade(x,y){
  const e = entAt(x,y);
  if (!e){ return; }
  if (e.tier >= 3){ toast('Already at max tier'); return; }
  if (modifyEnt(e, {tier:e.tier+1}, 'upgrade '+B[e.type].name)){ sfx('upgrade'); status(B[e.type].name+' upgraded to tier '+(e.tier+1)); renderSide(); }
}
function doPaste(x,y){
  if (!pasteBp) return;
  const ox = x - (pasteBp.w>>1), oy = y - (pasteBp.h>>1);
  const specs = blueprintSpecs(pasteBp, ox, oy);
  if (buildMany(specs, 'paste ×'+specs.length)){ sfx('build'); spawnFx(x+.5,y+.5,'build'); status('Pasted '+specs.length+' structures'); }
  else { toast('Nothing placed — blocked or over budget','err'); sfx('deny'); }
}
function selectEnt(e){
  sel = e || null;
  if (sel) areaSel = null;
  renderSide();
}
let lastRecipe = {}, pickTier = 1, pickModule = 'none';

/* -------------------------------- tooltip -------------------------------- */
function updateTooltip(){
  const tt = $('tooltip');
  if (!mouse.over || drag){ tt.style.display='none'; return; }
  const e = entAt(hover.x, hover.y);
  const ii = inBounds(hover.x,hover.y) ? idx(hover.x,hover.y) : -1;
  if (!e){
    if (ii>=0 && S.ore[ii]>0 && (S.depositMode==='infinite'||S.oreAmt[ii]>0)){
      const k = ORE_TYPES[S.ore[ii]-1];
      tt.innerHTML = '<div class="tt">'+itemName(k)+' deposit</div><div class="r">'+
        (S.depositMode==='infinite'?'infinite':fmtInt(S.oreAmt[ii])+' units left')+'</div>';
      placeTip(tt); return;
    }
    tt.style.display='none'; return;
  }
  let h = '<div class="tt">'+B[e.type].name+(e.tier>1?(' <span style="color:#7fd4ff">T'+e.tier+'</span>'):'')+'</div>';
  const rows = [];
  if (e.recipe && RECIPES[e.recipe]) rows.push('Recipe: '+RECIPES[e.recipe].name);
  if (e.status) rows.push('Status: '+statusLabel(e.status));
  { const lp = linkProblem(e); if (lp) rows.push('<span style="color:#ff4d6d">⚠ '+lp+'</span>'); }
  if (e.oreType) rows.push('Ore: '+itemName(e.oreType)+'  ('+Math.round(e.rich*100)+'% rich)');
  if (e.actPct!==undefined) rows.push('Utilisation: '+Math.round(e.actPct)+'%');

  if (e.slots) rows.push('Slots: '+e.slots.filter(Boolean).length+'/3   '+fmt(e.rate||0,1)+'/s');
  if (e.store) rows.push('Stored: '+bufCount(e.store)+'/'+e.cap);
  if (e.fuel!==undefined) rows.push('Fuel: '+e.fuel+'/'+e.fuelMax+'   '+fmtPow(e.load||0));
  if (e.in && bufCount(e.in)) rows.push('In: '+Object.entries(e.in).map(([k,v])=>itemName(k)+'×'+v).join(', '));
  if (e.out && bufCount(e.out)) rows.push('Out: '+Object.entries(e.out).map(([k,v])=>itemName(k)+'×'+v).join(', '));
  if (consumesPower(e.type)) rows.push('Power: '+fmtPow(e.demand||0)+(e.net<0?' (unconnected)':' • net '+e.net));
  h += '<div class="r">'+rows.join('<br>')+'</div>';
  tt.innerHTML = h; placeTip(tt);
}
function placeTip(tt){
  tt.style.display='block';

  let x = mouse.x + 16, y = mouse.y + 16;
  if (x + w > VW-6) x = mouse.x - w - 12;

}

/* ------------------------------- keyboard -------------------------------- */
const KEYMAP = {};
for (const k of BKEYS) KEYMAP[B[k].key.toLowerCase()] = k;
window.addEventListener('keydown', ev => {
  const tag = (ev.target && ev.target.tagName) || '';
  if (tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  const k = ev.key.toLowerCase();
  panKeys[ev.key] = true;
  if (ev.ctrlKey || ev.metaKey){
    if (k==='z'){ ev.preventDefault(); ev.shiftKey ? doRedo() : doUndo(); return; }
    if (k==='y'){ ev.preventDefault(); doRedo(); return; }
    if (k==='c'){ if (areaSel) copyArea(); return; }
    if (k==='x'){ if (areaSel) cutArea(); return; }
    if (k==='v'){ if (clipboard){ pasteBp = clipboard; setTool('paste'); } return; }
    if (k==='s'){ ev.preventDefault(); saveToSlot(); return; }
    return;
  }
  if (ev.shiftKey && '1234567'.includes(k)){
    const names = ['flow','graph','power','util','congestion','blocked','status'];
    toggleOverlay(names[+k-1]); ev.preventDefault(); return;
  }
  audioUnlock();
  if (KEYMAP[k]){ setBuild(KEYMAP[k]); ev.preventDefault(); return; }
  switch (k){
    case 'r': curDir = ev.shiftKey ? (curDir+3)&3 : (curDir+1)&3;
      if (tool==='paste' && pasteBp){ pasteBp = rotateBlueprint(pasteBp); }
      else if (sel && tool==='select'){ modifyEnt(sel, {dir:(sel.dir+1)&3}, 'rotate'); sel = S.ents.get(sel.id) || null; renderSide(); }
      status('Facing '+DIRNAME[curDir]); sfx('click'); updateHints(); break;
    case 'q': setTool('select'); status('Inspect tool'); break;
    case 'e': setTool('pick'); status('Eyedropper — click a structure to copy its settings'); break;
    case 'x': case 'delete': case 'backspace': setTool('delete'); status('Delete tool — drag for area delete'); break;
    case 'u': setTool('upgrade'); status('Upgrade tool — click to raise tier'); break;
    case 'm': setTool('area'); status('Area select — drag a rectangle'); break;
    case 'v': if (clipboard){ pasteBp = clipboard; setTool('paste'); status('Paste — click to place, R to rotate'); } break;
    case ' ': ev.preventDefault(); togglePause(); break;
    case '.': stepOnce(); break;
    case '[': changeSpeed(-1); break;
    case ']': changeSpeed(1); break;
    case 'h': showHelp(); break;
    case 'f': fitFactory(); break;
    case 'escape': setTool('select'); areaSel=null; pasteBp=null; selectEnt(null); closeModal(); break;
    case 'g': OVERLAYS.graph = !OVERLAYS.graph; refreshOverlayBar(); break;
  }
});

/* =========================================================================
   AUDIO — procedural, unlocked on first gesture
   ========================================================================= */
let AC = null, masterGain = null, audioOn = true, ambGain = null, ambOsc = null;
function audioUnlock(){
  if (AC) { if (AC.state==='suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext||window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = 0.32; masterGain.connect(AC.destination);
    // factory ambience: filtered noise + low drone, gated by activity
    const buf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i=0;i<d.length;i++){ const w=(Math.random()*2-1); last = last*0.94 + w*0.06; d[i]=last*3.2; }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const flt = AC.createBiquadFilter(); flt.type='bandpass'; flt.frequency.value=220; flt.Q.value=1.1;
    ambGain = AC.createGain(); ambGain.gain.value = 0;
    src.connect(flt); flt.connect(ambGain); ambGain.connect(masterGain); src.start();
    ambOsc = AC.createOscillator(); ambOsc.type='sine'; ambOsc.frequency.value=54;
    const og = AC.createGain(); og.gain.value=0.09; ambOsc.connect(og); og.connect(ambGain); ambOsc.start();
    $('audioState') && ($('audioState').textContent = 'on');
  } catch(err){ AC = null; }
}
function tone(freq, dur, type, vol, slideTo){
  if (!AC || !audioOn) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'square'; o.frequency.setValueAtTime(freq, AC.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), AC.currentTime+dur);
  g.gain.setValueAtTime(0.0001, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(vol||0.16, AC.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
  o.connect(g); g.connect(masterGain); o.start(); o.stop(AC.currentTime+dur+0.02);
}
function noiseBurst(dur, freq, vol){
  if (!AC || !audioOn) return;
  const n = Math.floor(AC.sampleRate*dur);
  const b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 2.2);
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||900; f.Q.value=1.4;
  const g = AC.createGain(); g.gain.value = vol||0.2;
  s.connect(f); f.connect(g); g.connect(masterGain); s.start();
}
function sfx(kind){
  if (!AC || !audioOn) return;
  switch (kind){
    case 'click':   tone(620, 0.045, 'square', 0.08); break;
    case 'build':   tone(300, 0.07, 'square', 0.13, 520); noiseBurst(0.07, 1400, 0.11); break;
    case 'delete':  tone(360, 0.09, 'sawtooth', 0.11, 120); noiseBurst(0.09, 500, 0.1); break;
    case 'deny':    tone(150, 0.14, 'square', 0.13, 90); break;
    case 'upgrade': tone(520,0.06,'triangle',0.13,780); setTimeout(()=>tone(780,0.09,'triangle',0.12,1040),55); break;
    case 'undo':    tone(420, 0.05, 'triangle', 0.09, 300); break;
    case 'deliver': tone(880, 0.06, 'sine', 0.1, 1180); break;
    case 'complete':
      [523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,0.2,'triangle',0.16),i*110));
      break;
    case 'alarm':   tone(340,0.18,'sawtooth',0.1,240); break;
  }
}
function updateAmbience(){
  if (!ambGain || !AC) return;
  const act = clamp((S.runCount||0)/16, 0, 1) * (S.running?1:0) * (audioOn?1:0);
  const target = act*0.055;
  ambGain.gain.setTargetAtTime(target, AC.currentTime, 0.4);
  if (ambOsc) ambOsc.frequency.setTargetAtTime(48 + (S.globalSat||1)*14, AC.currentTime, 0.6);
}

function makeIcon(type, px, dir, recipe){
  const c = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  c.width = Math.round(px*dpr); c.height = Math.round(px*dpr);
  c.style.width = px+'px'; c.style.height = px+'px';
  const g = c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const b = B[type], m = Math.max(b.w, b.h);
  const sc = {x:cam.x, y:cam.y, z:cam.z}, sW=VW, sH=VH;
  VW = px; VH = px; cam.z = px/m*0.9; cam.x = b.w/2; cam.y = b.h/2;
  const e = makeEntity(type, 0, 0, dir===undefined?1:dir); S.nextId--;
  if (recipe) e.recipe = recipe;
  if (type==='belt'){ e.shape=0; e.items=[{t:'ironOre', p:0.32},{t:'ironOre', p:0.72}]; }
  if (type==='storage') e.store = {ironPlate:180, copperWire:120};
  if (type==='generator'){ e.fuel = 4; e.load = 300; }
  if (type==='miner'){ e.oreType='ironOre'; e.actPct=60; e.progress=.4; }
  if (isMachine(type)){ e.crafting = true; e.progress = 0.45; e.actPct=80; }
  if (type==='inserter'){ e.held='ironIngot'; e.swing=0.45; }
  try { drawStructure(g, e, 1.2); if (type==='belt'){ for (const it of e.items){ const P=beltPoint(e,it.p); drawItem(g, it.t, w2sx(P.x), w2sy(P.y), cam.z*0.46);} } } catch(err){}
  cam.x=sc.x; cam.y=sc.y; cam.z=sc.z; VW=sW; VH=sH;
  return c;
}

/* =========================================================================
   SPARKLINES
   ========================================================================= */
function sparkline(canvas, series, opts){
  opts = opts||{};
  const dpr = Math.min(window.devicePixelRatio||1,2);
  const w = canvas.clientWidth||220, h = canvas.clientHeight||34;
  if (canvas.width !== Math.round(w*dpr)){ canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
  const g = canvas.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);
  g.fillStyle = '#080d12'; g.fillRect(0,0,w,h);
  let max = opts.max || 0;
  for (const s of series) max = Math.max(max, ringMax(s.r));
  if (opts.smooth) max *= 0.75;
  if (max <= 0) max = 1;
  // grid
  g.strokeStyle='rgba(90,120,150,.14)'; g.lineWidth=1; g.beginPath();
  for (let i=1;i<3;i++){ const y=Math.round(h*i/3)+.5; g.moveTo(0,y); g.lineTo(w,y); }
  g.stroke();
  const sm = opts.smooth|0;
  const val = (r,i) => {
    if (!sm) return ringAt(r,i);
    let a=0,n=0; for (let k=Math.max(0,i-sm); k<=Math.min(r.n-1,i+sm); k++){ a+=ringAt(r,k); n++; }
    return n? a/n : 0;
  };
  for (const s of series){
    const r = s.r; if (!r.n) continue;
    const path = () => { g.beginPath();
      for (let i=0;i<r.n;i++){ const x=(i/(HIST_LEN-1))*w, y=h-(val(r,i)/max)*(h-3)-1.5; i?g.lineTo(x,y):g.moveTo(x,y); } };
    if (s.fill){
      path();
      const lx = ((r.n-1)/(HIST_LEN-1))*w;
      g.lineTo(lx, h); g.lineTo(0, h); g.closePath();
      g.fillStyle = s.fill; g.fill();
    }
    path();
    g.strokeStyle = s.color; g.lineWidth = 1.4; g.stroke();
  }
  g.fillStyle = '#61758a'; g.font = '9px monospace'; g.textAlign='right';
  g.fillText((opts.unit? max.toFixed(max<10?1:0)+opts.unit : max.toFixed(max<10?1:0)), w-3, 10);
  g.textAlign='left'; g.fillText('60s', 3, h-3);
}

  if (e.type==='belt'||e.type==='splitter'||e.type==='merger') return {label:'Throughput /s', value:e.rate||0, unit:'/s'};
  if (e.type==='storage') return {label:'Stored items', value:bufCount(e.store)};
  if (e.type==='generator') return {label:'Output kW', value:e.load||0, unit:'kW'};
  if (e.type==='hub') return {label:'Delivered /s', value:S.deliverRate||0, unit:'/s'};
  if (e.type==='pole') return {label:'Network satisfaction %', value:(e.net>=0 && S.nets[e.net] ? S.nets[e.net].sat*100 : 0), unit:'%', max:100};
  return {label:'', value:0};
}

  // recipe / config

      '<div class="btnRow" style="margin:5px 0"><button class="tbtn'+(e.tier>=3?'':' pri')+'" id="bUp"'+(e.tier>=3?' disabled':'')+'>'+

    if (e.type!=='belt' && e.type!=='storage' && e.type!=='splitter' && e.type!=='merger'){

    }
    h += '</div>';
  }
  h += '<div class="card"><h4>Live state <span id="selMetricLbl" style="color:var(--acc)"></span></h4>'+
       '<div id="selRows"></div><canvas class="spark" id="selSpark"></canvas></div>';
  p.innerHTML = h;
  $('selIco').appendChild(makeIcon(e.type, 46, e.dir, e.recipe));
  $('bRotL').onclick = ()=>{ modifyEnt(e,{dir:(e.dir+3)&3},'rotate'); sel=S.ents.get(e.id)||null; sfx('click'); renderInspect(); };
  $('bRotR').onclick = ()=>{ modifyEnt(e,{dir:(e.dir+1)&3},'rotate'); sel=S.ents.get(e.id)||null; sfx('click'); renderInspect(); };
  $('bDel').onclick = ()=>{ quickDelete(e.x,e.y); selectEnt(null); };
  $('bCopyOne').onclick = ()=>{ curType=e.type; curDir=e.dir; if (e.recipe) lastRecipe[e.type]=e.recipe; setTool('build', e.type); status('Copied settings from #'+e.id); };
  const up = $('bUp'); if (up) up.onclick = ()=>{ doUpgrade(e.x,e.y); sel=S.ents.get(e.id)||null; renderInspect(); };
  const sr = $('selRecipe'); if (sr) sr.onchange = ()=>{ lastRecipe[e.type]=sr.value; modifyEnt(e,{recipe:sr.value},'set recipe'); sel=S.ents.get(e.id)||null; sfx('click'); renderInspect(); };
  const sm = $('selModule'); if (sm) sm.onchange = ()=>{ modifyEnt(e,{module:sm.value},'set module'); sel=S.ents.get(e.id)||null; sfx('upgrade'); renderInspect(); };
  const sf = $('selFilter'); if (sf) sf.onchange = ()=>{ modifyEnt(e,{filter:sf.value||null},'set filter'); sel=S.ents.get(e.id)||null; renderInspect(); };
  if (!e.histRing) e.histRing = ring();
  updateLiveInspect();
}
function updateLiveInspect(){
  if (activeTab!=='inspect') return;
  const sum = $('sumRows');
  if (sum){
    const mach = S.list.machines.length + S.list.miners.length;
    sum.innerHTML =
      '<div class="row"><span class="l">Structures</span><span class="v">'+S.ents.size+'</span></div>'+
      '<div class="row"><span class="l">Belts</span><span class="v">'+S.list.belts.length+'</span></div>'+
      '<div class="row"><span class="l">Machines</span><span class="v">'+mach+'</span></div>'+
      '<div class="row"><span class="l">Power nets</span><span class="v">'+S.nets.length+'</span></div>'+
      '<div class="row"><span class="l">Supply / demand</span><span class="v powc">'+fmtPow(S.totalSupply||0)+' / '+fmtPow(S.totalDemand||0)+'</span></div>'+
      '<div class="row"><span class="l">Items in transit</span><span class="v">'+fmtInt(S.itemCount)+'</span></div>'+
      '<div class="row"><span class="l">Credits left</span><span class="v accc">'+(S.costMode==='free'?'∞':fmtInt(budgetLeft()))+'</span></div>';
  }
  const bn = $('bnList');
  if (bn){
    bn.innerHTML = S.bottlenecks.length ? S.bottlenecks.map(b=>
      '<div class="statLine"><span class="swatch" style="background:'+(STAT_COL[b.reason]||'#888')+'"></span>'+
      '<span class="nm">'+b.label+'</span><span class="n">'+(b.n||'')+'</span></div>').join('')
      : '<div class="help">No stalls detected — everything is flowing.</div>';
  }
  const rows = $('selRows');
  if (rows && sel && S.ents.has(sel.id)){
    const e = sel, out = [];
    const m = entMetric(e);
    $('selMetricLbl').textContent = m.label ? '· '+m.label : '';
    if (e.actPct!==undefined) out.push(['Utilisation', Math.round(e.actPct)+'%']);
    if (e.rate!==undefined && (e.items||e.slots||e.type==='inserter')) out.push(['Throughput', fmt(e.rate||0,2)+' /s']);
    if (e.items) out.push(['On belt', e.items.length+' / '+S.itemDensity]);
    if (e.slots) out.push(['Slots used', e.slots.filter(Boolean).length+' / 3']);
    if (e.oreType) out.push(['Deposit', itemName(e.oreType)+' · '+Math.round(e.rich*100)+'%']);
    { const lp = linkProblem(e); if (lp) out.push(['<span style="color:#ff4d6d">Connection</span>', '<span style="color:#ff4d6d">'+lp+'</span>']); }
    if (e.crafting!==undefined) out.push(['Progress', Math.round((e.progress||0)*100)+'%']);
    if (e.in && bufCount(e.in)) out.push(['Input buffer', Object.entries(e.in).map(([k,v])=>itemName(k)+'×'+v).join(', ')]);
    if (e.out && bufCount(e.out)) out.push(['Output buffer', Object.entries(e.out).map(([k,v])=>itemName(k)+'×'+v).join(', ')]);
    if (e.store) out.push(['Stored', bufCount(e.store)+' / '+e.cap]);
    if (e.store && bufCount(e.store)) out.push(['Contents', Object.entries(e.store).map(([k,v])=>itemName(k)+'×'+v).join(', ')]);
    if (e.fuel!==undefined){ out.push(['Fuel', e.fuel+' / '+e.fuelMax]); out.push(['Output', fmtPow(e.load||0)+' of '+fmtPow(genMax(e))]); }
    if (e.held) out.push(['Holding', itemName(e.held)]);
    if (consumesPower(e.type)) out.push(['Power draw', fmtPow(e.demand||0)]);
    if (e.net!==undefined) out.push(['Power net', e.net<0 ? 'NOT CONNECTED' : ('#'+e.net+' · '+Math.round(S.nets[e.net].sat*100)+'% sat')]);
    if (e.type==='pole' && e.net>=0){
      const n = S.nets[e.net];
      out.push(['Poles in net', n.poles.length]);
      out.push(['Generators', n.gens.length + '  (' + n.gens.filter(g=>g.fuel>0).length + ' fuelled)']);
      out.push(['Consumers', n.loads.length]);
      out.push(['Supply', fmtPow(n.supply)]);
      out.push(['Demand', fmtPow(n.demand)]);
      out.push(['Headroom', fmtPow(n.supply - n.demand)]);
      out.push(['Satisfaction', Math.round(n.sat*100)+'%']);
      const worst = n.loads.filter(l=>l.status && l.status!=='ok').slice(0,3).map(l=>B[l.type].name);
      if (worst.length) out.push(['Stalled on net', worst.join(', ')]);
    } else if (e.type==='pole') out.push(['Wire reach', POLE_REACH+' tiles · supplies '+(POLE_AREA*2+1)+'×'+(POLE_AREA*2+1)]);
    if (e.made) out.push(['Cycles made', fmtInt(e.made)]);
    if (e.type==='hub'){
      out.push(['Contract progress', S.contract ? fmtInt(S.delivered)+' / '+S.contract.qty+' '+itemName(S.contract.item) : fmtInt(S.delivered)+' (sandbox)']);
      const rec = Object.entries(e.received||{});
      out.push(['Received', rec.length ? rec.map(([k,v])=>itemName(k)+' ×'+fmtInt(v)).join(', ') : 'nothing yet']);
    }
    rows.innerHTML = out.map(([a,b])=>'<div class="row"><span class="l">'+a+'</span><span class="v">'+b+'</span></div>').join('');
    const sp = $('selSpark');
    if (sp && e.histRing) sparkline(sp, [{r:e.histRing, color:'#56d3f0', fill:'rgba(86,211,240,.14)'}], {unit:m.unit||'', max:m.max||0, smooth:2});
  }
}

function updateLiveStats(){
  if (activeTab!=='stats') return;
  const pw = $('spPow'); if (!pw) return;
  sparkline(pw, [{r:S.demandHist, color:'#ff9e6b', fill:'rgba(255,158,107,.12)'},
                 {r:S.powerHist, color:'#ffd75e', fill:'rgba(255,215,94,.14)'}], {unit:'kW'});
  $('powRows').innerHTML =
    '<div class="row"><span class="l">Supply</span><span class="v powc">'+fmtPow(S.totalSupply||0)+'</span></div>'+
    '<div class="row"><span class="l">Demand</span><span class="v">'+fmtPow(S.totalDemand||0)+'</span></div>'+
    '<div class="row"><span class="l">Satisfaction</span><span class="v '+((S.globalSat||1)>=0.99?'good':'badc')+'">'+Math.round((S.globalSat||1)*100)+'%</span></div>'+

      ' <span style="color:'+(n.sat>=0.99?'#5fd68a':'#ff6b6b')+'">'+Math.round(n.sat*100)+'%</span></span></div>').join('');
  sparkline($('spDel'), [{r:S.deliveredHist, color:'#7fd4ff', fill:'rgba(127,212,255,.16)'}], {unit:'/s', smooth:3});
  const c = S.contract;
  $('delRows').innerHTML =
    '<div class="row"><span class="l">Delivered</span><span class="v acc2c">'+fmtInt(S.delivered)+(c?' / '+c.qty:'')+'</span></div>'+
    '<div class="row"><span class="l">Rate</span><span class="v">'+fmt(S.deliverRate||0,2)+' /s  ('+fmt((S.deliverRate||0)*60,1)+'/min)</span></div>'+
    '<div class="row"><span class="l">Elapsed</span><span class="v">'+fmtTime(S.contractTime)+'</span></div>'+
    (c && S.deliverRate>0.0001 && S.delivered<c.qty ? '<div class="row"><span class="l">ETA</span><span class="v">'+fmtTime((c.qty-S.delivered)/S.deliverRate)+'</span></div>' : '');

  const rows = [];
  for (const k of ITEM_KEYS){
    const pr = S.prodRate[k]||0, cr = S.consRate[k]||0, tp = S.prod[k]||0;
    if (!tp && !cr && !pr) continue;
    rows.push('<div class="statLine" data-item="'+k+'" style="cursor:pointer'+(k===statItem?';background:#1b2836':'')+'">'+
      '<span class="swatch" style="background:'+ITEMS[k].c+'"></span><span class="nm">'+ITEMS[k].name+'</span>'+
      '<span class="n" style="color:#5fd68a">'+fmt(pr,1)+'</span><span class="n" style="color:#ff9e6b">'+fmt(cr,1)+'</span>'+
      '<span class="n" style="color:var(--txt3);min-width:42px;text-align:right">'+fmtInt(tp)+'</span></div>');
  }
  $('itemList').innerHTML = rows.length ? rows.join('') : '<div class="help">Nothing produced yet.</div>';
  for (const n of document.querySelectorAll('#itemList .statLine')) n.onclick = ()=>{ statItem = n.dataset.item; updateLiveStats(); };
  $('itemTitle').textContent = itemName(statItem);
  const hh = S.hist[statItem];
  if (hh) sparkline($('spItem'), [{r:hh.p, color:'#5fd68a', fill:'rgba(95,214,138,.14)'},{r:hh.c, color:'#ff9e6b'}], {unit:'/s', smooth:3});

  const byType = {};
  for (const e of [...S.list.machines, ...S.list.miners, ...S.list.inserters]){
    const g = byType[e.type] || (byType[e.type] = {n:0, u:0, stall:0});

  }
  const ul = Object.entries(byType).map(([t,g])=>{
    const avg = g.u/g.n;

      '<span class="nm">'+B[t].name+' ×'+g.n+'</span><span class="n">'+Math.round(avg)+'%</span>'+
      (g.stall?'<span class="n warnc">'+g.stall+' stalled</span>':'')+'</div>'+
      '<div class="bar"><i style="width:'+avg.toFixed(0)+'%;background:'+(avg>70?'#5fd68a':avg>30?'#ffcc55':'#ff6b6b')+'"></i></div></div>';

  let full=0, empty=0, thr=0;

    '<div class="row"><span class="l">Empty</span><span class="v">'+empty+'</span></div>'+
    '<div class="row"><span class="l">Avg load</span><span class="v">'+Math.round((S.beltLoad||0)*100)+'%</span></div>'+
    '<div class="row"><span class="l">Total throughput</span><span class="v acc2c">'+fmt(thr,1)+' items/s</span></div>'+

  let stTot=0, stCap=0; const stMix={};

  let bufTot=0;
  for (const e of [...S.list.machines, ...S.list.miners]){ bufTot += bufCount(e.in||{}) + bufCount(e.out||{}); }
  const fuelTot = S.list.gens.reduce((a,g)=>a+g.fuel,0), fuelCap = S.list.gens.reduce((a,g)=>a+g.fuelMax,0);
  const mix = Object.entries(stMix).sort((a,b)=>b[1]-a[1]).slice(0,6);
  $('storeRows').innerHTML =
    '<div class="row"><span class="l">Storage yards</span><span class="v">'+S.list.storages.length+'</span></div>'+
    '<div class="row"><span class="l">Stored items</span><span class="v acc2c">'+fmtInt(stTot)+' / '+fmtInt(stCap)+'</span></div>'+
    '<div class="bar" style="margin:3px 0 6px"><i style="width:'+(stCap?Math.round(stTot/stCap*100):0)+'%"></i></div>'+
    (mix.length ? mix.map(([k,v])=>'<div class="statLine"><span class="swatch" style="background:'+ITEMS[k].c+'"></span>'+
      '<span class="nm">'+itemName(k)+'</span><span class="n">'+fmtInt(v)+'</span></div>').join('')

function exportState(){
  return {
    v:1, app:'fluxworks', seed:S.seed, W:S.W, H:S.H, mode:S.mode,
    beltSpeed:S.beltSpeed, machineSpeed:S.machineSpeed, itemDensity:S.itemDensity,

    credits:S.credits, spent:S.spent, speed:S.speed, running:S.running,
    contract:S.contract? S.contract.id : null, delivered:S.delivered, contractTime:S.contractTime,
    simTime:S.simTime, tick:S.tick, prod:S.prod, cons:S.cons,
    cam:{x:+cam.x.toFixed(2), y:+cam.y.toFixed(2), z:+cam.z.toFixed(2)},
    ore: encodeOre(),
    ents: [...S.ents.values()].map(serializeEnt)
  };
}
function encodeOre(){
  // run-length: [type, amount, count]
  const out = []; let i=0;
  while (i < S.ore.length){
    const t = S.ore[i], a = Math.round(S.oreAmt[i]); let j=i+1;
    while (j<S.ore.length && S.ore[j]===t && Math.round(S.oreAmt[j])===a) j++;
    out.push(t, a, j-i); i=j;
  }
  return out;
}
function decodeOre(arr, n){
  S.ore = new Uint8Array(n); S.oreAmt = new Float32Array(n);
  let i=0, k=0;
  while (k+2 < arr.length+1 && i<n){
    const t=arr[k]|0, a=+arr[k+1]||0, c=arr[k+2]|0; k+=3;
    for (let q=0;q<c && i<n;q++,i++){ S.ore[i]=t; S.oreAmt[i]=a; }
  }
  S.oreMax = 0; for (let q=0;q<n;q++) if (S.oreAmt[q]>S.oreMax) S.oreMax = S.oreAmt[q];
}
function importJSON(raw){
  let o;
  try { o = JSON.parse(raw); } catch(e){ toast('Import failed: not valid JSON','err'); sfx('deny'); return false; }
  if (!o || typeof o !== 'object' || o.app !== 'fluxworks'){ toast('Import failed: not a Fluxworks save','err'); sfx('deny'); return false; }
  try {
    const W = clamp(o.W|0 || 70, 10, 400), H = clamp(o.H|0 || 52, 10, 400);
    S.W=W; S.H=H; S.seed = o.seed>>>0;
    S.cells = new Int32Array(W*H); S.ents.clear(); S.nextId = 1;
    if (Array.isArray(o.ore) && o.ore.length) decodeOre(o.ore, W*H);
    else { S.ore = new Uint8Array(W*H); S.oreAmt = new Float32Array(W*H); S.oreMax=1; }
    S.mode = (o.mode==='sandbox') ? 'sandbox' : 'campaign';
    S.beltSpeed = clamp(+o.beltSpeed||1.9, 0.2, 12); S.machineSpeed = clamp(+o.machineSpeed||1, 0.1, 8);
    S.itemDensity = clamp(o.itemDensity|0 || 4, 1, 12); S.powerDiff = clamp(+o.powerDiff||1, 0.1, 6);
    S.costMode = ['free','normal','strict'].includes(o.costMode) ? o.costMode : 'normal';
    S.depositMode = o.depositMode==='infinite' ? 'infinite' : 'finite';
    S.credits = Math.max(0, o.credits|0 || 1200); S.spent = Math.max(0, o.spent|0);
    resetStats();
    if (o.prod && typeof o.prod==='object') for (const k in o.prod) if (ITEMS[k]) S.prod[k]=Math.max(0,o.prod[k]|0);
    if (o.cons && typeof o.cons==='object') for (const k in o.cons) if (ITEMS[k]) S.cons[k]=Math.max(0,o.cons[k]|0);
    S.simTime = Math.max(0,+o.simTime||0); S.tick = Math.max(0,o.tick|0);
    S.contract = CONTRACTS.find(c=>c.id===o.contract) || null;
    S.delivered = Math.max(0, o.delivered|0); S.contractTime = Math.max(0,+o.contractTime||0);
    S.contractDone = false;
    let placed = 0, skipped = 0;
    const list = Array.isArray(o.ents) ? o.ents : [];
    for (const raw2 of list){
      if (!raw2 || !isType(raw2.type)) { skipped++; continue; }
      const x = raw2.x|0, y = raw2.y|0, dir = (raw2.dir|0)&3;
      if (!areaFree(raw2.type, x, y, dir)){ skipped++; continue; }
      const e = deserializeEnt({...raw2, x, y, dir});
      insertEnt(e); placed++;
    }
    S.undo.length=0; S.redo.length=0;
    rebuildLists(); rebuildNets();
    if (o.cam){ cam.x = +o.cam.x||S.W/2; cam.y = +o.cam.y||S.H/2; cam.z = clamp(+o.cam.z||24, 5, 70); }
    else fitWorld();
    setSpeed(+o.speed||1); S.running = o.running !== false;
    selectEnt(null); areaSel=null;
    updateModeUI(); renderSide(); refreshPalette(); updateHints();
    toast('Loaded '+placed+' structures'+(skipped?' ('+skipped+' skipped)':''),'ok'); sfx('upgrade');
    return true;
  } catch(err){
    toast('Import failed: '+err.message,'err'); sfx('deny');
    try { generateWorld(1337, 70, 52); fitWorld(); } catch(e2){}
    return false;
  }
}
function downloadSave(){
  const blob = new Blob([JSON.stringify(exportState(), null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);

}

/* --------------------------- compact share code -------------------------- */
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
function encodeShare(){
  const parts = [...S.ents.values()].map(e=>[
    BKEYS.indexOf(e.type), e.x, e.y, e.dir, e.tier,
    Object.keys(MODULES).indexOf(e.module),
    e.recipe ? Object.keys(RECIPES).indexOf(e.recipe) : 0
  ].join('.')).join(',');
  const stamps = (S.oreStamps||[]).map(a=>a.join('.')).join(',');
  const head = ['FLX1', S.W, S.H, S.seed, S.mode==='sandbox'?1:0, S.contract?S.contract.id:'', stamps].join(';');
  const body = head + ';' + parts;
  try { return 'FLX1:' + btoa(unescape(encodeURIComponent(body))).replace(/=+$/,''); }
  catch(e){ return 'FLX1:' + body; }
}
function decodeShare(code){
  if (!code){ toast('Paste a share code first','err'); return false; }
  try {
    let body = code.startsWith('FLX1:') ? code.slice(5) : code;
    if (!body.startsWith('FLX1;')){
      body = decodeURIComponent(escape(atob(body.replace(/\s+/g,''))));
    }
    const semi = body.split(';');
    if (semi[0] !== 'FLX1') throw new Error('bad header');
    const W = clamp(parseInt(semi[1])||70, 10, 400), H = clamp(parseInt(semi[2])||52, 10, 400);
    const seed = (parseInt(semi[3])||1337)>>>0;
    const sandbox = semi[4]==='1', cid = semi[5]||'';
    generateWorld(seed, W, H);
    S.mode = sandbox ? 'sandbox' : 'campaign';
    S.contract = CONTRACTS.find(c=>c.id===cid) || (sandbox?null:CONTRACTS[0]);
    for (const tok of (semi[6]||'').split(',')){
      if (!tok) continue;
      const f = tok.split('.').map(Number);
      const ot = ORE_TYPES[(f[4]|0)-1];
      if (!ot || !isFinite(f[0]) || !isFinite(f[1])) continue;
      stampOre(clamp(f[0]|0,0,S.W-1), clamp(f[1]|0,0,S.H-1),
               clamp((+f[2]||10)/10,0.5,40), clamp((+f[3]||10)/10,0.5,40), ot, clamp(+f[5]||1000,1,1e6));
    }
    const rest = semi.slice(7).join(';');
    let n=0;
    for (const tok of rest.split(',')){
      if (!tok) continue;
      const f = tok.split('.').map(Number);
      const type = BKEYS[f[0]]; if (!isType(type)) continue;
      const x=f[1]|0, y=f[2]|0, dir=(f[3]|0)&3;
      if (!areaFree(type, x, y, dir)) continue;
      const e = makeEntity(type, x, y, dir);
      e.tier = clamp(f[4]|0||1,1,3);
      const mk = Object.keys(MODULES)[f[5]|0]; e.module = own(MODULES, mk) ? mk : 'none';
      const rk = Object.keys(RECIPES)[f[6]|0];
      if (own(RECIPES, rk) && RECIPES[rk].m===type) e.recipe = rk;
      insertEnt(e); n++;
    }
    S.spent = [...S.ents.values()].reduce((a,e)=>a+costOf(e.type,e.tier,e.module),0);
    S.credits = Math.max(S.credits, S.spent+400);
    rebuildLists(); rebuildNets(); resetStats(); S.delivered=0; fitWorld();
    updateModeUI(); renderSide(); updateHints();
    toast('Loaded share code — '+n+' structures','ok'); sfx('upgrade');
    return true;
  } catch(err){ toast('Bad share code','err'); sfx('deny'); return false; }
}

/* ------------------------------- PNG export ------------------------------ */
function exportPNG(){
  const scale = clamp(Math.floor(3000/Math.max(S.W,S.H)), 6, 34);
  const c = document.createElement('canvas');
  c.width = S.W*scale; c.height = S.H*scale;
  const g = c.getContext('2d');
  const sc = {x:cam.x, y:cam.y, z:cam.z}, sVW=VW, sVH=VH, sctx = window.__ctx;
  VW = c.width; VH = c.height; cam.z = scale; cam.x = S.W/2; cam.y = S.H/2;
  g.fillStyle='#0a0e13'; g.fillRect(0,0,c.width,c.height);
  g.fillStyle='#101821'; g.fillRect(0,0,c.width,c.height);
  for (let y=0;y<S.H;y++) for (let x=0;x<S.W;x++){
    const ii=idx(x,y), o=S.ore[ii]; if (!o) continue;
    if (S.depositMode!=='infinite' && S.oreAmt[ii]<=0) continue;
    g.globalAlpha = 0.18 + clamp(S.oreAmt[ii]/(S.oreMax||1),0.1,1)*0.4;
    g.fillStyle = ORE_COL[o-1]; g.fillRect(x*scale, y*scale, scale, scale);
  }
  g.globalAlpha=1;
  g.strokeStyle='rgba(90,120,150,.08)'; g.lineWidth=1; g.beginPath();
  for (let x=0;x<=S.W;x++){ g.moveTo(x*scale,0); g.lineTo(x*scale,c.height); }
  for (let y=0;y<=S.H;y++){ g.moveTo(0,y*scale); g.lineTo(c.width,y*scale); }
  g.stroke();
  const t = performance.now()/1000;
  for (const e of S.list.all) drawStructure(g, e, t);
  for (const e of S.list.belts) for (const it of e.items){
    const P = beltPoint(e, it.p); drawItem(g, it.t, e.x*scale+P.x*scale, e.y*scale+P.y*scale, scale*0.46);
  }
  g.fillStyle='rgba(10,15,21,.82)'; g.fillRect(0, c.height-scale*2.2, c.width, scale*2.2);
  g.fillStyle='#ffb347'; g.font='bold '+Math.round(scale*0.95)+'px monospace'; g.textAlign='left';
  g.fillText('FLUXWORKS  ·  '+(S.contract?S.contract.name:'Sandbox')+'  ·  '+S.ents.size+' structures  ·  '+
             fmtInt(S.delivered)+' delivered  ·  seed '+S.seed, scale*0.6, c.height-scale*0.75);
  cam.x=sc.x; cam.y=sc.y; cam.z=sc.z; VW=sVW; VH=sVH;
  c.toBlob(bl => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(bl); a.download = 'fluxworks-factory.png'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast('PNG exported ('+c.width+'×'+c.height+')','ok');
  });
}

  {id:'circuits', name:'Contract II — Control Circuits', item:'circuit', qty:90, credits:2600,

function setContract(c, keepFactory){

function computeScore(){
  const c = S.contract; if (!c) return null;
  let tiles = 0; for (const e of S.list.all){ const s=footprint(e); tiles += s.w*s.h; }
  const avgSat = ringAvg(S.satHist, 60)/100 || 1;
  const thr = ringAvg(S.deliveredHist, 30);
  const parts = {
    throughput: Math.round(thr*600),
    time: Math.round(Math.max(0, 1200 - S.contractTime*1.4)),
    efficiency: Math.round(c.qty / Math.max(1, S.spent/100) * 55),
    power: Math.round(avgSat*320),
    footprint: -Math.round(tiles*0.55),
  };
  parts.total = Math.max(0, parts.throughput+parts.time+parts.efficiency+parts.power+parts.footprint);
  parts.tiles = tiles; parts.avgSat = avgSat; parts.thr = thr;
  return parts;

function stampOre(cx, cy, rx, ry, type, amt){
  const t = ORE_TYPES.indexOf(type)+1;
  if (t > 0) (S.oreStamps = S.oreStamps || []).push([Math.round(cx), Math.round(cy), Math.round(rx*10), Math.round(ry*10), t, Math.round(amt)]);
  const R = Math.ceil(Math.max(rx,ry))+1;
  for (let dy=-R; dy<=R; dy++) for (let dx=-R; dx<=R; dx++){
    const x=cx+dx, y=cy+dy; if (!inBounds(x,y)) continue;
    const d = (dx*dx)/(rx*rx) + (dy*dy)/(ry*ry);
    if (d <= 1){ const ii=idx(x,y); S.ore[ii]=t; S.oreAmt[ii]=Math.max(S.oreAmt[ii], Math.round(amt*(1.15-d*0.5))); }
  }
  S.oreMax = 0; for (let i=0;i<S.ore.length;i++) if (S.oreAmt[i]>S.oreMax) S.oreMax = S.oreAmt[i];
}
function presetPlace(specs){
  const made = [];
  for (const sp of specs){
    if (!sp || !isType(sp.type)) continue;
    if (!areaFree(sp.type, sp.x, sp.y, sp.dir|0)) continue;
    const e = makeEntity(sp.type, sp.x, sp.y, sp.dir|0);
    if (sp.tier) e.tier = clamp(sp.tier,1,3);
    if (own(MODULES, sp.module)) e.module = sp.module;
    if (own(RECIPES, sp.recipe) && RECIPES[sp.recipe].m===sp.type) e.recipe = sp.recipe;
    if (sp.filter) e.filter = sp.filter;
    if (sp.fuel !== undefined && 'fuel' in e) e.fuel = clamp(sp.fuel,0,e.fuelMax);
    if (sp.in && e.in) e.in = {...sp.in};
    if (sp.store && e.store) e.store = {...sp.store};
    insertEnt(e); made.push(e);
  }
  return made;
}
/** belt run helper: L-shaped path with optional forced final direction */
function bl(x0,y0,x1,y1,axis,endDir,tier){
  const pts = routeL(x0,y0,x1,y1, axis||'h');
  const sp = pathSpecs(pts, 'belt', 1);
  if (endDir !== undefined && endDir !== null) sp[sp.length-1].dir = endDir;
  if (tier) for (const s of sp) s.tier = tier;
  return sp;
}
/** serial machine chain along row y, each machine's output row lands on y */
function chainSpecs(x, y, stages){
  const out = []; let prevOutX = null, cx = x;
  for (const st of stages){
    const b = B[st.type];
    const my = y - ((b.h-1)>>1);
    if (prevOutX !== null) for (let bx=prevOutX; bx<cx; bx++) out.push({type:'belt', x:bx, y, dir:1, tier:st.beltTier});
    out.push({type:st.type, x:cx, y:my, dir:1, recipe:st.recipe, tier:st.tier, module:st.module});
    prevOutX = cx + b.w;
    cx = prevOutX + (st.gap===undefined?6:st.gap);
  }
  return {specs:out, endX:prevOutX, endY:y};
}
/** coal miner + distribution belt + n generators + local poles */
function powerBlock(bx, by, n, gTier, mTier){
  const cx = bx + 10, specs = [], poles = [];
  stampOre(bx+1, by+1, 4.2, 3.2, 'coal', 24000);
  specs.push({type:'miner', x:bx, y:by, dir:1, tier:mTier||2});
  specs.push(...bl(bx+2, by, cx, by, 'h', 2));
  for (let i=0;i<n;i++){
    const row = by + 1 + i*5;
    specs.push({type:'splitter', x:cx, y:row, dir:2});
    specs.push({type:'belt', x:cx+1, y:row, dir:1});
    specs.push({type:'generator', x:cx+2, y:row-1, dir:1, tier:gTier||1, fuel:4});
    if (i < n-1) for (let r=row+1; r<row+5; r++) specs.push({type:'belt', x:cx, y:r, dir:2});
    poles.push({x:cx-1, y:row+1});
  }
  poles.push({x:bx+1, y:by+2});
  for (const p of poles) specs.push({type:'pole', x:p.x, y:p.y, dir:0});
  return {specs, poles, cx};
}
function polesAt(list){ return list.map(p=>({type:'pole', x:p[0], y:p[1], dir:0})); }

}

function showPresets(){
  let h = '<button class="close" onclick="closeModal()">×</button><h2>Presets &amp; contracts</h2>'+
    '<p>Presets rebuild the world from the current seed (<b>'+S.seed+'</b>) and lay down a working factory.</p>';

      '<button class="tbtn pri" onclick="loadPreset(\''+k+'\'); closeModal()">Load</button></div></div>';

  h += '<h2 style="margin-top:14px;font-size:14px">Campaign contracts</h2>';

      '<div><b style="color:var(--acc2)">'+c.name+'</b><div class="help">'+c.brief+' · budget '+c.credits+'¢</div></div>'+
