window.showPresets = showPresets; window.loadPreset = loadPreset; window.startContract = startContract;
window.closeModal = closeModal; window.softReset = softReset; window.clearFactory = clearFactory;

/* =========================================================================
   MODE + LAYOUT WIRING
   ========================================================================= */
function updateModeUI(){
  for (const b of document.querySelectorAll('#modeSwitch button')) b.classList.toggle('on', b.dataset.mode===S.mode);
  $('objBox').style.opacity = S.mode==='campaign' ? '1' : '.55';
  updateHUD();
}
function setMode(m){
  if (m === S.mode) return;
  S.mode = m;
  if (m === 'sandbox'){ S.costMode='free'; S.depositMode='infinite'; S.contract=null; }
  else { S.costMode='normal'; S.depositMode='finite'; if (!S.contract) S.contract = CONTRACTS[0]; }
  for (const mm of S.list.miners) recalcMinerRichness(mm);
  updateModeUI(); refreshPalette(); updateHints(); renderSide();
  toast(m==='sandbox' ? 'Sandbox — unlimited construction' : 'Campaign — budget and contract active','ok');
}
for (const b of document.querySelectorAll('#modeSwitch button')) b.onclick = ()=>{ setMode(b.dataset.mode); sfx('click'); };
for (const b of document.querySelectorAll('#sideTabs button')) b.onclick = ()=>{
  activeTab = b.dataset.tab;
  for (const o of document.querySelectorAll('#sideTabs button')) o.classList.toggle('on', o===b);
  for (const t of ['inspect','stats','sim','data']) $('tab-'+t).hidden = (t!==activeTab);
  renderSide(); sfx('click');
};
$('btnUndo').onclick = doUndo; $('btnRedo').onclick = doRedo;
$('btnHelp').onclick = showHelp; $('btnPresets').onclick = showPresets;
$('spPause').onclick = togglePause; $('spStep').onclick = stepOnce;
$('spUp').onclick = ()=>changeSpeed(1); $('spDown').onclick = ()=>changeSpeed(-1);

/* mobile bar */
function buildMobBar(){
  const m = $('mobBar'); m.innerHTML = '';
  const mk = (label, fn, id) => { const b = el('button','tbtn',label); b.onclick=fn; if(id) b.id=id; m.appendChild(b); return b; };
  mk('☰ Build', ()=>{ $('palette').classList.toggle('open'); $('side').classList.remove('open'); });
  mk('▤ Panel', ()=>{ $('side').classList.toggle('open'); $('palette').classList.remove('open'); });
  mk('⌖', ()=>{ setTool('select'); });
  mk('▤belt', ()=>{ setBuild('belt'); $('palette').classList.remove('open'); });
  mk('R ↻', ()=>{ curDir=(curDir+1)&3; if (pasteBp) pasteBp=rotateBlueprint(pasteBp); updateHints(); status('Facing '+DIRNAME[curDir]); });
  mk('✕ Del', ()=>{ setTool('delete'); });
  mk('↶', doUndo); mk('↷', doRedo);
  mk('❚❚', ()=>{ togglePause(); });
  mk('⤢ Fit', ()=>fitFactory());
}

/* =========================================================================
   MAIN LOOP — fixed 60 Hz simulation sub-steps, decoupled from the frame rate
   ========================================================================= */
const SIM_DT = 1/60;
let acc = 0, lastT = performance.now(), autoClock = 0;
let uiClock = 0, hudClock = 0;

function frame(now){
  const rawDt = Math.min(0.1, (now - lastT)/1000);
  lastT = now;

  // fixed-step integration; speed multiplies the number of sub-steps
  if (S.running){
    acc += rawDt * S.speed;
    let steps = 0;
    const maxSteps = 240;
    while (acc >= SIM_DT && steps < maxSteps){ simStep(SIM_DT); acc -= SIM_DT; steps++; }
    if (steps >= maxSteps) acc = 0;   // don't spiral
    if (S.contract && !S.contractDone) S.contractTime += rawDt * S.speed;
  } else if (S.stepOnce){
    simStep(SIM_DT); S.stepOnce = false;
    if (S.contract && !S.contractDone) S.contractTime += SIM_DT;
  }

  // per-entity history for the inspector
  if (sel && sel.histRing){
    sel._hclk = (sel._hclk||0) + rawDt;
    if (sel._hclk >= HIST_DT){ sel._hclk = 0; ringPush(sel.histRing, entMetric(sel).value); }
  }

  render(now);

  // fps
  fpsAcc += rawDt; fpsN++;
  if (fpsAcc >= 0.35){ fps = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0; }

  hudClock += rawDt;
  if (hudClock >= 0.12){ hudClock = 0; updateHUD(); updateAmbience(); }
  uiClock += rawDt;
  if (uiClock >= 0.4){
    uiClock = 0;
    if (activeTab==='inspect') updateLiveInspect();
    else if (activeTab==='stats') updateLiveStats();
    const aw = $('autoWhen'); if (aw && lastAutosave) aw.textContent = fmtTime((Date.now()-lastAutosave)/1000)+' ago';
  }
  autoClock += rawDt;
  if (autoClock >= 20){ autoClock = 0; autosave(); }

  requestAnimationFrame(frame);
}

/* =========================================================================
   BOOT
   ========================================================================= */
function markDirty(){ S.netDirty = true; refreshPalette(); updateHints(); }

function boot(){
  // logo
  const lg = $('logo').getContext('2d');
  lg.fillStyle='#ffb347'; lg.fillRect(2,12,4,8); lg.fillRect(8,7,4,13); lg.fillRect(14,3,4,17);
  lg.fillStyle='#56d3f0'; lg.fillRect(2,9,4,2); lg.fillRect(8,4,4,2); lg.fillRect(14,0,4,2);

  resizeCanvas();
  generateWorld(1337, 70, 52);
  S.mode = 'campaign'; S.contract = CONTRACTS[0]; S.credits = CONTRACTS[0].credits;
  loadPreset('starter', true);
  setContract(CONTRACTS[0]);
  S.spent = [...S.ents.values()].reduce((a,e)=>a+costOf(e.type,e.tier,e.module),0);
  S.credits = Math.max(CONTRACTS[0].credits, S.spent + 700);

  buildPalette(); buildOverlayBar(); buildMobBar();
  setBuild('belt'); setTool('build','belt');
  updateModeUI(); updateSpeedUI(); updateHints(); renderSide();
  fitFactory(2);
  status('Starter line running — drag belts to extend it, or press H for help.');
  requestAnimationFrame(frame);
}
window.addEventListener('resize', ()=>{ resizeCanvas(); });
if (window.ResizeObserver) new ResizeObserver(()=>resizeCanvas()).observe($('stage'));
window.addEventListener('beforeunload', ()=>{ try{ autosave(); }catch(e){} });
document.addEventListener('pointerdown', audioUnlock, {once:true});
document.addEventListener('keydown', audioUnlock, {once:true});

boot();
</script>
