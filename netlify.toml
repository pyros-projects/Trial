[build]
  command = "python3 tools/build_site.py"
  publish = "dist/site"

[dev]
  framework = "#static"
  publish = "dist/site"
  port = 8888
  autoLaunch = false

# The exporter writes the allowlisted _headers and _redirects into dist/site.
# Use scripts/deploy-netlify.* to publish dist/artifacts to its separate alias first.
# No functions, plugins, source projects, or evidence are deployed.
